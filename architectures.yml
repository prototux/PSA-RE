# PSA's electrical/electronic architectures (AEE)
# Format: see schemas/dbmuxev.schema.json (definitions/architectures) and dbmuxev/doc/architectures.yml
#
# <ARCH>.<variant> is used everywhere else (buses/<ARCH>.<variant>/, nodes/<ARCH>.<variant>.yml, cars)
# 'ev' means "evolution" (a later revision of the architecture), not electric vehicle.
# A variant with a 'parent' inherits the networks of its parent and only redefines what changed.

# The VAN+CAN architecture, apparently named AEE2001 in diagnostic tools
# (it's older than 2001: the first cars are from the late 90s, eg. the 206)
AEE2001:
  full:
    comment:
      en: 'VAN+CAN: VAN buses for body and comfort, a small CAN bus between the main powertrain nodes'
      fr: 'VAN+CAN : bus VAN pour la carrosserie et le confort, un petit bus CAN entre les principaux calculateurs moteur'
      es: 'VAN+CAN: buses VAN para carrocería y confort, un pequeño bus CAN entre los principales nodos del tren motriz'
      de: 'VAN+CAN: VAN-Busse für Karosserie und Komfort, ein kleiner CAN-Bus zwischen den wichtigsten Antriebssteuergeräten'
      it: 'VAN+CAN: bus VAN per carrozzeria e comfort, un piccolo bus CAN tra i principali nodi del gruppo propulsore'
      pl: 'VAN+CAN: magistrale VAN dla nadwozia i komfortu, mała magistrala CAN między głównymi sterownikami napędu'
      ru: 'VAN+CAN: шины VAN для кузова и комфорта, небольшая шина CAN между основными блоками силового агрегата'
      zh: 'VAN+CAN：车身和舒适系统使用VAN总线，主要动力总成节点之间使用小型CAN总线'
