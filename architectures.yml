      pt: 'VAN+CAN: barramentos VAN para carroçaria e conforto, um pequeno barramento CAN entre as principais centralinas do grupo motopropulsor'
    years: '1998-2008'
    status: 'partial'
    networks:
      HS:
        IS:
          protocol: 'CAN'
          bitrate: 250
          display_name:
            en: 'Inter-systems'
            fr: 'Inter-systèmes'
            es: 'Inter-sistemas'
            de: 'Inter-Systeme'
            it: 'Inter-sistemi'
            pl: 'Międzysystemowa'
            ru: 'Межсистемная'
            zh: '系统间总线'
            hu: 'Rendszerek közötti'
            pt: 'Intersistemas'
          comment:
            en: 'CAN bus between the BSI and the powertrain/chassis nodes (engine, gearbox, ABS/ESP...)'
            fr: 'Bus CAN entre la BSI et les calculateurs moteur/châssis (moteur, boîte, ABS/ESP...)'
            es: 'Bus CAN entre la BSI y los nodos de tren motriz/chasis (motor, caja de cambios, ABS/ESP...)'
            de: 'CAN-Bus zwischen dem BSI und den Antriebs-/Fahrwerkssteuergeräten (Motor, Getriebe, ABS/ESP...)'
            it: 'Bus CAN tra la BSI e i nodi di propulsione/telaio (motore, cambio, ABS/ESP...)'
            pl: 'Magistrala CAN między BSI a sterownikami napędu/podwozia (silnik, skrzynia biegów, ABS/ESP...)'
            ru: 'Шина CAN между BSI и блоками силового агрегата/шасси (двигатель, КПП, ABS/ESP...)'
            zh: 'BSI与动力总成/底盘节点（发动机、变速箱、ABS/ESP……）之间的CAN总线'
            hu: 'CAN busz a BSI és a hajtáslánc/futómű egységek között (motor, váltó, ABS/ESP...)'
            pt: 'Barramento CAN entre a BSI e as centralinas do grupo motopropulsor/chassis (motor, caixa de velocidades, ABS/ESP...)'
      VAN:
        CONF:
          protocol: 'VAN'
          bitrate: 125
          display_name:
            en: 'Comfort'
            fr: 'Confort'
            es: 'Confort'
            de: 'Komfort'
            it: 'Comfort'
            pl: 'Komfort'
            ru: 'Комфорт'
            zh: '舒适'
            hu: 'Komfort'
            pt: 'Conforto'
