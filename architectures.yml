            fr: 'Bus VAN des calculateurs habitacle (afficheur, radio, combiné, clim...). 125k slots/s (~100 kbit/s de données)'
            es: 'Bus VAN para los nodos de infoentretenimiento y confort (pantalla, radio, cuadro, climatización...). 125k intervalos/s (~100 kbit/s de datos)'
            de: 'VAN-Bus für Infotainment- und Komfortsteuergeräte (Display, Radio, Kombiinstrument, Klima...). 125k Zeitschlitze/s (~100 kbit/s Nutzdaten)'
