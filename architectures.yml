  # 2007 evolution of AEE2004 (sometimes called AEE2004-2007 or AEE2007)
  ev:
    parent: 'full'
    comment:
      en: 'Full CAN, 1st generation, 2007 evolution (frames added or changed for cars designed from 2007)'
      fr: 'Tout CAN, 1ère génération, évolution 2007 (trames ajoutées ou modifiées pour les voitures conçues à partir de 2007)'
      es: 'Todo CAN, 1ª generación, evolución 2007 (tramas añadidas o modificadas para coches diseñados desde 2007)'
      de: 'Voll-CAN, 1. Generation, Evolution 2007 (Botschaften, die für ab 2007 entwickelte Fahrzeuge hinzugefügt oder geändert wurden)'
      it: 'Tutto CAN, 1ª generazione, evoluzione 2007 (frame aggiunti o modificati per le auto progettate dal 2007)'
      pl: 'Pełny CAN, 1. generacja, ewolucja 2007 (ramki dodane lub zmienione dla aut projektowanych od 2007)'
      ru: 'Полностью CAN, 1-е поколение, эволюция 2007 (кадры, добавленные или изменённые для автомобилей, разработанных с 2007 года)'
      zh: '全CAN架构，第一代，2007年演进版（为2007年起设计的车型新增或修改的帧）'
      hu: 'Teljes CAN, 1. generáció, 2007-es evolúció (2007-től tervezett autókhoz hozzáadott vagy módosított keretek)'
      pt: 'Totalmente CAN, 1.ª geração, evolução 2007 (tramas adicionadas ou alteradas para os carros concebidos a partir de 2007)'
    years: '2007-2018'
    status: 'partial'

    networks:
      HS:
        LAS:
          protocol: 'CAN'
          bitrate: 500
          display_name:
            en: 'Chassis'
            fr: 'Liaison au sol'
            es: 'Chasis'
            de: 'Fahrwerk'
            it: 'Telaio'
            pl: 'Podwozie'
            ru: 'Шасси'
            zh: '底盘'
            hu: 'Futómű'
            pt: 'Chassis'
          comment:
            en: 'Private high speed bus of the cars with Grip Control (3008 / 5008 1st generation, Partner / Berlingo II), between the ESP, the Grip Control ECU (ASR+) and the chassis sensors (steering angle, yaw rate / acceleration). Cars without Grip Control have no LAS bus, the sensors are then on the CAN IS'
            fr: 'Bus haute vitesse privé des véhicules équipés du Grip Control (3008 / 5008 1ère génération, Partner / Berlingo II), entre l''ESP, le calculateur Grip Control (ASR+) et les capteurs de liaison au sol (angle volant, vitesse de lacet / accélération). Les véhicules sans Grip Control n''ont pas de bus LAS, les capteurs sont alors sur le CAN IS'
            es: 'Bus privado de alta velocidad de los vehículos con Grip Control (3008 / 5008 1ª generación, Partner / Berlingo II), entre el ESP, la unidad Grip Control (ASR+) y los sensores del chasis (ángulo de volante, velocidad de guiñada / aceleración). Los vehículos sin Grip Control no tienen bus LAS, los sensores están entonces en el CAN IS'
            de: 'Privater High-Speed-Bus der Fahrzeuge mit Grip Control (3008 / 5008 1. Generation, Partner / Berlingo II) zwischen ESP, Grip-Control-Steuergerät (ASR+) und Fahrwerkssensoren (Lenkwinkel, Gierrate / Beschleunigung). Fahrzeuge ohne Grip Control haben keinen LAS-Bus, die Sensoren liegen dann am CAN IS'
            it: 'Bus privato ad alta velocità delle vetture con Grip Control (3008 / 5008 1ª generazione, Partner / Berlingo II), tra l''ESP, la centralina Grip Control (ASR+) e i sensori del telaio (angolo volante, velocità di imbardata / accelerazione). Le vetture senza Grip Control non hanno il bus LAS, i sensori sono allora sul CAN IS'
            pl: 'Prywatna szybka magistrala samochodów z Grip Control (3008 / 5008 1. generacji, Partner / Berlingo II) między ESP, sterownikiem Grip Control (ASR+) a czujnikami podwozia (kąt skrętu, prędkość odchylenia / przyspieszenie). Samochody bez Grip Control nie mają magistrali LAS, czujniki są wtedy na CAN IS'
            ru: 'Частная высокоскоростная шина автомобилей с Grip Control (3008 / 5008 1-го поколения, Partner / Berlingo II) между ESP, блоком Grip Control (ASR+) и датчиками шасси (угол поворота руля, скорость рыскания / ускорение). У автомобилей без Grip Control шины LAS нет, датчики тогда подключены к CAN IS'
            zh: '配备 Grip Control 车辆（第一代 3008 / 5008、Partner / Berlingo II）的专用高速总线，连接 ESP、Grip Control 控制单元（ASR+）和底盘传感器（转向角、横摆角速度 / 加速度）。未配备 Grip Control 的车辆没有 LAS 总线，传感器连接在 CAN IS 上'
            hu: 'A Grip Control-lal szerelt autók (1. generációs 3008 / 5008, Partner / Berlingo II) privát nagysebességű busza az ESP, a Grip Control vezérlő (ASR+) és a futómű-érzékelők (kormányszög, perdülési sebesség / gyorsulás) között. A Grip Control nélküli autókon nincs LAS busz, az érzékelők ekkor a CAN IS-en vannak'
            pt: 'Barramento privado de alta velocidade dos veículos com Grip Control (3008 / 5008 1.ª geração, Partner / Berlingo II), entre o ESP, a centralina Grip Control (ASR+) e os sensores do chassis (ângulo do volante, velocidade de guinada / aceleração). Os veículos sem Grip Control não têm barramento LAS, os sensores ficam então no CAN IS'

  # Electric version of the Partner / Berlingo II: the electric drivetrain ECUs replace the engine ECU
  electric:
    parent: 'ev'
    comment:
      en: 'Full CAN, 1st generation, 2007 evolution, electric drivetrain (frames of the power interface unit, charger and electric drive ECUs that replace the engine ECU ones)'
      fr: 'Tout CAN, 1ère génération, évolution 2007, motorisation électrique (trames du boîtier d''interface de puissance, du chargeur et des calculateurs de traction électrique qui remplacent celles du calculateur moteur)'
      es: 'Todo CAN, 1ª generación, evolución 2007, propulsión eléctrica (tramas de la unidad de interfaz de potencia, del cargador y de las centralitas de tracción eléctrica que sustituyen a las de la centralita del motor)'
      de: 'Voll-CAN, 1. Generation, Evolution 2007, Elektroantrieb (Botschaften der Leistungsschnittstelle, des Ladegeräts und der Elektroantriebssteuergeräte, die die des Motorsteuergeräts ersetzen)'
      it: 'Tutto CAN, 1ª generazione, evoluzione 2007, trazione elettrica (frame dell''unità di interfaccia di potenza, del caricatore e delle centraline di trazione elettrica che sostituiscono quelli della centralina motore)'
      pl: 'Pełny CAN, 1. generacja, ewolucja 2007, napęd elektryczny (ramki modułu interfejsu mocy, ładowarki i sterowników napędu elektrycznego, które zastępują ramki sterownika silnika)'
      ru: 'Полностью CAN, 1-е поколение, эволюция 2007, электрическая тяга (кадры блока силового интерфейса, зарядного устройства и блоков электропривода, заменяющие кадры блока управления двигателем)'
      zh: '全CAN架构，第一代，2007年演进版，电动驱动（功率接口单元、充电器和电驱动ECU的帧，取代发动机ECU的帧）'
      hu: 'Teljes CAN, 1. generáció, 2007-es evolúció, elektromos hajtás (a teljesítményinterfész-egység, a töltő és az elektromos hajtás vezérlőinek keretei, amelyek a motorvezérlő kereteit helyettesítik)'
      pt: 'Totalmente CAN, 1.ª geração, evolução 2007, propulsão elétrica (tramas da unidade de interface de potência, do carregador e das centralinas de tração elétrica que substituem as da centralina do motor)'
