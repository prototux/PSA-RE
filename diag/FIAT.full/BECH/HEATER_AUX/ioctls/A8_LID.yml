ioctl: 0xA8
name: 'FILLING_SUPPLY_PIPE'
display_name:
  en: 'Filling of the supply pipe'
  fr: 'Remplissage canalisation d''alimentation'
  es: 'Llenado de la canalización de alimentación'
  de: 'Füllung Versorgungsleitung'
  pl: 'Napełnianie instalacji zasilającej'
  hu: 'Tápellátó csővezeték feltöltése'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants: ['B78_*', 'D2_*', 'G9_*', 'K0_V1', 'T9_*', 'VCAN_*', 'W2_*', 'X6_*', 'X7_*']

params:
  CONTROL_PARAMETER_1:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x20

  CONTROL_PARAMETER_1881:
    bits: '2.7-2.0'
    type: 'enum'

  RESERVED:
    bits: '3.7-3.0'
    unused: true

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'
      0x12:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'

  RESERVED:
    bits: '2.7-2.0'
    unused: true

tests:
  - display_name:
      en: 'Filling of the supply pipe'
      fr: 'Remplissage canalisation d''alimentation'
      es: 'Llenado de la canalización de alimentación'
      de: 'Füllung Versorgungsleitung'
      pl: 'Napełnianie instalacji zasilającej'
      hu: 'Tápellátó csővezeték feltöltése'
    max_duration_ms: 90000
