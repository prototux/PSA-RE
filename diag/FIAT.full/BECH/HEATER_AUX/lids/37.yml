lid: 0x37
name: 'STATUS_ADDITIONAL_HEATING'
display_name:
  en: 'Status of the additional heating'
  fr: 'État du chauffage additionnel'
  es: 'Estado de la calefacción adicional'
  de: 'Zustand der Zusatzheizung'
  pl: 'Stan dodatkowego ogrzewania'
  hu: 'Kiegészítőfűtés állapota'
comment:
  en: 'The status "Switched to safety mode" indicates that the boiler has detected a fault and has locked to prevent any damage. to unlock the heater, clear the faults then start the actuator test "Additional heating control". if the boiler does not come into operation: repair the failure corresponding to the fault returned then clear the faults. only the clearing of all of the faults permits unlocking of the heater.'
  fr: 'L''état "Mise en sécurité" indique que la chaudière a détecté un défaut et s''est verrouillée pour éviter toute dégradation. pour déverrouiller le réchauffeur, effectuer un effacement défaut puis lancer le test actionneur "Commande de chauffage additionnel". si la chaudière ne se met pas en route : réparer la panne correspondant au défaut remonté puis effectuer un effacement des défauts. seul l''effacement de tous les défauts permet de déverrouiller le réchauffeur.'
  es: 'El estado "Puesta en seguridad" indica que la caldera ha detectado un defecto y se ha bloqueado para evitar toda degradación. para desbloquear el calentador, efectuar un borrado defecto y después lanzar el test accionador "Mando de calentamiento adicional". si la caldera no se pone en funcionamiento : reparar la avería correspondiente al defecto remontado y después efectuar un borrado de los defectos. solamente el borrado de todos los defectos permite desbloquear el calentador.'
  de: 'Der Zustand "Sicherheitsschaltung" zeigt an, dass die Zusatzheizung einen Fehler festgestellt hat und sich gesperrt hat, um Beschädigungen zu vermeiden. um den Vorwärmer zu entsperren, eine Fehlerlöschung durchführen, dann den Stellgliedtest "Steuerung Zusatzheizung" starten. wenn die Zusatzheizung nicht einschaltet: den der Fehlermeldung entsprechenden Fehler reparieren, dann eine Löschung der Fehler durchführen. nur die Löschung aller Fehler ermöglicht die Entsperrung der Vorwärmung.'
  pl: 'Stan "Wyłączenie awaryjne" oznacza, że kocioł wykrył błąd i zablokował się, aby uniknąć uszkodzenia. aby odblokować podgrzewacz wykasować błąd, a następnie uruchomić test elementu wykonawczego "Sterowanie dodatkowego ogrzewania". jeżeli kocioł nie daje się uruchomić : naprawić usterkę zgodnie z zasygnalizowanym błędem a następnie wykasować błędy. jedynie wykasowanie wszystkich błędów pozwala odblokować podgrzewacz.'
  hu: 'A " Biztonságba helyezés " jelzi, hogy a melegítő egy hibát észlelt és reteszelődik a teljes meghibásodás elkerülése végett. a fűtés kireteszeléséhez, végezzen el egy hibatörlést, majd indítsa el a " Kiegészítő fűtés vezérlése " beavatkozószerv-tesztet. ha a melegítő nem kapcsolódik be: javítsa ki a kijelzett hibának megfelelő meghibásodást, majd végezzen el egy hibatörlést. csupán az összes hiba törlése teszi lehetővé a melegítő kireteszelését.'
kind: 'live'
access: 'read'
length: 2
variants: ['X250FL_V1_0', 'X250_*']

