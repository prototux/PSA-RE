node: 'CMB'
model: 'COMBINE_CAN_FIAT'
display_name:
  en: 'Instrument cluster (COMBINE_CAN_FIAT)'
  fr: 'Combine (COMBINE_CAN_FIAT)'
protocols: ['KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'KWP-PSA2000'
    request_id: 0x7B0
    response_id: 0x7C3
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'

services: [0x10, 0x1A, 0x20, 0x21]

identification:
  request: '1A 80'
  part_number: '43.7-47.0'
  comment:
    en: 'The ECU part number is in data bytes 43 to 47 of the answer to 1A 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 43 à 47 de la réponse à 1A 80 (DCB), elle donne la variante logicielle'

variants:
  X250_V1:
    parts: ['3283A485B3']
