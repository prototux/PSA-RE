node: 'CMB'
model: 'IPC'
display_name:
  en: 'Instrument cluster (IPC)'
  fr: 'Combine (IPC)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x18DA60F1
    response_id: 0x18DAF160
    comment:
      en: '29 bit CAN identifiers'
      fr: 'Identifiants CAN 29 bits'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'

services: [0x10, 0x14, 0x19, 0x22, 0x2E, 0x2F, 0x3E]

tester_present:
  request: '3E 00'
  period_ms: 1000

identification:
  request: '22 F1 A0'
  part_number: '60.7-64.0'
  comment:
    en: 'The ECU part number is in data bytes 60 to 64 of the answer to 22 F1 A0 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 60 à 64 de la réponse à 22 F1 A0 (DCB), elle donne la variante logicielle'

cars: ['X250FL']

variants:
  X250FL_IPC_V1:
    parts: ['3283528AE6']
    cars: ['X250FL']
  X250FL_IPC_V2:
    parts: ['3283D38A67']
    cars: ['X250FL']
  X250FL_IPC_V3:
    parts: ['3283EF0D86']
    cars: ['X250FL']
  X250FL_IPC_V4:
    parts: ['3283700D07']
    cars: ['X250FL']
  X250FL_IPC_V5:
    parts: ['0003407814']
    cars: ['X250FL']
