ioctl: 0x5588
name: 'MAX_COOLANT_TEMPERATURE_WARNING_LIGHT'
display_name:
  en: 'Max coolant temperature warning light'
  fr: 'Témoin température d''eau maxi'
  es: 'Testigo temperatura de agua máxima'
  de: 'Warnleuchte Kühlmitteltemperatur'
  pl: 'Kontrolka temperatury maksymalnej płynu chłodzącego'
  hu: 'Hűtőfolyadék maximális hőmérséklete visszajelzés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Max coolant temperature warning light'
      fr: 'Témoin température d''eau maxi'
      es: 'Testigo temperatura de agua máxima'
      de: 'Warnleuchte Kühlmitteltemperatur'
      pl: 'Kontrolka temperatury maksymalnej płynu chłodzącego'
      hu: 'Hűtőfolyadék maximális hőmérséklete visszajelzés'
    max_duration_ms: 2000
