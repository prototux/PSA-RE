ioctl: 0x559E
name: 'PASSENGER_AIR_BAG_DISARMED_WARNING_LIGHT'
display_name:
  en: 'Passenger air bag disarmed warning light'
  fr: 'Témoin d''airbag passager désactivé'
  es: 'Testigo de airbag pasajero desactivado'
  de: 'Kontrollleuchte Deaktivierung Beifahrer-Airbag'
  pl: 'Kontrolka wyłączonej poduszki powietrznej pasażera'
  hu: 'Semlegesített utasoldali légzsák visszajelzés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Passenger air bag disarmed warning light'
      fr: 'Témoin d''airbag passager désactivé'
      es: 'Testigo de airbag pasajero desactivado'
      de: 'Kontrollleuchte Deaktivierung Beifahrer-Airbag'
      pl: 'Kontrolka wyłączonej poduszki powietrznej pasażera'
      hu: 'Semlegesített utasoldali légzsák visszajelzés'
    max_duration_ms: 2000
