ioctl: 0x557D
name: 'AIR_BAG_FAULT_WARNING_LIGHT'
display_name:
  en: 'Air bag fault warning light'
  fr: 'Témoin d''anomalie airbag'
  es: 'Testigo de anomalía airbag'
  de: 'Warnleuchte Störung Airbag'
  pl: 'Kontrolka niesprawności poduszki powietrznej'
  hu: 'Légzsák rendellenesség visszajelzés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Air bag fault warning light'
      fr: 'Témoin d''anomalie airbag'
      es: 'Testigo de anomalía airbag'
      de: 'Warnleuchte Störung Airbag'
      pl: 'Kontrolka niesprawności poduszki powietrznej'
      hu: 'Légzsák rendellenesség visszajelzés'
    max_duration_ms: 2000
