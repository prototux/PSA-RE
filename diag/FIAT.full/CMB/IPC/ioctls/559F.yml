ioctl: 0x559F
name: 'SEAT_BELT_NOT_FASTENED_WARNING_LIGHT'
display_name:
  en: 'Seat belt not fastened warning light'
  fr: 'Témoin de ceinture de sécurité non bouclée'
  es: 'Testigo cinturón de seguridad no abrochado'
  de: 'Kontrolleuchte für nicht geschlossenen Sicherheitsgurt'
  pl: 'Kontrolka nie zapiętego pasa bezpieczeństwa'
  hu: 'Nem becsatolt biztonsági öv visszajelzés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Seat belt not fastened warning light'
      fr: 'Témoin de ceinture de sécurité non bouclée'
      es: 'Testigo cinturón de seguridad no abrochado'
      de: 'Kontrolleuchte für nicht geschlossenen Sicherheitsgurt'
      pl: 'Kontrolka nie zapiętego pasa bezpieczeństwa'
      hu: 'Nem becsatolt biztonsági öv visszajelzés'
    max_duration_ms: 2000
