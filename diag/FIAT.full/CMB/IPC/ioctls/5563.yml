ioctl: 0x5563
name: 'GENERAL_FAULT_WARNING_LAMP'
display_name:
  en: 'General fault warning lamp'
  fr: 'Témoin d''anomalie générale'
  es: 'Testigo de anomalía general'
  de: 'Warnleuchte allgemeine Störung'
  pl: 'Kontrolka ogólnej niesprawności'
  hu: 'Általános rendellenesség visszajelzés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'General fault warning lamp'
      fr: 'Témoin d''anomalie générale'
      es: 'Testigo de anomalía general'
      de: 'Warnleuchte allgemeine Störung'
      pl: 'Kontrolka ogólnej niesprawności'
      hu: 'Általános rendellenesség visszajelzés'
    max_duration_ms: 2000
