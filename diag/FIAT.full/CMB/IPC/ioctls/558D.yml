ioctl: 0x558D
name: 'DOOR_S_OPEN_WARNING_LIGHT'
display_name:
  en: 'Door(s) open warning light'
  fr: 'Témoin de porte(s) ouverte(s)'
  es: 'Testigo de puerta(s) abierta(s)'
  de: 'Kontrollleuchte offene Tür(en)'
  pl: 'Kontrolka otwartych drzwi'
  hu: 'Nyitott ajtó(k) visszajelzés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Door(s) open warning light'
      fr: 'Témoin de porte(s) ouverte(s)'
      es: 'Testigo de puerta(s) abierta(s)'
      de: 'Kontrollleuchte offene Tür(en)'
      pl: 'Kontrolka otwartych drzwi'
      hu: 'Nyitott ajtó(k) visszajelzés'
    max_duration_ms: 2000
  - display_name:
      en: 'Door(s) open warning lamp'
      fr: 'Témoin d''une ou des portes ouvertes'
      es: 'Testigo de una o varias puertas abiertas'
      de: 'Kontrollanzeige für eine oder mehrere offenen Türen'
      pl: 'Lampka kontrolna jednych lub kilku otwartych drzwi'
      hu: 'Nyitott ajtó vagy ajtók visszajelzés'
    max_duration_ms: 2000
