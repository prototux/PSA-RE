ioctl: 0x555C
name: 'VEHICLE_PROTECTION_SYSTEM_WARNING_LIGHT'
display_name:
  en: 'Vehicle protection system warning light'
  fr: 'Témoin de système de protection véhicule'
  es: 'Testigo de sistema de protección vehículo'
  de: 'Warnleuchte Fahrzeugsicherungssystems'
  pl: 'Kontrolka systemu ochronnego pojazdu'
  hu: 'Gépjármű védelmi rendszere visszajelzés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Vehicle protection system warning light'
      fr: 'Témoin de système de protection véhicule'
      es: 'Testigo de sistema de protección vehículo'
      de: 'Warnleuchte Fahrzeugsicherungssystems'
      pl: 'Kontrolka systemu ochronnego pojazdu'
      hu: 'Gépjármű védelmi rendszere visszajelzés'
    max_duration_ms: 2000
