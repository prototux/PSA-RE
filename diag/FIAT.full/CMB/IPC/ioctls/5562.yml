ioctl: 0x5562
name: 'ESP_FAULT_WARNING_LIGHT'
display_name:
  en: 'ESP fault warning light'
  fr: 'Témoin d''anomalie ESP'
  es: 'Testigo de anomalía ESP'
  de: 'Warnleuchte Fehler ESP'
  pl: 'Kontrolka niesprawności ESP'
  hu: 'ESP rendellenesség visszajelzés'
variants: ['X250FL_IPC_V1', 'X250FL_IPC_V2']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'ESP fault warning light'
      fr: 'Témoin d''anomalie ESP'
      es: 'Testigo de anomalía ESP'
      de: 'Warnleuchte Fehler ESP'
      pl: 'Kontrolka niesprawności ESP'
      hu: 'ESP rendellenesség visszajelzés'
    max_duration_ms: 2000
