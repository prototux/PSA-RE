ioctl: 0x5557
name: 'SIDE_LIGHTS_INDICATOR_LIGHT'
display_name:
  en: 'Side lights indicator light'
  fr: 'Témoin de feux de position'
  es: 'Testigo de luces de población'
  de: 'Kontrollleuchte Begrenzungsleuchten'
  pl: 'Kontrolka świateł pozycyjnych'
  hu: 'Helyzetjelzőlámpák visszajelzés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
