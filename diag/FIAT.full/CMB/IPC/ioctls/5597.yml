ioctl: 0x5597
name: 'FUEL_GAUGE'
display_name:
  en: 'Fuel gauge'
  fr: 'Jauge niveau carburant'
  es: 'Contador de nivel de aceite'
  de: 'Kraftstoffvorratsanzeige'
  pl: 'Czujnik poziomu paliwa'
  hu: 'Tüzelőanyag szintmérő'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Fuel gauge'
      fr: 'Jauge niveau carburant'
      es: 'Contador de nivel de aceite'
      de: 'Kraftstoffvorratsanzeige'
      pl: 'Czujnik poziomu paliwa'
      hu: 'Tüzelőanyag szintmérő'
    max_duration_ms: 2000
