ioctl: 0x5589
name: 'ALTERNATOR_WARNING_LIGHT'
display_name:
  en: 'Alternator warning light'
  fr: 'Témoin alternateur'
  es: 'Testigo del alternador'
  de: 'Warnleuchte Generator'
  pl: 'Kontrolka alternatora'
  hu: 'Generátor visszajelzés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Alternator warning light'
      fr: 'Témoin alternateur'
      es: 'Testigo del alternador'
      de: 'Warnleuchte Generator'
      pl: 'Kontrolka alternatora'
      hu: 'Generátor visszajelzés'
    max_duration_ms: 2000
