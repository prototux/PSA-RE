ioctl: 0x555A
name: 'RH_INDICATOR_LED'
display_name:
  en: 'RH indicator LED'
  fr: 'Témoin indicateur de direction droit'
  es: 'Testigo indicador de dirección derecha'
  de: 'Kontrollleuchte Blinker Rechtslenkung'
  pl: 'Lampka kontrolna prawych kierunkowskazów'
  hu: 'Jobboldali irányjelzo jelzolámpa'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'RH indicator LED'
      fr: 'Témoin indicateur de direction droit'
      es: 'Testigo indicador de dirección derecha'
      de: 'Kontrollleuchte Blinker Rechtslenkung'
      pl: 'Lampka kontrolna prawych kierunkowskazów'
      hu: 'Jobboldali irányjelzo jelzolámpa'
    max_duration_ms: 2000
