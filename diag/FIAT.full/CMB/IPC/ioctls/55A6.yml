ioctl: 0x55A6
name: 'PRE_HEAT_GLOW_PLUGS_WARNING_LIGHT'
display_name:
  en: 'Pre-heat glow plugs warning light'
  fr: 'Témoin de bougies de préchauffage'
  es: 'Testigo de bujías de precalentamiento'
  de: 'Kontrollleuchte Glühkerzen'
  pl: 'Kontrolka świec żarowych'
  hu: 'Izzítógyertyák visszajelzés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
