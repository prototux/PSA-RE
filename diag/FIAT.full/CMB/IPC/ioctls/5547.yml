ioctl: 0x5547
name: 'SUSPENSION_WARNING_LAMP'
display_name:
  en: 'Suspension warning lamp'
  fr: 'Témoin de suspension'
  es: 'Testigo de suspensión'
  de: 'Kontrollleuchte Federung'
  pl: 'Kontrolka zawieszenia'
  hu: 'Felfüggesztés visszajelzés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
