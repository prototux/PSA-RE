  - display_name:
      en: 'Warning lamps WARNING collision front'
      fr: 'Témoins avertissement collision avant'
      es: 'Testigos AVISO colisión Delante'
      de: 'Kontrolleuchten WARNUNG Kollision Vorne'
      pl: 'Kontrolki ostrzeżenie kolizja Przód'
      hu: 'Visszajelzol mp k figyelmeztetés ütközés Elso'
    max_duration_ms: 2000
  - display_name:
      en: 'Speed limiter activation indicator lamp'
      fr: 'Témoin d''activation du limiteur de vitesse'
      es: 'Testigo de activación del limitador de velocidad'
      de: 'Kontrollleuchte Aktivierung des Geschwindigkeitsbegrenzers'
