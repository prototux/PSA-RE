ioctl: 0x55A5
name: 'CRUISE_CONTROL_ACTIVATION_INDICATOR_LIGHT'
display_name:
  en: 'Cruise control activation indicator light'
  fr: 'Témoin d''activation régulation vitesse'
  es: 'Testigo de activación regulación velocidad'
  de: 'Kontrollleuchte Aktivierung Geschwindigkeitsregelung'
  pl: 'Kontrolka włączenia regulacji prędkości'
  hu: 'Sebességszabályozás aktiválási visszajelzés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Cruise control activation indicator light'
      fr: 'Témoin d''activation régulation vitesse'
      es: 'Testigo de activación regulación velocidad'
      de: 'Kontrollleuchte Aktivierung Geschwindigkeitsregelung'
      pl: 'Kontrolka włączenia regulacji prędkości'
      hu: 'Sebességszabályozás aktiválási visszajelzés'
    max_duration_ms: 2000
