ioctl: 0x55AE
name: 'PAD_WEAR_WARNING_LIGHT'
display_name:
  en: 'Pad wear warning light'
  fr: 'Témoin d''usure plaquette'
  es: 'Testigo de desgaste de pastillas de freno'
  de: 'Warnleuchte für Bremsbelagverschleiß'
  pl: 'Kontrolka zużycia klocków'
  hu: 'Fékbetét-kopás visszajelzés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
