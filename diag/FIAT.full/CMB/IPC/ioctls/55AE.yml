  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Pad wear warning light'
      fr: 'Témoin d''usure plaquette'
      es: 'Testigo de desgaste de pastillas de freno'
      de: 'Warnleuchte für Bremsbelagverschleiß'
      pl: 'Kontrolka zużycia klocków'
      hu: 'Fékbetét-kopás visszajelzés'
    max_duration_ms: 2000
