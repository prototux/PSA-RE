ioctl: 0x5584
name: 'FUEL_RESERVE_WARNING_LIGHT'
display_name:
  en: 'Fuel reserve warning light'
  fr: 'Témoin réserve carburant'
  es: 'Testigo reserva de carburante'
  de: 'Warnleuchte Kraftstoffreserve'
  pl: 'Kontrolka zapasu paliwa'
  hu: 'Tüzelőanyag-tartalék visszajelzés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Fuel reserve warning light'
      fr: 'Témoin réserve carburant'
      es: 'Testigo reserva de carburante'
      de: 'Warnleuchte Kraftstoffreserve'
      pl: 'Kontrolka zapasu paliwa'
      hu: 'Tüzelőanyag-tartalék visszajelzés'
    max_duration_ms: 2000
