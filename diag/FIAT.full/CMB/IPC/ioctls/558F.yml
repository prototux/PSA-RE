ioctl: 0x558F
name: 'REV_COUNTER'
display_name:
  en: 'Rev counter'
  fr: 'Indicateur de régime moteur'
  es: 'Indicador de régimen motor'
  de: 'Anzeige Motordrehzahl'
  pl: 'Obrotomierz'
  hu: 'Motor fordulatszám jelzolámpa'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  ENGINE_SPEED_INDICATOR:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Rev counter'
      fr: 'Indicateur de régime moteur'
      es: 'Indicador de régimen motor'
      de: 'Anzeige Motordrehzahl'
      pl: 'Obrotomierz'
      hu: 'Motor fordulatszám jelzolámpa'
    max_duration_ms: 2000
