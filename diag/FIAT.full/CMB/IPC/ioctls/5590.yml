ioctl: 0x5590
name: 'ABS_FAULT_WARNING_LIGHT'
display_name:
  en: 'ABS fault warning light'
  fr: 'Témoin d''anomalie ABS'
  es: 'Testigo de anomalía ABS'
  de: 'Warnleuchte ABS'
  pl: 'Kontrolka niesprawności ABS'
  hu: 'ABS rendellenesség visszajelzés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'ABS fault warning light'
      fr: 'Témoin d''anomalie ABS'
      es: 'Testigo de anomalía ABS'
      de: 'Warnleuchte ABS'
      pl: 'Kontrolka niesprawności ABS'
      hu: 'ABS rendellenesség visszajelzés'
    max_duration_ms: 2000
