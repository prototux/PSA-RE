ioctl: 0x55B0
name: 'PARTICLE_EMISSION_FILTER_WARNING_LIGHT'
display_name:
  en: 'Particle emission filter warning light'
  fr: 'Témoin filtre à particules'
  es: 'Testigo de filtro de partículas'
  de: 'Kontrollleuchte Partikelfilter'
  pl: 'Kontrolka FAP'
  hu: 'Részecskeszűrő visszajelzés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Particle emission filter warning light'
      fr: 'Témoin filtre à particules'
      es: 'Testigo de filtro de partículas'
      de: 'Kontrollleuchte Partikelfilter'
      pl: 'Kontrolka FAP'
      hu: 'Részecskeszűrő visszajelzés'
    max_duration_ms: 2000
