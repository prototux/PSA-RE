ioctl: 0x558A
name: 'MIN_ENGINE_OIL_PRESSURE_WARNING_LIGHT'
display_name:
  en: 'Min engine oil pressure warning light'
  fr: 'Témoin pression huile moteur mini'
  es: 'Testigo de presión de aceite motor mínimo'
  de: 'Warnleuchte Motor-Öldruck'
  pl: 'Kontrolka ciśnienia minimalnego oleju silnika'
  hu: 'Minimális motorolajnyomás visszajelzés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Min engine oil pressure warning light'
      fr: 'Témoin pression huile moteur mini'
      es: 'Testigo de presión de aceite motor mínimo'
      de: 'Warnleuchte Motor-Öldruck'
      pl: 'Kontrolka ciśnienia minimalnego oleju silnika'
      hu: 'Minimális motorolajnyomás visszajelzés'
    max_duration_ms: 2000
