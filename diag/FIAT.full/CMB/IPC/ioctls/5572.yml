ioctl: 0x5572
name: 'LCD_DISPLAY_LIGHTING'
display_name:
  en: 'LCD display lighting'
  fr: 'Eclairage écran LCD'
  es: 'Alumbrado de la pantalla LCD'
  de: 'Beleuchtung LCD-Bildschirm'
  pl: 'Oswietlenie ekranu LCD'
  hu: 'LCD képernyo megvilágítása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
