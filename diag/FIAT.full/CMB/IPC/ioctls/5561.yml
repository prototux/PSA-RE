ioctl: 0x5561
name: 'WATER_DIESEL_FILTER_WARNING_LIGHT'
display_name:
  en: 'Water in diesel filter warning light'
  fr: 'Témoin de présence d''eau dans le filtre à gazole'
  es: 'Testigo de presencia de agua en el filtro de gasoil'
  de: 'Warnleuchte Wasser im Dieselfilter'
  pl: 'Kontrolka obecności wody w filtrze oleju napędowego'
  hu: 'Gázolajszűrőben lévő víz jelenlétének visszajelzése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Water in diesel filter warning light'
      fr: 'Témoin de présence d''eau dans le filtre à gazole'
      es: 'Testigo de presencia de agua en el filtro de gasoil'
      de: 'Warnleuchte Wasser im Dieselfilter'
      pl: 'Kontrolka obecności wody w filtrze oleju napędowego'
      hu: 'Gázolajszűrőben lévő víz jelenlétének visszajelzése'
    max_duration_ms: 2000
