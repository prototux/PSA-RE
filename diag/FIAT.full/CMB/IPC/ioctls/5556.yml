ioctl: 0x5556
name: 'HANDBRAKE_LOW_BRAKE_FLUID_LEVEL_WARNING_LIGHT'
display_name:
  en: 'Handbrake / Low brake fluid level warning light'
  fr: 'Témoin de frein à main / Niveau de liquide de frein insuffisant'
  es: 'Testigo de freno de mano / Nivel de líquido de frenos insuficiente'
  de: 'Warnleuchte Handbremse/zu niedriger Bremsflüssigkeitsstand'
  pl: 'Kontrolka hamulca ręcznego / niedostatecznego poziomu płynu hamulcowego'
  hu: 'Kézifék / Elégtelen fékfolyadékszint visszajelzés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Handbrake / Low brake fluid level warning light'
      fr: 'Témoin de frein à main / Niveau de liquide de frein insuffisant'
      es: 'Testigo de freno de mano / Nivel de líquido de frenos insuficiente'
      de: 'Warnleuchte Handbremse/zu niedriger Bremsflüssigkeitsstand'
      pl: 'Kontrolka hamulca ręcznego / niedostatecznego poziomu płynu hamulcowego'
      hu: 'Kézifék / Elégtelen fékfolyadékszint visszajelzés'
    max_duration_ms: 2000
