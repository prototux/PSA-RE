lid: 0x39
name: 'BATTERY_CHARGING'
display_name:
  en: 'Battery charging'
  fr: 'Batterie en charge'
  es: 'Batería en carga'
  de: 'Batterie in Ladung'
  pl: 'Ładowany akumulator'
  hu: 'Akkumulátor töltésben'
comment:
  en: 'Indicates that the battery is charged by the alternator. this parameter''s information is only valid when the ignition is on. this parameter''s value changes to "Yes" when the ignition is on with the engine running.'
  fr: 'Signifie que la batterie est chargée par l''alternateur. information de ce paramètre est valable uniquement contact mis. la valeur de ce paramètre passe à " Oui " contact mis moteur tournant.'
  es: 'Significa que la batería está cargada por el alternador. la información de este parámetro es válida únicamente con el contacto puesto. el valor de este parámetro pasa a " Si " con el contacto puesto y motor en marcha.'
  de: 'Bedeutet, dass die Batterie vom Generator geladen wird. die Information dieses Parameters ist nur bei eingeschaltetem Fahrtschalter gültig. der Wert dieses Parameters geht bei eingeschaltetem Fahrtschalter und laufendem Motor auf "JA".'
  pl: 'Oznacza że akumulator jest naładowany przez alternator. informacja z tego parametru jest ważna tylko przy włączonym zapłonie. wartość tego parametru zmienia się na " Tak " przy włączonym zapłonie i pracującym silniku.'
  hu: 'Jelzi, hogy az akkumulátor a generátor által töltött. ezen paraméter információja csupán ráadott gyújtás esetén érvényes". ezen paraméter értékeIgen-re tér át ráadott gyújtás és járó motor esetén.'
kind: 'live'
access: 'read'
length: 1

params:
  BATTERY_CHARGING:
