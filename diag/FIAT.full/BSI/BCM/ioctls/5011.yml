ioctl: 0x5011
name: 'MAIN_BEAM_HEADLAMPS'
display_name:
  en: 'Main beam headlamps'
  fr: 'Feux de route'
  es: 'Luces de carretera'
  de: 'Fernlicht'
  pl: 'Światła drogowe'
  hu: 'Országúti fényszórók'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  REAR_RIGHT_PARKING_LIGHT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Main beam headlamps'
      fr: 'Feux de route'
      es: 'Luces de carretera'
      de: 'Fernlicht'
      pl: 'Światła drogowe'
      hu: 'Országúti fényszórók'
    max_duration_ms: 10000
  - display_name:
      en: 'RH side lamps'
      fr: 'Feux de position droit'
      es: 'Luz de posición derecha'
      de: 'Fernlicht rechts'
      pl: 'Prawe swiatla pozycyjne'
      hu: 'Jobboldali helyzetjelzo lámpa'
    max_duration_ms: 10000
