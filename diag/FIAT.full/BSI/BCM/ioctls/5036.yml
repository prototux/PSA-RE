ioctl: 0x5036
name: 'FRONT_RIGHT_HAND_DAYTIME_RUNNING_LAMP'
display_name:
  en: 'Front right-hand daytime running lamp'
  fr: 'Feu diurne avant droit'
  es: 'Luz diurna delantera derecha'
  de: 'Tagfahrlicht vorne rechts'
  pl: 'Światło dzienne przednie prawe'
  hu: 'Jobb első nappali lámpa'
variants: ['X250FL_BCM_V2']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  REAR_RIGHT_PARKING_LIGHT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Front right-hand daytime running lamp'
      fr: 'Feu diurne avant droit'
      es: 'Luz diurna delantera derecha'
      de: 'Tagfahrlicht vorne rechts'
      pl: 'Światło dzienne przednie prawe'
      hu: 'Jobb első nappali lámpa'
    max_duration_ms: 10000
