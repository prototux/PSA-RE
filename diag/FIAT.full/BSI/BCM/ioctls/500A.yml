ioctl: 0x500A
name: 'RIGHT_HAND_DIRECTION_INDICATORS'
display_name:
  en: 'Right-hand direction indicators'
  fr: 'Clignotants droits'
  es: 'Indicadores de dirección derechos'
  de: 'Blinker rechts'
  pl: 'Kierunkowskazy prawe'
  hu: 'Jobb oldali irányjelzők'
variants: ['X250FL_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  RH_INDICATOR_LIGHTS:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Right-hand direction indicators'
      fr: 'Clignotants droits'
      es: 'Indicadores de dirección derechos'
      de: 'Blinker rechts'
      pl: 'Kierunkowskazy prawe'
      hu: 'Jobb oldali irányjelzők'
    max_duration_ms: 10000
