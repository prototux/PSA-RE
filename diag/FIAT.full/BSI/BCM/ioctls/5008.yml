ioctl: 0x5008
name: 'FRONT_LEFT_ELECTRIC_WINDOW_RAISING_CONTROL'
display_name:
  en: 'Front left electric window raising control'
  fr: 'Commande de montée du lève-vitre avant gauche'
  es: 'Mando de subida de elevalunas delantero izquierdo'
  de: 'Steuerung Heben Scheibenheber vorne links'
  pl: 'Sterowanie podnoszeniem podnośnika przedniej lewej szyby'
  hu: 'Bal első ablakemelő felemelés vezérlés'
variants: ['X250FL_BCM_V2']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  FRONT_CEILING_LIGHT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Front left electric window raising control'
      fr: 'Commande de montée du lève-vitre avant gauche'
      es: 'Mando de subida de elevalunas delantero izquierdo'
      de: 'Steuerung Heben Scheibenheber vorne links'
      pl: 'Sterowanie podnoszeniem podnośnika przedniej lewej szyby'
      hu: 'Bal első ablakemelő felemelés vezérlés'
    max_duration_ms: 3000
