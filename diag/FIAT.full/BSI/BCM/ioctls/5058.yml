ioctl: 0x5058
name: 'LOAD_COMPARTMENT_DOORS_LOCKING_STATUS_INDICATOR'
display_name:
  en: 'Load compartment doors locking status indicator lamp'
  fr: 'Voyant d''état de verrouillage des portes du compartiment de charge'
  es: 'Testigo de estado de bloqueo de las puertas del compartimento de carga'
  de: 'Kontrollleuchte Verriegelungszustand der Türen des Laderaums'
  pl: 'Kontrolka stanu ryglowania drzwi przestrzeni ładunkowej'
  hu: 'Rakodótéri ajtók reteszelési állapotának visszajelzése'
variants: ['X250FL_BCM_V2']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  FRONT_CEILING_LIGHT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Load compartment doors locking status indicator lamp'
      fr: 'Voyant d''état de verrouillage des portes du compartiment de charge'
      es: 'Testigo de estado de bloqueo de las puertas del compartimento de carga'
      de: 'Kontrollleuchte Verriegelungszustand der Türen des Laderaums'
      pl: 'Kontrolka stanu ryglowania drzwi przestrzeni ładunkowej'
      hu: 'Rakodótéri ajtók reteszelési állapotának visszajelzése'
    max_duration_ms: 1000
