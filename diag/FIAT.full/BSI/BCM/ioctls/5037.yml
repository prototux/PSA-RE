ioctl: 0x5037
name: 'STOP_AND_START_RELAY'
display_name:
  en: 'Stop and start relay'
  fr: 'Relais stop and start'
  es: 'Relé stop and start'
  de: 'Relais Stop and Start'
  pl: 'Przekaźnik stop and start'
  hu: 'Stop and start relé'
variants: ['MCV_V4', 'MCV_V5', 'MCV_V6']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  PLAY_OVER_SMAKING:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Stop and start relay'
      fr: 'Relais stop and start'
      es: 'Relé stop and start'
      de: 'Relais Stop and Start'
      pl: 'Przekaźnik stop and start'
      hu: 'Stop and start relé'
    max_duration_ms: 1000
