ioctl: 0x5120
name: 'REAR_DOORS_LOCKING_CONTROL'
display_name:
  en: 'Rear doors locking control'
  fr: 'Commande de verrouillage des portes arrière'
  es: 'Mando de bloqueo de las puertas traseras'
  de: 'Ansteuerung Verriegelung der Hintertüren'
  pl: 'Sterowanie ryglowania tylnych drzwi'
  hu: 'A hátsó ajtók reteszelésének vezérlése'
variants: ['X250FL_BCM_V2']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  FRONT_CEILING_LIGHT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Rear doors locking control'
      fr: 'Commande de verrouillage des portes arrière'
      es: 'Mando de bloqueo de las puertas traseras'
      de: 'Ansteuerung Verriegelung der Hintertüren'
      pl: 'Sterowanie ryglowania tylnych drzwi'
      hu: 'A hátsó ajtók reteszelésének vezérlése'
    max_duration_ms: 1000
