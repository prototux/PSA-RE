ioctl: 0x5023
name: 'DOOR_DEADLOCKING_RELAY'
display_name:
  en: 'Door deadlocking relay'
  fr: 'Relais de superverrouillage des portes'
  es: 'Relé de superbloqueo de las puertas'
  de: 'Relais Sicherheitsverriegelung der Türen'
  pl: 'Przekaźnik superzamka drzwi'
  hu: 'Ajtók szuper-reteszelő reléje'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  REAR_DEPARTMENT_LOCK_UNLOCK:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Door deadlocking relay'
      fr: 'Relais de superverrouillage des portes'
      es: 'Relé de superbloqueo de las puertas'
      de: 'Relais Sicherheitsverriegelung der Türen'
      pl: 'Przekaźnik superzamka drzwi'
      hu: 'Ajtók szuper-reteszelő reléje'
    max_duration_ms: 1000
  - display_name:
      en: 'Locking of the load compartment'
      fr: 'Verrouillage du compartiment de charge'
      es: 'Bloqueo del compartimiento de carga'
      de: 'Verriegelung des Laderaums'
      pl: 'Zaryglowanie przedziału towarowego'
      hu: 'Rakodótér reteszelése'
    max_duration_ms: 1000
