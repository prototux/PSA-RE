ioctl: 0x5032
name: 'WINDSCREEN_WASH'
display_name:
  en: 'Windscreen wash'
  fr: 'Lavage pare-brise'
  es: 'Lavado parabrisas'
  de: 'Waschanlage Windschutzscheibe'
  pl: 'Zmywanie przedniej szyby'
  hu: 'Szélvédő mosás'
variants: ['X250FL_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  FRONT_CEILING_LIGHT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Windscreen wash'
      fr: 'Lavage pare-brise'
      es: 'Lavado parabrisas'
      de: 'Waschanlage Windschutzscheibe'
      pl: 'Zmywanie przedniej szyby'
      hu: 'Szélvédő mosás'
    max_duration_ms: 2000
