ioctl: 0x5057
name: 'FRONT_LEFT_ELECTRIC_WINDOW_LOWERING_CONTROL'
display_name:
  en: 'Front left electric window lowering control'
  fr: 'Commande de descente du lève-vitre avant gauche'
  es: 'Mando de descenso del elevalunas delantero izquierdo'
  de: 'Steuerung Senken Scheibenheber vorne links'
  pl: 'Sterowanie opuszczaniem podnośnika przedniej lewej szyby'
  hu: 'Bal első ablakemelő leengedés vezérlése'
variants: ['X250FL_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  FRONT_CEILING_LIGHT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Front left electric window lowering control'
      fr: 'Commande de descente du lève-vitre avant gauche'
      es: 'Mando de descenso del elevalunas delantero izquierdo'
      de: 'Steuerung Senken Scheibenheber vorne links'
      pl: 'Sterowanie opuszczaniem podnośnika przedniej lewej szyby'
      hu: 'Bal első ablakemelő leengedés vezérlése'
    max_duration_ms: 3000
