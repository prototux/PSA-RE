ioctl: 0x5038
name: 'STOP_AND_START_INDICATOR_LAMP'
display_name:
  en: 'Stop and start indicator lamp'
  fr: 'Témoin stop and start'
  es: 'Testigo stop and start'
  de: 'Kontrollleuchte STOP & START'
  pl: 'Lampka kontrolna stop and start'
  hu: 'Stop and start visszajelzés'
variants: ['MCV_V4', 'MCV_V5', 'MCV_V6', 'X250FL_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CHECK_BUTTON_LIGHT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Stop and start indicator lamp'
      fr: 'Témoin stop and start'
      es: 'Testigo stop and start'
      de: 'Kontrollleuchte STOP & START'
      pl: 'Lampka kontrolna stop and start'
      hu: 'Stop and start visszajelzés'
    max_duration_ms: 3000
