ioctl: 0x5024
name: 'HEATED_REAR_SCREEN_1'
display_name:
  en: 'Heated rear screen 1'
  fr: 'Dégivrage lunette arrière 1'
  es: 'Deshelado de luneta trasera 1'
  de: 'Entfrosten der Heckscheibe 1'
  pl: 'Odszranianie tylnej szyby 1'
  hu: '1 a hátsó ablak páramentesítése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  PUDDLE_LIGH:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Heated rear screen 1'
      fr: 'Dégivrage lunette arrière 1'
      es: 'Deshelado de luneta trasera 1'
      de: 'Entfrosten der Heckscheibe 1'
      pl: 'Odszranianie tylnej szyby 1'
      hu: '1 a hátsó ablak páramentesítése'
    max_duration_ms: 10000
  - display_name:
      en: 'Stop lamps'
      fr: 'Feux stop'
      es: 'Luces stop'
      de: 'Bremslicht'
      pl: 'Swiatla stopu'
      hu: 'Féklámpa'
    max_duration_ms: 10000
