ioctl: 0x500C
name: 'STOP_LAMPS'
display_name:
  en: 'Stop lamps'
  fr: 'Feux stop'
  es: 'Luces stop'
  de: 'Bremslicht'
  pl: 'Swiatla stopu'
  hu: 'Féklámpa'
variants: ['X250FL_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  PUDDLE_LIGH:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Stop lamps'
      fr: 'Feux stop'
      es: 'Luces stop'
      de: 'Bremslicht'
      pl: 'Swiatla stopu'
      hu: 'Féklámpa'
    max_duration_ms: 10000
