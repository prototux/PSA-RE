ioctl: 0x501C
name: 'MARKER_LAMPS_CONTROL'
display_name:
  en: 'Marker lamps control'
  fr: 'Commande feux de gabarit'
  es: 'Mando de luces de gálibo'
  de: 'Betätigung Begrenzungsleuchten'
  pl: 'Sterowanie swiatel gabarytowych'
  hu: 'Vezérlés: szélességjelző fények'
variants: ['X250FL_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  FRONT_CEILING_LIGHT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Marker lamps control'
      fr: 'Commande feux de gabarit'
      es: 'Mando de luces de gálibo'
      de: 'Betätigung Begrenzungsleuchten'
      pl: 'Sterowanie swiatel gabarytowych'
      hu: 'Vezérlés: szélességjelző fények'
    max_duration_ms: 10000
