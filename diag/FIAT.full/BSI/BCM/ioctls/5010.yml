ioctl: 0x5010
name: 'DIPPED_BEAM'
display_name:
  en: 'Dipped beam'
  fr: 'Feux de croisement'
  es: 'Luces de cruce'
  de: 'Abblendlicht'
  pl: 'Światła mijania'
  hu: 'Tompított fényszórók'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  FRONT_LEFT_PARKING_LIGHT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Dipped beam'
      fr: 'Feux de croisement'
      es: 'Luces de cruce'
      de: 'Abblendlicht'
      pl: 'Światła mijania'
      hu: 'Tompított fényszórók'
    max_duration_ms: 10000
  - display_name:
      en: 'LH side lamps'
      fr: 'Feux de position gauche'
      es: 'Luz de posición izquierda'
      de: 'Fernlicht links'
      pl: 'Lewe swiatla pozycyjne'
      hu: 'Baloldali helyzetjelzo lámpa'
    max_duration_ms: 10000
