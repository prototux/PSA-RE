ioctl: 0x5020
name: 'UNLOCKING_LOCKS'
display_name:
  en: 'Unlocking of the locks'
  fr: 'Déverrouillage des serrures'
  es: 'Desbloqueo de las cerraduras'
  de: 'Entriegelung der Schlösser'
  pl: 'Odblokowanie zamków'
  hu: 'A zárak oldása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  HEAD_REAR_WINDOW:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Unlocking of the locks'
      fr: 'Déverrouillage des serrures'
      es: 'Desbloqueo de las cerraduras'
      de: 'Entriegelung der Schlösser'
      pl: 'Odblokowanie zamków'
      hu: 'A zárak oldása'
    max_duration_ms: 1000
  - display_name:
      en: 'De-icing control'
      fr: 'Commande de dégivrage'
      es: 'Mando de desempañado'
      de: 'Steuerung Enteisung'
      pl: 'Sterowanie odszranianiem'
      hu: 'Jégmentesítés vezérlése'
    max_duration_ms: 1000
