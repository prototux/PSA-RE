ioctl: 0x5015
name: 'COURTESY_LAMP_2ND_ROW'
display_name:
  en: 'Courtesy lamp 2nd row'
  fr: '2ème rangée de plafonnier'
  es: '2ª fila de las luces de techo'
  de: '2. Reihe der Deckenleuchte'
  pl: '2. rząd lampki sufitowej'
  hu: 'Mennyezetlámpa 2 sor'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  REAR_FOGLIGHTS:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Courtesy lamp 2nd row'
      fr: '2ème rangée de plafonnier'
      es: '2ª fila de las luces de techo'
      de: '2. Reihe der Deckenleuchte'
      pl: '2. rząd lampki sufitowej'
      hu: 'Mennyezetlámpa 2 sor'
    max_duration_ms: 10000
  - display_name:
      en: 'Rear foglamp'
      fr: 'Feu de brouillard arrière'
      es: 'Luces traseras de niebla'
      de: 'Nebelschlussleuchte'
      pl: 'Tylne światło przeciwmgłowe'
      hu: 'Ködlámpa'
    max_duration_ms: 10000
