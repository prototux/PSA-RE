ioctl: 0x5030
name: 'FAST_SPEED_WINDSCREEN_WIPERS'
display_name:
  en: 'Fast speed windscreen wipers'
  fr: 'Essuyage pare brise grande vitesse'
  es: 'Limpiaparabrisas a velocidad máxima'
  de: 'Wischen Frontscheibe große Geschwindigkeit'
  pl: 'Wycieranie przedniej szyby z duza predkoscia'
  hu: 'Gyors ablaktörlés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  FRONT_CEILING_LIGHT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Fast speed windscreen wipers'
      fr: 'Essuyage pare brise grande vitesse'
      es: 'Limpiaparabrisas a velocidad máxima'
      de: 'Wischen Frontscheibe große Geschwindigkeit'
      pl: 'Wycieranie przedniej szyby z duza predkoscia'
      hu: 'Gyors ablaktörlés'
    max_duration_ms: 3000
  - display_name:
      en: 'Front courtesy lamp'
      fr: 'Plafonnier avant'
      es: 'Plafón delantero'
      de: 'Deckenleuchte vorn'
      pl: 'Przednia lampka sufitowa'
      hu: 'Első mennyezeti lámpa'
    max_duration_ms: 10000
  - display_name:
      en: 'Slow speed windscreen wipers'
      fr: 'Essuyage pare-brise petite vitesse'
      es: 'Limpiaparabrisas a velocidad mínima'
      de: 'Wischen Frontscheibe kleine Geschwindigkeit'
      pl: 'Wycieranie przedniej szyby z mala predkoscia'
      hu: 'Lassú ablaktörlés'
    max_duration_ms: 3000
