ioctl: 0x500B
name: 'NUMBER_PLATE_LIGHTS'
display_name:
  en: 'Number plate lights'
  fr: 'Feux de plaque de police'
  es: 'Luces matrícula'
  de: 'Kennzeichenleuchten'
  pl: 'Światła tablicy rejestracyjnej'
  hu: 'Rendszámtábla világítás'
variants: ['X250FL_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  PLATE_LIGTHS:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Number plate lights'
      fr: 'Feux de plaque de police'
      es: 'Luces matrícula'
      de: 'Kennzeichenleuchten'
      pl: 'Światła tablicy rejestracyjnej'
      hu: 'Rendszámtábla világítás'
    max_duration_ms: 10000
