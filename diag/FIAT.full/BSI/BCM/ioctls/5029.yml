ioctl: 0x5029
name: 'UNLOCKING_LOCKS'
display_name:
  en: 'Unlocking of the locks'
  fr: 'Déverrouillage des serrures'
  es: 'Desbloqueo de las cerraduras'
  de: 'Entriegelung der Schlösser'
  pl: 'Odryglowanie zamków'
  hu: 'Zárak kireteszelése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x02:
    en: 'Freeze current state'
    fr: 'Figer l''état courant'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  UNLOCK:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Unlocking of the locks'
      fr: 'Déverrouillage des serrures'
      es: 'Desbloqueo de las cerraduras'
      de: 'Entriegelung der Schlösser'
      pl: 'Odryglowanie zamków'
      hu: 'Zárak kireteszelése'
    max_duration_ms: 1000
