ioctl: 0x5018
name: 'DE_ICING_BUTTON_LED'
display_name:
  en: 'De-icing button LED'
  fr: 'Témoin du bouton de dégivrage'
  es: 'Testigo del botón de deshelado'
  de: 'Kontrollleuchte der Enteisungstaste'
  pl: 'Lampka kontrolna przycisku odszraniania'
  hu: 'Páramentesítés nyomógomb visszajelzo lámpa'
variants: ['X250FL_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
