ioctl: 0x5025
name: 'HEADLAMP_WASHING'
display_name:
  en: 'Headlamp washing'
  fr: 'Lavage projecteurs'
  es: 'Lavado faros'
  de: 'Waschen Scheinwerfer'
  pl: 'Mycie reflektorów'
  hu: 'Fényszórómosás'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CENTER_STOP_LIGHTS:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Headlamp washing'
      fr: 'Lavage projecteurs'
      es: 'Lavado faros'
      de: 'Waschen Scheinwerfer'
      pl: 'Mycie reflektorów'
      hu: 'Fényszórómosás'
    max_duration_ms: 2000
  - display_name:
      en: 'Third stop lamp'
      fr: 'Troisième feu stop'
      es: 'Tercera luz stop'
      de: 'Drittes Bremslicht'
      pl: 'Trzecie swiatlo stopu'
      hu: 'Harmadik féklámpa'
    max_duration_ms: 10000
