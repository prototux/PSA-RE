ioctl: 0x5031
name: 'REAR_INTERIOR_LAMP_LOAD_SPACE'
display_name:
  en: 'Rear interior lamp (load space)'
  fr: 'Plafonnier arrière (compartiment de charge)'
  es: 'Plafón trasero (compartimento de carga)'
  de: 'Hintere Deckenleuchte (Laderaum)'
  pl: 'Tylna lampka sufitowa (przedzial ladunkowy)'
  hu: 'Hátsó mennyezeti lámpa (raktér)'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  REAR_CEILING_LIGHT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Rear interior lamp (load space)'
      fr: 'Plafonnier arrière (compartiment de charge)'
      es: 'Plafón trasero (compartimento de carga)'
      de: 'Hintere Deckenleuchte (Laderaum)'
      pl: 'Tylna lampka sufitowa (przedzial ladunkowy)'
      hu: 'Hátsó mennyezeti lámpa (raktér)'
    max_duration_ms: 10000
