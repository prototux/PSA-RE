ioctl: 0x5125
name: 'HEATED_REAR_SCREEN_2'
display_name:
  en: 'Heated rear screen 2'
  fr: 'Dégivrage lunette arrière 2'
  es: 'Deshelado de luneta trasera 2'
  de: 'Entfrosten der Heckscheibe 2'
  pl: 'Odszranianie tylnej szyby 2'
  hu: '2 a hátsó ablak páramentesítése'
variants: ['X250FL_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  FRONT_CEILING_LIGHT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Heated rear screen 2'
      fr: 'Dégivrage lunette arrière 2'
      es: 'Deshelado de luneta trasera 2'
      de: 'Entfrosten der Heckscheibe 2'
      pl: 'Odszranianie tylnej szyby 2'
      hu: '2 a hátsó ablak páramentesítése'
    max_duration_ms: 10000
