ioctl: 0x500F
name: 'REVERSING_LAMPS'
display_name:
  en: 'Reversing lamps'
  fr: 'Feux de recul'
  es: 'Luces de marcha atrás'
  de: 'Rückfahrscheinwerfer'
  pl: 'Swiatla cofania'
  hu: 'Tolatásjelző lámpák'
variants: ['X250FL_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CENTER_STOP_LIGHTS:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Reversing lamps'
      fr: 'Feux de recul'
      es: 'Luces de marcha atrás'
      de: 'Rückfahrscheinwerfer'
      pl: 'Swiatla cofania'
      hu: 'Tolatásjelző lámpák'
    max_duration_ms: 10000
