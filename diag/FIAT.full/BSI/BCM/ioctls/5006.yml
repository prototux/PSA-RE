ioctl: 0x5006
name: 'FRONT_RIGHT_ELECTRIC_WINDOW_RAISING_CONTROL'
display_name:
  en: 'Front right electric window raising control'
  fr: 'Commande de montée du lève-vitre avant droit'
  es: 'Mando de subida de elevalunas delantero derecho'
  de: 'Steuerung Heben Scheibenheber vorn rechts'
  pl: 'Sterowanie podnoszeniem podnośnika przedniej prawej szyby'
  hu: 'Jobb első ablakemelő felemelés vezérlés'
variants: ['X250FL_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  FRONT_CEILING_LIGHT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Front right electric window raising control'
      fr: 'Commande de montée du lève-vitre avant droit'
      es: 'Mando de subida de elevalunas delantero derecho'
      de: 'Steuerung Heben Scheibenheber vorn rechts'
      pl: 'Sterowanie podnoszeniem podnośnika przedniej prawej szyby'
      hu: 'Jobb első ablakemelő felemelés vezérlés'
    max_duration_ms: 3000
