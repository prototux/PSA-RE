ioctl: 0x5012
name: 'FRONT_FOGLAMPS'
display_name:
  en: 'Front foglamps'
  fr: 'Feux de brouillard avant'
  es: 'Antinieblas delanteros'
  de: 'Nebelscheinwerfer'
  pl: 'Przednie światła przeciwmgłowe'
  hu: 'Elso ködfényszórók'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  HIGH_BEAM:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Front foglamps'
      fr: 'Feux de brouillard avant'
      es: 'Antinieblas delanteros'
      de: 'Nebelscheinwerfer'
      pl: 'Przednie światła przeciwmgłowe'
      hu: 'Elso ködfényszórók'
    max_duration_ms: 10000
  - display_name:
      en: 'Main beam headlamps'
      fr: 'Feux de route'
      es: 'Luces de carretera'
      de: 'Fernlicht'
      pl: 'Światła drogowe'
      hu: 'Országúti fényszórók'
    max_duration_ms: 10000
