ioctl: 0x501B
name: 'PORTABLE_BOOT_LIGHTING'
display_name:
  en: 'Portable boot lighting'
  fr: 'Éclairage coffre amovible'
  es: 'Luz de maletero portatil'
  de: 'Herausnehmbare Kofferraumbeleuchtung'
  pl: 'Oswietlenie ruchome bagaznika'
  hu: 'Kivehető csomagtartó-világítás'
variants: ['X250FL_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  FRONT_CEILING_LIGHT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Portable boot lighting'
      fr: 'Éclairage coffre amovible'
      es: 'Luz de maletero portatil'
      de: 'Herausnehmbare Kofferraumbeleuchtung'
      pl: 'Oswietlenie ruchome bagaznika'
      hu: 'Kivehető csomagtartó-világítás'
    max_duration_ms: 10000
