ioctl: 0x5026
name: 'ECO_BUTTON_WARNING_LAMP'
display_name:
  en: 'ECO button warning lamp'
  fr: 'Témoin du bouton ECO'
  es: 'Testigo del botón ECO'
  de: 'Kontrollleuchte der Taste ECO'
  pl: 'Kontrolka przycisku ECO'
  hu: 'ECO gomb visszajelzés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  HEAD_LAMP_WASHER:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'ECO button warning lamp'
      fr: 'Témoin du bouton ECO'
      es: 'Testigo del botón ECO'
      de: 'Kontrollleuchte der Taste ECO'
      pl: 'Kontrolka przycisku ECO'
      hu: 'ECO gomb visszajelzés'
    max_duration_ms: 3000
  - display_name:
      en: 'Headlamp washing'
      fr: 'Lavage projecteurs'
      es: 'Lavado faros'
      de: 'Waschen Scheinwerfer'
      pl: 'Mycie reflektorów'
      hu: 'Fényszórómosás'
    max_duration_ms: 2000
