ioctl: 0x5028
name: 'LOCKING_LOCKS'
display_name:
  en: 'Locking of the locks'
  fr: 'Verrouillage des serrures'
  es: 'Bloqueo de las cerraduras'
  de: 'Verriegelung der Schlösser'
  pl: 'Blokowanie zamków'
  hu: 'A zárak zárása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x02:
    en: 'Freeze current state'
    fr: 'Figer l''état courant'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  LOCK:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Locking of the locks'
      fr: 'Verrouillage des serrures'
      es: 'Bloqueo de las cerraduras'
      de: 'Verriegelung der Schlösser'
      pl: 'Blokowanie zamków'
      hu: 'A zárak zárása'
    max_duration_ms: 1000
