ioctl: 0x5021
name: 'LOCKING_FRONT_DOOR_LOCKS'
display_name:
  en: 'Locking of the front door locks'
  fr: 'Verrouillage des serrures des portes avant'
  es: 'Bloqueo de las cerraduras de las puertas delanteras'
  de: 'Verriegelung der Schlösser der Vordertüren'
  pl: 'Zablokowanie zamków przednich drzwi'
  hu: 'Első ajtók zárainak reteszelése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  TRUNK_RELEASE:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Locking of the front door locks'
      fr: 'Verrouillage des serrures des portes avant'
      es: 'Bloqueo de las cerraduras de las puertas delanteras'
      de: 'Verriegelung der Schlösser der Vordertüren'
      pl: 'Zablokowanie zamków przednich drzwi'
      hu: 'Első ajtók zárainak reteszelése'
    max_duration_ms: 1000
  - display_name:
      en: 'Opening of the load space'
      fr: 'Ouverture du compartiment de charge'
      es: 'Apertura del compartimento de carga'
      de: 'Öffnung des Laderaums'
      pl: 'Otwieranie przedzialu ladunkowego'
      hu: 'A raktér nyitása'
    max_duration_ms: 1000
