ioctl: 0x5017
name: 'LEFT_HAND_DIRECTION_INDICATORS'
display_name:
  en: 'Left-hand direction indicators'
  fr: 'Clignotants gauche'
  es: 'Indicadores de dirección izquierdos'
  de: 'Blinker links'
  pl: 'Kierunkowskazy lewe'
  hu: 'Bal oldali irányjelzők'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  LH_INDICATOR_LIGHTS:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Left-hand direction indicators'
      fr: 'Clignotants gauche'
      es: 'Indicadores de dirección izquierdos'
      de: 'Blinker links'
      pl: 'Kierunkowskazy lewe'
      hu: 'Bal oldali irányjelzők'
    max_duration_ms: 10000
