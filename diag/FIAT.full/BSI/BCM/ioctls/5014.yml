ioctl: 0x5014
name: 'FIRST_ROW_COURTESY_LAMP'
display_name:
  en: 'First row of the courtesy lamp'
  fr: 'Première rangée du plafonnier'
  es: 'Primera fila de luces de techo'
  de: 'Erste Reihe der Deckenleuchte'
  pl: 'Pierwszy rząd lampki sufitowej'
  hu: 'Mennyezetlámpa első sor'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  FOGLIGHTS:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'First row of the courtesy lamp'
      fr: 'Première rangée du plafonnier'
      es: 'Primera fila de luces de techo'
      de: 'Erste Reihe der Deckenleuchte'
      pl: 'Pierwszy rząd lampki sufitowej'
      hu: 'Mennyezetlámpa első sor'
    max_duration_ms: 10000
  - display_name:
      en: 'Front foglamps'
      fr: 'Feux de brouillard avant'
      es: 'Antinieblas delanteros'
      de: 'Nebelscheinwerfer'
      pl: 'Przednie swiatla przeciwmgielne'
      hu: 'Első ködlámpa'
    max_duration_ms: 10000
