did: 0x40A7
name: 'SENSITIVITY_INTERNAL_SENSORS'
display_name:
  en: 'Sensitivity of the internal sensors'
  fr: 'Sensibilité des capteurs volumétriques'
  es: 'Sensibilidad de los captadores volumétricos'
  de: 'Empfindlichkeit der Innenraum-Überwachungsgeber'
  pl: 'Czułość czujników pojemnościowych'
  hu: 'A térvédelmi érzékelők érzékenysége'
comment:
  en: 'Used to define the sensitivity of the internal sensors. the sensitivity depends on the volume of the vehicle and the trim of the seats.'
  fr: 'Permet de définir la sensibilité des capteurs volumétriques. la sensibilité dépend du volume du véhicule et de l''habillage des sièges.'
  es: 'Permite definir la sensibilidad de los captadores volumétricos. la sensibilidad depende del volumen del vehículo y del revestimiento de los asientos.'
  de: 'Ermöglicht die Definition der Empfindlichkeit der Innenraum-Überwachungsgeber. die Empfindlichkeit ist abhängig vom Fahrzeug-Volumen und von den Sitzbezügen.'
  pl: 'Pozwala określić czułość czujników pojemnościowych. czułość zależy od pojemności pojazdu i pokrycia foteli.'
  hu: 'Lehetővé teszi a térvédelmi érzékelők érzékenységének meghatározását. az érzékenység a gépkocsi terétől és az ülések burkolatától függ.'
kind: 'live'
access: 'read'
length: 1
variants: ['MCV_V6']

