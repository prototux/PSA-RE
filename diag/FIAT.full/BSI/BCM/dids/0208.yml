name: 'BODY_SHAPE_TYPE'
display_name:
  en: 'Body shape type'
  fr: 'Type de silhouette'
  es: 'Tipo de silueta'
  de: 'Karosserieform'
  pl: 'Typ Sylwetki'
  hu: 'Körvonalrajz típus'
comment:
  en: 'It is not possible to change the configuration of the built-in systems interface using the diagnostic equipment. the built-in systems interface is configured either at the end of the production line or by the replacement parts department.'
  fr: 'Il n''est pas possible de modifier la configuration du boîtier de servitude intelligent avec l''outil de diagnostic. le boîtier de servitude intelligent est télécodé soit en fin de ligne de production soit au service des pièces de rechange.'
  es: 'No es posible modificar la configuración de la caja de servicio inteligente con el útil de diagnosis. la caja de servicio inteligente está telecodificada bien al final de línea de producción, bien en el servicio piezas de recambio.'
  de: 'Es ist nicht möglich die Konfiguration der Zentralschalteinheit BSI mit dem Diagnosewerkzeug zu ändern. die Zentralschalteinheit BSI wird entweder am Ende der Produktionslinie oder im Teiledienst codiert.'
  pl: 'Nie można zmienić konfiguracji BSI używając przyrządu diagnostycznego. BSI jest telekodowany pod koniec linii produkcji albo w dziale części zamiennych.'
  hu: 'Nem lehetséges az intelligens kiszolgálóegység konfigurációjának diagnosztikai készülékkel történő módosítása. az intelligens kiszolgálóegység a gyártósor végén vagy az alkatrész-értékesítési osztályon távkódolásra kerül.'
