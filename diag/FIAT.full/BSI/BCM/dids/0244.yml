      pl: 'Żądanie włączenia wycieraczki tylnej szyby'
      hu: 'Hátsó szélvédő törlésének kérése'
    type: 'bool'
    values:
      0x00:
        en: 'NO'
        fr: 'NON'
        es: 'NO'
        de: 'NEIN'
        pl: 'NIE'
        hu: 'NEM/NINCS'
      0x01:
        en: 'Yes'
        fr: 'Oui'
        es: 'Sí'
        de: 'Ja'
        pl: 'Tak'
        hu: 'Igen'

  PARKING_BRAKE:
