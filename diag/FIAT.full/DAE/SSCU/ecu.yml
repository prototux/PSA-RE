node: 'DAE'
model: 'SSCU'
display_name:
  en: 'Electric power steering (SSCU)'
  fr: 'Direction assistee electrique (SSCU)'
protocols: ['KWP-PSA2000']

resets:
  0xB0:
    en: 'Reset 0xB0'
    fr: 'Réinitialisation 0xB0'

services: [0x11, 0x14, 0x17, 0x18, 0x1A, 0x21, 0x30, 0x34, 0x3E, 0x81, 0x82]

tester_present:
  request: '3E'
  period_ms: 1000

identification:
  request: '1A 97'
  part_number: '1.7-5.0'
  comment:
    en: 'The ECU part number is in data bytes 1 to 5 of the answer to 1A 97 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 1 à 5 de la réponse à 1A 97 (DCB), elle donne la variante logicielle'

cars: ['X250', 'X250FL']

variants:
  DAE_X250FL_V1:
    parts: ['52800119C1']
    cars: ['X250FL']
  DAE_X250_MINIBUS_V1_0:
    parts: ['52800119C1']
  DAE_X250_V1_0:
    parts: ['52800119C1']
    cars: ['X250']
