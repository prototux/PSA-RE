comment:
  en: 'Indicates the battery voltage measured by the power steering ECU. this voltage may differ slightly in relation to the actual battery voltage.'
  fr: 'Indique la tension de la batterie mesurée par le calculateur de direction assistée. cette tension peut être légèrement différente de la tension réelle de la batterie.'
  es: 'Indica la tensión de la batería medida por el calculador de dirección asistida. esta tensión puede ser ligeramente diferente de la tensión real de la batería.'
  de: 'Zeigt die vom Steuergerät der Servolenkung gemessene Batterie-Spannung. diese Spannung kann geringfügig von der tatsächlichen Batterie-Spannung abweichen.'
  pl: 'Wskazuje napięcie akumulatora zmierzone przez kalkulator wspomagania kierownicy. napięcie może się nieznacznie różnić od rzeczywistego napięcia akumulatora.'
  hu: 'A kormányszervo computer által mért akkumulátor-feszültséget jelzi. ezen feszültség kismértékben eltérhet a valós akkumulátor-feszültségtől.'
kind: 'live'
access: 'read'
length: 1

