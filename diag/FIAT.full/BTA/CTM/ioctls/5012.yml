ioctl: 0x5012
name: 'ACTIVATION_VISIBILITY_MODE_ECU_NAME_BLUETOOTH'
display_name:
  en: 'Activation of the visibility mode of the ECU name on the Bluetooth network'
  fr: 'Activation du mode visibilité du nom du calculateur sur le réseau Bluetooth'
  es: 'Activación del modo visibilidad del nombre del calculador en la red Bluetooth'
  de: 'Aktivierung des Sicht-Modus des Namens des Steuergerätes im Bluetooth-Netz'
  pl: 'Aktywacja trybu widoczności nazwy kalkulatora w sieci Bluetooth'
  hu: 'A látható computer név üzemmód aktiválása a Bluetooth hálózaton'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  EBD_SAFETY_LAMP:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

  EBD_SAFETY_LAMP:
    bits: '2.7-2.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Activation of the visibility mode of the ECU name on the Bluetooth network'
      fr: 'Activation du mode visibilité du nom du calculateur sur le réseau Bluetooth'
      es: 'Activación del modo visibilidad del nombre del calculador en la red Bluetooth'
      de: 'Aktivierung des Sicht-Modus des Namens des Steuergerätes im Bluetooth-Netz'
      pl: 'Aktywacja trybu widoczności nazwy kalkulatora w sieci Bluetooth'
      hu: 'A látható computer név üzemmód aktiválása a Bluetooth hálózaton'
    max_duration_ms: 10000
  - display_name:
      en: 'Activation of the masked mode of the ECU name on the Bluetooth network'
      fr: 'Activation du mode masqué du nom du calculateur sur le réseau Bluetooth'
      es: 'Activación del modo oculto del nombre del calculador en la red Bluetooth'
      de: 'Aktivierung des verdeckten Modus des Namens des Steuergerätes im Bluetooth-Netz'
      pl: 'Aktywacja trybu zamaskowanego nazwy kalkulatora w sieci Bluetooth'
      hu: 'A maszkolt computer név üzemmód aktiválása a Bluetooth hálózaton'
    max_duration_ms: 10000
