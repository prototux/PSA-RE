    pl: 'Błąd przedniego lewego wyjścia audio'
    hu: 'Bal oldali első audio kimenet hibája'
  failure_types:
    0x00:
      en: 'Not characterised'
      fr: 'Non caractérisé'
      es: 'No caracterizado'
      de: 'Nicht bezeichnet'
      pl: 'Nie charakteryzowane'
      hu: 'Nem jellemző'
    0x11:
      en: 'Short circuit to earth'
      fr: 'Court-circuit à la masse'
      es: 'Cortocircuito a masa'
      de: 'Kurzschluss an Masse'
      pl: 'Zwarcie z masą'
      hu: 'Negatív rövidzárlat'
    0x12:
      en: 'Short circuit to battery +'
      fr: 'Court-circuit au plus batterie'
      es: 'Cortocircuito al + batería'
      de: 'Kurzschluss an Batterieplus'
      pl: 'Zwarcie z plusem akumulatora'
      hu: 'Rövidzárlat akkumulátor + ra.'
    0x13:
      en: 'Open circuit'
      fr: 'Circuit ouvert'
      es: 'Circuito abierto'
      de: 'Stromkreis offen'
      pl: 'Obwód przerwany'
      hu: 'Megszakadt áramkör'
    0x16:
      en: 'Voltage too low'
      fr: 'Tension trop faible'
      es: 'Tensión demasiado baja'
      de: 'Spannung zu niedrig'
      pl: 'Zbyt niskie napięcie'
      hu: 'Túlságosan gyenge feszültség'
    0x17:
      en: 'Voltage too high'
      fr: 'Tension trop haute'
      es: 'Tensión demasiado alta'
      de: 'Spannung zu hoch'
      pl: 'Napięcie zbyt wysokie'
      hu: 'Túl magas feszültség'
    0x19:
      en: 'Circuit current too high'
      fr: 'Courant de circuit trop élevé'
      es: 'Corriente de circuito demasiado elevada'
      de: 'Strom des Stromkreises zu hoch'
      pl: 'Prąd obwodu za wysoki'
      hu: 'Kör árama túlságosan magas'
    0x1A:
      en: 'Low impedance'
      fr: 'Impédance basse'
      es: 'Impedancia baja'
      de: 'Niedrige Impedanz'
      pl: 'Mała impedancja'
      hu: 'Alsó impedancia'
    0x2A:
      en: 'Button blocked'
      fr: 'Bouton bloqué'
      es: 'Botón bloqueado'
      de: 'Taste eingeklemmt'
      pl: 'Przycisk zablokowany'
      hu: 'Blokkolt myomógomb'
    0x4B:
      en: 'Temperature above the threshold'
      fr: 'Température au-dessus du seuil'
      es: 'Temperatura por encima del umbral'
      de: 'Temperatur über dem Grenzwert'
      pl: 'Temperatura powyżej progu'
      hu: 'Küszöbérték feletti hőmérséklet'
    0x71:
      en: 'Actuator jammed'
      fr: 'Actionneur bloqué'
      es: 'Accionador bloqueado'
      de: 'Stellglied blockiert'
      pl: 'Zablokowany element wykonawczy'
      hu: 'Beavatkozószerv blokkolva'
    0x87:
      en: 'Loss of communication'
      fr: 'Perte de communication'
      es: 'Pérdida de comunicación'
      de: 'Verlust Kommunikation'
      pl: 'Brak komunikacji'
      hu: 'Kommunikáció elveszítése'
    0x88:
      en: 'Network mute'
      fr: 'Réseau muet'
      es: 'Red muda'
      de: 'Netz stumm'
      pl: 'Siec milczy'
      hu: 'Néma hálózat'
