routine: 0x03
name: 'ROUTINE_03'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  DID:
    bits: '1.7-2.0'
    type: 'enum'

results:
  DID:
    bits: '1.7-2.0'
    type: 'enum'

  SIGNAL_VIDEO:
    bits: '3.7-3.0'
    type: 'enum'

  ACTUATOR_TEST:
    bits: '4.7-4.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x00:
        en: 'Programming not started'
        fr: 'Apprentissage non lancé'
        es: 'Aprendizaje no lanzado'
        de: 'Einspeicherung nicht gestartet'
        pl: 'Uczenie nie rozpoczęte'
        hu: 'A tanulás nincs elindítva'
      0x02:
        en: 'Learning complete'
        fr: 'Apprentissage réussi'
        es: 'Aprendizaje conseguido'
        de: 'Programmierung erfolgreich abgeschlossen'
        pl: 'Wczytywanie udane'
        hu: 'Sikeres megismertetés'

  ACTUATOR_TEST_2:
    bits: '5.7-5.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x00:
        en: 'Test not started'
        fr: 'Test non lancé'
        es: 'Test no lanzado'
        de: 'Test nicht gestartet'
        pl: 'Test nie rozpoczęty'
        hu: 'A teszt nem került elindításra'
      0x02:
        en: 'Unclogging successful'
        fr: 'Décrassage réussi'
        es: 'Desengrasado realizado'
        de: 'Reinigung erfolgreich'
        pl: 'Oczyszczanie udane'
        hu: 'Tisztítás sikeres'
