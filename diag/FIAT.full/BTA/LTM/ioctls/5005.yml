ioctl: 0x5005
name: 'BALANCE_ADJUSTMENT'
display_name:
  en: 'Balance adjustment'
  fr: 'Réglage de la balance'
  es: 'Reglaje del balance'
  de: 'Einstellung der Balance'
  pl: 'Regulacja balansu'
  hu: 'A balansz funkció beállítása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_1:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Balance adjustment'
      fr: 'Réglage de la balance'
      es: 'Reglaje del balance'
      de: 'Einstellung der Balance'
      pl: 'Regulacja balansu'
      hu: 'A balansz funkció beállítása'
    max_duration_ms: 3000
