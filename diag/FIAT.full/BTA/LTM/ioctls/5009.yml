ioctl: 0x5009
name: 'FREQUENCY_SELECTION_STEP'
display_name:
  en: 'Frequency selection step'
  fr: 'Etape de sélection de la fréquence'
  es: 'Paso de selección de la frecuencia'
  de: 'Frequenzauswahlschritt'
  pl: 'Etap wyboru częstotliwości'
  hu: 'Frekvenciaválasztási lépés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
