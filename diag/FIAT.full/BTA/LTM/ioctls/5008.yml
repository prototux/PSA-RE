ioctl: 0x5008
name: 'SEARCH_RADIO_FREQUENCY'
display_name:
  en: 'Search for a radio frequency'
  fr: 'Recherche fréquence radio'
  es: 'Búsqueda de fecuencia de radio'
  de: 'Suchlauf Radiofrequenz'
  pl: 'Wyszukiwanie częstotliwości radiowej'
  hu: 'Rádiófrekvencia keresése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_1:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Search for a radio frequency'
      fr: 'Recherche fréquence radio'
      es: 'Búsqueda de fecuencia de radio'
      de: 'Suchlauf Radiofrequenz'
      pl: 'Wyszukiwanie częstotliwości radiowej'
      hu: 'Rádiófrekvencia keresése'
    max_duration_ms: 3000
