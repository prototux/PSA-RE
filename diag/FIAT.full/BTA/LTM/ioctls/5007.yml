ioctl: 0x5007
name: 'ADJUSTMENT_AUDIO_SYSTEM_MEDIUM'
display_name:
  en: 'Adjustment of the audio system medium'
  fr: 'Réglage des medium de l''autoradio'
  es: 'Reglaje de los medios del autorradio'
  de: 'Einstellung der Autoradio-Medien'
  pl: 'Regulacja radia'
  hu: 'Az autórádió eszközeinek beállítása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_1:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Adjustment of the audio system medium'
      fr: 'Réglage des medium de l''autoradio'
      es: 'Reglaje de los medios del autorradio'
      de: 'Einstellung der Autoradio-Medien'
      pl: 'Regulacja radia'
      hu: 'Az autórádió eszközeinek beállítása'
    max_duration_ms: 3000
