ioctl: 0x5002
name: 'ADJUSTMENT_AUDIO_SYSTEM_VOLUME'
display_name:
  en: 'Adjustment of the audio system volume'
  fr: 'Réglage du volume sonore de l''autoradio'
  es: 'Ajuste del volumen del autorradio'
  de: 'Einstellung der Lautstärke des Autoradios'
  pl: 'Regulacja poziomu dźwięku radioodtwarzacza'
  hu: 'Az autórádió hangerő szabályozása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Adjustment of the audio system volume'
      fr: 'Réglage du volume sonore de l''autoradio'
      es: 'Ajuste del volumen del autorradio'
      de: 'Einstellung der Lautstärke des Autoradios'
      pl: 'Regulacja poziomu dźwięku radioodtwarzacza'
      hu: 'Az autórádió hangerő szabályozása'
    max_duration_ms: 3000
