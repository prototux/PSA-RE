ioctl: 0x500D
name: 'DISPLAY_COLOUR'
display_name:
  en: 'Display colour'
  fr: 'Couleur de l''écran'
  es: 'Color de la pantalla'
  de: 'Bildschirmfarbe'
  pl: 'Kolor ekranu'
  hu: 'A képernyo színe'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_1:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Display colour'
      fr: 'Couleur de l''écran'
      es: 'Color de la pantalla'
      de: 'Bildschirmfarbe'
      pl: 'Kolor ekranu'
      hu: 'A képernyo színe'
    max_duration_ms: 3000
