ioctl: 0x5006
name: 'ADJUSTMENT_AUDIO_SYSTEM_FADER'
display_name:
  en: 'Adjustment of the audio system FADER'
  fr: 'Réglage des FADER de l''autoradio'
  es: 'Reglaje de los FADER del autorradio'
  de: 'Einstellung des Autoradio-Faders'
  pl: 'Regulacja funkcji FADER radia'
  hu: 'Az autórádió FADER eszközének beállítása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_1:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Adjustment of the audio system FADER'
      fr: 'Réglage des FADER de l''autoradio'
      es: 'Reglaje de los FADER del autorradio'
      de: 'Einstellung des Autoradio-Faders'
      pl: 'Regulacja funkcji FADER radia'
      hu: 'Az autórádió FADER eszközének beállítása'
    max_duration_ms: 3000
