ioctl: 0x5004
name: 'TREBLE_LEVEL_ADJUSTMENT'
display_name:
  en: 'Treble level adjustment'
  fr: 'Réglage du niveau des aigus'
  es: 'Reglaje del nivel de agudos'
  de: 'Einstellung des Niveaus der Höhen'
  pl: 'Regulacja poziomu tonów wysokich'
  hu: 'A magas hangszín beállítása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_1:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Treble level adjustment'
      fr: 'Réglage du niveau des aigus'
      es: 'Reglaje del nivel de agudos'
      de: 'Einstellung des Niveaus der Höhen'
      pl: 'Regulacja poziomu tonów wysokich'
      hu: 'A magas hangszín beállítása'
    max_duration_ms: 3000
