ioctl: 0x014A
name: 'REVERSING_LAMPS'
display_name:
  en: 'Reversing lamps'
  fr: 'Feux de recul'
  es: 'Luces de retroceso'
  de: 'Rückfahrlicht'
  pl: 'Światła cofania'
  hu: 'Tolatólámpa'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  REAR_RIGHT_PARKING_LIGHT:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Reversing lamps'
      fr: 'Feux de recul'
      es: 'Luces de retroceso'
      de: 'Rückfahrlicht'
      pl: 'Światła cofania'
      hu: 'Tolatólámpa'
    max_duration_ms: 5000
