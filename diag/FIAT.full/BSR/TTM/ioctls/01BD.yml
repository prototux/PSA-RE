ioctl: 0x01BD
name: 'REAR_RIGHT_SIDELAMP'
display_name:
  en: 'Rear right sidelamp'
  fr: 'Feu de position arrière droit'
  es: 'Luz de posición trasera derecha'
  de: 'Standlicht hinten rechts'
  pl: 'Prawe tylne światło pozycyjne'
  hu: 'Jobb hátsó helyzetjelző lámpa'
controls:
  0x00:
    en: 'Return control to the ECU'
