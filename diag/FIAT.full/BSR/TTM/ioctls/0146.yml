    default: 0x03

  REAR_RIGHT_PARKING_LIGHT:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Rear left direction indicator'
      fr: 'Feu indicateur de direction arrière gauche'
      es: 'Luz indicadora de dirección trasera izquierda'
      de: 'Blinker hinten links'
      pl: 'Lewy tylny kierunkowskaz'
      hu: 'Bal hátsó irányjelzőlámpa'
    max_duration_ms: 5000
