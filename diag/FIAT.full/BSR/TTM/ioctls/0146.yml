ioctl: 0x0146
name: 'REAR_LEFT_DIRECTION_INDICATOR'
display_name:
  en: 'Rear left direction indicator'
  fr: 'Feu indicateur de direction arrière gauche'
  es: 'Luz indicadora de dirección trasera izquierda'
  de: 'Blinker hinten links'
  pl: 'Lewy tylny kierunkowskaz'
  hu: 'Bal hátsó irányjelzőlámpa'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
