ioctl: 0x0145
name: 'REAR_RIGHT_DIRECTION_INDICATOR'
display_name:
  en: 'Rear right direction indicator'
  fr: 'Feu indicateur de direction arrière droit'
  es: 'Luz indicadora de dirección trasera derecha'
  de: 'Blinker hinten rechts'
  pl: 'Prawy tylny kierunkowskaz'
  hu: 'Jobb hátsó irányjelzőlámpa'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  REAR_RIGHT_PARKING_LIGHT:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Rear right direction indicator'
      fr: 'Feu indicateur de direction arrière droit'
      es: 'Luz indicadora de dirección trasera derecha'
      de: 'Blinker hinten rechts'
      pl: 'Prawy tylny kierunkowskaz'
      hu: 'Jobb hátsó irányjelzőlámpa'
    max_duration_ms: 5000
