ioctl: 0x01BE
name: 'REAR_LEFT_SIDELAMP'
display_name:
  en: 'Rear left sidelamp'
  fr: 'Feu de position arrière gauche'
  es: 'Luz de posición trasera izquierda'
  de: 'Standlicht hinten links'
  pl: 'Lewe tylne światło pozycyjne'
  hu: 'Bal hátsó helyzetjelző lámpa'
controls:
  0x00:
    en: 'Return control to the ECU'
