ioctl: 0x10
name: 'FRONT_LH_SPEAKER'
display_name:
  en: 'Front LH speaker'
  fr: 'Haut-parleur avant gauche'
  es: 'Altavoz delantero izquierdo'
  de: 'Lautsprecher vorne links'
  pl: 'Lewy przedni głośnik'
  hu: 'Bal első hangszóró'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants: ['AIRBAG_*']

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

  CONTROL_PARAMETER_1:
    bits: '2.7-2.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'bool'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'

  ACTUATOR_TEST_2:
    bits: '2.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'bool'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'

tests:
  - display_name:
      en: 'Front LH speaker'
      fr: 'Haut-parleur avant gauche'
      es: 'Altavoz delantero izquierdo'
      de: 'Lautsprecher vorne links'
      pl: 'Lewy przedni głośnik'
      hu: 'Bal első hangszóró'
    max_duration_ms: 8000
  - display_name:
      en: 'General fault warning light'
      fr: 'Voyant défaut général'
      es: 'Testigo defecto general'
      de: 'Leuchte Gesamtfehler'
      pl: 'Kontrolka błędu ogólnego'
      hu: 'Általános hiba visszajelzés'
    max_duration_ms: 8000
