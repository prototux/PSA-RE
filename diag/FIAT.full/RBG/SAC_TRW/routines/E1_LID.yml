routine: 0xE1
name: 'ROUTINE_E1'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
variants: ['AIRBAG_*']
control: ['start']

params:
  ENTRY_OPTION:
    bits: '1.7-1.0'
    type: 'uint'
    default: 0x02

results:
  CHECK_VALUE_VERIFICATION:
    bits: '1.7-1.0'
    type: 'uint'

  SIGNATURE_VERIFICATION:
    bits: '2.7-2.0'
    type: 'uint'

  DECRYPTION_VERIFICATION:
    bits: '3.7-3.0'
    type: 'uint'

  RESERVED:
    bits: '4.7-4.0'
    unused: true
