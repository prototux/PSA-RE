        fr: 'ON'
        es: 'ON'
        de: 'ON'
        pl: 'ON - WL'
        hu: 'ON'
      0x01:
        en: 'OFF'
        fr: 'OFF'
        es: 'OFF'
        de: 'OFF'
        pl: 'OFF - WYL'
        hu: 'OFF'

  PASSENGER_AIR_BAG_DISARMING_WARNING_LIGHT:
