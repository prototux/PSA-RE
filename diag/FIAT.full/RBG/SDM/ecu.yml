node: 'RBG'
model: 'SDM'
display_name:
  en: 'Airbag control unit (SDM)'
  fr: 'Calculateur airbag (SDM)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x18DAC0F1
    response_id: 0x18DAF1C0
    comment:
      en: '29 bit CAN identifiers'
      fr: 'Identifiants CAN 29 bits'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'

resets:
  0x01:
    en: 'Hard reset'
    fr: 'Réinitialisation matérielle'

services: [0x10, 0x11, 0x14, 0x19, 0x22, 0x27, 0x2E, 0x2F, 0x36, 0x37, 0x3E, 0x85]

security_access:
  - level: 0x01
  - level: 0x05

tester_present:
  request: '3E 00'
  period_ms: 1000

identification:
  request: '22 F1 A0'
  part_number: '60.7-64.0'
  comment:
    en: 'The ECU part number is in data bytes 60 to 64 of the answer to 22 F1 A0 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 60 à 64 de la réponse à 22 F1 A0 (DCB), elle donne la variante logicielle'

cars: ['X250', 'X250FL']

variants:
  X250FL_SDM_V1:
    parts: ['EA07B98A89']
    cars: ['X250FL']
