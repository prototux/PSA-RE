lid: 0xCB
name: 'PARTICLE_EMISSION_FILTER_UPSTREAM_PRESSURE'
display_name:
  en: 'Particle emission filter upstream pressure'
  fr: 'Pression amont Filtre à particules'
  es: 'Presión por encima del Filtro de partículas'
  de: 'Eintrittsdruck des Partikelfilters'
  pl: 'Ciśnienie na wejściu FAP'
  hu: 'Részecskeszűrő előtti nyomás'
comment:
  en: 'Difference in pressure between the particle emission filter inlet and outlet.Informs the ECU that the maximum clogging level of the filter has been exceeded and imposes regeneration as soon as possible.'
  fr: 'Différence de pression entre l''entrée et la sortie du filtre à particules.Informe le calculateur du dépassement du seuil maxi d''encrassement du filtre et impose une régénération dès que possible.'
  es: 'Diferencia de presión entre la entrada y la salida del filtro de partículas.Informa al calculador del sobrepaso del umbral máximo de suciedad del filtro y requiere una regeneración lo antes posible.'
  de: 'Druckdifferenz zwischen Eintritt und Austritt des Partikelfilters.Informiert das Steuergerät über das Überschreiten des maximalen Werts bei der Verstopfung des Filters und erzwingt so bald wie möglich eine Regenerierung.'
  pl: 'Różnica ciśnienia między wejściem i wyjściem FAP.Informuje kalkulator o przekroczeniu progu maksymalnego zanieczyszczenia filtra i narzuca regeneracjţ gdy tylko to bţdzie moţliwe.'
  hu: 'A részecskeszűrő bemenete és kimenete közötti nyomáskülönbség.Informálja a számítóegységet a szűrő eltömődés maximális küszöbértéke túllépéséről és előírja annak mihamarabbi cseréjét.'
kind: 'live'
access: 'read'
length: 2

