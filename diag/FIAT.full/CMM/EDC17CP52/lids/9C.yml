lid: 0x9C
name: 'EGR_VALVE_POSITION_REPEAT'
display_name:
  en: 'EGR valve position repeat'
  fr: 'Recopie position vanne EGR'
  es: 'Recopia posición válvula EGR'
  de: 'Übertragung Stellung Abgasrückführungsventil'
