comment:
  en: 'EGR valve opening value recorded by the position repeat sensor. this must be identical to the EGR valve position reference value.'
  fr: 'Valeur d''ouverture de la vanne EGR enregistrée par le capteur de recopie position. Elle doit être identique à la consigne de position de la vanne EGR.'
