  de: 'Vom Stellungsübertragungsgeber gespeicherter Öffnungswert des Abgasrückführungsventils. Dieser muss identisch mit dem Sollwert Position EGR-Ventil sein.'
  pl: 'Wartość otwarcia zaworu EGR zarejestrowana przez czujnik kopiowania położenia. Powinna być identyczna z wartością zadaną pozycji zaworu EGR.'
  hu: 'Az EGR szelep helyzetlemásoló potenciométer által elmentett nyitási értéke. Azonos kell, hogy legyen az EGR-szelep helyzet utasításával.'
