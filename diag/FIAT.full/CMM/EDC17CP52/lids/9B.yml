lid: 0x9B
name: 'EGR_VALVE_POSITION_REFERENCE_VALUE'
display_name:
  en: 'EGR valve position reference value'
  fr: 'Consigne position vanne EGR'
  es: 'Consigna posición válvula EGR'
  de: 'Sollwert Stellung Abgasrückführungsventil'
  pl: 'Zadana wartość położenia zaworu EGR'
  hu: 'Kipufogógáz-visszavezetés (EGR) szelep helyzet eloírt érték'
comment:
  en: 'Rate of opening of the exhaust gas recirculation valve. The opening control varies between 0% (valve closed) and 100% (valve open).'
  fr: 'Taux d''ouverture de la vanne de recyclage des gaz d''échappement. La commande d''ouverture varie entre 0% (vanne fermée) et 100% (vanne ouverte).'
  es: 'Tasa de apertura de la válvula de reciclado de los gases de escape. El mando de aperura varía entre el 0% (válvula cerrada) y el 100% (válvula abierta).'
  de: 'Öffnungsrate des Abgasrückführungsventils. Die Öffnungssteuerung variiert zwischen 0% (Ventil geschlossen) und 100% (Ventil geöffnet).'
  pl: 'Stopień otwarcia zaworu recyrkulacji spalin. Wysterowanie otwarcia zmienia się pomiędzy 0% (zawór zamknięty) i 100% (zawór otwarty).'
  hu: 'Kipufogógáz-visszavezeto szelep nyitási aránya. A nyitás vezérlés 0% (zárt mágnesszelep) és 100% (nyitott mágnesszelep) között változik.'
kind: 'live'
access: 'read'
length: 2

