lid: 0x67
name: 'MEASURED_INJECTED_FLOW'
display_name:
  en: 'Measured injected flow'
  fr: 'Débit injecté mesuré'
  es: 'Caudal inyectado medido'
  de: 'Gemessene Einspritzmenge'
  pl: 'Zmierzony wydatek wtryskiwania'
  hu: 'Mért befecskendezési hozam'
comment:
  en: 'The ECU does not know the precise quantity of fuel injected. However, the ECU can estimate this quantity according to the pressure in the common rail and the control times of the injectors.'
  fr: 'Le calculateur ne connait pas de manière précise la quantité de carburant injectée. Cependant, le calculateur peut estimer cette quantité en fonction de la pression dans le common rail et des temps de pilotage des injecteurs.'
  es: 'El calculador no conoce de forma precisa la cantidad de carburante inyectado. Sin embargo, el calculador puede estimar esta cantidad en función de la presión en el common rail y de los tiempos de pilotaje de los inyectores.'
  de: 'Das Steuergerät kennt die eingespritzte Kraftstoffmenge nicht genau. Das Steuergerät kann jedoch diese Menge in Abhängigkeit vom Druck in der CR-Leiste und der Dauer der Ansteuerung der Einspritzventile bestimmen.'
  pl: 'Kalkulator nie zna dokładnie ilości wtryskiwanego paliwa. Równocześnie, kalkulator może ocenić tą ilość w funkcji ciśnienia w kolektorze i czasów pilotowania wtryskiwaczy.'
  hu: 'A computer nem ismeri pontosan a befecskendezett tüzelőanyagmennyiséget. Mindamellett a vezérlőegység meg tudja becsülni ezt a mennyiséget a gyűjtőcső-nyomás, a befecskendezők vezérlési idejének függvényében.'
kind: 'live'
access: 'read'
length: 2

params:
  MEASURED_INJECTED_FLOW:
    bits: '1.7-2.0'
    comment:
      en: 'Measured injected flow'
      fr: 'Débit injecté mesuré'
      es: 'Caudal inyectado medido'
      de: 'Gemessene Einspritzmenge'
      pl: 'Zmierzony wydatek wtryskiwania'
      hu: 'Mért befecskendezési hozam'
    type: 'uint'
    factor: 0.003
    units: 'mg/stroke'
