lid: 0xA0
name: 'CODING_TRACEABILITY'
display_name:
  en: 'Coding traceability'
  fr: 'Traçabilité du télécodage'
comment:
  en: 'This value corresponds to the measurement seen by the ECU using the sensor. This value must be fairly close to the reference value.'
  fr: 'Cette valeur correspond à la mesure vue par le calculateur à l''aide du capteur. Cette valeur doit être assez proche de la consigne.'
  es: 'Este valor corresponde a la medida vista por el calculador con ayuda del captador. Este valor debe aproximarse bastante a la consigna.'
  de: 'Dieser Wert entspricht dem vom Steuergerät mit Hilfe des Sensors ausgelesenen Wert. Dieser Wert muss nahe am Sollwert sein.'
  pl: 'Ta wartość odpowiada pomiarowi widzianemu przez kalkulator za pomocą czujnika. Ta wartość powinna być dosyć bliska wartości zadanej.'
  hu: 'Ez az érték megfelel a vezérlőegységnek az érzékelőn keresztül látott mérésnek. Ez az érték az utasítás értékéhez nagyon közeli kell, hogy legyen.'
kind: 'live'
access: 'read'
length: 2

