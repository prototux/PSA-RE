lid: 0xCE
name: 'PARTICLE_FILTER_STATUS'
display_name:
  en: 'Particle filter status'
  fr: 'Etat filtre à particules'
  es: 'Estado filtro de partículas'
  de: 'Zustand Partikelfilter'
  pl: 'Stan filtra cząstek stałych'
  hu: 'A légszűro állapota'
comment:
  en: 'Difference in pressure between the particle emission filter inlet and outlet, informs the ECU of exceeding of the max filter clogging threshold and imposes regeneration as soon as possible. States: filter overloaded, filter clogged requiring natural regeneration when driving or forced regeneration. The missing filter status corresponds to a differential pressure sensor signal problem, a damaged or missing filter'
  fr: 'Différence de pression entre l''entrée et la sortie du filtre à particules, informe le calculateur du dépassement du seuil maxi d''encrassement du filtre et impose une régénération dès que possible . Les états : filtre surchargé, filtre colmaté nécessitent une régénération naturelle en roulant ou forcée . L''état filtre manquant traduit un problème de signal de capteur de pression différentielle, un filtre détérioré ou manquant'
  es: 'Diferencia de presión entre la entrada y la salida del filtro de partículas, informa al calculador sobre el rebasamiento del umbral maxi de suciedad del filtro e impone una regeneración en cuanto es posible. Los estados: filtro sobrecargado, filtro colmado requieren una regeneración natural en rodaje o forzada. El estado falta de filtro significa en un problema de señal de captador de presión diferencial, un filtro deteriorado o la falta de filtro'
  de: 'Druckdifferenz zwischen Eintritt und Austritt des Partikelfilters, informiert das Steuergerät über die Überschreitung der Belastungsobergrenze des Filters und erfordert unverzügliche Regenerierung. Die Zustände: Filter überlastet, Filter verstopft und benötigt eine natürliche Regenerierung während der Fahrt oder eine forcierte Regenerierung. Der Zustand Filter fehlt zeigt eine Störung des Signals des Differenzdrucksensors, einen beschädigten oder fehlenden Filter an'
  pl: 'Różnica ciśnienia między wejściem i wyjściem FAP, informuje kalkulator o przekroczeniu maksymalnego progu zanieczyszczenia filtra i nakazuje jak najszybsze jego regenerowanie. Stany: filtr przepełniony, filtr zatkany wymagają regeneracji naturalnej podczas jazdy albo wymuszonej. Stan braku filtra sygnalizuje problem sygnalu czujnika róznicy cisnien, uszkodzenia filtra albo braku filtra'
  hu: 'A részecskeszuro bemente és kimenete közötti nyomáskülönbség, a maximális telítettségi küszöbérték túllépésérol értesíti a computert és a leheto leghamarabb elvégezendo regenerálást ír elo . Az egyes állapotok : túltelített szűro, eltömodött szűro, amely egy menet közbeni természetes frissítést vagy kényszerfrissítést igényel . A hiányzó szűro állapot a nyomáskülönbség érzékelo jelproblémáját jelzi, egy tönkrement vagy hiányzó szűro'
kind: 'live'
access: 'read'
length: 2

params:
  PARTICLE_FILTER_STATUS:
