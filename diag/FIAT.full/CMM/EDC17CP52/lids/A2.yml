lid: 0xA2
name: 'REFERENCE_FUEL_PRESSURE'
display_name:
  en: 'Reference fuel pressure'
  fr: 'Consigne pression carburant'
  es: 'Consigna presión carburante'
  de: 'Sollwert Kraftstoffdruck'
  pl: 'Nastawa cisnienia paliwa'
  hu: 'Tüzeloanyag-nyomás eloírt érték'
comment:
  en: 'This represents the pressure that the ECU desires in the common rail. It determines it according to the requirements of the injection into the cylinders.'
  fr: 'Cela représente la pression que le calculateur souhaite dans le common rail. Il la détermine en fonction des besoins de l''injection dans les cylindres.'
  es: 'Representa la presión que el calculador requiere en el common rail. Se determina en función de las necesidades de inyección en los cilindros.'
  de: 'Dies stellt den Druck dar, den das Steuergerät in der CR-Verteilerleiste wünscht. Es bestimmt ihn in Abhängigkeit von dem Einspritzbedarf in den Zylindern.'
  pl: 'Określa ona ciśnienie jakie kalkulator wymaga w kolektorze wtryskowym. Ustala je w funkcji potrzeb wtrysku w cylindrach.'
  hu: 'Ez azt a nyomást jelenti, amelyet a motor-vezérlőegység a gyűjtőcsőben létrehozni kíván. Azt a henger befecskendezési igényének függvényében határozza meg.'
kind: 'live'
access: 'read'
length: 2

