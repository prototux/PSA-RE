lid: 0x9F
name: 'TURBO_ACTUATOR_POSITION_REFERENCE_VALUE'
display_name:
  en: 'Turbo actuator position reference value'
  fr: 'Consigne de position de l''actionneur turbo'
  es: 'Consigna de posición del accionador turbo'
  de: 'Stellungs-Sollwert des Turbolader-Stellglieds'
  pl: 'Wartość zadana położenia elementu wykonawczego turbo'
  hu: 'A turbó beavatkozószerv helyzetének előírt értéke'
comment:
  en: 'Degree of closing of the turbocharger. The closing control varies between 0% (turbocharger open) and 100% (turbocharger closed).'
  fr: 'Taux de fermeture du turbocompresseur. La commande de fermeture varie entre 0% (turbocompresseur ouvert) et 100% (turbocompresseur fermé).'
  es: 'Porcentaje de cierre del turbocompresor. El mando de cierre varía entre el 0% (turbocompresor abierto) y el 100% (turbocompresor cerrado).'
  de: 'Schließrate des Turboladers. Der Schließbefehl variiert zwischen 0 % (Turbolader offen) und 100 % (Turbolader geschlossen).'
  pl: 'Stopień zamknięcia turbosprężarki. Sterowanie zamknięciem waha się między 0% (turbosprężarka otwarta) i 100% (turbosprężarka zamknięta).'
  hu: 'Turbókompresszor zárási arány. A zárás vezérlése 0% (turbókompresszor nyitva) és 100% (turbókompresszor zárva) között változik.'
kind: 'live'
access: 'read'
length: 2

