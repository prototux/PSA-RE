lid: 0x5B
name: 'MEASURED_AIR_FLOW'
display_name:
  en: 'Measured air flow'
  fr: 'Débit d''air mesuré'
  es: 'Caudal de aire medido'
  de: 'Gemessener Luftdurchsatz'
  pl: 'Zmierzony wydatek powietrza'
  hu: 'Mért levegohozam'
comment:
  en: 'Corresponding to the average of the air flows measured by the two air flow sensors. With the engine running, this information should be very close to the setting value for the air flow.'
  fr: 'Correspondant à la moyenne des débits d''air mesurés par les deux débitmètres. Moteur tournant, cette information doit être très proche de la valeur de consigne du débit d''air.'
  es: 'Que corresponde a la media de los caudales de aires medidos por los dos caudalímetros. Con el motor en funcionamiento, esta información debe acercarse mucho al valor de consigna del caudal de aire.'
  de: 'Entspricht dem Durchschnitt der von den beiden Luftmassenmessern gemessenen Luftmassen. Bei laufendem Motor muss diese Information sehr nahe am Sollwert für die Luftmenge sein.'
  pl: 'Odpowiada średniej wydatków powietrza zmierzonych przez dwa przepływomierze. Silnik pracujący, ta informacja powinna być bardzo zbliżona do wartości zadanej wydatku powietrza.'
  hu: 'Megfelel a két hozammérő által mért levegőhozamok átlagos értékének. Járó motornál ezen értéknek a levegőhozam előírt értékhez nagyon közelinek kell lennie.'
kind: 'live'
access: 'read'
length: 2

params:
  MEASURED_AIR_FLOW:
    bits: '1.7-2.0'
    comment:
      en: 'Measured air flow'
      fr: 'Débit d''air mesuré'
      es: 'Caudal de aire medido'
      de: 'Gemessener Luftdurchsatz'
      pl: 'Zmierzony wydatek powietrza'
      hu: 'Mért levegohozam'
    type: 'uint'
    factor: 0.5
    offset: -200
    units: 'mg/stroke'
