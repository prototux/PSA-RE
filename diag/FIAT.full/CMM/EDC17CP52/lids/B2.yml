lid: 0xB2
name: 'INJECTOR_1_IMA_CODE'
display_name:
  en: 'Injector 1 IMA code'
  fr: 'Code IMA injecteur 1'
  es: 'Código IMA inyector 1'
  de: 'Code IMA Injektor 1'
  pl: 'Kod IMA wtryskiwacza 1'
  hu: '1 befecskendezőszelep IMA kódja'
comment:
  en: 'This code engraved on the tab (at the injector) corresponds to a measurement of the characteristics of the part in production. It is required by the ECU to adapt the injection time according to the characteristics of each of the injectors.'
  fr: 'Ce code gravé sur la languette (au niveau de l''injecteur) correspond à une mesure des caractéristiques de la pièce lors de sa production. Il sert au calculateur à adapter les temps d''injection en fonction des caractéristiques de chacun des injecteurs.'
  es: 'Este código grabado en la lengüeta (a la altura del inyector) corresponde a una medida de las características de la pieza en el momento de su fabricación. Sirve al calculador para adaptar los tiempos de inyección a las características de cada uno de los inyectores.'
  de: 'Dieser auf der Lasche (an der Einspritzdüse) eingravierte Code entspricht einer Messung der Eigenschaften des Teils bei seiner Herstellung. Dient dem Steuergerät zur Anpassung der Einspritzzeit in Abhängigkeit der Eigenschaften der einzelnen Einspritzdüsen.'
  pl: 'Ten kod wygrawerowany na języczku (na poziomie wtryskiwacza) odpowiada pomiarowi charakterystyk części w czasie produkcji. Służy kalkulatorowi do dopasowania czasów wtrysku w funkcji charakterystyk każdego z wtryskiwaczy.'
  hu: 'A nyelvre gravírozott ezen kód (a befecskendezőszelepnél) az alkatrész jellemzői mérésének felel meg gyártása során. A computer számára szolgál a befecskendezési időknek a befecskendezőszelepek jellemzői függvényében történő adaptálásához.'
kind: 'config'
access: 'read-write'
length: 7

params:
  INJECTOR_1_IMA_CODE:
    bits: '1.7-7.0'
    comment:
      en: 'Injector 1 IMA code'
      fr: 'Code IMA injecteur 1'
      es: 'Código IMA inyector 1'
      de: 'Code IMA Injektor 1'
      pl: 'Kod IMA wtryskiwacza 1'
      hu: '1 befecskendezőszelep IMA kódja'
    type: 'bytes'
