node: 'CMM'
model: 'V342'
display_name:
  en: 'Engine control unit (V342)'
  fr: 'Calculateur moteur multifonction (V342)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x18DA10F1
    response_id: 0x18DAF110
    comment:
      en: '29 bit CAN identifiers'
      fr: 'Identifiants CAN 29 bits'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'
  0x61:
    en: 'Session 0x61'
    fr: 'Session 0x61'
  0x62:
    en: 'Session 0x62'
    fr: 'Session 0x62'

resets:
  0x01:
    en: 'Hard reset'
    fr: 'Réinitialisation matérielle'

services: [0x10, 0x11, 0x14, 0x19, 0x22, 0x27, 0x2E, 0x2F, 0x31, 0x34, 0x3E]

security_access:
  - level: 0x01
  - level: 0x05

tester_present:
  request: '3E'
  period_ms: 1000

identification:
  request: '22 F1 A0'
  part_number: '60.7-64.0'
  comment:
    en: 'The ECU part number is in data bytes 60 to 64 of the answer to 22 F1 A0 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 60 à 64 de la réponse à 22 F1 A0 (DCB), elle donne la variante logicielle'

cars: ['MCV']

variants:
  MCV_V1_0:
    parts: ['4583010725']
    cars: ['MCV']
  MCV_V1_1:
    parts: ['45830208A7']
    cars: ['MCV']
  MCV_V1_3:
    parts: ['4583838929']
    cars: ['MCV']
