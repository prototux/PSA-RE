ioctl: 0x5022
name: 'DOWNSTREAM_OXYGEN_SENSOR_HEATING'
display_name:
  en: 'Downstream oxygen sensor heating'
  fr: 'Chauffage sonde lambda aval'
  es: 'Calentamiento sonda de oxígeno trasera'
  de: 'Heizung Lambdasonde hinten'
  pl: 'Ogrzewanie sondy lambda (za)'
  hu: 'Alsó lambdaszonda fűtése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Downstream oxygen sensor heating'
      fr: 'Chauffage sonde lambda aval'
      es: 'Calentamiento sonda de oxígeno trasera'
      de: 'Heizung Lambdasonde hinten'
      pl: 'Ogrzewanie sondy lambda (za)'
      hu: 'Alsó lambdaszonda fűtése'
    max_duration_ms: 10000
