did: 0x0150
name: 'OPTIMUM_ADVANCE'
display_name:
  en: 'Optimum advance'
  fr: 'Avance optimale'
  es: 'Avance óptimo'
  de: 'Optimaler Zünd-/Einspritzzeitpunkt'
  pl: 'Optymalne wyprzedzenie'
  hu: 'Optimális előgyújtás (töltés)'
comment:
  en: 'Ignition advance in relation to Top Dead Centre (TDC) in degrees of crankshaft rotation this is the optimum operating advance. this is an expert parameter which makes it possible to detect an ignition problem. With the engine warm at idle without air conditioning, the value should be approximately 25°.'
  fr: 'Avance à l''allumage par rapport au Point Mort Haut (PMH) en degré de rotation de vilebrequin c''est l''avance optimale de fonctionnement. c''est un paramètre expert qui permet de détecter un problème d''allumage. Moteur chaud au ralenti sans climatisation, la valeur doit être d''environ 25°.'
  es: 'Avance al encendido con respecto al Punto Muerto Superior (PMS) en grados de rotación de cigüeñal es el avance óptimo de funcionamiento. es un parámetro expert que permite detectar un problema de encendido. Con el motor caliente al ralentí sin climatización, el valor debe ser de aproximadamente 25°.'
  de: 'Zündvorverstellung in Bezug auf den Oberen Totpunkt (OT) in Grad Kurbelwellenumdrehung das ist der optimale Betriebs-Zündzeitpunkt / Einspritzzeitpunkt. dies ist ein Experten-Parameter zur Feststellung eines Zündungsproblems. Motor betriebswarm im Leerlauf ohne Klimaanlage, der Wert muss ca. 25° betragen.'
  pl: 'Wyprzedzenie zapłonu w stosunku do GMP w stopniach obrotu wału korbowego to optymalne wyprzedzenie działania. to parametr eksperta, pozwalający wykryć ewentualny problem zapłonu. Silnik rozgrzany, na biegu jałowym, bez klimatyzacji, wartość musi wynosić około 25°.'
  hu: 'A felső holtponthoz (PMH) viszonyított előgyújtás a hajtótengely elfordulási szögében kifejezve ez az optimális működési előgyújtás. ez egy szakértői szintű paraméter, amely lehetővé teszi egy gyújtási probléma észlelését. Meleg motornál, alapjáraton, klímaberendezés nélkül az érték körülbelül 25° kell legyen.'
kind: 'live'
access: 'read'
length: 1

