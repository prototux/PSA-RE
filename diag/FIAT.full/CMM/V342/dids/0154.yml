did: 0x0154
name: 'ADVANCE_APPLIED_CYLINDER_2'
display_name:
  en: 'Advance applied to cylinder 2'
  fr: 'Avance appliquée au cylindre 2'
  es: 'Avance aplicado al cilindro 2'
  de: 'Zünd-/Einspritzzeitpunkt für Zylinder 2'
  pl: 'Wyprzedzenie wtrysku dotyczące cylindra 2'
  hu: '2 hengeren alkalmazott előgyújtás'
comment:
  en: 'Ignition advance in relation to Top Dead Centre (TDC) in degrees of crankshaft rotation. It is the real ignition advance imposed on cylinder 1, 2, or. at idle, the value should be lower than the value of the optimum advance in order to respond to the load variations. when not at idle, the value should be close to the optimum value'
  fr: 'Avance à l''allumage par rapport au Point Mort Haut (PMH) en degré de rotation de vilebrequin. Il s''agit de la véritable avance à l''allumage commandée au cylindre 1, 2, ou. au ralenti, la valeur doit être inférieure à la valeur de l''avance optimale afin de répondre aux variations de charges. hors ralenti, la valeur doit être proche de la valeur optimale'
  es: 'Avance al encendido con respecto al Punto Muerto Superior (PMS) en grados de rotación de cigüeñal. Se trata del verdadero avance en el encendido encargado al cilindro 1, 2, o. al ralentí, el valor debe ser inferior al valor del avance óptimo con el fin de responder a las variaciones de cargas. fuera de ralentí, el valor debe estar próximo al valor óptimo'
  de: 'Zündvorverstellung in Bezug auf den Oberen Totpunkt (OT) in Grad Kurbelwellenumdrehung. Es handelt sich um eine echte Zündvorverstellung beim Zylinder 1, 2, oder. im Leerlauf muss der Wert unter dem Wert des optimalen Zündzeitpunkts liegen, um den Last-Veränderungen zu entsprechen. außerhalb des Leerlaufs muss der Wert annähernd dem optimalen Wert entsprechen'
  pl: 'Wyprzedzenie zapłonu w stosunku do GMP w stopniach obrotu wału korbowego. Chodzi o rzeczywiste wyprzedzenie zaplonu zadane dla cylindra 1, 2, albo. na biegu jałowym, wartość powinna być mniejsza od wartości optymalnego wyprzedzenia, aby odpowiadała zmianom obciążenia. poza biegiem jałowym, wartość powinna być zbliżona do wartości optymalnej'
  hu: 'A felső holtponthoz (PMH) viszonyított előgyújtás a hajtótengely elfordulási szögében kifejezve. Igazi vezérelt elogyújtásról van szó a 1, 2, vagy hengeren. alapjáraton, az értéknek az optimális előgyújtási érték alattinak kell lennie, annak érdekében, hogy megfeleljen a terhelés-változásoknak. alapjáraton kívül, az értéknek az optimális értékhez közelinek kell lennie'
kind: 'live'
access: 'read'
length: 1

