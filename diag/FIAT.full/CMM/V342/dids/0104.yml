did: 0x0104
name: 'ACCELERATOR_PEDAL_POSITION_TRACK_1'
display_name:
  en: 'Accelerator pedal position, track 1'
  fr: 'Position pédale accélérateur, piste 1'
  es: 'Posición del pedal del acelerador, pista 1'
  de: 'Fahrpedalstellung, Bahn 1'
  pl: 'Położenie pedału przyspieszenia, ścieżka 1'
  hu: 'Gázpedál helyzete, p lya 1'
comment:
  en: 'Voltage supplied by the accelerator pedal position sensor. when the pedal is not pressed, the value should be approximately 400 mv. With the pedal pressed fully, the value should be approximately 3750 mv.'
  fr: 'Tension fournie par le capteur position pédale accélérateur. sans appui sur la pédale, la valeur doit être d''environ 400 mv. Pédale enfoncée au maximum, la valeur doit être d''environ 3750 mv.'
  es: 'Tensión suministrada por el captador de posición del pedal del acelerador. sin pisar el pedal, el valor debe ser aproximadamente de 400 mv. pedal pisado al máximo, el valor debe ser aproximadamente de 3750 mv.'
  de: 'Vom Fahrpedal-Stellungsgeber gelieferte Spannung. ohne Druck auf das Pedal muss der Wert etwa 400 mV betragen. Bei voll gedrücktem Pedal muss der Wert etwa 3750 mV betragen..'
  pl: 'Napięcie dostarczone przez czujnik położenia pedału przyspieszenia. bez naciskania na pedał, wartość powinna wynosić około 400 mv. Przy pedale wciśniętym do oporu wartość powinna wynosić około 3750 mv.'
  hu: 'A gázpedál helyzetérzékelő által szolgáltatott feszültség. a pedál lenyomása nélkül, az értéknek körülbelül 400 mV -nak kell lennie. teljesen lenyomott pedálnál az értéknek körülbelül 3750 mV-nak kell lennie.'
kind: 'live'
access: 'read'
length: 2

