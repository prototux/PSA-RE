did: 0x0106
name: 'RECALCULATED_ACCELERATOR_POSITION'
display_name:
  en: 'Recalculated accelerator position'
  fr: 'Position accélérateur recalculée'
  es: 'Posición del acelerador recalculada'
  de: 'Nachgeführte Fahrpedalstellung'
  pl: 'Ponownie obliczone położenie pedału przyspieszenia'
  hu: 'Újraszámított gázpedál helyzet'
comment:
  en: 'Recalculated accelerator position in % of maximum pressing. with the pedal released, the value should be approximately 0%. with the pedal pressed down fully, the value should be approximately 100 %.'
  fr: 'Position accélérateur recalculée en % de l''enfoncement maxi. sans appui sur la pédale, la valeur doit être d''environ 0 %. pédale enfoncée au maximum, la valeur doit être d''environ 100 %.'
  es: 'Posición acelerador recalculada en % del hundimiento máximo. sin pisar el pedal, el valor debe ser aproximadamente de 0 %. pedal pisado al máximo, el valor debe ser aproximadamente de 100 %.'
  de: 'Berechnete Fahrpedalstellung in % des maximalen Pedalwegs. ohne Druck auf das Pedal muss der Wert etwa 0 % betragen. bei voll gedrücktem Pedal muss der Wert etwa 100 % betragen.'
  pl: 'Położenie pedału przyspieszenia w % maksymalnego wciśnięcia. bez naciskania na pedał, wartość powinna wynosić około 0 %. przy pedale wciśniętym do oporu wartość powinna wynosić około 100 %.'
  hu: 'Gázpedál újrakalkulált helyzete a maximális lenyomás % -ban. a pedál lenyomása nélkül, az értéknek körülbelül 0 %-nak kell lennie. teljesen lenyomott pedálnál, az értéknek körülbelül 100 %-nak kell lennie.'
kind: 'live'
access: 'read'
length: 1

