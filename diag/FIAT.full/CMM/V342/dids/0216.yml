did: 0x0216
name: 'RESISTANT_TORQUE_ADAPTIVE_VALUES'
display_name:
  en: 'Resistant torque adaptive values'
  fr: 'Valeurs des adaptatifs du couple résistant'
  es: 'Valores de los adaptativos del par resistente'
  de: 'Werte der selbstanpassenden Elemente des Widerstandsmoments'
  pl: 'Wartości parametrów adaptacyjnym momentu obrotowego oporowego'
  hu: 'Ellenállásnyomaték illesztési értékek'
comment:
  en: 'Value programmed for the resistant torque due to the engine temperature. With the engine hot at idle, the value should be between - 10 and +10 %.'
  fr: 'Valeur apprise pour le couple résistant dû à la température moteur. Moteur chaud au ralenti, la valeur doit être comprise entre - 10 et +10 %.'
  es: 'Valor aprendido para el par de resistencia debido a la teperatura motor. Motor caliente al ralentí, el valor debe estar comprendido entre - 10 y +10%.'
  de: 'Gelernter Wert für das Schleppmoment abhängig von der Motor-Temperatur. Motor betriebswarm im Leerlauf, der Wert muss zwischen - 10 und +10 % betragen.'
  pl: 'Wartość wczytana dla momentu oporu wynikającego z temperatury silnika. Silnik gorący na wolnych obrotach,wartość powinna być zawarta między 10 i +10 %.'
  hu: 'A motorhőmérsékletnek tulajdonított ellenálló nyomaték megismertetett értéke. Alapjáraton járó meleg motor, az értéknek - 10 és +10 % százalék között kell lennie.'
kind: 'live'
access: 'read'
length: 1

