did: 0x0196
name: 'THROTTLE_POSITION_SENSOR_VOLTAGE_COPY_1'
display_name:
  en: 'Throttle position sensor voltage copy 1'
  fr: 'Recopie tension capteur position papillon 1'
  es: 'Recopia tensión captador posición mariposa 1'
  de: 'Rückmeldung Spannung Positionssensor Drosselklappe 1'
  pl: 'Dodatkowy sygnal napiecia czujnika polozenia przepustnicy 1'
  hu: 'A 1 pillangószelep érzékelo pozíció újramásoló feszültsége'
comment:
  en: 'Voltage supplied by the butterfly position sensor. with the engine warm at idle without air conditioning, the value should be approximately 700 mv. With the engine hot and at full load, the value should be approximately 4300 mv'
  fr: 'Tension fournie par le capteur position papillon. moteur chaud au ralenti sans climatisation, la valeur doit être d''environ 700 mv. Moteur chaud pleine charge, la valeur doit être d''environ 4300 mV'
  es: 'Tensión suministrada por el captador de posición mariposa. motor caliente al ralentí sin climatización, el valor debe ser aproximadamente de 700 mv. Motor caliente plena carga, el valor debe ser aproximadamente 4300mv'
  de: 'Ausgangsspannung des Drosselklappen-Stellungsgebers. bei warmem Motor im Leerlauf ohne Klimaanlage muss der Wert etwa 700 mV betragen. Motor betriebswarm Volllast, der Wert muss ungefähr 4300 mV betragen'
  pl: 'Napięcie dostarczone przez czujnik położenia przepustnicy. przy gorącym silniku na biegu jałowym bez klimatyzacji, wartość powinna wynosić około 700 mv. Dla rozgrzanego silnika pod pelnym obciazeniem, wartosc powinna wynosic okolo 4300mV'
  hu: 'A fojtószelep helyzetérzékelő által szolgáltatott feszültség. meleg motornál alapjáraton klíma nélkül, az értéknek körülbelül 700 mV -nak kell lennie. Meleg motor teljes terhelés mellett, az értéknek kb. 4300mV-nak kell lennie'
kind: 'live'
access: 'read'
length: 2

