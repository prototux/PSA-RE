name: 'UPSTREAM_OXYGEN_SENSOR_VOLTAGE'
display_name:
  en: 'Upstream oxygen sensor voltage'
  fr: 'Tension sonde oxygène amont'
  es: 'Tensión sonda de oxígeno delantera'
  de: 'Spannung Eintritts-Lambda-Sonde'
  pl: 'Napięcie przedniej sondy lambda'
  hu: 'Első lambda-szonda feszültsége'
comment:
  en: 'Voltage supplied by the upstream sensor In open loop: the voltage should be fixed and between 0.1 volts and 1 volts. in closed loop: the voltage should oscillate between 0.1 volt and 1 volt.'
  fr: 'Tension délivrée par la sonde amont En boucle ouverte : la tension doit être fixe et comprise entre 0.1 volt et 1 volt. En boucle fermée : la tension doit osciller entre 0.1 volt et 1 volt.'
  es: 'Tensión enviada por la sonda delantera En bucle abierto : la tensión debe ser fija y comprendida entre 0.1 voltio y 1 voltio. en bucle cerrado : la tensión debe oscilar entre 0.1voltios y 1 voltios.'
  de: 'Spannungssignal der Eintritts-Sonde Im offenen Regelkreis: die Spannung muss fest sein und zwischen 0.1 Volt und 1 Volt betragen. In geschlossenem Regelkreis: die Spannung muss zwischen 0.1 V und 1 V schwanken..'
  pl: 'Napięcie doprowadzane przez sondę przednią W petli otwartej napiecie powinno byc stale i zawierac sie pomiedzy 0.1 V i 1 V. W pętli zamkniętej: napięcie powinno wahać się między 0.1 V i 1 V.'
  hu: 'Felső szonda feszültsége Nyitott kör esetén : a feszültség értékének állandónak és 0.1 Volt és 1 Volt közöttinek kell lennie. zárt hurokban: a feszültségnek 0.1 volt és 1 volt között kell oszcillálnia.'
