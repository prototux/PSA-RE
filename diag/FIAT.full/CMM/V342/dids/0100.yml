comment:
  en: 'Engine warm and idling without air conditioning, the value must be approximately 700 rpm (+/- 50). with the engine warm at idle without air conditioning, the value should be approximately 800 rpm (+/- 50).'
  fr: 'Moteur chaud au ralenti sans climatisation, la valeur doit être d''environ 700 tr/min (+/- 50). moteur chaud au ralenti avec climatisation, la valeur doit être d''environ 800 tr/min (+/- 50).'
  es: 'Motor caliente al ralentí sin climatización, el valore debe ser de unas 700 r.p.m. (+/- 50). motor caliente al ralentí con climatización, el valor debe ser aproximadamente de 800 r/min (+/- 50).'
  de: 'Motor betriebswarm im Leerlauf ohne Klimaanlage, der Wert muss ca. 700/min (+/- 50) betragen. bei betriebswarmem Motor im Leerlauf mit Klimaanlage muss der Wert etwa 800/min betragen (+/- 50).'
  pl: 'Dla silnika rozgrzanego, na biegu jalowym, wartosc powinna wynosic okolo 700 n/min (+/- 50). przy gorącym silniku na biegu jałowym z klimatyzacją, wartość powinna wynosić około 800 obr/min (+/- 50).'
  hu: 'Meleg motor alapjáraton légkondícionálás nélkül, az értéknek kb. 700 1/perc (+/- 50) körülinek kell lennie. meleg motornál alapjáraton klímaberendezéssel, az értéknek körülbelül 800 ford./perc (+/- 50) –nak kell lennie.'
kind: 'live'
