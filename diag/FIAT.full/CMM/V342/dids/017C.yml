did: 0x017C
name: 'UPSTREAM_MIXTURE_CORRECTION_FACTOR'
display_name:
  en: 'Upstream mixture correction factor'
  fr: 'Facteur de correction de richesse amont'
  es: 'Factor de corrección de riqueza parte superior'
  de: 'Korrekturfaktor Eintritts-Gemisch'
  pl: 'Współczynnik korekcji składu mieszanki na wejściu'
  hu: 'Első keverékszabályozási tényező'
comment:
  en: 'Mixture regulation value to correct the mixture in relation to the voltage read at the upstream sensor when the mixture regulation is active, the value varies around 0. If richness regulation is not active, the value is fixed at 0.'
  fr: 'Valeur de la régulation de richesse pour corriger la richesse en fonction de la tension lue à la sonde amont lorsque la régulation de richesse est active, la valeur varie autour de 0. Si la régulation de richesse n''est pas active, la valeur est figée à 0.'
  es: 'Valor de regulación de riqueza para corregir la riqueza en función de la tensión leída en la sonda delantera cuando la regulación de riqueza está activa, el valor varía alrededor de 0. Si la regulación de riqueza no está activa, el valor está fijo en 0.'
  de: 'Wert der Gemischregelung zur Gemischkorrektur in Abhängigkeit vom Spannungsmesswert der Eintritts-Sonde wenn die Gemischregelung aktiv ist, schwankt der Wert um 0. Wenn die Gemischregelung nicht aktiv ist, ist der Wert auf 0 fixiert.'
  pl: 'Wartość regulacji składu mieszanki dla korekcji składu mieszanki w zależności od napięcia, odczytanego przez przednią sondę gdy regulacja składu mieszanki jest włączona, wartość zmienia się wokół 0. Jezeli regulacja wzbogacenia nie jest aktywna, wartosc ustala sie jako 0.'
  hu: 'A keverékszabályozás értéke a keverékértéknek az első szondával mért feszültség függvényében történő korrekciójához amikor a keverékszabályozás aktív, az érték 0 körül változik. Ha a dúsításszabályozás nem aktív, akkor az értéknek 0-re(a) kell beállnia.'
kind: 'live'
access: 'read'
length: 1

