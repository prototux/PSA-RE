did: 0x015B
name: 'VALUE_ANTI_KNOCK_ADAPTIVES_CYLINDER_NO_1'
display_name:
  en: 'Value of anti-knock adaptives of cylinder no. 1'
  fr: 'Valeur des adaptatifs anti-cliquetis du cylindre N° 1'
  es: 'Valor de los adaptativos antipicado del cilindro Nº 1'
  de: 'Anpassungswerte Klopfregelung des Zylinder N1'
  pl: 'Wartosci adaptacyjnych przeciwstukowych cylindra nr 1'
  hu: 'A N° 1. henger kopogásgátló alkalmazkodás értéke'
comment:
  en: 'This value is reset to 0 during downloading.. when knock is detected on a cylinder advance retreats are applied on the cylinder concerned, these values are stored on an Eprom to be reused the next time the engine is started.'
  fr: 'Cette valeur est remise à 0 lors d''un téléchargement.. Lorsque du cliquetis est détecté sur un cylindre, des retraits d''avance sont réalisés sur le cylindre concerné, ces valeurs sont mémorisées en Eprom pour être réutilisées au démarrage suivant.'
  es: 'Este valor vuelve a 0 durante una telecarga.. cuando se detectan picados en un cilindro, se realizan disminuciones de avance en el cilindro afectado, estos valores se memorizan en Eprom para volver a ser utilizados al arranque siguiente.'
  de: 'Dieser Wert wird bei Aktualisierung auf 0 zurückgesetzt.. wenn an einem Zylinder Klopfen festgestellt wird, erfolgen am entsprechenden Zylinder Zurücknahmen der Frühverstellung; diese Werte werden im Eprom gespeichert, um beim nächsten Anlassen wieder verwendet zu werden.'
  pl: 'Te wartości ustawia się na 0 podczas zdalnego programowania.. po wykryciu spalania stukowego w jednym z cylindrów, zmniejsza się wyprzedzenie na tym cylindrze, a wartości zapamiętywane są w Eprom dla wykorzystania podczas kolejnego rozruchu.'
  hu: 'Egy adatátvitel esetén ez az érték 0-re áll vissza.. amikor kopogások kerülnek észlelésre egy hengeren, az érintett hengeren előgyújtás-visszavételek kerülnek végrehajtásra, ezek az értékek az Eprom-ba kerülnek elmentésre a következő indításkor történő újrafelhasználásuk érdekében.'
kind: 'live'
access: 'read'
length: 1

