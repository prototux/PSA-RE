did: 0x0235
name: 'DRIVER_S_REQUIREMENT_TORQUE'
display_name:
  en: 'Driver''s requirement torque'
  fr: 'Couple volonté conducteur'
  es: 'Par voluntad conductor'
  de: 'Drehmomentanforderung des Fahrers'
  pl: 'Moment obrotowy żądany przez kierowcę'
  hu: 'Vezető szándéka nyomaték'
comment:
  en: 'Expert parameter : in % of the max torque This is the torque from the accelerator pedal. It can be compared to the effective torque taken by the advance to see if the engine is supplying what is being requested.'
  fr: 'Paramètre expert : en % du couple max C''est le couple issu de la pédale accélération. Il peut être comparé au couple effectif réalisé par l''avance pour voir si le moteur fourni ce qu''on lui demande.'
  es: 'Parámetro expert : en % del par máximo Es el par que procede del pedal aceleración. Puede compararse al par efectivo realizado por el avance para ver si el motor suminstra lo que se le pide.'
  de: 'Experten-Parameter : in % des maximalen Moments Es handelt sich um das vom Gaspedal stammende Drehmoment. Es kann mit dem durch die Vorverstellung erzielten effektiven Drehmoment verglichen werden, um zu sehen, ob der Motor die geforderte Leistung bringt.'
  pl: 'Parametr eksperta : w % maksymalnego momentu Jest to moment wywolany pedalem przyspieszenia. Mozna go porównac z rzeczywistym momentem uzyskiwanym poprzez wyprzedzenie aby stwierdzic, czy silnik dostarcza tego, czego od niego zadamy.'
  hu: 'Szakértői szintű paraméter : a maximális nyomaték % -ban Ez a gázpedálon kilépo nyomaték. Összehasonlítható az elogyújtással realizált tényleges nyomatékkal azért, hogy látható legyen, ha a motor azt teljesíti, amit kért attól.'
kind: 'live'
access: 'read'
length: 1

