did: 0x0233
name: 'ENGINE_TORQUE_OBTAINED_MANAGING_AIR_FLOW_ACTUAL'
display_name:
  en: 'Engine torque obtained by managing air flow (actual)'
  fr: 'Couple moteur obtenu par gestion du débit d''air (réalisé)'
  es: 'Par motor obtenido por gestión del caudal de aire (realizado)'
  de: 'Durch Steuerung der Luftmenge erhaltenes Motordrehmoment (realisiert)'
  pl: 'Moment obrotowy silnika uzyskany w drodze sterowania przeplywem powietrza (uzyskany)'
  hu: 'A léghozam kezelésével (realizált) elért motornyomaték'
comment:
  en: 'Percentage of the torque obtained through management of the intake of air achieved. when the engine is running, the value measured should always be close to the reference value.'
  fr: 'Pourcentage du couple obtenu par la gestion de l''admission d''air réalisé. moteur tournant, la valeur mesurée doit toujours être proche de la valeur de consigne.'
  es: 'Porcentaje del par obtenido por la gestion de la admisión de aire realizado. motor en marcha, el valor medido debe estar siempre próximo al valor de consigna.'
  de: 'Prozentsatz des durch Steuerung der Ansaugluft erzielten Motordrehmoments, durchgeführt. bei laufendem Motor muss der gemessene Wert immer im Bereich des Sollwerts liegen.'
  pl: 'Procent momentu obrotowego silnika uzyskany poprzez sterowanie dolotem powietrza zrealizowany. przy pracującym silniku zmierzona wartość powinna być zawsze bliska wartości zadanej.'
  hu: 'A megvalósított szívott levegő vezérlés által elért nyomaték százalékban. járó motornál, a mért értéknek az előírt értékéhez közelinek kell lennie.'
