  pl: 'Wartość procentowa momentu, uzyskana poprzez zarządzanie wyprzedzeniem zapłonu, żądana przez kalkulator. Dla rozgrzanego silnika na biegu jalowym bez klimatyzacji, wartosc powinna wynosic okolo 0%.'
  hu: 'A computer által óhajtott előgyújtás-kezelés által elért nyomatékszázalék. Meleg motor alapjáraton légkondícionálás nélkül, az értéknek kb. 0 %-nak kell lennie.'
