  de: 'Dieser Parameter ermöglicht es, zu überprüfen, ob die Stellung der Einlass-Nockenwelle mit der Kurbelwellenstellung übereinstimmt'
  pl: 'Ten parametr pozwala sprawdzić, czy położenie wałka rozrządu zaworów dolotowych (AAC) jest spójne z położeniem wału korbowego'
  hu: 'Ez a paraméter lehetővé teszi annak ellenőrzését, hogy a szívóoldali vezérműtengely (AAC) helyzete megfelel-e a forgattyústengely helyzetének'
