did: 0x0232
name: 'ENGINE_TORQUE_OBTAINED_MANAGING_IGNITION_ADVANCE'
display_name:
  en: 'Engine torque obtained by managing ignition advance (actual)'
  fr: 'Couple moteur obtenu par gestion de l''avance à l''allumage (réalisé)'
  es: 'Par motor obtenido por gestión del avance al encendio (realizado)'
  de: 'Durch Steuerung der Zündvorstellung erhaltenes Motordrehmoment (realisiert)'
  pl: 'Moment obrotowy silnika uzyskany w drodze sterowania wyprzedzeniem zaplonu (uzyskany)'
  hu: 'Az elogyújtás kezelésével (realizált) elért motornyomaték'
comment:
  en: 'Percentage of the torque obtained through management of the ignition advance achieved. when the engine is running, the value measured should always be close to the reference value.'
  fr: 'Pourcentage du couple obtenu par la gestion de l''avance à l''allumage réalisé. moteur tournant, la valeur mesurée doit toujours être proche de la valeur de consigne.'
  es: 'Porcentaje del par obtenido por la gestión del avance del encendido realizado. motor en marcha, el valor medido debe estar siempre próximo al valor de consigna.'
  de: 'Prozentsatz des durch Steuerung des Zündzeitpunkts erzielten Motordrehmoments. bei laufendem Motor muss der gemessene Wert immer im Bereich des Sollwerts liegen.'
  pl: 'Procent momentu obrotowego silnika uzyskany poprzez sterowanie wyprzedzeniem zapłonu zrealizowany. przy pracującym silniku zmierzona wartość powinna być zawsze bliska wartości zadanej.'
  hu: 'A megvalósított előgyújtás vezérlés által elért nyomaték százalékban. járó motornál, a mért értéknek az előírt értékéhez közelinek kell lennie.'
kind: 'live'
access: 'read'
length: 1

