did: 0x0177
name: 'DOWNSTREAM_OXYGEN_SENSOR_VOLTAGE'
display_name:
  en: 'Downstream oxygen sensor voltage'
  fr: 'Tension sonde oxygène aval'
  es: 'Tensión sonda de oxígeno trasera'
  de: 'Spannung Austritts-Lambda-Sonde'
  pl: 'Napięcie tylnej sondy lambda'
  hu: 'Hátsó lambda-szonda feszültsége'
comment:
  en: 'Voltage supplied by the downstream sensor In open loop: the voltage should be fixed and between 0.1 volts and 1 volts. In closed loop: the voltage should oscillate VERY SLIGHTLY and be between 0.1 volts and 1 volts.'
  fr: 'Tension délivrée par la sonde aval En boucle ouverte : la tension doit être fixe et comprise entre 0.1 volt et 1 volt. En boucle fermée : la tension doit osciller TRES FAIBLEMENT et être comprise entre 0.1 volt et 1 volt.'
  es: 'Tensión suministrada por la sonda trasera En bucle abierto : la tensión debe ser fija y comprendida entre 0.1 voltio y 1 voltio. En bucle cerrado: la tensión debe variar MUY POCO y estar comprendida entre 0.1 voltio y 1 voltio.'
  de: 'Von der Lambdasonde nach Katalysator gelieferte Spannung Im offenen Regelkreis: die Spannung muss fest sein und zwischen 0.1 Volt und 1 Volt betragen. Im geschlossenen Regelkreis: die Spannung muss SEHR LEICHT schwanken und zwischen 0.1 Volt und 1 Volt betragen.'
  pl: 'Napięcie dostarczane przez sondę "za" W petli otwartej napiecie powinno byc stale i zawierac sie pomiedzy 0.1 V i 1 V. W petli zamknietej napiecie powinno oscylowac BARDZO NIEZNACZNIE i powinno zawierac sie pomiedzy 0.1 V i 1 V.'
  hu: 'A hátsó lambdaszonda által leszállított feszültség Nyitott kör esetén : a feszültség értékének állandónak és 0.1 Volt és 1 Volt közöttinek kell lennie. Zárt kör esetén : a feszültség értékének NAGYON GYENGÉN kell ingadoznia és értékének0.1 Volt és 1 Volt között kell lennie.'
kind: 'live'
access: 'read'
length: 2

