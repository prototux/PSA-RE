comment:
  en: 'Air conditioning circuit gas pressure. Air conditioning off and for an ambient temperature of approximately 20°C, the value must be approximately 6.5 bars. invalid value: the air conditioning is not present on the vehicle or the pressure is not available.'
  fr: 'Pression du gaz du circuit de climatisation. Climatisation arrêtée et pour une température ambiante d''environ 20°C, la valeur doit être d''environ 6.5 bars. valeur invalide : la climatisation est non présente sur le véhicule ou pression non disponible.'
  es: 'Presión del gas del circuito de climatización. Climatización parada y para una temperatura ambiente aproximada de 20ºC, el valor debe estar en torno a 6.5 bars. valor no válido : la climatización está no presente en el vehículo o presión no disponible.'
  de: 'Gasdruck des Klimaanlagensystems. Klimaanlage ausgeschaltet und bei einer Umgebungstemperatur von ungefähr 20°C: Der Wert muss ungefähr 6.5 bar betragen. ungültiger Wert: Klimaanlage im Fahrzeug nicht verbaut oder Druck nicht verfügbar.'
  pl: 'Cisnienie gazu w ukladzie klimatyzacji. Przy wylaczonej klimatyzacji i w temperaturze otoczenia okolo 20¦C, wartosc powinna wynosic okolo 6.5 bar. wartość nieprawidłowa: klimatyzacji nie ma w pojeździe lub nie ma ciśnienia.'
  hu: 'A légkondícionálás szabályozókör gáznyomása. Leállított légkondícionálás és egy kb. 20°C körüli környezeti homérséklet esetén az értéknek kb. 6.5 barnak kell lennie. érvénytelen érték : a klimatizálás nincs jelen a gépkocsin, vagy a nyomás nem áll rendelkezésre.'
