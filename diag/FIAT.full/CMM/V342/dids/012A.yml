did: 0x012A
name: 'REFRIGERANT_CIRCUIT_PRESSURE'
display_name:
  en: 'Refrigerant circuit pressure'
  fr: 'Pression circuit réfrigérant'
  es: 'Presión circuito de refrigeración'
  de: 'Kältemitteldruck'
  pl: 'Ciśnienie w układzie chłodzenia'
