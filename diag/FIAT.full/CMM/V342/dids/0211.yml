did: 0x0211
name: 'PROGRAMMING_ACCELERATOR_PEDAL_MINIMUM_POSITION_2'
display_name:
  en: 'Programming of the accelerator pedal minimum position 2'
  fr: 'Apprentissage position minimum de la pédale d''accélérateur 2'
  es: 'Aprendizaje posición mínima del pedal de acelerador 2'
  de: 'Anlernung minimale Position des Fahrpedals 2'
  pl: 'Procedura uczenia minimalnego położenia pedału przyspieszenia 2'
  hu: 'Inicializálás: gázpedál minimum pozíciója 2'
comment:
  en: 'Corresponds to sensor track 2. The ECU must reprogram the minimum and maximum values periodically to take ageing phenomena into account. if parts are replaced, the values must be reprogrammed in order to take into account the tolerance of the components.'
  fr: 'Correspond à la piste 2 du capteur. Le calculateur doit réapprendre les valeurs minimum et maximum périodiquement pour prendre en compte des phénomènes de vieillissement. en cas de changement de pièce les valeurs doivent être réapprises pour prendre en compte la tolérance des composants.'
  es: 'Corresponde a la pista 2 del captador. El calculador debe volver a aprender los valores mínimos y máximos periódicamente para tomar en cuenta los fenómenos de envejecimiento. en cado de cambio de pieza los valores deben volver a memorizarse para tener en cuenta la tolerancia de los componentes.'
  de: 'Entspricht der Bahn 2 des Sensors. Das Steuergerät muss die Mindest- und Maximalwerte periodisch neu einspeichern, um die Alterungsphänomene zu berücksichtigen. beim Austausch des Teils müssen die Werte neu eingespeichert werden, um die Toleranz der Bauteile zu berücksichtigen.'
  pl: 'Odpowiada sciezce 2 czujnika. Kalkulator powinien okresowo uczyć się wartości minimum i maksimum tak, aby móc uwzgledniać zjawiska starzenia. w przypadku wymiany części, wartości powinny być ponownie nauczone aby uwzględnić tolerancje komponentów.'
  hu: 'Megfelel az érzékelo 2 csatornájának. A számítóegységnek periódikusan újra meg kell tanulnia a minimális és maximális értékeket, hogy figyelembe veheto legyenek az öregedési jelenségek. alkatrészcsere esetén az értékeket újból meg kell ismertetni, az alkotóelemek türésének figyelembevétele érdekében.'
kind: 'live'
access: 'read'
length: 2

