ioctl: 0x5021
name: 'FUEL_PUMP_RELAY'
display_name:
  en: 'Fuel pump relay'
  fr: 'Relais pompe à carburant'
  es: 'Relé bomba de carburante'
  de: 'Kraftstoffpumpenrelais'
  pl: 'Przekaznik pompy paliwowej'
  hu: 'Üzemanyag-szivattyú relé'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

results:
  CONTROLSTATUS:
    bits: '1.7-1.0'
    type: 'enum'

  CONTROLSTATUSRECORD:
    bits: '2.7-2.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Fuel pump relay'
      fr: 'Relais pompe à carburant'
      es: 'Relé bomba de carburante'
      de: 'Kraftstoffpumpenrelais'
      pl: 'Przekaznik pompy paliwowej'
      hu: 'Üzemanyag-szivattyú relé'
    max_duration_ms: 2000
