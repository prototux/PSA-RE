ioctl: 0x502F
name: 'FUEL_FLOW_REGULATOR'
display_name:
  en: 'Fuel flow regulator'
  fr: 'Régulateur de débit carburant'
  es: 'Regulador de caudal de carburante'
  de: 'Kraftstoffmengenregler'
  pl: 'Regulator przepływu (wydatku) paliwa'
  hu: 'Üzemanyag-hozamszabályzó'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

results:
  CONTROLSTATUS:
    bits: '1.7-1.0'
    type: 'enum'

  CONTROLSTATUSRECORD:
    bits: '2.7-2.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Fuel flow regulator'
      fr: 'Régulateur de débit carburant'
      es: 'Regulador de caudal de carburante'
      de: 'Kraftstoffmengenregler'
      pl: 'Regulator przepływu (wydatku) paliwa'
      hu: 'Üzemanyag-hozamszabályzó'
    max_duration_ms: 2000
