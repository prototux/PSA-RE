ioctl: 0x5032
name: 'EGR_HEAT_EXCHANGER_PASS'
display_name:
  en: 'EGR heat exchanger by-pass'
  fr: 'Bypass de l''échangeur EGR'
  es: 'Bypass del intercambiador EGR'
  de: 'Bypass des Wärmetauschers Abgasrückführung'
  pl: 'By-pass wymiennika EGR'
  hu: 'EGR cserélo bypass'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

results:
  CONTROLSTATUS:
    bits: '1.7-1.0'
    type: 'enum'

  CONTROLSTATUSRECORD:
    bits: '2.7-2.0'
    type: 'enum'

tests:
  - display_name:
      en: 'EGR heat exchanger by-pass'
      fr: 'Bypass de l''échangeur EGR'
      es: 'Bypass del intercambiador EGR'
      de: 'Bypass des Wärmetauschers Abgasrückführung'
      pl: 'By-pass wymiennika EGR'
      hu: 'EGR cserélo bypass'
    max_duration_ms: 2000
