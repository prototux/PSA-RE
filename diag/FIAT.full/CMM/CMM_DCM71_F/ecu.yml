node: 'CMM'
model: 'CMM_DCM71_F'
display_name:
  en: 'Engine control unit (CMM_DCM71_F)'
  fr: 'Calculateur moteur multifonction (CMM_DCM71_F)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x18DA10F1
    response_id: 0x18DAF110
    comment:
      en: '29 bit CAN identifiers'
      fr: 'Identifiants CAN 29 bits'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'
  0x60:
    en: 'Supplier session'
    fr: 'Session fournisseur'

resets:
  0x01:
    en: 'Hard reset'
    fr: 'Réinitialisation matérielle'
  0x02:
    en: 'Key off / on reset'
    fr: 'Réinitialisation coupure / mise du contact'

services: [0x10, 0x11, 0x14, 0x19, 0x22, 0x2E, 0x2F, 0x31]

identification:
  request: '22 F1 A0'
  part_number: '60.7-64.0'
  comment:
    en: 'The ECU part number is in data bytes 60 to 64 of the answer to 22 F1 A0 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 60 à 64 de la réponse à 22 F1 A0 (DCB), elle donne la variante logicielle'

cars: ['X250FL']

variants:
  X250FL_V1:
    parts: ['0001505217']
    cars: ['X250FL']
  X250FL_V2:
    parts: ['0001502B18']
    cars: ['X250FL']
  X250FL_V3:
    parts: ['0001506418']
    cars: ['X250FL']
