did: 0x018D
name: 'TURBOCHARGING_PRESSURE_REFERENCE_VALUE'
display_name:
  en: 'Turbocharging pressure reference value'
  fr: 'Consigne de pression de suralimentation'
  es: 'Consigna de presión de sobrealimentación'
  de: 'Sollwert Ladedruck'
  pl: 'Wartość zadana ciśnienia turbodoładowania'
  hu: 'Töltőnyomás előírt értéke'
comment:
  en: 'This reference value represents the turbocharging pressure that the engine management ECU requires in the air inlet circuit after the turbocharger. The engine management ECU determines the turbocharging pressure according to the requirements of the engine (compliance with the emission control, performance, etc.).'
  fr: 'Cette consigne représente la pression de suralimentation que le calculateur contrôle moteur souhaite dans le circuit d''admission d''air après le turbocompresseur. Le calculateur contrôle moteur détermine la pression de suralimentation en fonction des besoins du moteur (respect de la dépollution, performance, etc).'
  es: 'Esta consigna representa la presión de sobrealimentación que el calculador de control motor desea en el circuito de admisión de aire después del turbocompresor. El calculador de control motor determina la presión de sobrealimentación en función de las necesidades del motor (respecto de la anticontaminación, rendimiento, etc.).'
  de: 'Dieser Sollwert stellt den Ladedruck dar, den das Motorsteuergerät im Lufteinlasssystem nach dem Turbolader wünscht. Das Motorsteuergerät bestimmt den Ladedruck in Abhängigkeit des Motorbedarfs (Einhalten der Abgasnorm, Leistung usw.).'
  pl: 'Ta wartość zadana reprezentuje ciśnienie doładowania, jakie kalkulator sterujący silnikiem chce uzyskać w układzie dolotowym powietrza za turbosprężarką. Kalkulator sterujący silnikiem określa ciśnienie doładowania w funkcji zapotrzebowania silnika (przestrzeganie czystości spalin, osiągi itp.).'
  hu: 'Ezen előírt érték képviseli a feltöltési nyomást, amit a motorvezérlő számítógép kíván a szívócsőben a turbókompresszor után. A motorvezérlő számítógép a motor igényeinek (környezetvédelem betartása, teljesítmény, stb.)függvényében meghatározza a feltöltési nyomást..'
kind: 'live'
access: 'read'
length: 2

params:
  TURBOCHARGING_PRESSURE_REFERENCE_VALUE:
    bits: '1.7-2.0'
    comment:
      en: 'Turbocharging pressure reference value'
      fr: 'Consigne de pression de suralimentation'
      es: 'Consigna de presión de sobrealimentación'
      de: 'Sollwert Ladedruck'
      pl: 'Wartość zadana ciśnienia turbodoładowania'
      hu: 'Töltőnyomás előírt értéke'
    type: 'uint'
    factor: 0.001
    offset: 0.3
    units: 'bar'
