did: 0x0118
name: 'CAMSHAFT_CRANKSHAFT_SYNCHRONISATION'
display_name:
  en: 'Camshaft/crankshaft synchronisation'
  fr: 'Synchronisation arbre à cames / vilebrequin'
  es: 'Sincronización del árbol de levas/cigüeñal'
  de: 'Synchronisierung Nockenwelle / Kurbelwelle'
  pl: 'Synchronizacja wałek rozrządu/wał korbowy'
  hu: 'Vezérmutengely/forgattyús tengely szinkronizálása'
comment:
  en: 'If the status of the synchronisation between the camshaft and the crankshaft is "YES", the camshaft position sensor or the crankshaft position sensor may be faulty. If the status of the synchronisation between the camshaft and the crankshaft is still "NO", the camshaft position sensor and the crankshaft position sensor are faulty.'
  fr: 'Si l''état de la synchronisation entre l''arbre à cames et le vilebrequin est à "OUI", le capteur de position d''arbre à cames ou bien le capteur de postion vilebrequin peut être défectueux. Si l''état de la synchronisation entre l''arbre à cames et le vilebrequin est toujours à "NON", le capteur de position d''arbre à cames et le capteur de position vilebrequin sont défectueux.'
  es: 'Si el estado de la sincronización entre el árbol de levas y el cigüeñal está en "Sí", el captador de posición de árbol de levas o bien el captador de posición cigüeñal pueden presentar un fallo. Si el estado de la sincronización entre el árbol de levas y el cigüeñal está siempre en "No", el captador de posición de árbol de levas y el captador de posición cigüeñal presentan un fallo'
  de: 'Wenn der Synchronisationszustand zwischen der Nockenwelle und der Kurbelwelle auf "JA" ist, kann der Nockenwellenpositionssensor oder der Kurbelwellenpositionssensor defekt sein. Wenn der Synchronisationszustand zwischen der Nockenwelle und der Kurbelwelle immer noch auf "NEIN" ist, sind der Nockenwellenpositionssensor und der Kurbelwellenpositionssensor defekt'
  pl: 'Jeżeli stan synchronizacji między wałkiem rozrządu i wałem korbowym jest na "Tak",czujnik pozycji wałka rozrządu lub czujnik pozycji wału korbowego,mogą być uszkodzone. Jeżeli stan synchronizacji między wałkiem rozrządu i wałem korbowym jest ciągle na "NIE",czujnik pozycji wałka rozrządu lub czujnik pozycji wału korbowego są uszkodzone'
  hu: 'Ha a vezérműtengely és a forgattyústengely közötti szinkronizálás állapota "IGEN", a vezérműtengely helyzetérzékelő vagy pedig a forgattyústengely helyzetérzékelő hibás lehet. Ha a vezérműtengely és a forgattyústengely közötti szinkronizálás állapota még mindig "NEM", a vezérműtengely helyzetérzékelő és a forgattyústengely helyzetérzékelő hibásak.'
kind: 'live'
access: 'read'
length: 1

