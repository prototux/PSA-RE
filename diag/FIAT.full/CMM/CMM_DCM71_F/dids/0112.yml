name: 'INTERNAL_COMBUSTION_ENGINE_STATUS'
display_name:
  en: 'Internal combustion engine status'
  fr: 'État moteur thermique'
  es: 'Estado del motor térmico'
  de: 'Zustand Verbrennungsmotor'
  pl: 'Stan silnika cieplnego'
  hu: 'Belsőégésű motor állapota'
comment:
  en: 'The various statuses are : - Engine switched off / stalled - in preparation - driven starting - autonomous starting - engine running - driven restarting - autonomous restarting'
  fr: 'Les différents états sont : - Moteur coupé / calé - en préparation - démarrage entraîné - démarrage autonome - moteur tournant - redémarrage entraîné - redémarrage autonome'
  es: 'Los diferentes estados son : - Motor cortado/calado - en preparación - arranque movido - arranque autónomo - motor en marcha - re-arranque arrastrado - re-arranque autónomo'
  de: 'Es gibt die folgenden Zustände : - Motor abgestellt / abgestorben - in Vorbereitung - Antrieb anlassen - autonomes Starten - laufender Motor - Neustart mit Anlasser - autonomer Neustart'
  pl: 'Poszczególne stany to : - Silnik wyłączony / zgaszony - w przygotowaniu - rozruch napędzany - rozruch niezależny - przy pracującym silniku - ponowny rozruch pod działaniem układu napędowego - ponowny rozruch niezależny'
  hu: 'A különböző állapotok : - Lekapcsolt/ lefulladt motor - előkészítésben - kényszerített beindítás - önálló indítás - járó motor - újboli beindítás - önálló újraindítás'
kind: 'live'
access: 'read'
length: 2

