did: 0x0188
name: 'MEASURED_AIR_FLOW'
display_name:
  en: 'Measured air flow'
  fr: 'Débit d''air mesuré'
  es: 'Caudal de aire medido'
  de: 'Gemessener Luftdurchsatz'
  pl: 'Zmierzony wydatek powietrza'
  hu: 'Mért levegohozam'
comment:
  en: 'With the engine running, this information should be very close to the setting value for the air flow. Warning when the EGR valve is deactivated intentionally by the engine management ECU (after idling for several minutes for example), the value is no longer the same as the reference value. In the case of an electrical failure, this parameter measurement assumes a fixed recovery value other than 0.'
  fr: 'Moteur tournant, cette information doit être très proche de la valeur de consigne du débit d''air. Attention : lorsque la vanne EGR est volontairement désactivée par le calculateur contrôle moteur (suite à un ralenti pendant plusieurs minutes par exemple), la valeur n''est plus la même que celle de la consigne. En cas de défaillance électrique, cette mesure paramètre prend une valeur figée de recouvrement différente de 0.'
  es: 'Con el motor en funcionamiento, esta información debe acercarse mucho al valor de consigna del caudal de aire. Atención : cuando la válvula EGR es voluntariamente desactivada por el calculador control motor (a continuación de un ralentí durante varios minutos por ejemplo), el valor no es el mismo que el de la consigna. En caso de fallo eléctrico, esta medida parámetro toma un valor fijo de recuperación distinto a 0.'
  de: 'Bei laufendem Motor muss diese Information sehr nahe am Sollwert für die Luftmenge sein. Achtung wenn das EGR-Ventil vom Motorsteuergerät absichtlich deaktiviert wurde (nach einem Leerlauf über einige Minuten z. B.), ist der Wert nicht mehr gleich dem Sollwert. Bei einem elektrischen Defekt nimmt diese Parametermessung einen festgelegten Ersatzwert ungleich 0 an.'
  pl: 'Silnik pracujący, ta informacja powinna być bardzo zbliżona do wartości zadanej wydatku powietrza. Uwaga gdy zawór EGR jest celowo wyłączony przez kalkulator sterujący silnika (na przykład w wyniku pracy silnika na wolnych obrotach przez kilka minut), wartość ta nie jest już taka sama jak wartość zadana. W przypadku niesprawności elektrycznej, ten pomiar parametru przyjmuje wartość stałą różną od 0.'
  hu: 'Járó motornál ezen értéknek a levegőhozam előírt értékhez nagyon közelinek kell lennie. Figyelem amikor a befecskendezés computer szándékosan semlegesíti az EGR szelepet (például egy több perces alapjáratot követően), az érték nem ugyanaz, mint az előírt érték. Elektromos meghibásodás esetén ezen paramétermérés 0-tól eltérő átfedő fix értéket vesz fel.'
kind: 'live'
access: 'read'
length: 2

