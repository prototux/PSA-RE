name: 'TOTAL_WEIGHT_ADDITIVE_DEPOSITED_PARTICLE_FILTER'
display_name:
  en: 'Total weight of additive deposited in the particle filter'
  fr: 'Masse totale d''additif déposée dans le filtre à particules'
  es: 'Masa total de aditivo descargada en el FAP'
  de: 'Gesamtmasse des im FAP befindlichen Additivs'
  pl: 'Całkowita masa dodatku odłożona w FAP'
  hu: 'A részecskeszűrőben lerakódott adalék összes tömege'
comment:
  en: 'The addition of additive to the fuel results in deposits of additive in the particle filter. this value increases in relation to the time and should be close to zero when the particle emission filter is new.'
  fr: 'L''additivation du carburant engendre des dépôts d''additif dans le filtre à particules. Cette valeur augmente en fonction du temps et doit être proche de zéro lorsque le filtre à particules est neuf.'
  es: 'La aditivación del carburante genera restos de aditivo en el filtro de partículas. este valor aumenta según el tiempo y debe estar cerca de cero cuando el filtro a partículas es nuevo.'
  de: 'Die Additivversorgung des Kraftstoffs führt zu Additivablagerungen im Partikelfilter. dieser Wert nimmt mit der Zeit zu und muss bei einem neuen Partikelfilter in etwa Null betragen.'
  pl: 'Domieszkowanie paliwa pociąga za sobą odkładanie się dodatku w filtrze cząstek stałych. ta wartość zwiększa się w funkcji czasu i musi być zbliżona do zera, gdy filtr cząstek stałych jest nowy.'
  hu: 'A tüzelőanyag adalékolása adaléklerakódásokat erdeményez a részecskeszűrőben. ez az érték idővel nő és nullához közelinek kell lennie az új részecskeszűrő esetén.'
