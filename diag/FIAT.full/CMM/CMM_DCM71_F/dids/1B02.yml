    type: 'bool'
    values:
      0x00:
        en: 'Stopping not authorised'
        fr: 'Arrêt non autorisé'
        es: 'Parada no autorizada'
        de: 'Abstellen nicht freigegeben'
        pl: 'Zatrzymanie nie autoryzowane'
        hu: 'Nem engedélyezett leállás'
      0x01:
        en: 'Stopping authorised'
        fr: 'Arrêt autorisé'
        es: 'Parada autorizada'
        de: 'Abstellen freigegeben'
        pl: 'Zatrzymanie autoryzowane'
        hu: 'Engedélyezett leállás'

  REQUEST_RESTARTING_SENT_BSI_ECU:
    bits: '2.2'
    comment:
      en: 'Request for restarting sent by the BSI ECU'
      fr: 'Demande de redémarrage émise par le calculateur boîtier de servitude intelligent'
