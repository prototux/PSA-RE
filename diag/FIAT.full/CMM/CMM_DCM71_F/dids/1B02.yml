    type: 'bool'
    values:
      0x00:
        en: 'Restarting not authorised'
        fr: 'Redémarrage non autorisé'
        es: 'Rearranque no autorizado'
        de: 'Neustart nicht freigegeben'
        pl: 'Ponowny rozruch niedozwolony'
        hu: 'Újraindítás nem engedélyezett'
      0x01:
        en: 'Restarting authorised'
        fr: 'Redémarrage autorisé'
        es: 'Rearranque autorizado'
        de: 'Neustart freigegeben'
        pl: 'Ponowny rozruch dozwolony'
        hu: 'Újraindítás engedélyezett'
