        fr: 'Moteur à l''arrêt'
        es: 'Motor parado'
        de: 'Stehender Motor'
        pl: 'Silnik wyłączony'
        hu: 'Álló motor'
      0x01:
        en: 'Starting of the engine'
        fr: 'Démarrage du moteur'
        es: 'Poner en marcha el motor'
        de: 'Anlassen des Motors'
        pl: 'Uruchomienie silnika'
        hu: 'Motor indítása'

