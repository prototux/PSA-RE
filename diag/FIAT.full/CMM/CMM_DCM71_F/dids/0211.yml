did: 0x0211
name: 'OPENING_CYCLIC_RATIO_EGR_VALVE_CONTROL'
display_name:
  en: 'Opening cyclic ratio of the EGR valve control'
  fr: 'Rapport cyclique d''ouverture de la commande de la vanne EGR'
  es: 'Relación cíclica de apertura del mando de la válvula EGR'
  de: 'Taktverhältnis der Ansteuerung des Abgasrückführungsventils'
  pl: 'Cykliczny stosunek otwarcia sterowania zaworu EGR'
  hu: 'Az EGR szelep vezérlés ciklikus nyitási aránya'
comment:
  en: 'The opening cyclic ratio reflects the electric control by the engine management ECU. In certain cases, the percentage does not correspond to the position reference value. The value may be positive or negative (for the opening and closing).'
  fr: 'Le rapport cyclique d''ouverture reflète le pilotage électrique par le calculateur contrôle moteur. Dans certains cas, le pourcentage ne correspond pas à la consigne de position. La valeur peut être positive ou négative (pour les ouvertures et fermetures).'
  es: 'La relación cíclica de apertura refleja el pilotaje eléctrico a través del calculador de control motor. En algunos casos, el porcentaje no corresponde a la consigna de posición. El valor puede ser positivo o negativo (para las aperturas y cierres).'
  de: 'Das Taktverhältnis gibt die elektrische Ansteuerung durch das Motorsteuergerät wieder. In bestimmten Fällen entspricht der Prozentsatz nicht dem Positionssollwert. Der Wert kann positiv oder negativ sein (für Öffnen und Schließen).'
  pl: 'Cykliczny stosunek otwarcia odzwierciedla sterowanie elektryczne przez kalkulator sterujący silnikiem. W pewnych przypadkach, wartość procentowa nie odpowiada zadanej wartości położenia. Wartość może być dodatnia lub ujemna (dla otwierania i zamykania).'
  hu: 'A ciklikus nyitási arány tükrözi a motorvezérlő számítógép általi elektromos vezérlést. Bizonyos esetben, a százalékos arány nem felel meg a helyzet előírt értéknek. Az érték lehet negatív vagy pozitív (a nyitások és zárások számára).'
kind: 'live'
access: 'read'
length: 2

