did: 0x0146
name: 'FUEL_PRESSURE_MEASURED_HIGH_PRESSURE_RAIL'
display_name:
  en: 'Fuel pressure measured in the high pressure rail'
  fr: 'Pression de carburant mesurée dans la rampe haute pression'
  es: 'Presión de carburante medido en la rampa de alta presión'
  de: 'In der Hochdruck-Einspritzleiste (Rail) gemessener Kraftstoffdruck'
  pl: 'Ciśnienie paliwa zmierzone w kolektorze wysokiego ciśnienia'
  hu: 'A nagynyomású elosztócsőben mért tüzeloanyag-nyomás'
comment:
  en: 'This value corresponds to the measurement seen by the engine management ECU using the fuel high pressure sensor. This value must be fairly close to the reference value.'
  fr: 'Cette valeur correspond à la mesure vue par le calculateur contrôle moteur à l''aide du capteur haute pression carburant. Cette valeur doit être assez proche de la consigne.'
  es: 'Este valor corresponde a la medida vista por el calculador de control motor mediante el captador de alta presión carburante. Este valor debe aproximarse bastante a la consigna.'
  de: 'Dieser Wert entspricht der vom Motorsteuergerät mithilfe des Kraftstoffhochdruckfühlers erkannten Messung. Dieser Wert muss nahe am Sollwert sein.'
  pl: 'Ta wartość odpowiada wynikowi pomiaru widzianemu przez kalkulator sterujący silnikiem przy użyciu czujnika wysokiego ciśnienia paliwa. Ta wartość powinna być dosyć bliska wartości zadanej.'
  hu: 'Ezen érték a motorvezérlő számítógép által a nagynyomású tüzelőanyag érzékelő segítségével látott mérésnek felel meg. Ez az érték az utasítás értékéhez nagyon közeli kell, hogy legyen.'
kind: 'live'
access: 'read'
length: 2

