did: 0x0210
name: 'EGR_VALVE_POSITION_INSTRUCTIONS'
display_name:
  en: 'EGR valve position instructions'
  fr: 'Consigne de position de la vanne EGR'
  es: 'Consigna de posición de la válvula EGR'
  de: 'Einstellung der Stellung des Abgasrückführungs-Magnetventils'
  pl: 'Wartość zadana położenia zaworu EGR'
  hu: 'Kipufogógáz-visszavezetés (EGR) szelep helyzetének előírt értéke'
comment:
  en: 'To check the emission control of the engine, the engine management ECU determines a position which the EGR valve must adopt in order for the level of recirculation of the gas to be correct'
  fr: 'Pour contrôler la dépollution du moteur, le calculateur contrôle moteur détermine une position que la vanne EGR doit prendre pour que la recirculation des gaz soit à un niveau correct'
  es: 'Para controlar la anticontaminación del motor, el calculador de control motor determina una posición que la válvula EGR debe tomar para que la recirculación de los gases esté al nivel correcto'
  de: 'Um die Abgasbehandlung des Motors zu kontrollieren, bestimmt das Motorsteuergerät eine Position, die das Abgasrückführungsventil einnehmen muss, damit sich die Abgasrückführung auf einem korrekten Niveau befindet'
  pl: 'Aby kontrolować czystość spalin silnika, kalkulator sterujący silnikiem określa położenie, jakie zawór EGR musi przyjąć, aby recyrkulacja spalin była na prawidłowym poziomie'
  hu: 'A motor környezetvédelmének ellenőrzéséhez a motorvezérlő számítógép meghatároz egy helyzetet, amit az EGR szelepnek fel kell vennie, hogy a gáz visszavezetése egy megfelelő szintű legyen'
kind: 'live'
access: 'read'
length: 2

