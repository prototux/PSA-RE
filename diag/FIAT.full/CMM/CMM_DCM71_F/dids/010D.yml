did: 0x010D
name: 'COOLANT_TEMPERATURE_REFERENCE_VALUE'
display_name:
  en: 'Coolant temperature reference value'
  fr: 'Consigne de température d''eau'
  es: 'Consigne de temperatura del agua'
  de: 'Kühlmitteltemperatur-Sollwert'
  pl: 'Wartość zadana temperatury płynu chłodzącego'
  hu: 'Vízhőmérséklet előírt értéke'
comment:
  en: 'Engine cooling system coolant temperature. The engine is hot above 70°C. if the temperature becomes too high, the ECU activates the cooling fan to aid cooling.'
  fr: 'Température d''eau du circuit de refroidissement moteur. Le moteur est chaud au-delà de 70°C. Lorsque la température est trop élevée, le calculateur active le groupe motoventilateur afin d''aider le refroidissement.'
  es: 'Temperatura del agua del circuito de refrigeración motor. El motor está caliente por encima de 70°C. Cuando la temperatura es demasiado elevada, el calculador activa el grupo motoventilador con el fin de ayuda a la refrigeración.'
  de: 'Kühlmitteltemperatur des Motorkühlsystems. Der Motor ist bei über 70°C betriebswarm. Wenn die Temperatur zu hoch ist, aktiviert das Steuergerät die Kühlerventilatorgruppe, um die Kühlung zu unterstützen.'
  pl: 'Temperatura płynu układu chłodzenia silnika. Silnik jest gorący powyżej 70°. Gdy temperatura jest za wysoka, kalkulator włącza zespół wentylatora chłodnicy w celu zwiększenia chłodzenia.'
  hu: 'Motor hűtőkör vizének hőmérséklete. A motor 70°C-on túl meleg. Amikor a hőmérséklet a túlságosan magas, a computer aktiválja a motorhűtő-ventilátor egységet a hűtés segítése érdekében.'
kind: 'live'
access: 'read'
length: 1

params:
  COOLANT_TEMPERATURE_REFERENCE_VALUE:
