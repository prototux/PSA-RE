ioctl: 0x5029
name: 'PRE_POST_HEATING_RELAY'
display_name:
  en: 'Pre-post heating relay'
  fr: 'Relais pré-postchauffage'
  es: 'Relé pre-post calentamiento'
  de: 'Relais Vorglühen mit Abschaltverzögerung'
  pl: 'Przekaźnik wstępnego-przedłużonego włączenia świec żarowych'
