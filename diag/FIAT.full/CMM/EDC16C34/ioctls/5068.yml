ioctl: 0x5068
name: 'EXHAUST_GAS_RECYCLING_VALVE'
display_name:
  en: 'Exhaust gas recycling valve'
  fr: 'Vanne recyclage des gaz d''échappement'
  es: 'Válvula de reciclaje de los gases de escape'
  de: 'Abgasrückführungsventil'
  pl: 'Zawór recyrkulacji spalin'
  hu: 'Kipufogó gázok visszakeringtető szelep'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Exhaust gas recycling valve'
      fr: 'Vanne recyclage des gaz d''échappement'
      es: 'Válvula de reciclaje de los gases de escape'
      de: 'Abgasrückführungsventil'
      pl: 'Zawór recyrkulacji spalin'
      hu: 'Kipufogó gázok visszakeringtető szelep'
    max_duration_ms: 5000
