did: 0x193D
name: 'AIR_FLOW_SETTING'
display_name:
  en: 'Air flow setting'
  fr: 'Consigne débit d''air'
  es: 'Consigna caudal de aire'
  de: 'Luftdurchsatzeinstellung'
  pl: 'Zalecony wydatek powietrza'
  hu: 'Kért levegohozam'
comment:
  en: 'Air flow to the reached in the intake manifold for control of the EGR valve. It determines the quantity of air according to the requirements of the engine (observance of emission control, performance, etc.).'
  fr: 'Débit d''air à atteindre dans la tubulure d''admission pour le pilotage de la vanne EGR. Il détermine la quantité d''air en fonction des besoins du moteur (respect de la dépollution, performance,...).'
  es: 'Caudal de aire a alcanzar en el colector de admisión para el pilotaje de la válvula EGR. Determina la cantidad de aire en función de las necesidades del motor (respeto de la descontaminación, rendimiento...).'
  de: 'Luftdurchsatz-Sollwert im Saugrohr für die Steuerung des Abgasrückführungsventils. Bestimmt die Luftmenge in Abhängigkeit von den Bedürfnissen des Motors (Einhaltung der Abgasnorm, Leistung,...).'
  pl: 'Wymagany wydatek powietrza w króćcu wlotowym do sterowania zaworem EGR. Określa ilość powietrza w zależności od potrzeb silnika (przestrzeganie czystości spalin, osiągi...).'
  hu: 'A szívócsoben létrehozandó levegohozam a kipufogógáz-visszavezetés (EGR) szelep vezérléséhez. Ez a motor igényeinek függvényében meghatározza a levegő mennyiségét (teljesítmény, környezetvédelem betartása,...).'
kind: 'live'
access: 'read'
length: 2

params:
  AIR_FLOW_SETTING:
    bits: '1.7-2.0'
    comment:
      en: 'Air flow setting'
      fr: 'Consigne débit d''air'
      es: 'Consigna caudal de aire'
      de: 'Luftdurchsatzeinstellung'
      pl: 'Zalecony wydatek powietrza'
      hu: 'Kért levegohozam'
    type: 'uint'
    factor: 0.5
    offset: -200
    units: 'mg/stroke'
