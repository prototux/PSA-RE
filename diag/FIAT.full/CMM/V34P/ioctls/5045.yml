results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Motorised throttle'
      fr: 'Papillon motorisé'
      es: 'Mariposa motorizada'
      de: 'Motorisierte Drosselklappe'
      pl: 'Przepustnica zmechanizowana'
      hu: 'Motoros pillangószelep'
    max_duration_ms: 10000
