ioctl: 0x5021
name: 'UPSTREAM_OXYGEN_SENSOR_HEATER'
display_name:
  en: 'Upstream oxygen sensor heater'
  fr: 'Chauffage sonde à oxygène amont'
  es: 'Calentamiento sonda de oxígeno anterior'
  de: 'Beheizung Eintritts-Lambda-Sonde'
  pl: 'Podgrzewanie sondy lambda przód'
  hu: 'Első lambda-szonda fűtés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Upstream oxygen sensor heater'
      fr: 'Chauffage sonde à oxygène amont'
      es: 'Calentamiento sonda de oxígeno anterior'
      de: 'Beheizung Eintritts-Lambda-Sonde'
      pl: 'Podgrzewanie sondy lambda przód'
      hu: 'Első lambda-szonda fűtés'
    max_duration_ms: 10000
