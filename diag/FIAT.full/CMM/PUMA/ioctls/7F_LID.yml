ioctl: 0x7F
name: 'FUEL_FLOW_REGULATOR'
display_name:
  en: 'Fuel flow regulator'
  fr: 'Régulateur de débit carburant'
  es: 'Regulador de caudal de carburante'
  de: 'Kraftstoffmengenregler'
  pl: 'Regulator przepływu (wydatku) paliwa'
  hu: 'Üzemanyag-hozamszabályzó'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER_DEACTIVATE:
    bits: '1.7-1.0'
    type: 'uint'
    default: 0x00

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x03:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x04:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Fuel flow regulator'
      fr: 'Régulateur de débit carburant'
      es: 'Regulador de caudal de carburante'
      de: 'Kraftstoffmengenregler'
      pl: 'Regulator przepływu (wydatku) paliwa'
      hu: 'Üzemanyag-hozamszabályzó'
    max_duration_ms: 5000
  - display_name:
      en: 'High pressure circuit pressurisation test'
      fr: 'Test de mise en pression du circuit haute pression'
      es: 'Test de puesta en presión del circuito de alta presión'
      de: 'Test Druckbeaufschlagung Hochdrucksystem'
      pl: 'Próba ciśnieniowa obwodu wysokiego ciśnienia'
      hu: 'Nagynyomású kör nyomás alá helyezési teszt'
    max_duration_ms: 5000
  - display_name:
      en: 'Engine temperature warning light'
      fr: 'Voyant de température moteur'
      es: 'Testigo de temperatura motor'
      de: 'Warnleuchte Motor-Temperatur'
      pl: 'Kontrolka temperatury silnika'
      hu: 'Motorhőmérséklet visszajelzés'
    max_duration_ms: 1000
  - display_name:
