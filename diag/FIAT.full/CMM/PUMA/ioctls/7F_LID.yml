      fr: 'Commande voyant Warning (MIL)'
      es: 'Mando testigo Warning (MIL)'
      de: 'Steuerung Warnleuchte (MIL)'
      pl: 'Sterowanie kontrolki Warning (MIL)'
      hu: 'Warning (MIL) visszajelzés vezérlése'
