lid: 0x38
name: 'ENGINE_STATUS'
display_name:
  en: 'Engine status'
  fr: 'État moteur'
  es: 'Estado motor'
  de: 'Zustand Motor'
  pl: 'Stan silnika'
  hu: 'Motor állapota'
comment:
  en: 'Current status of the engine The possible statuses are: engine stopped, engine under starter, engine at idle, engine running, engine acceleration, engine deceleration, engine stalled.'
  fr: 'État dans lequel se trouve le moteur Les états possibles sont : moteur à l''arrêt, moteur sous démarreur, moteur au ralenti, moteur tournant, accélération moteur, décélération moteur, moteur calé.'
  es: 'Estado en el que se encuentra el motor Los estados posibles son: motor parado, motor bajo motor de arranque, motor a ralentí, motor en marcha, aceleración motor, deceleración motor, motor calado.'
  de: 'Betriebszustand des Motors Die möglichen Zustände sind: Motor abgestellt, Motor unter Anlasser, Motor im Leerlauf, laufender Motor, Beschleunigung Motor, Verzögerung Motor, Motor abgestorben.'
  pl: 'Stan, w jakim znajduje się silnik Możliwe stany są : silnik nie pracuje, silnik napędzany rozrusznikiem, silnik na biegu jałowym, przy pracującym silniku, przyspieszenie silnika, zwalnianie silnika, silnik gaśnie.'
  hu: 'Az állapot, amelyben a motor található A lehetséges helyzetek a következőek : álló motornál, motor indítózás alatt, motor alapjáraton, járó motor, motor gyorsulása, motor lassulása, motor lefulladt.'
kind: 'live'
access: 'read'
length: 1

