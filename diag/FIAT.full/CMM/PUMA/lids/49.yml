  de: 'Eingelegter Gang des Getriebes. Die möglichen Zustände sind: Neutral, Erster Gang oder Rückwärtsgang, 2., 3., 4., 5., 6..'
  pl: 'Wybrane przełożenie skrzyni biegów. Możliwe stany są : Neutralny, pierwszy bieg albo bieg wsteczny, 2-gi, 3-ci, 4-ty, 5-ty, 6 ..'
  hu: 'Sebességváltó kapcsolt fokozata. A lehetséges helyzetek a következőek : Semleges, elso sebesség vagy hátramenet, Második, Harmadik, Negyedik, Ötödik, 6 . dik.'
