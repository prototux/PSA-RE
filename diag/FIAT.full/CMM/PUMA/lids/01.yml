lid: 0x01
name: 'IMMOBILISER_STATE'
display_name:
  en: 'Immobiliser state'
  fr: 'Etat antidémarrage'
  es: 'Estado antiarranque'
  de: 'Zustand Wegfahrsperre'
  pl: 'Stan blokady rozruchu'
  hu: 'Indításgátló állapot'
comment:
  en: 'Current status of the engine management ECU and engine immobiliser function the various statuses are: Unlocked, Virgin ECU, ECU locked, The ECU has received the universal code, Engine immobiliser temporarily deactivated, Key code incorrect, Code not recognised, No code received.'
  fr: 'État dans lequel se trouve le calculateur contrôle moteur et la fonction antidémarrage les différent états sont : Déverrouillé, Calculateur vierge, Calculateur verrouillé, Le calculateur a reçu le code universel, Antidémarrage temporairement désactivé, Code clé erroné, Code inconnu, Pas de code reçu.'
  es: 'Estado en el que se encuentra el calculador control motor y la función antiarranque los diferentes estados son : Desbloqueo, Calculador virgen, Calculador bloqueado, El calculador ha recibido el código confidencial, Antiarranque temporalmente desactivado, Código llave erróneo, Código desconocido, No hay código recibido.'
  de: 'Zustand des Motor-Steuergeräts und der Wegfahrsperrenfunktion die verschiedenen Zustände sind: entsperrt, unprogrammiertes Steuergerät, gesperrtes Steuergerät, Steuergerät hat den Universalcode empfangen, Wegfahrsperre vorübergehend deaktiviert, falscher Schlüsselcode, unbekannter Code, kein Code empfangen.'
  pl: 'Stan, w jakim znajduje się kalkulator kontroli silnika i funkcja blokady rozruchu poszczególne stany to: Odblokowany, Pusty kalkulator, Kalkulator zablokowany, Kalkulator odebrał kod uniwersalny, Blokada rozruchu chwilowo wyłączona, błędny kod klucza, Kod nieznany, Brak odebranego kodu.'
  hu: 'Az állapot, amelyben található a befecskendezés-computer és az indításgátló funkció a különböző állapotok a következők : Kireteszelt, Kódolatlan computer, Reteszelt computer, A computer megkapta az univerzális kódot, Ideiglenesen semlegesített indításgátlás , Hibás kulcskód, Ismeretlen kód, Nincs vett kód.'
kind: 'live'
access: 'read'
length: 1

