lid: 0x4B
name: 'LID_4B'
display_name:
  en: 'Data record 0x4B (2 values)'
  fr: 'Enregistrement 0x4B (2 valeurs)'
kind: 'live'
access: 'read'
length: 1

params:
  AIR_CONDITIONING_REQUESTS:
    bits: '1.0'
    comment:
      en: 'Air conditioning requests'
      fr: 'Demandes climatisation'
      es: 'Peticiones climatización'
      de: 'Anforderungen Klimaanlage'
      pl: 'Żądania klimatyzacji'
      hu: 'Klimatizálási kérések'
    type: 'bool'
    values:
      0x00:
        en: 'NO'
        fr: 'NON'
        es: 'NO'
        de: 'NEIN'
        pl: 'NIE'
        hu: 'NEM/NINCS'
      0x01:
        en: 'Yes'
        fr: 'Oui'
        es: 'Sí'
        de: 'Ja'
        pl: 'Tak'
        hu: 'Igen'

  AIR_CONDITIONING_RELAY:
    bits: '1.1'
    comment:
      en: 'Air conditioning relay'
      fr: 'Relais climatisation'
      es: 'Relé de climatización'
      de: 'Relais Klimaanlage'
      pl: 'Przekaźnik klimatyzacji'
      hu: 'Légkondicionáló reléje'
    type: 'bool'
    values:
      0x00:
        en: 'Inactive'
        fr: 'Inactif'
        es: 'Inactivo'
        de: 'Inaktiv'
        pl: 'Nieaktywny'
        hu: 'Nem muködik'
      0x01:
        en: 'Active'
        fr: 'Actif'
        es: 'Activo'
        de: 'Aktiv'
        pl: 'Aktywny'
        hu: 'Aktív'

alternatives:
  - note:
      en: 'Other reading of the same bytes (both are given by the observations)'
      fr: 'Autre lecture des mêmes octets (les deux sont données par les observations)'
    params:
      STATE_COOLING_CIRCUIT_PRESSURE:
        bits: '1.7-1.0'
        comment:
          en: 'State-cooling circuit pressure'
          fr: 'État-pression du circuit réfrigération'
          es: 'Estado-presión del circuito refrigeración'
          de: 'Zustand-Kaeltemitteldruck'
          pl: 'Stan-ciśnienie w układzie klimatyzacji'
          hu: 'Állapot-a hutokör nyomása'
        type: 'uint'
