name: 'CONDITION_NEUTRAL_SENSOR'
display_name:
  en: 'Condition of the neutral sensor'
  fr: 'Etat du capteur point mort'
  es: 'Estado del captador punto muerto'
  de: 'Zustand des Totpunktgebers'
  pl: 'Stan czujnika położenia luz'
  hu: 'Holtponti érzékelő állapota'
comment:
  en: 'This parameter should only be taken into account on manual gearboxes. The parameter should take the value True when the lever is in neutral'
  fr: 'Ce paramètre n''est à prendre en compte que sur les boîtes de vitesses manuelles. Le paramètre doit prendre la valeur Vrai lorsque le levier est au point mort'
  es: 'Este parámetro solo se debe tener en cuenta en las cajas de velocidades manuales. El parámetro debe adoptar el valor Real cuando la palanca está en punto muerto'
  de: 'Dieser Parameter braucht nur bei Schaltgetrieben beachtet zu werden. Der Parameter muss den Wert Wahr annehmen, wenn sich der Hebel in Neutralstellung befindet'
  pl: 'Ten parametr należy brać pod uwagę tylko w przypadku manualnych skrzyń biegów. Parametr powinien przyjąć wartość "Prawda" kiedy dźwignia jest w martwym punkcie (a "luzie")'
  hu: 'Ezen paraméter csupán a mechanikus sebességváltókon veendő figyelembe. A paraméternek a Vrai értéket kell felvennie amikor a kar holtponti helyzetben van'
