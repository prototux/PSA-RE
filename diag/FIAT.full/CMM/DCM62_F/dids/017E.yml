did: 0x017E
name: 'TURBOCHARGING_PRESSURE_MEASURED'
display_name:
  en: 'Turbocharging pressure measured'
  fr: 'Pression de suralimentation mesurée'
  es: 'Presión de sobrealimentación medida'
  de: 'Gemessener Ladedruck'
  pl: 'Mierzone cisnienie doladowania'
  hu: 'Mért töltőnyomás'
comment:
  en: 'This parameter indicates the pressure measured at the air inlet circuit. The value should be close to the reference value. In the case of an electrical failure, this parameter measurement assumes a fixed recovery value other than 0'
  fr: 'Ce paramètre indique la pression mesurée au niveau du circuit d''admission d''air. La valeur doit être proche de la consigne. En cas de défaillance électrique, cette mesure paramètre prend une valeur figée de recouvrement différente de 0'
  es: 'Este parámetro indica la presión medida a nivel del circuito de admisión de aire. El valor debe situarse en torno a la consigna. En caso de fallo eléctrico, esta medida parámetro toma un valor fijo de recuperación distinto a 0'
  de: 'Dieser Parameter gibt den am Lufteinlasssystem gemessenen Druck an. Der Wert muss nahe am Sollwert sein. Bei einem elektrischen Defekt nimmt diese Parametermessung einen festgelegten Ersatzwert ungleich 0 an'
  pl: 'Ten parametr wskazuje ciśnienie mierzone w obrębie układu dolotowego powietrza. Wartość musi być zbliżona do wartości zadanej. W przypadku niesprawności elektrycznej, ten pomiar parametru przyjmuje wartość stałą różną od 0'
  hu: 'Ezen paraméter jelzi a levegő szívókörben mért nyomást. Az érték az előírthoz közeli kell legyen. Elektromos meghibásodás esetén ezen paramétermérés 0-tól eltérő átfedő fix értéket vesz fel'
kind: 'live'
access: 'read'
length: 2

