comment:
  en: 'In the case of an electrical failure, this parameter measurement assumes a fixed recovery value other than 0 please note : The value does not exceed 6 litres even if the urea reservoir is full'
  fr: 'En cas de défaillance électrique, cette mesure paramètre prend une valeur figée de recouvrement différente de 0 attention : La valeur ne dépasse pas les 6 litres même si le réservoir d''urée est plein'
  es: 'En caso de fallo eléctrico, esta medida parámetro toma un valor fijo de recuperación distinto a 0 atención : El valor no supera los 6 litros incluso aunque el depósito de urea esté lleno'
  de: 'Bei einem elektrischen Defekt nimmt diese Parametermessung einen festgelegten Ersatzwert ungleich 0 an vorsicht : Der Wert übersteigt nicht die 6 Liter, auch wenn der Harnstofftank voll ist'
  pl: 'W przypadku niesprawności elektrycznej, ten pomiar parametru przyjmuje wartość stałą różną od 0 uwaga : Wartość nie przekracza 6 litrów, nawet jeżeli zbiornik mocznika jest pełny'
  hu: 'Elektromos meghibásodás esetén ezen paramétermérés 0-tól eltérő átfedő fix értéket vesz fel figyelem : Az érték nem lépi túl a 6 litert még akkor sem, amikor az AdBlue-adalék tartály tele van'
