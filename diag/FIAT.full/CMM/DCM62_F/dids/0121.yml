did: 0x0121
name: 'AIR_CONDITIONING_CIRCUIT_PRESSURE'
display_name:
  en: 'Air conditioning circuit pressure'
  fr: 'Pression du circuit de climatisation'
  es: 'Presión del circuito de climatización'
  de: 'Kältemitteldruck der Klimaanlage'
  pl: 'Ciśnienie obwodu klimatyzacji'
  hu: 'Klímakör nyomása'
comment:
  en: 'Pressure measured by the engine management ECU by means of the sensor in the refrigerant circuit. In the case of an electrical failure, this parameter measurement assumes a fixed recovery value other than 0'
  fr: 'Pression mesurée par le calculateur contrôle moteur grâce au capteur dans le circuit de fluide réfrigérant. En cas de défaillance électrique, cette mesure paramètre prend une valeur figée de recouvrement différente de 0'
  es: 'Presión medida por el calculador control motor gracias al captador en el circuito de fluido de refrigeración. En caso de fallo eléctrico, esta medida parámetro toma un valor fijo de recuperación distinto a 0'
  de: 'Vom Motorsteuergerät über den Sensor im Kühlmittelsystem gemessener Druck. Bei einem elektrischen Defekt nimmt diese Parametermessung einen festgelegten Ersatzwert ungleich 0 an'
  pl: 'Ciśnienie zmierzone przez kalkulator sterujący silnika dzięki czujnikowi w układzie czynnika chłodniczego. W przypadku niesprawności elektrycznej, ten pomiar parametru przyjmuje wartość stałą różną od 0'
  hu: 'A befecskendezés-computer által mért nyomás a hűtőközeg-körben lévő érzékelőnek köszönhetően. Elektromos meghibásodás esetén ezen paramétermérés 0-tól eltérő átfedő fix értéket vesz fel'
kind: 'live'
access: 'read'
length: 2

params:
