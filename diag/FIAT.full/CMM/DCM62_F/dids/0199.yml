      de: 'Vom Nockenwellensensor gelieferte Motordrehzahl'
      pl: 'Prędkość obrotowa silnika pochodząca od czujnika wałka rozrządu'
      hu: 'Vezérműtengely-érzékelőtől származó motorfordulatszám'
    type: 'uint'
