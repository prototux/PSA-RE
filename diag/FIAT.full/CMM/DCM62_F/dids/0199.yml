did: 0x0199
name: 'ENGINE_SPEED_CAMSHAFT_SENSOR'
display_name:
  en: 'Engine speed from the camshaft sensor'
  fr: 'Régime moteur issu du capteur d''arbre à cames'
  es: 'Régimen motor procedente del calculador del árbol de levas'
  de: 'Vom Nockenwellensensor gelieferte Motordrehzahl'
  pl: 'Prędkość obrotowa silnika pochodząca od czujnika wałka rozrządu'
  hu: 'Vezérműtengely-érzékelőtől származó motorfordulatszám'
comment:
  en: 'This parameter corresponds to the engine speed seen by the engine management ECU by means of the information from the sensor In the case of an electrical failure, this parameter measurement assumes a fixed recovery value other than 0'
  fr: 'Ce paramètre correspond au régime moteur vu par le calculateur contrôle moteur grâce à l''information du capteur En cas de défaillance électrique, cette mesure paramètre prend une valeur figée de recouvrement différente de 0'
  es: 'Este parámetro corresponde al régimen motor visto por el calculador de control motor gracias a la información del captador En caso de fallo eléctrico, esta medida parámetro toma un valor fijo de recuperación distinto a 0'
  de: 'Dieser Parameter entspricht der vom Motorsteuergerät dank der Information des Sensors erkannten Motordrehzahl Bei einem elektrischen Defekt nimmt diese Parametermessung einen festgelegten Ersatzwert ungleich 0 an'
  pl: 'Ten parametr odpowiada obrotom silnika widzianym przez kalkulator sterujący silnikiem dzięki informacji czujnika W przypadku niesprawności elektrycznej, ten pomiar parametru przyjmuje wartość stałą różną od 0'
  hu: 'Ezen paraméter a motorvezérlő számítógép érzékelő információjának köszönhetően látott motorfordulatszámnak felel meg Elektromos meghibásodás esetén ezen paramétermérés 0-tól eltérő átfedő fix értéket vesz fel'
kind: 'live'
access: 'read'
length: 2

params:
  ENGINE_SPEED_CAMSHAFT_SENSOR:
