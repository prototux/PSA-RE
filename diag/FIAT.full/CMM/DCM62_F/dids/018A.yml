did: 0x018A
name: 'OPENING_CYCLIC_RATIO_TURBOCHARGER_CONTROL'
display_name:
  en: 'Opening cyclic ratio of the turbocharger control'
  fr: 'Rapport cyclique d''ouverture de la commande du turbocompresseur'
  es: 'Relación cíclica de apertura del mando del turbocompresor'
  de: 'Taktverhältnis Betätigung Turbolader'
  pl: 'Cykliczny stosunek otwarcia sterowania turbosprężarki'
  hu: 'A turbókompresszor vezérlésének RCO értéke'
comment:
  en: 'The opening cyclic ratio reflects the electric control by the engine management ECU. this control is applied to the vacuum circuit solenoid valve. In certain cases, the percentage does not correspond to the position reference value. the value can only be positive.'
  fr: 'Le rapport cyclique d''ouverture reflète le pilotage électrique par le calculateur contrôle moteur. ce pilotage est appliqué à l''électrovanne du circuit de vide. Dans certains cas, le pourcentage ne correspond pas à la consigne de position. la valeur ne peut être que positive.'
  es: 'La relación cíclica de apertura refleja el pilotaje eléctrico a través del calculador de control motor. este pilotaje se aplica a la electroválvula del circuito de vacío. En algunos casos, el porcentaje no corresponde a la consigna de posición. el valor no puede ser positivo.'
  de: 'Das Taktverhältnis gibt die elektrische Ansteuerung durch das Motorsteuergerät wieder. diese Steuerung wird am Elektroventil des Unterdrucksystems angewendet. In bestimmten Fällen entspricht der Prozentsatz nicht dem Positionssollwert. der Wert kann nur positiv sein.'
  pl: 'Cykliczny stosunek otwarcia odzwierciedla sterowanie elektryczne przez kalkulator sterujący silnikiem. to sterowanie stosowane jest dla elektrozaworu układu podciśnienia. W pewnych przypadkach, wartość procentowa nie odpowiada zadanej wartości położenia. wartość może być wyłącznie dodatnia.'
  hu: 'A ciklikus nyitási arány tükrözi a motorvezérlő számítógép általi elektromos vezérlést. ez a vezérlés a vákuumkör mágneszelepén kerül alkalmazásra. Bizonyos esetben, a százalékos arány nem felel meg a helyzet előírt értéknek. az érték csak pozitív lehet.'
kind: 'live'
access: 'read'
length: 2

