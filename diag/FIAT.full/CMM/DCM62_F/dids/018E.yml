did: 0x018E
name: 'AIR_FLOW_REFERENCE_VALUE'
display_name:
  en: 'Air flow reference value'
  fr: 'Consigne de débit d''air'
  es: 'Cosigna de caudal de aire'
  de: 'Luftdurchsatz-Sollwert'
  pl: 'Wartość zadana wydatku powietrza'
  hu: 'Levegőhozam előírt érték'
comment:
  en: 'This reference value represents the quantity of fresh air that the engine management ECU requires in the air inlet circuit. The engine management ECU determines the quantity of air according to the requirements of the engine (compliance with the emission control, performance, etc.)'
  fr: 'Cette consigne représente la quantité d''air frais que le calculateur contrôle moteur souhaite dans le circuit d''admission d''air. Le calculateur contrôle moteur détermine la quantité d''air en fonction des besoins du moteur (respect de la dépollution, performance, etc)'
  es: 'Esta consigna representa la cantidad de aire fresco que el calculador de control motor desea en el circuito de admisión de aire. El calculador de control motor determina la cantidad de aire en función de las necesidades del motor (respeto de la anticontaminación, rendimiento, etc.)'
  de: 'Dieser Sollwert stellt die Frischluftmenge dar, die das Motorsteuergerät im Lufteinlasssystem wünscht. Das Motorsteuergerät bestimmt die Luftmenge in Abhängigkeit des Motorbedarfs (Einhalten der Abgasnorm, Leistung usw.)'
  pl: 'Ta wartość zadana reprezentuje ilość świeżego powietrza, jaką kalkulator sterujący silnikiem chce uzyskać w układzie dolotowym powietrza. Kalkulator sterujący silnikiem określa ilość powietrza w funkcji zapotrzebowania silnika (przestrzeganie czystości spalin, osiągi itp.)'
  hu: 'Ezen előírt érték a motorvezérlő számítógép által a levegő szívó körben óhajtott hideg levegő mennyiségének felel meg. A motorvezérlő számítógép a motor igényeinek (környezetvédelem betartása, teljesítmény, stb.)függvényében meghatározza a levegő mennyiségét'
kind: 'live'
access: 'read'
length: 2

params:
  AIR_FLOW_REFERENCE_VALUE:
    bits: '1.7-2.0'
    comment:
      en: 'Air flow reference value'
      fr: 'Consigne de débit d''air'
      es: 'Cosigna de caudal de aire'
      de: 'Luftdurchsatz-Sollwert'
      pl: 'Wartość zadana wydatku powietrza'
      hu: 'Levegőhozam előírt érték'
    type: 'uint'
    factor: 0.1
    units: 'mg/stroke'
