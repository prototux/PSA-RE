did: 0x0145
name: 'FUEL_HIGH_PRESSURE_COMMON_RAIL_FUEL_PRESSURE'
display_name:
  en: 'Fuel high pressure common rail fuel pressure reference value'
  fr: 'Consigne de pression carburant dans la rampe commune haute pression carburant'
  es: 'Consigna de presión de carburante en la rampa común alta presión de carburante'
  de: 'Sollwert Kraftstoffdruck in der Hochdruck-Kraftstoffverteilerleiste'
  pl: 'Wartość zadana ciśnienia paliwa w kolektorze ciśnieniowym zasilania wtryskiwaczy'
  hu: 'Tüzelőanyag nyomás előírt érték a nagynyomású tüzelőanyag közös nyomócsőben'
comment:
  en: 'This parameter represents the pressure that the engine management ECU requires in the fuel high pressure common rail. The engine management ECU determines the pressure according to the requirements of the injection into the cylinders'
  fr: 'Ce paramètre représente la pression que le calculateur contrôle moteur souhaite dans la rampe commune haute pression carburant. Le calculateur contrôle moteur détermine la pression en fonction des besoins de l''injection dans les cylindres'
  es: 'Este parámetro representa la presión que el calculador de control motor desea en la rampa común alta presión carburante. El calculador de control motor determina la presión en función de las necesidades de inyección en los cilindros'
  de: 'Dieser Parameter gibt den Druck wieder, den das Motorsteuergerät in der Hochdruck-Kraftstoffverteilerleiste wünscht. Das Motorsteuergerät bestimmt den Druck in Abhängigkeit des Einspritzbedarfs in die Zylinder'
  pl: 'Ten parametr reprezentuje ciśnienie, jakie kalkulator sterujący silnikiem chce uzyskać w kolektorze ciśnieniowym paliwa (common rail). Le kalkulator sterujący silnikiem określa ciśnienie w funkcji zapotrzebowania wtrysku w cylindrach'
  hu: 'Ezen paraméter mutatja a motorvezérlő számítógép által kívánt nyomást a nagynyomású tüzelőanyag közös nyomócsőben. A motorvezérlő számítógép a befecskendezési igényeknek megfelelően meghatározza a hengerekben lévő nyomást'
kind: 'live'
access: 'read'
length: 2

