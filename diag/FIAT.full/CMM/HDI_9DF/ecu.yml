node: 'CMM'
model: 'HDI_9DF'
display_name:
  en: 'Engine control unit (HDI_9DF)'
  fr: 'Calculateur moteur multifonction (HDI_9DF)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x18DA10F1
    response_id: 0x18DAF110
    comment:
      en: '29 bit CAN identifiers'
      fr: 'Identifiants CAN 29 bits'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'
  0x60:
    en: 'Supplier session'
    fr: 'Session fournisseur'

resets:
  0x01:
    en: 'Hard reset'
    fr: 'Réinitialisation matérielle'

services: [0x10, 0x11, 0x14, 0x19, 0x22, 0x27, 0x2E, 0x2F, 0x31]

security_access:
  - level: 0x01
  - level: 0x05

identification:
  request: '22 F1 A0'
  part_number: '60.7-64.0'
  comment:
    en: 'The ECU part number is in data bytes 60 to 64 of the answer to 22 F1 A0 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 60 à 64 de la réponse à 22 F1 A0 (DCB), elle donne la variante logicielle'

cars: ['MCV']

variants:
  MCV_V1:
    parts: ['46809B0EC4']
    cars: ['MCV']
  MCV_V2:
    parts: ['4680980EC1']
    cars: ['MCV']
  MCV_V3:
    parts: ['0001500514']
    cars: ['MCV']
