did: 0x019E
name: 'INITIAL_TURBO_LOWER_STOP_POSITION_PROGRAMMED'
display_name:
  en: 'Initial turbo lower stop position programmed'
  fr: 'Position initiale apprise de la butée basse turbo'
  es: 'Posición inicial aprendida del tope bajo del turbo'
  de: 'Eingespeicherte Ausgangsposition des unteren Anschlags des Turboladers'
  pl: 'Początkowe wyuczone położenie dolnego ogranicznika turbosprężarki'
  hu: 'A turbó alsó véghelyzetének eredeti megismertetett helyzete'
comment:
  en: 'This value corresponds to the position of the stop at the time of the very first programming (when new or following replacement of the part). The value is expressed as a percentage of the supply. 0% = 0V / 100% = 5V.'
  fr: 'Cette valeur correspond à la position de la butée lors du tout premier apprentissage (à neuf ou suite à un changement de la pièce). La valeur est exprimée en pourcentage de l''alimentation. 0% = 0V / 100% = 5V.'
  es: 'Este valor corresponde a la posición del tope durante el primero de todos los aprendizajes realizados (en nuevo o tras un cambio de la pieza). El valor se expresa en porcentaje de la alimentación. 0% = 0V / 100% = 5V.'
  de: 'Dieser Wert entspricht der Position des Anschlags während der allerersten Einspeicherung (Im neuen Zustand oder nach Austausch des Teils). Der Wert wird in Prozent Versorgung ausgedrückt. 0% = 0V / 100% = 5V.'
  pl: 'Wartość ta odpowiada położeniu ogranicznika podczas pierwszego możliwego uczenia (od nowa albo w następstwie wymiany części). Wartość jest wyrażona w procencie zasilania. 0% = 0V / 100% = 5V.'
  hu: 'Ezen érték megfelel a véghelyzetnek a legelső megismertetés során (újonnan vagy egy alkatrészcserét követően). Az érték a tápellátás százalékos arányában van kifejezve. 0% = 0V / 100% = 5V.'
kind: 'live'
access: 'read'
length: 1

