did: 0x18DB
name: 'INJECTION_STATUS'
display_name:
  en: 'Injection status'
  fr: 'État injection'
  es: 'Estado inyección'
  de: 'Einspritz-Zustand'
  pl: 'Stan wtrysku'
  hu: 'Befecskendezési állapot'
comment:
  en: 'The parameters "phasing, duration, quantity" per cylinder do not exist. They are overall values per phase of an injection cycle pilot diesel injection 1 pilot diesel injection 2 pilot diesel injection 3 main injection post-injection (which is divided into post 1 and post 2) only with particle filter regeneration post-injection (which is divided into post 3 and post 4) only with particle filter regeneration and with cold starting'
  fr: 'Il n''y a pas les paramètres "phasage, temps, quantité" par cylindre. Il s''agit de valeurs d''ensemble par phase d''un cycle d''injection injection diesel pilote 1 injection diesel pilote 2 injection diesel pilote 3 Injection principale postinjection (qui se décompose en post 1 et post 2) seulement en régénération du filtre à particules injection post (qui se décompose en post 3 et post 4) seulement en régénération du filtre à particules et en démarrage à froid'
  es: 'No existen los parámetros "fase, tiempo, cantidad" por cilindro. Se trata de valores de conjunto por fase de un ciclo de inyección inyección diésel piloto 1 inyección diésel piloto 2 inyección diésel piloto 3 inyección principal inyección post (que se divide en post 1 y post 2) solo en regeneración del filtro de partículas inyección post (que se divide en post 3 y post 4) solo en regeneración del filtro de partículas y en arranque en frío'
  de: 'Es gibt nicht die Parameter "Phase, Zeit, Menge" pro Zylinder. Es handelt sich um Gesamtwerte pro Phase eines Einspritzzyklus Diesel-Piloteinspritzung 1 Diesel-Piloteinspritzung 2 Diesel-Piloteinspritzung 3 Haupteinspritzung Nacheinspritzung (unterteilt in Nacheinspritzung 1 und 2) nur bei Regenerierung des Partikelfilters Nacheinspritzung (unterteilt in Nacheinspritzung 3 und 4) nur bei Regenerierung des Partikelfilters und bei Kaltstart'
  pl: 'Brak parametrów "ustawienie fazy, czas, ilość" dla każdego cylindra. Mamy do czynienia z zestawem wartości dla poszczególnych faz cyklu wtrysku wtrysk diesel pilotowany 1 wtrysk diesel pilotowany 2 wtrysk diesel pilotowany 3 główny wtrysk wtrysk dodatkowy (który składa się z wtrysku dodatkowego 1 i 2) wyłącznie podczas regeneracji filtra cząstek stałych wtrysk dodatkowy (który składa się z wtrysku dodatkowego 3 i 4) wyłącznie podczas regeneracji filtra cząstek stałych I rozruchu zimnego silnika'
  hu: 'Nem léteznek a hengerenkénti "fázisállítás, idő, mennyiség" paraméterek. Egy befecskendezési ciklus fázis szerinti átlag értéket jelent 1 pilot dízel befecskendezés 2 pilot dízel befecskendezés 3 pilot dízel befecskendezés főbefecskendezés utó-befecskendezés (amely 1 és 2 pontra oszlik) csupán a részecskeszűrő regenerálásakor utó-befecskendezés (amely 3 és 4 pontra oszlik) csupán a részecskeszűrő regenerálásakor és hidegindításkor'
kind: 'live'
access: 'read'
length: 1

