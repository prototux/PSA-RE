did: 0x017C
name: 'DISTANCE_TRAVELLED_SINCE_PARTICLE_FILTER_CHANGED'
display_name:
  en: 'Distance travelled since particle filter changed'
  fr: 'Distance parcourue depuis le changement du filtre à particules'
  es: 'Distancia recorrida desde la sustitución del filtro de partículas'
  de: 'Seit dem Austausch des Partikelfilters zurückgelegtem Strecke'
  pl: 'Przebieg od wymiany filtra cząstek stałych'
  hu: 'A légszűro cseréje óta megtett távolság'
comment:
  en: 'The estimated service life of the particle emission filter of the PumaC is 240000 km, therefore if the value indicted by the engine management ECU is between 2400000 and km replacement of the particle emission filter is considered normal.'
  fr: 'La durée de vie estimée du filtre à particules du PumaC est de 240000 km, donc si la valeur donnée par le calculateur de contrôle moteur est entre 2400000 et km, le remplacement du filtre à particules est considéré comme normal.'
  es: 'La vida útil estimada del filtro de partículas del PumaC es de 240000 km, por lo tanto, si el valor indicado en el calculador de control motor está entre 2400000 y km, la sustitución del filtro de partículas se considera normal.'
  de: 'Die geschätzte Lebensdauer des Partikelfilters des PumeC beträgtr 240000 km, wenn also der vom Motorsteuergerät angegebene Wert zwischen 2400000 und km liegt, wird dies als normal betrachtet.'
  pl: 'Oszacowana trwałość filtra cząstek stałych PumaC wynosi 240000 km, a więc jeżeli wartość podana przez kalkulator sterujący silnikiem zawiera się pomiędzy 2400000 i km, wymianę filtra cząstek stałych uważa się za normalną.'
  hu: 'A PumaC részecskeszűrő becsült élettartama 240000 km, tehát ha a befecskendezés-computer által megadott érték 2400000 és km közötti a részecskeszűrő cseréje normálisnak tekinthető.'
