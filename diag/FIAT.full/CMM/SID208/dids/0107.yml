did: 0x0107
name: 'GEAR_RATIO'
display_name:
  en: 'Gear ratio'
  fr: 'Rapport de boîte de vitesses'
  es: 'Velocidad de la caja de cambios'
  de: 'Gang des Getriebes'
  pl: 'Przelozenie skrzyni biegów'
  hu: 'Sebességváltó fokozata'
comment:
  en: 'Gear engaged (This parameter is calculated according to the vehicle speed, the engine speed and the speed of the vehicle at 1000 rpm).'
  fr: 'Rapport de boîte engagé (Ce paramètre est calculé d''après la vitesse véhicule, le régime moteur et la vitesse du véhicule à 1000 tr/min).'
  es: 'Relación atacada de caja (Este parámetro se calcula según la velocidad del vehículo, el régimen del motor y la velocidad del vehículo a 1000 rpm).'
  de: 'Eingelegter Getriebegang (Dieser Parameter wird anhand der Fahrzeuggeschwindigkeit, der Motordrehzahl und der Fahrzeuggeschwindigkeit bei 1000/min berechnet).'
  pl: 'Wybrane przełożenie skrzyni (Ten parametr jest obliczany na podstawie prędkości pojazdu, obrotów silnika i prędkości pojazdu przy 1000 n/min).'
  hu: 'Sebességváltó kapcsolt fokozata (Ezen paraméter a gépjármű sebesség, motor fordulatszám és a gépjármű 1000 ford./percnél lévő sebessége szerint kerül kiszámítására).'
kind: 'live'
access: 'read'
length: 1

