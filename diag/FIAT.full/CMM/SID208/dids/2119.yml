did: 0x2119
name: 'DID_2119'
comment:
  en: 'The parameter is 00 if the programming operations have not been carried out The parameter is 01 if the programming operations have been carried out'
  fr: 'Le paramètre est à 00 si les apprentissages n''ont pas été faits Le paramètre est à 01 si les apprentissages ont été faits'
  es: 'EL parámetro está en 00 si los aprendizajes no se han realizado El parámetro está en 01 si se han realizado los aprendizajes'
  de: 'Der Parameter steht auf 00, wenn die Einspeicherungen nicht erfolgt sind Der Parameter steht auf 01, wenn die Einspeicherungen erfolgt sind'
  pl: 'Parametr ma wartość 00, jeżeli uczenia nie zostały wykonane Parametr ma wartość 01, jeżeli uczenia zostały wykonane'
  hu: 'A paraméter 00, ha a megismertetések nem kerültek elvégzésre A paraméter 01, ha a megismertetések elvégzésre kerültek'
kind: 'config'
access: 'read-write'
length: 25

params:
  DATARECORD_025:
    bits: '1.7-25.0'
    type: 'bytes'

alternatives:
  - note:
      en: 'Other reading of the same bytes (both are given by the observations)'
      fr: 'Autre lecture des mêmes octets (les deux sont données par les observations)'
    params:
      STATUS_PROGRAMMING_TURBOCHARGER:
        bits: '1.0'
        comment:
          en: 'Status of the programming of the turbocharger'
          fr: 'Etat de l''apprentissage du turbocompresseur'
          es: 'Estado del aprendizaje del turbocompresor'
          de: 'Zustand der Einspeicherung des Turboladers'
          pl: 'Stan procedury uczenia turbosprężarki'
          hu: 'Turbókompresszor megismertetésének állapota'
        type: 'bool'
        values:
          0x00:
            en: 'Programming failed'
            fr: 'Echec de l''apprentissage'
            es: 'El aprendizaje ha fallado'
            de: 'Einspeicherung fehlgeschlagen'
            pl: 'Niepowodzenie uczenia'
            hu: 'Sikertelen tanulás'
          0x01:
            en: 'Learning complete'
            fr: 'Apprentissage réussi'
            es: 'Aprendizaje conseguido'
            de: 'Programmierung erfolgreich abgeschlossen'
