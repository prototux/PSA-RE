ioctl: 0x5006
name: 'WATER_DIESEL_LED'
display_name:
  en: 'Water in diesel LED'
  fr: 'Témoin de présence d''eau dans le gasoil'
  es: 'Testigo de presencia de agua en el gasoil'
  de: 'Kontrollleuchte Vorhandensein Wasser im Diesel'
  pl: 'Lampka kontrolna obecnosci wody w oleju napedowym'
  hu: 'Gázolajban lévo víz jelenlétét jelzo lámpa'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-3.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-3.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

tests:
  - display_name:
      en: 'Water in diesel LED'
      fr: 'Témoin de présence d''eau dans le gasoil'
      es: 'Testigo de presencia de agua en el gasoil'
      de: 'Kontrollleuchte Vorhandensein Wasser im Diesel'
      pl: 'Lampka kontrolna obecnosci wody w oleju napedowym'
      hu: 'Gázolajban lévo víz jelenlétét jelzo lámpa'
