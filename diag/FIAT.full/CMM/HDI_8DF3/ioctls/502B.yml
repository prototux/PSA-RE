ioctl: 0x502B
name: 'TURBOCHARGER_PRESSURE_SOLENOID_VALVE'
display_name:
  en: 'Turbocharger pressure solenoid valve'
  fr: 'Electrovanne de pression turbo'
  es: 'Electroválvula de presión turbo'
  de: 'MagnetventilLadedruckregelung'
  pl: 'Elektrozawór ciśnienia turbo'
  hu: 'Turbónyomás mágnesszelep'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

results:
  CONTROLSTATUS:
    bits: '1.7-1.0'
    type: 'enum'

  CONTROLSTATUSRECORD:
    bits: '2.7-2.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Turbocharger pressure solenoid valve'
      fr: 'Electrovanne de pression turbo'
      es: 'Electroválvula de presión turbo'
      de: 'MagnetventilLadedruckregelung'
      pl: 'Elektrozawór ciśnienia turbo'
      hu: 'Turbónyomás mágnesszelep'
    max_duration_ms: 2000
