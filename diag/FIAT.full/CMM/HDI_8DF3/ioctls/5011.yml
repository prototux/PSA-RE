ioctl: 0x5011
name: 'OIL_PUMP_ACTUATOR'
display_name:
  en: 'Oil pump actuator'
  fr: 'Actionneur de pompe à huile'
  es: 'Accionador de bomba de aceite'
  de: 'Stellglied der Ölpumpe'
  pl: 'Urządzenie wykonawcze pompy oleju'
  hu: 'Olajszivattyú beavatkozószerve'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

results:
  CONTROLSTATUS:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Oil pump actuator'
      fr: 'Actionneur de pompe à huile'
      es: 'Accionador de bomba de aceite'
      de: 'Stellglied der Ölpumpe'
      pl: 'Urządzenie wykonawcze pompy oleju'
      hu: 'Olajszivattyú beavatkozószerve'
    max_duration_ms: 2000
