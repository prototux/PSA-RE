routine: 0x01
name: 'ROUTINE_01'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  INPUT_PARAM_1:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x02

  INPUT_PARAM_1_2:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x04

  INPUT_PARAM_2:
    bits: '3.7-3.0'
    type: 'enum'
    default: 0x00

results:
  DATA_3:
    bits: '1.7-1.0'
    type: 'uint'
