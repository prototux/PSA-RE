  fr: 'Alerte de franchissement de ligne (HALF)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x18DA31F1
    response_id: 0x18DAF131
    comment:
      en: '29 bit CAN identifiers'
      fr: 'Identifiants CAN 29 bits'
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x18DA31F1
    response_id: 0x18DAF131
    comment:
      en: '29 bit CAN identifiers'
      fr: 'Identifiants CAN 29 bits'

