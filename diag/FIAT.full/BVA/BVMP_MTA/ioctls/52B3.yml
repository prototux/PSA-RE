ioctl: 0x52B3
name: 'IO_CONTROL_52B3'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'uint'
    default: 0x03

  OPTION:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x0F

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'uint'
