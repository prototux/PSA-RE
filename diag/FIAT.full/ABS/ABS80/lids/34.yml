lid: 0x34
name: 'STOP_LAMPS_SWITCH'
display_name:
  en: 'Stop lamps switch'
  fr: 'Contacteur de feux de stop'
  es: 'Contactor de luces de stop'
  de: 'Bremskontakt'
  pl: 'Zestyk świateł stopu'
  hu: 'Féklámpa kapcsoló'
comment:
  en: 'Acquisition of the information by a single press of the brake pedal. if the brake pedal is pressed, the brake lights switch is closed. if the brake pedal is released, the brake lights switch is open.'
  fr: 'Acquisition de l''information par un simple appui sur la pédale de frein. si la pédale de frein est appuyée, le contacteur de feux stop est fermé. si la pédale de frein est relâchée, le contacteur de feux stop est ouvert.'
  es: 'Adquisición de la información por una simple pisada en el pedal de freno. si el pedal de freno está pisado, el contactor de luces de stop está cerrado. si el pedal de frenos está suelto, el contactor de luces de stop está abierto.'
  de: 'Erfassung der Information durch einfachen Druck auf das Bremspedal. Bei gedrücktem Bremspedal ist der Bremslichtschalter geschlossen. Bei losgelassenem Bremspedal ist der Bremslichtschalter offen.'
  pl: 'Odbiór informacji poprzez zwykłe naciśnięcie na pedał hamulca. przy wciśniętym pedale hamulca stycznik świateł stop jest zamknięty. przy zwolnionym pedale hamulca stycznik świateł stop jest otwarty.'
  hu: 'Az információ vételezése a fékpedál egyszerű megnyomása által. ha a fékpedál le van nyomva, a féklámpakapcsoló zárt. ha a fékpedál fel van engedve, a féklámpakapcsoló nyitott.'
kind: 'live'
access: 'read'
length: 1

