lid: 0x42
name: 'CONTROL_SOLENOID_VALVE_2'
display_name:
  en: 'Control solenoid valve 2'
  fr: 'Électrovanne de pilotage 2'
  es: 'Electroválvula de pilotaje 2'
  de: 'Regelungs-Magnetventil 2'
  pl: 'Elektrozawór sterowania 2'
  hu: 'Vezérlő mágnesszelep 2'
comment:
  en: 'These tests on the solenoids show whether or not they are operational, (if a solenoid fault has been reported for example).'
  fr: 'Ces tests sur les électrovannes permettent de savoir si elles sont fonctionnelles ou non, (en cas de défaut électrovanne remonté par exemple).'
  es: 'Estos testes en las electroválvulas permiten saber si son funcionales o no, (por ejemplo, en caso de defecto electroválvula subido).'
  de: 'Diese Tests an den Magnetventilen geben Aufschluss darüber, ob sie funktionieren oder nicht (beispielsweise bei gemeldetem Magnetventil Fehler).'
  pl: 'Testy elektrozaworów umożliwiają sprawdzenie ich prawidłowego działania (np. w przypadku stwierdzenia błędu elektrozaworu).'
  hu: 'A mágnesszelepekkel kapcsolatos ezen tesztek lehetővé teszik megtudni, hogy működőképesek vagy sem (például mágnesszelep hiba megjelenése esetén).'
kind: 'config'
access: 'read-write'
length: 1

params:
  CONTROL_SOLENOID_VALVE_2:
    bits: '1.7-1.0'
    comment:
      en: 'Control solenoid valve 2'
      fr: 'Électrovanne de pilotage 2'
      es: 'Electroválvula de pilotaje 2'
      de: 'Regelungs-Magnetventil 2'
      pl: 'Elektrozawór sterowania 2'
      hu: 'Vezérlő mágnesszelep 2'
    type: 'enum'
    values:
      0x00:
        en: 'Closed'
        fr: 'Fermée'
        es: 'Cerrada'
        de: 'Geschlossen'
        pl: 'Zamkn.'
        hu: 'Zárva'
      0x01:
        en: 'Open'
        fr: 'Ouverte'
        es: 'Abierta'
        de: 'Offen'
        pl: 'Otwar.'
        hu: 'Nyitva'
