did: 0x0884
name: 'BRAKING_PRESSURE'
display_name:
  en: 'Braking pressure'
  fr: 'Pression de freinage'
  es: 'Presión de frenada'
  de: 'Bremsdruck'
  pl: 'Cisnienie hamowania'
  hu: 'Féknyomás'
comment:
  en: 'Information measured using the master cylinder pressure sensor. pressure equal to 0 bar if the brake pedal is not pressed or if the recirculation pump is at rest'
  fr: 'Information mesurée grâce au capteur de pression dans le maître-cylindre. pression égale à 0 bar si la pédale de frein n''est pas actionnée ou si la pompe de recirculation est au repos'
  es: 'Información medida gracias al captador de presión en el cilindro maestro. presión igual a 0 bares si el pedal de frenos no está accionado o si la bomba de recirculación está en reposo'
  de: 'Information, gemessen über dem Druckgeber im Hauptzylinder. Druck gleich 0 bar, wenn das Bremspedal nicht betätigt wird oder wenn die Rückförderpumpe in Ruhestellung ist'
  pl: 'Informacja zmierzona dzięki czujnikowi ciśnienia w pompie hamulcowej. ciśnienie równe 0 bar jeżeli pedał hamulca nie jest wciśnięty lub jeżeli pompa recyrkulacyjna jest w stanie spoczynku'
  hu: 'A nyomásérzékelő segítségével a főfékhengerben mért információ. 0 bar-ral egyenlő nyomás, ha a fékpedál nem került működtetésre, vagy ha a keringetőszivattyú nyugalomban van'
kind: 'live'
access: 'read'
length: 2
variants: ['ESP90F_X250FL_*']

