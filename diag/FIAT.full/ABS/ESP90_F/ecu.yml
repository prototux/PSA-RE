node: 'ABS'
model: 'ESP90_F'
display_name:
  en: 'ABS/ESP brake control unit (ESP90_F)'
  fr: 'Calculateur ABS/ESP (ESP90_F)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x18DA28F1
    response_id: 0x18DAF128
    comment:
      en: '29 bit CAN identifiers'
      fr: 'Identifiants CAN 29 bits'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'
  0x40:
    en: 'Session 0x40'
    fr: 'Session 0x40'

services: [0x10, 0x14, 0x19, 0x22, 0x2F, 0x31]

identification:
  request: '22 F1 A0'
  part_number: '60.7-64.0'
  comment:
    en: 'The ECU part number is in data bytes 60 to 64 of the answer to 22 F1 A0 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 60 à 64 de la réponse à 22 F1 A0 (DCB), elle donne la variante logicielle'

cars: ['MCV', 'X250FL']

variants:
  ESP90F_MCV_V1:
    parts: ['EC07290DFE']
    cars: ['MCV']
  ESP90F_MCV_V2:
    parts: ['EC072A0D7F']
    cars: ['MCV']
  ESP90F_X250FL_V1_0:
    parts: ['EC079489E5']
    cars: ['X250FL']
  ESP90F_X250FL_V1_1:
    parts: ['EC07AE0D83']
    cars: ['X250FL']
  ESP90F_X250FL_V1_2:
    parts: ['EC07A80DFD']
    cars: ['X250FL']
  ESP90F_X250FL_V1_3:
    parts: ['0006506516']
    cars: ['X250FL']
  ESP90F_X250FL_V1_4:
    parts: ['0006506416']
    cars: ['X250FL']
