ioctl: 0xD700
name: 'ACTIVATION_PASSENGER_COMPARTMENT_AIR_HEATING'
display_name:
  en: 'Activation of the passenger compartment air heating resistor'
  fr: 'Activation de la résistance chauffante d''air habitacle'
  es: 'Activación de la resistencia térmica de aire habitáculo'
  de: 'Aktivierung des Heizwiderstands der Innenraumluft'
  pl: 'Aktywacja rezystencji grzejnej powietrza kabiny'
  hu: 'Az utastéri levegő fűtőellenállás aktiválása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x64

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x00:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x03:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'

tests:
  - display_name:
      en: 'Activation of the passenger compartment air heating resistor'
      fr: 'Activation de la résistance chauffante d''air habitacle'
      es: 'Activación de la resistencia térmica de aire habitáculo'
      de: 'Aktivierung des Heizwiderstands der Innenraumluft'
      pl: 'Aktywacja rezystencji grzejnej powietrza kabiny'
      hu: 'Az utastéri levegő fűtőellenállás aktiválása'
    max_duration_ms: 15000
