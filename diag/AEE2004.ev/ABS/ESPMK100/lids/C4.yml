      pl: 'Tolerancja przyspieszenia wzdłużnego'
      hu: 'Hosszirányú gyorsulás tűrése'
    type: 'uint'
    factor: 0.01
    offset: -10
    units: 'm/s²'

  YAW_ANGLE_SPEED_TOLERANCE:
