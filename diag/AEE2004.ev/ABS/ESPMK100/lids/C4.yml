params:
  MOVEMENT_VEHICLE_PROGRESS:
    bits: '1.7-1.0'
    comment:
      en: 'Movement of the vehicle in progress'
      fr: 'Déplacement du véhicule en cours'
      es: 'Desplazamiento del vehículo en curso'
      de: 'Fahrzeugbewegung läuft'
      pl: 'Przemieszczenie samochodu w trakcie'
      hu: 'Gépjármű elmozdulása folyamatban'
    type: 'enum'
    values:
      0x00:
        en: 'Vehicle stationary'
        fr: 'Véhicule à l''arrêt'
        es: 'Vehículo parado'
        de: 'Stehendes Fahrzeug'
        pl: 'W stojącym pojeździe'
        hu: 'Álló gépjármű'
      0x01:
        en: 'Vehicle moving'
        fr: 'Véhicule roulant'
        es: 'Vehículo circulando'
        de: 'Fahrendes Fahrzeug'
        pl: 'Pojazd jadacy'
        hu: 'Guruló gépjármű'

  STEERING_WHEEL_ANGLE_SENSOR_TOLERANCE:
    bits: '2.7-3.0'
    comment:
      en: 'Steering wheel angle sensor tolerance'
      fr: 'Tolérance du capteur d''angle volant de direction'
      es: 'Tolerancia del captador de ángulo volante de dirección'
      de: 'Toleranz des Lenkradwinkelsensors'
      pl: 'Tolerancja czujnika kąta obrotu koła kierownicy'
      hu: 'Kormánykerékszög-érzékelő tűrése'
    type: 'uint'
    factor: 0.1
    offset: -1073

  RECORDING_STEERING_WHEEL_ANGLE_SENSOR:
    bits: '4.2-4.0'
    comment:
      en: 'Recording of the steering wheel angle sensor information'
      fr: 'Remontée de l''information du capteur angle volant de direction'
      es: 'Envío de información del captador ángulo volante de dirección'
      de: 'Anzeige der Information des Lenkradwinkelsensors'
      pl: 'Przesłanie informacji czujnika kąta koła kierownicy'
      hu: 'A kormánykerékszög-érzékelő információ kijelezve'
    type: 'enum'
    values:
      0x00:
        en: 'Value estimated by the electric power steering'
        fr: 'Valeur estimée par la direction assistée électrique'
        es: 'Valor estimado por la dirección asistida eléctrica'
        de: 'Von der elektrischen Servolenkung geschätzter Wert'
        pl: 'Wartość oceniana przez kierownicę wspomaganą elektrycznie'
        hu: 'Az elektromos kormányszervo által becsült érték'
      0x01:
        en: 'Value measured by the controls under the steering wheel'
        fr: 'Valeur mesurée par les commandes sous volant de direction'
        es: 'Valor medido por los mandos bajo el volante de dirección'
        de: 'Von den Betätigungen am Lenkrad gemessener Wert'
        pl: 'Wartość zmierzona przez sterowania pod kołem kierownicy'
        hu: 'A kormánykerék alatti kapcsolók által mért érték'
      0x02:
        en: 'Value measured by the electric power steering'
        fr: 'Valeur mesurée par la direction assistée électrique'
        es: 'Valor medido por la dirección asistida eléctrica'
        de: 'Von der elektrischen Servolenkung gemessener Wert'
        pl: 'Wartość zmierzona przez kierownicę wspomaganą elektrycznie'
        hu: 'Az elektromos kormányszervo által mért érték'
      0x03:
        en: 'Value measured by the controls under the steering wheel of the suspension CAN'
        fr: 'Valeur mesurée par les commandes sous volant de direction du réseau CAN LAS'
        es: 'Valor medido por los mandos bajo el volante de dirección de la red CAN LAS'
        de: 'Von den Betätigungen am Lenkrad des Netzes CAN LAS gemessener Wert'
        pl: 'Wartość zmierzona przez sterowania pod kołem kierownicy sieci CAN LAS'
        hu: 'A CAN LAS hálózat kormánykerék alatti kapcsolók által mért érték'
      0x07:
        en: 'Invalid'
        fr: 'Invalide'
        es: 'No válida'
        de: 'Ungültig'
        pl: 'Nieprawidłowy'
        hu: 'Érvénytelen'

  LOCATION_INFO_SENSOR_GYRO_ACCEL:
    bits: '6.3-6.1'
    type: 'uint'

  TYPE_SENSOR_GYRO_ACCEL:
    bits: '6.0'
    type: 'bool'

  TRANSVERSE_ACCELERATION_WITHOUT_CORRECTION:
    bits: '7.7-7.0'
    comment:
      en: 'Transverse acceleration without correction'
      fr: 'Accélération transversale sans correction'
      es: 'Aceleración transversal sin corección'
      de: 'Querbeschleunigung ohne Korrektur'
      pl: 'Przyspieszenie poprzeczne bez korekty'
      hu: 'Keresztirányú gyorsulás korrekció nélkül'
    type: 'uint'
    factor: 0.1
    offset: -12.7
    units: 'm/s²'

  LONGITUDINAL_ACCELERATION_WITHOUT_CORRECTION:
    bits: '8.7-8.0'
