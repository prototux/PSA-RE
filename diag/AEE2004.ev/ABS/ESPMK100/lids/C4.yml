      de: 'Gierwinkelgeschwindigkeit ohne Korrektur'
      pl: 'Prędkość kąta obrotu bez korekty'
      hu: 'Perdületi szögsebesség korrekció nélkül'
    type: 'uint'
    offset: -100
    units: '°/s'

  TRANSVERSE_ACCELERATION_TOLERANCE:
    bits: '10.7-11.0'
    comment:
      en: 'Transverse acceleration tolerance'
      fr: 'Tolérance d''accélération transversale'
