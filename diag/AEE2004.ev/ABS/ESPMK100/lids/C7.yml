      hu: 'Elégtelen gumiabroncsnyomást észlelő rendszer általános állapota'
    type: 'enum'
    values:
      0x01:
        en: 'System faulty'
        fr: 'Système défaillant'
        es: 'Sistema defectuoso'
        de: 'System defekt'
        pl: 'System niesprawny'
        hu: 'Rendszer meghibásodott'
      0x02:
        en: 'Wheels under-inflated status'
        fr: 'Etat roues sous-gonflées'
        es: 'Estado de las ruedas subinfladas'
        de: 'Zustand Räder mit zu geringem Fülldruck'
