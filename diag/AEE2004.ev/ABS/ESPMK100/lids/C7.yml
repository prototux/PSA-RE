params:
  GENERAL_STATUS_TYRE_UNDER_INFLATION_DETECTION:
    bits: '1.6-1.4'
    comment:
      en: 'General status of the tyre under-inflation detection system'
      fr: 'État général du système de détection de sous gonflage'
      es: 'Diferencia general del sistema de detección de sub inflado'
      de: 'Gesamtzustand des Reifendrucküberwachungssystems'
