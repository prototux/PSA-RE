    type: 'enum'
    values:
      0x04:
        en: 'Empty (load equal to 33 % of the maximum authorised load)'
        fr: 'Vide (charge égale à 33 % de la charge maximale autorisée)'
        es: 'Vacío (carga igual al 33% de la carga máxima autorizada)'
        de: 'Leer (ladung gleich 33 % der maximal zulässigen Ladung)'
        pl: 'Pusty (obciążenie równe 33 % maksymalnego dopuszczalnego obciążenia)'
        hu: 'V kuum (A megengedett maximális terhelés 33%-val egyenlő terhelés)'
      0x05:
        en: 'Medium (load between 34 and 66 % of the maximum authorised load)'
        fr: 'Moyenne (charge comprise entre 34 et 66 % de la charge maximale autorisée)'
        es: 'Mediano (carga comprendida entre el 34 y el 66% de la carga máxima autorizada)'
        de: 'Mittel (ladung zwischen 34 und 66 % der maximal zulässigen Ladung)'
        pl: 'Średnia (obciążenie zawarte pomiędzy 34 i 66 % maksymalnego dopuszczalnego obciążenia)'
        hu: 'Közepes (A megengedett maximális terhelés 34 és 66 % közötti terhelés)'
      0x06:
        en: 'Full (load between 67 and 100 % of the maximum authorised load)'
        fr: 'Pleine (charge comprise entre 67 et 100 % de la charge maximale autorisée)'
        es: 'Lleno (carga comprendida entre el 67 y el 100% de la carga máxima autorizada)'
        de: 'Voll (ladung zwischen 67 und 100 % der maximal zulässigen Ladung)'
        pl: 'Pełne (obciążenie zawarte pomiędzy 67 i 100 % maksymalnego dopuszczalnego obciążenia)'
        hu: 'Teljes (A megengedett maximális terhelés 67 és 100 % közötti terhelés)'
      0x07:
        en: 'Overloaded (load more than 100 % of the maximum authorised load)'
        fr: 'Surchargé (charge supérieure à 100 % de la charge maximale autorisée)'
        es: 'Sobrecargado (carga superior al 100% de la carga máxima autorizada)'
        de: 'Überladen (ladung höher als 100 % der maximal zulässigen Ladung)'
        pl: 'Przeciążony (obciążenie wyższe od 100 % maksymalnego dopuszczalnego obciążenia)'
        hu: 'Túltöltött (A megengedett maximális terhelés 100 % feletti terhelés)'

