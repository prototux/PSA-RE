        de: 'Automatisches Bremsen bei Kollisionsgefahr (Bei Stadt)'
        pl: 'Hamowanie automatyczne w przypadku ryzyka kolizji (W Miasto)'
        hu: 'Automatikus fékezés ütközés kockázata esetén (-ban Város)'

  REQUEST_CONTROL_DECELERATION_EMERGENCY_COLLISION:
    bits: '1.1'
    comment:
      en: 'Request for control of the deceleration by the emergency collision braking function'
      fr: 'Demande de pilotage de la décélération par la fonction freinage automatique en cas de risque de collision'
      es: 'Solicitud de pilotaje de la desaceleración por la función de frenada automática en caso de riesgo de colisión'
      de: 'Anforderung zur Ansteuerung der Verzögerung durch die Funktion automatisches Bremsen bei Kollisionsgefahr'
      pl: 'Żądanie pilotowania opóźnienia przez funkcję automatycznego hamowania w przypadku ryzyka kolizji'
      hu: 'Lassítás vezérlés kérése az ütközés veszélye esetén automatikusan fékező funkció által'
    type: 'bool'
    values:
      0x00:
        en: 'No requirement'
        fr: 'Pas de demande'
        es: 'No hay solicitud'
        de: 'Kein Befehl'
        pl: 'Brak żądania'
        hu: 'Nincs kérés'
      0x01:
        en: 'Demand'
        fr: 'Demande'
        es: 'Petición'
        de: 'Befehl'
        pl: 'Zadanie'
        hu: 'Igény'

  REQUEST_PRE_FILL_BRAKE_CALIPERS:
