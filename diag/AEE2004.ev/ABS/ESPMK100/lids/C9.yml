        de: 'In Fehler'
        pl: 'Blędny'
        hu: 'Hibás'

  TYPE_OF_DECELERATION:
    bits: '1.4-1.3'
    comment:
      en: 'Type of deceleration'
      fr: 'Type de décélération'
