      pl: 'Typ zmniejszenia prędkości'
      hu: 'Lassítás típusa'
    type: 'enum'
    values:
      0x00:
        en: 'No braking'
        fr: 'Pas de freinage'
        es: 'Ausencia de frenada'
        de: 'Kein Bremsen'
        pl: 'Brak hamowania'
        hu: 'Nincs fékezés'
      0x03:
        en: 'Emergency collision braking (At Town)'
        fr: 'Freinage automatique en cas de risque de collision (En Ville)'
