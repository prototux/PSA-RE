routine: 0xBD
name: 'ROUTINE_BD'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
variants: ['A51_*', 'A55_*', 'A58_*', 'ESP_MK60_A7_*', 'LA_*']
control: ['start']

params:
  CALIBRATION_CONTROL_2_1:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x00

  CALIBRATION_DECALIBRATION:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  CALIBRATION_RESULT:
    bits: '1.7-1.0'
    type: 'uint'
