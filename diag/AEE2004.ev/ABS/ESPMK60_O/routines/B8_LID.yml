routine: 0xB8
name: 'SYNCHRONISED_CONTROL_FRONT_LEFT_WHEEL'
display_name:
  en: 'Synchronised control of the front left wheel'
  fr: 'Pilotage synchronisé de la roue avant gauche'
  es: 'Pilotaje sincronizado de la rueda delantera izquierda'
  de: 'Synchronisierte Ansteuerung des Rads vorn links'
  pl: 'Sterowanie zsynchronizowane koła przedniego lewego'
  hu: 'A bal első kerék szinkronizált vezérlése'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  INPUT_PARAM_1:
    bits: '1.7-1.0'
    type: 'enum'

  INPUT_PARAM_2_B8:
    bits: '2.7-2.0'
    type: 'enum'

  INPUT_PARAM_3_B8:
    bits: '3.7-3.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed but presence of a problem'
        fr: 'Pilotage terminé mais problème'
        es: 'Pilotaje terminado pero problema'
        de: 'Steuerung beendet, jedoch Problem'
        pl: 'Sterowanie zakończone, ale wystąpił problem'
        hu: 'Vezérlés befejezve de probléma lépett fel'
      0x0B:
        en: 'Test stopped by the operator (the test report is not available)'
        fr: 'Test arrêté par l''opérateur (le compte rendu du test n''est pas disponible)'
        es: 'Test detenido por el operario (el informe del test no está disponioble)'
        de: 'Test vom Techniker abgebrochen (Testbericht nicht verfügbar)'
        pl: 'Test zatrzymany przez operatora (sprawozdanie z test niedostępne)'
        hu: 'A kezelő által leállított teszt (a teszt jegyzőkönyve nem áll rendelkezésre)'

tests:
  - display_name:
      en: 'Synchronised control of the front left wheel'
      fr: 'Pilotage synchronisé de la roue avant gauche'
      es: 'Pilotaje sincronizado de la rueda delantera izquierda'
      de: 'Synchronisierte Ansteuerung des Rads vorn links'
      pl: 'Sterowanie zsynchronizowane koła przedniego lewego'
      hu: 'A bal első kerék szinkronizált vezérlése'
    max_duration_ms: 5000
  - display_name:
      en: 'Synchronised control of the front right wheel'
      fr: 'Pilotage synchronisé de la roue avant droite'
      es: 'Pilotaje sincronizado de la rueda delantera derecha'
      de: 'Synchronisierte Ansteuerung des Rads vorn rechts'
      pl: 'Sterowanie zsynchronizowane koła przedniego prawego'
      hu: 'A jobb első kerék szinkronizált vezérlése'
    max_duration_ms: 5000
  - display_name:
      en: 'Synchronised control of the rear left wheel'
      fr: 'Pilotage synchronisé de la roue arrière gauche'
      es: 'Pilotaje sincronizado de la rueda trasera izquierda'
      de: 'Synchronisierte Ansteuerung des Rads hinten links'
      pl: 'Sterowanie zsynchronizowane koła tylnego lewego'
      hu: 'A bal hátsó kerék szinkronizált vezérlése'
    max_duration_ms: 5000
  - display_name:
      en: 'Rear right-hand wheel solenoid valve'
      fr: 'Électrovanne roue arrière droite'
      es: 'Electroválvula rueda trasera derecha'
      de: 'Magnetventil Hinterrad rechts'
      pl: 'Elektrozawór tylnego prawego kola'
      hu: 'Jobb hátsó kerék mágnesszelepe'
    max_duration_ms: 5000
