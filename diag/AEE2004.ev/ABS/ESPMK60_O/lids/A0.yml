            en: 'All vehicles fitted with electronic emergency braking assistance : Applicable to all engine types except vehicles with engine type EP6DTS or estate vehicles with engine type DV6TED4 110 with particle emission filter'
            fr: 'Tous les véhicules équipés d''aide au freinage d''urgence électronique : Valable pour tous types moteur sauf pour les véhicules de type moteur EP6DTS ou pour les véhicules break de type moteur DV6TED4 110 avec filtre à particules'
            es: 'Todos los vehículos equipados con ayuda a la frenada de urgencia electrónica : Válido para todos los tipos de motor salvo para los vehículos de tipo de motor EP6DTS o para los vehículos break de tipo de motor DV6TED4 110 con filtro de partículas'
            de: 'Alle Fahrzeuge mit Ausstattung elektronischer Notbremsassistent : Gültig für alle Motortypen außer für Fahrzeuge des Motortyps EP6DTS oder für Kombi-Fahrzeuge des Motortyps DV6TED4 110 mit Partikelfilter'
            pl: 'Wszystkie pojazdy wyposażone w elektroniczny układ wspomagania nagłego hamowania : Stosowany dla wszystkich typów silnika, oprócz pojazdów z silnikiem typu EP6DTS lub pojazdów break z silnikiem typu DV6TED4 110 z filtrem cząstek stałych'
            hu: 'Minden elektromos vészfékkel felszerelt gépjármű : Minden motortípusra érvényes kivéve a EP6DTS motoros gépjárműveket vagy a részecskeszűrős DV6TED4 110 motoros break gépjárműveket'
