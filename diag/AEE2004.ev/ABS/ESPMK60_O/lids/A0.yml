            pl: 'Wszystkie pojazdy wyposażone w elektroniczny układ wspomagania nagłego hamowania (Obowiązuje dla samochodów z typem silnika EP6DTS lub dla samochodów Break z typem silnika DV6TED4 110 z filtrem cząstek stałych)'
            hu: 'Minden elektromos vészfékkel felszerelt gépjármű (Érvényes a EP6DTS motortípussal rendelkező gépjárművek vagy részecskeszűrős DV6TED4 110 motortípussal rendelkező break gépjárművek esetében)'
