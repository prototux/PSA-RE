routine: 0x93
name: 'INITIALISATION_RADAR'
display_name:
  en: 'Initialisation of the radar'
  fr: 'Apprentissage du radar'
  es: 'Aprendizaje del radar'
  de: 'Einspeicheung des Radars'
  pl: 'Uczenie radaru'
  hu: 'Radar megismertetése'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  TYPE_ACTION:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x00

results:
  STATUT_ACTION:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Initialisation of the radar'
      fr: 'Apprentissage du radar'
      es: 'Aprendizaje del radar'
      de: 'Einspeicheung des Radars'
      pl: 'Uczenie radaru'
      hu: 'Radar megismertetése'
    max_duration_ms: 30000
