node: 'ARTIV'
model: 'LIDAR'
display_name:
  en: 'Front radar (distance alert / ACC / AEB) (LIDAR)'
  fr: 'Radar avant (alerte distance / regulateur adaptatif / freinage auto) (LIDAR)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x6B6
    response_id: 0x696
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x6B6
    response_id: 0x696

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'

services: [0x10, 0x14, 0x19, 0x22, 0x27, 0x2E, 0x31]

security_access:
  - level: 0x03

identification:
  request: '22 F0 80'
  part_number: '8.7-12.0'
  comment:
    en: 'The ECU part number is in data bytes 8 to 12 of the answer to 22 F0 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 8 à 12 de la réponse à 22 F0 80 (DCB), elle donne la variante logicielle'

cars: ['A5', 'A5P', 'A9', 'B9']

variants:
  A9_V1:
    parts: ['9810426380']
    cars: ['A9']
  A9_V2:
    parts: ['9812768780']
    cars: ['A9']
  A55P_V1:
    parts: ['9812768780']
    cars: ['A5P']
  A55_V1:
    parts: ['9810426380']
    cars: ['A5']
  A55_V2:
    parts: ['9809450580']
    cars: ['A5']
  A55_V3:
    parts: ['9805720780']
    cars: ['A5']
  A55_V4:
    parts: ['9812768780']
    cars: ['A5']
  B9_V1:
    parts: ['9812768780']
    cars: ['B9']
