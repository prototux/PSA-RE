lid: 0xD1
name: 'LID_D1'
display_name:
  en: 'Data record 0xD1 (4 values)'
  fr: 'Enregistrement 0xD1 (4 valeurs)'
kind: 'live'
access: 'read'
length: 11

params:
  NUMBER_TIMES_SWITCHES_HAVE_BEEN_CLOSED:
    bits: '2.7-3.0'
    comment:
      en: 'Number of times the switches have been closed'
      fr: 'Nombre de fermeture des contacteurs'
      es: 'Número de cierres de los contactores'
      de: 'Anzahl Schließen der Kontaktschalter'
      pl: 'Liczba zamknięć styczników'
      hu: 'Kapcsolók zárásának száma'
    type: 'uint'

  MAXIMUM_RECORDED_TEMPERATURE_TRACTION_BATTERY:
    bits: '4.7-4.0'
    comment:
      en: 'Maximum recorded temperature of the traction battery'
      fr: 'Température maximale enregistrée de la batterie de traction'
      es: 'Temperatura máxima registrada de la batería de tracción'
      de: 'Gespeicherte Höchsttemperatur der Antriebsbatterie'
      pl: 'Maksymalna zarejestrowana temperatura akumulatora trakcyjnego'
      hu: 'A meghajtó akkumulátor regisztrált maximális hőmérséklete'
    type: 'uint'
    offset: -40
    units: '°C'

  NUMBER_TIMES_SWITCHES_HAVE_BEEN_OPENED_WITHOUT:
    bits: '8.7-9.0'
    comment:
      en: 'Number of times the switches have been opened without an order from the hybrid management ECU 1'
      fr: 'Nombre d''ouverture des contacteurs sans ordre du calculateur de contrôle hybride 1'
      es: 'Número de aperturas de los contactores sin orden del calculador de control híbrido 1'
      de: 'Anzahl Öffnungen der Kontaktschalter ohne Anordnung durch das Steuergerät Hybridkontrolle 1'
      pl: 'Liczba otwarć styczników bez polecenia kalkulatora sterującego hybrydy 1'
      hu: 'Kapcsolók hibrid 1 vezérlő computer utasítása nélküli nyitásainak száma'
    type: 'uint'

  NUMBER_TIMES_SWITCHES_HAVE_BEEN_OPENED_WITHOUT_2:
    bits: '10.7-11.0'
    comment:
      en: 'Number of times the switches have been opened without an order from the hybrid management ECU 2'
      fr: 'Nombre d''ouverture des contacteurs sans ordre du calculateur de contrôle hybride 2'
      es: 'Número de aperturas de los contactores sin orden del calculador de control híbrido 2'
      de: 'Anzahl Öffnungen der Kontaktschalter ohne Anordnung durch das Steuergerät Hybridkontrolle 2'
      pl: 'Liczba otwarć styczników bez polecenia kalkulatora sterującego hybrydy 2'
      hu: 'Kapcsolók hibrid 2 vezérlő computer utasítása nélküli nyitásainak száma'
    type: 'uint'

alternatives:
  - note:
      en: 'Layout seen on 48 other software variant(s)'
      fr: 'Format vu sur 48 autre(s) variante(s) logicielle(s)'
    variants: ['B81HY_*', 'T84HY_*', 'W2_*']
    access: 'read'
    length: 1
    params:
      TYPE_DNNEES:
        bits: '1.7-1.0'
        type: 'uint'
