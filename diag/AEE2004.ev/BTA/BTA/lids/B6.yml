  ADJUSTMENT_LOUDSPEAKERS_AS_FUNCTION_PASSENGER:
    bits: '3.7-3.0'
    comment:
      en: 'Adjustment of the loudspeakers as a function of the passenger compartment'
      fr: 'Réglage du volume des haut-parleurs en fonction de l''habitacle'
      es: 'Reglaje del volumen de los altavoces en función del habitáculo'
      de: 'Lautstärkeregelung der Lautsprecher abhängig vom Innenraum'
      pl: 'Regulacja natężenia dźwięku głośników w zależności od wnętrza pojazdu'
      hu: 'Hangszórók hangerejének beállítása az utastér függvényében'
    type: 'uint'

  ADAPTATION_MICROPHONE_GAIN_PASSENGER_COMPARTMENT:
    bits: '4.7-4.0'
    comment:
      en: 'Adaptation of the microphone gain to the passenger compartment'
      fr: 'Adaptation du gain microphone en fonction de l''habitacle'
