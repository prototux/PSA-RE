    type: 'uint'

  MICROPHONE_NOISE_001:
    bits: '6.7-7.0'
    type: 'uint'

  MICROPHONE_EQUALIZER_000:
    bits: '8.7-8.0'
    type: 'uint'

  MICROPHONE_RECEPTION_000:
