        fr: 'Normal'
        es: 'Normal'
        de: 'Normal'
        pl: 'Normalny'
        hu: 'Normális'
      0x04:
        en: 'High'
        fr: 'Elevé'
        es: 'Elevado'
        de: 'Hoch'
        pl: 'Wysoki'
        hu: 'Megnövelt'

  REAR_WHEEL_RADIUS_MM:
