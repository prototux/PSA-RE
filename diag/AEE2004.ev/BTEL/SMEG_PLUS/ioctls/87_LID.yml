ioctl: 0x87
name: 'CHECK_PANORAMIC_VISUAL_ASSISTANCE_FUNCTION'
display_name:
  en: 'Check of the panoramic visual assistance function'
  fr: 'Contrôle de la fonction d''aide visuelle panoramique'
  es: 'Control de la función de ayuda visual panorámica'
  de: 'Kontrolle der Funktion Rundumsichtassistent'
  pl: 'Kontrola funkcji pomocy wizualnej panoramicznej'
  hu: 'A panoráma látás segítő funkció ellenőrzése'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER_1:
    bits: '1.7-1.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Check of the panoramic visual assistance function'
      fr: 'Contrôle de la fonction d''aide visuelle panoramique'
      es: 'Control de la función de ayuda visual panorámica'
      de: 'Kontrolle der Funktion Rundumsichtassistent'
      pl: 'Kontrola funkcji pomocy wizualnej panoramicznej'
      hu: 'A panoráma látás segítő funkció ellenőrzése'
    max_duration_ms: 5000
  - display_name:
      en: 'Check of the visual reversing assistance function'
      fr: 'Contrôle de la fonction d''aide visuelle au recul'
      es: 'Control de la función de ayuda visual a la marcha atrás'
      de: 'Kontrolle der Funktion visuelle Rückfahrhilfe'
      pl: 'Kontrola funkcji pomocy wizualnej podczas cofania'
      hu: 'A tolatókamera funkció ellenőrzése'
    max_duration_ms: 5000
