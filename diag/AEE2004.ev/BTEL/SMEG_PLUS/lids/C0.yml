lid: 0xC0
name: 'INSTRUMENT_PANEL_ACTIVE_THEME'
display_name:
  en: 'Instrument panel active theme'
  fr: 'Thème actif du combiné'
  es: 'Tema activo del combinado'
  de: 'Aktives Thema des Kombiinstruments'
  pl: 'Aktywny temat zestawu wskaźników'
  hu: 'Kombinált kijelzőegység aktív téma'
comment:
  en: 'If the instrument panel (CIROCCO) is present, apply theme N° 3 If the instrument panel is fitted with a matrix display, apply theme N° 4'
  fr: 'Si le combiné (CIROCCO) est présent, appliquer le thème N° 3 Si le combiné est équipé d''un afficheur matriciel, appliquer le thème N° 4'
  es: 'Con el combinado (CIROCCO), aplicar el tema N° 3 Si el combinado está equipado con una pantalla matricial, aplicar el tema N° 4'
  de: 'Wenn das Kombiinstrument (CIROCCO) vorhanden ist, das Thema Nr. 3 anwenden Wenn das Kombiinstrument mit einer Matrix-Anzeige ausgestattet ist, das Thema Nr. 4 anwenden'
  pl: 'Jeżeli zestaw wskaźników (CIROCCO) występuje, zastosować temat nr 3 Jeżeli zestaw wskaźników jest wyposażony w wyświetlacz matrycowy, zastosować temat N° 4'
  hu: 'Ha a (CIROCCO) kombinált kijelzőegység jelen van, alkalmazza a 3 számú témát Ha a kombinált kijelzőegység egy mátrixos kijelzővel van felszerelve, alkalmazza a 4 számú témát'
kind: 'config'
access: 'read-write'
length: 1

