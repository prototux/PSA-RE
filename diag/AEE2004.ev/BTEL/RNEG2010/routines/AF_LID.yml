routine: 0xAF
name: 'ROUTINE_AF'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  CONTROL_PARAMETER_1:
    bits: '1.7-1.0'
    type: 'enum'

  SR_HISTORY_SW_ID:
    bits: '2.7-3.0'
    type: 'uint'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x00:
        en: 'Control not started'
        fr: 'Pilotage non lancé'
        es: 'Pilotaje no lanzado'
        de: 'Steuerung nicht gestartet'
        pl: 'Sterowanie nie uruchomione'
        hu: 'Vezérlés nincs elindítva'
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Control of the unit completed'
        fr: 'Pilotage de l''organe terminé'
        es: 'Pilotaje del órgano terminado'
        de: 'Steuerung des Bauteils beendet'
        pl: 'Sterowanie elementem zakończone'
        hu: 'Az egység vezérlése befejezve'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje detenido'
        de: 'Steuerung abgebrochen'
        pl: 'Sterowanie zatrzymane'
        hu: 'Vezérlés leállítva'
      0x12:
        en: 'Control completed but presence of a problem'
        fr: 'Pilotage terminé mais problème'
        es: 'Pilotaje terminado pero problema'
        de: 'Steuerung beendet, jedoch Problem'
        pl: 'Sterowanie zakończone, ale wystąpił problem'
        hu: 'Vezérlés befejezve de probléma lépett fel'

  SR_HISTORY_SW_YEAR:
    bits: '2.7-2.0'
    type: 'uint'

  SR_HISTORY_SW_MOIS:
    bits: '4.7-4.0'
    type: 'uint'

  SR_HISTORY_SW_JOUR:
    bits: '5.7-5.0'
    type: 'uint'

  SR_HISTORY_SW_HW_ID:
    bits: '6.7-6.0'
    type: 'uint'

  SR_HISTORY_SW_DISK_ID:
    bits: '7.7-11.0'
    type: 'bytes'
