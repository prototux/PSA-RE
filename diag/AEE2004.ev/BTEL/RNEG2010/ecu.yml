node: 'BTEL'
model: 'RNEG2010'
display_name:
  en: 'Head unit (radio, phone, navigation) (RNEG2010)'
  fr: 'Autoradio telematique (radio, telephone, navigation) (RNEG2010)'
protocols: ['KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'KWP-PSA2000'
    request_id: 0x764
    response_id: 0x664
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'
  0xC0:
    en: 'PSA diagnostic session'
    fr: 'Session de diagnostic PSA'

services: [0x10, 0x14, 0x17, 0x21, 0x27, 0x30, 0x31, 0x3B, 0x3E]

security_access:
  - level: 0x83

tester_present:
  request: '3E'
  period_ms: 1000

identification:
  request: '21 80'
  part_number: '19.7-22.0'
  comment:
    en: 'The ECU part number is in data bytes 19 to 22 of the answer to 21 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 19 à 22 de la réponse à 21 80 (DCB), elle donne la variante logicielle'

cars: ['A5', 'B5', 'B7', 'B8', 'B9', 'G9', 'T7', 'T8', 'VCAN', 'W2', 'X7']

