ioctl: 0x85
name: 'FRONT_RH_SPEAKER'
display_name:
  en: 'Front RH speaker'
  fr: 'Haut-parleur avant droit'
  es: 'Altavoz delantero derecho'
  de: 'Lautsprecher vorne rechts'
  pl: 'Prawy przedni głośnik'
  hu: 'Jobb első hangszóró'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER_1:
    bits: '1.7-1.0'
    type: 'enum'

  IO_HP_SELECT:
    bits: '2.7-4.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'
      0x12:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'

tests:
  - display_name:
      en: 'Front RH speaker'
      fr: 'Haut-parleur avant droit'
      es: 'Altavoz delantero derecho'
      de: 'Lautsprecher vorne rechts'
      pl: 'Prawy przedni głośnik'
      hu: 'Jobb első hangszóró'
    max_duration_ms: 5000
  - display_name:
      en: 'Front LH speaker'
      fr: 'Haut-parleur avant gauche'
      es: 'Altavoz delantero izquierdo'
      de: 'Lautsprecher vorne links'
      pl: 'Lewy przedni głośnik'
      hu: 'Bal első hangszóró'
    max_duration_ms: 5000
  - display_name:
      en: 'Rear right speaker'
      fr: 'Haut-parleur arrière droit'
      es: 'Altavoz trasero derecho'
      de: 'Lautsprecher hinten rechts'
      pl: 'Prawy tylny glośnik'
      hu: 'Jobb hátsó hangszóró'
    max_duration_ms: 5000
  - display_name:
      en: 'Left hand rear speaker'
      fr: 'Haut-parleur arrière gauche'
      es: 'Altavoz trasero izquierdo'
      de: 'Lautsprecher hinten links'
      pl: 'Lewy tylny glosnik'
      hu: 'Bal hátsó hangszóró'
    max_duration_ms: 5000
