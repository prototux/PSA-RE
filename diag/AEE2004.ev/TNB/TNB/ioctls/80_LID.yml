ioctl: 0x80
name: 'LIGHTING_ALL_WARNING_LAMPS'
display_name:
  en: 'Lighting of all the warning lamps.'
  fr: 'Allumage de tous les témoins.'
  es: 'Iluminación de todos los testigos.'
  de: 'Aufleuchten aller Leuchten.'
  pl: 'Zapalenie wszystkich kontrolek.'
  hu: 'Minden visszajelzés kigyulladása.'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

  RESERVED:
    bits: '2.7-2.0'
    unused: true

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Lighting of all the warning lamps.'
      fr: 'Allumage de tous les témoins.'
      es: 'Iluminación de todos los testigos.'
      de: 'Aufleuchten aller Leuchten.'
      pl: 'Zapalenie wszystkich kontrolek.'
      hu: 'Minden visszajelzés kigyulladása.'
    max_duration_ms: 5000
  - display_name:
      en: 'Switching off of all of the warning lights.'
      fr: 'Extinction de tous les témoins.'
      es: 'Extinción de todos los testigos.'
      de: 'Erlöschen aller Kontrollleuchten.'
      pl: 'Zgaśnięcie wszystkich kontrolek.'
      hu: 'Az összes visszajelzés kialvása.'
    max_duration_ms: 5000
  - display_name:
      en: 'Switching on of the air bag disarming warning light'
      fr: 'Allumage du témoin inhibition airbag'
      es: 'Iluminación del testigo de inhibición de airbag'
      de: 'Aufleuchten der Kontrollleuchte für Airbag-Deaktivierung'
      pl: 'Zapalenie się kontrolki wyłączenia poduszki powietrznej'
      hu: 'A légzsák semlegesítés visszajelzés kigyulladása'
    max_duration_ms: 5000
