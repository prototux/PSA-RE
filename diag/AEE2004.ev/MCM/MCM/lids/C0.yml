lid: 0xC0
name: 'COUNTER_CONTROL'
display_name:
  en: 'Counter control'
  fr: 'Compteur de molette'
  es: 'Contador de botón giratorio'
  de: 'Zähler des Einstellrads'
  pl: 'Licznik pokrętła'
  hu: 'Tekerőgomb számláló'
comment:
  en: 'When the control is moved clockwise one step, the control counter value is increased by one step. When the control is moved anti-clockwise one step, the control counter value is decreased by one step. When the value is less than -32 or greater than +31, the control counter changes to.'
  fr: 'Lorsqu''un déplacement de la molette d''un pas dans le sens horaire est effectué, la valeur du compteur de molette est incrémenté d''un pas. Lorsqu''un déplacement de la molette d''un pas dans le sens antihoraire est effectué, la valeur du compteur de molette est décrémenté d''un pas. Lorsque la valeur est inférieure à -32 ou supérieure à +31, le compteur de molette passe à.'
  es: 'Al desplazar el botón giratorio un paso en el sentido de las agujas del reloj, el valor del contador del botón giratorio se incrementa un paso. Al desplazar el botón giratorio un paso en sentido contrario a las agujas del reloj, el valor del contador del botón giratorio disminuye un paso. Cuando el valor es inferior a -32 o superior a +31, el contador del botón giratorio pasa a.'
  de: 'Wenn das Einstellrad um einen Schritt im Uhrzeigersinn bewegt wurde, wird der Wert des Zählers für das Einstellrad um einen Schritt erhöht. Wenn das Einstellrad um einen Schritt entgegen dem Uhrzeigersinn bewegt wurde, wird der Wert des Zählers für das Einstellrad um einen Schritt verringert. Wenn der Wert niedriger als -32 bzw. höher als +31 ist, wechselt der Zähler des Einstellrads auf.'
  pl: 'Jeżeli przesuniemy pokrętło o jeden ząbek w kierunku zgodnym z ruchem wskazówek zegara, wartość licznika pokrętła jest zwiększona o jeden skok. Jeżeli przesuniemy pokrętło o jeden ząbek w kierunku przeciwnym w stosunku do ruchu wskazówek zegara, wartość licznika pokrętła jest zmniejszona o jeden skok. Gdy wartość jest niższa od -32 lub wyższa od +31, licznik pokrętła przechodzi na.'
  hu: 'Amikor a tekerőgomb egy lépéssel az óramutató járásának irányába elmozdításra kerül a tekerőgomb számláló értéke egy lépéssel megnövelésre kerül. Amikor a tekerőgomb egy lépéssel az óramutató járásával ellentétes irányba elmozdításra kerül a tekerőgomb számláló értéke egy lépéssel lecsökkentésre kerül. Amikor az érték -32 alatti vagy +31 feletti a tekerőgomb számláló -ra tér át.'
kind: 'live'
access: 'read'
length: 1

