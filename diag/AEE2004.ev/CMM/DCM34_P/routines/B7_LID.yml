routine: 0xB7
name: 'MOVEMENT_AIR_MIXER'
display_name:
  en: 'Movement of the air mixer'
  fr: 'Déplacement du doseur d''air'
  es: 'Desplazamiento del dosificador de aire'
  de: 'Verschiebung der Luftdosierklappe'
  pl: 'Przesunięcie dozownika powietrza'
  hu: 'Levegőadagoló elmozdulása'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start', 'stop']

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

  RESERVED:
    bits: '2.7-2.0'
    unused: true

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

  CONTROL_STATUS_2:
    bits: '2.7-2.0'
    type: 'enum'
    values:
      0x01:
        en: 'Actuator jammed (disengaged)'
        fr: 'Actionneur bloqué (désengagé)'
        es: 'Accionador bloqueado (desengranado)'
        de: 'Stellglied blockiert (gelöst)'
        pl: 'Urządzenie wykonawcze zablokowane (odłączone)'
        hu: 'Blokkolt beavatkozószerv (kikapcsolt)'
      0x02:
        en: 'Actuator jammed (engaged)'
        fr: 'Actionneur bloqué (engagé)'
        es: 'Accionador bloqueado (engranado)'
        de: 'Stellglied blockiert (aktiviert)'
        pl: 'Urządzenie wykonawcze zablokowane (włączone)'
        hu: 'Blokkolt beavatkozószerv (bekapcsolt)'
      0x03:
        en: 'Protection activated'
        fr: 'Protection activée'
        es: 'Protección activa'
        de: 'Schutz aktiviert'
        pl: 'Zabezpieczenie włączone'
        hu: 'Védelem aktiválva'

