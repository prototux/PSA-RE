ioctl: 0x46
name: 'ELECTRICAL_TESTING_ADDITIONAL_HEATING'
display_name:
  en: 'Electrical testing of the additional heating'
  fr: 'Test électrique du Chauffage additionnel'
  es: 'Test eléctrico de la Calefacción adicional'
  de: 'Elektrischer Test der Zusatzheizung'
  pl: 'Test elektryczny Ogrzewania dodatkowego'
  hu: 'Kiegészítő fűtés elektromos tesztje'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

  TEST_REPORT:
    bits: '2.7-2.0'
    comment:
      en: 'Test report'
      fr: 'Compte-rendu du test'
      es: 'Informe del test'
      de: 'Testbericht'
      pl: 'Sprawozdanie z testu'
      hu: 'A teszt összefoglalása'
    type: 'enum'
    values:
      0x00:
        en: 'No fault'
        fr: 'Pas de défaut'
        es: 'No hay defecto'
        de: 'Kein Fehler'
        pl: 'Brak defektu'
        hu: 'Nincs hiba'
      0x01:
        en: 'Fault detected on control line No 1'
        fr: 'Défaut détecté sur la ligne de commande N°1'
        es: 'Defecto detectado en la línea de mando N°1'
        de: 'Fehler auf der Steuerleitung Nr. 1 erkannt'
        pl: 'Usterka wykryta na linii sterowania nr 1'
        hu: '1 számú vezérlővezetéken észlelt hiba'
      0x02:
        en: 'Battery voltage incorrect'
        fr: 'Tension batterie incorrecte'
        es: 'Tensión de batería incorrecta'
        de: 'Batteriespannung nicht korrekt'
        pl: 'Napięcie akumulatora nieprawidłowe'
        hu: 'Helytelen akkufeszültség'
      0x04:
        en: 'Fault detected on control line No 2'
        fr: 'Défaut détecté sur la ligne de commande N°2'
        es: 'Defecto detectado en la línea de mando N°2'
        de: 'Fehler auf der Steuerleitung Nr. 2 erkannt'
        pl: 'Usterka wykryta na linii sterowania nr 2'
        hu: '2 számú vezérlővezetéken észlelt hiba'
      0x08:
        en: 'Battery voltage incorrect'
        fr: 'Tension batterie incorrecte'
        es: 'Tensión de batería incorrecta'
        de: 'Batteriespannung nicht korrekt'
        pl: 'Napięcie akumulatora nieprawidłowe'
        hu: 'Helytelen akkufeszültség'

tests:
  - display_name:
      en: 'Electrical testing of the additional heating'
      fr: 'Test électrique du Chauffage additionnel'
      es: 'Test eléctrico de la Calefacción adicional'
      de: 'Elektrischer Test der Zusatzheizung'
      pl: 'Test elektryczny Ogrzewania dodatkowego'
      hu: 'Kiegészítő fűtés elektromos tesztje'
