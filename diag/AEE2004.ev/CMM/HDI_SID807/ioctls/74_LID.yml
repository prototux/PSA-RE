ioctl: 0x74
name: 'AIR_MIXER_TEST'
display_name:
  en: 'Air mixer test'
  fr: 'Test du doseur d''air'
  es: 'Test del dosificador de aire'
  de: 'Test des Luftdosierers'
  pl: 'Test dozownika powietrza'
  hu: 'Levegő adagoló teszt'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

  TEST_REPORT:
    bits: '2.7-2.0'
    comment:
      en: 'Test report'
      fr: 'Compte-rendu du test'
      es: 'Informe del test'
      de: 'Testbericht'
      pl: 'Sprawozdanie z testu'
      hu: 'A teszt összefoglalása'
    type: 'enum'
    values:
      0x00:
        en: 'No fault'
        fr: 'Pas de défaut'
        es: 'No hay defecto'
        de: 'Kein Fehler'
        pl: 'Brak defektu'
        hu: 'Nincs hiba'
      0x01:
        en: 'Actuator jammed'
        fr: 'Actionneur bloqué'
        es: 'Accionador bloqueado'
        de: 'Stellglied blockiert'
        pl: 'Zablokowany element wykonawczy'
        hu: 'Beavatkozószerv blokkolva'
      0x02:
        en: 'Actuator soiled'
        fr: 'Actionneur encrassé'
        es: 'Accionador sucio'
        de: 'Stellglied verschmutzt'
        pl: 'Urządzenie wykonawcze zanieczyszczone'
        hu: 'Beavatkozószerv elkormosodva'
      0x04:
        en: 'The programming of the actuator has not been carried out'
        fr: 'Les apprentissages de l''actionneur n''ont pas pu être fait'
        es: 'Los aprendizajes del accionador no pueden realizarse'
        de: 'Die Einspeicherungen des Stellglieds konnten nicht durchgeführt werden'
        pl: 'Nie można było wykonać uczenia urządzenia wykonawczego'
        hu: 'A beavatkozószerv megismertetése nem végezhető el'

tests:
  - display_name:
      en: 'Air mixer test'
      fr: 'Test du doseur d''air'
      es: 'Test del dosificador de aire'
      de: 'Test des Luftdosierers'
      pl: 'Test dozownika powietrza'
      hu: 'Levegő adagoló teszt'
