lid: 0xCE
name: 'ENGINE_STATUS'
display_name:
  en: 'Engine status'
  fr: 'État du moteur'
  es: 'Estado del motor'
  de: 'Zustand des Motors'
  pl: 'Stan silnika'
  hu: 'A motor állapota'
comment:
  en: 'The various statuses are : cut or stalled, in preparation, driven starting, autonomous starting, engine running, driven restarting, autonomous restarting'
  fr: 'Les différents états sont : coupé ou calé, en préparation, démarrage entraîné, démarrage autonome, moteur tournant, redémarrage entraîné, redémarrage autonome'
  es: 'Los diferentes estados son : cortado o calado, en preparación, arranque movido, puesta en marcha autónoma, motor en marcha, nueva puesta en marcha accionada, nueva puesta en marcha autónoma'
  de: 'Es gibt die folgenden Zustände : abgestellt oder abgestorben, in Vorbereitung, Antrieb anlassen, autonomer Start, laufender Motor, Neustart in Fahrt, autonomer Neustart'
  pl: 'Poszczególne stany to : odcięty lub zablokowany, w trakcie przygotowania, rozruch napędzany, niezależny rozruch, podczas pracy silnika, ponowny rozruch pojazdu jadącego, ponowny niezależny rozruch'
  hu: 'A különböző állapotok : lekapcsolt vagy lefulladt, előkészítésben, kényszerített beindítás, önálló indítás, járó motor, meghajtott újraindítás, önálló újraindítás'
kind: 'live'
access: 'read'
length: 11

