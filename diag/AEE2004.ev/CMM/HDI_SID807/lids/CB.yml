lid: 0xCB
name: 'LID_CB'
display_name:
  en: 'Data record 0xCB (18 values)'
  fr: 'Enregistrement 0xCB (18 valeurs)'
kind: 'other'
access: 'read'
length: 32

params:
  ENGINE_SPEED:
    bits: '1.7-2.0'
    comment:
      en: 'Engine speed'
      fr: 'Régime moteur'
      es: 'Régimen motor'
      de: 'Motordrehzahl'
      pl: 'Prędkość obrotowa silnika'
      hu: 'Motor fordulatszám'
    type: 'uint'
    units: 'rpm'

  MIXTURE_CALCULATED_O2_SENSOR:
    bits: '5.7-6.0'
    comment:
      en: 'Mixture calculated by the O2 sensor'
      fr: 'Richesse calculée par la sonde O2'
      es: 'Riqueza calculada por la sonda O2'
      de: 'Über die Lambda-Sonde berechnetes Gemisch'
      pl: 'Obliczony skład mieszanki przez sondę O2'
      hu: 'Lambda-szonda által kalkulált keveréksűrűség'
    type: 'uint'
    factor: 0.001

  ACTIVATION_OXYGEN_SENSOR_HEATING:
    bits: '7.7-7.0'
    comment:
      en: 'Activation of the oxygen sensor heating'
      fr: 'Activation du chauffage de la sonde à oxygène'
      es: 'Activación del calentamiento de la sonda de oxígeno'
      de: 'Aktivierung der Lambdasondenheizung'
      pl: 'Aktywacja grzania sondy tlenowej'
      hu: 'A lambdaszonda fűtésének aktiválása'
    type: 'uint'
    units: '%'

  TOTAL_WEIGHT_SOOT_PARTICLE_FILTER:
    bits: '10.7-11.0'
    comment:
      en: 'Total weight of soot in the particle filter'
      fr: 'Masse totale de suie dans le filtre à particules'
      es: 'Masa total de hollín en el filtro de partículas'
      de: 'Gesamtgewicht Russ im Partikelfilter'
      pl: 'Masa całkowita sadzy w filtrze cząstek stałych'
      hu: 'A részecskeszűrőben lévő korom teljes mennyiség'
    type: 'uint'
    factor: 0.001
    units: 'G/l'

  ASH_LEVEL_PARTICLE_FILTER:
    bits: '12.7-12.0'
    comment:
      en: 'Ash level in the particle filter'
      fr: 'Taux de cendres dans le filtre à particules'
      es: 'Índice de cenizas en el filtro de partículas'
      de: 'Aschegehalt im Partikelfilter'
      pl: 'Zawartość popiołów w filtrze cząstek stałych'
      hu: 'Hamu aránya a részecskeszűrőben'
    type: 'uint'
    units: '%'

  DISTANCE_REMAINING_BEFORE_REPLACEMENT_PARTICLE:
    bits: '13.7-15.0'
    comment:
      en: 'Distance remaining before replacement of the particle filter'
      fr: 'Distance restante avant remplacement du filtre à particules'
      es: 'Distancia restante para la sustitución del filtro de partículas'
      de: 'Verbleibende Entfernung vor dem Austausch des Luftfilters'
      pl: 'Pozostały przebieg przed wymianą filtra cząstek stałych'
      hu: 'A részecskeszűrőcseréig hátramaradt távolság'
    type: 'uint'
    units: 'km'

  DIFFERENCE_PRESSURE_BETWEEN_PARTICULATE_EMISSION:
    bits: '16.7-17.0'
    comment:
      en: 'Difference in pressure between particulate emission filter input/output'
      fr: 'Différence pression entrée/sortie filtre à particules'
      es: 'Diferencia de presión entrada/salida del filtro partículas'
      de: 'Druckdifferenz Eintritt/Austritt Partikelfilter'
      pl: 'Różnica ciśnienia wejście/wyjście filtra cząsteczek'
      hu: 'Részecskeszuro bemenet/kimenet közötti nyomáskülönbség'
    type: 'uint'
    units: 'mbar'

  VOLUME_ADDITIVE_TANK:
    bits: '18.7-19.0'
    comment:
      en: 'Volume of the additive tank'
      fr: 'Volume du réservoir d''additif'
      es: 'Volumen del depósito de aditivo'
      de: 'Volumen des Additivbehälters'
      pl: 'Pojemność zbiornika dodatku do paliwa'
      hu: 'Adaléktartály térfogata'
    type: 'uint'
    units: 'mL'

  AMOUNT_ADDITIVE_ADDITIVE_TANK:
    bits: '20.7-21.0'
    comment:
      en: 'Amount of additive in the additive tank'
      fr: 'Volume d''additif restant dans le réservoir d''additif'
      es: 'Volumen de aditivo restante en el depósito de aditivo'
      de: 'Menge von Additiv noch im Additivbehälter'
      pl: 'Objetosc dodatku pozostala w zbiorniku dodatku'
      hu: 'Az adalékanyagtartályban maradt adalékanyag mennyiség'
    type: 'uint'
    units: 'mL'

  PARTICLE_FILTER_UPSTREAM_TEMPERATURE:
    bits: '26.7-27.0'
    comment:
      en: 'Particle filter upstream temperature'
      fr: 'Température en amont du filtre à particules'
      es: 'Temperatura por encima del filtro de partículas'
      de: 'Eintrittstemperatur Partikelfilter'
      pl: 'Temperatura na wejściu FAP'
      hu: 'Részecskeszűrő előtti hőmérséklet'
    type: 'uint'
    units: '°C'

  STATUS_REGENERATION:
    bits: '28.2'
    comment:
      en: 'Status of the regeneration'
      fr: 'Etat de la régénération'
      es: 'Estado de la regeneración'
      de: 'Zustand der Regenerierung'
      pl: 'Stan regeneracji'
      hu: 'A regenerálás állapota'
    type: 'bool'
    values:
      0x00:
        en: 'Inactive'
        fr: 'Inactivé'
        es: 'Inactivo'
        de: 'Nicht aktiviert'
        pl: 'Nie uaktywniony'
        hu: 'Hatástalanított'
      0x01:
        en: 'Active'
        fr: 'Active'
        es: 'Activo'
        de: 'Aktiv'
        pl: 'Aktywny(a)(e)'
        hu: 'Aktív'

  POWER_CONSUMING_EQUIPMENT_ACTIVATION_REQUEST:
    bits: '28.3'
    comment:
      en: 'Power consuming equipment activation request'
      fr: 'Demande d''activation des consommateurs'
      es: 'Petición de activación de los consumidores'
      de: 'Einschaltung der Verbraucher'
      pl: 'Żądanie aktywacji odbiorników'
      hu: 'Fogyasztók aktiválásának kérése'
    type: 'bool'
    values:
      0x00:
        en: 'NO'
        fr: 'NON'
        es: 'NO'
        de: 'NEIN'
        pl: 'NIE'
        hu: 'NEM/NINCS'
      0x01:
        en: 'Yes'
        fr: 'Oui'
        es: 'Sí'
        de: 'Ja'
        pl: 'Tak'
        hu: 'Igen'

  AUTHORISATION_OF_REGENERATION:
    bits: '28.4'
    comment:
      en: 'Authorisation of regeneration'
      fr: 'Autorisation de la régénération'
      es: 'Autorización de la regeneración'
      de: 'Freigabe der Regenerierung'
      pl: 'Autoryzacja regeneracji'
      hu: 'A regenerálás engedélyezése'
    type: 'bool'
    values:
      0x00:
        en: 'NO'
        fr: 'NON'
        es: 'NO'
        de: 'NEIN'
        pl: 'NIE'
        hu: 'NEM/NINCS'
      0x01:
        en: 'Yes'
        fr: 'Oui'
        es: 'Sí'
        de: 'Ja'
        pl: 'Tak'
        hu: 'Igen'

  MINIMUM_ADDITIVE_LEVEL:
    bits: '28.0'
    comment:
      en: 'Minimum additive level'
      fr: 'Niveau minimum d''additif'
      es: 'Nivel mínimo de aditivo'
      de: 'Additiv-Mindeststand'
      pl: 'Poziom minimalny dodatku'
      hu: 'Minimális adalékszint'
    type: 'bool'
    values:
      0x00:
        en: 'Minimum level not reached'
        fr: 'Niveau minimum non atteint'
        es: 'Nivel mínimo no alcanzado'
        de: 'Mindeststand nicht erreicht'
        pl: 'Poziom minimum nieosiagniety'
        hu: 'Minimális szint nem kerül elérésre'
      0x01:
        en: 'Minimum level reached'
        fr: 'Niveau minimum atteint'
        es: 'Nivel mínimo alcanzado'
        de: 'Mindeststand erreicht'
        pl: 'Poziom minimalny osiągnięty'
        hu: 'Minimális szint elérve'

  DPF_PRESSURE_INFO:
    bits: '28.1'
    type: 'bool'

  EXHAUST_HEAT_RECOVERY:
    bits: '28.5'
    comment:
      en: 'Exhaust heat recovery'
      fr: 'Récupération thermique à l''échappement'
      es: 'Recuperación térmica en el escape'
      de: 'Abgas-Wärmerückgewinnung'
      pl: 'Odzysk ciepła z układu wydechowego'
      hu: 'Hővisszanyerés a kipufogócsőnél'
    type: 'bool'
    values:
      0x00:
        en: 'Inactive'
        fr: 'Inactivé'
        es: 'Inactivo'
        de: 'Nicht aktiviert'
        pl: 'Nie uaktywniony'
        hu: 'Hatástalanított'
      0x01:
        en: 'Active'
        fr: 'Active'
        es: 'Activo'
        de: 'Aktiv'
        pl: 'Aktywny(a)(e)'
        hu: 'Aktív'

  DISTANCE_TRAVELLED_SINCE_LAST_REGENERATION:
    bits: '29.7-30.0'
    comment:
      en: 'Distance travelled since the last regeneration'
      fr: 'Distance parcourue depuis la dernière régénération'
      es: 'Distancia recorrida desde la última regeneración'
      de: 'Zurückgelegte Wegstrecke seit der letzten Regenerierung'
      pl: 'Odległość przebyta od ostatniej regeneracji'
      hu: 'Az utolsó regenerálás óta megtett távolság'
    type: 'uint'
    units: 'km'

  AVERAGE_DISTANCE_BETWEEN_LAST_10_REGENERATIONS:
    bits: '31.7-32.0'
    comment:
      en: 'Average distance between the last 10 regenerations'
      fr: 'Distance moyenne entre les 10 dernières régénérations'
      es: 'Distancia media entre las 10 últimas regeneraciones'
      de: 'Mittlere Wegstrecke zwischen den 10 letzten Regenerierungen'
      pl: 'Średnia odległość między 10 ostatnimi regeneracjami'
      hu: '10 utolsó regenerálás közötti közepes távolság'
    type: 'uint'
    units: 'km'
