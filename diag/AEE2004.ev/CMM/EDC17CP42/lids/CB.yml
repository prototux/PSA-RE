length: 45
variants: ['W2_*']

params:
  ENGINE_SPEED:
    bits: '1.7-2.0'
    comment:
      en: 'Engine speed'
      fr: 'Régime moteur'
      es: 'Régimen motor'
      de: 'Motordrehzahl'
      pl: 'Prędkość obrotowa silnika'
      hu: 'Motor fordulatszám'
    type: 'uint'
    units: 'rpm'

  VEHICLE_SPEED:
    bits: '3.7-3.0'
    comment:
      en: 'Vehicle speed'
      fr: 'Vitesse véhicule'
      es: 'Velocidad vehículo'
      de: 'Fahrtgeschwindigkeit'
      pl: 'Predkosc pojazdu'
      hu: 'Gépjárműsebesség'
    type: 'uint'
    units: 'km/h'

  MIXTURE_CALCULATED_OXYGEN_SENSOR:
    bits: '5.7-6.0'
    comment:
      en: 'Mixture calculated from the oxygen sensor'
      fr: 'Richesse calculée à partir de la sonde à oxygène'
      es: 'Riqueza calculada a partir de la sonda a oxígeno'
      de: 'Ausgehend von der Lambdasonde berechnetes Gemisch'
      pl: 'Wzbogacenie obliczone w oparciu o sondę tlenu'
      hu: 'A lambdaszondából kiindulva kikalkulált keverékarány'
    type: 'uint'
    factor: 0.001

  OCR_UPSTREAM_OXYGEN_SENSOR_HEATING:
    bits: '7.7-7.0'
    comment:
      en: 'OCR of the upstream oxygen sensor heating'
      fr: 'RCO du chauffage de la sonde à oxygène amont'
      es: 'RCO del calentamiento de la sonda de oxígeno delantera'
      de: 'TV der Heizung der Lambdasonde vor Katalysator'
      pl: 'RCO ogrzewania sondy tlenowej "przed'
      hu: 'Az első lambdaszonda fűtésének ciklikus nyitási aránya (RCO)'
    type: 'uint'
    units: '%'

  UPSTREAM_OXYGEN_SENSOR_VOLTAGE:
    bits: '8.7-9.0'
    comment:
      en: 'Upstream oxygen sensor voltage'
      fr: 'Tension de la sonde à oxygène amont'
      es: 'Tensión de la sonda de oxígeno delantera'
      de: 'Spannung der Lambdasonde vor Katalysator'
      pl: 'Napięcie sondy lambda na wejściu'
      hu: 'Első lambda-szonda feszültsége'
    type: 'uint'
    units: 'mV'

  PARTICLE_FILTER_SOOT_LOAD:
    bits: '10.7-11.0'
    comment:
      en: 'Particle filter soot load'
      fr: 'Charge en suie du filtre à particules'
      es: 'Carga de carbonilla en el filtro de partículas'
      de: 'Rußbelastung des Partikelfilters'
      pl: 'Napełnienie filtra cząstek stałych sadzą'
      hu: 'A légszűro koromterhelése'
    type: 'uint'
    factor: 0.001
    units: 'G/l'

  ASH_LEVEL_PARTICLE_FILTER:
    bits: '12.7-12.0'
    alt_names: ['PARTICLE_FILTER_CLOGGING_LEVEL']
    comment:
      en: 'Ash level in the particle filter'
      fr: 'Taux de cendres dans le filtre à particules'
      es: 'Índice de cenizas en el filtro de partículas'
      de: 'Aschegehalt im Partikelfilter'
      pl: 'Zawartość popiołów w filtrze cząstek stałych'
      hu: 'Hamu aránya a részecskeszűrőben'
    type: 'uint'
    units: '%'

  DISTANCE_REMAINING_UNTIL_PARTICLE_FILTER:
    bits: '13.7-15.0'
    comment:
      en: 'Distance remaining until particle filter cleaning or replacement'
      fr: 'Distance restante jusqu''au nettoyage ou changement du filtre à particules'
      es: 'Distancia restante hasta la limpieza o cambio del filtro de partículas'
      de: 'Verbleibende Strecke bis zur Reinigung oder zum Austausch des Partikelfilters'
      pl: 'Droga pozostala do momentu oczyszczania albo wymiany filtra czastek stalych'
      hu: 'A részecskeszűro tisztításáig vagy cseréjéig hátralévo távolság'
    type: 'uint'
    units: 'km'

  PARTICLE_EMISSION_FILTER_DIFFERENTIAL_PRESSURE:
    bits: '16.7-17.0'
    comment:
      en: 'Particle emission filter differential pressure'
      fr: 'Pression différentielle filtre à particules'
