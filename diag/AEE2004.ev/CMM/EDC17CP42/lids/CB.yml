      hu: 'A légszűro regenerálásának állapota'
    type: 'bool'
    values:
      0x00:
        en: 'Not authorised'
        fr: 'Non autorisée'
        es: 'No autorizado'
        de: 'Nicht freigegeben'
        pl: 'Nie dopuszczony'
        hu: 'Nem engedélyezett'
      0x01:
        en: 'Authorised'
        fr: 'Autorisée'
        es: 'Autorizada'
        de: 'Freigeschaltet'
        pl: 'Dopuszczony'
        hu: 'Engedélyezett'

