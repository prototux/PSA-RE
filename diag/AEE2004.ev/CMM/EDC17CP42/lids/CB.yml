      pl: 'Ciśnienie różnicowe FAP'
      hu: 'Részecskeszűrő nyomáskülönbség'
    type: 'uint'
    units: 'mbar'

  VOLUME_ADDITIVE_ADDITIVE_TANK:
    bits: '18.7-19.0'
    comment:
      en: 'Volume of additive in the additive tank'
      fr: 'Volume d''additif du réservoir d''additif'
      es: 'Volumen de aditivo del depósito de aditivo'
      de: 'Additivvolumen des Additivtanks'
      pl: 'Objętość dodatku zbiornika dodatku'
      hu: 'Az adaléktartály mérete'
