lid: 0xCD
name: 'LID_CD'
display_name:
  en: 'Data record 0xCD (13 values)'
  fr: 'Enregistrement 0xCD (13 valeurs)'
kind: 'live'
access: 'read'
length: 20

params:
  ENGINE_SPEED:
    bits: '1.7-2.0'
    comment:
      en: 'Engine speed'
      fr: 'Régime moteur'
      es: 'Régimen motor'
      de: 'Motordrehzahl'
      pl: 'Prędkość obrotowa silnika'
      hu: 'Motor fordulatszám'
    type: 'uint'
    units: 'rpm'

  VEHICLE_SPEED:
    bits: '3.7-3.0'
    comment:
      en: 'Vehicle speed'
      fr: 'Vitesse véhicule'
      es: 'Velocidad vehículo'
      de: 'Fahrtgeschwindigkeit'
      pl: 'Predkosc pojazdu'
      hu: 'Gépjárműsebesség'
    type: 'uint'
    units: 'km/h'

  ENGINE_COOLANT_TEMPERATURE:
    bits: '4.7-4.0'
    comment:
      en: 'Engine coolant temperature'
      fr: 'Température eau moteur'
      es: 'Temperatura de agua motor'
      de: 'Kühlmitteltemperatur des Motors'
      pl: 'Temperatura plynu w ukladzie chlodzenia silnika'
      hu: 'Motor vízhőfok'
    type: 'uint'
    offset: -50
    units: '°C'

  COOLING_FAN_ASSEMBLY_SPEED_REFERENCE:
    bits: '5.7-5.0'
    comment:
      en: 'Cooling fan assembly speed reference'
      fr: 'Consigne de vitesse du groupe motoventilateur'
      es: 'Consigna de velocidad del grupo motoventilador'
      de: 'Sollgeschwindigkeit der Kühlerventilatorgruppe'
      pl: 'Wartość zadana prędkości zespołu wentylatora chłodnicy'
      hu: 'Motorventilátor-egység sebesség előírt érték'
    type: 'uint'
    units: '%'

  FAN_ASSEMBLY_SPEED_MEASUREMENT:
    bits: '6.7-6.0'
    comment:
      en: 'Fan assembly speed measurement'
      fr: 'Mesure de vitesse du groupe motoventilateur (GMV)'
      es: 'Medida de velocidad del grupo motoventilador (GMV)'
      de: 'Messung Drehzahl Kühlerlüftereinheit (GMV)'
      pl: 'Pomiar prędkości zespołu motowentylatora (GMV)'
      hu: 'Motorhűtőventilátor-egység (GMV) sebesség mért érték'
    type: 'uint'
    units: '%'

  COOLING_FAN_RELAY_CONTROL:
    bits: '7.7-7.0'
    comment:
      en: 'Cooling fan relay control'
      fr: 'Commande relais groupe motoventilateur'
      es: 'Mando relé grupo motoventilador'
      de: 'Betätigung Relais Kühlerventilatorgruppe'
      pl: 'Sterowanie przekaznika zespolu wentylatora chlodnicy'
      hu: 'Hűtőventilátor-relé vezérlése'
    type: 'enum'
    values:
      0x00:
        en: 'Not controlled'
        fr: 'Non piloté'
        es: 'No pilotado'
        de: 'Nicht gesteuert'
        pl: 'Nie pilotowany'
        hu: 'Nem vezérelt'
      0x01:
        en: 'Piloted (slow speed)'
        fr: 'Piloté (petite vitesse)'
        es: 'Pilotado (pequeña velocidad)'
        de: 'Gesteuert (niedrige Drehzahl)'
        pl: 'Sterowany (mała prędkość)'
        hu: 'Irányított (kis sebességfokozat)'

  FAN_RELAY_2:
    bits: '8.7-8.0'
    comment:
      en: 'Fan relay 2'
      fr: 'Relais GMV 2'
      es: 'Relé GMV 2'
      de: 'Kühlerlüfter-Relais 2'
      pl: 'Przeka«nik GMV 2'
      hu: 'Motorhutoventilátor-relé 2'
    type: 'enum'
    values:
      0x00:
        en: 'Not controlled'
        fr: 'Non piloté'
        es: 'No pilotado'
        de: 'Nicht gesteuert'
        pl: 'Nie pilotowany'
        hu: 'Nem vezérelt'
      0x01:
        en: 'Piloted (slow speed)'
        fr: 'Piloté (petite vitesse)'
        es: 'Pilotado (pequeña velocidad)'
        de: 'Gesteuert (niedrige Drehzahl)'
        pl: 'Sterowany (mała prędkość)'
        hu: 'Irányított (kis sebességfokozat)'

  AIR_CONDITIONING_ACTIVATION_STATUS:
    bits: '9.1-9.0'
    comment:
      en: 'Air conditioning activation status'
      fr: 'Etat d''activation de la climatisation'
      es: 'Estado de activación de la climatización'
      de: 'Aktivierungszustand der Klimaanlage'
      pl: 'Stan włączenia układu klimatyzacji'
      hu: 'A klimatizálás aktiválási állapota'
    type: 'enum'
    values:
      0x00:
        en: 'No request for air conditioning'
        fr: 'Pas de demande climatisation'
        es: 'No hay petición de climatización'
        de: 'Keine Anforderung Klimaanlage'
        pl: 'Brak żądania klimatyzacji'
        hu: 'Nincs klimatizálás kérés'
      0x01:
        en: 'Air conditioning request : authorisation refused by the engine ECU'
        fr: 'Demande climatisation : autorisation refusée par le calculateur moteur'
        es: 'Demanda de climatización : autorización rechazada por el calculador motor'
        de: 'Anforderung Klimaanlage : vom Motorsteuergerät abgelehnte Freigabe'
        pl: 'Żądanie klimatyzacji : autoryzacja odrzucona przez kalkulator silnika'
        hu: 'Légkondícionálás utasítás : A befecskendezés computer által visszautasított engedélyezés'
      0x02:
        en: 'No request for air conditioning'
        fr: 'Pas de demande climatisation'
        es: 'No hay petición de climatización'
        de: 'Keine Anforderung Klimaanlage'
        pl: 'Brak żądania klimatyzacji'
        hu: 'Nincs klimatizálás kérés'
      0x03:
        en: 'Air conditioning request : authorisation given by the engine ECU'
        fr: 'Demande climatisation : autorisation fournie par le calculateur moteur'
        es: 'Demanda de climatización : autorización proporcionada por el calculador motor'
        de: 'Anforderung Klimaanlage : vom Motor gelieferte Freigabe'
        pl: 'Żądanie klimatyzacji : autoryzacja dostarczona przez kalkulator silnika'
        hu: 'Légkondícionálás utasítás : A befecskendezés computer által szolgáltatott engedélyezés'

  AIR_CONDITIONING_CIRCUIT_PRESSURE:
    bits: '10.7-11.0'
    comment:
      en: 'Air conditioning circuit pressure'
      fr: 'Pression du circuit de climatisation'
      es: 'Presión del circuito de climatización'
      de: 'Kältemitteldruck der Klimaanlage'
      pl: 'Ciśnienie obwodu klimatyzacji'
      hu: 'Klímakör nyomása'
    type: 'uint'
    factor: 0.1
    units: 'bar'

  OIL_PRESSURE:
    bits: '12.7-12.0'
    comment:
      en: 'Oil pressure'
      fr: 'Pression d''huile'
      es: 'Presión de aceite'
      de: 'Öldruck'
      pl: 'Ciśnienie oleju'
      hu: 'Olajnyomás'
    type: 'enum'
    values:
      0x00:
        en: 'Oil pressure OK'
        fr: 'Pression d''huile OK'
        es: 'Presión de aceite OK'
        de: 'Öldruck OK'
        pl: 'Ciśnienie oleju OK'
        hu: 'Olajnyomás OK'
      0x01:
        en: 'Insufficient oil pressure'
        fr: 'Pression d''huile insuffisante'
        es: 'Presión de aceite insuficiente'
        de: 'Öldruck zu niedrig'
        pl: 'Ciśnienie oleju niewystarczające'
        hu: 'Elégtelen olajnyomás'
      0xFF:
        en: 'Invalid value'
        fr: 'Valeur invalide'
        es: 'Valor no válido'
        de: 'Ungültiger Wert'
        pl: 'Wartość nieprawidłowa'
        hu: 'Érvénytelen érték'

  OIL_LEVEL_SENSOR_VOLTAGE:
    bits: '14.7-15.0'
    comment:
      en: 'Oil level sensor voltage'
      fr: 'Tension du capteur de niveau d''huile'
      es: 'Tensión del captador de nivel de aceite'
      de: 'Spannung des Ölstandsensors'
      pl: 'Napięcie czujnika poziomu oleju'
      hu: 'Olajszint érzékelő feszültsége'
    type: 'uint'
    units: 'mV'

  RAW_VOLTAGE_AIR_CONDITIONING_PRESSURE_SENSOR:
    bits: '18.7-19.0'
    comment:
      en: 'Raw voltage of the air conditioning pressure sensor'
      fr: 'Tension brute du capteur de pression climatisation'
      es: 'Tensión bruta del captador de presión de climatización'
      de: 'Rohwert Spannung des Ladedrucksensors'
      pl: 'Napięcie brutto czujnika ciśnienia klimatyzacji'
      hu: 'A légkondicionáló nyomásérzékelő bruttó feszültsége'
    type: 'uint'
    factor: 0.1
    units: 'mV'

  OIL_TEMPERATURE:
    bits: '20.7-20.0'
    comment:
      en: 'Oil temperature'
      fr: 'Température d''huile'
      es: 'Temperatura del aceite'
      de: 'Öltemperatur'
      pl: 'Temperatura oleju'
      hu: 'Olajhőmérséklet'
    type: 'uint'
    offset: -40
    units: '°C'
