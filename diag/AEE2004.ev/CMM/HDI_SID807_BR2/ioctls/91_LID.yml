        fr: 'Problème de charge ou de décharge.'
        es: 'Problema de carga o de descarga.'
        de: 'Problem der Ladung oder Entladung.'
        pl: 'Problem ładowania lub rozładowania.'
        hu: 'Töltési vagy kisülési probléma.'

