lid: 0xCD
name: 'LID_CD'
display_name:
  en: 'Data record 0xCD (10 values)'
  fr: 'Enregistrement 0xCD (10 valeurs)'
kind: 'other'
access: 'read'
length: 15

params:
  ENGINE_SPEED:
    bits: '1.7-2.0'
    comment:
      en: 'Engine speed'
      fr: 'Régime moteur'
      es: 'Régimen motor'
      de: 'Motordrehzahl'
      pl: 'Prędkość obrotowa silnika'
      hu: 'Motor fordulatszám'
    type: 'uint'
    units: 'rpm'

  COOLANT_TEMPERATURE:
    bits: '4.7-4.0'
    comment:
      en: 'Coolant temperature'
      fr: 'Température d''eau'
      es: 'Temperatura del agua'
      de: 'Kühlmitteltemperatur'
      pl: 'Temperatura płynu chłodzącego'
      hu: 'Hűtofolyadék-homérséklet'
    type: 'uint'
    offset: -50
    units: '°C'

  COOLING_FAN_ASSEMBLY_SPEED_REFERENCE:
    bits: '5.7-5.0'
    comment:
      en: 'Cooling fan assembly speed reference'
      fr: 'Consigne de vitesse du groupe motoventilateur'
      es: 'Consigna de velocidad del grupo motoventilador'
      de: 'Sollgeschwindigkeit der Kühlerventilatorgruppe'
      pl: 'Wartość zadana prędkości zespołu wentylatora chłodnicy'
      hu: 'Motorventilátor-egység sebesség előírt érték'
    type: 'uint'
    units: '%'

  FAN_ASSEMBLY_SPEED_MEASUREMENT:
    bits: '6.7-6.0'
    comment:
      en: 'Fan assembly speed measurement'
      fr: 'Mesure de vitesse du groupe motoventilateur (GMV)'
      es: 'Medida de velocidad del grupo motoventilador (GMV)'
      de: 'Messung Drehzahl Kühlerlüftereinheit (GMV)'
      pl: 'Pomiar prędkości zespołu motowentylatora (GMV)'
      hu: 'Motorhűtőventilátor-egység (GMV) sebesség mért érték'
    type: 'uint'
    units: '%'

  CONSIGNEGMV2:
    bits: '7.7-7.0'
    type: 'uint'

  FAN_ASSEMBLY_RELAY_2_STATUS:
    bits: '8.7-8.0'
    comment:
      en: 'Fan assembly relay 2 status'
      fr: 'État relais groupe motoventilateur (GMV) 2'
      es: 'Estado relé grupo motoventilador (GMV) 2'
      de: 'Zustand Relais Kühlerlüftereinheit (GMV) 2'
      pl: 'Stan przekaźnika zespołu motowentylatora (GMV) 2'
      hu: 'Motorhűtőventilátor-egység (GMV) relé 2 állapota'
    type: 'enum'
    values:
      0x00:
        en: 'Not controlled'
        fr: 'Non piloté'
        es: 'No pilotado'
        de: 'Nicht gesteuert'
        pl: 'Nie pilotowany'
        hu: 'Nem vezérelt'
      0x01:
        en: 'Piloted (slow speed)'
        fr: 'Piloté (petite vitesse)'
        es: 'Pilotado (pequeña velocidad)'
        de: 'Gesteuert (niedrige Drehzahl)'
        pl: 'Sterowany (mała prędkość)'
        hu: 'Irányított (kis sebességfokozat)'

  AIR_CONDITIONING_CIRCUIT_PRESSURE:
    bits: '10.7-11.0'
    comment:
      en: 'Air conditioning circuit pressure'
      fr: 'Pression du circuit de climatisation'
      es: 'Presión del circuito de climatización'
      de: 'Kältemitteldruck der Klimaanlage'
      pl: 'Ciśnienie obwodu klimatyzacji'
      hu: 'Klímakör nyomása'
    type: 'uint'
    factor: 0.1
    units: 'bar'

  OIL_PRESSURE:
    bits: '12.7-12.0'
    comment:
      en: 'Oil pressure'
      fr: 'Pression d''huile'
      es: 'Presión de aceite'
      de: 'Öldruck'
      pl: 'Ciśnienie oleju'
      hu: 'Olajnyomás'
    type: 'enum'
    values:
      0x00:
        en: 'OK'
        fr: 'OK'
        es: 'OK'
        de: 'OK'
        pl: 'OK'
        hu: 'Rendben'
      0x01:
        en: 'Insufficient'
        fr: 'Insuffisante'
        es: 'Insuficiente'
        de: 'Unzureichend'
        pl: 'Niedostateczne'
        hu: 'Elégtelen'

  OIL_TEMPERATURE:
    bits: '13.7-13.0'
    comment:
      en: 'Oil temperature'
      fr: 'Température d''huile'
      es: 'Temperatura del aceite'
      de: 'Öltemperatur'
      pl: 'Temperatura oleju'
      hu: 'Olajhőmérséklet'
    type: 'uint'
    offset: -50
    units: '°C'

  OIL_LEVEL:
    bits: '14.7-15.0'
    comment:
      en: 'Oil level'
      fr: 'Niveau d''huile'
      es: 'Nivel de aceite'
      de: 'Ölstand'
      pl: 'Poziom oleju'
      hu: 'Olajszint'
    type: 'uint'
    units: 'mV'
