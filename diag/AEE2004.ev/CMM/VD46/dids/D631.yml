did: 0xD631
name: 'TRACK_N_DEG_1_MINIMUM_LIMIT_MOTORISED_THROTTLE'
display_name:
  en: 'Track n°1 minimum limit motorised throttle housing programming value'
  fr: 'Valeur apprentissage du boîtier papillon motorisé butée minimale voie N° 1'
  es: 'Valor de aprendizaje de la caja mariposa motorizada tope mínimo vía nº1'
  de: 'Einspeicherungswert der elektrischen Drosselklappeneinheit Mindestanschlag Bahn Nr. 1'
  pl: 'Wartość procedury uczenia modułu przepustnicy z napędem skrajnego minimalnego położenia styk nr 1'
  hu: 'Motoros hajtású folytószelepház minimális véghelyzet megismertetési érték 1 számú pólus'
comment:
  en: '1 corresponds to sensor track 1. The ECU must reprogram the minimum and maximum values periodically to take ageing phenomena into account. if parts are replaced, the values must be reprogrammed in order to take into account the tolerance of the components.'
  fr: '1 correspond à la piste 1 du capteur. Le calculateur doit réapprendre les valeurs minimum et maximum périodiquement pour prendre en compte des phénomènes de vieillissement. en cas de changement de pièce les valeurs doivent être réapprises pour prendre en compte la tolérance des composants.'
  es: '1 corresponde a la pista 1 del captador. El calculador debe volver a aprender los valores mínimos y máximos periódicamente para tomar en cuenta los fenómenos de envejecimiento. en cado de cambio de pieza los valores deben volver a memorizarse para tener en cuenta la tolerancia de los componentes.'
  de: '1 entspricht der Bahn 1 des Sensors. Das Steuergerät muss die Mindest- und Maximalwerte periodisch neu einspeichern, um die Alterungsphänomene zu berücksichtigen. beim Austausch des Teils müssen die Werte neu eingespeichert werden, um die Toleranz der Bauteile zu berücksichtigen.'
  pl: '1 odpowiada sciezce 1 czujnika. Kalkulator powinien okresowo uczyć się wartości minimum i maksimum tak, aby móc uwzgledniać zjawiska starzenia. w przypadku wymiany części, wartości powinny być ponownie nauczone aby uwzględnić tolerancje komponentów.'
  hu: '1 megfelel az érzékelo 1 csatornájának. A számítóegységnek periódikusan újra meg kell tanulnia a minimális és maximális értékeket, hogy figyelembe veheto legyenek az öregedési jelenségek. alkatrészcsere esetén az értékeket újból meg kell ismertetni, az alkotóelemek türésének figyelembevétele érdekében.'
kind: 'live'
access: 'read'
length: 2

