name: 'CYLINDER_2_ADVANCE_REDUCTION'
display_name:
  en: 'Cylinder 2 advance reduction'
  fr: 'Retrait d''avance cylindre 2'
  es: 'Disminución del avance cilindro 2'
  de: 'Verringerung Frühverstellung Zylinder 2'
  pl: 'Cofnięcie wyprzedzenia cylindra 2'
