comment:
  en: 'It relates to the correction applied to the nominal advance to correct the knocking phenomena The advances applied to the cylinders must be roughly equivalent'
  fr: 'Il s''agit de la correction appliquée sur l''avance nominale pour corriger les phénomènes de cliquetis Les avances appliquées aux cylindres doivent être à peu près équivalentes'
  es: 'Se trata de la corrección aplicada en el avance nominal para corregir los fenómenos de picado Los avances aplicados a los cilindros deben casi equivalentes'
  de: 'Es geht um die Korrektur der Nenn-Zündverstellung, um Motor-Klopfen zu vermeiden Die an den Zylindern angewendeten Vorverstellungen müssen in etwa gleichwertig sein'
  pl: 'Chodzi o korekcję nominalnego wyprzedzenia wtrysku dla poprawienia zjawisk spalania stukowego Kąty wyprzedzenia zastosowane w cylindrach powinny być możliwie jednakowe'
  hu: 'A névleges előgyújtáson, a kopogási jelenség javítása érdekében alkalmazott korrekcióról van szó A hengereknél alkalmazott előtöltések (előgyújtások) közel egyenlők kell legyenek'
