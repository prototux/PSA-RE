comment:
  en: 'Parameter functional on vehicles fitted with an automatic gearbox or a controlled manual gearbox Gear ratio calculated from vehicle speed and engine speed Information measured by the engine management ECU'
  fr: 'Paramètre fonctionnel sur les véhicules équipés de boîte de vitesses automatique ou de boîte de vitesse manuelle pilotée Rapport de boîte calculé à partir de la vitesse véhicule et du régime moteur Information mesurée par le calculateur contrôle moteur'
  es: 'Parámetro funcional en los vehículos equipados con CCA o caja de cambios manual pilotada Relación de caja calculada a partir de la velocidad del vehículo y del régimen motor Información medida por el calculador de control motor'
  de: 'Parameter funktionsfähig bei Fahrzeugen mit Automatikgetriebe oder automatisiertem Schaltgetriebe Getriebegang ausgehend von der Fahrzeuggeschwindigkeit und der Motordrehzahl berechnet Vom Motorsteuergerät gemessene Information'
  pl: 'Parametr dostępny w pojazdach, wyposażonych w BVA lub ręczną sterowaną skrzynię biegów Przełożenie skrzynki biegów obliczone na podstawie prędkości pojazdu i obrotów silnika Informacja mierzona przez kalkulator sterowania silnika'
  hu: 'Működési paraméter az automata sebességváltóval vagy vezérelt mechanikus sebességváltó felszerelt gépjárműveken A motorfordulatszám és a járműsebesség alapján számított sebességfokozat Befecskendezés-computer által mért információ'
kind: 'live'
access: 'read'
length: 1

