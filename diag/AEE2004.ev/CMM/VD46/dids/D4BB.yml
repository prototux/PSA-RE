did: 0xD4BB
name: 'DOWNSTREAM_OXYGEN_SENSOR_REGULATION_STATUS'
display_name:
  en: 'Downstream oxygen sensor regulation status'
  fr: 'Etat de régulation de la sonde à oxygène aval'
  es: 'Estado de regulación de la sonda de oxígeno trasera'
  de: 'Zustand Regulierung der hinteren Lambdasonde'
  pl: 'Stan regulacji sondy lambda "Za'
  hu: 'A katalizátor utáni oxigénszonda szabályozási állapota'
comment:
  en: 'Open loop: the ECU does not use the downstream oxygen sensor to regulate richness. Closed loop: the ECU uses the downstream oxygen sensor to regulate richness. During normal operation, regulation is in open loop as the switch to closed loop only occurs in very specific conditions.'
  fr: 'Boucle ouverte : le calculateur n''utilise pas la sonde à oxygène aval pour réguler la richesse. Boucle fermée : le calculateur utilise la sonde à oxygène aval pour réguler la richesse. En fonctionnement normal, la régulation est en boucle ouverte car le passage en boucle fermé n''intervient que dans des conditions très particulières.'
  es: 'Bucle abierto: el calculador no utiliza la sonda de oxígeno delantera para regular la riqueza. Bucle cerrado: el calculador utiliza la sonda de oxígeno delantera para regular la riqueza. En funcionamiento normal, la regulación está en bucle abierta porque el paso en bucle cerrada sólo se efectúa en condiciones muy particulares.'
  de: 'Offener Regelkreis: Das Steuergerät nutzt die hintere Lambdasonde nicht für die Gemischregelung. Geschlossener Regelkreis: Das Steuergerät nutzt die hintere Lambdasonde für die Gemischregelung. Bei normaler Funktion erfolgt die Regulierung im offenen Kreis, da der Wechsel zum geschlossenen Kreis nur unter sehr speziellen Bedingungen erfolgt.'
  pl: 'Petla otwarta: kalkulator nie wykorzystuje sondy lambda "za" do regulacji wzbogacenia. Petla zamknieta: kalkulator wykorzystuje sonde lambda "za" do regulacji wzbogacenia. W warunkach normalnego dzialania, regulacja zachodzi w pętli otwartej ponieważ przejście do pętli zamkniętej ma miejsce tylko w bardzo szczególnych warunkach.'
  hu: 'Nyitott kör : a számítóegység a dúsítás szabályozáshoz nem használja a katalizátor utáni oxigénszondát. Zárt kör : a számítóegység a dúsítás szabályozáshoz használja a katalizátor utáni oxigénszondát. Normál működés esetén a szabályozás nyitott körrel működik, mert a zárt körré való átváltásra csak nagyon különleges körülmények között kerül sor.'
kind: 'live'
access: 'read'
length: 1

