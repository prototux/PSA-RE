routine: 0x03
name: 'LOW_PRESSURE_FUEL_PUMP_TEST'
display_name:
  en: 'Low pressure fuel pump test'
  fr: 'Test de la pompe basse pression carburant'
  es: 'Test de la bomba baja presión carburante'
  de: 'Test der Kraftstoffniederdruckpumpe'
  pl: 'Test pompy niskiego ciśnienia paliwa'
  hu: 'Az alacsony nyomású tüzelőanyagszivattyú tesztje'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  DID:
    bits: '1.7-2.0'
    type: 'uint'

results:
  DID:
    bits: '1.7-2.0'
    type: 'uint'

  ACTUATOR_TEST:
    bits: '3.7-3.0'
    alt_names:
      - 'ACTUATOR_TEST_2'
      - 'ACTUATOR_TEST_3'
      - 'ACTUATOR_TEST_4'
      - 'ACTUATOR_TEST_5'
      - 'CONTROL_STATUS_SCR'
      - 'ACTUATOR_TEST_6'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x02:
        en: 'Reinitialisation successful'
        fr: 'Réinitialisation réussie'
        es: 'Reiniciación conseguida'
        de: 'Wiederinitialisierung erfolgreich'
        pl: 'Ponowna inicjalizacja powiodła się'
        hu: 'Újrainicializálás sikeres'
      0x03:
        en: 'Reinitialisation failed'
        fr: 'La réinitialisation a échoué'
        es: 'La reinicialización ha fallado'
        de: 'Neuinitialisierung nicht erfolgreich'
        pl: 'Ponowna inicjalizacja nie powiodla sie'
        hu: 'Az újbóli beállítás nem sikerült'

