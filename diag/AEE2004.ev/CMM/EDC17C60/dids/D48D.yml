did: 0xD48D
name: 'TURBOCHARGING_PRESSURE_REFERENCE_VALUE'
display_name:
  en: 'Turbocharging pressure reference value'
  fr: 'Consigne de pression de suralimentation'
  es: 'Consigna de presión de sobrealimentación'
  de: 'Sollwert Ladedruck'
  pl: 'Wartość zadana ciśnienia turbodoładowania'
  hu: 'Töltőnyomás előírt értéke'
comment:
  en: 'This represents the turbocharging pressure that the ECU requires in the air intake circuit after the turbo. It determines the turbocharging pressure according to the requirements of the engine (observance of emission control, performance, etc.)'
  fr: 'Cela représente la pression de suralimentation que le calculateur souhaite dans le circuit d''admission d''air après le turbo. Il détermine la pression de suralimentation en fonction des besoins du moteur (respect de la dépollution, performance,...)'
  es: 'Esto representa la presión de sobrealimentación que el calculador desea en el circuito de admisión de aire después del turbo. Determina la presión de sobrealimentación en función de las necesidades del motor (respeto de la descontaminación, rendimiento...)'
  de: 'Dies stellt den Ladedruck dar, den das Steuergerät im Lufteinlasssystem nach dem Turbolader wünscht. Bestimmt den Ladedruck in Abhängigkeit von den Bedürfnissen des Motors (Einhaltung der Abgasnorm, Leistung...)'
  pl: 'To odpowiada ciśnieniu doładowania, żądanemu przez kalkulator. Określa ciśnienie doładowania w zależności od potrzeb silnika (przestrzeganie czystości spalin, osiągi...)'
  hu: 'Ez jellemzi a feltöltési nyomást, amit a computer a turbó utáni levegőszívó körben kíván. Ez a motor igényeinek függvényében meghatározza a feltöltési nyomást (teljesítmény, környezetvédelem betartása,...)'
kind: 'live'
access: 'read'
length: 2

