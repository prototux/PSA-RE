did: 0xD520
name: 'PARTICLE_FILTER_DIFFERENTIAL_PRESSURE'
display_name:
  en: 'Particle filter differential pressure'
  fr: 'Pression différentielle du filtre à particules'
  es: 'Presión diferencial del filtro de partículas'
  de: 'Differenzdruck des Partikelfilters'
  pl: 'Różnica ciśnień na filtrze cząstek stałych'
  hu: 'A részecskeszűrő nyomáskülönbsége'
comment:
  en: 'When the exhaust gas passes through the particle emission filter, it is slowed down.This phenomenon results in a difference in pressure between the particle emission filter inlet and outlet. This difference in pressure is a reflection of the clogging of the particle emission filter and permits management of the particle emission filter overload and clogging diagnostics (Fault codes, regenerations...) With the engine off, the value should be close to 0.'
  fr: 'Lorsque les gaz d''échappement circulent au travers du filtre à particules, ils sont ralentis.Ce phénomène entraîne une différence de pression entre l''entrée et la sortie du filtre à particules. Cette différence de pression est le reflet de l''encrassement du filtre à particules et permet de gérer le diagnostic de la surcharge et du colmatage du filtre à particules (Codes défauts, régénérations...) Moteur à l''arrêt, la valeur doit être proche de 0.'
  es: 'Cuando los gases de escape circulan a través del filtro de partículas, se ralentizan.Este fenómeno conlleva una diferencia de presión entre la entrada y la salida del filtro de partículas. Esta diferencia de presión es el reflejo de la suciedad del filtro de partículas y permite gestionar la diagnosis de la sobrecarga y de la obstrucción del filtro de partículas (códigos defecto, regeneraciones...) Con el motor parado, el valor debe ser próximo a 0.'
  de: 'Wenn die Abgase den Partikelfilter durchströmen, werden sie verlangsamt.Dieses Phänomen führt zu einer Druckdifferenz zwischen Eingang und Ausgang des Partikelfilters. Diese Druckdifferenz spiegelt die Verschmutzung des Partikelfilters wider und ermöglicht die Steuerung der Diagnose der Überladung und des Zusetzens des Partikelfilters (Fehlercodes, Regenerierungen …) Bei abgestelltem Motor muss sich der Wert in der Nähe von 0 befinden.'
  pl: 'Kiedy spaliny przepływają przez filtr cząstek stałych, ulegają spowolnieniu.Zjawisko to powoduje różnicę ciśnień pomiędzy wlotem i wylotem filtra cząstek stałych. Ta różnica ciśnień odzwierciedla zanieczyszczenie filtra cząstek stałych i pozwala na sterowanie diagnostyką przepełnienia i zatkania filtra cząstek stałych (Kody usterek, regeneracje...) Silnik zatrzymany, wartość powinna być bliska 0.'
  hu: 'Amikor a kipufogógáz a részecskeszűrőn keresztül kering, lelassul.Ezen jelenség egy nyomáskülönbséget idéz elő a részecskeszűrő bemenete és kimenete között. Ezen nyomáskülönbség a részecskeszűrő elszennyeződését tükrözi és részecskeszűrő telítődés és eldugulás diagnosztizálást eredményezhet (hibakódok, regenerálások...) Álló motornál az értéknek 0-hez közelinek kell lennie.'
kind: 'live'
access: 'read'
length: 2

