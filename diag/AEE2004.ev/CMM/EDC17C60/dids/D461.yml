did: 0xD461
name: 'OPENING_CYCLIC_RATIO_AIR_MIXER_CONTROL'
display_name:
  en: 'Opening cyclic ratio of the air mixer control'
  fr: 'Rapport cyclique d''ouverture de commande du doseur d''air'
  es: 'Relación cíclica de apertura de mando del dosificador de aire'
  de: 'Taktverhältnis Steuerung der Luftdosierklappe'
  pl: 'Cykliczny stosunek otwarcia sterowania dozownika powietrza'
  hu: 'A levegőadagoló pillangószelep RCO vezérlése'
comment:
  en: 'It is a reflection of the electrical control by the ECU. It is normal for this percentage to be different from the position reference value. The value may be positive or negative (for the opening and closing)'
  fr: 'Il s''agit du reflet du pilotage électrique par le calculateur. Il est normal que ce pourcentage ne corresponde pas à la consigne de position. La valeur peut être positive ou négative (pour les ouvertures et fermetures)'
  es: 'Se trata del reflejo del pilotaje eléctrico por el calculador. Es normal que el porcentaje no se corresponda con la consigna de posición. El valor puede ser positivo o negativo (para las aperturas y cierres)'
  de: 'Es handelt sich um die Wiedergabe der elektrischen Ansteuerung durch das Steuergerät. Es ist normal, dass dieser Prozentsatz nicht dem Positionssollwert entspricht. Der Wert kann positiv oder negativ sein (für Öffnen und Schließen)'
  pl: 'Dotyczy odwzorowania pilotowania elektrycznego przez kalkulator. Jest rzeczą normalną że ten procent nie odpowiada wartości zadanej pozycji. Wartość może być dodatnia lub ujemna (dla otwierania i zamykania)'
  hu: 'A computer általi elektromos vezérlés válaszáról van szó. Normális, hogy ezen százalékos arány nem felel meg a helyzet előírt értéknek. Az érték lehet negatív vagy pozitív (a nyitások és zárások számára)'
kind: 'live'
access: 'read'
length: 2

