  hu: '5 számú 5 V tápellátás állapota'
comment:
  en: 'Voltage of the 5V stabilised supply n°5. This supply controls the following sensors : - air flow sensor - inlet air temperature sensor - fuel temperature sensor - engine coolant temperature sensor - engine oil temperature sensor'
  fr: 'Tension de l''alimentation stabilisée 5V n°5. Cette alimentation gère les capteurs suivants : - débitmètre d''air - capteur de température air admission - capteur de température carburant - capteur de température d''eau moteur - capteur de température d''huile moteur'
  es: 'Tensión de alimentación estabilizada 5 V n°5. Esta alimentación gestiona los siguientes captadores : - caudalímetro de aire - captador de temperatura aire admisión - captador temperatura carburante - captador de temperatura del agua motor - captador de temperatura del aceite motor'
  de: 'Stabilisierte Versorgungsspannung 5 V Nr. 5. Diese Versorgung steuert die folgenden Sensoren : - durchflussmesser - temperaturfühler Ansaugluft - kraftstofftemperaturfühler - sensor Kühlmitteltemperatur - öltemperaturfühler'
  pl: 'Napięcie zasilania ustabilizowane 5 V nr 5. To zasilanie zarządza następującymi czujnikami : - przepływomierz powietrza - czujnik temperatury powietrza dolotowego - czujnik temperatury paliwa - czujnik temperatury płynu chłodzącego silnik - czujnik temperatury oleju silnika'
  hu: 'Stabilizált 5 számú 5V-os tápellátó feszültség. Ezen tápellátás a következő érzékelőket kezeli : - légtömegmérő - beszívott levegő hőmérséklet-érzékelő - üzemanyag hőmérséklet érzékelő - motor vízhőfok érzékelő - motor olajhőmérséklet-érzékelő'
kind: 'live'
