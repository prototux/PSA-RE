did: 0xD730
name: 'TEMPERATURE_POWER_ELECTRONICS_VOLTAGE_RETAINING'
display_name:
  en: 'Temperature of the power electronics of the voltage retaining device'
  fr: 'Température de l''électronique de puissance du dispositif de maintien de tension'
  es: 'Temperatura de la electrónica de potencia del dispositivo de mantenimiento de tensión'
  de: 'Temperatur der Leistungselektronik der Vorrichtung zum Halten der Spannung'
  pl: 'Temperatura elektroniki mocy urządzenia utrzymania napięcia'
  hu: 'Feszültséget fenntartó berendezés teljesítmény-elektronikájának hőmérséklete'
comment:
  en: 'The voltage retaining device ECU sends this information to the engine ECU. The sensor is incorporated in the voltage retaining device If temperature sensor fails, a fault code appears. Parameter only valid if a reversible alternator is fitted'
  fr: 'Le calculateur dispositif maintien de tension renvoie cette information au calculateur moteur. Le capteur est intégré au dispositif de maintien de tension En cas de défaillance du capteur de température, un code défaut remonte. Paramètre valable uniquement en présence d''un alternateur réversible'
  es: 'El calculador del dispositivo de mantenimiento de la tensión reenvía esta información al calculador motor. El captador está integrado en el dispositivo de mantenimiento de tensión En caso de fallo del captador de temperatura, se produce un código defecto. Parámetro válido solo en presencia de un alternador reversible'
  de: 'Das Steuergerät Vorrichtung zum Halten der Spannung sendet diese Information an das Motorsteuergerät weiter. Der Sensor ist in die Vorrichtung zum Halten der Spannung integriert Bei einem Defekt des Temperaturfühlers wird ein Fehlercode gemeldet. Parameter nur gültig bei Vorhandensein eines Starter-Generators'
  pl: 'Kalkulator urządzenia utrzymania napięcia przesyła tę informację do kalkulatora silnika. Czujnik jest wbudowany w urządzenie utrzymania napięcia W przypadku uszkodzenia czujnika temperatury, pojawia się kod usterki. Parametr ważny tylko przy obecności alternatora odwracalnego'
  hu: 'A feszültség fenntartó berendezés computere továbbítja ezen információt a befecskendezés-computerhez. Az érzékelő be van építve a feszültséget fenntartó berendezésbe Hőmérsékletérzékelő meghibásodása esetén egy hibakód kerül kijelzésre. Csupán egy megfordítható generátor jelenlétében érvényes paraméter'
kind: 'live'
access: 'read'
length: 2

