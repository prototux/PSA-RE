comment:
  en: 'Voltage of the 5V stabilised supply n°4 This supply controls the following sensors fuel low pressure temperature and pressure sensor Continuous clutch position sensor neutral sensor Brake servo pressure sensor air con pressure sensor'
  fr: 'Tension de l''alimentation stabilisée 5V n°4 Cette alimentation gère les capteurs suivants Capteur de pression et de température basse pression carburant Capteur de position d''embrayage continu capteur de point mort Capteur pression mastervac capteur de pression de réfrigération'
  es: 'Tensión de alimentación estabilizada 5 V n°4 Esta alimentación gestiona los siguientes captadores Captador de presión y de temperatura baja presión carburante Captador de posición de embrague continua captador de punto muerto Captador de presión mastervac captador de presión de refrigeración'
  de: 'Stabilisierte Versorgungsspannung 5 V Nr. 4 Diese Versorgung steuert die folgenden Sensoren Geber für Druck und Temperatur Kraftstoffniederdruck Kupplungspositionssensor durchgängig Sensor Neutralstellung Druckfühler Bremskraftverstärker Kältemitteldruckfühler'
  pl: 'Napięcie zasilania ustabilizowane 5 V nr 4 To zasilanie zarządza następującymi czujnikami Czujnik ciśnienia i temperatury układu niskiego ciśnienia paliwa Czujnik położenia sprzęgła ciągłego czujnik położenia neutralnego Czujnik ciśnienia Mastervac czujnik ciśnienia klimatyzacji'
  hu: 'Stabilizált 4 számú 5V-os tápellátó feszültség Ezen tápellátás a következő érzékelőket kezeli alacsony nyomású tüzelőanyag hőmérséklet és nyomásérzékelő Fokozatmentes tengelykapcsoló helyzetjeladója holtpont érzékelő Mastervac nyomásérzékelő hűtőközeg nyomásérzékelője'
