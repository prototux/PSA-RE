comment:
  en: 'Voltage of the 5V stabilised supply n°2 this supply controls the following sensors cylinder reference sensor EGR valve position sensor turbocharging pressure sensor butterfly position sensor oil pressure sensor position of the motorised coolant outlet housing'
  fr: 'Tension de l''alimentation stabilisée 5V n°2 cette alimentation gère les capteurs suivants capteur référence cylindre capteur de position de la vanne EGR capteur pression suralimentation capteur de position papillon capteur pression d''huile position du boîtier de sortie d''eau motorisé'
  es: 'Tensión de alimentación estabilizada 5 V n°2 esta alimentación gestiona los siguientes captadores captador referencia cilindro captador de posición de la válvula EGR captador presión de sobrealimentación captador de posición mariposa captador de presión de aceite posición de la caja de salida de agua motorizada'
  de: 'Stabilisierte Versorgungsspannung 5 V Nr. 2 diese Versorgung steuert die folgenden Sensoren sensor Zylinderkennung positionssensor des Abgasrückführungsventils sensor Ladedruck drosselklappenpositionssensor öldrucksensor position der elektrischen Thermostateinheit'
  pl: 'Napięcie zasilania ustabilizowane 5 V nr 2 to zasilanie zarządza następującymi czujnikami czujnik odniesienia cylindra czujnik położenia zaworu EGR czujnik cisnienia doladowania czujnik położenia przepustnicy czujnik cisnienia oleju położenie kolektora wylotowego płynu chłodzącego z napędem'
  hu: 'Stabilizált 2 számú 5V-os tápellátó feszültség ezen tápellátás a következő érzékelőket kezeli referenciahenger-érzékelő EGR-szelep helyzetjeladó dúsítási nyomás érzékelő fojtószelep-helyzetérzékelő olajnyomás érzékelo motoros hajtású vízkimeneti egység helyzete'
