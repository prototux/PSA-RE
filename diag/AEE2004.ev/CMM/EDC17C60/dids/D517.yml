did: 0xD517
name: 'VOLUME_UREA_FLUID_REMAINING_UREA_RESERVOIR'
display_name:
  en: 'Volume of urea fluid remaining in the urea reservoir'
  fr: 'Volume du liquide d''urée restant dans le réservoir d''urée'
  es: 'Volumen del líquido restante en el depósito de urea'
  de: 'Verbleibendes Volumen der Harnstoffflüssigkeit im Harnstofftank'
  pl: 'Objętość płynu mocznika pozostająca w zbiorniku mocznika'
  hu: 'Az AdBlue-adalék tartályban maradt AdBlue-adalék mennyisége'
comment:
  en: 'This value is an estimate calculated by the urea ECU. Only use this measurement when the gauge of the urea gauge-pump module is faulty. warning The value does not exceed 10 litres even if the urea reservoir is full'
  fr: 'Cette valeur correspond à une estimation faite par le calculateur d''urée. Utiliser cette mesure que lorsque la jauge du module jauge - pompe d''urée est défaillante. attention : La valeur ne dépasse pas les 10 litres même si le réservoir d''urée est plein'
  es: 'Este valor corresponde a una estimación realizada por el calculador de urea. Utilizar esta medida solo cuando el aforador del módulo aforador - bomba de urea presente un fallo. atención : El valor no supera los 10 litros incluso aunque el depósito de urea esté lleno'
  de: 'Dieser Wert entspricht einer vom Harnstoff-Steuergerät durchgeführten Schätzung. Diese Messung verwenden, wenn der Geber des Moduls Harnstoffgeber/-pumpe defekt ist. achtung Der Wert übersteigt nicht die 10 Liter, auch wenn der Harnstofftank voll ist'
  pl: 'Ta wartość odpowiada szacunkowi dokonanemu przez kalkulator mocznika. Użyć tego pomiaru tylko gdy czujnik modułu czujnik-pompa jest uszkodzony. uwaga Wartość nie przekracza 10 litrów, nawet jeżeli zbiornik mocznika jest pełny'
  hu: 'Ezen érték megfelel egy AdBlue-adalék számítógép által készített becslésnek. Használja ezen mérést amikor az AdBlue-adalék szivattyú - szintjelző modul szintje hibás. figyelem Az érték nem lépi túl a 10 litert még akkor sem, amikor az AdBlue-adalék tartály tele van'
kind: 'live'
access: 'read'
length: 2

