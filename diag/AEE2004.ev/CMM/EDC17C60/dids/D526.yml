did: 0xD526
name: 'TOTAL_WEIGHT_SOOT_PARTICLE_FILTER'
display_name:
  en: 'Total weight of soot in the particle filter'
  fr: 'Masse totale de suie dans le filtre à particules'
  es: 'Masa total de hollín en el filtro de partículas'
  de: 'Gesamtgewicht Russ im Partikelfilter'
  pl: 'Masa całkowita sadzy w filtrze cząstek stałych'
  hu: 'A részecskeszűrőben lévő korom teljes mennyiség'
comment:
  en: 'This information concerns the soot deposited in the particle emission filter. When the ECU estimates a high value, it will trigger the regeneration of the particle emission filter. This soot is then destroyed during the regeneration of the particle emission filter'
  fr: 'Cette information concerne les suies déposées dans le filtre à particules. Lorsque le calculateur estime une forte valeur, il va déclencher la régénération du filtre à particules. Ces suies sont alors détruites lors de la régénération du filtre à particules'
  es: 'Esta información afecta a la carbonilla depositada en el filtro de partículas. Cuando el calculador estima un valor alto, activa la regeneración del filtro de partículas. Esta carbonilla se destruye en la regeneración del filtro de partículas'
  de: 'Diese Information betrifft die im Partikelfilter abgelagerten Ruße. Wenn das Steuergerät einen hohen Wert schätzt, löst es die Regenerierung des Partikelfilters aus. Diese Rußteilchen werden dann bei der Regenerierung des Partikelfilters zerstört'
  pl: 'Ta informacja dotyczy sadzy odłożonych w filtrze cząstek stałych. Gdy kalkulator uzna wartość za dużą, uruchomi regenerację filtra cząstek stałych. Te sadze są więc zniszczone w czasie regeneracji filtra cząstek stałych'
  hu: 'Ezen információ a részecskeszűrőbe lerakódott kormot érinti. Amikor a computer egy magas értéket becsül meg a részecskeszűrő regenerálása bekapcsol. Ezen korom a részecskeszűrő regenerálása során megsemmisül'
kind: 'live'
access: 'read'
length: 2

