did: 0xD488
name: 'MEASURED_AIR_FLOW'
display_name:
  en: 'Measured air flow'
  fr: 'Débit d''air mesuré'
  es: 'Caudal de aire medido'
  de: 'Gemessener Luftdurchsatz'
  pl: 'Zmierzony wydatek powietrza'
  hu: 'Mért levegohozam'
comment:
  en: 'With the engine running, this information should be very close to the setting value for the air flow please note : when the EGR valve is voluntarily deactivated by the ECU (after idling for several minutes for example), the value is no longer the same as the setting In the event of an air flow sensor fault, the recalculated flow value is still valid.'
  fr: 'Moteur tournant, cette information doit être très proche de la valeur de consigne du débit d''air attention : lorsque la vanne EGR est volontairement désactivée par le calculateur (suite à un ralenti pendant plusieurs minutes par exemple), la valeur n''est plus la même que celle de la consigne En cas de défaut du capteur de débit d''air, la valeur du débit recalculée est toujours valable.'
  es: 'Con el motor en funcionamiento, esta información debe acercarse mucho al valor de consigna del caudal de aire atención : cuando el calculador desactiva voluntariamente la válvula EGR (después de ralentí durante varios minutos, por ejemplo), el valor ya no es es mismo que el de la consigna En caso de defecto del captador de caudal de aire, el valor recalculado sigue siendo válido.'
  de: 'Bei laufendem Motor muss diese Information sehr nahe am Sollwert für die Luftmenge sein vorsicht : wenn das EGR-Ventil absichtlich über das Steuergerät deaktiviert wird (z. B. nach einem Leerlauf von mehreren Minuten), ist der Wert nicht mehr gleich dem Sollwert Bei Fehler des Luftdurchsatzsensors ist der neu berechnete Wert des Durchsatzes immer noch gültig.'
  pl: 'Silnik pracujący, ta informacja powinna być bardzo zbliżona do wartości zadanej wydatku powietrza uwaga : gdy zawór EGR jest celowo wyłączony przez kalkulator (na przykład na skutek biegu jałowego w czasie paru minut), wartość nie jest ta sama co wartość zadana W przypadku usterki czujnika wydatku powietrza przez cały czas obowiązuje przeliczona wartość wydatku.'
  hu: 'Járó motornál ezen értéknek a levegőhozam előírt értékhez nagyon közelinek kell lennie figyelem : amikor az EGR szelep a computer által szándékosan semlegesítésre kerül(például egy alapjárat után több percig), az érték többé nem ugyanaz mint az előírt érték A levegő tömegmérő hibája esetén az újrakalkulált tömeg értéke még mindig érvényes.'
kind: 'live'
access: 'read'
length: 2

