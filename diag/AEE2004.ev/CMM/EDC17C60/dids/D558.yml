comment:
  en: 'This value corresponds to the measurement seen by the ECU using the sensor. warning the gauge displays 6,1 litres in all cases even if the volume of urea solution is more than 6,1 litres'
  fr: 'Cette valeur correspond à la mesure vue par le calculateur à l''aide du capteur. attention : la jauge affiche dans tous les cas 6,1 litres même si le volume de solution d''urée est supérieur à 6,1 litres'
  es: 'Este valor corresponde a la medida vista por el calculador con ayuda del captador. atención : el aforador muestra en todos los casos 6,1 litros incluso si el volumen de solución de urea es superior a 6,1 litros'
  de: 'Dieser Wert entspricht dem vom Steuergerät mit Hilfe des Sensors ausgelesenen Wert. achtung der Füllstandsgeber zeigt in allen Fällen 6,1 Liter an, auch wenn das Volumen der Harnstofflösung größer als 6,1 Liter ist'
  pl: 'Ta wartość odpowiada pomiarowi widzianemu przez kalkulator za pomocą czujnika. uwaga wskaźnik wyświetla we wszystkich przypadkach 6,1 litrów nawet leżeli objętość mocznika jest większa od 6,1 litrów'
  hu: 'Ez az érték megfelel a vezérlőegységnek az érzékelőn keresztül látott mérésnek. figyelem A szintjelző minden esetben 6,1litert jelez ki, még akkor is ha az AdBlue-adalék térfogata több mint 6,1 liter'
