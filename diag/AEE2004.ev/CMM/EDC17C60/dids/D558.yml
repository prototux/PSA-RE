display_name:
  en: 'Volume of urea fluid measured in the urea reservoir'
  fr: 'Volume du liquide d''urée mesuré dans le réservoir d''urée'
  es: 'Volumen del líquido de urea medido en el depósito de urea'
  de: 'Gemessenes Volumen der Harnstoffflüssigkeit im Harnstofftank'
