comment:
  en: 'This is the pressure measured at the air intake circuit. The value should be close to the reference value. The refuge value is 3,5 bars.'
  fr: 'Il s''agit de la pression mesurée au niveau du circuit d''admission d''air. La valeur doit être proche de la consigne. La valeur de refuge est à 3,5 bars.'
  es: 'Se trata de la presión medida en el circuito de admisión de aire. El valor debe situarse en torno a la consigna. El valor de refugio es de 3,5 bares.'
  de: 'Es handelt sich um den am Lufteinlasssystem gemessenen Druck. Der Wert muss nahe am Sollwert sein. Der Notwert ist auf 3,5 bar.'
  pl: 'Mamy do czynienia z ciśnieniem zmierzonym na poziomie układu dolotowego powietrza. Wartość musi być zbliżona do wartości zadanej. Wartość zastępcza ustawiona jest na 3,5 barów.'
  hu: 'A levegő szívókör szintjénél mért nyomást jelenti. Az érték az előírthoz közeli kell legyen. A helyettesítési érték 3,5 bar.'
