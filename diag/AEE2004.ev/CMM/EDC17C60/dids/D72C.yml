did: 0xD72C
name: 'STATUS_VOLTAGE_RETAINING_DEVICE'
display_name:
  en: 'Status of the voltage retaining device'
  fr: 'Etat du dispositif de maintien de tension'
  es: 'Estado del dispositivo de mantenimiento de tensión'
  de: 'Zustand der Vorrichtung zum Halten der Spannung'
  pl: 'Stan urządzenia utrzymania napięcia'
  hu: 'Feszültséget fenntartó berendezés állapota'
comment:
  en: 'The possible statuses of this parameter are : voltage retaining device passive : no current is passing through the voltage retaining device voltage retaining device on charge : the voltage retention device allows the current to pass, for the recharging of the power accumulator voltage retaining device on discharge : the voltage retaining device allows the current to pass, for the discharging of the accumulator voltage retaining device faulty : no current is passing through the voltage retaining device, following a failure Parameter only valid if a reversible alternator is fitted'
  fr: 'Les états possibles de ce paramètre sont : dispositif maintien de tension passif : aucun courant ne traverse le dispositif de maintien de tension dispositif maintien de tension en charge : le dispositif de maintien de tension laisse passer le courant pour la recharge de l''accumulateur dispositif maintien de tension en décharge : le dispositif de maintien de tension laisse passer le courant pour la décharge de l''accumulateur dispositif maintien de tension en défaut : aucun courant ne traverse le dispositif de maintien de tension suite à une défaillance Paramètre valable uniquement en présence d''un alternateur réversible'
  es: 'Los estados posibles de este parámetro son : dispositivo de mantenimiento de tensión pasivo : ninguna corriente atraviesa el dispositivo de mantenimiento de la tensión dispositivo de mantenimiento de tensión en carga : el dispositivo de mantenimiento de la tensión deja pasar la corriente para recargar el acumulador dispositivo de mantenimiento de tensión en descarga : el dispositivo de mantenimiento de la tensión deja pasar la corriente para descargar el acumulador dispositivo de mantenimiento de tensión con defecto : ninguna corriente atraviesa el dispositivo de mantenimiento de la tensión después de un fallo Parámetro válido solo en presencia de un alternador reversible'
  de: 'Die möglichen Zustände dieses Parameters sind : vorrichtung Halten der Spannung passiv : kein Strom durchfließt die Vorrichtung zum Halten der Spannung vorrichtung Halten der Spannung geladen : die Vorrichtung zum Halten der Spannung lässt den Strom für das Aufladen des Speichers passieren vorrichtung Halten der Ladung entladen : die Vorrichtung zum Halten der Spannung lässt den Strom für das Entladen des Speichers passieren vorrichtung Halten der Spannung defekt : kein Strom durchfließt die Vorrichtung zum Halten der Spannung nach einer Fehlfunktion Parameter nur gültig bei Vorhandensein eines Starter-Generators'
  pl: 'Możliwe stany tego parametru to : urządzenie utrzymania pasywne : żaden prąd nie płynie przez urządzenie utrzymania napięcia urządzenie utrzymania napięcia przy ładowaniu : urządzenie utrzymania napięcia pozwala na przepływ prądu w celu naładowania akumulatora urządzenie utrzymania napięcia przy rozładowaniu : urządzenie utrzymania napięcia pozwala na przepływ prądu w celu rozładowania akumulatora urządzenie utrzymania napięcia uszkodzone : żaden prąd nie płynie przez urządzenie utrzymania napięcia w następstwie uszkodzenia Parametr ważny tylko przy obecności alternatora odwracalnego'
  hu: 'Ezen paraméter lehetséges állapotai : passzív feszültség fenntartó berendezés : semmilyen áramot nem továbbít a feszültség fenntartó berendezés feszültség fenntartó berendezés töltés közben : a feszültség fenntartó berendezés hagyja áthaladni az áramot az akkumulátor feltöltése érdekében feszültség fenntartó berendezés kimerülés közben : a feszültség fenntartó berendezés hagyja áthaladni az áramot az akkumulátor kisütése érdekében feszültség fenntartó berendezés hiba esetén : semmilyen áramot nem továbbít a feszültség fenntartó berendezés egy meghibásodást követően Csupán egy megfordítható generátor jelenlétében érvényes paraméter'
kind: 'live'
access: 'read'
