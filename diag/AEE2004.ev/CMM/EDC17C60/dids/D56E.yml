did: 0xD56E
name: 'CLUTCH_PEDAL_PROPORTIONAL_SENSOR'
display_name:
  en: 'Clutch pedal proportional sensor'
  fr: 'Capteur proportionnel de pédale d''embrayage'
  es: 'Captador proporcional del pedal de embrague'
  de: 'Proportionaler Sensor des Kupplungspedals'
  pl: 'Czujnik proporcjonalny pedału sprzęgła'
  hu: 'Tengelykapcsoló pedál fokozatos elmozdulás-érzékelő'
comment:
  en: 'The vehicle only has a proportional clutch sensor if it is equipped with one of the following functions: hill start assist, keyless entry and starting, Stop and Start or descent control system'
  fr: 'Le véhicule possède un capteur proportionnel d''embrayage seulement s''il est équipé de l''une des fonctions suivantes : de l''aide au démarrage en pente, de l''accès et démarrage mains-libres, du Stop and Start ou du système de contrôle en descente'
  es: 'El vehículo dispone de un captador proporcional de embrague solo si está equipado de una de las siguientes funciones; ayuda al arranque en pendiente, acceso y arranque manos libres, Stop and Start o sistema de control en bajada'
  de: 'Das Fahrzeug besitzt nur dann einen proportionalen Kupplungssensor, wenn es mit einer der folgenden Funktionen ausgestattet ist: Berganfahrhilfe, schlüsselloses Zugangs- und Startsystem, STOP & START oder Bergabfahrassistent'
  pl: 'Pojazd posiada proporcjonalny czujnik sprzęgła, wyłącznie gdy jest wyposażony w jedną z następujących funkcji: wspomaganie ruszania na pochyłej drodze, system dostępu i rozruchu bez użycia rąk, system Stop and Start lub system kontroli trakcji podczas zjazdu'
  hu: 'A gépjármű csupán akkor rendelkezik egy tengelykapcsolási arány érzékelővel ha a gépjármű fel van szerelve a következő funkciók egyikével: lejtőn történő elindulás segítése, szabadkezes hozzáférés és indítás, Stop and Start vagy lejtmenet vezérlő rendszer'
kind: 'live'
access: 'read'
length: 1

