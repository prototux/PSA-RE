did: 0xD469
name: 'VALUE_CLUTCH_PEDAL_POSITION'
display_name:
  en: 'Value of the clutch pedal position'
  fr: 'Valeur de la position de la pédale d''embrayage'
  es: 'Valor de la posición del pedal de embrague'
  de: 'Wert der Position des Kupplungspedals'
  pl: 'Wartość pozycji pompy sprzęgła'
  hu: 'A tengelykapcsolópedál helyzetének értéke'
comment:
  en: 'This parameter is to be taken into account if there is a proportional position sensor. The parameter is close to 10% when the clutch pedal is pressed.'
  fr: 'Ce paramètre est à prendre en compte si un capteur de position proportionnel est présent. Le paramètre est proche de 10 % quand la pédale d''embrayage est appuyée.'
  es: 'Este parámetro debe tenerse en cuenta si hay presente un captador de posición proporcional. El parámetro está próximo al 10% cuando el pedal de embrague está pisado.'
  de: 'Dieser Parameter muss beachtet werden, wenn ein proportionaler Positionssensor vorhanden ist. Der Parameter ist nahe an 10 %, wenn das Kupplungspedal gedrückt ist.'
  pl: 'Ten parametr należy uwzględniać, jeżeli występuje proporcjonalny czujnik położenia. Parametr jest bliski 10% kiedy pedał sprzęgła jest naciśnięty.'
  hu: 'Ez a paraméter akkor veendő figyelembe, ha jelen van egy arány helyzetérzékelő. A paraméter közel 10%-os, amikor a tengelykapcsolópedál le van nyomva.'
kind: 'live'
access: 'read'
length: 2

