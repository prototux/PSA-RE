did: 0xD40A
name: 'CORRECTED_COOLANT_TEMPERATURE'
display_name:
  en: 'Corrected coolant temperature'
  fr: 'Température d''eau corrigée'
  es: 'Temperatura de agua corregida'
  de: 'Korrigierte Wassertemperatur'
  pl: 'Temperatura cieczy skorygowana'
  hu: 'Javított motorhutofolyadék - homérséklet érték'
comment:
  en: 'Coolant circuit temperature. the engine is generally considered hot above 70°C. if the temperature becomes too high, the ECU activates the cooling fan to aid cooling. The refuge value is -40°C.'
  fr: 'Température d''eau du circuit de refroidissement. On considère généralement que le moteur est chaud au-delà de 70 °C. Lorsque la température est trop élevée, le calculateur active le groupe motoventilateur afin d''aider le refroidissement. La valeur de refuge est à -40°C.'
  es: 'Temperatura del agua del circuito de refrigeración. Generalmente, se considera que el motor está caliente por encima de 70 °C. Cuando la temperatura es demasiado elevada, el calculador activa el grupo motoventilador con el fin de ayuda a la refrigeración. El valor de refugio está en -40°C.'
  de: 'Kühlmitteltemperatur. Der Motor gilt ebenfalls als warm, wenn der Motor wärmer als 70 °C ist. Wenn die Temperatur zu hoch ist, aktiviert das Steuergerät die Kühlerventilatorgruppe, um die Kühlung zu unterstützen. Der Notwert ist auf -40°C.'
  pl: 'Temperatura cieczy w uk. Uważa się ogólnie, że silnik jest gorący powyżej 70°C. Gdy temperatura jest za wysoka, kalkulator włącza zespół wentylatora chłodnicy w celu zwiększenia chłodzenia. Wartość zastępcza ustawiona jest na -40°C.'
  hu: 'A hűtőkörben lévő folyadék hőmérséklete. Akkor vesszük melegnek a motort, ha a motor 70 °C-nál melegebb. Amikor a hőmérséklet a túlságosan magas, a computer aktiválja a motorhűtő-ventilátor egységet a hűtés segítése érdekében. A helyettesítési érték -40°C.'
kind: 'live'
access: 'read'
length: 2

