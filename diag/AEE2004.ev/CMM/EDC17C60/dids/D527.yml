did: 0xD527
name: 'TOTAL_WEIGHT_ADDITIVE_DEPOSITED_PARTICLE_FILTER'
display_name:
  en: 'Total weight of additive deposited in the particle filter'
  fr: 'Masse totale d''additif déposée dans le filtre à particules'
  es: 'Masa total de aditivo descargada en el FAP'
  de: 'Gesamtmasse des im FAP befindlichen Additivs'
  pl: 'Całkowita masa dodatku odłożona w FAP'
  hu: 'A részecskeszűrőben lerakódott adalék összes tömege'
comment:
  en: 'The addition of additive to the fuel results in deposits of additive in the particle filter. This value increases over time and should be close to zero when the PEF is new.'
  fr: 'L''additivation du carburant engendre des dépôts d''additif dans le filtre à particules. Cette valeur augmente en fonction du temps et doit être proche de zéro lorsque le FAP est neuf.'
  es: 'La aditivación del carburante genera restos de aditivo en el filtro de partículas. Este valor aumenta en función del tiempo y debe ser próximo a cero cuando el FAP es nuevo.'
  de: 'Die Additivversorgung des Kraftstoffs führt zu Additivablagerungen im Partikelfilter. Dieser Wert erhöht sich in Abhängigkeit der Zeit und muss sich nahe Null befinden, wenn der Partikelfilter neu ist.'
  pl: 'Domieszkowanie paliwa pociąga za sobą odkładanie się dodatku w filtrze cząstek stałych. Ta wartość zwiększa się w funkcji przebiegu i powinna być bliska zeru gdy FAP jest nowy.'
  hu: 'A tüzelőanyag adalékolása adaléklerakódásokat erdeményez a részecskeszűrőben. Ezen érték az idő függvényében növekszik és közel nulla kell, hogy legyen amikor a részecskeszűrő új.'
kind: 'live'
access: 'read'
length: 2

