did: 0xD574
name: 'LAST_PROGRAMMED_POSITION_AIR_MIXER_LOWER_LIMIT'
display_name:
  en: 'Last programmed position of the air mixer lower limit'
  fr: 'Dernière position apprise de la butée basse doseur d''air'
  es: 'Última posición aprendida del tope bajo del dosificador de aire'
  de: 'Letzte eingespeicherte Position des unteren Anschlags des Luftdosierers'
  pl: 'Ostatnia nauczona pozycja ogranicznika dolnego dozownika powietrza'
  hu: 'A levegőadagoló alsó véghelyzet utolsó megismertetett helyzete'
comment:
  en: 'This value corresponds to the position of the stop at the time of the very last programming (the last time that the engine fulfilled the conditions). The value is expressed as a percentage of the supply. 0% = 0V / 100% = 5V.'
  fr: 'Cette valeur correspond à la position de la butée lors du tout dernier apprentissage (la dernière fois que le moteur était dans les conditions). La valeur est exprimée en pourcentage de l''alimentation. 0% = 0V / 100% = 5V.'
  es: 'Este valor corresponde a la posición de tope durante el mismo primer aprentizaje (la última vez que el motor estaba en las condiciones). El valor se expresa en porcentaje de la alimentación. 0% = 0V / 100% = 5V.'
  de: 'Dieser Wert entspricht der Position des Anschlags bei der allerletzten Einspeicherung (Das letzte Mal, als der Motor sich unter denselben Bedingungen befand). Der Wert wird in Prozent Versorgung ausgedrückt. 0% = 0V / 100% = 5V.'
  pl: 'Ta wartość odpowiada położeniu ogranicznika podczas ostatniej procedury uczenia (ostatni raz silnik był w warunkach). Wartość jest wyrażona w procencie zasilania. 0% = 0V / 100% = 5V.'
  hu: 'Ez az érték a véghelyzet helyzetének felel meg minden utolsó megismertetéskor (az utolsó alkalommal, amikor a motor az adott feltételek között volt). Az érték a tápellátás százalékos arányában van kifejezve. 0% = 0V / 100% = 5V.'
kind: 'live'
access: 'read'
length: 8

