did: 0xD510
name: 'EGR_VALVE_POSITION_INSTRUCTIONS'
display_name:
  en: 'EGR valve position instructions'
  fr: 'Consigne de position de la vanne EGR'
  es: 'Consigna de posición de la válvula EGR'
  de: 'Einstellung der Stellung des Abgasrückführungs-Magnetventils'
  pl: 'Wartość zadana położenia zaworu EGR'
  hu: 'Kipufogógáz-visszavezetés (EGR) szelep helyzetének előírt értéke'
comment:
  en: 'In order to ensure the effective control of emissions from the engine, the ECU determines a position that the EGR valve should take to ensure that the gases are recirculated at the correct level.'
  fr: 'Afin d''assurer la dépollution du moteur, le calculateur détermine une position que la vanne EGR doit prendre pour que la recirculation des gaz soit au bon niveau.'
  es: 'Con el fin de garantizar la descontaminación del motor, el calculador determina la posición que la válvula EGR debe adoptar para que el reciclado de los gases de escape alcance el nivel adecuado.'
  de: 'Um die Abgasbehandlung des Motors zu gewährleisten, bestimmt das Steuergerät eine Position, die das Abgasrückführungsventil einnehmen muss, damit sich die Abgasrückführung auf dem richtigen Niveau befindet.'
  pl: 'Aby zabezpieczyć właściwą jakość spalin silnika, kalkulator ustala pozycję jaką powinien przyjąć zawór EGR aby recyrkulacja gazu była na prawidłowym poziomie.'
  hu: 'A motor környezetvédelmi szintjének biztosítása érdekében a computer meghatároz egy helyzetet, amit az EGR szelepnek fel kell vennie, hogy a kipufogógáz visszavezetése megfelelő szinten legyen.'
kind: 'live'
access: 'read'
length: 2

