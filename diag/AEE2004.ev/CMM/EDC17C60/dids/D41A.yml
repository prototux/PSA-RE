did: 0xD41A
name: 'STARTING_AUTHORISATION_COMING_GEARBOX_ECU'
display_name:
  en: 'Starting authorisation coming from the gearbox ECU'
  fr: 'Autorisation de démarrage provenant du calculateur de boîte de vitesses'
  es: 'Autorización de arranque procedente del calculador de la caja de velocidades'
  de: 'Vom Getriebesteuergerät stammende Freigabe Anlassen'
  pl: 'Zezwolenie rozruchu pochodzące od kalkulatora skrzyni biegów'
  hu: 'Sebességváltó computerétől származó indítás engedélyezése'
comment:
  en: 'This parameter should only be taken into account on automatic gearboxes. The parameter should assume the value "Starting authorised" if the gearbox is manual.'
  fr: 'Ce paramètre n''est à prendre en compte que sur les boîtes de vitesses automatiques. Le paramètre doit prendre la valeur "Démarrage autorisé" lorsque la boîte de vitesses est manuelle.'
  es: 'Este parámetro solo debe tenerse en cuenta en las cajas de velocidades automáticas. El parámetro debe tener el valor "Arranque autorizado" cuando la caja de velocidades sea manual.'
  de: 'Dieser Parameter braucht nur bei Automatikgetrieben beachtet zu werden. Der Parameter muss den Wert "Starten freigegeben" annehmen, wenn das Getriebe manuell ist.'
  pl: 'Ten parametr należy uwzględniać wyłącznie w przypadku automatycznych skrzyń biegów. Parametr musi przyjąć wartość "Rozruch dozwolony" w przypadku manualnej skrzyni biegów.'
  hu: 'Ezen paraméter csupán automata sebességváltókon veendő figyelembe. A paraméternek fel kell vennie az "Indítás engedélyezve" értéket ha a sebességváltó mechanikus.'
kind: 'live'
access: 'read'
length: 1

