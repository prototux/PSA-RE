name: 'FUEL_PRESSURE_MEASURED_HIGH_PRESSURE_RAIL'
display_name:
  en: 'Fuel pressure measured in the high pressure rail'
  fr: 'Pression de carburant mesurée dans la rampe haute pression'
  es: 'Presión de carburante medido en la rampa de alta presión'
  de: 'In der Hochdruck-Einspritzleiste (Rail) gemessener Kraftstoffdruck'
  pl: 'Ciśnienie paliwa zmierzone w kolektorze wysokiego ciśnienia'
  hu: 'A nagynyomású elosztócsőben mért tüzeloanyag-nyomás'
comment:
  en: 'This value corresponds to the measurement seen by the ECU using the sensor. This value must be fairly close to the reference value. The refuge value is 2200 bars.'
  fr: 'Cette valeur correspond à la mesure vue par le calculateur à l''aide du capteur. Cette valeur doit être assez proche de la consigne. La valeur de refuge est à 2200 bars.'
  es: 'Este valor corresponde a la medida vista por el calculador con ayuda del captador. Este valor debe aproximarse bastante a la consigna. El valor de refugio es de 2200 bares.'
  de: 'Dieser Wert entspricht dem vom Steuergerät mit Hilfe des Sensors ausgelesenen Wert. Dieser Wert muss nahe am Sollwert sein. Der Notwert ist auf 2200 bar.'
  pl: 'Ta wartość odpowiada pomiarowi widzianemu przez kalkulator za pomocą czujnika. Ta wartość powinna być dosyć bliska wartości zadanej. Wartość zastępcza ustawiona jest na 2200 barów.'
  hu: 'Ez az érték megfelel a vezérlőegységnek az érzékelőn keresztül látott mérésnek. Ez az érték az utasítás értékéhez nagyon közeli kell, hogy legyen. A helyettesítési érték 2200 bar.'
