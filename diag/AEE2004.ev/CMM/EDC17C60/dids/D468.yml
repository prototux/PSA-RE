did: 0xD468
name: 'CLUTCH_PEDAL_POSITION'
display_name:
  en: 'Clutch pedal position'
  fr: 'Position de la pédale d''embrayage'
  es: 'Posición del pedal de embrague'
  de: 'Position des Kupplungspedals'
  pl: 'Położenie pedału sprzęgła'
  hu: 'Tengelykapcsoló-pedál pozíciója'
comment:
  en: 'This parameter is to be taken into account if there is a proportional position sensor. The parameter is close to 100% when the clutch pedal is pressed.'
  fr: 'Ce paramètre est à prendre en compte si un capteur de position proportionnel est présent. Le paramètre est proche de 100 % quand la pédale d''embrayage est appuyée.'
  es: 'Este parámetro debe tenerse en cuenta si hay presente un captador de posición proporcional. El parámetro está próximo al 100% cuando el pedal de embrague está pisado.'
  de: 'Dieser Parameter muss beachtet werden, wenn ein proportionaler Positionssensor vorhanden ist. Der Parameter ist nahe an 100 %, wenn das Kupplungspedal gedrückt ist.'
  pl: 'Ten parametr należy uwzględniać, jeżeli występuje proporcjonalny czujnik położenia. Parametr jest bliski 100% kiedy pedał sprzęgła jest naciśnięty.'
  hu: 'Ez a paraméter akkor veendő figyelembe, ha jelen van egy arány helyzetérzékelő. A paraméter közel 100%-os, amikor a tengelykapcsolópedál le van nyomva.'
kind: 'live'
access: 'read'
length: 2

