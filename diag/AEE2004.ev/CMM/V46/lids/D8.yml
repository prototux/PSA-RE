      LATEST_CAUSE_ENGINE_CUT_OFF:
        bits: '68.3-68.0'
        comment:
          en: 'Latest cause of engine cut-off'
          fr: 'Dernière cause de coupure moteur'
          es: 'Última causa de corte del motor'
          de: 'Letzte Ursache für das Abstellen des Motors'
          pl: 'Ostatnia przyczyna wyłączenia silnika'
          hu: 'Utolsó motorlekapcsolási ok'
        type: 'enum'
        values:
          0x00:
            en: 'No engine cut-off'
            fr: 'Pas de coupure moteur'
            es: 'No hay corte de motor'
            de: 'Kein Abstellen des Motors'
            pl: 'Brak wyłączenia silnika'
            hu: 'Nincs motorlekapcsolás'
          0x01:
            en: 'Traction chain closed(Gear engaged and clutched position)'
            fr: 'Chaîne de traction fermée(Vitesse engagée et position embrayée)'
            es: 'Cadena de tracción cerrada(Velocidad introducida en posición embragada)'
            de: 'Geschlossenes Verbrennungssystem(Gang eingelegt und Position eingekuppelt)'
            pl: 'Łańcuch kinematyczny napędu zamknięty(Włączony bieg i położenie sprzęgła włączone)'
            hu: 'Zárt hajtáslánc(Kapcsolt sebesség és kapcsolt helyzet)'
          0x02:
            en: 'Gear change too long'
            fr: 'Changement de rapport de boîte de vitesses trop long'
            es: 'Cambio de velocidad de caja de velocidades demasiado largo'
            de: 'Getriebegangwechsel zu lang'
            pl: 'Zmiana przełożenia skrzyni biegów za długa'
            hu: 'Sebességváltó fokozatváltása tulságosan hosszú'
          0x03:
            en: 'Request to switch off the electromotor sub-assembly'
            fr: 'Demande de coupure du sous-ensemble électromoteur'
            es: 'Solicitud de corte del subconjunto electromotor'
            de: 'Anforderung Abstellen der Untergruppe Elektromotor'
            pl: 'Żądanie wyłączenia podzespołu silników elektrycznych'
            hu: 'Elektromotor részegység lekapcsolás kérése'
          0x04:
            en: 'Fault linked with the Stop and Start function'
            fr: 'Défaut lié à la fonction Stop and Start'
            es: 'Defecto relacionado con la función Stop and Start'
            de: 'Fehler im Zusammenhang mit der Funktion Stop and Start'
            pl: 'Usterka związana z Stop and Start'
            hu: 'A Stop and Start funkcióhoz kapcsolódó hiba'
          0x05:
            en: 'Failure to restart the engine'
            fr: 'Echec de redémarrage du moteur'
            es: 'Fallo de arranque del motor'
            de: 'Motorneustart fehlgeschlagen'
            pl: 'Nieudane ponowne uruchomienie silnika'
            hu: 'Motor újraindítás sikertelensége'
          0x06:
            en: 'Vehicle cut-off request'
            fr: 'Demande de coupure véhicule'
            es: 'Solicitud de corte vehículo'
            de: 'Anforderung Fahrzeug ausschalten'
            pl: 'Żądanie wyłączenia samochodu'
            hu: 'Gépjármű lekapcsolásának kérése'
          0x07:
            en: 'Speed too high without automatic restarting'
            fr: 'Vitesse trop élevée sans redémarrage automatique'
            es: 'Velocidad demasiado elevada sin rearranque automático'
            de: 'Geschwindigkeit zu hoch ohne automatischen Neustart'
