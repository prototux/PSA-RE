            hu: 'Túlságosan magas sebesség automatikus újraindítás nélkül'
          0x08:
            en: 'Excessive delay before automatic restarting'
            fr: 'Délai trop long avant redémarrage automatique'
            es: 'Tiempo demasiado largo antes del rearranque automático'
            de: 'Verzögerung vor dem automatischen Neustart zu lang'
            pl: 'Okres czasu zbyt długi przed ponownym uruchomieniem automatycznym'
            hu: 'Túlságosan hosszú késedelem az automatikus újraindítás előtt'
          0x09:
            en: 'Loss of authorisation of automatic restarting'
            fr: 'Perte d''autorisation de redémarrage automatique'
            es: 'Pérdida de autorización de rearranque automático'
            de: 'Verlust der Freigabe automatischer Neustart'
