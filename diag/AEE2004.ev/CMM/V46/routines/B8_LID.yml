  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  INPUT_PARAM_REGULATION_TA:
    bits: '1.7-1.0'
    type: 'enum'

  CODE_TA:
    bits: '2.7-2.0'
    type: 'enum'

results:
  INPUT_PARAM_REGULATION_TA_RESERVE:
    bits: '1.7-1.0'
    type: 'enum'

  CODE_TA:
    bits: '2.7-2.0'
    type: 'enum'
