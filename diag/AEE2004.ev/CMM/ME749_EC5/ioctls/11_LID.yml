        de: 'Kurzschluss an Plus'
        pl: 'Zwarcie z plusem'
        hu: 'Pozitív rövidzárlat'
      0x02:
        en: 'Short circuit to earth'
        fr: 'Court-circuit à la masse'
        es: 'Cortocircuito a masa'
        de: 'Kurzschluss an Masse'
        pl: 'Zwarcie z masą'
        hu: 'Negatív rövidzárlat'
      0x03:
        en: 'Open circuit'
        fr: 'Circuit ouvert'
        es: 'Circuito abierto'
        de: 'Stromkreisunterbrechung'
        pl: 'Układ rozwarty'
        hu: 'Áramköri szakadás'
      0x04:
        en: 'Intermittent circuit'
        fr: 'Circuit intermittent'
        es: 'Circuito intermitente'
        de: 'Zeitweilige Stromkreis-Unterbrechung'
        pl: 'Obwód nieciągły'
        hu: 'Szünetelo (szakaszos) áramkör'

tests:
  - display_name:
