ioctl: 0x11
name: 'INJECTOR_1'
display_name:
  en: 'Injector 1'
  fr: 'Injecteur 1'
  es: 'Inyector 1'
  de: 'Einspritzventil 1'
  pl: 'Wtryskiwacz 1'
