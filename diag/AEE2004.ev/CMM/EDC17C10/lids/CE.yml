lid: 0xCE
name: 'STATUS_OF_ENGINE'
display_name:
  en: 'Status of engine'
  fr: 'Etat du moteur'
  es: 'Estado del motor'
  de: 'Zustand des Motors'
  pl: 'Stan silnika'
  hu: 'Motor állapota'
comment:
  en: 'The various statuses are : Ignition switched off/cut out, in preparation, deliberate starting, independent starting, engine running, deliberate restarting, independent restarting'
  fr: 'Les différents états sont : Coupé-calé, en préparation, démarrage entraîné, démarrage autonome, moteur tournant, redémarrage entraîné, redémarrage autonome'
  es: 'Los diferentes estados son : Cortado-calado, en preparación, arranque conectardo, arranque autónomo, motor en marcha, re-arranque arrastrado, re-arranque autónomo'
  de: 'Es gibt die folgenden Zustände : Ausgeschaltet-ausgesetzte, in Vorbereitung, angetriebenes Anlassen, autonomes Anlassen, Motor läuft, angetriebener Neutstart, autonomer Neustart'
  pl: 'Poszczególne stany to : Wyłączony-zgaszony, w przygotowaniu, rozruch uruchomiony, rozruch autonomiczny, silnik pracujący, ponowny rozruch uruchomiony, ponowny rozruch autonomiczny'
  hu: 'A különböző állapotok : Kikapcsolt-lefulladt, előkészítésben, meghajtott indítás, önálló indítás, járó motor, meghajtott újraindítás, önálló újraindítás'
kind: 'live'
access: 'read'
length: 11

