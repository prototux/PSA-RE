ioctl: 0x47
name: 'THERMOSTAT_CONTROLLED'
display_name:
  en: 'Thermostat controlled'
  fr: 'Thermostat piloté'
  es: 'Termostato pilotado'
  de: 'Gesteuerter Thermostat'
  pl: 'Termostat pilotowany'
  hu: 'Vezérelt termosztát'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x00

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

  TEST_REPORT:
    bits: '2.7-2.0'
    comment:
      en: 'Test report'
      fr: 'Compte-rendu du test'
      es: 'Informe del test'
      de: 'Testbericht'
      pl: 'Sprawozdanie z testu'
      hu: 'A teszt összefoglalása'
    type: 'enum'
    values:
      0x00:
        en: 'No faults detected'
        fr: 'Pas de défaut détecté'
        es: 'No hay defecto detectado'
        de: 'Kein Fehler festgestellt'
        pl: 'Nie wykryto błędu'
        hu: 'Nincs érzékelt hiba'
      0x01:
        en: 'Short circuit to positive'
        fr: 'Court-circuit au plus'
        es: 'Cortocircuito al más'
        de: 'Kurzschluss an Plus'
        pl: 'Zwarcie z plusem'
        hu: 'Pozitív rövidzárlat'
      0x02:
        en: 'Short circuit to earth'
        fr: 'Court-circuit à la masse'
        es: 'Cortocircuito a masa'
        de: 'Kurzschluss an Masse'
        pl: 'Zwarcie z masą'
        hu: 'Negatív rövidzárlat'
      0x03:
        en: 'Open circuit'
        fr: 'Circuit ouvert'
        es: 'Circuito abierto'
        de: 'Stromkreis offen'
        pl: 'Obwód przerwany'
        hu: 'Megszakadt áramkör'
      0x04:
        en: 'Intermittent open circuit'
        fr: 'Circuit ouvert intermittent'
        es: 'Circuito abierto intermitente'
        de: 'Stromkreis sporadisch offen'
        pl: 'Obwód rozwarty przelotnie'
        hu: 'Átmeneti áramköri szakadás'

tests:
  - display_name:
      en: 'Thermostat controlled'
      fr: 'Thermostat piloté'
      es: 'Termostato pilotado'
      de: 'Gesteuerter Thermostat'
      pl: 'Termostat pilotowany'
      hu: 'Vezérelt termosztát'
