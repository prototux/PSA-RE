node: 'CMM'
model: 'V345'
display_name:
  en: 'Engine control unit (V345)'
  fr: 'Calculateur moteur multifonction (V345)'
protocols: ['UDS', 'KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x6A8
    response_id: 0x688
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x6A8
    response_id: 0x688

