node: 'HCU1'
model: 'HCU1'
display_name:
  en: 'Hybrid control unit 1 (HCU1)'
  fr: 'Calculateur hybride 1 (HCU1)'
protocols: ['KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'KWP-PSA2000'
    request_id: 0x6A7
    response_id: 0x687
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'KWP-PSA2000'
    request_id: 0x6A7
    response_id: 0x687

sessions:
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'
  0xC0:
    en: 'PSA diagnostic session'
    fr: 'Session de diagnostic PSA'

resets:
  0x82:
    en: 'Reset 0x82'
    fr: 'Réinitialisation 0x82'
  0x83:
    en: 'Reset 0x83'
    fr: 'Réinitialisation 0x83'
  0x84:
    en: 'Reset 0x84'
    fr: 'Réinitialisation 0x84'
  0x86:
    en: 'Reset 0x86'
    fr: 'Réinitialisation 0x86'
  0x87:
    en: 'Reset 0x87'
    fr: 'Réinitialisation 0x87'
  0xB0:
    en: 'Reset 0xB0'
    fr: 'Réinitialisation 0xB0'

services: [0x10, 0x11, 0x14, 0x17, 0x21, 0x27, 0x30, 0x31, 0x34, 0x81, 0x82]

security_access:
  - level: 0x83

identification:
  request: '21 FE'
  part_number: '22.7-24.0'
  comment:
    en: 'The ECU part number is in data bytes 22 to 24 of the answer to 21 FE (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 22 à 24 de la réponse à 21 FE (DCB), elle donne la variante logicielle'

