  de: 'Ermöglicht die Auslesung der im Autoradio eingegebenen VIN (muss mit der in der Zentralschalteinheit BSI gespeicherten Nummer identisch sein).'
  pl: 'Pozwala odczytać kod VIN wprowadzony do autoradia (który powinien być identyczny z zapisanym w BSI).'
  hu: 'Lehetővé teszi az autórádióba bevitt VIN-kód leolvasását (amelynek azonosnak kell lennie az intelligens kiszolgálóegységben lévővel).'
