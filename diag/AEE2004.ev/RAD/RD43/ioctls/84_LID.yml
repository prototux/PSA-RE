ioctl: 0x84
name: 'EMISSION_BLEEP_REAR_RIGHT_SPEAKER'
display_name:
  en: 'Emission of a bleep: rear right speaker'
  fr: 'Émission d''un bip sonore : haut-parleur arrière droit'
  es: 'Emisión de un bip sonoro : altavoz trasero derecho'
  de: 'Ausgabe eines Signaltons: Lautsprecher hinten rechts'
  pl: 'Emisja sygnału dźwiękowego bip: tylny prawy głośnik'
  hu: 'Egy hangjelzés kibocsátása : jobb hátsó hangszóró'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x20

  FREQUENCY_BIP:
    bits: '2.7-2.0'
    type: 'enum'

  DEACTIVATION_LOUDNESS:
    bits: '3.7-3.0'
    type: 'enum'
    default: 0x00

  VOLUME_CONTROL:
    bits: '4.7-4.0'
    type: 'enum'
    default: 0x12

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Emission of a bleep: rear right speaker'
      fr: 'Émission d''un bip sonore : haut-parleur arrière droit'
      es: 'Emisión de un bip sonoro : altavoz trasero derecho'
      de: 'Ausgabe eines Signaltons: Lautsprecher hinten rechts'
      pl: 'Emisja sygnału dźwiękowego bip: tylny prawy głośnik'
      hu: 'Egy hangjelzés kibocsátása : jobb hátsó hangszóró'
    max_duration_ms: 3000
