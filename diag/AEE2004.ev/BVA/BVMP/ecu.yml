node: 'BVA'
model: 'BVMP'
display_name:
  en: 'Gearbox control unit (BVMP)'
  fr: 'Calculateur de boite de vitesses (BVMP)'
protocols: ['UDS', 'KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x6A9
    response_id: 0x689
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x6A9
    response_id: 0x689
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x18DA18F1
    response_id: 0x18DAF118
    comment:
      en: '29 bit CAN identifiers'
      fr: 'Identifiants CAN 29 bits'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'
  0x61:
    en: 'Session 0x61'
    fr: 'Session 0x61'
  0x62:
    en: 'Session 0x62'
    fr: 'Session 0x62'

resets:
  0x01:
    en: 'Hard reset'
    fr: 'Réinitialisation matérielle'

services: [0x10, 0x11, 0x14, 0x17, 0x19, 0x21, 0x22, 0x27, 0x2E, 0x2F, 0x30, 0x31, 0x34, 0x3E, 0x81, 0x82]

security_access:
  - level: 0x01
    algorithm: 'PSA_SEED_KEY'
    key: '0B01'
  - level: 0x05
  - level: 0x83
    algorithm: 'PSA_SEED_KEY'
    key: '0B01'

tester_present:
  request: '3E'
  period_ms: 1000

identification:
  request: '21 FE'
  part_number: '22.7-24.0'
  comment:
    en: 'The ECU part number is in data bytes 22 to 24 of the answer to 21 FE (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 22 à 24 de la réponse à 21 FE (DCB), elle donne la variante logicielle'

cars: ['A5', 'A7', 'A9', 'MCV']

