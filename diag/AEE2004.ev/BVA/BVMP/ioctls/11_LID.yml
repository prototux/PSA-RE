ioctl: 0x11
name: 'OPENING_CLUTCH'
display_name:
  en: 'Opening of the clutch'
  fr: 'Ouverture de l''embrayage'
  es: 'Apertura del embrague'
  de: 'Öffnung der Kupplung'
  pl: 'Otwarcie sprzęgła'
  hu: 'A tengelykapcsoló nyitása'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants: ['A7_*', 'A9_*', 'A51_*', 'A55_*']

params:
  ACTIVATION_TYPE_ACTIVATION_REQUESTED:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x00

  ACTIVATION_TYPE_PILOT:
    bits: '2.7-2.0'
    type: 'enum'

  ACTIVATION_CLUTCH:
    bits: '3.7-3.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    alt_names: ['ACTUATOR_TEST_2']
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Opening of the clutch'
      fr: 'Ouverture de l''embrayage'
      es: 'Apertura del embrague'
      de: 'Öffnung der Kupplung'
      pl: 'Otwarcie sprzęgła'
      hu: 'A tengelykapcsoló nyitása'
  - display_name:
      en: 'Intermediate position'
      fr: 'Position intermédiaire'
      es: 'Posición intermedia'
      de: 'Teillaststellung'
      pl: 'Pozycja posrednia'
      hu: 'Közbenso helyzet'
    max_duration_ms: 30000
  - display_name:
      en: 'Closing of the clutch'
      fr: 'Fermeture de l''embrayage'
      es: 'Cierre del embrague'
      de: 'Schließung der Kupplung'
      pl: 'Zamknięcie sprzęgła'
      hu: 'A tengelykapcsoló zárása'
    max_duration_ms: 30000
