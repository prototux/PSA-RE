  - display_name:
      en: 'Setting of the gearbox actuator to the fitting position'
      fr: 'Calage de l''actionneur de boîte de vitesses en position de montage'
      es: 'Calado del accionador de caja de cambios en posición de montaje'
      de: 'Einstellung des Getriebe-Stellglieds in Montagestellung'
      pl: 'Blokowanie elementu wykonawczego skrzyni biegów w położeniu montażu'
      hu: 'A sebességváltó beavatkozószerv beállítása beszerelési helyzetbe'
  - display_name:
      en: 'Setting to the gearbox actuator removal position'
      fr: 'Calage en position de démontage de l''actionneur de boîte de vitesses'
