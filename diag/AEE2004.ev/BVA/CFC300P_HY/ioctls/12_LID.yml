ioctl: 0x12
name: 'ENGAGEMENT_1_GEAR'
display_name:
  en: 'Engagement of 1 gear'
  fr: 'Passage du rapport 1'
  es: 'Paso de la velocidad 1'
  de: 'Schalten des Gangs 1'
  pl: 'Włączenie przełożenia 1'
  hu: '1 fokozat kapcsolása'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  ACTIVATION_TYPE_ACTIVATION_REQUESTED:
    bits: '1.7-1.0'
    type: 'enum'

  ACTIVATION_TYPE_PILOT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x00

  ACTIVATION_PASSAGE_GEAR:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROL_STATUS_4:
    bits: '1.7-1.0'
    type: 'enum'
    values:
      0x00:
        en: 'Programming not started'
        fr: 'Apprentissage non lancé'
        es: 'Aprendizaje no lanzado'
        de: 'Einspeicherung nicht gestartet'
        pl: 'Uczenie nie rozpoczęte'
        hu: 'A tanulás nincs elindítva'
      0x01:
        en: 'Learning in progress'
        fr: 'Apprentissage en cours'
        es: 'Aprendizaje en curso'
        de: 'Programmierung läuft'
        pl: 'Wczytywanie w trakcie'
        hu: 'Inicializálás folyamatban'
      0x02:
        en: 'Programming complete : No problem found'
        fr: 'Apprentissage terminé : Aucun problème détecté'
        es: 'Aprendizaje terminado : Ningún problema detectado'
        de: 'Anlernung beendet : Kein Problem festgestellt'
        pl: 'Wczytywanie zakończone : Nie wykryto problemu'
        hu: 'Megismertetés befejezve : Nincs érzékelt probléma'
      0x04:
        en: 'Programming complete : A problem has been detected'
        fr: 'Apprentissage terminé : Un problème a été détecté'
        es: 'Aprendizaje terminado : Se ha detectado un problema'
        de: 'Anlernung beendet : Ein Problem wurde festgestellt'
        pl: 'Wczytywanie zakończone : Wykryty został problem'
        hu: 'Megismertetés befejezve : Egy probléma került észlelésre'
      0x11:
        en: 'Programming stopped by the operator'
        fr: 'Apprentissage arrêté par l''opérateur'
        es: 'Aprendizaje interrumpido por el operario'
        de: 'Einspeicherung vom Techniker beendet'
        pl: 'Uczenie zatrzymane przez operatora'
        hu: 'A kezelő által leállított megismertetés'

