routine: 0xDA
name: 'PRESSURISE_HYDRAULIC_CIRCUIT'
display_name:
  en: 'Pressurise the hydraulic circuit'
  fr: 'Mise en pression du circuit hydraulique'
  es: 'Puesta a presión del circuito hidráulico'
  de: 'Hydraulikssystem unter Druck setzen'
  pl: 'Doprowadzenie do prawidłowej wartości ciśnienia w układzie hydraulicznym'
  hu: 'A hidraulika kör nyomás alá helyezése'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  ROUTINE:
    bits: '1.7-1.0'
    type: 'enum'

  FUNCTION_VIDANGE_PRESSURE:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROL_STATUS_2:
    bits: '1.7-1.0'
    alt_names: ['CONTROL_STATUS_3']
    type: 'enum'
    values:
      0x01:
        en: 'Actuator jammed (disengaged)'
        fr: 'Actionneur bloqué (désengagé)'
        es: 'Accionador bloqueado (desengranado)'
        de: 'Stellglied blockiert (gelöst)'
        pl: 'Urządzenie wykonawcze zablokowane (odłączone)'
        hu: 'Blokkolt beavatkozószerv (kikapcsolt)'
      0x02:
        en: 'Actuator jammed (engaged)'
        fr: 'Actionneur bloqué (engagé)'
        es: 'Accionador bloqueado (engranado)'
        de: 'Stellglied blockiert (aktiviert)'
        pl: 'Urządzenie wykonawcze zablokowane (włączone)'
        hu: 'Blokkolt beavatkozószerv (bekapcsolt)'
      0x03:
        en: 'Protection activated'
        fr: 'Protection activée'
        es: 'Protección activa'
        de: 'Schutz aktiviert'
        pl: 'Zabezpieczenie włączone'
        hu: 'Védelem aktiválva'

tests:
  - display_name:
      en: 'Pressurise the hydraulic circuit'
      fr: 'Mise en pression du circuit hydraulique'
      es: 'Puesta a presión del circuito hidráulico'
      de: 'Hydraulikssystem unter Druck setzen'
      pl: 'Doprowadzenie do prawidłowej wartości ciśnienia w układzie hydraulicznym'
      hu: 'A hidraulika kör nyomás alá helyezése'
  - display_name:
      en: 'Depressurisation of the hydraulic circuit'
      fr: 'Mise hors pression du circuit hydraulique'
      es: 'Puesta fuera de presión del circuito hidráulico'
      de: 'Druckabbau des Hydrauliksystems'
      pl: 'Dekompresja układu hydraulicznego'
      hu: 'Hidraulikus kör nyomáson kívül helyezése'
