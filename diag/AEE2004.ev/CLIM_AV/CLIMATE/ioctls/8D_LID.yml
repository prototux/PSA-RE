ioctl: 0x8D
name: 'AIR_CONDITIONING_FUNCTION_LED'
display_name:
  en: 'Air conditioning function LED'
  fr: 'Témoin des fonctions de la climatisation'
  es: 'Testigo de las funciones de climatización'
  de: 'Kontrollleuchte der Funktionen der Klimaanlage'
  pl: 'Wskaznik kontrolny funkcji klimatyzacji'
  hu: 'A légkondícionálás funkcióinak visszajelzo lámpái'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER_1:
    bits: '1.7-1.0'
    type: 'enum'

  CONTROL_PARAMETER_3:
    bits: '2.7-2.0'
    type: 'uint'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Air conditioning function LED'
      fr: 'Témoin des fonctions de la climatisation'
      es: 'Testigo de las funciones de climatización'
      de: 'Kontrollleuchte der Funktionen der Klimaanlage'
      pl: 'Wskaznik kontrolny funkcji klimatyzacji'
      hu: 'A légkondícionálás funkcióinak visszajelzo lámpái'
    max_duration_ms: 2000
