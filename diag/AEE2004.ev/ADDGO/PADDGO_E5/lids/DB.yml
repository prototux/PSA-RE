lid: 0xDB
name: 'LID_DB'
display_name:
  en: 'Data record 0xDB (3 values)'
  fr: 'Enregistrement 0xDB (3 valeurs)'
kind: 'config'
access: 'read-write'
length: 4

params:
  CYLINDREMOTEUR:
    bits: '1.7-1.0'
    type: 'uint'

  CAPACITY_ADDITIVE_BAG_TANK:
    bits: '2.7-2.0'
    alt_names: ['VOLUME_ADDITIVE_WHEN_NEW']
    comment:
      en: 'Capacity of the additive bag tank'
      fr: 'Capacité du réservoir souple d''additif'
      es: 'Capacidad de la bolsa de aditivo'
      de: 'Kapazität des flexiblen Additivbehälters'
      pl: 'Pojemność elastycznego zbiornika dodatku'
      hu: 'A rugalmas adalékanyagtartály kapacitása'
    type: 'uint'
    factor: 0.01
    offset: 1
    units: 'L'

  RESERVED:
    bits: '3.7-3.0'
    unused: true

  HYBRID_VEHICLE_OR_VEHICLE_EQUIPPED_STOP_AND:
    bits: '4.0'
    comment:
      en: 'Hybrid" vehicle or vehicle equipped with the "Stop and Start" function'
      fr: 'Véhicule "Hybride" ou équipé de la fonction "Stop and Start'
      es: 'Vehículo híbrido o equipado con la función "Stop and Start'
      de: 'Fahrzeug "Hybrid" oder ausgestattet mit der Funktion "Stop and Start'
      pl: 'Pojazd "Hybrydowy" lub wyposażony w funkcję "Stop and Start'
      hu: 'Hibrid" vagy "Stop and Start" funkcióval felszerelt gépjármű'
    type: 'bool'
    values:
      0x00:
        en: 'NO'
        fr: 'NON'
        es: 'NO'
        de: 'NEIN'
        pl: 'NIE'
        hu: 'NEM/NINCS'
      0x01:
        en: 'YES'
        fr: 'OUI'
        es: 'SI'
        de: 'JA'
        pl: 'TAK'
        hu: 'IGEN'

  RESERVED_2:
    bits: '4.7-4.1'
    unused: true

alternatives:
  - note:
      en: 'Layout seen on 102 other software variant(s)'
      fr: 'Format vu sur 102 autre(s) variante(s) logicielle(s)'
    variants: ['B7_*', 'B8_*', 'B9_*', 'B58_*', 'T7_*', 'T8_*']
    access: 'read-write'
    length: 3
    params:
      CYLINDREMOTEUR:
        bits: '1.7-1.0'
        type: 'uint'
      CAPACITY_ADDITIVE_BAG_TANK:
        bits: '2.7-2.0'
        comment:
          en: 'Capacity of the additive bag tank'
          fr: 'Capacité du réservoir souple d''additif'
          es: 'Capacidad de la bolsa de aditivo'
          de: 'Kapazität des flexiblen Additivbehälters'
          pl: 'Pojemność elastycznego zbiornika dodatku'
          hu: 'A rugalmas adalékanyagtartály kapacitása'
        type: 'uint'
        factor: 0.01
        offset: 1
        units: 'L'
      RESERVED:
        bits: '3.7-3.0'
        unused: true
