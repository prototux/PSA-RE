node: 'ADDGO'
model: 'PADDGO_TI_E6'
display_name:
  en: 'Diesel additive (FAP) pump (PADDGO_TI_E6)'
  fr: 'Pompe d''additif gasoil (FAP) (PADDGO_TI_E6)'
protocols: ['KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'KWP-PSA2000'
    request_id: 0x6C1
    response_id: 0x601
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'
  0xC0:
    en: 'PSA diagnostic session'
    fr: 'Session de diagnostic PSA'
  0xFA:
    en: 'Supplier specific session'
    fr: 'Session spécifique fournisseur'

resets:
  0xB0:
    en: 'Reset 0xB0'
    fr: 'Réinitialisation 0xB0'

services: [0x10, 0x11, 0x14, 0x17, 0x21, 0x27, 0x31, 0x3B, 0x3E]

security_access:
  - level: 0x83

tester_present:
  request: '3E'
  period_ms: 1000

identification:
  request: '21 D0'
  part_number: '1.7-5.0'
  comment:
    en: 'The ECU part number is in data bytes 1 to 5 of the answer to 21 D0 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 1 à 5 de la réponse à 21 D0 (DCB), elle donne la variante logicielle'

cars: ['A5', 'A88', 'A9', 'B618', 'B7', 'B8', 'B9', 'E3', 'M33', 'T7', 'T8']

