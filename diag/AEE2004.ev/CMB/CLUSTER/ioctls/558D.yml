ioctl: 0x558D
name: 'DOOR_OPEN_LED'
display_name:
  en: 'Door open LED'
  fr: 'Témoin porte ouverte'
  es: 'Testigo puerta abierta'
  de: 'Kontrollleuchte Tür geöffnet'
  pl: 'Lampka kontrolna otwartych drzwi'
  hu: 'Nyitott ajtóra figyelmezteto lámpa'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Door open LED'
      fr: 'Témoin porte ouverte'
      es: 'Testigo puerta abierta'
      de: 'Kontrollleuchte Tür geöffnet'
      pl: 'Lampka kontrolna otwartych drzwi'
      hu: 'Nyitott ajtóra figyelmezteto lámpa'
    max_duration_ms: 1000
