  - display_name:
      en: 'Resetting of all of the stepper motors'
      fr: 'Recalage de l''ensembles des moteurs pas à pas'
      es: 'Recalado de los conjuntos de motores paso a paso'
      de: 'Initialisierung aller Schrittmotoren'
      pl: 'Ponowne ustawienie zespołów silników krokowych'
      hu: 'Léptetőmotorok egységének újbóli beállítása'
    max_duration_ms: 2000
