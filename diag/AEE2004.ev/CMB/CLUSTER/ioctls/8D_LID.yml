ioctl: 0x8D
name: 'POINT_MATRIX'
display_name:
  en: 'Point matrix'
  fr: 'Matrice de points'
  es: 'Matriz de puntos'
  de: 'Punktmatrixanzeige'
  pl: 'Matryca punktów'
  hu: 'Pontmátrix'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants:
  - 'A7_*'
  - 'A51_*'
  - 'A55P_*'
  - 'A55_*'
  - 'A58_*'
  - 'A76_*'
  - 'B5_*'
  - 'B9E_*'
  - 'B9_*'
  - 'D2_*'
  - 'DEGRADED_MODE_A51'
  - 'DEGRADED_MODE_A55'
  - 'G9_*'
  - 'LA_*'
  - 'M59_*'
  - 'M69_*'
  - 'T3_*'
  - 'T6_*'
  - 'T7_*'
  - 'T84_*'
  - 'VCAN_*'
  - 'X6_*'
  - 'X7_*'
  - 'Z9_*'

params:
  CONTROL_PARAMETER_1:
    bits: '1.7-1.0'
    type: 'enum'

  PARAPIL28D:
    bits: '2.7-3.0'
    type: 'uint'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Point matrix'
      fr: 'Matrice de points'
      es: 'Matriz de puntos'
      de: 'Punktmatrixanzeige'
      pl: 'Matryca punktów'
