ioctl: 0x5598
name: 'HEADLAMP_BEAM_CORRECTION_POSITION'
display_name:
  en: 'Headlamp beam correction position'
  fr: 'Position de correction d''assiette des feux'
  es: 'Posición de corrección de la altura de las luces'
  de: 'Position Leuchtweitenregelung'
  pl: 'Polozenie korekcji nachylenia swiatel'
  hu: 'A fényszóróház korrekciós pozíciója'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  POSIZIONE_CAF:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Headlamp beam correction position'
      fr: 'Position de correction d''assiette des feux'
      es: 'Posición de corrección de la altura de las luces'
      de: 'Position Leuchtweitenregelung'
      pl: 'Polozenie korekcji nachylenia swiatel'
      hu: 'A fényszóróház korrekciós pozíciója'
    max_duration_ms: 2500
