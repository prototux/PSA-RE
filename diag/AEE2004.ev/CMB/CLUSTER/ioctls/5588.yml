ioctl: 0x5588
name: 'ENGINE_OVERHEATING_LED'
display_name:
  en: 'Engine overheating LED'
  fr: 'Témoin de surchauffe moteur'
  es: 'Testigo de sobrecalentamiento del motor'
  de: 'Kontrollleuchte Motorüberhitzung'
  pl: 'Lampka kontrolna przegrzania silnika'
  hu: 'Motor túlmelegedés jelzolámpa'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Engine overheating LED'
      fr: 'Témoin de surchauffe moteur'
      es: 'Testigo de sobrecalentamiento del motor'
      de: 'Kontrollleuchte Motorüberhitzung'
      pl: 'Lampka kontrolna przegrzania silnika'
      hu: 'Motor túlmelegedés jelzolámpa'
    max_duration_ms: 1000
