ioctl: 0x55BD
name: 'STOP_AND_START_FUNCTION_WARNING_LAMP'
display_name:
  en: 'Stop and Start function warning lamp'
  fr: 'Témoin de la fonction Stop and Start'
  es: 'Testigo de la función Stop and Start'
  de: 'Kontrollleuchte der Funktion Stop and Start'
  pl: 'Kontrolka funkcji Stop and Start'
  hu: 'A Stop and Start funkció visszajelzése'
variants: ['MCV_V2_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Stop and Start function warning lamp'
      fr: 'Témoin de la fonction Stop and Start'
      es: 'Testigo de la función Stop and Start'
      de: 'Kontrollleuchte der Funktion Stop and Start'
      pl: 'Kontrolka funkcji Stop and Start'
      hu: 'A Stop and Start funkció visszajelzése'
    max_duration_ms: 1000
