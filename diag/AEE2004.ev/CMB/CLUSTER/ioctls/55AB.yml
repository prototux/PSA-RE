ioctl: 0x55AB
name: 'LOW_OIL_LEVEL_LED'
display_name:
  en: 'Low oil level LED'
  fr: 'Témoin de niveau d''huile mini'
  es: 'Testigo de nivel de aceite mínimo'
  de: 'Kontrollleuchte Ölstand mini'
  pl: 'Lampka kontrolna poziomu minimum oleju'
  hu: 'Minimális olajszint jelzolámpa'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Low oil level LED'
      fr: 'Témoin de niveau d''huile mini'
      es: 'Testigo de nivel de aceite mínimo'
      de: 'Kontrollleuchte Ölstand mini'
      pl: 'Lampka kontrolna poziomu minimum oleju'
      hu: 'Minimális olajszint jelzolámpa'
    max_duration_ms: 1000
