ioctl: 0x559E
name: 'PASSENGER_S_AIRBAG_DEACTIVATION_LED'
display_name:
  en: 'Passenger''s airbag deactivation LED'
  fr: 'Témoin d''inhibition airbag passager'
  es: 'Testigo de neutralización airbag pasajero'
  de: 'Kontrollleuchte Deaktivierung Beifahrerairbag'
  pl: 'Lampka kontrolna neutralizacji poduszki powietrznej pasazera'
  hu: 'Utasoldali légzásk tiltás jelzolámpa'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Passenger''s airbag deactivation LED'
      fr: 'Témoin d''inhibition airbag passager'
      es: 'Testigo de neutralización airbag pasajero'
      de: 'Kontrollleuchte Deaktivierung Beifahrerairbag'
      pl: 'Lampka kontrolna neutralizacji poduszki powietrznej pasazera'
      hu: 'Utasoldali légzásk tiltás jelzolámpa'
    max_duration_ms: 1000
