ioctl: 0x556B
name: 'COOLANT_TEMPERATURE_GAUGE'
display_name:
  en: 'Coolant temperature gauge'
  fr: 'Indicateur de température d''eau'
  es: 'Indicador de temperatura del agua'
  de: 'Kühlmittel-Temperaturanzeiger'
  pl: 'Wskaźnik temperatury płynu chłodzącego'
  hu: 'Hűtőfolyadék-hőmérséklet kijelző'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  USTEP:
    bits: '2.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Coolant temperature gauge'
      fr: 'Indicateur de température d''eau'
      es: 'Indicador de temperatura del agua'
      de: 'Kühlmittel-Temperaturanzeiger'
      pl: 'Wskaźnik temperatury płynu chłodzącego'
      hu: 'Hűtőfolyadék-hőmérséklet kijelző'
    max_duration_ms: 2000
