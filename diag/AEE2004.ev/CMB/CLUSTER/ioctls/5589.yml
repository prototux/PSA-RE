ioctl: 0x5589
name: 'BATTERY_CHARGE_WARNING_LAMP'
display_name:
  en: 'Battery charge warning lamp'
  fr: 'Témoin de charge batterie'
  es: 'Testigo carga de batería'
  de: 'Batterieladekontrollleuchte'
  pl: 'Lampka kontrolna ladowania akumulatora'
  hu: 'Akku töltés visszajelző'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
