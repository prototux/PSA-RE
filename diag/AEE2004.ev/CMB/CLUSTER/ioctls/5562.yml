ioctl: 0x5562
name: 'ESP_WARNING_LAMP'
display_name:
  en: 'ESP warning lamp'
  fr: 'Témoin ESP'
  es: 'Testigo ESP'
  de: 'Kontrollleuchte ESP'
  pl: 'Lampka kontrolna ESP'
  hu: 'ESP visszajelző lámpa'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'ESP warning lamp'
      fr: 'Témoin ESP'
      es: 'Testigo ESP'
      de: 'Kontrollleuchte ESP'
      pl: 'Lampka kontrolna ESP'
      hu: 'ESP visszajelző lámpa'
    max_duration_ms: 1000
