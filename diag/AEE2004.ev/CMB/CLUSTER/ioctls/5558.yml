ioctl: 0x5558
name: 'MAIN_BEAM_HEADLAMPS_INDICATOR_LIGHT'
display_name:
  en: 'Main beam headlamps indicator light'
  fr: 'Témoin feux de route'
  es: 'Testigo de luces de carretera'
  de: 'Kontrollleuchte Fernlicht'
  pl: 'Kontrolka świateł drogowych'
  hu: 'Fényszóró visszajelzés'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Main beam headlamps indicator light'
      fr: 'Témoin feux de route'
      es: 'Testigo de luces de carretera'
      de: 'Kontrollleuchte Fernlicht'
      pl: 'Kontrolka świateł drogowych'
      hu: 'Fényszóró visszajelzés'
    max_duration_ms: 1000
