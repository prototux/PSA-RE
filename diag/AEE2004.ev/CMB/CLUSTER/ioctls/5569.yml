ioctl: 0x5569
name: 'IO_CONTROL_5569'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x01

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
