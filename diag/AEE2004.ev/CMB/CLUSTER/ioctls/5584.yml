ioctl: 0x5584
name: 'FUEL_RESERVE_LED'
display_name:
  en: 'Fuel reserve LED'
  fr: 'Témoin de réserve carburant'
  es: 'Testigo de reserva de carburante'
  de: 'Kontrollleuchte Kraftstoffreserve'
  pl: 'Lampka kontrolna rezerwy paliwa'
  hu: 'Üzemanyag tartalék jelzolámpa'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Fuel reserve LED'
      fr: 'Témoin de réserve carburant'
      es: 'Testigo de reserva de carburante'
      de: 'Kontrollleuchte Kraftstoffreserve'
      pl: 'Lampka kontrolna rezerwy paliwa'
      hu: 'Üzemanyag tartalék jelzolámpa'
    max_duration_ms: 1000
