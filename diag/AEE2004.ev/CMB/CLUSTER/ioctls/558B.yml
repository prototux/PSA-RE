ioctl: 0x558B
name: 'MIL_FAULT_LED_EOBD'
display_name:
  en: 'MIL fault LED (EOBD)'
  fr: 'Témoin Défaut MIL (EOBD)'
  es: 'Testigo Defecto MIL (EOBD)'
  de: 'Fehlerleuchte MIL (EOBD)'
  pl: 'Kontrolka usterki MIL (EOBD)'
  hu: 'MIL hiba kijlezés (EOBD)'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
