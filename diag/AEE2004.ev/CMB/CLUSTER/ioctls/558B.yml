    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'MIL fault LED (EOBD)'
      fr: 'Témoin Défaut MIL (EOBD)'
      es: 'Testigo Defecto MIL (EOBD)'
