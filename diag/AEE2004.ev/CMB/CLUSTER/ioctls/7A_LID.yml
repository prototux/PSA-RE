ioctl: 0x7A
name: 'AUTO_GEARBOX_GEAR_DISPLAY_OFF'
display_name:
  en: 'Auto Gearbox gear display off'
  fr: 'Extinction affichage rapport Boîte Auto'
  es: 'Apagado de la información velocidad Caja Auto'
  de: 'Erlöschen der Anzeige Getriebegang'
  pl: 'Wylaczenie wyswietlania przelozenia automatycznej skrzyni biegów'
  hu: 'Az Automata sebességváltó fokozat kijelzés kialvása'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants: ['I3_*', 'J3_*']

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

  GEAR_RATIO_OFF_INDICATOR_CONTROL:
    bits: '2.1'
    type: 'bool'

  DOWN_ARROW_INDICATOR_CONTROL:
    bits: '3.1'
    type: 'bool'

  GEAR_RATIO_D4_INDICATOR_CONTROL:
    bits: '4.4'
    type: 'bool'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x03:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x04:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

