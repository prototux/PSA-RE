ioctl: 0x5560
name: 'PILOTED_MANUAL_GEARBOX_WARNING_LAMP'
display_name:
  en: 'Piloted manual gearbox warning lamp'
  fr: 'Témoin de boîte de vitesses manuelle pilotée'
  es: 'Testigo de caja de velocidades manual pilotada'
  de: 'Kontrollleuchte Automatisiertes Schaltgetriebe'
  pl: 'Kontrolka ręcznej sterowanej skrzyni biegów'
  hu: 'Vezérelt mechanikus sebességváltóegység visszajelzés'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Piloted manual gearbox warning lamp'
      fr: 'Témoin de boîte de vitesses manuelle pilotée'
      es: 'Testigo de caja de velocidades manual pilotada'
      de: 'Kontrollleuchte Automatisiertes Schaltgetriebe'
      pl: 'Kontrolka ręcznej sterowanej skrzyni biegów'
      hu: 'Vezérelt mechanikus sebességváltóegység visszajelzés'
    max_duration_ms: 1000
