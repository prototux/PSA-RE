ioctl: 0x5561
name: 'WATER_DIESEL_LED'
display_name:
  en: 'Water in diesel LED'
  fr: 'Témoin de présence d''eau dans le gasoil'
  es: 'Testigo de presencia de agua en el gasoil'
  de: 'Kontrollleuchte Vorhandensein Wasser im Diesel'
  pl: 'Lampka kontrolna obecnosci wody w oleju napedowym'
  hu: 'Gázolajban lévo víz jelenlétét jelzo lámpa'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Water in diesel LED'
      fr: 'Témoin de présence d''eau dans le gasoil'
      es: 'Testigo de presencia de agua en el gasoil'
      de: 'Kontrollleuchte Vorhandensein Wasser im Diesel'
      pl: 'Lampka kontrolna obecnosci wody w oleju napedowym'
      hu: 'Gázolajban lévo víz jelenlétét jelzo lámpa'
    max_duration_ms: 1000
