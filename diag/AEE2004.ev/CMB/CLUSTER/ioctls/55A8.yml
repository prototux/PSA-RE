ioctl: 0x55A8
name: 'SPEED_LIMITER_ACTIVATION_INDICATOR_LAMP'
display_name:
  en: 'Speed limiter activation indicator lamp'
  fr: 'Témoin d''activation du limiteur de vitesse'
  es: 'Testigo de activación del limitador de velocidad'
  de: 'Kontrollleuchte Aktivierung des Geschwindigkeitsbegrenzers'
  pl: 'Lampka kontrolna włączenia ogranicznika prędkości'
  hu: 'Sebességkorlátozó aktiválási visszajelzés'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Speed limiter activation indicator lamp'
      fr: 'Témoin d''activation du limiteur de vitesse'
      es: 'Testigo de activación del limitador de velocidad'
      de: 'Kontrollleuchte Aktivierung des Geschwindigkeitsbegrenzers'
      pl: 'Lampka kontrolna włączenia ogranicznika prędkości'
      hu: 'Sebességkorlátozó aktiválási visszajelzés'
    max_duration_ms: 1000
