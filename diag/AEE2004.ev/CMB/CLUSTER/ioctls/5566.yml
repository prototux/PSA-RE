ioctl: 0x5566
name: 'TYRE_UNDER_INFLATION_WARNING_LAMP'
display_name:
  en: 'Tyre under-inflation warning lamp'
  fr: 'Témoin d''alerte de sous-gonflage des pneumatiques'
  es: 'Testigo de alerta de subinflado de los neumáticos'
  de: 'Warnanzeige zu niedriger Reifendruck'
  pl: 'Lampka kontrolna alarmu niskiego ciśnienia w oponach'
  hu: 'Gumiabroncsok elégtelen nyomása figyelmeztető visszajelzés'
variants: ['MCV_V1_*', 'MCV_V2_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Tyre under-inflation warning lamp'
      fr: 'Témoin d''alerte de sous-gonflage des pneumatiques'
      es: 'Testigo de alerta de subinflado de los neumáticos'
      de: 'Warnanzeige zu niedriger Reifendruck'
      pl: 'Lampka kontrolna alarmu niskiego ciśnienia w oponach'
      hu: 'Gumiabroncsok elégtelen nyomása figyelmeztető visszajelzés'
    max_duration_ms: 1000
