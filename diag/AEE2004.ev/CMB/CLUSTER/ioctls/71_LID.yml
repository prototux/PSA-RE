ioctl: 0x71
name: 'REV_COUNTER_INDICATOR'
display_name:
  en: 'Rev counter indicator'
  fr: 'Indicateur compte-tours'
  es: 'Indicador cuentarrevoluciones'
  de: 'Drehzahlanzeiger'
  pl: 'Obrotomierz'
  hu: 'Fordulatszám-kijelző'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants: ['I3_*', 'J3_*', 'X250_*']

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

  ENGINE_SPEED_INDICATOR_CONTROL:
    bits: '2.7-3.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x03:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x04:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Rev counter indicator'
      fr: 'Indicateur compte-tours'
      es: 'Indicador cuentarrevoluciones'
      de: 'Drehzahlanzeiger'
      pl: 'Obrotomierz'
      hu: 'Fordulatszám-kijelző'
    max_duration_ms: 2000
  - display_name:
      en: 'Fuel gauge'
      fr: 'Jauge niveau carburant'
      es: 'Contador de nivel de aceite'
      de: 'Kraftstoffvorratsanzeige'
      pl: 'Czujnik poziomu paliwa'
      hu: 'Tüzelőanyag szintmérő'
    max_duration_ms: 1000
