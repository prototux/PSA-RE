ioctl: 0x55A6
name: 'DIESEL_PRE_HEATING_WARNING_LIGHT'
display_name:
  en: 'Diesel pre-heating warning light'
  fr: 'Témoin Préchauffage diesel'
  es: 'Testigo de Precalentamiento diesel'
  de: 'Kontrollleuchte Diesel-Vorglühung'
  pl: 'Kontrolka Podgrzewania diesla'
  hu: 'Dízel előizzítás visszajelzés'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Diesel pre-heating warning light'
      fr: 'Témoin Préchauffage diesel'
      es: 'Testigo de Precalentamiento diesel'
      de: 'Kontrollleuchte Diesel-Vorglühung'
      pl: 'Kontrolka Podgrzewania diesla'
      hu: 'Dízel előizzítás visszajelzés'
    max_duration_ms: 1000
