ioctl: 0x77
name: 'AIR_BAG_FAULT_WARNING_LIGHT'
display_name:
  en: 'Air bag fault warning light'
  fr: 'Témoin anomalie coussin gonflable'
  es: 'Testigo de anomalía de conjín inflable'
  de: 'Airbag-Warnleuchte'
  pl: 'Kontrolka niesprawności poduszki powietrznej'
  hu: 'Légzsák rendellenesség visszajelzés'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants: ['I3_*', 'J3_*']

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

  AIRBAG_FAULT_INDICATOR_CONTROL:
    bits: '2.1'
    type: 'bool'

  FRONT_FOG_LIGHT_INDICATOR_CONTROL:
    bits: '3.0'
    type: 'bool'

  CRUISE_CONTROL_INDICATOR_CONTROL:
    bits: '4.0'
    type: 'bool'

  REAR_FOG_LIGHT_INDICATOR_CONTROL:
    bits: '5.0'
    type: 'bool'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x03:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x04:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Air bag fault warning light'
      fr: 'Témoin anomalie coussin gonflable'
      es: 'Testigo de anomalía de conjín inflable'
      de: 'Airbag-Warnleuchte'
      pl: 'Kontrolka niesprawności poduszki powietrznej'
      hu: 'Légzsák rendellenesség visszajelzés'
    max_duration_ms: 1000
  - display_name:
      en: 'Right-hand direction indicator'
      fr: 'Indicateur directionnel droit'
      es: 'Indicador direccional derecho'
      de: 'Fahrtrichtungsanzeiger rechts'
      pl: 'Prawy kierunkowskaz'
      hu: 'Jobb oldali irányjelző kijelzés'
    max_duration_ms: 1000
  - display_name:
      en: 'Left-hand direction indicator'
      fr: 'Indicateur directionnel gauche'
      es: 'Indicador direccional izquierdo'
      de: 'Fahrtrichtungsanzeiger links'
      pl: 'Lewy kierunkowskaz'
      hu: 'Bal oldali irányjelző kijelzés'
