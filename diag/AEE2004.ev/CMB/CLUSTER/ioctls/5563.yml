  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Stop LED'
      fr: 'Témoin stop'
      es: 'Testigo stop'
      de: 'Kontrollleuchte Stop'
      pl: 'Lampka kontrolna stop'
      hu: 'Stop jelzolámpa'
    max_duration_ms: 1000
