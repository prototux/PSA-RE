ioctl: 0x5563
name: 'STOP_LED'
display_name:
  en: 'Stop LED'
  fr: 'Témoin stop'
  es: 'Testigo stop'
  de: 'Kontrollleuchte Stop'
  pl: 'Lampka kontrolna stop'
  hu: 'Stop jelzolámpa'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
