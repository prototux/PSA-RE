ioctl: 0x78
name: 'TRAILER_PRESENCE_INDICATOR_LAMP'
display_name:
  en: 'Trailer presence indicator lamp'
  fr: 'Témoin de présence de remorque'
  es: 'Testigo de presencia de remolque'
  de: 'Kontrollleuchte Anhänger vorhanden'
  pl: 'Lampka kontrolna obecności przyczepy'
  hu: 'Utánfutó jelenléte visszajelzés'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants: ['I3_*', 'J3_*']

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

  TRAILER_PRESENCE_INDICATOR_CONTROL:
    bits: '2.3'
    type: 'bool'

  SENSOR_INDICATOR_CONTROL:
    bits: '3.3'
    type: 'bool'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x03:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x04:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Trailer presence indicator lamp'
      fr: 'Témoin de présence de remorque'
      es: 'Testigo de presencia de remolque'
      de: 'Kontrollleuchte Anhänger vorhanden'
      pl: 'Lampka kontrolna obecności przyczepy'
      hu: 'Utánfutó jelenléte visszajelzés'
    max_duration_ms: 1000
  - display_name:
      en: 'Under-inflation warning lamp'
      fr: 'Témoin de sous-gonflage'
      es: 'Testigo de ruedas poco infladas'
      de: 'Kontrollleuchte unzureichender Fülldruck'
      pl: 'Lampka kontrolna niedopompowania'
      hu: 'Alacsony gumiabroncsnyomás visszajelző'
