ioctl: 0x5556
name: 'LOW_LEVEL_HANDBRAKE_LED'
display_name:
  en: 'Low level / handbrake LED'
  fr: 'Témoin frein de parking / niveau mini'
  es: 'Testigo freno de parking / nivel mínimo'
  de: 'Kontrollleuchte Handbremse / Niveau mini'
  pl: 'Lampka kontrolna hamulca postojowego / poziomu minimum'
  hu: 'Rögzítofék / minimális szint jelzolámpa'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Low level / handbrake LED'
      fr: 'Témoin frein de parking / niveau mini'
      es: 'Testigo freno de parking / nivel mínimo'
      de: 'Kontrollleuchte Handbremse / Niveau mini'
      pl: 'Lampka kontrolna hamulca postojowego / poziomu minimum'
      hu: 'Rögzítofék / minimális szint jelzolámpa'
    max_duration_ms: 1000
