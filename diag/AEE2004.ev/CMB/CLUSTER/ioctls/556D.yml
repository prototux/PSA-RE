ioctl: 0x556D
name: 'SPEEDOMETER'
display_name:
  en: 'Speedometer'
  fr: 'Indicateur de vitesse véhicule'
  es: 'Indicador de velocidad del vehículo'
  de: 'Anzeige Fahrzeuggeschwindigkeit'
  pl: 'Prędkościomierz'
  hu: 'Járműsebesség kijelző'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  USTEP:
    bits: '2.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Speedometer'
      fr: 'Indicateur de vitesse véhicule'
      es: 'Indicador de velocidad del vehículo'
      de: 'Anzeige Fahrzeuggeschwindigkeit'
      pl: 'Prędkościomierz'
      hu: 'Járműsebesség kijelző'
    max_duration_ms: 2000
