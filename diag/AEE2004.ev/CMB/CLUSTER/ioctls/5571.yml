ioctl: 0x5571
name: 'CHECKING_AUDIBLE_WARNING'
display_name:
  en: 'Checking the audible warning'
  fr: 'Contrôle du bruiteur'
  es: 'Control del claxon'
  de: 'Überprüfung des Akustikgebers'
  pl: 'Sprawdzenie brzęczyka'
  hu: 'Berregő ellenőrzése'
variants: ['MCV_*']
controls:
