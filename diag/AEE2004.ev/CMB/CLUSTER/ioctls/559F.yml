ioctl: 0x559F
name: 'SEAT_BELT_NOT_FASTENED_LED'
display_name:
  en: 'Seat belt not fastened LED'
  fr: 'Témoin de non-bouclage ceinture'
  es: 'Testigo de no bloqueo del cinturón'
  de: 'Kontrollleuchte bei nicht angelegtem Sicherheitsgurt'
  pl: 'Lampka kontrolna niezapiecia pasów bezpieczenstwa'
  hu: 'A be nem kapcsolt övre figyelmezteto jelzolámpa'
variants: ['MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x01:
    en: 'Reset to default'
    fr: 'Retour à la valeur par défaut'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
