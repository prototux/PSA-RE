node: 'CMB'
model: 'COMBINE'
display_name:
  en: 'Instrument cluster (COMBINE)'
  fr: 'Combine (COMBINE)'
protocols: ['UDS', 'KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x75F
    response_id: 0x65F
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x6A0
    response_id: 0x514
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x7B0
    response_id: 0x7C3
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x18DA60F1
    response_id: 0x18DAF160
    comment:
      en: '29 bit CAN identifiers'
      fr: 'Identifiants CAN 29 bits'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'
  0x89:
    en: 'Session 0x89'
    fr: 'Session 0x89'
  0x92:
    en: 'Session 0x92'
    fr: 'Session 0x92'
  0xC0:
    en: 'PSA diagnostic session'
    fr: 'Session de diagnostic PSA'
  0xFA:
    en: 'Supplier specific session'
    fr: 'Session spécifique fournisseur'

resets:
  0x01:
    en: 'Hard reset'
    fr: 'Réinitialisation matérielle'
  0xB0:
    en: 'Reset 0xB0'
    fr: 'Réinitialisation 0xB0'
  0xB1:
    en: 'Reset 0xB1'
    fr: 'Réinitialisation 0xB1'

services: [0x10, 0x11, 0x14, 0x17, 0x18, 0x19, 0x1A, 0x20, 0x21, 0x22, 0x23, 0x27, 0x28, 0x29, 0x2A, 0x2C, 0x2E, 0x2F, 0x30, 0x31, 0x32, 0x34, 0x36, 0x37, 0x3B, 0x3E, 0x81, 0x82, 0x85, 0x86]

security_access:
  - level: 0x01
  - level: 0x05
  - level: 0x83

tester_present:
  request: '3E 00'
  period_ms: 1000

identification:
  request: '21 80'
  part_number: '8.7-12.0'
  comment:
    en: 'The ECU part number is in data bytes 8 to 12 of the answer to 21 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 8 à 12 de la réponse à 21 80 (DCB), elle donne la variante logicielle'

