lid: 0xB1
name: 'SENSITIVITY_INTERNAL_SENSORS'
display_name:
  en: 'Sensitivity of the internal sensors'
  fr: 'Sensibilité des capteurs volumétriques'
  es: 'Sensibilidad de los captadores volumétricos'
  de: 'Empfindlichkeit der Innenraum-Überwachungsgeber'
  pl: 'Czułość czujników pojemnościowych'
  hu: 'A térvédelmi érzékelők érzékenysége'
comment:
  en: 'Used to define the sensitivity of the internal sensors. the sensitivity depends on the volume of the vehicle and the trim of the seats. Sensitivity 1 corresponds to the lowest sensitivity.'
  fr: 'Permet de définir la sensibilité des capteurs volumétriques. la sensibilité dépend du volume du véhicule et de l''habillage des sièges. La sensibilité 1 correspond à la sensibilité la moins élevée.'
  es: 'Permite definir la sensibilidad de los captadores volumétricos. la sensibilidad depende del volumen del vehículo y del revestimiento de los asientos. La sensibilidad 1 corresponde a la sensibilidad menos elevada.'
  de: 'Ermöglicht die Definition der Empfindlichkeit der Innenraum-Überwachungsgeber. die Empfindlichkeit ist abhängig vom Fahrzeug-Volumen und von den Sitzbezügen. Die Empfindlichkeit 1 entspricht der niedrigsten Empfindlichkeit.'
  pl: 'Pozwala określić czułość czujników pojemnościowych. czułość zależy od pojemności pojazdu i pokrycia foteli. Czułość 1 odpowiada najniższej czułości.'
  hu: 'Lehetővé teszi a térvédelmi érzékelők érzékenységének meghatározását. az érzékenység a gépkocsi terétől és az ülések burkolatától függ. A 1 érzékenység megfelel a legkisebb érzékenységi foknak.'
kind: 'config'
access: 'read-write'
length: 1

