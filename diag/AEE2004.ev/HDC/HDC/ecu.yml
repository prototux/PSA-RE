node: 'HDC'
model: 'HDC'
display_name:
  en: 'Steering column switch module (HDC)'
  fr: 'Haut de colonne (commodos) (HDC)'
protocols: ['KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'KWP-PSA2000'
    request_id: 0x742
    response_id: 0x642
