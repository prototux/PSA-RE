lid: 0xB3
name: 'DISPLAY_ARTIV_FUNCTION'
display_name:
  en: 'Display with ARTIV function'
  fr: 'Affichage avec fonction ARTIV'
  es: 'Señalización con función ARTIV'
  de: 'Anzeige mit Funktion ARTIV'
  pl: 'Wyswietlanie z funkcja ARTIV'
  hu: 'Kijelzés a ARTIV funkcióval'
comment:
  en: 'Activates the distance alert function (ARTIV) The distance alert function assists the driver in keeping a safe distance from the vehicle in front'
  fr: 'Permet d''activer la fonction d''aide au respect du temps intervéhicules (ARTIV) La fonction aide au respect du temps intervéhicule aide le conducteur à respecter les distances de sécurité avec le véhicule le précédent'
  es: 'Permite activar la función de ayuda al respeto de la distancia de seguridad (ARTIV) La función de ayuda al respeto de la distancia de seguridad ayuda al conductor a respetar las distancias de seguridad con el vehículo que le precede'
  de: 'Ermöglicht die Aktivierung der Funktion Fahrzeugabstandsassistent (ARTIV) Die Funktion Abstandsassistent hilft dem Fahrer bei der Einhaltung des Sicherheitsabstands zum vorausfahrenden Fahrzeug'
  pl: 'Pozwala aktywować funkcję pomocy w przestrzeganiu czasu odstępu pomiędzy pojazdami (ARTIV) Funkcja wspomagania przestrzegania czasów odstępu między pojazdami pomaga kierowcy w przestrzeganiu bezpiecznej odległości za pojazdem jadącym z przodu'
  hu: 'Lehetővé teszi a gépkocsik követési távolságának betartását segítő funkció (ARTIV) aktiválását A gépkocsik követési távolságának betartását segítő funkció segíti a gépjárművezetőt az előtte haladó gépjárműhöz képesti biztonságos távolság betartásában'
kind: 'config'
access: 'read-write'
length: 1
variants: ['T84_*', 'X6_*']

params:
  DISPLAY_ARTIV_FUNCTION:
    bits: '1.0'
    comment:
      en: 'Display with ARTIV function'
      fr: 'Affichage avec fonction ARTIV'
      es: 'Señalización con función ARTIV'
      de: 'Anzeige mit Funktion ARTIV'
      pl: 'Wyswietlanie z funkcja ARTIV'
      hu: 'Kijelzés a ARTIV funkcióval'
    type: 'bool'
    values:
      0x00:
        en: 'NO'
        fr: 'NON'
        es: 'NO'
        de: 'NEIN'
        pl: 'NIE'
        hu: 'NEM/NINCS'
      0x01:
        en: 'Yes'
        fr: 'Oui'
        es: 'Sí'
        de: 'Ja'
        pl: 'Tak'
        hu: 'Igen'

  RESERVED:
    bits: '1.7-1.1'
    unused: true

alternatives:
  - note:
      en: 'Layout seen on 4 other software variant(s)'
      fr: 'Format vu sur 4 autre(s) variante(s) logicielle(s)'
    variants: ['T84_*']
    access: 'read'
    length: 1
    params:
      DISPLAY_SAFETY_DISTANCE_FUNCTION_ARTIV:
        bits: '1.0'
        alt_names: ['DISPLAY_ARTIV_FUNCTION']
        comment:
          en: 'Display of the safety distance function (ARTIV)'
          fr: 'Affichage fonction d''aide au respect du temps intervéhicules (ARTIV)'
          es: 'Visualización de la función de ayuda con respecto del tiempo intervehículo (ARTIV)'
          de: 'Anzeige Funktion Fahrzeugabstands-Assistent (ARTIV)'
          pl: 'Wyświetlanie funkcji pomocy w przestrzeganiu czasów odstępu między samochodami (ARTIV)'
          hu: 'A gépkocsik követési távolságának betartását segítő funkció (ARTIV) kijelzése'
        type: 'bool'
        values:
          0x00:
            en: 'NO'
            fr: 'NON'
            es: 'NO'
            de: 'NEIN'
            pl: 'NIE'
            hu: 'NEM/NINCS'
          0x01:
            en: 'Yes'
            fr: 'Oui'
            es: 'Sí'
            de: 'Ja'
            pl: 'Tak'
            hu: 'Igen'
      RESERVED:
