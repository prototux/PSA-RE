  pl: 'Przy 0%, obraz jest rzutowany na wysokości minimalnej. Przy 100%, obraz jest rzutowany na wysokości maksymalnej.'
  hu: '0 %, a kép egy minimális magyasságban kerül kivetítésre. 100 %, a kép egy maximális magyasságban kerül kivetítésre.'
