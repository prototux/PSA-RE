lid: 0xC3
name: 'AMBIENT_BRIGHTNESS_LEVEL'
display_name:
  en: 'Ambient brightness level'
  fr: 'Niveau de luminosité ambiante'
  es: 'Nivel de luminosidad ambiente'
  de: 'Niveau der Umgebungshelligkeit'
  pl: 'Poziom jaskrawości oświetlenia otoczenia'
  hu: 'A környezeti fényerősség szintje'
comment:
  en: 'The ambient brightness is measured by a sensor located on the Heads Up Display unit. At 0%, the ambient brightness is zero. At 100%, the ambient brightness is maximum. If the tool displays "---", deal with fault "brightness sensor".'
  fr: 'La luminosité ambiante est mesurée par un capteur placé sur le boîtier de Vision Tête Haute. A 0%, la luminosité ambiante est nulle. A 100%, la luminosité ambiante est maximale. Si l''outil affiche " --- ", traiter le défaut " capteur de luminosité ".'
  es: 'La luz ambiente se mide por un captador colocado en la caja de Visión Cabeza Alta. A un 0%, la luz ambiente es nula. A un 100%, la luz ambiente es máxima. Si el útil indica "---", tratar el defecto "captador de luminosidad".'
  de: 'Die Umgebungshelligkeit wird durch einen Sensor am Steuerteil Head-Up-Display gemessen. Bei 0% ist die Umgebungshelligkeit gleich Null. Bei 100% ist die Umgebungshelligkeit maximal. Wenn die Station "---" anzeigt, den Fehler "Helligkeitssensor" behandeln.'
  pl: 'Jaskrawość oświetlenia otoczenia jest mierzona przez czujnik umieszczony na module wyświetlania na szybie (HUD). Przy 0%, jaskrawość oświetlenia otoczenia jest zerowa. Przy 100%, jaskrawość oświetlenia otoczenia jest maksymalna. Jeżeli przyrząd wyświetla " --- ", zająć się usterką "czujnik jaskrawości oświetlenia".'
  hu: 'A környezo megvilágítás fényerosségét a fejmagasság látvány elektronikán elhelyeztt érzékelo méri. 0 %, a környezo megvilágítás fényerossége nulla. 100 %, a környezo megvilágítás fényerossége maximális. Ha a műszer " --- " kijelzést mutat, akkor kezelje a " fényerosség érzékelo " hibát.'
kind: 'live'
access: 'read'
length: 1
variants: ['X6_*']

params:
  AMBIENT_BRIGHTNESS_LEVEL:
    bits: '1.7-1.0'
    comment:
      en: 'Ambient brightness level'
      fr: 'Niveau de luminosité ambiante'
      es: 'Nivel de luminosidad ambiente'
      de: 'Niveau der Umgebungshelligkeit'
      pl: 'Poziom jaskrawości oświetlenia otoczenia'
      hu: 'A környezeti fényerősség szintje'
    type: 'enum'
