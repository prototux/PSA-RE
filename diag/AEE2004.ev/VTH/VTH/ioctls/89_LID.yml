ioctl: 0x89
name: 'BRIGHTNESS_CONTROL_DISPLAY_STRIP'
display_name:
  en: 'Brightness control for the display strip'
  fr: 'Pilotage de l''intensité de la lame d''affichage'
  es: 'Pilotaje de la intensidad de la lámina de visualización'
  de: 'Steuerung der Helligkeit der Anzeige'
  pl: 'Pilotowanie jasności listwy wyświetlania'
  hu: 'A kijelzőlap fényerejének vezérlése'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants: ['T84_*', 'X6_*']

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

  TALCD:
    bits: '2.7-2.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Brightness control for the display strip'
      fr: 'Pilotage de l''intensité de la lame d''affichage'
      es: 'Pilotaje de la intensidad de la lámina de visualización'
      de: 'Steuerung der Helligkeit der Anzeige'
      pl: 'Pilotowanie jasności listwy wyświetlania'
      hu: 'A kijelzőlap fényerejének vezérlése'
    max_duration_ms: 2000
  - display_name:
      en: 'Intensity of the display'
      fr: 'Intensité de l''affichage'
      es: 'Intensidad de la visualización'
      de: 'Intensität der Anzeige'
      pl: 'Jaskrawość wyświetlacza'
      hu: 'A kijelzés erőssége'
    max_duration_ms: 4000
