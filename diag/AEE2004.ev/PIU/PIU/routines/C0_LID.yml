routine: 0xC0
name: 'HIGH_SPEED_FAN_UNIT'
display_name:
  en: 'High speed fan unit'
  fr: 'Groupe motoventilateur grande vitesse'
  es: 'Grupo motoventilador gran velocidad'
  de: 'Kühlerlüftereinheit hohe Drehzahl'
  pl: 'Zespół wentylatora chłodnicy dużej predkości'
  hu: 'Hűtőventilátor egység nagy sebességfokozata'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

  ACTIVATION_RELAY_COOLING_FAN_GRANDE:
    bits: '2.7-2.0'
    type: 'uint'
    default: 0x11

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'High speed fan unit'
      fr: 'Groupe motoventilateur grande vitesse'
      es: 'Grupo motoventilador gran velocidad'
      de: 'Kühlerlüftereinheit hohe Drehzahl'
      pl: 'Zespół wentylatora chłodnicy dużej predkości'
      hu: 'Hűtőventilátor egység nagy sebességfokozata'
    max_duration_ms: 4000
  - display_name:
      en: 'Low speed fan unit'
      fr: 'Groupe motoventilateur petite vitesse'
      es: 'Grupo motoventilador pequeña velocidad'
      de: 'Kühlerlüftereinheit niedrige Drehzahl'
      pl: 'Zespół wentylatora chłodnicy małej prędkości'
      hu: 'Motorhűtőventilátor-egység kis sebességfokozat'
    max_duration_ms: 3000
