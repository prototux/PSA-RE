node: 'PIU'
model: 'PIU'
display_name:
  en: 'Power interface unit (electric drive) (PIU)'
  fr: 'Interface de puissance (traction electrique) (PIU)'
protocols: ['KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'KWP-PSA2000'
    request_id: 0x6A8
    response_id: 0x688
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'KWP-PSA2000'
    request_id: 0x6A8
    response_id: 0x688

resets:
  0x91:
    en: 'Reset 0x91'
    fr: 'Réinitialisation 0x91'
  0xB0:
    en: 'Reset 0xB0'
    fr: 'Réinitialisation 0xB0'
  0xFF:
    en: 'Reset 0xFF'
    fr: 'Réinitialisation 0xFF'

services: [0x11, 0x14, 0x17, 0x21, 0x27, 0x31, 0x34, 0x3E, 0x81, 0x82]

security_access:
  - level: 0x83

tester_present:
  request: '3E'
  period_ms: 1000

identification:
  request: '21 FE'
  part_number: '22.7-24.0'
  comment:
    en: 'The ECU part number is in data bytes 22 to 24 of the answer to 21 FE (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 22 à 24 de la réponse à 21 FE (DCB), elle donne la variante logicielle'

