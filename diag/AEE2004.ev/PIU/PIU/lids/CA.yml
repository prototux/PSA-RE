      pl: 'Błąd sygnału ograniczenia prędkości'
      hu: 'Sebességkorlátozás jel hiba'
    type: 'enum'
    values:
      0x00:
        en: 'No faults'
        fr: 'Pas de défauts'
        es: 'No hay defectos'
        de: 'Keine Fehler'
        pl: 'Brak usterek'
        hu: 'Nincs hiba'
      0x01:
        en: 'Faults present'
        fr: 'Défauts présents'
        es: 'Defectos presentes'
        de: 'Vorliegende Fehler'
        pl: 'Obecne błędy'
        hu: 'Jelenlévő hibák'

  SPEED_LIMITER_ACTIVATION_REQUEST:
    bits: '9.7-9.0'
    comment:
      en: 'Speed limiter activation request'
      fr: 'Demande d''activation de la limitation de vitesse'
