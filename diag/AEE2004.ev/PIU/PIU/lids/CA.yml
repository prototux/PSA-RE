      hu: 'Sebességkorlátozás aktiválási kérés'
    type: 'enum'
    values:
      0x00:
        en: 'No activation request'
        fr: 'Pas de demande d''activation'
        es: 'No hay petición de activación'
        de: 'Keine Aktivierungsanforderung'
        pl: 'Brak żądania włączenia'
        hu: 'Nincs aktiválási kérés'
      0x01:
        en: 'Activation request'
        fr: 'Demande d''activation'
        es: 'Petición de activación'
        de: 'Anforderung Aktivierung'
        pl: 'Żądanie włączenia'
        hu: 'Aktiválás kérelem'
