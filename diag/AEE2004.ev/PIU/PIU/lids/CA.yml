    comment:
      en: 'Speed limiter status'
      fr: 'Etat limitation vitesse véhicule'
      es: 'Estado de limitación de velocidad vehículo'
      de: 'Zustand Fahrzeuggeschwindigkeitsbegrenzung'
      pl: 'Stan ograniczenia predkosci pojazdu'
      hu: 'Jármű sebesség korlátozás állapota'
    type: 'enum'
    values:
      0x00:
        en: 'On standby'
        fr: 'En attente'
        es: 'En espera'
        de: 'In Wartestellung'
        pl: 'W stanie oczekiwania'
        hu: 'Várakozásban'
      0x01:
        en: 'Status resumed'
        fr: 'Etat repris'
        es: 'Estado aceleración'
        de: 'Zustand wieder eingenommen'
        pl: 'Stan przywrócony'
        hu: 'Átvett állapot'
      0x10:
        en: 'Status active'
        fr: 'Etat actif'
        es: 'Estado activo'
        de: 'Zustand aktiviert'
        pl: 'Stan aktywny'
        hu: 'Bekapcsolt állapot'
      0x11:
        en: 'Inhibited status'
        fr: 'Etat inhibé'
        es: 'Estado inhibido'
        de: 'Zustand deaktiviert'
        pl: 'Stan nieaktywny'
        hu: 'Tiltott állapot'

  SPEED_LIMITER_SIGNAL_FAULT:
    bits: '8.7-8.0'
    comment:
      en: 'Speed limiter signal fault'
      fr: 'Défaut signal limitation de vitesse'
      es: 'Defecto señal limitación de velocidad'
