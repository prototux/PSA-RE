did: 0xD909
name: 'PERCENTAGE_DAMAGE_PISTON_RESULTING_SELF_IGNITION'
display_name:
  en: 'Percentage of damage to the piston resulting from self-ignition before spark (Rumble)'
  fr: 'Pourcentage d''endommagement du piston suite à auto-allumage avant étincelle (Rumble)'
  es: 'Porcentaje de deterioro del pistón debido al autoencendido antes de la chispa (Rumble)'
  de: 'Prozentsatz Beschädigung des Kolbens infolge von Fehlzündungen (vor Funken) (Rumble)'
  pl: 'Procentowa wartość uszkodzenia tłoka w wyniku samozapłonu przed iskrą (dudnienia)'
  hu: 'A szikra előtti öngyulladást (kopogás) követően a dugattyú károsodásának százalékos értéke'
comment:
  en: 'This parameter makes it possible to estimate the risk of short-term engine failure. This parameter corresponds to the damage to the cylinder piston which has had the most self-ignitions before spark (Rumble). 50% : At least one piston has reached its maximum allowable number of self-ignitions before spark (Rumble). 100% : At least one piston has reached 2 time(s) its maximum allowable number of self-ignitions before spark (Rumble).'
  fr: 'Ce paramètre permet d''estimer le risque de casse moteur à court terme. Ce paramètre correspond à l''endommagement du piston du cylindre qui a eu le plus d''auto-allumage avant étincelle (Rumble). 50% : Un piston au moins a atteint son nombre maximal admissible d''auto-allumage avant étincelle (Rumble). 100% : Un piston au moins a atteint 2 fois son nombre maximal admissible d''auto-allumage avant étincelle (Rumble).'
  es: 'Este parámetro permite estimar el riesgo de rotura del motor a corto plazo. Este parámetro corresponde al deterioro del pistón del cilindro que ha tenido mayor encendido automático antes de la chispa (Rumble). 50% : Al menos un pistón ha alcanzado su número máximo admisible de encendidos automáticos antes de la chispa (Rumble). 100% : Un pistón al menos ha alcanzado 2 veces su número máximo admisible de autoencendidos antes de la chispa (Rumble).'
  de: 'Dieser Parameter dient zur Schätzung der Gefahr eines kurzfristigen Motorschadens. Dieser Parameter entspricht der Beschädigung des Kolbens des Zylinders mit den meisten Selbstzündungen vor Funken (Rumble). 50% : Mindestens ein Kolben hat seine höchstzulässige Anzahl von Selbstzündungen vor Funken erreicht (Rumble). 100% : Ein Kolben hat mindestens 2 mal seine höchstzulässige Anzahl von Selbstzündungen vor Funken (Rumble) erreicht.'
  pl: 'Ten parametr umożliwia oszacowanie ryzyka uszkodzenia silnika w krótkim terminie. Ten parametr odpowiada uszkodzeniu tłoka cylindra, który miał najwięcej samozapłonów przed iskrą (stukanie). 50% : Co najmniej jeden cylinder osiągnął maksymalną dopuszczalną liczbę samozapłonów przed iskrą (dudnienia). 100% : Co najmniej jeden tłok osiągnął 2 raz maksymalną liczbę samozapłonów przed iskrą (dudnienia).'
  hu: 'Ez a paraméter lehetővé teszi a motor rövid időn belüli rongálódása kockázatának megbecslését. Ez a paraméter megfelel annak a hengernek a dugattyúsérüléséhez, amelyben a szikra előtti öngyulladás (kopogás) történt. 50% : Legalább egy dugattyú elérte a szikra előtti öngyulladások (kopogás) megengedett maximális számát. 100% : Legalább egy dugattyú elérte a szikra előtti öngyulladások (kopogás) 2 számát.'
