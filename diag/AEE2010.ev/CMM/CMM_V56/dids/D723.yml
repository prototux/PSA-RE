comment:
  en: 'The parameter only changes to the status "Present" if the following conditions are met : press the brake pedal driver''s door closed Seat belt fastening'
  fr: 'Le paramètre passe à l''état "présent" uniquement si les conditions suivantes sont respectées : appuyer sur la pédale de frein porte conducteur fermée Bouclage de ceinture'
  es: 'El parámetro pasa a estado "presente" solo si se cumplen las siguientes condiciones : pisar el pedal de freno puerta conductor cerrada Abrochado del cinturón'
  de: 'Der Parameter wechselt nur auf den Zustand "vorhanden", wenn die folgenden Bedingungen erfüllt sind : Bremspedal drücken Fahrertür geschlossen Schließen Sicherheitsgurt'
  pl: 'Parametr zmienia stan na "obecny" wyłącznie, gdy następujące warunki są spełnione : nacisnąć na pedał hamulca drzwi kierowcy zamknięte Zapięcie pasa bezpieczeństwa'
  hu: 'A paraméter csupán akkor tér át "jelenlévő" állapotba ha a következő feltételek betartásra kerülnek : nyomja le a fékpedált zárt vezetőajtó Öv becsatolása'
