  CAUSES_FAILURE_SECOND_ENGINE_RESTART:
    bits: '92.3-92.0'
    comment:
      en: 'Causes of failure of the second engine restart'
      fr: 'Causes d''échec du second redémarrage moteur'
      es: 'Causas de fallo del segundo rearranque motor'
      de: 'Ursachen für das Scheitern des zweiten Neustarts des Motors'
      pl: 'Przyczyny drugiego nieudanego ponownego rozruchu silnika'
      hu: 'Motor újraindítás második sikertelenségének okai'
    type: 'enum'
    values:
      0x00:
        en: 'No cause of failure of the second restart of the engine detected'
        fr: 'Pas de cause d''échec du second redémarrage du moteur détectée'
        es: 'Sin causa de fallo del segundo rearranque del motor detectada'
        de: 'Keine Ursache für das Scheitern des zweiten Neustarts des Motors erkannt'
        pl: 'Brak wykrycia przyczyny nieudanego drugiego rozruchu silnika'
        hu: 'Nincs észlelt oka a motor második sikertelen indításának'
      0x01:
        en: 'Failure of restarting on closing of the drive train'
        fr: 'Echec de redémarrage sur la fermeture de la chaîne de traction'
        es: 'Fallo de rearranque en el cierre de la cadena de tracción'
        de: 'Scheitern des Neustarts bei Schließen des Antriebsstrangs'
        pl: 'Nieudany ponowny rozruch przy zamknięciu łańcucha trakcji'
        hu: 'Újraindítás sikertelensége a hajtáslánc zárásával kapcsolatosan'
      0x02:
        en: 'Failure of restarting of the engine due to excessive duration of restarting'
        fr: 'Echec de redémarrage du moteur car temps de redémarrage trop long'
        es: 'Fallo de rearranque del motor porque el tiempo de rearranque es demasiado largo'
        de: 'Scheitern des Neustarts des Motors, da Zeit zum Neustart zu lang'
        pl: 'Nieudany ponowny rozruch silnika ponieważ czas ponownego rozruchu za długi'
        hu: 'Motor újraindítás sikertelensége mivel az újraindítási idő túlságosan hosszú'
      0x03:
        en: 'Failure of restarting on closing of the drive train, Failure of restarting of the engine due to excessive duration of restarting'
        fr: 'Echec de redémarrage sur la fermeture de la chaîne de traction, Echec de redémarrage du moteur car temps de redémarrage trop long'
        es: 'Fallo de rearranque en el cierre de la cadena de tracción, Fallo de rearranque del motor porque el tiempo de rearranque es demasiado largo'
        de: 'Scheitern des Neustarts bei Schließen des Antriebsstrangs, Scheitern des Neustarts des Motors, da Zeit zum Neustart zu lang'
        pl: 'Nieudany ponowny rozruch przy zamknięciu łańcucha trakcji, Nieudany ponowny rozruch silnika ponieważ czas ponownego rozruchu za długi'
        hu: 'Újraindítás sikertelensége a hajtáslánc zárásával kapcsolatosan, Motor újraindítás sikertelensége mivel az újraindítási idő túlságosan hosszú'
      0x04:
        en: 'Failure of restarting following inhibiting of the ECUs of the electromotor sub-assembly (electric management)'
        fr: 'Echec de redémarrage suite à l''interdiction des calculateurs de sous-ensemble électromoteur (gestion électrique)'
        es: 'Fallo de rearranque tras prohibición de los calculadores del subconjunto electromotor (gestión eléctrica)'
        de: 'Scheitern des Neustarts nach der Deaktivierung der Steuergeräte der Untergruppe Elektromotor (elektrische Steuerung)'
        pl: 'Nieudany ponowny rozruch na skutek zakazu kalkulatorów podzespołu silnika elektrycznego (zarządzanie elektryczne)'
        hu: 'Újraindítás sikertelensége a villamosmotor (elektromos vezérlés)alegység computereinek letiltását követően'
      0x05:
        en: 'Failure of restarting following inhibiting of the ECUs of the electromotor sub-assembly (electric management), Failure of restarting on closing of the drive train'
        fr: 'Echec de redémarrage suite à l''interdiction des calculateurs de sous-ensemble électromoteur (gestion électrique), Echec de redémarrage sur la fermeture de la chaîne de traction'
        es: 'Fallo de rearranque tras prohibición de los calculadores del subconjunto electromotor (gestión eléctrica), Fallo de rearranque en el cierre de la cadena de tracción'
        de: 'Scheitern des Neustarts nach der Deaktivierung der Steuergeräte der Untergruppe Elektromotor (elektrische Steuerung), Scheitern des Neustarts bei Schließen des Antriebsstrangs'
        pl: 'Nieudany ponowny rozruch na skutek zakazu kalkulatorów podzespołu silnika elektrycznego (zarządzanie elektryczne), Nieudany ponowny rozruch przy zamknięciu łańcucha trakcji'
