        fr: 'Valeur invalide'
        es: 'Valor no válido'
        de: 'Ungültiger Wert'
        pl: 'Wartość nieprawidłowa'
        hu: 'Érvénytelen érték'

  OIL_LEVEL:
    bits: '14.7-15.0'
    comment:
      en: 'Oil level'
      fr: 'Niveau d''huile'
