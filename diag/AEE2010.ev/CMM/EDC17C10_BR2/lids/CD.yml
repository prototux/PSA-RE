lid: 0xCD
name: 'LID_CD'
display_name:
  en: 'Data record 0xCD (8 values)'
  fr: 'Enregistrement 0xCD (8 valeurs)'
kind: 'live'
access: 'read'
length: 15

params:
  ENGINE_SPEED:
    bits: '1.7-2.0'
    comment:
      en: 'Engine speed'
      fr: 'Régime moteur'
