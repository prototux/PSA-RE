routine: 0xB7
name: 'MOVEMENT_VARIABLE_RESISTANCE_TURBOCHARGER'
display_name:
  en: 'Movement of the variable resistance of the turbocharger'
  fr: 'Déplacement de la géométrie variable du turbocompresseur'
  es: 'Desplazamiento de la geometría variable del turbocompresor'
  de: 'Verschiebung der variablen Geometrie des Turboladers'
  pl: 'Przesunięcie geometrii zmiennej turbosprężarki'
  hu: 'A turbókompresszor változó geometria elmozdulása'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  INPUT_PARAM:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x00

  RESERVED:
    bits: '2.7-2.0'
    unused: true

  CYLINDRE:
    bits: '3.7-3.0'
    type: 'enum'
    default: 0xFF

  OPTION:
    bits: '4.7-4.0'
    type: 'enum'
    default: 0x00

results:
  TEST_REPORT:
    bits: '1.7-1.0'
    alt_names: ['TEST_REPORT_2']
    comment:
      en: 'Test report'
      fr: 'Compte-rendu du test'
      es: 'Informe del test'
      de: 'Testbericht'
      pl: 'Sprawozdanie z testu'
      hu: 'A teszt összefoglalása'
    type: 'enum'
    values:
      0x00:
        en: 'Test not started'
        fr: 'Test non lancé'
        es: 'Test no lanzado'
        de: 'Test nicht gestartet'
        pl: 'Test nie rozpoczęty'
        hu: 'A teszt nem került elindításra'
      0x02:
        en: 'Test complete'
        fr: 'Test terminé'
        es: 'Test terminado'
        de: 'Test beendet'
        pl: 'Test zakończony'
        hu: 'Teszt befejezve'
      0x04:
        en: 'Test completed with error'
        fr: 'Test terminé avec erreur'
        es: 'Test finalizado con error'
        de: 'Test mit Fehler beendet'
        pl: 'Test zakończony z błędem'
        hu: 'Hibával befejeződött teszt'
      0x11:
        en: 'Test stopped by the operator'
        fr: 'Test arrêté par l''opérateur'
        es: 'Test detenido por el operario'
        de: 'Test vom Benutzer abgebrochen'
        pl: 'Test zatrzymany przez operatora'
        hu: 'A beavatkozást végzo személy általi teszt-leállítás'

  RESERVED:
    bits: '2.7-2.0'
    unused: true

tests:
  - display_name:
      en: 'Movement of the variable resistance of the turbocharger'
      fr: 'Déplacement de la géométrie variable du turbocompresseur'
      es: 'Desplazamiento de la geometría variable del turbocompresor'
      de: 'Verschiebung der variablen Geometrie des Turboladers'
      pl: 'Przesunięcie geometrii zmiennej turbosprężarki'
      hu: 'A turbókompresszor változó geometria elmozdulása'
  - display_name:
      en: 'Test of the EGR exchanger bypass'
      fr: 'Test du bypass de l''échangeur EGR'
      es: 'Test del by-pass intercambiador EGR'
      de: 'Test des Bypass Wärmetauscher Abgasrückführung'
      pl: 'Test by-passu wymiennika EGR'
      hu: 'EGR hőcserélő bypass teszt'
  - display_name:
      en: 'Checking the pressurisation of the air entering the engine'
      fr: 'Contrôle de la mise en pression de l''air en entrée moteur'
      es: 'Control de la puesta a presión del aire en la entrada motor'
      de: 'Kontrolle der Unterdrucksetzung der Luft am Motoreingang'
      pl: 'Kontrola sprężenia powietrza na wlocie silnika'
