comment:
  en: 'Open loop: the ECU does not regulate the mixture Closed loop: the ECU regulates the mixture with the engine warm and without injection cut-off, the mixture regulation is always active'
  fr: 'Boucle ouverte : le calculateur ne régule pas la richesse Boucle fermée : le calculateur régule la richesse moteur chaud et sans coupure d''injection, la régulation de richesse est toujours active'
  es: 'Bucle abierto : el calculador no regula la riqueza Bucle cerrado : el calculador regula la riqueza motor caliente y sin corte de inyección, la regulación de riqueza está siempre activa'
  de: 'Offener Kreis: das Steuergerät regelt nicht das Gemisch geschlossener Regelkreis: das Steuergerät regelt das Gemisch bei warmem Motor und ohne Einspritzungs-Abschaltung ist die Gemischregelung weiterhin aktiv'
  pl: 'Sterowanie w układzie otwartym: kalkulator nie reguluje składu mieszanki Obwód zamknięty: kalkulator reguluje skład mieszanki przy gorącym silniku i bez odcięcia wtrysku, regulacja składu mieszanki jest ciągle aktywna'
  hu: 'Nyitott hurok: a computer nem szabályozza a keveréket Zárt hurok : a computer szabályozza a dúsítást meleg motornál és befecskendezés-megszakítás nélkül, a keverékszabályozás mindig aktív'
