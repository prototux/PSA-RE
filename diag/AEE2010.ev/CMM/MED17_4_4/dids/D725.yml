did: 0xD725
name: 'STATUS_STOP_AND_START_FUNCTION'
display_name:
  en: 'Status of the "Stop and Start" function'
  fr: 'Etat de la fonction Stop and Start'
  es: 'Estado de la function "Stop and Start'
  de: 'Zustand der Funktion « STOP & START »'
  pl: 'Stan funkcji "Stop and Start'
  hu: 'A "Stop and Start" funkció állapota'
comment:
  en: 'The possible statuses of this parameter are : Engine switched off / stalled : - or with the ignition on (awaiting starting by the user) - or with the ignition off (after driving: removal of the user''s key) - either after stalling due to the user Waiting for switch-off : one of the systems is not authorising the automatic cutting of the engine starting : starting or starter motor in operation (with a starting switch or a mechanical key) stop : phase between engine running and effectively stopped the engine stopped : engine not running following an automatic stop restarting : automatic restarting in progress (by the alternator) Alternator load reduction : in this phase no torque is taken on the engine alternator : battery charging phase Power accumulator discharge : automatic partial discharge of the power accumulator to preserve the lifespan of the accumulator. Discharge is by a few mV. Precharging of the power accumulator : this phase takes place after each opening of a door'
  fr: 'Les états possibles de ce paramètre sont : Moteur coupé / calé : - soit contact mis (en attente de démarrage par l''utilisateur) - soit sans contact (après roulage : retrait de la clé de l''utilisateur) - soit après calage dû à l''utilisateur Attente coupure : un des systèmes n''autorise pas la coupure moteur automatique démarrage : démarrage au démarreur en cours (avec un commutateur de démarrage ou une clé mécanique) stop : phase entre le moteur tournant et l''arrêt effectif moteur arrêté : moteur non tournant suite à un arrêt automatique redémarrage : redémarrage automatique en cours (par l''alternateur) Délestage alternateur : dans cette phase aucun couple n''est prélevé sur le moteur alternateur : phase de recharge de la batterie Décharge accumulateur d''énergie : décharge partielle automatique de l''accumulateur d''énergie pour préserver la durée de vie de l''accumulateur. La décharge est de quelques mV. Précharge accumulateur d''énergie : cette phase intervient après chaque ouverture de porte'
  es: 'Los estados posibles de este parámetro son : Motor cortado/calado : - con el contacto puesto (en espera de un arranque por el usuario) - sin contacto (después de circular: retirada de la llave por el usuario) - después de un calado debido al usuario Espera Corte : uno de los sistemas no autoriza el corte del motor automático arranque : arranque con el motor de arranque en curso (con un conmutador de arranque o una llave mecánica) stop : fase entre el motor en marcha y la parada efectiva motor parado : motor no está en marcha debido a una parada automática arranque : rearranque automático en curso (por el alternador) Corte de alimentación del alternador : en esta fase, no se ha retenido ningún par en el motor alternador : fase de recarga de la batería Descarga acumulador de energía : descarga parcial automática del acumulador de energía para preservar la vida útil del acumulador. La descarga es de algunos mV. Precarga acumulador de energía : esta fase interviene después de cada apertura de la puerta'
  de: 'Die möglichen Zustände dieses Parameters sind : Motor abgestellt / abgestorben : - bei eingeschalteter Zündung (in Erwartung des Anlassens durch den Benutzer) - ohne Zündung (nach der Fahrt: Abziehen des Schlüssels des Benutzers) - nach Absterben verursacht durch den Benutzer Warten Ausschalten : eines der Systeme gibt das automatische Abstellen des Motors nicht frei Anlassen : Starten mit Anlasser im Gang (mit einem Anlassschalter oder einem mechanischen Schlüssel) Stop : Phase zwischen laufendem Motor und effektivem Abstellen abgestellter Motor : Motor läuft nicht nach einem automatischen Abstellen wieder anlassen : automatisches Neustarten im Gang (durch den Generator) Entlastung Generator : in dieser Phase wird kein Drehmoment am Motor entnommen Generator : Phase Aufladen der Batterie Entladung Energiespeicher : teilweise automatische Entladung des Energiespeichers, um die Lebensdauer des Speichers zu erhalten. Die Entladung beträgt einige mV. Vorladung Energiespeicher : diese Phase erfolgt nach jedem Öffnen der Tür'
  pl: 'Możliwe stany tego parametru to : Silnik wyłączony / zgaszony : - albo przy włączonym zapłonie (oczekiwanie uruchomienia przez użytkownika) - albo bez włączonego zapłonu (po jeździe: wyjęcie kluczyka użytkownika) - albo po zatrzymaniu przez użytkownika Oczekiwanie Odcięcia : jeden z systemów nie zezwala na automatyczne wyłączenie silnika rozruch : rozruch rozrusznikiem w trakcie (z przełącznikiem rozruchowym albo kluczem mechanicznym) stop : faza pomiędzy pracą silnika i faktycznym zatrzymaniem przy wyłączonym silniku : silnik nie pracuje w następstwie automatycznego zatrzymania ponowny rozruch : ponowny automatyczny rozruch w trakcie (przez alternator) Odciążenie alternatora : w tej fazie żaden moment obrotowy nie jest pobierany od silnika alternator : faza ładowania akumulatora Rozładowanie akumulatora energii : częściowe automatyczne rozładowanie akumulatora energii w celu zachowania okresu trwałości akumulatora. Wyładowanie wynosi kilka mV. Wstępne ładowanie akumulatora energii : ta faza występuje po każdym otwarciu drzwi'
  hu: 'Ezen paraméter lehetséges állapotai : Lekapcsolt/ lefulladt motor : - akár gyújtás ráadásakor (a felhasználó általi indításra várva) - akár gyújtás ráadása nélkül (gurulás után: a felhasználó kiveszi a kulcsot) - akár a felhasználó miatti lefulladás után Várakozás lekapcsolásra : a rendszerek egyike nem engedélyezi a motor automatikus lekapcsolását indítás : indítómotorral történő indítás folyamatban (egy indításkapcsolóval vagy egy mechanikus kulccsal) Stop : a járó motor és az álló motor közötti valós fázis álló motor : motor nem jár egy automatikus leállást követően újraindítás : automatikus újraindítás folyamatban (generátor által) Generátor tehermentesítése : ebben a fázisban semmilyen nyomatékot nem vett fel a motor generátor : az akkumulátor újratöltési fázisa Energiatároló lemerülése : az energiatároló automatikus részleges tehermentesítése az akkumulátor élettartamának megőrzése érdekében. A lemerülés néhány mV. Energiatároló előtöltése : ezen fázis minden ajtónyitás után avatkozik be'
