name: 'MEASURED_AIR_QUANTITY_CORRECTED'
display_name:
  en: 'Measured air quantity corrected'
  fr: 'Remplissage mesuré corrigé'
  es: 'Llenado medido corregido'
  de: 'Korrigierte gemessene Befüllung'
  pl: 'Skorygowane mierzone napełnianie'
  hu: 'Korrigált mért feltöltés'
comment:
  en: 'The measured filling is calculated in relation to the measured manifold pressure when the engine is running, the value measured should always be close to the reference value.'
  fr: 'Le remplissage mesuré est calculé en fonction de la pression collecteur mesurée moteur tournant, la valeur mesurée doit toujours être proche de la valeur de consigne.'
  es: 'El llenado medido se calcula en función de la presión colector medido motor en marcha, el valor medido debe estar siempre próximo al valor de consigna.'
  de: 'Die gemessene Füllung wird berechnet in Abhängigkeit vom gemessenen Saugrohrdruck bei laufendem Motor muss der gemessene Wert immer im Bereich des Sollwerts liegen.'
  pl: 'Zmierzone napełnienie obliczone jest w zależności od ciśnienia zmierzonego w kolektorze przy pracującym silniku zmierzona wartość powinna być zawsze bliska wartości zadanej.'
  hu: 'A mért feltöltés a gyűjtőcső mért nyomásának függvényében kerül kiszámításra járó motornál, a mért értéknek az előírt értékéhez közelinek kell lennie.'
