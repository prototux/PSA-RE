  hu: 'Az etanol-érzékelő jelének 50 Hz-es frekvenciája az etanol 0 %-os koncentrátumnak felel meg a tüzelőanyagban. Az etanol-érzékelő jelének 150 Hz-es frekvenciája az etanol 100 %-os koncentrátumnak felel meg a tüzelőanyagban.'
