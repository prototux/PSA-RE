did: 0xD43C
name: 'REVERSE_GEAR_ENGAGED'
display_name:
  en: 'Reverse gear engaged'
  fr: 'Marche arrière engagée'
  es: 'Marcha atrás seleccionada'
  de: 'Rückwärtsgang eingelegt'
  pl: 'Wsteczny bieg włączony'
  hu: 'Bekapcsolt hátramenet fokozat'
comment:
  en: 'On vehicles with a manual gearbox, the information originates from the built-in systems interface On vehicles with automatic gearboxes the information comes from the gearbox ECU On vehicles with piloted gearboxes the information comes from the gearbox ECU.'
  fr: 'Sur les véhicules avec boîtes de vitesses manuelles l''information provient du boîtier de servitude intelligent Sur les véhicules avec boîtes de vitesses automatiques l''information provient du calculateur de boîte vitesses Sur les véhicules avec boîtes de vitesses pilotées l''information provient du calculateur de boîte de vitesses.'
  es: 'En los vehículos con cajas de velocidades manuales la información procede de la caja de servicio inteligente En los vehículos con caja de velocidades automática, la información proviene del calculador de caja de velocidades En los vehículos con caja de velocidades pilotada, la información proviene del calculador de caja de velocidades.'
  de: 'Bei den Fahrzeugen mit Schaltgetrieben kommt die Information von der Zentralschalteinheit Bei den Fahrzeugen mit Automatikgetriebe kommt die Information vom Getriebesteuergerät Bei den Fahrzeugen mit automatisiertem Schaltgetriebe kommt die Information vom Getriebesteuergerät.'
  pl: 'W pojazdach z mechanicznymi skrzyniami biegów informacja pochodzi od inteligentnego modułu sterującego W pojazdach z automatyczną skrzynią biegów informacja pochodzi od kalkulatora skrzyni biegów W pojazdach ze sterowaną skrzynią biegów informacja pochodzi od kalkulatora skrzyni biegów.'
  hu: 'A mechanikus sebességváltóval felszerelt gépjárműveken az információ az intelligens kiszolgálóegységtől származik Automata sebességváltóval felszerelt gépjárműveken az információ a sebességváltó computertől származik Vezérelt mechanikus sebességváltóval felszerelt gépjárműveken az információ a sebességváltó computertől származik.'
kind: 'live'
access: 'read'
length: 1

