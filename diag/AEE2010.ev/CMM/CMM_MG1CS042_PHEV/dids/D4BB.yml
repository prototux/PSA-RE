  de: 'Bei normaler Funktion erfolgt die Regulierung im offenen Kreis, da der Wechsel zum geschlossenen Kreis nur unter sehr speziellen Bedingungen erfolgt'
  pl: 'W warunkach normalnego dzialania, regulacja zachodzi w pętli otwartej ponieważ przejście do pętli zamkniętej ma miejsce tylko w bardzo szczególnych warunkach'
  hu: 'Normál működés esetén a szabályozás nyitott körrel működik, mert a zárt körré való átváltásra csak nagyon különleges körülmények között kerül sor'
