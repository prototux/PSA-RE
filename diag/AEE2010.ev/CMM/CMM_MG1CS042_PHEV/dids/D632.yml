did: 0xD632
name: 'LIMP_HOME_2_POSITION_PROGRAMMING_VALUE'
display_name:
  en: 'Limp-Home 2 position programming value'
  fr: 'Valeur d''apprentissage de la position Limp-Home 2'
  es: 'Valor de aprendizaje de la posición Limp-Home 2'
  de: 'Wert der Einspeicherung der Position Limp-Home 2'
  pl: 'Wartosc uczenia polozenia Limp-Home 2'
  hu: 'A 2 Limp-Home pozíció tanulási értékei'
comment:
  en: 'Corresponds to track 2 of the sensor the ECU must reprogram the minimum and maximum values periodically to take ageing phenomena into account if parts are replaced, the values must be reprogrammed in order to take into account the tolerance of the components'
  fr: 'Correspond à la piste 2 du capteur le calculateur doit réapprendre les valeurs minimum et maximum périodiquement pour prendre en compte des phénomènes de vieillissement en cas de changement de pièce les valeurs doivent être réapprises pour prendre en compte la tolérance des composants'
  es: 'Corresponde a la pista 2 del captador el calculador debe volver a aprender los valores mínimos y máximos periódicamente para tomar en cuenta los fenómenos de envejecimiento en cado de cambio de pieza los valores deben volver a memorizarse para tener en cuenta la tolerancia de los componentes'
  de: 'Entspricht der Bahn 2 des Sensors das Steuergerät muss die Mindest- und Maximalwerte periodisch neu einspeichern, um die Alterungsphänomene zu berücksichtigen beim Austausch des Teils müssen die Werte neu eingespeichert werden, um die Toleranz der Bauteile zu berücksichtigen'
  pl: 'Odpowiada ścieżce 2 czujnika kalkulator powinien okresowo uczyć się wartości minimum i maksimum tak, aby móc uwzgledniać zjawiska starzenia w przypadku wymiany części, wartości powinny być ponownie nauczone aby uwzględnić tolerancje komponentów'
  hu: 'Az érzékelő 2 pályájának felel meg A számítóegységnek periódikusan újra meg kell tanulnia a minimális és maximális értékeket, hogy figyelembe veheto legyenek az öregedési jelenségek alkatrészcsere esetén az értékeket újból meg kell ismertetni, az alkotóelemek türésének figyelembevétele érdekében'
kind: 'live'
access: 'read'
length: 2

