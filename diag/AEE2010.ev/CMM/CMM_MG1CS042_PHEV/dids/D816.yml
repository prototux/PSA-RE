name: 'CURRENT_TRACTION_BATTERY'
display_name:
  en: 'Current of the traction battery'
  fr: 'Courant de la batterie de traction'
  es: 'Corriente de la batería de tracción'
  de: 'Strom der Antriebsbatterie'
  pl: 'Prąd akumulatora trakcyjnego'
  hu: 'A meghajtó akkumulátor árama'
comment:
  en: 'The current from the traction battery corresponds to a current received or transmitted If the current is positive, the traction battery supplies energy If the current is negative, the traction battery receives energy'
  fr: 'Le courant de la batterie de traction correspond à un courant reçu ou émis Si le courant est positif, la batterie de traction fournit de l''énergie Si le courant est négatif, la batterie de traction reçoit de l''énergie'
  es: 'La corriente de la batería de tracción corresponde a una corriente recibida o emitida Si la corriente es positiva, la batería de tracción suministra energía Si la corriente es negativa, la batería de tracción recibe energía'
  de: 'Entspricht der Strom der Antriebsbatterie einem empfangenen oder ausgesendeten Strom Wenn der Strom positiv ist, liefert die Antriebsbatterie Strom Wenn der Strom negativ ist, erhält die Antriebsbatterie Strom'
  pl: 'Natężenie prądu akumulatora trakcyjnego odpowiada odebranemu lub wysłanemu natężeniu prądu Jeżeli natężenie prądu jest dodatnie, akumulator trakcyjnym dostarcza energię Jeżeli natężenie prądu jest ujemne, akumulator trakcyjny odbiera energię'
  hu: 'A meghajtó akkumulátor árama megfelel egy kapott vagy kibocsátott áramnak Ha az áram pozitív, a meghajtó akkumulátor energiát szállít Ha az áram negatív, a meghajtó akkumulátor energiát fogad'
