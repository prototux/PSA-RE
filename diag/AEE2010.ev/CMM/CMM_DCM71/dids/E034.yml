params:
  ENGINE_SPEED_DEACTIVATION_CRUISE_CONTROL_CAUSE_3:
    bits: '1.7-2.0'
    comment:
      en: 'Engine speed on deactivation of the cruise control (cause -3)'
      fr: 'Régime moteur lors de la désactivation de la régulation de vitesse véhicule (cause -3)'
      es: 'Régimen motor durante la desactivación de la regulación de velocidad vehículo (causa -3)'
      de: 'Motordrehzahl bei der Deaktivierung der Fahrzeuggeschwindigkeitsregelung (Ursache -3)'
      pl: 'Obroty silnika w czasie wyłączenia regulacji prędkości samochodu (przyczyna -3)'
      hu: 'Motorfordulatszám a gépjármű sebességszabályozás semlegesítése során (-3 ok)'
    type: 'uint'
    units: 'rpm'

  CAUSE_3_DEACTIVATION_CRUISE_CONTROL:
    bits: '3.7-4.3'
    comment:
      en: 'Cause (-3) of deactivation of the cruise control'
      fr: 'Cause (-3) de désactivation de la régulation de vitesse véhicule'
      es: 'Causa (-3) de desactivación de la regulación de velocidad vehículo'
      de: 'Ursache (-3) der Deaktivierung der Fahrzeuggeschwindigkeitsregelung'
      pl: 'Przyczyna (-3) wyłączenia regulacji prędkości samochodu'
      hu: 'A gépjármű sebességszabályozás semlegesítésének oka (-3)'
    type: 'enum'
    values:
      0x00:
        en: 'None'
        fr: 'Aucune'
        es: 'Ninguna'
        de: 'Kein/e'
        pl: 'Żadna'
        hu: 'Egy sem'
      0x01:
        en: 'Deactivation of the cruise control by the engine'
        fr: 'Désactivation de la régulation de vitesse véhicule par le moteur'
        es: 'Desactivación de la regulación de velocidad vehículo mediante el motor'
        de: 'Deaktivierung der Fahrzeuggeschwindigkeitsregelung durch den Motor'
        pl: 'Wyłączenie regulacji prędkości pojazdu przez silnik'
        hu: 'Gépjármű sebességszabályozás semlegesítése a motor által'
      0x02:
        en: 'Deactivation of the cruise control by a press on the clutch pedal'
        fr: 'Désactivation de la régulation de vitesse véhicule par un appui sur la pédale d''embrayage'
        es: 'Desactivación de la regulación de velocidad vehículo al pisar el pedal de embrague'
        de: 'Deaktivierung der Fahrzeuggeschwindigkeitsregelung durch einen Druck auf das Kupplungspedal'
        pl: 'Wyłączenie regulacji prędkości pojazdu przez naciśnięcie pedału sprzęgła'
        hu: 'Gépjármű sebességszabályozás semlegesítése a tengelykapcsolópedál lenyomása által'
      0x04:
        en: 'Deactivation of the cruise control by the ESP'
        fr: 'Désactivation de la régulation de vitesse véhicule par l''ESP'
        es: 'Desactivación de la regulación de velocidad vehículo mediante el ESP'
        de: 'Deaktivierung der Fahrzeuggeschwindigkeitsregelung durch das ESP'
        pl: 'Wyłączenie regulacji prędkości pojazdu przez ESP'
        hu: 'Gépjármű sebességszabályozás semlegesítése az ESP által'
      0x08:
        en: 'Deactivation of the cruise control due to speed information which is not coherent'
        fr: 'Désactivation de la régulation de vitesse véhicule à cause d''une information vitesse incohérente'
        es: 'Desactivación de la regulación de velocidad vehículo a causa de una inforamción velocidad incoherente'
        de: 'Deaktivierung der Fahrzeuggeschwindigkeitsregelung aufgrund einer inkohärenten Geschwindigkeitsinformation'
        pl: 'Wyłączenie regulacji prędkości pojazdu wskutek niespójnej informacji o prędkości'
        hu: 'Gépjármű sebességszabályozás semlegesítése egy nem megfelelő sebesség információ miatt'
      0x20:
        en: 'Deactivation of the cruise control due to acceleration of the vehicle which is not consistent with the reference value requested'
        fr: 'Désactivation de la régulation de vitesse véhicule par rapport à une accélération du véhicule incohérente à la consigne demandée'
        es: 'Desactivación de la regulación de velocidad vehículo respecto a una aceleración del vehículo incoherente con la consigna solicitada'
        de: 'Deaktivierung der Fahrzeuggeschwindigkeitsregelung durch eine inkohärente Beschleunigung des Fahrzeugs gegenüber dem angeforderten Sollwert'
        pl: 'Wyłączenie regulacji prędkości pojazdu w związku z przyspieszeniem pojazdu niezgodnym z żądaną wartością zadaną'
        hu: 'Gépjármű sebességszabályozás semlegesítése a kért előírt értékkel nem koherens gépjármű gyorsítás miatt'
      0x40:
        en: 'Deactivation of the cruise control by an emergency collision braking system action'
        fr: 'Désactivation de la régulation de vitesse véhicule par un freinage automatique en cas de risque de collision'
        es: 'Desactivación de la regulación de velocidad vehículo mediante la frenada automática en caso de riesgo de colisión'
        de: 'Deaktivierung der Fahrzeuggeschwindigkeitsregelung durch ein automatisches Bremsen bei Kollisionsgefahr'
        pl: 'Wyłączenie regulacji prędkości pojazdu przez automatyczne hamowanie w razie groźby zderzenia'
        hu: 'Gépjármű sebességszabályozás semlegesítése az ütközés veszélye esetén automatikus fékezés által'
      0x80:
        en: 'Deactivation of the cruise control by a press on the brake pedal'
        fr: 'Désactivation de la régulation de vitesse véhicule par un appui sur la pédale de frein'
        es: 'Desactivación de la regulación de velocidad vehículo al pisar el pedal del freno'
        de: 'Deaktivierung der Fahrzeuggeschwindigkeitsregelung durch einen Druck auf das Bremspedal'
        pl: 'Wyłączenie regulacji prędkości pojazdu naciśnięciem pedału hamulca'
        hu: 'Gépjármű sebességszabályozás semlegesítése a fékpedál megnyomása által'
      0x100:
        en: 'Deactivation of the cruise control by a press on the cruise control activation/deactivation button'
        fr: 'Désactivation de la régulation de vitesse véhicule par un appui sur la touche d''activation / désactivation de la régulation de vitesse véhicule'
        es: 'Desactivación de la regulación de velocidad vehículo mediante la pulsación de la tecla de activación/desactivación de la regulación de velocidad vehículo'
        de: 'Deaktivierung der Fahrzeuggeschwindigkeitsregelung durch einen Druck auf die Taste Aktivierung / Deaktivierung der Fahrzeuggeschwindigkeitsregelung'
        pl: 'Wyłączenie regulacji prędkości pojazdu naciśnięciem przycisku włączania/wyłączania regulacji prędkości pojazdu'
        hu: 'Gépjármű sebességszabályozás semlegesítése a gépjármű sebességszabályozás bekapcsolás/semlegesítés gomb megnyomása által'
      0x200:
        en: 'Deactivation of the cruise control by the engine management ECU'
        fr: 'Désactivation de la régulation de vitesse véhicule par le calculateur contrôle moteur'
        es: 'Desactivación de la regulación de velocidad vehículo a través del calculador de control motor'
        de: 'Deaktivierung der Fahrzeuggeschwindigkeitsregelung durch das Motorsteuergerät'
        pl: 'Wyłączenie regulacji prędkości pojazdu przez kalkulator sterujący silnikiem'
        hu: 'Gépjármű sebességszabályozás semlegesítése a befecskendezés-computer miatt'
      0x400:
        en: 'Deactivation of the cruise control due to a change of gear'
        fr: 'Désactivation de la régulation de vitesse véhicule à cause d''un changement de rapport de vitesse'
        es: 'Desactivación de la regulación de velocidad vehículo a causa de un cambio de marcha'
        de: 'Deaktivierung der Fahrzeuggeschwindigkeitsregelung aufgrund eines Gangwechsels'
        pl: 'Wyłączenie regulacji prędkości pojazdu wskutek zmiany biegu'
        hu: 'Gépjármű sebességszabályozás semlegesítése egy sebességfokozat váltás miatt'
      0x800:
        en: 'Deactivation of the cruise control due to a prohibited gear'
        fr: 'Désactivation de la régulation de vitesse véhicule à cause d''un rapport de vitesse interdit'
        es: 'Desactivación de la regulación de velocidad vehículo a causa de una relación de velocidad prohibida'
        de: 'Deaktivierung der Fahrzeuggeschwindigkeitsregelung aufgrund eines unzulässigen Getriebegangs'
        pl: 'Wyłączenie regulacji prędkości pojazdu wskutek włączenia zabronionego biegu'
        hu: 'Gépjármű sebességszabályozás semlegesítése egy tilos sebességfokozat miatt'
      0x1000:
        en: 'Deactivation of the cruise control due to a fault linked with the gearbox'
        fr: 'Désactivation de la régulation de vitesse véhicule à cause d''un défaut lié à la boîte de vitesses'
        es: 'Desactivación de la regulación de velocidad vehículo a causa de un defecto relacionado con la caja de velocidades'
        de: 'Deaktivierung der Fahrzeuggeschwindigkeitsregelung aufgrund eines Fehlers im Zusammenhang mit dem Getriebe'
        pl: 'Wyłączenie regulacji prędkości samochodu na skutek defektu związanego ze skrzynią biegów'
        hu: 'Gépjármű sebességszabályozás semlegesítése egy sebességváltóval kapcsolatos hiba miatt'

