node: 'EPLU'
model: 'EPLU'
display_name:
  en: 'Electric park lock (EPLU)'
  fr: 'Verrou de parking electrique (EPLU)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x5CA
    response_id: 0x5AA
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x5CA
    response_id: 0x5AA
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'
  0x50:
    en: 'Session 0x50'
    fr: 'Session 0x50'
  0x60:
    en: 'Supplier session'
    fr: 'Session fournisseur'
  0x7A:
    en: 'Session 0x7A'
    fr: 'Session 0x7A'

resets:
  0x02:
    en: 'Key off / on reset'
    fr: 'Réinitialisation coupure / mise du contact'
  0xFF:
    en: 'Reset 0xFF'
    fr: 'Réinitialisation 0xFF'

services: [0x10, 0x11, 0x14, 0x19, 0x22, 0x27, 0x31]

security_access:
  - level: 0x01
  - level: 0x03

identification:
  request: '22 F0 FE'
  part_number: '22.7-24.0'
  comment:
    en: 'The ECU part number is in data bytes 22 to 24 of the answer to 22 F0 FE (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 22 à 24 de la réponse à 22 F0 FE (DCB), elle donne la variante logicielle'

cars: ['D34', 'P2']

variants:
  D34_V1:
    parts: ['937366']
    cars: ['D34']
  D34_V2:
    parts: ['937270']
    cars: ['D34']
  D34_V3:
    parts: ['940570']
    cars: ['D34']
  D34_V4:
    parts: ['940571']
    cars: ['D34']
  P2JO_V1:
    parts: ['937366']
    cars: ['P2']
  P2JO_V2:
    parts: ['940570']
    cars: ['P2']
  P2_V1:
    parts: ['937366']
    cars: ['P2']
  P2_V2:
    parts: ['937270']
    cars: ['P2']
  P2_V3:
    parts: ['940570']
    cars: ['P2']
  P2_V4:
    parts: ['940571']
    cars: ['P2']
