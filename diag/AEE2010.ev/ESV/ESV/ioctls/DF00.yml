ioctl: 0xDF00
name: 'CONTROL_WIPERS_SLOW_SPEED'
display_name:
  en: 'Control of the wipers at slow speed'
  fr: 'Pilotage de l''essuie-vitre en petite vitesse'
  es: 'Pilotaje del limpiaparabrisas en pequeña velocidad'
  de: 'Ansteuerung des Scheibenwischers auf kleiner Geschwindigkeit'
  pl: 'Sterowanie wycieraczki szyby z małą prędkością'
  hu: 'Az ablaktörlő vezérlése kis sebességfokozaton'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_1:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the wipers at slow speed'
      fr: 'Pilotage de l''essuie-vitre en petite vitesse'
      es: 'Pilotaje del limpiaparabrisas en pequeña velocidad'
      de: 'Ansteuerung des Scheibenwischers auf kleiner Geschwindigkeit'
      pl: 'Sterowanie wycieraczki szyby z małą prędkością'
      hu: 'Az ablaktörlő vezérlése kis sebességfokozaton'
    max_duration_ms: 5000
  - display_name:
      en: 'Control of the wipers at fast speed'
      fr: 'Pilotage de l''essuie-vitre en grande vitesse'
      es: 'Pilotaje del limpiaparabrisas en gran velocidad'
      de: 'Ansteuerung des Scheibenwischers auf großer Geschwindigkeit'
      pl: 'Pilotowanie wycieraczek szyby przy dużej prędkości'
      hu: 'Az ablaktörlő vezérlése nagy sebességfokozaton'
    max_duration_ms: 5000
  - display_name:
      en: 'Placing in the maintenance position'
      fr: 'Mise en position maintenance'
      es: 'Puesta en posición de mantenimiento'
      de: 'Wartungsstellung'
      pl: 'Umieszczenie w położeniu serwisowym'
      hu: 'Karbantartási helyzetbe történő helyezés'
    max_duration_ms: 5000
