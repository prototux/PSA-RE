did: 0xD600
name: 'PRESENCE_CLOCK_INSTRUMENT_PANEL'
display_name:
  en: 'Presence of the clock on the instrument panel'
  fr: 'Présence de la montre sur le combiné'
  es: 'Presencia del reloj en el combinado'
  de: 'Vorhandensein der Uhr im Kombiinstrument'
  pl: 'Obecność zegarka na zestawie wskaźników'
  hu: 'Az óra jelenléte a kombinált kijelzőegységen'
comment:
  en: 'The clock is present on the instrument panel if the vehicle is not fitted with a multifunction screen or radio navigation.'
  fr: 'La montre est présente sur le combiné si le véhicule n''est pas équipé d''un écran multifonction ou de la radionavigation.'
  es: 'El reloj está presente en el combinado si el vehículo no está equipado con pantalla multifunción o radionavegador.'
  de: 'Die Uhr ist am Kombiinstrument vorhanden, wenn das Fahrzeug nicht mit einer Multifunktionsanzeige oder Radio-Navigation ausgestattet ist.'
  pl: 'Zegar jest obecny na zestawie wskaźników jeżeli samochód nie jest wyposażony w ekran wielofunkcyjny lub radionawigację.'
  hu: 'Az óra a műszercsoportban található meg, ha a jármű nincs többfunkciós kijelzővel vagy rádió-navigációval felszerelve.'
kind: 'config'
access: 'read-write'
length: 1
variants: ['A9_*', 'B8_*', 'B75C_*', 'B78_*']

