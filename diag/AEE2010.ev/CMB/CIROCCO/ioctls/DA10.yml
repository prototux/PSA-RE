ioctl: 0xDA10
name: 'DISPLAYING_VIDEO_TEST_CARD'
display_name:
  en: 'Displaying of the video test card'
  fr: 'Affichage de la mire vidéo'
  es: 'Indicación de la mira vídeo'
  de: 'Anzeige des Video-Testbilds'
  pl: 'Wyświetlanie kontrolnego obrazu wideo'
  hu: 'A video tesztképernyő kijelzése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Displaying of the video test card'
      fr: 'Affichage de la mire vidéo'
      es: 'Indicación de la mira vídeo'
      de: 'Anzeige des Video-Testbilds'
      pl: 'Wyświetlanie kontrolnego obrazu wideo'
      hu: 'A video tesztképernyő kijelzése'
    max_duration_ms: 5000
