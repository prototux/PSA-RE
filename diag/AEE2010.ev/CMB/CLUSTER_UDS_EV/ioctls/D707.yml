ioctl: 0xD707
name: 'CONTROL_INDICATOR_LAMPS_EXTERNAL_INSTRUMENT'
display_name:
  en: 'Control of the indicator lamps external to the instrument panel'
  fr: 'Pilotage des voyants externes au combiné'
  es: 'Pilotaje de los testigos externos del combinado'
  de: 'Ansteuerung der Kontrollleuchten außerhalb des Kombiinstruments'
  pl: 'Pilotowanie kontrolek zewnętrznych zestawu wskaźników'
  hu: 'Kombinált kijelzőegységen lévő külső visszajelzők vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  ROUTINE_CONTROL_TYPE:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  PARAMETER_IOCBI_707:
    bits: '2.7-3.0'
    type: 'enum'

results:
  ROUTINE_CONTROL_TYPE:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the indicator lamps external to the instrument panel'
      fr: 'Pilotage des voyants externes au combiné'
      es: 'Pilotaje de los testigos externos del combinado'
      de: 'Ansteuerung der Kontrollleuchten außerhalb des Kombiinstruments'
      pl: 'Pilotowanie kontrolek zewnętrznych zestawu wskaźników'
      hu: 'Kombinált kijelzőegységen lévő külső visszajelzők vezérlése'
    max_duration_ms: 2000
