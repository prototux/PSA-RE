ioctl: 0xD800
name: 'CONTROL_PIXELS'
display_name:
  en: 'Control of the pixels'
  fr: 'Pilotage des pixels'
  es: 'Pilotaje de los píxeles'
  de: 'Steuerung der Pixel'
  pl: 'Sterowanie pikseli'
  hu: 'Pixelek vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  ROUTINE_CONTROL_TYPE:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  PARAMETER_IOCBI_800:
    bits: '2.7-2.0'
    type: 'enum'

results:
  ROUTINE_CONTROL_TYPE:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the pixels'
      fr: 'Pilotage des pixels'
      es: 'Pilotaje de los píxeles'
      de: 'Steuerung der Pixel'
      pl: 'Sterowanie pikseli'
      hu: 'Pixelek vezérlése'
    max_duration_ms: 2000
