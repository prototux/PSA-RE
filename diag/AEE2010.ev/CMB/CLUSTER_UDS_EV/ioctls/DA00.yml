ioctl: 0xDA00
name: 'CONTROL_INSTRUMENT_PANEL_BACKLIGHTING'
display_name:
  en: 'Control of the instrument panel backlighting'
  fr: 'Pilotage du rétroéclairage du combiné'
  es: 'Pilotaje de la retroiluminación del combinado'
  de: 'Ansteuerung der Hinterleuchtung des Kombiinstruments'
  pl: 'Pilotowanie podświetlenia zestawu wskaźników'
  hu: 'Kombinált kijelzőegység háttérvilágítás vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  ROUTINE_CONTROL_TYPE:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  PARAMETER_IOCBI_DA00:
    bits: '2.7-2.0'
    type: 'enum'

results:
  ROUTINE_CONTROL_TYPE:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the instrument panel backlighting'
      fr: 'Pilotage du rétroéclairage du combiné'
      es: 'Pilotaje de la retroiluminación del combinado'
      de: 'Ansteuerung der Hinterleuchtung des Kombiinstruments'
      pl: 'Pilotowanie podświetlenia zestawu wskaźników'
      hu: 'Kombinált kijelzőegység háttérvilágítás vezérlése'
    max_duration_ms: 2000
