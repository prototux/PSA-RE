    type: 'uint'
    factor: 20
    units: 'ms'

  DISTANCE_TRAVELLED_BETWEEN_DISPLAYING_WARNING:
    bits: '4.7-4.0'
    comment:
      en: 'Distance travelled between the displaying of a warning and crossing of the white line or broken line'
      fr: 'Distance parcourue entre l''affichage d''une alerte et le franchissement de la ligne blanche ou ligne discontinue'
      es: 'Distancia recorrida entre la indicación de una alerta y el franqueo de la línea blanca o de la línea discontinua'
      de: 'Zurückgelegte Strecke zwischen der Anzeige einer Warnung und dem Überfahren der weißen oder unterbrochenen Linie'
      pl: 'Droga pokonana pomiędzy wyświetleniem alarmu i przekroczeniem linii białej lub linii przerywanej'
      hu: 'Megtett távolság egy figyelmeztető kijelzés és a szaggatott vonal vagy fehér vonal átlépése között'
    type: 'uint'
    offset: -100
    units: 'Cm'

  ANGLE_BETWEEN_MARKING_AND_VEHICLE_CONSIDERED:
    bits: '5.7-5.4'
    comment:
      en: 'Angle between the marking and the vehicle considered to be intentional crossing of the line'
      fr: 'Angle entre le marquage et le véhicule considéré comme franchissement volontaire de ligne'
      es: 'Ángulo entre las marcas y el vehículo considerado como cambio voluntario de carril'
      de: 'Winkel zwischen der Markierung und dem Fahrzeug als nicht beabsichtigter Spurwechsel betrachtet'
      pl: 'Kąt pomiędzy oznakowaniem i samochodem uznany jako niezamierzone przekroczenie linii'
      hu: 'A jelölés és a véletlen sávelhagyónak vett gépjármű közötti szög'
    type: 'uint'
    units: '°'

  LANE_DEPARTURE_WARNING_FUNCTION_TEST_MODE:
    bits: '5.3'
    comment:
      en: 'Lane departure warning function test mode'
      fr: 'Mode test de la fonction de l''alerte de franchissement involontaire de ligne'
      es: 'Modo test de la función de la alerta de cambio involuntario de carril'
      de: 'Testmodus der Funktion Warnung bei nicht beabsichtigtem Spurwechsel'
      pl: 'Tryb testu funkcji alarmu niezamierzonego przekroczenia linii'
      hu: 'A véletlen sávelhagyásra figyelmeztető funkció teszt üzemmódja'
    type: 'bool'
    values:
      0x00:
        en: 'Mode not activated'
        fr: 'Mode inactivé'
        es: 'Modo no activado'
        de: 'Modus inaktiviert'
        pl: 'Tryb nieaktywny'
        hu: 'Nem aktív üzemmód'
      0x01:
        en: 'Mode activated'
        fr: 'Mode activé'
        es: 'Modo activado'
        de: 'Modus aktiviert'
        pl: 'Tryb aktywowany'
        hu: 'Aktív üzemmód'
