      fr: 'Durée minimale de l''alerte de franchissement involontaire de ligne'
      es: 'Duración mínima de la alerta de cambio involuntario de carril'
      de: 'Mindestdauer der Warnung bei nicht beabsichtigtem Spurwechsel'
      pl: 'Minimalny czas trwania alarmu niezamierzonego przekroczenia linii'
      hu: 'Véletlen sávelhagyásra történő figyelmeztetés minimális időtartama'
    type: 'uint'
    factor: 0.25
    units: 's'

  MAXIMUM_DURATION_LANE_DEPARTURE_WARNING:
    bits: '1.3-2.7'
    comment:
      en: 'Maximum duration of the lane departure warning'
      fr: 'Durée maximale de l''alerte de franchissement involontaire de ligne'
      es: 'Duración máxima de la alerta de cambio involuntario de carril'
      de: 'Maximale Dauer der Warnung bei nicht beabsichtigtem Spurwechsel'
