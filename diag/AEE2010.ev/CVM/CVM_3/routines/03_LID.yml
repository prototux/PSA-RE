routine: 0x03
name: 'MAIN_BEAM_HEADLAMPS_CONTROL'
display_name:
  en: 'Main beam headlamps control'
  fr: 'Pilotage des feux de route'
  es: 'Pilotaje de las luces de carretera'
  de: 'Steuerung des Fernlichts'
  pl: 'Sterowanie świateł drogowych'
  hu: 'Fényszórók vezérlése'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  RECORD_DATA_IDENTIFIER:
    bits: '1.7-2.0'
    type: 'uint'

results:
  RECORD_DATA_IDENTIFIER:
    bits: '1.7-2.0'
    type: 'uint'

  ACTUATOR_TEST:
    bits: '3.7-3.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x03:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x04:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Main beam headlamps control'
      fr: 'Pilotage des feux de route'
      es: 'Pilotaje de las luces de carretera'
      de: 'Steuerung des Fernlichts'
      pl: 'Sterowanie świateł drogowych'
      hu: 'Fényszórók vezérlése'
    max_duration_ms: 30000
  - display_name:
      en: 'Control of the speed limit indication function symbol'
      fr: 'Pilotage du pictogramme de la fonction indication de limitation de vitesse'
      es: 'Pilotaje del pictograma de la función indicación de límite de velocidad'
      de: 'Steuerung des Piktogramms der Funktion Anzeige Geschwindigkeitsbegrenzung'
      pl: 'Sterowanie piktogramem funkcji wskazywania ograniczenia prędkości'
      hu: 'A sebességkorlátozás jelző funkció piktogram vezérlése'
    max_duration_ms: 30000
  - display_name:
      en: 'Programming of the multifunction video camera'
      fr: 'Apprentissage de la caméra vidéo multifonction'
      es: 'Aprendizaje de la cámara de video multifunción'
      de: 'Anlernen der Multifunktionsvideokamera'
      pl: 'Procedura uczenia wielofunkcyjnej kamery wideo'
      hu: 'A többfunkciós videokamera megismertetése'
  - display_name:
      en: 'Control of the road sign recognition function display'
      fr: 'Pilotage de l''affichage de la fonction de reconnaissance de signalisation routière'
      es: 'Pilotaje de la visualización de la función de reconocimiento de señalización vial'
      de: 'Steuerung der Anzeige der Verkehrszeichenerkennung'
