        fr: 'Caméra vidéo multifonction en erreur'
        es: 'Error en cámara de vídeo multifunción'
        de: 'Multifunktionsvideokamera fehlerhaft'
        pl: 'Błąd wielofunkcyjnej kamery wideo'
        hu: 'A többfunkciós videokamera meghibásodása'
      0x09:
        en: 'Programming unsuccessful: Check that the multifunction video camera is correctly fixed in the support and that the target is positioned correctly as described in the repair method'
        fr: 'Apprentissage non réussi: Contrôler que la caméra vidéo multifonction est bien fixée dans le support et que la cible est bien positionnée comme décrit dans la méthode de réparation'
        es: 'Aprendizaje no logrado: Controlar que la cámara de vídeo multifunción está correctamente fijada en el soporte y que el objetivo está bien colocado como se describe en el método de reparación'
        de: 'Anlernen nicht erfolgt: Überprüfen, ob die Multifunktionsvideokamera richtig in der Halterung ist und die Skala korrekt positioniert wie in der Reparaturmethode beschrieben'
        pl: 'Uczenie nieudane: Sprawdzić, czy wielofunkcyjna kamera wideo jest dobrze zamocowana na wsporniku i czy cel jest dobrze ustawiony, zgodnie z opisem naprawy'
        hu: 'A betanítás nem sikerül: Ellenőrizze, hogy a többfunkciós videokamera megfelelően rögzítve van-e a tartóban, és a cél megfelelő helyzetben van-e a javítási eljárásban leírtak szerint'
      0x0A:
        en: 'Programming unsuccessful: Check the installation of the multifunction video camera'
        fr: 'Apprentissage non réussi: Contrôler l''installation de la caméra vidéo multifonction'
        es: 'Aprendizaje no logrado: Controlar la instalación de la cámara de vídeo multifunción'
        de: 'Anlernen nicht erfolgt: Kontrollieren Sie die Einstellung der Multifunktionsvideokamera'
        pl: 'Uczenie nieudane: Sprawdzić montaż wielofunkcyjnej kamery video'
        hu: 'A betanítás nem sikerül: Ellenőrizze a többfunkciós videokamera beszerelését'
      0xFF:
        en: 'Programming unsuccessful: Result invalid- Switch off and restart the ignition to restart the operation'
        fr: 'Apprentissage non réussi: Résultat invalide- Couper et remettre le contact et relancer l''opération'
        es: 'Aprendizaje no logrado: Resultado no válido- Cortar y volver a poner el contacto y repetir la operación'
        de: 'Anlernen nicht erfolgt: Ergebnis ungültig- Die Zündung aus- und wieder einschalten und das Verfahren erneut beginnen'
        pl: 'Uczenie nieudane: Rezultat nieprawidłowy- Wyłączyć i ponownie włączyć zapłon oraz ponowić operację'
        hu: 'A betanítás nem sikerül: Érvénytelen eredmény- Kapcsolja le majd vissza a gyújtást és indítsa el újra a műveletet'
