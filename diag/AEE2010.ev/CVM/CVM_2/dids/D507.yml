        hu: 'A betanítás nem sikerül: Ellenőrizze a célok távolságát a javítási eljárásban leírtak szerint'
      0x07:
        en: 'Check the lighting conditions'
        fr: 'Contrôler les conditions d''éclairage'
        es: 'Controlar las condiciones de iluminación'
        de: 'Die Beleuchtungsbedingungen kontrollieren'
        pl: 'Sprawdzić warunki oświetlenia'
        hu: 'Ellenőrizze a világítási körülményeket'
