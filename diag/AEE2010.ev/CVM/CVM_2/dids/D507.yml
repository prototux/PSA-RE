        en: 'Programming unsuccessful: Check the distances of targets as described in the repair method'
        fr: 'Apprentissage non réussi: Contrôler les distances des cibles comme décrit dans la méthode de réparation'
        es: 'Aprendizaje no logrado: Controlar las distancias de los objetivos como se describe en el método de reparación'
        de: 'Anlernen nicht erfolgt: Die Abstände der Impulsscheiben wie in der Reparaturmethode beschrieben kontrollieren'
