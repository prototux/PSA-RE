params:
  VEHICLE_SPEED_CALCULATED_MULTIFUNCTION_VIDEO:
    bits: '1.7-2.0'
    comment:
      en: 'Vehicle speed calculated by the multifunction video camera'
      fr: 'Vitesse véhicule calculée par la caméra vidéo multifonction'
      es: 'Velocidad vehículo calculada por la cámara de vídeo multifunción'
      de: 'Von der Multifunktionsvideokamera berechnete Fahrzeuggeschwindigkeit'
      pl: 'Prędkość samochodu obliczona przez wielofunkcyjną kamerę video'
      hu: 'Gépjármű többfunkciós videokamera által számított sebessége'
    type: 'uint'
    factor: 0.01
    units: 'km/h'

  LONGITUDINAL_ACCELERATION_VEHICLE_CALCULATED:
    bits: '3.7-4.0'
    comment:
      en: 'Longitudinal acceleration of the vehicle calculated by the multifunction video camera'
      fr: 'Accélération longitudinale du véhicule calculée par la caméra vidéo multifonction'
      es: 'Aceleración longitudinal del vehículo calculada por la cámara de vídeo multifunción'
      de: 'Von der Multifunktionsvideokamera berechnete Längsbeschleunigung des Fahrzeug'
      pl: 'Przyspieszenie wzdłużne samochodu obliczone przez wielofunkcyjną kamerę video'
      hu: 'A gépjármű többfunkciós videokamera által számított hosszirányú gyorsulása'
    type: 'sint'
    factor: 0.05
    units: 'm/s²'

  LATERAL_ACCELERATION_VEHICLE_CALCULATED:
    bits: '5.7-6.0'
    comment:
      en: 'Lateral acceleration of the vehicle calculated by the multifunction video camera'
      fr: 'Accélération latérale du véhicule calculée par la caméra vidéo multifonction'
      es: 'Aceleración lateral del vehículo calculada por la cámara de vídeo multifunción'
      de: 'Von der Multifunktionsvideokamera berechnete Querbeschleunigung des Fahrzeug'
      pl: 'Przyspieszenie boczne samochodu obliczone przez wielofunkcyjną kamerę video'
      hu: 'Gépjármű többfunkciós videokamera által számított oldalsó gyorsulása'
    type: 'uint'
    factor: 0.05
    units: 'm/s²'

  LEVEL_DRIVER_ACTIVITY:
    bits: '8.7-8.0'
    comment:
      en: 'Level of driver activity'
      fr: 'Niveau d''activité du conducteur'
      es: 'Nivel de actividad del conductor'
      de: 'Aktivitätsniveau des Fahrers'
      pl: 'Poziom aktywności kierowcy'
      hu: 'Vezető aktivitási szintje'
