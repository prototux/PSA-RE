did: 0xD420
name: 'CONTROL_MOTORISED_STRIKER'
display_name:
  en: 'Control of the motorised striker'
  fr: 'Commande de la gâche motorisée'
  es: 'Mando de la armella motorizada'
  de: 'Ansteuerung der motorisierten Schließeinheit'
  pl: 'Sterowanie zaczepu napędzanego'
  hu: 'A motoros hajtású zárütköző vezérlése'
comment:
  en: 'The direction of control of the motorised striker depends on the position of the striker determined by its status switch please note : As the control command is a pulse, it can be difficult to see on the diagnostic tool'
  fr: 'Le sens de commande de la gâche motorisée dépend de la position de la gâche déterminée par son contacteur d''état attention : La commande de pilotage étant une impulsion, elle peut être difficile à voir sur l''outil de diagnostic'
  es: 'El sentido de accionamiento de la armella motorizada depende de la posición de la armella determinada por su contactor de estado atención : El mando de pilotaje es un impulso y puede ser difícil de ver en el útil de diagnosis'
  de: 'Die Ansteuerungsrichtung der motorisierten Schließeinheit hängt von der vom Zustandskontaktschalter bestimmten Position der Schließeinheit ab vorsicht : Da die Ansteuerung durch einen Impuls erfolgt, kann sie auf der Diagnosestation schwer zu sehen sein'
  pl: 'Kierunek działania zaczepu napędzanego zależy od położenia zaczepu ustalonego przez jego zestyk stanu uwaga : Sterowanie pilotowania stanowi jeden impuls, może być on trudny do zobaczenia na narzędziu diagnostycznym'
  hu: 'A motoros hajtású zárütköző vezérlési iránya a zárütköző állapotkapcsolója által meghatározott helyzetétől függ figyelem : Mivel a vezérlés impulzusos nehezen látható a diagnosztikai készüléken'
kind: 'live'
access: 'read'
length: 2

