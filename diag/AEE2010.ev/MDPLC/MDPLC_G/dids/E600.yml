did: 0xE600
name: 'DID_E600'
display_name:
  en: 'Data record 0xE600 (7 values)'
  fr: 'Enregistrement 0xE600 (7 valeurs)'
kind: 'live'
access: 'read'
length: 6

params:
  DIRECTION_MOVEMENT_SLIDING_SIDE_DOOR_MOTORISED:
    bits: '1.7-1.6'
    comment:
      en: 'Direction of movement of the sliding side door (motorised operation)'
      fr: 'Sens du mouvement de la porte latérale coulissante (fonctionnement motorisé)'
      es: 'Sentido de movimiento de la puerta lateral corredera (funcionamiento motorizado)'
      de: 'Bewegungsrichtung der Seitenschiebetür (motorisierte Funktion)'
      pl: 'Kierunek ruchu drzwi bocznych przsuwnych (działanie z napędem)'
      hu: 'Az oldalsó tolóajtó mozgásának iránya (motor hajtású működés)'
    type: 'enum'
    values:
      0x00:
        en: 'No movement'
        fr: 'Absence de mouvement'
        es: 'Ausencia de movimiento'
        de: 'Keine Bewegung vorhanden'
        pl: 'Brak ruchu'
        hu: 'Mozgás hiánya'
      0x01:
        en: 'Motorised closing'
        fr: 'Fermeture motorisée'
        es: 'Cierre motorizada'
        de: 'Motorisiertes Schließen'
        pl: 'Zamknięcie napędzane'
        hu: 'Motoros csukódás'
      0x02:
        en: 'Motorised opening'
        fr: 'Ouverture motorisée'
        es: 'Apertura motorizada'
        de: 'Motorisiertes Öffnen'
        pl: 'Otwarcie napędzane'
        hu: 'Motoros nyitás'

  STATUS_SLIDING_SIDE_DOOR_ELECTRIC_MOTOR_CLUTCH:
    bits: '1.2'
    comment:
      en: 'Status of the sliding side door electric motor clutch sequential control function'
      fr: 'Etat de la fonction du pilotage séquentiel de l''embrayage du moteur électrique de la porte latérale coulissante'
      es: 'Estado de la función de pilotaje secuencial del embrague del motor eléctrico de la puerta lateral corredera'
      de: 'Zustand der Funktion der sequentiellen Ansteuerung der Kupplung des Elektromotors der Seitenschiebetür'
      pl: 'Stan funkcji sterowania sekwencyjnego, sprzęgła silnika elektrycznego drzwi bocznych przsuwnych'
      hu: 'Az oldalsó tolóajtó elektromos motor tengelykapcsoló szekvenciális vezérlési funkciójának állapota'
    type: 'bool'
    values:
      0x00:
        en: 'Function inactive'
        fr: 'Fonction inactive'
        es: 'Función inactiva'
        de: 'Funktion inaktiv'
        pl: 'Funkcja nieaktywna'
        hu: 'Nem aktív funkció'
      0x01:
        en: 'Function active'
        fr: 'Fonction active'
        es: 'Función activa'
        de: 'Aktive Funktion'
        pl: 'Funkcja aktywna'
        hu: 'Aktív funkció'

  STATUS_OBSTACLE_DETECTION:
    bits: '1.4-1.3'
    comment:
      en: 'Status of the obstacle detection'
      fr: 'Etat de la détection d''obstacle'
      es: 'Estado de la detección de obstáculo'
      de: 'Zustand der Hinderniserkennung'
      pl: 'Stan wykrywania przeszkody'
      hu: 'Az akadály észlelés állapota'
    type: 'enum'
    values:
      0x00:
        en: 'No obstacle'
        fr: 'Absence d''obstacle'
        es: 'Ausencia de obstáculos'
        de: 'Kein Hindernis vorhanden'
        pl: 'Brak przeszkody'
        hu: 'Akadály hiánya'
      0x01:
        en: 'Obstacle detected by the anti-pinch sensor fixed on the front part of the sliding side door (direct detection)'
        fr: 'Obstacle détecté par le capteur d''antipincement fixé sur la partie avant de la porte latérale coulissante (détection directe)'
        es: 'Obstáculo detectado por el calculador de antipinzamiento fijado a la parte delantera de la puerta lateral corredera (detección directa)'
        de: 'Hindernis vom am vorderen Teil der Seitenschiebetür befestigten Einklemmschutzsensor erkannt (direkte Erkennung)'
        pl: 'Przeszkoda wykryta przez czujnik zabezpieczenia przed zaciśnięciem zamocowany na przedniej części bocznych drzwi przesuwnych (wykrywanie bezpośrednie)'
        hu: 'Az oldalsó tolóajtó első részére rögzített becsípődésgátló érzékelő által észlelt akadály (közvetlen érzékelés)'
      0x02:
        en: 'Obstacle detected by the sliding side door electric motor position sensors (indirect detection)'
        fr: 'Obstacle détecté par les capteurs de position du moteur électrique de la porte latérale coulissante (détection indirecte)'
        es: 'Obstáculo detectado por los captadores de posición del motor eléctrico de la puerta lateral corredera (detección indirecta)'
        de: 'Hindernis von den Positionssensoren des Elektromotors der Seitenschiebetür erkannt (indirekte Erkennung)'
        pl: 'Przeszkoda wykryta przez czujniki położenia silnika elektrycznego bocznych drzwi przesuwnych (wykrywanie pośrednie)'
        hu: 'Az oldalsó tolóajtó elektromos motor helyzetérzékelők által észlelt akadály (közvetett észlelés)'

  STATUS_SLIDING_SIDE_DOOR_ELECTRIC_MOTOR_CLUTCH_2:
    bits: '1.5'
    comment:
      en: 'Status of the sliding side door electric motor/clutch assembly thermal protection'
      fr: 'Etat de la protection thermique de l''ensemble moteur électrique / embrayage de la porte latérale coulissante'
      es: 'Estado de la protección térmica del conjunto motor eléctrico/embrague de la puerta lateral corredera'
      de: 'Zustand des Überhitzungsschutzes der Einheit Elektromotor / Kupplung der Seitenschiebetür'
      pl: 'Stan zabezpieczenia termicznego zespołu silnik elektryczny/sprzęgło drzwi bocznych przesuwnych'
      hu: 'Az oldalsó tolóajtó tengelykapcsoló/elektromos motor egység hővédelmének állapota'
    type: 'bool'
    values:
      0x00:
        en: 'Thermal protection inactive'
        fr: 'Protection thermique inactive'
        es: 'Protección térmica inactiva'
        de: 'Thermischer Schutz inaktiv'
        pl: 'Zabezpieczenie termiczne nieaktywne'
        hu: 'Inaktív hővédelem'
      0x01:
        en: 'Thermal protection active'
        fr: 'Protection thermique active'
        es: 'Protección térmica activa'
        de: 'Hitzeschutz aktiv'
        pl: 'Zabezpieczenie termiczne aktywne'
        hu: 'Hővédelem aktív'

  MAXIMUM_OPENING_VALUE_PROGRAMMED_SLIDING_SIDE:
    bits: '2.7-3.0'
    comment:
      en: 'Maximum opening value programmed by the sliding side door'
      fr: 'Valeur d''ouverture maximale apprise par la porte latérale coulissante'
      es: 'Valor de apertura máxima aprendida por la puerta lateral corredera'
      de: 'Von der Seitenschiebetür gelernter maximaler Öffnungswert'
      pl: 'Wartość pozycji maksymalnego otwarcia nauczonego przez drzwi boczne przesuwne'
      hu: 'Az oldalsó tolóajtó által megismert maximális nyitási érték'
    type: 'uint'
    units: 'Mm'

  VALUE_SLIDING_SIDE_DOOR_ELECTRIC_MOTOR_CLUTCH:
    bits: '4.7-4.0'
    comment:
      en: 'Value of the sliding side door electric motor/clutch assembly thermal protection'
      fr: 'Valeur de la protection thermique de l''ensemble moteur électrique / embrayage de la porte latérale coulissante'
      es: 'Valor de la protección térmica del conjunto motor eléctrico/embrague de la puerta lateral corredera'
      de: 'Wert des Überhitzungsschutzes der Einheit Elektromotor / Kupplung der Seitenschiebetür'
      pl: 'Wartość zabezpieczenia termicznego zespołu silnik elektryczny/sprzęgło drzwi bocznych przesuwnych'
      hu: 'Az oldalsó tolóajtó tengelykapcsoló/elektromos motor egység hővédelmének értéke'
    type: 'uint'
    units: '%'

  VALUE_POSITION_SLIDING_SIDE_DOOR:
    bits: '5.7-6.0'
    comment:
      en: 'Value of the position of the sliding side door'
      fr: 'Valeur de la position de la porte latérale coulissante'
      es: 'Valor de la posición de la puerta lateral corredera'
      de: 'Wert der Position der Seitenschiebetür'
      pl: 'Wartość pozycji drzwi bocznych przesuwnych'
      hu: 'Az oldalsó tolóajtó helyzetének értéke'
    type: 'sint'
    units: 'Mm'
