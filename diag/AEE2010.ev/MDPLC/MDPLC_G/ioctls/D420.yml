ioctl: 0xD420
name: 'SLIDING_SIDE_DOOR_MOTORISED_STRIKER_COMMAND'
display_name:
  en: 'Sliding side door motorised striker "in" command'
  fr: 'Commande de rentrée de la gâche motorisée de la porte latérale coulissante'
  es: 'Mando de hundimiento de la armella motorizada de la puerta lateral corredera'
  de: 'Ansteuerung Einfahren des motorisierten Schließkeils der Seitenschiebetür'
  pl: 'Sterowanie wsunięcia zaczepu z napędem drzwi bocznych przesuwnych'
  hu: 'AZ oldalsó tolóajtó motoros hajtású zárütköző visszahúzódásának vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_1:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x00

  SETPOINT_2:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Sliding side door motorised striker "in" command'
      fr: 'Commande de rentrée de la gâche motorisée de la porte latérale coulissante'
      es: 'Mando de hundimiento de la armella motorizada de la puerta lateral corredera'
      de: 'Ansteuerung Einfahren des motorisierten Schließkeils der Seitenschiebetür'
      pl: 'Sterowanie wsunięcia zaczepu z napędem drzwi bocznych przesuwnych'
      hu: 'AZ oldalsó tolóajtó motoros hajtású zárütköző visszahúzódásának vezérlése'
    max_duration_ms: 4000
  - display_name:
      en: 'Sliding side door motorised striker "out" command'
      fr: 'Commande de sortie de la gâche motorisée de la porte latérale coulissante'
      es: 'Mando de salida de la armella motorizada de la puerta lateral corredera'
      de: 'Ansteuerung Ausfahren des motorisierten Schließkeils der Seitenschiebetür'
      pl: 'Sterowanie wysunięcia zaczepu z napędem drzwi bocznych przesuwnych'
      hu: 'Az oldalsó tolóajtó motoros hajtású zárütköző kiemelkedésének vezérlése'
    max_duration_ms: 4000
