ioctl: 0xD60B
name: 'REAR_LEFT_AIR_BLOWER_REDUCTION_MOTOR'
display_name:
  en: 'Rear left air blower reduction motor'
  fr: 'Motoréducteur du pulseur d''air arrière gauche'
  es: 'Motorreductor del impulsor de aire trasero izquierdo'
  de: 'Stellmotor des Luftgebläses hinten links'
  pl: 'Motoreduktor dmuchawy powietrza tylnej lewej'
  hu: 'Bal hátsó levegőbefúvó ventilátor motorreduktora'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

tests:
  - display_name:
      en: 'Rear left air blower reduction motor'
      fr: 'Motoréducteur du pulseur d''air arrière gauche'
      es: 'Motorreductor del impulsor de aire trasero izquierdo'
      de: 'Stellmotor des Luftgebläses hinten links'
      pl: 'Motoreduktor dmuchawy powietrza tylnej lewej'
      hu: 'Bal hátsó levegőbefúvó ventilátor motorreduktora'
    max_duration_ms: 3000
