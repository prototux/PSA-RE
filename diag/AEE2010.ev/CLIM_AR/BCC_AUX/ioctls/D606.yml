ioctl: 0xD606
name: 'REAR_LEFT_HAND_MIXING_FLAP_REDUCTION_MOTOR'
display_name:
  en: 'Rear left-hand mixing flap reduction motor'
  fr: 'Motoréducteur du volet de mixage arrière gauche'
  es: 'Motorreductor de la trampilla de mezcla trasera izquierda'
  de: 'Stellmotor der Mischklappe hinten links'
  pl: 'Motoreduktor klapy mieszania tylnej lewej'
  hu: 'Bal hátsó keverő csappantyú motorreduktor'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

tests:
  - display_name:
      en: 'Rear left-hand mixing flap reduction motor'
      fr: 'Motoréducteur du volet de mixage arrière gauche'
      es: 'Motorreductor de la trampilla de mezcla trasera izquierda'
      de: 'Stellmotor der Mischklappe hinten links'
      pl: 'Motoreduktor klapy mieszania tylnej lewej'
      hu: 'Bal hátsó keverő csappantyú motorreduktor'
    max_duration_ms: 4000
