      pl: 'Usterka wewnętrzna'
      hu: 'Belső hiba'
    0x11:
      en: 'Short circuit to earth'
      fr: 'Court-circuit à la masse'
      es: 'Cortocircuito a masa'
      de: 'Masseschluss'
      pl: 'Zwarcie do masy'
      hu: 'Testz rlat'
    0x12:
      en: 'Short-circuit to positive'
      fr: 'Court-circuit au plus'
      es: 'Cortocircuito al más'
      de: 'Kurzschluss an Plus'
      pl: 'Zwarcie z plusem'
      hu: 'Pozitív zárlat'
    0x13:
      en: 'Open circuit'
      fr: 'Circuit ouvert'
      es: 'Circuito abierto'
      de: 'Stromkreis offen'
      pl: 'Obwód przerwany'
      hu: 'Megszakadt áramkör'
    0x14:
      en: 'Short circuit to earth or open circuit'
      fr: 'Court-circuit à la masse ou circuit ouvert'
      es: 'Cortocircuito a masa o circuito abierto'
      de: 'Kurzschluss an Masse oder Stromkreis offen'
      pl: 'Zwarcie do masy lub przerwa'
      hu: 'Rövidzárlat a testen vagy megszakadt áramkör'
    0x15:
      en: 'Short circuit to positive or open circuit'
      fr: 'Court-circuit au plus ou circuit ouvert'
      es: 'Cortocircuito al positivo o circuito abierto'
      de: 'Kurzschluss an Plus oder Unterbrechung'
      pl: 'Zwarcie do plusa lub przerwa w obwodzie'
      hu: 'Pozitív zárlat vagy áramköri szakadás'
    0x16:
      en: 'Voltage too low'
      fr: 'Tension trop basse'
      es: 'Tensión demasiado baja'
      de: 'Spannung zu niedrig'
      pl: 'Za niskie napiecie'
      hu: 'Túl alacsony feszültség'
    0x17:
      en: 'Voltage too high'
      fr: 'Tension trop élevée'
      es: 'Tensión demasiado elevada'
      de: 'Spannung zu hoch'
      pl: 'Zbyt wysokie napięcie'
      hu: 'Túlságosan magas feszültség'
    0x54:
      en: 'No configuration'
      fr: 'Absence de télécodage'
      es: 'Ausencia de telecodificado'
      de: 'Keine Ferncodierung vorhanden'
      pl: 'Brak telekodowania'
      hu: 'Távkódolás hiánya'
    0x55:
      en: 'Not configured'
      fr: 'Non configuré'
      es: 'No configurado'
      de: 'Nicht konfiguriert'
      pl: 'Nieskonfigurowany'
      hu: 'Nincs konfigurálva'
    0x62:
      en: 'Lack of coherence of the signal'
      fr: 'Incohérence du signal'
      es: 'Incoherencia de la señal'
      de: 'Unplausibilität des Signals'
      pl: 'Brak spójności sygnału'
      hu: 'Jel eltérése'
    0x64:
      en: 'Signal not coherent'
      fr: 'Signal incohérent'
      es: 'Señal incoherente'
      de: 'Signal unplausibel'
      pl: 'Sygnał niespójny'
      hu: 'Nem koherens jel'
    0x81:
      en: 'Data received invalid'
      fr: 'Donnée reçue invalide'
      es: 'Dato recibido invalidado'
      de: 'Empfangene Information ungültig'
      pl: 'Nieprawidłowe odebrane dane'
      hu: 'Érvénytelen vett érték'
    0x87:
      en: 'Missing information'
      fr: 'Informations manquantes'
      es: 'Informaciones que faltan'
      de: 'Fehlende Informationen'
      pl: 'Brakujące informacje'
      hu: 'Hiányzó információk'
    0x88:
