ioctl: 0xD670
name: 'CHECK_PANORAMIC_VISUAL_ASSISTANCE_FUNCTION'
display_name:
  en: 'Check of the panoramic visual assistance function'
  fr: 'Contrôle de la fonction d''aide visuelle panoramique'
  es: 'Control de la función de ayuda visual panorámica'
  de: 'Kontrolle der Funktion Rundumsichtassistent'
  pl: 'Kontrola funkcji pomocy wizualnej panoramicznej'
  hu: 'A panoráma látás segítő funkció ellenőrzése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

tests:
  - display_name:
      en: 'Check of the panoramic visual assistance function'
      fr: 'Contrôle de la fonction d''aide visuelle panoramique'
      es: 'Control de la función de ayuda visual panorámica'
      de: 'Kontrolle der Funktion Rundumsichtassistent'
      pl: 'Kontrola funkcji pomocy wizualnej panoramicznej'
      hu: 'A panoráma látás segítő funkció ellenőrzése'
    max_duration_ms: 5000
  - display_name:
      en: 'Check of the panoramic view'
      fr: 'Contrôle de la vue panoramique'
      es: 'Control de la vista panorámica'
      de: 'Kontrolle der Panoramaansicht'
      pl: 'Kontrola widoku panoramicznego'
      hu: 'A panoráma nézet ellenőrzése'
    max_duration_ms: 5000
  - display_name:
      en: 'Check of the panoramic front view'
      fr: 'Contrôle de la vue avant panoramique'
      es: 'Control de la vista delantera panorámica'
      de: 'Kontrolle der Panoramaansicht vorn'
      pl: 'Kontrola przedniego widoku panoramicznego'
      hu: 'Az első panoráma nézet ellenőrzése'
    max_duration_ms: 5000
  - display_name:
      en: 'Check of the panoramic rear view'
      fr: 'Contrôle de la vue arrière panoramique'
      es: 'Control de la vista trasera panorámica'
      de: 'Kontrolle der Panoramaansicht hinten'
      pl: 'Kontrola tylnego widoku panoramicznego'
      hu: 'A hátsó panoráma nézet ellenőrzése'
    max_duration_ms: 5000
  - display_name:
      en: 'Check of the standard view'
      fr: 'Contrôle de la vue standard'
      es: 'Control de la vista estándar'
      de: 'Kontrolle der Standardansicht'
      pl: 'Kontrola widoku standardowego'
      hu: 'A szabvány nézet ellenőrzése'
    max_duration_ms: 5000
  - display_name:
      en: 'Check of the zoom view'
      fr: 'Contrôle de la vue zoom'
