  pl: 'Obecność małych liter w wprowadzonym numerze seryjnym samochodu (VIN). UWAGA : numer seryjny pojazdu (VIN) powinien zawsze składać się z dużych liter.'
  hu: 'Kisbetűk jelenléte a gépjármű megadott szériaszámában (VIN). FIGYELEM : A gépjármű szériaszámának (VIN) mindig nagybetűkből kell lennie.'
