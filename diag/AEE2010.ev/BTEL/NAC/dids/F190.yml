comment:
  en: 'Presence of lower case letters in the VIN entered. WARNING : the VIN of a vehicle must always consist of upper case letters.'
  fr: 'Présence de lettres en minuscule dans le numéro de série du véhicule (VIN) saisi. ATTENTION : le numéro de série d''un véhicule (VIN) doit toujours être composé de lettres en majuscule.'
