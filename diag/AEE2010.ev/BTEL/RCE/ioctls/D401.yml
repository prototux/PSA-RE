ioctl: 0xD401
name: 'ALL_THE_SPEAKERS'
display_name:
  en: 'All the speakers'
  fr: 'Tous les haut-parleurs'
  es: 'Todos los altavoces'
  de: 'Alle Lautsprecher'
  pl: 'Wszystkie głośniki'
  hu: 'Összes hangszóró'
controls:
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  DRIVINGTIME:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x02

  SETPOINT_1:
    bits: '3.7-3.0'
    type: 'enum'

  SETPOINT_2:
    bits: '4.7-4.0'
    type: 'enum'

  SETPOINT_3:
    bits: '5.7-5.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'All the speakers'
      fr: 'Tous les haut-parleurs'
      es: 'Todos los altavoces'
      de: 'Alle Lautsprecher'
      pl: 'Wszystkie głośniki'
      hu: 'Összes hangszóró'
    max_duration_ms: 2000
  - display_name:
      en: 'Front RH speaker'
      fr: 'Haut-parleur avant droit'
      es: 'Altavoz delantero derecho'
      de: 'Lautsprecher vorne rechts'
      pl: 'Prawy przedni głośnik'
      hu: 'Jobb első hangszóró'
    max_duration_ms: 2000
  - display_name:
      en: 'Front LH speaker'
      fr: 'Haut-parleur avant gauche'
      es: 'Altavoz delantero izquierdo'
      de: 'Lautsprecher vorne links'
      pl: 'Lewy przedni głośnik'
      hu: 'Bal első hangszóró'
    max_duration_ms: 2000
  - display_name:
      en: 'Rear right speaker'
      fr: 'Haut-parleur arrière droit'
      es: 'Altavoz trasero derecho'
      de: 'Lautsprecher hinten rechts'
      pl: 'Prawy tylny glośnik'
      hu: 'Jobb hátsó hangszóró'
    max_duration_ms: 2000
  - display_name:
      en: 'Left hand rear speaker'
      fr: 'Haut-parleur arrière gauche'
      es: 'Altavoz trasero izquierdo'
      de: 'Lautsprecher hinten links'
      pl: 'Lewy tylny glosnik'
      hu: 'Bal hátsó hangszóró'
    max_duration_ms: 2000
