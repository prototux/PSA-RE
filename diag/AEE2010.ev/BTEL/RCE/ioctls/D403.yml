ioctl: 0xD403
name: 'BRIGHTNESS_DISPLAY'
display_name:
  en: 'Brightness of the display'
  fr: 'Luminosité de l''afficheur'
  es: 'Luminosidad de la pantalla'
  de: 'Helligkeit des Displays'
  pl: 'Jasność wyświetlacza'
  hu: 'A kijelző fényereje'
controls:
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  DRIVINGTIME:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_1:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Brightness of the display'
      fr: 'Luminosité de l''afficheur'
      es: 'Luminosidad de la pantalla'
      de: 'Helligkeit des Displays'
      pl: 'Jasność wyświetlacza'
      hu: 'A kijelző fényereje'
    max_duration_ms: 1000
  - display_name:
      en: 'Switching on of the screen'
      fr: 'Allumage de l''écran'
      es: 'Iluminación de la pantalla'
      de: 'Einschaltung des Bildschirms'
      pl: 'Włączenie ekranu'
      hu: 'A képernyő kigyulladása'
    max_duration_ms: 5000
  - display_name:
      en: 'Switching off of the screen'
      fr: 'Extinction de l''écran'
      es: 'Extinción de la pantalla'
      de: 'Ausschaltung des Bildschirms'
      pl: 'Wygaszenie ekranu'
      hu: 'A képernyő kialvása'
    max_duration_ms: 5000
