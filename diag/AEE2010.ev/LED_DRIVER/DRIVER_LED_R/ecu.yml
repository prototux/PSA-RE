node: 'LED_DRIVER'
model: 'DRIVER_LED_R'
display_name:
  en: 'LED headlamp driver (DRIVER_LED_R)'
  fr: 'Pilote de LED de projecteur (DRIVER_LED_R)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x5B7
    response_id: 0x577

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'
  0x60:
    en: 'Supplier session'
    fr: 'Session fournisseur'

resets:
  0x03:
    en: 'Soft reset'
    fr: 'Réinitialisation logicielle'

services: [0x10, 0x11, 0x14, 0x19, 0x22, 0x2E, 0x31, 0x3E]

tester_present:
  request: '3E 00'
  period_ms: 1000

identification:
  request: '22 F0 80'
  part_number: '1.7-5.0'
  comment:
    en: 'The ECU part number is in data bytes 1 to 5 of the answer to 22 F0 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 1 à 5 de la réponse à 22 F0 80 (DCB), elle donne la variante logicielle'

cars: ['D34', 'P2']

variants:
  D34_V1:
    parts: ['9820840680']
    cars: ['D34']
  D34_V2:
    parts: ['9822869180']
    cars: ['D34']
  P2JO_V1:
    parts: ['9829463880']
    cars: ['P2']
