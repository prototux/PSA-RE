        fr: 'Initialisation'
        es: 'Iniciación'
        de: 'Initialisierung'
        pl: 'Inicjacja'
        hu: 'Inicializálás'
      0x01:
        en: 'Partial triggering'
        fr: 'Réveil partiel'
        es: 'Despertador parcial'
        de: 'Teilaktivierung'
        pl: 'Częściowe przebudzenie'
        hu: 'Részleges ébresztés'
      0x02:
        en: 'Transitory status'
        fr: 'Etat transitoire'
        es: 'Estado transitorio'
        de: 'Übergangszustand'
        pl: 'Stan nieustalony'
        hu: 'Atmeneti állapot'
      0x03:
        en: 'Main triggering'
        fr: 'Réveil principal'
        es: 'Activación principal'
        de: 'Hauptaktivierung'
        pl: 'Przebudzenie główne'
        hu: 'Fő élesítés'
      0x04:
        en: 'Internal partial wake-up'
        fr: 'Réveil partiel interne'
