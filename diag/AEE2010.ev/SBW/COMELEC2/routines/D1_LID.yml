      en: 'Positioning of the gear selection actuator in neutral'
      fr: 'Positionnement de l''actionneur de sélection de rapport de vitesses au neutre'
      es: 'Colocación del accionador de selección de velocidades en neutro'
      de: 'Position des Wählstellglieds in Neutralstellung'
      pl: 'Ustawienie urzadzenia wykonawczego wyboru biegów w polozeniu neutralnym'
