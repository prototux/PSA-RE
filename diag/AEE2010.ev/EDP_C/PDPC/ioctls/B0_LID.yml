ioctl: 0xB0
name: 'CONTROL_REAR_LEFT_WINDOW'
display_name:
  en: 'Control of the rear left window'
  fr: 'Pilotage de la vitre arrière gauche'
  es: 'Pilotaje de la luna trasera izquierda'
  de: 'Steuerung der Scheibe hinten links'
  pl: 'Sterowanie tylnej lewej szyby'
  hu: 'Bal oldali hátsó ablak vezérlése'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants:
  - 'A51_*'
  - 'A58_*'
  - 'A88C_V1'
  - 'B7_*'
  - 'G95_*'
  - 'P8_*'
  - 'R8_*'
  - 'T7_*'
  - 'T9_V1'
  - 'T84_*'
  - 'W2_*'
  - 'X7RR_*'
  - 'X7_*'
  - 'X8_*'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

  MATRIX:
    bits: '2.7-2.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
