node: 'EDP_C'
model: 'BCLVR'
display_name:
  en: 'Driver door module (BCLVR)'
  fr: 'Electronique de porte conducteur (BCLVR)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x74B
    response_id: 0x64B
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'
  0x60:
    en: 'Supplier session'
    fr: 'Session fournisseur'

services: [0x10, 0x14, 0x19, 0x22, 0x27, 0x2F]

security_access:
  - level: 0x01
  - level: 0x03

identification:
  request: '22 F0 80'
  part_number: '8.7-12.0'
  comment:
    en: 'The ECU part number is in data bytes 8 to 12 of the answer to 22 F0 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 8 à 12 de la réponse à 22 F0 80 (DCB), elle donne la variante logicielle'

cars: ['X74', 'X8']

variants:
  X74_V1:
    parts: ['9817519380']
    cars: ['X74']
  X74_V2:
    parts: ['9818091680']
    cars: ['X74']
  X74_V3:
    parts: ['9818091780']
    cars: ['X74']
  X83_V1:
    parts: ['9817519380']
    cars: ['X8']
  X83_V2:
    parts: ['9818091680']
    cars: ['X8']
  X83_V3:
    parts: ['9818091780']
    cars: ['X8']
