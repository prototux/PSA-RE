did: 0xD440
name: 'AIR_INTAKE_MOTOR_POSITION'
display_name:
  en: 'Air intake motor position.'
  fr: 'Position du moteur d''entrée d''air.'
  es: 'Posición del motor de entrada de aire.'
  de: 'Position des Motors Lufteinlass.'
  pl: 'Pozycja silnika wlotu powietrza.'
  hu: 'Levegő belépő motor helyzete.'
comment:
  en: 'Position of the passenger compartment air recycling flap. Check that the recycling position is always located in an extreme position ("recycling" or "external air") for as long as there is no request to change its status.'
  fr: 'Position du volet de recyclage de l''air habitacle. Vérifier que la position de recyclage se trouve toujours dans une position extrême (" recyclage " ou " air extérieur ") tant que l''on ne demande pas de modification de l''état de celui-ci.'
  es: 'Posición de la mariposa de reciclaje del aire habitáculo. Verificar que la posición de reciclaje se encuentra siempre en una posición extrema ("reciclaje" o "aire exterior") mientras no hay demanda de modificación del estado de dicha posición.'
  de: 'Position der Umluftklappe Innenraum. Überprüfen, ob sich die Umluftposition immer noch in einer extremen Stellung ("Umluft" oder "Umgebungsluft") befindet, solange keine Veränderung des Zustands angefordert wird.'
  pl: 'Położenie przesłony recyrkulacji powietrza w kabinie. Sprawdzić czy położenie recyrkulacji znajduje się wciąż w położeniu skrajnym ("recyrkulacja" albo "powietrze z zewnątrz") dopóki nie żąda się zmiany jego stanu.'
  hu: 'Az utastéri levegő visszaforgató lapjának pozíciója. Ellenorizze, hogy a levego visszakeringtetés kapcsoló mindig egy szélso helyzetben legyen ("visszakeringtetés" vagy "külso levego") ameddig annak állapotváltozását nem kéri.'
kind: 'live'
access: 'read'
length: 1

