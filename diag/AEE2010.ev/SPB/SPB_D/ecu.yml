node: 'SPB'
model: 'SPB_D'
display_name:
  en: 'Pneumatic seat module (massage/lumbar) (SPB_D)'
  fr: 'Boitier pneumatique de siege (SPB_D)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x733
    response_id: 0x713
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'

services: [0x10, 0x22, 0x2F, 0x3E]

tester_present:
  request: '3E'
  period_ms: 1000

identification:
  request: '22 F0 80'
  part_number: '8.7-12.0'
  comment:
    en: 'The ECU part number is in data bytes 8 to 12 of the answer to 22 F0 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 8 à 12 de la réponse à 22 F0 80 (DCB), elle donne la variante logicielle'

cars: ['C84', 'P8', 'R8', 'X74', 'X8']

variants:
  C84C_V1:
    parts: ['9811343880']
    cars: ['C84']
  P8_V1:
    parts: ['9811343880']
    cars: ['P8']
  P8_V2:
    parts: ['9811343780']
    cars: ['P8']
  R8_V1:
    parts: ['9811343880']
    cars: ['R8']
  R8_V2:
    parts: ['9811343780']
    cars: ['R8']
  X74_V1:
    parts: ['9811343880']
    cars: ['X74']
  X74_V2:
    parts: ['9811343780']
    cars: ['X74']
  X83_V1:
    parts: ['9811343780']
    cars: ['X8']
