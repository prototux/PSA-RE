node: 'AVAS'
model: 'AVAS'
display_name:
  en: 'Pedestrian warning sound generator (AVAS)'
  fr: 'Generateur de son pour pietons (AVAS)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x5B0
    response_id: 0x5AF
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'

resets:
  0x03:
    en: 'Soft reset'
    fr: 'Réinitialisation logicielle'

services: [0x10, 0x11, 0x14, 0x19, 0x22, 0x27, 0x2E, 0x3E]

security_access:
  - level: 0x03
    algorithm: 'PSA_SEED_KEY'
    key: 'C504'

tester_present:
  request: '3E 00'
  period_ms: 1000

identification:
  request: '22 F0 80'
  part_number: '8.7-12.0'
  comment:
    en: 'The ECU part number is in data bytes 8 to 12 of the answer to 22 F0 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 8 à 12 de la réponse à 22 F0 80 (DCB), elle donne la variante logicielle'

cars: ['C84', 'D34', 'P2', 'P8', 'R8', 'X74']

variants:
  C84C_V1:
    parts: ['9825956180']
    cars: ['C84']
  D34_V1:
    parts: ['9825956180']
    cars: ['D34']
  P2JO_V1:
    parts: ['9825956180']
    cars: ['P2']
  P2_V1:
    parts: ['9825956180']
    cars: ['P2']
  P8_V1:
    parts: ['9825956180']
    cars: ['P8']
  R8_V1:
    parts: ['9825956180']
    cars: ['R8']
  X74_V1:
    parts: ['9825956180']
    cars: ['X74']
