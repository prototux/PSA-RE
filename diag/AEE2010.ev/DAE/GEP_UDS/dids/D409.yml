comment:
  en: 'The downgrade mode is active when the temperature of the electropump assembly is high. When the electropump assembly has cooled down, the downgrade mode is deactivated'
  fr: 'Le mode dégradé est actif lorsque la température du groupe électropompe est élevée. Lorsque le groupe éléctropompe est refroidi, le mode dérgadé se désactive'
  es: 'El modo degradado está activo cuando la temperatura del grupo electrobomba es elevada. Cuando el grupo electrobomba está refrigerado, el modo degradado se desactivado'
  de: 'Der Notbetrieb ist aktiv, wenn die Temperatur der Elektropumpengruppe hoch ist. Wenn die Elektropumpengruppe abgekühlt ist, deaktiviert sich der Notbetrieb'
  pl: 'Tryb zdegradowany jest aktywny gdy temperatura grupy elektropompy jest wysoka. Gdy grupa elektropompy jest ochłodzona, tryb zdegradowany dezaktywuje się'
  hu: 'A csökkentett üzemmód akkor aktív, amikor az elektromos szivattyúegység hőmérséklete megemelkedett. Amikor az elektromos szivattyúegység lehűlt, a csökkentett üzemmód semlegesítődik'
