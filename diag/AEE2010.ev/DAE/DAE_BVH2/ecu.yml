node: 'DAE'
model: 'DAE_BVH2'
display_name:
  en: 'Electric power steering (DAE_BVH2)'
  fr: 'Direction assistee electrique (DAE_BVH2)'
protocols: ['KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'KWP-PSA2000'
    request_id: 0x6B5
    response_id: 0x695
  - transport: 'can-tp'
    protocol: 'KWP-PSA2000'
    request_id: 0x6B5
    response_id: 0x695
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
