        hu: 'A motoros hajtású hátsó csomagtéri ajtó teleszkóprugóiba beépített egy vagy több érzékelők által észlelt akadály'
      0x03:
        en: 'Unspecified status'
        fr: 'Etat indéterminé'
        es: 'Estado indeterminado'
        de: 'Unbestimmter Zustand'
        pl: 'Stan nieokreślony'
        hu: 'Meghatározatlan állapot'

