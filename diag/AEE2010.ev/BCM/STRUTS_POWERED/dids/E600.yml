        es: 'Sin mando'
        de: 'Keine Steuerung'
        pl: 'Brak sterowania'
        hu: 'Nincs vezérlés'
      0x01:
        en: 'Closing'
        fr: 'Fermeture'
        es: 'Cierre'
        de: 'Schließen'
        pl: 'Zamknięcie'
