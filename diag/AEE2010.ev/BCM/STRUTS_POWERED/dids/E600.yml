      en: 'Status of the thermal protection of the motorised tailgate gas struts'
      fr: 'Etat de la protection thermique des équilibreurs du volet arrière motorisé'
      es: 'Estado de la protección térmica de los equilibradores de portón trasero motorizado'
      de: 'Zustand des thermischen Schutzes der Aufsteller der motorisierten Heckklappe'
      pl: 'Stan zabezpieczenia termicznego siłowników tylnej klapy z napędem'
      hu: 'Motoros hajtású hátsó csomagtéri ajtó teleszkóprugók hővédelmének állapota'
    type: 'bool'
    values:
      0x00:
        en: 'Thermal protection deactivated'
        fr: 'Protection thermique désactivée'
        es: 'Protección térmica desactivada'
        de: 'Thermischer Schutz deaktiviert'
        pl: 'Zabezpieczenie termiczne wyłączone'
