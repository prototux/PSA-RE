        hu: 'Mozgás leállítás vagy letiltás : motor beindítása'
      0x05:
        en: 'Stopping or prohibiting of movement : Presence of a trailer'
        fr: 'Arrêt ou interdiction de manoeuvre : Présence d''une remorque'
        es: 'Detención o prohibición de la maniobra : Presencia de un remolque'
        de: 'Anhalten oder Unterbindung der Bewegung : Anhängerkupplung vorhanden'
