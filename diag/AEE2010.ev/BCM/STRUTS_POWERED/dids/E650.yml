      de: 'Gespeicherte Ursache 1 für Anhalten oder Unterbindung der Bewegung der motorisierten Heckklappe'
      pl: 'Zapamiętany przypadek 1 zatrzymania lub zakazu ruchu klapy tylnej z napędem'
      hu: 'Motoros hajtású hátsó csomagtéri ajtó mozgás letiltás vagy leállás 1 memorizált ok'
    type: 'enum'
    values:
      0x00:
        en: 'No cause memorised'
        fr: 'Aucune cause mémorisée'
        es: 'Ninguna causa memorizada'
        de: 'Keine Ursache gespeichert'
        pl: 'Żadna przyczyna nie jest zapamiętana'
        hu: 'Nincs memorizált ok'
      0x01:
        en: 'Stopping or prohibiting of movement : Vehicle speed too high or not valid'
        fr: 'Arrêt ou interdiction de manoeuvre : Vitesse du véhicule trop élevée ou invalide'
        es: 'Detención o prohibición de la maniobra : Velocidad del vehículo demasiado elevada o no válida'
        de: 'Anhalten oder Unterbindung der Bewegung : Geschwindigkeit des Fahrzeugs zu hoch oder ungültig'
        pl: 'Zatrzymanie lub zakaz manewru : Prędkość pojazdu zbyt duża albo nieprawidłowa'
        hu: 'Mozgás leállítás vagy letiltás : Gépjármű sebessége túlságosan nagy vagy érvénytelen'
      0x02:
        en: 'Prohibiting of movement : 10 cycles of motorised opening/closing of the motorised tailgate carried out in energy economy mode'
        fr: 'Interdiction de manoeuvre : 10 cycles d''ouverture / fermeture motorisés du volet arrière motorisé effectués en mode économie d''énergie actif'
        es: 'Prohibición de la maniobra : 10 ciclos de apertura/cierre motorizados del portón trasero motorizado efectuados en modo economía de energía activado'
        de: 'Unterbindung der Bewegung : 10 motorisierte Öffnungs-/Schließzyklen der motorisierten Heckklappe im aktiven Energiesparmodus durchgeführt'
        pl: 'Zakaz manewru : 10 cykle otwierania / zamykania silnikiem klapy tylnej napędzanej wykonane przy aktywnym trybie oszczędzania energii'
        hu: 'Mozgás letiltás : Motoros hajtású hátsó csomagtéri ajtó 10 motoros hajtású nyitási és zárási ciklusa aktív energiatakarékos üzemmódban elvégezve'
      0x03:
        en: 'Stopping or prohibiting of movement : Motorisation of the motorised tailgate inhibited by the user'
        fr: 'Arrêt ou interdiction de manoeuvre : Motorisation du volet arrière motorisé inhibée par l''utilisateur'
        es: 'Detención o prohibición de la maniobra : Motorización del portón trasero motorizado inhibida por el usuario'
        de: 'Anhalten oder Unterbindung der Bewegung : Motorantrieb der motorisierten Heckklappe durch den Benutzer deaktiviert'
        pl: 'Zatrzymanie lub zakaz manewru : Silnik klapy tylnej napędzanej zablokowany przez użytkownika'
        hu: 'Mozgás leállítás vagy letiltás : Motoros hajtású hátsó csomagtéri ajtó hajtása vezető által letiltva'
      0x04:
        en: 'Stopping or prohibiting of movement : starting of the engine'
        fr: 'Arrêt ou interdiction de manoeuvre : Démarrage du moteur thermique'
        es: 'Detención o prohibición de la maniobra : puesta en marcha del motor térmico'
        de: 'Anhalten oder Unterbindung der Bewegung : Anlassen des Verbrennungsmotors'
