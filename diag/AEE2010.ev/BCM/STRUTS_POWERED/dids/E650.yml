      0x08:
        en: 'Off : Detection of an obstacle by one or more of the sensors integrated in the motorised tailgate gas struts on closing the motorised tailgate'
        fr: 'Arrêt : détection d''un obstacle à la fermeture du volet arrière motorisé par un ou plusieurs des capteurs intégrés aux équilibreurs du volet arrière motorisé'
