  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of closing of the motorised tailgate'
      fr: 'Pilotage d''une fermeture du volet arrière motorisé'
      es: 'Pilotaje del cierre del portón trasero motorizado'
      de: 'Steuerung eines Schließens der motorisierten Heckklappe'
      pl: 'Sterowanie zamykaniem klapy tylnej napędzanej'
      hu: 'Motoros hajtású hátsó csomagtéri ajtó egy zárásának vezérlése'
