  - display_name:
      en: 'Control of opening of the motorised tailgate'
      fr: 'Pilotage d''une ouverture du volet arrière motorisé'
      es: 'Pilotaje de la apertura del portón trasero motorizado'
      de: 'Steuerung eines Öffnens der motorisierten Heckklappe'
      pl: 'Sterowanie otwieraniem klapy tylnej napędzanej'
