ioctl: 0xD420
name: 'CONTROL_MOTORISED_TAILGATE_CLOSING_BUTTON_LED'
display_name:
  en: 'Control of the motorised tailgate closing button LED (Button on the inside of the motorised tailgate)'
  fr: 'Pilotage de la LED du bouton poussoir de fermeture du volet arrière motorisé (Bouton poussoir à l''intérieur du volet arrière motorisé)'
  es: 'Pilotaje del LED del interruptor de cierre del portón trasero motorizado (Interruptor en el interior del portón trasero motorizado)'
  de: 'Ansteuerung der LED der Drucktaste Schließen der motorisierten Heckklappe (Drucktaste im Innern der motorisierten Heckklappe)'
  pl: 'Sterowanie diody LED przycisku zamykania klapy tylnej napędzanej (Przycisk wewnątrz klapy tylnej z napędem)'
  hu: 'Motoros hajtású hátsó csomagtéri ajtó záró nyomógomb LED vezérlése (A motoros hajtású hátsó csomagtéri ajtó belső nyomógombja)'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the motorised tailgate closing button LED (Button on the inside of the motorised tailgate)'
      fr: 'Pilotage de la LED du bouton poussoir de fermeture du volet arrière motorisé (Bouton poussoir à l''intérieur du volet arrière motorisé)'
      es: 'Pilotaje del LED del interruptor de cierre del portón trasero motorizado (Interruptor en el interior del portón trasero motorizado)'
      de: 'Ansteuerung der LED der Drucktaste Schließen der motorisierten Heckklappe (Drucktaste im Innern der motorisierten Heckklappe)'
      pl: 'Sterowanie diody LED przycisku zamykania klapy tylnej napędzanej (Przycisk wewnątrz klapy tylnej z napędem)'
      hu: 'Motoros hajtású hátsó csomagtéri ajtó záró nyomógomb LED vezérlése (A motoros hajtású hátsó csomagtéri ajtó belső nyomógombja)'
    max_duration_ms: 5000
