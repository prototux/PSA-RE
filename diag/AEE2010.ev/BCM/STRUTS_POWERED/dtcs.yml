'B174E':
  raw: '974E'
  display_name:
    en: 'Motorised tailgate lock closing to second notch status switch signal fault'
    fr: 'Défaut du signal du contacteur d''état de fermeture au deuxième cran de la serrure du volet arrière motorisé'
    es: 'Defecto de la señal del contactor de estado de cierre en la segunda muesca de la cerradura de portón trasero motorizado'
    de: 'Fehler des Signals des Kontaktschalters Schließzustand in der zweiten Raste des Schlosses der elektrischen Heckklappe'
    pl: 'Usterka sygnału zestyku stanu zamknięcia na drugi zaczep zamka klapy tylnej z napędem'
    hu: 'A motoros csomagtartófedél zárszerkezet második kattanásra történő zárás állapotérzékelő jelének hibája'
  clues:
    en: 'Fault code B174E 11 : Ignore the fault code if it is at the intermittent status This fault code may be reported as intermittent if the customer guides the motorised opening movement of the tailgate with his hand'
    fr: 'Code défaut B174E 11 : Ne pas tenir compte du code défaut lorsqu''il est à l''état fugitif Ce code défaut peut remonter en fugitif si le client accompagne de la main le mouvement d''ouverture motorisée du volet arrière'
    es: 'Código defecto B174E 11 : No tener en cuenta el código defecto cuando está en estado fugitivo Este código defecto puede enviarse en fugitivo si el cliente acompaña con la mano el movimiento de apertura motorizada del portón trasero'
    de: 'Fehlercode B174E 11 : Den Fehlercode nicht beachten, wenn er im Zustand vorübergehend ist Dieser Fehlercode kann als vorübergehend gemeldet werden, wenn der Kunde die motorisierte Öffnungsbewegung der Heckklappe mit der Hand begleitet'
    pl: 'Kod błędu B174E 11 : Nie brać pod uwagę kodu usterki, gdy ma ona charakter przejściowy Ten kod usterki może pojawiać się jako przejściowy, jeżeli klient wspomaga ręką ruch otwierania tylnej klapy z napędem'
    hu: 'Hibakód B174E 11 : Ne vegye figyelembe a hibakódot, ha az átmeneti állapotú Ezen hibakód átmenetiként jelenhet meg, ha az ügyfél kezével kíséri a hátsó csomagtéri ajtó motoros hajtású nyitó mozgását'
