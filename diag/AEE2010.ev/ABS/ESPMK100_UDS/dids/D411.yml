did: 0xD411
name: 'GEAR_ENGAGED_AUTOMATIC_GEARBOX_INFORMATION'
display_name:
  en: 'Gear engaged (automatic gearbox information)'
  fr: 'Rapport de boîte de vitesses engagé (information BVA)'
  es: 'Velocidad de caja de cambios seleccionada (información CVA)'
  de: 'Eingelegter Getriebegang (Information Automatikgetriebe)'
  pl: 'Włączone przełożenie skrzynki biegów (informacja automatyczna skrzynia biegów)'
  hu: 'Kiválasztott sebességváltó fokozat (automatikus sebességváltó adatok)'
comment:
  en: 'Information giving the gear ratio engaged. This parameter should only be taken into account on automatic gearboxes.'
  fr: 'Information permettant de savoir quel est le rapport de vitesse enclenché. Ce paramètre n''est à prendre en compte que sur les boîtes de vitesses automatiques.'
  es: 'Información que permite saber cúal es la velocidad introducida. Este parámetro solo debe tenerse en cuenta en las cajas de velocidades automáticas.'
  de: 'Information zum eingelegten Gang. Dieser Parameter braucht nur bei Automatikgetrieben beachtet zu werden.'
  pl: 'Informacja pozwalająca wiedzieć, jakie przełożenie jest włączone. Ten parametr należy uwzględniać wyłącznie w przypadku automatycznych skrzyń biegów.'
  hu: 'Információ, amely biztosítja a kapcsolt sebességfokozat megismerését. Ezen paraméter csupán automata sebességváltókon veendő figyelembe.'
kind: 'live'
access: 'read'
length: 1
