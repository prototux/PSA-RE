did: 0xD472
name: 'VEHICLE_LOAD_ESTIMATED_TYRE_UNDER_INFLATION'
display_name:
  en: 'Vehicle load estimated by the tyre under-inflation detection function'
  fr: 'Charge du véhicule estimée par la fonction détection de sous-gonflage'
  es: 'Carga del vehículo calculada a través de la función de detección de subinflado'
  de: 'Von der Funktion Reifendrucküberwachung geschätzte Ladung des Fahrzeugs'
  pl: 'Obciążenie samochodu szacowane przez funkcję wykrywania niedopompowania'
  hu: 'A gépjármű, elégtelen gumiabroncsnyomás észlelése funkció által megbecsült terhelése'
comment:
  en: 'The parameter measurement is only applicable with direct tyre under-inflation detection'
  fr: 'Cette mesure paramètre est uniquement applicable avec une détection de sous-gonflage directe'
  es: 'Esta medida de parámetro solo se puede aplicar con una detección de subinflado directa'
  de: 'Diese Parametermessung ist nur mit einer direkten Reifendrucküberwachung anwendbar'
  pl: 'Ten pomiar parametru znajduje zastosowanie wyłącznie z bezpośrednim wykrywaniem niedopompowania kół'
  hu: 'Ezen paramétermérés csupán egy közvetlen elégtelen gumiabroncsnyomás észlelés esetén alkalmazható'
