params:
  VEHICLE_LOAD_ESTIMATED_TYRE_UNDER_INFLATION:
    bits: '1.2-1.0'
    comment:
      en: 'Vehicle load estimated by the tyre under-inflation detection function'
      fr: 'Charge du véhicule estimée par la fonction détection de sous-gonflage'
      es: 'Carga del vehículo calculada a través de la función de detección de subinflado'
      de: 'Von der Funktion Reifendrucküberwachung geschätzte Ladung des Fahrzeugs'
      pl: 'Obciążenie samochodu szacowane przez funkcję wykrywania niedopompowania'
      hu: 'A gépjármű, elégtelen gumiabroncsnyomás észlelése funkció által megbecsült terhelése'
    type: 'enum'
    values:
      0x00:
        en: 'No change in charge (Load between -33 and +33 % of the maximum authorised load)'
        fr: 'Pas de changement de charge (Charge comprise entre -33 et +33 % de la charge maximale autorisée)'
        es: 'No cambia de carga (Carga comprendida entre el -33 y el +33% de la carga máxima autorizada)'
        de: 'Keine Änderung der Last (Ladung zwischen -33 und +33 % der maximal zulässigen Ladung)'
        pl: 'Brak zmiany obciążenia (Obciążenie zawarte pomiędzy -33 i +33 % maksymalnego dopuszczalnego obciążenia)'
        hu: 'Nincs terhelésmódosítás (A megengedett maximális terhelés -33 és +33 % közötti terhelés)'
      0x01:
        en: 'Average charge increase (Load between 33 and 66 % of the maximum authorised load)'
        fr: 'Augmentation moyenne de charge (Charge comprise entre 33 et 66 % de la charge maximale autorisée)'
        es: 'Aumento promedio de carga (Carga comprendida entre el 33 y el 66% de la carga máxima autorizada)'
        de: 'Durchschnittliche Erhöhung der Last (Ladung zwischen 33 und 66 % der maximal zulässigen Ladung)'
        pl: 'Średnie zwiększenie ładowania (Obciążenie zawarte pomiędzy 33 i 66 % maksymalnego dopuszczalnego obciążenia)'
        hu: 'Átlagos terhelésnövekedés (A megengedett maximális terhelés 33 és 66 % közötti terhelés)'
      0x02:
        en: 'Total charge increase (Load between 66 and 100 % of the maximum authorised load)'
        fr: 'Augmentation totale de charge (Charge comprise entre 66 et 100 % de la charge maximale autorisée)'
        es: 'Aumento total de carga (Carga comprendida entre el 66 y el 100% de la carga máxima autorizada)'
        de: 'Gesamterhöhung der Last (Ladung zwischen 66 und 100 % der maximal zulässigen Ladung)'
        pl: 'Całkowite zwiększenie ładowania (Obciążenie zawarte pomiędzy 66 i 100 % maksymalnego dopuszczalnego obciążenia)'
        hu: 'A töltés teljes növekedése (A megengedett maximális terhelés 66 és 100 % közötti terhelés)'
      0x03:
        en: 'Average charge reduction (Load between -66 and -33 % of the maximum authorised load)'
        fr: 'Diminution moyenne de charge (Charge comprise entre -66 et -33 % de la charge maximale autorisée)'
        es: 'Disminución media de carga (Carga comprendida entre el -66 y el -33% de la carga máxima autorizada)'
        de: 'Durchschnittliche Verringerung der Last (Ladung zwischen -66 und -33 % der maximal zulässigen Ladung)'
        pl: 'Średnie zmniejszenie ładowania (Obciążenie zawarte pomiędzy -66 i -33 % maksymalnego dopuszczalnego obciążenia)'
        hu: 'Átlagos terheléscsökkentés (A megengedett maximális terhelés -66 és -33 % közötti terhelés)'
      0x04:
        en: 'Total reduction of the charge (Load between -100 and -66 % of the maximum authorised load)'
        fr: 'Diminution totale de la charge (Charge comprise entre -100 et -66 % de la charge maximale autorisée)'
        es: 'Disminución total de la carga (Carga comprendida entre el -100 y el -66% de la carga máxima autorizada)'
        de: 'Gesamtverringerung der Last (Ladung zwischen -100 und -66 % der maximal zulässigen Ladung)'
        pl: 'Całkowite zmniejszenie ładowania (Obciążenie zawarte pomiędzy -100 i -66 % maksymalnego dopuszczalnego obciążenia)'
        hu: 'A terhelés teljes csökkentése (A megengedett maximális terhelés -100 és -66 % közötti terhelés)'
      0x05:
        en: 'Calculation in progress'
        fr: 'Calcul en cours'
        es: 'Cálculo en curso'
        de: 'Berechnung im Gang'
        pl: 'Obliczenie w trakcie'
        hu: 'Számítás folyamatban'
      0x07:
        en: 'Signal not valid'
        fr: 'Signal invalide'
        es: 'Señal no válida'
        de: 'Ungültiges Signal'
        pl: 'Sygnał nieprawidłowy'
        hu: 'Érvénytelen jel'

