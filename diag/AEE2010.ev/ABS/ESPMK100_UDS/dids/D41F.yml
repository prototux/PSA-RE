did: 0xD41F
name: 'STEERING_WHEEL_ANGLE'
display_name:
  en: 'STEERING WHEEL ANGLE'
  fr: 'Angle volant'
  es: 'ÁNGULO VOLANTE'
  de: 'LENKWINKEL'
  pl: 'KĄT KIEROWN.'
  hu: 'KORMÁNYSZÖGHELYZET'
comment:
  en: 'For a vehicle without semi-automatic parking system. The steering wheel angle value provided by the ESP ECU is reset to zero each time the ignition is switched off. The ESP ECU only provides a variation of the steering wheel angle. To reset the steering wheel angle information : Drive at a speed of more than 40 km/h.'
  fr: 'Pour un véhicule sans système de stationnement semi-automatique. La valeur d''angle volant de direction fournie par le calculateur ESP est recalée à zéro à chaque coupure du contact. Le calculateur ESP ne fournit qu''une variation de l''angle volant de direction. Pour recaler l''information angle volant de direction : Effectuer un roulage à une vitesse supérieure à 40 km/h.'
  es: 'Para un vehículo sin sistema de estacionamiento semiautomático. El valor de ángulo volante de dirección facilitado por el calculador ESP se reajusta a cero cada vez que se corta el contacto. El calculador de ESP solo proporciona una variación del ángulo volante de dirección. Para reajustar la información de ángulo volante de dirección : Circular a una velocidad superior a 40 km/h.'
  de: 'Für ein Fahrzeug ohne halbautomatisches Einparksystem. Der vom ESP-Steuergerät gelieferte Wert des Lenkradwinkels wird bei jedem Ausschalten der Zündung auf Null zurückgesetzt. Das ESP-Steuergerät liefert nur eine Änderung des Lenkradwinkels. Zum Zurücksetzen der Information Lenkradwinkel : Eine Fahrt mit einer Geschwindigkeit von mehr als 40 km/h durchführen.'
  pl: 'Dla pojazdu bez półautomatycznego systemu parkowania. Wartość kąta obrotu koła kierownicy dostarczana przez kalkulator ESP jest ustawiana na zero przy każdym wyłączeniu zapłonu. Kalkulator ESP dostarcza wyłącznie zmianę kąta obrotu koła kierownicy. W celu ustawienia informacji o kącie obrotu koła kierownicy : Wykonać jazdę z prędkością przekraczającą 40 km/h.'
  hu: 'Egy félautomata parkolási rendszer nélküli gépkocsi számára. Az ESP computer által szállított kormánykerékszög érték minden gyújtáslekapcsoláskor újból nullázásra kerül. Az ESP computer csupán egy kormánykerékszög változatot szállít. A kormánykerékszög információ újbóli beállítása érdekében : Tegyen egy próbautat 40 km/h feletti sebességgel.'
kind: 'live'
