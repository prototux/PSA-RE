did: 0xD424
name: 'GEAR_ENGAGED_PILOTED_MANUAL_GEARBOX_INFORMATION'
display_name:
  en: 'Gear engaged (piloted manual gearbox information)'
  fr: 'Rapport de boîte de vitesses engagé (information boîte de vitesses manuelle pilotée)'
  es: 'Velocidad de caja de cambios seleccionada (información caja de velocidades manual pilotada)'
  de: 'Eingelegter Getriebegang (Information automatisiertes Schaltgetriebe)'
  pl: 'Włączone przełożenie skrzynki biegów (informacja mechanicznej sterowanej skrzyni biegów)'
  hu: 'Kiválasztott sebességváltó fokozat (a félautomata sebességváltó információi)'
comment:
  en: 'Information giving the gear ratio engaged. This parameter is only valid for the piloted manual gearbox.'
  fr: 'Information permettant de savoir quel est le rapport de vitesse enclenché. Ce paramètre est valable uniquement pour la boîte de vitesses manuelle pilotée.'
  es: 'Información que permite saber cúal es la velocidad introducida. Este parámetro es válido sólo para la caja de velocidades manual pilotada.'
  de: 'Information zum eingelegten Gang. Dieser Parameter ist nur für das automatisierte Schaltgetriebe gültig.'
  pl: 'Informacja pozwalająca wiedzieć, jakie przełożenie jest włączone. Ten parametr jest ważny wyłącznie dla ręcznej sterowanej skrzyni biegów.'
  hu: 'Információ, amely biztosítja a kapcsolt sebességfokozat megismerését. Ezen paraméter csupán a vezérelt mechanikus sebességváltó esetében érvényes.'
kind: 'live'
access: 'read'
length: 1

