      de: 'Kalibrierung des Längsbeschleunigungsgebers'
      pl: 'Kalibracja czujnika przyspieszenia wzdłużnego'
      hu: 'Hosszirányú gyorsulásérzékelő kalibrálása'
  - display_name:
      en: 'Clutch pedal sensor calibration'
