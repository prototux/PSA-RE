routine: 0xDF01
name: 'LONGITUDINAL_ACCELERATION_SENSOR_CALIBRATION'
display_name:
  en: 'Longitudinal acceleration sensor calibration'
  fr: 'Calibration du capteur d''accélération longitudinale'
  es: 'Calibración del captador de aceleración longitudinal'
  de: 'Kalibrierung des Längsbeschleunigungsgebers'
  pl: 'Kalibracja czujnika przyspieszenia wzdłużnego'
  hu: 'Hosszirányú gyorsulásérzékelő kalibrálása'
control: ['start', 'stop', 'results']

params:
  ACTIVATIONTYPE:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0xFF

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x02:
        en: 'Longitudinal acceleration sensor calibrated'
        fr: 'Capteur d''accélération longitudinale calibré'
        es: 'Captador de aceleración longitudinal calibrado'
        de: 'Längsbeschleunigungssensor kalibriert'
        pl: 'Czujnik przyśpieszenia podłużnego skalibrowany'
        hu: 'Kalibrált hosszirányú gyorsulásérzékelő'
      0x03:
        en: 'The calibration is complete but a problem has occurred. three cases arise a fault linked with the longitudinal acceleration sensor has been returned by the ECU. rectify this fault first and restart the calibration of the longitudinal acceleration sensor. The user started the calibration of the longitudinal acceleration sensor without observing the recommendations.restart the calibration taking care to observe these recommendations. the user started the calibration of the longitudinal acceleration sensor while the vehicle was not stationary. restart the calibration of the longitudinal acceleration sensor ensuring that the vehicle is stationary.'
        fr: 'La calibration est terminée mais un problème est survenu. trois cas se présentent un défaut lié au capteur d''accélération longitudinale a été remonté par le calculateur. traitez ce défaut en priorité et relancez la calibration du capteur d''accélération longitudinale. L''utilisateur a lancé la calibration du capteur d''accélération longitudinale sans respecter les préconisations prescrites.relancez la calibration en veillant à respecter ces préconisations. l''utilisateur a lancé la calibration du capteur d''accélération longitudinale alors que le véhicule n''était pas à l''arrêt. relancez la calibration du capteur d''accélération longitudinale en veillant à ce que le véhicule soit à l''arrêt.'
        es: 'La calibración ha finalizado pero se ha producido un problema. se presentan tres casos el calculador ha remontado un defecto ligado al captador de aceleración longitudinal. trate este defecto en prioridad y vuelva a lanzar la calibración del captador de aceleración longitudinal. El usuario ha lanzado la calibración del captador de aceleración longitudinal sin respetar las preconizaciones prescritas.vuelva a lanzar la calibración cuidando el respeto de estas recomendaciones. el usuario ha lanzado la calibración del captador de aceleración longitudinal en tanto que el vehículo no estaba parado. vuelva a lanzar la calibración del captador de aceleración longitudinal cuidando que el vehículo esté parado.'
        de: 'Die Kalibrierung ist beendet, aber ein Problem ist aufgetreten. drei Fälle sind möglich ein Fehler in Verbindung mit dem Längsbeschleunigungsgeber wurde vom Steuergerät gemeldet. behandeln Sie diesen Fehler vorrangig und starten Sie die Kalibrierung des Längsbeschleunigungsgebers erneut. Der Benutzer hat die Kalibrierung des Lenkradwinkels gestartet, ohne die beschriebenen Vorsichtsmaßnahmen zu beachten.starten Sie die Kalibrierung erneut unter Beachtung dieser Vorgaben. der Benutzer hat die Kalibrierung des Längsbeschleunigungsgebers nicht bei stehendem Fahrzeug gestartet. starten Sie die Kalibrierung des Längsbeschleunigungsgebers erneut und achten Sie darauf, dass das Fahrzeug steht.'
        pl: 'Kalibracja jest zakończona ale wystąpił problem. wystąpiły trzy przypadki błąd związany z czujnikiem przyspieszenia wzdłużnego został odnotowany przez kalkulator. usunąć ten błąd w pierwszej kolejności i rozpocząć kalibrację czujnika przyspieszenia wzdłużnego. Uzytkownik wywolal kalibracje czujnika przyspieszenia podluznego nie przestrzegajac podanych zalecen.uruchomic kalibrację przestrzegając zaleceń. użytkownik uruchomił kalibrację czujnika przyspieszenia wzdłużnego podczas gdy pojazd nie został zatrzymany. uruchomic kalibrację pamiętając o wcześniejszym zatrzymaniu pojazdu.'
        hu: 'A kalibrálás befejeződött, de egy probléma lépett fel. három eset lehetséges a computer kijelzett egy, a hosszirányú gyorsulásérzékelővel kapcsolatos hibát. kezelje elöször ezt a hibát és indítsa újra a hosszirányú gyorsulásérzékelő kalibrálását. A felhasználó elindította a hosszirányú gyorsulás érzékelő kalibrálását anélkül, hogy az eloírt ajánlásokat megtartotta volna.indítsa újra a kalibrálását, vigyázva az előírások betartására nélkül indította el a hosszirányú gyorsulásérzékelő kalibrálását. a felhasználó úgy indította el a hosszirányú gyorsulásérzékelő kalibrálását, hogy közben a gépkocsi nem volt álló helyzetben. indítsa újra a hosszirányú gyorsulásérzékelő kalibrálását, vigyázva arra, hogy a gépkocsi legyen álló helyzetben.'
      0x04:
        en: 'Operation stopped by the operator (the report is not available)'
        fr: 'Opération arrêtée par l''opérateur (le compte-rendu n''est pas disponible)'
        es: 'Operación interrumpida por el usuario (el informe no está disponible)'
        de: 'Vorgang vom Techniker gestoppt (der Testbericht ist nicht verfügbar)'
        pl: 'Operacja zatrzymana przez operatora (sprawozdanie nie jest dostępne)'
        hu: 'A kezelő által leállított művelet (a meghibásodási jelentés nem áll rendelkezésre)'

tests:
  - display_name:
      en: 'Longitudinal acceleration sensor calibration'
