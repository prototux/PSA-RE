did: 0xD500
name: 'NUMBER_CD_PLAYER_RESETS'
display_name:
  en: 'Number of CD player resets'
  fr: 'Nombre de remise à zéro du lecteur CD'
  es: 'Número de puestas a cero del lector de CD'
  de: 'Anzahl Rückstellungen auf null des CD-Players'
  pl: 'Ilość zerowań czytnika CD'
  hu: 'CD-lejátszó nullázásának száma'
comment:
  en: 'This parameter defines the number of resets following an internal malfunction of the external CD player ECU (incrementation). This parameter is reset to zero if the value of the datum is higher than 255 or if faults U1F0A, U1F0F, U1F03 are recorded.'
  fr: 'Ce paramètre définit le nombre de remise à zéro, suite à un dysfonctionnement interne du calculateur lecteur CD externe (incrémentation). Ce paramètre est remis à zéro si la valeur de la donnée est supérieure à 255 ou si les défauts U1F0A, U1F0F, U1F03 sont remontés.'
  es: 'Este parámetro cliente define el número de puestas a cero tras un fallo de funcionamiento interno del calculador del lector de CD externo (incrementación). Este parámetro se pone a cero si el valor de la información es superior a 255 o si se comunican los defectos U1F0A, U1F0F, U1F03.'
  de: 'Dieser Parameter definiert die Anzahl der Rückstellungen auf Null nach einer internen Fehlfunktion des Steuergerätes externer CD-Player (Heraufzählen). Dieser Parameter wird auf Null zurückgestellt, wenn der Wert der Angabe höher als 255 ist oder wenn die Fehler U1F0A, U1F0F, U1F03 gemeldet werden.'
  pl: 'Ten parametr określa ilość wyzerowań, na skutek niesprawności wewnętrznej kalkulatora zewnętrznego odtwarzacza CD (zwiększanie wartości). Ten parametr jest wyzerowany gdy wartość danych jest większa od 255 lub gdy pojawią się usterki U1F0A, U1F0F, U1F03.'
  hu: 'Ezen paraméter meghatározza a nullázás számát a külső CD-lejátszó computer egy belső működési rendellenességét követően (felfelé számlálás). Ezen paraméter nullázásra kerül ha az adat érték nagyobb mint 255 vagy ha a hibák U1F0A, U1F0F, U1F03 továbbításra kerültek.'
kind: 'live'
access: 'read'
length: 1

params:
  NUMBER_CD_PLAYER_RESETS:
