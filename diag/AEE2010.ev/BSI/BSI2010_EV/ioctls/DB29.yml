ioctl: 0xDB29
name: 'CONTROL_SUNROOF_SUPPLY_RELAY'
display_name:
  en: 'Control of the sunroof supply relay'
  fr: 'Commande du relais d''alimentation du toit ouvrant'
  es: 'Mando del relé de alimentación del techo abrible'
  de: 'Ansteuerung des Versorgungsrelais des Schiebedachs'
  pl: 'Sterowanie przekaźnika zasilania dachu otwieranego'
  hu: 'Tolótető tápellátórelé vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the sunroof supply relay'
      fr: 'Commande du relais d''alimentation du toit ouvrant'
      es: 'Mando del relé de alimentación del techo abrible'
      de: 'Ansteuerung des Versorgungsrelais des Schiebedachs'
      pl: 'Sterowanie przekaźnika zasilania dachu otwieranego'
      hu: 'Tolótető tápellátórelé vezérlése'
    max_duration_ms: 10000
