ioctl: 0xD818
name: 'REAR_DOOR_SILLS_LIGHTING_CONTROL'
display_name:
  en: 'Rear door sills lighting control'
  fr: 'Commande d''éclairage des seuils de portes arrière'
  es: 'Mando de iluminación de los umbrales de puertas traseras'
  de: 'Steuerung Beleuchtung der Türschweller hinten'
  pl: 'Sterowanie oświetleniem progów de tylnych drzwi'
  hu: 'Hátsó ajtóküszöbök megvilágításának vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Rear door sills lighting control'
      fr: 'Commande d''éclairage des seuils de portes arrière'
      es: 'Mando de iluminación de los umbrales de puertas traseras'
      de: 'Steuerung Beleuchtung der Türschweller hinten'
      pl: 'Sterowanie oświetleniem progów de tylnych drzwi'
      hu: 'Hátsó ajtóküszöbök megvilágításának vezérlése'
    max_duration_ms: 5000
