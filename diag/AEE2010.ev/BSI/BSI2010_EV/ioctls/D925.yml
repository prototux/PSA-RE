ioctl: 0xD925
name: 'AUTHORISATION_OPERATION_NECK_HEATERS_CONTROL'
display_name:
  en: 'Authorisation of operation of the neck heaters control'
  fr: 'Commande d''autorisation de fonctionnement des chauffe-nuques'
  es: 'Mando de autorización de funcionamiento de calefacción en el reposacabezas'
  de: 'Ansteuerung Funktionsfreigabe der Nackenwärmer'
  pl: 'Sterowanie zezwoleniem uruchomienia ogrzewania karku'
  hu: 'Tarkófűtések működésének engedélyezése vezérlés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Authorisation of operation of the neck heaters control'
      fr: 'Commande d''autorisation de fonctionnement des chauffe-nuques'
      es: 'Mando de autorización de funcionamiento de calefacción en el reposacabezas'
      de: 'Ansteuerung Funktionsfreigabe der Nackenwärmer'
      pl: 'Sterowanie zezwoleniem uruchomienia ogrzewania karku'
      hu: 'Tarkófűtések működésének engedélyezése vezérlés'
    max_duration_ms: 10000
