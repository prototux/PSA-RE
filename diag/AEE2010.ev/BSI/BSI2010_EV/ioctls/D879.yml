ioctl: 0xD879
name: 'HORN_CONTROL'
display_name:
  en: 'Horn control'
  fr: 'Commande de l''avertisseur sonore'
  es: 'Mando de la bocina'
  de: 'Betätigung Signalhorn'
  pl: 'Sterowanie sygnału dźwiękowego'
  hu: 'Kürt vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Horn control'
      fr: 'Commande de l''avertisseur sonore'
      es: 'Mando de la bocina'
      de: 'Betätigung Signalhorn'
      pl: 'Sterowanie sygnału dźwiękowego'
      hu: 'Kürt vezérlése'
    max_duration_ms: 2000
