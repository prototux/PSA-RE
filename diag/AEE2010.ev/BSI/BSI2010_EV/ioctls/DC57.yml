ioctl: 0xDC57
name: 'HEATED_WINDSCREEN_COMPLETE_DE_ICING_CONTROL'
display_name:
  en: 'Heated windscreen complete de-icing control'
  fr: 'Commande de dégivrage complet du pare-brise chauffant'
  es: 'Mando de deshelado completo del parabrisas térmico'
  de: 'Ansteuerung komplettes Enteisen der heizbaren Frontscheibe'
  pl: 'Sterowanie pełnego odszraniania ogrzewanej szyby przedniej'
  hu: 'Szélvédőfűtés komplett jégmentesítés vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Heated windscreen complete de-icing control'
      fr: 'Commande de dégivrage complet du pare-brise chauffant'
      es: 'Mando de deshelado completo del parabrisas térmico'
      de: 'Ansteuerung komplettes Enteisen der heizbaren Frontscheibe'
      pl: 'Sterowanie pełnego odszraniania ogrzewanej szyby przedniej'
      hu: 'Szélvédőfűtés komplett jégmentesítés vezérlése'
    max_duration_ms: 5000
