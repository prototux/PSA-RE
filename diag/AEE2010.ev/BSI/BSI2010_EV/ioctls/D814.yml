ioctl: 0xD814
name: 'AUTHORISATION_LIGHTING_ELECTRONIC_KEY_READER'
display_name:
  en: 'Authorisation of lighting of the electronic key reader'
  fr: 'Autorisation d''éclairage du lecteur de clé électronique'
  es: 'Autorización de iluminación del lector de llave electrónica'
  de: 'Freigabe Einschalten Leser des elektronischen Schlüssels'
  pl: 'Autoryzacja oświetlenia czytnika klucza elektronicznego'
  hu: 'Elektronikus kulcs lejátszó megvilágítás engedélyezése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Authorisation of lighting of the electronic key reader'
      fr: 'Autorisation d''éclairage du lecteur de clé électronique'
      es: 'Autorización de iluminación del lector de llave electrónica'
      de: 'Freigabe Einschalten Leser des elektronischen Schlüssels'
      pl: 'Autoryzacja oświetlenia czytnika klucza elektronicznego'
      hu: 'Elektronikus kulcs lejátszó megvilágítás engedélyezése'
    max_duration_ms: 5000
