ioctl: 0xD92D
name: 'ACTIVATION_ADDITIONAL_HEATING_BURNER'
display_name:
  en: 'Activation of the additional heating burner'
  fr: 'Activation du brûleur chauffage additionnel'
  es: 'Activación del quemador de la calefacción adicional'
  de: 'Aktivierung des Brenners der Standheizung'
  pl: 'Aktywacja palnika ogrzewania dodatkowego'
  hu: 'Kiegészítő fűtés égőjének aktiválása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Activation of the additional heating burner'
      fr: 'Activation du brûleur chauffage additionnel'
      es: 'Activación del quemador de la calefacción adicional'
      de: 'Aktivierung des Brenners der Standheizung'
      pl: 'Aktywacja palnika ogrzewania dodatkowego'
      hu: 'Kiegészítő fűtés égőjének aktiválása'
    max_duration_ms: 10000
