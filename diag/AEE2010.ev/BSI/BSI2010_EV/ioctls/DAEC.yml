ioctl: 0xDAEC
name: 'ACTIVATION_CHILD_LOCK_INDICATOR_LAMP_DRIVER_S'
display_name:
  en: 'Activation of the child lock indicator lamp on the driver''s door control pad'
  fr: 'Activation du voyant de la sécurité enfant sur la platine de porte conducteur'
  es: 'Activación del testigo del seguro para niños en la pletina de la puerta del conductor'
  de: 'Aktivierung der Kontrollleuchte Kindersicherung an der Türplatine auf der Fahrerseite'
  pl: 'Włączenie lampki kontrolnej zabezpieczenia dzieci w module drzwi kierowcy'
  hu: 'A gyermekzár visszajelző aktiválása a vezető ajtó kapcsolópanelen'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Activation of the child lock indicator lamp on the driver''s door control pad'
      fr: 'Activation du voyant de la sécurité enfant sur la platine de porte conducteur'
      es: 'Activación del testigo del seguro para niños en la pletina de la puerta del conductor'
      de: 'Aktivierung der Kontrollleuchte Kindersicherung an der Türplatine auf der Fahrerseite'
      pl: 'Włączenie lampki kontrolnej zabezpieczenia dzieci w module drzwi kierowcy'
      hu: 'A gyermekzár visszajelző aktiválása a vezető ajtó kapcsolópanelen'
    max_duration_ms: 3000
