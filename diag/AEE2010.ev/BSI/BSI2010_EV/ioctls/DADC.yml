ioctl: 0xDADC
name: 'ALARM_SIREN_MONITORING_ACTIVATION_CONTROL'
display_name:
  en: 'Alarm siren monitoring activation control'
  fr: 'Commande d''activation de la surveillance de la sirène d''alarme'
  es: 'Mando de activación de la vigilancia de la sirena de la alarma'
  de: 'Ansteuerung zur Aktivierung der Überwachung der Alarmsirene'
  pl: 'Sterowanie aktywacji nadzoru syreny alarmu'
  hu: 'A riasztó sziréna felügyelet aktiválás vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Alarm siren monitoring activation control'
      fr: 'Commande d''activation de la surveillance de la sirène d''alarme'
      es: 'Mando de activación de la vigilancia de la sirena de la alarma'
      de: 'Ansteuerung zur Aktivierung der Überwachung der Alarmsirene'
      pl: 'Sterowanie aktywacji nadzoru syreny alarmu'
      hu: 'A riasztó sziréna felügyelet aktiválás vezérlése'
    max_duration_ms: 1000
