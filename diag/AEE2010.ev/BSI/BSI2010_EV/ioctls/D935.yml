ioctl: 0xD935
name: 'CONTROL_AIR_CONDITIONING_COMPRESSOR_CLUTCH'
display_name:
  en: 'Control of the air conditioning compressor clutch supply'
  fr: 'Commande de l''alimentation de l''embrayage du compresseur de réfrigération'
  es: 'Mando de alimentación del embrague del compresor de refrigeración'
  de: 'Steuerung der Versorgung der Kupplung des Klimaanlagenkompressors'
  pl: 'Sterowanie zasilania sprzęgła sprężarki klimatyzacji'
  hu: 'A hűtőkompresszor tengelykapcsoló tápellátásának vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the air conditioning compressor clutch supply'
      fr: 'Commande de l''alimentation de l''embrayage du compresseur de réfrigération'
      es: 'Mando de alimentación del embrague del compresor de refrigeración'
      de: 'Steuerung der Versorgung der Kupplung des Klimaanlagenkompressors'
      pl: 'Sterowanie zasilania sprzęgła sprężarki klimatyzacji'
      hu: 'A hűtőkompresszor tengelykapcsoló tápellátásának vezérlése'
    max_duration_ms: 10000
