ioctl: 0xDAC8
name: 'FUEL_FILLER_FLAP_EJECTION_COMMAND'
display_name:
  en: 'Fuel filler flap ejection command'
  fr: 'Commande d''éjection de la trappe à carburant'
  es: 'Mando de expulsión de la trampilla de carburante'
  de: 'Betätigung Öffnen der Tankklappe'
  pl: 'Sterowanie wysunięcia pokrywy wlewu paliwa'
  hu: 'A tanksapkafedél nyitásának vezérlés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Fuel filler flap ejection command'
      fr: 'Commande d''éjection de la trappe à carburant'
      es: 'Mando de expulsión de la trampilla de carburante'
      de: 'Betätigung Öffnen der Tankklappe'
      pl: 'Sterowanie wysunięcia pokrywy wlewu paliwa'
      hu: 'A tanksapkafedél nyitásának vezérlés'
    max_duration_ms: 500
