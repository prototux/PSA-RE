ioctl: 0xD80F
name: 'CONTROL_EXTERIOR_SIDE_DOOR_LAMPS_DOOR_CONTROL'
display_name:
  en: 'Control of the exterior side door lamps (By the door control pad)'
  fr: 'Commande des éclaireurs de porte latéraux extérieurs (Par la platine de porte)'
  es: 'Mando de luces de las puertas laterales exteriores (Mediante la pletina de la puerta)'
  de: 'Betätigung der seitlichen Türbeleuchtung außen (Über die Türplatine)'
  pl: 'Sterowanie oświetlenia zewnętrznego drzwi bocznych (Za pomocą modułu w drzwiach)'
  hu: 'Az oldalsó ajtók külső világításának vezérlése (Az ajtó vezérlőlap által)'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the exterior side door lamps (By the door control pad)'
      fr: 'Commande des éclaireurs de porte latéraux extérieurs (Par la platine de porte)'
      es: 'Mando de luces de las puertas laterales exteriores (Mediante la pletina de la puerta)'
      de: 'Betätigung der seitlichen Türbeleuchtung außen (Über die Türplatine)'
      pl: 'Sterowanie oświetlenia zewnętrznego drzwi bocznych (Za pomocą modułu w drzwiach)'
      hu: 'Az oldalsó ajtók külső világításának vezérlése (Az ajtó vezérlőlap által)'
    max_duration_ms: 3000
