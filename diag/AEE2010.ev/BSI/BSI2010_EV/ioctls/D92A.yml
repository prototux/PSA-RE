ioctl: 0xD92A
name: 'CONTROL_LIGHTING_INTERIOR_CONTROLS_AND_DISPLAYS'
display_name:
  en: 'Control of lighting of the interior controls and displays'
  fr: 'Commande d''éclairage des afficheurs et des commandes intérieurs'
  es: 'Mando de luces de las pantalla y de los mandos interiores'
  de: 'Betätigung Beleuchtung der Displays und der inneren Betätigungen'
  pl: 'Sterowanie oświetlenia wyświetlaczy i sterowań wewnętrznych'
  hu: 'A kijelzők és a belső kapcsolók világításának vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of lighting of the interior controls and displays'
      fr: 'Commande d''éclairage des afficheurs et des commandes intérieurs'
      es: 'Mando de luces de las pantalla y de los mandos interiores'
      de: 'Betätigung Beleuchtung der Displays und der inneren Betätigungen'
      pl: 'Sterowanie oświetlenia wyświetlaczy i sterowań wewnętrznych'
      hu: 'A kijelzők és a belső kapcsolók világításának vezérlése'
    max_duration_ms: 3000
