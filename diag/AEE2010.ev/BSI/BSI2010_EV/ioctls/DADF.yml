ioctl: 0xDADF
name: 'HAZARD_WARNING_LAMPS_CONTROL'
display_name:
  en: 'Hazard warning lamps control'
  fr: 'Commande des feux de détresse'
  es: 'Mando de las luces de emergencia'
  de: 'Schalter der Warnblinkanlage'
  pl: 'Sterowanie świateł awaryjnych'
  hu: 'Vészvillogó működtetése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Hazard warning lamps control'
      fr: 'Commande des feux de détresse'
      es: 'Mando de las luces de emergencia'
      de: 'Schalter der Warnblinkanlage'
      pl: 'Sterowanie świateł awaryjnych'
      hu: 'Vészvillogó működtetése'
    max_duration_ms: 5000
