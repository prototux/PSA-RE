ioctl: 0xDD20
name: 'IO_CONTROL_DD20'
controls:
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_BYTE_5:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x02

  SETPOINT_DURATION_BYTE_6:
    bits: '3.7-3.0'
    type: 'enum'
    default: 0x01

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
