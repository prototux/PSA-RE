ioctl: 0xD829
name: 'FRONT_LEFT_DIPPED_HEADLAMP_CONTROL'
display_name:
  en: 'Front left dipped headlamp control'
  fr: 'Commande du feu de croisement avant gauche'
  es: 'Mando de la luz de cruce delantera izquierda'
  de: 'Steuerung Abblendlicht vorne links'
  pl: 'Sterowanie przednim lewym światłem mijania'
  hu: 'Bal oldali tompított fényszóró vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Front left dipped headlamp control'
      fr: 'Commande du feu de croisement avant gauche'
      es: 'Mando de la luz de cruce delantera izquierda'
      de: 'Steuerung Abblendlicht vorne links'
      pl: 'Sterowanie przednim lewym światłem mijania'
      hu: 'Bal oldali tompított fényszóró vezérlése'
    max_duration_ms: 5000
