ioctl: 0xDAD5
name: 'ACTIVATION_CHILD_LOCK_INDICATOR_LAMP_DASHBOARD'
display_name:
  en: 'Activation of the child lock indicator lamp on the dashboard'
  fr: 'Activation du voyant de la sécurité enfant sur la planche de bord'
  es: 'Activación del testigo del seguro para niños en el salpicadero'
  de: 'Aktivierung der Kontrollleuchte Kindersicherung am Armaturenbrett'
  pl: 'Włączenie lampki kontrolnej zabezpieczenia dzieci na tablicy rozdzielczej'
  hu: 'A műszerfali gyermekzár visszajelző aktiválásának engedélyezése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Activation of the child lock indicator lamp on the dashboard'
      fr: 'Activation du voyant de la sécurité enfant sur la planche de bord'
      es: 'Activación del testigo del seguro para niños en el salpicadero'
      de: 'Aktivierung der Kontrollleuchte Kindersicherung am Armaturenbrett'
      pl: 'Włączenie lampki kontrolnej zabezpieczenia dzieci na tablicy rozdzielczej'
      hu: 'A műszerfali gyermekzár visszajelző aktiválásának engedélyezése'
    max_duration_ms: 3000
