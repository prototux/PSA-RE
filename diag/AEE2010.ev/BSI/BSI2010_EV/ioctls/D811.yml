ioctl: 0xD811
name: 'STORAGE_COMPARTMENT_LAMPS_AUTHORISATION_COMMAND'
display_name:
  en: 'Storage compartment lamps authorisation command'
  fr: 'Commande de l''autorisation des éclaireurs de vide poche'
  es: 'Mando de autorización de las luces de guardaobjetos'
  de: 'Betätigung Freigabe der Ablagebeleuchtung'
  pl: 'Sterowanie zezwolenia na działanie oświetlenia schowka podręcznego'
  hu: 'Rakodórekesz világítások engedélyezésének vezérlése'
controls:
