ioctl: 0xDACA
name: 'CONTROL_LOAD_AREA_LOCKING_STRATUS_LED'
display_name:
  en: 'Control of the load area locking stratus LED'
  fr: 'Commande de la LED d''état du verrouillage de la zone de charge'
  es: 'Mando del LED de estado de bloqueo de la zona de carga'
  de: 'Ansteuerung der LED Verriegelungszustand des Laderaums'
  pl: 'Sterowanie diody LED stanu zaryglowania przestrzeni ładunkowej'
  hu: 'A rakodótéri zóna reteszelési állapot LED vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the load area locking stratus LED'
      fr: 'Commande de la LED d''état du verrouillage de la zone de charge'
      es: 'Mando del LED de estado de bloqueo de la zona de carga'
      de: 'Ansteuerung der LED Verriegelungszustand des Laderaums'
      pl: 'Sterowanie diody LED stanu zaryglowania przestrzeni ładunkowej'
      hu: 'A rakodótéri zóna reteszelési állapot LED vezérlése'
    max_duration_ms: 3000
