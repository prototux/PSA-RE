ioctl: 0xD92E
name: 'FRONT_AIR_CONDITIONING_BLOWER_SUPPLY'
display_name:
  en: 'Front air conditioning blower supply'
  fr: 'Alimentation du pulseur de climatisation avant'
  es: 'Alimentación del impulsor de climatización delantero'
  de: 'Versorgung des Gebläses der Klimaanlage vorn'
  pl: 'Zasilanie dmuchawy klimatyzacji przedniej'
  hu: 'Első klímaberendezés levegőbefúvó ventilátor tápellátása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Front air conditioning blower supply'
      fr: 'Alimentation du pulseur de climatisation avant'
      es: 'Alimentación del impulsor de climatización delantero'
      de: 'Versorgung des Gebläses der Klimaanlage vorn'
      pl: 'Zasilanie dmuchawy klimatyzacji przedniej'
      hu: 'Első klímaberendezés levegőbefúvó ventilátor tápellátása'
    max_duration_ms: 10000
