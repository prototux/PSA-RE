ioctl: 0xDB28
name: 'SUNROOF_CLOSING_CONTROL_NOT_MULTIPLEXED'
display_name:
  en: 'Sunroof closing control (not multiplexed)'
  fr: 'Commande de fermeture du toit ouvrant (non multiplexé)'
  es: 'Mando de cierre del techo corredizo (no multiplexado)'
  de: 'Schließbetätigung des Schiebedachs (nicht vernetzt)'
  pl: 'Sterowanie zamykaniem dachu otwieranego (niemultipleksowanego)'
  hu: 'Tolótető zárásának vezérlése (nem multiplexált)'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Sunroof closing control (not multiplexed)'
      fr: 'Commande de fermeture du toit ouvrant (non multiplexé)'
      es: 'Mando de cierre del techo corredizo (no multiplexado)'
      de: 'Schließbetätigung des Schiebedachs (nicht vernetzt)'
      pl: 'Sterowanie zamykaniem dachu otwieranego (niemultipleksowanego)'
      hu: 'Tolótető zárásának vezérlése (nem multiplexált)'
    max_duration_ms: 3000
  - display_name:
      en: 'Sunroof opening control (not multiplexed)'
      fr: 'Commande d''ouverture du toit ouvrant (non multiplexé)'
      es: 'Mando de apertura del techo corredizo (no multiplexado)'
      de: 'Öffnungsbetätigung des Schiebedachs (nicht vernetzt)'
      pl: 'Sterowanie otwieraniem dachu otwieranego (niemultipleksowanego)'
      hu: 'Tolótető nyitásának vezérlése (nem multiplexált)'
    max_duration_ms: 3000
