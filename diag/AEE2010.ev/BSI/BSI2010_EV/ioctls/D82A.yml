ioctl: 0xD82A
name: 'FRONT_RIGHT_DIPPED_HEADLAMP_CONTROL'
display_name:
  en: 'Front right dipped headlamp control'
  fr: 'Commande du feu de croisement avant droit'
  es: 'Mando de la luz de cruce delantera derecha'
  de: 'Steuerung Abblendlicht vorne rechts'
  pl: 'Sterowanie przednim prawym światłem mijania'
  hu: 'Jobb oldali tompított fényszóró vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Front right dipped headlamp control'
      fr: 'Commande du feu de croisement avant droit'
      es: 'Mando de la luz de cruce delantera derecha'
      de: 'Steuerung Abblendlicht vorne rechts'
      pl: 'Sterowanie przednim prawym światłem mijania'
      hu: 'Jobb oldali tompított fényszóró vezérlése'
    max_duration_ms: 5000
