ioctl: 0xD928
name: 'CONTROL_BLACK_PANEL_FUNCTION'
display_name:
  en: 'Control of the black panel function'
  fr: 'Commande de la fonction black panel'
  es: 'Mando de la función black panel'
  de: 'Betätigung der Funktion Black Panel'
  pl: 'Sterowanie funkcji black panel'
  hu: 'A black panel funkció vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the black panel function'
      fr: 'Commande de la fonction black panel'
      es: 'Mando de la función black panel'
      de: 'Betätigung der Funktion Black Panel'
      pl: 'Sterowanie funkcji black panel'
      hu: 'A black panel funkció vezérlése'
    max_duration_ms: 3000
