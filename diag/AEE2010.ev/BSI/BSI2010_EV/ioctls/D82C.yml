ioctl: 0xD82C
name: 'CONTROL_FRONT_FOGLAMPS'
display_name:
  en: 'Control of the front foglamps'
  fr: 'Commande des feux de brouillard avant'
  es: 'Mando de antinieblas delanteros'
  de: 'Ansteuerung Nebelscheinwerfer'
  pl: 'Włączanie przednich świateł przeciwmgielnych'
  hu: 'Az első ködlámpák vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the front foglamps'
      fr: 'Commande des feux de brouillard avant'
      es: 'Mando de antinieblas delanteros'
      de: 'Ansteuerung Nebelscheinwerfer'
      pl: 'Włączanie przednich świateł przeciwmgielnych'
      hu: 'Az első ködlámpák vezérlése'
    max_duration_ms: 5000
