ioctl: 0xD81B
name: 'CONTROL_INTERIOR_AMBIANCE_LIGHTS_NO_RHEOSTAT'
display_name:
  en: 'Control of the interior ambiance lights (no rheostat)'
  fr: 'Commande des éclaireurs d''ambiance intérieur (non rhéostatés)'
  es: 'Mando de las luces ambientales interior (sin reóstato)'
  de: 'Betätigung Ambient-Innenbeleuchtung (nicht geregelt)'
  pl: 'Sterowanie wewnętrznego oświetlenia nastrojowego (bez potencjometrów)'
  hu: 'Belső hangulatvilágítások vezérlése (nem szabályozott)'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the interior ambiance lights (no rheostat)'
      fr: 'Commande des éclaireurs d''ambiance intérieur (non rhéostatés)'
      es: 'Mando de las luces ambientales interior (sin reóstato)'
      de: 'Betätigung Ambient-Innenbeleuchtung (nicht geregelt)'
      pl: 'Sterowanie wewnętrznego oświetlenia nastrojowego (bez potencjometrów)'
      hu: 'Belső hangulatvilágítások vezérlése (nem szabályozott)'
    max_duration_ms: 3000
