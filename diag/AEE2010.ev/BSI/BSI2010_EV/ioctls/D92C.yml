ioctl: 0xD92C
name: 'AIR_CONDITIONING_COMPRESSOR_VARIABLE_CAPACITY'
display_name:
  en: 'Air conditioning compressor variable capacity valve control'
  fr: 'Commande de la vanne de la cylindrée variable du compresseur de réfrigération'
  es: 'Mando de la válvula de cilindrada variable del compresor de refrigeración'
  de: 'Ansteuerung des Ventils des variablen Hubs des Klimaanlagenkompressors'
  pl: 'Sterowanie zaworu zmiennej pojemności sprężarki klimatyzacji'
  hu: 'A hűtőkompresszor változtatható hengerűrtartalom szelep vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Air conditioning compressor variable capacity valve control'
      fr: 'Commande de la vanne de la cylindrée variable du compresseur de réfrigération'
      es: 'Mando de la válvula de cilindrada variable del compresor de refrigeración'
      de: 'Ansteuerung des Ventils des variablen Hubs des Klimaanlagenkompressors'
      pl: 'Sterowanie zaworu zmiennej pojemności sprężarki klimatyzacji'
      hu: 'A hűtőkompresszor változtatható hengerűrtartalom szelep vezérlése'
    max_duration_ms: 4000
