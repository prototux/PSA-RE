ioctl: 0xDAE2
name: 'CONTROL_ALARM_LED'
display_name:
  en: 'Control of the alarm LED'
  fr: 'Commande de la LED de l''alarme'
  es: 'Mando del LED de la alarma'
  de: 'Steuerung der LED der Alarmanlage'
  pl: 'Włączenie diody LED alarmu'
  hu: 'A riasztó LED-jének vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the alarm LED'
      fr: 'Commande de la LED de l''alarme'
      es: 'Mando del LED de la alarma'
      de: 'Steuerung der LED der Alarmanlage'
      pl: 'Włączenie diody LED alarmu'
      hu: 'A riasztó LED-jének vezérlése'
    max_duration_ms: 5000
