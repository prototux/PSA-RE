ioctl: 0xD81C
name: 'FRONT_DOOR_SILLS_LIGHTING_CONTROL'
display_name:
  en: 'Front door sills lighting control'
  fr: 'Commande d''éclairage des seuils de portes avant'
  es: 'Mando de iluminación de los umbrales de puertas delanteras'
  de: 'Steuerung Beleuchtung der Türschweller vorn'
  pl: 'Sterowanie oświetleniem progów przednich drzwi'
  hu: 'Első ajtóküszöbök megvilágításának vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Front door sills lighting control'
      fr: 'Commande d''éclairage des seuils de portes avant'
      es: 'Mando de iluminación de los umbrales de puertas delanteras'
      de: 'Steuerung Beleuchtung der Türschweller vorn'
      pl: 'Sterowanie oświetleniem progów przednich drzwi'
      hu: 'Első ajtóküszöbök megvilágításának vezérlése'
    max_duration_ms: 3000
