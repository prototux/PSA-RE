ioctl: 0xDD4A
name: 'CONTROL_MESSAGE_AUTOMATIC_BRAKING_RISK_COLLISION'
display_name:
  en: 'Control of the message for the automatic braking on risk of collision fault'
  fr: 'Pilotage du message pour le défaut freinage automatique en cas de risque de collision'
  es: 'Pilotaje del mensaje para el defecto de frenada automática en caso de riesgo de colisión'
  de: 'Steuerung der Meldung für den Fehler automatisches Bremsen bei Kollisionsgefahr'
  pl: 'Sterowanie wyświetleniem komunikatu dla defektu hamowania automatycznego w przypadku ryzyka zderzenia'
  hu: 'Ütközés veszélye esetén történő automata fékezés meghibásodásával kapcsolatos üzenet kezelése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the message for the automatic braking on risk of collision fault'
      fr: 'Pilotage du message pour le défaut freinage automatique en cas de risque de collision'
      es: 'Pilotaje del mensaje para el defecto de frenada automática en caso de riesgo de colisión'
      de: 'Steuerung der Meldung für den Fehler automatisches Bremsen bei Kollisionsgefahr'
      pl: 'Sterowanie wyświetleniem komunikatu dla defektu hamowania automatycznego w przypadku ryzyka zderzenia'
      hu: 'Ütközés veszélye esetén történő automata fékezés meghibásodásával kapcsolatos üzenet kezelése'
    max_duration_ms: 3000
