ioctl: 0xDC56
name: 'HEATED_WINDSCREEN_WIPER_BLADES_ZONE_DE_ICING'
display_name:
  en: 'Heated windscreen wiper blades zone de-icing control'
  fr: 'Commande de dégivrage de la zone des balais d''essuie-vitre du pare-brise chauffant'
  es: 'Mando de deshelado de la zona de las escobillas de limpiaparabrisas del parabrisas térmico'
  de: 'Ansteuerung der Enteisung des Bereichs der Scheibenwischerblätter der heizbaren Frontscheibe'
  pl: 'Sterowanie odszraniania strefy wycieraczek ogrzewanej szyby przedniej'
  hu: 'Szélvédőfűtés ablaktörlő lapátok zónájának jégmentesítés vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Heated windscreen wiper blades zone de-icing control'
      fr: 'Commande de dégivrage de la zone des balais d''essuie-vitre du pare-brise chauffant'
      es: 'Mando de deshelado de la zona de las escobillas de limpiaparabrisas del parabrisas térmico'
      de: 'Ansteuerung der Enteisung des Bereichs der Scheibenwischerblätter der heizbaren Frontscheibe'
      pl: 'Sterowanie odszraniania strefy wycieraczek ogrzewanej szyby przedniej'
      hu: 'Szélvédőfűtés ablaktörlő lapátok zónájának jégmentesítés vezérlése'
    max_duration_ms: 5000
