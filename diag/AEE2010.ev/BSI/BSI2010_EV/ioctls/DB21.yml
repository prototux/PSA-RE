ioctl: 0xDB21
name: 'CENTRAL_DOOR_AND_WINDOW_CLOSING_COMMAND'
display_name:
  en: 'Central door and window closing command'
  fr: 'Commande de fermeture centralisée des ouvrants'
  es: 'Mando de cierre centralizado de los abribles'
  de: 'Betätigung zentrales Schließen der Öffnungen'
  pl: 'Sterowanie centralnego zamykania drzwi i pokryw'
  hu: 'A nyílászárók központi zárásának vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Central door and window closing command'
      fr: 'Commande de fermeture centralisée des ouvrants'
      es: 'Mando de cierre centralizado de los abribles'
      de: 'Betätigung zentrales Schließen der Öffnungen'
      pl: 'Sterowanie centralnego zamykania drzwi i pokryw'
      hu: 'A nyílászárók központi zárásának vezérlése'
    max_duration_ms: 500
