ioctl: 0xD92B
name: 'AIR_CONDITIONING_COMPRESSOR_CLUTCH_CONTROL'
display_name:
  en: 'Air conditioning compressor clutch control'
  fr: 'Commande de l''embrayage du compresseur de réfrigération'
  es: 'Mando del embrague del compresor de refrigeración'
  de: 'Steuerung der Kupplung des Klimaanlagenkompressors'
  pl: 'Sterowanie sprzęgła sprężarki klimatyzacji'
  hu: 'A hűtokompresszor tengelykapcsolójának kapcsolója'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Air conditioning compressor clutch control'
      fr: 'Commande de l''embrayage du compresseur de réfrigération'
      es: 'Mando del embrague del compresor de refrigeración'
      de: 'Steuerung der Kupplung des Klimaanlagenkompressors'
      pl: 'Sterowanie sprzęgła sprężarki klimatyzacji'
      hu: 'A hűtokompresszor tengelykapcsolójának kapcsolója'
    max_duration_ms: 1000
