ioctl: 0xD87C
name: 'CONTROL_DAYTIME_LIGHTS'
display_name:
  en: 'Control of the daytime lights'
  fr: 'Commande des feux diurnes'
  es: 'Mando de las luces diurnas'
  de: 'Steuerung Tagfahrlicht'
  pl: 'Sterowanie świateł dziennych'
  hu: 'Nappali lámpák vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the daytime lights'
      fr: 'Commande des feux diurnes'
      es: 'Mando de las luces diurnas'
      de: 'Steuerung Tagfahrlicht'
      pl: 'Sterowanie świateł dziennych'
      hu: 'Nappali lámpák vezérlése'
    max_duration_ms: 5000
