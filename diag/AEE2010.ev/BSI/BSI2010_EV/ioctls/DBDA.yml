ioctl: 0xDBDA
name: 'CONTROL_DYNAMIC_DRIVING_FUNCTION_BUTTON_LED'
display_name:
  en: 'Control of the dynamic driving function button LED'
  fr: 'Pilotage de la LED du bouton de la fonction conduite dynamique'
  es: 'Pilotaje del LED del botón de la función de conducción dinámica'
  de: 'Ansteuerung der LED der Taste der Funktion dynamisches Fahren'
  pl: 'Sterowanie LED przycisku funkcji jazda dynamiczna'
  hu: 'A dinamikus vezetés funkció gomb LED-jének vezérlése.'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the dynamic driving function button LED'
      fr: 'Pilotage de la LED du bouton de la fonction conduite dynamique'
      es: 'Pilotaje del LED del botón de la función de conducción dinámica'
      de: 'Ansteuerung der LED der Taste der Funktion dynamisches Fahren'
      pl: 'Sterowanie LED przycisku funkcji jazda dynamiczna'
      hu: 'A dinamikus vezetés funkció gomb LED-jének vezérlése.'
    max_duration_ms: 3000
