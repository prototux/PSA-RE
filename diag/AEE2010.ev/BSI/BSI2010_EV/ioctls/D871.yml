ioctl: 0xD871
name: 'VEHICLE_AND_TRAILER_RH_INDICATOR_ILLUMINATION'
display_name:
  en: 'Vehicle and trailer RH indicator illumination control'
  fr: 'Commande d''éclairage des clignotants droits du véhicule et de la remorque'
  es: 'Mando de encendido de los intermitentes derechos del vehículo y del remolque'
  de: 'Steuerung der Beleuchtung der rechten Blinkleuchten am Fahrzeug und am Anhänger'
  pl: 'Polecenie włączenia prawych kierunkowskazów pojazdu i przyczepy'
  hu: 'A jármű és a(z) utánfutó jobb oldali irányjelzőinek vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Vehicle and trailer RH indicator illumination control'
      fr: 'Commande d''éclairage des clignotants droits du véhicule et de la remorque'
      es: 'Mando de encendido de los intermitentes derechos del vehículo y del remolque'
      de: 'Steuerung der Beleuchtung der rechten Blinkleuchten am Fahrzeug und am Anhänger'
      pl: 'Polecenie włączenia prawych kierunkowskazów pojazdu i przyczepy'
      hu: 'A jármű és a(z) utánfutó jobb oldali irányjelzőinek vezérlése'
    max_duration_ms: 5000
