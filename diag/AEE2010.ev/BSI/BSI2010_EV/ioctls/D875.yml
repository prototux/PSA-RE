ioctl: 0xD875
name: 'BRAKE_LIGHT_COMMAND'
display_name:
  en: 'Brake light command'
  fr: 'Commande des feux stop'
  es: 'Mando de las luces de stop'
  de: 'Steuerung der Bremsleuchten'
  pl: 'Sterowanie świateł stop'
  hu: 'Féklámpák vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Brake light command'
      fr: 'Commande des feux stop'
      es: 'Mando de las luces de stop'
      de: 'Steuerung der Bremsleuchten'
      pl: 'Sterowanie świateł stop'
      hu: 'Féklámpák vezérlése'
    max_duration_ms: 5000
