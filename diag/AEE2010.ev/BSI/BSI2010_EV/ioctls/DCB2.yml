ioctl: 0xDCB2
name: 'SEMI_AUTOMATIC_PARKING_SYSTEM_SWITCH_LED_CONTROL'
display_name:
  en: 'Semi-automatic parking system switch LED control'
  fr: 'Commande de la LED du commutateur du système de stationnement semi-automatique'
  es: 'Mando de LED del conmutador del sistema de estacionamiento semiautomático'
  de: 'Ansteuerung der LED des Schalters des halbautomatischen Einparksystems'
  pl: 'Sterowanie diody LED przełącznika półautomatycznego systemu parkowania'
  hu: 'A félautomata parkoló rendszer kapcsolója LED-jének vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Semi-automatic parking system switch LED control'
      fr: 'Commande de la LED du commutateur du système de stationnement semi-automatique'
      es: 'Mando de LED del conmutador del sistema de estacionamiento semiautomático'
      de: 'Ansteuerung der LED des Schalters des halbautomatischen Einparksystems'
      pl: 'Sterowanie diody LED przełącznika półautomatycznego systemu parkowania'
      hu: 'A félautomata parkoló rendszer kapcsolója LED-jének vezérlése'
    max_duration_ms: 5000
