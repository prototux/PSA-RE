ioctl: 0xDB2B
name: 'CONVERTIBLE_ROOF_SUPPLY'
display_name:
  en: 'Convertible roof supply'
  fr: 'Alimentation du toit décapotable'
  es: 'Alimentación del techo descapotable'
  de: 'Stromversorgung des Cabrio-Dachs'
  pl: 'Zasilanie dachu składanego'
  hu: 'Összecsukható tető tápellátása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Convertible roof supply'
      fr: 'Alimentation du toit décapotable'
      es: 'Alimentación del techo descapotable'
      de: 'Stromversorgung des Cabrio-Dachs'
      pl: 'Zasilanie dachu składanego'
      hu: 'Összecsukható tető tápellátása'
    max_duration_ms: 10000
