ioctl: 0xDB27
name: 'SUNROOF_SUPPLY'
display_name:
  en: 'Sunroof supply'
  fr: 'Alimentation du toit ouvrant'
  es: 'Alimentación del techo practicable'
  de: 'Versorgung des Schiebedachs'
  pl: 'Zasilanie dachu otwieranego'
  hu: 'Napfénytető tápja'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Sunroof supply'
      fr: 'Alimentation du toit ouvrant'
      es: 'Alimentación del techo practicable'
      de: 'Versorgung des Schiebedachs'
      pl: 'Zasilanie dachu otwieranego'
      hu: 'Napfénytető tápja'
    max_duration_ms: 10000
