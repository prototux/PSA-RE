ioctl: 0xDAC9
name: 'CONTROL_CENTRAL_DOOR_AND_WINDOW_CLOSING'
display_name:
  en: 'Control of the central door and window closing indicator lamp'
  fr: 'Commande du voyant de fermeture centralisée des ouvrants'
  es: 'Mando del testigo de cierre centralizado de los abribles'
  de: 'Betätigung der Kontrollleuchte zentrales Schließen der Öffnungen'
  pl: 'Sterowanie lampki kontrolnej centralnego zamykania drzwi i pokryw'
  hu: 'A nyílászárók központi zárás visszajelző aktiválása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the central door and window closing indicator lamp'
      fr: 'Commande du voyant de fermeture centralisée des ouvrants'
      es: 'Mando del testigo de cierre centralizado de los abribles'
      de: 'Betätigung der Kontrollleuchte zentrales Schließen der Öffnungen'
      pl: 'Sterowanie lampki kontrolnej centralnego zamykania drzwi i pokryw'
      hu: 'A nyílászárók központi zárás visszajelző aktiválása'
    max_duration_ms: 3000
