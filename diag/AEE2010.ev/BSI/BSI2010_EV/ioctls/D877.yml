ioctl: 0xD877
name: 'CONTROL_FIXED_LIGHTING_LED_HAZARD_WARNING_LAMPS'
display_name:
  en: 'Control of fixed lighting of the LED on the hazard warning lamps button'
  fr: 'Commande d''allumage fixe de la LED du bouton des feux de détresse'
  es: 'Mando de encendido fijo del LED del botón de las luces de emergencia'
  de: 'Betätigung konstantes Leuchten der LED an der Taste für die Warnblinkanlage'
  pl: 'Sterowanie zapalania stałego diody LED przycisku świateł awaryjnych'
  hu: 'Az elakadásjelző nyomógomb LED visszajelző folyamatos világításának vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of fixed lighting of the LED on the hazard warning lamps button'
      fr: 'Commande d''allumage fixe de la LED du bouton des feux de détresse'
      es: 'Mando de encendido fijo del LED del botón de las luces de emergencia'
      de: 'Betätigung konstantes Leuchten der LED an der Taste für die Warnblinkanlage'
      pl: 'Sterowanie zapalania stałego diody LED przycisku świateł awaryjnych'
      hu: 'Az elakadásjelző nyomógomb LED visszajelző folyamatos világításának vezérlése'
    max_duration_ms: 3000
