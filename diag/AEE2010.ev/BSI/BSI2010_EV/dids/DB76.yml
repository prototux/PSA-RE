name: 'BSI_NO_ENGINE_IMMOBILISER_CODE_CODED_ENGINE'
display_name:
  en: 'BSI with no engine immobiliser code (coded engine immobiliser)'
  fr: 'BSI vierge de code antidémarrage (ADC)'
  es: 'BSI virgen de código antiarranque (ADC)'
  de: 'Zentralschalteinheit BSI ohne einprogrammierten Wegfahrsperrencode'
  pl: 'BSI bez kodu blokady rozruchu (ADC)'
  hu: 'Indításgátló kód (ADC) nélküli BSI'
comment:
  en: 'If the parameter is at the status "Yes" : the confidential code has not been programmed in the built-in systems interface. programme the built-in systems interface (engine immobiliser code and keys)'
  fr: 'Si le paramètre est à l''état "Oui" : le code confidentiel n''a pas été appris dans le boîtier de servitude intelligent. faire un apprentissage du boîtier de servitude intelligent (Code antidémarrage codé et clés)'
  es: 'Si el parámetro está en estado "Sí" : el código confidencial no ha sido aprendido en la caja de servicio inteligente. hacer un aprendizaje de la caja de servicio inteligente (código antiarranque y llaves)'
  de: 'Wenn der Parameter im Zustand "Ja" ist : der Geheimcode wurde in der Zentralschalteinheit BSI nicht gelernt. Zentralschalteinheit BSI programmieren (Code Wegfahrsperre und Schlüssel)'
  pl: 'Jeżeli stanem parametru jest "Tak" : poufny kod nie został wczytany w BSI. wykonać wczytywanie BSI (kod blokady rozruchu i kluczy)'
  hu: 'Ha a paraméter állapota "Igen" : a titkos kód nem került megismertetésre az intelligens kiszolgálóegységgel. végezze el az intelligens kiszolgálóegység inicializálását (kulcsok és indításgátló kód)'
kind: 'live'
access: 'read'
length: 1

