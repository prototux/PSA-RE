  de: 'Dieser Parameter nimmt den Wert "JA" an, wenn die BSI eine Meldung empfängt, die auf eine längere Betätigung einer Taste des eingespeicherten Schlüssels folgt'
  pl: 'Ten parametr przyjmuje wartość "TAK" kiedy BSI odbiera komunikat spowodowany długim naciśnięciem przycisku zaprogramowanego klucza'
  hu: 'Ennek a paraméternek az értéke IGEN-re vált, amikor a BSI a megtanult kulcs valamely nyomógombjának hosszan tartó lenyomásával keletkezo üzenetet kap'
