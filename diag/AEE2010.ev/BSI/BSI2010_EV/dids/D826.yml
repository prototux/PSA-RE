display_name:
  en: 'Status of the main beam headlamp assistant function'
  fr: 'Etat de la fonction assistant feux de route'
  es: 'Estado de la función asistente de las luces de carretera'
  de: 'Zustand der Funktion Fernlichtassistent'
  pl: 'Stan funkcji wspomagania świateł drogowych'
  hu: 'A fényszóró asszisztens funkció állapota'
comment:
  en: 'Please note : The availability of the function does not correspond with it being activated. When the function is available, it can be activated by the actions of the customer. If necessary, refer to the handbook.'
  fr: 'Attention : La disponibilité de la fonction ne correspond pas à l''activation de celle-ci. Lorsque la fonction est disponible, elle est activable par les commandes client. Si nécessaire, se référer à la notice de bord.'
  es: 'Atención : la disponibilidad de la función no corresponde a la activación de la misma. Cuando la función está disponible, se activa mediante los mandos cliente. Si es necesario, consultar el manual de empleo.'
  de: 'Vorsicht : Die Verfügbarkeit der Funktion entspricht nicht ihrer Aktivierung. Wenn die Funktion verfügbar ist, kann diese über die Betätigungen durch den Kunden aktiviert werden. Siehe wenn nötig die Bedienungsanleitung'
  pl: 'Uwaga : Dostępność funkcji nie jest równoważna włączeniu funkcji. Gdy funkcja jest dostępna, funkcję można włączyć za pomocą elementów sterowania klienta. Jeżeli jest to konieczne, odwołać się do instrukcji pokładowej.'
  hu: 'Figyelem : A funkció rendelkezésre állása nem felel meg az aktiválásának. Amikor a funkció rendelkezésre áll az ügyfél kapcsolói által aktiválható. Ha szükséges tekintse meg a kezelési útmutatót.'
kind: 'live'
