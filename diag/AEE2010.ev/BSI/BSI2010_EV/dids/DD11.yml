did: 0xDD11
name: 'BSI_ANTI_SCANNING_MODE'
display_name:
  en: 'BSI in Anti-Scanning mode'
  fr: 'BSI en Anti-Scanning'
  es: 'BSI en Anti-Scanning'
  de: 'Zentralschalteinheit BSI in Antiscanning'
  pl: 'BSI w antyskaningu'
  hu: 'Intelligens kiszolgálóegység (BSI) Anti-Scanning üzemmódban'
comment:
  en: 'Causes : Following three failed attempts to recognise the key transponder at IGN+, the BSI locks for one quarter of an hour. During the key programming procedure, the confidential code sent to the BSI was not recognised after three attempts. the BSI changes to antiscanning mode for a quarter of an hour.'
  fr: 'Causes : Suite à trois échecs de reconnaissance du transpondeur de la clé au +APC, le BSI se verrouille pendant un quart d''heure. Lors de la procédure d''apprentissage des clés, le code confidentiel envoyé au BSI n''a pas été reconnu suite à trois tentatives d''essai. Le boîtier de servitude intelligent passe en mode antiscaning pendant un quart d''heure.'
  es: 'Causas : Después de tres fracasos de reconocimiento del transpondedor de la llave en el +APC, la BSI se bloquea durante un cuarto de hora. Durante el proceso de aprendizaje de las llaves, el código confidencial enviado a la BSI no ha sido reconocido durante tres intentos de pruebaç. La caja de servicio inteligente pasa a modo antiescáning durante un cuarto de hora.'
  de: 'Ursachen : Nach drei erfolglosen Versuchen, den Schlüsseltransponder bei Zündungsplus zu erkennen, sperrt sich die BSI für eine Viertelstunde. Bei der Einspeicherung der Schlüssel wurde der an die BSI gesendete vertrauliche Code nach drei Versuchen nicht erkannt. die Zentralschalteinheit wechselt für eine Viertelstunde in den Modus antiscanning.'
  pl: 'Przyczyny : W wyniku trzech nieudanych prób rozpoznania transpondera kluczyka przy +APC, moduł BSI blokuje się na 15 minut. Podczas programowania danych kluczy, kod poufny przesłany do BSI nie został rozpoznany w trzech kolejnych próbach. inteligentny moduł sterujący przechodzi do trybu antiscanning na czas jednego kwadransa.'
  hu: 'Okok : A kulcstranszponder három sikertelen gyújtás utáni pluszon (+APC) történő felismerését követően a BSI egynegyed óra alatt reteszelődik. A kulcsok tanulási folyamata során három próbálkozás után a BSI-re küldött bizalmas kód nem kerül elfogadásra. az intelligens szolgalmi egység negyedórára antiscanning módra vált.'
kind: 'live'
access: 'read'
length: 1

