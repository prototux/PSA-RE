did: 0xDACB
name: 'REMOTE_CONTROL_1_SYNCHRONISED'
display_name:
  en: 'Remote control 1 synchronised'
  fr: 'Télécommande 1 synchronisée'
  es: 'Telemando 1 sincronizado'
  de: 'Fernbedienung 1 synchronisiert'
  pl: 'Zsynchronizowany pilot zdalnego sterowania 1'
  hu: 'Szinkronizált 1 távirányító'
comment:
  en: 'This data changes to YES on a synchronisation or a press on the already synchronised 1 remote control The datum is restored to "No" 10 seconds after the last press on the synchronised high frequency remote control and when the built-in systems interface becomes dormant.'
  fr: 'Cette donnée passe à OUI lors d''une synchronisation ou d''un appui sur la télécommande 1 déjà synchronisée La donnée est remise à "Non" 10 secondes après le dernier appui sur la télécommande haute fréquence synchronisée et à l''endormissement du boîtier de servitude intelligent.'
  es: 'Este dato pasa a SI en una sincronización o un impulso en el telemando 1 ya sincronizado El dato se pone en "No" 10 segundos después de la última pulsación del mando a distancia alta frecuencia sincronizado y cuando la caja de servicio inteligente se adormece.'
  de: 'Dieser Parameter geht auf JA bei einer Synchronisierung oder einem Druck auf die bereits synchronisierte Fernbedienung 1 Der Wert wird 10 Sekunden nach dem letzten Drücken der synchronisierten Hochfrequenz-Fernbedienung und bei der Deaktivierung der Zentralschalteinheit auf "Nein" zurückgesetzt.'
  pl: 'Dane przechodzą w stan TAK w przypadku synchronizacji lub naciśnięcia na już zsynchronizowany 1 pilot Wartość jest ustawiona na "Nie" 10 sek po ostatnim naciśnięciu na zsynchronizowane zdalne sterowanie wysokiej częstotliwości i przy uśpieniu inteligentnego modułu sterującego.'
  hu: 'Ez az adat IGEN-re vált egy szinkronozálás során vagy a már szinkronizált távirányító 1 megnyomásakor Az adat "Nem" re lett állítva 10 másodperccel a szinkronizált nagyfrekvenciás távirányító utolsó megnyomása után és az intelligens kiszolgálóegység elalvásakor.'
kind: 'live'
access: 'read'
length: 1

