did: 0xDD12
name: 'ENGINE_CONTROL_UNIT_LOCKED'
display_name:
  en: 'Engine control unit locked'
  fr: 'Calculateur moteur verrouillé'
  es: 'Calculador motor bloqueado'
  de: 'Motor-Steuergerät gesperrt'
  pl: 'Kalkulator silnika zablokowany'
  hu: 'Reteszelt befecskendező-vezérlő egység'
comment:
  en: 'Locking status of the engine management ECU as seen by the BSI. This parameter goes to the status NO when there is a mutual recognition between the BSI and the engine ECU.'
  fr: 'Etat de verrouillage du calculateur contrôle moteur vu par le boîtier de servitude intelligent. Ce paramètre passe à l''état NON lorsqu''il y a une reconnaissance mutuelle entre le boîtier de servitude intelligent et le calculateur contrôle moteur.'
  es: 'Estado de bloqueo del calculador de control motor visto por la caja de servicio inteligente. este parámetro pasa a estado NO cuando se produce un reconocimiento mutuo entre la caja de servicio inteligente y el calculador de control motor.'
  de: 'Von der Zentralschalteinheit erfasster Zustand Verriegelung des Motorsteuergeräts. Dieser Parameter geht in den Zustand NEIN über, wenn sich Zentralschalteinheit und Motorsteuergerät erkannt haben.'
  pl: 'Stan blokady kalkulatora sterującego silnikiem widziany przez inteligentny moduł sterujący. Ten parametr zmienia stan na NIE, gdy nastąpi wzajemne rozpoznanie między inteligentnym modułem sterującym i kalkulatorem sterującym silnika.'
  hu: 'A befecskendezés-computer intelligens kiszolgálóegység által látott reteszelési állapota. Ezen paraméter NEM állapotra tér át amikor az intelligens kiszolgálóegység és a befecskendezés-computer kölcsönösen felismerik egymást.'
kind: 'live'
access: 'read'
length: 1

