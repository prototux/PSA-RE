name: 'COUNTER_PROHIBITIONS_STOPPING_ENGINE_DUE_NETWORK'
display_name:
  en: 'Counter of prohibitions of stopping of the engine due to the network voltage retaining device following a request for immobilisation of the vehicle over a serious failure during the last 20-40 kilometres'
  fr: 'Compteur d''interdiction d''arrêt du moteur dû au dispositif de maintien de tension réseau suite à une demande d''immobilisation du véhicule sur défaillance grave durant les 20-40 derniers kilomètres'
  es: 'Contador de prohibición de parada del motor debido al dispositivo de mantenimiento de tensión red tras una solicitud de inmovilización del vehículo por fallo grave durante los 20-40 últimos kilómetros'
  de: 'Zähler Unterbindung Motor abstellen aufgrund der Vorrichtung zum Halten der Spannung des Netzes nach einer Anforderung zum Abstellen des Fahrzeugs bei einem schweren Defekt während der 20-40 letzten Kilometer'
  pl: 'Licznik zakazów zatrzymania silnika związany z urządzeniem utrzymania napięcia sieci, na skutek żądania zatrzymania samochodu z powodu poważnej niesprawności, w czasie 20-40 ostatnich kilometrów'
  hu: 'A gépjárműnek az utolsó 20-40 kilométer alatti súlyos meghibásodással kapcsolatos leállítási kérését követően a hálózati feszültség fenntartó berendezés miatti motorleállás letiltás számláló'
