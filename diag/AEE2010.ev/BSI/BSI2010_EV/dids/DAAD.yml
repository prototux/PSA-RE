  fr: 'Indique si l''ouvrant arrière (Coffre ou zone de charge) est autorisé à s''ouvrir de l''extérieur.'
  es: 'Indica si el acceso trasero (maletero o zona de carga) está autorizado para abrirse desde el exterior.'
  de: 'Zeigt an, ob sich die hintere Öffnung (Kofferraum oder Ladefläche) von außen öffnen lässt.'
  pl: 'Wskazuje, czy tylne drzwi albo klapa (bagażnik albo przestrzeń ładunkowa) ma zezwolenie na otwieranie z zewnątrz.'
  hu: 'Jelzi, hogy a hátsó nyílászáró (csomagtartó vagy rakodási zóna) kívülről történő nyitódása engedélyezett.'
