display_name:
  en: 'Counter of restarting of the engine by the Stop and Start function'
  fr: 'Compteur de redémarrage du moteur par la fonction Stop and Start'
  es: 'Contador de arranques de motor por la función Stop and Start'
  de: 'Schalter Motor wieder anlassen durch die Funktion Stop and Start'
  pl: 'Licznik rozruchów silnika dla funkcji Stop and Start'
  hu: 'A motor újraindításának számlálója a Stop and Start funkció által'
comment:
  en: 'The Stop and Start function with a reversible alternator only counts the number of restarts The Stop and Start function with a starter counts the number of starts and restarts'
  fr: 'La fonction Stop and Start avec un alternateur réversible comptabilise que le nombre de redémarrage La fonction Stop and Start avec un démarreur comptabilise le nombre de démarrage et de redémarrage'
  es: 'La función Stop and Start con un alternador reversible contabiliza sólo el número de arranques La función Stop and Start con un alternador contabiliza el número de arranques y rearranques'
  de: 'Die Funktion Stop and Start mit einem reversiblen Generator zählt nur die Anzahl der Neustarts Die Funktion Stop and Start mit einem Anlasser zählt die Anzahl der Starts und Neustarts'
  pl: 'Funkcja Stop and Start z alternatorem odwracalnym zlicza tylko ilość ponownych rozruchów Funkcja Stop and Start z rozrusznikiem zlicza ilość rozruchów i ponownych rozruchów'
  hu: 'A Stop and Start funkció egy megfordítható generátor esetén csupán az újraindítás számát regisztrálja A Stop and Start funkció egy indítómotor esetén az indítások és újraindítások számát is regisztrálja'
