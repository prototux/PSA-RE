did: 0xDA30
name: 'ABUSIVE_CONDITION_MAINTAINING_CAN_LS_NETWORKS'
display_name:
  en: 'Abusive condition of maintaining of the CAN_LS networks (passenger compartment)'
  fr: 'Condition abusive de maintien des réseaux CAN LS (habitacle)'
  es: 'Condición abusiva de mantenimiento de las redes CAN LS (habitáculo)'
  de: 'Falsche Bedingung für das Halten der Netze CAN LS (Innenraum)'
  pl: 'Nadmierny warunek utrzymania sieci CAN LS (kabina)'
  hu: 'CAN LS hálózatokat fenntartó jogtalan feltétel (utastér)'
comment:
  en: 'Condition recorded the last time the CAN_LS networks became dormant (passenger compartment). The status of the parameter is updated after the CAN_LS networks have become dormant (5 minutes maximum) then been triggered (passenger compartment)'
  fr: 'Condition enregistrée lors du dernier endormissement des réseaux CAN_LS (habitacle). L''état du paramètre est mis à jour après un endormissement (5 minutes maximum) suivi d''un réveil des réseaux CAN_LS (habitacle)'
  es: 'Condición registrada en el último adormecimiento de las redes CAN_LS (habitáculo). El estado del parámetro se actualiza después de un adormecimiento (5 minutos máximo) seguido de un despertado de las redes CAN_LS (habitáculo)'
  de: 'Bei der letzten Deaktivierung der Netze CAN_LS gespeicherte Bedingung (Fahrgastraum). Der Zustand des Parameters wird nach einer Deaktivierung (5 Minuten maximal) gefolgt von einer Aktivierung der Netze CAN_LS aktualisiert (Fahrgastraum)'
  pl: 'Warunek odnotowany w czasie ostatniego uśpienia sieci CAN_LS (kabina). Stan parametru jest aktualizowany po uśpieniu (5 min maksimum) po którym następuje przebudzenie sieci CAN_LS (kabina)'
  hu: 'A CAN_LS hálózatok utolsó elalvása során elmentett feltétel (utastér). A paraméter állapota fel van frissítve a CAN_LS hálózatok egy ébresztését követő elalvása (maximum 5 perc) után (utastér)'
kind: 'live'
access: 'read'
length: 1

