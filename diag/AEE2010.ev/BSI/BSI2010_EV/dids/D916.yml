comment:
  en: 'The air conditioning system is "ON" when the air conditioning control panel is lit up (Ventilation, hot and cold air production active).'
  fr: 'Le système de climatisation est à "ON" lorsque la façade de climatisation est allumée (Ventilation, production de chaud et de froid active).'
  es: 'El sistema de climatización está en "ON" cuando el frontal de climatización está encendido (Ventilación, producción de calor y de frío activa).'
  de: 'Die Klimaanlage steht auf "ON", wenn das Klimaanlagenbedienteil eingeschaltet ist (Ventilation, Wärme- und Kälteerzeugung aktiv).'
  pl: 'System klimatyzacji jest włączony ("ON") kiedy panel czołowy klimatyzacji jest podświetlony (Wentylacja, wytwarzanie ciepła i zimna włączone).'
  hu: 'A klímaberendezés "ON" állásban van, amikor a klímaberendezés előlapja ki van gyulladva (Szellőztetés, fűtés és hűtés aktív).'
