did: 0xDA45
name: 'ALTERNATOR_REFERENCE_VOLTAGE'
display_name:
  en: 'Alternator reference voltage'
  fr: 'Tension de consigne alternateur'
  es: 'Tensión de consigna del alternador'
  de: 'Spannung Sollwert Generator'
  pl: 'Napięcie zadane alternatora'
  hu: 'Generátor előírt feszültsége'
comment:
  en: 'Alternator reference voltage sent to the engine ECU or to the DC/DC converter on a hybrid vehicle. This parameter displays only if the vehicle has a piloted type alternator'
  fr: 'Tension de consigne alternateur envoyée au calculateur contrôle moteur ou au convertisseur DC/DC d''un véhicule hybride. Ce paramètre ne s''affiche que si le véhicule est équipé d''un alternateur de type piloté'
  es: 'Tensión de la consigna del alternador enviada al calculador control motor o al convertidor DC/DC de un vehículo híbrido. Este parámetro se indica sólo si el vehículo está equipado con un alternador de tipo pilotado'
  de: 'An das Motorsteuergerät oder an den Wandler DC/DC eines Hybridfahrzeugs gesendete Sollspannung Generator. Dieser Parameter wird nur angezeigt, wenn das Fahrzeug mit einem gesteuerten Generator ausgestattet ist'
  pl: 'Wartość zadana napięcia alternatora przesłana do kalkulatora sterującego silnika lub do konwertera DC/DC pojazdu hybrydowego. Ten parametr wyświetla się gdy samochód jest wyposażony w alternator typu sterowanego'
  hu: 'Generátornak befecskendezés computerhez, vagy egy hibrid gépkocsi DC/DC átalakítójához elküldött előírt feszültsége. Ez a paraméter csak abban az esetben kerül kijelzésre, ha a gépkocsi fel van szerelve egy vezérelt típusú generátorrral'
kind: 'live'
access: 'read'
length: 1

params:
