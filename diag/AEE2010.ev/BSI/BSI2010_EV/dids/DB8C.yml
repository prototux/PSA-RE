did: 0xDB8C
name: 'STEERING_WHEEL_ANGLE'
display_name:
  en: 'STEERING WHEEL ANGLE'
  fr: 'Angle volant'
  es: 'ÁNGULO VOLANTE'
  de: 'LENKWINKEL'
  pl: 'KĄT KIEROWN.'
  hu: 'KORMÁNYSZÖGHELYZET'
comment:
  en: 'Measurement of the value of the steering wheel angle returned by the sensor. this value increases if the steering wheel is turned anticlockwise and decreases if the steering wheel is turned clockwise'
  fr: 'Mesure de la valeur de l''angle volant remontée par le capteur. cette valeur s''incrémente si le volant est tourné dans le sens trigonométrique et se décrémente si le volant est tourné dans le sens inverse'
  es: 'Medición del valor del ángulo volante memorizado por el captador. este valor aumenta si el volante ha sido girado en el sentido trigonométrico y disminuye si el volante ha sido girado en el sentido contrario'
  de: 'Messung des vom Sensor übermittelten Wertes des Lenkradwinkels. Dieser Wert erhöht sich, wenn das Lenkrad in trigonometrischer Richtung gedreht wird und verringert sich, wenn das Lenkrad in entgegengesetzter Richtung gedreht wird'
  pl: 'Pomiar wartości kąta obrotu koła kierownicy przekazanej przez czujnik. wartość ta jest inkrementowana, jeżeli koło kierownicy obracane jest w kierunku trygonometrycznym i jest dekrementowana, jeżeli jest obracane w przeciwnym kierunku'
  hu: 'Kományszög-érzékelő által mért kormánykerékszög értéke. ez az érték a kormánykerék óramutató járásával megegyező irányba történő forgatásával növekszik és ellenkező irányban történő forgatáskor csökken'
kind: 'live'
access: 'read'
length: 2

