did: 0xDB99
name: 'DURATION_JOURNEY_2'
display_name:
  en: 'Duration of journey 2'
  fr: 'Durée du trajet 2'
  es: 'Duración del trayecto 2'
  de: 'Dauer der Strecke 2'
  pl: 'Czas pokonania trasy 2'
  hu: 'Az útvonal 2 időtartama'
comment:
  en: 'The duration of trip 2 corresponds to the number of seconds elapsed since the last zero reset of the data of tab 2 of the trip computer.The value indicated gives a running total for several journeys if the data of tab 2 on the trip computer are not reset for each journey.'
  fr: 'La durée du trajet 2 correspond au nombre de secondes écoulées depuis la dernière remise à zéro des données de l''onglet 2 de l''ordinateur de bord.La valeur indiquée peut cumuler plusieurs trajets dans le cas où les données de l''onglet 2 de l''ordinateur de bord ne sont pas remises à zéro à chaque trajet.'
  es: 'La duración del trayecto 2 corresponde al número de segundos transcurridos desde la última puesta a cero de los datos de la pestaña 2 del ordenador de a bordo.El valor indicado puede acumular varios trayectos en el caso en que los datos de la pestaña 2 del ordenador de a bordo no se pongan a cero en cada trayecto.'
  de: 'Die Dauer der Strecke 2 entspricht der Anzahl verstrichener Sekunden seit der letzen Rückstellung der Daten der Funktion 2 des Bordcomputers auf Null.Der angezeigte Wert kann mehrere Strecken kumulieren, falls die Daten der Funktion 2 des Bordcomputers nicht bei jeder Strecke auf Null zurückgestellt werden.'
  pl: 'Czas trwania odcinka 2 odpowiada ilości sekund, które upłynęły od ostatniego wyzerowania danych zakładki 2 komputera pokładowego.Wartość wskazana może zawierać sumę licznych przejazdów w przypadku gdy dane zakładki 2 komputera pokładowego nie zostały wyzerowane dla każdego przejazdu.'
  hu: 'A 2 útvonal időtartama megfelel a fedélzeti számítógép 2 füle adatainak utolsó nullázása óta eltelt másodpercek számának.A kijelzett érték egy vagy több útvonalat összesíthet abban az esetben, amikor a fedélzeti számítógép 2 füle adatai nem kerülnek nullázásra minden útvonalnál..'
kind: 'live'
access: 'read'
length: 4

