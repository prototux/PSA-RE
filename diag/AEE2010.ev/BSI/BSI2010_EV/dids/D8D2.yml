  de: 'Aufgrund der vom Motorsteuergerät empfangenen Informationen anzunehmender Zustand. die Funktion ist auf "nicht aktivierbar" gesetzt, solange die Bedingungen zur Aktivierung nicht erfüllt sind'
  pl: 'Stan zredukowany informacji otrzymanych z kalkulatora kontroli silnika. funkcja jest "nie do aktywacji" gdy warunki aktywacji nie są spełnione'
  hu: 'A befecskendezés-computertől kapott információkból kiszámított állapot. a funkció "nem aktiválható" állapotú akkor, amikor a aktiválási feltételek nem adottak'
kind: 'live'
access: 'read'
length: 1

