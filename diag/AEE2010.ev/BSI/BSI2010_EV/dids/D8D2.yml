did: 0xD8D2
name: 'CRUISE_CONTROL_SPEED_LIMITER_STATUS_BSI'
display_name:
  en: 'Cruise control/speed limiter status in the BSI'
  fr: 'Etat de la régulation/limitation de vitesse dans le boîtier de servitude intelligent'
  es: 'Estado de la regulación/limitación de velocidad en la caja de servicio inteligente'
  de: 'Zustand Geschwindigkeitsregler/Geschwindigkeitsbegrenzer in der Zentralschalteinheit'
