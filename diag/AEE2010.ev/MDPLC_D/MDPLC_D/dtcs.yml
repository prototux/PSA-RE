'B1778':
  raw: '9778'
  display_name:
    en: 'Lack of coherence between the fitting side definitively memorised in the sliding side door ECU and the signal received on the sliding side door ECU fitting side selection pin'
    fr: 'Incohérence entre le côté de montage définitivement mémorisé dans le calculateur de porte latérale coulissante et le signal reçu sur la broche de sélection du côté de montage du calculateur de porte latérale coulissante'
    es: 'Incoherencia entre el lado de montaje definitivamente memorizado en el calculador de puerta lateral corredera y la señal recibida en el terminal de selección del lado de montaje del calculador de puerta lateral corredera'
    de: 'Abweichung zwischen der definitiv im Steuergerät Seitenschiebetür gespeicherten Montageseite und dem an der Auswahlklemme der Montageseite des Steuergeräts Seitenschiebetür empfangenen Signal'
    pl: 'Niespójność między stroną zamontowania zapamiętaną definitywnie w kalkulatorze drzwi bocznych przesuwnych i otrzymanym sygnałem na styku wyboru strony zamontowania kalkulatora drzwi bocznych przesuwnych'
    hu: 'Koherencia hiánya az oldalsó tolóajtó számítógépében végérvényesen memorizált szerelési oldal és az oldalsó tolóajtó számítógép szerelési oldal kiválasztó pólusán fogadott jel között'
  clues:
    en: 'If the 2 sliding side door ECUs have this fault in the memory, physically invert the ECUs on the vehicle'
    fr: 'Si les 2 calculateurs de porte latérale coulissante ont ce défaut en mémoire, inverser physiquement les calculateurs sur le véhicule'
    es: 'Si los 2 calculadores de puerta lateral corredera tienen este defecto en la memoria, invertir físicamente los calculadores en el vehículo'
    de: 'Wenn die 2 Steuergeräte Seitenschiebetür diesen Fehler im Speicher haben, die Steuergeräte am Fahrzeug physisch vertauschen'
    pl: 'Jeżeli 2 kalkulatory drzwi bocznych przesuwnych mają ten defekt w pamięci, zamienić fizycznie kalkulatory w samochodzie'
    hu: 'Ha ezen hiba található a 2 oldalsó tolóajtó számítógép memóriájában, cserélje fel fizikailag a számítógépeket a gépjárművön'
  failure_types:
    0x11:
      en: 'Inversion of the fitting side of the sliding side door ECU or selection pin short-circuited to earth'
      fr: 'Inversion de côté de montage du calculateur de porte latérale coulissante ou broche de sélection en court-circuit à la masse'
      es: 'Inversión de lado de montaje del calculador de puerta lateral corredera o terminal de selección en cortocircuito a masa'
      de: 'Vertauschung der Montageseite des Steuergeräts Seitenschiebetür oder Auswahlklemme in Kurzschluss an Masse'
      pl: 'Zamiana strony zamontowania kalkulatora drzwi bocznych przesuwnych lub styk wyboru zwarty z masą'
      hu: 'Oldalsó tolóajtó számítógép szerelési oldalának felcserélése vagy a kiválasztó pólus testzárlatos'
    0x15:
      en: 'Inversion of the fitting side of the sliding side door ECU or selection pin short-circuited to positive or open circuit'
      fr: 'Inversion de côté de montage du calculateur de porte latérale coulissante ou broche de sélection en court-circuit au plus ou circuit ouvert'
      es: 'Inversión de lado de montaje del calculador de puerta lateral corredera o terminal de selección en cortocircuito a positivo o circuito abierto'
      de: 'Vertauschung der Montageseite des Steuergeräts Seitenschiebetür oder Auswahlklemme in Kurzschluss an Plus oder Stromkreis offen'
