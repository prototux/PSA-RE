ioctl: 0xD430
name: 'CONTROL_SLIDING_SIDE_DOOR_BUZZER'
display_name:
  en: 'Control of the sliding side door buzzer'
  fr: 'Commande du bruiteur de la porte latérale coulissante'
  es: 'Mando del indicador sonoro de la puerta lateral corredera'
  de: 'Ansteuerung des Summers der Seitenschiebetür'
  pl: 'Sterowanie brzęczyka drzwi bocznych przesuwnych'
  hu: 'Az oldalsó tolóajtó hangjelző vezérlése'
