ioctl: 0xD450
name: 'CONTROL_LIGHTING_SLIDING_SIDE_DOOR_REAR_CONTROL'
display_name:
  en: 'Control of the lighting of the sliding side door rear control switch (if present)'
  fr: 'Commande de l''éclairage du commutateur arrière de commande de la porte latérale coulissante (si présent)'
  es: 'Mando de iluminación del conmutador trasero de mando de la puerta lateral corredera (si presente)'
  de: 'Ansteuerung der Beleuchtung des hinteren Betätigungsschalters der Seitenschiebetür (wenn vorhanden)'
  pl: 'Sterowanie podświetleniem tylnego włącznika sterowania drzwi bocznych przesuwnych (jeżeli występuje)'
  hu: 'Az oldalsó tolóajtó vezérlő hátsó kapcsoló világításának vezérlése. (ha van)'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_1:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the lighting of the sliding side door rear control switch (if present)'
      fr: 'Commande de l''éclairage du commutateur arrière de commande de la porte latérale coulissante (si présent)'
      es: 'Mando de iluminación del conmutador trasero de mando de la puerta lateral corredera (si presente)'
      de: 'Ansteuerung der Beleuchtung des hinteren Betätigungsschalters der Seitenschiebetür (wenn vorhanden)'
      pl: 'Sterowanie podświetleniem tylnego włącznika sterowania drzwi bocznych przesuwnych (jeżeli występuje)'
      hu: 'Az oldalsó tolóajtó vezérlő hátsó kapcsoló világításának vezérlése. (ha van)'
    max_duration_ms: 5000
