did: 0x0103
name: 'VEHICLE_SPEED_THRESHOLD_ENGAGEMENT_REVERSE_GEAR'
display_name:
  en: 'Vehicle speed threshold for engagement of reverse gear'
  fr: 'Seuil de vitesse du véhicule pour l''enclenchement de la marche arrière'
  es: 'Umbral de velocidad del vehículo para la selección de la marcha atrás'
  de: 'Geschwindigkeitsschwelle des Fahrzeugs für das Einlegen des Rückwärtsgangs'
  pl: 'Wartość progowa prędkości samochodu do włączenia wstecznego biegu'
  hu: 'Gépjármű sebesség küszöbérték a hátramenet kapcsolásához'
comment:
  en: 'Speed threshold below which the vehicle must be travelling before asking the user to engage reverse gear in order to begin the semi-automatic parallel or perpendicular parking'
  fr: 'Seuil de vitesse au-dessous duquel le véhicule doit rouler pour demander à l''utilisateur de passer la marche arrière pour débuter le stationnement semi-automatique en créneau ou en stationnement perpendiculaire'
  es: 'Umbral de velocidad por debajo del cual debe circular para que se indique al usuario que introduzca la marcha atrás para iniciar el estacionamiento semiautomático en línea o perpendicular'
  de: 'Geschwindigkeitsschwelle, unterhalb der das Fahrzeug fahren muss, um vom Fahrer das Einlegen des Rückwärtsgangs zu fordern, damit das halbautomatische Einparken in Längsrichtung oder quer beginnen kann'
  pl: 'Wartość progowa prędkości poniżej której powinien poruszać się samochód aby żądać od kierowcy włączenia wstecznego biegu celem rozpoczęcia półautomatycznego parkowania równoległego lub prostopadłego'
  hu: 'Sebesség küszöbérték, amely alatt a gépjármű gurulhat a hátramenet gépjárművezetőtől kért kapcsolása során a félautomata parkolás megkezdése végett a merőleges vagy úttal párhuzamos parkolás érdekében'
kind: 'live'
access: 'read'
