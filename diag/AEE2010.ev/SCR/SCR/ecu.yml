node: 'SCR'
model: 'SCR'
display_name:
  en: 'Urea injection (SCR) control unit (SCR)'
  fr: 'Calculateur d''injection d''uree (SCR) (SCR)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x6A1
    response_id: 0x681

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'

services: [0x10, 0x22, 0x27]

security_access:
  - level: 0x01
    algorithm: 'PSA_SEED_KEY'
    key: '0AF2'

identification:
  request: '22 F0 FE'
  part_number: '22.7-24.0'
  comment:
    en: 'The ECU part number is in data bytes 22 to 24 of the answer to 22 F0 FE (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 22 à 24 de la réponse à 22 F0 FE (DCB), elle donne la variante logicielle'

cars: ['C84', 'M33', 'T9', 'X74']

variants:
  C84C_V1:
    parts: ['933958']
    cars: ['C84']
  M3_M4_V1:
    parts: ['933958']
    cars: ['M33']
  T9_V1:
    parts: ['933958']
    cars: ['T9']
  X74_V1:
    parts: ['933958']
    cars: ['X74']
