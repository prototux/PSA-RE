ioctl: 0xD800
name: 'LIGHTING_ALL_WARNING_LAMPS'
display_name:
  en: 'Lighting of all the warning lamps'
  fr: 'Allumage de tous les témoins'
  es: 'Iluminación de todos los testigos'
  de: 'Aufleuchten aller Leuchten'
  pl: 'Zapalenie wszystkich kontrolek'
  hu: 'Minden visszajelzés kigyulladása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-3.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Lighting of all the warning lamps'
      fr: 'Allumage de tous les témoins'
      es: 'Iluminación de todos los testigos'
      de: 'Aufleuchten aller Leuchten'
      pl: 'Zapalenie wszystkich kontrolek'
      hu: 'Minden visszajelzés kigyulladása'
    max_duration_ms: 5000
  - display_name:
      en: 'Switching off of all of the warning lights'
      fr: 'Extinction de tous les témoins'
      es: 'Extinción de todos los testigos'
      de: 'Erlöschen aller Kontrollleuchten'
      pl: 'Zgaśnięcie wszystkich kontrolek'
      hu: 'Az összes visszajelzés kialvása'
    max_duration_ms: 5000
