did: 0xD442
name: 'EVAPORATOR_SENSOR_TEMPERATURE'
display_name:
  en: 'Evaporator sensor temperature'
  fr: 'Température de la sonde d''évaporateur'
  es: 'Temparatura de la sonda del evaporador'
  de: 'Temperatur des Verdampferfühlers'
  pl: 'Temperatura sondy parownika'
  hu: 'A párologtató szondájának hőmérséklete'
comment:
  en: 'Temperature measured by the evaporator sensor located in the air conditioning unit. typical values : - air conditioning compressor off for more than quarter of an hour: the temperature measured is close to the passenger compartment temperature. - Air conditioning compressor on, the temperature falls progressively to reach a value between 0 and 6°C (with an ambient temperature of approximately °C).'
  fr: 'Température mesurée par la sonde d''évaporateur située dans le groupe de climatisation. valeurs typiques : - compresseur de climatisation à l''arrêt depuis plus d''un quart d''heure : la température mesurée est proche de la température habitacle. - Compresseur de climatisation enclenché, la température descend progressivement pour atteindre une valeur comprise entre 0 et 6°C (avec une température ambiante d''environ °C).'
  es: 'Temperatura medida por la sonda del evaporador situada en el grupo de climatización. valores típicos : - compresor de climatización parado más de un cuarto de hora: la temperatura medida es parecida a la del habitáculo. - Con el compresor de climatización conectado, la temperatura desciende progresivamente para alcanzar un valor comprendido entre 0 y 6°C (con una temperatura ambiente aproximada de °C).'
  de: 'Temperaturmesswert des Verdampferfühlers in der Klimatisierungseinheit. Referenzwerte : - Klimaanlagenkompressor steht seit mehr als einer Viertelstunde still: Die gemessene Temperatur ist nahe der Innenraumtemperatur. - Bei eingeschaltetem Klimaanlagenkompressor sinkt die Temperatur schrittweise bis zu einem Wert zwischen 0 und 6°C (bei einer Umgebungstemperatur von ca. °C).'
  pl: 'Temperatura zmierzona przez sondę parownika, znajdującą się w zespole klimatyzacji. wartości typowe : - sprţţarka klimatyzacji wy. - Sprężarka klimatyzacji włączona, temperatura opada progresywnie aby osiągnąć wartość zawartą pomiędzy 0 i 6°C (przy temperaturze otoczenia około °C).'
  hu: 'A klímaberendezés-egységben elhelyezett párologtató szondája által mért hőmérséklet. tipikus értékek : - Több mint negyedórája leállított légkondícionásó kompresszor : a mért hőmérséklet közel azonos az utastér hőmérsékletével. - Bekapcsolt légkondícionáló kompresszor, a hőmérséklet fokozatosan csökken 0 és 6 °C közötti értékre (kb. °C-os kellemes hőmérséklettel).'
