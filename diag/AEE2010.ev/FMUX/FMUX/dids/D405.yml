  pl: 'Wartość wyświetlana zmienia się od 0 do 7 lub odwrotnie gdy pokrętło jest obracane w kierunku zgodnym lub przeciwnym do ruchu wskazówek zegara'
  hu: 'A kijelzett érték 0-ről 7-ra változik, vagy fordítva, amikor a forgógombot az óramutató járásával megegyező vagy azzal ellentétes irányban működtetjük'
