ioctl: 0xD503
name: 'CONTROL_LEDS'
display_name:
  en: 'Control of the LEDs'
  fr: 'Commande des LED'
  es: 'Mandos de LED'
  de: 'Steuerung der LEDs'
  pl: 'Sterowania LED-ów'
  hu: 'LED-ek vezérlései'
variants: ['IHM_AR_CENTRAL_FMUX_K0_V1']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_2:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the LEDs'
      fr: 'Commande des LED'
      es: 'Mandos de LED'
      de: 'Steuerung der LEDs'
      pl: 'Sterowania LED-ów'
      hu: 'LED-ek vezérlései'
    max_duration_ms: 5000
