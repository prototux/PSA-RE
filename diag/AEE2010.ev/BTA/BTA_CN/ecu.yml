node: 'BTA'
model: 'BTA_CN'
display_name:
  en: 'Standalone telematics unit (BTA_CN)'
  fr: 'Boitier telematique autonome (BTA_CN)'
protocols: ['KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'KWP-PSA2000'
    request_id: 0x77C
    response_id: 0x67C
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'
  0xC0:
    en: 'PSA diagnostic session'
    fr: 'Session de diagnostic PSA'

services: [0x10, 0x14, 0x17, 0x21, 0x27, 0x30, 0x31, 0x3B]

security_access:
  - level: 0x83
    algorithm: 'PSA_SEED_KEY'
    key: 'F4F4'

identification:
  request: '21 FE'
  part_number: '22.7-24.0'
  comment:
    en: 'The ECU part number is in data bytes 22 to 24 of the answer to 21 FE (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 22 à 24 de la réponse à 21 FE (DCB), elle donne la variante logicielle'

cars: ['B7', 'B75', 'B8', 'C84', 'G9', 'M33', 'P2', 'P8', 'R8', 'T9', 'W2', 'X7', 'X74', 'X8']

