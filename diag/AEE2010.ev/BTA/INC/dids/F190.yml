did: 0xF190
name: 'VIN'
display_name:
  en: 'Vehicle identification number'
  fr: 'Numéro d''identification du véhicule'
comment:
  en: 'This parameter is used to change the VIN entered in the audio system (which must be identical to that in the built-in systems interface).'
  fr: 'Ce paramètre permet de modifier le numéro de VIN saisi dans l''autoradio (qui doit être identique à celui contenu dans le boîtier de servitude intelligent).'
  es: 'Este parámetro permite modificar el número de VIN introducido en el autorradio (que debe ser idéntico al contenido en la caja de servicio inteligente).'
  de: 'Dieser Parameter erlaubt das Ändern der im Autoradio eingegebenen VIN (die identisch mit der in der Zentralschalteinheit enthaltenen sein muss).'
  pl: 'Ten parametr pozwala na modyfikację nr VIN wprowadzonego do radioodtwarzacza (który powinien być taki sam jak w BSI).'
  hu: 'Ezen paraméter lehetővé teszi az autórádióban megadott VIN-szám módosítását (amely azonos kell legyen az intelligens kiszolgálóegységben lévővel).'
kind: 'identification'
access: 'read-write'
length: 17

