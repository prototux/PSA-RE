did: 0xD409
name: 'STATUS_USB_INPUT_N_DEG_1'
display_name:
  en: 'Status of USB input N° 1'
  fr: 'Etat de l''entrée USB N° 1'
  es: 'Estado de la entrada USB N° 1'
  de: 'Zustand des USB-Eingangs Nr. 1'
  pl: 'Stan wejścia USB nr 1'
  hu: '1 számú USB bemenet állapota'
comment:
  en: 'The USB connection unit is absent : - No USB source is connected to the telematic system USB connection unit number 1 - A USB source is connected to the telematic system USB connection unit number 1 but is not recognised by the telematic system'
  fr: 'Le boîtier pour connexion USB est absent : - Aucune source USB n''est branchée sur le boîtier pour connexion USB numéro 1 du système télématique - Une source USB est branchée sur le boîtier pour connexion USB numéro 1 du système télématique, mais n''est pas reconnue par le système télématique'
  es: 'La caja para conexión USB está ausente : - No hay ninguna fuente USB conectada a la caja para la conexión USB número 1 del sistema telemático - Hay una fuente USB conectada a la caja para la conexión USB número 1 del sistema telemático, pero el sistema telemático no la reconoce'
  de: 'Die Steuereinheit für USB-Anschluss ist nicht vorhanden : - Keine USB-Quelle ist an der Steuereinheit für USB-Anschluss Nummer 1 des Telematik-Systems angeschlossen - Eine USB-Quelle ist an der Steuereinheit für USB-Anschluss Nummer 1 des Telematik-Systems angeschlossen, wird aber nicht vom Telematik-System erkannt'
  pl: 'Moduł przyłączeniowy USB jest nieobecny : - Żadne źródło USB nie jest podłączone do modułu przyłączeniowego USB numer 1 systemu telematyki - Źródło USB jest podłączone do modułu przyłączeniowego USB numer 1 systemu telematyki, ale nie jest ono rozpoznane przez system telematyki'
  hu: 'Az USB csatlakozáshoz hiányzik az egység : - Nincs USB forrás csatlakoztatva a telematikus egység 1 számú USB csatlakozás egységére - Egy USB forrás van csatlakoztatva a telematikus egység 1 számú USB csatlakozás egységére, de nem került felismerésre a telematikus egység által'
kind: 'live'
access: 'read'
length: 1

