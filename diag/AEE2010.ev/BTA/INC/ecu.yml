node: 'BTA'
model: 'INC'
display_name:
  en: 'Standalone telematics unit (INC)'
  fr: 'Boitier telematique autonome (INC)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x764
    response_id: 0x664
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'

resets:
  0x03:
    en: 'Soft reset'
    fr: 'Réinitialisation logicielle'
  0xFF:
    en: 'Reset 0xFF'
    fr: 'Réinitialisation 0xFF'

services: [0x10, 0x11, 0x14, 0x19, 0x22, 0x27, 0x2E, 0x2F, 0x31]

security_access:
  - level: 0x03

identification:
  request: '22 F0 80'
  part_number: '19.7-22.0'
  comment:
    en: 'The ECU part number is in data bytes 19 to 22 of the answer to 22 F0 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 19 à 22 de la réponse à 22 F0 80 (DCB), elle donne la variante logicielle'

cars: ['A88']

variants:
  A88C_V1:
    parts: ['00002853']
