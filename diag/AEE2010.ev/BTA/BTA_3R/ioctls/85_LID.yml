ioctl: 0x85
name: 'EMISSION_AUDIBLE_TONE_INDEPENDENT_TELEMATIC_UNIT'
display_name:
  en: 'Emission of an audible tone : Independent telematic unit speaker'
  fr: 'Emission d''un bip sonore : Haut-parleur du boîtier télématique autonome'
  es: 'Emisión de un bip sonoro : Altavoz de la caja telemática autónoma'
  de: 'Aussenden eines Signaltons : Lautsprecher der autonomen Telematik-Steuereinheit'
  pl: 'Emisja głośnego pisku : Głośnik autonomicznego modułu telematyki'
  hu: 'Hangjelzés kibocsátása : Az önálló telematikus egység hangszórója'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER_1:
    bits: '1.7-1.0'
    type: 'enum'

  CONTROL_PARAMETER_2:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x5A

  CONTROL_PARAMETER_3:
    bits: '3.7-3.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Emission of an audible tone : Independent telematic unit speaker'
      fr: 'Emission d''un bip sonore : Haut-parleur du boîtier télématique autonome'
      es: 'Emisión de un bip sonoro : Altavoz de la caja telemática autónoma'
      de: 'Aussenden eines Signaltons : Lautsprecher der autonomen Telematik-Steuereinheit'
      pl: 'Emisja głośnego pisku : Głośnik autonomicznego modułu telematyki'
      hu: 'Hangjelzés kibocsátása : Az önálló telematikus egység hangszórója'
  - display_name:
      en: 'Emission of an audible tone : External speaker'
      fr: 'Emission d''un bip sonore : Haut-parleur externe'
      es: 'Emisión de un bip sonoro : Altavoz exterior'
      de: 'Aussenden eines Signaltons : Externer Lautsprecher'
      pl: 'Emisja głośnego pisku : Głośnik zewnętrzny'
      hu: 'Hangjelzés kibocsátása : Külső hangszóró'
