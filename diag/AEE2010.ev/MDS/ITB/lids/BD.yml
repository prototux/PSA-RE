lid: 0xBD
name: 'LID_BD'
display_name:
  en: 'Data record 0xBD (7 values)'
  fr: 'Enregistrement 0xBD (7 valeurs)'
kind: 'live'
access: 'read'
length: 9

params:
  COMMUNICATION_TIME_AVAILABLE_EMERGENCY_CALL:
    bits: '1.7-1.0'
    comment:
      en: 'Communication time available (emergency call)'
      fr: 'Temps de communication disponible (appel de secours)'
      es: 'Tiempo de comunicación disponible (llamada de socorro)'
      de: 'Verfügbare Kommunikationszeit (Notruf)'
      pl: 'Dostępny czas komunikacji (połączenie awaryjne)'
      hu: 'Rendelkezésre álló kommunikációs idő (sürgősségi hívás)'
    type: 'enum'
    values:
      0x01:
        en: 'Time between 5 and 15 minutes'
        fr: 'Temps compris entre 5 et 15 minutes'
        es: 'Tiempo comprendido entre 5 y 15 minutos'
        de: 'Zeit zwischen 5 und 15 Minuten'
        pl: 'Czas zawarty pomiędzy 5 i 15 minut'
        hu: '5 és 15 perc közötti időtartam'
      0x02:
        en: 'Longer than 15 minutes'
        fr: 'Temps supérieur à 15 minutes'
        es: 'Tiempo superior a 15 minutos'
        de: 'Zeit über 15 Minuten'
        pl: 'Czas powyżej 15 minut'
        hu: 'Több mint 15 percig'

  CHARGE_STATUS_EMERGENCY_BATTERY:
    bits: '2.7-2.0'
    comment:
      en: 'Charge status of the emergency battery'
      fr: 'Etat de charge de la batterie de secours'
      es: 'Estado de carga de la batería de emergencia'
      de: 'Ladezustand der Notbatterie'
      pl: 'Stan naładowania akumulatora awaryjnego'
      hu: 'A biztonsági akkumulátor töltöttségi állapota'
    type: 'enum'
    values:
      0x00:
        en: 'Battery charged'
        fr: 'Batterie chargée'
        es: 'Batería cargada'
        de: 'Batterie geladen'
        pl: 'Naładowany akumulator'
        hu: 'Feltöltött akkumulátor'
      0x01:
        en: 'Battery charging'
        fr: 'Batterie en charge'
        es: 'Batería en carga'
        de: 'Batterie in Ladung'
        pl: 'Ładowany akumulator'
        hu: 'Akkumulátor töltésben'
      0x02:
        en: 'Battery discharged'
        fr: 'Batterie déchargée'
        es: 'Batería descargada'
        de: 'Batterie entladen'
        pl: 'Akumulator rozladowany'
        hu: 'Lemerült akkumulátor'
      0x03:
        en: 'Damaged battery'
        fr: 'Batterie endommagée'
        es: 'Batería dañada'
        de: 'Batterie beschädigt'
        pl: 'Akumulator uszkodzony'
        hu: 'Sérült akkumulátor'
      0x04:
        en: 'Battery missing'
        fr: 'Batterie absente'
        es: 'Batería ausente'
        de: 'Batterie nicht vorhanden'
        pl: 'Akumulator nieobecny'
        hu: 'Akkumulátor hiányzik'

  TIME_REMAINING_UNTIL_EMERGENCY_BATTERY_FULLY:
    bits: '3.7-3.0'
    comment:
      en: 'Time remaining until the emergency battery is fully charged'
      fr: 'Temps restant jusqu''à la charge complète de la batterie de secours'
      es: 'Tiempo restante hasta la carga completa de la batería de repuesto'
      de: 'Verbleibende Zeit bis zur vollständigen Ladung der Notbatterie'
      pl: 'Czas pozostały do pełnego naładowania akumulatora awaryjnego'
      hu: 'A biztonsági akkumulátor teljes feltöltéséig hátralevő idő'
    type: 'uint'
    factor: 5
    units: 'min'

  TIME_ELAPSED_SINCE_EMERGENCY_BATTERY_STOPPED:
    bits: '4.7-4.0'
    comment:
      en: 'Time elapsed since the emergency battery stopped charging'
      fr: 'Temps écoulé depuis l''arrêt de la recharge de la batterie de secours'
      es: 'Tiempo transcurrido desde la detención de la recarga de la batería de emergencia'
      de: 'Verstrichene Zeit seit dem Ende des Aufladens der Notbatterie'
      pl: 'Czas który upłynął od zatrzymania ładowania akumulatora awaryjnego'
      hu: 'A biztonsági akkumulátor töltésének leállítása óta eltelt idő'
    type: 'uint'
    units: 'min'

  TOTAL_NUMBER_COMPLETE_CHARGE_CYCLES_EMERGENCY:
    bits: '5.7-6.0'
    comment:
      en: 'Total number of complete charge cycles of the emergency battery'
      fr: 'Nombre total de cycles de recharge complets de la batterie de secours'
      es: 'Número total de ciclos de recarga completos de la batería de emergencia'
      de: 'Gesamtanzahl der vollständigen Wiederaufladezyklen der Notbatterie'
      pl: 'Całkowita liczba cykli kompletnego ładowania akumulatora awaryjnego'
      hu: 'A biztonsági akkumulátor teljes töltési ciklusainak száma összesen'
    type: 'uint'

  TOTAL_NUMBER_COMPLETE_AND_PARTIAL_CHARGE_CYCLES:
    bits: '7.7-8.0'
    comment:
      en: 'Total number of complete and partial charge cycles of the emergency battery'
      fr: 'Nombre total de cycles de recharge complets et partiels de la batterie de secours'
      es: 'Número total de ciclos de recarga completos y parciales de la batería de emergencia'
      de: 'Gesamtanzahl der vollständigen und teilweisen Wiederaufladezyklen der Notbatterie'
      pl: 'Całkowita liczba cykli kompletnego i cząstkowego ładowania akumulatora awaryjnego'
      hu: 'A biztonsági akkumulátor teljes és részleges töltési ciklusainak száma összesen'
    type: 'uint'

  LEVEL_ENERGY_AVAILABLE_SERVICE_BATTERY:
    bits: '9.7-9.0'
    comment:
      en: 'Level of energy available on the service battery'
      fr: 'Niveau d''énergie disponible sur la batterie de secours'
      es: 'Nivel de energía disponible en la batería de socorro'
      de: 'Energievorrat der Notbatterie'
      pl: 'Poziomy energii dostępne w akumulatorze awaryjnym'
      hu: 'A segédakkumulátoron rendelkezésre álló energia szint'
    type: 'uint'
    units: '%'
