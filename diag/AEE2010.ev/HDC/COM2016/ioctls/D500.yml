ioctl: 0xD500
name: 'WARNING'
display_name:
  en: 'Warning'
  fr: 'Alerte'
  es: 'Alerta'
  de: 'Warnmeldung'
  pl: 'Alarm'
  hu: 'Riasztás'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  TYPE_SOUND:
    bits: '2.7-2.0'
    type: 'enum'

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '3.7-3.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Warning'
      fr: 'Alerte'
      es: 'Alerta'
      de: 'Warnmeldung'
      pl: 'Alarm'
      hu: 'Riasztás'
    max_duration_ms: 2000
  - display_name:
      en: 'Refusal'
      fr: 'Refus'
      es: 'Rechazo'
      de: 'Ablehnung'
      pl: 'Odrzucenie'
      hu: 'Visszautasítás'
    max_duration_ms: 2000
  - display_name:
      en: 'Gong'
      fr: 'Gong'
    max_duration_ms: 2000
  - display_name:
      en: 'Lamps left on'
      fr: 'Oubli de feux'
      es: 'Olvido de las llaves'
      de: 'Vergessene Beleuchtung'
      pl: 'Pozostawienie włączonych świateł'
      hu: 'Bekapcsolva felejtett világítás'
    max_duration_ms: 2000
  - display_name:
      en: 'KEY IN IGNITION REMINDER'
      fr: 'Alerte oubli clé de contact'
      es: 'ALERTA OLVIDO LLAVE DE CONTACTO'
      de: 'WARNUNG SCHLÜSSEL NICHT ABGEZOGEN'
      pl: 'ALARM POZOSTAWIENIA KLUCZA W STACYJCE'
      hu: 'BENNFELEJTETT GYÚJTÁSKULCS RIASZTÁS'
