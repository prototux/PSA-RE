name: 'MODE_BUTTON'
display_name:
  en: 'MODE button'
  fr: 'Touche MODE'
  es: 'Tecla MODO'
  de: 'Taste MODE'
  pl: 'Przycisk TRYBU'
  hu: 'MODE nyomógomb'
comment:
  en: 'This button is for navigating on either the multifunction screen or the navigation screen, depending on vehicle equipment.'
  fr: 'Cette touche permet de naviguer, selon le niveau d''équipement du véhicule, sur l''écran multifonction ou l''écran de navigation.'
  es: 'Esta tecla permite navegar, según el nivel de equipamiento del vehículo, por la pantalla multifunción o la pantalla de navegación.'
  de: 'Diese Taste ermöglicht je nach Ausstattungsniveau des Fahrzeugs die Navigation auf der Multifunktionsanzeige oder dem Display Navigation.'
  pl: 'Przycisk ten umożliwia, w zależności od poziomu wyposażenia pojazdu, przemieszczanie się po ekranie wielofunkcyjnym albo po ekranie nawigacji.'
  hu: 'Ez a nyomógomb lehetővé teszi a navigálást, a gépkocsi felszereltségi szintjétől függően a többfunkciós képernyőn vagy a navigációs képernyőn.'
