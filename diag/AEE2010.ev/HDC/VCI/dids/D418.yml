did: 0xD418
name: 'VOLUME_THUMBWHEEL'
display_name:
  en: 'Volume thumbwheel'
  fr: 'Molette de volume'
  es: 'Moleta de volumen'
  de: 'Lautstärke-Knopf'
  pl: 'Pokrętło siły głosu'
  hu: 'Hangerő gomb'
comment:
  en: 'The volume dial is used to increase or decrease the sound of the audio source. The volume knob is on the left-hand module of the steering wheel with integrated controls. Incremental value between -128 and +127.'
  fr: 'La molette de volume permet d''augmenter ou de diminuer le son de la source audio. La molette de volume se situe sur le module gauche du volant à commandes intégrées. Valeur incrémentale comprise entre -128 et + 127.'
  es: 'La ruedecilla de volumen permite subir o bajar el sonido de la fuente de audio. La ruedecilla de volumen está situada en el módulo izquierdo del volante de mandos integrados. Valor incremental comprendido entre -128 y + 127.'
  de: 'Das Lautstärke-Drehrad dient zum Erhöhen oder Verringern des Tons der Audioquelle. Das Lautstärke-Drehrad befindet sich am linken Modul des Lenkrads mit integrierten Bedienelementen. Hochgezählter Wert zwischen -128 und +127.'
  pl: 'Pokrętło siły głosu pozwala zmniejszać lub zwiększać siłę głosu źródła audio. Pokrętło siły głosu znajduje się na lewym module koła kierownicy z wbudowanymi sterowaniami. Wartosć przyrostowa zawarta między - 128 i + 127.'
  hu: 'A hangerő tekerőgomb lehetővé teszi az audio hangforrás hangjának növelését vagy csökkentését. A hangerőbeállító gomb a beépített kapcsolós kormánykerék bal modulján helyezkedik el. - 128 és + 127 között növelhető érték.'
