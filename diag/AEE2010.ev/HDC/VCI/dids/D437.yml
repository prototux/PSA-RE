did: 0xD437
name: 'VOLUME_CONTROL_VALIDATION_BUTTON'
display_name:
  en: 'Volume control validation button'
  fr: 'Touche de validation de la molette volume'
  es: 'Tecla de validación de la ruedecilla de volumen'
  de: 'Bestätigungstaste des Lautstärke-Drehknopfs'
  pl: 'Przycisk zatwierdzenia pokrętła siły głosu'
  hu: 'A hangerőgomb érvényesítő gombja'
comment:
  en: 'The volume dial validation button is used to temporarily mute the audio source sound. The volume dial confirmation button is located on the left-hand module of the integrated controls steering wheel.'
  fr: 'La touche de validation de la molette volume permet de couper temporairement le son de la source audio. La touche de validation de la molette volume se situe sur le module gauche du volant à commandes intégrées.'
  es: 'La tecla de validación de la ruedecilla del volumen permite interrumpir temporalmente el sonido de la fuente audio. La tecla de validación del mando giratorio volumen está situada en el módulo izquierdo del volante con mandos integrados.'
  de: 'Die Bestätigungstaste des Lautstärke-Drehrads dient zur vorübergehenden Unterbrechung des Tons der Audioquelle. Die Bestätigungstaste des Lautstärke-Drehknopfs befindet sich am linken Modul des Lenkrads mit integrierten Bedienelementen.'
  pl: 'Przycisk zatwierdzenia i pokrętło siły głosu pozwala wyłączyć czasowo dźwięk źródła audio. Przycisk zatwierdzenia pokrętła siły głosu umieszczony jest na lewym module koła kierownicy z wbudowanymi sterowaniami.'
  hu: 'A hangerő tekerőgomb érvényesítő gombja lehetővé teszi az audió hangforrás hang átmeneti lekapcsolását. A hangerő tekerőgomb érvényesítő gomb a beépített kapcsolós kormánykerék bal modulján helyezkedik el.'
