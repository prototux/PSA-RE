did: 0xD410
name: 'MATRIX_SCREEN_NAVIGATION_CONTROL'
display_name:
  en: 'Matrix screen navigation control'
  fr: 'Molette de navigation de l''écran matriciel'
  es: 'Botón giratorio de navegación de la pantalla matriz'
  de: 'Einstellrad zur Navigation auf der Matrixanzeige'
  pl: 'Pokrętło nawigacji ekranu matrycowego'
  hu: 'A mátrixpontos kijelző navigációs forgatógombja'
comment:
  en: 'This control is for navigating on the instrument panel matrix screen, if the vehicle has one. It is located on the integral controls steering wheel lower left module. incremental value between -128 and +127'
  fr: 'Cette molette permet de naviguer sur l''écran matriciel intégré au combiné, si celui-ci est présent sur le véhicule. Elle se situe sur le module bas gauche du volant à commandes intégrées. valeur incrémentale comprise entre -128 et +127'
  es: 'Este botón giratorio permite navegar por la pantalla matriz integrada en el combinado si éste está presente en el vehículo. Está situada en el módulo inferior izquierdo del volante de mandos integrados. valor incremental comprendido entre -128 y +127'
  de: 'Dieses Einstellrad ermöglicht die Navigation auf der in das Kombiinstrument integrierten Matrixanzeige, wenn diese im Fahrzeug vorhanden ist. Befindet sich am Modul unten links am Lenkrad mit integrierten Betätigungen. Hochzählwert zwischen - 128 und + 127'
  pl: 'To pokrętło pozwala nawigować na ekranie matrycowym wbudowanym w zestaw wskaźników, jeżeli ten jest obecny w samochodzie. Znajduje się na module dolnym lewym kierownicy z wbudowanymi sterowaniami. przyrost wartości między -128 i +127'
  hu: 'Ez a forgatógomb lehetővé teszi a a műszercsoport mátrixpontos kijelzőjén történő navigálást, ha az megtalálható a járművön. A beépített kapcsolós kormánykerék bal alsó modulján helyezkedik el. növekmény értéke -128 és +127 közötti'
