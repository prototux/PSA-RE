did: 0xD40D
name: 'POSITION_HEATING_CIRCUIT_SOLENOID_VALVE_INTERNAL'
display_name:
  en: 'Position of the heating circuit solenoid valve of the internal combustion engine'
  fr: 'Position de l''électrovanne du circuit de chauffage du moteur thermique'
  es: 'Posición de la electroválvula del circuito de calefacción del motor térmico'
  de: 'Position des Heizsystemelektroventils des Verbrennungsmotors'
  pl: 'Położenie elektrozaworu obwodu ogrzewania silnika spalinowego'
  hu: 'A belsőégésű motor fűtőköre mágnesszelepének helyzete'
comment:
  en: 'The solenoid valve is considered open when the value is between 8 and 30% The solenoid valve is considered closed when the value is between 70 and 92% An uncharacterised fault has been detected on the position sensor of the solenoid valve when the value is between 0 and 8% A short circuit or open circuit fault has been detected on the position sensor of the solenoid valve when the value is between 92 and 100%'
  fr: 'L''électrovanne est considérée ouverte lorsque la valeur est entre 8 et 30 % L''éléctrovanne est considérée fermée lorsque la valeur est entre 70 et 92 % Un défaut non caractérisé a été détecté sur le capteur de position de l''électrovanne lorsque la valeur est entre 0 et 8% Un défaut de court-circuit ou circuit ouvert a été détecté sur le capteur de position de l''électrovanne lorsque la valeur est entre 92 et 100%'
  es: 'La electroválvula se considera abierta cuando el valor está entre 8 y 30 % La electroválvula se considera cerrada cuando el valor está entre 70 y 92 % Un defecto no caracterizado ha sido detectado en el captador de posición de la electroválvula cuando el valor está entre 0 y 8% Un defecto de cortocircuito o circuito abierto ha sido detectado en el captador de posición de la electroválvula cuando el valor está entre 92 y 100%'
  de: 'Das Magnetventil wird als offen betrachtet, wenn der Wert zwischen 8 und 30 % liegt Elektroventil gilt als geschlossen, wenn der Wert zwischen 70 und 92 % liegt Ein unbestimmter Fehler wurde am Positionssensor des Elektroventils entdeckt, wenn der Wert zwischen 0 und 8 % beträgt Ein Kurzschluss oder ein offener Stromkreis wurde am Positionssensor des Elektroventils erkannt, wenn der Wert zwischen 92 und 100 % beträgt'
  pl: 'Elektrozawór uważa się za otwarty, jeżeli wartość wynosi między 8 a 30% Elektrozawór uznaje się za zamknięty, gdy wartość mieści się między 70 a 92% Na czujniku położenia elektrozaworu wykryto nieokreśloną usterkę przy wartości między 0 i 8% Na czujniku położenia elektrozaworu wykryto usterkę zwarcia lub obwodu otwartego przy wartości między 92 i 100%'
  hu: 'A mágnesszelep nyitottnak tekinthető, ha az érték 8 és 30% között van A mágnesszelep zártnak tekinthető, ha az érték 70 és 92% között van Nem jellemzett hiba észlelhető a mágnesszelep helyzetérzékelőjén, amikor az érték 0 és 8% között van Rövidzárlat vagy áramköri szakadás hiba észlelhető a mágnesszelep helyzetérzékelőjén, amikor az érték 92 és 100% között van'
kind: 'live'
access: 'read'
length: 1

