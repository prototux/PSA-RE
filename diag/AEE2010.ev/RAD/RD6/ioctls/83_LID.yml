ioctl: 0x83
name: 'EMISSION_FRONT_PARKING_ASSISTANCE_BEEP'
display_name:
  en: 'Emission of the front parking assistance beep'
  fr: 'Émission du bip sonore de l''aide au stationnement avant'
  es: 'Emisión de un bip de la ayuda al estacionamiento delantero'
  de: 'Aussenden eines Signaltons der Einparkhilfe vorne'
  pl: 'Emisja sygnału dźwiękowego "bip" pomocy w parkowaniu z przodu'
  hu: 'Az első parkolási segédlet hangjelzés kibocsátása'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x20

  DELAY_BEEP_AUTO_ADAPTIVE_SUSPENSION:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x00

  TYPE_AAS_BEEP:
    bits: '3.7-3.0'
    type: 'enum'
    default: 0x01

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Emission of the front parking assistance beep'
      fr: 'Émission du bip sonore de l''aide au stationnement avant'
      es: 'Emisión de un bip de la ayuda al estacionamiento delantero'
      de: 'Aussenden eines Signaltons der Einparkhilfe vorne'
      pl: 'Emisja sygnału dźwiękowego "bip" pomocy w parkowaniu z przodu'
      hu: 'Az első parkolási segédlet hangjelzés kibocsátása'
    max_duration_ms: 3000
  - display_name:
      en: 'Emission of the rear parking assistance beep'
      fr: 'Émission du bip sonore de l''aide au stationnement arrière'
      es: 'Emisión de un bip de la ayuda al estacionamiento trasero'
      de: 'Aussenden eines Signaltons der Einparhilfe hinten'
      pl: 'Emisja sygnału dźwiękowego "bip" pomocy w parkowaniu z tyłu'
      hu: 'A hátsó parkolási segédlet hangjelzés kibocsátása'
    max_duration_ms: 3000
