comment:
  en: 'Allows the modification of the VIN entered in the audio system (which must be identical to that contained in the built-in systems interface. WARNING : The VIN of a vehicle must always consist of upper case letters.'
  fr: 'Permet de modifier le code VIN saisi dans l''autoradio (qui doit être identique à celui contenu dans le Boîtier de Servitude Intelligent). ATTENTION : Le numéro de série d''un véhicule (VIN) doit toujours être composé de lettres en majuscule.'
  es: 'Permite modificar el código VIN capturado en el autorradio (que debe ser idéntico al contenido en la Caja de Servicio Inteligente). ATENCION : El número de serie de un vehículo (VIN) siempre debe estar compuesto por letras mayúsculas.'
  de: 'Ermöglicht die Veränderung der im Autoradio eingegebenen VIN (die mit der in der Zentralschalteinheit BSI gespeicherten Nummer identisch sein muss). ACHTUNG : Die VIN muss immer aus Großbuchstaben zusammengesetzt werden.'
  pl: 'Pozwala zmienić kod VIN wprowadzony do autoradia (który powinien być identyczny z zapisanym w BSI). UWAGA : Numer seryjny pojazdu (VIN) powinien zawsze składać się z dużych liter.'
  hu: 'Lehetővé teszi az autórádióba bevitt VIN-kód módosítását (amelynek azonosnak kell lennie az intelligens kiszolgálóegységben lévővel). FIGYELEM : A gépjármű szériaszámának (VIN) mindig nagybetűkből kell lennie.'
