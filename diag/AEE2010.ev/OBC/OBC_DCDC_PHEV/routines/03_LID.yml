routine: 0x03
name: 'ELECTRIC_DRIVE_TRAIN_AND_BOARD_CHARGER_DIRECT'
display_name:
  en: 'Electric drive train and on-board charger/direct voltage transformer assembly cooling circuit electric coolant pump'
  fr: 'Pompe à eau électrique du circuit de refroidissement de la chaîne de traction électrique et de l''ensemble chargeur embarqué / convertisseur de tension continue'
  es: 'Bomba de agua eléctrica del circuito de refrigeración de la cadena de tracción y del conjunto cargador integrado/convertidor de tensión continua'
  de: 'Elektrische Kühlmittelpumpe des Kühlsystems des Elektroantriebsstrangs und der Einheit Bordladegerät/Gleichspannungswandler'
  pl: 'Elektryczna pompa płynu układu chłodzenia łańcucha trakcji elektrycznej i zespołu ładowarki wbudowanej / przetwornicy napięcia stałego'
  hu: 'Az elektromos hajtáslánc hűtésköre és az egyenfeszültség átalakító/fedélzeti töltő egység elektromos vízpumpája'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  DID:
    bits: '1.7-2.0'
    type: 'enum'

results:
