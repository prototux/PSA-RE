  en: 'On-board charger / DC-DC (OBC_DCDC_PHEV)'
  fr: 'Chargeur embarque / convertisseur (OBC_DCDC_PHEV)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x590
    response_id: 0x58F

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
