      0x00:
        en: 'Inactive'
        fr: 'Inactif'
        es: 'Inactivo'
        de: 'Inaktiv'
        pl: 'Nieaktywny'
        hu: 'Nem muködik'
      0x01:
        en: 'Active'
        fr: 'Actif'
        es: 'Activo'
        de: 'Aktiv'
        pl: 'Aktywny'
        hu: 'Aktív'

  ADDITIVE_PUMP_PRIMING_STATUS:
    bits: '24.7-24.0'
    comment:
      en: 'Additive pump priming status'
      fr: 'Etat d''amorçage de la pompe d''additif'
