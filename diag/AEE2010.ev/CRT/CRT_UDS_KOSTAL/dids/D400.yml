    type: 'enum'
    values:
      0x00:
        en: 'Do not prime the additive pump'
        fr: 'Ne pas amorcer la pompe d''additif'
        es: 'No cebar la bomba de aditivo'
        de: 'Die Additivpumpe nicht entlüften'
        pl: 'Nie napełniać pompy dodatku'
        hu: 'Ne légtelenítse az adalékoló szivattyút'
      0x01:
        en: 'Prime the additive pump'
        fr: 'Amorcer la pompe d''additif'
        es: 'Cebar la bomba de aditivo'
        de: 'Die Additivpumpe entlüften'
        pl: 'Napełnić pompę dodatku'
        hu: 'Légtelenítse az adalékoló szivattyút'

