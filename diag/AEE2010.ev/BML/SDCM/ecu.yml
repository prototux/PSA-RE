node: 'BML'
model: 'SDCM'
display_name:
  en: 'Keyless entry and start module (SDCM)'
  fr: 'Boitier d''acces mains libres (SDCM)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x741
    response_id: 0x641
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'
  0x60:
    en: 'Supplier session'
    fr: 'Session fournisseur'

resets:
  0x03:
    en: 'Soft reset'
    fr: 'Réinitialisation logicielle'

services: [0x10, 0x11, 0x14, 0x19, 0x22, 0x27, 0x2E, 0x31, 0x3E]

security_access:
  - level: 0x03
    algorithm: 'PSA_SEED_KEY'
    key: 'A8EE'

tester_present:
  request: '3E 00'
  period_ms: 1000

identification:
  request: '22 F0 80'
  part_number: '8.7-12.0'
  comment:
    en: 'The ECU part number is in data bytes 8 to 12 of the answer to 22 F0 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 8 à 12 de la réponse à 22 F0 80 (DCB), elle donne la variante logicielle'

cars: ['D34', 'P2', 'X8']

