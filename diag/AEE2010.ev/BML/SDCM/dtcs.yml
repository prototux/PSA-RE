      hu: 'Pozitív zárlat'
    0x13:
      en: 'Open circuit'
      fr: 'Circuit ouvert'
      es: 'Circuito abierto'
      de: 'Stromkreis offen'
      pl: 'Obwód przerwany'
      hu: 'Megszakadt áramkör'
    0x15:
      en: 'Short circuit to positive or open circuit'
      fr: 'Court-circuit au plus ou circuit ouvert'
