routine: 0xDF02
name: 'BUZZER_OPERATION_CHECK'
display_name:
  en: 'Buzzer operation check'
  fr: 'Contrôle de fonctionnement du bruiteur'
  es: 'Control de funcionamiento del avisador sonoro'
  de: 'Funktionskontrolle des Summers'
  pl: 'Kontrola działania sygnalizatora dźwiękowego'
  hu: 'A hangjelző működésének ellenőrzése'
control: ['start', 'stop', 'results']

params:
  PERIOD_DF02:
    bits: '1.7-2.0'
    type: 'uint'
    default: 0x04

  CYCLE_FAULT_02:
    bits: '3.7-3.0'
    type: 'uint'
    default: 0x32

  DURATION_FAULT_02:
    bits: '4.7-4.0'
    type: 'uint'
    default: 0x01

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Activation in progress'
        fr: 'Activation en cours'
        es: 'Activación en curso'
        de: 'Aktivierung läuft'
        pl: 'Aktywacja w trakcie'
        hu: 'Aktiv l s folyamatban'
      0x02:
        en: 'Operation finished'
        fr: 'Opération terminée'
        es: 'Operación terminada'
        de: 'Vorgang beendet'
        pl: 'Operacja zakonczona'
        hu: 'A művelet befejezodött'
      0x03:
        en: 'Activation not possible (function not present)'
        fr: 'Activation impossible (fonction non présente)'
        es: 'Activación imposible (función no presente)'
        de: 'Aktivierung nicht möglich (Funktion nicht vorhanden)'
        pl: 'Aktywacja niemożliwa (funkcja nieobecna)'
        hu: 'Aktiválás nem lehetséges (hiányzó funkció)'
      0x04:
        en: 'Test stopped by the operator'
        fr: 'Test arrêté par l''opérateur'
        es: 'Test detenido por el operario'
        de: 'Test vom Benutzer abgebrochen'
        pl: 'Test zatrzymany przez operatora'
        hu: 'A beavatkozást végzo személy általi teszt-leállítás'

tests:
  - display_name:
      en: 'Buzzer operation check'
      fr: 'Contrôle de fonctionnement du bruiteur'
      es: 'Control de funcionamiento del avisador sonoro'
      de: 'Funktionskontrolle des Summers'
      pl: 'Kontrola działania sygnalizatora dźwiękowego'
      hu: 'A hangjelző működésének ellenőrzése'
    max_duration_ms: 2000
