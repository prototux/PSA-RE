        es: 'Función de ayuda al respeto de la distancia de seguridad visualizada'
        de: 'Funktion Abstandsassistent angezeigt'
        pl: 'Funkcja wspomagania przestrzegania czasów odstępu pomiędzy pojazdami wyświetlona'
        hu: 'A gépkocsik követési távolságának betartását segítő funkció kijelezve'
