    type: 'enum'
    values:
      0x00:
        en: 'All functions masked'
        fr: 'Toutes fonctions masquées'
        es: 'Todas las funciones ocultas'
        de: 'Alle Funktionen verdeckt'
        pl: 'Wszystkie funkcje ukryte'
        hu: 'Minden funkció kimaszkolva'
      0x01:
