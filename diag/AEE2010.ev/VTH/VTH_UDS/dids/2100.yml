        fr: 'Désignateur 4 commandes'
        es: 'Joystick de 4 mandos'
        de: 'Bedieneinheit 4 Bedienelemente'
        pl: 'Urządzenie wskazujące z 4 elementami sterującymi'
        hu: '4 kapcsolós kiválasztó'
      0x01:
