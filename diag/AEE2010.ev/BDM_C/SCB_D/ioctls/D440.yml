ioctl: 0xD440
name: 'LIGHTING_KEYPAD_AND_KNOB'
display_name:
  en: 'Lighting of the keypad and of the knob'
  fr: 'Eclairage du clavier et de la molette'
  es: 'Iluminación del teclado y de la ruedecilla'
  de: 'Beleuchtung der Tastatur und des Drehrads'
  pl: 'Oświetlenie klawiatury i pokrętła'
  hu: 'Billentyűzet és gomb megvilágítása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_1:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x30

results:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Lighting of the keypad and of the knob'
      fr: 'Eclairage du clavier et de la molette'
      es: 'Iluminación del teclado y de la ruedecilla'
      de: 'Beleuchtung der Tastatur und des Drehrads'
      pl: 'Oświetlenie klawiatury i pokrętła'
      hu: 'Billentyűzet és gomb megvilágítása'
    max_duration_ms: 5000
