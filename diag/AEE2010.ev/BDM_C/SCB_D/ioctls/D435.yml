ioctl: 0xD435
name: 'CONTROL_UPWARDS_HEIGHT_ADJUSTMENT_OR_FAST_SPEED'
display_name:
  en: 'Control of upwards height adjustment or fast speed forwards'
  fr: 'Pilotage site vers le haut ou grande vitesse en avant'
  es: 'Control de la altura hacia arriba o gran velocidad hacia adelante'
  de: 'Ansteuerung Neigung nach oben oder große Geschwindigkeit nach vorn'
  pl: 'Sterowanie nachylenia do góry lub duża prędkość do przodu'
  hu: 'Ülőrész vezérlés felfele vagy nagy sebességgel előre'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_1:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of upwards height adjustment or fast speed forwards'
      fr: 'Pilotage site vers le haut ou grande vitesse en avant'
      es: 'Control de la altura hacia arriba o gran velocidad hacia adelante'
      de: 'Ansteuerung Neigung nach oben oder große Geschwindigkeit nach vorn'
      pl: 'Sterowanie nachylenia do góry lub duża prędkość do przodu'
      hu: 'Ülőrész vezérlés felfele vagy nagy sebességgel előre'
    max_duration_ms: 5000
  - display_name:
      en: 'Control of downwards height adjustment or fast speed backwards'
      fr: 'Pilotage site vers le bas ou grande vitesse en recul'
      es: 'Control de la altura hacia abajo o gran velocidad en marcha atrás'
      de: 'Ansteuerung Neigung nach unten oder große Geschwindigkeit nach hinten'
      pl: 'Sterowanie nachylenia do dołu lub duża prędkość podczas cofania'
      hu: 'Ülőrész vezérlés lefelé vagy nagy sebességgel hátra'
    max_duration_ms: 5000
