did: 0xD400
name: 'LEVEL_CONTROL_SEAT_HEATING_RECEIVED_BUILT'
display_name:
  en: 'Level of control of the seat heating received from the built-in systems interface'
  fr: 'Niveau de commande du chauffage du siège reçu du boîtier de servitude intelligent'
  es: 'Nivel de mando del calentamiento del asiento recibido de la caja de servicio inteligente'
  de: 'Ansteuerungsniveau der Heizung des Sitzes von der Zentralschalteinheit empfangen'
  pl: 'Poziom wysterowania podgrzewania siedzenia otrzymany z BSI'
  hu: 'Intelligens kiszolgálóegységtől kapott ülésfűtés vezérlési szint'
comment:
  en: 'Command received by the seat heated pads and ventilation regulation ECU Parameter operational on vehicles not fitted with a seat heating control dial'
  fr: 'Commande reçue par le calculateur de régulation de nappes chauffantes et de ventilation du siège Paramètre fonctionnel sur les véhicules non équipés d''une molette de commande de chauffage du siège'
  es: 'Orden recibida por el calculador de regulación de resistencias térmicas y de ventilación del asiento Parámetro funcional en los vehículos no equipados con una ruedecilla de control de calentamiento del asiento'
  de: 'Ansteuerung empfangen vom Steuergerät Regelung Heizmatten und Ventilation des Sitzes Parameter funktionsbereit bei Fahrzeugen ohne Betätigungsrad Heizung des Sitzes'
  pl: 'Polecenie odebrane przez kalkulator regulacji temperatury mat grzejnych i wentylacji fotela Parametr funkcjonalny w samochodach nie wyposażonych w pokrętło sterowania podgrzewaniem siedzenia'
  hu: 'Ülés szellőztetés és fűtőpárna szabályozás számítógép által kapott vezérlés Az ülésfűtés vezérlőgombbal nem felszerelt gépkocsikon működő paraméter'
kind: 'live'
access: 'read'
length: 1

