node: 'BAAS'
model: 'BAAST'
display_name:
  en: 'Hands-free tailgate kick sensor (BAAST)'
  fr: 'Capteur d''ouverture mains libres du hayon (BAAST)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x732
    response_id: 0x712
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'

services: [0x10, 0x22, 0x27]

security_access:
  - level: 0x03

identification:
  request: '22 F0 80'
  part_number: '8.7-12.0'
  comment:
    en: 'The ECU part number is in data bytes 8 to 12 of the answer to 22 F0 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 8 à 12 de la réponse à 22 F0 80 (DCB), elle donne la variante logicielle'

cars: ['B75', 'B78', 'C84', 'G9', 'K0', 'P8', 'R8', 'X74', 'X8']

variants:
  B75C_V1:
    parts: ['9809260680']
    cars: ['B75']
  B78_V1:
    parts: ['9809260680']
    cars: ['B78']
  C84C_V1:
    parts: ['9809260680']
    cars: ['C84']
  G95_V1:
    parts: ['9809260680']
    cars: ['G9']
  K0_V1:
    parts: ['9809260680']
    cars: ['K0']
  P8_V1:
    parts: ['9809260680']
    cars: ['P8']
  R8_V1:
    parts: ['9809260680']
    cars: ['R8']
  X74_V1:
    parts: ['9809260680']
    cars: ['X74']
  X83_V1:
    parts: ['9809260680']
    cars: ['X8']
