comment:
  en: 'Remote Controlled Wake-up line voltage. This line is used to keep the Electric parking brake ECU awake.'
  fr: 'Tension de la ligne de Réveil Commandé à Distance. Cette ligne permet de maintenir le calculateur Frein de Stationnement à commande Electrique éveillé.'
  es: 'Tensión de la línea de Despertado Mando a Distancia. Esta línea permite mantener el calculador Freno de Estacionamiento de mando Eléctrico despertado.'
  de: 'Spannung der Leitung Fernaktivierung. Diese Leitung ermöglicht, das Steuergerät elektrische Feststellbremse in Wachfunktion zu halten.'
  pl: 'Napiecie linii przebudzenia sterowanego zdalnie. Ta linia pozwala na utrzymanie hamulca postojowego sterowanego elektrycznie w stanie przebudzenia.'
  hu: 'A távirányítású élesítés vonal feszültsége. Ez a vonal lehetové teszi az elektromos vezérlésű rögzítofék számítóegységének éles üzemmódban való tartását.'
