did: 0xD520
name: 'GEAR_SHIFT_CONTROL_STEERING_WHEEL'
display_name:
  en: 'Gear shift control at the steering wheel'
  fr: 'Commande de vitesses au volant de direction'
  es: 'Mando de velocidades en el volante de dirección'
  de: 'Schaltbetätigung am Lenkrad'
  pl: 'Sterowanie zmianą biegów pod kierownicą'
  hu: 'Kormánykerék alatti sebességkapcsoló'
comment:
  en: 'This information is provided via the CAN by the built-in systems interface and is not operational if the vehicle is fitted with an automatic gearbox ECU or a sequential gear lever'
  fr: 'Cette information est fournie via le réseau CAN par le boîtier de servitude intelligent et n''est pas fonctionnelle si le véhicule est équipé d''un calculateur de commande électrique de boîte de vitesses automatique ou d''un levier de vitesses impulsionnel'
  es: 'Esta información es transmitida a través de la red CAN por la caja de servicio inteligente y no está operativa si el vehículo está equipado con un calculador de mando eléctrico de caja de velocidades automática o una palanca de cambios por impulsos'
  de: 'Diese Daten werden über das CAN-Netz von der Zentralschalteinheit geliefert und sind nicht verfügbar, wenn das Fahrzeug mit einem Steuergerät für die elektrische Betätigung des Automatikgetriebes oder mit einem Impulswählhebel ausgestattet ist'
  pl: 'Ta informacja jest dostarczana przez sieć CAN przez inteligentny moduł sterujący i nie jest czynna, jeżeli samochód jest wyposażony w kalkulator sterowania elektrycznego automatycznej skrzyni biegów lub dźwigni impulsowej zmiany biegów'
  hu: 'Ezt az információt az intelligens kiszolgálóegység a CAN hálózaton keresztül szállítja – ez csak akkor működik, ha a gépjármű elektromos vezérlőegységgel rendelkező automata sebességváltóval vagy impulzusos sebességkapcsoló karral van felszerelve'
kind: 'live'
access: 'read'
length: 1

