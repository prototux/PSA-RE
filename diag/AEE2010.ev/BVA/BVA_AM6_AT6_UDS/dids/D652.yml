did: 0xD652
name: 'AUTOMATIC_GEARBOX_OUTPUT_SPEED_MEASURED'
display_name:
  en: 'Automatic gearbox output speed (measured)'
  fr: 'Régime de sortie de la boîte de vitesses automatique (mesuré)'
  es: 'Régimen de salida de la caja de velocidades automática (medido)'
  de: 'Ausgangsdrehzahl des Automatikgetriebes (gemessen)'
  pl: 'Prędkość obrotowa na wyjściu automatycznej skrzyni biegów (zmierzona)'
  hu: 'Automata sebességváltó kimeneti fordulatszáma (mért)'
comment:
  en: 'Drive at more than 50 km/h to obtain a gearbox output speed other than 0. Check that there are no faults linked with the gearbox.'
  fr: 'Effectuer un roulage supérieur à 50 km/h pour avoir un régime de sortie de boîte de vitesses différent de 0. Contrôler l''absence de défaut lié à la boîte de vitesses.'
  es: 'Circular durante más de 50 km/h para tener un régimen de salida de la caja de velocidades distinto a 0. Controlar que no haya defectos asociados a la caja de velocidades.'
  de: 'Eine Fahrt von mehr als 50 km/h durchführen, um eine Ausgangsdrehzahl des Getriebes ungleich 0 zu erreichen. Kontrollieren, dass kein Fehler im Zusammenhang mit dem Getriebe vorhanden ist.'
  pl: 'Wykonać jazdę z prędkością przekraczającą 50 km/h, aby uzyskać prędkość obrotową na wyjściu skrzyni biegów inną niż 0. Sprawdzić brak usterki związanej ze skrzynią biegów.'
  hu: 'Tegyen egy próbautat 50 km/h feletti sebességgel, hogy egy 0-től eltérő sebességváltó kimeneti fordulatszámot kapjon. Ellenőrizze a sebességváltóval kapcsolatos hiba hiányát.'
kind: 'live'
access: 'read'
length: 1
