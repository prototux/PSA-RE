routine: 0xDF0A
name: 'SEQUENTIAL_TEST_ALL_SOLENOID_VALVES'
display_name:
  en: 'Sequential test of all the solenoid valves'
  fr: 'Test séquentiel de toutes les électrovannes'
  es: 'Test secuencial de todas las electroválvulas'
  de: 'Sequenzieller Test aller Elektroventile'
  pl: 'Test sekwencyjny wszystkich elektrozaworów'
  hu: 'Az összes mágnesszelep szekvenciális tesztje'
control: ['start', 'stop', 'results']

params:
  ROUTINE_IDENTIFIER2:
    bits: '1.7-2.0'
    type: 'enum'
    default: 0xF05A

results:
  STATUT_ACTION:
    bits: '1.7-1.0'
    type: 'enum'

  ACTUATOR_TEST:
    bits: '2.7-2.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x00:
        en: 'No fault'
        fr: 'Pas de défaut'
        es: 'No hay defecto'
        de: 'Kein Fehler'
        pl: 'Brak defektu'
        hu: 'Nincs hiba'
      0x01:
        en: 'Intermittent fault'
        fr: 'Défaut fugitif'
        es: 'Defecto fugitivo'
        de: 'Sporadischer Fehler'
        pl: 'Blad przejsciowy'
        hu: 'Tmeneti hiba'
      0x02:
        en: 'Short circuit to earth'
        fr: 'Court-circuit à la masse'
        es: 'Cortocircuito a masa'
        de: 'Kurzschluss an Masse'
        pl: 'Zwarcie z masą'
        hu: 'Negatív rövidzárlat'
      0x03:
        en: 'Open circuit'
        fr: 'Circuit ouvert'
        es: 'Circuito abierto'
        de: 'Stromkreis offen'
        pl: 'Obwód przerwany'
        hu: 'Megszakadt áramkör'
      0x04:
        en: 'Intermittent fault'
        fr: 'Défaut intermittent'
        es: 'Defecto intermitente'
        de: 'Sporadischer Fehler'
        pl: 'Błąd przerywany'
        hu: 'Időszakos hiba'
      0x05:
        en: 'Electric control current fault'
        fr: 'Défaut courant électrique de commande'
        es: 'Defecto de corriente eléctrica de mando'
        de: 'Fehler elektrischer Steuerstrom'
        pl: 'Usterka prądu elektrycznego sterowania'
        hu: 'Vezérlés elektromosáram hiba'
      0x06:
        en: 'Other fault'
        fr: 'Autre défaut'
        es: 'Otro defecto'
        de: 'Sonstiger Fehler'
        pl: 'Inny defekt'
        hu: 'Más hiba'

tests:
  - display_name:
      en: 'Sequential test of all the solenoid valves'
      fr: 'Test séquentiel de toutes les électrovannes'
      es: 'Test secuencial de todas las electroválvulas'
      de: 'Sequenzieller Test aller Elektroventile'
      pl: 'Test sekwencyjny wszystkich elektrozaworów'
      hu: 'Az összes mágnesszelep szekvenciális tesztje'
