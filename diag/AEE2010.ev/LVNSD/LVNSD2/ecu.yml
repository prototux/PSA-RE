node: 'LVNSD'
model: 'LVNSD2'
display_name:
  en: 'Low voltage network separation device (LVNSD2)'
  fr: 'Dispositif de separation du reseau basse tension (LVNSD2)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x49B
    response_id: 0x49A

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'
  0x60:
    en: 'Supplier session'
    fr: 'Session fournisseur'

services: [0x10, 0x14, 0x19, 0x22, 0x27, 0x2E]

security_access:
  - level: 0x01
  - level: 0x03

identification:
  request: '22 F0 FE'
  part_number: '22.7-24.0'
  comment:
    en: 'The ECU part number is in data bytes 22 to 24 of the answer to 22 F0 FE (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 22 à 24 de la réponse à 22 F0 FE (DCB), elle donne la variante logicielle'

cars: ['C84', 'P8', 'R8', 'X74']

variants:
  C84C_V1:
    parts: ['932609']
    cars: ['C84']
  C84C_V2:
    parts: ['935931']
    cars: ['C84']
  C84C_V3:
    parts: ['939643']
    cars: ['C84']
  P8_V1:
    parts: ['932609']
    cars: ['P8']
  P8_V2:
    parts: ['939643']
    cars: ['P8']
  R8_V1:
    parts: ['932406']
    cars: ['R8']
  R8_V2:
    parts: ['932609']
    cars: ['R8']
  R8_V3:
    parts: ['939643']
    cars: ['R8']
  X74_V1:
    parts: ['932406']
    cars: ['X74']
  X74_V2:
    parts: ['939643']
    cars: ['X74']
