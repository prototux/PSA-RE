node: 'LVNSD'
model: 'LVNSD'
display_name:
  en: 'Low voltage network separation device (LVNSD)'
  fr: 'Dispositif de separation du reseau basse tension (LVNSD)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x6BA
    response_id: 0x69A

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'
  0x60:
    en: 'Supplier session'
    fr: 'Session fournisseur'

resets:
  0x01:
    en: 'Hard reset'
    fr: 'Réinitialisation matérielle'
  0x02:
    en: 'Key off / on reset'
    fr: 'Réinitialisation coupure / mise du contact'
  0x03:
    en: 'Soft reset'
    fr: 'Réinitialisation logicielle'

services: [0x10, 0x11, 0x14, 0x19, 0x22, 0x27, 0x2E]

security_access:
  - level: 0x01
  - level: 0x03

identification:
  request: '22 F0 FE'
  part_number: '22.7-24.0'
  comment:
    en: 'The ECU part number is in data bytes 22 to 24 of the answer to 22 F0 FE (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 22 à 24 de la réponse à 22 F0 FE (DCB), elle donne la variante logicielle'

cars: ['C84', 'D34', 'P2', 'P8', 'R8', 'X74']

