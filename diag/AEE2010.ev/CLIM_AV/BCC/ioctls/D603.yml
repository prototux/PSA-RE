ioctl: 0xD603
name: 'FRONT_RIGHT_MIXING_MOTOR'
display_name:
  en: 'Front right mixing motor'
  fr: 'Moteur de mixage avant droit'
  es: 'Motor de mezcla delantero derecho'
  de: 'Mischermotor vorne rechts'
  pl: 'Silnik mieszania przedni prawy'
  hu: 'Jobb első légkeverő motor'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Front right mixing motor'
      fr: 'Moteur de mixage avant droit'
      es: 'Motor de mezcla delantero derecho'
      de: 'Mischermotor vorne rechts'
      pl: 'Silnik mieszania przedni prawy'
      hu: 'Jobb első légkeverő motor'
    max_duration_ms: 10000
  - display_name:
      en: 'Front left mixing motor'
      fr: 'Moteur de mixage avant gauche'
      es: 'Motor de mezcla delantero izquierdo'
      de: 'Mischermotor vorne links'
      pl: 'Silnik mieszania przedni lewy'
      hu: 'Bal első légkeverő motor'
    max_duration_ms: 10000
