ioctl: 0xD401
name: 'IO_CONTROL_D401'
variants: ['K0_V1']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x1E

  PRECISION_2:
    bits: '3.7-3.0'
    type: 'enum'
    default: 0x00

results:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
