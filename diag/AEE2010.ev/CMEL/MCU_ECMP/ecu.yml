node: 'CMEL'
model: 'MCU_ECMP'
display_name:
  en: 'Electric motor control unit (MCU_ECMP)'
  fr: 'Calculateur de moteur electrique (MCU_ECMP)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x6A6
    response_id: 0x686

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'

resets:
  0x02:
    en: 'Key off / on reset'
    fr: 'Réinitialisation coupure / mise du contact'

services: [0x10, 0x11, 0x14, 0x19, 0x22, 0x27, 0x31]

security_access:
  - level: 0x03

identification:
  request: '22 F0 FE'
  part_number: '22.7-24.0'
  comment:
    en: 'The ECU part number is in data bytes 22 to 24 of the answer to 22 F0 FE (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 22 à 24 de la réponse à 22 F0 FE (DCB), elle donne la variante logicielle'

cars: ['D34', 'P2']

variants:
  D34_V0:
    parts: ['937538']
    cars: ['D34']
  D34_V1:
    parts: ['941896']
    cars: ['D34']
  P2JO_V0:
    parts: ['937538']
    cars: ['P2']
  P2JO_V1:
    parts: ['941896']
    cars: ['P2']
  P2_V0:
    parts: ['937538']
    cars: ['P2']
  P2_V1:
    parts: ['941896']
    cars: ['P2']
