ioctl: 0xD721
name: 'LEVEL_LIGHTING_AIR_CONDITIONING_CONTROL_PANEL'
display_name:
  en: 'Level of lighting of the air conditioning control panel display'
  fr: 'Niveau d''éclairage de l''afficheur de la façade de climatisation'
  es: 'Nivel de iluminación de la pantalla del frontal de climatización'
  de: 'Beleuchtungsniveau der Anzeige des Bedienfelds der Klimaanlage'
  pl: 'Poziom oświetlenia wyświetlacza panelu klimatyzacji'
  hu: 'A klímaberendezés előlap kijelző megvilágítási szint'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Level of lighting of the air conditioning control panel display'
      fr: 'Niveau d''éclairage de l''afficheur de la façade de climatisation'
      es: 'Nivel de iluminación de la pantalla del frontal de climatización'
      de: 'Beleuchtungsniveau der Anzeige des Bedienfelds der Klimaanlage'
      pl: 'Poziom oświetlenia wyświetlacza panelu klimatyzacji'
      hu: 'A klímaberendezés előlap kijelző megvilágítási szint'
    max_duration_ms: 5000
