routine: 0x95
name: 'TEST_MICROPHONE'
display_name:
  en: 'Test of the microphone'
  fr: 'Test du microphone'
  es: 'Test del micrófono'
  de: 'Test des Mikrophons'
  pl: 'Test mikrofonu'
  hu: 'Mikrofon teszt'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x01

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x00:
        en: 'Control not started'
        fr: 'Pilotage non lancé'
        es: 'Pilotaje no lanzado'
        de: 'Steuerung nicht gestartet'
        pl: 'Sterowanie nie uruchomione'
        hu: 'Vezérlés nincs elindítva'
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Suche läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Kezelés folyamatban'
      0x02:
        en: 'Completed OK'
        fr: 'Terminé OK'
        es: 'Terminado OK'
        de: 'Beendet OK'
        pl: 'Zakończony OK'
        hu: 'Befejezve Rendben'
      0x04:
        en: 'Completed not OK'
        fr: 'Terminé non OK'
        es: 'Terminado no OK'
        de: 'Beendet nicht OK'
        pl: 'Zakończony nie OK'
        hu: 'Befejezve nincs rendben'

tests:
  - display_name:
      en: 'Test of the microphone'
      fr: 'Test du microphone'
      es: 'Test del micrófono'
      de: 'Test des Mikrophons'
      pl: 'Test mikrofonu'
      hu: 'Mikrofon teszt'
