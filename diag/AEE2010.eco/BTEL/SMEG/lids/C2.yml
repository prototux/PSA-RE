lid: 0xC2
name: 'ABSCISSA_PRESS_TOUCH_SCREEN'
display_name:
  en: 'Abscissa of the press on the touch screen'
  fr: 'Coordonnée abscisse de l''appui sur l''écran tactile'
  es: 'Coordenada abscisa de la pulsación de la pantalla táctil'
  de: 'X-Koordinate des Drucks auf den Touchscreen'
  pl: 'Współrzędne odciete nacisku na ekran dotykowy'
  hu: 'Az érintőképernyőn történő megnyomás abszcisszája'
comment:
  en: 'Touch one of the four corners of the touchscreen to read the value of the point''s abscissa : -press at the top right of the touchscreen, the abscissa value of the point should be between : 94 and 98% -press at the top left of the touchscreen, the abscissa value of the point should be between : 1 and 4% -press at the bottom right of the touchscreen, the abscissa value of the point should be between : 94 and 98% -press at the bottom left of the touchscreen, the abscissa value should be between : 1 and 4% If on fault reading fault FFB1, FFB2 or FFB3 has been reported by the SMEG ECU, touch one of the corners of the touchscreen. If the value displayed by the diagnostic tool is different from one of the values indicated above : the touchscreen is faulty. The SMEG ECU is not the cause.'
  fr: 'Toucher l''un des quatre coins de l''écran tactile pour lire la valeur de l''abscisse du point : -appuyer en haut à droite de l''écran tactile, la valeur de l''abscisse du point doit se situer entre : 94 et 98% -appuyer en haut à gauche de l''écran tactile, la valeur de l''abscisse du point doit se situer entre : 1 et 4% -appuyer en bas à droite de l''écran tactile, la valeur de l''abscisse du point doit se situer entre : 94 et 98% -appuyer en bas à gauche de l''écran tactile, la valeur de l''abscisse doit se situer entre : 1 et 4% Si lors de la lecture défaut, le défaut FFB1, FFB2 ou FFB3 a été remonté par le calculateur SMEG, toucher l''un des coins de l''écran tactile. Si la valeur affichée par l''outil de diagnostic est différente de l''une des valeurs indiquées ci-dessus : L''écran tactile est défectueux. Le calculateur SMEG n''est pas en cause.'
  es: 'Tocar una de las cuatro esquinas de la pantalla táctil para leer el valor de la abscisa del punto : -pulsar en la parte superior derecha de la pantalla táctil, el valor de la abscisa del punto se debe situar entre : 94 y 98% -pulsar en la parte superior izquierda de la pantalla táctil, el valor de la abscisa del punto se debe situar entre : 1 y 4% -pulsar en la parte inferior derecha de la pantalla táctil, el valor de la abscisa del punto se debe situar entre : 94 y 98% -pulsar en la parte inferior izquierda de la pantalla táctil, el valor de la abscisa se debe situar entre : 1 y 4% Si durante la lectura de defectos el calculador SMEG ha detectado el defecto FFB1, FFB2 o FFB3, tocar una de las esquinas de la pantalla táctil. Si el valor indicado por el útil de diagnosis es diferente a uno de los valores indicados anteriormente : la pantalla táctil es defectuosa. El calculador SMEG no es la causa.'
  de: 'Eine der vier Ecken des Touchscreens berühren, um den Wert der X-Koordinate des Punkts abzulesen : -oben rechts auf den Touchscreen drücken, der Wert der X-Koordinate des Druckpunkts muss sich befinden zwischen : 94 und 98% -oben links auf den Touchscreen drücken, der Wert der X-Koordinate des Druckpunkts muss sich befinden zwischen : 1 und 4% -unten rechts auf den Touchscreen drücken, der Wert der X-Koordinate des Druckpunkts muss sich befinden zwischen : 94 und 98% -unten links auf den Touchscreen drücken, der Wert der X-Koordinate muss sich befinden zwischen : 1 und 4% Wenn bei der Fehlerabfrage der Fehler FFB1, FFB2 oder FFB3 vom SMEG-Steuergerät gemeldet wurde, eine der Ecken des Touchscreens berühren. Wenn der von der Diagnosestation angezeigte Wert von einem der oben angegebenen Werte abweicht : der Touchscreen ist defekt. Das SMEG-Steuergerät ist nicht die Ursache.'
  pl: 'Nacisnąć jeden z czterech rogów ekranu dotykowego w celu odczytania wartości odciętej punktu : -nacisnąć w górnej prawej części ekranu dotykowego, wartość odciętej punktu musi znajdować się między : 94 i 98% -nacisnąć w górnej lewej części ekranu dotykowego, wartość odciętej punktu musi znajdować się między : 1 i 4% -nacisnąć w dolnej prawej części ekranu dotykowego, wartość odciętej punktu musi znajdować się między : 94 i 98% -nacisnąć w dolnej lewej części ekranu dotykowego, wartość odciętej musi znajdować się między : 1 i 4% Jeżeli podczas odczytu usterki, usterka FFB1, FFB2 lub FFB3 została przesłana przez kalkulator SMEG, nacisnąć jeden z rogów ekranu dotykowego. Jeżeli wartość wyświetlona przez przyrząd diagnostyczny różni się od jednej z wartości podanych powyżej : ekran dotykowy jest uszkodzony. Kalkulator SMEG nie jest przyczyną.'
  hu: 'Érintse meg az érintős képernyő négy sarkának egyikét a pont abszcissza értékének leolvasása érdekében : -nyomja meg az érintős képernyő jobb felső részét, a pont abszcisszájának értéke az alábbiak között kell legyen : 94 és 98% -nyomja meg az érintős képernyő bal felső részét, a pont abszcisszájának értéke az alábbiak között kell legyen : 1 és 4% -nyomja meg az érintős képernyő jobb alsó részét, a pont abszcisszájának értéke az alábbiak között kell legyen : 94 és 98% -nyomja meg az érintős képernyő bal alsó részét, az abszcissza értéke az alábbiak között kell legyen : 1 és 4% Ha a hibaleolvasás során a FFB1, FFB2 vagy FFB3 hiba a SMEG computer által kijelzésre került, érintse meg az érintős képernyő sarkának egyikét. Ha a diagnosztikai készülék által kijelzett érték eltér a fent jelzett értékek egyikétől : az érintős képernyő meghibásodott. A SMEG computer nem érintett.'
kind: 'live'
access: 'read'
length: 2

