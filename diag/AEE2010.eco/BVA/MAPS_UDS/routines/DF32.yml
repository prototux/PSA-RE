routine: 0xDF32
name: 'OPENING_CLUTCH'
display_name:
  en: 'Opening of the clutch'
  fr: 'Ouverture de l''embrayage'
  es: 'Apertura del embrague'
  de: 'Öffnung der Kupplung'
  pl: 'Rozłączanie sprzęgła'
  hu: 'Tengelykapcsoló nyitása'
control: ['start', 'stop', 'results']

params:
  TYPE_CONTROL:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x00

  POSITION:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x01

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    alt_names: ['ACTUATOR_TEST_2']
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x00:
        en: 'Control not started'
        fr: 'Pilotage non lancé'
        es: 'Pilotaje no lanzado'
        de: 'Steuerung nicht gestartet'
        pl: 'Sterowanie nie uruchomione'
        hu: 'Vezérlés nincs elindítva'
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Suche läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Kezelés folyamatban'
      0x02:
        en: 'Complete zero reset carried out'
        fr: 'Remise à zéro complète effectuée'
        es: 'Puesta a cero completo efectuada'
        de: 'Vollständige NULL-Rückstellung erfolgt'
        pl: 'Całkowite wyzerowanie wykonane'
        hu: 'A teljes nullázás elvégezve'
      0x03:
        en: 'Complete zero reset not carried out'
        fr: 'Remise à zéro complète non effectuée'
        es: 'Puesta a cero completo no efectuada'
        de: 'Vollständige NULL-Rückstellung nicht erfolgt'
        pl: 'Całkowite wyzerowanie nie wykonane'
        hu: 'A teljes nullázás nincs elvégezve'
      0x04:
        en: 'Test stopped by the operator'
        fr: 'Test arrêté par l''opérateur'
        es: 'Test parado por el operador'
        de: 'Test vom Benutzer gestoppt'
        pl: 'Test przerwany przez operatora'
        hu: 'A működteto személy által leállított teszt'

  CONTROL_STATUS_7:
    bits: '2.7-2.0'
    type: 'enum'

