lid: 0x0C
name: 'CURRENT_MEASURED_ELECTRIC_MOTOR'
display_name:
  en: 'Current measured in the electric motor'
  fr: 'Courant mesuré dans le moteur électrique'
  es: 'Corriente medida en el motor eléctrico'
  de: 'Gemessene Stromstärke im Elektromotor'
  pl: 'Prąd zmierzony w silniku elektrycznym'
  hu: 'Az elektromos motorban mért áramerősség'
comment:
  en: 'Indicates the amperage of the current flowing through the electric motor. this amperage varies depending on the torque applied to the steering wheel. With the steering wheel centred and released, this current should be between 0 and 1 A, With the steering wheel at right-hand full lock, this current should be between -9 and -34 A, With the steering wheel at left-hand full lock, this current should be between 9 and 34 A.'
  fr: 'Indique l''intensité du courant circulant dans le moteur électrique. cette intensité varie en fonction du couple appliqué sur le volant de direction. Volant de direction centré et lâché, cette intensité doit être comprise entre 0 et 1 A, Volant de direction en butée droite, cette intensité doit être comprise entre -9 et -34 A, Volant de direction en butée gauche, cette intensité doit être comprise entre 9 et 34 A.'
  es: 'Indica la intensidad de la corriente que circula en el motor eléctrico. esta intensidad varía en función del par aplicado en el volante de dirección. Volante de dirección central y suelto, esta intensidad debe estar comprendida entre 0 y 1 A, Volante de dirección en el tope derecho, esta intensidad debe estar comprendida entre -9 y -34 A, Volante de dirección en tope izquierdo, esta intensidad debe estar comprendida entre 9 y 34 A.'
  de: 'Zeigt die Stärke des im Elektromotor fließenden Stroms. diese Stromstärke schwankt in Abhängigkeit von dem am Lenkrad aufgebrachten Moment. Bei zentriertem und losgelassenem Lenkrad muss diese Stromstärke zwischen 0 und 1 A betragen, Bei Lenkrad am rechten Anschlag muss diese Stromstärke zwischen -9 und -34 A betragen, Bei Lenkrad am linken Anschlag muss diese Stromstärke zwischen 9 und 34 A betragen.'
  pl: 'Wskazuje natężenie prądu w silniku elektrycznym. ”natężenie zmienia się w zależności od momentu podanego do koła kierownicy. Kierownica wypośrodkowana i puszczona,to natężenie powinno być zawarte między 0 i 1 A, Kierownica skręcona w prawo do oporu,to natężenie powinno być zawarte między -9 i -34 A, Kierownica skręcona w lewo do oporu,to natężenie powinno być zawarte między 9 i 34 A.'
  hu: 'Az elektromos motorban keringő áramerősséget jelzi. ez az áramerősség a kormánykerékre alkalmazott nyomaték függvényében változik. Kormánykerék középen és elengedve, ezen áramerősség 0 és 1 A között kell legyen, Kormánykerék jobb oldali véghelyzetben, ezen áramerősség -9 és -34 A között kell legyen, Kormánykerék bal oldali véghelyzetben, ezen áramerősség 9 és 34 A között kell legyen.'
kind: 'live'
access: 'read'
length: 1
variants: ['B0_*']

