lid: 0x22
name: 'DROP_VOLTAGE_POWER_STEERING_ELECTRIC_MOTOR'
display_name:
  en: 'Drop in the voltage of the power steering electric motor'
  fr: 'Baisse de tension du moteur électrique de la direction assistée'
  es: 'Bajada de tensión del motor eléctrico de la dirección asistida'
  de: 'Spannungsabfall des Elektromotors der Servolenkung'
  pl: 'Spadek napięcia silnika elektrycznego wspomagania kierownicy'
  hu: 'Szervokormány elektromos motorjának feszültségcsökkenése'
comment:
  en: 'This parameter shows whether or not a drop in voltage at the terminals of the electric motor has been recorded by the Electric power steering ECU. as soon as a drop in voltage is detected, the electric motor no longer provides assistance, until the voltage at these terminals returns to the default value required for it to operate correctly'
  fr: 'Ce paramètre indique si une baisse de tension aux bornes du moteur électrique a été enregistrée ou non par le calculateur de Direction Assistée Electrique. dès qu''une baisse de tension est détectée, le moteur électrique ne fournit plus d''assistance, jusqu''à ce que la tension à ces bornes retrouve la valeur nominale nécessaire à son bon fonctionnement'
  es: 'Este parámetro indica si se ha registrado o no, por el calculador de Dirección Asistida Eléctrico, una bajada de tensión en los bornes del motor eléctrico. en cuanto se ha detectado una bajada de tensión, el motor eléctrico no suministra mas asistencia, hasta que la tensión en estos bornes encuentra el valor nominal necesario para su correcto funcionamiento'
  de: 'Dieser Parameter zeigt, ob vom Steuergerät der elektrischen Servolenkung ein Spannungsabfall an den Klemmen des Elektromotors erfasst wurde. sobald ein Spannungsabfall erfasst wird, liefert der Elektromotor keine Hilfskraft mehr, bis die Spannung an seinen Klemmen wieder den für seine einwandfreie Funktion erforderlichen Nennwert erreicht hat'
  pl: 'Ten parametr wskazuje, czy spadek napięcia na stykach silnika elektrycznego został czy nie zarejestrowany przez kalkulator Elektrycznego Wspomagania Kierownicy. po wykryciu spadku napięcia, silnik elektryczny przestaje zapewniać wspomaganie aż do momentu gdy napięcie na tych stykach powróci do wartości nominalnej, niezbędnej do jego prawidłowej pracy'
  hu: 'Ezen paraméter jelzi, hogy az elektromos kormányszervo computer által regisztrálásra került vagy sem egy feszültségcsökkenés az elektromos motor pólusain. közvetlenül egy feszültségesés észlelést követően, az elektromos motor nem biztosít több rásegítést, egészen addig míg az ezen pólusokon lévő feszültség vissza nem tér a megfelelő működéséhez szükséges normális értékre'
kind: 'live'
access: 'read'
length: 1
variants: ['B0_*']

