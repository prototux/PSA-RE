      fr: 'Baisse de tension du moteur électrique de la direction assistée'
      es: 'Bajada de tensión del motor eléctrico de la dirección asistida'
      de: 'Spannungsabfall des Elektromotors der Servolenkung'
      pl: 'Spadek napięcia silnika elektrycznego wspomagania kierownicy'
      hu: 'Szervokormány elektromos motorjának feszültségcsökkenése'
    type: 'enum'
    values:
      0x00:
        en: 'Not recorded'
        fr: 'Non enregistrée'
        es: 'No registrada'
        de: 'Nicht gespeichert'
        pl: 'Niezarejestrowany'
        hu: 'Nincs elmentve'
      0x01:
        en: 'Recorded'
        fr: 'Enregistré'
        es: 'Registrado'
        de: 'Gespeichert'
        pl: 'Zapamiętany'
        hu: 'Tárolva'
