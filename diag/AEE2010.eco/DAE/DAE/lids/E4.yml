comment:
  en: 'Indicates the type of assistance pattern configured in the ECU (this pattern cannot be changed). the assistance requirement for the steering differs depending on the vehicleÆs engine.'
  fr: 'Indique le type de loi d''assistance qui est télécodée dans le calculateur (cette loi ne peut pas être modifiée). le besoin d''assistance pour la direction est différent selon la motorisation du véhicule.'
  es: 'Indica el tipo de ley de asistencia que ha sido telecodificado en el calculador (esta ley no puede ser modificada). la necesidad de asistencia para la dirección es diferente según la motorización del vehículo.'
  de: 'Zeigt die im Steuergerät codierte Hilfskraft-Kennlinie (diese Kennlinie kann nicht verändert werden). der Hilfskraftbedarf für die Lenkung ist je nach Motortyp des Fahrzeugs unterschiedlich.'
  pl: 'Wskazuje typ trybu wspomagania, telekodowanego w kalkulatorze (tryb nie może być zmieniany). ”zapotrzebowanie na wspomaganie układu kierowniczego jest różne i zależy od silnika pojazdu.'
  hu: 'A computerben távkódolt rásegítési függvény típusát jelzi (ez a függvény nem módosítható). a kormánymű rásegítési igénye a gépkocsi motortípusa függvényében változik.'
kind: 'live'
