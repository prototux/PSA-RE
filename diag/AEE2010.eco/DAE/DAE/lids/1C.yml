lid: 0x1C
name: 'INPUT_VOLTAGE_TRACK_2_ELECTRIC_MOTOR'
display_name:
  en: 'Input voltage of track 2 of the electric motor'
  fr: 'Tension d''entrée de la voie 2 du moteur électrique'
  es: 'Tensión de entrada de la vía 2 del motor eléctrico'
  de: 'Eingangsspannung des Pols 2 des Elektromotors'
  pl: 'Napięcie na wejściu styku 2 silnika elektrycznego'
  hu: 'Az elektromos motor 2 pólusának bemeneti feszültsége'
comment:
  en: 'Specifies the supply voltage supplied by the Electric Power Steering ECU to supply the electric motor. this voltage varies depending on the torque applied to the steering wheel. when the steering wheel is at right-hand full lock, this voltage should be less than 1V, when the steering wheel is at left-hand full lock, this voltage should be between 10V and 16V.'
  fr: 'Indique la tension d''alimentation fournit par le calculateur de Direction Assistée Electrique pour alimenter le moteur électrique. cette tension varie en fonction du couple appliqué sur le volant de direction. volant de direction en buté droite, cette tension doit être inférieure à 1V, volant de direction en buté gauche, cette tension doit être comprise entre 10V et 16V.'
  es: 'Indica la tensión de alimentación generada por el calculador de Dirección Asistida Eléctrica para alimentar el motor eléctrico. esta tensión varía en función del par aplicado en el volante de dirección. volante de dirección girado a tope a la derecha, esta tensión debe ser inferior a 1V, volante de dirección girado a tope a la izquierda, esta tensión debe estar comprendida entre 10V y 16V.'
  de: 'Gibt die vom Steuergerät der elektrischen Servolenkung gelieferten Versorgungsspannung für den Elektromotor an. diese Spannung schwankt in Abhängigkeit von dem am Lenkrad aufgebrachten Moment. am rechten Anschlag des Lenkrads muss diese Spannung unter 1 V liegen, am linken Anschlag des Lenkrads muss diese Spannung zwischen 10 V und 16 V liegen.'
  pl: 'Wskazuje napięcie zasilania dostarczane przez kalkulator elektrycznego wspomagania kierownicy w celu zasilania silnika elektrycznego. ”napięcie zmienia się w zależności od momentu podanego do koła kierownicy. ”przy kole kierownicy skręconym do oporu w prawo napięcie powinno być mniejsze od 1V, ”przy kole kierownicy skręconym do oporu w lewo napięcie powinno zawierać się między 10V i 16V.'
  hu: 'Jelzi az elektromos motor táplálásához a szervokormányzás számítóegysége által biztosított tápfeszültséget. ez a feszültség a kormánykerékre alkalmazott nyomaték függvényében változik. a kormánykerék jobbra elfordított véghelyzetében ennek a feszültségnek 1V alatt kell lennie, a kormánykerék balra elfordított véghelyzetében ennek a feszültségnek 10V és 16V között kell lennie.'
kind: 'live'
access: 'read'
length: 1
variants: ['B0_*']

