lid: 0x19
name: 'PROGRAMMED_VALUE_POINT_ZERO_SENSOR_2'
display_name:
  en: 'Programmed value of the point zero (sensor 2)'
  fr: 'Valeur apprise du point zéro (capteur 2)'
  es: 'Valor aprendido del punto cero (captador 2)'
  de: 'Gelernter Wert des Nullpunkts (Geber 2)'
  pl: 'Wczytana wartość punktu zerowego (czujnik 2)'
  hu: 'Nullpont megismertetett értéke (2 érzékelő)'
comment:
  en: 'This parameter represents the value of the voltage supplied by the torque sensor (signal 2) which was programmed during calibration of the torque sensor point zero. when the steering wheel is centred and loose, this value should be between 2.3V and 2.7V. otherwise, the torque sensor point zero is calibrated incorrectly. if the torque sensor is not calibrated correctly, this may result in a difference in the force provided by the steering assistance depending on whether the steering wheel is turned to the left or to the right.'
  fr: 'Ce paramètre représente la valeur de la tension délivrée par le capteur de couple (signal 2) qui a été apprise lors du calibrage du point zéro du capteur de couple. volant de direction centré et lâché, cette valeur doit être comprise entre 2.3V et 2.7V. dans le cas contraire, le point zéro du capteur de couple est mal calibré. un capteur de couple mal calibré, peut entraîner une différence dans l''effort fourni par l''assistance de direction selon que l''on tourne le volant de direction à gauche ou à droite.'
  es: 'Este parámetro representa el valor de la tensión enviada por el captador de par (señal 2) que ha sido tomada durante el calibrado del punto cero del captador de par. volante de dirección centrado y suelto, este valor debe estar comprendido entre 2.3V y 2.7V. en el caso contrario, el punto cero del captador de par está mal calibrado. un captador de par mal calibrado, puede motivar una diferencia en el esfuerzo suministrado por la asistencia de dirección según se gire el volante de dirección a izquierdas o a derechas.'
  de: 'Dieser Parameter entspricht dem Wert der vom Momentgeber abgegebenen Spannung (Signal 2), die bei der Kalibrierung des Nullpunkts des Momentgebers gelernt wurde. bei zentriertem und losgelassenem Lenkrad muss dieser Wert zwischen 2.3 V und 2.7 V liegen. andernfalls ist der Nullpunkt des Momentgebers falsch kalibriert. ein mangelhaft kalibrierter Momentgeber kann unterschiedliche Hilfskraft der Servolenkung zwischen Linksdrehung und Rechtsdrehung des Lenkrads verursachen.'
  pl: 'Ten parametr przedstawia wartość napięcia, dostarczanego przez czujnik momentu obrotowego (sygnał 2), wczytaną podczas kalibracji punktu zerowego czujnika momentu obrotowego. ”przy wyśrodkowanym i zwolnionym kole kierownicy wartość powinna zawierać się między 2.3V i 2.7V. ”w przeciwnym razie punkt zerowy czujnika momentu obrotowego zostanie źle wykalibrowany. ”źle wykalibrowany czujnik momentu obrotowego może spowodować różny stopień wspomagania kierownicy przy skręcaniu kierownicą w lewą lub w prawą stronę.'
  hu: 'Ez a paraméter a nyomatékérzékelő által szolgáltatott feszültség (2 jel) értékét jelenti, amely a nyomatékérzékelő nullponti kalibrálása során került megismertetésre. központosított és elengedett kormánykeréknél ennek az értéknek 2.3V és 2.7V között kell lennie. ellenkező esetben a nyomatékérzékelő nullpontjának kalibrálása nem megfelelő. egy nem megfelelően kalibrált nyomatékérzékelő egy különbséget idézhet elő a kormányszervó által szolgáltatott erőhatásban, annak függvényében, hogy a kormány balra, vagy jobbra kerül elforgatásra.'
kind: 'live'
access: 'read'
length: 1
variants: ['B0_*']

