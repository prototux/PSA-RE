comment:
  en: 'Electric motor supply voltage. This voltage should be between 10 and 16 V when the electric power steering motor is providing assistance.'
  fr: 'Tension d''alimentation du moteur électrique. Cette tension doit être comprise entre 10 et 16 V lorsque le moteur de direction assistée électrique fournit de l''assistance.'
  es: 'Tensión de alimentación del motor eléctrico. Esta tensión debe estar comprendida entre 10 y 16 V cuando el motor de dirección asistida eléctrica provee asistencia.'
  de: 'Versorgungsspannung des Elektromotors. Diese Spannung muss zwischen 10 und 16 V betragen, wenn der Motor der elektrischen Servolenkung Unterstützung liefert.'
  pl: 'Napięcie zasilania silnika elektrycznego. To napięcie powinno być zawarte miedzy 10 i 16 V gdy silnik elektrycznego wspomagania kierownicy dostarcza wspomaganie.'
  hu: 'A DAE motor tápfeszültsége. Ezen feszültség 10 és 16 V közötti kell legyen, amikor az elektromos kormánszervo motor szervóhatást biztosít.'
