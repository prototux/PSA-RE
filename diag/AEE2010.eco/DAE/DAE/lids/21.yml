lid: 0x21
name: 'OVERHEATING_ELECTRIC_POWER_STEERING_ECU'
display_name:
  en: 'Overheating of the Electric Power Steering ECU'
  fr: 'Surchauffe du calculateur de Direction Assistée Electrique'
  es: 'Sobrecalentamiento del calculador de Dirección Asistida Eléctrica'
  de: 'Überhitzung des Steuergeräts der elektrischen Servolenkung'
  pl: 'Przegrzanie kalkulatora Elektrycznego Wspomagania Kierownicy'
  hu: 'Elektromos szervokormány computer túlmelegedése'
comment:
  en: 'This parameter shows whether or not an overheating of the Electric power steering ECU has been recorded. a temperature sensor is fitted in the Electric power steering ECU; if the sensor detects overheating of the ECU, the reference current of the electric motor is reduced to lower the temperature of the ECU. the assistance is therefore reduced until the ECU drops to a normal temperature.'
  fr: 'Ce paramètre indique si une surchauffe du calculateur de Direction Assistée Electrique a été enregistrée ou non. un capteur de température est implanté dans le calculateur de Direction Assistée Electrique, si le capteur détecte une surchauffe du calculateur, le courant de consigne du moteur électrique est diminué afin de baisser la température du calculateur. l''assistance est donc diminuée jusqu''à ce que le calculateur redescende à une température normale.'
  es: 'Este parámetro indica si se ha registrado o no un sobrecalentamiento del calculador de Dirección Asistida Eléctrica. un captador de temperatura está implantado en el calculador de Dirección Asistida Eléctrica, si el captado detecta un sobrecalentamiento del calculador, la corriente de consigna del motor eléctrico disminuye con el fin de bajar la temperatura del c. por tanto, la asistencia disminuye hasta que el calculador desciende a una temperatura normal.'
  de: 'Dieser Parameter zeigt, ob eine Überhitzung des Steuergeräts der elektrischen Servolenkung erfasst wurde. ein Temperaturgeber ist im Steuergerät der elektrischen Servolenkung integriert; wenn der Geber eine Überhitzung des Steuergeräts feststellt, wird der Soll-Strom des Elektromotors gesenkt, um die Temperatur des Steuergeräts zu senken. die Hilfskraft wird somit verringert bis die Temperatur des Steuergeräts wieder auf einen normalen Wert gesunken ist.'
  pl: 'Ten parametr wskazuje, czy przegrzanie kalkulatora Elektrycznego Wspomagania Kierownicy zostało zarejestrowane czy nie. czujnik temperatury znajduje się w kalkulatorze Elektrycznego Wspomagania Kierownicy, jeżeli czujnik wykryje przegrzanie kalkulatora, prąd zadany silnika elektrycznego zostaje zmniejszony w celu obniżenia temperatury kalkulatora. wspomaganie jest więc zmniejszone, aż do momentu osiągnięcia przez kalkulator normalnej temperatury.'
  hu: 'Ezen paraméter jelzi, hogy egy elektromos kormányszervo computer túlmelegedése regisztrálásra került vagy sem. az Elektromos kormányszervo computerben el van helyezve egy hőmérsékletérzékelő, ha az érzékelő a computer túlmelegedését észleli, az elektromos motor előírt árama lecsökkentésre kerül a computer hőmérsékletének lecsökkenése érdekében. a rásegítés tehát csökkentésre kerül egészen addig amíg a computer hőmérséklete egy normál hőmérsékletre vissza nem csökken.'
kind: 'live'
access: 'read'
length: 1
variants: ['B0_*']

