lid: 0x03
name: 'VOLTAGE_SUPPLIED_TORQUE_SENSOR_SIGNAL_1'
display_name:
  en: 'Voltage supplied by the torque sensor (signal 1)'
  fr: 'Tension délivrée par le capteur de couple (signal 1)'
  es: 'Tensión enviada por el captador de par (señal 1)'
  de: 'Ausgangsspannung des Momentgebers (Signal 1)'
  pl: 'Napięcie dostarczone przez czujnik momentu obrotowego (sygnał 1)'
  hu: 'A nyomatékérzékelő által szolgáltatott feszültség (1 jel)'
comment:
  en: 'Signal from track 5 of the torque sensor white 8-way connector. when the steering wheel is centred and loose, this voltage should be between 2.3V and 2.7V when the steering wheel is at right-hand full lock, this voltage should be approximately equal to 4.7V when the steering wheel is at left-hand full lock, this voltage should be approximately equal to 0.3V'
  fr: 'Signal issu de la voie 5 du connecteur 8V Blanc du capteur de couple. volant de direction centré et lâché, cette tension doit être comprise entre 2.3V et 2.7V volant de direction en buté droite, cette tension doit être environ égale à 4.7V volant de direction en buté gauche, cette tension doit être environ égale à 0.3V'
  es: 'Señal procedente de la vía 5 del conector 8 V Blanco del captador de par. volante de dirección centrado y suelto, esta tensión debe estar comprendida entre 2.3V y 2.7V volante de dirección girado a tope a la derecha, esta tensión debe ser aproximadamente igual a 4.7V volante de dirección girado a tope a la izquierda, esta tensión debe ser aproximadamente igual a 0.3V'
  de: 'Signal vom Anschluss 5 des 8-poligen weißen Steckers des Drehmomentsensors. bei zentriertem und losgelassenem Lenkrad muss diese Spannung zwischen 2.3 V und 2.7 V liegen am rechten Anschlag des Lenkrads muss diese Spannung etwa 4.7 V betragen am linken Anschlag des Lenkrads muss diese Spannung etwa 0.3 V betragen'
  pl: 'Sygnał pochodzący ze styku 5 złącza 8V Białego czujnika momentu. ”przy wyśrodkowanym i zwolnionym kole kierownicy napięcie powinno zawierać się między 2.3V i 2.7V ”przy kole kierownicy skręconym do oporu w prawo napięcie powinno wynosić mniej więcej 4.7V ”przy kole kierownicy skręconym do oporu w lewo napięcie powinno wynosić mniej więcej 0.3V'
  hu: 'A nyomaték érzékelo 5 V-os fehér csatlakozó 8. csatornájából kibocsátott jele. központosított és elengedett kormánykeréknél ennek a feszültségnek 2.3V és 2.7V között kell lennie a kormánykerék jobbra elfordított véghelyzetében ennek a feszültségnek körülbelül 4.7V-nak kell lennie a kormánykerék balra elfordított véghelyzetében ennek a feszültségnek körülbelül 0.3V-nak kell lennie'
kind: 'live'
access: 'read'
length: 1
variants: ['B0_*']

