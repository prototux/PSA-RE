comment:
  en: 'Electric power steering motor supply voltage. this supply is provided by the ignition positive. The voltage has to be included between 10 and 16 V.'
  fr: 'Tension d''alimentation du moteur de direction assistée électrique. cette alimentation est fournie par le + APC. La tension doit être comprise entre 10 et 16 V.'
  es: 'Tensión de alimentación del motor de dirección asistida eléctrica. esta alimentación está suministrada por el + DC. La tensión debe estar incluida entre 10 y 16 V.'
  de: 'Versorgungsspannung des Motors der elektrischen Servolenkung. diese Stromversorgung wird vom + APC (nach Fahrtschalter) geliefert. Die Spannung muss zwischen 10 und 16 V liegen.'
  pl: 'Napięcie zasilania silnika elektrycznego wspomagania kierownicy. ”zasilanie z + po włączeniu zapłonu. Napięcie powinno się zawierać między 10 i 16 V.'
  hu: 'Elektromos kormányszervo motor tápellátó feszültség. ezt a tápellátást a + APC szolgáltatja. A feszültségnek 10 és 16 V között kell lennie.'
