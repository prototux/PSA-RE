lid: 0x13
name: 'TEMPERATURE_ELECTRIC_POWER_STEERING_ECU'
display_name:
  en: 'Temperature of the electric power steering ECU'
  fr: 'Température du calculateur de direction assistée électrique'
  es: 'Temperatura del calculador de Dirección Asistencia Eléctrica'
  de: 'Temperatur des Steuergeräts der elektrischen Servolenkung'
  pl: 'Temperatura kalkulatora Elektrycznego Wspomagania kierownicy'
  hu: 'Az elektromos kormányszervó computer hőmérséklete'
comment:
  en: 'This temperature is measured by a sensor installed in the Electric Power Steering ECU. If the sensor detects overheating of the electric power steering ECU, the electric power steering motor reference current is reduced to lower the temperature of the electric power steering ECU.'
  fr: 'Cette température est mesurée par un capteur implanté dans le calculateur de direction assistée électrique. Si le capteur détecte une surchauffe du calculateur de direction assistée électrique, le courant de consigne du moteur de direction assistée électrique est diminué pour baisser la température du calculateur de direction assistée électrique.'
  es: 'Esta temperatura está medida por un captador implantado en el calculador de Dirección Asistida Eléctrica. Si el captador detecta un sobrecalentamiento del calculador de dirección asistida eléctrica, la corriente de consigna del motor de dirección asistida eléctrica disminuye para bajar la temperatura del calculador de dirección asistida.'
  de: 'Diese Temperatur wird von einem Geber im Steuergerät der elektrischen Servolenkung gemessen. Wenn der Sensor eine Überhitzung des Steuergerätes der elektrischen Servolenkung erkennt, wird der Sollstrom des Motors der elektrischen Servolenkung verringert, um die Temperatur des Steuergerätes der elektrischen Servolenkung abzusenken.'
  pl: 'Temperatura ta mierzona jest przez czujnik, znajdujący się w kalkulatorze Elektrycznego Wspomagania kierownicy. Jeżeli czujnik wykryje przegrzanie kalkulatora elektrycznego wspomagania kierownicy,prąd zadany silnika elektrycznego jest zmniejszony aby obniżyć temperaturę kalkulatora elektrycznego wspomagania kierownicy.'
  hu: 'Ezt a hőmérsékletet egy, az elektromos kormányszervó computerbe beépített érzékelő méri. Ha az érzékelő egy elektromos kormányszervó computer túlmelegedést észlel, az elektromos kormányszervo motor előírt árama csökkentésre kerül az elektromos kormányszervo computer hőmérsékletének csökkenése érdekében..'
kind: 'live'
access: 'read'
length: 1
variants: ['B0_*']

params:
  TEMPERATURE_ELECTRIC_POWER_STEERING_ECU:
    bits: '1.7-1.0'
    comment:
      en: 'Temperature of the electric power steering ECU'
      fr: 'Température du calculateur de direction assistée électrique'
      es: 'Temperatura del calculador de Dirección Asistencia Eléctrica'
      de: 'Temperatur des Steuergeräts der elektrischen Servolenkung'
      pl: 'Temperatura kalkulatora Elektrycznego Wspomagania kierownicy'
      hu: 'Az elektromos kormányszervó computer hőmérséklete'
    type: 'uint'
    offset: -50
    units: '°C'
