node: 'DAE'
model: 'DAE'
display_name:
  en: 'Electric power steering (DAE)'
  fr: 'Direction assistee electrique (DAE)'
protocols: ['KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'KWP-PSA2000'
    request_id: 0x6B5
    response_id: 0x695
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'KWP-PSA2000'
    request_id: 0x6B5
    response_id: 0x695
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'KWP-PSA2000'
    request_id: 0x6A8
    response_id: 0x688

sessions:
  0x00:
    en: 'Session 0x00'
    fr: 'Session 0x00'
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0xAA:
    en: 'Session 0xAA'
    fr: 'Session 0xAA'

resets:
  0xB0:
    en: 'Reset 0xB0'
    fr: 'Réinitialisation 0xB0'

services: [0x10, 0x11, 0x13, 0x14, 0x17, 0x18, 0x1A, 0x21, 0x27, 0x30, 0x31, 0x34, 0x3E, 0x81, 0x82, 0xA5]

security_access:
  - level: 0x83
    algorithm: 'PSA_SEED_KEY'
    key: 'BF62'

tester_present:
  request: '3E'
  period_ms: 1000

identification:
  request: '21 80'
  part_number: '8.7-12.0'
  comment:
    en: 'The ECU part number is in data bytes 8 to 12 of the answer to 21 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 8 à 12 de la réponse à 21 80 (DCB), elle donne la variante logicielle'

