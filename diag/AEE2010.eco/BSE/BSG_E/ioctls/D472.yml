ioctl: 0xD472
name: 'FRONT_LEFT_FOG_LAMP'
display_name:
  en: 'Front left fog lamp'
  fr: 'Feu antibrouillard avant gauche'
  es: 'Luz antiniebla delantera izquierda'
  de: 'Nebelleuchte vorne links'
  pl: 'Światło przeciwmgłowe przednie lewe'
  hu: 'Bal első ködlámpa'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_PARAMETER_1:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x06

  CONTROL_PARAMETER_2:
    bits: '3.7-3.0'
    type: 'enum'
    default: 0x64

results:
  CONTROL_STATUS_2:
    bits: '1.7-1.0'
    type: 'enum'
    values:
      0x01:
        en: 'Actuator jammed (disengaged)'
        fr: 'Actionneur bloqué (désengagé)'
        es: 'Accionador bloqueado (desengranado)'
        de: 'Stellglied blockiert (gelöst)'
        pl: 'Urządzenie wykonawcze zablokowane (odłączone)'
        hu: 'Blokkolt beavatkozószerv (kikapcsolt)'
      0x02:
        en: 'Actuator jammed (engaged)'
        fr: 'Actionneur bloqué (engagé)'
        es: 'Accionador bloqueado (engranado)'
        de: 'Stellglied blockiert (aktiviert)'
        pl: 'Urządzenie wykonawcze zablokowane (włączone)'
        hu: 'Blokkolt beavatkozószerv (bekapcsolt)'
      0x03:
        en: 'Protection activated'
        fr: 'Protection activée'
        es: 'Protección activa'
        de: 'Schutz aktiviert'
        pl: 'Zabezpieczenie włączone'
        hu: 'Védelem aktiválva'

tests:
  - display_name:
      en: 'Front left fog lamp'
      fr: 'Feu antibrouillard avant gauche'
      es: 'Luz antiniebla delantera izquierda'
      de: 'Nebelleuchte vorne links'
      pl: 'Światło przeciwmgłowe przednie lewe'
      hu: 'Bal első ködlámpa'
    max_duration_ms: 3000
