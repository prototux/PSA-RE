algorithms:
  PSA_SEED_KEY:
    comment:
      en: 'Seed/key computation used by PSA ECUs for security access (UDS 27 01/03, KWP on CAN 27 81/83). The ECU sends a 4 byte seed, the tester answers a 4 byte key computed from the seed and a 16 bit constant specific to the ECU family (the "key" of the security_access entries of the ecu.yml files). Community implementations exist in C and Python. Note: the Python port found online treats a zero value as negative; it only gives a different result when the value is 0 or a negative multiple of sec[0]. What the ECUs really do in these cases is not confirmed'
      fr: 'Calcul graine/clé utilisé par les calculateurs PSA pour l''accès sécurisé (UDS 27 01/03, KWP sur CAN 27 81/83). Le calculateur envoie une graine de 4 octets, l''outil répond une clé de 4 octets calculée à partir de la graine et d''une constante de 16 bits propre à la famille de calculateur (la « key » des entrées security_access des fichiers ecu.yml). Des implémentations communautaires existent en C et en Python. Remarque : le portage Python qui circule traite une donnée nulle comme négative ; il ne donne un résultat différent que lorsque la donnée vaut 0 ou un multiple négatif de sec[0]. Le comportement réel des calculateurs dans ces cas n''est pas confirmé'
    pseudocode: |
      # all values are integers, "/" and "%" truncate toward zero (C semantics)
      SEC1 = (0xB2, 0x3F, 0xAA)          # (178, 63, 170)
      SEC2 = (0xB1, 0x02, 0xAB)          # (177, 2, 171)

      transform(data16, sec):
          data = data16 interpreted as a signed 16 bit value (0x8000..0xFFFF -> negative)
          result = (data % sec[0]) * sec[2] - (data / sec[0]) * sec[1]
          if result < 0:
              result = result + sec[0] * sec[2] + sec[1]
          return result & 0xFFFF

      key(seed[0..3], constant16):          # seed bytes in received order, constant e.g. 0xB2B2
          msb = transform(constant16, SEC1) | transform((seed[0] << 8) | seed[3], SEC2)
          lsb = transform((seed[1] << 8) | seed[2], SEC1) | transform(msb, SEC2)
          return bytes(msb >> 8, msb & 0xFF, lsb >> 8, lsb & 0xFF)   # sent after 27 <level + 1>
