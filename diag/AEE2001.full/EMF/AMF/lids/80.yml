    comment:
      en: 'Hard part number'
      fr: 'Référence Hard'
      es: 'Referencia Hard'
      de: 'Hardware-Nr.'
      pl: 'Referencja Hard'
      hu: 'Hardver v ltozat'
    type: 'bcd'

  SUPPLIER:
    bits: '6.7-7.0'
    comment:
      en: 'Supplier'
      fr: 'Fournisseur'
      es: 'Proveedor'
      de: 'Lieferant'
      pl: 'Dostawca'
      hu: 'Szállító'
    type: 'enum'
    values:
      0x03:
        en: 'BLAUPUNKT'
        fr: 'BLAUPUNKT'
      0x14:
        en: 'PHILIPS'
        fr: 'PHILIPS'
      0x15:
        en: 'CLARION'
        fr: 'CLARION'

  ADDITIONAL_NUMBER:
    bits: '8.7-12.0'
    comment:
      en: 'Additional number'
      fr: 'Numéro complémentaire'
      es: 'Número complementario'
      de: 'Zusatznummer'
      pl: 'Numer uzupełniający'
      hu: 'Kiegészíto szám'
