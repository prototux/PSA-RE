  CALIBRATIONS_MODIFICATION_INDEX:
    bits: '15.7-16.0'
    comment:
      en: 'Calibrations modification index'
      fr: 'Indice d''évolution des calibrations'
      es: 'Índice de evolución de las calibraciones'
      de: 'Aenderungsindex der Kalibrierungen'
      pl: 'Wskaźnik ewolucji kalibracji'
      hu: 'Kalibrálások verziószáma'
    type: 'bcd'

  DIAGNOSTIC_VERSION:
    bits: '17.7-17.0'
    comment:
      en: 'Diagnostic version'
      fr: 'Version diagnostic'
