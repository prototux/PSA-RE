node: 'CMM'
model: 'EDC16C3DV4'
display_name:
  en: 'Engine control unit (EDC16C3DV4)'
  fr: 'Calculateur moteur multifonction (EDC16C3DV4)'
protocols: ['KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'KWP-PSA2000'
    request_id: 0x6A8
    response_id: 0x688
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'KWP-PSA2000'
    request_id: 0x6A8
    response_id: 0x688

resets:
  0x80:
    en: 'Reset 0x80'
    fr: 'Réinitialisation 0x80'
  0x81:
