lid: 0x87
name: 'LID_87'
display_name:
  en: 'Data record 0x87 (7 values)'
  fr: 'Enregistrement 0x87 (7 valeurs)'
kind: 'other'
access: 'read'
length: 16

params:
  DTC_CODE:
    bits: '2.7-3.0'
    type: 'uint'
    mux_selector: true

  MIXTURE_REGULATION_STATUS:
    bits: '4.4-4.0'
    comment:
      en: 'Mixture regulation status'
      fr: 'État régulation de richesse'
      es: 'Estado regulación de riqueza'
      de: 'Zustand Gemischregelung'
      pl: 'Stan regulacji składu mieszanki'
      hu: 'Keverékszabályozás állapota'
    type: 'enum'
    values:
      0x01:
        en: 'Open loop (conditions for switching to a closed loop not yet satisfied)'
        fr: 'Boucle ouverte (conditions de passage en boucle fermée pas encore satisfaites)'
        es: 'Bucle abierto (condiciones de paso en bucle cerrado aún no satisfactorias)'
        de: 'Offene Regelkette (Bedingungen für Übergang in den geschlossenen Regelkreis noch nicht erfüllt)'
        pl: 'Pętla otwarta (warunki do przejścia do pętli zamkniętej jeszcze niezadowalające)'
        hu: 'Nyitott hurok (még nem teljesülnek a zárt hurokra történo áttéréshez szükséges feltételek)'
      0x02:
        en: 'Closed loop'
        fr: 'Boucle fermée'
        es: 'Bucle cerrado'
        de: 'Geschlossener Kreis'
        pl: 'Pętla zamknięta'
        hu: 'Z rt hurok'
      0x04:
        en: 'Open loop (special driving conditions)'
        fr: 'Boucle ouverte (condition particulières de roulage)'
        es: 'Bucle abierto (condición especial de circulación)'
        de: 'Offene Regelkette (besondere Fahrtbedingungen)'
        pl: 'Pętla otwarta (szczególne warunki jazdy)'
        hu: 'Nyitott hurok (sajátos menetfeltételek)'
      0x08:
        en: 'Open loop (fault)'
        fr: 'Boucle ouverte (défaillance)'
        es: 'Bucle abierto (fallo)'
        de: 'Offene Regelkette (Ausfall)'
        pl: 'Pętla otwarta (uszkodzenie)'
        hu: 'Nyitott hurok (meghib sod s)'
      0x10:
        en: 'Closed loop but fault on an oxygen sensor'
        fr: 'Boucle fermée mais défaillance d''une sonde à oxygène'
        es: 'Circuito cerrado, pero fallo de una sonda de oxígeno'
        de: 'Regelkreis geschlossen, aber Störung einer Lambdasonde'
        pl: 'Pętla zamknięta ale uszkodzenie jednej sondy lambda'
        hu: 'Zárt kör, de az egyik oxigénszondán hiba lépett fel'

  DTC_RANG:
    bits: '1.7-1.0'
    type: 'uint'

  COOLANT_TEMPERATURE:
    bits: '7.7-7.0'
    comment:
      en: 'Coolant temperature'
      fr: 'Température d''eau'
      es: 'Temperatura del agua'
      de: 'Kühlmitteltemperatur'
      pl: 'Temperatura płynu chłodzącego'
      hu: 'Hűtofolyadék-homérséklet'
    type: 'uint'
    units: '°C'

  INLET_MANIFOLD_PRESSURE:
    bits: '13.7-13.0'
    comment:
      en: 'Inlet manifold pressure'
      fr: 'Pression tubulure admission'
      es: 'Presión colector de admisión'
      de: 'Saugrohrdruck'
      pl: 'Ciśnienie w przewodzie dolotowym'
      hu: 'Szívócső nyomása'
    type: 'uint'
    factor: 10
    units: 'mbar'

  ENGINE_SPEED:
    bits: '14.7-15.0'
    comment:
      en: 'Engine speed'
      fr: 'Régime'
      es: 'Régimen'
      de: 'Drehzahl'
      pl: 'Prędkość obrotowa'
      hu: 'Fordulatszám'
    type: 'uint'
    factor: 0.25
    units: 'rpm'

  VEHICLE_SPEED:
    bits: '16.7-16.0'
    comment:
      en: 'Vehicle speed'
      fr: 'Vitesse véhicule'
      es: 'Velocidad vehículo'
      de: 'Fahrgeschwindigkeit'
      pl: 'Prędkość pojazdu'
      hu: 'Gépjárműsebesség'
    type: 'uint'
    units: 'km/h'
