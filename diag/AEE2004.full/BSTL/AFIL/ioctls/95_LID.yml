ioctl: 0x95
name: 'TEST_SENSOR_NUMBER_5'
display_name:
  en: 'Test of sensor number 5'
  fr: 'Test du capteur numéro 5'
  es: 'Test del captador número 5'
  de: 'Test des Gebers Nr. 5'
  pl: 'Test czujnika nr 5'
  hu: 'A 5 számú érzékelő tesztje'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER_1:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x00

results:
  CONTROL_STATUS_2:
    bits: '1.7-1.0'
    type: 'enum'
    values:
      0x01:
        en: 'Actuator jammed (disengaged)'
        fr: 'Actionneur bloqué (désengagé)'
        es: 'Accionador bloqueado (desengranado)'
        de: 'Stellglied blockiert (gelöst)'
        pl: 'Urządzenie wykonawcze zablokowane (odłączone)'
        hu: 'Blokkolt beavatkozószerv (kikapcsolt)'
      0x02:
        en: 'Actuator jammed (engaged)'
        fr: 'Actionneur bloqué (engagé)'
        es: 'Accionador bloqueado (engranado)'
        de: 'Stellglied blockiert (aktiviert)'
        pl: 'Urządzenie wykonawcze zablokowane (włączone)'
        hu: 'Blokkolt beavatkozószerv (bekapcsolt)'
      0x03:
        en: 'Protection activated'
        fr: 'Protection activée'
        es: 'Protección activa'
        de: 'Schutz aktiviert'
        pl: 'Zabezpieczenie włączone'
        hu: 'Védelem aktiválva'

tests:
  - display_name:
      en: 'Test of sensor number 5'
      fr: 'Test du capteur numéro 5'
      es: 'Test del captador número 5'
      de: 'Test des Gebers Nr. 5'
      pl: 'Test czujnika nr 5'
      hu: 'A 5 számú érzékelő tesztje'
    max_duration_ms: 15000
