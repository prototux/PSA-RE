lid: 0xC0
name: 'STATUS_PUSH_SWITCH'
display_name:
  en: 'Status of the push switch'
  fr: 'État du contacteur impulsionnel'
  es: 'Estado del contactor de impulsos'
  de: 'Zustand des Tippschalters'
  pl: 'Stan stycznika impulsowego'
  hu: 'Impulzusos kapcsoló állapota'
comment:
  en: 'Position of the switch received by the ECU. The "Position not valid" status corresponds to a non coherent command from the switch due to a switch or harness problem.'
  fr: 'Position du contacteur reçu par le boîtier. L''état " Position non valide " correspond à une commande incohérente en provenance du contacteur due à un problème de contacteur ou de faisceau.'
  es: 'Posición del contactor recibido por la caja. El estado "Posición no válilda" corresponde a una petición incoherente procedente del contactor debido a un problema de contactor o de haz de cables.'
  de: 'Vom Steuergerät empfangene Stellung des Schalters. Der Zustand "Stellung ungültig" entspricht einer unplausiblen Betätigung vom Schalter infolge eines Schalter- oder Kabelstrangproblems.'
  pl: 'Położenie stycznika odebrane przez moduł. Stan Położenie nieprawidłowe oznacza niespójne sterowanie, pochodzące od stycznika, w wyniku problemu ze stycznikiem lub z wiązką.'
  hu: 'A kapcsoló vezérlőegység által vételezett helyzete. Az Érvénytelen helyzet állapot egy, a kapcsolótól származó inkoherens vezérlésnek felel meg, ami a kapcsoló vagy a vezetékköteg problémájából adódik.'
kind: 'live'
access: 'read'
length: 1

