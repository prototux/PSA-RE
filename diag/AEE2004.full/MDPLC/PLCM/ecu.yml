node: 'MDPLC'
model: 'PLCM'
display_name:
  en: 'Sliding side door module (PLCM)'
  fr: 'Module de porte laterale coulissante (PLCM)'
protocols: ['KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'KWP-PSA2000'
    request_id: 0x755
    response_id: 0x655
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'
  0xC0:
    en: 'PSA diagnostic session'
    fr: 'Session de diagnostic PSA'

resets:
  0xB0:
    en: 'Reset 0xB0'
    fr: 'Réinitialisation 0xB0'

services: [0x10, 0x11, 0x14, 0x17, 0x21, 0x30, 0x3B, 0x3E]

tester_present:
  request: '3E'
  period_ms: 1000

identification:
  request: '21 80'
  part_number: '8.7-12.0'
  comment:
    en: 'The ECU part number is in data bytes 8 to 12 of the answer to 21 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 8 à 12 de la réponse à 21 80 (DCB), elle donne la variante logicielle'

cars: ['VCAN']

variants:
  VCAN_V1_1:
    parts: ['1400092980']
    cars: ['VCAN']
  VCAN_V1_2:
    parts: ['1400471980']
    cars: ['VCAN']
  VCAN_V1_3:
    parts: ['1400489280']
    cars: ['VCAN']
  VCAN_V1_4:
    parts: ['1400592580']
    cars: ['VCAN']
  VCAN_V1_5:
    parts: ['1400617280']
    cars: ['VCAN']
  VCAN_V1_6:
    parts: ['1400736580']
    cars: ['VCAN']
  VCAN_V1_7:
    parts: ['1400745380']
    cars: ['VCAN']
  VCAN_V1_8:
    parts: ['1400915280']
    cars: ['VCAN']
  VCAN_V1_9:
    parts: ['1401040580']
    cars: ['VCAN']
