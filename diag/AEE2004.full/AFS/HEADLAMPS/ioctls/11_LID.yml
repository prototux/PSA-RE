ioctl: 0x11
name: 'CENTRED_POSITION'
display_name:
  en: 'Centred position'
  fr: 'Position centrée'
  es: 'Posición centrada'
  de: 'Mittlere Position'
  pl: 'Położenie środkowe'
  hu: 'Központi pozíció'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants: ['B5_*', 'B58_*', 'X6_*', 'X7_*']

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x00

  CONTROL_PARAMETER_1:
    bits: '2.7-2.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Centred position'
      fr: 'Position centrée'
      es: 'Posición centrada'
      de: 'Mittlere Position'
      pl: 'Położenie środkowe'
      hu: 'Központi pozíció'
    max_duration_ms: 5000
  - display_name:
      en: 'Movement to the right'
      fr: 'Mouvement vers la droite'
      es: 'Movimiento hacia la derecha'
      de: 'Bewegung nach rechts'
      pl: 'Ruch w prawo'
      hu: 'Elmozdulás jobbra'
    max_duration_ms: 5000
  - display_name:
      en: 'Upwards movement'
      fr: 'Mouvement vers le haut'
      es: 'Movimiento hacia arriba'
      de: 'Bewegung nach oben'
      pl: 'Ruch w górę'
      hu: 'Elmozdulás felfelé'
    max_duration_ms: 5000
  - display_name:
      en: 'Downwards movement'
      fr: 'Mouvement vers le bas'
      es: 'Movimiento hacia abajo'
      de: 'Bewegung nach unten'
      pl: 'Ruch w dół'
      hu: 'Elmozdulás lefelé'
    max_duration_ms: 5000
  - display_name:
      en: 'Placing in the nominal position'
      fr: 'Mise en position nominale'
      es: 'Puesta en posición nominal'
      de: 'Einstellen der nominalen Position'
      pl: 'Ustawienie w położeniu nominalnym'
      hu: 'A névleges pozíció elfoglalása'
    max_duration_ms: 5000
  - display_name:
      en: 'Movement to the left'
      fr: 'Mouvement vers la gauche'
      es: 'Movimiento hacia la izquierda'
      de: 'Bewegung nach links'
      pl: 'Ruch w lewo'
      hu: 'Elmozdulás balra'
    max_duration_ms: 5000
  - display_name:
      en: 'Illumination of RH angle lamp'
      fr: 'Allumage du feu d''angle droit'
      es: 'Encendido de la luz de ángulo derecho'
      de: 'Einschalten Winkelbeleuchtung rechts'
      pl: 'Wlaczenie prawego swiatla katowego'
      hu: 'Jobboldali szöget bezáró világítás felgyulladása'
    max_duration_ms: 5000
  - display_name:
      en: 'Extinguishing of RH angle lamp'
      fr: 'Extinction du feu d''angle droit'
      es: 'Apagado de la luz de ángulo derecho'
      de: 'Ausschalten Winkelbeleuchtung rechts'
      pl: 'Wylaczenie prawego swiatla katowego'
      hu: 'Jobboldali szöget bezáró világítás kialvása'
    max_duration_ms: 5000
