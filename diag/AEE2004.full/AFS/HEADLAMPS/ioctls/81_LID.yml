      en: 'Vertical movement (height)'
      fr: 'Mouvement vertical (site)'
      es: 'Movimiento vertical (altura)'
      de: 'Vertikale Bewegung (Leuchtweite)'
      pl: 'Przesunięcie w pionie (kąt pochylenia wiązki świetlnej)'
