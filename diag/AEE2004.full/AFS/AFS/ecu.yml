node: 'AFS'
model: 'AFS'
display_name:
  en: 'Directional / adaptive headlamps (AFS)'
  fr: 'Projecteurs directionnels / adaptatifs (AFS)'
protocols: ['UDS', 'KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x6B7
    response_id: 0x697
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'
  0x92:
    en: 'Session 0x92'
    fr: 'Session 0x92'
  0xC0:
    en: 'PSA diagnostic session'
    fr: 'Session de diagnostic PSA'

resets:
  0x01:
    en: 'Hard reset'
    fr: 'Réinitialisation matérielle'
  0xB0:
    en: 'Reset 0xB0'
    fr: 'Réinitialisation 0xB0'

services: [0x10, 0x11, 0x14, 0x17, 0x18, 0x1A, 0x21, 0x27, 0x28, 0x29, 0x30, 0x31, 0x33, 0x34, 0x3E, 0x81, 0x82, 0x85]

security_access:
  - level: 0x01
  - level: 0x07
  - level: 0x83

tester_present:
  request: '3E'
  period_ms: 1000

identification:
  request: '21 80'
  part_number: '8.7-12.0'
  comment:
    en: 'The ECU part number is in data bytes 8 to 12 of the answer to 21 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 8 à 12 de la réponse à 21 80 (DCB), elle donne la variante logicielle'

cars: ['A7']

variants:
  A7_V1:
    parts: ['9680133780']
    cars: ['A7']
  A7_V1_1:
    parts: ['9654725580']
    cars: ['A7']
  A7_V1_2:
    parts: ['9680295980']
    cars: ['A7']
  I3_I4_V1_1:
    parts: ['3836333441303336']
  I3_I4_V1_2:
    parts: ['3836333441303334']
  I3_I4_V1_3:
    parts: ['3836333441303535']
