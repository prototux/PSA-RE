ioctl: 0x13
name: 'VERTICAL_CONTROL_TWO_HEADLAMPS'
display_name:
  en: 'Vertical control of the two headlamps'
  fr: 'Pilotage des deux projecteurs dans le sens vertical'
  es: 'Pilotaje de los dos faros en el sentido vertical'
  de: 'Steuerung der beiden Scheinwerfer in vertikaler Richtung'
  pl: 'Sterowanie dwoma reflektorami w pionie'
  hu: 'Két fényszóró vezérlése függőleges irányban'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

  MOVEMENT:
    bits: '2.7-2.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Vertical control of the two headlamps'
      fr: 'Pilotage des deux projecteurs dans le sens vertical'
      es: 'Pilotaje de los dos faros en el sentido vertical'
      de: 'Steuerung der beiden Scheinwerfer in vertikaler Richtung'
      pl: 'Sterowanie dwoma reflektorami w pionie'
      hu: 'Két fényszóró vezérlése függőleges irányban'
    max_duration_ms: 2500
  - display_name:
      en: 'Horizontal control of the two headlamps (only avec les dipped beam running)'
      fr: 'Pilotage des deux projecteurs dans le sens horizontal (uniquement avec les codes tournant)'
      es: 'Pilotaje de los dos faros en el sentido horizontal (únicamente avec les códigos en marchha)'
      de: 'Steuerung der beiden Scheinwerfer in horizontaler Richtung (nur avec les Abblendlicht drehend)'
      pl: 'Sterowanie dwoma reflektorami w poziomie (wyłącznie avec les kody pracuje)'
      hu: 'Két fényszóró vezérlése vízszintes irányban (kizárólag avec les kódok járó)'
    max_duration_ms: 2500
