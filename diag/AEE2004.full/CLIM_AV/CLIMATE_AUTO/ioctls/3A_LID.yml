ioctl: 0x3A
name: 'IO_CONTROL_3A'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants: ['I3_*', 'J3_*']

params:
  CO_STATUS:
    bits: '1.7-1.0'
    type: 'uint'
    default: 0x07

  L_UP_OPEN_REQ:
    bits: '2.0'
    type: 'bool'

results:
  COUNTER_STATUS:
    bits: '1.7-1.0'
    type: 'uint'
