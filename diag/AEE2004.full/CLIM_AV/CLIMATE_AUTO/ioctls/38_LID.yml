ioctl: 0x38
name: 'IO_CONTROL_38'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants: ['I3_*', 'J3_*']

params:
  CO_STATUS:
    bits: '1.7-1.0'
    type: 'uint'
    default: 0x07

  IDLE_UP_REQUEST:
    bits: '2.2-2.0'
    type: 'uint'

results:
  COUNTER_STATUS:
    bits: '1.7-1.0'
    type: 'uint'
