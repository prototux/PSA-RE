  - 'A51_*'
  - 'A55P_V1'
  - 'A55_*'
  - 'A58_*'
  - 'B9_*'
  - 'CLIMATISATION_VCAN_V1_2'
  - 'CLIM_*'
  - 'D2_*'
  - 'G9_*'
  - 'LA_*'
  - 'T3_*'
  - 'T7_*'
  - 'T84_*'
  - 'T87_V9'
  - 'T88_*'
  - 'X6_*'
  - 'X7C_*'
  - 'X7_*'

params:
  CONTROL_PARAMETER_1:
    bits: '1.7-1.0'
