ioctl: 0x8E
name: 'REAR_LEFT_BLOWER'
display_name:
  en: 'Rear left blower'
  fr: 'Pulseur arrière gauche'
  es: 'Impulsor trasero izquierdo'
  de: 'Gebläse hinten links'
  pl: 'Dmuchawa tylna lewa'
  hu: 'Bal hátsó befúvó-ventilátor'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants:
  - 'CLIMATISATION_VCAN_V1_2'
  - 'CLIM_B5_*'
  - 'CLIM_VCAN_*'
  - 'CLIM_Z9_*'
  - 'G9_*'
  - 'T3_*'
  - 'X7C_*'
  - 'X7_*'

params:
  CONTROL_PARAMETER_1:
    bits: '1.7-1.0'
    type: 'enum'

  CONTROL_PARAMETER_4:
    bits: '2.7-2.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Rear left blower'
      fr: 'Pulseur arrière gauche'
      es: 'Impulsor trasero izquierdo'
      de: 'Gebläse hinten links'
      pl: 'Dmuchawa tylna lewa'
      hu: 'Bal hátsó befúvó-ventilátor'
    max_duration_ms: 2000
  - display_name:
      en: 'Left-hand additional blower'
      fr: 'Pulseur additionnel gauche'
      es: 'Impulsor adicional izquierdo'
      de: 'Zusatzgebläse links'
      pl: 'Dmuchawa dodatkowa lewa'
      hu: 'Bal kiegészítő levegőbefúvó ventilátor'
    max_duration_ms: 4000
