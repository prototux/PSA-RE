routine: 0x01
name: 'ROUTINE_01'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
variants: ['CLIMATISATION_X250_V1', 'I3_*', 'J3_*']
control: ['start', 'stop', 'results']

params:
  ST_ADDRESS_HB_01:
    bits: '1.7-1.0'
    type: 'uint'

  ST_ADDRESS_MB_01:
    bits: '2.7-2.0'
    type: 'uint'

  ST_ADDRESS_LB_01:
    bits: '3.7-3.0'
    type: 'uint'

  SP_ADDRESS_HB_01:
    bits: '4.7-4.0'
    type: 'uint'

  SP_ADDRESS_MB_01:
    bits: '5.7-5.0'
    type: 'uint'

  SP_ADDRESS_LB_01:
    bits: '6.7-6.0'
    type: 'uint'

  CHECKSUM_HB_01:
    bits: '7.7-7.0'
    type: 'uint'

  CHECKSUM_LB_01:
    bits: '8.7-8.0'
    type: 'uint'

results:
  RESULT:
    bits: '1.7-1.0'
    type: 'uint'
