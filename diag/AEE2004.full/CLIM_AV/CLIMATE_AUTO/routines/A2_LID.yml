routine: 0xA2
name: 'PASSENGER_S_SIDE_AIR_DISTRIBUTION_MOTOR'
display_name:
  en: 'Passenger''s side air distribution motor'
  fr: 'Moteur répartition d''air côté passager'
  es: 'Motor de reparto de aire lado pasajero'
  de: 'Motor Luftverteilung Beifahrerseite'
  pl: 'Silnik rozdziału powietrza po stronie pasażera'
  hu: 'Utasoldali levegőelosztó motor'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
variants:
  - 'A7_*'
  - 'A51_*'
  - 'A55P_V1'
  - 'A55_*'
  - 'A58_*'
  - 'B9_*'
  - 'CLIMATISATION_VCAN_V1_2'
  - 'CLIM_*'
  - 'D2_*'
  - 'G9_*'
  - 'LA_*'
  - 'T3_*'
  - 'T7_*'
  - 'T84_*'
  - 'T87_V9'
  - 'T88_*'
  - 'X6_*'
  - 'X7C_*'
  - 'X7_*'
control: ['start']

params:
  INPUT_PARAM_1:
    bits: '1.7-1.0'
    type: 'enum'

  INPUT_PARAM_2:
    bits: '2.7-2.0'
    type: 'uint'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed but presence of a problem'
        fr: 'Pilotage terminé mais problème'
        es: 'Pilotaje terminado pero problema'
        de: 'Steuerung beendet, jedoch Problem'
        pl: 'Sterowanie zakończone, ale wystąpił problem'
        hu: 'Vezérlés befejezve de probléma lépett fel'
      0x0B:
        en: 'Test stopped by the operator (the test report is not available)'
        fr: 'Test arrêté par l''opérateur (le compte rendu du test n''est pas disponible)'
        es: 'Test detenido por el operario (el informe del test no está disponioble)'
        de: 'Test vom Techniker abgebrochen (Testbericht nicht verfügbar)'
        pl: 'Test zatrzymany przez operatora (sprawozdanie z test niedostępne)'
        hu: 'A kezelő által leállított teszt (a teszt jegyzőkönyve nem áll rendelkezésre)'

tests:
