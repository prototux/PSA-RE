did: 0x0898
name: 'CONDITION_SOLENOID_VALVE_RELAY'
display_name:
  en: 'Condition of the solenoid valve relay'
  fr: 'État relais électrovanne'
  es: 'Estado relés electroválvulas'
  de: 'Zustand Magnetventil - Relais'
  pl: 'Stan przekaźnika elektrozaworu'
  hu: 'Mágnesszelep relé állapota'
comment:
  en: 'During normal operation, the relay is closed if the ignition is on.if the relay is open, it is faulty and the bleed will not be carried out correctly.'
  fr: 'En fonctionnement normal, le relais est fermé si le contact est mis.si le relais est ouvert, celui-ci est en panne et la purge ne s''exécutera pas correctement.'
  es: 'En funcionamiento normal, el relé está cerrado si el contacto está dado.si el relé está abierto, es que está averiado y el purgado no se ejecutará correctamente.'
  de: 'Im Normalbetrieb ist das Relais bei eingeschaltetem Fahrtschalter geschlossen.bei offenem Relais ist dieses defekt und die Entlüftung erfolgt nicht einwandfrei.'
  pl: 'Przy normalnym działaniu przekaźnik jest zamknięty przy włączonym zapłonie.jeżeli przekaźnik jest otwarty to oznacza, że jest uszkodzony i odpowietrzenie nie zostanie prawidłowo wykonane.'
  hu: 'Normális működés esetén, a relé zárva van, ha a gyújtás rá van adva.ha a relé nyitott, az meghibásodott és a légtelenítés nem kerül megfelelően elvégzésre.'
kind: 'live'
access: 'read'
length: 1
variants: ['MCV_*']

