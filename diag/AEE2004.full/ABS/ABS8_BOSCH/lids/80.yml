lid: 0x80
name: 'IDENTIFICATION'
display_name:
  en: 'ECU identification (part numbers, versions)'
  fr: 'Identification du calculateur (références, versions)'
kind: 'identification'
access: 'read'
length: 17

params:
  EQUIPMENT_PART_NUMBER:
    bits: '1.7-5.0'
    comment:
      en: 'Equipment part number'
      fr: 'Référence du matériel'
      es: 'Referencia del equipo'
      de: 'Hardware-Teilenummer'
      pl: 'Referencja sprzętu'
      hu: 'Felszerelés cikkszáma'
    type: 'bcd'

  NAME_SUPPLIER:
    bits: '6.7-7.0'
    comment:
      en: 'Name of the Supplier'
      fr: 'Nom du Fournisseur'
      es: 'Nombre del Proveedor'
      de: 'Name des Lieferanten'
      pl: 'Nazwa Dostawcy'
      hu: 'Szállító neve'
    type: 'enum'
    values:
      0x01:
        en: 'SIEMENS/VIMERCATI'
        fr: 'SIEMENS/VIMERCATI'
      0x02:
        en: 'TRW'
        fr: 'TRW'
      0x03:
        en: 'MAGNETI'
        fr: 'MAGNETI'

  NUMBER_COMPLEMENTARY:
    bits: '8.7-12.0'
    alt_names: ['EQUIPMENT_ADDITIONAL_REFERENCE']
    comment:
      en: 'Equipment additional reference'
      fr: 'Référence complémentaire du matériel'
      es: 'Referencia complementaria del material'
      de: 'Zusätzliche Hardware-Teilenummer'
      pl: 'Referencja uzupełniająca sprzętu'
      hu: 'Termék kiegészítő cikkszáma'
    type: 'bcd'

  SOFTWARE_VERSION:
    bits: '13.7-14.0'
    comment:
      en: 'Software version'
      fr: 'Version du logiciel'
      es: 'Versión del programa'
      de: 'Software-Version'
      pl: 'Wersja oprogramowania'
      hu: 'Logikai verzió'
    type: 'bcd'

  CALIBRATIONS_MODIFICATION_INDEX:
    bits: '15.7-16.0'
    alt_names: ['CALIBRATION_VERSION', 'ID_REF_CALIBRATION_NEW_2']
    comment:
      en: 'Calibrations modification index'
      fr: 'Indice d''évolution des calibrations'
      es: 'Índice de evolución de las calibraciones'
      de: 'Aenderungsindex der Kalibrierungen'
      pl: 'Wskaźnik ewolucji kalibracji'
      hu: 'Kalibrálások verziószáma'
    type: 'bcd'

  DIAGNOSTIC_VERSION:
    bits: '17.7-17.0'
    comment:
      en: 'Diagnostic version'
      fr: 'Version de diagnostic'
      es: 'Versión de diagnosis'
      de: 'Diagnoseversion'
      pl: 'Wersja diagnostyki'
      hu: 'Diagnosztika verziója'
    type: 'uint'
