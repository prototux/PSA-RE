node: 'ABS'
model: 'ESP81'
display_name:
  en: 'ABS/ESP brake control unit (ESP81)'
  fr: 'Calculateur ABS/ESP (ESP81)'
protocols: ['UDS', 'KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x6AD
    response_id: 0x68D
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x6AD
    response_id: 0x68D
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x18DA28F1
    response_id: 0x18DAF128
    comment:
      en: '29 bit CAN identifiers'
      fr: 'Identifiants CAN 29 bits'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'
  0x40:
    en: 'Session 0x40'
    fr: 'Session 0x40'

resets:
  0x01:
    en: 'Hard reset'
    fr: 'Réinitialisation matérielle'

services: [0x10, 0x11, 0x14, 0x17, 0x19, 0x21, 0x22, 0x27, 0x28, 0x2E, 0x2F, 0x30, 0x31, 0x32, 0x34, 0x36, 0x37, 0x3E, 0x81, 0x82, 0x85, 0x86]

security_access:
  - level: 0x01
    algorithm: 'PSA_SEED_KEY'
    key: 'ABFB'
  - level: 0x05
  - level: 0x83
    algorithm: 'PSA_SEED_KEY'
    key: 'ABFB'

tester_present:
  request: '3E 00'
  period_ms: 1000

identification:
  request: '21 FE'
  part_number: '22.7-24.0'
  comment:
    en: 'The ECU part number is in data bytes 22 to 24 of the answer to 21 FE (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 22 à 24 de la réponse à 21 FE (DCB), elle donne la variante logicielle'

cars: ['B5', 'B7', 'B75', 'B8', 'B9', 'D2', 'G9', 'M59', 'MCV', 'T6', 'T7', 'T8', 'VCAN', 'W2', 'X6', 'X7']

