params:
  ENGINE_STATUS:
    bits: '1.7-1.0'
    comment:
      en: 'Engine status'
      fr: 'Etat moteur thermique'
      es: 'Estado motor térmico'
      de: 'Zustand Verbrennungsmotor'
      pl: 'Stan silnika spalinowego'
      hu: 'A belsőégésű motor állapota'
    type: 'enum'
    values:
      0x00:
        en: 'Internal combustion engine cut'
        fr: 'Moteur thermique coupé'
        es: 'Motor térmico cupé'
        de: 'Verbrennungsmotor Coupé'
        pl: 'Silnik spalinowy coupé'
        hu: 'Belsőégésű motor coupé'
      0x04:
        en: 'Driven starting of the internal combustion engine'
        fr: 'Démarrage entraîné du moteur thermique'
        es: 'Arranque del motor térmico'
        de: 'Angetriebenes Anlassen des Verbrennungsmotors'
        pl: 'Rozruch napędzany przez silnik cieplny'
        hu: 'Belsőégésű motor meghajtott indítás'
      0x08:
        en: 'Internal combustion engine running'
        fr: 'Moteur thermique tournant'
        es: 'Motor térmico en marcha'
        de: 'Verbrennungsmotor läuft'
        pl: 'Silnik spalinowy pracuje'
        hu: 'Működő belsőégésű motor'
      0x12:
        en: 'Internal combustion engine cut-out'
        fr: 'Coupure du moteur thermique'
        es: 'Corte del motor térmico'
        de: 'Ausschalten des Verbrennungsmotors'
        pl: 'Odcięcie silnika cieplnego'
        hu: 'Belsőégésű motor lekapcsolása'

  VACUUM_PUMP_RELAY_STATUS:
    bits: '2.7-2.0'
    comment:
      en: 'Vacuum pump relay status'
      fr: 'Etat du relais de la pompe à vide'
      es: 'Estado del relé de la bomba de vacío'
      de: 'Zustand des Relais der Vakuumpumpe'
      pl: 'Stan przekaźnika pompy podciśnienia'
      hu: 'A vákuumszivattyú reléjének állapota'
    type: 'enum'
    values:
      0x00:
        en: 'Inactive'
        fr: 'Inactif'
        es: 'Inactivo'
        de: 'Inaktiv'
        pl: 'Nieaktywny'
        hu: 'Nem muködik'
      0x01:
        en: 'Active'
        fr: 'Actif'
        es: 'Activo'
        de: 'Aktiv'
        pl: 'Aktywny'
        hu: 'Aktív'

  PRESSURE_BRAKE_SERVO_1_ESP:
    bits: '3.7-3.0'
    comment:
      en: 'Pressure of the brake servo 1 (ESP)'
      fr: 'Pression de l''amplificateur de freinage 1 (ESP)'
      es: 'Presión del amplificador de frenada 1 ESP'
      de: 'Druck des Bremskraftverstärkers 1 (ESP)'
      pl: 'Ciśnienie siłownika układu hamulcowego 1 (ESP)'
