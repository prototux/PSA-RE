      0x00:
        en: 'No action possible'
        fr: 'Aucune action possible'
        es: 'Ninguna acción posible'
        de: 'Kein Eingriff möglich'
        pl: 'Żadne działanie nie jest możliwe'
        hu: 'Semmilyen muködtetés sem lehetséges'
      0x01:
