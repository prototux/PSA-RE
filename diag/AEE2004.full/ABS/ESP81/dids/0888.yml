did: 0x0888
name: 'LONGITUDINAL_ACCELERATION'
display_name:
  en: 'Longitudinal acceleration'
  fr: 'Accélération longitudinale'
  es: 'Aceleración longitudinal'
  de: 'Längsbeschleunigung'
  pl: 'Przyspieszanie wzdłużne'
  hu: 'Hosszirányú gyorsulás'
comment:
  en: 'Information calculated from the average of the rear wheel speeds. if one of the rear wheel sensors is faulty, the information will be calculated from the speed of the functional rear wheel sensor and of the front wheel sensor diagonally opposite.'
  fr: 'Information calculée à partir de la moyenne des vitesses des roues arrière. si un des capteurs de roue arrière est défectueux, l''information sera calculée à partir de la vitesse du capteur de roue arrière fonctionnel et du capteur de roue avant diagonale.'
  es: 'Información calculada a partir de la media de las velocidades de las ruedas traseras. si uno de los captadores de rueda trasera es defectuoso, la información se calculará a partir de la velocidad del captador de rueda trasera funcional y del captador de rueda delantera diagonal.'
  de: 'Durch den Durchschnitt der Geschwindigkeiten der hinteren Räder berechnete Information. wenn ein Hinterradsensor defekt ist, wird die Information anhand der Geschwindigkeit des funktionierenden Hinterradsensors und des diagonal gegenüberliegenden Vorderradsensors berechnet.'
  pl: 'Informacja obliczana w oparciu o srednia predkosci tylnych kól. jeżeli jeden z czujników tylnego koła jest uszkodzony, informacja zostanie obliczona na podstawie prędkości ze sprawnego czujnika tylnego koła i czujnika przedniego koła znajdującego się po przekątnej.'
  hu: 'A hátsó kerekek átlagsebessége alapján számított információ. ha az egyik hátsó keékérzékelő meghibásodott, akkor az információ a működő és a vele átlósan elhelyezkedő kerékérzékelő sebességéből kerül kiszámításra.'
kind: 'live'
