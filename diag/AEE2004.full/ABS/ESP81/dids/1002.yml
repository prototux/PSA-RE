did: 0x1002
name: 'VEHICLE_SPEED'
display_name:
  en: 'Vehicle speed'
  fr: 'Vitesse véhicule'
  es: 'Velocidad vehículo'
  de: 'Fahrtgeschwindigkeit'
  pl: 'Predkosc pojazdu'
  hu: 'Gépjárműsebesség'
comment:
  en: 'This is the speed of the front axle of the vehicle. This speed is calculated from the tyre circumference and the information returned by the sensors located at the front wheels. If a front wheel sensor is faulty, the vehicle speed information will be calculated from the valid wheel speed sensor and the rear wheel speed sensor diagonally opposite. If both front wheel speed sensors are faulty, the vehicle speed information is calculated from the two rear wheel sensors and the tyre circumference configured.'
  fr: 'C''est la vitesse du train avant du véhicule. Cette vitesse est calculée à partir de la développée de pneumatique et des informations remontées par les capteurs situés au niveau des roues avant. Si un capteur de roue avant est défectueux, l''information vitesse véhicule sera calculée à partir du capteur de vitesse de roue valide et le capteur de vitesse de roue arrière diagonale. Si les deux capteurs de vitesse de roue avant sont défectueux, l''information vitesse véhicule est calculée à partir des deux capteurs de roue arrière et la développée de pneumatique télécodée.'
  es: 'Es la velocidad del tren delantero del vehículo. esta velocidad está calculada a partir del desarrollo del neumático y de las informaciones subidas por los captadores situados a nivel de las ruedas delanteras. si un captador de rueda delantera está defectuoso, la información velocidad vehículo será calculada a partir del captador de velocidad de rueda válida y el captador de velocidad de rueda trasera diagonal. si los dos captadores de velocidad de ruedas delanteras están defectuosos, la información velocidad vehículo está calculada a partir de los dos captadores de ruedas traseras y el desarrollo del neumático telecodificado.'
  de: 'Dies ist die Geschwindigkeit der Vorderachse des Fahrzeugs. Diese Geschwindigkeit wird berechnet anhand des Reifenabrollumfangs und der Informationen der vorderen Raddrehzahlgeber.. Wenn ein Vorderrad-Drehzahlgeber defekt ist, wird die Information Geschwindigkeit berechnet anhand des gültigen Raddrehzahlgebers und des diagonal gegenüber liegenden hinteren Raddrehzahlgebers.. Wenn beide vorderen Raddrehzahlgeber defekt sind, wird die Information Geschwindigkeit berechnet anhand der beiden hinteren Raddrehzahlgeber und des codierten Reifenabrollumfangs.'
  pl: 'To jest prędkość przedniego zawieszenia pojazdu. Ta prędkość jest obliczona na podstawie ewoluty opony i informacji przekazywanych przez czujnik, umieszczone na poziomie przednich kół. W przypadku uszkodzenia jednego z czujników przedniego koła informacja o prędkości pojazdu zostanie obliczona na podstawie sprawnego czujnika koła i czujnika tylnego koła umieszczonego po przekątnej. W przypadku uszkodzenia obu czujników przedniego koła informacja o prędkości pojazdu zostanie obliczona na podstawie obu czujników tylnego koła i telekodowanej ewoluty opony.'
  hu: 'Ez a gépkocsi első futóművének sebessége. ez a sebesség a gumiabroncs legördülési méretéből és az első kerekennél lévő érzékelők által továbbított információkból kerül kiszámításra. ha egy első kerékérzékelő meghibásodott, a járműsebesség információ az érvényes kerék sebességérzékelője alapján és az átlósan elhelyezkedő hátsó kerék sebességérzékelője alapján fog kiszámításra kerülni. ha mindkét első kerék sebességérzékelője meghibásodott, a járműsebesség információ a két hátsó kerék sebességérzékelője és a gumiabroncs távkódolt legördülési mérete alapján fog kiszámításra kerülni.'
