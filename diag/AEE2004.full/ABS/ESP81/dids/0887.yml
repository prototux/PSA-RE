comment:
  en: 'Speed measured by the gyrometer-accelerometer sensor. this measurement is positive for a turn to the left. This test requires driving at a speed below 10 km/h in order to obtain correct values'
  fr: 'Vitesse mesurée par le capteur gyromètre-accéléromètre. cette mesure est positive pour un virage à gauche. Ce test nécessite un roulage à une vitesse inférieure à 10 km/h pour avoir de bonnes valeurs'
  es: 'Velocidad medida por el captador girómetro-acelerómetro. esta medición es positiva para una curva a la izquierda. Este test requiere circular con el vehículo a una velocidad inferior a 10 km/h para obtener los valores correctos'
  de: 'Vom Kreiselmesser/Beschleunigungssensor gemessene Geschwindigkeit. diese Messung ist bei einer Linkskurve positiv. Dieser Test erfordert eine Fahrt mit einer Geschwindigkeit von weniger als 10 km/h, um korrekte Werte zu erhalten'
  pl: 'Prędkość zmierzona przez czujnik żyroskopu miernika przyspieszenia. wartość ta jest dodatnia w przypadku skrętu w lewo. Ten test wymaga przeprowadzenia jazdy z prędkością mniejszą od 10 km/h w celu uzyskania prawidłowych wartości'
  hu: 'A girométerrel (perdületmérő) mért sebesség. ez a mérés bal kanyar esetében pozitív értékű. Ezen teszt egy 10 km/h alatti sebességgel történő gurulást igényel a megfelelő értékek érdekében'
