node: 'SBW'
model: 'COMELBVA'
display_name:
  en: 'Shift-by-wire gear selector (COMELBVA)'
  fr: 'Selecteur de vitesses electrique (COMELBVA)'
protocols: ['KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'KWP-PSA2000'
    request_id: 0x6AA
    response_id: 0x68A
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0xC0:
    en: 'PSA diagnostic session'
    fr: 'Session de diagnostic PSA'

resets:
  0xA0:
    en: 'Reset 0xA0'
    fr: 'Réinitialisation 0xA0'
  0xA1:
    en: 'Reset 0xA1'
    fr: 'Réinitialisation 0xA1'
  0xB0:
    en: 'Reset 0xB0'
    fr: 'Réinitialisation 0xB0'
  0xFF:
    en: 'Reset 0xFF'
    fr: 'Réinitialisation 0xFF'

services: [0x10, 0x11, 0x14, 0x17, 0x21, 0x27, 0x30, 0x31, 0x34, 0x3E, 0x81, 0x82]

security_access:
  - level: 0x83

tester_present:
  request: '3E'
  period_ms: 1000

identification:
  request: '21 80'
  part_number: '8.7-12.0'
  comment:
    en: 'The ECU part number is in data bytes 8 to 12 of the answer to 21 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 8 à 12 de la réponse à 21 80 (DCB), elle donne la variante logicielle'

cars: ['B5']

variants:
  B5_V1:
    parts: ['0000000000']
    cars: ['B5']
  B5_V2:
    parts: ['9661768480']
    cars: ['B5']
  B5_V3:
    parts: ['9662897580']
    cars: ['B5']
