        es: 'Fallo : par insuficiente para salir de las posiciones de dureza'
        de: 'Ausgefallen : Drehmoment nicht geeignet, um die Einstellpositionen zu verlassen'
        pl: 'Wadliwy : niewystarczający moment obrotowy do opuszczenia ustawionego położenia'
