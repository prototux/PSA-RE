        fr: 'Défaillant : télécodage non effectué'
        es: 'Fallo : telecodificado no realizado'
        de: 'Ausgefallen : Ferncodierung nicht durchgeführt'
        pl: 'Wadliwy : telekodowanie niewykonane'
