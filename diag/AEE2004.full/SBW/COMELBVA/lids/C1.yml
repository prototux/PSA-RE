  PROGRAMMING_STATUS_POSITIONS_P_R_N_AND_D:
    bits: '17.7-17.0'
    comment:
      en: 'Programming status of positions P, R, N and D by the automatic gearbox electric control ECU'
      fr: 'Etat de l''apprentissage des positions P, R, N et D par le calculateur de commande électrique de boîte de vitesses automatique'
      es: 'Estado del aprendizaje de las posiciones P, R, N y D por el calculador de mando eléctrico de caja de velocidades automática'
      de: 'Zustand der Einspeicherungen der Positionen P, R, N und D vom Steuergerät elektrische Betätigung des Automatikgetriebes'
      pl: 'Stan uczenia polozen P, R, N i D przez kalkulator elektrycznego sterowania automatycznej skrzyni biegów'
      hu: 'Az automata sebességváltó P, R, N és D pozíciói megtanulásának állapota az elektromos vezérlés számítóegysége révén'
    type: 'enum'
    values:
      0x00:
        en: 'Not carried out'
        fr: 'Non réalisé'
        es: 'No realizado'
        de: 'Nicht durchgeführt'
        pl: 'Nie wykonane'
        hu: 'Nincs végrehajtva'
      0x01:
        en: 'Faulty : ECU supply voltage outside limits'
        fr: 'Défaillant : tension d''alimentation du calculateur hors limites'
        es: 'Fallo : tensión de alimentación del calculador fuera de límites'
        de: 'Ausgefallen : versorgungsspannung des Steuergeräts außerhalb der Grenzwerte'
        pl: 'Wadliwy : napięcie zasilania kalkulatora poza zakresem'
        hu: 'Hibás : a vezérlő egység tápellátása hátárértéken túli'
      0x02:
        en: 'Faulty : electrical problem'
        fr: 'Défaillant : problème électrique'
        es: 'Fallo : problema eléctrico'
        de: 'Ausgefallen : elektrischer Fehler'
        pl: 'Wadliwy : usterka elektryczna'
        hu: 'Hibás : elektromos probléma'
      0x03:
        en: 'Faulty : lack of coherence between the position of the gearbox and the position of the actuator'
        fr: 'Défaillant : incohérence entre la position de la boîte de vitesses et de l''actionneur'
        es: 'Fallo : incoherencia entre la posición de la caja de cambios y el accionador'
        de: 'Ausgefallen : keine Kohärenz zwischen der Position des Getriebes und des Stellglieds'
        pl: 'Wadliwy : niespójność pomiędzy położeniem skrzyni biegów i urządzeniem wykonawczym'
        hu: 'Hibás : inkoherencia a sebességváltó és a működtető helyzete között'
      0x04:
        en: 'Faulty : programmed positions outside limits'
        fr: 'Défaillant : positions apprises hors limites'
        es: 'Fallo : posiciones memorizadas fuera de límites'
        de: 'Ausgefallen : eingespeicherte Positionen außerhalb der Grenzwerte'
        pl: 'Wadliwy : nauczone położenia poza zakresem'
        hu: 'Hibás : a batanítási helyzet határértéken túli'
      0x05:
        en: 'Faulty : configuration not carried out'
        fr: 'Défaillant : télécodage non effectué'
        es: 'Fallo : telecodificado no realizado'
        de: 'Ausgefallen : Ferncodierung nicht durchgeführt'
        pl: 'Wadliwy : telekodowanie niewykonane'
        hu: 'Hibás : nem elvégzett konfigurálás'
      0x06:
        en: 'Faulty : gearbox oil temperature outside limits'
        fr: 'Défaillant : température d''huile de boîte de vitesses hors limites'
        es: 'Fallo : temperatura de aceite de caja de cambios fuera de límites'
        de: 'Ausgefallen : Öltemperatur des Getriebes außerhalb der Grenzwerte'
        pl: 'Wadliwy : temperatura oleju skrzyni biegów poza zakresem'
        hu: 'Hibás : a sebességváltó olaj hőmérséklete határétéken túli'
      0x07:
        en: 'Faulty : engine speed outside limit or absent'
        fr: 'Défaillant : régime moteur hors limite ou absent'
        es: 'Fallo : régimen motor fuera de límite o ausente'
        de: 'Ausgefallen : Motordrehzahl außerhalb der Grenzwerte oder nicht vorhanden'
        pl: 'Wadliwy : prędkość obrotowa silnika poza zakresem lub brak'
        hu: 'Hibás : nincs motor fordulatszám vagy határértéken túli'
      0x08:
        en: 'Faulty : insufficient torque for exit from the ball positions'
        fr: 'Défaillant : couple insuffisant pour sortir des positions de billage'
        es: 'Fallo : par insuficiente para salir de las posiciones de dureza'
        de: 'Ausgefallen : Drehmoment nicht geeignet, um die Einstellpositionen zu verlassen'
        pl: 'Wadliwy : niewystarczający moment obrotowy do opuszczenia ustawionego położenia'
        hu: 'Hibás : a nyomaték nem elegendő az arretálóból történő kimozdításhoz'
      0x09:
        en: 'Faulty : no movement'
        fr: 'Défaillant : pas de mouvement'
        es: 'Fallo : no hay movimiento'
        de: 'Ausgefallen : keine Bewegung'
        pl: 'Wadliwy : brak ruchu'
        hu: 'Hibás : nincs mozgás'
      0x0A:
        en: 'Programming done'
        fr: 'Apprentissage réalisé'
        es: 'Aprendizaje realizado'
        de: 'Einspeicherung ausgeführt'
        pl: 'Uczenie wykonane'
        hu: 'Elvégzett tanulás'
