ioctl: 0x12
name: 'RELEASING_PLACING_DECLUTCHED_POSITION_GEAR'
display_name:
  en: 'Releasing (placing in the declutched position) of the gear selection actuator solenoid'
  fr: 'Déverrouillage (mise en position débrayée) du solénoïde de l''actionneur de sélection de rapport de vitesses'
  es: 'Desbloqueo (puesta en posición soltado) del solenoide del accionador de selección de cambio de velocidades'
  de: 'Entriegelung (Einstellen der Position ausgekuppelt) der Spule des Stellglieds für die Auswahl der Fahrstufen'
  pl: 'Odblokowanie (ustawianie w położeniu wyłączonym) cewki urządzenia wykonawczego wybierania biegów'
  hu: 'A fokozatválasztó beavatkózó szolenoidjának kireteszelése (nyitott helyzetbe kapcsolás)'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Releasing (placing in the declutched position) of the gear selection actuator solenoid'
      fr: 'Déverrouillage (mise en position débrayée) du solénoïde de l''actionneur de sélection de rapport de vitesses'
      es: 'Desbloqueo (puesta en posición soltado) del solenoide del accionador de selección de cambio de velocidades'
      de: 'Entriegelung (Einstellen der Position ausgekuppelt) der Spule des Stellglieds für die Auswahl der Fahrstufen'
      pl: 'Odblokowanie (ustawianie w położeniu wyłączonym) cewki urządzenia wykonawczego wybierania biegów'
      hu: 'A fokozatválasztó beavatkózó szolenoidjának kireteszelése (nyitott helyzetbe kapcsolás)'
    max_duration_ms: 5000
