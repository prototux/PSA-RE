lid: 0xDA
name: 'OIL_COUNTER_VALUE'
display_name:
  en: 'Oil counter value'
  fr: 'Valeur du compteur d''huile'
  es: 'Valor del contador de aceite'
  de: 'Wert des Ölzählers'
  pl: 'Wartość wskaźnika poziomu oleju'
  hu: 'Olajelhasználódási számláló érték'
comment:
  en: 'In the case of replacement of an ECU only which still communicates with the diagnostic equipment (without replacement of the automatic gearbox or of the automatic gearbox oil), read the value of the oil wear counter of the old ECU and write this value in'
  fr: 'En cas d''échange d''un calculateur seul dialoguant toujours avec l''outil de diagnostic (sans échange de la BVA ou de l''huile de BVA), relever la valeur du compteur d''usure d''huile de l''ancien calculateur et la réécrire dans le nouveau'
  es: 'En caso de sustitución de un calculador solo que dialogue siempre con el útil de diagnosis (sin sustitución de la CCA o del aceite de la CCA), anotar el valor del contador de desgaste de aceite del antiguo calculador y volverlo a escribir en el nuevo'
  de: 'Bei Austausch nur des Steuergeräts, das weiter mit dem Diagnosewerkzeug kommuniziert (ohne Austausch des Automatikgetriebes oder seines Öls) den Wert des Ölalterungszählers des alten Steuergeräts auslesen und ins neue Steuergerät schreiben'
  pl: 'W przypadku wymiany kalkulatora, który jako jedyny pozostaje w dialogu z przyrządem diagnostycznym (bez wymiany BVA lub oleju BVA), odczytać wartość licznika zużycia oleju starego kalkulatora i zapisać ją w nowym'
  hu: 'Egyetlen, a diagnosztikai készülékkel még mindig párbeszédet folytató computer cseréje esetében (automata sebességváltó vagy automata sebességváltó olajának cseréje nélkül), olvassa le a régi computer olajelhasználódás számlálójának értékét és írja be'
kind: 'live'
access: 'read'
length: 4

params:
  OIL_COUNTER_VALUE:
    bits: '1.7-4.0'
    comment:
      en: 'Oil counter value'
      fr: 'Valeur du compteur d''huile'
      es: 'Valor del contador de aceite'
      de: 'Wert des Ölzählers'
      pl: 'Wartość wskaźnika poziomu oleju'
      hu: 'Olajelhasználódási számláló érték'
    type: 'uint'
