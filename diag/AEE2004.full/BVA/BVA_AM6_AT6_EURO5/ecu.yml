node: 'BVA'
model: 'BVA_AM6_AT6_EURO5'
display_name:
  en: 'Gearbox control unit (BVA_AM6_AT6_EURO5)'
  fr: 'Calculateur de boite de vitesses (BVA_AM6_AT6_EURO5)'
protocols: ['KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'KWP-PSA2000'
    request_id: 0x6A9
    response_id: 0x689
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'
