lid: 0xCC
name: 'LID_CC'
display_name:
  en: 'Data record 0xCC (8 values)'
  fr: 'Enregistrement 0xCC (8 valeurs)'
kind: 'other'
access: 'read'

mapped:
  comment:
    en: 'The position of these values is not fixed: the ECU packs the values it supports in the order given by its own parameter table (index), see the ecu.yml comment. Values of less than 8 bits are packed from the least significant bit of each byte, bigger values start on a byte boundary'
    fr: 'La position de ces valeurs n''est pas fixe : le calculateur range les valeurs qu''il gère dans l''ordre de sa propre table de paramètres (index), voir le commentaire de ecu.yml. Les valeurs de moins de 8 bits sont rangées à partir du bit de poids faible de chaque octet, les plus grandes commencent sur un octet entier'
  params:
    COMMAND_UP_WINDOW_REAR_LEFT:
      index: 1
      length: 1
      type: 'bool'
    OUTPUT_FRONT_ONE_TOUCH_ELECTRIC_WINDOW:
      index: 12
      length: 1
      comment:
        en: 'Output from the front one-touch electric window'
        fr: 'Sortie du lève-vitre impulsionnel avant'
        es: 'Salida del elevalunas por impulsos delantero'
        de: 'Ausgang Scheibenheber mit Impulssteuerung vorn'
        pl: 'Wyjście impulsowego podnośnika przedniej szyby'
        hu: 'Első impulzusos ablakemelő kimenet'
      type: 'bool'
      values:
        0x00:
          en: 'Inactive'
          fr: 'Inactivé'
          es: 'Inactivo'
          de: 'Nicht aktiviert'
          pl: 'Nie uaktywniony'
          hu: 'Hatástalanított'
        0x01:
          en: 'Active'
          fr: 'Active'
          es: 'Activo'
          de: 'Aktiv'
          pl: 'Aktywny(a)(e)'
          hu: 'Aktív'
    COMMAND_LIFT_WINDOW_IMPULSE_REAR:
      index: 14
      length: 1
      type: 'bool'
    BSI_COMMAND_LIFT_WINDOW_PULSE_REAR:
      index: 15
      length: 1
      type: 'bool'
    COMMAND_LIFT_WINDOW_IMPULSE_PASSENGER:
      index: 16
      length: 8
      type: 'enum'
    COMMAND_UP_WINDOW_REAR_RIGHT:
      index: 0
      length: 1
      type: 'bool'
    COMMAND_DOWN_WINDOW_REAR_LEFT:
      index: 4
      length: 1
      type: 'bool'
    COMMAND_DOWN_WINDOW_REAR_RIGHT:
      index: 3
      length: 1
