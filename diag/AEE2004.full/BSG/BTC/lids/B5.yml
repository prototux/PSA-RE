      index: 9
      length: 1
      comment:
        en: 'Tamperproof mode'
        fr: 'Mode inviolabilité'
        es: 'Modo inviolabilidad'
        de: 'Modus Sicherung'
        pl: 'Tryb zabezpieczający'
        hu: 'Sérthetetlenségi üzemmód'
      type: 'bool'
      values:
        0x00:
          en: 'Inactive'
          fr: 'Inactif'
          es: 'Inactivo'
          de: 'Inaktiv'
          pl: 'Nieaktywny'
          hu: 'Nem muködik'
        0x01:
          en: 'Active'
          fr: 'Actif'
          es: 'Activo'
          de: 'Aktiv'
          pl: 'Aktywny'
          hu: 'Aktív'
    MILEAGE_THRESHOLD_FORCING_CUSTOMER_MODE:
      index: 13
      length: 8
      comment:
        en: 'Mileage threshold for forcing of the customer mode'
        fr: 'Seuil de kilométrage pour le forçage du mode client'
        es: 'Umbral del kilometraje para el forzado del modo cliente'
        de: 'Laufleistungs-Grenzwert für Schaltung des Kundenmodus'
        pl: 'Próg przebiegu dla wymuszenia trybu klienta'
        hu: 'Kilométeróra-állás küszöbérték az ügyfél üzemmód kényszerítéséhez'
      type: 'uint'
      units: 'km'
    MEMORISING_OF_FAULTS:
