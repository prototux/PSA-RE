ioctl: 0xC5
name: 'VEHICLE_AND_TRAILER_REAR_FOGLAMPS'
display_name:
  en: 'Vehicle and trailer rear foglamps'
  fr: 'Feux de brouillard arrière du véhicule et de la remorque'
  es: 'Luces antiniebla traseras del vehículo y del remolque'
  de: 'Nebelschlussleuchten des Fahrzeugs und des Anhängers'
  pl: 'Tylne światła przeciwmgielne pojazdu i przyczepy'
  hu: 'A jármű és a pótkocsi hátsó ködlámpái'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

  NUMBER_RELATIVE:
    bits: '2.7-2.0'
    type: 'uint'

  DURATION:
    bits: '3.7-3.0'
    type: 'uint'
    factor: 0.5

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Vehicle and trailer rear foglamps'
      fr: 'Feux de brouillard arrière du véhicule et de la remorque'
      es: 'Luces antiniebla traseras del vehículo y del remolque'
      de: 'Nebelschlussleuchten des Fahrzeugs und des Anhängers'
      pl: 'Tylne światła przeciwmgielne pojazdu i przyczepy'
      hu: 'A jármű és a pótkocsi hátsó ködlámpái'
    max_duration_ms: 3000
  - display_name:
      en: 'Vehicle and trailer RH indicators'
      fr: 'Clignotants droits du véhicule et de la remorque'
      es: 'Intermitentes derechos del vehículo y del remolque'
      de: 'Blinkleuchten rechts des Fahrzeugs und des Anhängers'
      pl: 'Prawe kierunkowskazy pojazdu i przyczepy'
      hu: 'A gépjármű és az utánfutó jobboldali irányjelzoi'
    max_duration_ms: 3000
  - display_name:
      en: 'Vehicle and trailer LH indicators'
      fr: 'Clignotants gauches du véhicule et de la remorque'
      es: 'Intermitentes izquierdos del vehículo y del remolque'
      de: 'Blinkleuchten links des Fahrzeugs und des Anhängers'
      pl: 'Lewe kierunkowskazy pojazdu i przyczepy'
      hu: 'A gépjármű és az utánfutó baloldali irányjelzoi'
    max_duration_ms: 3000
  - display_name:
      en: 'Vehicle and trailer rear RH side lamps'
      fr: 'Feux de position arrière droit du véhicule et de la remorque'
      es: 'Luces de posición traseras derechas del vehículo y del remolque'
      de: 'Standlicht hinten rechts des Fahrzeugs und des Anhängers'
      pl: 'Prawe tylne światła pozycyjne pojazdu i przyczepy'
      hu: 'A jármű és az utánfutó jobb hátsó helyzetjelzo lámpája'
    max_duration_ms: 3000
  - display_name:
      en: 'Vehicle and trailer rear LH side lamps'
      fr: 'Feux de position arrière gauche du véhicule et de la remorque'
      es: 'Luces de posición traseras izquierdas del vehículo y del remolque'
      de: 'Standlicht hinten links des Fahrzeugs und des Anhängers'
      pl: 'Lewe tylne światła pozycyjne pojazdu i przyczepy'
      hu: 'A jármű és az utánfutó bal hátsó helyzetjelzo lámpája'
    max_duration_ms: 3000
  - display_name:
      en: 'Reversing lamps'
      fr: 'Feux de recul'
      es: 'Luces de retroceso'
      de: 'Rückfahrlicht'
      pl: 'Światła cofania'
      hu: 'Tolatólámpa'
    max_duration_ms: 3000
  - display_name:
      en: 'Brake lamps'
      fr: 'Feux de stop'
      es: 'Luces de stop'
      de: 'Bremsleuchten'
      pl: 'Światła stopu'
      hu: 'Féklámpák'
    max_duration_ms: 3000
