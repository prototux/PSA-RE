ioctl: 0xD3
name: 'ENGINE_RUNNING_INFORMATION_RELAY'
display_name:
  en: 'Engine running information relay'
  fr: 'Relais information moteur tournant'
  es: 'Relé de información motor en marcha'
  de: 'Relais für Information Motor läuft'
  pl: 'Przekaźnik informujący o pracy silnika'
  hu: 'Járó motor információ reléje'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

  NUMBER_RELATIVE:
    bits: '2.7-2.0'
    type: 'uint'

  DURATION:
    bits: '3.7-3.0'
    type: 'uint'
    factor: 0.5

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Engine running information relay'
      fr: 'Relais information moteur tournant'
      es: 'Relé de información motor en marcha'
      de: 'Relais für Information Motor läuft'
      pl: 'Przekaźnik informujący o pracy silnika'
      hu: 'Járó motor információ reléje'
    max_duration_ms: 3000
  - display_name:
      en: 'Air conditioning relay'
      fr: 'Relais de climatisation'
      es: 'Relé de climatización'
      de: 'Klimaanlagenrelais'
      pl: 'Przekaznik klimatyzacji'
      hu: 'Légkondicionáló relé'
    max_duration_ms: 3000
  - display_name:
      en: 'Load shedding relay'
      fr: 'Relais de délestage'
      es: 'Relé de vaciado'
      de: 'Entlastungsrelais'
      pl: 'Przekaznik odciazania'
      hu: 'Felesleges fogyasztók lekapcsolása relé'
    max_duration_ms: 3000
  - display_name:
      en: 'Positive after ignition information relay'
      fr: 'Relais information plus après contact'
      es: 'Relé de información más después del contacto'
      de: 'Information Zündungsplus (+APC)'
      pl: 'Przekaznik informacji +APC'
      hu: 'Gyújtás után + információs relé'
    max_duration_ms: 3000
