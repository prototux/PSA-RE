node: 'BSC'
model: 'BSC'
display_name:
  en: 'Trunk control module (BSC)'
  fr: 'Boitier de servitude coffre (BSC)'
comment:
  en: 'Some configuration / measure LIDs of this ECU have no fixed layout: the ECU sends its own parameter table. Read it with 35 <root> 00 00 <n> 11 (root B0, C0 or D0, n from 01 until the answer byte 3 is FF): each record starts with the LID low nibble, then the list of the parameter indexes present in that LID, records are separated by FF'
  fr: 'Certains LID de configuration / mesure de ce calculateur n''ont pas de format fixe : le calculateur envoie sa propre table de paramètres. Elle se lit par 35 <racine> 00 00 <n> 11 (racine B0, C0 ou D0, n à partir de 01 jusqu''à ce que l''octet 3 de la réponse soit FF) : chaque enregistrement commence par le quartet bas du LID puis la liste des index de paramètres présents dans ce LID, les enregistrements sont séparés par FF'
protocols: ['KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'KWP-PSA2000'
    request_id: 0x752
    response_id: 0x652
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'
  0xC0:
    en: 'PSA diagnostic session'
    fr: 'Session de diagnostic PSA'

services: [0x10, 0x17, 0x21, 0x27, 0x30, 0x3E]

security_access:
  - level: 0x83

tester_present:
  request: '3E'
  period_ms: 1000

identification:
  request: '21 8C'
  part_number: '8.7-12.0'
  comment:
    en: 'The ECU part number is in data bytes 8 to 12 of the answer to 21 8C (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 8 à 12 de la réponse à 21 8C (DCB), elle donne la variante logicielle'

cars: ['D2', 'X6']

