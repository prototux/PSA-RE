lid: 0xCD
name: 'LID_CD'
comment:
  en: 'The Boot Relay Unit controls the de-icing of the rear screen.'
  fr: 'Le Boîtier de Servitude Coffre commande le dégivrage de la lunette arrière.'
  es: 'La Caja de Servicio Cofre manda el deshelado de la luneta trasera.'
  de: 'Die Schalteinheit Kofferraum steuert das Entfrosten der Heckscheibe.'
  pl: 'Moduł sterujący bagażnika wydaje polecenie odszraniania tylnej szyby.'
  hu: 'A Csomagtér Kiszolgáló Elektronika vezérli a hátsó ablak páramentesítését.'
kind: 'live'
access: 'read'

mapped:
  comment:
    en: 'The position of these values is not fixed: the ECU packs the values it supports in the order given by its own parameter table (index), see the ecu.yml comment. Values of less than 8 bits are packed from the least significant bit of each byte, bigger values start on a byte boundary'
    fr: 'La position de ces valeurs n''est pas fixe : le calculateur range les valeurs qu''il gère dans l''ordre de sa propre table de paramètres (index), voir le commentaire de ecu.yml. Les valeurs de moins de 8 bits sont rangées à partir du bit de poids faible de chaque octet, les plus grandes commencent sur un octet entier'
  params:
    REAR_SCREEN_DE_ICING_CONTROL:
      index: 3
      length: 1
      comment:
        en: 'Rear screen de-icing control'
        fr: 'Commande de dégivrage lunette arrière'
        es: 'Mando de deshelado de luneta trasera'
        de: 'Steuerung Entfrosten der Heckscheibe'
        pl: 'Sterowanie odszraniania tylnej szyby'
        hu: 'A hátsó ablakfűtés vezérlése'
      type: 'bool'
      values:
        0x00:
          en: 'Inactive'
          fr: 'Inactivé'
          es: 'Inactivo'
          de: 'Nicht aktiviert'
          pl: 'Nie uaktywniony'
          hu: 'Hatástalanított'
        0x01:
          en: 'Active'
          fr: 'Active'
          es: 'Activo'
          de: 'Aktiv'
          pl: 'Aktywny(a)(e)'
          hu: 'Aktív'
