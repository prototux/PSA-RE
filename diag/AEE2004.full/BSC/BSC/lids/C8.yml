lid: 0xC8
name: 'LID_C8'
comment:
  en: 'The Boot Relay Unit controls the opening of the vehicle''s boot.'
  fr: 'Le Boîtier de Servitude Coffre commande l''ouverture du coffre du véhicule.'
  es: 'La Caja de Servicio Cofre manda la apertura del cofre del vehículo.'
  de: 'Die Schalteinheit Kofferraum steuert das Öffnen des Kofferraums des Fahrzeugs.'
  pl: 'Moduł sterujący bagażnika wydaje polecenie otwarcia bagażnika pojazdu.'
  hu: 'A Csomagtér Kiszolgáló Elektronika vezérli a jármű csomagterének nyitását.'
kind: 'live'
access: 'read'

mapped:
  comment:
    en: 'The position of these values is not fixed: the ECU packs the values it supports in the order given by its own parameter table (index), see the ecu.yml comment. Values of less than 8 bits are packed from the least significant bit of each byte, bigger values start on a byte boundary'
    fr: 'La position de ces valeurs n''est pas fixe : le calculateur range les valeurs qu''il gère dans l''ordre de sa propre table de paramètres (index), voir le commentaire de ecu.yml. Les valeurs de moins de 8 bits sont rangées à partir du bit de poids faible de chaque octet, les plus grandes commencent sur un octet entier'
  params:
    BOOT_OPENING_COMMAND:
      index: 8
      length: 1
      comment:
        en: 'Boot opening command'
        fr: 'Commande d''ouverture du coffre'
        es: 'Mando de apertura del maletero'
        de: 'Öffnungssteuerung Gepäckraumdeckel'
        pl: 'Sterowanie otwarciem bagażnika'
        hu: 'Csomagtartó nyitásának vezérlése'
      type: 'bool'
      values:
        0x00:
          en: 'Inactive'
          fr: 'Inactivé'
          es: 'Inactivo'
          de: 'Nicht aktiviert'
          pl: 'Nie uaktywniony'
          hu: 'Hatástalanított'
        0x01:
          en: 'Active'
          fr: 'Active'
          es: 'Activo'
          de: 'Aktiv'
          pl: 'Aktywny(a)(e)'
          hu: 'Aktív'
