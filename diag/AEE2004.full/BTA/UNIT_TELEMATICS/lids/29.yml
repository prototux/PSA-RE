lid: 0x29
name: 'SUPPLY_MODE'
display_name:
  en: 'Supply mode'
  fr: 'Mode d''alimentation'
  es: 'Modo de alimentación'
  de: 'Stromversorgungsmodus'
  pl: 'Tryb zasilania'
  hu: 'Tápellátómodul'
comment:
  en: 'The park mode (energy economy) can be activated on prolonged parking of the vehicle to preserve the battery charge. when the diagnostic tool sends the BSI the request to change to park mode, the BSI commands the switching of the telematics ECU to park mode via the CAN. The "ECU in park mode" status is stored in the ECU memory and disconnecting the battery or starting the engine does not switch the ECUs back to customer mode. the park mode can only be activated and deactivated using the diagnostic equipment. it is only possible to switch to customer mode using the diagnostic equipment. when the diagnostic tool sends the BSI the request to change to customer mode, the BSI commands the switching of the telematics ECU to customer mode via the CAN. when the vehicle is supplied to the customer, the telematics must be in customer mode.'
  fr: 'Le mode park (économie d''énergie) peut être activé lors du stationnement prolongé du véhicule pour économiser la batterie. lorsque l''outil de diagnostic envoie au BSI la requête de passage en mode park, le BSI commande via le réseau CAN le passage du calculateur télématique en mode park. L''état "calculateur en mode park" est mémorisé dans la mémoire des calculateurs et un débranchement de la batterie ou un démarrage du moteur ne permettent pas de repasser les calculateurs en mode client. le mode park ne peut être activé et désactivé qu''avec l''outil de diagnostic. il n''est possible de passer en mode client qu''avec l''outil de diagnostic. lorsque l''outil de diagnostic envoie au BSI la requête de passage en mode client, le BSI commande via le réseau CAN le passage du calculateur télématique en mode client. lorsque le véhicule est livré au client, la télématique doit être en mode client.'
  es: 'El modo park (economía de energía) puede ser activado durante el estacionamiento prolongado del vehículo para economizar la batería. Cuando el útil de diagnosis envía a la BSI la solicitud de paso al modo park, la BSI gestiona a través de la red CAN el paso del calculador telemático al modo park. El estado del "calculador en modo park" se memoriza en los calculadores y una desconexión de la batería o un arranque motor no permite volver a pasar los calculadores a modo cliente. el modo park solamente se puede activar y desactivar con el útil de diagnosis. solamente es posible pasar a modo cliente con el útil de diagnosis. Cuando el útil de diagnosis envía a la BSI la solicitud de paso al modo cliente, la BSI gestiona a través de la red CAN el paso del calculador telemático al modo cliente. Cuando se entrega el vehículo al cliente, la telemática debe estar en modo cliente.'
  de: 'Der Park-Modus (Energiesparmodus) kann für längere Standzeit des Fahrzeugs aktiviert werden, um die Batterie zu schonen. wenn die Diagnosestation an die BSI die Anfrage zum Wechsel in den Modus "Auslieferungslager" sendet, veranlasst die BSI, über das CAN-Netz, den Wechsel des Telematik-Steuergeräts in den Modus "Auslieferungslager". Der Zustand "Steuergerät im Modus Park" ist im Speicher der Steuergeräte gespeichert und das Batterieausschalten oder das Wiedereinschalten des Motors ermöglichen keinen Wechsel der Steuergeräte in den Modus Kunde. der Parkmodus kann nur mit dem Diagnosewerkzeug aktiviert und deaktiviert werden. die Schaltung in den Kundenmodus ist nur mit dem Diagnosewerkzeug möglich. wenn die Diagnosestation an die BSI die Anfrage zum Wechsel in den Modus "Kunde" sendet, veranlasst die BSI, über das CAN-Netz, den Wechsel des Telematik-Steuergeräts in den Modus "Kunde". wenn das Fahrzeug an den Kunden übergeben wird, muss sich die Telematik im Modus "Kunde" befinden.'
  pl: 'Tryb park (oszczędzanie energii) można włączyć w przypadku dłuższego postoju pojazdu dla zaoszczędzenia akumulatora. gdy narzędzie diagnostyczne przesyła do BSI wezwanie do przejścia w tryb park, BSI steruje poprzez sieć CAN przejście kalkulatora telematyki w tryb park. Stan "kalkulator w trybie." jest zapisywany w pamieci kalkulatorów i odlaczenie akumulatora albo uruchomienie silnika nie pozwala na przejscie kalkulatorów w tryb klienta. tryb park można włączyć i wyłączyć jedynie za pomocą przyrządu diagnostycznego. przejście do trybu klienta możliwe jest jedynie przy użyciu przyrządu diagnostycznego. gdy narzędzie diagnostyczne przesyła do BSI wezwanie do przejścia w tryb klienta, BSI steruje poprzez sieć CAN przejście kalkulatora telematyki w tryb klienta. gdy samochód jest wydawany klientowi, telematyka powinna być w trybie klienta.'
  hu: 'A parkolási üzemmód (energiatakarékos) aktiválódhat a gépjármű hosszantartó parkolása során az akkumulátor lemerülésének elkerülése érdekében. amikor a diagnosztikai készülék elküldi a BSI-hez a parkolási üzemmódba kapcsolási kérést, a BSI a CAN hálózaton keresztül vezérli a telematikai számítógép parkolási üzemmódba történő áttérését. A " számítóegység park üzemmódban " állapot a számítógépek memóriájában kerül rögzítésre és az akkumulátor lecsatlakoztatása vagy a mptpr indítása nem teszi lehetové a számítóegységek kliens üzemmódba való visszaváltását. a parkolási üzemmód csak a diagnosztikai készülék segítségével aktiválható és semlegesíthető. nem lehetséges az ügyfél üzemmódba történő áttérés csupán a diagnosztikai készülék segítségével. amikor a diagnosztikai készülék elküldi a BSI-hez az ügyfél üzemmódba kapcsolási kérést, a BSI a CAN hálózaton keresztül vezérli a telematikai számítógép ügyfél üzemmódba történő áttérését. amikor a gépjármű leszállításra kerül az ügyfélnek a telematikus egységnek ügyfél üzemmódban kell lennie.'
kind: 'live'
