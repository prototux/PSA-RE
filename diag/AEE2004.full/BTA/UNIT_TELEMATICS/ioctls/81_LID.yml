ioctl: 0x81
name: 'ACTIVATION_ILLUMINATION_EMERGENCY_CALL_BUTTON'
display_name:
  en: 'Activation Illumination of the emergency call button'
  fr: 'Activation allumage du voyant d''appel d''urgence'
  es: 'Activación Encendido del testigo de llamada de urgencia'
  de: 'Aktivierung Einschalten der Kontrollleuchte Notruf'
  pl: 'Włączenie Zapalenie kontrolki wezwania pomocy w nagłych wypadkach'
  hu: 'Bekapcsolás A segélykéro hívás jelzolámpa működésbe lépése'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants: ['RT3_*', 'RT4_*', 'RT5_*']

params:
  CONTROL_PARAMETER_1:
    bits: '1.7-1.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Activation Illumination of the emergency call button'
      fr: 'Activation allumage du voyant d''appel d''urgence'
      es: 'Activación Encendido del testigo de llamada de urgencia'
      de: 'Aktivierung Einschalten der Kontrollleuchte Notruf'
      pl: 'Włączenie Zapalenie kontrolki wezwania pomocy w nagłych wypadkach'
      hu: 'Bekapcsolás A segélykéro hívás jelzolámpa működésbe lépése'
    max_duration_ms: 4000
