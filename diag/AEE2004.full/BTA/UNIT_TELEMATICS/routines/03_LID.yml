routine: 0x03
name: 'TEST_MICROPHONE'
display_name:
  en: 'Test of the microphone'
  fr: 'Test du microphone'
  es: 'Test del micrófono'
  de: 'Test des Mikrophons'
  pl: 'Test mikrofonu'
  hu: 'Mikrofon teszt'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
variants: ['X250_*']
control: ['start', 'stop', 'results']

results:
  TEST_MICROPHONE:
    bits: '1.7-1.0'
    comment:
      en: 'Test of the microphone'
      fr: 'Test du microphone'
      es: 'Test del micrófono'
      de: 'Test des Mikrophons'
      pl: 'Test mikrofonu'
      hu: 'Mikrofon teszt'
    type: 'enum'
    values:
      0x00:
        en: 'No fault detected'
        fr: 'Aucune anomalie détectée'
        es: 'Ninguna anomalía detectada'
        de: 'Keine Anomalie entdeckt'
        pl: 'Nie wykryto żadnej anomalii'
        hu: 'Semmilyen rendellenesség nem észlelhető'
      0x88:
        en: 'The microphone has not received a signal : -if no bleep is heard, check the lines between the audio system and the telematic unit ECU -in the presence of a beep, check the microphone'
        fr: 'Le microphone n''a pas reçu de signal : -sans présence de bip, contrôler les lignes entre l''autoradio et le calculateur boîtier télématique -en présence de bip, contrôler le microphone'
        es: 'El micrófono no ha recibido ninguna señal : -sin presencia de bip, controlar las líneas entre el autorradio y el calculador de caja telemática -Si aparecen los bips, controlar el micrófono'
        de: 'Das Mikrofon hat kein Signal empfangen : -wenn keine Signaltöne vorhanden sind, die Leitungen zwischen dem Autoradio und dem Telematik-Steuergerät kontrollieren -Wenn ein Signalton vorhanden ist, das Mikrofon überprüfen'
        pl: 'Mikrofon nie odebrał sygnału : -bez obecności sygnału BIP, sprawdzić linie pomiędzy radiem i kalkulatorem modułu telematyki -w obecności krótkich sygnałów dźwiękowych (bipów), sprawdzić mikrofon'
        hu: 'A mikrofon nem kapott jelet : -hangjelzés jelenléte nélkül, ellenőrizze az autórádió és a telematikus egység computere közötti vezetékeket -sípolás esetén ellenőrizze a mikrofont'

tests:
  - display_name:
      en: 'Test of the microphone'
      fr: 'Test du microphone'
      es: 'Test del micrófono'
      de: 'Test des Mikrophons'
      pl: 'Test mikrofonu'
      hu: 'Mikrofon teszt'
    max_duration_ms: 10000
