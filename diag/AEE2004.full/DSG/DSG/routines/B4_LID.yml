routine: 0xB4
name: 'ROUTINE_B4'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  INPUT_PARAM_1:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x00

  ROUTINE_COMMAND_CONTROLE_VALVE:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x01

results:
  STATIN2:
    bits: '1.7-1.0'
    type: 'uint'
