lid: 0xBA
name: 'STATUS_TYRE_UNDER_INFLATION_DETECTION_SYSTEM'
display_name:
  en: 'Status of the tyre under-inflation detection system'
  fr: 'Etat de la fonction de détection de sous-gonflage'
  es: 'Estado de la función de detección de sub -inflado'
  de: 'Zustand der Funktion Reifendrucküberwachung'
  pl: 'Stan funkcji wykrywania zbyt niskiego ciśnienia w ogumieniu'
  hu: 'Az elégtelen gumiabroncsnyomás észlelése funkció állapota'
comment:
  en: 'For complete deactivation of the function, both ''under-inflation detection'' configuration parameters of the BSI and of the instrument panel must be at ''ABSENT'' (risk of the fault being sent to the BSI and instrument panel). For complete activation of the function, both ''under-inflation detection'' configuration parameters of the BSI and of the instrument panel must be at ''PRESENT'''
  fr: '- Pour une désactivation complète de la fonction, les deux paramètres de télécodage du BSI et du combiné "Détection sous gonflage" doivent être à "ABSENT" (Risque de remonté de défaut dans le BSI et au combiné). - Pour une activation complète de la fonction, les deux paramètres de télécodage du BSI et du combiné "Détection sous gonflage" doivent être à "PRESENT'
  es: '- Para una desactivación completa de la función, los dos parámetros de telecodificado de la BSI y del combinado "Detección sub inflado" deben estar en "AUSENTE" (Riesgo de subida de defecto a la BSI y al combinado). - Para una activación completa de la función, los dos parámetros de telecodificado de la BSI y del combinado "Detección sub inflado" deben estar en "PRESENTE'
  de: '- für vollständige Deaktivierung der Funktion, müssen die beiden Codierungsparameter der Zentralschalteinheit BSI und des Kombiinstruments "Reifendrucküberwachung" auf "NICHT VORHANDEN" sein (Gefahr von Fehlermeldung in BSI und Kombiinstrument). - für vollständige Aktivierung der Funktion, müssen die beiden Codierungsparameter der Zentralschalteinheit BSI und des Kombiinstruments "Reifendrucküberwachung" auf "VORHANDEN" sein'
  pl: 'Aby umożliwić całkowitą dezaktywację funkcji, obydwa parametry telekodowania BSI i zestawu wskaźników Wykrycie zbyt niskiego ciśnienia w ogumieniu powinny być w stanie BRAK (ryzyko wykrycia błędu przez BSI i w zestawie wskaźników). Aby umożliwić całkowitą aktywację funkcji, obydwa parametry telekodowania BSI i zestawu wskaźników "Wykrycie zbyt niskiego ciśnienia w ogumieniu" powinny być w stanie "OBECNY'
  hu: 'A funkció teljes semlegesítése érdekében, az intelligens kiszolgálóegységben (BSI) és a kombinált kijelzőegységben lévő Elégtelen gumiabroncsnyomás észlelése távkódolási paraméternek HIÁNYZIK-nak kell lennie (Hiba továbbításának veszélye az intelligens k. A funkció teljes semlegesítése érdekében, az intelligens kiszolgálóegységben (BSI) és a kombinált kijelzőegységben lévő Elégtelen gumiabroncsnyomás észlelése távkódolási paraméternek JELEN VAN-nak kell lennie'
kind: 'live'
access: 'read'
length: 1

