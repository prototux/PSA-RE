node: 'DSG'
model: 'DSG'
display_name:
  en: 'Tyre pressure monitoring (DSG)'
  fr: 'Detection de sous-gonflage (DSG)'
protocols: ['KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'KWP-PSA2000'
    request_id: 0x6AF
    response_id: 0x68F
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'KWP-PSA2000'
    request_id: 0x6AF
    response_id: 0x68F

resets:
  0xB0:
    en: 'Reset 0xB0'
    fr: 'Réinitialisation 0xB0'

services: [0x11, 0x14, 0x17, 0x21, 0x27, 0x31, 0x32, 0x34, 0x3E, 0x81, 0x82]

security_access:
  - level: 0x83

tester_present:
  request: '3E'
  period_ms: 1000

identification:
  request: '21 80'
  part_number: '8.7-12.0'
  comment:
    en: 'The ECU part number is in data bytes 8 to 12 of the answer to 21 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 8 à 12 de la réponse à 21 80 (DCB), elle donne la variante logicielle'

cars: ['A7', 'B5', 'B7', 'B8', 'B9', 'D2', 'G9', 'T6', 'T7', 'T8', 'VCAN', 'W2', 'X6', 'X7', 'Z9']

