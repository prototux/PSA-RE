ioctl: 0x81
name: 'LEFT_HAND_DIRECTION_INDICATOR_WARNING_LAMP'
display_name:
  en: 'Left-hand direction indicator warning lamp'
  fr: 'Témoin de clignotant gauche'
  es: 'Testigo de intermitente izquierdo'
  de: 'Kontrollleuchte Blinker links'
  pl: 'Kontrolka lewego kierunkowskazu'
  hu: 'Bal oldali villogó visszajelzés'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER_1:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x00

  CONTROL_PARAMETER_LEDS:
    bits: '2.7-2.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'

tests:
  - display_name:
      en: 'Left-hand direction indicator warning lamp'
      fr: 'Témoin de clignotant gauche'
