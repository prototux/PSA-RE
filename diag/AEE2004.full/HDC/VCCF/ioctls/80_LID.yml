ioctl: 0x80
name: 'WARNING_SOUND'
display_name:
  en: 'Warning sound'
  fr: 'Son d''alerte'
  es: 'Sonido de alerta'
  de: 'Warnton'
  pl: 'Dźwięk alarmu'
  hu: 'Figyelmeztető hangjelzés'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER_1:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x00

  CONTROL_PARAMETER_SOUND_SON:
    bits: '2.7-3.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'

tests:
  - display_name:
      en: 'Warning sound'
      fr: 'Son d''alerte'
      es: 'Sonido de alerta'
      de: 'Warnton'
      pl: 'Dźwięk alarmu'
      hu: 'Figyelmeztető hangjelzés'
    max_duration_ms: 8000
  - display_name:
      en: 'Pre-alert sound'
      fr: 'Son de pré-alerte'
      es: 'Sonido de pre-alerta'
      de: 'Vorwarnton'
      pl: 'Dźwięk wstępnego alarmu'
      hu: 'Előfigyelmeztető hangjelzés'
    max_duration_ms: 8000
  - display_name:
      en: 'Warning confirmation sound'
      fr: 'Son de confirmation d''alerte'
      es: 'Sonido de confirmación de alerta'
      de: 'Ton zur Bestätigung der Warnung'
      pl: 'Dźwięk potwierdzenia alarmu'
      hu: 'Riasztás megerosíto hangjelzés'
    max_duration_ms: 8000
  - display_name:
      en: 'Lamps left on sound'
      fr: 'Son d''oubli des feux'
      es: 'Sonido de olvido de las luces'
      de: 'Ton bei nicht ausgeschalteter Beleuchtung'
      pl: 'Dźwięk pozostawienia świateł'
      hu: 'A bekapcsolva felejtett lámpák hangjelzése'
    max_duration_ms: 8000
  - display_name:
      en: 'Ignition key reminder sound'
      fr: 'Son d''oubli clé de contact'
      es: 'Sonido de olvido de llave de contacto'
      de: 'Ton Zündschlüssel nicht abgezogen'
      pl: 'Dźwięk pozostawienia kluczyka zapłonu'
      hu: 'Bennfelejtett gyújtáskulcsra figyelmezteto hangjelzés'
    max_duration_ms: 8000
  - display_name:
      en: 'Direction indicators sound'
      fr: 'Son des clignotants'
      es: 'Sonido de los intermitentes'
      de: 'Ton der Blinker'
      pl: 'Dźwięk migaczy kierunkowskazów'
      hu: 'Irányjelzők hangjelzése'
    max_duration_ms: 8000
  - display_name:
      en: 'Obstacle detection sound'
      fr: 'Son de détection d''obstacle'
      es: 'Sonido de detección de obstáculos'
      de: 'Ton bei Erkennung eines Hindernisses'
      pl: 'Dźwięk detekcji przeszkody'
      hu: 'Akadályérzékelési hang'
    max_duration_ms: 8000
  - display_name:
      en: 'Continuous sound for detection of an obstacle'
      fr: 'Son continu de détection d''obstacle'
      es: 'Sonido de detección de obstáculo continuo'
      de: 'Durchgehender Ton der Hinderniserkennung'
      pl: 'Ciągły dzwięk wykrycia przeszkody'
      hu: 'Akadályészlelés folyamatos hangjelzése'
    max_duration_ms: 8000
