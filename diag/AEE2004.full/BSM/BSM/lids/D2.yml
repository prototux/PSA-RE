lid: 0xD2
name: 'LID_D2'
display_name:
  en: 'Data record 0xD2 (24 values)'
  fr: 'Enregistrement 0xD2 (24 valeurs)'
kind: 'other'
access: 'read'

mapped:
  comment:
    en: 'The position of these values is not fixed: the ECU packs the values it supports in the order given by its own parameter table (index), see the ecu.yml comment. Values of less than 8 bits are packed from the least significant bit of each byte, bigger values start on a byte boundary'
    fr: 'La position de ces valeurs n''est pas fixe : le calculateur range les valeurs qu''il gère dans l''ordre de sa propre table de paramètres (index), voir le commentaire de ecu.yml. Les valeurs de moins de 8 bits sont rangées à partir du bit de poids faible de chaque octet, les plus grandes commencent sur un octet entier'
  params:
    POSITION_IGNITION_KEY:
      index: 0
      length: 8
      comment:
        en: 'Position of the ignition key'
        fr: 'Position de la clé de contact'
        es: 'Posición de la llave de contacto'
        de: 'Stellung des Fahrtschlüssels'
        pl: 'Położenie kluczyka stacyjki'
        hu: 'A gyújtáskulcs helyzete'
      type: 'enum'
      values:
        0x00:
          en: 'Unknown'
          fr: 'Indéterminée'
          es: 'Indeterminada'
          de: 'Unbestimmt'
          pl: 'Nieokreślona'
          hu: 'Meghatározatlan'
        0x01:
          en: 'Key in starter positive position (+DEM)'
          fr: 'Clé en position + démarreur (+DEM)'
          es: 'Llave en posición + arranque (+AR)'
          de: 'Schlüssel in Stellung + Anlasser (+ DEM)'
          pl: 'Klucz w położeniu + rozrusznika (+DEM)'
          hu: 'Kulcs indítómotor + (+DEM) helyzetben'
    AUTO_SENSODRIVE_GEARBOX_LEVER_POSITION_SEEN:
      index: 1
      length: 8
      comment:
        en: 'Auto / Sensodrive gearbox lever position seen by engine relay unit (BSM)'
        fr: 'Position du Levier BVA / BVMP vu par le BSM'
        es: 'Posición de la Palanca BVA / BVMP vista por la BSM'
        de: 'Von der BSM erkannte Position des Wählhebels Automatikgetriebe / Automat. Schaltgetriebe'
        pl: 'Położenie dźwigni BVA / BVMP widziane przez BSM'
        hu: 'A motor kiszolgáló elektronika (BSM) által látott automata /vezérelt kézi sebességváltó választókar helyzete'
      type: 'enum'
      values:
        0x00:
          en: 'Unknown'
          fr: 'Indéterminé'
          es: 'Indeterminado'
          de: 'Unbestimmt'
          pl: 'Nieokreslony'
          hu: 'Meghatározatlan'
        0x01:
          en: 'Level in parking or neutral position'
          fr: 'Levier en position parking ou neutre'
          es: 'Palanca en posición de estacionamiento o neutra'
          de: 'Hebel in Park- oder Neutralstellung'
          pl: 'Dźwignia w położeniu parking lub neutralnym'
          hu: 'Parkoló vagy semleges pozícióban lévo választókar'
