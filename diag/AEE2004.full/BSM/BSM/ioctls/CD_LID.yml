ioctl: 0xCD
name: 'WINDSCREEN_WIPER_COMMAND_LIN_NETWORK_CONTINUOUS'
display_name:
  en: 'Windscreen wiper command (By LIN network) : continuous operation'
  fr: 'Commande d''essuyage du pare-brise (Par réseau LIN) : fonctionnement continu'
  es: 'Mando de limpieza limpiaparabrisas (Por red LIN) : funcionamiento continuo'
  de: 'Steuerung Wischen Frontscheibe (über Bus LIN) : Dauerbetrieb'
  pl: 'Polecenie włączenia wycieraczki przedniej szyby (Przez sieć LIN) : praca ciągła'
  hu: 'Szélvédő-törlés vezérlés (A LIN hálózaton keresztül) : folyamatos működés'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

  NUMBER_RELATIVE:
    bits: '2.7-2.0'
    type: 'uint'

  DURATION:
    bits: '3.7-3.0'
    type: 'uint'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Windscreen wiper command (By LIN network) : continuous operation'
      fr: 'Commande d''essuyage du pare-brise (Par réseau LIN) : fonctionnement continu'
      es: 'Mando de limpieza limpiaparabrisas (Por red LIN) : funcionamiento continuo'
      de: 'Steuerung Wischen Frontscheibe (über Bus LIN) : Dauerbetrieb'
      pl: 'Polecenie włączenia wycieraczki przedniej szyby (Przez sieć LIN) : praca ciągła'
      hu: 'Szélvédő-törlés vezérlés (A LIN hálózaton keresztül) : folyamatos működés'
    max_duration_ms: 3000
  - display_name:
      en: 'Rear screen wash'
      fr: 'Lavage lunette arrière'
      es: 'Lavaluneta trasero'
      de: 'Waschen der Heckscheibe'
      pl: 'Spryskiwanie tylnej szyby'
      hu: 'Hátsó ablak mosás'
    max_duration_ms: 3000
  - display_name:
      en: 'Windscreen wash'
      fr: 'Lavage pare-brise'
      es: 'Lavado parabrisas'
      de: 'Waschanlage Windschutzscheibe'
      pl: 'Zmywanie przedniej szyby'
      hu: 'Szélvédő mosás'
    max_duration_ms: 3000
  - display_name:
      en: 'Control of headlamp wash or of engine running output'
      fr: 'Commande de lavage des projecteurs ou de la sortie moteur tournant'
      es: 'Mando de lavado de los faros o de la salida motor en funcionamiento'
      de: 'Ansteuerung des Scheinwerferwaschens oder des Ausgangs laufender Motor'
      pl: 'Sterowanie spryskiwaczy reflektorów lub wyjścia pracującego silnika'
      hu: 'Mosásvezérlés a fényszóróktól vagy a járó motor kimenettől'
    max_duration_ms: 3000
  - display_name:
      en: 'Slow speed windscreen wipers'
      fr: 'Essuyage pare brise petite vitesse'
      es: 'Limpiaparabrisas velocidad mínima'
      de: 'Wischen Frontscheibe kleine Geschwindigkeit'
      pl: 'Wycieranie przedniej szyby z małą prędkością'
      hu: 'Alacsony sebességű szélvédőtörlés'
    max_duration_ms: 9000
  - display_name:
      en: 'Fast speed windscreen wipers'
      fr: 'Essuyage pare-brise grande vitesse'
      es: 'Limpiaparabrisas velocidad máxima'
      de: 'Wischen der Frontscheibe mit großer Geschwindigkeit'
      pl: 'Wycieranie przedniej szyby z dużą prędkością'
      hu: 'Nagy sebességű ablaktörlés'
    max_duration_ms: 9000
  - display_name:
      en: 'Water pump control for exhaust gas heat recovery for heating the passenger compartment (1)'
      fr: 'Commande de la pompe à eau pour la récupération de la chaleur des gaz d''échappement pour chauffage de l''habitacle (1)'
      es: 'Mando de la bomba de agua para la recuperación del calor de los gases de escape para calentamiento del habitáculo (1)'
      de: 'Ansteuerung der Kühlmittelpumpe für die Rückgewinnung der Abgaswärme zum Beheizen des Innenraums (1)'
      pl: 'Sterowanie pompy wody dla odzysku ciepla spalin w celu ogrzewania kabiny (1)'
      hu: 'Az utastér fűtéséhez (1) a kipuffogó gáz homennyiségét visszakeringteto vízpumpa vezérlése'
    max_duration_ms: 9000
  - display_name:
      en: 'Windscreen washing control'
      fr: 'Commande de lavage du pare-brise'
      es: 'Mando de lavado del parabrisas'
      de: 'Steuerung Waschen der Frontscheibe'
      pl: 'Sterowanie spryskiwaczem przedniej szyby'
      hu: 'Szélvédőmosás vezérlés'
    max_duration_ms: 3000
