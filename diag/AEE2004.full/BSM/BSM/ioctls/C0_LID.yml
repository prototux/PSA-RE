ioctl: 0xC0
name: 'WATER_PUMP_CONTROL_EXHAUST_GAS_HEAT_RECOVERY'
display_name:
  en: 'Water pump control for exhaust gas heat recovery for heating the passenger compartment (1)'
  fr: 'Commande de la pompe à eau pour la récupération de la chaleur des gaz d''échappement pour chauffage de l''habitacle (1)'
  es: 'Mando de la bomba de agua para la recuperación del calor de los gases de escape para calentamiento del habitáculo (1)'
  de: 'Ansteuerung der Kühlmittelpumpe für die Rückgewinnung der Abgaswärme zum Beheizen des Innenraums (1)'
  pl: 'Sterowanie pompy wody dla odzysku ciepla spalin w celu ogrzewania kabiny (1)'
  hu: 'Az utastér fűtéséhez (1) a kipuffogó gáz homennyiségét visszakeringteto vízpumpa vezérlése'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

  NUMBER_RELATIVE:
    bits: '2.7-2.0'
    type: 'uint'

  DURATION:
    bits: '3.7-3.0'
    type: 'uint'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Water pump control for exhaust gas heat recovery for heating the passenger compartment (1)'
      fr: 'Commande de la pompe à eau pour la récupération de la chaleur des gaz d''échappement pour chauffage de l''habitacle (1)'
      es: 'Mando de la bomba de agua para la recuperación del calor de los gases de escape para calentamiento del habitáculo (1)'
      de: 'Ansteuerung der Kühlmittelpumpe für die Rückgewinnung der Abgaswärme zum Beheizen des Innenraums (1)'
      pl: 'Sterowanie pompy wody dla odzysku ciepla spalin w celu ogrzewania kabiny (1)'
      hu: 'Az utastér fűtéséhez (1) a kipuffogó gáz homennyiségét visszakeringteto vízpumpa vezérlése'
    max_duration_ms: 9000
  - display_name:
      en: 'Heat exchanger water pump command'
      fr: 'Commande de la pompe à eau aérotherme'
      es: 'Mando bomba de agua aerotermo'
      de: 'Steuerung Wasserpumpe Heizgerät'
      pl: 'Sterowanie pompą płynu nagrzewnicy'
      hu: 'Fűtőradiátor vízszivattyú vezérlése'
    max_duration_ms: 15000
  - display_name:
      en: 'Stopping of the heater matrix pump'
      fr: 'Arrêt de la pompe aérotherme'
      es: 'Interrupción de la bomba aerotermo'
      de: 'Anhalten der Pumpe Heizungswärmetauscher'
      pl: 'Zatrzymanie pompy nagrzewnicy powietrza'
      hu: 'A fűtőradiátor szivattyújának leállítása'
    max_duration_ms: 15000
