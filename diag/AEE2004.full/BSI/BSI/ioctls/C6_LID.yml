ioctl: 0xC6
name: 'ACTIVATION_ANTI_LIFT_FUNCTION'
display_name:
  en: 'Activation of the anti-lift function'
  fr: 'Activation de la fonction antisoulèvement'
  es: 'Activación de la función antilevantamiento'
  de: 'Aktivierung der Funktion Anhebeschutz'
  pl: 'Wlaczenie funkcji przeciwko podniesieniu'
  hu: 'A felemelés gátló funkció aktíválása'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants:
  - 'A7_*'
  - 'A51_*'
  - 'A55_*'
  - 'A58_*'
  - 'B5_*'
  - 'B9_*'
  - 'D2_*'
  - 'G9_*'
  - 'LA_*'
  - 'M69_*'
  - 'T6_*'
  - 'T7_*'
  - 'T84_V1'
  - 'VCAN_*'
  - 'X6_*'
  - 'X7_*'
  - 'Z9_*'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

  NUMBER_RELATIVE:
    bits: '2.7-2.0'
    type: 'uint'

  DURATION:
    bits: '3.7-3.0'
    type: 'uint'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Activation of the anti-lift function'
      fr: 'Activation de la fonction antisoulèvement'
      es: 'Activación de la función antilevantamiento'
      de: 'Aktivierung der Funktion Anhebeschutz'
      pl: 'Wlaczenie funkcji przeciwko podniesieniu'
      hu: 'A felemelés gátló funkció aktíválása'
    max_duration_ms: 3000
  - display_name:
      en: 'Deactivation of the anti-lift function'
