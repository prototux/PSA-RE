ioctl: 0xC8
name: 'LOCKS_LOCKING_CONTROL'
display_name:
  en: 'Locks locking control'
  fr: 'Commande de verrouillage des serrures'
  es: 'Mando de bloqueo de las cerraduras'
  de: 'Steuerung Verriegelung der Schlösser'
  pl: 'Sterowanie ryglowaniem zamków'
  hu: 'Zárszerkezetek reteszelésének vezérlése'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x00

  IOCBLID_LID_C8_ROUTINE_BYTE_4:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x07

  IOCBLID_LID_C8_ROUTINE_BYTE_5:
    bits: '3.7-3.0'
    type: 'enum'
    default: 0x04

  IOCBLID_LID_C8_ROUTINE_BYTE_6:
    bits: '4.7-4.0'
    type: 'enum'
    default: 0x01

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Locks locking control'
      fr: 'Commande de verrouillage des serrures'
      es: 'Mando de bloqueo de las cerraduras'
      de: 'Steuerung Verriegelung der Schlösser'
      pl: 'Sterowanie ryglowaniem zamków'
      hu: 'Zárszerkezetek reteszelésének vezérlése'
    max_duration_ms: 500
  - display_name:
      en: 'Driver''s door or load area locking control'
      fr: 'Commande de verrouillage de la porte conducteur ou de la zone de charge'
      es: 'Mando de bloqueo de la puerta conductor o de la zona de carga'
      de: 'Verriegelungssteuerung der Fahrertür oder des Laderaums'
      pl: 'Sterowanie ryglowaniem drzwi kierowcy lub przedziału towarowego'
      hu: 'A vezetőajtó vagy a rakodótér reteszelésének vezérlése'
