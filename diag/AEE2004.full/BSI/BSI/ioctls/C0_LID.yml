ioctl: 0xC0
name: 'ELECTRIC_WINDOW_AND_SUNROOF_SWITCHES_SUPPLY'
display_name:
  en: 'Electric window and sunroof switches supply'
  fr: 'Alimentation des interrupteurs de lève-vitre et du toit ouvrant'
  es: 'Alimentación de los interruptores de elevalunas y del techo corredizo'
  de: 'Stromversorgung der Scheibenheberschalter und des Schiebedachs'
  pl: 'Zasilanie wyłączników podnośnika szyby i otwieranego dachu'
  hu: 'Ablakemelő és tolótető kapcsolók tápellátása'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

  NUMBER_RELATIVE:
    bits: '2.7-2.0'
    type: 'uint'

  DURATION:
    bits: '3.7-3.0'
    type: 'uint'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Electric window and sunroof switches supply'
      fr: 'Alimentation des interrupteurs de lève-vitre et du toit ouvrant'
      es: 'Alimentación de los interruptores de elevalunas y del techo corredizo'
      de: 'Stromversorgung der Scheibenheberschalter und des Schiebedachs'
      pl: 'Zasilanie wyłączników podnośnika szyby i otwieranego dachu'
      hu: 'Ablakemelő és tolótető kapcsolók tápellátása'
    max_duration_ms: 15000
  - display_name:
      en: 'Engine running output (heated seats)'
      fr: 'Commande de la sortie moteur tournant (autorisation sièges chauffants)'
      es: 'Mando de salida motor funcionando (autorización asientos térmicos)'
      de: 'Steuerung Ausgang laufender Motor (Freigabe Sitzbeheizung)'
      pl: 'Sterowanie wyjściem pracującego silnika (zezwolenie na ogrzewanie foteli)'
