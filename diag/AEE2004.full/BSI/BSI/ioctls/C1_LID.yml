ioctl: 0xC1
name: 'AIR_CONDITIONING_COMPRESSOR_CONTROL'
display_name:
  en: 'Air conditioning compressor control'
  fr: 'Commande du compresseur de climatisation'
  es: 'Mando del compresor de climatización'
  de: 'Ansteuerung Klimaanlagenkompressor'
  pl: 'Sterowanie sprezarki klimatyzacji'
  hu: 'A légkondícionáló kompresszor kapcsolója'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

  NUMBER_RELATIVE:
    bits: '2.7-2.0'
    type: 'uint'

  DURATION:
    bits: '3.7-3.0'
    type: 'uint'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Air conditioning compressor control'
      fr: 'Commande du compresseur de climatisation'
      es: 'Mando del compresor de climatización'
      de: 'Ansteuerung Klimaanlagenkompressor'
      pl: 'Sterowanie sprezarki klimatyzacji'
      hu: 'A légkondícionáló kompresszor kapcsolója'
    max_duration_ms: 1000
  - display_name:
      en: 'PTC additional heating resistor 1 control'
      fr: 'Commande résistance additionnelle CTP 1'
      es: 'Mando de resistencia adicional CTP 1'
      de: 'Steuerung Zusatz-Widerstand PTC 1'
      pl: 'Sterowanie dodatkową rezystancją CTP 1'
      hu: 'PTC 1 kiegészítő ellenállás vezérlése'
    max_duration_ms: 15000
  - display_name:
      en: 'PTC additional heating resistor 2 control'
      fr: 'Commande résistance additionnelle CTP 2'
      es: 'Mando de resistencia adicional CTP 2'
      de: 'Steuerung Zusatz-Widerstand PTC 2'
      pl: 'Sterowanie dodatkową rezystancją CTP 2'
      hu: 'PTC 2 kiegészítő ellenállás vezérlése'
    max_duration_ms: 15000
  - display_name:
      en: 'Additional resistors PTC1 and PTC2 control'
      fr: 'Commande des résistances additionnelles CTP1 et CTP2'
      es: 'Mando de las resistencias adicionales CTP1 y CTP2'
      de: 'Steuerung der Zuheizer-Widerstände PTC1 und PTC2'
