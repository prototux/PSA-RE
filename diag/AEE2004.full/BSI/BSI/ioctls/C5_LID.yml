  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

  NUMBER_RELATIVE:
    bits: '2.7-2.0'
    type: 'uint'

  DURATION:
    bits: '3.7-3.0'
    type: 'uint'

