ioctl: 0xCB
name: 'BATTERY_CHARGE_WARNING_LIGHT_CONTROL'
display_name:
  en: 'Battery charge warning light control'
  fr: 'Commande témoin d''alerte charge batterie'
  es: 'Mando testigo de alerta carga de batería'
  de: 'Steuerung Warnleuchte Batterieladung'
  pl: 'Sterowanie kontrolki alarmowej ładowania akumulatora'
