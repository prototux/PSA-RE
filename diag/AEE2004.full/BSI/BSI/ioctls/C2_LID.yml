ioctl: 0xC2
name: 'MOVING_SPOILER_CONTROL'
display_name:
  en: 'Moving spoiler control'
  fr: 'Commande du déflecteur mobile'
  es: 'Mando del deflector móvil'
  de: 'Betätigung des mobilen Spoilers'
  pl: 'Sterowanie ruchomego spojlera'
  hu: 'Mozgó légterelő vezérlése'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants:
  - 'A7_*'
  - 'A51_*'
  - 'A55_*'
  - 'A58_*'
  - 'B5_*'
  - 'B9_*'
  - 'D2_*'
  - 'G9_*'
  - 'LA_*'
  - 'M69_*'
  - 'T6_*'
  - 'T7_*'
  - 'T84_V1'
  - 'VCAN_*'
  - 'X6_*'
  - 'X7_*'
  - 'Z9_*'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

  NUMBER_RELATIVE:
    bits: '2.7-2.0'
    type: 'uint'

  DURATION:
    bits: '3.7-3.0'
    type: 'uint'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Moving spoiler control'
      fr: 'Commande du déflecteur mobile'
      es: 'Mando del deflector móvil'
      de: 'Betätigung des mobilen Spoilers'
      pl: 'Sterowanie ruchomego spojlera'
      hu: 'Mozgó légterelő vezérlése'
    max_duration_ms: 3000
  - display_name:
      en: 'Control of the Stop and Start button led'
      fr: 'Commande de la led du bouton Stop and Start'
      es: 'Mando de led del botón Stop and Start'
      de: 'Ansteuerung der LED des Schalters "Stop and Start'
      pl: 'Sterowanie diody przycisku "Stop and Start'
      hu: 'A Stop and Start nyomógomb led vezérlése'
    max_duration_ms: 3000
