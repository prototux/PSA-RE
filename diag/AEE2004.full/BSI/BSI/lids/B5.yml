    en: 'The position of these values is not fixed: the ECU packs the values it supports in the order given by its own parameter table (index), see the ecu.yml comment. Values of less than 8 bits are packed from the least significant bit of each byte, bigger values start on a byte boundary'
    fr: 'La position de ces valeurs n''est pas fixe : le calculateur range les valeurs qu''il gère dans l''ordre de sa propre table de paramètres (index), voir le commentaire de ecu.yml. Les valeurs de moins de 8 bits sont rangées à partir du bit de poids faible de chaque octet, les plus grandes commencent sur un octet entier'
  params:
    TAMPERPROOF_MODE:
      index: 9
      length: 1
      comment:
        en: 'Tamperproof mode'
        fr: 'Mode inviolabilité'
        es: 'Modo inviolabilidad'
        de: 'Modus Sicherung'
        pl: 'Tryb zabezpieczający'
        hu: 'Sérthetetlenségi üzemmód'
      type: 'bool'
      values:
        0x00:
          en: 'Inactive'
          fr: 'Inactif'
          es: 'Inactivo'
          de: 'Inaktiv'
          pl: 'Nieaktywny'
          hu: 'Nem muködik'
        0x01:
          en: 'Active'
          fr: 'Actif'
          es: 'Activo'
          de: 'Aktiv'
          pl: 'Aktywny'
          hu: 'Aktív'
    MILEAGE_THRESHOLD_FORCING_CUSTOMER_MODE:
      index: 13
      length: 8
      comment:
        en: 'Mileage threshold for forcing of the customer mode'
        fr: 'Seuil de kilométrage pour le forçage du mode client'
        es: 'Umbral del kilometraje para el forzado del modo cliente'
        de: 'Laufleistungs-Grenzwert für Schaltung des Kundenmodus'
        pl: 'Próg przebiegu dla wymuszenia trybu klienta'
        hu: 'Kilométeróra-állás küszöbérték az ügyfél üzemmód kényszerítéséhez'
      type: 'uint'
