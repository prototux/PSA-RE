mapped:
  comment:
    en: 'The position of these values is not fixed: the ECU packs the values it supports in the order given by its own parameter table (index), see the ecu.yml comment. Values of less than 8 bits are packed from the least significant bit of each byte, bigger values start on a byte boundary'
    fr: 'La position de ces valeurs n''est pas fixe : le calculateur range les valeurs qu''il gère dans l''ordre de sa propre table de paramètres (index), voir le commentaire de ecu.yml. Les valeurs de moins de 8 bits sont rangées à partir du bit de poids faible de chaque octet, les plus grandes commencent sur un octet entier'
  params:
    DURAVMAINT_000:
      index: 0
      length: 8
      type: 'uint'
      units: 'month'
    NUMBER_REVOLUTIONS_BEFORE_SERVICING:
      index: 1
      length: 8
      comment:
        en: 'Number of revolutions before servicing'
        fr: 'Nombre de tours avant maintenance'
        es: 'Número de vueltas antes de mantenimiento'
        de: 'Anzahl Umdrehung vor Wartung'
        pl: 'Liczba obrotów przed czynnościami obsługowymi'
        hu: 'Karbantartás előtti fordulatok száma'
      type: 'uint'
      units: 'Million revolutions'
    DURATION_BEFORE_FIRST_SERVICE:
      index: 14
      length: 8
      comment:
        en: 'Duration before first service'
        fr: 'Durée avant première maintenance'
        es: 'Duración antes del primer mantenimiento'
        de: 'Dauer bis zur ersten Wartung'
        pl: 'Okres poprzedzający pierwszy przegląd'
        hu: 'Első karbantartás előtti időtartam'
      type: 'uint'
      factor: 200
      units: 'km'
    FIRST_MAINTENANCE_THRESHOLD:
      index: 5
      length: 8
      comment:
        en: 'First maintenance threshold'
        fr: 'Seuil de première maintenance'
        es: 'Umbral de primer mantenimiento'
        de: 'Fälligkeit der ersten Wartung'
        pl: 'Próg pierwszej obsługi'
        hu: 'Első karbantartási küszöbérték'
      type: 'uint'
      factor: 100
      units: 'km'
    DURATION_BEFORE_FIRST_SERVICE_2:
      index: 15
      length: 8
      comment:
        en: 'Duration before first service'
        fr: 'Durée avant première maintenance'
        es: 'Duración antes del primer mantenimiento'
        de: 'Dauer bis zur ersten Wartung'
        pl: 'Okres poprzedzający pierwszy przegląd'
        hu: 'Első karbantartás előtti időtartam'
      type: 'uint'
      units: 'month'
    TYPE_OF_SERVICE:
      index: 16
      length: 8
      comment:
        en: 'Type of service'
        fr: 'Type de maintenance'
        es: 'Tipo de mantenimiento'
        de: 'Wartungstyp'
        pl: 'Typ czynności serwisowej'
        hu: 'Karbantartás típusa'
      type: 'enum'
      values:
        0x00:
          en: 'Distance-dependent maintenance'
          fr: 'Maintenance kilométrique'
          es: 'Mantenimiento kilométrico'
          de: 'Wartung auf Kilometerbasis'
          pl: 'Obsluga okresowa wedlug przebiegu'
          hu: 'Kilométer érték karbantartás'
        0x01:
          en: 'Distance-based servicing weighted by time'
          fr: 'Maintenance kilométrique pondérée par le temps'
          es: 'Mantenimiento kilométrico ponderado por el tiempo'
          de: 'Zeitabhängiges Wartungsintervall'
          pl: 'Przegląd według przebiegu kilometrów korygowany w zależności od czasu'
          hu: 'Az eltelt idő alapján szükséges kilométer futás szerinti karbantartás'
