mapped:
  comment:
    en: 'The position of these values is not fixed: the ECU packs the values it supports in the order given by its own parameter table (index), see the ecu.yml comment. Values of less than 8 bits are packed from the least significant bit of each byte, bigger values start on a byte boundary'
    fr: 'La position de ces valeurs n''est pas fixe : le calculateur range les valeurs qu''il gère dans l''ordre de sa propre table de paramètres (index), voir le commentaire de ecu.yml. Les valeurs de moins de 8 bits sont rangées à partir du bit de poids faible de chaque octet, les plus grandes commencent sur un octet entier'
  params:
    CURRENT_CONSUMPTION:
      index: 1
      length: 16
      comment:
        en: 'Current consumption'
        fr: 'Consommation instantanée'
        es: 'Consumo instantáneo'
        de: 'Momentan-Verbrauch'
        pl: 'Chwilowe zużycie paliwa'
        hu: 'Pillanatnyi fogyasztás'
      type: 'uint'
      factor: 0.1
      units: 'L/100 Kms'
    AVERAGE_CONSUMPTION_JOURNEY:
      index: 4
      length: 16
      comment:
        en: 'Average consumption for the journey'
        fr: 'Consommation moyenne du trajet'
        es: 'Consumo medio del trayecto'
        de: 'Durchschnittsverbrauch der Strecke'
        pl: 'Średnie zużycie na trasie'
        hu: 'Útvonal átlagos fogyasztása'
      type: 'uint'
      factor: 0.1
      units: 'L/100 Kms'
    TOTAL_DISTANCE_COVERED:
      index: 8
      length: 32
      comment:
        en: 'Total distance covered'
        fr: 'Kilométrage total'
        es: 'Kilometraje total'
        de: 'Gesamtwegstrecke'
        pl: 'Przebieg całkowity w km'
        hu: 'Megtett összkilométerek száma'
      type: 'uint'
      factor: 0.1
      units: 'km'
    CONSUMPTION_EVENED_OUT:
      index: 9
      length: 16
      comment:
        en: 'Consumption evened out'
        fr: 'Consommation lissée'
        es: 'Consumo alisado'
        de: 'Geglaetteter Verbrauch'
        pl: 'Zużycie przefiltrowane'
        hu: 'Sima fogyasztás'
