lid: 0xCA
name: 'LID_CA'
display_name:
  en: 'Data record 0xCA (10 values)'
  fr: 'Enregistrement 0xCA (10 valeurs)'
kind: 'config'
access: 'read-write'
variants:
  - 'A7_*'
  - 'A51_*'
  - 'A55_*'
  - 'A58_*'
  - 'B5_*'
  - 'B9_*'
  - 'D2_*'
  - 'G9_*'
  - 'LA_*'
  - 'M69_*'
  - 'T6_*'
  - 'T7_*'
  - 'T84_V1'
