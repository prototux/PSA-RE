lid: 0xC3
name: 'LID_C3'
comment:
  en: 'For vehicles fitted with a COM 2000 (SYLEA / VALEO) manufactured before the number OPR 9534, configure the parameter to the Magneti Marelli type.'
  fr: 'Pour les véhicules équipés d''un COM 2000 (SYLEA / VALEO) et fabriqués avant le numéro OPR 9534, télécoder le paramètre à type Magnéti Marelli.'
  es: 'Para los vehículos equipados con un COM 2000 (SYLEA / VALEO) y fabricados antes del número OPR 9534, telecodificar el parámetro de tipo Magnéti Marelli.'
  de: 'Bei Fahrzeugen mit Lenksäulen-Schalteinheit COM 2000 (SYLEA / VALEO) die vor Produktions (OPR) - Nummer 9534 hergestellt sind, den Typ-Parameter Magneti Marelli codieren.'
  pl: 'Dla pojazdów wyposażonych w COM 2000 (SYLEA / VALEO) i wyprodukowanych przed numerem OPR 9534, telekodować parametr jako typ Magneti Marelli.'
  hu: 'A COM 2000 (SYLEA / VALEO) kormánykerék alatti kapcsolómodullal felszerelt és a 9534 OPR szám előtt gyártott gépkocsik esetén távkódolja a paramétert a Magnéti Marelli típusra.'
kind: 'config'
access: 'read-write'
variants: ['M59_*', 'T3_*']

mapped:
  comment:
    en: 'The position of these values is not fixed: the ECU packs the values it supports in the order given by its own parameter table (index), see the ecu.yml comment. Values of less than 8 bits are packed from the least significant bit of each byte, bigger values start on a byte boundary'
    fr: 'La position de ces valeurs n''est pas fixe : le calculateur range les valeurs qu''il gère dans l''ordre de sa propre table de paramètres (index), voir le commentaire de ecu.yml. Les valeurs de moins de 8 bits sont rangées à partir du bit de poids faible de chaque octet, les plus grandes commencent sur un octet entier'
  params:
