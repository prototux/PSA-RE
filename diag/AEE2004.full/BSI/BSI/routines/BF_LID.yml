routine: 0xBF
name: 'ROUTINE_BF'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start', 'stop']

params:
  INPUT_PARAM:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x00

  ROUTINE_CODE_ADRESS:
    bits: '2.7-4.0'
    type: 'uint'

  ROUTINE_NBR_BYTE_DMD:
    bits: '5.7-5.0'
    type: 'uint'

results:
  STATIN9:
    bits: '1.7-1.0'
    type: 'uint'

  ROUTINE_CODE_FORC_DMD:
    bits: '2.7-2.0'
    type: 'uint'
