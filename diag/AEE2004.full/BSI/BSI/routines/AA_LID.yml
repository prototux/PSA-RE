routine: 0xAA
name: 'ROUTINE_AA'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start', 'stop']

params:
  ROUTINE_CONTROL_TYPE:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x00

  INPUT_PARAM_4:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x04

  KM_HEX:
    bits: '3.7-5.0'
    type: 'uint'

  DAY_HEX:
    bits: '6.7-7.0'
    type: 'uint'

  MAINTENANCE_HEX:
    bits: '8.7-8.0'
    type: 'uint'

results:
  STATIN0:
    bits: '1.7-1.0'
    type: 'uint'
