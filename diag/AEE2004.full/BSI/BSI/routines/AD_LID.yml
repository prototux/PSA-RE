routine: 0xAD
name: 'EXITING_ENERGY_ECONOMY_MODE'
display_name:
  en: 'Exiting energy economy mode'
  fr: 'Sortir du mode économie d''énergie'
  es: 'Salida del modo economía de energía'
  de: 'Den ECO-Modus verlasen'
  pl: 'Wyjść ze stanu oszczędzania energii'
  hu: 'Lépjen ki az ECO üzemmódból'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start', 'stop']

params:
  INPUT_PARAM:
    bits: '1.7-1.0'
    type: 'enum'

  ROUTINE_FORC_DMD:
    bits: '2.7-3.0'
    type: 'uint'

  ROUTINE_PARAMETER_ASSOCIE:
    bits: '4.7-4.0'
    type: 'uint'

results:
  STATIN8:
    bits: '1.7-1.0'
    type: 'uint'

tests:
  - display_name:
      en: 'Exiting energy economy mode'
      fr: 'Sortir du mode économie d''énergie'
      es: 'Salida del modo economía de energía'
      de: 'Den ECO-Modus verlasen'
      pl: 'Wyjść ze stanu oszczędzania energii'
      hu: 'Lépjen ki az ECO üzemmódból'
    max_duration_ms: 15000
  - display_name:
      en: 'Fuel sender measurement forcing'
      fr: 'Forçage de la mesure de jauge carburant'
      es: 'Forzado de la medición del aforador carburante'
      de: 'Erzwingen Messung des Kraftstoffstands'
      pl: 'Wymuszenie pomiaru przez wskaznik poziomu paliwa'
      hu: 'Uzemanyag szitjelzo pálca kényszer mérése'
    max_duration_ms: 15000
