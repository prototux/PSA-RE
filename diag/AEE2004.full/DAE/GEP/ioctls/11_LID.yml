ioctl: 0x11
name: 'ELECTROPUMP_ASSEMBLY_MOTOR'
display_name:
  en: 'Electropump assembly motor'
  fr: 'Moteur du groupe électropompe'
  es: 'Motor del grupo electrobomba'
  de: 'Motor der Elektropumpengruppe'
  pl: 'Silnik zespołu elektropompy'
  hu: 'Elektromos-szivattyú egység motorja'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER_1P:
    bits: '1.7-1.0'
    type: 'enum'

results:
