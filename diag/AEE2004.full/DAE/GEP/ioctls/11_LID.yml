    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Electropump assembly motor'
      fr: 'Moteur du groupe électropompe'
      es: 'Motor del grupo electrobomba'
      de: 'Motor der Elektropumpengruppe'
      pl: 'Silnik zespołu elektropompy'
      hu: 'Elektromos-szivattyú egység motorja'
    max_duration_ms: 10000000
  - display_name:
      en: 'Electric pump unit motor'
      fr: 'Moteur groupe électropompe'
      es: 'Motor grupo electrobomba'
      de: 'Motor Elektropumpengruppe'
      pl: 'Silnik zespołu elektro-pompy'
      hu: 'Elektro-szivattyú motorcsoport'
    max_duration_ms: 10000000
