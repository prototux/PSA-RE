ioctl: 0x581F
name: 'SEAT_BELT_FASTENED_LED'
display_name:
  en: 'Seat belt fastened LED'
  fr: 'Voyant de bouclage de ceinture de sécurité'
  es: 'Testigo de cinturón de seguridad no abrochado'
  de: 'Warnleuchte Anlegen des Sicherheitsgurtes'
  pl: 'Kontrolka zapiecia pasa bezpieczenstwa'
  hu: 'A biztonsági öv becsatolása jelzolámpa'
variants: ['AIRBAG_MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
