ioctl: 0x581D
name: 'PASSENGER_S_AIRBAG_DEACTIVATION_LED'
display_name:
  en: 'Passenger''s airbag deactivation LED'
  fr: 'Voyant de neutralisation du coussin gonflable passager'
  es: 'Testigo de neutralización airbag pasajero'
  de: 'Kontrollleuchte Deaktivierungsschalter Beifahrerairbag'
  pl: 'Kontrolka neutralizacji poduszki powietrznej pasazera'
  hu: 'Utasoldali légzsák semlegesítés jelzolámpa'
variants: ['AIRBAG_MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
