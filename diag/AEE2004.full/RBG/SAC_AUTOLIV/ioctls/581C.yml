ioctl: 0x581C
name: 'GENERAL_FAULT_WARNING_LIGHT'
display_name:
  en: 'General fault warning light'
  fr: 'Voyant défaut général'
  es: 'Testigo defecto general'
  de: 'Leuchte Gesamtfehler'
  pl: 'Kontrolka błędu ogólnego'
  hu: 'Általános hiba visszajelzés'
variants: ['AIRBAG_MCV_*']
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONTROL_OPTION:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'General fault warning light'
      fr: 'Voyant défaut général'
      es: 'Testigo defecto general'
      de: 'Leuchte Gesamtfehler'
      pl: 'Kontrolka błędu ogólnego'
      hu: 'Általános hiba visszajelzés'
    max_duration_ms: 2000
