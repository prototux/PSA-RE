lid: 0xC1
name: 'REAR_DISTRIBUTION_FLAP_POSITION'
display_name:
  en: 'Rear distribution flap position'
  fr: 'Position du volet de distribution arrière'
  es: 'Posición de la mariposa de distribución trasera'
  de: 'Position der hinteren Verteilerklappe'
  pl: 'Położenie tylnej przesłony rozprowadzania'
  hu: 'A hátsó elosztó terelolemez helyzete'
comment:
  en: 'Rear distribution flap position. Check that the rear distribution position displayed by the rear air con control panel corresponds to the value displayed by the diagnostic tool.'
  fr: 'Position du volet de distribution arrière. Vérifier que la position de distribution arrière affichée par le tableau de climatisation arrière corresponde à la valeur affichée par l''outil de diagnostic.'
  es: 'Posición de la mariposa de distribución trasera. Verificar que la posición de distribución trasera indicada por el panel de climatización trasera corresponde al valor indicado por el útil de diagnóstico.'
  de: 'Position der hinteren Verteilerklappe. Prüfen, dass die Position der vom Bedienfeld der Klimaanlage angezeigten hinteren Verteilung dem von der Diagnosestation angezeigten Wert entspricht.'
  pl: 'Położenie tylnej przesłony rozprowadzania. Sprawdzić, czy położenie rozprowadzania z tyłu wyświetlane na panelu klimatyzacji z tyłu odpowiada wartości wyświetlanej przez przyrząd diagnostyczny.'
  hu: 'A hátsó elosztó terelolemez helyzete. Ellenorizze, hogy a hátsó légkondícionálás táblán kijelzett hátsó elosztás helyzete megfelel-e a diagnosztikai méroműszer által kijelzett értéknek.'
