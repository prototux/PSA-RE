ioctl: 0x8B
name: 'AUTOMATIC_GEARBOX_INDICATOR'
display_name:
  en: 'Automatic gearbox indicator'
  fr: 'Indicateur boîte de vitesse automatique'
  es: 'Indicador caja de cambios automática'
  de: 'Anzeige Automatikgetriebe'
  pl: 'Wskaźnik automatycznej skrzynki biegów'
  hu: 'Automata sebességváltó kijelző'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

  AUTOMATIC_GEARBOX_OR_CONTROLLED_MANUAL_GEARBOX:
    bits: '2.7-3.0'
    comment:
      en: 'Automatic Gearbox or Controlled Manual Gearbox (BVA or BVMP)'
      fr: 'Boîte de vitesses automatique ou Boîte de vitesses manuelle pilotée (BVA ou BVMP)'
      es: 'Caja de cambios automática o Caja de cambios manual pilotada (CCA o CCMP)'
      de: 'Automatikgetriebe oder automatisiertes Schaltgetriebe (BVA oder BVMP)'
      pl: 'Skrzynia biegów automatyczna lub Skrzynia biegów ręczna sterowana(BVA lub BVMP)'
      hu: 'Automata sebességváltó vagy vezérelt mechanikus sebességváltó (BVA vagy BVMP)'
    type: 'enum'
    values:
      0x00:
        en: 'Absent'
        fr: 'Absente'
        es: 'Ausente'
        de: 'Fehlend'
        pl: 'Nieobecny'
        hu: 'Hiányzó'
      0x02:
        en: 'Present'
        fr: 'Présente'
        es: 'Presente'
        de: 'Vorhanden'
        pl: 'Jest'
        hu: 'Jelen lévő'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Automatic gearbox indicator'
      fr: 'Indicateur boîte de vitesse automatique'
      es: 'Indicador caja de cambios automática'
      de: 'Anzeige Automatikgetriebe'
      pl: 'Wskaźnik automatycznej skrzynki biegów'
      hu: 'Automata sebességváltó kijelző'
    max_duration_ms: 5000
