lid: 0xBD
name: 'LID_BD'
display_name:
  en: 'Data record 0xBD (8 values)'
  fr: 'Enregistrement 0xBD (8 valeurs)'
kind: 'config'
access: 'read-write'

mapped:
  comment:
    en: 'The position of these values is not fixed: the ECU packs the values it supports in the order given by its own parameter table (index), see the ecu.yml comment. Values of less than 8 bits are packed from the least significant bit of each byte, bigger values start on a byte boundary'
    fr: 'La position de ces valeurs n''est pas fixe : le calculateur range les valeurs qu''il gère dans l''ordre de sa propre table de paramètres (index), voir le commentaire de ecu.yml. Les valeurs de moins de 8 bits sont rangées à partir du bit de poids faible de chaque octet, les plus grandes commencent sur un octet entier'
  params:
    FOLDING_DOOR_MIRRORS_HIGH_FREQUENCY_REMOTE:
      index: 0
      length: 1
      comment:
        en: 'Folding in of door mirrors with high frequency remote control'
        fr: 'Rabattement des rétroviseurs a la télécommande haute fréquence'
        es: 'Abatimiento de los retrovisores con el telemando de alta frecuencia'
        de: 'Einklappen der Außenspiegel mit der Hochfrequenz-Fernbedienung'
        pl: 'Składanie lusterek wstecznych pilotem zdalnego sterowania wysokiej częstotliwości'
        hu: 'Visszapillantó tükrök behajtása a nagyfrekvenciás távirányító segítségével'
      type: 'bool'
      values:
        0x00:
          en: 'NO'
          fr: 'NON'
          es: 'NO'
          de: 'NEIN'
          pl: 'NIE'
          hu: 'NEM/NINCS'
        0x01:
          en: 'Yes'
          fr: 'Oui'
          es: 'Sí'
          de: 'Ja'
          pl: 'Tak'
          hu: 'Igen'
    PRESENCE_REAR_SCREEN_WIPING_REVERSE_GEAR:
      index: 1
      length: 1
      comment:
        en: 'Presence of rear screen wiping in reverse gear'
        fr: 'Présence essuyage vitre arrière en marche arrière'
        es: 'Presencia limpialuneta trasero en marcha atrás'
        de: 'Wischen der Heckscheibe bei Rückwärtsgang vorhanden'
        pl: 'Włączenie wycieraczki tylnej szyby po wybraniu wstecznego biegu'
        hu: 'Hátsó ablak törlésének megléte hátramenetben'
