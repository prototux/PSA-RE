ioctl: 0xC5
name: 'VEHICLE_AND_TRAILER_REAR_FOG_LAMPS_ILLUMINATION'
display_name:
  en: 'Vehicle and trailer rear fog lamps illumination control'
  fr: 'Commande d''éclairage des feux de brouillard arrière du véhicule et de la remorque'
  es: 'Mando de alumbrado de las luces traseras de niebla del vehículo y del remolque'
  de: 'Steuerung der Beleuchtung der Nebelschlussleuchten des Fahrzeugs und des Anhängers'
  pl: 'Włączenie tylnych świateł przeciwmgielnych pojazdu i przyczepy'
  hu: 'A jármű és az utánfutó hátsó ködlámpái világításának vezérlése'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

  NUMBER_RELATIVE:
    bits: '2.7-2.0'
    type: 'uint'

  DURATION:
    bits: '3.7-3.0'
    type: 'uint'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Vehicle and trailer rear fog lamps illumination control'
      fr: 'Commande d''éclairage des feux de brouillard arrière du véhicule et de la remorque'
      es: 'Mando de alumbrado de las luces traseras de niebla del vehículo y del remolque'
      de: 'Steuerung der Beleuchtung der Nebelschlussleuchten des Fahrzeugs und des Anhängers'
      pl: 'Włączenie tylnych świateł przeciwmgielnych pojazdu i przyczepy'
      hu: 'A jármű és az utánfutó hátsó ködlámpái világításának vezérlése'
    max_duration_ms: 9000
  - display_name:
      en: 'Vehicle and trailer RH indicator illumination control'
