ioctl: 0x80
name: 'DEFLECTOR_OPENING_CLOSING_CYCLE'
display_name:
  en: 'Deflector opening/closing cycle'
  fr: 'Cycle ouverture/fermeture du déflecteur'
  es: 'Ciclo apertura/cierre del deflector'
  de: 'Öffnungs-/Schließzyklus des Spoilers'
  pl: 'Cykl otwierania/zamykania owiewki'
  hu: 'A tereloablak nyitás/zárás ciklusa'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER_1:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x00

  CONTROL_PARAMETER_2:
    bits: '2.7-2.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'
      0x12:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'

tests:
  - display_name:
      en: 'Deflector opening/closing cycle'
      fr: 'Cycle ouverture/fermeture du déflecteur'
      es: 'Ciclo apertura/cierre del deflector'
      de: 'Öffnungs-/Schließzyklus des Spoilers'
      pl: 'Cykl otwierania/zamykania owiewki'
      hu: 'A tereloablak nyitás/zárás ciklusa'
    max_duration_ms: 2000
  - display_name:
      en: 'Control to the "open position'
      fr: 'Pilotage en "position ouverte'
      es: 'Pilotaje en "posición abierta'
      de: 'Steuerung in "Position geöffnet'
      pl: 'Sterowanie w "położeniu rozłożonym'
      hu: 'Nyitott pozíció" vezérlése'
  - display_name:
      en: 'Control to the "closed position'
      fr: 'Pilotage en "position fermée'
      es: 'Pilotaje en "posición cerrada'
      de: 'Steuerung in "Position geschlossen'
      pl: 'Sterowanie w "położeniu złożonym'
      hu: 'Zárt pozíció" vezérlése'
