ioctl: 0x88
name: 'EMISSION_AMPLIFIED_BEEP_LOUDSPEAKERS'
display_name:
  en: 'Emission of an amplified beep on the loudspeakers'
  fr: 'Émission d''un bip sonore amplifié sur les haut-parleurs'
  es: 'Emisión de un bip sonoro amplificado en los altavoces'
  de: 'Aussenden eines verstärkten Signaltons über die Lautsprecher'
  pl: 'Emisja sygnału dźwiękowego "bip" wzmocnionego na głośnikach'
  hu: 'Egy felerősített hangjelzés kibocsátása a hangszórókon'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants:
  - 'A7_*'
  - 'A51_*'
  - 'A55_*'
  - 'A58_*'
  - 'B5_*'
  - 'B9_*'
  - 'D2_*'
  - 'G9_*'
  - 'T6_*'
  - 'T7_*'
  - 'T84_*'
  - 'VCAN_*'
  - 'X6_*'
  - 'X7_*'
  - 'Z9_*'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x20

  FREQUENCY_BIP:
    bits: '2.7-2.0'
    type: 'enum'

  DEACTIVATION_LOUDNESS:
    bits: '3.7-3.0'
    type: 'enum'
    default: 0x00

  VOLUME_CONTROL:
    bits: '4.7-4.0'
    type: 'enum'
    default: 0x12

  VOIE_EMISSION:
    bits: '5.7-5.0'
    type: 'enum'
    default: 0x10

  CONFIG_FADER:
    bits: '6.7-6.0'
    type: 'enum'
    default: 0x01

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Emission of an amplified beep on the loudspeakers'
      fr: 'Émission d''un bip sonore amplifié sur les haut-parleurs'
      es: 'Emisión de un bip sonoro amplificado en los altavoces'
      de: 'Aussenden eines verstärkten Signaltons über die Lautsprecher'
      pl: 'Emisja sygnału dźwiękowego "bip" wzmocnionego na głośnikach'
      hu: 'Egy felerősített hangjelzés kibocsátása a hangszórókon'
    max_duration_ms: 3000
