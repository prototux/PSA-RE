comment:
  en: 'Reads the VIN entered in the audio system (which must be identical to that contained in the built-in systems interface).'
  fr: 'Permet de lire le code VIN saisi dans l''autoradio (qui doit être identique à celui contenu dans le Boîtier de Servitude Intelligent).'
  es: 'Permite leer el código VIN capturado en el autorradio (que debe ser idéntico al contenido en la Caja de Servicio Inteligente).'
  de: 'Ermöglicht die Auslesung der im Autoradio eingegebenen VIN (muss mit der in der Zentralschalteinheit BSI gespeicherten Nummer identisch sein).'
  pl: 'Pozwala odczytać kod VIN wprowadzony do autoradia (który powinien być identyczny z zapisanym w BSI).'
  hu: 'Lehetővé teszi az autórádióba bevitt VIN-kód leolvasását (amelynek azonosnak kell lennie az intelligens kiszolgálóegységben lévővel).'
