node: 'CDSP'
model: 'CDSPG'
display_name:
  en: 'Sliding side door sensor module (probably) (CDSPG)'
  fr: 'Capteur de porte latérale coulissante (probablement) (CDSPG)'
protocols: ['KWP-PSA2000']

sessions:
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'
  0xC0:
    en: 'PSA diagnostic session'
    fr: 'Session de diagnostic PSA'
  0xFA:
    en: 'Supplier specific session'
    fr: 'Session spécifique fournisseur'

resets:
  0xB0:
    en: 'Reset 0xB0'
    fr: 'Réinitialisation 0xB0'

services: [0x10, 0x11, 0x14, 0x17, 0x21, 0x27, 0x30, 0x34, 0x3E, 0x81, 0x82]

security_access:
  - level: 0x83

tester_present:
  request: '3E'
  period_ms: 1000

identification:
  request: '21 80'
  part_number: '1.7-5.0'
  comment:
    en: 'The ECU part number is in data bytes 1 to 5 of the answer to 21 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 1 à 5 de la réponse à 21 80 (DCB), elle donne la variante logicielle'

cars: ['X6']

variants:
  X6_V1_0:
    parts: ['0000000000']
    cars: ['X6']
