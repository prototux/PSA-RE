        es: 'NO'
        de: 'NEIN'
        pl: 'NIE'
        hu: 'NEM/NINCS'
      0x01:
        en: 'Yes'
        fr: 'Oui'
        es: 'Sí'
        de: 'Ja'
        pl: 'Tak'
        hu: 'Igen'

  TYPE_OF_GEARBOX:
    bits: '1.2'
    comment:
      en: 'Type of gearbox'
      fr: 'Type de boîte de vitesses'
      es: 'Tipo de caja de cambios'
      de: 'Getriebetyp'
      pl: 'Typ skrzyni biegów'
      hu: 'Sebességváltó típusa'
    type: 'bool'
