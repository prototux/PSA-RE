ioctl: 0x80
name: 'SENDING_AUDIO_SIGNAL_SPEAKERS'
display_name:
  en: 'Sending of an audio signal to the speakers'
  fr: 'Envoi d''un signal audio vers les Haut-parleurs'
  es: 'Envío de una señal audio hacia los Altavoces'
  de: 'Senden eines Audio-Signals zu den Lautsprechern'
  pl: 'Wysłanie sygnału audio do głośników'
  hu: 'Egy audiojel elküldése a hangszórók felé'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants:
  - 'A7_*'
  - 'B5_*'
  - 'B9_*'
  - 'BOITIER_NOMADE_D2_V1'
  - 'D2_*'
  - 'G9_*'
  - 'T6_*'
  - 'T7_*'
  - 'VCAN_*'
  - 'X6_*'
  - 'X7_*'
  - 'Z9_*'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x00:
        en: 'Control not started'
        fr: 'Pilotage non lancé'
        es: 'Pilotaje no lanzado'
        de: 'Steuerung nicht gestartet'
        pl: 'Sterowanie nie uruchomione'
        hu: 'Vezérlés nincs elindítva'
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Control completed'
        fr: 'Pilotage terminé'
        es: 'Pilotaje terminado'
        de: 'Steuerung beendet'
        pl: 'Sterowanie zakończone'
        hu: 'Vezérlés befejezve'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje detenido'
        de: 'Steuerung abgebrochen'
        pl: 'Sterowanie zatrzymane'
        hu: 'Vezérlés leállítva'
      0x12:
        en: 'Control completed but presence of a problem'
        fr: 'Pilotage terminé mais problème'
        es: 'Pilotaje terminado pero problema'
        de: 'Steuerung beendet, jedoch Problem'
        pl: 'Sterowanie zakończone, ale wystąpił problem'
        hu: 'Vezérlés befejezve de probléma lépett fel'

tests:
  - display_name:
      en: 'Sending of an audio signal to the speakers'
      fr: 'Envoi d''un signal audio vers les Haut-parleurs'
      es: 'Envío de una señal audio hacia los Altavoces'
      de: 'Senden eines Audio-Signals zu den Lautsprechern'
      pl: 'Wysłanie sygnału audio do głośników'
      hu: 'Egy audiojel elküldése a hangszórók felé'
    max_duration_ms: 5000
