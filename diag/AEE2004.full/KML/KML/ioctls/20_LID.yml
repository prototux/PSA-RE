ioctl: 0x20
name: 'IO_CONTROL_20'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants: ['I3_*']

params:
  CO_STATUS:
    bits: '1.7-1.0'
    type: 'uint'
    default: 0x07

  ACTUATE_SWITCH:
    bits: '2.0'
    type: 'bool'

results:
  COUNTER_RCS:
    bits: '1.7-1.0'
    type: 'uint'

  CONTROL_STATUS:
    bits: '2.7-2.0'
    type: 'uint'
