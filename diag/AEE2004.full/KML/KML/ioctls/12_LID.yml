ioctl: 0x12
name: 'TELEPHONE_CALL_BUTTONS'
display_name:
  en: 'Telephone call buttons'
  fr: 'Touches d''appel téléphonique'
  es: 'Teclas de llamada telefónica'
  de: 'Telefonruftasten'
  pl: 'Przyciski połączenia telefonicznego'
  hu: 'Telefonhívás gombok'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants: ['I3_*']

params:
  COUNTER_RCS:
    bits: '1.7-1.0'
    type: 'uint'
    default: 0x01

results:
  COUNTER_RCS:
    bits: '1.7-1.0'
    type: 'uint'

  CONTROL_STATUS:
    bits: '2.7-2.0'
    type: 'uint'

tests:
  - display_name:
      en: 'Telephone call buttons'
      fr: 'Touches d''appel téléphonique'
      es: 'Teclas de llamada telefónica'
      de: 'Telefonruftasten'
      pl: 'Przyciski połączenia telefonicznego'
      hu: 'Telefonhívás gombok'
    max_duration_ms: 5000
