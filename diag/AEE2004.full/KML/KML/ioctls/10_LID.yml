ioctl: 0x10
name: 'VOICE_RECOGNITION_BUTTON'
display_name:
  en: 'Voice Recognition button'
  fr: 'Touche de Reconnaissance Vocale'
  es: 'Tecla de Reconocimiento vocal'
  de: 'Taste Spracherkennung'
  pl: 'Przycisk wskazówek głosowych'
  hu: 'Beszédhang általi felismerés gomb'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants: ['I3_*']

params:
  COUNTER_RCS:
    bits: '1.7-1.0'
    type: 'uint'
    default: 0x01

results:
  COUNTER_RCS:
    bits: '1.7-1.0'
    type: 'uint'

  CONTROL_STATUS:
    bits: '2.7-2.0'
    type: 'uint'

tests:
  - display_name:
      en: 'Voice Recognition button'
      fr: 'Touche de Reconnaissance Vocale'
      es: 'Tecla de Reconocimiento vocal'
      de: 'Taste Spracherkennung'
      pl: 'Przycisk wskazówek głosowych'
      hu: 'Beszédhang általi felismerés gomb'
    max_duration_ms: 5000
