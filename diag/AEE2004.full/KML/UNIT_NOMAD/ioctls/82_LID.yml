ioctl: 0x82
name: 'SEARCH_BLUETOOTH_PERIPHERALS'
display_name:
  en: 'Search for Bluetooth peripherals'
  fr: 'Recherche de périphériques Bluetooth'
  es: 'Búsqueda de periféricos Bluetooth'
  de: 'Suche der Bluetooth-Peripheriegeräte'
  pl: 'Poszukiwanie otoczenia Bluetooth'
  hu: 'Bluetooth perifériák keresése'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x00:
        en: 'Control not started'
        fr: 'Pilotage non lancé'
        es: 'Pilotaje no lanzado'
        de: 'Steuerung nicht gestartet'
        pl: 'Sterowanie nie uruchomione'
        hu: 'Vezérlés nincs elindítva'
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Suche läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Kezelés folyamatban'
      0x02:
        en: 'Completed OK'
        fr: 'Terminé OK'
        es: 'Terminado OK'
        de: 'Beendet OK'
        pl: 'Zakończony OK'
        hu: 'Befejezve Rendben'
      0x04:
        en: 'Completed not OK'
        fr: 'Terminé non OK'
        es: 'Terminado no OK'
        de: 'Beendet nicht OK'
        pl: 'Zakończony nie OK'
        hu: 'Befejezve nincs rendben'

tests:
  - display_name:
      en: 'Search for Bluetooth peripherals'
      fr: 'Recherche de périphériques Bluetooth'
      es: 'Búsqueda de periféricos Bluetooth'
      de: 'Suche der Bluetooth-Peripheriegeräte'
      pl: 'Poszukiwanie otoczenia Bluetooth'
      hu: 'Bluetooth perifériák keresése'
    max_duration_ms: 15000
