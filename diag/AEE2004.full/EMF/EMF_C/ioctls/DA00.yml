ioctl: 0xDA00
name: 'IO_CONTROL_DA00'
variants: ['V1', 'V2', 'V3', 'V4', 'V5']
controls:
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  RESERVED:
    bits: '2.7-2.0'
    unused: true

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
