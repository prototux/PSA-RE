node: 'EMF'
model: 'EMF_C'
display_name:
  en: 'Multifunction display (EMF_C)'
  fr: 'Ecran multifonction (EMF_C)'
protocols: ['UDS', 'KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x765
    response_id: 0x665
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'
  0xC0:
    en: 'PSA diagnostic session'
    fr: 'Session de diagnostic PSA'

services: [0x10, 0x14, 0x17, 0x19, 0x21, 0x22, 0x27, 0x2E, 0x2F, 0x30, 0x31, 0x3B, 0x3E]

security_access:
  - level: 0x03
    algorithm: 'PSA_SEED_KEY'
    key: 'F6C4'
  - level: 0x83
    algorithm: 'PSA_SEED_KEY'
    key: 'F6C4'

tester_present:
  request: '3E'
  period_ms: 1000

identification:
  request: '21 80'
  part_number: '8.7-12.0'
  comment:
    en: 'The ECU part number is in data bytes 8 to 12 of the answer to 21 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 8 à 12 de la réponse à 21 80 (DCB), elle donne la variante logicielle'

