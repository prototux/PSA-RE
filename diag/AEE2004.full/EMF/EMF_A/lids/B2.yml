lid: 0xB2
name: 'LID_B2'
display_name:
  en: 'Data record 0xB2 (2 values)'
  fr: 'Enregistrement 0xB2 (2 valeurs)'
kind: 'config'
access: 'read-write'
length: 1
variants: ['A7_*', 'A51_*', 'A55_*', 'A58_*', 'B5_*', 'B9_*', 'EMFA_*', 'G9_*', 'T6_*', 'T7_*', 'T8_*']

params:
  CONTROL_MULTIFUNCTION_SCREEN_STEERING_WHEEL:
    bits: '1.4'
    comment:
      en: 'Control of the multifunction screen by the steering wheel radio control'
      fr: 'Commande de l''écran multifonction par la commande de radio sous volant de direction'
      es: 'Mando de la pantalla multifunciones por medio del mando de la radio en el volante de dirección'
      de: 'Steuerung der Multifunktionsanzeige durch die Radiobedienung unter dem Lenkrad'
      pl: 'Sterowanie ekranem wielofunkcyjnym za pomocą przełączników radiowych pod kierownicą'
      hu: 'A többfunkciós képernyő vezérlése a kormánykerék alatti autórádió kapcsoló által'
    type: 'bool'
    values:
      0x00:
        en: 'NO'
        fr: 'NON'
        es: 'NO'
        de: 'NEIN'
        pl: 'NIE'
        hu: 'NEM/NINCS'
      0x01:
        en: 'Yes'
        fr: 'Oui'
        es: 'Sí'
        de: 'Ja'
        pl: 'Tak'
        hu: 'Igen'

  TYPE_CONNECTION_REMOTE_CONTROL:
    bits: '1.3-1.2'
    comment:
      en: 'Type of connection to the remote control'
      fr: 'Type de liaison à la commande déportée'
      es: 'Tipo de unión al mando desplazado'
      de: 'Typ Verbindung zur versetzten Bedienung'
      pl: 'Rodzaj połączenia ze zdalnym sterowaniem'
      hu: 'A kihelyezett vezérléshez történő kapcsolódás típusa'
    type: 'enum'
    values:
      0x00:
        en: 'Wired (no radio)'
        fr: 'Filaire (sans radio)'
        es: 'Por cable (sin radio)'
        de: 'Leitungsverbindung (ohne Radio)'
        pl: 'Przewodowy (bez radia)'
        hu: 'Vezetékes (autórádió nélkül)'
      0x02:
        en: 'Via CAN network (with RD4 radio)'
        fr: 'Via réseau CAN (avec radio RD4)'
        es: 'Vía red CNA (con radio RD4)'
        de: 'Über Bus CAN (mit Radio RD4)'
        pl: 'Poprzez sieć CAN (z radiem RD4)'
        hu: 'CAN hálózaton keresztül (RD4 autórádióval)'
      0x03:
        en: 'EMF buttons (without RD4 radio)'
        fr: 'Boutons EMF (sans radio RD4)'
        es: 'Botones EMF (sin radio RD4)'
        de: 'Tasten Mehrfunktionsanzeige (ohne Radio RD4)'
        pl: 'Przyciski ekranu wielofunkcyjnego (bez radia RD4)'
        hu: 'Többfunkciós képernyő gombok (RD4 autórádió nélkül)'

alternatives:
  - note:
      en: 'Other reading of the same bytes (both are given by the observations)'
      fr: 'Autre lecture des mêmes octets (les deux sont données par les observations)'
    params:
      SPARE_BIT_3:
        bits: '1.7-1.0'
        type: 'uint'
  - note:
      en: 'Layout seen on 132 other software variant(s)'
      fr: 'Format vu sur 132 autre(s) variante(s) logicielle(s)'
    variants: ['A7_*', 'A51_*', 'A55_*', 'A58_*', 'B5_*', 'B9_*', 'EMFA_*', 'G9_*', 'T6_*', 'T7_*', 'T8_*']
    access: 'read'
    length: 1
    params:
      SPARE_BIT_3:
        bits: '1.7-1.0'
        type: 'uint'
