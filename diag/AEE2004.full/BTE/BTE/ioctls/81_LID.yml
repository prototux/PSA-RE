ioctl: 0x81
name: 'PASSENGER_S_SIDE_FRONT_AND_REAR_WINDOWS_OPENING'
display_name:
  en: 'Passenger''s side front and rear windows opening control'
  fr: 'Commande d''ouverture des vitres avant et arrière côté passager'
  es: 'Mando de apertura de las lunas delanteras y traseras lado pasajero'
  de: 'Öffnungssteuerung der Scheiben vorn und hinten Beifahrerseite'
  pl: 'Sterowanie otwarciem szyb przednich i tylnych po stronie pasażera'
  hu: 'Utas oldali első és hátsó ablak nyitásának vezérlése'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants: ['A7_*', 'T6_V1']

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x20

  CONTROL_PARAMETER_8081:
    bits: '2.7-2.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Passenger''s side front and rear windows opening control'
      fr: 'Commande d''ouverture des vitres avant et arrière côté passager'
      es: 'Mando de apertura de las lunas delanteras y traseras lado pasajero'
      de: 'Öffnungssteuerung der Scheiben vorn und hinten Beifahrerseite'
      pl: 'Sterowanie otwarciem szyb przednich i tylnych po stronie pasażera'
      hu: 'Utas oldali első és hátsó ablak nyitásának vezérlése'
  - display_name:
      en: 'Passenger''s side front and rear windows closing control'
      fr: 'Commande de fermeture des vitres avant et arrière côté passager'
      es: 'Mando de cierre de las lunas delanteras y traseras lado pasajero'
      de: 'Schließsteuerung der Scheiben vorn und hinten Beifahrerseite'
      pl: 'Sterowanie zamknięciem przednich i tylnych szyb po stronie pasażera'
      hu: 'Utas oldali első és hátsó ablak zárásának vezérlése'
  - display_name:
      en: 'Lighting of the retractable roof switch'
      fr: 'Éclairage du contacteur de toit escamotable'
      es: 'Iluminación del contactor de techo escamoteable'
      de: 'Beleuchtung des Klappdach-Schalters'
      pl: 'Oświetlenie stycznika składanego dachu'
      hu: 'Lenyitható tető kapcsolójának megvilágítása'
    max_duration_ms: 500
