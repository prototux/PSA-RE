ioctl: 0x80
name: 'DRIVER_S_SIDE_FRONT_AND_REAR_WINDOWS_OPENING'
display_name:
  en: 'Driver''s side front and rear windows opening control'
  fr: 'Commande d''ouverture des vitres avant et arrière côté conducteur'
  es: 'Mando de apertura de las lunas delanteras y traseras lado conductor'
  de: 'Öffnungssteuerung der Scheiben vorn und hinten Fahrerseite'
  pl: 'Sterowanie otwarciem szyb przednich i tylnych po stronie kierowcy'
  hu: 'Vezető oldali első és hátsó ablak nyitásának vezérlése'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants: ['A7_*']

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x20

  CONTROL_PARAMETER_8081:
    bits: '2.7-2.0'
    type: 'enum'

results:
