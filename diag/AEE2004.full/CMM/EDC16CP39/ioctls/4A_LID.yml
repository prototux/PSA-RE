ioctl: 0x4A
name: 'FUEL_ADDITIVE_ADDING_PUMP'
display_name:
  en: 'Fuel additive adding pump'
  fr: 'Pompe additivation carburant'
  es: 'Bomba de aditivación carburante'
  de: 'Kraftstoff-Additivierungspumpe'
  pl: 'Pompa dozowania dodatku do paliwa'
  hu: 'Tüzelőanyag adalékolás szivattyú'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER_1:
    bits: '1.7-1.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

  CONTROL_STATUS_2:
    bits: '2.7-2.0'
    type: 'enum'
    values:
      0x01:
        en: 'Actuator jammed (disengaged)'
        fr: 'Actionneur bloqué (désengagé)'
        es: 'Accionador bloqueado (desengranado)'
        de: 'Stellglied blockiert (gelöst)'
        pl: 'Urządzenie wykonawcze zablokowane (odłączone)'
        hu: 'Blokkolt beavatkozószerv (kikapcsolt)'
      0x02:
        en: 'Actuator jammed (engaged)'
        fr: 'Actionneur bloqué (engagé)'
        es: 'Accionador bloqueado (engranado)'
        de: 'Stellglied blockiert (aktiviert)'
        pl: 'Urządzenie wykonawcze zablokowane (włączone)'
        hu: 'Blokkolt beavatkozószerv (bekapcsolt)'
      0x03:
        en: 'Protection activated'
        fr: 'Protection activée'
        es: 'Protección activa'
        de: 'Schutz aktiviert'
        pl: 'Zabezpieczenie włączone'
        hu: 'Védelem aktiválva'

tests:
  - display_name:
      en: 'Fuel additive adding pump'
      fr: 'Pompe additivation carburant'
      es: 'Bomba de aditivación carburante'
      de: 'Kraftstoff-Additivierungspumpe'
      pl: 'Pompa dozowania dodatku do paliwa'
      hu: 'Tüzelőanyag adalékolás szivattyú'
    max_duration_ms: 5000
  - display_name:
      en: 'Additive adding pump (test possible only after the ignition has been turned off for 30 seconds)'
      fr: 'Pompe d''additivation (test possible uniquement après une coupure de contact de 30 s)'
      es: 'Bomba de aditivación (test posible únicamente después de un corte de contacto de 30 segundos)'
      de: 'Additivierungspumpe (Test nur möglich nach einer Ausschaltung des Fahrtschalters von 30 s)'
      pl: 'Pompa dodatku (test możliwy dopiero po wyłączeniu zapłonu na 30 s.)'
      hu: 'Adalékoló szivattyú (a teszt csupán egy 30 másodperces gyújtásmegszakítás után lehetséges)'
    max_duration_ms: 100000
