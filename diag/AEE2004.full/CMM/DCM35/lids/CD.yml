lid: 0xCD
name: 'LID_CD'
display_name:
  en: 'Data record 0xCD (8 values)'
  fr: 'Enregistrement 0xCD (8 valeurs)'
kind: 'live'
access: 'read'
length: 15

params:
  COOLANT_TEMPERATURE:
    bits: '4.7-4.0'
    comment:
      en: 'Coolant temperature'
      fr: 'Température d''eau'
      es: 'Temperatura del agua'
      de: 'Kühlmitteltemperatur'
      pl: 'Temperatura płynu chłodzącego'
      hu: 'Hűtofolyadék-homérséklet'
    type: 'uint'
    offset: -50
    units: '°C'

  FAN_ASSEMBLY_1_SPEED_REFERENCE_VALUE:
    bits: '5.7-5.0'
    comment:
      en: 'Fan assembly 1 speed reference value'
      fr: 'Consigne de vitesse du groupe motoventilateur 1'
      es: 'Consigna de velocidad del grupo motoventilador 1'
      de: 'Solldrehzahl der Kühlerventilatoreinheit 1'
      pl: 'Wartość zadana prędkości zespołu wentylatora chłodnicy 1'
      hu: 'Motorventilátor egység 1 sebesség előírt érték'
    type: 'uint'
    units: '%'

  MEASUREMENT_COOLING_FAN_SPEED:
    bits: '6.7-6.0'
    comment:
      en: 'Measurement of the cooling fan speed'
      fr: 'Mesure vitesse GMV'
      es: 'Medición de la velocidad GMV'
      de: 'Messung Geschwindigkeit Kühlerventilatorgruppe'
      pl: 'Pomiar prędkości GMV'
      hu: 'Motorhűtőventilátor-egység sebesség mérése'
    type: 'uint'
    units: '%'

  FAN_ASSEMBLY_2_SPEED_REFERENCE_VALUE:
    bits: '7.7-7.0'
    comment:
      en: 'Fan assembly 2 speed reference value'
      fr: 'Consigne de vitesse du groupe motoventilateur 2'
      es: 'Consigna de velocidad del grupo motoventilador 2'
      de: 'Solldrehzahl der Kühlerventilatoreinheit 2'
      pl: 'Wartość zadana prędkości zespołu wentylatora chłodnicy 2'
      hu: 'Motorventilátor egység 2 sebesség előírt érték'
    type: 'enum'
    values:
      0x00:
        en: 'No ventilation'
        fr: 'Pas de ventilation'
        es: 'No hay ventilación'
        de: 'Keine Lüftung'
        pl: 'Brak wentylacji'
        hu: 'Nincs ventiláció'
      0x01:
        en: 'Low speed engaged'
        fr: 'Petite vitesse enclenchée'
        es: 'Pequeña velocidad metida'
        de: 'Niedrige Drehzahl geschaltet'
        pl: 'Mała prędkość włączona'
        hu: 'Bekapcsolt alacsony sebességfokozat'

  AIR_CONDITIONING_CIRCUIT_PRESSURE:
    bits: '10.7-11.0'
    comment:
      en: 'Air conditioning circuit pressure'
      fr: 'Pression du circuit de climatisation'
      es: 'Presión del circuito de climatización'
      de: 'Kältemitteldruck der Klimaanlage'
      pl: 'Ciśnienie obwodu klimatyzacji'
      hu: 'Klímakör nyomása'
    type: 'uint'
    factor: 0.1
    units: 'bar'

  OIL_PRESSURE_SWITCH_MEASUREMENT:
    bits: '12.7-12.0'
    comment:
      en: 'Oil pressure switch measurement'
      fr: 'Mesure du manocontact pression d''huile'
      es: 'Medida del manocontacto de presión de aceite'
      de: 'Messung des Öldruckschalters'
      pl: 'Pomiar czujnika ciśnienia oleju'
      hu: 'Olajnyomás-kapcsoló mérése'
    type: 'enum'
    values:
      0x00:
        en: 'Pressure OK'
        fr: 'Pression OK'
        es: 'Presión OK'
        de: 'Druck Ok'
        pl: 'Ciśnienie OK'
        hu: 'Nyomás OK'
      0x01:
        en: 'Pressure insufficient'
        fr: 'Pression insuffisante'
        es: 'Presión insuficiente'
        de: 'Öldruck nicht ausreichend'
        pl: 'Ciśnienie niedostateczne'
        hu: 'Elégtelen nyomás'

  ESTIMATED_OIL_TEMPERATURE:
    bits: '13.7-13.0'
    comment:
      en: 'Estimated oil temperature'
      fr: 'Température d''huile estimée'
      es: 'Temperatura estimada del aceite'
      de: 'Geschätzte Öltemperatur'
      pl: 'Temperatura oceniana oleju'
      hu: 'Becsült olajhőmérséklet'
    type: 'uint'
    offset: -50
    units: '°C'

  OIL_LEVEL_SENSOR_VOLTAGE:
    bits: '14.7-15.0'
    comment:
      en: 'Oil level sensor voltage'
      fr: 'Tension du capteur de niveau d''huile'
      es: 'Tensión del captador de nivel de aceite'
      de: 'Spannung des Ölstandsensors'
      pl: 'Napięcie czujnika poziomu oleju'
      hu: 'Olajszint érzékelő feszültsége'
    type: 'uint'
    units: 'mV'
