lid: 0x87
name: 'LID_87'
display_name:
  en: 'Data record 0x87 (7 values)'
  fr: 'Enregistrement 0x87 (7 valeurs)'
kind: 'other'
access: 'read'
length: 16

params:
  DTC_CODE:
    bits: '2.7-3.0'
    type: 'uint'
    mux_selector: true

  MIXTURE_STATUS:
    bits: '4.7-4.0'
    comment:
      en: 'Mixture status'
      fr: 'État richesse'
      es: 'Estado riqueza'
      de: 'Zustand Gemisch'
      pl: 'Stan składu mieszanki'
      hu: 'Dúsítottsági állapot'
    type: 'enum'
    values:
      0x01:
        en: 'Open loop (conditions for switching to a closed loop not yet satisfied)'
        fr: 'Boucle ouverte (conditions de passage en boucle fermée pas encore satisfaites)'
        es: 'Bucle abierto (condiciones de paso en bucle cerrado aún no satisfactorias)'
        de: 'Offene Regelkette (Bedingungen für Übergang in den geschlossenen Regelkreis noch nicht erfüllt)'
        pl: 'Pętla otwarta (warunki do przejścia do pętli zamkniętej jeszcze niezadowalające)'
        hu: 'Nyitott hurok (még nem teljesülnek a zárt hurokra történo áttéréshez szükséges feltételek)'
      0x02:
        en: 'Closed loop'
        fr: 'Boucle fermée'
        es: 'Bucle cerrado'
        de: 'Geschlossener Kreis'
        pl: 'Pętla zamknięta'
        hu: 'Z rt hurok'
      0x04:
        en: 'Open loop (special driving conditions)'
        fr: 'Boucle ouverte (condition particulières de roulage)'
        es: 'Bucle abierto (condición especial de circulación)'
        de: 'Offene Regelkette (besondere Fahrtbedingungen)'
        pl: 'Pętla otwarta (szczególne warunki jazdy)'
        hu: 'Nyitott hurok (sajátos menetfeltételek)'
      0x08:
        en: 'Open loop (fault)'
        fr: 'Boucle ouverte (défaillance)'
        es: 'Bucle abierto (fallo)'
        de: 'Offene Regelkette (Ausfall)'
        pl: 'Pętla otwarta (uszkodzenie)'
        hu: 'Nyitott hurok (meghib sod s)'
      0x0A:
        en: 'Closed loop but fault on an oxygen sensor'
        fr: 'Boucle fermée mais défaillance sur une sonde lambda'
        es: 'Bucle cerrado pero fallo en una sonda de oxígeno'
        de: 'Geschlossener Regelkreis, aber Ausfall an einer lambda-Sonde'
        pl: 'Pętla zamknięta ale niesprawność w sondzie lambda'
        hu: 'Zárt hurok, de meghibásodás valamelyik lambdaszondánál'

  DTC_RANG:
    bits: '1.7-1.0'
    type: 'uint'

  COOLANT_TEMPERATURE:
    bits: '7.7-7.0'
    comment:
      en: 'Coolant temperature'
      fr: 'Température d''eau'
      es: 'Temperatura del agua'
      de: 'Kühlmitteltemperatur'
      pl: 'Temperatura płynu chłodzącego'
      hu: 'Hűtofolyadék-homérséklet'
    type: 'uint'
    offset: -40
    units: '°C'

  MANIFOLD_PRESSURE:
    bits: '13.7-13.0'
    comment:
      en: 'Manifold pressure'
      fr: 'Pression collecteur'
      es: 'Presión colector'
      de: 'Saugrohrdruck'
      pl: 'Cisnienie w kolektorze'
      hu: 'Gyűjtïcsï nyom sa'
    type: 'uint'
    factor: 10
    units: 'mbar'

  ENGINE_SPEED:
    bits: '14.7-15.0'
    comment:
      en: 'Engine speed'
      fr: 'Régime'
      es: 'Régimen'
      de: 'Drehzahl'
      pl: 'Prędkość obrotowa'
      hu: 'Fordulatszám'
    type: 'uint'
    factor: 0.25
    units: 'rpm'

  VEHICLE_SPEED:
    bits: '16.7-16.0'
    comment:
      en: 'Vehicle speed'
      fr: 'Vitesse véhicule'
      es: 'Velocidad vehículo'
      de: 'Fahrtgeschwindigkeit'
      pl: 'Predkosc pojazdu'
      hu: 'Gépjárműsebesség'
    type: 'uint'
    units: 'km/h'
