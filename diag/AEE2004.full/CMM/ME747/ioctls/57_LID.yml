ioctl: 0x57
name: 'HIGH_SPEED_FAN_UNIT'
display_name:
  en: 'High speed fan unit'
  fr: 'Groupe motoventilateur grande vitesse'
  es: 'Grupo motoventilador gran velocidad'
  de: 'Kühlerlüftereinheit hohe Drehzahl'
  pl: 'Zespół wentylatora chłodnicy dużej predkości'
  hu: 'Hűtőventilátor egység nagy sebességfokozata'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

  CONTROL_STATUS_2:
    bits: '2.7-2.0'
    type: 'enum'
    values:
      0x01:
        en: 'Actuator jammed (disengaged)'
        fr: 'Actionneur bloqué (désengagé)'
        es: 'Accionador bloqueado (desengranado)'
        de: 'Stellglied blockiert (gelöst)'
        pl: 'Urządzenie wykonawcze zablokowane (odłączone)'
        hu: 'Blokkolt beavatkozószerv (kikapcsolt)'

tests:
  - display_name:
      en: 'High speed fan unit'
      fr: 'Groupe motoventilateur grande vitesse'
      es: 'Grupo motoventilador gran velocidad'
      de: 'Kühlerlüftereinheit hohe Drehzahl'
      pl: 'Zespół wentylatora chłodnicy dużej predkości'
      hu: 'Hűtőventilátor egység nagy sebességfokozata'
    max_duration_ms: 10000
  - display_name:
      en: 'High speed fan assembly (Chopper)'
      fr: 'Groupe motoventilateur grande vitesse (Hacheur)'
      es: 'Grupo motoventilador gran velocidad (limitador de corte)'
      de: 'Kühlerlüftereinheit hohe Drehzahl (Zerhacker)'
      pl: 'Zespół motowentylatora na dużej prędkości (Dzielnik napięcia)'
      hu: 'Motorventilátor-egység nagy sebességfokozat (megszakító)'
    max_duration_ms: 10000
