lid: 0xCD
name: 'LID_CD'
display_name:
  en: 'Data record 0xCD (9 values)'
  fr: 'Enregistrement 0xCD (9 valeurs)'
kind: 'live'
access: 'read'
length: 15

params:
  ENGINE_SPEED:
    bits: '1.7-2.0'
    comment:
      en: 'Engine speed'
      fr: 'Régime moteur'
      es: 'Régimen motor'
      de: 'Motordrehzahl'
      pl: 'Prędkość obrotowa silnika'
      hu: 'Motor fordulatszám'
    type: 'uint'
    units: 'rpm'

  COOLANT_TEMPERATURE:
    bits: '4.7-4.0'
    comment:
      en: 'Coolant temperature'
      fr: 'Température d''eau'
      es: 'Temperatura del agua'
      de: 'Kühlmitteltemperatur'
      pl: 'Temperatura płynu chłodzącego'
      hu: 'Hűtofolyadék-homérséklet'
    type: 'uint'
    offset: -50
    units: '°C'

  FAN_SPEED_1_SETTING:
    bits: '5.7-5.0'
    comment:
      en: 'Fan speed 1 setting'
      fr: 'Consigne vitesse GMV 1'
      es: 'Consigna velocidad GMV 1'
      de: 'Sollwert Geschwindigkeit Kühlerventilatorgruppe 1'
      pl: 'Wartosc zadana obrotów GMV 1'
      hu: '1 sebességű motor ventillátor csoport'
    type: 'uint'
    units: '%'

  MEASUREMENT_COOLING_FAN_SPEED:
    bits: '6.7-6.0'
    comment:
      en: 'Measurement of the cooling fan speed'
      fr: 'Mesure vitesse GMV'
      es: 'Medición de la velocidad GMV'
      de: 'Messung Geschwindigkeit Kühlerventilatorgruppe'
      pl: 'Pomiar prędkości GMV'
      hu: 'Motorhűtőventilátor-egység sebesség mérése'
    type: 'uint'
    units: '%'

  FAN_SPEED_2_SETTING:
    bits: '7.7-7.0'
    comment:
      en: 'Fan speed 2 setting'
      fr: 'Consigne vitesse GMV 2'
      es: 'Consigna velocidad GMV 2'
      de: 'Sollwert Geschwindigkeit Kühlerventilatorgruppe 2'
      pl: 'Wartosc zadana obrotów GMV 2'
      hu: '2 sebességű motor ventillátor csoport'
    type: 'enum'
    values:
      0x00:
        en: 'No ventilation'
        fr: 'Pas de ventilation'
        es: 'No hay ventilación'
        de: 'Keine Lüftung'
        pl: 'Brak wentylacji'
        hu: 'Nincs ventiláció'
      0x01:
        en: 'Low speed engaged'
        fr: 'Petite vitesse enclenchée'
        es: 'Pequeña velocidad metida'
        de: 'Niedrige Drehzahl geschaltet'
        pl: 'Mała prędkość włączona'
        hu: 'Bekapcsolt alacsony sebességfokozat'

  AIR_CONDITIONING_CIRCUIT_PRESSURE:
    bits: '10.7-11.0'
    comment:
      en: 'Air conditioning circuit pressure'
      fr: 'Pression du circuit de climatisation'
      es: 'Presión del circuito de climatización'
      de: 'Kältemitteldruck der Klimaanlage'
      pl: 'Ciśnienie obwodu klimatyzacji'
      hu: 'Klímakör nyomása'
    type: 'uint'
    factor: 0.1
    units: 'bar'

  OIL_PRESSURE_SWITCH_MEASUREMENT:
    bits: '12.7-12.0'
    comment:
      en: 'Oil pressure switch measurement'
      fr: 'Mesure du manocontact pression d''huile'
      es: 'Medida del manocontacto de presión de aceite'
      de: 'Messung des Öldruckschalters'
      pl: 'Pomiar czujnika ciśnienia oleju'
      hu: 'Olajnyomás-kapcsoló mérése'
    type: 'enum'
    values:
      0x00:
        en: 'Pressure OK'
        fr: 'Pression OK'
        es: 'Presión OK'
        de: 'Druck Ok'
        pl: 'Ciśnienie OK'
        hu: 'Nyomás OK'
      0x01:
        en: 'Pressure insufficient'
        fr: 'Pression insuffisante'
        es: 'Presión insuficiente'
        de: 'Öldruck nicht ausreichend'
        pl: 'Ciśnienie niedostateczne'
        hu: 'Elégtelen nyomás'

  OIL_TEMPERATURE:
    bits: '13.7-13.0'
    comment:
      en: 'Oil temperature'
      fr: 'Température d''huile'
      es: 'Temperatura del aceite'
      de: 'Öltemperatur'
      pl: 'Temperatura oleju'
      hu: 'Olajhőmérséklet'
    type: 'uint'
    offset: -50
    units: '°C'

  OIL_LEVEL_SENSOR_VOLTAGE:
    bits: '14.7-15.0'
    comment:
      en: 'Oil level sensor voltage'
      fr: 'Tension du capteur de niveau d''huile'
      es: 'Tensión del captador de nivel de aceite'
      de: 'Spannung des Ölstandsensors'
      pl: 'Napięcie czujnika poziomu oleju'
      hu: 'Olajszint érzékelő feszültsége'
    type: 'uint'
    units: 'mV'
