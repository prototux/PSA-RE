lid: 0xCB
name: 'LID_CB'
display_name:
  en: 'Data record 0xCB (18 values)'
  fr: 'Enregistrement 0xCB (18 valeurs)'
kind: 'live'
access: 'read'
length: 32

params:
  ENGINE_SPEED:
    bits: '1.7-2.0'
    alt_names: ['ENGINE_SPEED_2']
    comment:
      en: 'Engine speed'
      fr: 'Régime moteur'
      es: 'Régimen motor'
      de: 'Motordrehzahl'
      pl: 'Prędkość obrotowa silnika'
      hu: 'Motor fordulatszám'
    type: 'uint'
    units: 'rpm'

  VEHICLE_SPEED:
    bits: '3.7-3.0'
    comment:
      en: 'Vehicle speed'
      fr: 'Vitesse véhicule'
      es: 'Velocidad vehículo'
      de: 'Fahrtgeschwindigkeit'
      pl: 'Predkosc pojazdu'
      hu: 'Gépjárműsebesség'
    type: 'uint'
    units: 'km/h'

  MIXTURE_CALCULATED_O2_SENSOR:
    bits: '5.7-6.0'
    alt_names: ['MIXTURE_CALCULATED_OXYGEN_SENSOR']
    comment:
      en: 'Mixture calculated by the O2 sensor'
      fr: 'Richesse calculée par la sonde O2'
      es: 'Riqueza calculada por la sonda O2'
      de: 'Über die Lambda-Sonde berechnetes Gemisch'
      pl: 'Obliczony skład mieszanki przez sondę O2'
      hu: 'Lambda-szonda által kalkulált keveréksűrűség'
    type: 'uint'
    factor: 0.001

  OCR_UPSTREAM_OXYGEN_SENSOR_HEATING:
    bits: '7.7-7.0'
    comment:
      en: 'OCR of the upstream oxygen sensor heating'
      fr: 'RCO du chauffage de la sonde à oxygène amont'
      es: 'RCO del calentamiento de la sonda de oxígeno delantera'
      de: 'TV der Heizung der Lambdasonde vor Katalysator'
      pl: 'RCO ogrzewania sondy tlenowej "przed'
      hu: 'Az első lambdaszonda fűtésének ciklikus nyitási aránya (RCO)'
    type: 'uint'
    units: '%'

  UPSTREAM_OXYGEN_SENSOR_VOLTAGE:
    bits: '8.7-9.0'
    alt_names: ['UPSTREAM_OXYGEN_SENSOR_VOLTAGE_2']
    comment:
      en: 'Upstream oxygen sensor voltage'
      fr: 'Tension sonde à oxygène amont'
      es: 'Tensión sonda de oxígeno delantera'
      de: 'Spannung Lambdasonde vorne'
      pl: 'Napięcie sondy lambda ?przed?'
      hu: 'A katalizátor elotti oxigénszonda feszültsége'
    type: 'uint'
    units: 'mV'

  PARTICLE_FILTER_SOOT_LOAD:
    bits: '10.7-11.0'
    comment:
      en: 'Particle filter soot load'
      fr: 'Charge en suie du filtre à particules'
      es: 'Carga de carbonilla en el filtro de partículas'
      de: 'Rußbelastung des Partikelfilters'
      pl: 'Napełnienie filtra cząstek stałych sadzą'
      hu: 'A légszűro koromterhelése'
    type: 'uint'
    factor: 0.001
    units: 'G/l'

  PARTICLE_FILTER_CLOGGING_LEVEL:
    bits: '12.7-12.0'
    comment:
      en: 'Particle filter clogging level'
      fr: 'Taux d''encrassement du filtre à particules'
      es: 'POrcentaje de obstrucción del filtro de partículas'
      de: 'Verrußungsrate des Partikelfilters'
      pl: 'Stopien zanieczyszczenia filtra czastek stalych'
      hu: 'A részecskeszűro elkormozódási mértéke'
    type: 'uint'
    units: '%'

  DISTANCE_REMAINING_UNTIL_PARTICLE_FILTER:
    bits: '13.7-15.0'
    comment:
      en: 'Distance remaining until particle filter cleaning or replacement'
      fr: 'Distance restante jusqu''au nettoyage ou changement du filtre à particules'
      es: 'Distancia restante hasta la limpieza o cambio del filtro de partículas'
      de: 'Verbleibende Strecke bis zur Reinigung oder zum Austausch des Partikelfilters'
      pl: 'Droga pozostala do momentu oczyszczania albo wymiany filtra czastek stalych'
      hu: 'A részecskeszűro tisztításáig vagy cseréjéig hátralévo távolság'
    type: 'uint'
    units: 'km'

  DIFFERENCE_PRESSURE_BETWEEN_PARTICULATE_EMISSION:
    bits: '16.7-17.0'
    alt_names: ['PARTICLE_FILTER_DIFFERENTIAL_PRESSURE']
    comment:
      en: 'Difference in pressure between particulate emission filter input/output'
      fr: 'Différence pression entrée/sortie filtre à particules'
      es: 'Diferencia de presión entrada/salida del filtro partículas'
      de: 'Druckdifferenz Eintritt/Austritt Partikelfilter'
      pl: 'Różnica ciśnienia wejście/wyjście filtra cząsteczek'
      hu: 'Részecskeszuro bemenet/kimenet közötti nyomáskülönbség'
    type: 'uint'
    units: 'mbar'

  VOLUME_ADDITIVE_ADDITIVE_TANK:
    bits: '18.7-19.0'
    comment:
      en: 'Volume of additive in the additive tank'
      fr: 'Volume d''additif du réservoir d''additif'
      es: 'Volumen de aditivo del depósito de aditivo'
      de: 'Additivvolumen des Additivtanks'
      pl: 'Objętość dodatku zbiornika dodatku'
      hu: 'Az adaléktartály mérete'
    type: 'uint'
    units: 'mL'

  AMOUNT_ADDITIVE_ADDITIVE_TANK:
    bits: '20.7-21.0'
    comment:
      en: 'Amount of additive in the additive tank'
      fr: 'Volume d''additif restant dans le réservoir d''additif'
      es: 'Volumen de aditivo restante en el depósito de aditivo'
      de: 'Menge von Additiv noch im Additivbehälter'
      pl: 'Objetosc dodatku pozostala w zbiorniku dodatku'
      hu: 'Az adalékanyagtartályban maradt adalékanyag mennyiség'
    type: 'uint'
    units: 'mL'

  TOTAL_QUANTITY_ADDITIVE_CONTAINED_PARTICLE:
    bits: '22.7-23.0'
    comment:
      en: 'Total quantity of additive contained in the particle filter'
      fr: 'Quantité totale d''additif contenue dans le filtre à particules'
      es: 'Cantidad total de aditivo contenida en el filtro de partículas'
      de: 'Gesamtadditivmenge im Partikelfilter'
      pl: 'Całkowita ilość dodatku zawarta w filtrze cząstek stałych'
      hu: 'A részecskeszűrőben lévő teljes adalékmennyiség'
    type: 'uint'
    units: 'g'

  CATALYTIC_CONVERTER_UPSTREAM_TEMPERATURE:
    bits: '24.7-25.0'
    alt_names: ['CAT_CONVERTER_UPSTREAM_TEMPERATURE']
    comment:
      en: 'Catalytic converter upstream temperature'
      fr: 'Température amont catalyseur'
      es: 'Temperatura antes del catalizador'
      de: 'Katalysator-Eintritts-Temperatur'
      pl: 'Temperatura przed katalizatorem'
      hu: 'Katalizátor elotti homérséklet'
    type: 'uint'
    units: '°C'

  TEMPERATURE_DOWNSTREAM_CATALYTIC_CONVERTER_OR:
    bits: '26.7-27.0'
    comment:
      en: 'Temperature downstream of the catalytic converter (or upstream of the particle filter)'
      fr: 'Température aval du catalyseur (ou amont FAP)'
      es: 'Temperatura en la parte posterior del catalizador (o anterior del FAP)'
      de: 'Temperatur nach dem Katalysator (oder vor dem Partikelfilter)'
      pl: 'Temperatura za katalizatorem (lub przed FAP)'
      hu: 'Katalizátor utáni (vagy FAP előtti) hőmérséklet'
    type: 'uint'
    units: '°C'

  ADDITIVE_LEVEL_STATUS:
    bits: '28.0'
    comment:
      en: 'Additive level status'
      fr: 'Etat du niveau d''additif'
      es: 'Estado del nivel de aditivo'
      de: 'Zustand des Additivstands'
      pl: 'Stan poziomu dodatku'
      hu: 'Adalékszint állapot'
    type: 'bool'
    values:
      0x00:
        en: 'Minimum level not reached'
        fr: 'Niveau minimum non atteint'
        es: 'Nivel mínimo no alcanzado'
        de: 'Mindeststand nicht erreicht'
        pl: 'Poziom minimum nieosiagniety'
        hu: 'Minimális szint nem kerül elérésre'
      0x01:
        en: 'Minimum level reached'
        fr: 'Niveau minimum atteint'
        es: 'Nivel mínimo alcanzado'
        de: 'Mindeststand erreicht'
        pl: 'Poziom minimalny osiągnięty'
        hu: 'Minimális szint elérve'

  PARTICLE_FILTER_REGENERATION_STATUS:
    bits: '28.3'
    comment:
      en: 'Particle filter regeneration status'
      fr: 'Etat de la régénération du filtre à particules'
      es: 'Estado de la regeneración del filtro de partículas'
      de: 'Zustand der regenerierung des Partikelfilters'
      pl: 'Stan regeneracji filtra cząstek stałych'
      hu: 'A légszűro regenerálásának állapota'
    type: 'bool'
    values:
      0x00:
        en: 'Not authorised'
        fr: 'Non autorisé'
        es: 'No autorizado'
        de: 'Nicht freigegeben'
        pl: 'Nie dopuszczony'
        hu: 'Nem engedélyezett'
      0x01:
        en: 'Authorised'
        fr: 'Autorisé'
        es: 'Autorizado'
        de: 'Freigegeben'
        pl: 'Dopuszczony'
        hu: 'Engedélyezett'

  DISTANCE_TRAVELLED_SINCE_LAST_REGENERATION:
    bits: '29.7-30.0'
    comment:
      en: 'Distance travelled since the last regeneration'
      fr: 'Distance parcourue depuis la dernière régénération'
      es: 'Distancia recorrida desde la última regeneración'
      de: 'Zurückgelegte Wegstrecke seit der letzten Regenerierung'
      pl: 'Odległość przebyta od ostatniej regeneracji'
      hu: 'Az utolsó regenerálás óta megtett távolság'
    type: 'uint'
    units: 'km'

  AVERAGE_DISTANCE_TRAVELLED_LAST_FIVE:
    bits: '31.7-32.0'
    comment:
      en: 'Average distance travelled for last five regenerations'
      fr: 'Distance moyenne parcourue pour les cinq dernières régénérations'
      es: 'Distancia media recorrida para las cinco últimas regeneraciones'
      de: 'Durchschnittlich zurückgelegte Strecke bei den letzten fünf Regenerierungen'
      pl: 'Średni przebieg dla ostatnich pięciu regeneracji'
      hu: 'Az utolsó öt felfrissítés között megtett átlagos távolság'
    type: 'uint'
    units: 'km'
