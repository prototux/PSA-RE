lid: 0xCD
name: 'LID_CD'
display_name:
  en: 'Data record 0xCD (11 values)'
  fr: 'Enregistrement 0xCD (11 valeurs)'
kind: 'other'
access: 'read'
length: 15

params:
  ENGINE_SPEED:
    bits: '1.7-2.0'
    alt_names: ['ENGINE_SPEED_2']
    comment:
      en: 'Engine speed'
      fr: 'Régime moteur'
      es: 'Régimen motor'
      de: 'Motordrehzahl'
      pl: 'Prędkość obrotowa silnika'
      hu: 'Motor fordulatszám'
    type: 'uint'
    units: 'rpm'

  VEHICLE_SPEED:
    bits: '3.7-3.0'
    comment:
      en: 'Vehicle speed'
      fr: 'Vitesse véhicule'
      es: 'Velocidad vehículo'
      de: 'Fahrtgeschwindigkeit'
      pl: 'Predkosc pojazdu'
      hu: 'Gépjárműsebesség'
    type: 'uint'
    units: 'km/h'

  COOLANT_TEMPERATURE:
    bits: '4.7-4.0'
    comment:
      en: 'Coolant temperature'
      fr: 'Température d''eau'
      es: 'Temperatura del agua'
      de: 'Kühlmitteltemperatur'
      pl: 'Temperatura płynu chłodzącego'
      hu: 'Hűtofolyadék-homérséklet'
    type: 'uint'
    offset: -50
    units: '°C'

  FAN_SPEED_1_SETTING:
    bits: '5.7-5.0'
    comment:
      en: 'Fan speed 1 setting'
      fr: 'Consigne vitesse GMV 1'
      es: 'Consigna velocidad GMV 1'
      de: 'Sollwert Geschwindigkeit Kühlerventilatorgruppe 1'
      pl: 'Wartosc zadana obrotów GMV 1'
      hu: '1 sebességű motor ventillátor csoport'
    type: 'uint'
    units: '%'

  MEASUREMENT_COOLING_FAN_SPEED_1:
    bits: '6.7-6.0'
    comment:
      en: 'Measurement of the cooling fan speed 1'
      fr: 'Mesure de vitesse du GMV 1'
      es: 'Medición de la velocidad GMV 1'
      de: 'Messung Geschwindigkeit Kühlerventilatorgruppe 1'
      pl: 'Pomiar prędkości GMV 1'
      hu: 'Motorhűtőventilátor-egység sebesség mérése 1'
    type: 'uint'
    units: '%'

  CONSIGNEGMV2:
    bits: '7.7-7.0'
    type: 'enum'

  AIR_CONDITIONING_STATE:
    bits: '9.1-9.0'
    comment:
      en: 'Air conditioning state'
      fr: 'Etat climatisation'
      es: 'Estado de la climatización'
      de: 'Zustand Klimaanlage'
      pl: 'Stan klimatyzacji'
      hu: 'Légkondícionálás állapot'
    type: 'enum'
    values:
      0x00:
        en: 'No request for air conditioning'
        fr: 'Pas de demande climatisation'
        es: 'No hay petición de climatización'
        de: 'Keine Anforderung Klimaanlage'
        pl: 'Brak żądania klimatyzacji'
        hu: 'Nincs klimatizálás kérés'
      0x01:
        en: 'Air conditioning request : Authorisation refused by the engine ECU'
        fr: 'Demande climatisation : Autorisation refusée par le calculateur moteur'
        es: 'Demanda de climatización : Autorización rechazada por el calculador motor'
        de: 'Anforderung Klimaanlage : Vom Motorsteuergerät abgelehnte Freigabe'
        pl: 'Żądanie klimatyzacji : Autoryzacja odrzucona przez kalkulator silnika'
        hu: 'Légkondícionálás utasítás : A befecskendezés computer által visszautasított engedélyezés'
      0x02:
        en: 'No request for air conditioning'
        fr: 'Pas de demande climatisation'
        es: 'No hay petición de climatización'
        de: 'Keine Anforderung Klimaanlage'
        pl: 'Brak żądania klimatyzacji'
        hu: 'Nincs klimatizálás kérés'
      0x03:
        en: 'Air conditioning request : Authorisation given by the engine ECU'
        fr: 'Demande climatisation : Autorisation fournie par le calculateur moteur'
        es: 'Demanda de climatización : Autorización proporcionada por el calculador motor'
        de: 'Anforderung Klimaanlage : Vom Motor gelieferte Freigabe'
        pl: 'Żądanie klimatyzacji : Autoryzacja dostarczona przez kalkulator silnika'
        hu: 'Légkondícionálás utasítás : A befecskendezés computer által szolgáltatott engedélyezés'

  AIR_CONDITIONING_CIRCUIT_PRESSURE:
    bits: '10.7-11.0'
    comment:
      en: 'Air conditioning circuit pressure'
      fr: 'Pression du circuit de climatisation'
      es: 'Presión del circuito de climatización'
      de: 'Kältemitteldruck der Klimaanlage'
      pl: 'Ciśnienie obwodu klimatyzacji'
      hu: 'Klímakör nyomása'
    type: 'uint'
    factor: 0.1
    units: 'bar'

  OIL_PRESSURE_SWITCH_MEASUREMENT:
    bits: '12.7-12.0'
    comment:
      en: 'Oil pressure switch measurement'
      fr: 'Mesure du manocontact pression d''huile'
      es: 'Medida del manocontacto de presión de aceite'
      de: 'Messung des Öldruckschalters'
      pl: 'Pomiar czujnika ciśnienia oleju'
      hu: 'Olajnyomás-kapcsoló mérése'
    type: 'enum'
    values:
      0x00:
        en: 'Oil pressure OK'
        fr: 'Pression d''huile OK'
        es: 'Presión de aceite OK'
        de: 'Öldruck OK'
        pl: 'Ciśnienie oleju OK'
        hu: 'Olajnyomás OK'
      0x01:
        en: 'Insufficient oil pressure'
        fr: 'Pression d''huile insuffisante'
        es: 'Presión de aceite insuficiente'
        de: 'Öldruck zu niedrig'
        pl: 'Ciśnienie oleju niewystarczające'
        hu: 'Elégtelen olajnyomás'

  OIL_TEMPERATURE_MEASURED:
    bits: '13.7-13.0'
    comment:
      en: 'Oil temperature measured'
      fr: 'Température d''huile mesurée'
      es: 'Temperatura de aceite medido'
      de: 'Gemessene Öltemperatur'
      pl: 'Temperatura oleju zmierzona'
      hu: 'Olaj mért hőmérséklete'
    type: 'uint'
    offset: -50
    units: '°C'

  OIL_LEVEL_SENSOR_VOLTAGE:
    bits: '14.7-15.0'
    comment:
      en: 'Oil level sensor voltage'
      fr: 'Tension du capteur de niveau d''huile'
      es: 'Tensión del captador de nivel de aceite'
      de: 'Spannung des Ölstandsensors'
      pl: 'Napięcie czujnika poziomu oleju'
      hu: 'Olajszint érzékelő feszültsége'
    type: 'uint'
    units: 'mV'
