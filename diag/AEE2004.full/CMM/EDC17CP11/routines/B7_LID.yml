routine: 0xB7
name: 'FORCED_REGENERATION_VEHICLE_MOVING'
display_name:
  en: 'Forced regeneration vehicle moving'
  fr: 'Régénération forcée véhicule roulant'
  es: 'Regeneración forzada vehículo circulando'
  de: 'Erzwungene Regenerierung bei fahrendem Fahrzeug'
  pl: 'Wymuszona regeneracja podczas jazdy'
  hu: 'Gépjármű kényszerített regenerálása menet közben'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  CONTROL_PARAMETER_1:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x00

  RESERVED:
    bits: '2.7-2.0'
    unused: true

results:
  RESULT_ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Result of the actuator test'
      fr: 'Résultat du test actionneur'
      es: 'Resultado del test accionador'
      de: 'Resultat des Stellgliedtests'
      pl: 'Wynik testu elementu wykonawczego'
      hu: 'Beavatkozószerv-teszt eredménye'
    type: 'enum'
    values:
      0x00:
        en: 'Forced regeneration not carried out'
        fr: 'Régénération forcée non effectuée'
        es: 'Regeneración forzad no efectuada'
        de: 'Erzwungene Regenerierung nicht durchgeführt'
        pl: 'Regeneracja wymuszona nie wykonana'
        hu: 'Kényszerített regenerálás nincs elvégezve'
      0x01:
        en: 'Forced regeneration in progress'
        fr: 'Régénération forcée en cours'
        es: 'Regeneración forzada en curso'
        de: 'Erzwungene Regenerierung läuft'
        pl: 'Regeneracja wymuszona w trakcie'
        hu: 'Kényszerített regenerálás folyamatban'
      0x02:
        en: 'Under parameter measurements, check that the particle emission filter soot load is equal to 0%.'
        fr: 'Contrôler en mesures paramètres que la charge du filtre à particules en suies est égale à 0%.'
        es: 'Controlar el medidasparámetros que la carga del filtro de partículas en hollín es igual a 0%.'
        de: 'In Parametermessungen kontrollieren, ob die Rußbelastung des Partikelfilters gleich 0 % ist.'
        pl: 'Sprawdzić w pomiarach parametrów czy ilość sadzy w FAP wynosi 0%.'
        hu: 'Ellenőrizze a paraméterek mérésében, hogy a részecskeszűrő korommal történő telítődése egyenlő a 0%-kal.'
      0x04:
        en: 'Forced regeneration complete but problem'
        fr: 'Régénération forcée terminée mais problème'
        es: 'Regeneración forzada terminmada pero problema'
        de: 'Erzwungene Regenerierung beendet, jedoch Problem'
        pl: 'Regeneracja wymuszona zakończona, ale wystąpił problem'
        hu: 'Kényszerített regenerálás befejezve de probléma'
      0x11:
        en: 'Action stopped by the operator'
        fr: 'Action arrêtée par l''opérateur'
        es: 'Acción detenida por el operario'
        de: 'Vorgang vom Techniker beendet'
        pl: 'Działanie zatrzymane przez operatora'
        hu: 'A technikus által leállított működés'

