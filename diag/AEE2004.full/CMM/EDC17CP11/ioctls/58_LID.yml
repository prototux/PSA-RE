  fr: 'Test GMV'
  es: 'Test GMV'
  de: 'Test Kühlerventilator'
  pl: 'Test GMV'
  hu: 'Motorventilátor egység teszt'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
