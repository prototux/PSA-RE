node: 'CMM'
model: 'EDC17CP11'
display_name:
  en: 'Engine control unit (EDC17CP11)'
  fr: 'Calculateur moteur multifonction (EDC17CP11)'
protocols: ['KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'KWP-PSA2000'
    request_id: 0x6A8
    response_id: 0x688
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'KWP-PSA2000'
    request_id: 0x6A8
    response_id: 0x688

resets:
  0x81:
    en: 'Reset 0x81'
    fr: 'Réinitialisation 0x81'
  0x91:
    en: 'Reset 0x91'
    fr: 'Réinitialisation 0x91'
  0xA0:
    en: 'Reset 0xA0'
    fr: 'Réinitialisation 0xA0'
  0xAD:
    en: 'Reset 0xAD'
    fr: 'Réinitialisation 0xAD'
  0xAE:
    en: 'Reset 0xAE'
    fr: 'Réinitialisation 0xAE'
  0xB0:
    en: 'Reset 0xB0'
    fr: 'Réinitialisation 0xB0'
  0xB1:
    en: 'Reset 0xB1'
    fr: 'Réinitialisation 0xB1'
  0xB2:
    en: 'Reset 0xB2'
    fr: 'Réinitialisation 0xB2'

services: [0x11, 0x14, 0x17, 0x21, 0x27, 0x30, 0x31, 0x32, 0x34, 0x3E, 0x81, 0x82]

security_access:
  - level: 0x83
    algorithm: 'PSA_SEED_KEY'
    key: '0714'

tester_present:
  request: '3E'
  period_ms: 1000

identification:
  request: '21 FE'
  part_number: '22.7-24.0'
  comment:
    en: 'The ECU part number is in data bytes 22 to 24 of the answer to 21 FE (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 22 à 24 de la réponse à 21 FE (DCB), elle donne la variante logicielle'

cars: ['D2', 'X6', 'X7']

