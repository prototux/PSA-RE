routine: 0xC3
name: 'RE_INITIALISATION_HEAT_PROTECTION_MOTORISED'
display_name:
  en: 'Re-initialisation of the heat protection of the motorised tailgate closing assistance module'
  fr: 'Réinitialisation de la protection thermique du module d''assistance de fermeture du volet de coffre motorisé'
  es: 'Reinicialización de la protección térmica del módulo de asistencia de cierre del portón de maletero motorizado'
  de: 'Neuinitialisierung des thermischen Schutzes des Moduls Unterstützung beim Schließen der motorisierten Kofferraumklappe'
  pl: 'Reinicjalizacja zabezpieczenia termicznego modułu wspomagania zamykania klapy bagażnika z napędem'
  hu: 'Motoros hajtású csomagtartó fedél zárás asszisztens modul hővédelmének újrainicializálása'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
variants: ['W2_*', 'X7_*']
control: ['start']

