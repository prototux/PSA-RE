ioctl: 0xC0
name: 'MOTORISED_STRIKER_PLATE_CONTROL'
display_name:
  en: 'Motorised striker plate control'
  fr: 'Pilotage de la gâche motorisée'
  es: 'Pilotaje del cierre motorizado'
  de: 'Ansteuerung des motorisierten Schließkeils'
  pl: 'Sterowanie rygla napedzanego'
  hu: 'A motorral mozgatott zárókapocs vezérlése'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'
variants: ['W2_*', 'X7_*']

params:
  CONTROL_PARAMETER_1:
    bits: '1.7-1.0'
    type: 'enum'

  CONTROL_PARAMETER_2:
    bits: '2.7-2.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Motorised striker plate control'
      fr: 'Pilotage de la gâche motorisée'
      es: 'Pilotaje del cierre motorizado'
      de: 'Ansteuerung des motorisierten Schließkeils'
      pl: 'Sterowanie rygla napedzanego'
      hu: 'A motorral mozgatott zárókapocs vezérlése'
    max_duration_ms: 12000
  - display_name:
      en: 'Motorised tailgate closing switch lighting output control'
      fr: 'Pilotage de l''éclairage du contacteur de fermeture du volet motorisé'
      es: 'Pilotaje de la iluminación del contactor de cierre del porton motorizado'
      de: 'Ansteuerung der Beleuchtung des Schließschalters der motorisierten Klappe'
      pl: 'Sterowanie oswietlenia przycisku zamykania klapy napedzanej'
      hu: 'A motorizált csomagtartó fedél záráskapcsolója megvilágításának vezérlése'
    max_duration_ms: 5000
