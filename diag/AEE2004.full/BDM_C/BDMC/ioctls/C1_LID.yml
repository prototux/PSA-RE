ioctl: 0xC1
name: 'TOP_SEAT_BACK_REARWARD_INCLINATION'
display_name:
  en: 'Top of seat back rearward inclination'
  fr: 'Inclinaison du haut de dossier vers l''arrière'
  es: 'Inclinación de la parte superior de respaldo hacia atrás'
  de: 'Neigung Lehnenoberteil nach hinten'
  pl: 'Pochylanie góry oparcia do tyłu'
  hu: 'Háttámla felso rész hátradöntése'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER_1:
    bits: '1.7-1.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Top of seat back rearward inclination'
      fr: 'Inclinaison du haut de dossier vers l''arrière'
      es: 'Inclinación de la parte superior de respaldo hacia atrás'
      de: 'Neigung Lehnenoberteil nach hinten'
      pl: 'Pochylanie góry oparcia do tyłu'
      hu: 'Háttámla felso rész hátradöntése'
    max_duration_ms: 5000
  - display_name:
      en: 'Tilt top of seatback backwards'
      fr: 'Inclinaison du haut du dossier vers l''arrière'
      es: 'Inclinación de la parte superior del respaldo hacia atrás'
      de: 'Schrägstellen der Rückenlehne oben nach hinten'
      pl: 'Pochylanie górnej części oparcia do tyłu'
      hu: 'A háttámla felső részének hátradöntése'
    max_duration_ms: 5000
  - display_name:
      en: 'Backward movement of the rapid slide'
      fr: 'Recul de la glissière rapide'
      es: 'Retroceso de la corredera rápido'
      de: 'Rasche Rückstellung der Schiene'
      pl: 'Szybkie cofnięcie prowadnicy'
      hu: 'A csúszósín gyors hátratolása'
    max_duration_ms: 5000
