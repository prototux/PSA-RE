comment:
  en: 'Defines the status of the volume reduction when the engine is stopped function on vehicles that have the "Stop And Start" function.'
  fr: 'Définit l''état de la fonction de réduction du volume sonore lors de l''arrêt moteur des véhicules équipés de la fonction "Stop And Start".'
  es: 'Define el estado de la función de disminución del volumen durante la parada del motor en los vehículos equipados con la función "Stop and Start".'
  de: 'Definiert den Zustand der Funktion Lautstärkeverringerung bei Ausschalten des Motors von Fahrzeugen mit der Funktion "Stop And Start".'
  pl: 'Określa stan funkcji zmniejszenia siły głosu w czasie zatrzymania silnika samochodów wyposażonych w funkcję "Stop And Start".'
  hu: 'A "Stop And Start" funkcióval felszerelt gépjárművek motorleállítása során működő hangerő csökkentési funkció állapotát határozza meg.'
