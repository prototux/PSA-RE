did: 0xF190
name: 'VIN'
display_name:
  en: 'Vehicle identification number'
  fr: 'Numéro d''identification du véhicule'
comment:
  en: 'Allows the modification of the VIN entered in the audio system (which must be identical to that contained in the built-in systems interface.'
  fr: 'Permet de modifier le code VIN saisi dans l''autoradio (qui doit être identique à celui contenu dans le Boîtier de Servitude Intelligent).'
  es: 'Permite modificar el código VIN capturado en el autorradio (que debe ser idéntico al contenido en la Caja de Servicio Inteligente).'
  de: 'Ermöglicht die Veränderung der im Autoradio eingegebenen VIN (die mit der in der Zentralschalteinheit BSI gespeicherten Nummer identisch sein muss).'
  pl: 'Pozwala zmienić kod VIN wprowadzony do autoradia (który powinien być identyczny z zapisanym w BSI).'
  hu: 'Lehetővé teszi az autórádióba bevitt VIN-kód módosítását (amelynek azonosnak kell lennie az intelligens kiszolgálóegységben lévővel).'
kind: 'identification'
access: 'read-write'
length: 17

