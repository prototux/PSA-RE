ioctl: 0xE003
name: 'SOUNDING_BLEEP_FRONT_RIGHT_SPEAKER'
display_name:
  en: 'Sounding of a bleep : front right speaker'
  fr: 'Émission d''un bip sonore : haut-parleur avant droit'
  es: 'Emisión de un bip sonoro : altavoz delantero derecho'
  de: 'Ausgabe eines Signaltons : lautsprecher vorne rechts'
  pl: 'Wydanie dzwieku bip : prawy przedni głośnik'
  hu: 'Egy hangjel kerl kibocs t sra : jobb első hangszóró'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

  SETPOINT_2:
    bits: '3.7-3.0'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x03:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x04:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Sounding of a bleep : front right speaker'
      fr: 'Émission d''un bip sonore : haut-parleur avant droit'
      es: 'Emisión de un bip sonoro : altavoz delantero derecho'
      de: 'Ausgabe eines Signaltons : lautsprecher vorne rechts'
      pl: 'Wydanie dzwieku bip : prawy przedni głośnik'
      hu: 'Egy hangjel kerl kibocs t sra : jobb első hangszóró'
    max_duration_ms: 1000
