node: 'RAD'
model: 'RD6_CN'
display_name:
  en: 'Radio (RD6_CN)'
  fr: 'Autoradio (RD6_CN)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x760
    response_id: 0x660
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'

resets:
  0x01:
    en: 'Hard reset'
    fr: 'Réinitialisation matérielle'

services: [0x10, 0x11, 0x14, 0x19, 0x22, 0x27, 0x28, 0x2A, 0x2C, 0x2E, 0x2F, 0x31, 0x34, 0x36, 0x37, 0x3E, 0x85, 0x86]

security_access:
  - level: 0x01
  - level: 0x03
  - level: 0x05

tester_present:
  request: '3E 00'
  period_ms: 1000

identification:
  request: '22 F0 80'
  part_number: '8.7-12.0'
  comment:
    en: 'The ECU part number is in data bytes 8 to 12 of the answer to 22 F0 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 8 à 12 de la réponse à 22 F0 80 (DCB), elle donne la variante logicielle'

cars: ['B7', 'M33', 'T9']

variants:
  B7_V1:
    parts: ['9816904080']
    cars: ['B7']
  M3_M4_V1:
    parts: ['9819241777']
    cars: ['M33']
  M3_M4_V2:
    parts: ['9826693177']
    cars: ['M33']
  M3_M4_V3:
    parts: ['9834655077']
    cars: ['M33']
  T9_V1:
    parts: ['9818097580']
    cars: ['T9']
