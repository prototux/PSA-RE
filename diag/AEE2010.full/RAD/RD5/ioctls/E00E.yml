ioctl: 0xE00E
name: 'FORCED_DISCONNECTION_PAIRED_BLUETOOTH_DEVICE'
display_name:
  en: 'Forced disconnection of a paired Bluetooth device'
  fr: 'Déconnexion forcée d''un appareil Bluetooth appairé'
  es: 'Desconexión forzada de un dispositivo Bluetooth acoplado'
  de: 'Erzwungene Trennung von einem zugeordneten Bluetooth-Gerät'
  pl: 'Rozłączenie wymuszone skojarzonego urządzenia Bluetooth'
  hu: 'Egy párosított Bluetooth készülék kényszerített elcsatolása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_3:
    bits: '2.7-3.0'
    type: 'enum'

  SETPOINT_5:
    bits: '4.7-4.0'
    type: 'enum'
    default: 0x00

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x03:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x04:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Forced disconnection of a paired Bluetooth device'
      fr: 'Déconnexion forcée d''un appareil Bluetooth appairé'
      es: 'Desconexión forzada de un dispositivo Bluetooth acoplado'
      de: 'Erzwungene Trennung von einem zugeordneten Bluetooth-Gerät'
      pl: 'Rozłączenie wymuszone skojarzonego urządzenia Bluetooth'
      hu: 'Egy párosított Bluetooth készülék kényszerített elcsatolása'
    max_duration_ms: 10000
  - display_name:
      en: 'Forced connection of bluetooth equipment'
      fr: 'Connexion forcée d''un appareil Bluetooth'
      es: 'Conexión forzada de un aparato bluetooth'
      de: 'Erzwungener Anschluss eines Bluetoothgeräts'
      pl: 'Połączenie wymuszone aparatu Bluetooth'
      hu: 'Egy bluetooth készülék kényszerített csatlakozása'
    max_duration_ms: 30000
