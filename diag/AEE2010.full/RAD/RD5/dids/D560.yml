  fr: 'Permet de savoir si le module Bluetooth est appairé avec un autre appareil équipé d''un module Bluetooth.'
  es: 'Permite saber si el módulo Bluetooth está vinculado a otro aparato equipado con un módulo Bluetooth.'
  de: 'Gibt an, ob das Modul Bluetooth an ein anderes Gerät mit dem Modul Bluetooth angeglichen wurde.'
  pl: 'Pozwala wiedzieć czy moduł Bluetooth jest zsynchronizowany z innym aparatem wyposażonym w moduł Bluetooth.'
  hu: 'Lehetővé teszi annak megismerését, hogy a Bluetooth modul párosítva van egy másik Bluetooth modullal felszerelt készülékkel.'
kind: 'live'
access: 'read'
