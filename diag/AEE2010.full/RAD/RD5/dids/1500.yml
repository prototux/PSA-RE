comment:
  en: 'Defines the frequency bands and search step per geographic zone :- Western Europe: France, Germany, UK, Italy, Spain, Portugal, etc - JAPAN - Latin America : Brazil, Argentina,Mexico. - Asia: India, Indonesia, Malaysia, etc; Bosnia-Herzegovina, Bulgaria, Croatia, Czech Republic, Estonia, Hungary, Latvia, Lithuania, Macedonia, Moldavia, Poland, Romania, Slovakia, Slovenia, Ukraine, Yugoslavia; Australia .. - USA - Saudi Arabia : Saudi Arabia - China'
  fr: 'Définit les bandes de fréquences et pas de recherche par zones géographiques :- Europe de l''Ouest : France, Allemagne, Angleterre, Italie, Espagne, Portugal... - Japon - Amérique latine : Brésil, Argentine,Mexique. - Asie : Inde, Indonésie, Malaisie... ; Bosnie-Herzégovine, Bulgarie, Croatie, Tchéquie, Estonie, Hongrie, Lettonie, Lituanie, Macédoine, Moldavie, Pologne, Roumanie, Slovaquie, Slovénie, Ukraine, Yougoslavie ; Australie .. - USA - Arabie : Arabie Saoudite - Chine'
  es: 'Define las bandas de frecuencias y no efectúa búsqueda por zonas geográficas :- Europa Occidental : Francia, Alemania, Inglaterra, Italia, España, Portugal€ - JAPON - América latina : Brasil, Argentina,Méjico. - Asia: India, Indonesia, Bosnia-Herzegobina, Bulgaria, Crroacia, Chequia, Estonia, Hungría, Letonia, Lituania, Macedonia, Moldavia, Polonia, Rumanía, Eslovaquia, Eslovenia, Ucrania, Yugoslavia; Australia .. - USA - Arabia : Arabia Saudita - China'
  de: 'Definiert die Frequenzbänder und Suchläufe nach geographischen Bereichen :- Westeuropa: Frankreich, Deutschland, England, Italien, Spanien, Portugal - Japan - Lateinamerika : Brasilien, Argentinien,Mexiko. - Asien: India, Indonesien, Malaysia€; Bosnien-Herzegowina, Bulgarien, Kroatien, Tcheschien, Estonien, Ungarn, Lettland, Litauen, Mazedonien, Moldau, Polen, Rumänien, Slowakei, Slowenien, Ukraine, Jugoslawien; Australien .. - USA - Arabien : Saudi-Arabien - China'
  pl: 'Wyznacza pasma częstotliwości i krok wyszukiwania według stref :- Europa Zachodnia: Francja, Niemcy, Anglia, Włochy, Hiszpania, Portugalia - japonia - Ameryka łacińska : brazylia, Argentyna,Meksyk. - Azja: Indie, Indonezja, Malezja; Bośnia-Hercegowina, Bułgaria, Chorwacja, Czechy, Estonia, Węgry, Łotwa, Litwa, Macedonia, Mołdawia, Polska, Rumunia, Słowacja, Słowenia, Ukraina, Jugosławia; Australia .. - USA - Bliski Wschód : Arabia Saudyjska - Chiny'
  hu: 'Meghatározza a frekvenciatartományokat és nincs földrajzi zónák szerinti keresés :- Nugat-Európa : Franciaország, Németország, Anglia, Olaszország, Spanyolország, Portugália - Jap n - Latin-Amerika : Brazília, Argentína,Mexico. - Azsia: India, Indonézia, Malajzia... ; Bosznia-Hercegovina, Bulgária, Horvátország, Csehország, Észtország, Magyarország, Lettország, Litvánia, Macedónia, Moldávia, Lengyelország, Románia, Szlovákia, Szlovénia, Ukrajna, Jugoszlávia; Ausztrália .. - USA - Arábia : Szaúd-Arábia - Kína'
