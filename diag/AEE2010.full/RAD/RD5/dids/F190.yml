did: 0xF190
name: 'VIN'
display_name:
  en: 'Vehicle identification number'
  fr: 'Numéro d''identification du véhicule'
comment:
  en: 'Reads the VIN entered in the audio system (which must be identical to that contained in the built-in systems interface). Prsence de lettres en minuscule dans le numro de srie du vhicule (VIN) saisi WARNING The VIN of a vehicle must always consist of upper case letters.'
  fr: 'Permet de lire le code VIN saisi dans l''autoradio (qui doit être identique à celui contenu dans le Boîtier de Servitude Intelligent). Prsence de lettres en minuscule dans le numro de srie du vhicule (VIN) saisi ATTENTION : Le numéro de série d''un véhicule (VIN) doit toujours être composé de lettres en majuscule.'
  es: 'Permite leer el código VIN capturado en el autorradio (que debe ser idéntico al contenido en la Caja de Servicio Inteligente). Prsence de lettres en minuscule dans le numro de srie du vhicule (VIN) saisi ATENCIÓN : El número de serie de un vehículo (VIN) siempre debe estar compuesto por letras mayúsculas.'
  de: 'Ermöglicht die Auslesung der im Autoradio eingegebenen VIN (muss mit der in der Zentralschalteinheit BSI gespeicherten Nummer identisch sein). Prsence de lettres en minuscule dans le numro de srie du vhicule (VIN) saisi ACHTUNG Die VIN muss immer aus Großbuchstaben zusammengesetzt werden.'
  pl: 'Pozwala odczytać kod VIN wprowadzony do autoradia (który powinien być identyczny z zapisanym w BSI). Prsence de lettres en minuscule dans le numro de srie du vhicule (VIN) saisi UWAGA Numer seryjny pojazdu (VIN) powinien zawsze składać się z dużych liter.'
  hu: 'Lehetővé teszi az autórádióba bevitt VIN-kód leolvasását (amelynek azonosnak kell lennie az intelligens kiszolgálóegységben lévővel). Prsence de lettres en minuscule dans le numro de srie du vhicule (VIN) saisi FIGYELEM A gépjármű szériaszámának (VIN) mindig nagybetűkből kell lennie.'
kind: 'identification'
access: 'read-write'
length: 17

params:
  VIN:
    bits: '1.7-17.0'
    comment:
      en: 'VIN'
      fr: 'Numéro de série du véhicule - code VIN'
      es: 'Número de serie del vehículo - código VIN'
      de: 'VIN'
      pl: 'Numer seryjny pojazdu - kod VIN'
      hu: 'A gépjármu gyártási száma - VIN kód (alvázszám)'
    type: 'str'
