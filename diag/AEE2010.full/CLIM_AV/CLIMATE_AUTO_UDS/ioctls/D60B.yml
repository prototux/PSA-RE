ioctl: 0xD60B
name: 'PASSENGER_COMPARTMENT_AIR_BLOWER_REAR'
display_name:
  en: 'Passenger compartment air blower rear'
  fr: 'Pulseur d''air habitacle arrière'
  es: 'Impulsion de aire habitáculo trasero'
  de: 'Gebläse Innenraumluft hinten'
  pl: 'Dmuchawa do tyłu'
  hu: 'Utastéri légbefúvó Hátsó'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Passenger compartment air blower rear'
      fr: 'Pulseur d''air habitacle arrière'
      es: 'Impulsion de aire habitáculo trasero'
      de: 'Gebläse Innenraumluft hinten'
      pl: 'Dmuchawa do tyłu'
      hu: 'Utastéri légbefúvó Hátsó'
    max_duration_ms: 5000
  - display_name:
      en: 'Passenger compartment rear air blower only at 50 %'
      fr: 'Pulseur d''air habitacle arrière uniquement à 50 %'
      es: 'Impulsor de aire del habitáculo trasero únicamente al 50 %'
      de: 'Luftgebläse Innenraum hinten ausschließlich bei 50 %'
      pl: 'Tylna dmuchawa powietrza w kabinie wyłącznie na 50 %'
      hu: 'Hátsó utastéri levegő levegőbefúvó ventilátor csupán 50 %-on'
    max_duration_ms: 5000
