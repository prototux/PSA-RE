ioctl: 0xD401
name: 'SWITCHING_OFF_ALL_SEGMENTS'
display_name:
  en: 'Switching off of all the segments'
  fr: 'Extinction de tous les segments'
  es: 'Apagado de todos los segmentos'
  de: 'Ausschalten sämtlicher Segmente'
  pl: 'Zgaszenie wszystkich segmentów'
  hu: 'Az összes szegmens kialvása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x1E

  PRECISION_2:
    bits: '3.7-3.0'
    type: 'enum'
    default: 0x00

results:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Switching off of all the segments'
      fr: 'Extinction de tous les segments'
      es: 'Apagado de todos los segmentos'
      de: 'Ausschalten sämtlicher Segmente'
      pl: 'Zgaszenie wszystkich segmentów'
      hu: 'Az összes szegmens kialvása'
    max_duration_ms: 10000
  - display_name:
      en: 'Control of all the segments'
      fr: 'Pilotage de tous les segments'
      es: 'Pilotaje de todos los segmentos'
      de: 'Steuerung sämtlicher Segmente'
      pl: 'Pilotowanie wszystkich segmentów'
      hu: 'Az összes szegmens vezérlése'
    max_duration_ms: 10000
