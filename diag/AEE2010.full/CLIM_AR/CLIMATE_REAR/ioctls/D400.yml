ioctl: 0xD400
name: 'SWITCHING_OFF_ALL_WARNING_LIGHTS'
display_name:
  en: 'Switching off of all of the warning lights'
  fr: 'Extinction de tous les témoins'
  es: 'Extinción de todos los testigos'
  de: 'Erlöschen aller Kontrollleuchten'
  pl: 'Zgaśnięcie wszystkich kontrolek'
  hu: 'Az összes visszajelzés kialvása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT:
    bits: '2.7-2.0'
    type: 'enum'

  PRECISION:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Switching off of all of the warning lights'
      fr: 'Extinction de tous les témoins'
      es: 'Extinción de todos los testigos'
      de: 'Erlöschen aller Kontrollleuchten'
      pl: 'Zgaśnięcie wszystkich kontrolek'
      hu: 'Az összes visszajelzés kialvása'
    max_duration_ms: 10000
  - display_name:
      en: 'Lighting of all of the warning lamps in day mode'
      fr: 'Allumage de tous les témoins en mode jour'
      es: 'Encendido de todos los testigos en modo día'
      de: 'Einschalten sämtlicher Kontrollleuchten im Modus Tag'
      pl: 'Zapalenie wszystkich kontrolek w trybie dzień'
      hu: 'Az összes visszajelzés nappali üzemmódban történő bekapcsolása'
    max_duration_ms: 10000
  - display_name:
      en: 'Lighting of all of the warning lamps in night mode'
      fr: 'Allumage de tous les témoins en mode nuit'
      es: 'Encendido de todos los testigos en modo noche'
      de: 'Einschalten sämtlicher Kontrollleuchten im Modus Nacht'
      pl: 'Zapalenie wszystkich kontrolek w trybie noc'
      hu: 'Az összes visszajelzés éjszakai üzemmódban történő bekapcsolása'
    max_duration_ms: 10000
