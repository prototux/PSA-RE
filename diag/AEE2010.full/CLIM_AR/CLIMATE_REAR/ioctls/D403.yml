ioctl: 0xD403
name: 'ACTIVATION_DISPLAY_COLOUR_LEVEL'
display_name:
  en: 'Activation of the display colour level'
  fr: 'Activation du niveau de couleur de l''afficheur'
  es: 'Activación del nivel de color de la pantalla'
  de: 'Aktivierung Farbniveau der Anzeige'
  pl: 'Aktywacja poziomu koloru wyświetlacza'
  hu: 'A kijelző szín szintjének aktiválása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x04

  PRECISION_2:
    bits: '3.7-3.0'
    type: 'enum'
    default: 0x00

results:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Activation of the display colour level'
      fr: 'Activation du niveau de couleur de l''afficheur'
      es: 'Activación del nivel de color de la pantalla'
      de: 'Aktivierung Farbniveau der Anzeige'
      pl: 'Aktywacja poziomu koloru wyświetlacza'
      hu: 'A kijelző szín szintjének aktiválása'
    max_duration_ms: 2000
