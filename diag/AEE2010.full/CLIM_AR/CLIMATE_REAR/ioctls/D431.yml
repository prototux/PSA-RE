ioctl: 0xD431
name: 'ACTIVATION_LIGHTING_AIR_CONDITIONING_CONTROL'
display_name:
  en: 'Activation of the lighting of the air conditioning control panel buttons'
  fr: 'Activation de l''éclairage des touches du tableau de climatisation'
  es: 'Activación de la iluminación de las teclas del panel de climatización'
  de: 'Aktivierung der Beleuchtung der Tasten am Bedienfeld der Klimaanlage'
  pl: 'Aktywacja oświetlenia przycisków panelu klimatyzacji'
  hu: 'Klímaberendezés vezérlőtábla gombok világításának aktiválása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x04

  PRECISION_2:
    bits: '3.7-3.0'
    type: 'enum'
    default: 0x00

results:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Activation of the lighting of the air conditioning control panel buttons'
      fr: 'Activation de l''éclairage des touches du tableau de climatisation'
      es: 'Activación de la iluminación de las teclas del panel de climatización'
      de: 'Aktivierung der Beleuchtung der Tasten am Bedienfeld der Klimaanlage'
      pl: 'Aktywacja oświetlenia przycisków panelu klimatyzacji'
      hu: 'Klímaberendezés vezérlőtábla gombok világításának aktiválása'
    max_duration_ms: 2000
