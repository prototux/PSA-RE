ioctl: 0xD402
name: 'ACTIVATION_LIGHTING_RHEOSTAT_LEVEL'
display_name:
  en: 'Activation of the lighting rheostat level'
  fr: 'Activation du niveau rhéostat éclairage'
  es: 'Activación del nivel del reóstato de iluminación'
  de: 'Aktivierung Niveau Helligkeitsregler Beleuchtung'
  pl: 'Aktywacja poziomu podświetlenia'
  hu: 'Megvilágítás szabályozó potenciométer szintjének aktiválása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x04

  PRECISION_2:
    bits: '3.7-3.0'
    type: 'enum'
    default: 0x00

results:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Activation of the lighting rheostat level'
      fr: 'Activation du niveau rhéostat éclairage'
      es: 'Activación del nivel del reóstato de iluminación'
      de: 'Aktivierung Niveau Helligkeitsregler Beleuchtung'
      pl: 'Aktywacja poziomu podświetlenia'
      hu: 'Megvilágítás szabályozó potenciométer szintjének aktiválása'
    max_duration_ms: 2000
