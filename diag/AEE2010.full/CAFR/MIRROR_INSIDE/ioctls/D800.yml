ioctl: 0xD800
name: 'DARKENING_ELECTROCHROMATIC_INTERIOR_MIRROR'
display_name:
  en: 'Darkening of the electrochromatic interior mirror'
  fr: 'Obscurcissement du rétroviseur intérieur électrochrome'
  es: 'Oscurecimiento del retrovisor interior electrocromo'
  de: 'Verdunklung des automatisch abblendenden Innenspiegels'
  pl: 'Przyciemnienie wewnętrznego lusterka wstecznego elektrochromatycznego'
  hu: 'Elektrokrómozott belső visszapillantó elsötétülése'
controls:
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Darkening of the electrochromatic interior mirror'
      fr: 'Obscurcissement du rétroviseur intérieur électrochrome'
      es: 'Oscurecimiento del retrovisor interior electrocromo'
      de: 'Verdunklung des automatisch abblendenden Innenspiegels'
      pl: 'Przyciemnienie wewnętrznego lusterka wstecznego elektrochromatycznego'
      hu: 'Elektrokrómozott belső visszapillantó elsötétülése'
    max_duration_ms: 5000
