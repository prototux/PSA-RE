routine: 0xDF15
name: 'CABLE_CONTROLLED_GEAR_LEVER_RELEASE_CONTROL'
display_name:
  en: 'Cable-controlled gear lever release control (shift-lock)'
  fr: 'Commande de déblocage du levier de vitesses à commande par câble (shift lock)'
  es: 'Mando de desbloqueo de la palanca de cambios con mando por cable (shift lock)'
  de: 'Befehl für die Entsperrung des seilzugbetätigten Schalthebels (Shift-Lock)'
  pl: 'Sterowanie blokadą dźwigni zmiany biegów sterowanych za pomocą linki (blokada "Shift Lock")'
  hu: 'A kábeles vezérlésű sebességváltókar blokkolása megszüntetésének vezérlése (Shift Lock)'
control: ['start', 'stop', 'results']

params:
  SHIFT_LOCK_CONST:
    bits: '1.7-2.0'
    type: 'enum'
    default: 0x03

  SHIFT_LOCK_CONTROLE_VALUE:
    bits: '3.7-4.0'
    type: 'enum'
    default: 0x00

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x03:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x04:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
