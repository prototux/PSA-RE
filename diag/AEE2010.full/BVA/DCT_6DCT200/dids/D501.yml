did: 0xD501
name: 'GEAR_ENGAGED'
display_name:
  en: 'Gear engaged'
  fr: 'Rapport engagé'
  es: 'MARCHA ACOPLADA'
  de: 'EINGELEGTER GANG'
  pl: 'WŁĄCZONY BIEG'
  hu: 'KAPCSOLT FOKOZAT'
comment:
  en: 'The gear displayed by this parameter corresponds to the gear which is actually engaged in the gearbox. The value may be different from the gear selected by the driver.'
  fr: 'Le rapport affiché par ce paramètre correspond au rapport réellement engagé dans la boîte de vitesses. La valeur peut être différente du rapport sélectionné par le conducteur.'
  es: 'La relación indicada por este parámetro corresponde a la velocidad realmente metida en la caja de cambios. El valor puede ser diferente de la velocidad seleccionada por el conductor.'
  de: 'Der von diesem Parameter angezeigte Gang entspricht dem tatsächlich im Getriebe eingelegten Gang. Der Wert kann vom durch den Fahrer gewählten Gang abweichen.'
  pl: 'Bieg pokazywany przez ten parametr odpowiada biegowi, który jest rzeczywiście włączony w skrzyni biegów. Wartość może być inna niż bieg wybrany przez kierowcę.'
  hu: 'A paraméter által megjelenített fokozat megfelel a sebességváltóban ténylegesen bekapcsolt fokozatnak. Az érték eltérhet a vezető által kiválasztott fokozattól.'
kind: 'live'
access: 'read'
length: 1

