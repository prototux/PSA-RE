  hu: 'Az EEPROM meghibásodása'
comment:
  en: 'Parameter which makes it possible to know the normal operating status of the ECU: "NO" the internal malfunction of the ECU: "YES'
  fr: 'Paramètre permettant de connaître : l''état normal de fonctionnement du calculateur : "NON" le dysfonctionnement interne du calculateur : " OUI'
  es: 'Parámetro que permite conocer : el estado normal de funcionamiento del calculador : "NO" el disfuncionamiento interno del calculador : "SI'
  de: 'Parameter für Kenntnis von Normalbetriebszustand des Steuergeräts: interne Funktionsstörung des Steuergeräts: "JA'
  pl: 'Parametr pozwalający sprawdzić stan normalnego działania kalkulatora: " NIE " uszkodzenie wewnętrzne kalkulatora: " TAK'
  hu: 'Paraméter, amely lehetővé teszi megismernünk a computer normális működési állapota:NEM" a computer belső működési rendellenessége:IGEN'
kind: 'live'
access: 'read'
length: 1
variants: ['G25_*', 'M3_M4_V1']

