      de: 'Kalibrierungsspannung des Aufbauhöhengebers vorn'
      pl: 'Napięcie kalibracji przedniego czujnika wysokości nadwozia'
      hu: 'Első karosszéri magasság érzékelő kalibrálási feszültsége'
