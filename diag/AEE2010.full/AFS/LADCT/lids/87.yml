      en: 'Dipped headlamps'
      fr: 'Feux de croisement'
      es: 'Luces de cruce'
      de: 'Abblendlicht'
      pl: 'Światła mijania'
      hu: 'Tompított világítás `'
    type: 'bool'
    values:
      0x00:
        en: 'Off'
        fr: 'Eteints'
        es: 'Apagados'
        de: 'Ausgeschaltet'
        pl: 'Zgaszone'
        hu: 'Kikapcsolva'
      0x01:
        en: 'On'
        fr: 'Allumés'
        es: 'Encendidos'
        de: 'Eingschaltet'
        pl: 'Włączone'
        hu: 'Bekapcsolva'

  DTC_RANG:
    bits: '1.7-1.0'
    type: 'uint'

  VEHICLE_SPEED:
    bits: '6.7-6.0'
