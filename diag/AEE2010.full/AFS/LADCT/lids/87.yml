    factor: 0.1
    units: 'V'

  ENGINE_STATUS:
    bits: '5.1'
    comment:
      en: 'Engine status'
      fr: 'Etat moteur'
      es: 'Estado motor'
      de: 'Motorzustand'
      pl: 'Stan silnika'
      hu: 'Motor állapot'
    type: 'bool'
    values:
      0x00:
        en: 'The engine stopped'
        fr: 'Moteur arrêté'
        es: 'Motor parado'
        de: 'Abgestellter Motor'
        pl: 'Przy wyłączonym silniku'
        hu: 'Álló motor'
      0x01:
        en: 'Engine running'
        fr: 'Moteur tournant'
        es: 'Motor en marcha'
        de: 'Laufender Motor'
        pl: 'Przy pracującym silniku'
        hu: 'Járó motor'

  DIPPED_HEADLAMPS:
    bits: '5.2'
