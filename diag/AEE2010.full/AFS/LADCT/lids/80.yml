lid: 0x80
name: 'IDENTIFICATION'
display_name:
  en: 'ECU identification (part numbers, versions)'
  fr: 'Identification du calculateur (références, versions)'
kind: 'identification'
access: 'read'
length: 17
variants: ['B7_*', 'B8_V1', 'B75C_V1', 'B78_*', 'C84C_*', 'P8_*', 'T7_*', 'T9_*', 'T84_*', 'W2_*']

params:
  EQUIPMENT_PART_NUMBER:
    bits: '1.7-5.0'
    comment:
      en: 'Equipment part number'
      fr: 'Référence du matériel'
      es: 'Referencia del equipo'
      de: 'Hardware-Teilenummer'
      pl: 'Referencja sprzętu'
      hu: 'Felszerelés cikkszáma'
    type: 'bcd'

  NAME_SUPPLIER:
    bits: '6.7-7.0'
    comment:
      en: 'Name of the Supplier'
      fr: 'Nom du Fournisseur'
      es: 'Nombre del Proveedor'
      de: 'Name des Lieferanten'
      pl: 'Nazwa Dostawcy'
      hu: 'Szállító neve'
    type: 'enum'
    values:
      0x2A:
        en: 'AUTOMOTIVE LIGHTING'
        fr: 'AUTOMOTIVE LIGHTING'

  EQUIPMENT_ADDITIONAL_REFERENCE:
    bits: '8.7-12.0'
    comment:
      en: 'Equipment additional reference'
      fr: 'Référence complémentaire du matériel'
      es: 'Referencia complementaria del material'
      de: 'Zusätzliche Hardware-Teilenummer'
      pl: 'Referencja uzupełniająca sprzętu'
      hu: 'Termék kiegészítő cikkszáma'
    type: 'bcd'

  SOFTWARE_EDITION:
    bits: '13.7-14.0'
    comment:
      en: 'Software edition'
      fr: 'Edition du logiciel'
      es: 'Edición del software'
      de: 'Ausgabe der Software'
      pl: 'Wydanie oprogramowania'
      hu: 'A szoftver kiadása'
    type: 'bcd'

  EDITION_CALIBRATION:
    bits: '15.7-16.0'
    comment:
      en: 'Edition of the calibration'
      fr: 'Edition de la calibration'
      es: 'Edición de la calibración'
      de: 'Ausgabe der Kalibrierung.'
      pl: 'Edycja kalibracji'
      hu: 'Kalibrálási verzió'
    type: 'bcd'

  DIAGNOSTIC_MESSAGE_SYSTEM_INDEX_MODIFICATION:
    bits: '17.7-17.0'
    comment:
      en: 'Diagnostic message system index (of modification)'
      fr: 'Indice (d''évolution) messagerie diagnostic'
      es: 'Índice (de evolución) mensajería diagnosis'
      de: 'Index (Änderungsindex) Diagnose-Mailbox'
      pl: 'Wskaźnik (zmiany) infolinia diagnostyczna'
      hu: 'Diagnosztikai üzenetek (fejlesztési) jelzőszám'
    type: 'uint'

