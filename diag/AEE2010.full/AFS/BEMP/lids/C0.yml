lid: 0xC0
name: 'LID_C0'
display_name:
  en: 'Data record 0xC0 (8 values)'
  fr: 'Enregistrement 0xC0 (8 valeurs)'
kind: 'live'
access: 'read'
length: 12
variants: ['B75C_*', 'G95_*', 'W2_*']

params:
  CONTROL_UNIT_SUPPLY_VOLTAGE:
    bits: '1.7-1.0'
    comment:
      en: 'Control unit supply voltage'
      fr: 'Tension d''alimentation du calculateur'
      es: 'Tensión de alimentación del calculador'
      de: 'Versorgungsspannung des Steuergeräts'
      pl: 'Napiecie zasilania kalkulatora'
      hu: 'A vezérlő egység tápellátó feszültsége'
    type: 'uint'
    factor: 0.1
    units: 'V'

  VOLTAGE_FRONT_BODY_HEIGHT_SENSOR_SIGNAL:
    bits: '2.7-3.0'
    comment:
      en: 'Voltage of the front body height sensor signal'
      fr: 'Tension du signal du capteur de hauteur de caisse avant'
      es: 'Tensión de la señal del captador de altura de carrocería de la parte delantera'
      de: 'Spannung des Signals des Aufbauhöhengebers vorn'
      pl: 'Napięcie sygnału przedniego czujnika wysokości nadwozia'
      hu: 'Első karosszéria magasság érzékelő jel feszültsége'
    type: 'uint'
    factor: 0.01
    units: 'V'

  REAR_OR_REAR_LEFT_BODY_HEIGHT_SENSOR_SIGNAL:
    bits: '4.7-5.0'
    comment:
      en: 'Rear or rear left body height sensor signal voltage'
      fr: 'Tension du signal du capteur de hauteur de caisse arrière ou arrière gauche'
      es: 'Tensión de la señal del captador de altura de la carrocería trasera o trasera izquierda'
      de: 'Spannung des Signals des Karosseriehöhensensors hinten oder hinten links'
      pl: 'Napięcie sygnału czujnika tylnego lub tylnego lewego wysokości nadwozia'
      hu: 'Bal hátsó vagy hátsó karosszéria- magasságérzékelő jel feszültsége'
    type: 'uint'
    factor: 0.01
    units: 'V'

  REAR_RIGHT_BODY_HEIGHT_SENSOR_SIGNAL_VOLTAGE_IF:
    bits: '6.7-7.0'
    comment:
      en: 'Rear right body height sensor signal voltage (if present)'
      fr: 'Tension du signal du capteur de hauteur de caisse arrière droit (si présent)'
      es: 'Tensión de la señal del captador de altura de carrocería trasero derecho (si presente)'
      de: 'Spannung des Signals des Höhensensors der Karosserie hinten rechts (wenn vorhanden)'
      pl: 'Napięcie sygnału czujnika wysokości nadwozia tylnego prawego (jeżeli obecny)'
      hu: 'A jobb hátsó karosszéria magasságérzékelő jelének feszültsége (ha jelen van)'
    type: 'uint'
    factor: 0.01
    units: 'V'

  FRONT_BODY_HEIGHT_SENSOR_CALIBRATION_VOLTAGE:
    bits: '8.7-9.0'
    comment:
      en: 'Front body height sensor calibration voltage'
      fr: 'Tension de calibration du capteur de hauteur de caisse avant'
      es: 'Tensión de calibración del captador de altura de carrocería de la parte delantera'
      de: 'Kalibrierungsspannung des Aufbauhöhengebers vorn'
      pl: 'Napięcie kalibracji przedniego czujnika wysokości nadwozia'
      hu: 'Első karosszéri magasság érzékelő kalibrálási feszültsége'
    type: 'uint'
    factor: 0.01
    units: 'V'

  REAR_BODY_HEIGHT_SENSOR_CALIBRATION_VOLTAGE:
    bits: '10.7-11.0'
    comment:
      en: 'Rear body height sensor calibration voltage'
      fr: 'Tension de calibration du capteur de hauteur de caisse arrière'
      es: 'Tensión de calibración del captador de altura de carrocería de la parte trasera'
      de: 'Kalibrierungsspannung des Aufbauhöhengebers hinten'
      pl: 'Napięcie kalibracji tylnego czujnika wysokości nadwozia'
      hu: 'Hátsó karosszériamagasság-érzékelő kalibrálási feszültsége'
    type: 'uint'
    factor: 0.01
    units: 'V'

  STATUS_VERTICAL_CORRECTION:
    bits: '12.1-12.0'
    comment:
      en: 'Status of the vertical correction'
      fr: 'Etat de la correction de site'
      es: 'Estado de la corrección de posición'
      de: 'Zustand der Höhenkorrektur'
      pl: 'Stan korekty pochylenia'
      hu: 'A magasságkorrekció állapota'
    type: 'enum'
    values:
      0x00:
        en: 'Faulty'
        fr: 'En défaut'
        es: 'En fallo'
        de: 'In Fehler'
        pl: 'Blędny'
        hu: 'Hibás'
      0x01:
        en: 'Function inhibited'
        fr: 'Fonction inhibée'
        es: 'Función inhibida'
        de: 'Funktion gesperrt'
        pl: 'Funkcja wyłączona'
        hu: 'Működés letiltva'
      0x02:
        en: 'Function not present'
        fr: 'Fonction non présente'
        es: 'Función no presente'
        de: 'Funktion nicht vorhanden'
        pl: 'Funkcja nieobecna'
        hu: 'Hiányzó funkció'
      0x03:
        en: 'Function active'
        fr: 'Fonction active'
        es: 'Función activa'
        de: 'Aktive Funktion'
        pl: 'Funkcja aktywna'
        hu: 'Aktív funkció'

  STATUS_VERTICAL_CORRECTION_2:
