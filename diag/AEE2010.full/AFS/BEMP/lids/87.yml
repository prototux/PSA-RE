lid: 0x87
name: 'LID_87'
display_name:
  en: 'Data record 0x87 (10 values)'
  fr: 'Enregistrement 0x87 (10 valeurs)'
kind: 'other'
access: 'read'
length: 15
variants: ['B75C_*', 'G95_*', 'W2_*']

params:
  DTC_CODE:
    bits: '2.7-3.0'
    type: 'uint'
    mux_selector: true

  BATTERY_VOLTAGE:
    bits: '4.7-4.0'
    comment:
      en: 'Battery voltage'
      fr: 'Tension batterie'
      es: 'Tensión batería'
      de: 'Batteriespannung'
      pl: 'Napiecie akumulatora'
      hu: 'Akkumulátorfeszültség'
    type: 'uint'
    factor: 0.1
    units: 'V'

  STATUS_OF_ENGINE:
    bits: '5.0'
    comment:
      en: 'Status of engine'
      fr: 'Etat du moteur'
      es: 'Estado del motor'
      de: 'Zustand des Motors'
      pl: 'Stan silnika'
      hu: 'Motor állapota'
    type: 'bool'
    values:
      0x00:
        en: 'The engine stopped'
        fr: 'Moteur arrêté'
        es: 'Motor parado'
        de: 'Abgestellter Motor'
        pl: 'Przy wyłączonym silniku'
        hu: 'Álló motor'
      0x01:
        en: 'Engine running'
        fr: 'Moteur tournant'
        es: 'Motor en marcha'
        de: 'Laufender Motor'
        pl: 'Przy pracującym silniku'
        hu: 'Járó motor'

  DIPPED_HEADLAMPS:
    bits: '5.1'
    comment:
      en: 'Dipped headlamps'
      fr: 'Feux de croisement'
      es: 'Luces de cruce'
      de: 'Abblendlicht'
      pl: 'Światła mijania'
      hu: 'Tompított világítás `'
    type: 'bool'
    values:
      0x00:
        en: 'Off'
        fr: 'Eteints'
        es: 'Apagados'
        de: 'Ausgeschaltet'
        pl: 'Zgaszone'
        hu: 'Kikapcsolva'
      0x01:
        en: 'On'
        fr: 'Allumés'
        es: 'Encendidos'
        de: 'Eingschaltet'
        pl: 'Włączone'
        hu: 'Bekapcsolva'

  DTC_RANG:
    bits: '1.7-1.0'
    type: 'uint'

  VEHICLE_SPEED:
    bits: '6.7-6.0'
    comment:
      en: 'Vehicle speed'
      fr: 'Vitesse du véhicule'
      es: 'Velocidad vehículo'
      de: 'Geschwindigkeit des Fahrzeugs'
      pl: 'Prędkość pojazdu'
      hu: 'Jármű sebessége'
    type: 'uint'
    units: 'km/h'

  VOLTAGE_FRONT_BODY_HEIGHT_SENSOR_SIGNAL:
    bits: '9.7-9.0'
    comment:
      en: 'Voltage of the front body height sensor signal'
      fr: 'Tension du signal du capteur de hauteur de caisse avant'
      es: 'Tensión de la señal del captador de altura de carrocería de la parte delantera'
      de: 'Spannung des Signals des Aufbauhöhengebers vorn'
      pl: 'Napięcie sygnału przedniego czujnika wysokości nadwozia'
      hu: 'Első karosszéria magasság érzékelő jel feszültsége'
    type: 'uint'
    factor: 0.02
    units: 'V'

  REAR_OR_REAR_LEFT_BODY_HEIGHT_SENSOR_SIGNAL:
    bits: '10.7-10.0'
    comment:
      en: 'Rear or rear left body height sensor signal voltage'
      fr: 'Tension du signal du capteur de hauteur de caisse arrière ou arrière gauche'
      es: 'Tensión de la señal del captador de altura de la carrocería trasera o trasera izquierda'
      de: 'Spannung des Signals des Karosseriehöhensensors hinten oder hinten links'
      pl: 'Napięcie sygnału czujnika tylnego lub tylnego lewego wysokości nadwozia'
      hu: 'Bal hátsó vagy hátsó karosszéria- magasságérzékelő jel feszültsége'
    type: 'uint'
    factor: 0.02
    units: 'V'

  REAR_RIGHT_BODY_HEIGHT_SENSOR_SIGNAL_VOLTAGE_IF:
    bits: '11.7-11.0'
    comment:
      en: 'Rear right body height sensor signal voltage (if present)'
      fr: 'Tension du signal du capteur de hauteur de caisse arrière droit (si présent)'
      es: 'Tensión de la señal del captador de altura de carrocería trasero derecho (si presente)'
      de: 'Spannung des Signals des Höhensensors der Karosserie hinten rechts (wenn vorhanden)'
      pl: 'Napięcie sygnału czujnika wysokości nadwozia tylnego prawego (jeżeli obecny)'
      hu: 'A jobb hátsó karosszéria magasságérzékelő jelének feszültsége (ha jelen van)'
    type: 'uint'
    factor: 0.02
    units: 'V'

  VERTICAL_CORRECTION_ANGLE:
    bits: '15.7-15.0'
    comment:
      en: 'Vertical correction angle'
      fr: 'Angle de correction site'
      es: 'Ángulo de corrección posición'
      de: 'Berichtigungswinkel Leuchtweite'
      pl: 'Kąt korekty pochylenia'
      hu: 'Fényszórómagasság szabályozási szög'
    type: 'sint'
    factor: 0.05
    units: '°'

