ioctl: 0xD430
name: 'LEFT_DIPPED_HEADLAMP'
display_name:
  en: 'Left dipped headlamp'
  fr: 'Feu de croisement gauche'
  es: 'Alumbrado izquierdo de cruce'
  de: 'Abblendlicht links'
  pl: 'Lewe swiatlo mijania'
  hu: 'Bal tompított fényszóró'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-4.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Left dipped headlamp'
      fr: 'Feu de croisement gauche'
      es: 'Alumbrado izquierdo de cruce'
      de: 'Abblendlicht links'
      pl: 'Lewe swiatlo mijania'
      hu: 'Bal tompított fényszóró'
    max_duration_ms: 2000
  - display_name:
      en: 'Right dipped headlamp'
      fr: 'Feu de croisement droit'
      es: 'Alumbrado derecho de cruce'
      de: 'Abblendlicht rechts'
      pl: 'Prawe swiatlo mijania'
      hu: 'Jobb tompított fényszóró'
    max_duration_ms: 2000
