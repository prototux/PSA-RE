ioctl: 0xD742
name: 'CONTROL_DIESEL_FUEL_HEATER'
display_name:
  en: 'Control of the diesel fuel heater'
  fr: 'Commande du réchauffeur gazole'
  es: 'Mando del calentador de gasoil'
  de: 'Steuerung des Dieselvorwärmers'
  pl: 'Sterowanie podgrzewacza oleju napędowego'
  hu: 'A gázolaj-előmelegítő vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the diesel fuel heater'
      fr: 'Commande du réchauffeur gazole'
      es: 'Mando del calentador de gasoil'
      de: 'Steuerung des Dieselvorwärmers'
      pl: 'Sterowanie podgrzewacza oleju napędowego'
      hu: 'A gázolaj-előmelegítő vezérlése'
    max_duration_ms: 2000
