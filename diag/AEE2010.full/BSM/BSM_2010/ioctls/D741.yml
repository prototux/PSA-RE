ioctl: 0xD741
name: 'CONTROL_AIR_PUMP_OR_VARIABLE_VALVE_LIFT_MOTOR'
display_name:
  en: 'Control of the air pump or of the variable valve lift motor'
  fr: 'Commande de la pompe à air ou du moteur de levée de soupapes variable'
  es: 'Mando de la bomba de aire del motor de alzado de válvulas variable'
  de: 'Betätigung der Luftpumpe oder des Motors Variabler Ventilhub'
  pl: 'Sterowanie pompy powietrza lub silnika zmiennego podnoszenia zaworów'
  hu: 'Változtatható szelepemelés motor vagy levegőszivattyú vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the air pump or of the variable valve lift motor'
      fr: 'Commande de la pompe à air ou du moteur de levée de soupapes variable'
      es: 'Mando de la bomba de aire del motor de alzado de válvulas variable'
      de: 'Betätigung der Luftpumpe oder des Motors Variabler Ventilhub'
      pl: 'Sterowanie pompy powietrza lub silnika zmiennego podnoszenia zaworów'
      hu: 'Változtatható szelepemelés motor vagy levegőszivattyú vezérlése'
    max_duration_ms: 3000
