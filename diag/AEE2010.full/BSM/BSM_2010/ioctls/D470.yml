ioctl: 0xD470
name: 'CHANGE_CYCLIC_RATIO_AIR_CONDITIONING_COMPRESSOR'
display_name:
  en: 'Change in the cyclic ratio of the air conditioning compressor valve'
  fr: 'Variation du rapport cyclique de la vanne du compresseur de climatisation'
  es: 'Variación de la relación cíclica de la válvula del compresor de climatización'
  de: 'Änderung des Taktverhältnisses des Ventils des Klimaanlagenkompressors'
  pl: 'Zmiana stosunku cyklicznego zaworu sprężarki układu klimatyzacji'
  hu: 'A klíma kompresszor szelep ciklikus arányának változása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Change in the cyclic ratio of the air conditioning compressor valve'
      fr: 'Variation du rapport cyclique de la vanne du compresseur de climatisation'
      es: 'Variación de la relación cíclica de la válvula del compresor de climatización'
      de: 'Änderung des Taktverhältnisses des Ventils des Klimaanlagenkompressors'
      pl: 'Zmiana stosunku cyklicznego zaworu sprężarki układu klimatyzacji'
      hu: 'A klíma kompresszor szelep ciklikus arányának változása'
    max_duration_ms: 4000
