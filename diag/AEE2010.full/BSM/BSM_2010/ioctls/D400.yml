ioctl: 0xD400
name: 'FRONT_LEFT_FOG_LAMP'
display_name:
  en: 'Front left fog lamp'
  fr: 'Feu antibrouillard avant gauche'
  es: 'Luz antiniebla delantera izquierda'
  de: 'Nebelleuchte vorne links'
  pl: 'Światło przeciwmgłowe przednie lewe'
  hu: 'Bal első ködlámpa'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-4.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Front left fog lamp'
      fr: 'Feu antibrouillard avant gauche'
      es: 'Luz antiniebla delantera izquierda'
      de: 'Nebelleuchte vorne links'
      pl: 'Światło przeciwmgłowe przednie lewe'
      hu: 'Bal első ködlámpa'
    max_duration_ms: 2000
  - display_name:
      en: 'Front right fog lamp'
      fr: 'Feu antibrouillard avant droit'
      es: 'Luz antiniebla delantera derecha'
      de: 'Nebelleuchte vorne rechts'
      pl: 'Światło przeciwmgłowe przednie prawe'
      hu: 'Jobb első ködlámpa'
    max_duration_ms: 2000
