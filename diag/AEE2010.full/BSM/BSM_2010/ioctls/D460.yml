ioctl: 0xD460
name: 'AIR_CONDITIONING_COMPRESSOR_CLUTCH'
display_name:
  en: 'Air conditioning compressor clutch'
  fr: 'Embrayage du compresseur de climatisation'
  es: 'Embrague del compresor de climatización'
  de: 'Kupplung des Klimaanlagenkompressor'
  pl: 'Sprzęgło sprężarki klimatyzacji'
  hu: 'A légkondicionáló kompresszor tengelykapcsolója'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Air conditioning compressor clutch'
      fr: 'Embrayage du compresseur de climatisation'
      es: 'Embrague del compresor de climatización'
      de: 'Kupplung des Klimaanlagenkompressor'
      pl: 'Sprzęgło sprężarki klimatyzacji'
      hu: 'A légkondicionáló kompresszor tengelykapcsolója'
    max_duration_ms: 3000
