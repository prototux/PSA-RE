ioctl: 0xD743
name: 'VARIABLE_VALVE_LIFT_MOTOR_CONTROL'
display_name:
  en: 'Variable valve lift motor control'
  fr: 'Commande du moteur de levée de soupapes variable'
  es: 'Mando de motor de levantamiento de válvulas variable'
  de: 'Betätigung Motor variabler Ventilhub'
  pl: 'Sterowanie silnika zmiennego podniesienia zaworów'
  hu: 'Változtatható szelepemelés motor vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Variable valve lift motor control'
      fr: 'Commande du moteur de levée de soupapes variable'
      es: 'Mando de motor de levantamiento de válvulas variable'
      de: 'Betätigung Motor variabler Ventilhub'
      pl: 'Sterowanie silnika zmiennego podniesienia zaworów'
      hu: 'Változtatható szelepemelés motor vezérlése'
    max_duration_ms: 2000
