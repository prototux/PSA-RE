ioctl: 0xD5B2
name: 'FUEL_PUMP_CONTROL'
display_name:
  en: 'Fuel pump control'
  fr: 'Commande de la pompe à carburant'
  es: 'Mando de la bomba de carburante'
  de: 'Steuerung der Kraftstoffpumpe'
  pl: 'Sterowanie pompy paliwowej'
  hu: 'Az üzemanyagszivattyú vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Fuel pump control'
      fr: 'Commande de la pompe à carburant'
      es: 'Mando de la bomba de carburante'
      de: 'Steuerung der Kraftstoffpumpe'
      pl: 'Sterowanie pompy paliwowej'
      hu: 'Az üzemanyagszivattyú vezérlése'
    max_duration_ms: 3000
