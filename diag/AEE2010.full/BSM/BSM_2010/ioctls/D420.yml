ioctl: 0xD420
name: 'DEDICATED_FRONT_DAYTIME_RUNNING_LAMPS'
display_name:
  en: 'Dedicated front daytime running lamps'
  fr: 'Feux diurnes dédiés avant'
  es: 'Luces diurnas específicas delanteras'
  de: 'Separates Tagfahrlicht vorne'
  pl: 'Światła dzienne dedykowane przednie'
  hu: 'Első kinevezett nappali lámpa'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-4.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Dedicated front daytime running lamps'
      fr: 'Feux diurnes dédiés avant'
      es: 'Luces diurnas específicas delanteras'
      de: 'Separates Tagfahrlicht vorne'
      pl: 'Światła dzienne dedykowane przednie'
      hu: 'Első kinevezett nappali lámpa'
    max_duration_ms: 5000
