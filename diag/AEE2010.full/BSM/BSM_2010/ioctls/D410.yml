ioctl: 0xD410
name: 'LEFT_HAND_STATIC_LAMP'
display_name:
  en: 'Left-hand static lamp'
  fr: 'Feu statique gauche'
  es: 'Luz estática izquierda'
  de: 'Standleuchte links'
  pl: 'Światło statyczne lewe'
  hu: 'Bal statikus lámpa'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-4.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Left-hand static lamp'
      fr: 'Feu statique gauche'
      es: 'Luz estática izquierda'
      de: 'Standleuchte links'
      pl: 'Światło statyczne lewe'
      hu: 'Bal statikus lámpa'
    max_duration_ms: 2000
  - display_name:
      en: 'Right-hand static lamp'
      fr: 'Feu statique droit'
      es: 'Luz estática derecha'
      de: 'Standleuchte rechts'
      pl: 'Światło statyczne prawe'
      hu: 'Jobb statikus lámpa'
    max_duration_ms: 2000
