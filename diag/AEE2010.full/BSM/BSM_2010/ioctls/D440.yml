ioctl: 0xD440
name: 'LH_MAIN_BEAM'
display_name:
  en: 'LH main beam'
  fr: 'Feu de route gauche'
  es: 'Alumbrado izquierdo de carretera'
  de: 'Fernlicht links'
  pl: 'Lewe swiatlo drogowe'
  hu: 'Bal oldali országúti fényszóró'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'LH main beam'
      fr: 'Feu de route gauche'
      es: 'Alumbrado izquierdo de carretera'
      de: 'Fernlicht links'
      pl: 'Lewe swiatlo drogowe'
      hu: 'Bal oldali országúti fényszóró'
    max_duration_ms: 2000
  - display_name:
      en: 'RH main beam'
      fr: 'Feu de route droit'
      es: 'Alumbrado derecho de carretera'
      de: 'Fernlicht rechts'
      pl: 'Prawe swiatlo drogowe'
      hu: 'Jobb oldali országúti fényszóró'
    max_duration_ms: 2000
