ioctl: 0xD450
name: 'LEFT_HAND_BLIND'
display_name:
  en: 'Left-hand blind'
  fr: 'Occultant gauche'
  es: 'Trampilla izquierda'
  de: 'Abdeckung links'
  pl: 'Przesłona lewa'
  hu: 'Bal oldali takaróelem'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Left-hand blind'
      fr: 'Occultant gauche'
      es: 'Trampilla izquierda'
      de: 'Abdeckung links'
      pl: 'Przesłona lewa'
      hu: 'Bal oldali takaróelem'
    max_duration_ms: 2000
  - display_name:
      en: 'Right-hand blind'
      fr: 'Occultant droit'
      es: 'Trampilla derecha'
      de: 'Abdeckung rechts'
      pl: 'Przesłona prawa'
      hu: 'Jobb oldali takaróelem'
    max_duration_ms: 2000
