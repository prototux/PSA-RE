ioctl: 0xD740
name: 'CONTROL_DIESEL_FUEL_HEATER_OR_COOLANT_OR_AIR_OR'
display_name:
  en: 'Control of the diesel fuel heater or of the coolant or air or fuel pump'
  fr: 'Commande du réchauffeur gazole ou de la pompe à eau ou à air ou à carburant'
  es: 'Mando de calentamiento del gasoil o de la bomba de agua, de aire o de carburante'
  de: 'Betätigung des Kraftstoffvorwärmers oder der Kühlmittel-, Luft- oder Kraftstoffpumpe'
  pl: 'Sterowanie podgrzewacza oleju napędowego lub pompy wodnej lub powietrza lub paliwa'
  hu: 'Tüzelőanyag-szivattyú vagy vízpumpa vagy levegőszivattyú vagy gázolaj előmelegítő vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the diesel fuel heater or of the coolant or air or fuel pump'
      fr: 'Commande du réchauffeur gazole ou de la pompe à eau ou à air ou à carburant'
      es: 'Mando de calentamiento del gasoil o de la bomba de agua, de aire o de carburante'
      de: 'Betätigung des Kraftstoffvorwärmers oder der Kühlmittel-, Luft- oder Kraftstoffpumpe'
      pl: 'Sterowanie podgrzewacza oleju napędowego lub pompy wodnej lub powietrza lub paliwa'
      hu: 'Tüzelőanyag-szivattyú vagy vízpumpa vagy levegőszivattyú vagy gázolaj előmelegítő vezérlése'
    max_duration_ms: 3000
