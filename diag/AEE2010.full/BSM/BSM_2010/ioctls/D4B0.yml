ioctl: 0xD4B0
name: 'WINDSCREEN_WASH_PUMP'
display_name:
  en: 'Windscreen wash pump'
  fr: 'Pompe de lavage avant'
  es: 'Bomba de lavado delantero'
  de: 'Waschpumpe vorne'
  pl: 'Pompa spryskiwacza przedniego'
  hu: 'Első ablakmosó szivattyú'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Windscreen wash pump'
      fr: 'Pompe de lavage avant'
      es: 'Bomba de lavado delantero'
      de: 'Waschpumpe vorne'
      pl: 'Pompa spryskiwacza przedniego'
      hu: 'Első ablakmosó szivattyú'
    max_duration_ms: 1000
