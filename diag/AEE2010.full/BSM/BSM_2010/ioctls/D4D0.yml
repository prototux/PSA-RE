ioctl: 0xD4D0
name: 'SLOW_SPEED_WINDSCREEN_WIPING_CONTROLLED_WIRE'
display_name:
  en: 'Slow speed windscreen wiping controlled by wire'
  fr: 'Essuyage avant filaire en petite vitesse'
  es: 'Limpiaparabrisas por cable a poca velocidad'
  de: 'Wischen vorne über Kabelverbindung mit kleiner Geschwindigkeit'
  pl: 'Wycieraczki przedniej szyby przewodowe na małej prędkości'
  hu: 'Vezetékes első törlés kis sebességfokozaton'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Slow speed windscreen wiping controlled by wire'
      fr: 'Essuyage avant filaire en petite vitesse'
      es: 'Limpiaparabrisas por cable a poca velocidad'
      de: 'Wischen vorne über Kabelverbindung mit kleiner Geschwindigkeit'
      pl: 'Wycieraczki przedniej szyby przewodowe na małej prędkości'
      hu: 'Vezetékes első törlés kis sebességfokozaton'
    max_duration_ms: 3000
