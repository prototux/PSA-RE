comment:
  en: 'Parameter only operational if the engine fuse box receives this information directly by wire. This parameter is only operational with a manual or piloted manual gearbox (Refer to the diagrams)'
  fr: 'Paramètre fonctionnel uniquement si le boîtier de servitude moteur reçoit cette information directement en filaire. Ce paramètre n''est fonctionnel qu''avec une boîte de vitesses manuelle ou manuelle pilotée (Voir la schématique)'
  es: 'Parámetro funcional solo si la caja de servicio motor recibe esta información directamente por cable. Este parámetro solo está operativo con una caja de velocidades manual o manual pilotada (Ver la esquemática)'
  de: 'Parameter funktioniert nur, wenn die Motorschalteinheit diese Information direkt über Kabelverbindung erhält. Diese Parameter funktioniert nur bei einem Schaltgetriebe oder einem automatisierten Schaltgetriebe (Siehe Schaltplan)'
  pl: 'Parametr dostępny wyłącznie, jeżeli moduł sterujący silnika odbiera tę informację bezpośrednio przewodowo. Ten parametr działa wyłącznie z mechaniczną skrzynią biegów lub z mechaniczną sterowaną skrzynią biegów (Patrz schemat)'
  hu: 'Csupán akkor működőképes paraméter, ha a motorkiszolgáló egység közvetlenül vezetékesen fogadja ezen információt. Ezen paraméter csak mechanikus vagy vezérelt mechanikus sebességváltó esetén működőképes (Lásd a kapcsolási rajzot)'
kind: 'live'
access: 'read'
length: 1

