ioctl: 0xD660
name: 'CHECK_VISUAL_REVERSING_ASSISTANCE_CAMERA'
display_name:
  en: 'Check of the visual reversing assistance camera'
  fr: 'Contrôle de la caméra d''aide visuelle au recul'
  es: 'Control de la cámara de ayuda visual a la marcha atrás'
  de: 'Kontrolle der Kamera visuelle Rückfahrhilfe'
  pl: 'Kontrola kamery wizualnej pomocy podczas cofania'
  hu: 'A tolatáskor hátrafelé látást segítő kamera ellenőrzése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONSIGNES:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Check of the visual reversing assistance camera'
      fr: 'Contrôle de la caméra d''aide visuelle au recul'
      es: 'Control de la cámara de ayuda visual a la marcha atrás'
      de: 'Kontrolle der Kamera visuelle Rückfahrhilfe'
      pl: 'Kontrola kamery wizualnej pomocy podczas cofania'
      hu: 'A tolatáskor hátrafelé látást segítő kamera ellenőrzése'
    max_duration_ms: 4000
