ioctl: 0xD670
name: 'CHECK_PANORAMIC_VISUAL_ASSISTANCE_FUNCTION'
display_name:
  en: 'Check of the panoramic visual assistance function'
  fr: 'Contrôle de la fonction d''aide visuelle panoramique'
  es: 'Control de la función de ayuda visual panorámica'
  de: 'Kontrolle der Funktion Rundumsichtassistent'
  pl: 'Kontrola funkcji pomocy wizualnej panoramicznej'
  hu: 'A panoráma látás segítő funkció ellenőrzése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CONSIGNES:
    bits: '2.7-2.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Check of the panoramic visual assistance function'
      fr: 'Contrôle de la fonction d''aide visuelle panoramique'
      es: 'Control de la función de ayuda visual panorámica'
      de: 'Kontrolle der Funktion Rundumsichtassistent'
      pl: 'Kontrola funkcji pomocy wizualnej panoramicznej'
      hu: 'A panoráma látás segítő funkció ellenőrzése'
    max_duration_ms: 5000
