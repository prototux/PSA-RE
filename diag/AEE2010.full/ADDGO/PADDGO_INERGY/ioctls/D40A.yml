ioctl: 0xD40A
name: 'ADDITIVE_PUMP_AUDIBLE_TEST'
display_name:
  en: 'ADDITIVE PUMP AUDIBLE TEST'
  fr: 'Test auditif de la pompe d''additif'
  es: 'TEST AUDITIVO DE LA BOMBA DE ADITIVO'
  de: 'Akustischer Test der Additivpumpe'
  pl: 'TEST SLUCHOWY POMPY DODATKU'
  hu: 'AZ ADALÉKANYAG SZIVATTYÚ HANGKIBOCSÁTÁS ÁLTALI TESZTJE'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'
    default: 0x01

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'ADDITIVE PUMP AUDIBLE TEST'
      fr: 'Test auditif de la pompe d''additif'
      es: 'TEST AUDITIVO DE LA BOMBA DE ADITIVO'
      de: 'Akustischer Test der Additivpumpe'
      pl: 'TEST SLUCHOWY POMPY DODATKU'
      hu: 'AZ ADALÉKANYAG SZIVATTYÚ HANGKIBOCSÁTÁS ÁLTALI TESZTJE'
    max_duration_ms: 6000
  - display_name:
      en: 'CHECK OF THE ADDITIVE PUMP FLOW'
      fr: 'Contrôle du débit de la pompe d''additif'
      es: 'CONTROL DEL CAUDAL DE LA BOMBA DE ADITIVO'
      de: 'Kontrolle der Durchflussmenge Additivpumpe'
      pl: 'KONTROLA WYDATKU POMPY DODATKU'
      hu: 'AZ ADALÉKANYAG SZIVATTYU HOZAMANAK ELLENORZÉSE'
    max_duration_ms: 6000
