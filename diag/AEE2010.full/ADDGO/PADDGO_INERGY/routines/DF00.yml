routine: 0xDF00
name: 'REPLACEMENT_MULTIPLEXED_ADDITIVE_ADDING_PUMP'
display_name:
  en: 'Replacement of the multiplexed additive adding pump / additive reservoir pair'
  fr: 'Remplacement du couple pompe d''additivation multiplexée / réservoir d''additif'
  es: 'Sustitución de la pareja bomba de aditivo multiplexada/Depósito de aditivo'
  de: 'Austausch von Multiplex-Additivpumpe/Additivbehälter'
  pl: 'Wymiana zestawu multipleksowana pompa domieszkowania / zbiornik dodatku'
  hu: 'Az adaléktartály/multiplexált adalékszivattyú páros cseréje'
control: ['start', 'stop', 'results']

params:
  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '1.7-1.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'
    default: 0x07

