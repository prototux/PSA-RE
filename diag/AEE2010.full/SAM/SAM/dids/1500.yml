comment:
  en: 'The blind spot monitoring function is possible if the vehicle has front and rear lateral sensors, and if the parameter "blind spot monitoring function" is on "activated'
  fr: 'La fonction surveillance angle mort est possible si le véhicule est équipé de capteurs latéraux avant et arrière, et le paramètre " fonction surveillance angle mort" est à "activée'
  es: 'La función de vigilancia del ángulo muerto es posible si el vehículo está equipado con captadores laterales delanteros y traseros, y el parámetro "función de vigilancia del ángulo muerto" está como "activada'
  de: 'Die Funktion Toter-Winkel-System ist möglich, wenn das Fahrzeug mit seitlichen Sensoren vorne und hinten ausgestattet ist und der Parameter "Funktion Toter-Winkel-System" auf "aktiviert" steht'
  pl: 'Funkcja nadzorowania martwego pola jest możliwa, jeżeli pojazd jest wyposażony w czujniki boczne przednie i tylne, a parametr "funkcja nadzorowania martwego pola" jest ustawiony na "włączony'
  hu: 'A holt-tér felügyelet funkció lehetséges abban az esetben, ha járműre első és hátsó oldalsó érzékelőt szereltek fel, és ha a "holt-tér felügyelet funkció" paraméter állapota "aktivált'
