node: 'CRT'
model: 'CRT_UDS'
display_name:
  en: 'Telematics remote control (CRT_UDS)'
  fr: 'Commande du recepteur telematique (CRT_UDS)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x736
    response_id: 0x716
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'
  0x60:
    en: 'Supplier session'
    fr: 'Session fournisseur'

services: [0x10, 0x14, 0x22, 0x27, 0x2E, 0x2F, 0x31, 0x37, 0x3E, 0x85]

security_access:
  - level: 0x01
  - level: 0x03

tester_present:
  request: '3E 00'
  period_ms: 1000

identification:
  request: '22 F0 80'
  part_number: '8.7-12.0'
  comment:
    en: 'The ECU part number is in data bytes 8 to 12 of the answer to 22 F0 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 8 à 12 de la réponse à 22 F0 80 (DCB), elle donne la variante logicielle'

cars: ['B8', 'W2']

variants:
  B8_V1:
    parts: ['9666159480']
    cars: ['B8']
  B8_V2:
    parts: ['9802390877']
    cars: ['B8']
  W2_V1:
    parts: ['966566838A']
    cars: ['W2']
  W2_V2:
    parts: ['966566838B']
    cars: ['W2']
  W2_V3:
    parts: ['966566838C']
    cars: ['W2']
  W2_V4:
    parts: ['9665668380']
    cars: ['W2']
  W2_V5:
    parts: ['9676890877']
    cars: ['W2']
  W2_V6:
    parts: ['9802378577']
    cars: ['W2']
