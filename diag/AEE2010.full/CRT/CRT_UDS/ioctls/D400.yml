ioctl: 0xD400
name: 'CHECKING_LIGHTING_TELEMATIC_NAVIGATOR'
display_name:
  en: 'Checking the lighting of the telematic navigator'
  fr: 'Contrôle d''éclairage du désignateur télématique'
  es: 'Control de la iluminación del mando de selección telemático'
  de: 'Überprüfung der Beleuchtung der Telematik-Fernbedienung'
  pl: 'Kontrola oświetlenia urządzenia wskazującego telematyki'
  hu: 'Telematikus kiválasztó megvilágításának ellenőrzése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_LIGHTING:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Checking the lighting of the telematic navigator'
      fr: 'Contrôle d''éclairage du désignateur télématique'
      es: 'Control de la iluminación del mando de selección telemático'
      de: 'Überprüfung der Beleuchtung der Telematik-Fernbedienung'
      pl: 'Kontrola oświetlenia urządzenia wskazującego telematyki'
      hu: 'Telematikus kiválasztó megvilágításának ellenőrzése'
    max_duration_ms: 10000
