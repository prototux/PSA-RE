ioctl: 0xDC00
name: 'SWITCHING_OFF_SCREEN'
display_name:
  en: 'Switching off of the screen'
  fr: 'Extinction de l''écran'
  es: 'Extinción de la pantalla'
  de: 'Ausschaltung des Bildschirms'
  pl: 'Wygaszenie ekranu'
  hu: 'A képernyő kialvása'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

  RESERVED:
    bits: '2.7-2.0'
    unused: true

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

  RESERVED:
    bits: '2.7-2.0'
    unused: true

tests:
  - display_name:
      en: 'Switching off of the screen'
      fr: 'Extinction de l''écran'
      es: 'Extinción de la pantalla'
