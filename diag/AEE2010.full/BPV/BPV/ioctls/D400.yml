ioctl: 0xD400
name: 'LH_VIBRATOR_TEST'
display_name:
  en: 'LH vibrator test'
  fr: 'Test du vibreur gauche'
  es: 'Test del vibrador izquierdo'
  de: 'Test des Vibrators links'
  pl: 'Test lewego wibratora'
  hu: 'A baloldali rezgő tesztelése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

tests:
  - display_name:
      en: 'LH vibrator test'
      fr: 'Test du vibreur gauche'
      es: 'Test del vibrador izquierdo'
      de: 'Test des Vibrators links'
      pl: 'Test lewego wibratora'
      hu: 'A baloldali rezgő tesztelése'
    max_duration_ms: 7000
  - display_name:
      en: 'RH vibrator test'
      fr: 'Test du vibreur droit'
      es: 'Test del vibrador derecho'
      de: 'Test des Vibrators rechts'
      pl: 'Test prawego wibratora'
      hu: 'A jobboldali rezgő tesztelése'
    max_duration_ms: 7000
