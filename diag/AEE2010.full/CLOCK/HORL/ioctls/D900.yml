ioctl: 0xD900
name: 'BRIGHTNESS_TEST'
display_name:
  en: 'Brightness test'
  fr: 'Test de la luminosité'
  es: 'Test de luminosidad'
  de: 'Test der Helligkeit'
  pl: 'Test natężenia światła'
  hu: 'A fényerő tesztelése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_5:
    bits: '2.7-2.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Brightness test'
      fr: 'Test de la luminosité'
      es: 'Test de luminosidad'
      de: 'Test der Helligkeit'
      pl: 'Test natężenia światła'
      hu: 'A fényerő tesztelése'
    max_duration_ms: 3000
