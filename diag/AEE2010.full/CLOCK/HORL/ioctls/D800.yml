ioctl: 0xD800
name: 'CLOCK_TEST'
display_name:
  en: 'Clock test'
  fr: 'Test de l''horloge'
  es: 'Test del reloj'
  de: 'Test der Uhr'
  pl: 'Test zegara'
  hu: 'Óra teszt'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_3:
    bits: '2.7-3.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Clock test'
      fr: 'Test de l''horloge'
      es: 'Test del reloj'
      de: 'Test der Uhr'
      pl: 'Test zegara'
      hu: 'Óra teszt'
    max_duration_ms: 12000
