ioctl: 0xDAC6
name: 'BOOT_OPENING_COMMAND'
display_name:
  en: 'Boot opening command'
  fr: 'Commande d''ouverture du coffre'
  es: 'Mando de apertura del maletero'
  de: 'Öffnungssteuerung Gepäckraumdeckel'
  pl: 'Sterowanie otwarciem bagażnika'
  hu: 'Csomagtartó nyitásának vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Boot opening command'
      fr: 'Commande d''ouverture du coffre'
      es: 'Mando de apertura del maletero'
      de: 'Öffnungssteuerung Gepäckraumdeckel'
      pl: 'Sterowanie otwarciem bagażnika'
      hu: 'Csomagtartó nyitásának vezérlése'
    max_duration_ms: 500
  - display_name:
      en: 'Unlocking of the boot lock'
      fr: 'Déverrouillage de la serrure de coffre'
      es: 'Desbloqueo de la cerradura de maletero'
      de: 'Entriegelung des Heckklappenschlosses'
      pl: 'Odryglowanie zamka bagażnika'
      hu: 'A csomagtartó zárszerkezet kireteszelése'
    max_duration_ms: 500
