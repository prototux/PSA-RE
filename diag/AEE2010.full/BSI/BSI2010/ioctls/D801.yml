ioctl: 0xD801
name: 'REAR_SCREEN_WIPE_COMMAND'
display_name:
  en: 'Rear screen wipe command'
  fr: 'Commande d''essuyage de la lunette arrière'
  es: 'Mando de limpia de luneta trasera'
  de: 'Steuerung Wischen der Heckscheibe'
  pl: 'Sterowanie wycieraczką tylnej szyby'
  hu: 'Hátsó szélvédő törlésének vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Rear screen wipe command'
      fr: 'Commande d''essuyage de la lunette arrière'
      es: 'Mando de limpia de luneta trasera'
      de: 'Steuerung Wischen der Heckscheibe'
      pl: 'Sterowanie wycieraczką tylnej szyby'
      hu: 'Hátsó szélvédő törlésének vezérlése'
    max_duration_ms: 3000
