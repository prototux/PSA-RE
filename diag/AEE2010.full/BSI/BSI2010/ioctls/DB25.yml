ioctl: 0xDB25
name: 'REAR_ELECTRIC_WINDOWS_AUTHORISATION_ACTIVATION'
display_name:
  en: 'Rear electric windows authorisation activation'
  fr: 'Activation de l''autorisation des lève-vitres arrière'
  es: 'Activación de la autorización de los elevalunas traseros'
  de: 'Aktivierung der Freigabe der Heckscheibenwischer'
  pl: 'Włączenie zezwolenia podnośników tylnych szyb'
  hu: 'Hátsó ablakemelők engedélyezésének aktiválása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Rear electric windows authorisation activation'
      fr: 'Activation de l''autorisation des lève-vitres arrière'
      es: 'Activación de la autorización de los elevalunas traseros'
      de: 'Aktivierung der Freigabe der Heckscheibenwischer'
      pl: 'Włączenie zezwolenia podnośników tylnych szyb'
      hu: 'Hátsó ablakemelők engedélyezésének aktiválása'
    max_duration_ms: 10000
