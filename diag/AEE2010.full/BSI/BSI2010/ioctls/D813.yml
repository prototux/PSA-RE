ioctl: 0xD813
name: 'AUTHORISATION_LIGHTING_ENGINE_STARTING_SWITCH'
display_name:
  en: 'Authorisation of lighting of the engine starting switch'
  fr: 'Autorisation d''éclairage du commutateur démarrage moteur'
  es: 'Autorización de iluminación del conmutador de arranque del motor'
  de: 'Freigabe Einschalten Schalter zum Starten des Motors'
  pl: 'Autoryzacja oświetlenia włącznika rozruchu silnika'
  hu: 'Motor indítás kapcsoló megvilágításának engedélyezése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Authorisation of lighting of the engine starting switch'
      fr: 'Autorisation d''éclairage du commutateur démarrage moteur'
      es: 'Autorización de iluminación del conmutador de arranque del motor'
      de: 'Freigabe Einschalten Schalter zum Starten des Motors'
      pl: 'Autoryzacja oświetlenia włącznika rozruchu silnika'
      hu: 'Motor indítás kapcsoló megvilágításának engedélyezése'
    max_duration_ms: 5000
