ioctl: 0xD87A
name: 'CONTROL_ADDITIONAL_REAR_SIDE_LAMPS'
display_name:
  en: 'Control of the additional rear side lamps'
  fr: 'Commande des feux de position additionnels arrière'
  es: 'Mando de las luces de posición adicionales traseras'
  de: 'Betätigung zusätzliche Heckstandlichter'
  pl: 'Sterowanie dodatkowych tylnych świateł pozycyjnych'
  hu: 'Hátsó kiegészítő helyzetjelző lámpák vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the additional rear side lamps'
      fr: 'Commande des feux de position additionnels arrière'
      es: 'Mando de las luces de posición adicionales traseras'
      de: 'Betätigung zusätzliche Heckstandlichter'
      pl: 'Sterowanie dodatkowych tylnych świateł pozycyjnych'
      hu: 'Hátsó kiegészítő helyzetjelző lámpák vezérlése'
    max_duration_ms: 5000
