ioctl: 0xD823
name: 'REAR_SCREEN_WASHING_CONTROL'
display_name:
  en: 'Rear screen washing control'
  fr: 'Commande de lavage de la lunette arrière'
  es: 'Mando de lavado de la luneta trasera'
  de: 'Steuerung Waschen der Heckscheibe'
  pl: 'Sterowanie spryskiwaczem tylnej szyby'
  hu: 'Hátsó szélvédőmosás vezérlés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Rear screen washing control'
      fr: 'Commande de lavage de la lunette arrière'
      es: 'Mando de lavado de la luneta trasera'
      de: 'Steuerung Waschen der Heckscheibe'
      pl: 'Sterowanie spryskiwaczem tylnej szyby'
      hu: 'Hátsó szélvédőmosás vezérlés'
    max_duration_ms: 3000
