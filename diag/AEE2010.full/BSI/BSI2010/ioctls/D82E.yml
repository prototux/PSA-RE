ioctl: 0xD82E
name: 'CONTROL_FRONT_LEFT_HAND_FOGLAMP_INTERSECTION'
display_name:
  en: 'Control of the front left-hand foglamp for the intersection lighting'
  fr: 'Commande du feu de brouillard avant gauche pour l''éclairage en intersection'
  es: 'Mando de faro antiniebla izquierdo para el alumbrado en intersección'
  de: 'Ansteuerung Nebelscheinwerfer links für Abbiegelicht'
  pl: 'Sterowanie światła przeciwmgłowego przedniego lewego dla oświetlenia na skrzyżowaniu'
  hu: 'Bal első ködlámpa vezérlése útkereszteződés világításhoz'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the front left-hand foglamp for the intersection lighting'
      fr: 'Commande du feu de brouillard avant gauche pour l''éclairage en intersection'
      es: 'Mando de faro antiniebla izquierdo para el alumbrado en intersección'
      de: 'Ansteuerung Nebelscheinwerfer links für Abbiegelicht'
      pl: 'Sterowanie światła przeciwmgłowego przedniego lewego dla oświetlenia na skrzyżowaniu'
      hu: 'Bal első ködlámpa vezérlése útkereszteződés világításhoz'
    max_duration_ms: 5000
