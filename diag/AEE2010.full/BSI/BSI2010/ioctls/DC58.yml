ioctl: 0xDC58
name: 'HEATED_WINDSCREEN_SWITCH_LED_CONTROL'
display_name:
  en: 'Heated windscreen switch LED control'
  fr: 'Commande de la LED du commutateur du pare-brise chauffant'
  es: 'Mando de LED del conmutador de parabrisas térmico'
  de: 'Ansteuerung der LED des Schalters der heizbaren Frontscheibe'
  pl: 'Sterowanie diody LED przełącznika ogrzewanej szyby przedniej'
  hu: 'Szélvédőfűtés kapcsoló LED vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Heated windscreen switch LED control'
      fr: 'Commande de la LED du commutateur du pare-brise chauffant'
      es: 'Mando de LED del conmutador de parabrisas térmico'
      de: 'Ansteuerung der LED des Schalters der heizbaren Frontscheibe'
      pl: 'Sterowanie diody LED przełącznika ogrzewanej szyby przedniej'
      hu: 'Szélvédőfűtés kapcsoló LED vezérlése'
    max_duration_ms: 3000
