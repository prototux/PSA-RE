ioctl: 0xDAE4
name: 'CONTROL_HORN_ANTI_THEFT_ALARM'
display_name:
  en: 'Control of the horn by the anti-theft alarm'
  fr: 'Commande de l''avertisseur sonore par l''alarme antieffraction'
  es: 'Gestión del avisador sonoro a través de la alarma antirrobo'
  de: 'Ansteuerung des Signalhorns durch die Alarmanlage'
  pl: 'Sterowanie sygnału dźwiękowego przez alarm przeciwwłamaniowy'
  hu: 'A kürt riasztó általi vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the horn by the anti-theft alarm'
      fr: 'Commande de l''avertisseur sonore par l''alarme antieffraction'
      es: 'Gestión del avisador sonoro a través de la alarma antirrobo'
      de: 'Ansteuerung des Signalhorns durch die Alarmanlage'
      pl: 'Sterowanie sygnału dźwiękowego przez alarm przeciwwłamaniowy'
      hu: 'A kürt riasztó általi vezérlése'
    max_duration_ms: 1000
