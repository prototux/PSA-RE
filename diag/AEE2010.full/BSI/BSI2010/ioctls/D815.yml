ioctl: 0xD815
name: 'FRONT_COURTESY_LAMP_LIGHTING_CONTROL'
display_name:
  en: 'Front courtesy lamp lighting control'
  fr: 'Commande d''éclairage du plafonnier avant'
  es: 'Mando de la luz del plafón delantero'
  de: 'Steuerung Beleuchtung Innenleuchte vorne'
  pl: 'Sterowanie oświetleniem przedniej lampki sufitowej'
  hu: 'Első mennyezetlámpa világításának vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Front courtesy lamp lighting control'
      fr: 'Commande d''éclairage du plafonnier avant'
      es: 'Mando de la luz del plafón delantero'
      de: 'Steuerung Beleuchtung Innenleuchte vorne'
      pl: 'Sterowanie oświetleniem przedniej lampki sufitowej'
      hu: 'Első mennyezetlámpa világításának vezérlése'
    max_duration_ms: 5000
