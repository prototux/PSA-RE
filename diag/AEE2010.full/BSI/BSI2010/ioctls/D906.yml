      de: 'Ansteuerung der Kontrollleuchte automatisches Bremsen bei Kollisionsgefahr: aus'
      pl: 'Sterowanie kontrolki hamowania automatycznego w przypadku ryzyka zderzenia:zgaszona'
      hu: 'Automata fékezés visszajelzés vezérlése ütközés veszélye esetén: kikapcsolva'
    max_duration_ms: 3000
  - display_name:
      en: 'Control of the automatic braking on risk of collision warning lamp: lit permanently'
      fr: 'Pilotage du voyant de freinage automatique en cas de risque de collision : allumé fixe'
