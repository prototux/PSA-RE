ioctl: 0xD906
name: 'CONTROL_AUTOMATIC_BRAKING_RISK_COLLISION_WARNING'
display_name:
  en: 'Control of the automatic braking on risk of collision warning lamp: off'
  fr: 'Pilotage du voyant de freinage automatique en cas de risque de collision : éteint'
  es: 'Pilotaje del testigo de frenada automática en caso de riesgo de colisión: apagado'
  de: 'Ansteuerung der Kontrollleuchte automatisches Bremsen bei Kollisionsgefahr: aus'
  pl: 'Sterowanie kontrolki hamowania automatycznego w przypadku ryzyka zderzenia:zgaszona'
  hu: 'Automata fékezés visszajelzés vezérlése ütközés veszélye esetén: kikapcsolva'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the automatic braking on risk of collision warning lamp: off'
      fr: 'Pilotage du voyant de freinage automatique en cas de risque de collision : éteint'
