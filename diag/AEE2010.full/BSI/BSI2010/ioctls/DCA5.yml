ioctl: 0xDCA5
name: 'CONTROL_BLIND_SPOT_MONITORING_FUNCTION_SWITCH'
display_name:
  en: 'Control of the blind spot monitoring function switch LED'
  fr: 'Commande de la LED du commutateur de la fonction surveillance d''angle mort'
  es: 'Mando de LED del conmutador de la función vigilancia de ángulo muerto'
  de: 'Steuerung der LED des Schalters der Funktion Überwachung toter Winkel'
  pl: 'Sterowanie LED włącznika funkcji nadzorowania martwego pola'
  hu: 'A holttér felügyelet funkció kapcsoló LED vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the blind spot monitoring function switch LED'
      fr: 'Commande de la LED du commutateur de la fonction surveillance d''angle mort'
      es: 'Mando de LED del conmutador de la función vigilancia de ángulo muerto'
      de: 'Steuerung der LED des Schalters der Funktion Überwachung toter Winkel'
      pl: 'Sterowanie LED włącznika funkcji nadzorowania martwego pola'
      hu: 'A holttér felügyelet funkció kapcsoló LED vezérlése'
    max_duration_ms: 5000
