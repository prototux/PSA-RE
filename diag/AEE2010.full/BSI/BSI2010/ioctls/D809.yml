ioctl: 0xD809
name: 'EXTERIOR_LATERAL_LIGHTING_CONTROL'
display_name:
  en: 'Exterior lateral lighting control'
  fr: 'Commande éclairage latéral extérieur'
  es: 'Mando de luces lateral exterior'
  de: 'Ansteuerung der seitlichen Außenbeleuchtung'
  pl: 'Sterowanie oświetlenia bocznego zewnętrznego'
  hu: 'Külső oldalsó világítás vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Exterior lateral lighting control'
      fr: 'Commande éclairage latéral extérieur'
      es: 'Mando de luces lateral exterior'
      de: 'Ansteuerung der seitlichen Außenbeleuchtung'
      pl: 'Sterowanie oświetlenia bocznego zewnętrznego'
      hu: 'Külső oldalsó világítás vezérlése'
    max_duration_ms: 3000
