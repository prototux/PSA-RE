ioctl: 0xD833
name: 'CONTROL_FRONT_LEFT_HAND_FOGLAMP_RELAY'
display_name:
  en: 'Control of the front left-hand foglamp relay'
  fr: 'Commande du relais du feu de brouillard avant gauche'
  es: 'Mando del relé de luz antiniebla delantera izquierda'
  de: 'Ansteuerung des Relais des Nebelscheinwerfers links'
  pl: 'Sterowanie przekaźnika przedniego lewego światła przeciwmgłowego'
  hu: 'Bal első ködlámpa relé vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the front left-hand foglamp relay'
      fr: 'Commande du relais du feu de brouillard avant gauche'
      es: 'Mando del relé de luz antiniebla delantera izquierda'
      de: 'Ansteuerung des Relais des Nebelscheinwerfers links'
      pl: 'Sterowanie przekaźnika przedniego lewego światła przeciwmgłowego'
      hu: 'Bal első ködlámpa relé vezérlése'
    max_duration_ms: 5000
