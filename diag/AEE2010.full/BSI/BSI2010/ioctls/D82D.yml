ioctl: 0xD82D
name: 'CONTROL_ROOF_AMBIANCE_LIGHTING_NO_RHEOSTAT'
display_name:
  en: 'Control of the roof ambiance lighting (no rheostat)'
  fr: 'Commande éclairage d''ambiance du pavillon (non rhéostatés)'
  es: 'Mando de luces ambientales de techo (sin reóstato)'
  de: 'Betätigung Ambient-Dachhimmelbeleuchtung (nicht geregelt)'
  pl: 'Sterowanie oświetlenia nastrojowego dachu (bez potencjometrów)'
  hu: 'Tető hangulatvilágítások vezérlése (nem szabályozott)'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the roof ambiance lighting (no rheostat)'
      fr: 'Commande éclairage d''ambiance du pavillon (non rhéostatés)'
      es: 'Mando de luces ambientales de techo (sin reóstato)'
      de: 'Betätigung Ambient-Dachhimmelbeleuchtung (nicht geregelt)'
      pl: 'Sterowanie oświetlenia nastrojowego dachu (bez potencjometrów)'
      hu: 'Tető hangulatvilágítások vezérlése (nem szabályozott)'
    max_duration_ms: 3000
