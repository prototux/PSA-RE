results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Boot light control'
      fr: 'Commande d''éclairage du coffre'
      es: 'Mando de luz de maletero'
      de: 'Steuerung Beleuchtung Gepäckraum'
