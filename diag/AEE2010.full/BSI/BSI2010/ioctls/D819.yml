ioctl: 0xD819
name: 'BOOT_LIGHT_CONTROL'
display_name:
  en: 'Boot light control'
  fr: 'Commande d''éclairage du coffre'
  es: 'Mando de luz de maletero'
  de: 'Steuerung Beleuchtung Gepäckraum'
  pl: 'Sterowanie oświetleniem bagażnika'
  hu: 'Csomagtér világításának vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
