ioctl: 0xD81A
name: 'CONTROL_INTERIOR_AMBIENCE_LAMPS'
display_name:
  en: 'Control of the interior ambience lamps'
  fr: 'Commande des éclaireurs d''ambiance intérieurs'
  es: 'Mando de las luces de ambiente'
  de: 'Betätigung der Ambient-Innenraumbeleuchtung'
  pl: 'Sterowanie wewnętrznego oświetlenia nastrojowego'
  hu: 'Belső hangulatvilágítások vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the interior ambience lamps'
      fr: 'Commande des éclaireurs d''ambiance intérieurs'
      es: 'Mando de las luces de ambiente'
      de: 'Betätigung der Ambient-Innenraumbeleuchtung'
      pl: 'Sterowanie wewnętrznego oświetlenia nastrojowego'
      hu: 'Belső hangulatvilágítások vezérlése'
    max_duration_ms: 5000
