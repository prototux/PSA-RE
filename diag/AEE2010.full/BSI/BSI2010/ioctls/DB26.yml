ioctl: 0xDB26
name: 'CONTROL_ELECTRIC_WINDOWS_RELAY'
display_name:
  en: 'Control of the electric windows relay'
  fr: 'Commande du relais des lève-vitres'
  es: 'Mando del relé de los elevalunas'
  de: 'Ansteuerung des Relais der Fensterheber'
  pl: 'Sterowanie przekaźnika podnośników szyb'
  hu: 'Ablakemelők relé vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the electric windows relay'
      fr: 'Commande du relais des lève-vitres'
      es: 'Mando del relé de los elevalunas'
      de: 'Ansteuerung des Relais der Fensterheber'
      pl: 'Sterowanie przekaźnika podnośników szyb'
      hu: 'Ablakemelők relé vezérlése'
    max_duration_ms: 1000
