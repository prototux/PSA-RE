ioctl: 0xDAE3
name: 'CONTROL_ACTIVATION_VOLUMETRIC_MONITORING'
display_name:
  en: 'Control of activation of the volumetric monitoring'
  fr: 'Commande d''activation de la surveillance volumétrique'
  es: 'Mando de activación de la vigilancia volumétrica'
  de: 'Aktivierungsbetätigung der Innenraumüberwachung'
  pl: 'Sterowanie włączeniem nadzoru objętościowego'
  hu: 'A térvédelemfelügyelet aktiváló kapcsolója'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of activation of the volumetric monitoring'
      fr: 'Commande d''activation de la surveillance volumétrique'
      es: 'Mando de activación de la vigilancia volumétrica'
      de: 'Aktivierungsbetätigung der Innenraumüberwachung'
      pl: 'Sterowanie włączeniem nadzoru objętościowego'
      hu: 'A térvédelemfelügyelet aktiváló kapcsolója'
    max_duration_ms: 1000
