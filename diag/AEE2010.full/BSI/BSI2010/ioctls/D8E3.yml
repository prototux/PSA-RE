ioctl: 0xD8E3
name: 'CONTROL_LPG_MODE_LED'
display_name:
  en: 'Control of the LPG mode LED'
  fr: 'Commande de la LED du mode GPL'
  es: 'Mando del LED del modo GPL'
  de: 'Ansteuerung der LED des Flüssiggasbetriebs'
  pl: 'Sterowanie diody LED trybu LPG'
  hu: 'Az LPG modul LED vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the LPG mode LED'
      fr: 'Commande de la LED du mode GPL'
      es: 'Mando del LED del modo GPL'
      de: 'Ansteuerung der LED des Flüssiggasbetriebs'
      pl: 'Sterowanie diody LED trybu LPG'
      hu: 'Az LPG modul LED vezérlése'
    max_duration_ms: 3000
