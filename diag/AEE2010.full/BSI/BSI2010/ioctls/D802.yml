ioctl: 0xD802
name: 'LOW_SPEED_WINDSCREEN_WIPE_CONTROL'
display_name:
  en: 'Low-speed windscreen wipe control'
  fr: 'Commande d''essuyage pare-brise petite vitesse'
  es: 'Mando de limpiado parabrisas pequeña velocidad'
  de: 'Betätigung Frontscheibenwischer niedrige Geschwindigkeit'
  pl: 'Przełącznik małej prędkości wycieraczki szyby przedniej'
  hu: 'Szélvédotörlés-vezérlés alacsony sebességfokozaton'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Low-speed windscreen wipe control'
      fr: 'Commande d''essuyage pare-brise petite vitesse'
      es: 'Mando de limpiado parabrisas pequeña velocidad'
      de: 'Betätigung Frontscheibenwischer niedrige Geschwindigkeit'
      pl: 'Przełącznik małej prędkości wycieraczki szyby przedniej'
      hu: 'Szélvédotörlés-vezérlés alacsony sebességfokozaton'
    max_duration_ms: 3000
  - display_name:
      en: 'Fast speed windscreen wiper control'
      fr: 'Commande d''essuyage pare-brise grande vitesse'
      es: 'Mando de barrido parabrisas velocidad rápida'
      de: 'Betätigung Frontscheibenwischer große Geschwindigkeit'
      pl: 'Wlaczanie duzej predkosci pracy wycieraczek'
      hu: 'Nagy sebességű szélvédo törlés kapcsoló'
    max_duration_ms: 3000
  - display_name:
      en: 'Low-speed windscreen wipe control (Wire control)'
      fr: 'Commande d''essuyage pare-brise petite vitesse (Commande filaire)'
      es: 'Mando de limpiado parabrisas pequeña velocidad (Mando por hilos)'
      de: 'Betätigung Frontscheibenwischer niedrige Geschwindigkeit (Steuerung über Kabelverbindung)'
      pl: 'Przełącznik małej prędkości wycieraczki szyby przedniej (Sterowanie przewodowe)'
      hu: 'Szélvédotörlés-vezérlés alacsony sebességfokozaton (Vezetékes vezérlés)'
    max_duration_ms: 10000
  - display_name:
      en: 'High-speed windscreen wipe control (Wire control)'
      fr: 'Commande d''essuyage pare-brise grande vitesse (Commande filaire)'
      es: 'Mando de limpiado parabrisas gran velocidad (Mando por hilos)'
      de: 'Betätigung Frontscheibenwischer hohe Geschwindigkeit (Steuerung über Kabelverbindung)'
      pl: 'Przełącznik dużej prędkości wycieraczki szyby przedniej (Sterowanie przewodowe)'
      hu: 'Szélvédotörlés-vezérlés magas sebességfokozaton (Vezetékes vezérlés)'
    max_duration_ms: 10000
