ioctl: 0xD873
name: 'CONTROL_REAR_FOGLAMPS'
display_name:
  en: 'Control of the rear foglamps'
  fr: 'Commande des feux de brouillard arrière'
  es: 'Mando de las luces antiniebla traseras'
  de: 'Ansteuerung der Nebelschlussleuchten'
  pl: 'Włączenie tylnych świateł przeciwmgielnych'
  hu: 'Hátsó ködlámpa vezérlés'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the rear foglamps'
      fr: 'Commande des feux de brouillard arrière'
      es: 'Mando de las luces antiniebla traseras'
      de: 'Ansteuerung der Nebelschlussleuchten'
      pl: 'Włączenie tylnych świateł przeciwmgielnych'
      hu: 'Hátsó ködlámpa vezérlés'
    max_duration_ms: 5000
