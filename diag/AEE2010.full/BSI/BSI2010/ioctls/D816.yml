ioctl: 0xD816
name: 'REAR_COURTESY_LAMP_AND_OR_REAR_READING_LAMPS'
display_name:
  en: 'Rear courtesy lamp and/or rear reading lamps lighting control'
  fr: 'Commande d''éclairage du plafonnier arrière et/ou liseuses arrière'
  es: 'Mando de iluminación de la luz de techo trasera y/o luces de lectura traseras'
  de: 'Beleuchtungsbetätigung der Deckenleuchte hinten und/oder Leseleuchten hinten'
  pl: 'Sterowanie oświetlenia tylnej lampki sufitowej i/lub tylnej lampki do czytania'
  hu: 'Hátsó olvasólámpák és/vagy hátsó mennyezetlámpa világítás kapcsoló'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Rear courtesy lamp and/or rear reading lamps lighting control'
      fr: 'Commande d''éclairage du plafonnier arrière et/ou liseuses arrière'
      es: 'Mando de iluminación de la luz de techo trasera y/o luces de lectura traseras'
      de: 'Beleuchtungsbetätigung der Deckenleuchte hinten und/oder Leseleuchten hinten'
      pl: 'Sterowanie oświetlenia tylnej lampki sufitowej i/lub tylnej lampki do czytania'
      hu: 'Hátsó olvasólámpák és/vagy hátsó mennyezetlámpa világítás kapcsoló'
    max_duration_ms: 5000
