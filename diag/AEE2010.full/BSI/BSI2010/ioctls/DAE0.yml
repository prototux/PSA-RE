ioctl: 0xDAE0
name: 'ACTIVATION_INTRUSION_ALARM_MONITORING'
display_name:
  en: 'Activation of the intrusion alarm monitoring'
  fr: 'Activation de la surveillance de l''alarme antieffraction'
  es: 'Activación de la vigilancia de la alarma antirrobo'
  de: 'Aktivierung der Überwachung des Aufbruchalarms'
  pl: 'Aktywacja nadzoru alarmu przeciwwłamaniowego'
  hu: 'A behatolásgátló riasztó felügyelet aktiválása'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Activation of the intrusion alarm monitoring'
      fr: 'Activation de la surveillance de l''alarme antieffraction'
      es: 'Activación de la vigilancia de la alarma antirrobo'
      de: 'Aktivierung der Überwachung des Aufbruchalarms'
      pl: 'Aktywacja nadzoru alarmu przeciwwłamaniowego'
      hu: 'A behatolásgátló riasztó felügyelet aktiválása'
    max_duration_ms: 1000
