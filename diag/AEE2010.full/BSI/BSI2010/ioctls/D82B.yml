ioctl: 0xD82B
name: 'MAIN_BEAM_HEADLAMP_CONTROL'
display_name:
  en: 'Main beam headlamp control'
  fr: 'Commande des feux de route'
  es: 'Mando de las luces de carretera'
  de: 'Steuerung Fernlicht'
  pl: 'Włączenie świateł drogowych'
  hu: 'Országúti fényszórók vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Main beam headlamp control'
      fr: 'Commande des feux de route'
      es: 'Mando de las luces de carretera'
      de: 'Steuerung Fernlicht'
      pl: 'Włączenie świateł drogowych'
      hu: 'Országúti fényszórók vezérlése'
    max_duration_ms: 5000
