ioctl: 0xD827
name: 'MAIN_BEAM_HEADLAMPS_ASSISTANT_ACTIVATION_BUTTON'
display_name:
  en: 'Main beam headlamps assistant activation button indicator lamp lighting control'
  fr: 'Commande d''allumage du témoin du bouton d''activation de l''assistant feux de route'
  es: 'Mando de encendido del testigo del botón de activación del asistente de luces de carretera'
  de: 'Ansteuerung Aufleuchten der Kontrollleuchte der Aktivierungstaste des Fernlichtassistenten'
  pl: 'Sterowanie zapalenia lampki kontrolnej przycisku włączania wspomagania świateł drogowych'
  hu: 'A fényszóróasszisztens aktiváló gomb visszajelzés bekapcsolás vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION_1:
    bits: '2.7-2.0'
    type: 'uint'

  SETPOINT_VALUE_1:
    bits: '3.7-3.0'
    type: 'uint'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Main beam headlamps assistant activation button indicator lamp lighting control'
      fr: 'Commande d''allumage du témoin du bouton d''activation de l''assistant feux de route'
      es: 'Mando de encendido del testigo del botón de activación del asistente de luces de carretera'
      de: 'Ansteuerung Aufleuchten der Kontrollleuchte der Aktivierungstaste des Fernlichtassistenten'
      pl: 'Sterowanie zapalenia lampki kontrolnej przycisku włączania wspomagania świateł drogowych'
      hu: 'A fényszóróasszisztens aktiváló gomb visszajelzés bekapcsolás vezérlése'
    max_duration_ms: 5000
