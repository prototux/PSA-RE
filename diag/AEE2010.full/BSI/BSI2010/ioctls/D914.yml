ioctl: 0xD914
name: 'PTC_ADDITIONAL_HEATING_RESISTOR_1_CONTROL'
display_name:
  en: 'PTC additional heating resistor 1 control'
  fr: 'Commande résistance additionnelle CTP 1'
  es: 'Mando de resistencia adicional CTP 1'
  de: 'Steuerung Zusatz-Widerstand PTC 1'
  pl: 'Sterowanie dodatkową rezystancją CTP 1'
  hu: 'PTC 1 kiegészítő ellenállás vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'PTC additional heating resistor 1 control'
      fr: 'Commande résistance additionnelle CTP 1'
      es: 'Mando de resistencia adicional CTP 1'
      de: 'Steuerung Zusatz-Widerstand PTC 1'
      pl: 'Sterowanie dodatkową rezystancją CTP 1'
      hu: 'PTC 1 kiegészítő ellenállás vezérlése'
    max_duration_ms: 10000
  - display_name:
      en: 'PTC additional heating resistor 2 control'
      fr: 'Commande résistance additionnelle CTP 2'
      es: 'Mando de resistencia adicional CTP 2'
      de: 'Steuerung Zusatz-Widerstand PTC 2'
      pl: 'Sterowanie dodatkową rezystancją CTP 2'
      hu: 'PTC 2 kiegészítő ellenállás vezérlése'
    max_duration_ms: 10000
  - display_name:
      en: 'Additional resistors PTC1 and PTC2 control'
      fr: 'Commande des résistances additionnelles CTP1 et CTP2'
      es: 'Mando de las resistencias adicionales CTP1 y CTP2'
      de: 'Steuerung der Zuheizer-Widerstände PTC1 und PTC2'
      pl: 'Sterowanie dodatkowych rezystancji CTP1 i CTP2'
      hu: 'CTP1 és CTP2 kiegészítő ellenállások vezérlése'
    max_duration_ms: 10000
