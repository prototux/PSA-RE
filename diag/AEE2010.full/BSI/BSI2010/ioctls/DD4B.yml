ioctl: 0xDD4B
name: 'CONTROL_AUDIBLE_WARNING_EMERGENCY_COLLISION'
display_name:
  en: 'Control of the audible warning for the emergency collision braking fault'
  fr: 'Pilotage de l''alerte sonore pour le défaut freinage automatique en cas de risque de collision'
  es: 'Pilotaje de la alerta sonora para el defecto de frenada automática en caso de riesgo de colisión'
  de: 'Steuerung der akustischen Warnung für den Fehler automatisches Bremsen in Fall einer Kollisionsgefahr'
  pl: 'Sterowanie alarmu dźwiękowego dla usterki automatycznego hamowania w przypadku ryzyka kolizji'
  hu: 'Hang általi figyelmeztetés vezérlése az automatikus fékezés ütközés kockázata esetén hiba számára'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SETPOINT_DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  SETPOINT_VALUE:
    bits: '3.7-3.0'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the audible warning for the emergency collision braking fault'
      fr: 'Pilotage de l''alerte sonore pour le défaut freinage automatique en cas de risque de collision'
      es: 'Pilotaje de la alerta sonora para el defecto de frenada automática en caso de riesgo de colisión'
      de: 'Steuerung der akustischen Warnung für den Fehler automatisches Bremsen in Fall einer Kollisionsgefahr'
      pl: 'Sterowanie alarmu dźwiękowego dla usterki automatycznego hamowania w przypadku ryzyka kolizji'
      hu: 'Hang általi figyelmeztetés vezérlése az automatikus fékezés ütközés kockázata esetén hiba számára'
    max_duration_ms: 3000
