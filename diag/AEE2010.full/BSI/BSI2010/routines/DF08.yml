routine: 0xDF08
name: 'AUTHENTICATION_KEYS_OR_HANDS_FREE_REMOTE'
display_name:
  en: 'Authentication of the keys or of the hands-free remote controls'
  fr: 'Authentification des clés ou des télécommandes mains libres'
  es: 'Autentificación de las llaves o de los mandos a distancia manos libres'
  de: 'Authentifizierung der Schlüssel oder der Freihandfernbedienungen'
  pl: 'Uwierzytelnienie kluczy lub zdalnych sterowań bez użycia rąk'
  hu: 'Szabadkezes távirányítók vagy kulcsok hitelesítése'
control: ['start', 'stop', 'results']

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Activation in progress'
        fr: 'Activation en cours'
        es: 'Activación en curso'
        de: 'Aktivierung läuft'
        pl: 'Aktywacja w trakcie'
        hu: 'Aktiv l s folyamatban'
      0x02:
        en: 'Key or hands-free remote control recognised'
        fr: 'Clé ou télécommande mains-libres reconnues'
        es: 'Llave o mando a distancia manos libres reconocidos'
        de: 'Schlüssel oder Freihandfernbedienung erkannt'
        pl: 'Klucz lub zdalne sterowanie bez użycia rąk rozpoznane'
        hu: 'Kulcs vagy szabadkezes távirányító felismerve'

  ACTIVATION_DONE_PROBLEM_OCCURRED_DURING:
    bits: '2.7-2.0'
    comment:
      en: 'Activation done, a problem occurred during the operation.'
      fr: 'Activation terminée, un problème est survenu lors du pilotage.'
      es: 'Finalizada la activación, surge un problema al pilotar.'
      de: 'Aktivierung beendet, während der Steuerung ist eine Störung aufgetreten.'
      pl: 'Aktywacja zakonczona, wystapil problem podczas sterowania.'
      hu: 'Aktíválás befejezodött, a vezérlés idején egy probléma lépett fel.'
    type: 'enum'
    values:
      0x00:
        en: 'Transponder not authenticated'
        fr: 'Transpondeur non authentifié'
        es: 'Tansponder no autentificado'
        de: 'Transponder nicht authentifiziert'
        pl: 'Transponder nie rozpoznany'
        hu: 'Transzponder nem hitelesített'
      0x01:
        en: 'Transponder not recognised'
        fr: 'Transpondeur non reconnu'
        es: 'Transpondedor no reconocido'
        de: 'Transponder nicht erkannt'
        pl: 'Transponder nierozpoznany'
        hu: 'Fel nem ismert transzponder'
      0x02:
        en: 'BSI locked'
        fr: 'BSI verrouillé'
        es: 'BSI bloqueada'
        de: 'Zentralschalteinheit (BSI) gesperrt'
        pl: 'BSI zablokowany'
        hu: 'Lezárt BSI'

tests:
  - display_name:
      en: 'Authentication of the keys or of the hands-free remote controls'
      fr: 'Authentification des clés ou des télécommandes mains libres'
      es: 'Autentificación de las llaves o de los mandos a distancia manos libres'
      de: 'Authentifizierung der Schlüssel oder der Freihandfernbedienungen'
      pl: 'Uwierzytelnienie kluczy lub zdalnych sterowań bez użycia rąk'
