routine: 0xDF1E
name: 'RESET_ZERO_COUNTER_NUMBER_RESTARTS'
display_name:
  en: 'Reset to zero of the counter for the number of restarts'
  fr: 'Remise à zéro du compteur de nombre de redémarrage'
  es: 'Puesta a cero del contador de número de arranques'
  de: 'Rückstellung des Zählers Anzahl Neustarts auf Null'
  pl: 'Zerowanie licznika liczby ponownych rozruchów'
  hu: 'Újraindítási szám számlálójának nullázása.'
control: ['start', 'stop', 'results']

results:
  ROUTINE_RESULT_RESET:
    bits: '1.7-1.0'
    type: 'enum'

  ACTIVATION_DONE_PROBLEM_OCCURRED_DURING:
    bits: '2.7-2.0'
    comment:
      en: 'Activation done, a problem occurred during the operation.'
      fr: 'Activation terminée, un problème est survenu lors du pilotage.'
      es: 'Finalizada la activación, surge un problema al pilotar.'
      de: 'Aktivierung beendet, während der Steuerung ist eine Störung aufgetreten.'
      pl: 'Aktywacja zakonczona, wystapil problem podczas sterowania.'
      hu: 'Aktíválás befejezodött, a vezérlés idején egy probléma lépett fel.'
    type: 'enum'
    values:
      0x00:
        en: 'The vehicle is not fitted with the "Stop and Start" function or the vehicle is not hybrid'
        fr: 'Le véhicule n''est pas équipé de la fonction "Stop and Start" ou le véhicule n''est pas hybride'
        es: 'El vehículo no está equipado con función "Stop and Start" o el vehículo no es híbrido'
        de: 'Das Fahrzeug ist nicht mit der Funktion "Stop and Start" ausgestattet oder es handelt sich nicht um ein Hybridfahrzeug'
        pl: 'Samochód nie jest wyposażony w funkcję "Stop and Start" lub samochód nie jest hybrydą'
        hu: 'A gépjármű nincs felszerelve "Stop and Start" funkcióval vagy a gépjármű nem hibrid'

tests:
  - display_name:
      en: 'Reset to zero of the counter for the number of restarts'
      fr: 'Remise à zéro du compteur de nombre de redémarrage'
      es: 'Puesta a cero del contador de número de arranques'
      de: 'Rückstellung des Zählers Anzahl Neustarts auf Null'
      pl: 'Zerowanie licznika liczby ponownych rozruchów'
      hu: 'Újraindítási szám számlálójának nullázása.'
