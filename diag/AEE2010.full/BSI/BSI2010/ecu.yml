node: 'BSI'
model: 'BSI2010'
display_name:
  en: 'Body control module / main gateway (BSI2010)'
  fr: 'Boitier de servitude intelligent (BSI2010)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x752
    response_id: 0x652
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'

resets:
  0x01:
    en: 'Hard reset'
    fr: 'Réinitialisation matérielle'
  0x42:
    en: 'Manufacturer specific reset'
    fr: 'Réinitialisation spécifique constructeur'

services: [0x10, 0x11, 0x14, 0x19, 0x22, 0x27, 0x2E, 0x2F, 0x31, 0x34, 0x3E, 0x85]

security_access:
  - level: 0x03
    algorithm: 'PSA_SEED_KEY'
    key: 'E4D8'
    comment:
      en: 'Other keys seen for this ECU: C318'
      fr: 'Autres clés vues pour ce calculateur : C318'

tester_present:
  request: '3E 00'
  period_ms: 1000

identification:
  request: '22 F0 80'
  part_number: '1.7-5.0'
  comment:
    en: 'The ECU part number is in data bytes 1 to 5 of the answer to 22 F0 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 1 à 5 de la réponse à 22 F0 80 (DCB), elle donne la variante logicielle'

cars: ['A9', 'B7', 'B75', 'B78', 'B8', 'E3', 'G9', 'M33', 'T9', 'W2']

