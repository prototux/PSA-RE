did: 0xDB9E
name: 'DETECTION_DOUBLE_PRESS_STOP_AND_START_SWITCH'
display_name:
  en: 'Detection of a double press on the stop and start switch'
  fr: 'Détection d''un double appui sur le commutateur stop and start'
  es: 'Detección de una doble pulsación del conmutador stop and start'
  de: 'Erkennung einer doppelten Betätigung auf den Schalter Stop and Start'
  pl: 'Wykrycie podwójnego naciśnięcia na włącznik Stop and Start'
  hu: 'A stop and start kapcsoló kettős megnyomásának észlelése'
comment:
  en: 'The parameter is on "yes" when 2 presses on the stop and start switch are detected in less than 2 seconds'
  fr: 'Le paramètre est à "oui" lorsque 2 appuis sur le commutateur stop and start sont détectés en moins de 2 secondes'
  es: 'El parámetro está en "sí" cuando se detectan 2 pulsaciones del conmutador stop and start en menos de 2 segundos'
  de: 'Der Parameter steht auf "Ja", wenn innerhalb von weniger als 2 Sekunden 2 Betätigungen des Schalters Stop and Start erkannt werden'
  pl: 'Parametr ustawiony jest na "tak", gdy 2 naciśnięć przełącznika stop and start zostanie wykrytych w czasie krótszym niż 2 s'
  hu: 'A paraméter "igen", amikor 2 megnyomás kerül észlelésre a stop and start kapcsolón kevesebb mint 2 másodperc alatt'
kind: 'live'
access: 'read'
length: 1

params:
  DETECTION_DOUBLE_PRESS_STOP_AND_START_SWITCH:
    bits: '1.0'
    comment:
      en: 'Detection of a double press on the stop and start switch'
      fr: 'Détection d''un double appui sur le commutateur stop and start'
      es: 'Detección de una doble pulsación del conmutador stop and start'
      de: 'Erkennung einer doppelten Betätigung auf den Schalter Stop and Start'
      pl: 'Wykrycie podwójnego naciśnięcia na włącznik Stop and Start'
      hu: 'A stop and start kapcsoló kettős megnyomásának észlelése'
    type: 'bool'
    values:
      0x00:
        en: 'NO'
        fr: 'NON'
        es: 'NO'
        de: 'NEIN'
        pl: 'NIE'
        hu: 'NEM/NINCS'
      0x01:
        en: 'Yes'
        fr: 'Oui'
        es: 'Sí'
        de: 'Ja'
        pl: 'Tak'
        hu: 'Igen'
