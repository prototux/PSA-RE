name: 'COUNTER_NUMBER_TIMES_STOPPING_ENGINE_HAS_BEEN'
display_name:
  en: 'Counter of the number of times stopping of the engine has been prohibited, due to a vehicle electrical balance which would not permit restarting of the internal combustion engine, during the last 20-40 kilometres'
  fr: 'Compteur d''interdiction d''arrêt du moteur, dû à un bilan électrique véhicule ne permettant pas le redémarrage du moteur thermique, durant les 20-40 derniers kilomètres'
  es: 'Contador de prohibición de arranque del motor, debido a un control eléctrico del vehículo que no permite el rearranque del motor térmico, durante los 20-40 últimos kilómetros'
  de: 'Zähler Unterbindung Motor abstellen aufgrund einer elektrischen Bilanz des Fahrzeugs, die einen Neustart des Verbrennungsmotors nicht zulässt, während der 20-40 letzten Kilometer'
  pl: 'Licznik zakazu zatrzymania silnika, wynikającego z bilansu elektrycznego samochodu, nie pozwalającego na ponowny rozruch silnika cieplnego w czasie 20-40 ostatnich kilometrów'
  hu: 'A gépjármű elektromos mérlegéből adódó motorleállás letiltás számláló nem teszi lehetővé a belsőégésű motor újraindítását a 20-40 utolsó kilométeren'
kind: 'live'
access: 'read'
length: 1

