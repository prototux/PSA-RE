did: 0xDA4F
name: 'LAST_CONDITION_MAINTAINING_SUPPLY_CENTRAL_POWER'
display_name:
  en: 'Last condition of maintaining of the supply of the central power switch (+CPC)'
  fr: 'Dernière condition de maintien de l''alimentation du commutateur de puissance centralisé (+CPC)'
  es: 'Última condición de mantenimiento de la alimentación del conmutador de potencia centralizado (+CPC)'
  de: 'Letze Bedingung für das Halten der Versorgung des zentralen Leistungsschalters (+CPC)'
  pl: 'Ostatni warunek utrzymania zasilania centralnego przełącznika mocy (+CPC)'
  hu: 'Központi teljesítménykapcsoló (+CPC) tápellátását fenntartó utolsó feltétel'
comment:
  en: 'Condition recorded at the last cutting of supply (Central power switch positive) The status of the parameter is updated after the vehicle has become dormant (30 minutes maximum) then been triggered'
  fr: 'Condition enregistrée lors de la dernière coupure d''alimentation (Plus commutateur de puissance centralisé) L''état du paramètre est mis à jour après un endormissement (30 minutes maximum) suivi d''un réveil du véhicule'
  es: 'Condición registrada en el último corte de la alimentación (Positivo conmutador de potencia centralizado) El estado del parámetro se actualiza después de un adormecimiento (30 minutos máximo) seguido de un despertado del vehículo'
  de: 'Beim letzten Ausschalten der Versorgung gespeicherte Bedingung (Plus zentraler Leistungsschalter) Der Zustand des Parameters wird nach einer Deaktivierung (30 Minuten maximal) gefolgt von einer Reaktivierung des Fahrzeugs aktualisiert'
  pl: 'Warunek odnotowany w czasie ostatniego odcięcia zasilania (Plus scentralizowanego przełącznika mocy) Stan parametru jest aktualizowany po uśpieniu (30 min maksimum) po którym następuje przebudzenie samochodu'
  hu: 'A tápellátás utolsó lekapcsolás során elmentett feltétel (Központi teljesítménykapcsoló plusz.) A paraméter állapota fel van frissítve egy gépjármű ébresztését követő elalvás(maximum 30 perc) után'
kind: 'live'
access: 'read'
length: 1

