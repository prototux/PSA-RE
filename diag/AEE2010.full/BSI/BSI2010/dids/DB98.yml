did: 0xDB98
name: 'DURATION_JOURNEY_1'
display_name:
  en: 'Duration of journey 1'
  fr: 'Durée du trajet 1'
  es: 'Duración del trayecto 1'
  de: 'Dauer der Strecke 1'
  pl: 'Czas pokonania trasy 1'
  hu: 'Az útvonal 1 időtartama'
comment:
  en: 'The duration of trip 1 corresponds to the number of seconds elapsed since the last zero reset of the data of tab 1 of the trip computer.The value indicated gives a running total for several journeys if the data of tab 1 on the trip computer are not reset for each journey.'
  fr: 'La durée du trajet 1 correspond au nombre de secondes écoulées depuis la dernière remise à zéro des données de l''onglet 1 de l''ordinateur de bord.La valeur indiquée peut cumuler plusieurs trajets dans le cas où les données de l''onglet 1 de l''ordinateur de bord ne sont pas remises à zéro à chaque trajet.'
  es: 'La duración del trayecto 1 corresponde al número de segundos transcurridos desde la última puesta a cero de los datos de la pestaña 1 del ordenador de a bordo.El valor indicado puede acumular varios trayectos en el caso en que los datos de la pestaña 1 del ordenador de a bordo no se pongan a cero en cada trayecto.'
  de: 'Die Dauer der Strecke 1 entspricht der Anzahl verstrichener Sekunden seit der letzen Rückstellung der Daten der Funktion 1 des Bordcomputers auf Null.Der angezeigte Wert kann mehrere Strecken kumulieren, falls die Daten der Funktion 1 des Bordcomputers nicht bei jeder Strecke auf Null zurückgestellt werden.'
  pl: 'Czas trwania odcinka 1 odpowiada ilości sekund, które upłynęły od ostatniego wyzerowania danych zakładki 1 komputera pokładowego.Wartość wskazana może zawierać sumę licznych przejazdów w przypadku gdy dane zakładki 1 komputera pokładowego nie zostały wyzerowane dla każdego przejazdu.'
  hu: 'A 1 útvonal időtartama megfelel a fedélzeti számítógép 1 füle adatainak utolsó nullázása óta eltelt másodpercek számának.A kijelzett érték egy vagy több útvonalat összesíthet abban az esetben, amikor a fedélzeti számítógép 1 füle adatai nem kerülnek nullázásra minden útvonalnál..'
kind: 'live'
access: 'read'
length: 4

