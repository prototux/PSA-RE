comment:
  en: 'Condition recorded the last the LIN 2 became dormant The status of the parameter is updated after a switch to dormant mode (5 minutes maximum) followed by triggering of the LINs 2'
  fr: 'Condition enregistrée lors du dernier endormissement du réseau LIN 2 L''état du paramètre est mis à jour après un endormissement (5 minutes maximum) suivi d''un réveil des réseaux LIN 2'
  es: 'Condición registrada en el último adormecimiento de la red LIN 2 El estado del parámetro se ha actualizado después del adormecimiento (5 minutos como máximo) seguido de un despertado de las redes LIN 2'
  de: 'Beim letzten Deaktivieren des Netzes LIN 2 gespeicherte Bedingung Der Zustand des Parameters wird nach einer Deaktivierung (maximal 5 Minuten), gefolgt von einer Aktivierung der LIN-Netze 2 aktualisiert'
  pl: 'Warunek odnotowany w czasie ostatniego uśpienia sieci LIN 2 Stan parametru jest aktualizowany po uśpieniu (maksimum 5 min), a następnie przebudzeniu sieci LIN 2'
  hu: 'A LIN 2 hálózat utolsó elalvása során elmentett feltétel A paraméter állapota frissítésre került a LIN 2 hálózatok ébresztését követő (maximum 5 perces) elalvása után'
