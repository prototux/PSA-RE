did: 0xDA57
name: 'LAST_CONDITION_TRIGGERING_INTERSYSTEM_CANS'
display_name:
  en: 'Last condition of triggering of the intersystem CANs'
  fr: 'Dernière condition de réveil des réseaux CAN intersystème'
  es: 'Última condición de despertado de las redes CAN intersistema'
  de: 'Letzte Bedingung für die Reaktivierung der systemübergreifenden CAN-Netze'
  pl: 'Ostatni warunek przebudzenia sieci CAN Intersystem'
  hu: 'CAN rendszerközi hálózatokat ébresztő utolsó feltétel'
comment:
  en: 'Condition recorded at the last waking up of the intersystem CAN network The parameter status is updated after a going to sleep (30 minutes maximum) followed by a BSI wake-up'
  fr: 'Condition enregistrée lors du dernier réveil du réseau CAN intersystème L''état du paramètre est mis à jour après un endormissement (30 minutes maximum) suivi d''un réveil du boîtier de servitude intelligent'
  es: 'Condición registrada en el último despertado de la red CAN intersistema El estado del parámetro se actualiza después de un adormecimiento (30 minutos como máximo) seguido de un despertado de la caja de servicio inteligente'
  de: 'Bei der letzten Aktivierung des systemübergreifenden CAN-Netzes gespeicherte Bedingung Der Zustand des Parameters wird nach einer Deaktivierung (maximal 30 Minuten) gefolgt von einer Wiederaktivierung der Zentralschalteinheit aktualisiert'
  pl: 'Warunek zarejestrowany podczas ostatniego przebudzenia sieci CAN Intersystem Stan parametru jest aktualizowany po uśpieniu (maksymalnie 30 minut), po którym następuje przebudzenie inteligentnego modułu sterującego'
  hu: 'A CAN rendszerközi hálózat utolsó ébresztése során elmentett feltétel A paraméter állapota egy intelligens kiszolgálóegység ébresztést követő elalvás (maximum 30 perc) után került frissítés'
kind: 'live'
access: 'read'
length: 1

