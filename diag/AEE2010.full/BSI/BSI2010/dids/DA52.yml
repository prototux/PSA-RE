did: 0xDA52
name: 'LAST_CONDITION_TRIGGERING_CAN_LS_PASSENGER'
display_name:
  en: 'Last condition for triggering of the CAN_LS (passenger compartment) networks'
  fr: 'Dernière condition de réveil des réseaux CAN_LS (habitacle)'
  es: 'Última condición de despertado de las redes CAN_LS (habitáculo)'
  de: 'Letzte Bedingung für die Reaktivierung der Netze CAN_LS (Innenraum)'
  pl: 'Ostatni warunek przebudzenia sieci CAN_LS (kabina)'
  hu: 'CAN_LS hálózatok (utastér) ébresztésének utolsó feltétele'
comment:
  en: 'Condition recorded the last time the CAN_LS networks were triggered (passenger compartment). The status of the parameter is updated after the CAN_LS networks have become dormant (5 minutes maximum) then been triggered (passenger compartment)'
  fr: 'Condition enregistrée lors du dernier réveil des réseaux CAN_LS (habitacle). L''état du paramètre est mis à jour après un endormissement (5 minutes maximum) suivi d''un réveil des réseaux CAN_LS (habitacle)'
  es: 'Condición registrada en el último despertado de las redes CAN_LS (habitáculo). El estado del parámetro se actualiza después de un adormecimiento (5 minutos máximo) seguido de un despertado de las redes CAN_LS (habitáculo)'
  de: 'Bei der letzten Reaktivierung der Netze CAN_LS gespeicherte Bedingung (Fahrgastraum). Der Zustand des Parameters wird nach einer Deaktivierung (5 Minuten maximal) gefolgt von einer Aktivierung der Netze CAN_LS aktualisiert (Fahrgastraum)'
  pl: 'Warunek odnotowany w czasie ostatniego przebudzenia sieci CAN_LS (kabina). Stan parametru jest aktualizowany po uśpieniu (5 min maksimum) po którym następuje przebudzenie sieci CAN_LS (kabina)'
  hu: 'A CAN_LS hálózatok utolsó ébresztése során elmentett feltétel (utastér). A paraméter állapota fel van frissítve a CAN_LS hálózatok egy ébresztését követő elalvása (maximum 5 perc) után (utastér)'
kind: 'live'
access: 'read'
length: 1

