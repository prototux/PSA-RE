did: 0xDB60
name: 'POSITION_GEAR_LEVER'
display_name:
  en: 'Position of the gear lever'
  fr: 'Position du levier de vitesses'
  es: 'Posición de la palanca de velocidades'
  de: 'Wählhebelstellung'
  pl: 'Połozenie dźwigni biegów'
  hu: 'Sebességváltó kar helyzete'
comment:
  en: 'Parameter used for the display. applicable only if the vehicle is fitted with a piloted manual gearbox or an automatic gearbox.'
  fr: 'Paramètre utilisé pour l''affichage. valable uniquement si le véhicule est équipé d''une boîte de vitesses manuelle pilotée ou d''une boîte de vitesses automatique.'
  es: 'Parámetro utilizado para la indicación. válido únicamente si el vehículo está equipado con una caja de velocdiades manual pilotada o una caja de velocidades automática.'
  de: 'Für die Anzeige verwendeter Parameter. nur gültig, wenn das Fahrzeug mit einem automatisierten Schaltgetriebe oder einem Automatikgetriebe ausgestattet ist.'
  pl: 'Parametr wykorzystywany do wyświetlania. ważne wyłącznie gdy samochód jest wyposażony w ręczną sterowaną skrzynię biegów lub automatyczną skrzynię biegów.'
  hu: 'A kijelzés számára használt paraméter. csupán akkor érvényes, ha a gépjármű egy automata sebességváltóval vagy egy vezérelt mechanikus sebességváltóval van felszerelve.'
kind: 'live'
access: 'read'
length: 1

