did: 0xDA60
name: 'LAST_CONDITION_MAINTAINING_BSI'
display_name:
  en: 'Last condition of maintaining of the BSI'
  fr: 'Dernière condition de maintien du boîtier de servitude intelligent'
  es: 'Última condición de mantenimiento de la caja de servicio inteligente'
  de: 'Letzte Bedingung für das Halten der Zentralschalteinheit'
  pl: 'Ostatni warunek utrzymania inteligentnego modułu sterującego'
  hu: 'Intelligens kiszolgálóegységet fenntartó utolsó feltétel'
comment:
  en: 'Condition recorded at the last going to sleep of the BSI The parameter status is updated after a going to sleep (30 minutes maximum) followed by a BSI wake-up'
  fr: 'Condition enregistrée lors du dernier endormissement du boîtier de servitude intelligent L''état du paramètre est mis à jour après un endormissement (30 minutes maximum) suivi d''un réveil du boîtier de servitude intelligent'
  es: 'Condición registrada en el último adormecimiento de la caja de servicio inteligente El estado del parámetro se actualiza después de un adormecimiento (30 minutos como máximo) seguido de un despertado de la caja de servicio inteligente'
  de: 'Während der letzten Deaktivierung der Zentralschalteinheit gespeicherte Bedinung Der Zustand des Parameters wird nach einer Deaktivierung (maximal 30 Minuten) gefolgt von einer Wiederaktivierung der Zentralschalteinheit aktualisiert'
  pl: 'Warunek zarejestrowany podczas ostatniego uśpienia inteligentnego modułu sterującego Stan parametru jest aktualizowany po uśpieniu (maksymalnie 30 minut), po którym następuje przebudzenie inteligentnego modułu sterującego'
  hu: 'Az intelligens kiszolgálóegység utolsó elalvása során elmentett feltétel A paraméter állapota egy intelligens kiszolgálóegység ébresztést követő elalvás (maximum 30 perc) után került frissítés'
kind: 'live'
access: 'read'
length: 1

