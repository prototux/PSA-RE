did: 0xDAD8
name: 'SIGNALLING_PERIMETER_INTRUSION'
display_name:
  en: 'Signalling of perimeter intrusion'
  fr: 'Signalisation d''effraction périmétrique'
  es: 'Señalización de intrusión perimétrica'
  de: 'Anzeige Aufbruch von außen'
  pl: 'Sygnalizacja włamania rejestrowanego przez czujniki obwodowe'
  hu: 'Körkörös védelem megsértés jelzése'
comment:
  en: 'In the case of simultaneous intrusions, only one intrusion is taken into account.The bonnet intrusion has priority over the other types of intrusion.'
  fr: 'En cas d''effractions simultanées, une seule effraction est prise en compte.L''effraction capot moteur est prioritaire sur les autres types d''effraction.'
  es: 'En caso de varios intentos de robo simultáneos, sólo se tiene en cuenta uno.El intento de robo por el capó motor es prioritario sobre los otros tipos de intento de robo.'
  de: 'Bei gleichzeitigen Aufbrüchen wird nur ein Aufbruch berücksichtigt.Der Aufbruch Motorhaube hat Priorität vor allen andern Aufbruchtypen.'
  pl: 'W przypadku jednoczesnych włamań, tylko jedno włamanie jest uwzględniane.Włamanie przez pokrywę silnika jest priorytetowe w stosunku do innych typów włamań.'
  hu: 'Egyidőben történő behatolások esetén csupán egyetlen behatolás kerül figyelembevételre.A motorháztető behatolás elsőbbséget élvez a többi behatolási típussal szemben.'
kind: 'live'
access: 'read'
length: 1

