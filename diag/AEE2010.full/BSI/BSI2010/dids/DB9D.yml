did: 0xDB9D
name: 'MECHANICAL_ELECTRONIC_KEY_OR_HANDS_FREE_REMOTE'
display_name:
  en: 'Mechanical/electronic key or hands-free remote control present in the reader recognized'
  fr: 'Clé mécanique/électronique ou télécommande mains libres présente dans le lecteur reconnue'
  es: 'Llave mecánica/electrónica o mando a distancia manos libres presente en el lector reconocida'
  de: 'Mechanischer/Elektronischer Schlüssel oder Fernbedienung im Laufwerk erkannt'
  pl: 'Klucz mechaniczny/elektroniczny lub identyfikator zdalnego sterowania bez użycia rąk obecne w czytniku rozpoznane'
  hu: 'A lejolvasóban jelenlévő mechanikus/elektronikus kulcs vagy szabad kéz távirányító felismerve'
comment:
  en: 'For vehicles equipped with a hands-free identifier and which do not have an electronic key reader, the hands-free identifier must be placed on the hands-free identifier emergency authentication/identification aerial (Pictogram or emergency starting location)'
  fr: 'Pour les véhicules équipés d''identifiant mains-libres et sans lecteur de clé électronique, l''identifiant mains-libres doit être placé au niveau de l''antenne de secours d''authentification / identification d''identifiant mains-libres (Pictogramme ou logement de démarrage de secours)'
  es: 'Para los vehículos equipados con identificador manos libres y sin lector de llave electrónica, el identificador manos libres se debe situar a la altura de la antena de emergencia de autentificación/identificación del identificador manos libres (pictograma o compartimento de arranque de emergencia)'
  de: 'Bei Fahrzeugen, die mit schlüssellosem Identifikator und ohne Lesegerät des elektronischen Schlüssels ausgestattet sind, muss der schlüssellose Identifikator im Bereich der Notantenne für Authentifizierung / Identifizierung des schlüssellosen Identifikators (Piktogramm oder Aufnahme für Notstart) platziert werden'
  pl: 'Dla samochodów wyposażonych w identyfikatory systemu dostępu bez użycia rąk i bez czytnika klucza elektronicznego, identyfikator systemu dostępu bez użycia rąk powinien być umieszczony na poziomie anteny awaryjnej uwierzytelnienia / identyfikacji identyfikatora systemu dostępu bez użycia rąk (Piktogram lub gniazdo rozruchu awaryjnego)'
  hu: 'A szabadkezes azonosítókkal felszerelt és elektronikus kulcs leolvasó nélküli gépjárművek esetlében a szabadkezes azonosítót a szabadkezes azonosító azonosítása / hitelesítése biztonsági antennánál (Biztonsági indítás fészek vagy piktogram) kell elhelyezni'
kind: 'live'
access: 'read'
length: 1

