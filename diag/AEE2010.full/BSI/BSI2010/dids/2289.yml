did: 0x2289
name: 'SELECTION_SERVICING_MANAGED_ENGINE'
display_name:
  en: 'Selection of the servicing managed by the engine'
  fr: 'Sélection de la maintenance gérée par la motorisation'
  es: 'Selección del mantenimiento gestionado por la motorización'
  de: 'Auswahl der von der Motorisierung gesteuerten Wartung'
  pl: 'Wybór obsługi zarządzanej przez silnik'
  hu: 'A motor által irányított karbantartás kiválasztása'
comment:
  en: 'In order for the vehicle to take into account new threshold values in km and in months for the maintenance calculation, change the parameter "Selection of maintenance managed by the engine" to the status "Static'
  fr: 'Pour que le véhicule prenne en compte de nouvelles valeurs de seuils en km et en mois pour le calcul de la maintenance, passer le paramètre "Sélection de la maintenance gérée par la motorisation" à l''état "Statique'
  es: 'Para que el vehículo tenga en cuenta los nuevos valores de límites en km y en meses para el cálculo del mantenimiento, pase el parámetro "Selección del mantenimiento gestionado por la motorización" al estado "Estático'
  de: 'Damit das Fahrzeug neue Schwellwerte in km oder in Monaten für die Berechnung der Wartung übernimmt, den Parameter "Auswahl der von der Motorisierung bestimmten Wartung" auf den Zustand "Statisch" stellen'
  pl: 'Aby samochód uwzględnił nowe wartości progów w km i w miesiącach dla obliczenia obsługi, zmienić parametr "Wybór obsługi zarządzanej przez silnik" w stan "Statyczny'
  hu: 'Azért, hogy a gépkocsi figyelembe vegye az új küszöbértékeket km-ben és hónapban a karbantartás kiszámítása érdekében, a "Motoros hajtás által létrehozott karbantartás kiválasztása" paramétert állítsa át "Statikus" állapotra'
kind: 'config'
access: 'read-write'
length: 1

