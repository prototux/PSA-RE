did: 0xDD08
name: 'STATUS_DESPATCH_ADC_DATA_ENGINE_ECU'
display_name:
  en: 'Status of the despatch of the ADC data to the engine ECU'
  fr: 'État de l''envoi des données ADC vers le calculateur moteur'
  es: 'Estado del envío de los datos ADC hacia el calculador motor'
  de: 'Zustand des Sendens der Wegfahrsperrendaten zum Motor-Steuergerät'
  pl: 'Stan wysłania danych KBZ do kalkulatora silnika'
  hu: 'Kódolt indításgátló adatainak elküldési állapota a befecskendező-computer felé'
comment:
  en: 'Used to ascertain whether the built-in systems interface is sending the encrypted immobiliser code to the engine management ECU'
  fr: 'Permet de savoir si le boîtier de servitude intelligent envoie le code antidémarrage crypté vers le calculateur contrôle moteur'
  es: 'Permite saber si la caja de servicio inteligente envía el código antiarranque encriptado hacia el calculador de control motor'
  de: 'Teilt mit, ob die Zentralschalteinheit den verschlüsselten Wegfahrsperrencode zum Motorsteuergerät sendet'
  pl: 'Pozwala wiedzieć czy inteligentny moduł sterujący wysyła szyfrowany kod blokady rozruchu do kalkulatora kontroli silnika'
  hu: 'Lehetővé teszi annak megismerését, hogy az intelligens kiszolgáló egység elküldi a titkos indításgátló kódot a befecskendezés-computer felé'
kind: 'live'
access: 'read'
length: 1

