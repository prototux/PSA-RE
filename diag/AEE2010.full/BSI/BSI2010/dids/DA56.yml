did: 0xDA56
name: 'LAST_ABUSIVE_CONDITION_MAINTAINING_INTERSYSTEM'
display_name:
  en: 'Last abusive condition of maintaining of the intersystem CANs'
  fr: 'Dernière condition abusive de maintien des réseaux CAN intersystème'
  es: 'Última condición abusiva de mantenimiento de las redes CAN intersistema'
  de: 'Letzte falsche Bedingung zum Halten der systemübergreifenden Netze CAN'
  pl: 'Ostatni nadmierny warunek utrzymania sieci CAN Intersystem'
  hu: 'CAN rendszerközi hálózatokat fenntartó utolsó jogtalan feltétel'
comment:
  en: 'Condition recorded at the last going to sleep of the intersystem CAN network The parameter status is updated after a going to sleep (30 minutes maximum) followed by a BSI wake-up'
  fr: 'Condition enregistrée lors du dernier endormissement du réseau CAN intersystème L''état du paramètre est mis à jour après un endormissement (30 minutes maximum) suivi d''un réveil du boîtier de servitude intelligent'
  es: 'Condición registrada en el último adormecimiento de la red CAN intersistemas El estado del parámetro se actualiza después de un adormecimiento (30 minutos como máximo) seguido de un despertado de la caja de servicio inteligente'
  de: 'Bei der letzten Deaktivierung des systemübergreifenden CAN-Netzes gespeicherte Bedingung Der Zustand des Parameters wird nach einer Deaktivierung (maximal 30 Minuten) gefolgt von einer Wiederaktivierung der Zentralschalteinheit aktualisiert'
  pl: 'Warunek zarejestrowany podczas ostatniego uśpienia sieci CAN Intersystem Stan parametru jest aktualizowany po uśpieniu (maksymalnie 30 minut), po którym następuje przebudzenie inteligentnego modułu sterującego'
  hu: 'A CAN rendszerközi hálózat utolsó elalvása során elmentett feltétel A paraméter állapota egy intelligens kiszolgálóegység ébresztést követő elalvás (maximum 30 perc) után került frissítés'
kind: 'live'
access: 'read'
length: 1

