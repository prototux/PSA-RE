  de: 'Bei der letzten Reaktivierung des Netzes LIN 2 gespeicherte Bedingung Der Zustand des Parameters wird nach einer Deaktivierung (maximal 5 Minuten), gefolgt von einer Aktivierung der LIN-Netze 2 aktualisiert'
  pl: 'Warunek odnotowany w czasie ostatniego przebudzenia sieci LIN 2 Stan parametru jest aktualizowany po uśpieniu (maksimum 5 min), a następnie przebudzeniu sieci LIN 2'
  hu: 'A LIN 2 hálózat utolsó ébresztése során elmentett feltétel A paraméter állapota frissítésre került a LIN 2 hálózatok ébresztését követő (maximum 5 perces) elalvása után'
