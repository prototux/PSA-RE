did: 0xDBEE
name: 'NUMBER_DAYS_REMAINING_BEFORE_MAINTENANCE'
display_name:
  en: 'Number of days remaining before maintenance'
  fr: 'Nombre de jour restant avant maintenance'
  es: 'Número de días que quedan antes del mantenimiento'
  de: 'Anzahl von Tagen bis zur Wartung'
  pl: 'Liczba dni pozostałych do przeglądu'
  hu: 'Karbantartás előtt megmaradt napok száma'
comment:
  en: 'This is the number of days before the next vehicle maintenance operation. This value should only be taken into account when the first vehicle maintenance operation has been performed'
  fr: 'Il s''agit du nombre de jours avant la prochaine maintenance du véhicule. Il ne faut prendre en compte cette valeur qu''une fois la première maintenance véhicule effectuée'
  es: 'Se trata del número de días antes de la proxima revisión del vehículo. Hay que tomar en cuenta este valor sólo después de que se haya efectuado el primer mantenimiento del vehículo'
  de: 'Es handelt sich um die Anzahl der vor der nächsten Wartung des Fahrzeugs verbleibenden Tage. Dieser Wert ist zu registrieren, wenn die erste Wartung des Fahrzeugs durchgeführt wurde'
  pl: 'Chodzi tu o liczbe dni przed nastepnym przegladem pojazdu. Wartosc te nalezy uwzgledniac tylko raz podczas wykonywania pierwszego przegladu pojazdu'
  hu: 'A jármű következo karbantartása elotti napok számáról van szó. Ezt az értéket csak az elvégzett elso jármű karbantartáskor kell számításba venni'
