did: 0xD91E
name: 'DISPLAYED_BLOWER_REFERENCE_VALUE'
display_name:
  en: 'Displayed blower reference value'
  fr: 'Consigne du pulseur affichée'
  es: 'Consigna del ventilador-expulsor señalada'
  de: 'Angezeigter Sollwert des Gebläses'
  pl: 'Wyświetlona wartość zadana dmuchawy'
  hu: 'Ventilátor kijelzett előírt értéke'
comment:
  en: 'For each position of the air blower there is a corresponding level of air flow. The air flow is symbolised by the number of fan blades displayed. For position 0, no fan blades are displayed. For position 8, all the fan blades are displayed.'
  fr: 'A chaque position du pulseur d''air correspond un niveau de débit d''air. Le débit d''air est symbolisé par le nombre de pâles affichées. Pour la position 0, aucune pâle n''est affichée. Pour la position 8, toutes les pales sont affichées.'
  es: 'En cada posición del impulsor de aire le corresponde un nivel de caudal de aire. El caudal de aire se simboliza mediante el número de aspas indicadas. Para la posición 0, no se visualiza ningún aspa. En la posición 8, se ven todas las aspas.'
  de: 'Jeder Position des Luftgebläses entspricht eine Luftmenge. Die Luftmenge wird die die Anzahl eingeschalteter Flügel symbolisiert. Für die Position 0 wird kein Flügel eingeschaltet. Bei der Position 8 sind alle Flügel eingeschaltet.'
  pl: 'Każdej pozycji dmuchawy powietrza odpowiada jeden poziom wydatku powietrza. Wydatek powietrza jest symbolizowany przez wyświetlaną ilość łopatek. Dla pozycji 0, żadna łopatka nie jest wyświetlana. W przypadku położenia 8 wyświetlane są wszystkie symbole łopatek wentylatora.'
  hu: 'A levegőbefúvó ventilátor minden helyzetének megfelel egy levegőhozam szint. A levegőhozam a kijelzett lapátok száma által szimbolizált. A 0 helyzet esetében egyetlen lapát sincs kijelezve. A 8 helyzet esetében az összes lapát kijelzésre kerül.'
kind: 'live'
access: 'read'
length: 1

