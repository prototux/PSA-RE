did: 0xD529
name: 'TYRE_UNDER_INFLATION_DETECTION_ECU'
display_name:
  en: 'Tyre under-inflation detection ECU'
  fr: 'Calculateur de détection de sous-gonflage'
  es: 'Calculador de detección de subinflado'
  de: 'Steuergerät Reifenfülldruckerkennung'
  pl: 'Kalkulator wykrywania niedopompowania opon'
  hu: 'Alacsony gumiabroncsnyomást érzékelő funkció vezérlő egysége'
comment:
  en: 'This screen is used to select the ECUs present on the vehicle. The ECUs present on the whole vehicle range cannot be deactivated, e.g. the built-in systems interface, the engine relay unit...'
  fr: 'Cet écran permet de sélectionner les calculateurs présents sur le véhicule. Les calculateurs présents sur toute la gamme du véhicule ne sont pas désactivables, par exemple le boîtier de servitude intelligent, le boîtier de servitude moteur...'
  es: 'Esta pantalla permite seleccionar los calculadores presentes en el vehículo. Los calculadores presentes en toda la gama del vehículo no son desactivables; por ejemplo, la BSI, la BSM...'
  de: 'Auf diesem Bildschirm können die im Steuergerät vorhandenen Fahrzeuge ausgewählt werden. Die im Fahrzeug vorhandenen Steuergeräte sind nicht deaktivierbar, Z. B. die BSI, die BSM...'
  pl: 'Ekran ten pozwala wybrać kalkulatory obecne w pojeździe. Kalkulatory obecne w całej gamie pojazdów nie mogą być wyłączane, np. inteligentny moduł sterujący, moduł sterujący silnika...'
  hu: 'Ez a képernyo lehetové teszi a járművön jelen lévo számítóegységek kiválasztását. A teljes járműsorozaton jelen lévo számítóegységek nem kapcsolhatóak ki, pl. az intelligens kiszolgáló elektronika, a motort kiszolgáló elektronika...'
kind: 'config'
access: 'read-write'
length: 1

