did: 0xD910
name: 'CONTROL_AUTHORISATION_ELECTRICAL_ADJUSTMENT'
display_name:
  en: 'Control of the authorisation of electrical adjustment of the driver''s seat'
  fr: 'Commande de l''autorisation de réglage électrique du siège conducteur'
  es: 'Mando de la autorización de reglaje eléctrico del asiento del conductor'
  de: 'Betätigung der Freigabe Elektrisches Einstellen des Fahrersitzes'
  pl: 'Sterowanie autoryzacji regulacji elektrycznej siedzenia kierowcy'
  hu: 'A vezetőülés elektromos beállítása engedélyezésének vezérlése'
comment:
  en: 'The status "active" authorises the adjusting of the driver''s seat, thus activating the lighting of the seat control module'
  fr: 'L''état "active" autorise le réglage du siège conducteur et active l''éclairage de la platine de commande des sièges.'
  es: 'El estado "activo" autoriza el reglaje del asiento del conductor y acticva la iluminación de la pletina de mando de los asientos.'
  de: 'Der Zustand "aktiviert" gibt die Einstellung des Fahrersitzes frei und aktiviert die Beleuchtung der Bedienplatine für die Sitze'
  pl: 'Stan "aktywny" zezwala na regulowanie siedzenia kierowcy i włącza oświetlenie modułu sterowania siedzeń.'
  hu: 'Az "aktív" állapot engedélyezi a vezetőülés beállítását és aktiválja az ülések vezérlőlapjának megvilágítását.'
kind: 'live'
access: 'read'
length: 1

