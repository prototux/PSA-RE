name: 'ABNORMAL_JUMPS_VEHICLE_S_TOTAL_MILEAGE_NUMBER'
display_name:
  en: 'Abnormal jumps in the vehicle''s total mileage : Number in relation to memorised mileage'
  fr: 'Sauts anormaux du kilométrage total du véhicule : Nombre par rapport au kilométrage mémorisé'
  es: 'Saltos anómalos del kilometraje total del vehículo : Número con respecto al kilometraje memorizado'
