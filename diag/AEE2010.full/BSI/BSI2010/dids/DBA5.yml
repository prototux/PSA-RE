comment:
  en: 'Parameter for tracing abnormal increases in the vehicle''s total mileage. the counter is reset to zero at each download.'
  fr: 'Paramètre permet de tracer des augmentations anormales du kilométrage total du véhicule. le compteur est remis à zéro à chaque téléchargement.'
  es: 'Parámetro que permite trazar aumentos anómalos del kilometraje total del vehículo. el contador se pone a cero en cada telecarga.'
  de: 'Der Parameter ermöglicht die Anzeige von außergewöhnlichen Erhöhungen des Gesamtkilometerstands des Fahrzeugs. der Zähler wird bei jedem Fernladen auf Null zurückgesetzt.'
  pl: 'Parametr umożliwiający śledzenie nienormalnych przyrostów całkowitego przebiegu kilometrów pojazdu. licznik jest zerowany przy każdym teleprogramowaniu.'
  hu: 'Paraméter, mely lehetővé teszi a gépkocsi összkilométerszáma rendellenes növekedéseinek regisztrálását. a számláló minden távfeltöltéskor nullázódik.'
