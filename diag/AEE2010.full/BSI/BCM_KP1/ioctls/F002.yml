ioctl: 0xF002
name: 'CENTRE_CONSOLE_LOCK_SWITCH_UNLOCK'
display_name:
  en: 'Centre console lock switch : Unlock'
  fr: 'Centre console lock switch : Unlock'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CENTRE_CONSOLE_LOCK_SWITCH:
    bits: '2.1-2.0'
    type: 'uint'
    default: 0x00

  LEFT_FRONT_WINDOW_SWITCH:
    bits: '2.3-2.2'
    type: 'uint'
    default: 0x00

  RIGHT_FRONT_WINDOW_SWITCH:
    bits: '2.5-2.4'
    type: 'uint'
    default: 0x00

  LEFT_REAR_WINDOW_SWITCH:
    bits: '2.7-2.6'
    type: 'uint'
    default: 0x00

  RIGHT_REAR_WINDOW_SWITCH:
    bits: '3.1-3.0'
    type: 'uint'
    default: 0x00

  FRONT_WIPER_INTERMITTENT_TIME:
    bits: '3.4-3.2'
    type: 'uint'
    default: 0x00

  RESERVED:
    bits: '3.7-3.5'
    unused: true

  RESERVED_2:
    bits: '4.7-5.0'
    unused: true

  CONTROL_ENABLE_MASK_RECORD_DID_F002:
    bits: '6.7-9.0'
    type: 'enum'
    default: 0xFFFFFFFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Centre console lock switch : Unlock'
      fr: 'Centre console lock switch : Unlock'
  - display_name:
      en: 'Centre console lock switch : LOCK'
      fr: 'Centre console lock switch : LOCK'
  - display_name:
      en: 'Left front window switch : Window down'
      fr: 'Left front window switch : Window down'
  - display_name:
      en: 'Left front window switch : Window rising'
      fr: 'Left front window switch : Window rising'
  - display_name:
      en: 'Right front window switch : Window down'
      fr: 'Right front window switch : Window down'
  - display_name:
      en: 'Right front window switch : Window rising'
      fr: 'Right front window switch : Window rising'
  - display_name:
      en: 'Left rear window switch : Window down'
      fr: 'Left rear window switch : Window down'
  - display_name:
      en: 'Left rear window switch : Window rising'
      fr: 'Left rear window switch : Window rising'
  - display_name:
      en: 'Right rear window switch : Window down'
      fr: 'Right rear window switch : Window down'
  - display_name:
      en: 'Right rear window switch : Window rising'
      fr: 'Right rear window switch : Window rising'
