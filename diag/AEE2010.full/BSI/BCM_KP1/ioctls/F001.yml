    default: 0x00

  AUTO_LIGHT_SWITCH:
    bits: '7.5'
    type: 'bool'
    default: 0x00

  REAR_WIPER_RETURN_SIGNAL:
    bits: '7.6'
    type: 'bool'
    default: 0x00

  LEFT_TURN_LIGHT_SWITCH:
    bits: '7.7'
    type: 'bool'
    default: 0x00

  CONTROL_ENABLE_MASK_RECORD_DID_F001:
    bits: '10.7-17.0'
    type: 'bytes'
    default: 0xFFFFFFFFFFFFFFFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

