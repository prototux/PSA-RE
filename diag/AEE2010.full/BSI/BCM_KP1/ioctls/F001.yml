ioctl: 0xF001
name: 'LEFT_FRONT_DOOR_STATE_SWTICH_OPEN'
display_name:
  en: 'Left front door state swtich : Open'
  fr: 'Left front door state swtich : Open'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  LEFT_FRONT_DOOR_STATE_SWITCH:
    bits: '2.0'
    type: 'bool'
    default: 0x00

  RIGHT_FRONT_DOOR_STATE_SWTICH:
    bits: '2.1'
    type: 'bool'
    default: 0x00

  LEFT_REAR_DOOR_STATE_SWITCH:
    bits: '2.2'
    type: 'bool'
    default: 0x00

  RIGHT_REAR_DOOR_STATE_SWTICH:
    bits: '2.3'
    type: 'bool'
    default: 0x00

  BOOT_STATE_SWITCH:
    bits: '2.4'
    type: 'bool'
    default: 0x00

  POSITION_LIGHT_SWITCH:
    bits: '2.5'
    type: 'bool'
    default: 0x00

  EMERGENCY_ALARM_SWITCH:
    bits: '2.6'
    type: 'bool'
    default: 0x00

  HOOD_STATE:
    bits: '2.7'
    type: 'bool'
    default: 0x00

  BOOT_SWITCH:
    bits: '3.0'
    type: 'bool'
    default: 0x00

  DRIVER_DOOR_UNLOCK_STATUS_SWITCH:
    bits: '3.1'
    type: 'bool'
    default: 0x00

  SPEAKER_SWITCH:
    bits: '3.2'
    type: 'bool'
    default: 0x00

  DRIVER_DOOR_LOCK_STATUS_SWITCH:
