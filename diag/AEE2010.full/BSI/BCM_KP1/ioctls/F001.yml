    type: 'bool'
    default: 0x00

  COLLISION_SIGNAL:
    bits: '3.5'
    type: 'bool'
    default: 0x00

  RIGHT_FRONT_UNLOCK_STATUS_SWITCH:
    bits: '3.6'
    type: 'bool'
    default: 0x00

  DEFROST_SWITCH:
    bits: '3.7'
    type: 'bool'
    default: 0x00

  FRONT_WASHING_SWITCH:
    bits: '5.0'
    type: 'bool'
    default: 0x00

  FRONT_WIPER_LOW_SPEED:
    bits: '5.1'
    type: 'bool'
    default: 0x00

  REAR_WIPER_INTERMITTENT_SWITCH:
    bits: '5.2'
    type: 'bool'
    default: 0x00

  FRONT_WIPER_HIGH_SPEED:
    bits: '5.3'
    type: 'bool'
    default: 0x00

  ACC_POWER_SUPPLY:
    bits: '5.4'
    type: 'bool'
    default: 0x00

  REAR_WASHING_SWITCH:
    bits: '5.5'
    type: 'bool'
    default: 0x00

  FRONT_WIPER_INTERMITTENT:
    bits: '5.6'
    type: 'bool'
    default: 0x00

  KEY_SIGNAL:
    bits: '5.7'
    type: 'bool'
    default: 0x00

  IGN_POWER_SUPPLY:
    bits: '6.0'
    type: 'bool'
    default: 0x00

  DIPPED_LIGHT_SWITCH:
    bits: '6.4'
    type: 'bool'
    default: 0x00

  LIGHT_SENSOR:
    bits: '6.5'
    type: 'bool'
    default: 0x00

  FRONT_WIPER_RETURN_SIGNAL:
    bits: '6.7'
    type: 'bool'
    default: 0x00

  RIGHT_TURN_LIGHT_SWITCH:
    bits: '7.0'
    type: 'bool'
    default: 0x00

  HIGH_BEAM_SWITCH:
