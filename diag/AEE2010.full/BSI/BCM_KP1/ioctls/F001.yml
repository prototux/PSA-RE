      en: 'Right front door state swtich : Close'
      fr: 'Right front door state swtich : Close'
    max_duration_ms: 5000
  - display_name:
      en: 'Left rear door state swtich : Open'
      fr: 'Left rear door state swtich : Open'
    max_duration_ms: 5000
  - display_name:
      en: 'Left rear door state swtich : Close'
      fr: 'Left rear door state swtich : Close'
    max_duration_ms: 5000
  - display_name:
      en: 'Right rear door state swtich : Open'
      fr: 'Right rear door state swtich : Open'
    max_duration_ms: 5000
  - display_name:
      en: 'Right rear door state swtich : Close'
      fr: 'Right rear door state swtich : Close'
    max_duration_ms: 5000
  - display_name:
      en: 'Boot state switch : Open'
      fr: 'Boot state switch : Open'
    max_duration_ms: 5000
  - display_name:
      en: 'Boot state switch : Close'
      fr: 'Boot state switch : Close'
    max_duration_ms: 5000
