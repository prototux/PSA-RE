ioctl: 0xF003
name: 'RIGHT_FRONT_WINDOW_RISING_RELAY_VALID'
display_name:
  en: 'Right front window rising relay : Valid'
  fr: 'Right front window rising relay : Valid'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  RESERVED:
    bits: '2.0'
    unused: true

  RIGHT_FRONT_WINDOW_RISING_RELAY:
    bits: '2.1'
    type: 'bool'
    default: 0x00

  RIGHT_REAR_WINDOW_RISING_RELAY:
    bits: '2.2'
    type: 'bool'
    default: 0x00

  RIGHT_REAR_WINDOW_DOWN_RELAY:
    bits: '2.3'
    type: 'bool'
    default: 0x00

  HIGH_BEAM:
    bits: '2.4'
    type: 'bool'
    default: 0x00

  SUNROOF_CONTROL:
    bits: '2.5'
    type: 'bool'
    default: 0x00

  LEFT_REAR_WINDOW_RISING_RELAY:
    bits: '2.6'
    type: 'bool'
    default: 0x00

  LEFT_REAR_WINDOW_DOWN_RELAY:
    bits: '2.7'
    type: 'bool'
    default: 0x00

  LEFT_FRONT_WINDOW_DOWN_RELAY:
    bits: '3.0'
    type: 'bool'
    default: 0x00

  RIGHT_FRONT_WINDOW_DOWN_RELAY:
    bits: '3.1'
    type: 'bool'
    default: 0x00

  LEFT_FRONT_FOGLIGHT_OUTPUT:
    bits: '3.2'
    type: 'bool'
    default: 0x00

  TURNING_SOUND_DELAY:
    bits: '3.3'
