    default: 0x00

  DIPPED_LIGHT:
    bits: '3.4'
    type: 'bool'
    default: 0x00

  REAR_WIPER_LOW_SPEED_OUTPUT:
    bits: '3.5'
    type: 'bool'
    default: 0x00

  RESERVED_2:
    bits: '3.6'
    unused: true

  LEFT_FRONT_WINDOW_RISING_RELAY:
    bits: '3.7'
    type: 'bool'
    default: 0x00

  POSITION_LIGHT:
    bits: '4.0'
    type: 'bool'
    default: 0x00

  HEADLIGHT_CLEANING_RELAY:
    bits: '4.1'
    type: 'bool'
    default: 0x00

  ANTI_THEFT_SPEAKER:
    bits: '4.2'
    type: 'bool'
    default: 0x00

  BRAKE_LIGHT:
