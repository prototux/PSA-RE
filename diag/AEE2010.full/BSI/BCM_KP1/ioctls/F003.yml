  RIGHT_FRONT_DOOR_LIGHT:
    bits: '6.1'
    type: 'bool'
    default: 0x00

  NOT_DRIVER_SIDE_DOORS_ALL_UNLOCK:
    bits: '6.2'
    type: 'bool'
    default: 0x00

  OIL_PUMP_OUTPUT:
    bits: '6.3'
    type: 'bool'
    default: 0x00

  REAR_FOGLIGHT_OUTPUT:
    bits: '6.4'
    type: 'bool'
    default: 0x00

  FRONT_WIPER_HIGH_SPEED_OUTPUT:
    bits: '6.5'
    type: 'bool'
