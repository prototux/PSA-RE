  REARVIEW_MIRROR_SPREAD:
    bits: '7.4'
    type: 'bool'
    default: 0x00

  WATER_VALVE_CONTROL:
    bits: '7.5'
    type: 'bool'
    default: 0x00

  BOOT_LIGHT:
    bits: '7.6'
    type: 'bool'
    default: 0x00

  GROUND_LAMP:
    bits: '7.7'
    type: 'bool'
    default: 0x00

  CONTROL_ENABLE_MASK_RECORD_DID_F003:
    bits: '8.7-13.0'
    type: 'bytes'
    default: 0xFFFFFFFFFFFF

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Right front window rising relay : Valid'
      fr: 'Right front window rising relay : Valid'
    max_duration_ms: 5000
  - display_name:
      en: 'Right front window rising relay : Invalid'
      fr: 'Right front window rising relay : Invalid'
    max_duration_ms: 5000
  - display_name:
      en: 'Right rear window rising relay : Valid'
      fr: 'Right rear window rising relay : Valid'
    max_duration_ms: 5000
  - display_name:
      en: 'Right rear window rising relay : Invalid'
      fr: 'Right rear window rising relay : Invalid'
    max_duration_ms: 5000
  - display_name:
      en: 'Right rear window down relay : Valid'
      fr: 'Right rear window down relay : Valid'
    max_duration_ms: 5000
  - display_name:
      en: 'Right rear window down relay : Invalid'
      fr: 'Right rear window down relay : Invalid'
    max_duration_ms: 5000
  - display_name:
      en: 'High beam : Valid'
      fr: 'High beam : Valid'
    max_duration_ms: 5000
  - display_name:
