    type: 'bool'
    default: 0x00

  POWER_SAVING_OUTPUT:
    bits: '5.0'
    type: 'bool'
    default: 0x00

  BOOT_UNLOCK_OUTPUT:
    bits: '5.1'
    type: 'bool'
    default: 0x00

  DRIVER_SIDE_DOOR_UNLOCK:
    bits: '5.2'
    type: 'bool'
    default: 0x00

  NOT_DRIVER_SIDE_DOORS_ALL_LOCK:
    bits: '5.3'
