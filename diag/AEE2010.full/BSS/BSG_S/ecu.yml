node: 'BSS'
model: 'BSG_S'
display_name:
  en: 'Signalling control module (BSG_S)'
  fr: 'Boitier de servitude signalisation (BSG_S)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x754
    response_id: 0x654
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x02:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'

services: [0x10, 0x14, 0x19, 0x22, 0x27, 0x2F, 0x37, 0x3E, 0x85]

security_access:
  - level: 0x03

tester_present:
  request: '3E 00'
  period_ms: 1000

identification:
  request: '22 F0 FE'
  part_number: '22.7-24.0'
  comment:
    en: 'The ECU part number is in data bytes 22 to 24 of the answer to 22 F0 FE (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 22 à 24 de la réponse à 22 F0 FE (DCB), elle donne la variante logicielle'

cars: ['B75', 'B78', 'X74']

variants:
  B75C_1:
    parts: ['791534']
    cars: ['B75']
  B75C_2:
    parts: ['918378']
    cars: ['B75']
  B78_1:
    parts: ['790368']
    cars: ['B78']
  B78_2:
    parts: ['791534']
    cars: ['B78']
  B78_3:
    parts: ['918378']
    cars: ['B78']
  X74_1:
    parts: ['918378']
    cars: ['X74']
