results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Rear right sidelamp integrated in the bumper lighting command'
      fr: 'Commande d''éclairage du feu de position arrière droit intégré au pare-chocs'
      es: 'Mando de encendido de la luz de posición trasera derecha integrada en el paragolpes'
      de: 'Steuerung Einschalten der im Stoßfänger integrierten Standleuchte hinten rechts'
      pl: 'Sterowanie oświetlenia tylnego prawego światła pozycyjnego wbudowanego w zderzak'
