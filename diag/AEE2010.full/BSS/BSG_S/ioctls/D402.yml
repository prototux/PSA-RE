ioctl: 0xD402
name: 'REAR_RIGHT_DIRECTION_INDICATOR_INTEGRATED_BUMPER'
display_name:
  en: 'Rear right direction indicator integrated in the bumper lighting command'
  fr: 'Commande d''éclairage du feu indicateur de direction arrière droit intégré au pare-chocs'
  es: 'Mando de encendido del indicador de dirección trasero derecho integrado en el paragolpes'
  de: 'Steuerung Einschalten des im Stoßfänger integrierten Fahrtrichtungsanzeigers hinten rechts'
  pl: 'Sterowanie oświetlenia tylnego prawego kierunkowskazu wbudowanego w zderzak'
  hu: 'Lökhárítóba beépített jobb hátsó irányjelzőlámpa világításának vezérlése'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  DURATION:
    bits: '2.7-2.0'
    type: 'enum'

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '3.7-3.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Rear right direction indicator integrated in the bumper lighting command'
      fr: 'Commande d''éclairage du feu indicateur de direction arrière droit intégré au pare-chocs'
      es: 'Mando de encendido del indicador de dirección trasero derecho integrado en el paragolpes'
      de: 'Steuerung Einschalten des im Stoßfänger integrierten Fahrtrichtungsanzeigers hinten rechts'
      pl: 'Sterowanie oświetlenia tylnego prawego kierunkowskazu wbudowanego w zderzak'
      hu: 'Lökhárítóba beépített jobb hátsó irányjelzőlámpa világításának vezérlése'
    max_duration_ms: 8000
