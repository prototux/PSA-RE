node: 'CVM'
model: 'CVM'
display_name:
  en: 'Multifunction windscreen camera (CVM)'
  fr: 'Camera video multifonction (CVM)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x74A
    response_id: 0x64A
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'
  0x60:
    en: 'Supplier session'
    fr: 'Session fournisseur'

services: [0x10, 0x14, 0x19, 0x22, 0x27, 0x2E, 0x31]

security_access:
  - level: 0x03
    algorithm: 'PSA_SEED_KEY'
    key: 'E2E5'

identification:
  request: '22 F0 80'
  part_number: '8.7-12.0'
  comment:
    en: 'The ECU part number is in data bytes 8 to 12 of the answer to 22 F0 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 8 à 12 de la réponse à 22 F0 80 (DCB), elle donne la variante logicielle'

cars: ['B78', 'B8']

variants:
  B8_V1:
    parts: ['966629468A']
    cars: ['B8']
  B8_V2:
    parts: ['966629468B']
    cars: ['B8']
  B8_V3:
    parts: ['9666294680']
    cars: ['B8']
  B8_V4:
    parts: ['9678741480']
    cars: ['B8']
  B78_V1:
    parts: ['9676799680']
    cars: ['B78']
  B78_V2:
    parts: ['967679968A']
    cars: ['B78']
  B78_V3:
    parts: ['9678741480']
    cars: ['B78']
