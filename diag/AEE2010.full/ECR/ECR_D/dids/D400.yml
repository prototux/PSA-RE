comment:
  en: 'The drive type specifies the position of the steering wheel in the vehicle If the position is "undetermined", the door module operates in downgraded mode'
  fr: 'Le type de direction indique la position du volant dans le véhicule Si la position est "indéterminé", le module de porte fonctionne en mode dégradé'
  es: 'El tipo de dirección indica la posición del volante en el vehículo Si la posición es "indeterminada", el módulo de puerta funciona en modo emergencia'
  de: 'Der Lenkungstyp gibt die Position des Lenkrads im Fahrzeug an Wenn die Position "nicht bestimmt" ist, funktioniert das Türmodul im Notbetrieb'
  pl: 'Typ układu kierowniczego wskazuje położenie kierownicy w pojeździe Jeżeli położenie jest nieokreślone, moduł drzwi działa w trybie awaryjnym'
  hu: 'A forgalmi rend típus jelzi a kormánykerék járművön belüli helyét Ha a pozíció " meghatározatlan ", akkor az ajtómodul csökkentett üzemmódban működik'
