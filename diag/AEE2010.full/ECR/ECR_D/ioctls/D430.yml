ioctl: 0xD430
name: 'CONTROL_SEAT_BELT_TAKE_UP_PLAY_FASTENING_SEAT'
display_name:
  en: 'Control of the seat belt for the take-up of play on fastening the seat belt function'
  fr: 'Pilotage de la ceinture de sécurité pour la fonction de rattrapage de jeu au bouclage de la ceinture de sécurité'
  es: 'Control del cinturón de seguridad para la función de bloqueo de la holgura del cinturón de seguridad'
  de: 'Ansteuerung des Sicherheitsgurts für die Funktion Spielausgleich beim Anlegen des Sicherheitsgurts'
  pl: 'Sterowanie pasa bezpieczeństwa dla funkcji kasowania luzu zapięcia pasa bezpieczeństwa'
  hu: 'A biztonsági öv vezérlése a biztonsági öv csatjánál történő hézagutánállítás funkció számára'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'
    default: 0x01

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the seat belt for the take-up of play on fastening the seat belt function'
      fr: 'Pilotage de la ceinture de sécurité pour la fonction de rattrapage de jeu au bouclage de la ceinture de sécurité'
      es: 'Control del cinturón de seguridad para la función de bloqueo de la holgura del cinturón de seguridad'
      de: 'Ansteuerung des Sicherheitsgurts für die Funktion Spielausgleich beim Anlegen des Sicherheitsgurts'
      pl: 'Sterowanie pasa bezpieczeństwa dla funkcji kasowania luzu zapięcia pasa bezpieczeństwa'
      hu: 'A biztonsági öv vezérlése a biztonsági öv csatjánál történő hézagutánállítás funkció számára'
    max_duration_ms: 3000
