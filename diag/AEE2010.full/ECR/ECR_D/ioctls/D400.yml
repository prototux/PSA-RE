ioctl: 0xD400
name: 'CONTROL_SEAT_BELT_RESTRAINING_OCCUPANTS_THEIR'
display_name:
  en: 'Control of the seat belt for the restraining of occupants in their seat in an emergency function'
  fr: 'Pilotage de la ceinture de sécurité pour la fonction de maintien des occupants sur leur siège en situation d''urgence'
  es: 'Control del cinturón de seguridad para la función de sujeción de los ocupantes en su asiento en situación de urgencia'
  de: 'Ansteuerung des Sicherheitsgurts für die Funktion Halten der Insassen auf ihrem Sitz in einer Notsituation'
  pl: 'Sterowanie pasa bezpieczeństwa dla funkcji utrzymania właściwej pozycji użytkowników na siedzeniu, w sytuacji zagrożenia'
  hu: 'Biztonsági öv vezérlése az utasok üléseiken történő megtartása funkció számára vészhelyzetben'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'
    default: 0x01

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the seat belt for the restraining of occupants in their seat in an emergency function'
      fr: 'Pilotage de la ceinture de sécurité pour la fonction de maintien des occupants sur leur siège en situation d''urgence'
      es: 'Control del cinturón de seguridad para la función de sujeción de los ocupantes en su asiento en situación de urgencia'
      de: 'Ansteuerung des Sicherheitsgurts für die Funktion Halten der Insassen auf ihrem Sitz in einer Notsituation'
      pl: 'Sterowanie pasa bezpieczeństwa dla funkcji utrzymania właściwej pozycji użytkowników na siedzeniu, w sytuacji zagrożenia'
      hu: 'Biztonsági öv vezérlése az utasok üléseiken történő megtartása funkció számára vészhelyzetben'
    max_duration_ms: 3000
