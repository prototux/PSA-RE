did: 0x0261
name: 'ERROR_STATE_CAMSHAFT_OFFSET_DIAGNOSIS'
display_name:
  en: 'Error state of camshaft offset diagnosis'
  fr: 'Error state of camshaft offset diagnosis'
comment:
  en: 'NAThe camshaft signal is too far from the crankshaft signal to report an error status'
  fr: 'NAThe camshaft signal is too far from the crankshaft signal to report an error status'
kind: 'live'
access: 'read'
length: 1

params:
  ERROR_STATE_CAMSHAFT_OFFSET_DIAGNOSIS:
    bits: '1.7-1.0'
    comment:
      en: 'Error state of camshaft offset diagnosis'
      fr: 'Error state of camshaft offset diagnosis'
    type: 'enum'
    values:
      0x00:
        en: 'The camshaft offset has not yet been calculated.'
        fr: 'The camshaft offset has not yet been calculated.'
      0x01:
        en: 'The camshaft offset has been calculated. No segments with equidistant segment length could be found.'
        fr: 'The camshaft offset has been calculated. No segments with equidistant segment length could be found.'
      0x02:
        en: 'The camshaft offset has been calculated. The number of found segments with equidistant segment length is less than the number of equidistant segments minus one for segment tolerance.'
        fr: 'The camshaft offset has been calculated. The number of found segments with equidistant segment length is less than the number of equidistant segments minus one for segment tolerance.'
      0x03:
        en: 'The camshaft offset has been calculated. Segments with equidistant length are detected but its first edge is not at the reference positon with respect to the tolerance of equidistant edges.'
        fr: 'The camshaft offset has been calculated. Segments with equidistant length are detected but its first edge is not at the reference positon with respect to the tolerance of equidistant edges.'
      0x04:
        en: 'The camshaft offset has been calculated and is outside of the tolerance.'
        fr: 'The camshaft offset has been calculated and is outside of the tolerance.'
      0x05:
        en: 'The camshaft offset fault in the DSM is reset.'
        fr: 'The camshaft offset fault in the DSM is reset.'
