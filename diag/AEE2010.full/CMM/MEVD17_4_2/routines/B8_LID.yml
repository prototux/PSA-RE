routine: 0xB8
name: 'OPERATING_TEST_INLET_CAMSHAFT_DEPHASER'
display_name:
  en: 'Operating test of the inlet camshaft dephaser'
  fr: 'Test fonctionnel du déphaseur arbre à cames admission'
  es: 'Test funcional del desfasador de árbol de levas de admisión'
  de: 'Funktionstest des Phasenverschiebers der Einlassnockenwelle'
  pl: 'Test funkcjonalny przesuwnika faz wałka rozrządu dolotu'
  hu: 'Szívás vezérműtengely fázisállító működési teszt'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  CONTROL_PARAMETER_1:
    bits: '1.7-1.0'
    type: 'enum'

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x02:
        en: 'Steering wheel angle sensor calibrated'
        fr: 'Capteur angle volant calibré'
        es: 'Captador de ángulo de volante calibrado'
        de: 'Lenkradwinkelsensor kalibriert'
        pl: 'Czujnik kąta skręcenia koła kierownicy kalibrowany'
        hu: 'Kormánykerék-szögjeladó kalibrálva'
      0x04:
        en: 'Operation stopped by the operator (the report is not available)'
        fr: 'Opération arrêtée par l''opérateur (le compte-rendu n''est pas disponible)'
        es: 'Operación interrumpida por el usuario (el informe no está disponible)'
        de: 'Vorgang vom Techniker gestoppt (der Testbericht ist nicht verfügbar)'
        pl: 'Operacja zatrzymana przez operatora (sprawozdanie nie jest dostępne)'
        hu: 'A kezelő által leállított művelet (a meghibásodási jelentés nem áll rendelkezésre)'

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

  RESERVED:
    bits: '3.7-3.0'
    unused: true

  ACTUATOR_TEST_2:
    bits: '4.7-4.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x00:
        en: 'No problem encountered during the test'
        fr: 'Pas de problème rencontré pendant le test'
        es: 'No se ha encontrado ningún problema durante el test'
        de: 'Kein Problem während des Tests aufgetreten'
        pl: 'Nie napotkano problemu w czasie testu'
        hu: 'A teszt alatt nem merült fel probléma'
      0x01:
        en: 'Problem with stage 1 : Reference position for cycle 1 not reached'
        fr: 'Problème étape 1 : Position de référence du cycle 1 non atteinte'
        es: 'Problema etapa 1 : Posición de referencia del ciclo 1 no alcanzada'
        de: 'Problem Schritt 1 : Referenzposition des Zyklus 1 nicht erreicht'
        pl: 'Problem etapu 1 : Pozycja referencyjna cyklu 1 nie osiągnięta'
        hu: '1 lépés problémája : A 1 ciklus referenciahelyzete nem került elérésre'
      0x02:
