        fr: 'Problème étape 2 : Position de consigne du cycle 1 non atteinte'
        es: 'Problema etapa 2 : Posición de consigna del ciclo 1 no alcanzada'
        de: 'Problem Schritt 2 : Sollposition des Zyklus 1 nicht erreicht'
        pl: 'Problem etapu 2 : Pozycja wartości zadanej cyklu 1 nie osiągnięta'
        hu: '2 lépés problémája : A 1 ciklus előírt helyzete nem került elérésre'
