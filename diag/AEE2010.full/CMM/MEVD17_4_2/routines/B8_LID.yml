        fr: 'Problème étape 3 : Maintien de la position du cycle 1 non atteinte'
        es: 'Problema etapa 3 : Mantenimiento de la posición del ciclo 1 no alcanzada'
        de: 'Problem Schritt 3 : Beibehaltung der Position des Zyklus 1 nicht erreicht'
        pl: 'Problem etapu 3 : Podtrzymanie pozycji cyklu 1 nie osiągnięte'
        hu: '3 lépés problémája : Nem került elérésre a 1 ciklus helyzetének megtartása'
      0x04:
        en: 'Problem with stage 4 : Return to the reference position for cycle 1 not possible'
        fr: 'Problème étape 4 : Retour en position de référence du cycle 1 non possible'
        es: 'Problema etapa 4 : Recuperación de la posición de referencia del ciclo 1 imposible'
        de: 'Problem Schritt 4 : Rückkehr in Referenzposition des Zyklus 1 nicht möglich'
        pl: 'Problem etapu 4 : Powrót w pozycję referencji cyklu 1 niemożliwy'
        hu: '4 lépés problémája : Nem lehetséges a 1 ciklus referenciahelyzetbe történő visszatérés'
      0x05:
        en: 'Problem step 5: Maintaining of the reference position between cycle 1 and cycle not possible'
        fr: 'Problème étape 5 : Maintien de la position de référence entre le cycle 1 et cycle non possible'
        es: 'Problema de la etapa 5: Mantenimiento imposible de la posición de referencia entre el ciclo 1 y el ciclo'
        de: 'Problem Schritt 5: Beibehaltung der Referenzposition zwischen Zyklus 1 und Zyklus nicht möglich'
        pl: 'Problem etapu 5: Utrzymanie położenia odniesienia między cyklem 1 i cyklem niemożliwe'
        hu: '5 lépés problémája: A referenciahelyzet megtartása a 1 és ciklus között nem lehetséges'
      0x06:
        en: 'Problem with stage 6 : Reference position for cycle 2 not reached'
        fr: 'Problème étape 6 : Position de référence du cycle 2 non atteinte'
        es: 'Problema etapa 6 : Posición de referencia del ciclo 2 no alcanzada'
        de: 'Problem Schritt 6 : Referenzposition des Zyklus 2 nicht erreicht'
        pl: 'Problem etapu 6 : Pozycja referencyjna cyklu 2 nie osiągnięta'
        hu: '6 lépés problémája : A 2 ciklus referenciahelyzete nem került elérésre'
      0x07:
        en: 'Problem with stage 7 : Reference position for cycle 2 not reached'
        fr: 'Problème étape 7 : Position de consigne du cycle 2 non atteinte'
        es: 'Problema etapa 7 : Posición de consigna del ciclo 2 no alcanzada'
        de: 'Problem Schritt 7 : Sollposition des Zyklus 2 nicht erreicht'
        pl: 'Problem etapu 7 : Pozycja wartości zadanej cyklu 2 nie osiągnięta'
        hu: '7 lépés problémája : A 2 ciklus előírt helyzete nem került elérésre'
      0x08:
        en: 'Problem with stage 8 : Holding of the position of cycle 2 not successful'
        fr: 'Problème étape 8 : Maintien de la position du cycle 2 non atteinte'
        es: 'Problema etapa 8 : Mantenimiento de la posición del ciclo 2 no alcanzada'
        de: 'Problem Schritt 8 : Beibehaltung der Position des Zyklus 2 nicht erreicht'
        pl: 'Problem etapu 8 : Podtrzymanie pozycji cyklu 2 nie osiągnięte'
        hu: '8 lépés problémája : Nem került elérésre a 2 ciklus helyzetének megtartása'
      0x09:
        en: 'Problem with stage 9 : Return to the reference position for cycle 2 not possible'
        fr: 'Problème étape 9 : Retour en position de référence du cycle 2 non possible'
        es: 'Problema etapa 9 : Recuperación de la posición de referencia del ciclo 2 imposible'
        de: 'Problem Schritt 9 : Rückkehr in Referenzposition des Zyklus 2 nicht möglich'
        pl: 'Problem etapu 9 : Powrót w pozycję referencji cyklu 2 niemożliwy'
        hu: '9 lépés problémája : Nem lehetséges a 2 ciklus referenciahelyzetbe történő visszatérés'
      0x0A:
