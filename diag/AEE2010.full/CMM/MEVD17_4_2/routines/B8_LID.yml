        fr: 'Problème étape 10 : Position de référence finale non atteinte'
        es: 'Problema etapa 10 : Posición de referencia final no alcanzada'
        de: 'Problem Schritt 10 : Abschließende Referenzposition nicht erreicht'
        pl: 'Problem etapu 10 : Pozycja referencyjna końcowa nie osiągnięta'
        hu: '10 lépés problémája : A végső referenciahelyzet nem került elérésre'

