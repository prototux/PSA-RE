ioctl: 0x2039
name: 'FUEL_GAUGE'
display_name:
  en: 'Fuel Gauge'
  fr: 'Fuel Gauge'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  FUEL_GAUGE_READING:
    bits: '2.7-2.0'
    comment:
      en: 'Fuel Gauge Reading'
      fr: 'Fuel Gauge Reading'
    type: 'uint'
    units: '%'

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Fuel Gauge'
      fr: 'Fuel Gauge'
    max_duration_ms: 10000
