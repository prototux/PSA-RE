ioctl: 0x2050
name: 'O2_RESPONSE'
display_name:
  en: 'O2 Response'
  fr: 'O2 Response'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  AT_O2_SENSOR_RESPONSE:
    bits: '2.7-2.0'
    type: 'enum'

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'O2 Response'
      fr: 'O2 Response'
    max_duration_ms: 10000
