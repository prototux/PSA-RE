ioctl: 0x201B
name: 'CONTROLLER_SHUTDOWN_LOGIC'
display_name:
  en: 'Controller ShutDown Logic'
  fr: 'Controller ShutDown Logic'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  AT_CONTROLLER_SHUTDOWN_LOGIC:
    bits: '2.7-2.0'
    type: 'enum'

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Controller ShutDown Logic'
      fr: 'Controller ShutDown Logic'
    max_duration_ms: 10000
