ioctl: 0x2037
name: 'FUEL_OPEN_LOOP'
display_name:
  en: 'Fuel Open Loop'
  fr: 'Fuel Open Loop'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  AT_FUEL_OPEN_LOOP:
    bits: '2.7-2.0'
    type: 'enum'

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Fuel Open Loop'
      fr: 'Fuel Open Loop'
    max_duration_ms: 10000
