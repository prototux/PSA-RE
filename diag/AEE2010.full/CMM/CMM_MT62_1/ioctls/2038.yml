ioctl: 0x2038
name: 'VGIS_VARIABLE_INTAKE'
display_name:
  en: 'VGIS (Variable Intake)'
  fr: 'VGIS (Variable Intake)'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  AT_VGIS:
    bits: '2.7-2.0'
    type: 'enum'

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'VGIS (Variable Intake)'
      fr: 'VGIS (Variable Intake)'
    max_duration_ms: 10000
