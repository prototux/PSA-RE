ioctl: 0x202C
name: 'TEC_LEARN_CRANKSHAFT_ADAPTIVE'
display_name:
  en: 'TEC Learn (Crankshaft Adaptive)'
  fr: 'TEC Learn (Crankshaft Adaptive)'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  AT_TEC_LEARN:
    bits: '2.7-2.0'
    type: 'enum'

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'TEC Learn (Crankshaft Adaptive)'
      fr: 'TEC Learn (Crankshaft Adaptive)'
    max_duration_ms: 10000
