ioctl: 0x2011
name: 'CANISTER_PURGE'
display_name:
  en: 'Canister Purge'
  fr: 'Canister Purge'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  DUTY_CYCLE:
    bits: '2.7-2.0'
    comment:
      en: 'Duty Cycle'
      fr: 'Duty Cycle'
    type: 'uint'
    units: '%'

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Canister Purge'
      fr: 'Canister Purge'
    max_duration_ms: 10000
