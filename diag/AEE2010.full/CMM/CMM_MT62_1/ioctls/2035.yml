ioctl: 0x2035
name: 'BLM_LEARN_DISABLEBLM'
display_name:
  en: 'BLM Learn DisableBLM'
  fr: 'BLM Learn DisableBLM'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
