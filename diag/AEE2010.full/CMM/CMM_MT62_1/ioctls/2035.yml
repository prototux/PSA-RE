  AT_ENABLE_DRIVER_ENGINE_TURNING:
    bits: '2.7-2.0'
    type: 'enum'

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'BLM Learn DisableBLM'
      fr: 'BLM Learn DisableBLM'
    max_duration_ms: 10000
