ioctl: 0x2010
name: 'MALFUNCTION_INDICATOR_LIGHTS'
display_name:
  en: 'Malfunction Indicator Lights'
  fr: 'Malfunction Indicator Lights'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  AT_MALFUNCTION_INDICATOR_LIGHTS:
    bits: '2.7-2.0'
    type: 'enum'

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Malfunction Indicator Lights'
      fr: 'Malfunction Indicator Lights'
    max_duration_ms: 10000
