ioctl: 0x2067
name: 'CAM_PHASER_EXHAUST'
display_name:
  en: 'CAM Phaser exhaust'
  fr: 'CAM Phaser exhaust'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  POSITION_SLEW:
    bits: '2.7-2.0'
    comment:
      en: 'Position slew'
      fr: 'Position slew'
    type: 'uint'
    units: '%'

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'CAM Phaser exhaust'
      fr: 'CAM Phaser exhaust'
    max_duration_ms: 10000
