ioctl: 0x2052
name: 'ETC_MOTORETC'
display_name:
  en: 'ETC MotorETC'
  fr: 'ETC MotorETC'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  DUTY_CYCLE_SLEW:
    bits: '2.7-2.0'
    comment:
      en: 'Duty cycle slew'
      fr: 'Duty cycle slew'
    type: 'uint'
    units: '%'

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'ETC MotorETC'
      fr: 'ETC MotorETC'
    max_duration_ms: 10000
