ioctl: 0x2029
name: 'CRUISE_LEARN_RESET'
display_name:
  en: 'Cruise Learn Reset'
  fr: 'Cruise Learn Reset'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  AT_CRUISE_LEARN_RESET:
    bits: '2.7-2.0'
    type: 'enum'

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Cruise Learn Reset'
      fr: 'Cruise Learn Reset'
    max_duration_ms: 10000
