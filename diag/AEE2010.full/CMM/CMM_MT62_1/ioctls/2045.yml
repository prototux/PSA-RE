ioctl: 0x2045
name: 'EOL_CHECK_ENABLE_COMMAND_STT'
display_name:
  en: 'EOL Check Enable Command for STT'
  fr: 'EOL Check Enable Command for STT'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  AT_END_OF_LINE_CHECK_ENABLE_COMMAND_FOR:
    bits: '2.7-2.0'
    type: 'enum'

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'EOL Check Enable Command for STT'
      fr: 'EOL Check Enable Command for STT'
    max_duration_ms: 10000
