ioctl: 0x2083
name: 'DESIRED_IDLE_RPM'
display_name:
  en: 'Desired Idle RPM'
  fr: 'Desired Idle RPM'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  SET_DESIRED_IDLE_RPM:
    bits: '2.7-2.0'
    comment:
      en: 'Set Desired Idle RPM'
      fr: 'Set Desired Idle RPM'
    type: 'uint'
    factor: 12.5

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Desired Idle RPM'
      fr: 'Desired Idle RPM'
    max_duration_ms: 10000
