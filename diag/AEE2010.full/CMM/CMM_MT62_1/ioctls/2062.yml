ioctl: 0x2062
name: 'TPS_MIN_LEARN_ALGORITHM_RESETTPS'
display_name:
  en: 'TPS Min Learn Algorithm ResetTPS'
  fr: 'TPS Min Learn Algorithm ResetTPS'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  AT_THROTTLE_POSITION_MIN_LEARN:
    bits: '2.7-2.0'
    type: 'enum'

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'TPS Min Learn Algorithm ResetTPS'
      fr: 'TPS Min Learn Algorithm ResetTPS'
    max_duration_ms: 10000
