ioctl: 0x204D
name: 'VCPS_INTAKED_CAM_TOOTH_COUNTER'
display_name:
  en: 'VCPS Intaked Cam tooth counter'
  fr: 'VCPS Intaked Cam tooth counter'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CAM_TOOTH_COUNTER:
    bits: '2.7-2.0'
    comment:
      en: 'Cam tooth counter'
      fr: 'Cam tooth counter'
    type: 'uint'

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'VCPS Intaked Cam tooth counter'
      fr: 'VCPS Intaked Cam tooth counter'
    max_duration_ms: 10000
