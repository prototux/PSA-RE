ioctl: 0x2068
name: 'CAM_PHASER_EXHAUST_OIL_CONTROL_VALVE'
display_name:
  en: 'CAM Phaser Exhaust Oil Control Valve'
  fr: 'CAM Phaser Exhaust Oil Control Valve'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  DUTY_CYCLE:
    bits: '2.7-2.0'
    comment:
      en: 'Duty Cycle'
      fr: 'Duty Cycle'
    type: 'uint'
    units: '%'

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'CAM Phaser Exhaust Oil Control Valve'
      fr: 'CAM Phaser Exhaust Oil Control Valve'
    max_duration_ms: 10000
