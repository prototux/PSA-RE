ioctl: 0x204F
name: 'FUEL_INJECTOR_OVERRIDE'
display_name:
  en: 'Fuel Injector Override'
  fr: 'Fuel Injector Override'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  AT_CONTROL_TYPE:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x01

  BPW_FUEL_INJECTOR:
    bits: '3.7-3.0'
    comment:
      en: 'BPW of fuel injector'
      fr: 'BPW of fuel injector'
    type: 'uint'
    factor: 0.25

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Fuel Injector Override'
      fr: 'Fuel Injector Override'
    max_duration_ms: 10000
