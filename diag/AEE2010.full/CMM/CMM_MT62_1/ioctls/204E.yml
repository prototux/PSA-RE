ioctl: 0x204E
name: 'OFVC_SPARK_OVERRIDE'
display_name:
  en: 'OFVC Spark Override'
  fr: 'OFVC Spark Override'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  AT_CONTROL_TYPE:
    bits: '2.7-2.0'
    type: 'enum'

  IGNITION_ADVANCE_ANGLE:
    bits: '3.7-3.0'
    comment:
      en: 'Ignition advance angle'
      fr: 'Ignition advance angle'
    type: 'uint'
    factor: 0.5

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'OFVC Spark Override'
      fr: 'OFVC Spark Override'
    max_duration_ms: 10000
