ioctl: 0x2055
name: 'CVVL_OVERRIDE'
display_name:
  en: 'CVVL Override'
  fr: 'CVVL Override'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  AT_CONTROL_TYPE:
    bits: '2.7-2.0'
    type: 'enum'

  ANGLE_OF_CVVL:
    bits: '3.7-3.0'
    comment:
      en: 'Angle of CVVL'
      fr: 'Angle of CVVL'
    type: 'uint'
    factor: 0.5

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'CVVL Override'
      fr: 'CVVL Override'
    max_duration_ms: 10000
