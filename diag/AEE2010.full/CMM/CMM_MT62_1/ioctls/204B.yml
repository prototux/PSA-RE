ioctl: 0x204B
name: 'VCPS_INTAKED_BANK2_CAM_ANGLE_RATIO'
display_name:
  en: 'VCPS Intaked Bank2 Cam angle ratio'
  fr: 'VCPS Intaked Bank2 Cam angle ratio'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  CAM_ANGLE_RATIO:
    bits: '2.7-2.0'
    comment:
      en: 'Cam angle ratio'
      fr: 'Cam angle ratio'
    type: 'uint'
    factor: 0.0078125

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'VCPS Intaked Bank2 Cam angle ratio'
      fr: 'VCPS Intaked Bank2 Cam angle ratio'
    max_duration_ms: 10000
