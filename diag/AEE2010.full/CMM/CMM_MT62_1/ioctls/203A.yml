ioctl: 0x203A
name: 'TACHOMETER'
display_name:
  en: 'Tachometer'
  fr: 'Tachometer'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  TACHOMETER:
    bits: '2.7-2.0'
    comment:
      en: 'Tachometer'
      fr: 'Tachometer'
    type: 'uint'
    factor: 30
    units: 'rpm'

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Tachometer'
      fr: 'Tachometer'
    max_duration_ms: 10000
