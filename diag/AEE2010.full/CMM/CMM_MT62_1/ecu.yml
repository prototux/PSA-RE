node: 'CMM'
model: 'CMM_MT62_1'
display_name:
  en: 'Engine control unit (CMM_MT62_1)'
  fr: 'Calculateur moteur multifonction (CMM_MT62_1)'
protocols: ['UDS']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x7E0
    response_id: 0x7E8

sessions:
  0x01:
    en: 'Default session'
    fr: 'Session par défaut'
  0x03:
    en: 'Extended diagnostic session'
    fr: 'Session de diagnostic étendue'

resets:
  0x01:
    en: 'Hard reset'
    fr: 'Réinitialisation matérielle'

services: [0x10, 0x11, 0x14, 0x19, 0x22, 0x27, 0x2E, 0x2F, 0x31]

security_access:
  - level: 0x01

identification:
  request: '22 F1 89'
  part_number: '1.7-8.0'
  comment:
    en: 'The ECU part number is in data bytes 1 to 8 of the answer to 22 F1 89 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 1 à 8 de la réponse à 22 F1 89 (DCB), elle donne la variante logicielle'

cars: ['KP1']

variants:
  KP1_V1:
    parts: ['11111111']
    cars: ['KP1']
