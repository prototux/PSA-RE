node: 'CMM'
model: 'MED17_4_2'
display_name:
  en: 'Engine control unit (MED17_4_2)'
  fr: 'Calculateur moteur multifonction (MED17_4_2)'
protocols: ['UDS', 'KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    protocol: 'UDS'
    request_id: 0x6A8
    response_id: 0x688
    comment:
      en: 'Reached from the diagnostic socket (through the gateway on most cars)'
      fr: 'Atteint depuis la prise diagnostic (à travers la passerelle sur la plupart des véhicules)'
