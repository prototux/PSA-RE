did: 0xD488
name: 'MEASURED_AIR_FLOW'
display_name:
  en: 'Measured air flow'
  fr: 'Débit d''air mesuré'
  es: 'Caudal de aire medido'
  de: 'Gemessener Luftdurchsatz'
  pl: 'Zmierzony wydatek powietrza'
  hu: 'Mért levegohozam'
comment:
  en: 'With the engine running, this information should be very close to the setting value for the air flow please note : when the EGR valve is voluntarily deactivated by the ECU (after idling for several minutes for example), the value is no longer the same as the setting In the case of an electrical failure, this parameter measurement assumes a fixed recovery value other than 0'
  fr: 'Moteur tournant, cette information doit être très proche de la valeur de consigne du débit d''air attention : lorsque la vanne EGR est volontairement désactivée par le calculateur (suite à un ralenti pendant plusieurs minutes par exemple), la valeur n''est plus la même que celle de la consigne En cas de défaillance électrique, cette mesure paramètre prend une valeur figée de recouvrement différente de 0'
  es: 'Con el motor en funcionamiento, esta información debe acercarse mucho al valor de consigna del caudal de aire atención : cuando el calculador desactiva voluntariamente la válvula EGR (después de ralentí durante varios minutos, por ejemplo), el valor ya no es es mismo que el de la consigna En caso de fallo eléctrico, esta medida parámetro toma un valor fijo de recuperación distinto a 0'
  de: 'Bei laufendem Motor muss diese Information sehr nahe am Sollwert für die Luftmenge sein Vorsicht : wenn das EGR-Ventil absichtlich über das Steuergerät deaktiviert wird (z. B. nach einem Leerlauf von mehreren Minuten), ist der Wert nicht mehr gleich dem Sollwert Bei einem elektrischen Defekt nimmt diese Parametermessung einen festgelegten Ersatzwert ungleich 0 an'
  pl: 'Silnik pracujący, ta informacja powinna być bardzo zbliżona do wartości zadanej wydatku powietrza uwaga : gdy zawór EGR jest celowo wyłączony przez kalkulator (na przykład na skutek biegu jałowego w czasie paru minut), wartość nie jest ta sama co wartość zadana W przypadku niesprawności elektrycznej, ten pomiar parametru przyjmuje wartość stałą różną od 0'
  hu: 'Járó motornál ezen értéknek a levegőhozam előírt értékhez nagyon közelinek kell lennie figyelem : amikor az EGR szelep a computer által szándékosan semlegesítésre kerül(például egy alapjárat után több percig), az érték többé nem ugyanaz mint az előírt érték Elektromos meghibásodás esetén ezen paramétermérés 0-tól eltérő átfedő fix értéket vesz fel'
kind: 'live'
access: 'read'
length: 2

