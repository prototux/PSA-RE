did: 0xD415
name: 'ENGINE_COOLANT_TEMPERATURE'
display_name:
  en: 'Engine coolant temperature'
  fr: 'Température d''eau moteur'
  es: 'Temperatura del agua motor'
  de: 'Motor-Kühlmitteltemperatur'
  pl: 'Temperatura płynu chłodzącego silnika'
  hu: 'Motorhűtőfolyadék hőmérséklete'
comment:
  en: 'Coolant circuit temperature. the engine is generally considered hot above 70°C. if the temperature becomes too high, the ECU activates the cooling fan to aid cooling.'
  fr: 'Température d''eau du circuit de refroidissement. On considère généralement que le moteur est chaud au-delà de 70 °C. Lorsque la température est trop élevée, le calculateur active le groupe motoventilateur afin d''aider le refroidissement.'
  es: 'Temperatura del agua del circuito de refrigeración. Generalmente, se considera que el motor está caliente por encima de 70 °C. Cuando la temperatura es demasiado elevada, el calculador activa el grupo motoventilador con el fin de ayuda a la refrigeración.'
  de: 'Kühlmitteltemperatur. Der Motor gilt ebenfalls als warm, wenn der Motor wärmer als 70 °C ist. Wenn die Temperatur zu hoch ist, aktiviert das Steuergerät die Kühlerventilatorgruppe, um die Kühlung zu unterstützen.'
  pl: 'Temperatura cieczy w uk. Uważa się ogólnie, że silnik jest gorący powyżej 70°C. Gdy temperatura jest za wysoka, kalkulator włącza zespół wentylatora chłodnicy w celu zwiększenia chłodzenia.'
  hu: 'A hűtőkörben lévő folyadék hőmérséklete. Akkor vesszük melegnek a motort, ha a motor 70 °C-nál melegebb. Amikor a hőmérséklet a túlságosan magas, a computer aktiválja a motorhűtő-ventilátor egységet a hűtés segítése érdekében.'
kind: 'live'
access: 'read'
length: 2

