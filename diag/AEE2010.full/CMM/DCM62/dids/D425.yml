  pl: 'Napięcie zasilania ustabilizowane 5 V nr 3. To zasilanie zarządza następującymi czujnikami : kalkulator kontroli silnika czujnik pedału przyspieszenia czujnik odniesienia cylindra czujnik wysokiego ciśnienia paliwa'
  hu: 'Stabilizált 3 számú 5V-os tápellátó feszültség. Ezen tápellátás a következő érzékelőket kezeli : motorvezérlő számítógép gázpedál-érzékelő referenciahenger-érzékelő nagynyomású üzemanyagnyomás- érzékelő'
