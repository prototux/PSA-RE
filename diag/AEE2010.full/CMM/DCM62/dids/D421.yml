comment:
  en: 'Pressure measured by the ECU by means of the sensor in the refrigerant circuit. In the case of an electrical failure, this parameter measurement assumes a fixed recovery value other than 0'
  fr: 'Pression mesurée par le calculateur grâce au capteur dans le circuit de fluide réfrigérant. En cas de défaillance électrique, cette mesure paramètre prend une valeur figée de recouvrement différente de 0'
  es: 'Presión medida por el calculador gracias al captador en el circuito de fluido refrigerante. En caso de fallo eléctrico, esta medida parámetro toma un valor fijo de recuperación distinto a 0'
  de: 'Vom Steuergerät dank des Sensors im Kältemittelsystem gemessener Druck. Bei einem elektrischen Defekt nimmt diese Parametermessung einen festgelegten Ersatzwert ungleich 0 an'
  pl: 'Ciśnienie zmierzone przez kalkulator dzięki czujnikowi w układzie płynu chłodniczego. W przypadku niesprawności elektrycznej, ten pomiar parametru przyjmuje wartość stałą różną od 0'
  hu: 'A computer által mért nyomás a hűtőközeg-körben lévő érzékelőnek köszönhetően. Elektromos meghibásodás esetén ezen paramétermérés 0-tól eltérő átfedő fix értéket vesz fel'
