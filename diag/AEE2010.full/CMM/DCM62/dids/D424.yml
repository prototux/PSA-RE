comment:
  en: 'Voltage of the 5V stabilised supply n°2. This supply controls the following sensors : engine management ECU engine oil pressure sensor Air mixer position sensor Motorised coolant outlet housing position repeat sensor Exhaust gas recirculation valve position sensor clutch position sensor'
  fr: 'Tension de l''alimentation stabilisée 5V n°2. Cette alimentation gère les capteurs suivants : calculateur contrôle moteur capteur pression huile moteur Capteur de position du doseur d''air Capteur de recopie de position du boîtier de sortie d''eau motorisé Capteur de position de la vanne de recyclage des gaz d''échappement capteur de position d''embrayage'
  es: 'Tensión de alimentación estabilizada 5 V n°2. Esta alimentación gestiona los siguientes captadores : calculador control motor captador presión aceite motor Captador de posición Dosificador de aire captador de recopia de posición de la caja de salida de agua motorizada Captador de posición de la válvula de reciclado de los gases de escape captador de posición de embrague'
  de: 'Stabilisierte Versorgungsspannung 5 V Nr. 2. Diese Versorgung steuert die folgenden Sensoren : motorsteuergerät sensor Motoröldruck Positionssensor Luftdosierer Positionsrückmeldesensor der elektrischen Thermostateinheit Positionssensor des Abgasrückführungsventils Kupplungspositionssensor'
  pl: 'Napięcie zasilania ustabilizowane 5 V nr 2. To zasilanie zarządza następującymi czujnikami : kalkulator kontroli silnika czujnik cisnienia oleju w silniku Czujnik pozycji Dozownika powietrza Czujnik sygnału dodatkowego położenia kolektora wylotowego płynu chłodzącego z napędem Czujnik pozycji zaworu recyrkulacji spalin czujnik położenia sprzęgła'
  hu: 'Stabilizált 2 számú 5V-os tápellátó feszültség. Ezen tápellátás a következő érzékelőket kezeli : motorvezérlő számítógép motorolaj-nyomás érzékelő Levegőadagoló helyzetérzékelő Motoros hajtású termosztátház helyzetlemásoló érzékelő A kipufogógáz-visszavezető szelep helyzetérzékelője tengelykapcsoló helyzetérzékelő'
kind: 'live'
