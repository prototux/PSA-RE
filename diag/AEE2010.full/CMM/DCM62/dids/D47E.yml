did: 0xD47E
name: 'TURBOCHARGING_PRESSURE_MEASURED'
display_name:
  en: 'Turbocharging pressure measured'
  fr: 'Pression de suralimentation mesurée'
  es: 'Presión de sobrealimentación medida'
  de: 'Gemessener Ladedruck'
  pl: 'Mierzone cisnienie doladowania'
  hu: 'Mért töltőnyomás'
comment:
  en: 'This is the pressure measured at the air intake circuit. The value should be close to the reference value. In the case of an electrical failure, this parameter measurement assumes a fixed recovery value other than 0'
  fr: 'Il s''agit de la pression mesurée au niveau du circuit d''admission d''air. La valeur doit être proche de la consigne. En cas de défaillance électrique, cette mesure paramètre prend une valeur figée de recouvrement différente de 0'
  es: 'Se trata de la presión medida en el circuito de admisión de aire. El valor debe situarse en torno a la consigna. En caso de fallo eléctrico, esta medida parámetro toma un valor fijo de recuperación distinto a 0'
  de: 'Es handelt sich um den am Lufteinlasssystem gemessenen Druck. Der Wert muss nahe am Sollwert sein. Bei einem elektrischen Defekt nimmt diese Parametermessung einen festgelegten Ersatzwert ungleich 0 an'
  pl: 'Mamy do czynienia z ciśnieniem zmierzonym na poziomie układu dolotowego powietrza. Wartość musi być zbliżona do wartości zadanej. W przypadku niesprawności elektrycznej, ten pomiar parametru przyjmuje wartość stałą różną od 0'
  hu: 'A levegő szívókör szintjénél mért nyomást jelenti. Az érték az előírthoz közeli kell legyen. Elektromos meghibásodás esetén ezen paramétermérés 0-tól eltérő átfedő fix értéket vesz fel'
kind: 'live'
access: 'read'
length: 2

