comment:
  en: 'Voltage of the 5V stabilised supply n°4. This supply controls the following sensors : engine management ECU Air conditioning pressure sensor braking vacuum sensor gearbox neutral sensor'
  fr: 'Tension de l''alimentation stabilisée 5V n°4. Cette alimentation gère les capteurs suivants : calculateur contrôle moteur Capteur de pression réfrigération capteur de dépression de freinage Capteur point mort de boîte de vitesses'
  es: 'Tensión de alimentación estabilizada 5 V n°4. Esta alimentación gestiona los siguientes captadores : calculador control motor Captador de presión refrigeración captador de depresión de frenos captador de punto muerto de caja de velocidades'
  de: 'Stabilisierte Versorgungsspannung 5 V Nr. 4. Diese Versorgung steuert die folgenden Sensoren : motorsteuergerät Klimaanlagendrucksensor unterdruckfühler Bremsanlage Totpunktgeber des Getriebes'
  pl: 'Napięcie zasilania ustabilizowane 5 V nr 4. To zasilanie zarządza następującymi czujnikami : kalkulator kontroli silnika czujnik ciśnienia czynnika chłodniczego czujnik podciśnienia hamowania czujnik położenia neutralnego skrzyni biegów'
  hu: 'Stabilizált 4 számú 5V-os tápellátó feszültség. Ezen tápellátás a következő érzékelőket kezeli : motorvezérlő számítógép hűtőközeg nyomásérzékelő a fékezés vákum-érzékelője sebességváltó holtpont érzékelő'
