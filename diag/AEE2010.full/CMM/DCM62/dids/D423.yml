did: 0xD423
name: 'STATUS_5_V_SUPPLY_NUMBER_1'
display_name:
  en: 'Status of the 5 V supply number 1'
  fr: 'Etat de l''alimentation 5 V numéro 1'
  es: 'Estado de la alimentación 5 V número 1'
  de: 'Zustand der Versorgung 5 V Nummer 1'
  pl: 'Stan zasilania 5 V numer 1'
  hu: '1 számú 5 V tápellátás állapota'
comment:
  en: 'Voltage of the 5V stabilised supply n°1. This supply controls the following sensors : inlet air temperature and pressure sensor the turbocharger position repeat sensor engine speed sensor'
  fr: 'Tension de l''alimentation stabilisée 5V n°1. Cette alimentation gère les capteurs suivants : capteur de température et de pression de l''air en admission le capteur de recopie de position du turbocompresseur Capteur de régime moteur'
  es: 'Tensión de alimentación estabilizada 5 V n°1. Esta alimentación gestiona los siguientes captadores : captador de temperatura y de presión del aire en admisión el captador de recopia de posición del turbocompresor captador régimen motor'
  de: 'Stabilisierte Versorgungsspannung 5 V Nr. 1. Diese Versorgung steuert die folgenden Sensoren : Ansauglufttemperatur- und -druckgeber Rückmeldesensor der Position des Turboladers Motordrehzahlgeber'
  pl: 'Napięcie zasilania ustabilizowane 5 V nr 1. To zasilanie zarządza następującymi czujnikami : czujnik temperatury i ciśnienia powietrza dolotowego czujnik sygnału dodatkowego położenia turbosprężarki czujnik prędkości obrotowej silnika'
  hu: 'Stabilizált 1 számú 5V-os tápellátó feszültség. Ezen tápellátás a következő érzékelőket kezeli : szívott levegő nyomás- és hőmérsékletérzékelő a turbókompresszor helyzetlemásoló érzékelője motor fordulatszám-érzékelő'
kind: 'live'
access: 'read'
length: 2
