did: 0xD48A
name: 'OPENING_CYCLIC_RATIO_TURBOCHARGER_CONTROL'
display_name:
  en: 'Opening cyclic ratio of the turbocharger control'
  fr: 'Rapport cyclique d''ouverture de la commande du turbocompresseur'
  es: 'Relación cíclica de apertura del mando del turbocompresor'
  de: 'Taktverhältnis Betätigung Turbolader'
  pl: 'Cykliczny stosunek otwarcia sterowania turbosprężarki'
  hu: 'A turbókompresszor vezérlésének RCO értéke'
comment:
  en: 'It is a reflection of the electrical control by the ECU. this control is applied to the vacuum circuit solenoid valve. It is normal for this percentage to be different from the position reference value. the value can only be positive.'
  fr: 'Il s''agit du reflet du pilotage électrique par le calculateur. ce pilotage est appliqué à l''électrovanne du circuit de vide. Il est normal que ce pourcentage ne corresponde pas à la consigne de position. la valeur ne peut être que positive.'
  es: 'Se trata del reflejo del pilotaje eléctrico por el calculador. este pilotaje se aplica a la electroválvula del circuito de vacío. Es normal que el porcentaje no se corresponda con la consigna de posición. el valor no puede ser positivo.'
  de: 'Es handelt sich um die Wiedergabe der elektrischen Ansteuerung durch das Steuergerät. diese Steuerung wird am Elektroventil des Unterdrucksystems angewendet. Es ist normal, dass dieser Prozentsatz nicht dem Positionssollwert entspricht. der Wert kann nur positiv sein.'
  pl: 'Dotyczy odwzorowania pilotowania elektrycznego przez kalkulator. to sterowanie stosowane jest dla elektrozaworu układu podciśnienia. Jest rzeczą normalną że ten procent nie odpowiada wartości zadanej pozycji. wartość może być wyłącznie dodatnia.'
  hu: 'A computer általi elektromos vezérlés válaszáról van szó. ez a vezérlés a vákuumkör mágneszelepén kerül alkalmazásra. Normális, hogy ezen százalékos arány nem felel meg a helyzet előírt értéknek. az érték csak pozitív lehet.'
kind: 'live'
access: 'read'
length: 2

