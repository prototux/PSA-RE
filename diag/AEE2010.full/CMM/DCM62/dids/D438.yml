name: 'CONDITION_NEUTRAL_SENSOR'
display_name:
  en: 'Condition of the neutral sensor'
  fr: 'Etat du capteur point mort'
  es: 'Estado del captador punto muerto'
  de: 'Zustand des Totpunktgebers'
  pl: 'Stan czujnika położenia luz'
  hu: 'Holtponti érzékelő állapota'
comment:
  en: 'This parameter should only be taken into account on manual gearboxes. The parameter should take the value True when the lever is in neutral'
  fr: 'Ce paramètre n''est à prendre en compte que sur les boîtes de vitesses mécaniques. Le paramètre doit prendre la valeur Vrai lorsque le levier est au point mort'
  es: 'Este parámetro solamente debe tenerse en cuenta en los vehículos equipados con una caja de velocidades mecánica. El parámetro debe adoptar el valor Real cuando la palanca está en punto muerto'
  de: 'Dieser Parameter braucht nur bei Schaltgetrieben beachtet zu werden. Der Parameter muss den Wert Wahr annehmen, wenn sich der Hebel in Neutralstellung befindet'
  pl: 'Ten parametr należy uwzględniać tylko w przypadku mechanicznych skrzyń biegów. Parametr powinien przyjąć wartość "Prawda" kiedy dźwignia jest w martwym punkcie (a "luzie")'
  hu: 'Ez a paraméter csupán mechanikus sebességváltókon veendő figyelembe.. A paraméternek a Vrai értéket kell felvennie amikor a kar holtponti helyzetben van'
