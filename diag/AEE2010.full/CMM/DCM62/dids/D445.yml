  de: 'Dies stellt den Druck dar, den das Steuergerät in der CR-Verteilerleiste wünscht.Es bestimmt ihn in Abhängigkeit von dem Einspritzbedarf in den Zylindern'
  pl: 'Określa ona ciśnienie jakie kalkulator wymaga w kolektorze wtryskowym.Ustala je w funkcji potrzeb wtrysku w cylindrach'
  hu: 'Ez azt a nyomást jelenti, amelyet a motor-vezérlőegység a gyűjtőcsőben létrehozni kíván.Azt a henger befecskendezési igényének függvényében határozza meg'
