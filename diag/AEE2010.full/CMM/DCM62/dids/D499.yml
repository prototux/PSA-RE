  de: 'Entspricht der Motordrehzahl, die das Steuergerät dank der Sensordaten erhält Bei einem elektrischen Defekt nimmt diese Parametermessung einen festgelegten Ersatzwert ungleich 0 an'
  pl: 'Odpowiada obrotom silnika widzianym przez kalkulator dzięki informacji czujnika W przypadku niesprawności elektrycznej, ten pomiar parametru przyjmuje wartość stałą różną od 0'
  hu: 'Megfelel a vezérlőegység által látott motor fordulatszámnak (az érzékelő információnak köszönhetően) Elektromos meghibásodás esetén ezen paramétermérés 0-tól eltérő átfedő fix értéket vesz fel'
