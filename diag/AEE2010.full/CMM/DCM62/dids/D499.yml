comment:
  en: 'This is the engine speed as seen by the ECU thanks to information coming from the sensor In the case of an electrical failure, this parameter measurement assumes a fixed recovery value other than 0'
  fr: 'Correspond au régime moteur vu par le calculateur grâce à l''information du capteur En cas de défaillance électrique, cette mesure paramètre prend une valeur figée de recouvrement différente de 0'
