did: 0xD48E
name: 'AIR_FLOW_REFERENCE_VALUE'
display_name:
  en: 'Air flow reference value'
  fr: 'Consigne de débit d''air'
  es: 'Cosigna de caudal de aire'
  de: 'Luftdurchsatz-Sollwert'
  pl: 'Wartość zadana wydatku powietrza'
  hu: 'Levegőhozam előírt érték'
comment:
  en: 'This represents the quantity of fresh air that the ECU requires in the air intake circuit. It determines the quantity of air according to the requirements of the engine (observance of emission control, performance, etc.)'
  fr: 'Cela représente la quantité d''air frais que le calculateur souhaite dans le circuit d''admission d''air. Il détermine la quantité d''air en fonction des besoins du moteur (respect de la dépollution, performance,...)'
  es: 'Esto representa la cantidad de aire fresco que el calculador desea en el circuito de admisión de aire. Determina la cantidad de aire en función de las necesidades del motor (respeto de la descontaminación, rendimiento...)'
  de: 'Dies stellt die Frischluftmenge dar, die das Steuergerät im Lufteinlasssystem wünscht. Bestimmt die Luftmenge in Abhängigkeit von den Bedürfnissen des Motors (Einhaltung der Abgasnorm, Leistung,...)'
  pl: 'To odpowiada ilości świeżego powietrza, które kalkulator wymaga w układzie dolotowym powietrza. Określa ilość powietrza w zależności od potrzeb silnika (przestrzeganie czystości spalin, osiągi...)'
  hu: 'Ez jellemzi a friss levegő mennyiséget, amit a computer a levegőszívó körben kíván. Ez a motor igényeinek függvényében meghatározza a levegő mennyiségét (teljesítmény, környezetvédelem betartása,...)'
kind: 'live'
access: 'read'
length: 2

params:
  AIR_FLOW_REFERENCE_VALUE:
    bits: '1.7-2.0'
    comment:
      en: 'Air flow reference value'
