comment:
  en: 'In the case of an electrical failure, this parameter measurement assumes a fixed recovery value other than 0 The urea pressure sensor cannot measure a pressure lower than 4 bars The operating range of the urea pressure sensor is between 4 and 7 bars'
  fr: 'En cas de défaillance électrique, cette mesure paramètre prend une valeur figée de recouvrement différente de 0 Le capteur de pression d''urée ne peut pas mesurer une pression inférieure à 4 bars La plage de fonctionnement du capteur de pression d''urée est comprise entre 4 et 7 bars'
  es: 'En caso de fallo eléctrico, esta medida parámetro toma un valor fijo de recuperación distinto a 0 El captador de presión de urea no puede medir una presión inferior a 4 bares El rango de funcionamiento del captador de presión de urea está comprendido entre 4 y 7 bares'
  de: 'Bei einem elektrischen Defekt nimmt diese Parametermessung einen festgelegten Ersatzwert ungleich 0 an Der Harnstoff-Drucksensor kann keinen Druck unter 4 bar messen Der Funktionsbereich des Harnstoff-Drucksensors liegt zwischen 4 und 7 bar'
  pl: 'W przypadku niesprawności elektrycznej, ten pomiar parametru przyjmuje wartość stałą różną od 0 Czujnik ciśnienia mocznika nie może mierzyć ciśnienia niższego od 4 barów Zakres działania czujnika ciśnienia mocznika jest zawarty między 4 i 7 barów'
  hu: 'Elektromos meghibásodás esetén ezen paramétermérés 0-tól eltérő átfedő fix értéket vesz fel Az AdBlue-adalék nyomásérzékelő nem tud mérni 4 bar alatti nyomást Az AdBlue-adalék nyomásérzékelő működési tartománya 4 és 7 bar közötti'
