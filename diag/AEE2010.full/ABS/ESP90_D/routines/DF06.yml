routine: 0xDF06
name: 'REACTIVATION_AUTOMATIC_APPLICATION_ELECTRIC'
display_name:
  en: 'Reactivation of automatic application of the electric parking brake'
  fr: 'Réactivation serrage automatique du frein de stationnement à commande électrique'
  es: 'Reactivación del tensado automático del freno estacionamiento con mando eléctrico'
  de: 'Reaktivierung automatisches Anziehen der elektrischen Feststellbremse'
  pl: 'Reaktywacja automatycznego zaciskania hamulca postojowego sterowanego elektrycznie'
  hu: 'Az elektromos rögzítofék automatikus behúzásának újbóli működésbe hozása'
control: ['start', 'stop', 'results']

params:
  ACTIVATIONTYPE:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x00

  ACTIVATIONTYPE1:
    bits: '2.7-3.0'
    type: 'enum'
    default: 0xF05A

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x02:
        en: 'Function deactivation procedure finished'
        fr: 'Procédure d''inhibition de la fonction terminée'
        es: 'Procedimiento de inhibición de la función terminado'
        de: 'Deaktivierungsverfahren der Funktion beendet'
        pl: 'Procedura wylaczania funkcji zakonczona'
        hu: 'A funkció tiltás eljárás befejezodött'
      0x03:
        en: 'The deactivation procedure is complete but a problem occurred'
        fr: 'Procédure d''inhibition est terminée mais un problème est survenu'
        es: 'El procedimiento de inhibición ha finalizado pero se ha producido un problema'
        de: 'Das Deaktivierungsverfahren ist beendet, aber ein Problem ist aufgetreten'
        pl: 'Procedura wyłączenia jest zakończona, ale pojawił się problem'
        hu: 'Letiltó eljárás befejeződött, de egy meghibásodás került megfigyelésre'
      0x04:
        en: 'Operation stopped by the operator (the report is not available).'
        fr: 'Opération arrêtée par l''opérateur (le compte-rendu n''est pas disponible).'
        es: 'Operación interrumpida por el usuario (el informe no está disponible).'
        de: 'Vorgang vom Techniker gestoppt (der Testbericht ist nicht verfügbar).'
        pl: 'Operacja zatrzymana przez operatora (sprawozdanie nie jest dostępne).'
        hu: 'A kezelő által leállított művelet (a meghibásodási jelentés nem áll rendelkezésre).'

tests:
  - display_name:
      en: 'Reactivation of automatic application of the electric parking brake'
      fr: 'Réactivation serrage automatique du frein de stationnement à commande électrique'
      es: 'Reactivación del tensado automático del freno estacionamiento con mando eléctrico'
      de: 'Reaktivierung automatisches Anziehen der elektrischen Feststellbremse'
      pl: 'Reaktywacja automatycznego zaciskania hamulca postojowego sterowanego elektrycznie'
      hu: 'Az elektromos rögzítofék automatikus behúzásának újbóli működésbe hozása'
  - display_name:
      en: 'Deactivation of the electric parking brake automatic application function'
      fr: 'Inhibition de la fonction serrage automatique du frein de stationnement à commande électrique'
      es: 'Inhibición de la función accionado automático del freno de estacionamiento de mando eléctrico'
      de: 'Deaktivierung der Funktion automatisches Anziehen der elektrischen Feststellbremse'
      pl: 'Wylaczenie funkcji automatycznego zaciskania hamulca postojowego sterowanego elektrycznie'
      hu: 'Az elektromos vezérlésű kézifék automatikus behúzása funkció tiltása'
