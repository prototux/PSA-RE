did: 0xD41F
name: 'STEERING_WHEEL_ANGLE'
display_name:
  en: 'Steering wheel angle'
  fr: 'Angle volant de direction'
  es: 'Ángulo volante de dirección'
  de: 'Lenkradwinkel'
  pl: 'Kąt koła kierownicy'
  hu: 'Kormánykerékszög'
comment:
  en: 'For a vehicle without semi-automatic parking system : The steering wheel angle sensor value provided by the ESP ECU is reset to zero each time the ignition is switched off the ESP ECU only provides a variation of the steering wheel angle To reset the steering wheel angle sensor information : Drive at a speed of more than 40 km/h'
  fr: 'Pour un véhicule sans système de stationnement semi-automatique : La valeur du capteur d''angle volant de direction fournie par le calculateur ESP est recalée à zéro à chaque coupure du contact le calculateur ESP ne fournit qu''une variation de l''angle volant de direction Pour recaler l''information du capteur d''angle volant de direction : Effectuer un roulage à une vitesse supérieure à 40 km/h'
  es: 'Para un vehículo sin sistema de estacionamiento semiautomático : El valor del captador de ángulo volante de dirección suministrado por el calculador ESP se pone a 0 cada vez que se corta el contacto el calculador de ESP solo proporciona una variación del ángulo volante de dirección Para eliminar la información del captador de ángulo volante de dirección : Circular a una velocidad superior a 40 km/h'
  de: 'Für ein Fahrzeug ohne halbautomatisches Einparksystem : Der vom ESP-Steuergerät gelieferte Wert des Lenkradwinkelsensors wird bei jedem Ausschalten der Zündung auf Null zurückgesetzt das ESP-Steuergerät liefert nur eine Änderung des Lenkradwinkels Zum Zurücksetzen der Information des Lenkradwinkelsensors : Eine Fahrt mit einer Geschwindigkeit von mehr als 40 km/h durchführen'
  pl: 'Dla pojazdu bez półautomatycznego systemu parkowania : Wartość czujnika kąta koła kierownicy dostarczana przez kalkulator ESP jest wyzerowana przy każdym wyłączeniu zapłonu kalkulator ESP dostarcza wyłącznie zmianę kąta obrotu koła kierownicy W celu ustawienia informacji czujnika kąta koła kierownicy : Wykonać jazdę z prędkością przekraczającą 40 km/h'
  hu: 'Egy félautomata parkolási rendszer nélküli gépkocsi számára : Az ESP computer által szállított kormánykerékszög érték minden gyújtáslekapcsoláskor újból nullázásra kerül az ESP computer csupán egy kormánykerékszög változatot szállít A kormánykerékszög-érzékelő információ újbóli beállításához : Tegyen egy próbautat 40 km/h feletti sebességgel'
kind: 'live'
access: 'read'
length: 2

