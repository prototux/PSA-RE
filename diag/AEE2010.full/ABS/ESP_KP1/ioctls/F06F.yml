ioctl: 0xF06F
name: 'FRONT_LEFT_VALVE_INPUT'
display_name:
  en: 'Front left valve Input'
  fr: 'Front left valve Input'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  ACTIAVATION_TIME:
    bits: '2.7-2.0'
    comment:
      en: 'Actiavation Time'
      fr: 'Actiavation Time'
    type: 'uint'
    factor: 10
    units: 'ms'

  AT_CONTROL_ENABLE_MASK_RECORD:
    bits: '3.7-4.0'
    type: 'enum'

results:
  IOCP:
    bits: '1.7-1.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Front left valve Input'
      fr: 'Front left valve Input'
    max_duration_ms: 2250
  - display_name:
      en: 'Front Right Valve Input'
      fr: 'Front Right Valve Input'
    max_duration_ms: 2250
  - display_name:
      en: 'Rear Left Valve Input'
      fr: 'Rear Left Valve Input'
    max_duration_ms: 2250
  - display_name:
      en: 'Rear Right Valve Input'
      fr: 'Rear Right Valve Input'
    max_duration_ms: 2250
  - display_name:
      en: 'Front Left Valve Output'
      fr: 'Front Left Valve Output'
    max_duration_ms: 2250
  - display_name:
      en: 'Front Right Valve Output'
      fr: 'Front Right Valve Output'
    max_duration_ms: 2250
  - display_name:
      en: 'Rear Left Valve Output'
      fr: 'Rear Left Valve Output'
    max_duration_ms: 2250
  - display_name:
      en: 'Rear Right Valve Output'
      fr: 'Rear Right Valve Output'
    max_duration_ms: 2250
  - display_name:
      en: 'Motor'
      fr: 'Motor'
    max_duration_ms: 2250
  - display_name:
      en: 'TCS Front Left Valve'
      fr: 'TCS Front Left Valve'
    max_duration_ms: 2250
