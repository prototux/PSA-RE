routine: 0xDF0E
name: 'REPLACEMENT_BRAKE_PADS'
display_name:
  en: 'Replacement of the brake pads'
  fr: 'Remplacement des plaquettes de frein'
  es: 'Sustitución de las plaquetas de freno'
  de: 'Austausch der Bremsbeläge'
  pl: 'Wymiana klocków hamulcowych'
  hu: 'Fékbetétek cseréje'
control: ['start', 'stop', 'results']

params:
  ACTIVATIONTYPE:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0xFF

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x02:
        en: 'Motorised brake calipers in the fully released position Apply the brake pads replacement procedure : B3FG01M0P0'
        fr: 'Etriers de frein motorisés en position de desserrage complet Appliquer la gamme de remplacement des plaquettes de frein : B3FG01M0P0'
        es: 'Estribos de freno motorizados en posición aflojado completo Aplicar la gama de sustitución de las pastillas de freno : B3FG01M0P0'
        de: 'Motorisierte Bremssättel in Position komplett gelöst Das Austauschverfahren der Bremsbeläge anwenden : B3FG01M0P0'
        pl: 'Zaciski hamulcowe z napędem w położeniu całkowitego zwolnienia Zastosować zakres operacji wymiany klocków hamulcowych : B3FG01M0P0'
        hu: 'Motoros hajtású féknyergek teljesen kiengedett helyzetben Végezze el a fékbetétek cseréje műveletsort : B3FG01M0P0'
      0x03:
        en: 'The procedure for releasing the motorised brake calipers is complete but a problem occurred. Refer to the removal/refitting method below : B3FG01M0P0 press Return to return to the menu.'
        fr: 'La procédure de desserrage des étriers de frein motorisés est terminée mais un problème est survenu. Consulter la méthode de dépose-repose suivante : B3FG01M0P0 appuyez sur Retour pour revenir au menu.'
        es: 'El procedimiento para aflojar los estribos de freno motorizados ha finalizado pero se ha producido un problema. Consultar el método de desmontaje-montaje siguiente : B3FG01M0P0 pulsar Retorno para volver al menú.'
        de: 'Das Verfahren zum Lösen der motorisierten Bremssättel ist beendet, aber ein Problem ist aufgetreten. Die folgende Methode für Ausbau-Einbau konsultieren : B3FG01M0P0 zurück drücken, um zum Hauptmenü zurückzukehren.'
        pl: 'Procedura zwolnienia zacisków hamulcowych z napędem jest zakończona, ale pojawił się problem. Odwołać się do następującej metody demontażu-montażu : B3FG01M0P0 nacisnac klawisz Powrót aby powrócic do menu.'
        hu: 'A motoros hajtású féknyergek kiengedési eljárása befejezésre került, de egy probléma került megfigyelésre. Tekintse meg a következő le-felszerelési módszert : B3FG01M0P0 A menühez való visszatéréshez nyomja meg a Visszalépés billentyűt.'
      0x04:
        en: 'Operation stopped by the operator (the report is not available)'
        fr: 'Opération arrêtée par l''opérateur (le compte-rendu n''est pas disponible)'
        es: 'Operación interrumpida por el usuario (el informe no está disponible)'
        de: 'Vorgang vom Techniker gestoppt (der Testbericht ist nicht verfügbar)'
        pl: 'Operacja zatrzymana przez operatora (sprawozdanie nie jest dostępne)'
        hu: 'A kezelő által leállított művelet (a meghibásodási jelentés nem áll rendelkezésre)'

