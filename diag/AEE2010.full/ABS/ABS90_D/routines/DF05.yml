routine: 0xDF05
name: 'BLEEDING'
display_name:
  en: 'Bleeding'
  fr: 'Purge'
  es: 'Purgado'
  de: 'Entlüftung'
  pl: 'Odpowietrzenie'
  hu: 'Légtelenítés'
control: ['start', 'stop', 'results']

params:
  ACTIVATIONTYPE1:
    bits: '1.7-2.0'
    type: 'enum'
    default: 0x101

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    alt_names: ['ACTUATOR_TEST_2', 'ACTUATOR_TEST_3', 'ACTUATOR_TEST_4']
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x02:
        en: 'Bleeding routine completed.Continue to pump the brake pedal until clean and bubble-free brake fluid is obtained. Close the bleed screw on the rear LH wheel.'
        fr: 'Routine de purge terminée.Continuez de pomper la pédale de frein jusqu''à l''obtention d''un liquide de frein propre et non émulsionné. Fermez la vis de purge de la roue arrière gauche.'
        es: 'Rutina de purga terminada.Continuar bombeando el pedal de freno hasta obtener un líquido de freno limpio y no emulsionado. Cerrar el tornillo de purga de la rueda trasera izquierda.'
        de: 'Entlüftungsvorgang beendet.Das Bremspedal weiter pumpen, bis die Bremsflüssigkeit sauber und nicht emulgiert ist.. Die Entlüftungsschraube des Rads hinten links schliessen.'
        pl: 'Standardowa procedura odpowietrzania zakończona.Kontynuowac pompowanie pedalem hamulca, dopóki wyplywajacy plyn hamulcowy nie bedzie czysty i nie spieniony. Zamknac odpowietrznik lewego tylnego kola.'
        hu: 'A légtelenítési eljárás befejezve.Folytassa a fékpedál pumpálását mindaddíg, amíg tiszta és nem emulzionált folyadékot nem kap. Zárja le a bal hátsó kerék légteleníto csavarját.'
      0x03:
        en: 'Control completed but presence of a problem.Read the parameter measurements by selecting the "Brake switch and relay information" menu. Check the activation status of the electrovalve supply relay and the status of the recirculation pump relay then read the faults Deal first with any faults relating to the electrovalves and pump motor'
        fr: 'Pilotage terminé mais problème.Veuillez effectuer une lecture des mesures paramètres en sélectionnant le menu " Informations contacteur freins et relais". Vérifiez l''état d''activation du relais d''alimentation des électrovannes et l''état du relais de la pompe de recirculation puis effectuez une lecture défauts Traiter les défauts en relation avec les électrovannes et le moteur de pompe en priorité'
        es: 'Pilotaje terminado pero problema.Efectuar una lectura de la medición de parámetros seleccionando el menú "informaciones contactor frenos y relés". Verificar el estado de activación del relé de alimentación de las electroválvulas y el estado del relé de la bomba de recirculación a continuación efectuar una lectura defectos Tratar prioritariamente los defectos relacionados con las electroválvulas y con el motor de bomba'
        de: 'Steuerung beendet, jedoch Problem.Eine Abfrage der Parameterwerte mit der Auswahl des Menüs "Information Bremskontaktschalter und Relais" durchzuführen. Prüfen Sie den Aktivierungszustand des Versorgungsrelais der Elektroventile und der Zirkulationspumpe und eine Fehlerabfrage durchführen Die Fehler im Zusammenhang mit den Elektroventilen und dem Pumpenmotor vorrangig behandeln'
        pl: 'Sterowanie zakończone, ale wystąpił problem.Prosze wykonac odczyt wartosci parametrów wybierajac menu " Informacje zestyku hamulców i przekazników". Sprawdzic stan wzbudzenia przekaznika zasilania elektrozaworów i stan przekaznika pompy recyrkulacyjnej, a nastepnie wykonac odczyt usterek Zajac sie usterkami zwiazanymi z elektrozaworami i silnikiem pompy w pierwszej kolejnosci'
        hu: 'Vezérlés befejezve de probléma lépett fel.A " fékkapcsolók és relé információk" menü kiválasztásával legyen szíves paraméter mérés olvasást végezni. Ellenorizze az elektromágnessezelepk tápreléjének és a visszakeringteto szivattyú reléjének aktíválási állapotát, azután végezzen hibaolvasást Kezelje elonyben részesítve az elektormágnesszelepekkel és a szivattyúmotorral kapcsolatos hibákat'
      0x04:
        en: 'The bleed operation was stopped by the user.you must return to the main menu'
        fr: 'La purge a été arrêtée par l''utilisateur.vous devez retourner au menu général'
        es: 'La purga ha sido detenda por el utilizador.debe volver al menú general'
        de: 'Die Entlüftung wurde durch der Benutzer angehalten.Sie müssen zum Haupt-Menü zurückkehren'
        pl: 'Odpowietrzanie zostalo przerwane przez uzytkownika.należy wrócić do głównego menu'
        hu: 'A légtelenítést a felhasználó leállította.vissza kell térnie a főmenübe'

tests:
  - display_name:
      en: 'Bleeding'
      fr: 'Purge'
      es: 'Purgado'
      de: 'Entlüftung'
      pl: 'Odpowietrzenie'
      hu: 'Légtelenítés'
    max_duration_ms: 25000
