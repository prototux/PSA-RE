routine: 0x31D9
name: 'PBC_CONTROL'
display_name:
  en: 'PBC Control'
  fr: 'PBC Control'
control: ['start', 'stop', 'results']

params:
  AT_ROUTINE_CONTROL_OPTION:
    bits: '1.7-1.0'
    type: 'enum'

results:
  ROUTINE_STATUS:
    bits: '1.7-1.0'
    comment:
      en: 'Routine Status'
      fr: 'Routine Status'
    type: 'enum'
    values:
      0x00:
        en: 'Idle'
        fr: 'Idle'
      0x01:
        en: 'Started'
        fr: 'Started'
      0x02:
        en: 'Running'
        fr: 'Running'
      0x03:
        en: 'Done'
        fr: 'Done'
      0x04:
        en: 'Error'
        fr: 'Error'

tests:
  - display_name:
      en: 'PBC Control'
      fr: 'PBC Control'
    max_duration_ms: 10000
