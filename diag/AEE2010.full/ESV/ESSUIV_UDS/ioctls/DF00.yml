ioctl: 0xDF00
name: 'CONTROL_WINDSCREEN_WIPERS_LOW_SPEED'
display_name:
  en: 'Control of the windscreen wipers at low speed'
  fr: 'Pilotage de l''essuie vitre en petite vitesse'
  es: 'Pilotaje de los limpialunas en pequeña velocidad'
  de: 'Steuerung des Scheibenwischers mit niedriger Geschwindigkeit'
  pl: 'Sterowanie wycieraczką na małej prędkości'
  hu: 'Ablaktörlő vezérlése kis sebességfokozaton'
controls:
  0x00:
    en: 'Return control to the ECU'
    fr: 'Rendre la main au calculateur'
  0x03:
    en: 'Short term adjustment'
    fr: 'Ajustement temporaire'

params:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x03

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

results:
  CONTROLOPTIONRECORD:
    bits: '1.7-1.0'
    type: 'enum'

  ENTER_VOLUME_BETWEEN_0_AND_38:
    bits: '2.7-2.0'
    comment:
      en: 'Enter a volume between 0 and 38'
      fr: 'Saisir un volume sonore entre 0 et 38'
      es: 'Introducir un volumen entre 0 y 38'
      de: 'Eine Lautstärke zwischen 0 und 38 eingeben'
      pl: 'Wprowadzić poziom dźwięku między 0 i 38'
      hu: 'Adjon meg egy 0 és 38 közötti hangerőt'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the windscreen wipers at low speed'
      fr: 'Pilotage de l''essuie vitre en petite vitesse'
      es: 'Pilotaje de los limpialunas en pequeña velocidad'
      de: 'Steuerung des Scheibenwischers mit niedriger Geschwindigkeit'
      pl: 'Sterowanie wycieraczką na małej prędkości'
      hu: 'Ablaktörlő vezérlése kis sebességfokozaton'
    max_duration_ms: 2000
  - display_name:
      en: 'Control of the windscreen wipers at high speed'
      fr: 'Pilotage de l''essuie vitre en grande vitesse'
      es: 'Pilotaje de los limpialunas en gran velociad'
      de: 'Steuerung des Scheibenwischers mit hoher Geschwindigkeit'
      pl: 'Sterowanie wycieraczką na dużej prędkości'
      hu: 'Ablaktörlő vezérlése nagy sebességfokozaton'
    max_duration_ms: 2000
  - display_name:
      en: 'Placing in the maintenance position'
      fr: 'Mise en position maintenance'
      es: 'Puesta en posición de mantenimiento'
      de: 'Wartungsstellung'
      pl: 'Umieszczenie w położeniu serwisowym'
      hu: 'Karbantartási helyzetbe történő helyezés'
