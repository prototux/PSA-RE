comment:
  en: 'If the parameter measurement is at the status "ECU not configured", reinitialise the windscreen wiper motor ECUs.'
  fr: 'Si la mesure paramètre est à l''état "Calculateur non configuré", réinitialiser les calculateurs des moteurs d''essuie-vitres avant.'
  es: 'Si la medida del parámetro está en estado "Calculador no configurado", reinicializar los calculadores de los motores de limpiaparabrisas delantero.'
  de: 'Wenn die Parametermessung auf dem Zustand "Steuergerät nicht konfiguriert" ist, die Steuergeräte der Frontscheibenwischermotoren neu initialisieren.'
  pl: 'Jeżeli pomiar parametru jest w stanie "Kalkulator nie skonfigurowany", ponownie inicjować kalkulatory silników przednich wycieraczek.'
  hu: 'Ha a paraméter mérés "Nem konfigurált computer" állapotú, inicializálja újra az első ablaktörlő motorok computereit.'
kind: 'config'
access: 'read-write'
length: 1

