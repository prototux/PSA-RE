ioctl: 0x11
name: 'APPLY_ELECTRIC_PARKING_BRAKE'
display_name:
  en: 'Apply electric parking brake'
  fr: 'Serrage du Frein de Stationnement à commande Electrique'
  es: 'Apriete del Freno de Estacionamiento de mando eléctrico'
  de: 'Anziehen der elektrischen Feststellbremse'
  pl: 'Zaciskanie elektrycznego hamulca postojowego'
  hu: 'Az elektromos vezérlésű kézifék behúzása'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  ROUTINE:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x20

  ROUTINE_CALIBRATION:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x01

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x02:
        en: 'Steering wheel angle sensor calibrated'
        fr: 'Capteur angle volant calibré'
        es: 'Captador de ángulo de volante calibrado'
        de: 'Lenkradwinkelsensor kalibriert'
        pl: 'Czujnik kąta skręcenia koła kierownicy kalibrowany'
        hu: 'Kormánykerék-szögjeladó kalibrálva'
      0x04:
        en: 'Operation stopped by the operator (the report is not available)'
        fr: 'Opération arrêtée par l''opérateur (le compte-rendu n''est pas disponible)'
        es: 'Operación interrumpida por el usuario (el informe no está disponible)'
        de: 'Vorgang vom Techniker gestoppt (der Testbericht ist nicht verfügbar)'
        pl: 'Operacja zatrzymana przez operatora (sprawozdanie nie jest dostępne)'
        hu: 'A kezelő által leállított művelet (a meghibásodási jelentés nem áll rendelkezésre)'

tests:
  - display_name:
      en: 'Apply electric parking brake'
      fr: 'Serrage du Frein de Stationnement à commande Electrique'
      es: 'Apriete del Freno de Estacionamiento de mando eléctrico'
      de: 'Anziehen der elektrischen Feststellbremse'
      pl: 'Zaciskanie elektrycznego hamulca postojowego'
      hu: 'Az elektromos vezérlésű kézifék behúzása'
    max_duration_ms: 5000
  - display_name:
      en: 'Release electric parking brake'
      fr: 'Desserrage du Frein de Stationnement à commande Electrique'
      es: 'Aflojamiento del Freno de Estacionamiento de mando eléctrico'
      de: 'Lösen der elektrischen Feststellbremse'
      pl: 'Luzowanie elektrycznego hamulca postojowego'
      hu: 'Az elektromos vezérlésű kézifék kiengedése'
    max_duration_ms: 5000
