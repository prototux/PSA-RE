      hu: 'A távirányítású élesítés vonal feszültsége'
    type: 'uint'
    factor: 0.1
    units: 'V'

  TEMPERATURE_ECU:
    bits: '2.7-2.0'
    comment:
      en: 'Temperature of the ECU'
      fr: 'Température du calculateur'
      es: 'Temperatura del calculador'
      de: 'Temperatur des Steuergeräts'
      pl: 'Temperatura kalkulatora'
      hu: 'Computer hőmérséklete'
    type: 'uint'
    offset: -128
    units: '°C'

  ELECTRIC_MOTOR_TEMPERATURE:
    bits: '3.7-3.0'
