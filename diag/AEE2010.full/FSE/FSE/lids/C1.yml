      hu: 'A fokábelre kifejtett erohatás'
    type: 'uint'
    factor: 6
    units: 'N'

  FORCE_SETTING_REQUESTED_ELECTRIC_PARKING_BRAKE:
    bits: '5.7-5.0'
    comment:
      en: 'Force setting requested by the Electric parking brake'
