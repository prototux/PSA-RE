comment:
  en: 'Information from the steering wheel angle sensor and making it possible to ascertain the degree of rotation of the steering wheel.when the wheels are in the straight ahead position, the steering wheel angle value is between -5° and 5°'
  fr: 'Information provenant du capteur d''angle volant et permettant de connaître le degré de rotation du volant.lorsque les roues sont en position droite, la valeur de l''angle volant est comprise entre -5° et 5°'
  es: 'Información procedente del captador de ángulo volante y que permite conocer el grado de rotación del volante.cuando las ruedas están en posición recta, el valor del ángulo volante está comprendido entre -5° y 5°'
  de: 'Information vom Lenkradwinkelgeber über den Drehungsweg des Lenkrads.bei geradeaus gerichteten Rädern beträgt der Lenkradwinkelwert zwischen -5 ° und 5 °'
  pl: 'Informacja pochodząca od czujnika kąta kierownicy, pozwalająca sprawdzić stopień obrotu kierownicy.gdy koła ustawione są prosto, wartość kąta kierownicy zawiera się między -5° i 5°'
  hu: 'Kormánykerékszög-érzékelőtől származó információ és lehetővé teszi a kormánykerék forgási szögének ismeretét".amikor a kerekek egyenes iránynak megfelelő helyzetben állnak, a kormánykerékszög értéke -5° és 5° közötti'
