comment:
  en: 'Information from the gyrometer / accelerometer sensor.Vehicle rotational speed about its vertical axis.When stationary, the yaw speed is between -3,53°/s and 3,53°/s'
  fr: 'Information provenant du capteur gyromètre / accéléromètre.Vitesse de rotation du véhicule sur son axe vertical.A l''arrêt, la vitesse lacet est comprise entre -3,53°/s et 3,53°/s'
  es: 'Información procedente del captador girómetro / acelerómetro.Velocidad de rotación del vehículo sobre su eje vertical.En parado, la velocidad de guiñado está comprendida entre -3,53º/s y 3,53º/s'
  de: 'Information vom Drehraten-/Querbeschleunigungsgeber.Geschwindigkeit der Fahrzeugdrehung um seine Querachse.Bei Fahrzeugstillstand liegt die Giergeschwindigkeit ziwschen -3,53°/s und 3,53°/s'
  pl: 'Informacja pochodząca od czujnika kąta obrotu / przyspieszeniomierza.Predkosc obrotu pojazdu wokól osi pionowej.Na postoju, prędkość w pętli zawiera się pomiędzy -3,53°/s i 3,53°/s'
  hu: 'Girométer / gyorsulásmérő érzékelőtől származó jel.A jármű függoleges tengelye körüli elfordulási sebesség.Alló helyzetben a függoleges tengely körüli elfordulás szögsebessége -3,53 °/sec és 3,53 °/sec közötti értékű'
kind: 'live'
access: 'read'
length: 1

