node: 'CLIM_AV'
model: 'ACN_HVAC'
display_name:
  en: 'Climate control (ACN_HVAC)'
  fr: 'Climatisation (ACN_HVAC)'
protocols: ['KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'KWP-PSA2000'
    request_id: 0x76D
    response_id: 0x66D

sessions:
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'
  0xC0:
    en: 'PSA diagnostic session'
    fr: 'Session de diagnostic PSA'
  0xFA:
    en: 'Supplier specific session'
    fr: 'Session spécifique fournisseur'

services: [0x10, 0x14, 0x17, 0x21, 0x30, 0x31, 0x3E]

tester_present:
  request: '3E'
  period_ms: 1000

identification:
  request: '21 80'
  part_number: '8.7-12.0'
  comment:
    en: 'The ECU part number is in data bytes 8 to 12 of the answer to 21 80 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 8 à 12 de la réponse à 21 80 (DCB), elle donne la variante logicielle'

cars: ['B3']

variants:
  V2:
    parts: ['B000737980']
    cars: ['B3']
  V3:
    parts: ['B000737880']
    cars: ['B3']
  V4:
    parts: ['B000738080']
    cars: ['B3']
  V5:
    parts: ['B000738180']
    cars: ['B3']
