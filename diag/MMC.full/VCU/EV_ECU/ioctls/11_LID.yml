ioctl: 0x11
name: 'STOPPING_12_V_DIRECT_CURRENT'
display_name:
  en: 'Stopping of the 12 V direct current'
  fr: 'Arrêt du 12V courant continu'
  es: 'Corte de 12 V corriente continua'
  de: 'Abstellen des 12 V Gleichstrom'
  pl: 'Zatrzymanie 12 V prądu stałego'
  hu: '12V egyenáram lekapcsolása'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

  PURGE_CONTROL_9:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x01

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x04:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x11:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

  CONTROL_STATUS_3:
    bits: '2.7-2.0'
    type: 'enum'
    values:
      0x01:
        en: 'Duration of operation too long'
        fr: 'Durée de fonctionnement trop longue'
        es: 'Tiempo de funcionamiento demasiado prolongado'
        de: 'Funktionsdauer zu lang'
        pl: 'Czas działania za długi'
        hu: 'Túlságosan hosszú működési időtartam'
      0x02:
        en: 'Duration of activation of the motor too long'
        fr: 'Durée d''activation du moteur trop longue'
        es: 'Duración de la activación del motor demasiado larga'
        de: 'Aktivierungsdauer des Motors zu lang'
        pl: 'Czas aktywacji silnika za długi'
        hu: 'Motor túlságosan hosszú aktiválási időtartama'
      0x03:
        en: 'Gear selection actuator rotation reversed in relation to the reference value'
        fr: 'Rotation inversée de l''actionneur de sélection de rapport de vitesses par rapport à la consigne'
        es: 'Rotación invertida del accionador de selección de marchas con respecto a la consigna'
        de: 'Umgekehrte Drehung des Stellglieds zum Wählen des Getriebegangs im Vergleich zum Sollwert'
        pl: 'Obrót przeciwny urządzenia wykonawczego wyboru biegów w stosunku do wartości zadanej'
        hu: 'A sebességfokozat kiválasztó beavatkozószerv előírt irányhoz képest ellentétes forgása'
      0x05:
        en: 'Position not reached'
        fr: 'Position non atteinte'
        es: 'Posición no alcanzada'
        de: 'Position nicht erreicht'
        pl: 'Położenie nie osiągnięte'
        hu: 'Nem elért helyzet'
      0x10:
        en: 'Learning not carried out'
        fr: 'Apprentissage non réalisé'
        es: 'Aprendizaje no realizado'
        de: 'Anlernung nicht durchgeführt'
        pl: 'Wczytanie nie wykonane'
        hu: 'Nem végrehajtott megismertetés'
      0x11:
        en: 'Initial position of the actuator not valid'
        fr: 'Position initiale de l''actionneur invalide'
        es: 'Posición inicial del accionador no válida'
        de: 'Ausgangsposition des Stellglieds ungültig'
        pl: 'Pozycja pierwotna urządzenia wykonawczego nieważna'
        hu: 'A beavatkozószerv érvénytelen alaphelyzete'

tests:
  - display_name:
      en: 'Stopping of the 12 V direct current'
      fr: 'Arrêt du 12V courant continu'
      es: 'Corte de 12 V corriente continua'
      de: 'Abstellen des 12 V Gleichstrom'
      pl: 'Zatrzymanie 12 V prądu stałego'
      hu: '12V egyenáram lekapcsolása'
