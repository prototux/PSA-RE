lid: 0x24
name: 'LID_24'
display_name:
  en: 'Data record 0x24 (7 values)'
  fr: 'Enregistrement 0x24 (7 valeurs)'
kind: 'live'
access: 'read'
length: 10
variants: ['S3_S4_V1_6', 'S3_S4_V1_7', 'S3_S4_V1_8', 'S3_S4_V1_9', 'S3_S4_V1_10', 'S3_S4_V1_11']

params:
  COOLANT_TEMPERATURE:
    bits: '5.7-5.0'
    comment:
      en: 'Coolant temperature'
      fr: 'Température du liquide de refroidissement'
      es: 'Temperatura del líquido de refrigeración'
      de: 'Kühlmitteltemperatur'
      pl: 'Temperatury cieczy chlodzacej'
      hu: 'A hűtőfolyadék hőmérséklete'
    type: 'uint'
    offset: -40
    units: '°C'

  SPEED_ROTATION_COOLANT_PUMP:
    bits: '6.7-6.0'
    comment:
      en: 'Speed of rotation of the coolant pump'
      fr: 'Vitesse de rotation de la pompe à eau'
      es: 'Velocidad de rotación de la bomba de agua'
      de: 'Drehgeschwindigkeit der Kühlmittelpumpe'
      pl: 'Prędkość obrotowa pompy wodnej'
      hu: 'A vízpumpa forgási sebessége'
    type: 'uint'
    factor: 50
    units: 'rpm'

  TRACTION_BATTERY_BOARD_CHARGER_SIGNAL_VOLTAGE:
    bits: '7.7-7.0'
    comment:
      en: 'Traction battery on-board charger signal voltage'
      fr: 'Tension du signal du chargeur embarqué de la batterie de traction'
      es: 'Tensión de la señal del cargador integrado de la batería de tracción'
      de: 'Spannung des Signals des Bordladegerätes der Antriebsbatterie'
      pl: 'Napięcie sygnału wbudowanej ładowarki akumulatora trakcyjnego'
      hu: 'A hajtó akkumulátor fedélzeti töltő jelének feszültsége'
    type: 'uint'
    factor: 0.02
    units: 'V'

  TRACTION_BATTERY_BOARD_CHARGER_SIGNAL_STATUS:
    bits: '8.7-8.0'
    comment:
      en: 'Traction battery on-board charger signal status'
      fr: 'Etat du signal du chargeur embarqué de la batterie de traction'
      es: 'Estado de la señal del cargador integrado de la batería de tracción'
      de: 'Zustand des Signals des Bordladegerätes der Antriebsbatterie'
      pl: 'Stan sygnału wbudowanej ładowarki akumulatora trakcyjnego'
      hu: 'A hajtó akkumuláort fedélzeti töltő jelének állapota'
    type: 'enum'
    values:
      0x00:
        en: 'Not connected'
        fr: 'Non connecté'
        es: 'No conectado'
        de: 'Nicht angeschlossen'
        pl: 'Nie podłączony'
        hu: 'Nem csatlakoztatott'
      0x01:
        en: 'ON button'
        fr: 'Bouton ON'
        es: 'Botón ON'
        de: 'Taste ON'
        pl: 'Przycisk ON'
        hu: 'ON nyomógomb'
      0x02:
        en: 'OFF button'
        fr: 'Bouton OFF'
        es: 'Botón OFF'
        de: 'Taste OFF'
        pl: 'Przycisk OFF'
        hu: 'OFF nyomógomb'

  MODIFICATION_VEHICLE_CURBING_SPEED:
    bits: '10.5'
    comment:
      en: 'Modification of the vehicle curbing speed'
      fr: 'Modification de la vitesse de bridage du véhicule'
      es: 'Modificación de la limitación de velocidad del vehículo'
      de: 'Änderung der Begrenzungsgeschwindigkeit des Fahrzeugs'
      pl: 'Modyfikacja ustalonej prędkości samochodu'
      hu: 'Gépjármű sebesség határolás módosítása'
    type: 'bool'
    values:
      0x00:
        en: 'Impossible'
        fr: 'Impossible'
        es: 'Imposible'
        de: 'Unmöglich'
        pl: 'Niemożliwe'
        hu: 'Lehetetlen'
      0x01:
        en: 'Possible'
        fr: 'Possible'
        es: 'Posible'
        de: 'Möglich'
        pl: 'Możliwy'
        hu: 'Lehetséges'

  MODIFICATION_TRACTION_BATTERY_CHARGE_LIMIT:
    bits: '10.6'
    comment:
      en: 'Modification of the traction battery charge limit'
      fr: 'Modification de la limite de charge de la batterie de traction'
      es: 'Modificación del límite de carga de la batería de tracción'
      de: 'Änderung der Ladungsgrenze der Antriebsbatterie'
      pl: 'Modyfikacja limitu naładowania akumulatora trakcyjnego'
      hu: 'A hajtóakkumulátor töltési korlát módosítása'
    type: 'bool'
    values:
      0x00:
        en: 'Impossible'
        fr: 'Impossible'
        es: 'Imposible'
        de: 'Unmöglich'
        pl: 'Niemożliwe'
        hu: 'Lehetetlen'
      0x01:
        en: 'Possible'
        fr: 'Possible'
        es: 'Posible'
        de: 'Möglich'
        pl: 'Możliwy'
        hu: 'Lehetséges'

  FUNCTION_CHARGING_TRACTION_BATTERY_ALTERNATING:
    bits: '10.4'
    comment:
      en: 'Function for charging the traction battery with alternating current'
      fr: 'Fonction de charge de la batterie de traction en courant alternatif'
      es: 'Función de carga de la batería de tracción en corriente alterna'
      de: 'Ladefunktion der Antriebsbatterie mit Wechselstrom'
      pl: 'Funkcja ładowania akumulatora trakcyjnego prądem zmiennym'
      hu: 'A meghajtó akkumulátor váltakozóáramú töltése funkció'
    type: 'bool'
    values:
      0x00:
        en: 'Not equipped'
        fr: 'Pas équipé'
        es: 'No está equipado'
        de: 'Nicht ausgestattet'
        pl: 'Nie wyposażony'
        hu: 'Nincs felszerelve'
      0x01:
        en: 'Shift'
        fr: 'Equipé'
        es: 'Equipo'
        de: 'Schicht'
        pl: 'Zmiana robocza'
        hu: 'Műszak'

