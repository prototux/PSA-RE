ioctl: 0xB2
name: 'REAR_RH_WHEEL_EXHAUST_ELECTROVALVE'
display_name:
  en: 'Rear RH wheel exhaust electrovalve'
  fr: 'Electrovanne échappement de roue arrière droit'
  es: 'Electroválvula de escape de rueda trasera derecha'
  de: 'Auslass-Elektroventil des rechten Hinterrads'
  pl: 'Elektrozawór wylotowy tylnego prawego kola'
  hu: 'Jobb hátsó kerék kipuffogó elektromágnesszelep'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

results:
  CONTROL_STATUS_2:
    bits: '1.0'
    type: 'bool'
    values:
      0x01:
        en: 'Actuator jammed (disengaged)'
        fr: 'Actionneur bloqué (désengagé)'
        es: 'Accionador bloqueado (desengranado)'
        de: 'Stellglied blockiert (gelöst)'
        pl: 'Urządzenie wykonawcze zablokowane (odłączone)'
        hu: 'Blokkolt beavatkozószerv (kikapcsolt)'

tests:
  - display_name:
      en: 'Rear RH wheel exhaust electrovalve'
      fr: 'Electrovanne échappement de roue arrière droit'
      es: 'Electroválvula de escape de rueda trasera derecha'
      de: 'Auslass-Elektroventil des rechten Hinterrads'
      pl: 'Elektrozawór wylotowy tylnego prawego kola'
      hu: 'Jobb hátsó kerék kipuffogó elektromágnesszelep'
    max_duration_ms: 3000
