ioctl: 0xB6
name: 'REAR_RH_WHEEL_INLET_ELECTROVALVE'
display_name:
  en: 'Rear RH wheel inlet electrovalve'
  fr: 'Electrovanne admission de roue arrière droit'
  es: 'Electroválvula de admisión de rueda trasera derecha'
  de: 'Einlass-Elektroventil des rechten Hinterrads'
  pl: 'Elektrozawór wlotowy tylnego prawego kola'
  hu: 'Jobb hátsó kerék beszívó elektromágnesszelep'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

results:
  CONTROL_STATUS_2:
    bits: '1.0'
    type: 'bool'
    values:
      0x01:
        en: 'Actuator jammed (disengaged)'
        fr: 'Actionneur bloqué (désengagé)'
        es: 'Accionador bloqueado (desengranado)'
        de: 'Stellglied blockiert (gelöst)'
        pl: 'Urządzenie wykonawcze zablokowane (odłączone)'
        hu: 'Blokkolt beavatkozószerv (kikapcsolt)'

tests:
  - display_name:
      en: 'Rear RH wheel inlet electrovalve'
      fr: 'Electrovanne admission de roue arrière droit'
      es: 'Electroválvula de admisión de rueda trasera derecha'
      de: 'Einlass-Elektroventil des rechten Hinterrads'
      pl: 'Elektrozawór wlotowy tylnego prawego kola'
      hu: 'Jobb hátsó kerék beszívó elektromágnesszelep'
    max_duration_ms: 3000
