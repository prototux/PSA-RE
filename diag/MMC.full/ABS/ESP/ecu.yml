node: 'ABS'
model: 'ESP'
display_name:
  en: 'ABS/ESP brake control unit (ESP)'
  fr: 'Calculateur ABS/ESP (ESP)'
protocols: ['UDS', 'KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x784
    response_id: 0x785

sessions:
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'
  0x85:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x92:
    en: 'Session 0x92'
    fr: 'Session 0x92'

resets:
  0x01:
    en: 'Hard reset'
    fr: 'Réinitialisation matérielle'

