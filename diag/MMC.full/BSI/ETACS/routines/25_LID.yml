routine: 0x25
name: 'ROUTINE_25'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  CODE_CLE:
    bits: '1.7-4.0'
    type: 'enum'
    default: 0xC8207315

  ID_1:
    bits: '5.7-8.0'
    type: 'uint'

  ID_2:
    bits: '9.7-12.0'
    type: 'uint'

  ID_3:
    bits: '13.7-16.0'
    type: 'uint'

  ID_4:
    bits: '17.7-28.0'
    type: 'bytes'
    default: 0x00

results:
  INFO_SRBLID1:
    bits: '1.7-1.0'
    type: 'uint'

  INFO_SRBLID2:
    bits: '2.7-2.0'
    type: 'uint'

  INFO_SRBLID3:
    bits: '3.7-3.0'
    type: 'uint'
