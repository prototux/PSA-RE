node: 'BSI'
model: 'ETACS_SUV'
display_name:
  en: 'Body control module / main gateway (ETACS_SUV)'
  fr: 'Boitier de servitude intelligent (ETACS_SUV)'
protocols: ['UDS', 'KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x620
    response_id: 0x504

sessions:
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'
  0x85:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x89:
    en: 'Session 0x89'
    fr: 'Session 0x89'
  0x92:
    en: 'Session 0x92'
    fr: 'Session 0x92'

resets:
  0x01:
    en: 'Hard reset'
    fr: 'Réinitialisation matérielle'

services: [0x10, 0x11, 0x14, 0x17, 0x18, 0x1A, 0x21, 0x27, 0x28, 0x29, 0x30, 0x31, 0x32, 0x33, 0x3B, 0x85]

security_access:
  - level: 0x01
  - level: 0x07

identification:
  request: '1A 87'
  part_number: '11.7-18.0'
  comment:
    en: 'The ECU part number is in data bytes 11 to 18 of the answer to 1A 87 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 11 à 18 de la réponse à 1A 87 (DCB), elle donne la variante logicielle'

