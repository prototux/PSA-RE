routine: 0xA0
name: 'ROUTINE_A0'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  NAD:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x06

  REQUEST_COMMAND:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x21

  COMMAND_DETAIL:
    bits: '3.7-3.0'
    type: 'enum'
    default: 0x03

  SERVED_1:
    bits: '4.7-4.0'
    type: 'enum'
    default: 0x00

  SERVED_2:
    bits: '5.7-5.0'
    type: 'enum'
    default: 0x00

  SERVED_3:
    bits: '6.7-6.0'
    type: 'enum'
    default: 0x00

  SERVED_4:
    bits: '7.7-7.0'
    type: 'enum'
    default: 0x00

  SERVED_5:
    bits: '8.7-8.0'
    type: 'enum'
    default: 0x00

results:
  NAD:
    bits: '1.7-1.0'
    type: 'enum'

  RESPONSE_COMMAND:
    bits: '2.7-2.0'
    type: 'enum'

  COMMAND_DETAIL:
    bits: '3.7-3.0'
    type: 'enum'

  SOFTWARE_VERSION:
    bits: '4.7-4.0'
    comment:
      en: 'Software version'
      fr: 'Version du logiciel'
      es: 'Versión del programa'
      de: 'Software-Version'
      pl: 'Wersja oprogramowania'
      hu: 'Logikai verzió'
    type: 'uint'

  PART_SERIAL_NUMBER:
    bits: '5.7-7.0'
    comment:
      en: 'Part serial number'
      fr: 'Numéro de série de la pièce'
      es: 'Número de serie de la pieza'
      de: 'Seriennummer des Teils'
      pl: 'Numer seryjny elementu'
      hu: 'Alkatrész sorozatszáma'
    type: 'uint'

  PART_NUMBER:
    bits: '8.7-8.0'
    comment:
      en: 'Part number'
      fr: 'Référence pièce'
      es: 'Referencia de pieza'
      de: 'Teilenummer'
      pl: 'Referencja elementu'
      hu: 'Alkatrész cikkszáma'
    type: 'enum'
    values:
      0x00:
        en: '5855A025'
        fr: '5855A025'
      0x01:
        en: '5855A027'
        fr: '5855A027'
      0x02:
        en: '5855A030'
        fr: '5855A030'
      0x03:
        en: '5855A033'
        fr: '5855A033'
      0xFF:
        en: 'Default value'
        fr: 'Valeur par défaut'
        es: 'Valor por defecto'
        de: 'Ersatzwert'
        pl: 'Wartość domyślna'
        hu: 'Alapértelmezett érték'
