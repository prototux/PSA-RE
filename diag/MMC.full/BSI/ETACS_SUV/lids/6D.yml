lid: 0x6D
name: 'CURRENT_VIN_WRITING_STATUS'
display_name:
  en: 'Current VIN writing status'
  fr: 'État d''écriture du VIN courant'
  es: 'Estado de escritura del VIN corriente'
  de: 'Zustand Schreiben der aktuellen VIN'
  pl: 'Stan zapisu bieżącego VIN'
  hu: 'A jelenlegi alvázszám (VIN) beírásának állapota'
comment:
  en: 'The status of the parameter should be complete and locked. the current VIN corresponds to the VIN currently used on the vehicle.'
  fr: 'L''état du paramètre doit être à complet et verrouillé. le VIN courant correspond au numéro de série actuellement utilisé sur le véhicule.'
  es: 'El estado del parámetro deber ser completo y bloqueado. el VIN corriente corresponde al número de serie actualmente utilizado en el vehículo.'
  de: 'Der Zustand des Parameters muss komplett und verriegelt sein. die aktuelle VIN entspricht der gegenwärtig am Fahrzeug verwendeten Seriennummer.'
  pl: 'Stan parametru powinien byc kompletny i zablokowany. bieżący VIN odpowiada numerowi seryjnemu aktualnie używanemu przez pojazd.'
  hu: 'A paraméter állapotának teljesnek és lezártnak kell lennie. a jelenlegi alvázszám (VIN) a gépkocsin jelenleg használt sorozatszámnak felel meg.'
kind: 'live'
access: 'read'
length: 1

params:
  CURRENT_VIN_WRITING_STATUS:
    bits: '1.7-1.0'
    comment:
      en: 'Current VIN writing status'
      fr: 'État d''écriture du VIN courant'
      es: 'Estado de escritura del VIN corriente'
      de: 'Zustand Schreiben der aktuellen VIN'
      pl: 'Stan zapisu bieżącego VIN'
      hu: 'A jelenlegi alvázszám (VIN) beírásának állapota'
    type: 'enum'
    values:
      0x00:
        en: 'Complete but not carried out in time'
        fr: 'Complet mais non effectué à temps'
        es: 'Completo pero no efectuado a tiempo'
        de: 'Vollständig jedoch nicht rechtzeitig durchgeführt'
        pl: 'Kompletny ale nie wykonany na czas'
        hu: 'Komplett, de nem időben elvégzett'
      0x02:
        en: 'Writing error'
        fr: 'Erreur d''écriture'
        es: 'Error de escritura'
        de: 'Schreibfehler'
        pl: 'Błąd zapisu'
        hu: 'Beírási hiba'
      0x04:
        en: 'Complete and locked'
        fr: 'Complet et verrouillé'
        es: 'Completo y bloqueado'
        de: 'Vollständig und gesperrt'
        pl: 'Kompletny i zablokowany'
        hu: 'Komplett és reteszelt'
