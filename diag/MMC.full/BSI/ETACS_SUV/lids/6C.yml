lid: 0x6C
name: 'ORIGINAL_VIN_WRITING_STATUS'
display_name:
  en: 'Original VIN writing status'
  fr: 'État d''écriture du VIN original'
  es: 'Estado de escritura del VIN original'
  de: 'Zustand Schreiben der ursprünglichen VIN'
  pl: 'Stan zapisu oryginalnego VIN'
  hu: 'Az eredeti alvázszám (VIN) beírásának állapota'
comment:
  en: 'The status of the parameter should be complete and locked. the original VIN corresponds to the first VIN stored in the BSI.'
  fr: 'L''état du paramètre doit être à complet et verrouillé. le VIN original correspond au premier numéro de série mémorisé dans le BSI.'
  es: 'El estado del parámetro deber ser completo y bloqueado. el VIN original corresponde al primer número de serie memorizado en la BSI.'
  de: 'Der Zustand des Parameters muss komplett und verriegelt sein. die ursprüngliche VIN entspricht der ersten in der Zentralschalteinheit BSI gespeicherten Seriennummer.'
  pl: 'Stan parametru powinien byc kompletny i zablokowany. VIN oryginalny odpowiada pierwszemu numerowi seryjnemu zapamiętanemu w BSI.'
  hu: 'A paraméter állapotának teljesnek és lezártnak kell lennie. az eredeti alvázszám (VIN) az intelligens kiszolgálóegységben (BSI) memorizált első sorozatszámnak felel meg.'
kind: 'live'
access: 'read'
length: 1

params:
  ORIGINAL_VIN_WRITING_STATUS:
    bits: '1.7-1.0'
    comment:
      en: 'Original VIN writing status'
      fr: 'État d''écriture du VIN original'
      es: 'Estado de escritura del VIN original'
      de: 'Zustand Schreiben der ursprünglichen VIN'
      pl: 'Stan zapisu oryginalnego VIN'
      hu: 'Az eredeti alvázszám (VIN) beírásának állapota'
    type: 'enum'
    values:
      0x00:
        en: 'Complete but not carried out in time'
        fr: 'Complet mais non effectué à temps'
        es: 'Completo pero no efectuado a tiempo'
        de: 'Vollständig jedoch nicht rechtzeitig durchgeführt'
        pl: 'Kompletny ale nie wykonany na czas'
        hu: 'Komplett, de nem időben elvégzett'
      0x02:
        en: 'Writing error'
        fr: 'Erreur d''écriture'
        es: 'Error de escritura'
        de: 'Schreibfehler'
        pl: 'Błąd zapisu'
        hu: 'Beírási hiba'
      0x04:
        en: 'Complete and locked'
        fr: 'Complet et verrouillé'
        es: 'Completo y bloqueado'
        de: 'Vollständig und gesperrt'
        pl: 'Kompletny i zablokowany'
        hu: 'Komplett és reteszelt'
