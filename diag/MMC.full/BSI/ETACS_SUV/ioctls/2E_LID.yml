ioctl: 0x2E
name: 'IO_CONTROL_2E'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CO_STATUS:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

  CONTROL_PARAMETER:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x01

results:
  COUNTER_STATUS:
    bits: '1.7-1.0'
    type: 'enum'
