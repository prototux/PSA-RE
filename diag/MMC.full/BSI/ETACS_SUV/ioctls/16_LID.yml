ioctl: 0x16
name: 'CONTROL_REAR_FOGLAMPS'
display_name:
  en: 'Control of the rear foglamps'
  fr: 'Commande des feux de brouillard arrière'
  es: 'Mando de las luces antiniebla traseras'
  de: 'Ansteuerung der Nebelschlussleuchten'
  pl: 'Włączenie tylnych świateł przeciwmgielnych'
  hu: 'Hátsó ködlámpa vezérlés'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CO_STATUS:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

  CONTROL_PARAMETER:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x01

results:
  CO_STATUS_RESULT:
    bits: '1.0'
    type: 'bool'

  CONTROL_PARAMETER:
    bits: '2.7-2.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the rear foglamps'
      fr: 'Commande des feux de brouillard arrière'
      es: 'Mando de las luces antiniebla traseras'
      de: 'Ansteuerung der Nebelschlussleuchten'
      pl: 'Włączenie tylnych świateł przeciwmgielnych'
      hu: 'Hátsó ködlámpa vezérlés'
    max_duration_ms: 3000
