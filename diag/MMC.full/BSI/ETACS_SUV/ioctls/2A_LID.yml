ioctl: 0x2A
name: 'CONTROL_FAN'
display_name:
  en: 'Control of the fan'
  fr: 'Commande du ventilateur'
  es: 'Mando del ventilador'
  de: 'Steuerung des Lüfters'
  pl: 'Sterowanie wentylatora'
  hu: 'Ventilátor vezérlése'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CO_STATUS:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

  CONTROL_PARAMETER:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x01

results:
  COUNTER_RCS:
    bits: '1.7-1.0'
    type: 'enum'

  CONTROL_STATUS:
    bits: '2.7-2.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the fan'
      fr: 'Commande du ventilateur'
      es: 'Mando del ventilador'
      de: 'Steuerung des Lüfters'
      pl: 'Sterowanie wentylatora'
      hu: 'Ventilátor vezérlése'
    max_duration_ms: 5000
