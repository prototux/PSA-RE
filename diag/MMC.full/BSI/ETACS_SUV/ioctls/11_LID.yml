ioctl: 0x11
name: 'CHECK_DIPPED_LIGHTS'
display_name:
  en: 'Check on dipped lights'
  fr: 'Commande des feux de croisement'
  es: 'Mando de las luces de cruce'
  de: 'Steuerung Abblendlicht'
  pl: 'Sterowanie świateł mijania'
  hu: 'Tompított világítás kapcsoló'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CO_STATUS:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

  CONTROL_PARAMETER:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x01

results:
  CO_STATUS_RESULT:
    bits: '1.0'
    type: 'bool'

  CONTROL_PARAMETER:
    bits: '2.7-2.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Check on dipped lights'
      fr: 'Commande des feux de croisement'
      es: 'Mando de las luces de cruce'
      de: 'Steuerung Abblendlicht'
      pl: 'Sterowanie świateł mijania'
      hu: 'Tompított világítás kapcsoló'
    max_duration_ms: 3000
