ioctl: 0x12
name: 'HEADLAMP_HEIGHT_ADJUSTER_CONTROL'
display_name:
  en: 'Headlamp height adjuster control'
  fr: 'Commande correcteur de site'
  es: 'Mando corrector de altura'
  de: 'Ansteuerung Leuchtweitenkorrektor'
  pl: 'Sterowanie korektora kąta nachylenia'
  hu: 'Fényszórómagasság szabályozás vezérlése'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CO_STATUS:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

  CONTROL_PARAMETER:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x01

results:
  CO_STATUS_RESULT:
    bits: '1.0'
    type: 'bool'

  CONTROL_PARAMETER:
    bits: '2.7-2.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Headlamp height adjuster control'
      fr: 'Commande correcteur de site'
      es: 'Mando corrector de altura'
      de: 'Ansteuerung Leuchtweitenkorrektor'
      pl: 'Sterowanie korektora kąta nachylenia'
      hu: 'Fényszórómagasság szabályozás vezérlése'
    max_duration_ms: 3000
