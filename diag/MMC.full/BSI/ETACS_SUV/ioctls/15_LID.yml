ioctl: 0x15
name: 'CONTROL_FRONT_FOGLAMPS'
display_name:
  en: 'Control of the front foglamps'
  fr: 'Commande des feux de brouillard avant'
  es: 'Mando de antinieblas delanteros'
  de: 'Ansteuerung Nebelscheinwerfer'
  pl: 'Włączanie przednich świateł przeciwmgielnych'
  hu: 'Az első ködlámpák vezérlése'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CO_STATUS:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

  CONTROL_PARAMETER:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x01

results:
  COUNTER_RCS:
    bits: '1.7-1.0'
    type: 'enum'

  CONTROL_PARAMETER:
    bits: '2.7-2.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the front foglamps'
      fr: 'Commande des feux de brouillard avant'
      es: 'Mando de antinieblas delanteros'
      de: 'Ansteuerung Nebelscheinwerfer'
      pl: 'Włączanie przednich świateł przeciwmgielnych'
      hu: 'Az első ködlámpák vezérlése'
    max_duration_ms: 3000
