ioctl: 0x2F
name: 'FAN_ASSEMBLY_CONTROL'
display_name:
  en: 'Fan assembly control'
  fr: 'Commande du groupe motoventilateur'
  es: 'Mando del grupo moto ventilador'
  de: 'Ansteuerung der Kühlerventilatorgruppe'
  pl: 'Sterowanie zespolu wentylatora chlodnicy'
  hu: 'A motor ventillátor csoport kapcsolója'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CO_STATUS:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

  CONTROL_PARAMETER:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x01

results:
  COUNTER_RCS:
    bits: '1.7-1.0'
    type: 'enum'

  CONTROL_STATUS:
    bits: '2.7-2.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Fan assembly control'
      fr: 'Commande du groupe motoventilateur'
      es: 'Mando del grupo moto ventilador'
      de: 'Ansteuerung der Kühlerventilatorgruppe'
      pl: 'Sterowanie zespolu wentylatora chlodnicy'
      hu: 'A motor ventillátor csoport kapcsolója'
    max_duration_ms: 5000
