ioctl: 0x17
name: 'RIGHT_HAND_DIRECTION_INDICATORS_CONTROL'
display_name:
  en: 'Right-hand direction indicators control'
  fr: 'Commande des feux indicateurs de direction droit'
  es: 'Mando de las luces indicadoras de dirección derechas'
  de: 'Ansteuerung der Fahrtrichtungsanzeiger rechts'
  pl: 'Sterowanie prawych kierunkowskazów'
  hu: 'Jobb irányjelző lámpák kapcsolója'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CO_STATUS:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

  CONTROL_PARAMETER:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x01

results:
  COUNTER_RCS:
    bits: '1.7-1.0'
    type: 'enum'

  CONTROL_STATUS:
    bits: '2.7-2.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Right-hand direction indicators control'
      fr: 'Commande des feux indicateurs de direction droit'
      es: 'Mando de las luces indicadoras de dirección derechas'
      de: 'Ansteuerung der Fahrtrichtungsanzeiger rechts'
      pl: 'Sterowanie prawych kierunkowskazów'
      hu: 'Jobb irányjelző lámpák kapcsolója'
    max_duration_ms: 3000
