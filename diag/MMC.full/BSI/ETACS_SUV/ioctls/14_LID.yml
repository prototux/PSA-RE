ioctl: 0x14
name: 'CONTROL_REAR_SIDELAMPS'
display_name:
  en: 'Control of the rear sidelamps'
  fr: 'Commande des feux de position arrière'
  es: 'Mando de las luces de posición traseras'
  de: 'Steuerung des Standlichts hinten'
  pl: 'Wysterowanie tylnych świateł pozycyjnych'
  hu: 'Hátsó helyzetjelzők utasítás'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CO_STATUS:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

  CONTROL_PARAMETER:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0x01

results:
  CO_STATUS_RESULT:
    bits: '1.0'
    type: 'bool'

  CONTROL_PARAMETER:
    bits: '2.7-2.0'
    type: 'enum'

tests:
  - display_name:
      en: 'Control of the rear sidelamps'
      fr: 'Commande des feux de position arrière'
      es: 'Mando de las luces de posición traseras'
      de: 'Steuerung des Standlichts hinten'
      pl: 'Wysterowanie tylnych świateł pozycyjnych'
      hu: 'Hátsó helyzetjelzők utasítás'
    max_duration_ms: 3000
