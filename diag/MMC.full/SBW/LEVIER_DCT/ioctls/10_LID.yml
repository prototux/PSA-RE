ioctl: 0x10
name: 'IO_CONTROL_10'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CO_STATUS:
    bits: '1.7-1.0'
    type: 'uint'
    default: 0x07

  SETPOINT:
    bits: '2.7-2.0'
    type: 'uint'
    default: 0x00

results:
  COUNTER_STATUS:
    bits: '1.7-1.0'
    type: 'uint'

  SETPOINT:
    bits: '2.7-2.0'
    type: 'uint'
