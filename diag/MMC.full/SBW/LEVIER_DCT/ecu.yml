node: 'SBW'
model: 'LEVIER_DCT'
display_name:
  en: 'Shift-by-wire gear selector (LEVIER_DCT)'
  fr: 'Selecteur de vitesses electrique (LEVIER_DCT)'
protocols: ['KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'KWP-PSA2000'
    request_id: 0x788
    response_id: 0x789

sessions:
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'
  0x85:
    en: 'Programming session'
    fr: 'Session de programmation'
  0x89:
    en: 'Session 0x89'
    fr: 'Session 0x89'
  0x90:
    en: 'Session 0x90'
    fr: 'Session 0x90'
  0x92:
    en: 'Session 0x92'
    fr: 'Session 0x92'

services: [0x10, 0x17, 0x18, 0x1A, 0x21, 0x27, 0x30, 0x33]

security_access:
  - level: 0x01

identification:
  request: '1A 87'
  part_number: '11.7-18.0'
  comment:
    en: 'The ECU part number is in data bytes 11 to 18 of the answer to 1A 87 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 11 à 18 de la réponse à 1A 87 (DCB), elle donne la variante logicielle'

cars: ['I3']

variants:
  LEVIER_I3_I4_V1:
    parts: ['3131313131313131']
    cars: ['I3']
  LEVIER_I3_I4_V2:
    parts: ['3836333141343937']
    cars: ['I3']
