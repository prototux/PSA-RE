node: 'STT'
model: 'STT_MMC'
display_name:
  en: 'Stop and start controller (STT_MMC)'
  fr: 'Calculateur stop and start (STT_MMC)'
protocols: ['UDS', 'KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x758
    response_id: 0x759

sessions:
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'
  0x92:
    en: 'Session 0x92'
    fr: 'Session 0x92'

resets:
  0x01:
    en: 'Hard reset'
    fr: 'Réinitialisation matérielle'

services: [0x10, 0x11, 0x14, 0x17, 0x18, 0x1A, 0x21, 0x27, 0x28, 0x29, 0x30, 0x31, 0x32, 0x33, 0x3B, 0x3E, 0x85]

security_access:
  - level: 0x01
  - level: 0x03
  - level: 0x07

tester_present:
  request: '3E'
  period_ms: 1000

identification:
  request: '1A 87'
  part_number: '11.7-18.0'
  comment:
    en: 'The ECU part number is in data bytes 11 to 18 of the answer to 1A 87 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 11 à 18 de la réponse à 1A 87 (DCB), elle donne la variante logicielle'

cars: ['J3']

variants:
  J3_J4_1:
    parts: ['3136343041303134']
    cars: ['J3']
  J3_J4_2:
    parts: ['3136343041303230']
    cars: ['J3']
  J3_J4_3:
    parts: ['3136343041303335']
    cars: ['J3']
  J3_J4_4:
    parts: ['3136343041303430']
    cars: ['J3']
