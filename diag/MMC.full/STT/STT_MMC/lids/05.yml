      de: 'Versetzung in Standby des Verbrennungsmotors durch das Steuergerät Stop and Start'
      pl: 'Przełączenie na tryb czuwania silnika cieplnego przez kalkulator stop and start'
      hu: 'A belsőégésű motor készenléti állapotba helyezése a stop and start computer által'
    type: 'bool'
    values:
      0x00:
        en: 'NO'
        fr: 'NON'
        es: 'NO'
        de: 'NEIN'
        pl: 'NIE'
        hu: 'NEM/NINCS'
      0x01:
        en: 'YES'
        fr: 'OUI'
        es: 'SI'
        de: 'JA'
        pl: 'TAK'
        hu: 'IGEN'
