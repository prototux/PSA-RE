      de: 'Zustand der Funktion « STOP & START »'
      pl: 'Stan funkcji "Stop and Start'
      hu: 'A "Stop and Start" funkció állapota'
    type: 'bool'
    values:
      0x00:
        en: 'Activated'
        fr: 'Activé'
        es: 'Activado'
        de: 'Aktiviert'
        pl: 'Aktywny'
        hu: 'Aktív'
      0x01:
        en: 'Deactivated by the stop and start switch'
        fr: 'Désactivée par le commutateur stop and start'
        es: 'Desactivada por el conmutador stop and start'
        de: 'Vom Schalter Stop and Start deaktiviert'
        pl: 'Wyłączone przez przełącznik stop and start'
