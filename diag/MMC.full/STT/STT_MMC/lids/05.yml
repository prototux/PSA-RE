      hu: 'ASG" visszajelzés állapota a kombinált kijelzőegységnél'
    type: 'bool'
    values:
      0x00:
        en: 'Not lit'
        fr: 'Éteint'
        es: 'Apagada'
        de: 'Aus'
        pl: 'Zgaszony'
        hu: 'Nem világít'
      0x01:
        en: 'Lit'
        fr: 'Allumé'
        es: 'Encendida'
        de: 'Leuchtet'
        pl: 'Świecący'
        hu: 'Kigyulladva'

  STATUS_STOP_AND_START_FUNCTION:
    bits: '1.6'
    comment:
      en: 'Status of the "Stop and Start" function'
      fr: 'Etat de la fonction Stop and Start'
