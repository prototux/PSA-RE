lid: 0x06
name: 'TIME_ELAPSED_SINCE_FIRST_START_UP_INTERNAL'
display_name:
  en: 'Time elapsed since the first start-up of the internal combustion engine'
  fr: 'Temps écoulé depuis le premier démarrage du moteur thermique'
  es: 'Tiempo transcurrido desde el primer arranque del motor térmico'
  de: 'Verstrichene Zeit seit dem ersten Anlassen des Verbrennungsmotors'
  pl: 'Czas jaki upłynął od momentu pierwszego rozruchu silnika spalinowego'
  hu: 'A belsőégésű motor első elindítása óta eltelt idő.'
comment:
  en: 'After the key or the starting switch has been used to start the internal combustion engine, the stop and start ECU begins a countdown of 30 seconds.When the stop and start ECU reaches zero, "0 seconds" should remain displayed.The "stop and start" function is inhibited for as long as the value is other than 0.'
  fr: 'Après avoir utilisé la clé ou le commutateur de démarrage pour faire démarrer le moteur thermique, le calculateur stop and start entame un compte à rebours de 30 secondes.Quand le calculateur stop and start arrive à zéro, "0 secondes" doit rester affiché.La fonction "stop and start" est inhibée tant que la valeur est différente de 0.'
  es: 'Después de haber utilizado la llave o el conmutador de arranque para arrancar el motor térmico, el calculador de stop and start empieza una cuenta atrás de 30 segundos.Cuando el calculador de stop and start llega a cero, "0 segundos" debe permanecer indicado.La función "stop and start" está inhibida cuando el valor es distinto a 0.'
  de: 'Nach Verwendung des Schlüssels oder des Anlassschalters zum Anlassen des Verbrennungsmotors beginnt das Steuergerät Stop and Start einen Countdown von 30 Sekunden.Wenn das Steuergerät Stop and Start auf Null ankommt, muss "0 Sekunden" angezeigt bleiben.Die Funktion "Stop and Start" ist unterbunden, solange der Wert abweichend von 0 ist.'
  pl: 'Po użyciu kluczyka lub włącznika zapłonu w celu uruchomienia silnika cieplnego, kalkulator stop and start rozpoczyna odliczanie do tyłu 30 sekund.Gdy kalkulator stop and start dojdzie do zera, "0 sekund" musi pozostać wyświetlone.Funkcja "stop and start" jest wyłączona póki wartość jest różna 0.'
  hu: 'Miután a belsőégésű motor elindításához használta a kulcsot vagy az indításkapcsolót a stop and start computer egy 30 másodperces visszaszámlálást kezdeményez.Amikor a stop and start computer nullába megy "0 másodperc"-nek kell maradnia kijelezve.A "stop and start" funkció le van tiltva amikor az érték 0-tól eltérő.'
kind: 'live'
access: 'read'
length: 1

