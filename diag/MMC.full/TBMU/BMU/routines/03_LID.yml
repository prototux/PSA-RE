routine: 0x03
name: 'ROUTINE_03'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
variants: ['B9_V1']
control: ['start', 'results']

results:
  RESULT:
    bits: '1.7-1.0'
    type: 'uint'

  RESULT_BYTE_4:
    bits: '2.7-2.0'
    type: 'uint'

  RESULT_BYTE_5:
    bits: '3.7-3.0'
    type: 'uint'

  RESULT_BYTE_6:
    bits: '4.7-4.0'
    type: 'uint'
