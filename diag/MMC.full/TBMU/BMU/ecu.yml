node: 'TBMU'
model: 'BMU'
display_name:
  en: 'Traction battery management (BMU)'
  fr: 'Gestion de la batterie de traction (BMU)'
protocols: ['UDS', 'KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x761
    response_id: 0x762

sessions:
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'
  0x89:
    en: 'Session 0x89'
    fr: 'Session 0x89'
  0x92:
    en: 'Session 0x92'
    fr: 'Session 0x92'

resets:
  0x01:
    en: 'Hard reset'
    fr: 'Réinitialisation matérielle'

services: [0x10, 0x11, 0x14, 0x17, 0x18, 0x1A, 0x21, 0x27, 0x28, 0x29, 0x30, 0x31, 0x33, 0x3B, 0x85]

security_access:
  - level: 0x01

identification:
  request: '1A 9C'
  part_number: '4.7-5.0'
  comment:
    en: 'The ECU part number is in data bytes 4 to 5 of the answer to 1A 9C (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 4 à 5 de la réponse à 1A 9C (DCB), elle donne la variante logicielle'

cars: ['B9', 'S3']

variants:
  B9_V1:
    parts: ['0003']
    cars: ['B9']
  S3_S4_V1:
    parts: ['0001']
    cars: ['S3']
  S3_S4_V2:
    parts: ['0002']
    cars: ['S3']
  S3_S4_V3:
    parts: ['0004']
    cars: ['S3']
