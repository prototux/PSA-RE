lid: 0x11
name: 'LID_11'
display_name:
  en: 'Data record 0x11 (3 values)'
  fr: 'Enregistrement 0x11 (3 valeurs)'
kind: 'config'
access: 'read-write'
length: 12

params:
  NUMBER_MONTHS_ELAPSED_SINCE_MANUFACTURE_VEHICLE:
    bits: '1.7-4.0'
    comment:
      en: 'Number of months elapsed since the manufacture of the vehicle'
      fr: 'Nombre de mois écoulés depuis la fabrication du véhicule'
      es: 'Número de meses transcurridos desde la fabricación del vehículo'
      de: 'Anzahl der seit der Herstellung des Fahrzeugs verstrichenen Monaten'
      pl: 'Liczba miesięcy, które upłynęły od daty produkcji pojazdu'
      hu: 'A gépjármű gyártása óta eltelt hónapok száma'
    type: 'uint'
    factor: 2.3e-05
    units: 'month'

  CURRENT_ACCUMULATED_DURING_NORMAL_CHARGING_SINCE:
    bits: '5.7-8.0'
    comment:
      en: 'Current accumulated during normal charging since the manufacture of the vehicle'
      fr: 'Courant cumulé en charge normale depuis la fabrication du véhicule'
      es: 'Corriente acumulada en carga normal desde la fabricación del vehículo'
      de: 'Kumulierter Strom bei Normladung seit der Herstellung des Fahrzeugs'
      pl: 'Prąd skumulowany podczas ładowania normalnego od wyprodukowania pojazdu'
      hu: 'A gépjármű gyártása óta normál töltéssel betöltött Ah'
    type: 'uint'
    factor: 0.001
    units: 'Ah'

  CURRENT_ACCUMULATED_DURING_RAPID_CHARGING_SINCE:
    bits: '9.7-12.0'
    comment:
      en: 'Current accumulated during rapid charging since the manufacture of the vehicle'
      fr: 'Courant cumulé en charge rapide depuis la fabrication du véhicule'
      es: 'Corriente acumulada en carga rápida desde la fabricación del vehículo'
      de: 'Kumulierter Strom bei Schnellladung seit der Herstellung des Fahrzeugs'
      pl: 'Prąd skumulowany podczas ładowania szybkiego od wyprodukowania pojazdu'
      hu: 'A gépjármű gyártása óta gyors töltéssel betöltött Ah'
    type: 'uint'
    factor: 0.001
    units: 'Ah'

alternatives:
  - note:
      en: 'Layout seen on 4 other software variant(s)'
      fr: 'Format vu sur 4 autre(s) variante(s) logicielle(s)'
    variants: ['B9_V1', 'S3_*']
    access: 'read'
    length: 12
    params:
      DATA_ADAPTIVE:
        bits: '1.7-12.0'
        type: 'bytes'
  - note:
      en: 'Layout seen on 3 other software variant(s)'
      fr: 'Format vu sur 3 autre(s) variante(s) logicielle(s)'
    variants: ['S3_*']
    access: 'read'
    length: 28
    params:
      DATA_ADAPTIVE_VARC:
        bits: '1.7-28.0'
        type: 'bytes'
