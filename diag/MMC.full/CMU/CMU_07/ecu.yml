node: 'CMU'
model: 'CMU_07'
display_name:
  en: 'Traction battery cell monitoring units (CMU_07)'
  fr: 'Modules de surveillance des cellules de la batterie de traction (CMU_07)'
protocols: ['KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'KWP-PSA2000'
    request_id: 0x67E
    response_id: 0x67F

sessions:
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'
  0x92:
    en: 'Session 0x92'
    fr: 'Session 0x92'
  0xC0:
    en: 'PSA diagnostic session'
    fr: 'Session de diagnostic PSA'

services: [0x10, 0x14, 0x1A, 0x21, 0x31]

identification:
  request: '1A 87'
  part_number: '11.7-18.0'
  comment:
    en: 'The ECU part number is in data bytes 11 to 18 of the answer to 1A 87 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 11 à 18 de la réponse à 1A 87 (DCB), elle donne la variante logicielle'

cars: ['B9', 'S3']

variants:
  B9_V1:
    parts: ['3934393943373630']
    cars: ['B9']
  S3_S4_V1:
    parts: ['3934393941373934']
    cars: ['S3']
