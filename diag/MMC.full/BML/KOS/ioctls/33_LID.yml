ioctl: 0x33
name: 'EXTERIOR_AIR'
display_name:
  en: 'Exterior air'
  fr: 'Air extérieur'
  es: 'Aire exterior'
  de: 'Außenluft'
  pl: 'Powietrze z zewnątrz'
  hu: 'Külső levegő'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

  CONTROL_PARAMETER_3:
    bits: '2.7-2.0'
    type: 'enum'

results:
