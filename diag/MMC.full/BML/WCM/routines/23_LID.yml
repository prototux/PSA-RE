routine: 0x23
name: 'ROUTINE_23'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  PIN:
    bits: '1.7-4.0'
    type: 'uint'

results:
  ROUTINE_ENTRY_STATUS1_TRANSPONDER:
    bits: '1.7-1.0'
    type: 'uint'

  ROUTINE_ENTRY_STATUS2_NUMBER_OF_LEARNT:
    bits: '2.7-2.0'
    type: 'uint'

  ROUTINE_ENTRY_STATUS3_LAST_ERROR_CODE:
    bits: '3.7-3.0'
    type: 'uint'
