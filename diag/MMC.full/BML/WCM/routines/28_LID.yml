routine: 0x28
name: 'ROUTINE_28'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start']

params:
  PROGRAMMING_EQUIPMENT:
    bits: '1.7-1.0'
    type: 'uint'

  PIN:
    bits: '2.7-5.0'
    type: 'uint'

results:
  ROUTINE_ENTRY_STATUS1_CLEAR_NUMBER_OF:
    bits: '1.7-1.0'
    type: 'uint'

  ROUTINE_ENTRY_STATUS2_LAST_ERROR_CODE:
    bits: '2.7-2.0'
    type: 'uint'
