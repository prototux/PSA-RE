ioctl: 0x11
name: 'CONTROL_4_WHEEL_DRIVE_LOCKED_MODE'
display_name:
  en: 'Control of the 4 wheel drive locked mode'
  fr: 'Commande du mode 4 roues motrices verrouillées'
  es: 'Mando del modo 4 rueds motrices bloqueadas'
  de: 'Steuerung des Modus Sperre 4 Rad-Antrieb'
  pl: 'Sterowanie trybu 4 zblokowanych kół jezdnych napędzających'
  hu: '4 reteszelt meghajtott kerék üzemmód vezérlése'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

  CONTROL_PARAMETER_1:
    bits: '2.7-2.0'
    type: 'enum'

results:
  COUNTER_RCS:
    bits: '1.7-1.0'
    type: 'uint'

  CONTROL_STATUS:
    bits: '2.7-2.0'
    type: 'uint'

tests:
  - display_name:
      en: 'Control of the 4 wheel drive locked mode'
      fr: 'Commande du mode 4 roues motrices verrouillées'
      es: 'Mando del modo 4 rueds motrices bloqueadas'
      de: 'Steuerung des Modus Sperre 4 Rad-Antrieb'
      pl: 'Sterowanie trybu 4 zblokowanych kół jezdnych napędzających'
      hu: '4 reteszelt meghajtott kerék üzemmód vezérlése'
    max_duration_ms: 30000
  - display_name:
      en: 'Control of the 4 wheel drive mode'
      fr: 'Commande du mode 4 roues motrices'
      es: 'Mando del modo 4 ruedas motrices'
      de: 'Steuerung des Modus 4 Rad-Antrieb'
      pl: 'Sterowanie trybu 4 kół jezdnych napędzających'
      hu: '4 meghajtott kerék üzemmód vezérlése'
    max_duration_ms: 30000
  - display_name:
      en: 'Control of the 2 wheel drive mode'
      fr: 'Commande du mode 2 roues motrices'
      es: 'Mando del modo 2 ruedas motrices'
      de: 'Steuerung des Modus 2 Rad-Antrieb'
      pl: 'Sterowanie trybu 2 kół jezdnych napędzających'
      hu: '2 meghajtott kerék üzemmód vezérlése'
    max_duration_ms: 30000
