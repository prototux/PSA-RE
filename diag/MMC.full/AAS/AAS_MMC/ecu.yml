node: 'AAS'
model: 'AAS_MMC'
display_name:
  en: 'Parking sensors (AAS_MMC)'
  fr: 'Aide au stationnement (AAS_MMC)'
protocols: ['UDS', 'KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x763
    response_id: 0x764

sessions:
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'
  0x89:
    en: 'Session 0x89'
    fr: 'Session 0x89'
  0x92:
    en: 'Session 0x92'
    fr: 'Session 0x92'

resets:
  0x01:
    en: 'Hard reset'
    fr: 'Réinitialisation matérielle'

services: [0x10, 0x11, 0x14, 0x18, 0x1A, 0x21, 0x27, 0x28, 0x29, 0x33, 0x3B, 0x85]

security_access:
  - level: 0x07

identification:
  request: '1A 87'
  part_number: '11.7-18.0'
  comment:
    en: 'The ECU part number is in data bytes 11 to 18 of the answer to 1A 87 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 11 à 18 de la réponse à 1A 87 (DCB), elle donne la variante logicielle'

cars: ['I3', 'J3']

variants:
  AAS_I3_I4_V1:
    parts: ['3836333841303335']
    cars: ['I3']
  AAS_I3_I4_V2:
    parts: ['3836333841303432']
    cars: ['I3']
  AAS_I3_I4_V3:
    parts: ['3836333841303433']
    cars: ['I3']
  AAS_J3_J4_V1:
    parts: ['3836333841303335']
    cars: ['J3']
  AAS_J3_J4_V2:
    parts: ['3836333841303338']
    cars: ['J3']
  AAS_J3_J4_V3:
    parts: ['3836333841303438']
    cars: ['J3']
