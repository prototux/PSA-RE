lid: 0x80
name: 'IDENTIFICATION'
display_name:
  en: 'ECU identification (part numbers, versions)'
  fr: 'Identification du calculateur (références, versions)'
kind: 'identification'
access: 'read'
length: 32

params:
  SYSTEM_TIME:
    bits: '1.7-3.0'
    type: 'uint'
    factor: 5

  COMP_COUNT:
    bits: '4.7-6.0'
    type: 'uint'

  RR_FAULT_COUNT:
    bits: '7.7-8.0'
    type: 'uint'

  PTC1_COUNT:
    bits: '9.7-10.0'
    type: 'uint'

  PTC2_COUNT:
    bits: '11.7-12.0'
    type: 'uint'

  PTC3_COUNT:
    bits: '13.7-14.0'
    type: 'uint'

  DURATION_USE_AIR_RECIRCULATION_SYSTEM:
    bits: '15.7-17.0'
    comment:
      en: 'Duration of use of the air recirculation system'
      fr: 'Temps d''utilisation du système de recyclage d''air'
      es: 'Tiempo de utilización del sistema de reciclaje del aire'
      de: 'Einsatzzeit des Luftumwälzungssystems'
      pl: 'Czas użycia systemu recyrkulacji powietrza'
      hu: 'Levegőkeringető rendszer felhasználási időtartama'
    type: 'uint'
    factor: 0.67
    units: 's'

  DURATION_USE_AIR_MIXING_SYSTEM:
    bits: '18.7-20.0'
    comment:
      en: 'Duration of use of the air mixing system'
      fr: 'Temps d''utilisation du système de mixage d''air'
      es: 'Tiempo de utilización del sistema de mezcla de aire'
      de: 'Einsatzzeit des Luftmischsystems'
      pl: 'Czas użycia systemu mieszania powietrza'
      hu: 'Levegőkeverő rendszer felhasználási időtartama'
    type: 'uint'
    factor: 0.067
    units: 'min'

  DURATION_USE_AIR_DISTRIBUTION_SYSTEM:
    bits: '21.7-24.0'
    comment:
      en: 'Duration of use of the air distribution system'
      fr: 'Temps d''utilisation du système de répartition d''air'
      es: 'Tiempo de utilización del sistema de reparto del aire'
      de: 'Einsatzzeit des Luftverteilungssystems'
      pl: 'Czas użycia systemu rozprowadzania powietrza'
      hu: 'Levegőelosztó rendszer felhasználási időtartama'
    type: 'uint'
    factor: 0.067
    units: 's'

  DURATION_USE_AIR_HEATING_SYSTEM:
    bits: '25.7-26.0'
    comment:
      en: 'Duration of use of the air heating system'
      fr: 'Temps d''utilisation du système de chauffage d''air'
      es: 'Tiempo de utilización del sistema de calentamiento de aire'
      de: 'Einsatzzeit des Luftheizungssystems'
      pl: 'Czas użycia systemu ogrzewania powietrza'
      hu: 'Levegőmelegítő rendszer felhasználási időtartama'
    type: 'uint'
    units: 'min'

  DURATION_USE_AIR_CONDITIONING_SYSTEM:
    bits: '27.7-28.0'
    comment:
      en: 'Duration of use of the air conditioning system'
      fr: 'Temps d''utilisation du système d''air conditionné'
      es: 'Tiempo de utilización del sistema de aire acondicionado'
      de: 'Einsatzzeit des Klimaanlagensystems'
      pl: 'Czas użycia systemu klimatyzacji'
      hu: 'Légkondicionáló rendszer felhasználási időtartama'
    type: 'uint'
    units: 'min'

  HOT_AMB_TIME:
    bits: '29.7-30.0'
    type: 'uint'
    factor: 5

  COLD_AMB_TIME:
    bits: '31.7-32.0'
    type: 'uint'
    factor: 5
