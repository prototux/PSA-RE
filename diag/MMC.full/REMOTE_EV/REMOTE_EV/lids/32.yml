      hu: 'Vezérlési típus a hajtóakkumulátor töltés megkezdéséhez'
    type: 'enum'
    values:
      0x00:
        en: 'Without action on the air conditioning and traction battery charging remote control'
        fr: 'Sans action sur la télécommande de climatisation et de recharge batterie de traction'
