      0x01:
        en: 'With action on the air conditioning and traction battery charging remote control (immediate charging)'
        fr: 'Avec action sur la télécommande de climatisation et de recharge batterie de traction (recharge immédiate)'
        es: 'Con acción en el mando a distancia de climatización y de recarga de la batería de tracción (recarga inmediata)'
        de: 'Mit Aktion auf der Fernbedienung Klimaanlage und Ladung Antriebsbatterie (sofortiges Laden)'
        pl: 'Z działaniem na zdalne sterowanie klimatyzacji i ładowania akumulatora trakcyjnego (ładowanie natychmiastowe)'
        hu: 'Hajtóakkumulátor töltés és klíma távirányító működtetésével (azonnali töltés)'
      0x03:
        en: 'With action on the air conditioning and traction battery charging remote control (charging with deferred start)'
        fr: 'Avec action sur la télécommande de climatisation et de recharge batterie de traction (recharge avec départ différé)'
        es: 'Con acción en el mando a distancia de climatización y de recarga de la batería de tracción (recarga con salida diferida)'
        de: 'Mit Aktion auf der Fernbedienung Klimaanlage und Ladung Antriebsbatterie (Laden mit verzögertem Start)'
        pl: 'Z działaniem na zdalne sterowanie klimatyzacji i ładowania akumulatora trakcyjnego (ładowanie z rozpoczęciem zróżnicowanym)'
        hu: 'Hajtóakkumulátor töltés és klíma távirányító működtetésével (töltés késleltetett indítással)'

  TYPE_COMMAND_START_TIMER_BEFORE_CHARGING:
    bits: '2.3-2.2'
