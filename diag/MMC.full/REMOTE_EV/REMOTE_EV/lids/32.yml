    type: 'enum'
    values:
      0x00:
        en: 'Without timer (immediate start)'
        fr: 'Sans minuteur (départ immédiat)'
        es: 'Sin temnporizador (salida inmediata)'
        de: 'Ohne Zeitschaltung (sofortiger Start)'
        pl: 'Bez nastawnika czasowego (rozpoczęcie natychmiastowe)'
        hu: 'Időzítő nélkül (azonnali indítás)'
      0x01:
