display_name:
  en: 'Data record 0x32 (11 values)'
  fr: 'Enregistrement 0x32 (11 valeurs)'
kind: 'live'
access: 'read'
length: 6

params:
  STATUS_AIR_CONDITIONING_AND_TRACTION_BATTERY:
    bits: '1.0'
    comment:
      en: 'Status of the air conditioning and traction battery charging remote control'
      fr: 'Etat de la télécommande de climatisation et de recharge batterie de traction'
      es: 'Estado del mando a distancia de climatización y de recarga de la batería de tracción.'
      de: 'Zustand der Fernbedienungen Klimaanlage und Ladung Antriebsbatterie'
      pl: 'Stan zdalnego sterowania klimatyzacji i ładowania akumulatora trakcyjnego'
      hu: 'Hajtóakkumulátor töltés és a klimatizálás távirányító állapota'
    type: 'bool'
    values:
      0x00:
        en: 'Remote control not recorded'
        fr: 'Télécommande non enregistrée'
        es: 'Mando a distancia no registrado'
        de: 'Fernbedienung nicht aufgezeichnet'
        pl: 'Zdalne sterowanie nie zarejestrowane'
        hu: 'Nem regisztrált távirányító'
      0x01:
        en: 'Remote control recorded'
        fr: 'Télécommande enregistrée'
        es: 'Mando a distancia registrado'
        de: 'Fernbedienung aufgezeichnet'
        pl: 'Zdalne sterowanie zarejestrowane'
        hu: 'Regisztrált távirányító'

  TYPE_STATUS_RECEIVED_AIR_CONDITIONING_AND:
    bits: '1.4-1.1'
    comment:
      en: 'Type of status received by the air conditioning and traction battery charging remote control'
      fr: 'Type d''état reçu par la télécommande de climatisation et de recharge batterie de traction'
      es: 'Tipo de estado recibido por el mando a distancia de climatización y recarga de la batería de tracción'
      de: 'Von der Fernbedienung Klimaanlage und Ladung Antriebsbatterie erhaltene Zustandsart'
      pl: 'Typ stanu odebranego przez pilota zdalnego sterowania klimatyzacji i ładowania akumulatora trakcyjnego'
      hu: 'A klíma és hajtóakkumulátor töltő távirányító által vételezett állapot típusa.'
    type: 'enum'
    values:
      0x01:
        en: 'Vehicle connected to the air conditioning and traction battery charging remote control'
        fr: 'Véhicule connecté à la télécommande de climatisation et de recharge batterie de traction'
        es: 'Vehículo conectado al mando a distancia de la climatización y de recarga de la batería de tracción'
        de: 'Fahrzeug an der Fernbedienung Klimaanlage und Ladung Antriebsbatterie angeschlossen'
        pl: 'Pojazd podłączony do pilota zdalnego sterowania klimatyzacji i ładowania akumulatora trakcyjnego'
        hu: 'Gépjármű a hajtóakkumulátor töltő és klíma távirányítóhoz csatlakoztatva'
      0x02:
        en: 'Vehicle on programmed charge'
        fr: 'Véhicule en charge programmée'
        es: 'Vehículo en carga programada'
        de: 'Fahrzeug beim programmierten Laden'
        pl: 'Pojazd w trybie ładowania zaprogramowanego'
        hu: 'Gépjármű programozott töltésben'
      0x03:
        en: 'Vehicle on manual charge'
        fr: 'Véhicule en charge manuelle'
        es: 'Vehículo en carga manual'
        de: 'Fahrzeug beim manuellen Laden'
        pl: 'Pojazd w trybie ładowania ręcznego'
        hu: 'Gépjármű kézi töltésben'
      0x04:
        en: 'Remote air conditioning operating or stopped'
        fr: 'Climatisation à distance en fonctionnement ou arrêtée'
        es: 'Climatización a distancia en funcionamiento o parada'
        de: 'Klimaanlagen-Fernbedienung in Betrieb oder abgestellt'
        pl: 'Klimatyzacja sterowana zdalnie działa lub jest zatrzymana'
        hu: 'Távolról vezérelt klíma működés közben vagy leállítva'

  TYPE_COMMAND_START_CHARGING_TRACTION_BATTERY:
    bits: '2.1-2.0'
    comment:
      en: 'Type of command to start charging of the traction battery'
      fr: 'Type de commande pour débuter la recharge de la batterie de traction'
      es: 'Tipo de mando para iniciar la recarga de la batería de tracción'
      de: 'Art der Betätigung, um das Laden der Antriebsbatterie zu beginnen'
