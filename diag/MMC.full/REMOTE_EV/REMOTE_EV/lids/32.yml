        pl: 'Z nastawnikiem czasowym, rozpoczęcie natychmiastowe'
        hu: 'Azonnal indítás időzítővel'
      0x03:
        en: 'With immediate start timer (command confirmed)'
        fr: 'Avec minuteur départ immédiat (commande confirmée)'
        es: 'Con temporizador salida inmediata (mando confirmado)'
        de: 'Mit Zeitschaltung sofortiger Start (Ansteuerung bestätigt)'
