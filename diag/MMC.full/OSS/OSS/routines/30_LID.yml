routine: 0x30
name: 'FORCING_IGNITION_OFF_MODE'
display_name:
  en: 'Forcing of the "ignition off" mode'
  fr: 'Forçage du mode "contact coupé'
  es: 'Forzado del modo "contacto cortado'
  de: 'Erzwingung des Modus "Zündung ausgeschaltet'
  pl: 'Wymuszenie trybu "wyłączonego zapłonu'
  hu: 'Lekapcsolt gyújtás" üzemmód kényszerítése'
comment:
  en: 'KWP2000 routine by local identifier: 31 <id> starts it, 32 <id> stops it, 33 <id> reads the results'
  fr: 'Routine KWP2000 par identifiant local : 31 <id> la démarre, 32 <id> l''arrête, 33 <id> lit les résultats'
control: ['start', 'stop', 'results']

params:
  RESERVED:
    bits: '2.7-2.0'
    unused: true

results:
  STATE_EXECUTION:
    bits: '1.7-1.0'
    type: 'uint'

  RESERVED:
    bits: '2.7-2.0'
    unused: true

tests:
  - display_name:
      en: 'Forcing of the "ignition off" mode'
      fr: 'Forçage du mode "contact coupé'
      es: 'Forzado del modo "contacto cortado'
      de: 'Erzwingung des Modus "Zündung ausgeschaltet'
      pl: 'Wymuszenie trybu "wyłączonego zapłonu'
      hu: 'Lekapcsolt gyújtás" üzemmód kényszerítése'
    max_duration_ms: 10000
  - display_name:
      en: 'Forcing of the "accessories positive" mode'
      fr: 'Forçage du mode "plus accessoire'
      es: 'Forzado del modo "positivo accesorios'
      de: 'Erzwingung des Modus "Zubehörplus'
      pl: 'Wymuszenie trybu "plusa akcesoriów'
      hu: 'A "segédberendezések plusz" üzemmód kényszerítése'
    max_duration_ms: 10000
  - display_name:
      en: 'Forcing of the "ignition positive" mode'
      fr: 'Forçage du mode "plus après contact'
      es: 'Forzado del modo "positivo después de contacto'
      de: 'Erzwingung des Modus "Zündungsplus'
      pl: 'Wymuszenie trybu "plusa po włączeniu zapłonu'
      hu: 'Gyújtás utáni plusz" üzemmód kényszerítése'
    max_duration_ms: 10000
  - display_name:
      en: 'Forcing of the "starting" mode'
      fr: 'Forçage du mode "démarrage'
      es: 'Forzado del modo "arranque'
      de: 'Erzwingung des Modus "Anlassen'
      pl: 'Wymuszenie trybu "rozruchu'
      hu: 'Indítás" üzemmód kényszerítése'
    max_duration_ms: 10000
