ioctl: 0x21
name: 'ACCESSORIES_POSITIVE_POSITION_INDICATOR_LAMP'
display_name:
  en: 'Accessories positive position indicator lamp'
  fr: 'Témoin position du plus accessoire'
  es: 'Testigo posición del positivo accesorios'
  de: 'Kontrollleuchte Position des Zubehörplus'
  pl: 'Lampka kontrolna położenia plusa akcesoriów'
  hu: 'Segédberendezések plusz helyzet visszajelzés'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

  RESERVED:
    bits: '2.7-2.0'
    unused: true

  CONTROL_PARAMETER_1:
    bits: '3.7-3.0'
    type: 'enum'

  CONTROL_PARAMETER_2:
    bits: '4.7-4.0'
    type: 'uint'
    default: 0x64

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x01:
        en: 'Control in progress'
        fr: 'Pilotage en cours'
        es: 'Pilotaje en curso'
        de: 'Steuerung läuft'
        pl: 'Sterowanie w trakcie'
        hu: 'Vezérlés folyamatban'
      0x02:
        en: 'Operation done OK'
        fr: 'Pilotage terminé OK'
        es: 'Pilotaje terminado OK'
        de: 'Ansteuerung beendet OK'
        pl: 'Sterowanie zakonczone OK'
        hu: 'Vezérlés rendben befejezodött OK'
      0x03:
        en: 'Control completed : problem'
        fr: 'Pilotage terminé : problème'
        es: 'Pilotaje finalizado : problema'
        de: 'Suche abgeschlossen : Problem'
        pl: 'Sterowanie zakończone : problem'
        hu: 'Kezelés befejezve : probléma'
      0x04:
        en: 'Control stopped'
        fr: 'Pilotage arrêté'
        es: 'Pilotaje parado'
        de: 'Suche abgebrochen'
        pl: 'Sterowanie wstrzymane'
        hu: 'Kezelés megszakítva'

tests:
  - display_name:
      en: 'Accessories positive position indicator lamp'
      fr: 'Témoin position du plus accessoire'
      es: 'Testigo posición del positivo accesorios'
      de: 'Kontrollleuchte Position des Zubehörplus'
      pl: 'Lampka kontrolna położenia plusa akcesoriów'
      hu: 'Segédberendezések plusz helyzet visszajelzés'
    max_duration_ms: 1000
  - display_name:
      en: 'Ignition positive position indicator lamp'
      fr: 'Témoin position du plus après contact'
      es: 'Testigo posición del positivo después del contacto'
      de: 'Kontrollleuchte Position des Zündungsplus'
      pl: 'Lampka kontrolna położenia plusa po włączeniu zapłonu'
      hu: 'Gyújtás utáni plusz helyzet visszajelzés'
    max_duration_ms: 1000
  - display_name:
      en: 'Backlighting of the engine starting switch.'
      fr: 'Rétroéclairage du commutateur démarrage moteur.'
      es: 'Retroiluminación del conmutador de arranque del motor.'
      de: 'Hinterleuchtung des Motoranlassschalters.'
      pl: 'Podświetlenie włącznika rozruchu silnika.'
      hu: 'Motor indításkapcsoló háttérvilágítás.'
    max_duration_ms: 1000
