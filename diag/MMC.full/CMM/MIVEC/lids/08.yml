lid: 0x08
name: 'LID_08'
display_name:
  en: 'Data record 0x08 (3 values)'
  fr: 'Enregistrement 0x08 (3 valeurs)'
kind: 'live'
access: 'read'
length: 4

params:
  RETARD_IGNITION_ADVANCE_REMOVE_KNOCK:
    bits: '2.7-2.0'
    comment:
      en: 'Retard of the ignition advance to remove knock.'
      fr: 'Réduction de l''avance à l''allumage pour supprimer le cliquetis.'
      es: 'Reducción del avance del encendido para suprimir el picado.'
      de: 'Verringerung der Zündvorverstellung, um das Klopfen zu beseitigen.'
      pl: 'Zmniejszenie wyprzedzenia zaplonu w celu zlikwidowania spalania stukowego.'
      hu: 'A kopogás megszüntetése érdekében az elogyújtás csökkentése.'
    type: 'uint'
    factor: 0.351562
    units: '° camshaft'

  RETARD_IGNITION_ADVANCE_REMOVE_KNOCK_PROGRAMMED:
    bits: '3.7-3.0'
    comment:
      en: 'Retard of the ignition advance to remove knock (programmed value).'
      fr: 'Réduction de l''avance à l''allumage pour supprimer le cliquetis (valeur apprise).'
      es: 'Reducción del avance del encendido para suprimir el picado (valor aprendido).'
      de: 'Verringerung der Zündvorverstellung, um das Klopfen zu beseitigen (eingespeicherter Wert).'
      pl: 'Zmniejszenie wyprzedzenia zaplonu w celu zlikwidowania spalania stukowego (wartosc wyuczona).'
      hu: 'A kopogás megszüntetése érdekében az elogyújtás csökkentése (megtanult érték).'
    type: 'uint'
    factor: 0.392156
    units: '%'

  REFERENCE_VALUE_NUMBER_STEPS_STEPPER_MOTOR:
    bits: '4.7-4.0'
    comment:
      en: 'Reference value (in number of steps) of the stepper motor of the electric exhaust gas recycling valve (EGR).'
      fr: 'Consigne (en nombre de pas) du moteur pas à pas de la vanne électrique de recyclage des gaz d''échappement (EGR).'
      es: 'Consigna (en numero de paso) del motor paso a paso de la válvula de reciclaje de los gases de escape (EGR).'
      de: 'Sollwert (in Anzahl der Schritte) des Schrittmotors des elektrischen Abgasrückführungsventils.'
      pl: 'Wartość zadana (w liczbie kroków) silnika krokowego zaworu elektrycznego recyrkulacji spalin (EGR).'
      hu: 'Kipufogógáz-visszavezetés (EGR) elektromos szelep léptetőmotor előírt értéke (lépések számában).'
    type: 'uint'
