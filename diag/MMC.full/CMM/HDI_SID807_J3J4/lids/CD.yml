lid: 0xCD
name: 'LID_CD'
display_name:
  en: 'Data record 0xCD (10 values)'
  fr: 'Enregistrement 0xCD (10 valeurs)'
kind: 'live'
access: 'read'
length: 12

params:
  ENGINE_SPEED:
    bits: '1.7-2.0'
    comment:
      en: 'Engine speed'
      fr: 'Régime moteur'
      es: 'Régimen motor'
      de: 'Motordrehzahl'
      pl: 'Prędkość obrotowa silnika'
      hu: 'Motor fordulatszám'
    type: 'uint'
    units: 'rpm'

  VEHICLE_SPEED:
    bits: '3.7-3.0'
    comment:
      en: 'Vehicle speed'
      fr: 'Vitesse du véhicule'
      es: 'Velocidad vehículo'
      de: 'Geschwindigkeit des Fahrzeugs'
      pl: 'Prędkość pojazdu'
      hu: 'Jármű sebessége'
    type: 'uint'
    units: 'km/h'

  COOLANT_TEMPERATURE:
    bits: '4.7-4.0'
    comment:
      en: 'Coolant temperature'
      fr: 'Température d''eau'
      es: 'Temperatura del agua'
      de: 'Kühlmitteltemperatur'
      pl: 'Temperatura płynu chłodzącego'
      hu: 'Hűtofolyadék-homérséklet'
    type: 'uint'
    offset: -50
    units: '°C'

  FAN_UNIT_SPEED_SETTING:
    bits: '5.7-5.0'
    comment:
      en: 'Fan unit speed setting'
      fr: 'Consigne vitesse Groupe moto-ventilateur'
      es: 'Consigna velocidad Grupo moto-ventilador'
      de: 'Sollgeschwindigkeit Kühlerventilatorgruppe'
      pl: 'Wartosc zadana obrotów zespolu wentylatora chlodnicy'
      hu: 'Motor ventillátor csoport sebesség utasítás'
    type: 'uint'
    units: '%'

  FAN_ASSEMBLY_SPEED:
    bits: '6.7-6.0'
    comment:
      en: 'Fan assembly speed'
      fr: 'Vitesse du groupe motoventilateur'
      es: 'Velocidad del grupo motoventilador'
      de: 'Geschwindigkeit Kühlerventilatorgruppe'
      pl: 'Obroty wentylatora chłodnicy'
      hu: 'A hűtőventilátor-csoport sebessége'
    type: 'uint'
    units: '%'

  COOLING_FAN_RELAY_CONTROL:
    bits: '7.7-7.0'
    comment:
      en: 'Cooling fan relay control'
      fr: 'Commande relais groupe motoventilateur'
      es: 'Mando relé grupo motoventilador'
      de: 'Betätigung Relais Kühlerventilatorgruppe'
      pl: 'Sterowanie przekaznika zespolu wentylatora chlodnicy'
      hu: 'Hűtőventilátor-relé vezérlése'
    type: 'enum'
    values:
      0x00:
        en: 'No ventilation or fan assembly at low speed'
        fr: 'Pas de ventilation ou groupe motoventilateur en petite vitesse'
        es: 'Ausencia de ventilación o grupo motoventilador a velocidad reducida'
        de: 'Keine Lüftung der Kühlerventilatorgruppe auf kleiner Geschwindigkeit'
        pl: 'Brak wentylacji lub zespołu wentylatora chłodnicy na małej prędkości'
        hu: 'Nincs szellőzés vagy motorventilátoregység kis sebességfokozaton'
      0x01:
        en: 'Fast Speed'
        fr: 'Grande Vitesse'
        es: 'Gran Velocidad'
        de: 'Große Geschwindigkeit'
        pl: 'Duża prędkość'
        hu: 'Nagy Sebességű'

  AIR_CONDITIONING_REQUEST_STATUS:
    bits: '9.0'
    comment:
      en: 'Air conditioning request status'
      fr: 'État demande climatisation'
      es: 'Estado petición climatización'
      de: 'Zustand Einschaltung Klimaanlage'
      pl: 'Stan żądania klimatyzacji'
      hu: 'Klimatizálás kérés állapota'
    type: 'bool'
    values:
      0x00:
        en: 'Not required'
        fr: 'Non demandé'
        es: 'No solicitado'
        de: 'Nicht gefordert'
        pl: 'Nie żądany'
        hu: 'Nem kért'
      0x01:
        en: 'Demand'
        fr: 'Demande'
        es: 'Petición'
        de: 'Befehl'
        pl: 'Zadanie'
        hu: 'Igény'

  AIR_CONDITIONING_AUTHORISATION_ORIGINATING:
    bits: '9.1'
    comment:
      en: 'Air conditioning authorisation originating from the engine ECU'
      fr: 'Autorisation de climatisation provenant du calculateur moteur'
      es: 'Autorización de climatización proveniente del calculador motor'
      de: 'Freigabe der Klimaanlage durch das Motor-Steuergerät'
      pl: 'Zezwolenie dla klimatyzacji od kalkulatora silnika'
      hu: 'A befecskendezés-computertől származó klímaberendezés-engedélyezés'
    type: 'bool'
    values:
      0x00:
        en: 'Authorised'
        fr: 'Autorisé'
        es: 'Autorizado'
        de: 'Freigegeben'
        pl: 'Dopuszczony'
        hu: 'Engedélyezett'
      0x01:
        en: 'Not authorised'
        fr: 'Non autorisé'
        es: 'No autorizado'
        de: 'Nicht freigegeben'
        pl: 'Nie dopuszczony'
        hu: 'Nem engedélyezett'

  AIR_CONDITIONING_CIRCUIT_PRESSURE:
    bits: '10.7-11.0'
    comment:
      en: 'Air conditioning circuit pressure'
      fr: 'Pression du circuit de climatisation'
      es: 'Presión del circuito de climatización'
      de: 'Kältemitteldruck der Klimaanlage'
      pl: 'Ciśnienie obwodu klimatyzacji'
      hu: 'Klímakör nyomása'
    type: 'uint'
    factor: 0.1
    units: 'bar'

  OIL_PRESSURE_SWITCH_STATUS:
    bits: '12.7-12.0'
    comment:
      en: 'Oil pressure switch status'
      fr: 'Etat du manocontact de pression d''huile'
      es: 'Estado manocontacto presión de aceite'
      de: 'Zustand Öldruckschalter'
      pl: 'Stan czujnika cisnienia oleju'
      hu: 'Olajnyomás nyomáskapcsoló állapota'
    type: 'enum'
    values:
      0x00:
        en: 'OK'
        fr: 'OK'
        es: 'OK'
        de: 'OK'
        pl: 'OK'
        hu: 'Rendben'
      0x01:
        en: 'No pressure'
        fr: 'Pas de pression'
        es: 'Ausencia de presión'
        de: 'Kein Druck'
        pl: 'Brak ciśnienia'
        hu: 'Nincs nyomás'
