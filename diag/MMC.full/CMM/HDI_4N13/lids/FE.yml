lid: 0xFE
name: 'SUPPLIER_IDENTIFICATION'
display_name:
  en: 'Supplier identification'
  fr: 'Identification fournisseur'
kind: 'identification'
access: 'read'
length: 4

params:
  DURATION_LAST_PARTICLE_FILTER_REGENERATION:
    bits: '1.7-1.0'
    comment:
      en: 'Duration of the last particle filter regeneration'
      fr: 'Durée de la dernière régénération du filtre à particules'
      es: 'Duración de la última regeneración del filtro de partículas'
      de: 'Dauer der letzten Regenerierung des Partikelfilters'
      pl: 'Czas trwania ostatniej regeneracji filtra cząstek stałych'
      hu: 'A részecskeszűrő utolsó regenerálásának időtartama'
    type: 'uint'
    units: 'min'

  DURATION_PARTICLE_FILTER_REGENERATION_BEFORE:
    bits: '2.7-2.0'
    comment:
      en: 'Duration of the particle filter regeneration before last'
      fr: 'Durée de l''avant dernière régénération du filtre à particules'
      es: 'Duración de la penúltima regeneración del filtro de partículas'
      de: 'Dauer der vorletzten Regenerierung des Partikelfilters'
      pl: 'Czas trwania przedostatniej regeneracji filtra cząstek stałych'
      hu: 'A részecskeszűrő utolsó regenerálása előtti időtartam'
    type: 'uint'
    units: 'min'

  AVERAGE_SPEED_VEHICLE_DURING_LAST_PARTICLE:
    bits: '3.7-3.0'
    comment:
      en: 'Average speed of the vehicle during the last particle filter regeneration'
      fr: 'Vitesse moyenne du véhicule durant la dernière régénération du filtre à particules'
      es: 'Velocidad media del vehículo durante la última regeneración del filtro de partículas'
      de: 'Durchschnittsgeschwindigkeit des Fahrzeugs während der letzten Regenerierung des Partikelfilters'
      pl: 'Średnia prędkość pojazdu podczas ostatniej regeneracji filtra cząstek stałych'
      hu: 'A gépjármű átlagos sebessége a részecskeszűrő utolsó regenerálása során'
    type: 'uint'
    units: 'km/h'

  AVERAGE_SPEED_VEHICLE_DURING_PARTICLE_FILTER:
    bits: '4.7-4.0'
    comment:
      en: 'Average speed of the vehicle during the particle filter regeneration before last'
      fr: 'Vitesse moyenne du véhicule durant l''avant dernière régénération du filtre à particules'
      es: 'Velocidad media del vehículo durante la penúltima regeneración del filtro de partículas'
      de: 'Durchschnittsgeschwindigkeit des Fahrzeugs während der vorletzten Regenerierung des Partikelfilters'
      pl: 'Średnia prędkość pojazdu podczas przedostatniej regeneracji filtra cząstek stałych'
      hu: 'A gépjármű átlagos sebessége a részecskeszűrő utolsó regenerálása előtti időtartam alatt'
    type: 'uint'
    units: 'km/h'
