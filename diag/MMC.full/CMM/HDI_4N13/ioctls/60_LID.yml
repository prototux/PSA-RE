ioctl: 0x60
name: 'IO_CONTROL_60'
comment:
  en: 'KWP2000 input/output control by local identifier (30 <id> <control parameters>)'
  fr: 'Pilotage d''entrée/sortie KWP2000 par identifiant local (30 <id> <paramètres de pilotage>)'

params:
  CONTROL_PARAMETER:
    bits: '1.7-1.0'
    type: 'enum'
    default: 0x07

  DATA:
    bits: '2.7-2.0'
    type: 'enum'
    default: 0xFF

results:
  ACTUATOR_TEST:
    bits: '1.7-1.0'
    comment:
      en: 'Actuator test'
      fr: 'Test Actionneur'
      es: 'Test Accionador'
      de: 'Stellgliedtest'
      pl: 'Test elementu wykonawczego'
      hu: 'Beavatkozószerv teszt'
    type: 'enum'
    values:
      0x02:
        en: 'Steering wheel angle sensor calibrated'
        fr: 'Capteur angle volant calibré'
        es: 'Captador de ángulo de volante calibrado'
        de: 'Lenkradwinkelsensor kalibriert'
        pl: 'Czujnik kąta skręcenia koła kierownicy kalibrowany'
        hu: 'Kormánykerék-szögjeladó kalibrálva'
      0x03:
        en: 'Steering wheel angle sensor calibration has ended but an error occurred.three cases arise A fault linked to the steering wheel angle sensor has been notified by the ECU.Deal with this fault first and start the steering wheel angle calibration again. The user started to calibrate the steering wheel angle without complying with the given recommendations.restart the calibration taking care to observe these recommendations. The user started to calibrate the steering wheel angle although the vehicle was not stationary. Start the steering wheel calibration again, ensuring that the vehicle is stationary.'
        fr: 'La calibration du capteur angle volant est terminée mais un problème est survenu.trois cas se présentent Un défaut lié au capteur angle volant a été remonté par le calculateur.Traitez ce défaut en priorité et relancez la calibration de l''angle volant. L''utilisateur a lancé la calibration de l''angle volant sans respecter les préconisations prescrites.relancez la calibration en veillant à respecter ces préconisations. L''utilisateur a lancé la calibration angle volant alors que le véhicule n''était pas à l''arrêt. Relancez la calibration de l''angle volant en veillant à ce que le véhicule soit à l''arrêt.'
        es: 'La calibración del captador ángulo volante está terminada pero un problema ha surgido.se presentan tres casos Un defecto unido al captador ángulo volante ha sido identificado por el calculador.Tratar este defecto con prioridad y lanzar de nuevo la calibración del ángulo volante. El usuario ha lanzado la calibración del ángulo volante sin respetar las preconizaciones prescritas.vuelva a lanzar la calibración cuidando el respeto de estas recomendaciones. El usuario ha lanzado la calibración del ángulo volante mientras el vehículo no estaba parado. Volver a lanzar la calibración del ángulo volante teniendo cuidado de que el vehículo esté parado.'
        de: 'Die Kalibrierung des Lenkradwinkelsensors ist beendet aber ein Problem ist aufgetreten.drei Fälle sind möglich Ein Fehler in Verbindung mit dem Lenkradwinkelsensor wurde vom Steuergerät gemeldet.Bearbeiten Sie diese Fehler vorrangig und starten Sie die Kalibrierung des Lenkradwinkels erneut. Der Benutzer hat die Kalibrierung des Lenkradwinkels gestartet, ohne die beschriebenen Vorsichtsmaßnahmen zu beachten.starten Sie die Kalibrierung erneut unter Beachtung dieser Vorgaben. Der Benutzer hat die Kalibrierung des Lenkradwinkels gestartet, obwohl das Fahrzeug nicht still stand. Die Kalibrierung des Lenkradwinkels starten und darauf achten, dass das Fahrzeug still steht.'
        pl: 'Kalibracja czujnika kata polozenia kierownicy wykonana lecz wystapil problem.wystąpiły trzy przypadki Kalkulator zasygnalizowal usterke zwiazana z czujnikiem kata polozenia kierownicy.Zajac sie ta usterka w pierwszej kolejnosci i ponownie rozpoczac kalibracje czujnika kata polozenia kierownicy. Uzytkownik rozpoczal kalibracje czujnika kata polozenia kierownicy nie przestrzegajac opisanych zalecen.uruchomic kalibrację przestrzegając zaleceń. Uzytkownik rozpoczal kalibracje czujnika kata polozenia kierownicy kiedy pojazd nie byl na postoju. Rozpoczac od nowa kalibracje czujnika kata polozenia kierownicy zwracajac uwage, aby pojazd byl na postoju.'
        hu: 'A kormánykerék szögelfordulás érzékelo kalibrálása befejezodött, de egy probléma lépett fel.három eset lehetséges A kormánykerék szögelfordulás érzékelohöz kapcsolódó hiba lépett fel a számítóegységen keresztül.Kezelje kiemleten ezt a hibát és indítsa újra a kormánykerék szögelfordulás kalibrálást. A felhasználó úgy indította el a kormánykerék szögelfordulás kalibrálást, hogy nem volt tekintettel az eloírt ajánlásokra.indítsa újra a kalibrálását, vigyázva az előírások betartására nélkül indította el a hosszirányú gyorsulásérzékelő kalibrálását. A felhasználó úgy indította el a kormánykerék szögelfordulás kalibrálást, hogy a jármű nem volt leállítva. Indítsa újra a kormánykerék szögelfordulás kalibrálást ügyelve arra, hogy a jármű leállított állapotban legyen.'
      0x04:
        en: 'Operation stopped by the operator (the report is not available)'
        fr: 'Opération arrêtée par l''opérateur (le compte-rendu n''est pas disponible)'
        es: 'Operación interrumpida por el usuario (el informe no está disponible)'
        de: 'Vorgang vom Techniker gestoppt (der Testbericht ist nicht verfügbar)'
        pl: 'Operacja zatrzymana przez operatora (sprawozdanie nie jest dostępne)'
        hu: 'A kezelő által leállított művelet (a meghibásodási jelentés nem áll rendelkezésre)'
