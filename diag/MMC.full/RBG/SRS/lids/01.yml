lid: 0x01
name: 'TIME_ELAPSED_SINCE_FIRST_FAULT_APPEARED'
display_name:
  en: 'Time elapsed since first fault appeared'
  fr: 'Temps écoulé depuis l''apparition du premier défaut'
  es: 'Tiempo transcurrido desde la aparición del primer defecto'
  de: 'Seit Auftreten des ersten Fehlers vergangene Zeit'
  pl: 'Czas jaki upłynął od pojawienia się pierwszej usterki'
  hu: 'Az elso hiba megjelenése óta eltelt ido'
comment:
  en: 'Makes it possible to ascertain the time elapsed since the first fault occurred. This counter resets to zero when the last fault disappears'
  fr: 'Permet de connaître le temps écoulé depuis l''apparition du premier défaut. Ce compteur se remet à zéro lors de la disparition du dernier défaut'
  es: 'Permite conocer el tiempo transcurrido desde la aparición del primer defecto. Este contador de pone a cero cuando desaparece el último defecto'
  de: 'Gibt die seit dem Auftreten des ersten Fehlers vergangene Zeit an. Dieser Zähler wird bei Erlöschen des letzten Fehlers auf Null zurückgestellt'
  pl: 'Pozwala znać czas który upłynął od pojawienia się pierwszej usterki. Te licznik zeruje się w czasie zniknięcia ostatniej usterki'
  hu: 'Lehetővé teszi az első hiba megjelenése óta eltelt idő megismerését. Ezen számláló nullázódik az utolsó hiba megszünésekor'
kind: 'live'
access: 'read'
length: 2

params:
  TIME_ELAPSED_SINCE_FIRST_FAULT_APPEARED:
    bits: '1.7-2.0'
    comment:
      en: 'Time elapsed since first fault appeared'
      fr: 'Temps écoulé depuis l''apparition du premier défaut'
      es: 'Tiempo transcurrido desde la aparición del primer defecto'
      de: 'Seit Auftreten des ersten Fehlers vergangene Zeit'
      pl: 'Czas jaki upłynął od pojawienia się pierwszej usterki'
      hu: 'Az elso hiba megjelenése óta eltelt ido'
    type: 'uint'
    units: 'min'
