node: 'OBC'
model: 'OBC_DCDC'
display_name:
  en: 'On-board charger / DC-DC (OBC_DCDC)'
  fr: 'Chargeur embarque / convertisseur (OBC_DCDC)'
protocols: ['UDS', 'KWP-PSA2000']

addressing:
  - transport: 'can-tp'
    bus: 'HS.IS'
    protocol: 'UDS'
    request_id: 0x765
    response_id: 0x766

sessions:
  0x81:
    en: 'Default session / end of diagnostic'
    fr: 'Session par défaut / fin de diagnostic'
  0x89:
    en: 'Session 0x89'
    fr: 'Session 0x89'
  0x92:
    en: 'Session 0x92'
    fr: 'Session 0x92'

resets:
  0x01:
    en: 'Hard reset'
    fr: 'Réinitialisation matérielle'

services: [0x10, 0x11, 0x14, 0x17, 0x18, 0x1A, 0x21, 0x27, 0x28, 0x29, 0x30, 0x31, 0x33, 0x3B, 0x85]

security_access:
  - level: 0x01
  - level: 0x03
  - level: 0x07

identification:
  request: '1A 87'
  part_number: '11.7-18.0'
  comment:
    en: 'The ECU part number is in data bytes 11 to 18 of the answer to 1A 87 (BCD), it gives the software variant'
    fr: 'La référence du calculateur est dans les octets de données 11 à 18 de la réponse à 1A 87 (DCB), elle donne la variante logicielle'

cars: ['B9', 'S3']

variants:
  B9_V1:
    parts: ['3934393944313935']
    cars: ['B9']
  B9_V2:
    parts: ['3934383141303039']
    cars: ['B9']
  S3_S4_DEGRAD:
    parts: ['3333333333333333']
    cars: ['S3']
  S3_S4_V1:
    parts: ['3934393944343432']
    cars: ['S3']
  S3_S4_V2:
    parts: ['3934383141313031']
    cars: ['S3']
