lid: 0x03
name: 'LID_03'
display_name:
  en: 'Data record 0x03 (14 values)'
  fr: 'Enregistrement 0x03 (14 valeurs)'
kind: 'other'
access: 'read'
length: 13
variants: ['S3_*']

params:
  REQUEST_ACTIVATION_DIRECT_VOLTAGE_TRANSFORMER:
    bits: '1.0'
    comment:
      en: 'Request for activation of the direct voltage transformer by the electric vehicle ECU'
      fr: 'Demande d''activation du convertisseur de tension continue par le calculateur véhicule électrique'
      es: 'Solicitud de activación del convertidor de tensión continua por el calculador del vehículo eléctrico'
      de: 'Anforderung Aktivierung des Gleichspannungswandlers durch das Steuergerät Elektrofahrzeug'
      pl: 'Żądanie włączenia przetwornicy napięcia stałego przez kalkulator samochodu elektrycznego'
      hu: 'Egyenfeszültség átalakító aktiválásának kérése az elektromos gépjármű computer által'
    type: 'uint'
    values:
      0x00:
        en: 'NO'
        fr: 'NON'
        es: 'NO'
        de: 'NEIN'
        pl: 'NIE'
        hu: 'NEM/NINCS'
      0x01:
        en: 'YES'
        fr: 'OUI'
        es: 'SI'
        de: 'JA'
        pl: 'TAK'
        hu: 'IGEN'

  ACTIVATION_STATUS_DIRECT_VOLTAGE_TRANSFORMER:
    bits: '1.1'
    comment:
      en: 'Activation status of the direct voltage transformer following the request by the electric vehicle ECU'
      fr: 'Etat d''activation du convertisseur de tension continue suite à la demande par le calculateur véhicule électrique'
      es: 'Estado de activación del convertidor de tensión continua después de una solicitud del calculador vehículo eléctrico'
      de: 'Aktivierungszustand des Gleichspannungswandlers nach der Anforderung durch das Steuergerät Elektrofahrzeug'
      pl: 'Stan włączenia przetwornicy napięcia stałego na skutek żądania przez kalkulator samochodu elektrycznego'
      hu: 'Egyenfeszültség átalakító aktiválási állapota az elektromos gépjármű computere általi kérést követően'
    type: 'uint'
    values:
      0x00:
        en: 'OFF'
        fr: 'OFF'
        es: 'OFF'
        de: 'OFF'
        pl: 'OFF - WYL'
        hu: 'OFF'
      0x01:
        en: 'ON'
        fr: 'ON'

  DETECTION_FAILURE_DIRECT_VOLTAGE_TRANSFORMER:
    bits: '1.3'
    comment:
      en: 'Detection of failure of the direct voltage transformer'
      fr: 'Détection de panne du convertisseur de tension continue'
      es: 'Detección de defecto del convertidor de tensión continua'
      de: 'Erkennung Panne des Gleichspannungswandlers'
      pl: 'Wykrycie defektu przetwornicy napięcia stałego'
      hu: 'Egyenfeszültség átalakító meghibásodásának észlelése'
    type: 'uint'
    values:
      0x00:
        en: 'Normal'
        fr: 'Normal'
        es: 'Normal'
        de: 'Normal'
        pl: 'Normalny'
        hu: 'Norm l'
      0x01:
        en: 'Failure detected'
        fr: 'Panne détectée'
        es: 'Avería detectada'
        de: 'Störung erkannt'
        pl: 'Defekt wykryty'
        hu: 'Észlelt meghibásodás'

