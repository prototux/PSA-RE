[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dbmuxev"
version = "0.2.0"
description = "Load, query, decode/encode and edit DBMUXEv (PSA networks) repositories"
readme = "tools/README.md"
license = { file = "LICENCE" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
schema = ["jsonschema>=4.0"]

[project.scripts]
dbmuxev = "dbmuxev.__main__:main"

[tool.setuptools]
packages = ["dbmuxev"]
