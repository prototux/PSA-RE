codes:
  C84: 'citroen C5 Aircross'

brand: ['citroen']
platform: 'EMP2'
years: '2017-2025'
comment:
  en: 'Launched in China in 2017, in Europe in 2018'
  fr: 'Lancé en Chine en 2017, en Europe en 2018'
  es: 'Lanzado en China en 2017, en Europa en 2018'
  de: 'In China 2017 eingeführt, in Europa 2018'
  it: 'Lanciato in Cina nel 2017, in Europa nel 2018'
  pl: 'Wprowadzony w Chinach w 2017 roku, w Europie w 2018 roku'
  ru: 'Запущен в Китае в 2017 году, в Европе в 2018 году'
  zh: '2017年在中国上市，2018年在欧洲上市'
  hu: 'Kínában 2017-ben, Európában 2018-ban indult'
  pt: 'Lançado na China em 2017, na Europa em 2018'

versions:
  all:
    architecture: 'AEE2010.ev'
    years: '2017-2025'
    comment:
      en: '"Evolved" AEE2010 (BSI 2010 EV, from about 2016): same network split as AEE2010, used by the EMP2 cars from 2016 and the CMP cars. VCU/OBC/TBMU/CMEL/RMCU are the plug-in hybrid parts (electric motors, charger, traction battery), BCM the power tailgate, BAAS the hands-free tailgate sensor, IVC_D the driver attention camera'
      fr: 'AEE2010 "évoluée" (BSI 2010 EV, à partir de 2016 environ) : même découpage réseau que l''AEE2010, utilisée par les voitures EMP2 à partir de 2016 et les voitures CMP. VCU/OBC/TBMU/CMEL/RMCU sont les éléments hybrides rechargeables (moteurs électriques, chargeur, batterie de traction), BCM le hayon motorise, BAAS le capteur d''ouverture mains libres du hayon, IVC_D la caméra de vigilance conducteur'
      es: 'AEE2010 "evolucionado" (BSI 2010 EV, a partir de 2016 aproximadamente): misma división de red que el AEE2010, utilizada por los vehículos EMP2 a partir de 2016 y los vehículos CMP. VCU/OBC/TBMU/CMEL/RMCU son los componentes híbridos enchufables (motores eléctricos, cargador, batería de tracción), BCM el portón trasero motorizado, BAAS el sensor de apertura manos libres del portón, IVC_D la cámara de vigilancia del conductor'
      de: '„weiterentwickeltes" AEE2010 (BSI 2010 EV, ab etwa 2016): gleiche Netzwerkaufteilung wie AEE2010, verwendet bei EMP2-Fahrzeugen ab 2016 und CMP-Fahrzeugen. VCU/OBC/TBMU/CMEL/RMCU sind die Plug-in-Hybrid-Komponenten (Elektromotoren, Ladegerät, Traktionsbatterie), BCM die motorisierte Heckklappe, BAAS der Freisprech-Heckklappensensor, IVC_D die Fahrerüberwachungskamera'
      it: 'AEE2010 "evoluto" (BSI 2010 EV, dal 2016 circa): stessa suddivisione di rete dell''AEE2010, utilizzata dalle vetture EMP2 dal 2016 e dalle vetture CMP. VCU/OBC/TBMU/CMEL/RMCU sono i componenti ibridi plug-in (motori elettrici, caricabatterie, batteria di trazione), BCM il portellone motorizzato, BAAS il sensore di apertura mani libere del portellone, IVC_D la telecamera di vigilanza del conducente'
      pl: '"rozwinięty" AEE2010 (BSI 2010 EV, od około 2016 roku): taki sam podział sieci jak w AEE2010, stosowany w pojazdach EMP2 od 2016 roku oraz w pojazdach CMP. VCU/OBC/TBMU/CMEL/RMCU to elementy hybrydy plug-in (silniki elektryczne, ładowarka, akumulator trakcyjny), BCM to elektryczna klapa tylna, BAAS to czujnik bezdotykowego otwierania klapy, IVC_D to kamera monitorująca kierowcę'
      ru: '«улучшенный» AEE2010 (BSI 2010 EV, примерно с 2016 года): то же разделение сети, что и у AEE2010, используется на автомобилях EMP2 с 2016 года и автомобилях CMP. VCU/OBC/TBMU/CMEL/RMCU — компоненты подключаемого гибрида (электродвигатели, зарядное устройство, тяговая батарея), BCM — моторизованная дверь багажника, BAAS — датчик бесконтактного открытия багажника, IVC_D — камера контроля внимания водителя'
      zh: '"升级版"AEE2010（BSI 2010 EV，约自2016年起）：网络划分与AEE2010相同，自2016年起用于EMP2车型及CMP车型。VCU/OBC/TBMU/CMEL/RMCU为插电混动部件（电机、充电器、牵引电池），BCM为电动尾门，BAAS为免提尾门传感器，IVC_D为驾驶员注意力摄像头'
      hu: '"fejlesztett" AEE2010 (BSI 2010 EV, kb. 2016-tól): ugyanaz a hálózati felosztás, mint az AEE2010-nél, a 2016-tól gyártott EMP2 autóknál és a CMP autóknál használják. A VCU/OBC/TBMU/CMEL/RMCU a plug-in hibrid elemek (elektromos motorok, töltő, vonóakkumulátor), a BCM a motoros csomagtérajtó, a BAAS a kihangosított csomagtérajtó-érzékelő, az IVC_D a vezetőfigyelő kamera'
      pt: 'AEE2010 "evoluído" (BSI 2010 EV, a partir de cerca de 2016): mesma divisão de rede do AEE2010, utilizada pelos veículos EMP2 a partir de 2016 e pelos veículos CMP. VCU/OBC/TBMU/CMEL/RMCU são os componentes híbridos plug-in (motores elétricos, carregador, bateria de tração), BCM a porta da bagageira motorizada, BAAS o sensor de abertura mãos-livres da porta da bagageira, IVC_D a câmara de vigilância do condutor'
