  phase1:
    architecture: 'AEE2010.full'
    years: '2013-2016'
    comment:
      en: 'Second generation full CAN: HS (IS, LAS...) for powertrain/chassis, LS CONF/CAR/INFO-DIV for body and infotainment, several LIN buses behind the BSI. BCM is the power tailgate, AVP the surround view cameras. VTH is the colour head-up display (option)'
      fr: 'Tout CAN de deuxième génération : HS (IS, LAS...) pour la chaîne de traction/liaison au sol, LS CONF/CAR/INFO-DIV pour l''habitacle et l''info-divertissement, plusieurs bus LIN derrière le BSI. BCM est le hayon motorisé, AVP les caméras de vision panoramique. VTH est l''affichage tête haute couleur (option)'
      es: 'CAN completo de segunda generación: HS (IS, LAS...) para la cadena cinemática/tren de rodaje, LS CONF/CAR/INFO-DIV para la carrocería y el infoentretenimiento, varios buses LIN detrás del BSI. BCM es el portón trasero motorizado, AVP las cámaras de visión panorámica. VTH es la pantalla de proyección en color (opcional)'
      de: 'Vollständiges CAN der zweiten Generation: HS (IS, LAS...) für Antriebsstrang/Fahrwerk, LS CONF/CAR/INFO-DIV für Karosserie und Infotainment, mehrere LIN-Busse hinter dem BSI. BCM ist die elektrische Heckklappe, AVP die Rundumsichtkameras. VTH ist das farbige Head-up-Display (optional)'
      it: 'CAN completo di seconda generazione: HS (IS, LAS...) per catena cinematica/telaio, LS CONF/CAR/INFO-DIV per carrozzeria e infotainment, diversi bus LIN dietro il BSI. BCM è il portellone motorizzato, AVP le telecamere a visione panoramica. VTH è il display head-up a colori (opzionale)'
      pl: 'Pełna sieć CAN drugiej generacji: HS (IS, LAS...) dla układu napędowego/podwozia, LS CONF/CAR/INFO-DIV dla nadwozia i systemu multimedialnego, kilka magistrali LIN za BSI. BCM to elektryczna klapa bagażnika, AVP to kamery 360 stopni. VTH to kolorowy wyświetlacz przezierny (opcja)'
      ru: 'Полностью CAN второго поколения: HS (IS, LAS...) для трансмиссии/шасси, LS CONF/CAR/INFO-DIV для кузова и мультимедиа, несколько шин LIN за BSI. BCM — электропривод багажника, AVP — камеры кругового обзора. VTH — цветной дисплей на лобовом стекле (опция)'
      zh: '第二代全CAN总线:HS(IS、LAS等)用于动力总成/底盘,LS CONF/CAR/INFO-DIV用于车身和信息娱乐系统,BSI后方还有多条LIN总线。BCM为电动尾门,AVP为全景影像摄像头。VTH为彩色抬头显示器(选装)'
      hu: 'Második generációs teljes CAN: HS (IS, LAS...) a hajtáslánchoz/alvázhoz, LS CONF/CAR/INFO-DIV a karosszériához és az infotainmenthez, több LIN busz a BSI mögött. A BCM a motoros csomagtérajtó, az AVP a körkörös látást biztosító kamerák. A VTH a színes head-up kijelző (opció)'
      pt: 'CAN completo de segunda geração: HS (IS, LAS...) para o grupo motopropulsor/chassis, LS CONF/CAR/INFO-DIV para a carroçaria e o info-entretenimento, vários barramentos LIN atrás do BSI. BCM é a porta da mala motorizada, AVP as câmaras de visão panorâmica. VTH é o head-up display a cores (opcional)'
