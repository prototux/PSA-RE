  phase2:
    architecture: 'AEE2010.ev'
    years: '2016-2022'
    comment:
      en: 'From the 2016 facelift. "Evolved" AEE2010 (BSI 2010 EV, from about 2016): same network split as AEE2010, used by the EMP2 cars from 2016 and the CMP cars. VTH is the colour head-up display (option), BAAS the hands-free tailgate opening sensor added with the facelift'
      fr: 'À partir du restylage de 2016. AEE2010 "évoluée" (BSI 2010 EV, à partir de 2016 environ) : même découpage réseau que l''AEE2010, utilisée par les voitures EMP2 à partir de 2016 et les voitures CMP. VTH est l''affichage tête haute couleur (option), BAAS le capteur d''ouverture mains libres du hayon ajouté au restylage'
      es: 'Desde el restyling de 2016. AEE2010 "evolucionado" (BSI 2010 EV, desde aproximadamente 2016): mismo reparto de red que el AEE2010, utilizado por los coches EMP2 desde 2016 y los coches CMP. VTH es la pantalla de proyección en color (opcional), BAAS el sensor de apertura manos libres del portón añadido con el restyling'
      de: 'Ab dem Facelift 2016. "Weiterentwickeltes" AEE2010 (BSI 2010 EV, ab etwa 2016): gleiche Netzwerkaufteilung wie AEE2010, verwendet von EMP2-Fahrzeugen ab 2016 und CMP-Fahrzeugen. VTH ist das farbige Head-up-Display (optional), BAAS der mit dem Facelift hinzugekommene Freihand-Sensor der Heckklappe'
      it: 'Dal restyling del 2016. AEE2010 "evoluto" (BSI 2010 EV, da circa il 2016): stessa suddivisione di rete dell''AEE2010, utilizzato dalle auto EMP2 dal 2016 e dalle auto CMP. VTH è il display head-up a colori (opzionale), BAAS il sensore di apertura mani libere del portellone aggiunto con il restyling'
      pl: 'Od liftingu z 2016 roku. "Rozwinięty" AEE2010 (BSI 2010 EV, od około 2016 roku): ten sam podział sieci co AEE2010, stosowany w samochodach EMP2 od 2016 roku oraz w samochodach CMP. VTH to kolorowy wyświetlacz przezierny (opcja), BAAS to czujnik otwierania klapy bez użycia rąk dodany wraz z liftingiem'
      ru: 'С рестайлинга 2016 года. "Улучшенная" AEE2010 (BSI 2010 EV, примерно с 2016 года): такое же разделение сети, как у AEE2010, используется в автомобилях EMP2 с 2016 года и в автомобилях CMP. VTH — цветной дисплей на лобовом стекле (опция), BAAS — датчик бесконтактного открытия багажника, добавленный с рестайлингом'
      zh: '自2016年改款起。"改进型"AEE2010(BSI 2010 EV,约自2016年起):网络划分与AEE2010相同,自2016年起用于EMP2车型及CMP车型。VTH为彩色抬头显示器(选装),BAAS为改款时新增的尾门免提感应传感器'
      hu: 'A 2016-os ráncfelvarrástól. "Továbbfejlesztett" AEE2010 (BSI 2010 EV, kb. 2016-tól): ugyanaz a hálózati felosztás, mint az AEE2010-nél, az EMP2 járműveknél 2016-tól és a CMP járműveknél használják. A VTH a színes head-up kijelző (opció), a BAAS a ráncfelvarráskor hozzáadott kihangosított csomagtérnyitás-érzékelő'
      pt: 'A partir do restyling de 2016. AEE2010 "evoluída" (BSI 2010 EV, a partir de cerca de 2016): mesma divisão de rede que a AEE2010, usada pelos automóveis EMP2 a partir de 2016 e pelos automóveis CMP. VTH é o head-up display a cores (opcional), BAAS o sensor de abertura mãos-livres da porta da mala acrescentado no restyling'
