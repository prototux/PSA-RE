    years: '2008-2017'
    comment:
      en: 'Designed around the 2007 evolution of AEE2004 ("evolved" BSI, evolved engine bay fuse box, LIN battery sensor): same CAN IS / CAN CONF / CAN CAR split as AEE2004. BHI is the Hydractive 3+ suspension (other versions have steel springs), BCM the Tourer power tailgate, SAM the blind spot monitoring'
      fr: 'Conçue autour de l''evolution 2007 de l''AEE2004 (BSI "évolué", BSM évolué, capteur batterie LIN) : même découpage CAN IS / CAN CONF / CAN CAR que l''AEE2004. BHI est la suspension Hydractive 3+ (les autres versions ont des ressorts metalliques), BCM le hayon motorise du Tourer, SAM la surveillance d''angle mort'
      es: 'Diseñada en torno a la evolución de 2007 del AEE2004 (BSI "evolucionado", caja de fusibles del compartimento motor evolucionada, sensor de batería LIN): misma división CAN IS / CAN CONF / CAN CAR que el AEE2004. BHI es la suspensión Hydractive 3+ (las demás versiones tienen ballestas metálicas), BCM el portón trasero motorizado del Tourer, SAM la vigilancia de ángulo muerto'
      de: 'basierend auf der 2007er Weiterentwicklung des AEE2004 (weiterentwickeltes BSI, weiterentwickelter Sicherungskasten im Motorraum, LIN-Batteriesensor): gleiche CAN-IS-/CAN-CONF-/CAN-CAR-Aufteilung wie AEE2004. BHI ist das Fahrwerk Hydractive 3+ (andere Varianten haben Stahlfedern), BCM die motorisierte Heckklappe des Tourer, SAM die Totwinkelüberwachung'
      it: 'Progettata sull''evoluzione 2007 dell''AEE2004 (BSI "evoluto", scatola fusibili vano motore evoluta, sensore batteria LIN): stessa suddivisione CAN IS / CAN CONF / CAN CAR dell''AEE2004. BHI è la sospensione Hydractive 3+ (le altre versioni hanno molle in acciaio), BCM il portellone motorizzato della Tourer, SAM il monitoraggio dell''angolo cieco'
      pl: 'Zaprojektowana na bazie ewolucji AEE2004 z 2007 roku ("rozwinięty" BSI, rozwinięta skrzynka bezpieczników w komorze silnika, czujnik akumulatora LIN): taki sam podział CAN IS / CAN CONF / CAN CAR jak w AEE2004. BHI to zawieszenie Hydractive 3+ (inne wersje mają sprężyny stalowe), BCM to elektryczna klapa tylna Tourer, SAM to monitorowanie martwego pola'
      ru: 'Разработана на основе версии AEE2004 2007 года («улучшенный» BSI, улучшенный блок предохранителей моторного отсека, LIN-датчик батареи): такое же разделение CAN IS / CAN CONF / CAN CAR, как у AEE2004. BHI — подвеска Hydractive 3+ (в других версиях стальные пружины), BCM — моторизованная дверь багажника Tourer, SAM — контроль слепых зон'
      zh: '基于AEE2004（2004年电气架构）2007年改进版设计（"升级版"BSI、升级版发动机舱保险丝盒、LIN电池传感器）：与AEE2004相同的CAN IS/CAN CONF/CAN CAR划分。BHI为Hydractive 3+悬挂（其他版本为钢制弹簧），BCM为Tourer电动尾门，SAM为盲区监测'
      hu: 'Az AEE2004 2007-es fejlesztésére épül ("fejlesztett" BSI, fejlesztett motortéri biztosítékdoboz, LIN akkumulátorérzékelő): ugyanaz a CAN IS / CAN CONF / CAN CAR felosztás, mint az AEE2004-nél. A BHI a Hydractive 3+ felfüggesztés (a többi verzióban acélrugók vannak), a BCM a Tourer motoros csomagtérajtaja, a SAM a holttér-figyelés'
      pt: 'Concebida com base na evolução de 2007 do AEE2004 (BSI "evoluído", caixa de fusíveis do compartimento do motor evoluída, sensor de bateria LIN): a mesma divisão CAN IS / CAN CONF / CAN CAR do AEE2004. O BHI é a suspensão Hydractive 3+ (as outras versões têm molas metálicas), o BCM a porta da bagageira motorizada do Tourer, o SAM a vigilância do ângulo morto'
