versions:
  all:
    architecture: 'AEE2001.full'
    years: '2001-2012'
    comment:
      en: 'Bi-VAN/CAN: CAN IS (250 kbit/s) for engine/gearbox/chassis, VAN comfort (125 kbit/s) for display, radio, clim, cluster, and VAN body buses (62.5 kbit/s) for airbag, COM2000, alarm and doors. The 206 never switched to full CAN'
      fr: 'Bi-VAN/CAN : CAN IS (250 kbit/s) pour moteur/boîte/liaison au sol, VAN confort (125 kbit/s) pour écran, autoradio, clim, combiné, et VAN carrosserie (62.5 kbit/s) pour airbag, COM2000, alarme et portes. La 206 n''est jamais passée au tout CAN'
      es: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) para motor/caja de cambios/chasis, VAN confort (125 kbit/s) para pantalla, radio, clima, cuadro de instrumentos, y bus VAN carrocería (62,5 kbit/s) para airbag, COM2000, alarma y puertas. El 206 nunca pasó a todo CAN'
      de: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) für Motor/Getriebe/Fahrwerk, VAN Komfort (125 kbit/s) für Display, Radio, Klimaanlage, Kombiinstrument, und VAN-Karosseriebus (62,5 kbit/s) für Airbag, COM2000, Alarmanlage und Türen. Der 206 wechselte nie auf vollständiges CAN'
      it: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) per motore/cambio/telaio, VAN comfort (125 kbit/s) per display, autoradio, climatizzatore, quadro strumenti, e bus VAN carrozzeria (62,5 kbit/s) per airbag, COM2000, allarme e porte. La 206 non è mai passata al tutto CAN'
      pl: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) dla silnika/skrzyni biegów/podwozia, VAN komfort (125 kbit/s) dla wyświetlacza, radia, klimatyzacji, zestawu wskaźników, oraz magistrala VAN nadwozia (62,5 kbit/s) dla poduszki powietrznej, COM2000, alarmu i drzwi. Model 206 nigdy nie przeszedł na wyłącznie CAN'
      ru: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 кбит/с) для двигателя/коробки передач/шасси, VAN комфорт (125 кбит/с) для дисплея, радио, кондиционера, приборной панели, и кузовная шина VAN (62,5 кбит/с) для подушки безопасности, COM2000, сигнализации и дверей. 206 никогда не переходила на полностью CAN'
      zh: '双VAN/CAN架构：双VAN/CAN架构：CAN IS（250 kbit/s）用于发动机/变速箱/底盘，VAN舒适总线（125 kbit/s）用于显示屏、收音机、空调、仪表组，VAN车身总线（62.5 kbit/s）用于安全气囊、COM2000、报警器和车门。206车型从未升级为全CAN架构'
      hu: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) a motorhoz/váltóhoz/futóműhöz, VAN komfort (125 kbit/s) a kijelzőhöz, rádióhoz, klímához, műszerfalhoz, és VAN karosszéria busz (62,5 kbit/s) a légzsákhoz, COM2000-hez, riasztóhoz és ajtókhoz. A 206 soha nem váltott teljes CAN-ra'
      pt: 'Bi-VAN/CAN: CAN IS (250 kbit/s) para motor/caixa de velocidades/chassis, VAN conforto (125 kbit/s) para ecrã, rádio, climatização, quadro de instrumentos, e bus VAN carroçaria (62,5 kbit/s) para airbag, COM2000, alarme e portas. O 206 nunca passou a CAN total'
    nodes:
      HS: ['BSI', 'CMM', 'BVA', 'ABS']
      VAN: ['BSI', 'HDC', 'CMB', 'EMF', 'RAD', 'BTEL', 'CDC', 'CLIM_AV', 'RBG', 'ALARM', 'CDPL', 'ADDGO', 'MAE']
    optional_nodes: ['BVA', 'ABS', 'BTEL', 'CDC', 'CLIM_AV', 'ALARM', 'CDPL', 'ADDGO', 'MAE']
