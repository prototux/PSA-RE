  all:
    architecture: 'AEE2010.full'
    years: '2011-2018'
    comment:
      en: 'Second generation full CAN: HS (IS, LAS...) for powertrain/chassis, LS CONF/CAR/INFO-DIV for body and infotainment, several LIN buses behind the BSI. HCU1/HCU2 are the Hybrid4 controllers, VTH the head-up display, BSTL the lane departure warning. CLOCK is the multiplexed analogue clock of the centre console, synchronised with the screen time (hands turn to the right time; otherwise only on the RCZ, DS 7 and DS 9), SPB the massage seats'
      fr: 'Tout CAN de deuxième génération : HS (IS, LAS...) pour la chaîne de traction/liaison au sol, LS CONF/CAR/INFO-DIV pour l''habitacle et l''info-divertissement, plusieurs bus LIN derrière le BSI. HCU1/HCU2 sont les calculateurs Hybrid4, VTH l''affichage tête haute, BSTL l''alerte de franchissement de ligne. CLOCK est la montre analogique multiplexée de la console centrale, synchronisée sur l''heure de l''écran (les aiguilles tournent jusqu''à la bonne heure ; sinon seulement sur RCZ, DS 7 et DS 9), SPB les sièges massants'
      es: 'CAN completo de segunda generación: HS (IS, LAS...) para la cadena cinemática/tren de rodaje, LS CONF/CAR/INFO-DIV para la carrocería y el infoentretenimiento, varios buses LIN detrás del BSI. HCU1/HCU2 son las unidades de control Hybrid4, VTH la pantalla de proyección, BSTL la alerta de salida de carril. CLOCK es el reloj analógico multiplexado de la consola central, sincronizado con la hora de la pantalla (las agujas giran hasta la hora correcta; si no, solo en el RCZ, DS 7 y DS 9), SPB los asientos con masaje'
      de: 'Vollständiges CAN der zweiten Generation: HS (IS, LAS...) für Antriebsstrang/Fahrwerk, LS CONF/CAR/INFO-DIV für Karosserie und Infotainment, mehrere LIN-Busse hinter dem BSI. HCU1/HCU2 sind die Hybrid4-Steuergeräte, VTH das Head-up-Display, BSTL die Spurverlassenswarnung. CLOCK ist die multiplexed Analoguhr der Mittelkonsole, synchronisiert mit der Bildschirmzeit (die Zeiger drehen sich bis zur richtigen Uhrzeit; sonst nur bei RCZ, DS 7 und DS 9), SPB die Massagesitze'
      it: 'CAN completo di seconda generazione: HS (IS, LAS...) per catena cinematica/telaio, LS CONF/CAR/INFO-DIV per carrozzeria e infotainment, diversi bus LIN dietro il BSI. HCU1/HCU2 sono le centraline Hybrid4, VTH il display head-up, BSTL l''avviso di superamento corsia. CLOCK è l''orologio analogico multiplexato della console centrale, sincronizzato con l''ora dello schermo (le lancette girano fino all''ora corretta; altrimenti solo su RCZ, DS 7 e DS 9), SPB i sedili massaggianti'
      pl: 'Pełna sieć CAN drugiej generacji: HS (IS, LAS...) dla układu napędowego/podwozia, LS CONF/CAR/INFO-DIV dla nadwozia i systemu multimedialnego, kilka magistrali LIN za BSI. HCU1/HCU2 to sterowniki Hybrid4, VTH to wyświetlacz przezierny, BSTL to ostrzeżenie o zjeżdżaniu z pasa ruchu. CLOCK to multipleksowany zegar analogowy konsoli centralnej, zsynchronizowany z czasem ekranu (wskazówki obracają się do właściwej godziny; w innym przypadku tylko w RCZ, DS 7 i DS 9), SPB to fotele z funkcją masażu'
      ru: 'Полностью CAN второго поколения: HS (IS, LAS...) для трансмиссии/шасси, LS CONF/CAR/INFO-DIV для кузова и мультимедиа, несколько шин LIN за BSI. HCU1/HCU2 — блоки управления Hybrid4, VTH — дисплей на лобовом стекле, BSTL — предупреждение о съезде с полосы. CLOCK — мультиплексированные аналоговые часы центральной консоли, синхронизированные со временем экрана (стрелки поворачиваются до правильного времени; в противном случае только на RCZ, DS 7 и DS 9), SPB — сиденья с массажем'
      zh: '第二代全CAN总线:HS(IS、LAS等)用于动力总成/底盘,LS CONF/CAR/INFO-DIV用于车身和信息娱乐系统,BSI后方还有多条LIN总线。HCU1/HCU2为Hybrid4混合动力控制器,VTH为抬头显示器,BSTL为车道偏离预警。CLOCK为中控台复用模拟时钟,与屏幕时间同步(指针会转到正确时间;否则仅在RCZ、DS 7和DS 9上如此),SPB为按摩座椅'
      hu: 'Második generációs teljes CAN: HS (IS, LAS...) a hajtáslánchoz/alvázhoz, LS CONF/CAR/INFO-DIV a karosszériához és az infotainmenthez, több LIN busz a BSI mögött. A HCU1/HCU2 a Hybrid4 vezérlőegységek, a VTH a head-up kijelző, a BSTL a sávelhagyás-figyelmeztetés. A CLOCK a középkonzol multiplexelt analóg órája, amely szinkronizálva van a képernyő idejével (a mutatók a helyes időig forognak; egyébként csak az RCZ, DS 7 és DS 9 modelleken), az SPB a masszázsülések'
      pt: 'CAN completo de segunda geração: HS (IS, LAS...) para o grupo motopropulsor/chassis, LS CONF/CAR/INFO-DIV para a carroçaria e o info-entretenimento, vários barramentos LIN atrás do BSI. HCU1/HCU2 são as unidades de controlo Hybrid4, VTH o head-up display, BSTL o alerta de saída de faixa. CLOCK é o relógio analógico multiplexado da consola central, sincronizado com a hora do ecrã (os ponteiros rodam até à hora certa; caso contrário só no RCZ, DS 7 e DS 9), SPB os bancos com massagem'
