codes:
  M44: ['citroen C3-XR (China)', 'citroen C3 L (China)']  # M44 is inferred from the C3L code
  M443: 'citroen C3 L (China)'  # sedan

brand: ['citroen']
platform: 'PF1'
years: '2014-2023'

versions:
  all:
    architecture: 'AEE2010.eco'
    years: '2014-2023'
    comment:
      en: 'Guessed from the other PF1 cars of that time. Low cost "eco" variant of AEE2010: the body nodes share a single CAN HABITACLE bus (plus INFO-DIV for the cluster/head unit); the engine bay fuse box (BSM) does not seem to be a diagnosable CAN node on these cars'
      fr: 'Suppose d''apres les autres voitures PF1 de l''epoque. Variante "eco" economique de l''AEE2010 : les calculateurs habitacle partagent un unique bus CAN HABITACLE (plus INFO-DIV pour le combine et l''autoradio) ; le BSM ne semble pas etre un noeud CAN diagnosable sur ces voitures'
      es: 'Deducido de otros vehículos PF1 de la época. Variante económica "eco" del AEE2010: los módulos del habitáculo comparten un único bus CAN HABITACLE (más INFO-DIV para el cuadro de instrumentos/unidad principal); la caja de fusibles del compartimento motor (BSM) no parece ser un nodo CAN diagnosticable en estos vehículos'
      de: 'Aus anderen PF1-Fahrzeugen jener Zeit abgeleitet. kostengünstige „Eco"-Variante des AEE2010: Die Innenraumsteuergeräte teilen sich einen einzigen CAN-HABITACLE-Bus (plus INFO-DIV für Kombiinstrument/Head-Unit); der Sicherungskasten im Motorraum (BSM) scheint bei diesen Fahrzeugen kein diagnostizierbarer CAN-Knoten zu sein'
      it: 'Dedotto dalle altre vetture PF1 dell''epoca. Variante economica "eco" dell''AEE2010: le centraline abitacolo condividono un unico bus CAN HABITACLE (più INFO-DIV per quadro strumenti/unità centrale); la scatola fusibili vano motore (BSM) non sembra essere un nodo CAN diagnosticabile su queste vetture'
      pl: 'Wywnioskowane na podstawie innych ówczesnych pojazdów PF1. Ekonomiczny wariant "eco" AEE2010: sterowniki nadwozia współdzielą jedną magistralę CAN HABITACLE (plus INFO-DIV dla zestawu wskaźników/jednostki centralnej); skrzynka bezpieczników w komorze silnika (BSM) w tych pojazdach nie wydaje się być diagnozowalnym węzłem CAN'
      ru: 'Предположение сделано на основе других автомобилей PF1 того времени. Экономичный вариант "eco" AEE2010: блоки кузова используют единую шину CAN HABITACLE (плюс INFO-DIV для приборной панели/головного устройства); блок предохранителей моторного отсека (BSM), похоже, не является диагностируемым узлом CAN на этих автомобилях'
      zh: '根据同时期其他PF1车型推测。AEE2010的经济型"eco"变体：车身控制器共用一条CAN HABITACLE总线（另加用于仪表组/主机的INFO-DIV）；发动机舱保险丝盒（BSM）在这些车型上似乎不是可诊断的CAN节点'
      hu: 'A kor többi PF1 autója alapján feltételezve. Az AEE2010 alacsony költségű "eco" változata: a karosszéria-vezérlőegységek egyetlen közös CAN HABITACLE buszt használnak (plusz INFO-DIV a műszerfalhoz/fejegységhez); a motortéri biztosítékdoboz (BSM) ezeken az autókon úgy tűnik, nem diagnosztizálható CAN csomópont'
      pt: 'Deduzido a partir de outros veículos PF1 da época. Variante económica "eco" do AEE2010: os módulos do habitáculo partilham um único bus CAN HABITACLE (mais o INFO-DIV para o quadro de instrumentos/autorrádio); a caixa de fusíveis do compartimento do motor (BSM) não parece ser um nó CAN diagnosticável nestes veículos'
    nodes:
      HS: ['BSI', 'CMM', 'BVA', 'ABS', 'CAV', 'DAE']
      LS: ['BSI', 'BSM', 'HDC', 'CMB', 'MATT', 'BTEL', 'RAD', 'FMUX', 'CLIM_AV', 'RBG', 'ALARM', 'AAS', 'EDP_C']
      LIN: ['BSI', 'CDPL', 'BECB', 'TNB']
    optional_nodes: ['BVA', 'CAV', 'MATT', 'BTEL', 'RAD', 'CLIM_AV', 'ALARM', 'AAS', 'CDPL']
    buses: ['HS.IS', 'LS.CONF', 'LS.HABITACLE', 'LS.INFO-DIV', 'LIN.LIN1']
