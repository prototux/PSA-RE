  all:
    architecture: 'AEE2004.full'
    years: '2006-2015'
    comment:
      en: 'Full CAN (CAN IS 500 kbit/s, CAN CONF and CAN CAR 125 kbit/s); late cars (2007-2008 onwards) got the "evolved" BSI generation. BTE is the CC roof controller (A76 only), TNB the seatbelt warning display, BCP the directional headlamps'
      fr: 'Tout CAN (CAN IS 500 kbit/s, CAN CONF et CAN CAR 125 kbit/s) ; les dernières voitures (à partir de 2007-2008) ont reçu le BSI "évolué". BTE est le boîtier de toit du CC (À76 uniquement), TNB l''afficheur de ceintures, BCP les projecteurs directionnels'
      es: 'Todo CAN (CAN IS 500 kbit/s, CAN CONF y CAN CAR 125 kbit/s); los vehículos más recientes (a partir de 2007-2008) recibieron la generación de BSI "evolucionado". BTE es la unidad de techo del CC (solo A76), TNB el indicador de aviso de cinturón, BCP los faros direccionales'
      de: 'vollständiges CAN (CAN IS 500 kbit/s, CAN CONF und CAN CAR 125 kbit/s); spätere Fahrzeuge (ab 2007-2008) erhielten die „weiterentwickelte" BSI-Generation. BTE ist die Dachsteuerung des CC (nur A76), TNB die Gurtwarnanzeige, BCP die Kurvenscheinwerfer'
      it: 'Tutto CAN (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); le vetture più recenti (dal 2007-2008) hanno ricevuto la generazione BSI "evoluta". BTE è la centralina del tetto della CC (solo A76), TNB il display di avviso cintura, BCP i fari direzionali'
      pl: 'Wyłącznie CAN (CAN IS 500 kbit/s, CAN CONF i CAN CAR 125 kbit/s); nowsze pojazdy (od 2007-2008) otrzymały "rozwiniętą" generację BSI. BTE to sterownik dachu CC (tylko A76), TNB to wskaźnik przypomnienia o pasach, BCP to reflektory doświetlające zakręt'
      ru: 'Полностью CAN (CAN IS 500 кбит/с, CAN CONF и CAN CAR 125 кбит/с); более поздние автомобили (примерно с 2007-2008) получили «улучшенное» поколение BSI. BTE — блок крыши CC (только A76), TNB — индикатор напоминания о ремне, BCP — поворотные фары'
      zh: '全CAN架构（CAN IS 500 kbit/s，CAN CONF和CAN CAR 125 kbit/s）；较晚的车型（2007-2008年起）配备了"升级版"BSI。BTE为CC车顶控制器（仅A76），TNB为安全带提醒显示，BCP为转向大灯'
      hu: 'Teljes CAN (CAN IS 500 kbit/s, CAN CONF és CAN CAR 125 kbit/s); a későbbi autók (kb. 2007-2008-tól) a „fejlesztett" BSI generációt kapták. A BTE a CC tetővezérlője (csak A76), a TNB az öv-emlékeztető kijelző, a BCP az irányfényszórók'
      pt: 'CAN total (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); os veículos mais recentes (a partir de 2007-2008) receberam a geração de BSI "evoluído". O BTE é a unidade de teto do CC (apenas A76), o TNB o indicador de aviso de cinto, o BCP os faróis direcionais'
