versions:
  all:
    architecture: 'NEA2020.full'
    years: '2024-'
    comment:
      en: 'New electronic architecture ("NEA", sometimes called NEA2020) with a central vehicle supervisor (VSM, listed here as BSI) replacing the AEE2010 BSI. Not an AEE2010 variant: the architecture name is a proposal, and the network split of the nodes below is not documented (placed by analogy with AEE2010). CLIM_AR stands for the rear zone of the tri-zone automatic climate control (option); whether the rear controls are a separate node is not confirmed'
      fr: 'Nouvelle architecture électronique ("NEA", parfois appelée NEA2020) avec un superviseur central (VSM, noté BSI ici) qui remplace le BSI AEE2010. Ce n''est pas une variante de l''AEE2010 : le nom d''architecture est une proposition et la répartition des calculateurs par réseau n''est pas documentée (placée par analogie avec l''AEE2010). CLIM_AR représente la zone arrière de la climatisation automatique trizone (option) ; un pupitre arrière séparé n''est pas confirmé'
      es: 'Nueva arquitectura electrónica ("NEA", a veces llamada NEA2020) con un supervisor central del vehículo (VSM, indicado aquí como BSI) que sustituye al BSI AEE2010. No es una variante del AEE2010: el nombre de la arquitectura es una propuesta, y el reparto de los nodos por red no está documentado (situado por analogía con el AEE2010). CLIM_AR representa la zona trasera de la climatización automática trizona (opcional); no está confirmado si los mandos traseros son un nodo independiente'
      de: 'Neue elektronische Architektur ("NEA", manchmal NEA2020 genannt) mit einem zentralen Fahrzeugsupervisor (VSM, hier als BSI bezeichnet), der das BSI der AEE2010 ersetzt. Keine Variante der AEE2010: Der Architekturname ist ein Vorschlag, und die Netzwerkaufteilung der unten genannten Steuergeräte ist nicht dokumentiert (in Analogie zur AEE2010 platziert). CLIM_AR steht für die hintere Zone der 3-Zonen-Klimaautomatik (optional); ob die hinteren Bedienelemente ein separates Steuergerät sind, ist nicht bestätigt'
      it: 'Nuova architettura elettronica ("NEA", talvolta chiamata NEA2020) con un supervisore centrale del veicolo (VSM, qui indicato come BSI) che sostituisce il BSI AEE2010. Non è una variante dell''AEE2010: il nome dell''architettura è una proposta e la suddivisione in rete dei nodi sottostanti non è documentata (collocata per analogia con l''AEE2010). CLIM_AR rappresenta la zona posteriore del climatizzatore automatico trizona (opzionale); non è confermato se i comandi posteriori siano un nodo separato'
      pl: 'Nowa architektura elektroniczna ("NEA", czasem nazywana NEA2020) z centralnym nadzorcą pojazdu (VSM, oznaczonym tu jako BSI), zastępującym BSI z AEE2010. To nie jest wariant AEE2010: nazwa architektury jest propozycją, a podział węzłów na sieci poniżej nie jest udokumentowany (umieszczony przez analogię do AEE2010). CLIM_AR oznacza tylną strefę trójstrefowej automatycznej klimatyzacji (opcja); nie potwierdzono, czy tylne sterowanie to osobny węzeł'
      ru: 'Новая электронная архитектура ("NEA", иногда называемая NEA2020) с центральным супервизором автомобиля (VSM, здесь обозначен как BSI), заменяющим BSI архитектуры AEE2010. Это не вариант AEE2010: название архитектуры является предположением, а распределение узлов по сетям ниже не задокументировано (указано по аналогии с AEE2010). CLIM_AR обозначает заднюю зону трёхзонного автоматического климат-контроля (опция); не подтверждено, является ли заднее управление отдельным узлом'
      zh: '全新电子架构("NEA",有时称为NEA2020),配备中央车辆监控器(VSM,此处标注为BSI),取代AEE2010的BSI。这不是AEE2010的变体:架构名称为推测名称,以下节点的网络划分未有文档记录(按照AEE2010的方式推测排列)。CLIM_AR代表三区自动空调的后区(选装);后排控制是否为独立节点尚未确认'
      hu: 'Új elektronikus architektúra ("NEA", néha NEA2020 néven is emlegetik) központi jármű-felügyelővel (VSM, itt BSI-ként szerepel), amely felváltja az AEE2010 BSI-jét. Nem az AEE2010 egy változata: az architektúra neve feltételezés, és az alábbi csomópontok hálózati elosztása nincs dokumentálva (az AEE2010 mintájára helyezve el). A CLIM_AR a háromzónás automata klíma hátsó zónáját jelöli (opció); nem megerősített, hogy a hátsó kezelőszervek külön csomópontot alkotnak-e'
      pt: 'Nova arquitetura eletrónica ("NEA", por vezes chamada NEA2020) com um supervisor central do veículo (VSM, aqui designado por BSI) que substitui o BSI da AEE2010. Não é uma variante da AEE2010: o nome da arquitetura é uma proposta, e a repartição dos nós pela rede não está documentada (colocada por analogia com a AEE2010). CLIM_AR representa a zona traseira da climatização automática de três zonas (opcional); não está confirmado se os comandos traseiros são um nó separado'
    nodes:
