    years: '2012-2022'
    comment:
      en: 'Diagnostic tools show a "BSI 2010" with the same airbag/ABS units as the 208; the eco variant is a guess (low cost car). AVE is the electric steering lock, LCE the electronic key reader'
      fr: 'Les outils de diagnostic voient un "BSI 2010" avec les mêmes airbag/ABS que la 208 ; la variante eco est supposée (voiture low cost). AVE est l''antivol électrique, LCE le lecteur de clé électronique'
      es: 'Las herramientas de diagnóstico muestran un "BSI 2010" con las mismas unidades de airbag/ABS que el 208; la variante eco es una suposición (vehículo económico). AVE es el bloqueo de dirección eléctrico, LCE el lector de llave electrónico'
      de: 'Diagnosetools zeigen ein "BSI 2010" mit denselben Airbag-/ABS-Einheiten wie der 208; die Eco-Variante ist eine Vermutung (kostengünstiges Fahrzeug). AVE ist die elektrische Lenkradsperre, LCE der elektronische Schlüsselleser'
      it: 'Gli strumenti diagnostici mostrano un "BSI 2010" con le stesse unità airbag/ABS della 208; la variante eco è un''ipotesi (vettura low cost). AVE è il bloccasterzo elettrico, LCE il lettore di chiave elettronico'
      pl: 'Narzędzia diagnostyczne pokazują "BSI 2010" z tymi samymi jednostkami poduszki powietrznej/ABS co w 208; wariant eco to przypuszczenie (pojazd niskokosztowy). AVE to elektryczna blokada kierownicy, LCE to elektroniczny czytnik kluczyka'
      ru: 'Диагностические инструменты показывают "BSI 2010" с теми же блоками подушки безопасности/ABS, что и у 208; вариант eco — предположение (бюджетный автомобиль). AVE — электрический замок рулевой колонки, LCE — электронный считыватель ключа'
      zh: '诊断工具显示"BSI 2010"，配备与208相同的安全气囊/ABS单元；eco变体为推测（低成本车型）。AVE为电子转向锁，LCE为电子钥匙读取器'
      hu: 'A diagnosztikai eszközök "BSI 2010"-et mutatnak, ugyanazokkal a légzsák-/ABS-egységekkel, mint a 208-nál; az eco változat feltételezés (alacsony költségű autó). Az AVE az elektromos kormányzár, az LCE az elektronikus kulcsolvasó'
      pt: 'As ferramentas de diagnóstico mostram um "BSI 2010" com as mesmas unidades de airbag/ABS que o 208; a variante eco é uma suposição (veículo económico). O AVE é o bloqueio de direção elétrico, o LCE o leitor de chave eletrónico'
