comment:
  en: 'EMP2 front end with a reinforced rear from the B9'
  fr: 'Avant EMP2 avec un arriere renforcé issu du B9'
  es: 'Frontal EMP2 con una parte trasera reforzada procedente del B9'
  de: 'EMP2-Front mit einem verstärkten Heck vom B9'
  it: 'Anteriore EMP2 con un posteriore rinforzato derivato dalla B9'
  pl: 'Przód EMP2 ze wzmocnionym tyłem pochodzącym z B9'
  ru: 'Передняя часть EMP2 с усиленной задней частью от B9'
  zh: 'EMP2前部结构，配合源自B9的加强型后部结构'
  hu: 'EMP2 elülső rész a B9-ből származó megerősített hátsó résszel'
  pt: 'Frente EMP2 com uma traseira reforçada proveniente do B9'

versions:
  all:
    architecture: 'AEE2010.ev'
    years: '2018-'
    comment:
      en: '"Evolved" AEE2010 (BSI 2010 EV, from about 2016): same network split as AEE2010, used by the EMP2 cars from 2016 and the CMP cars. Sliding side doors are manual (electric ones only on the K0 vans), BSG the body builder interface, VCU/OBC/TBMU/CMEL the electric versions (from 2020). VTH is the blade head-up display (option)'
      fr: 'AEE2010 "évoluée" (BSI 2010 EV, à partir de 2016 environ) : même découpage réseau que l''AEE2010, utilisée par les voitures EMP2 à partir de 2016 et les voitures CMP. Portes latérales coulissantes manuelles (électriques seulement sur les K0), BSG le boîtier transformateur carrossier, VCU/OBC/TBMU/CMEL les versions électriques (à partir de 2020). VTH est l''affichage tête haute sur lame (option)'
      es: 'AEE2010 "evolucionado" (BSI 2010 EV, desde aproximadamente 2016): mismo reparto de red que el AEE2010, utilizado por los coches EMP2 desde 2016 y los coches CMP. Puertas laterales correderas manuales (eléctricas solo en las furgonetas K0), BSG la interfaz para carrozadores, VCU/OBC/TBMU/CMEL las versiones eléctricas (a partir de 2020). VTH es la pantalla de proyección tipo lámina (opcional)'
      de: '"Weiterentwickeltes" AEE2010 (BSI 2010 EV, ab etwa 2016): gleiche Netzwerkaufteilung wie AEE2010, verwendet von EMP2-Fahrzeugen ab 2016 und CMP-Fahrzeugen. Seitliche Schiebetüren sind manuell (elektrisch nur bei den K0-Transportern), BSG die Aufbauherstellerschnittstelle, VCU/OBC/TBMU/CMEL die Elektroversionen (ab 2020). VTH ist das Blade-Head-up-Display (optional)'
      it: 'AEE2010 "evoluto" (BSI 2010 EV, da circa il 2016): stessa suddivisione di rete dell''AEE2010, utilizzato dalle auto EMP2 dal 2016 e dalle auto CMP. Le porte laterali scorrevoli sono manuali (elettriche solo sui furgoni K0), BSG l''interfaccia per allestitori, VCU/OBC/TBMU/CMEL le versioni elettriche (dal 2020). VTH è il display head-up a lama (opzionale)'
      pl: '"Rozwinięty" AEE2010 (BSI 2010 EV, od około 2016 roku): ten sam podział sieci co AEE2010, stosowany w samochodach EMP2 od 2016 roku oraz w samochodach CMP. Boczne drzwi przesuwne są ręczne (elektryczne tylko w furgonach K0), BSG to interfejs dla zabudowujących, VCU/OBC/TBMU/CMEL to wersje elektryczne (od 2020 roku). VTH to wyświetlacz przezierny typu "ostrze" (opcja)'
      ru: '"Улучшенная" AEE2010 (BSI 2010 EV, примерно с 2016 года): такое же разделение сети, как у AEE2010, используется в автомобилях EMP2 с 2016 года и в автомобилях CMP. Боковые сдвижные двери механические (электрические только на фургонах K0), BSG — интерфейс для кузовостроителей, VCU/OBC/TBMU/CMEL — электрические версии (с 2020 года). VTH — пластинчатый дисплей на лобовом стекле (опция)'
      zh: '"改进型"AEE2010(BSI 2010 EV,约自2016年起):网络划分与AEE2010相同,自2016年起用于EMP2车型及CMP车型。侧滑门为手动式(仅K0厢式货车为电动式),BSG为改装商接口,VCU/OBC/TBMU/CMEL为电动版本(自2020年起)。VTH为叶片式抬头显示器(选装)'
      hu: '"Továbbfejlesztett" AEE2010 (BSI 2010 EV, kb. 2016-tól): ugyanaz a hálózati felosztás, mint az AEE2010-nél, az EMP2 járműveknél 2016-tól és a CMP járműveknél használják. Az oldalsó tolóajtók kézi működtetésűek (elektromos csak a K0 furgonoknál), a BSG a felépítménygyártói interfész, a VCU/OBC/TBMU/CMEL az elektromos változatok (2020-tól). A VTH a lapkás head-up kijelző (opció)'
      pt: 'AEE2010 "evoluída" (BSI 2010 EV, a partir de cerca de 2016): mesma divisão de rede que a AEE2010, usada pelos automóveis EMP2 a partir de 2016 e pelos automóveis CMP. As portas laterais corrediças são manuais (elétricas apenas nas carrinhas K0), BSG a interface para carroçadores, VCU/OBC/TBMU/CMEL as versões elétricas (a partir de 2020). VTH é o head-up display em lâmina (opcional)'
