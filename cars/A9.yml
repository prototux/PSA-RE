  all:
    architecture: 'AEE2010.eco'
    years: '2012-2023'
    comment:
      en: 'Low cost "eco" variant of AEE2010: the body nodes share a single CAN HABITACLE bus (plus INFO-DIV for the cluster/head unit); the engine bay fuse box (BSM) does not seem to be a diagnosable CAN node on these cars. The touchscreen head unit is the BTEL, some cars have a plain radio (RAD)'
      fr: 'Variante "eco" economique de l''AEE2010 : les calculateurs habitacle partagent un unique bus CAN HABITACLE (plus INFO-DIV pour le combine et l''autoradio) ; le BSM ne semble pas etre un noeud CAN diagnosable sur ces voitures. L''ecran tactile est le BTEL, certaines voitures ont un simple autoradio (RAD)'
      es: 'Variante económica "eco" del AEE2010: los módulos del habitáculo comparten un único bus CAN HABITACLE (más INFO-DIV para el cuadro de instrumentos/unidad principal); la caja de fusibles del compartimento motor (BSM) no parece ser un nodo CAN diagnosticable en estos vehículos. La unidad principal con pantalla táctil es el BTEL, algunos vehículos tienen una radio simple (RAD)'
      de: 'kostengünstige „Eco"-Variante des AEE2010: Die Innenraumsteuergeräte teilen sich einen einzigen CAN-HABITACLE-Bus (plus INFO-DIV für Kombiinstrument/Head-Unit); der Sicherungskasten im Motorraum (BSM) scheint bei diesen Fahrzeugen kein diagnostizierbarer CAN-Knoten zu sein. Die Touchscreen-Head-Unit ist das BTEL, manche Fahrzeuge haben ein einfaches Radio (RAD)'
      it: 'Variante economica "eco" dell''AEE2010: le centraline abitacolo condividono un unico bus CAN HABITACLE (più INFO-DIV per quadro strumenti/unità centrale); la scatola fusibili vano motore (BSM) non sembra essere un nodo CAN diagnosticabile su queste vetture. L''unità centrale touchscreen è il BTEL, alcune vetture hanno una semplice autoradio (RAD)'
      pl: 'Ekonomiczny wariant "eco" AEE2010: sterowniki nadwozia współdzielą jedną magistralę CAN HABITACLE (plus INFO-DIV dla zestawu wskaźników/jednostki centralnej); skrzynka bezpieczników w komorze silnika (BSM) w tych pojazdach nie wydaje się być diagnozowalnym węzłem CAN. Jednostka centralna z ekranem dotykowym to BTEL, niektóre pojazdy mają zwykłe radio (RAD)'
      ru: 'Экономичный вариант "eco" AEE2010: блоки кузова используют единую шину CAN HABITACLE (плюс INFO-DIV для приборной панели/головного устройства); блок предохранителей моторного отсека (BSM), похоже, не является диагностируемым узлом CAN на этих автомобилях. Сенсорное головное устройство — BTEL, на некоторых автомобилях установлено простое радио (RAD)'
      zh: 'AEE2010的经济型"eco"变体：车身控制器共用一条CAN HABITACLE总线（另加用于仪表组/主机的INFO-DIV）；发动机舱保险丝盒（BSM）在这些车型上似乎不是可诊断的CAN节点。触摸屏主机为BTEL，部分车型配备普通收音机（RAD）'
      hu: 'Az AEE2010 alacsony költségű "eco" változata: a karosszéria-vezérlőegységek egyetlen közös CAN HABITACLE buszt használnak (plusz INFO-DIV a műszerfalhoz/fejegységhez); a motortéri biztosítékdoboz (BSM) ezeken az autókon úgy tűnik, nem diagnosztizálható CAN csomópont. Az érintőképernyős fejegység a BTEL, egyes autókon egyszerű rádió (RAD) van'
      pt: 'Variante económica "eco" do AEE2010: os módulos do habitáculo partilham um único bus CAN HABITACLE (mais o INFO-DIV para o quadro de instrumentos/autorrádio); a caixa de fusíveis do compartimento do motor (BSM) não parece ser um nó CAN diagnosticável nestes veículos. A unidade central com ecrã tátil é a BTEL, alguns veículos têm um autorrádio simples (RAD)'
