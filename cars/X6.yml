versions:
  all:
    architecture: 'AEE2004.full'
    years: '2005-2012'
    comment:
      en: 'Full CAN (CAN IS 500 kbit/s, CAN CONF and CAN CAR 125 kbit/s); late cars (2007-2008 onwards) got the "evolved" BSI generation. DEF is the mobile rear spoiler, BDCP the active bonnet pedestrian detection, VTH the head-up display. DEF (piloted rear spoiler, 2 deployment stages at about 65 and 125 km/h) and BDCP (active bonnet) are only fitted to the V6 versions (the 2.2 HDi has a fixed deflector); the C6 shares these two ECUs only with the Peugeot RCZ (the 408 II also has an active bonnet). CLIM_AR is the rear automatic climate control panel, BDM_A the rear seat memory'
      fr: 'Tout CAN (CAN IS 500 kbit/s, CAN CONF et CAN CAR 125 kbit/s) ; les dernières voitures (à partir de 2007-2008) ont reçu le BSI "évolué". DEF est le becquet mobile, BDCP la détection de choc piéton (capot actif), VTH l''affichage tête haute. DEF (becquet piloté, 2 positions vers 65 et 125 km/h) et BDCP (capot actif) n''équipent que les versions V6 (la 2.2 HDi a un déflecteur fixe) ; la C6 ne partage ces deux calculateurs qu''avec la Peugeot RCZ (la 408 II a aussi un capot actif). CLIM_AR est le pupitre de climatisation automatique arrière, BDM_A la mémorisation des sièges arrière'
      es: 'Todo CAN (CAN IS 500 kbit/s, CAN CONF y CAN CAR 125 kbit/s); los últimos coches (a partir de 2007-2008) recibieron el BSI "evolucionado". DEF es el alerón trasero móvil, BDCP la detección de atropello (capó activo), VTH la pantalla de proyección. DEF (alerón pilotado, 2 posiciones hacia 65 y 125 km/h) y BDCP (capó activo) solo equipan las versiones V6 (el 2.2 HDi tiene un deflector fijo); el C6 comparte estas dos unidades de control solo con el Peugeot RCZ (el 408 II también tiene capó activo). CLIM_AR es el panel de climatización automática trasera, BDM_A la memorización de los asientos traseros'
      de: 'Vollständig CAN (CAN IS 500 kbit/s, CAN CONF und CAN CAR 125 kbit/s); spätere Fahrzeuge (ab 2007-2008) erhielten das "weiterentwickelte" BSI. DEF ist der bewegliche Heckspoiler, BDCP die aktive Motorhaube zur Fußgängererkennung, VTH das Head-up-Display. DEF (gesteuerter Heckspoiler, 2 Stufen bei etwa 65 und 125 km/h) und BDCP (aktive Motorhaube) sind nur bei den V6-Versionen verbaut (der 2.2 HDi hat einen festen Deflektor); der C6 teilt sich diese beiden Steuergeräte nur mit dem Peugeot RCZ (der 408 II hat ebenfalls eine aktive Motorhaube). CLIM_AR ist das Bedienfeld der automatischen Klimaanlage hinten, BDM_A der Sitzspeicher hinten'
      it: 'Tutto CAN (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); le vetture più recenti (dal 2007-2008) hanno ricevuto il BSI "evoluto". DEF è lo spoiler posteriore mobile, BDCP il rilevamento pedone con cofano attivo, VTH il display head-up. DEF (spoiler pilotato, 2 posizioni a circa 65 e 125 km/h) e BDCP (cofano attivo) equipaggiano solo le versioni V6 (la 2.2 HDi ha un deflettore fisso); la C6 condivide queste due centraline solo con la Peugeot RCZ (anche la 408 II ha il cofano attivo). CLIM_AR è il pannello di climatizzazione automatica posteriore, BDM_A la memoria dei sedili posteriori'
      pl: 'Pełny CAN (CAN IS 500 kbit/s, CAN CONF i CAN CAR 125 kbit/s); późniejsze samochody (od 2007-2008) otrzymały "rozwinięty" BSI. DEF to ruchomy tylny spojler, BDCP to wykrywanie potrącenia pieszego z aktywną maską, VTH to wyświetlacz przezierny. DEF (sterowany spojler, 2 pozycje przy ok. 65 i 125 km/h) i BDCP (aktywna maska) montowane są tylko w wersjach V6 (2.2 HDi ma stały deflektor); C6 współdzieli te dwa sterowniki tylko z Peugeot RCZ (408 II również ma aktywną maskę). CLIM_AR to panel automatycznej klimatyzacji tylnej, BDM_A to pamięć foteli tylnych'
      ru: 'Полностью CAN (CAN IS 500 кбит/с, CAN CONF и CAN CAR 125 кбит/с); поздние автомобили (начиная примерно с 2007-2008) получили "улучшенное" BSI. DEF — подвижный задний спойлер, BDCP — обнаружение наезда на пешехода (активный капот), VTH — дисплей на лобовом стекле. DEF (управляемый спойлер, 2 положения на скорости около 65 и 125 км/ч) и BDCP (активный капот) устанавливаются только на версии V6 (2.2 HDi имеет фиксированный дефлектор); C6 использует эти два блока управления только совместно с Peugeot RCZ (у 408 II также есть активный капот). CLIM_AR — панель заднего автоматического климат-контроля, BDM_A — память задних сидений'
      zh: '全CAN总线(CAN IS 500 kbit/s,CAN CONF和CAN CAR 125 kbit/s);后期车型(2007-2008年起)配备"改进型"BSI。DEF为可移动后扰流板,BDCP为行人保护主动机罩检测,VTH为抬头显示器。DEF(可控扰流板,约65和125 km/h两级展开)和BDCP(主动机罩)仅配备于V6版本(2.2 HDi为固定式扰流板);C6仅与标致RCZ共用这两个控制单元(408 II也配备主动机罩)。CLIM_AR为后排自动空调面板,BDM_A为后排座椅记忆'
      hu: 'Teljes CAN (CAN IS 500 kbit/s, CAN CONF és CAN CAR 125 kbit/s); a későbbi (2007-2008-tól gyártott) autók a "továbbfejlesztett" BSI-t kapták. A DEF a mozgatható hátsó spoiler, a BDCP az aktív motorháztető gyalogosészlelés, a VTH a head-up kijelző. A DEF (vezérelt spoiler, 2 kiemelési fokozat kb. 65 és 125 km/h-nál) és a BDCP (aktív motorháztető) csak a V6 változatokat szereli fel (a 2.2 HDi-nek fix deflektora van); a C6 ezt a két vezérlőegységet csak a Peugeot RCZ-vel osztja meg (a 408 II-nek is van aktív motorháztetője). A CLIM_AR a hátsó automata klíma kezelőpanelje, a BDM_A a hátsó ülés memória'
      pt: 'Totalmente CAN (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); os automóveis mais recentes (a partir de 2007-2008) receberam o BSI "evoluído". DEF é o aerofólio traseiro móvel, BDCP a deteção de atropelamento (capot ativo), VTH o head-up display. DEF (aerofólio pilotado, 2 posições por volta dos 65 e 125 km/h) e BDCP (capot ativo) equipam apenas as versões V6 (o 2.2 HDi tem um defletor fixo); o C6 partilha estas duas unidades de controlo apenas com o Peugeot RCZ (o 408 II também tem capot ativo). CLIM_AR é o painel de climatização automática traseira, BDM_A a memorização dos bancos traseiros'
