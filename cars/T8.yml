  all:
    architecture: 'AEE2004.ev'
    years: '2009-2017'
    comment:
      en: 'Designed around the 2007 evolution of AEE2004 ("evolved" BSI, evolved engine bay fuse box, LIN battery sensor): same CAN IS / CAN CONF / CAN CAR split as AEE2004. ARTIV is the distance alert radar, VTH the head-up display, HCU1/HCU2 the HYbrid4 controllers (T84HY only)'
      fr: 'Conçue autour de l''evolution 2007 de l''AEE2004 (BSI "évolué", BSM évolué, capteur batterie LIN) : même découpage CAN IS / CAN CONF / CAN CAR que l''AEE2004. ARTIV est le radar d''alerte de distance, VTH l''affichage tete haute, HCU1/HCU2 les calculateurs HYbrid4 (T84HY uniquement)'
      es: 'Diseñada en torno a la evolución de 2007 del AEE2004 (BSI "evolucionado", caja de fusibles del compartimento motor evolucionada, sensor de batería LIN): misma división CAN IS / CAN CONF / CAN CAR que el AEE2004. ARTIV es el radar de alerta de distancia, VTH la pantalla frontal (head-up), HCU1/HCU2 las unidades de control HYbrid4 (solo T84HY)'
      de: 'basierend auf der 2007er Weiterentwicklung des AEE2004 (weiterentwickeltes BSI, weiterentwickelter Sicherungskasten im Motorraum, LIN-Batteriesensor): gleiche CAN-IS-/CAN-CONF-/CAN-CAR-Aufteilung wie AEE2004. ARTIV ist der Abstandswarnradar, VTH das Head-up-Display, HCU1/HCU2 die HYbrid4-Steuergeräte (nur T84HY)'
      it: 'Progettata sull''evoluzione 2007 dell''AEE2004 (BSI "evoluto", scatola fusibili vano motore evoluta, sensore batteria LIN): stessa suddivisione CAN IS / CAN CONF / CAN CAR dell''AEE2004. ARTIV è il radar di allerta distanza, VTH il display head-up, HCU1/HCU2 le centraline HYbrid4 (solo T84HY)'
      pl: 'Zaprojektowana na bazie ewolucji AEE2004 z 2007 roku ("rozwinięty" BSI, rozwinięta skrzynka bezpieczników w komorze silnika, czujnik akumulatora LIN): taki sam podział CAN IS / CAN CONF / CAN CAR jak w AEE2004. ARTIV to radar ostrzegania o odległości, VTH to wyświetlacz przezierny, HCU1/HCU2 to sterowniki HYbrid4 (tylko T84HY)'
      ru: 'Разработана на основе версии AEE2004 2007 года («улучшенный» BSI, улучшенный блок предохранителей моторного отсека, LIN-датчик батареи): такое же разделение CAN IS / CAN CONF / CAN CAR, как у AEE2004. ARTIV — радар предупреждения о дистанции, VTH — проекционный дисплей, HCU1/HCU2 — блоки управления HYbrid4 (только T84HY)'
      zh: '基于AEE2004（2004年电气架构）2007年改进版设计（"升级版"BSI、升级版发动机舱保险丝盒、LIN电池传感器）：与AEE2004相同的CAN IS/CAN CONF/CAN CAR划分。ARTIV为车距警示雷达，VTH为抬头显示，HCU1/HCU2为HYbrid4控制器（仅T84HY）'
      hu: 'Az AEE2004 2007-es fejlesztésére épül ("fejlesztett" BSI, fejlesztett motortéri biztosítékdoboz, LIN akkumulátorérzékelő): ugyanaz a CAN IS / CAN CONF / CAN CAR felosztás, mint az AEE2004-nél. Az ARTIV a távolságfigyelmeztető radar, a VTH a head-up kijelző, a HCU1/HCU2 a HYbrid4 vezérlőegységek (csak T84HY)'
      pt: 'Concebida com base na evolução de 2007 do AEE2004 (BSI "evoluído", caixa de fusíveis do compartimento do motor evoluída, sensor de bateria LIN): a mesma divisão CAN IS / CAN CONF / CAN CAR do AEE2004. O ARTIV é o radar de alerta de distância, o VTH o head-up display, os HCU1/HCU2 as unidades de controlo HYbrid4 (apenas T84HY)'
