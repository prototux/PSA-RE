codes:
  T84: 'peugeot 3008'
  T84HY: 'peugeot 3008 HYbrid4'  # diesel-electric hybrid (4 wheel drive)
  T87: 'peugeot 5008'
  T88: 'peugeot 3008 ph2 (China)'  # chinese facelift (2016)

