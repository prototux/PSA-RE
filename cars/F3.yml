  all:
    architecture: 'AEE2010.ev'
    years: '2018-2024'
    comment:
      en: 'Diagnostic tools show a "BSI 2010 EV" on the facelifted Cactus, probably with the eco network split. "Evolved" AEE2010 (BSI 2010 EV, from about 2016): same network split as AEE2010, used by the EMP2 cars from 2016 and the CMP cars'
      fr: 'Les outils de diagnostic voient un "BSI 2010 EV" sur le Cactus restyle, probablement avec le découpage réseau eco. AEE2010 "évoluée" (BSI 2010 EV, à partir de 2016 environ) : même découpage réseau que l''AEE2010, utilisée par les voitures EMP2 à partir de 2016 et les voitures CMP'
      es: 'Las herramientas de diagnóstico muestran un "BSI 2010 EV" en el Cactus restilizado, probablemente con la división de red eco. AEE2010 "evolucionado" (BSI 2010 EV, a partir de 2016 aproximadamente): misma división de red que el AEE2010, utilizada por los vehículos EMP2 a partir de 2016 y los vehículos CMP'
      de: 'Diagnosetools zeigen beim facegelifteten Cactus ein "BSI 2010 EV", wahrscheinlich mit der Eco-Netzwerkaufteilung. „weiterentwickeltes" AEE2010 (BSI 2010 EV, ab etwa 2016): gleiche Netzwerkaufteilung wie AEE2010, verwendet bei EMP2-Fahrzeugen ab 2016 und CMP-Fahrzeugen'
      it: 'Gli strumenti diagnostici mostrano un "BSI 2010 EV" sulla Cactus restilizzata, probabilmente con la suddivisione di rete eco. AEE2010 "evoluto" (BSI 2010 EV, dal 2016 circa): stessa suddivisione di rete dell''AEE2010, utilizzata dalle vetture EMP2 dal 2016 e dalle vetture CMP'
      pl: 'Narzędzia diagnostyczne pokazują "BSI 2010 EV" w odświeżonym Cactusie, prawdopodobnie z podziałem sieci eco. "rozwinięty" AEE2010 (BSI 2010 EV, od około 2016 roku): taki sam podział sieci jak w AEE2010, stosowany w pojazdach EMP2 od 2016 roku oraz w pojazdach CMP'
      ru: 'Диагностические инструменты показывают "BSI 2010 EV" на рестайлинговом Cactus, вероятно с разделением сети eco. «улучшенный» AEE2010 (BSI 2010 EV, примерно с 2016 года): то же разделение сети, что и у AEE2010, используется на автомобилях EMP2 с 2016 года и автомобилях CMP'
      zh: '诊断工具在改款Cactus上显示"BSI 2010 EV"，可能采用eco网络划分。"升级版"AEE2010（BSI 2010 EV，约自2016年起）：网络划分与AEE2010相同，自2016年起用于EMP2车型及CMP车型'
      hu: 'A diagnosztikai eszközök "BSI 2010 EV"-t mutatnak a ráncfelvarrott Cactuson, valószínűleg az eco hálózati felosztással. "fejlesztett" AEE2010 (BSI 2010 EV, kb. 2016-tól): ugyanaz a hálózati felosztás, mint az AEE2010-nél, a 2016-tól gyártott EMP2 autóknál és a CMP autóknál használják'
      pt: 'As ferramentas de diagnóstico mostram um "BSI 2010 EV" no Cactus reestilizado, provavelmente com a divisão de rede eco. AEE2010 "evoluído" (BSI 2010 EV, a partir de cerca de 2016): mesma divisão de rede do AEE2010, utilizada pelos veículos EMP2 a partir de 2016 e pelos veículos CMP'
