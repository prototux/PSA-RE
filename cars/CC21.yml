  all:
    architecture: 'AEE2010.full'
    years: '2021-'
    comment:
      en: '"Smart Car" low cost platform (derived from CMP). Diagnostic tools call its body computer "BCCM" (listed here as BSI). Architecture not confirmed: kept as AEE2010 by default, it may be a dedicated low cost architecture'
      fr: 'Plateforme low cost "Smart Car" (derivee de CMP). Les outils de diagnostic appellent son calculateur habitacle "BCCM" (note BSI ici). Architecture non confirmee : gardee en AEE2010 par defaut, ce peut etre une architecture low cost dediee'
      es: 'Plataforma económica "Smart Car" (derivada de CMP). Las herramientas de diagnóstico llaman a su ordenador de carrocería "BCCM" (indicado aquí como BSI). Arquitectura sin confirmar: mantenida como AEE2010 por defecto, podría ser una arquitectura económica dedicada'
      de: 'Kostengünstige "Smart Car"-Plattform (abgeleitet von CMP). Diagnosetools bezeichnen den Bordcomputer als "BCCM" (hier als BSI gelistet). Architektur nicht bestätigt: standardmäßig als AEE2010 beibehalten, könnte eine eigene kostengünstige Architektur sein'
      it: 'Piattaforma low cost "Smart Car" (derivata da CMP). Gli strumenti diagnostici chiamano la sua centralina abitacolo "BCCM" (indicata qui come BSI). Architettura non confermata: mantenuta come AEE2010 di default, potrebbe essere un''architettura low cost dedicata'
      pl: 'Platforma niskokosztowa "Smart Car" (pochodna CMP). Narzędzia diagnostyczne nazywają jej komputer nadwozia "BCCM" (tutaj oznaczony jako BSI). Architektura niepotwierdzona: domyślnie oznaczona jako AEE2010, może to być dedykowana architektura niskokosztowa'
      ru: 'Недорогая платформа "Smart Car" (производная от CMP). Диагностические инструменты называют её бортовой компьютер "BCCM" (здесь указан как BSI). Архитектура не подтверждена: по умолчанию отнесена к AEE2010, может быть выделенной недорогой архитектурой'
      zh: '低成本"Smart Car"平台（源自CMP）。诊断工具将其车身电脑称为"BCCM"（此处列为BSI）。架构未经证实：默认归类为AEE2010，也可能是专用的低成本架构'
      hu: 'Alacsony költségű "Smart Car" platform (a CMP-ből származik). A diagnosztikai eszközök a karosszériaszámítógépét "BCCM"-nek nevezik (itt BSI-ként szerepel). Az architektúra nem megerősített: alapértelmezés szerint AEE2010-ként szerepel, de lehet egy dedikált alacsony költségű architektúra'
      pt: 'Plataforma económica "Smart Car" (derivada da CMP). As ferramentas de diagnóstico chamam ao seu computador de carroçaria "BCCM" (indicado aqui como BSI). Arquitetura não confirmada: mantida como AEE2010 por predefinição, pode ser uma arquitetura económica dedicada'
