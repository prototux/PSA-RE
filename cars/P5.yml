versions:
  all:
    architecture: 'NEA2020.full'
    years: '2021-'
    comment:
      en: 'New electronic architecture ("NEA", sometimes called NEA2020) with a central vehicle supervisor (VSM, listed here as BSI) replacing the AEE2010 BSI. Not an AEE2010 variant: the architecture name is a proposal, and the network split of the nodes below is not documented (placed by analogy with AEE2010). Only the 408 II (P54) has BVN (Night Vision infrared camera, option) and the pyrotechnic active bonnet (BDCP; whether its pedestrian impact detection is a separate ECU is not confirmed)'
      fr: 'Nouvelle architecture électronique ("NEA", parfois appelée NEA2020) avec un superviseur central (VSM, noté BSI ici) qui remplace le BSI AEE2010. Ce n''est pas une variante de l''AEE2010 : le nom d''architecture est une proposition et la répartition des calculateurs par réseau n''est pas documentée (placée par analogie avec l''AEE2010). Seule la 408 II (P54) a BVN (caméra infrarouge Night Vision, option) et le capot actif pyrotechnique (BDCP ; un calculateur séparé de détection de choc piéton n''est pas confirmé)'
      es: 'Nueva arquitectura electrónica ("NEA", a veces llamada NEA2020) con un supervisor central del vehículo (VSM, indicado aquí como BSI) que sustituye al BSI AEE2010. No es una variante del AEE2010: el nombre de la arquitectura es una propuesta, y el reparto de los nodos por red no está documentado (situado por analogía con el AEE2010). Solo el 408 II (P54) tiene BVN (cámara infrarroja Night Vision, opcional) y el capó activo pirotécnico (BDCP; no está confirmado si su detección de atropello es una unidad de control separada)'
      de: 'Neue elektronische Architektur ("NEA", manchmal NEA2020 genannt) mit einem zentralen Fahrzeugsupervisor (VSM, hier als BSI bezeichnet), der das BSI der AEE2010 ersetzt. Keine Variante der AEE2010: Der Architekturname ist ein Vorschlag, und die Netzwerkaufteilung der unten genannten Steuergeräte ist nicht dokumentiert (in Analogie zur AEE2010 platziert). Nur der 408 II (P54) hat BVN (Night-Vision-Infrarotkamera, optional) und die pyrotechnische aktive Motorhaube (BDCP; ob deren Fußgänger-Aufprallerkennung ein separates Steuergerät ist, ist nicht bestätigt)'
      it: 'Nuova architettura elettronica ("NEA", talvolta chiamata NEA2020) con un supervisore centrale del veicolo (VSM, qui indicato come BSI) che sostituisce il BSI AEE2010. Non è una variante dell''AEE2010: il nome dell''architettura è una proposta e la suddivisione in rete dei nodi sottostanti non è documentata (collocata per analogia con l''AEE2010). Solo la 408 II (P54) ha BVN (telecamera a infrarossi Night Vision, opzionale) e il cofano attivo pirotecnico (BDCP; non è confermato se il rilevamento urto pedone sia una centralina separata)'
      pl: 'Nowa architektura elektroniczna ("NEA", czasem nazywana NEA2020) z centralnym nadzorcą pojazdu (VSM, oznaczonym tu jako BSI), zastępującym BSI z AEE2010. To nie jest wariant AEE2010: nazwa architektury jest propozycją, a podział węzłów na sieci poniżej nie jest udokumentowany (umieszczony przez analogię do AEE2010). Tylko 408 II (P54) ma BVN (kamerę na podczerwień Night Vision, opcja) oraz pirotechniczną aktywną maskę (BDCP; nie potwierdzono, czy wykrywanie potrącenia pieszego to osobny sterownik)'
      ru: 'Новая электронная архитектура ("NEA", иногда называемая NEA2020) с центральным супервизором автомобиля (VSM, здесь обозначен как BSI), заменяющим BSI архитектуры AEE2010. Это не вариант AEE2010: название архитектуры является предположением, а распределение узлов по сетям ниже не задокументировано (указано по аналогии с AEE2010). Только у 408 II (P54) есть BVN (инфракрасная камера Night Vision, опция) и пиротехнический активный капот (BDCP; не подтверждено, является ли обнаружение наезда на пешехода отдельным блоком управления)'
      zh: '全新电子架构("NEA",有时称为NEA2020),配备中央车辆监控器(VSM,此处标注为BSI),取代AEE2010的BSI。这不是AEE2010的变体:架构名称为推测名称,以下节点的网络划分未有文档记录(按照AEE2010的方式推测排列)。只有408 II(P54)配备BVN(Night Vision红外摄像头,选装)和烟火式主动机罩(BDCP;其行人碰撞检测是否为独立控制单元尚未确认)'
      hu: 'Új elektronikus architektúra ("NEA", néha NEA2020 néven is emlegetik) központi jármű-felügyelővel (VSM, itt BSI-ként szerepel), amely felváltja az AEE2010 BSI-jét. Nem az AEE2010 egy változata: az architektúra neve feltételezés, és az alábbi csomópontok hálózati elosztása nincs dokumentálva (az AEE2010 mintájára helyezve el). Csak a 408 II-nek (P54) van BVN-je (Night Vision infravörös kamera, opció) és pirotechnikus aktív motorháztetője (BDCP; nem megerősített, hogy a gyalogosütközés-érzékelés külön vezérlőegység-e)'
      pt: 'Nova arquitetura eletrónica ("NEA", por vezes chamada NEA2020) com um supervisor central do veículo (VSM, aqui designado por BSI) que substitui o BSI da AEE2010. Não é uma variante da AEE2010: o nome da arquitetura é uma proposta, e a repartição dos nós pela rede não está documentada (colocada por analogia com a AEE2010). Apenas o 408 II (P54) tem BVN (câmara infravermelhos Night Vision, opcional) e o capot ativo pirotécnico (BDCP; não está confirmado se a sua deteção de atropelamento é uma unidade de controlo separada)'
