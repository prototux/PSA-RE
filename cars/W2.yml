  all:
    architecture: 'AEE2010.full'
    years: '2010-2018'
    comment:
      en: 'One of the first AEE2010 cars. Second generation full CAN: HS (IS, LAS...) for powertrain/chassis, LS CONF/CAR/INFO-DIV for body and infotainment, several LIN buses behind the BSI. HCU1/HCU2 are the HYbrid4 controllers, CAFR the automatic high beam, BCM the SW power tailgate, BEBA the active engine mount. CLIM_AR is the rear panel of the quad-zone climate control (option)'
      fr: 'Une des premières voitures AEE2010. Tout CAN de deuxième génération : HS (IS, LAS...) pour la chaîne de traction/liaison au sol, LS CONF/CAR/INFO-DIV pour l''habitacle et l''info-divertissement, plusieurs bus LIN derrière le BSI. HCU1/HCU2 sont les calculateurs HYbrid4, CAFR la commutation automatique des feux de route, BCM le hayon motorisé du SW, BEBA le batteur actif. CLIM_AR est le pupitre arrière de la climatisation quadrizone (option)'
      es: 'Uno de los primeros coches AEE2010. CAN completo de segunda generación: HS (IS, LAS...) para la cadena cinemática/tren de rodaje, LS CONF/CAR/INFO-DIV para la carrocería y el infoentretenimiento, varios buses LIN detrás del BSI. HCU1/HCU2 son las unidades de control HYbrid4, CAFR la conmutación automática de las luces de carretera, BCM el portón trasero motorizado del SW, BEBA el soporte de motor activo. CLIM_AR es el panel trasero de la climatización de cuatro zonas (opcional)'
      de: 'Eines der ersten AEE2010-Fahrzeuge. Vollständiges CAN der zweiten Generation: HS (IS, LAS...) für Antriebsstrang/Fahrwerk, LS CONF/CAR/INFO-DIV für Karosserie und Infotainment, mehrere LIN-Busse hinter dem BSI. HCU1/HCU2 sind die HYbrid4-Steuergeräte, CAFR die automatische Fernlichtumschaltung, BCM die elektrische Heckklappe des SW, BEBA das aktive Motorlager. CLIM_AR ist das Bedienfeld hinten der 4-Zonen-Klimaautomatik (optional)'
      it: 'Una delle prime vetture AEE2010. CAN completo di seconda generazione: HS (IS, LAS...) per catena cinematica/telaio, LS CONF/CAR/INFO-DIV per carrozzeria e infotainment, diversi bus LIN dietro il BSI. HCU1/HCU2 sono le centraline HYbrid4, CAFR la commutazione automatica degli abbaglianti, BCM il portellone motorizzato della SW, BEBA il supporto motore attivo. CLIM_AR è il pannello posteriore del climatizzatore a quattro zone (opzionale)'
      pl: 'Jeden z pierwszych samochodów AEE2010. Pełna sieć CAN drugiej generacji: HS (IS, LAS...) dla układu napędowego/podwozia, LS CONF/CAR/INFO-DIV dla nadwozia i systemu multimedialnego, kilka magistrali LIN za BSI. HCU1/HCU2 to sterowniki HYbrid4, CAFR to automatyczne przełączanie świateł drogowych, BCM to elektryczna klapa bagażnika w wersji SW, BEBA to aktywne zawieszenie silnika. CLIM_AR to tylny panel czterostrefowej klimatyzacji (opcja)'
      ru: 'Один из первых автомобилей AEE2010. Полностью CAN второго поколения: HS (IS, LAS...) для трансмиссии/шасси, LS CONF/CAR/INFO-DIV для кузова и мультимедиа, несколько шин LIN за BSI. HCU1/HCU2 — блоки управления HYbrid4, CAFR — автоматическое переключение дальнего света, BCM — электропривод багажника версии SW, BEBA — активная опора двигателя. CLIM_AR — задняя панель четырёхзонного климат-контроля (опция)'
      zh: '首批AEE2010车型之一。第二代全CAN总线:HS(IS、LAS等)用于动力总成/底盘,LS CONF/CAR/INFO-DIV用于车身和信息娱乐系统,BSI后方还有多条LIN总线。HCU1/HCU2为HYbrid4混合动力控制器,CAFR为自动远光灯切换,BCM为SW旅行版电动尾门,BEBA为主动发动机悬置。CLIM_AR为四区空调后排面板(选装)'
      hu: 'Az egyik első AEE2010 autó. Második generációs teljes CAN: HS (IS, LAS...) a hajtáslánchoz/alvázhoz, LS CONF/CAR/INFO-DIV a karosszériához és az infotainmenthez, több LIN busz a BSI mögött. A HCU1/HCU2 a HYbrid4 vezérlőegységek, a CAFR az automata távolsági fényváltás, a BCM az SW kombi motoros csomagtérajtója, a BEBA az aktív motortartó. A CLIM_AR a négyzónás klíma hátsó panelje (opció)'
      pt: 'Um dos primeiros automóveis AEE2010. CAN completo de segunda geração: HS (IS, LAS...) para o grupo motopropulsor/chassis, LS CONF/CAR/INFO-DIV para a carroçaria e o info-entretenimento, vários barramentos LIN atrás do BSI. HCU1/HCU2 são as unidades de controlo HYbrid4, CAFR a comutação automática dos máximos, BCM a porta da mala motorizada da SW, BEBA o apoio de motor ativo. CLIM_AR é o painel traseiro da climatização de quatro zonas (opcional)'
