brand: ['citroen', 'peugeot', 'fiat', 'other']
platform: 'Eurovan'
years: '2002-2005'
comment:
  en: 'Built by Sevel Nord on the Eurovan 2 base, but with PSA electronics. BCD is the "BTO" central warning lamps/odometer box, MDPLC the motorised sliding doors, TO1/TO2/TO3 the three sunroofs (independent controls, per the 807 handbook), CRT the head unit remote control'
  fr: 'Fabrique par Sevel Nord sur base Eurovan 2, mais avec une electronique PSA. BCD est le boitier temoins/odometre "BTO", MDPLC les portes coulissantes motorisees, TO1/TO2/TO3 les trois toits ouvrants (commandes independantes, notice de la 807), CRT la commande deportee de l''autoradio'
  es: 'Fabricada por Sevel Nord sobre la base Eurovan 2, pero con electrónica PSA. BCD es la caja de testigos/cuentakilómetros "BTO", MDPLC las puertas correderas motorizadas, TO1/TO2/TO3 los tres techos solares (mandos independientes, según el manual del 807), CRT el mando remoto del autorradio'
  de: 'Von Sevel Nord auf Basis des Eurovan 2 gebaut, jedoch mit PSA-Elektronik. BCD ist das "BTO"-Kontrollleuchten-/Kilometerzähler-Steuergerät, MDPLC die motorisierten Schiebetüren, TO1/TO2/TO3 die drei Schiebedächer (unabhängige Bedienung, laut Handbuch des 807), CRT die Fernbedienung des Radios'
  it: 'Costruita da Sevel Nord sulla base Eurovan 2, ma con elettronica PSA. BCD è la centralina spie/contachilometri "BTO", MDPLC le porte scorrevoli motorizzate, TO1/TO2/TO3 i tre tetti apribili (comandi indipendenti, secondo il manuale della 807), CRT il telecomando dell''autoradio'
  pl: 'Zbudowana przez Sevel Nord na bazie Eurovan 2, ale z elektroniką PSA. BCD to sterownik lampek kontrolnych/licznika przebiegu "BTO", MDPLC to zmotoryzowane drzwi przesuwne, TO1/TO2/TO3 to trzy szyberdachy (niezależne sterowanie, według instrukcji 807), CRT to zdalne sterowanie radiem'
  ru: 'Построена компанией Sevel Nord на базе Eurovan 2, но с электроникой PSA. BCD — блок контрольных ламп/одометра "BTO", MDPLC — моторизованные сдвижные двери, TO1/TO2/TO3 — три люка (независимое управление, согласно руководству 807), CRT — пульт дистанционного управления радио'
  zh: '由Sevel Nord基于Eurovan 2平台制造,但采用PSA电子系统。BCD为"BTO"警告灯/里程表控制盒,MDPLC为电动滑门,TO1/TO2/TO3为三个天窗(独立控制,依据807手册),CRT为主机遥控器'
  hu: 'A Sevel Nord gyártotta az Eurovan 2 alapokon, de PSA elektronikával. A BCD a "BTO" jelzőlámpa-/kilométeróra-egység, az MDPLC a motoros tolóajtók, a TO1/TO2/TO3 a három napfénytető (független vezérlés, a 807 kézikönyve szerint), a CRT a fejegység távirányítója'
  pt: 'Construída pela Sevel Nord com base na Eurovan 2, mas com eletrónica PSA. BCD é a caixa central de avisadores/conta-quilómetros "BTO", MDPLC as portas corrediças motorizadas, TO1/TO2/TO3 os três tetos de abrir (comandos independentes, segundo o manual do 807), CRT o comando remoto do autorrádio'

versions:
  all:
    architecture: 'AEE2001.full'
    years: '2002-2005'
    comment:
      en: 'Bi-VAN/CAN: CAN IS (250 kbit/s) for engine/gearbox/chassis, VAN comfort (125 kbit/s) for display, radio, clim, cluster, and VAN body buses (62.5 kbit/s) for airbag, COM2000, alarm and doors'
      fr: 'Bi-VAN/CAN : CAN IS (250 kbit/s) pour moteur/boîte/liaison au sol, VAN confort (125 kbit/s) pour écran, autoradio, clim, combiné, et VAN carrosserie (62.5 kbit/s) pour airbag, COM2000, alarme et portes'
      es: 'Bi-VAN/CAN: CAN IS (250 kbit/s) para motor/caja de cambios/chasis, VAN confort (125 kbit/s) para pantalla, radio, clima, cuadro de instrumentos, y bus VAN carrocería (62,5 kbit/s) para airbag, COM2000, alarma y puertas'
      de: 'Bi-VAN/CAN: CAN IS (250 kbit/s) für Motor/Getriebe/Fahrwerk, VAN Komfort (125 kbit/s) für Display, Radio, Klimaanlage, Kombiinstrument, und VAN-Karosseriebus (62,5 kbit/s) für Airbag, COM2000, Alarmanlage und Türen'
      it: 'Bi-VAN/CAN: CAN IS (250 kbit/s) per motore/cambio/telaio, VAN comfort (125 kbit/s) per display, autoradio, climatizzatore, quadro strumenti, e bus VAN carrozzeria (62,5 kbit/s) per airbag, COM2000, allarme e porte'
      pl: 'Bi-VAN/CAN: CAN IS (250 kbit/s) dla silnika/skrzyni biegów/podwozia, VAN komfort (125 kbit/s) dla wyświetlacza, radia, klimatyzacji, zestawu wskaźników, oraz magistrala VAN nadwozia (62,5 kbit/s) dla poduszki powietrznej, COM2000, alarmu i drzwi'
      ru: 'Bi-VAN/CAN: CAN IS (250 кбит/с) для двигателя/коробки передач/шасси, VAN комфорт (125 кбит/с) для дисплея, радио, кондиционера, приборной панели, и кузовная шина VAN (62,5 кбит/с) для подушки безопасности, COM2000, сигнализации и дверей'
      zh: '双VAN/CAN架构：CAN IS（250 kbit/s）用于发动机/变速箱/底盘，VAN舒适总线（125 kbit/s）用于显示屏、收音机、空调、仪表组，VAN车身总线（62.5 kbit/s）用于安全气囊、COM2000、报警器和车门'
      hu: 'Bi-VAN/CAN: CAN IS (250 kbit/s) a motorhoz/váltóhoz/futóműhöz, VAN komfort (125 kbit/s) a kijelzőhöz, rádióhoz, klímához, műszerfalhoz, és VAN karosszéria busz (62,5 kbit/s) a légzsákhoz, COM2000-hez, riasztóhoz és ajtókhoz'
      pt: 'Bi-VAN/CAN: CAN IS (250 kbit/s) para motor/caixa de velocidades/chassis, VAN conforto (125 kbit/s) para ecrã, rádio, climatização, quadro de instrumentos, e bus VAN carroçaria (62,5 kbit/s) para airbag, COM2000, alarme e portas'
