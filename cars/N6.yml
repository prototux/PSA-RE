      pt: 'Xsara fase 1, não multiplexado'
  xsara_van:
    architecture: 'AEE2001.full'
    years: '2000'
    codes: ['N6']
    comment:
      en: 'From january 2000 the Xsara got a BSI with a VAN comfort network only (no CAN)'
      fr: 'À partir de janvier 2000 la Xsara recoit un BSI avec un seul réseau VAN confort (pas de CAN)'
      es: 'A partir de enero de 2000, el Xsara recibió un BSI con una única red VAN confort (sin CAN)'
      de: 'Ab Januar 2000 erhielt der Xsara ein BSI mit nur einem VAN-Komfortnetzwerk (kein CAN)'
      it: 'Da gennaio 2000 la Xsara ha ricevuto un BSI con una sola rete VAN comfort (nessun CAN)'
      pl: 'Od stycznia 2000 roku Xsara otrzymała BSI z jedną siecią VAN komfort (bez CAN)'
      ru: 'С января 2000 года Xsara получила BSI только с одной комфортной сетью VAN (без CAN)'
      zh: '自2000年1月起，Xsara配备了仅有单一VAN舒适网络的BSI（无CAN）'
      hu: '2000 januárjától a Xsara egyetlen VAN komfort hálózattal rendelkező BSI-t kapott (CAN nélkül)'
      pt: 'A partir de janeiro de 2000, o Xsara passou a ter um BSI com uma única rede VAN conforto (sem CAN)'
    nodes:
      VAN: ['BSI', 'CMB', 'RAD', 'CDC', 'CLIM_AV']
    optional_nodes: ['CDC']
    buses: ['VAN.CAR', 'VAN.CONF']
  picasso_van:
    architecture: 'AEE2001.full'
    years: '1999-2002'
    codes: ['N68']
    comment:
      en: 'First mass produced multiplexed Citroen: one VAN comfort bus with up to 7 ECUs (BSI, radio, CD changer, navigation, display, cluster, clim)'
      fr: 'Première Citroen multiplexée de grande série : un bus VAN confort avec jusqu''à 7 calculateurs (BSI, autoradio, changeur CD, navigation, écran, combiné, clim)'
      es: 'Primer Citroën multiplexado producido en serie: un bus VAN confort con hasta 7 unidades de control (BSI, radio, cambiador de CD, navegación, pantalla, cuadro de instrumentos, clima)'
      de: 'Erster in Serie produzierter multiplex Citroën: ein VAN-Komfortbus mit bis zu 7 Steuergeräten (BSI, Radio, CD-Wechsler, Navigation, Display, Kombiinstrument, Klimaanlage)'
      it: 'Prima Citroën multiplata di grande serie: un bus VAN comfort con fino a 7 centraline (BSI, autoradio, cambia CD, navigazione, display, quadro strumenti, climatizzatore)'
      pl: 'Pierwszy masowo produkowany multipleksowany Citroën: jedna magistrala VAN komfort z maksymalnie 7 sterownikami (BSI, radio, zmieniarka CD, nawigacja, wyświetlacz, zestaw wskaźników, klimatyzacja)'
      ru: 'Первый серийный мультиплексный Citroën: одна комфортная шина VAN с до 7 блоками управления (BSI, радио, CD-чейнджер, навигация, дисплей, приборная панель, кондиционер)'
      zh: '首款量产多路复用雪铁龙：一条VAN舒适总线连接最多7个控制器（BSI、收音机、CD换碟机、导航、显示屏、仪表组、空调）'
      hu: 'Az első tömeggyártású multiplex Citroën: egy VAN komfort busz akár 7 vezérlőegységgel (BSI, rádió, CD-váltó, navigáció, kijelző, műszerfal, klíma)'
      pt: 'Primeiro Citroën multiplexado produzido em série: um bus VAN conforto com até 7 unidades de controlo (BSI, rádio, carregador de CD, navegação, ecrã, quadro de instrumentos, climatização)'
    nodes:
      VAN: ['BSI', 'CMB', 'EMF', 'RAD', 'CDC', 'BTEL', 'CLIM_AV']
    optional_nodes: ['CDC', 'BTEL']
    buses: ['VAN.CAR', 'VAN.CONF']
  picasso_vancan:
    architecture: 'AEE2001.full'
    years: '2002-2012'
    codes: ['N68']
    comment:
      en: 'From november 2002: bi-VAN/CAN architecture (BSI shared with the Berlingo M59), kept until the end of production'
      fr: 'À partir de novembre 2002 : architecture bi-VAN/CAN (BSI commun avec le Berlingo M59), conservee jusqu''à la fin'
      es: 'A partir de noviembre de 2002: arquitectura bi-VAN/CAN (BSI compartido con el Berlingo M59), mantenida hasta el final de la producción'
      de: 'Ab November 2002: Bi-VAN/CAN-Architektur (BSI gemeinsam mit dem Berlingo M59), beibehalten bis zum Produktionsende'
      it: 'Da novembre 2002: architettura bi-VAN/CAN (BSI condiviso con il Berlingo M59), mantenuta fino alla fine della produzione'
      pl: 'Od listopada 2002 roku: architektura bi-VAN/CAN (BSI wspólny z Berlingo M59), zachowana do końca produkcji'
      ru: 'С ноября 2002 года: архитектура bi-VAN/CAN (BSI общий с Berlingo M59), сохранялась до конца производства'
      zh: '自2002年11月起：双VAN/CAN架构（与Berlingo M59共用BSI），一直沿用至生产结束'
      hu: '2002 novemberétől: bi-VAN/CAN architektúra (a Berlingo M59-cel közös BSI), a gyártás végéig megtartva'
      pt: 'A partir de novembro de 2002: arquitetura bi-VAN/CAN (BSI partilhado com o Berlingo M59), mantida até ao fim da produção'
    nodes:
      HS: ['BSI', 'CMM', 'BVA', 'ABS']
      VAN: ['BSI', 'HDC', 'CMB', 'EMF', 'RAD', 'BTEL', 'CDC', 'CLIM_AV', 'RBG', 'ALARM', 'AAS', 'CDPL', 'ADDGO']
    optional_nodes: ['BVA', 'ABS', 'BTEL', 'CDC', 'ALARM', 'AAS', 'CDPL', 'ADDGO']
    buses: ['HS.IS', 'VAN.CAR', 'VAN.CONF']
