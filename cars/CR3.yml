    architecture: 'NEA2020.full'
    years: '2025-'
    comment:
      en: 'New electronic architecture ("NEA", sometimes called NEA2020) with a central vehicle supervisor (VSM, listed here as BSI) replacing the AEE2010 BSI. Not an AEE2010 variant: the architecture name is a proposal, and the network split of the nodes below is not documented (placed by analogy with AEE2010). VTH is the extended head-up display, BRNC the seat heating (heated rear seats are a first for a Citroen)'
      fr: 'Nouvelle architecture electronique ("NEA", parfois appelee NEA2020) avec un superviseur central (VSM, note BSI ici) qui remplace le BSI AEE2010. Ce n''est pas une variante de l''AEE2010 : le nom d''architecture est une proposition et la repartition des calculateurs par reseau n''est pas documentee (placee par analogie avec l''AEE2010). VTH est l''affichage tete haute etendu, BRNC le chauffage des sieges (sieges arriere chauffants, une premiere chez Citroen)'
      es: 'Nueva arquitectura electrónica ("NEA", a veces llamada NEA2020) con un supervisor central del vehículo (VSM, indicado aquí como BSI) que sustituye al BSI AEE2010. No es una variante del AEE2010: el nombre de la arquitectura es una propuesta, y el reparto de los nodos por red no está documentado (situado por analogía con el AEE2010). El VTH es la pantalla de proyección extendida, el BRNC la calefacción de los asientos (asientos traseros calefactados, una primicia en Citroën)'
      de: 'Neue elektronische Architektur ("NEA", manchmal NEA2020 genannt) mit einem zentralen Fahrzeugsupervisor (VSM, hier als BSI bezeichnet), der das BSI der AEE2010 ersetzt. Keine Variante der AEE2010: Der Architekturname ist ein Vorschlag, und die Netzwerkaufteilung der unten genannten Steuergeräte ist nicht dokumentiert (in Analogie zur AEE2010 platziert). VTH ist das erweiterte Head-up-Display, BRNC die Sitzheizung (beheizte Rücksitze, eine Premiere bei Citroën)'
      it: 'Nuova architettura elettronica ("NEA", talvolta chiamata NEA2020) con un supervisore centrale del veicolo (VSM, qui indicato come BSI) che sostituisce il BSI AEE2010. Non è una variante dell''AEE2010: il nome dell''architettura è una proposta e la suddivisione in rete dei nodi sottostanti non è documentata (collocata per analogia con l''AEE2010). Il VTH è il display head-up esteso, il BRNC il riscaldamento dei sedili (sedili posteriori riscaldati, una novità per Citroën)'
      pl: 'Nowa architektura elektroniczna ("NEA", czasem nazywana NEA2020) z centralnym nadzorcą pojazdu (VSM, oznaczonym tu jako BSI), zastępującym BSI z AEE2010. To nie jest wariant AEE2010: nazwa architektury jest propozycją, a podział węzłów na sieci poniżej nie jest udokumentowany (umieszczony przez analogię do AEE2010). VTH to rozszerzony wyświetlacz przezierny, BRNC to ogrzewanie siedzeń (podgrzewane tylne siedzenia, pierwsze w historii Citroëna)'
      ru: 'Новая электронная архитектура ("NEA", иногда называемая NEA2020) с центральным супервизором автомобиля (VSM, здесь обозначен как BSI), заменяющим BSI архитектуры AEE2010. Это не вариант AEE2010: название архитектуры является предположением, а распределение узлов по сетям ниже не задокументировано (указано по аналогии с AEE2010). VTH — расширенный дисплей на лобовом стекле, BRNC — подогрев сидений (подогрев задних сидений впервые появился у Citroën)'
      zh: '全新电子架构("NEA",有时称为NEA2020),配备中央车辆监控器(VSM,此处标注为BSI),取代AEE2010的BSI。这不是AEE2010的变体:架构名称为推测名称,以下节点的网络划分未有文档记录(按照AEE2010的方式推测排列)。VTH为扩展型抬头显示器,BRNC为座椅加热(后排座椅加热为雪铁龙首创)'
      hu: 'Új elektronikus architektúra ("NEA", néha NEA2020 néven is emlegetik) központi jármű-felügyelővel (VSM, itt BSI-ként szerepel), amely felváltja az AEE2010 BSI-jét. Nem az AEE2010 egy változata: az architektúra neve feltételezés, és az alábbi csomópontok hálózati elosztása nincs dokumentálva (az AEE2010 mintájára helyezve el). A VTH a kibővített head-up kijelző, a BRNC az ülésfűtés (fűthető hátsó ülések, ez a Citroënnél egy újdonság)'
      pt: 'Nova arquitetura eletrónica ("NEA", por vezes chamada NEA2020) com um supervisor central do veículo (VSM, aqui designado por BSI) que substitui o BSI da AEE2010. Não é uma variante da AEE2010: o nome da arquitetura é uma proposta, e a repartição dos nós pela rede não está documentada (colocada por analogia com a AEE2010). O VTH é o head-up display alargado, o BRNC o aquecimento dos bancos (bancos traseiros aquecidos, uma novidade na Citroën)'
