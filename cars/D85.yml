    comment:
      en: 'New electronic architecture ("NEA", sometimes called NEA2020) with a central vehicle supervisor (VSM, listed here as BSI) replacing the AEE2010 BSI. Not an AEE2010 variant: the architecture name is a proposal, and the network split of the nodes below is not documented (placed by analogy with AEE2010)'
      fr: 'Nouvelle architecture electronique ("NEA", parfois appelee NEA2020) avec un superviseur central (VSM, note BSI ici) qui remplace le BSI AEE2010. Ce n''est pas une variante de l''AEE2010 : le nom d''architecture est une proposition et la repartition des calculateurs par reseau n''est pas documentee (placee par analogie avec l''AEE2010)'
      es: 'Nueva arquitectura electrónica ("NEA", a veces llamada NEA2020) con un supervisor central del vehículo (VSM, indicado aquí como BSI) que sustituye al BSI del AEE2010. No es una variante del AEE2010: el nombre de la arquitectura es una propuesta, y la división en redes de los nodos siguientes no está documentada (situada por analogía con el AEE2010)'
      de: 'Neue elektronische Architektur ("NEA", manchmal NEA2020 genannt) mit einem zentralen Fahrzeugüberwacher (VSM, hier als BSI gelistet), der das AEE2010-BSI ersetzt. Keine AEE2010-Variante: der Architekturname ist ein Vorschlag, und die Netzwerkaufteilung der unten aufgeführten Knoten ist nicht dokumentiert (in Analogie zu AEE2010 platziert)'
      it: 'Nuova architettura elettronica ("NEA", talvolta chiamata NEA2020) con un supervisore centrale del veicolo (VSM, indicato qui come BSI) che sostituisce il BSI dell''AEE2010. Non è una variante dell''AEE2010: il nome dell''architettura è una proposta, e la suddivisione in rete dei nodi sottostanti non è documentata (posizionata per analogia con l''AEE2010)'
      pl: 'Nowa architektura elektroniczna ("NEA", czasem nazywana NEA2020) z centralnym nadzorcą pojazdu (VSM, tutaj oznaczonym jako BSI), zastępującym BSI AEE2010. Nie jest to wariant AEE2010: nazwa architektury to propozycja, a podział sieci poniższych węzłów nie jest udokumentowany (umieszczony przez analogię z AEE2010)'
      ru: 'Новая электронная архитектура ("NEA", иногда называемая NEA2020) с центральным супервизором автомобиля (VSM, здесь указан как BSI), заменяющим BSI AEE2010. Это не вариант AEE2010: название архитектуры является предположением, а разделение сети приведённых ниже узлов не задокументировано (указано по аналогии с AEE2010)'
      zh: '新一代电子架构（"NEA"，有时称为NEA2020），采用中央车辆监控器（VSM，此处列为BSI）取代AEE2010的BSI。这不是AEE2010的变体：架构名称仅为拟定名称，下列节点的网络划分未经记录（依照AEE2010类推列出）'
      hu: 'Új elektronikai architektúra ("NEA", néha NEA2020-nak nevezik) központi jármű-felügyelővel (VSM, itt BSI-ként szerepel), amely felváltja az AEE2010 BSI-t. Nem az AEE2010 változata: az architektúra neve egy javaslat, az alábbi csomópontok hálózati felosztása nem dokumentált (az AEE2010 analógiájára elhelyezve)'
      pt: 'Nova arquitetura eletrónica ("NEA", por vezes chamada NEA2020) com um supervisor central do veículo (VSM, indicado aqui como BSI) que substitui o BSI do AEE2010. Não é uma variante do AEE2010: o nome da arquitetura é uma proposta, e a divisão em redes dos nós seguintes não está documentada (colocada por analogia com o AEE2010)'
    nodes:
