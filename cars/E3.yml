  all:
    architecture: 'AEE2010.eco'
    years: '2014-2018'
    comment:
      en: 'Low cost "eco" variant of AEE2010: the body nodes share a single CAN HABITACLE bus (plus INFO-DIV for the cluster/head unit); the engine bay fuse box (BSM) does not seem to be a diagnosable CAN node on these cars. Very few ECUs: the cluster is a simple digital display and most controls go through the touchscreen'
      fr: 'Variante "eco" economique de l''AEE2010 : les calculateurs habitacle partagent un unique bus CAN HABITACLE (plus INFO-DIV pour le combine et l''autoradio) ; le BSM ne semble pas etre un noeud CAN diagnosable sur ces voitures. Tres peu de calculateurs : le combine est un simple afficheur numerique et la plupart des commandes passent par l''ecran tactile'
      es: 'Variante económica "eco" del AEE2010: los módulos del habitáculo comparten un único bus CAN HABITACLE (más INFO-DIV para el cuadro de instrumentos/unidad principal); la caja de fusibles del compartimento motor (BSM) no parece ser un nodo CAN diagnosticable en estos vehículos. Muy pocas unidades de control: el cuadro de instrumentos es una simple pantalla digital y la mayoría de los mandos pasan por la pantalla táctil'
      de: 'kostengünstige „Eco"-Variante des AEE2010: Die Innenraumsteuergeräte teilen sich einen einzigen CAN-HABITACLE-Bus (plus INFO-DIV für Kombiinstrument/Head-Unit); der Sicherungskasten im Motorraum (BSM) scheint bei diesen Fahrzeugen kein diagnostizierbarer CAN-Knoten zu sein. Sehr wenige Steuergeräte: das Kombiinstrument ist ein einfaches Digitaldisplay, die meisten Bedienungen erfolgen über den Touchscreen'
      it: 'Variante economica "eco" dell''AEE2010: le centraline abitacolo condividono un unico bus CAN HABITACLE (più INFO-DIV per quadro strumenti/unità centrale); la scatola fusibili vano motore (BSM) non sembra essere un nodo CAN diagnosticabile su queste vetture. Pochissime centraline: il quadro strumenti è un semplice display digitale e la maggior parte dei comandi passa dal touchscreen'
      pl: 'Ekonomiczny wariant "eco" AEE2010: sterowniki nadwozia współdzielą jedną magistralę CAN HABITACLE (plus INFO-DIV dla zestawu wskaźników/jednostki centralnej); skrzynka bezpieczników w komorze silnika (BSM) w tych pojazdach nie wydaje się być diagnozowalnym węzłem CAN. Bardzo mało sterowników: zestaw wskaźników to zwykły wyświetlacz cyfrowy, a większość funkcji obsługuje się z ekranu dotykowego'
      ru: 'Экономичный вариант "eco" AEE2010: блоки кузова используют единую шину CAN HABITACLE (плюс INFO-DIV для приборной панели/головного устройства); блок предохранителей моторного отсека (BSM), похоже, не является диагностируемым узлом CAN на этих автомобилях. Очень мало блоков управления: приборная панель — это простой цифровой дисплей, а большинство функций управляется через сенсорный экран'
      zh: 'AEE2010的经济型"eco"变体：车身控制器共用一条CAN HABITACLE总线（另加用于仪表组/主机的INFO-DIV）；发动机舱保险丝盒（BSM）在这些车型上似乎不是可诊断的CAN节点。控制器极少：仪表组为简单数字显示屏，大部分操作通过触摸屏完成'
      hu: 'Az AEE2010 alacsony költségű "eco" változata: a karosszéria-vezérlőegységek egyetlen közös CAN HABITACLE buszt használnak (plusz INFO-DIV a műszerfalhoz/fejegységhez); a motortéri biztosítékdoboz (BSM) ezeken az autókon úgy tűnik, nem diagnosztizálható CAN csomópont. Nagyon kevés vezérlőegység: a műszerfal egyszerű digitális kijelző, a legtöbb funkciót az érintőképernyőn keresztül vezérlik'
      pt: 'Variante económica "eco" do AEE2010: os módulos do habitáculo partilham um único bus CAN HABITACLE (mais o INFO-DIV para o quadro de instrumentos/autorrádio); a caixa de fusíveis do compartimento do motor (BSM) não parece ser um nó CAN diagnosticável nestes veículos. Muito poucas unidades de controlo: o quadro de instrumentos é um simples mostrador digital e a maioria dos comandos passa pelo ecrã tátil'
