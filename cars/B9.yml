    years: '2008-2015'
    codes: ['B9']
    comment:
      en: 'Designed around the 2007 evolution of AEE2004 ("evolved" BSI, evolved engine bay fuse box, LIN battery sensor): same CAN IS / CAN CONF / CAN CAR split as AEE2004'
      fr: 'Conçue autour de l''evolution 2007 de l''AEE2004 (BSI "évolué", BSM évolué, capteur batterie LIN) : même découpage CAN IS / CAN CONF / CAN CAR que l''AEE2004'
      es: 'Diseñada en torno a la evolución de 2007 del AEE2004 (BSI "evolucionado", caja de fusibles del compartimento motor evolucionada, sensor de batería LIN): misma división CAN IS / CAN CONF / CAN CAR que el AEE2004'
      de: 'basierend auf der 2007er Weiterentwicklung des AEE2004 (weiterentwickeltes BSI, weiterentwickelter Sicherungskasten im Motorraum, LIN-Batteriesensor): gleiche CAN-IS-/CAN-CONF-/CAN-CAR-Aufteilung wie AEE2004'
      it: 'Progettata sull''evoluzione 2007 dell''AEE2004 (BSI "evoluto", scatola fusibili vano motore evoluta, sensore batteria LIN): stessa suddivisione CAN IS / CAN CONF / CAN CAR dell''AEE2004'
      pl: 'Zaprojektowana na bazie ewolucji AEE2004 z 2007 roku ("rozwinięty" BSI, rozwinięta skrzynka bezpieczników w komorze silnika, czujnik akumulatora LIN): taki sam podział CAN IS / CAN CONF / CAN CAR jak w AEE2004'
      ru: 'Разработана на основе версии AEE2004 2007 года («улучшенный» BSI, улучшенный блок предохранителей моторного отсека, LIN-датчик батареи): такое же разделение CAN IS / CAN CONF / CAN CAR, как у AEE2004'
      zh: '基于AEE2004（2004年电气架构）2007年改进版设计（"升级版"BSI、升级版发动机舱保险丝盒、LIN电池传感器）：与AEE2004相同的CAN IS/CAN CONF/CAN CAR划分'
      hu: 'Az AEE2004 2007-es fejlesztésére épül ("fejlesztett" BSI, fejlesztett motortéri biztosítékdoboz, LIN akkumulátorérzékelő): ugyanaz a CAN IS / CAN CONF / CAN CAR felosztás, mint az AEE2004-nél'
      pt: 'Concebida com base na evolução de 2007 do AEE2004 (BSI "evoluído", caixa de fusíveis do compartimento do motor evoluída, sensor de bateria LIN): a mesma divisão CAN IS / CAN CONF / CAN CAR do AEE2004'
