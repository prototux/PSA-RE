  electric:
    architecture: 'AEE2004.electric'
    years: '2013-2018'
    codes: ['B9E']
    comment:
      en: 'Electric version: the engine ECU is replaced by the PIU (Mitsubishi powertrain gateway, same diagnostic slot as the CMM) with the battery management (TBMU) behind it. The later B9E probably follow the 2015 switch to AEE2010 (see M69.yml)'
      fr: 'Version électrique : le calculateur moteur est remplace par le PIU (passerelle de la chaîne de traction Mitsubishi, même adresse de diagnostic que le CMM) avec la gestion batterie (TBMU) derrière. Les B9E récentes suivent probablement le passage à l''AEE2010 de 2015 (voir M69.yml)'
      es: 'Versión eléctrica: el módulo de control del motor se sustituye por el PIU (pasarela de la cadena de tracción Mitsubishi, misma dirección de diagnóstico que el CMM), con la gestión de batería (TBMU) detrás. Los B9E posteriores probablemente siguen el cambio al AEE2010 de 2015 (véase M69.yml)'
      de: 'Elektroversion: das Motorsteuergerät wird durch das PIU (Mitsubishi-Antriebsstrang-Gateway, gleiche Diagnoseadresse wie das CMM) ersetzt, mit dem Batteriemanagement (TBMU) dahinter. Die späteren B9E folgen wahrscheinlich dem Wechsel zu AEE2010 im Jahr 2015 (siehe M69.yml)'
      it: 'Versione elettrica: la centralina motore è sostituita dal PIU (gateway della catena di trazione Mitsubishi, stesso indirizzo diagnostico del CMM), con la gestione della batteria (TBMU) dietro. Le B9E successive probabilmente seguono il passaggio all''AEE2010 del 2015 (vedi M69.yml)'
      pl: 'Wersja elektryczna: sterownik silnika zastąpiony przez PIU (bramę układu napędowego Mitsubishi, ten sam adres diagnostyczny co CMM), z zarządzaniem akumulatorem (TBMU) za nim. Późniejsze B9E prawdopodobnie podążają za przejściem na AEE2010 z 2015 roku (patrz M69.yml)'
      ru: 'Электрическая версия: блок управления двигателем заменён на PIU (шлюз силового агрегата Mitsubishi, тот же диагностический адрес, что и у CMM), за которым следует управление батареей (TBMU). Более поздние B9E, вероятно, следуют переходу на AEE2010 в 2015 году (см. M69.yml)'
      zh: '电动版本：发动机控制器被PIU取代（三菱动力总成网关，与CMM诊断地址相同），其后为电池管理单元（TBMU）。较晚期的B9E可能遵循2015年转向AEE2010的变化（参见M69.yml）'
      hu: 'Elektromos verzió: a motorvezérlő egységet a PIU váltja fel (Mitsubishi hajtáslánc-átjáró, ugyanaz a diagnosztikai cím, mint a CMM-nél), mögötte az akkumulátor-kezeléssel (TBMU). A későbbi B9E valószínűleg követi a 2015-ös AEE2010-re váltást (lásd M69.yml)'
      pt: 'Versão elétrica: a unidade de controlo do motor é substituída pelo PIU (gateway da cadeia de tração Mitsubishi, mesmo endereço de diagnóstico que o CMM), com a gestão da bateria (TBMU) por trás. Os B9E mais recentes provavelmente seguem a mudança para o AEE2010 de 2015 (ver M69.yml)'
