versions:
  all:
    architecture: 'AEE2010.ev'
    years: '2016-2024'
    comment:
      en: 'Diagnostic tools show a "BSI 2010 EV" on the chinese C6. "Evolved" AEE2010 (BSI 2010 EV, from about 2016): same network split as AEE2010, used by the EMP2 cars from 2016 and the CMP cars. VCU/OBC/TBMU/CMEL/RMCU are the plug-in hybrid parts (electric motors, charger, traction battery), BCM the power tailgate, BAAS the hands-free tailgate sensor, IVC_D the driver attention camera. On the DS 9 (X83): BVN is the DS Night Vision infrared camera, CSS the DS Active Scan Suspension, CLOCK the B.R.M R180 clock unfolding from the dashboard (shared only with the DS 7), SPB the massage seats. Not confirmed on the chinese C6 (X81)'
      fr: 'Les outils de diagnostic voient un "BSI 2010 EV" sur la C6 chinoise. AEE2010 "évoluée" (BSI 2010 EV, à partir de 2016 environ) : même découpage réseau que l''AEE2010, utilisée par les voitures EMP2 à partir de 2016 et les voitures CMP. VCU/OBC/TBMU/CMEL/RMCU sont les éléments hybrides rechargeables (moteurs électriques, chargeur, batterie de traction), BCM le hayon motorisé, BAAS le capteur d''ouverture mains libres du hayon, IVC_D la caméra de vigilance conducteur. Sur la DS 9 (X83) : BVN est la caméra infrarouge DS Night Vision, CSS la suspension DS Active Scan, CLOCK la montre B.R.M R180 qui se déploie de la planche de bord (partagée uniquement avec la DS 7), SPB les sièges massants. Non confirmé sur la C6 chinoise (X81)'
      es: 'Las herramientas de diagnóstico muestran un "BSI 2010 EV" en el C6 chino. AEE2010 "evolucionado" (BSI 2010 EV, desde aproximadamente 2016): mismo reparto de red que el AEE2010, utilizado por los coches EMP2 desde 2016 y los coches CMP. VCU/OBC/TBMU/CMEL/RMCU son los elementos híbridos enchufables (motores eléctricos, cargador, batería de tracción), BCM el portón trasero motorizado, BAAS el sensor de apertura manos libres del portón, IVC_D la cámara de vigilancia del conductor. En el DS 9 (X83): BVN es la cámara infrarroja DS Night Vision, CSS la suspensión DS Active Scan, CLOCK el reloj B.R.M R180 que se despliega del salpicadero (compartido solo con el DS 7), SPB los asientos con masaje. No confirmado en el C6 chino (X81)'
      de: 'Diagnosegeräte zeigen beim chinesischen C6 ein "BSI 2010 EV" an. "Weiterentwickeltes" AEE2010 (BSI 2010 EV, ab etwa 2016): gleiche Netzwerkaufteilung wie AEE2010, verwendet von EMP2-Fahrzeugen ab 2016 und CMP-Fahrzeugen. VCU/OBC/TBMU/CMEL/RMCU sind die Plug-in-Hybrid-Komponenten (Elektromotoren, Ladegerät, Traktionsbatterie), BCM die elektrische Heckklappe, BAAS der Freihand-Sensor der Heckklappe, IVC_D die Fahreraufmerksamkeitskamera. Beim DS 9 (X83): BVN ist die DS-Night-Vision-Infrarotkamera, CSS die DS Active Scan-Federung, CLOCK die B.R.M-R180-Uhr, die sich aus dem Armaturenbrett ausklappt (nur mit dem DS 7 geteilt), SPB die Massagesitze. Beim chinesischen C6 (X81) nicht bestätigt'
      it: 'Gli strumenti diagnostici mostrano un "BSI 2010 EV" sulla C6 cinese. AEE2010 "evoluto" (BSI 2010 EV, da circa il 2016): stessa suddivisione di rete dell''AEE2010, utilizzato dalle auto EMP2 dal 2016 e dalle auto CMP. VCU/OBC/TBMU/CMEL/RMCU sono i componenti ibridi plug-in (motori elettrici, caricabatterie, batteria di trazione), BCM il portellone motorizzato, BAAS il sensore di apertura mani libere del portellone, IVC_D la telecamera di attenzione del conducente. Sulla DS 9 (X83): BVN è la telecamera a infrarossi DS Night Vision, CSS la sospensione DS Active Scan, CLOCK l''orologio B.R.M R180 che si apre dal cruscotto (condiviso solo con la DS 7), SPB i sedili massaggianti. Non confermato sulla C6 cinese (X81)'
      pl: 'Narzędzia diagnostyczne pokazują "BSI 2010 EV" w chińskim C6. "Rozwinięty" AEE2010 (BSI 2010 EV, od około 2016 roku): ten sam podział sieci co AEE2010, stosowany w samochodach EMP2 od 2016 roku oraz w samochodach CMP. VCU/OBC/TBMU/CMEL/RMCU to elementy hybrydy plug-in (silniki elektryczne, ładowarka, akumulator trakcyjny), BCM to elektryczna klapa bagażnika, BAAS to czujnik otwierania klapy bez użycia rąk, IVC_D to kamera monitorująca uwagę kierowcy. W DS 9 (X83): BVN to kamera na podczerwień DS Night Vision, CSS to zawieszenie DS Active Scan, CLOCK to zegar B.R.M R180 rozkładany z deski rozdzielczej (współdzielony tylko z DS 7), SPB to fotele z masażem. Niepotwierdzone w chińskim C6 (X81)'
      ru: 'Диагностические приборы показывают "BSI 2010 EV" на китайском C6. "Улучшенная" AEE2010 (BSI 2010 EV, примерно с 2016 года): такое же разделение сети, как у AEE2010, используется в автомобилях EMP2 с 2016 года и в автомобилях CMP. VCU/OBC/TBMU/CMEL/RMCU — компоненты подключаемого гибрида (электродвигатели, зарядное устройство, тяговая батарея), BCM — электропривод багажника, BAAS — датчик бесконтактного открытия багажника, IVC_D — камера контроля внимания водителя. На DS 9 (X83): BVN — инфракрасная камера DS Night Vision, CSS — подвеска DS Active Scan, CLOCK — часы B.R.M R180, раскладывающиеся из передней панели (используются только с DS 7), SPB — сиденья с массажем. Не подтверждено на китайском C6 (X81)'
      zh: '诊断仪在中国版C6上显示"BSI 2010 EV"。"改进型"AEE2010(BSI 2010 EV,约自2016年起):网络划分与AEE2010相同,自2016年起用于EMP2车型及CMP车型。VCU/OBC/TBMU/CMEL/RMCU为插电式混合动力部件(电动机、充电器、牵引电池),BCM为电动尾门,BAAS为尾门免提感应传感器,IVC_D为驾驶员注意力摄像头。在DS 9(X83)上:BVN为DS Night Vision红外摄像头,CSS为DS Active Scan主动扫描悬挂,CLOCK为从仪表板展开的B.R.M R180时钟(仅与DS 7共用),SPB为按摩座椅。在中国版C6(X81)上尚未确认'
      hu: 'A diagnosztikai eszközök "BSI 2010 EV" feliratot mutatnak a kínai C6-on. "Továbbfejlesztett" AEE2010 (BSI 2010 EV, kb. 2016-tól): ugyanaz a hálózati felosztás, mint az AEE2010-nél, az EMP2 járműveknél 2016-tól és a CMP járműveknél használják. A VCU/OBC/TBMU/CMEL/RMCU a plug-in hibrid alkatrészek (villanymotorok, töltő, vonóakkumulátor), a BCM a motoros csomagtérajtó, a BAAS a kihangosított csomagtérnyitás-érzékelő, az IVC_D a vezetőfigyelmi kamera. A DS 9-en (X83): a BVN a DS Night Vision infravörös kamera, a CSS a DS Active Scan felfüggesztés, a CLOCK a műszerfalból kihajtható B.R.M R180 óra (csak a DS 7-tel közös), az SPB a masszázsülések. A kínai C6-on (X81) nem megerősített'
      pt: 'As ferramentas de diagnóstico mostram "BSI 2010 EV" no C6 chinês. AEE2010 "evoluída" (BSI 2010 EV, a partir de cerca de 2016): mesma divisão de rede que a AEE2010, usada pelos automóveis EMP2 a partir de 2016 e pelos automóveis CMP. VCU/OBC/TBMU/CMEL/RMCU são os componentes híbridos plug-in (motores elétricos, carregador, bateria de tração), BCM a porta da mala motorizada, BAAS o sensor de abertura mãos-livres da porta da mala, IVC_D a câmara de vigilância do condutor. No DS 9 (X83): BVN é a câmara infravermelhos DS Night Vision, CSS a suspensão DS Active Scan, CLOCK o relógio B.R.M R180 que se desdobra do tablier (partilhado apenas com o DS 7), SPB os bancos com massagem. Não confirmado no C6 chinês (X81)'
