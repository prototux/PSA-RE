codes:
  T50: 'peugeot 307'  # 3 door version
  T51: 'peugeot 307'  # 5 door version
  T52: 'peugeot 307 SW'  # SW/Break version
  T53: 'peugeot 307 Sedan (Mercosur/China)'  # Sedan version, only in Mercosur and China
  T56: 'peugeot 307 CC'  # Coupe/Cabriolet version (convertible)

brand: ['peugeot']
platform: 'PF2'
years: '2001-2005'
comment:
  en: 'VAN+CAN until march 2005, then full CAN a few months before the facelift (see T6.yml)'
  fr: 'VAN+CAN jusqu''en mars 2005, puis tout CAN quelques mois avant le restylage (voir T6.yml)'
  es: 'VAN+CAN hasta marzo de 2005, luego todo CAN unos meses antes del restyling (véase T6.yml)'
  de: 'VAN+CAN bis März 2005, dann vollständiges CAN einige Monate vor dem Facelift (siehe T6.yml)'
  it: 'VAN+CAN fino a marzo 2005, poi tutto CAN alcuni mesi prima del restyling (vedi T6.yml)'
  pl: 'VAN+CAN do marca 2005 roku, następnie wyłącznie CAN kilka miesięcy przed liftingiem (patrz T6.yml)'
  ru: 'VAN+CAN до марта 2005 года, затем полностью CAN за несколько месяцев до рестайлинга (см. T6.yml)'
  zh: '截至2005年3月为VAN+CAN架构，随后在改款前几个月切换为全CAN架构（参见T6.yml）'
  hu: 'VAN+CAN 2005 márciusáig, majd teljes CAN néhány hónappal a ráncfelvarrás előtt (lásd T6.yml)'
  pt: 'VAN+CAN até março de 2005, depois CAN total alguns meses antes do restyling (ver T6.yml)'

versions:
  van:
    architecture: 'AEE2001.full'
    years: '2001-2005'
    comment:
      en: 'Bi-VAN/CAN: CAN IS (250 kbit/s) for engine/gearbox/chassis, VAN comfort (125 kbit/s) for display, radio, clim, cluster, and VAN body buses (62.5 kbit/s) for airbag, COM2000, alarm and doors. BTE is the CC roof controller (T56 only). ROLLOVER drives the pyrotechnic pop-up roll bars of the 307 CC (T56 only)'
      fr: 'Bi-VAN/CAN : CAN IS (250 kbit/s) pour moteur/boîte/liaison au sol, VAN confort (125 kbit/s) pour écran, autoradio, clim, combiné, et VAN carrosserie (62.5 kbit/s) pour airbag, COM2000, alarme et portes. BTE est le boîtier de toit du CC (T56 uniquement). ROLLOVER commande les arceaux pyrotechniques escamotables de la 307 CC (T56 uniquement)'
      es: 'Bi-VAN/CAN: CAN IS (250 kbit/s) para motor/caja de cambios/tren de rodaje, VAN confort (125 kbit/s) para pantalla, autorradio, climatización, cuadro, y VAN carrocería (62,5 kbit/s) para airbag, COM2000, alarma y puertas. BTE es la unidad de techo del CC (solo T56). ROLLOVER acciona los arcos pirotécnicos emergentes del 307 CC (solo T56)'
      de: 'Bi-VAN/CAN: CAN IS (250 kbit/s) für Motor/Getriebe/Fahrwerk, VAN Komfort (125 kbit/s) für Display, Radio, Klima, Kombiinstrument, und VAN Karosserie (62,5 kbit/s) für Airbag, COM2000, Alarmanlage und Türen. BTE ist das Dachsteuergerät des CC (nur T56). ROLLOVER steuert die pyrotechnischen ausfahrbaren Überrollbügel des 307 CC (nur T56)'
      it: 'Bi-VAN/CAN: CAN IS (250 kbit/s) per motore/cambio/telaio, VAN comfort (125 kbit/s) per display, autoradio, climatizzatore, quadro strumenti, e VAN carrozzeria (62,5 kbit/s) per airbag, COM2000, allarme e porte. BTE è la centralina del tetto della CC (solo T56). ROLLOVER aziona gli archi pirotecnici estraibili della 307 CC (solo T56)'
      pl: 'Bi-VAN/CAN: CAN IS (250 kbit/s) dla silnika/skrzyni biegów/podwozia, VAN comfort (125 kbit/s) dla wyświetlacza, radia, klimatyzacji, zestawu wskaźników, oraz magistrale VAN nadwozia (62,5 kbit/s) dla poduszki powietrznej, COM2000, alarmu i drzwi. BTE to sterownik dachu w CC (tylko T56). ROLLOVER steruje pirotechnicznymi wysuwanymi pałąkami w 307 CC (tylko T56)'
      ru: 'Bi-VAN/CAN: CAN IS (250 кбит/с) для двигателя/коробки передач/шасси, VAN comfort (125 кбит/с) для дисплея, радио, климата, приборной панели, и шины VAN кузова (62,5 кбит/с) для подушки безопасности, COM2000, сигнализации и дверей. BTE — блок управления крышей CC (только T56). ROLLOVER управляет пиротехническими выдвижными дугами безопасности 307 CC (только T56)'
      zh: '双VAN/CAN总线:CAN IS(250 kbit/s)用于发动机/变速箱/底盘,VAN comfort(125 kbit/s)用于显示屏、收音机、空调、仪表盘,VAN车身总线(62.5 kbit/s)用于安全气囊、COM2000、报警器和车门。BTE为CC车顶控制器(仅限T56)。ROLLOVER驱动307 CC的烟火式弹出防滚杠(仅限T56)'
      hu: 'Bi-VAN/CAN: CAN IS (250 kbit/s) a motorhoz/váltóhoz/alvázhoz, VAN comfort (125 kbit/s) a kijelzőhöz, rádióhoz, klímához, műszerfalhoz, és VAN karosszéria buszok (62,5 kbit/s) a légzsákhoz, COM2000-hez, riasztóhoz és ajtókhoz. A BTE a CC tetővezérlője (csak T56). A ROLLOVER működteti a 307 CC pirotechnikus kiugró biztonsági íveit (csak T56)'
      pt: 'Bi-VAN/CAN: CAN IS (250 kbit/s) para motor/caixa de velocidades/chassis, VAN conforto (125 kbit/s) para ecrã, autorrádio, climatização, quadro de instrumentos, e barramentos VAN carroçaria (62,5 kbit/s) para airbag, COM2000, alarme e portas. BTE é a unidade do teto do CC (apenas T56). ROLLOVER aciona os arcos pirotécnicos rebatíveis do 307 CC (apenas T56)'
    nodes:
      HS: ['BSI', 'CMM', 'BVA', 'ABS', 'CAV']
      VAN: ['BSI', 'BSM', 'HDC', 'CMB', 'EMF', 'RAD', 'BTEL', 'CDC', 'CLIM_AV', 'RBG', 'ALARM', 'AAS', 'CDPL', 'ADDGO', 'EDP_C', 'EDP_P', 'TO1', 'BTE', 'MAE', 'ROLLOVER']
    optional_nodes: ['BVA', 'CAV', 'BTEL', 'CDC', 'ALARM', 'AAS', 'CDPL', 'ADDGO', 'EDP_P', 'TO1', 'BTE', 'MAE', 'ROLLOVER']
    buses: ['HS.IS', 'VAN.CAR', 'VAN.CONF']
  can:
    architecture: 'AEE2004.full'
    years: '2005'
    comment:
      en: 'Phase 1 body with the phase 2 interior and full CAN electronics ("phase 1.2"), from march 2005 until the facelift'
      fr: 'Carrosserie phase 1 avec l''interieur et l''electronique tout CAN de la phase 2 ("phase 1.2"), de mars 2005 au restylage'
      es: 'Carrocería de fase 1 con el interior y la electrónica todo CAN de la fase 2 ("fase 1.2"), de marzo de 2005 hasta el restyling'
      de: 'Karosserie der Phase 1 mit Innenraum und CAN-Vollelektronik der Phase 2 ("Phase 1.2"), von März 2005 bis zum Facelift'
      it: 'Carrozzeria fase 1 con interni ed elettronica tutto CAN della fase 2 ("fase 1.2"), da marzo 2005 fino al restyling'
      pl: 'Nadwozie fazy 1 z wnętrzem i elektroniką wyłącznie CAN z fazy 2 ("faza 1.2"), od marca 2005 roku do liftingu'
      ru: 'Кузов фазы 1 с салоном и электроникой полностью CAN фазы 2 («фаза 1.2»), с марта 2005 года до рестайлинга'
      zh: '一期车身搭配二期内饰及全CAN电子系统（"1.2期"），自2005年3月至改款前'
      hu: '1. fázisú karosszéria a 2. fázis belső terével és teljes CAN elektronikájával ("1.2 fázis"), 2005 márciusától a ráncfelvarrásig'
      pt: 'Carroçaria de fase 1 com o interior e a eletrónica CAN total da fase 2 ("fase 1.2"), de março de 2005 até ao restyling'
    nodes:
      HS: ['BSI', 'CMM', 'BVA', 'ABS', 'CAV', 'DAE', 'BCP', 'DSG']
      LS: ['BSI', 'BSM', 'HDC', 'CMB', 'EMF', 'RAD', 'BTEL', 'CDC', 'KML', 'CLIM_AV', 'RBG', 'ALARM', 'AAS', 'CDPL', 'ADDGO', 'EDP_C', 'EDP_P', 'TO1', 'BTE', 'BSR', 'MAE']
    optional_nodes: ['BVA', 'CAV', 'BCP', 'DSG', 'BTEL', 'CDC', 'KML', 'ALARM', 'AAS', 'CDPL', 'ADDGO', 'EDP_P', 'TO1', 'BTE', 'BSR', 'MAE']
