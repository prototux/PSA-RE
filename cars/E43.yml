    architecture: 'NEA2020.full'
    years: '2021-'
    comment:
      en: 'Architecture not confirmed (same EMP2 V3 base as the 308 III). New electronic architecture ("NEA", sometimes called NEA2020) with a central vehicle supervisor (VSM, listed here as BSI) replacing the AEE2010 BSI. Not an AEE2010 variant: the architecture name is a proposal, and the network split of the nodes below is not documented (placed by analogy with AEE2010). CSS is the piloted Advanced Comfort Active Suspension of the plug-in hybrid versions (the other versions have passive progressive hydraulic cushions), VTH the extended head-up display'
      fr: 'Architecture non confirmée (même base EMP2 V3 que la 308 III). Nouvelle architecture électronique ("NEA", parfois appelée NEA2020) avec un superviseur central (VSM, noté BSI ici) qui remplace le BSI AEE2010. Ce n''est pas une variante de l''AEE2010 : le nom d''architecture est une proposition et la répartition des calculateurs par réseau n''est pas documentée (placée par analogie avec l''AEE2010). CSS est la suspension pilotée Advanced Comfort Active des versions hybrides rechargeables (les autres versions ont les butées hydrauliques progressives passives), VTH l''affichage tête haute étendu'
      es: 'Arquitectura no confirmada (misma base EMP2 V3 que el 308 III). Nueva arquitectura electrónica ("NEA", a veces llamada NEA2020) con un supervisor central del vehículo (VSM, indicado aquí como BSI) que sustituye al BSI AEE2010. No es una variante del AEE2010: el nombre de la arquitectura es una propuesta, y el reparto de los nodos por red no está documentado (situado por analogía con el AEE2010). CSS es la suspensión pilotada Advanced Comfort Active de las versiones híbridas enchufables (las demás versiones tienen topes hidráulicos progresivos pasivos), VTH la pantalla de proyección extendida'
      de: 'Architektur nicht bestätigt (gleiche EMP2-V3-Basis wie der 308 III). Neue elektronische Architektur ("NEA", manchmal NEA2020 genannt) mit einem zentralen Fahrzeugsupervisor (VSM, hier als BSI bezeichnet), der das BSI der AEE2010 ersetzt. Keine Variante der AEE2010: Der Architekturname ist ein Vorschlag, und die Netzwerkaufteilung der unten genannten Steuergeräte ist nicht dokumentiert (in Analogie zur AEE2010 platziert). CSS ist die geregelte Advanced-Comfort-Active-Federung der Plug-in-Hybrid-Versionen (die anderen Versionen haben passive progressive Hydraulikpuffer), VTH das erweiterte Head-up-Display'
      it: 'Architettura non confermata (stessa base EMP2 V3 della 308 III). Nuova architettura elettronica ("NEA", talvolta chiamata NEA2020) con un supervisore centrale del veicolo (VSM, qui indicato come BSI) che sostituisce il BSI AEE2010. Non è una variante dell''AEE2010: il nome dell''architettura è una proposta e la suddivisione in rete dei nodi sottostanti non è documentata (collocata per analogia con l''AEE2010). CSS è la sospensione pilotata Advanced Comfort Active delle versioni ibride plug-in (le altre versioni hanno tamponi idraulici progressivi passivi), VTH il display head-up esteso'
      pl: 'Architektura niepotwierdzona (ta sama baza EMP2 V3 co w 308 III). Nowa architektura elektroniczna ("NEA", czasem nazywana NEA2020) z centralnym nadzorcą pojazdu (VSM, oznaczonym tu jako BSI), zastępującym BSI z AEE2010. To nie jest wariant AEE2010: nazwa architektury jest propozycją, a podział węzłów na sieci poniżej nie jest udokumentowany (umieszczony przez analogię do AEE2010). CSS to sterowane zawieszenie Advanced Comfort Active wersji hybrydowych plug-in (pozostałe wersje mają pasywne progresywne poduszki hydrauliczne), VTH to rozszerzony wyświetlacz przezierny'
      ru: 'Архитектура не подтверждена (та же база EMP2 V3, что у 308 III). Новая электронная архитектура ("NEA", иногда называемая NEA2020) с центральным супервизором автомобиля (VSM, здесь обозначен как BSI), заменяющим BSI архитектуры AEE2010. Это не вариант AEE2010: название архитектуры является предположением, а распределение узлов по сетям ниже не задокументировано (указано по аналогии с AEE2010). CSS — управляемая подвеска Advanced Comfort Active гибридных подключаемых версий (у остальных версий пассивные прогрессивные гидравлические упоры), VTH — расширенный дисплей на лобовом стекле'
      zh: '架构未经确认(与308 III相同的EMP2 V3平台)。全新电子架构("NEA",有时称为NEA2020),配备中央车辆监控器(VSM,此处标注为BSI),取代AEE2010的BSI。这不是AEE2010的变体:架构名称为推测名称,以下节点的网络划分未有文档记录(按照AEE2010的方式推测排列)。CSS为插电式混合动力版本的Advanced Comfort Active主动悬挂(其他版本采用被动渐进式液压缓冲块),VTH为扩展型抬头显示器'
      hu: 'Architektúra nem megerősített (ugyanaz az EMP2 V3 alap, mint a 308 III-nál). Új elektronikus architektúra ("NEA", néha NEA2020 néven is emlegetik) központi jármű-felügyelővel (VSM, itt BSI-ként szerepel), amely felváltja az AEE2010 BSI-jét. Nem az AEE2010 egy változata: az architektúra neve feltételezés, és az alábbi csomópontok hálózati elosztása nincs dokumentálva (az AEE2010 mintájára helyezve el). A CSS a plug-in hibrid változatok szabályozott Advanced Comfort Active felfüggesztése (a többi változatnál passzív progresszív hidraulikus ütközők vannak), a VTH a kibővített head-up kijelző'
      pt: 'Arquitetura não confirmada (mesma base EMP2 V3 que o 308 III). Nova arquitetura eletrónica ("NEA", por vezes chamada NEA2020) com um supervisor central do veículo (VSM, aqui designado por BSI) que substitui o BSI da AEE2010. Não é uma variante da AEE2010: o nome da arquitetura é uma proposta, e a repartição dos nós pela rede não está documentada (colocada por analogia com a AEE2010). O CSS é a suspensão pilotada Advanced Comfort Active das versões híbridas plug-in (as outras versões têm batentes hidráulicos progressivos passivos), o VTH o head-up display alargado'
