codes:
  K0: ['citroen Jumpy III', 'citroen SpaceTourer', 'peugeot Expert III', 'peugeot Traveller', 'opel Vivaro C', 'opel Zafira Life', 'vauxhall Vivaro', 'toyota Proace II', 'toyota Proace Verso', 'fiat Scudo III', 'fiat Ulysse III']

brand: ['citroen', 'peugeot', 'opel', 'vauxhall', 'toyota', 'fiat']
platform: 'EMP2'
years: '2016-'
comment:
  en: 'Utility, minivan and badge-engineered versions share the same electronics (built by Sevel Nord / Stellantis Hordain)'
  fr: 'Les versions utilitaires, monospaces et rebadgees partagent la meme electronique (fabrique a Hordain)'
  es: 'Las versiones utilitaria, monovolumen y con otras marcas comparten la misma electrónica (fabricada por Sevel Nord / Stellantis Hordain)'
  de: 'Nutzfahrzeug-, Van- und umgebadgete Versionen teilen sich die gleiche Elektronik (gebaut von Sevel Nord / Stellantis Hordain)'
  it: 'Le versioni utilitaria, monovolume e con altri marchi condividono la stessa elettronica (costruita da Sevel Nord / Stellantis Hordain)'
  pl: 'Wersje użytkowa, minivan i sprzedawane pod innymi markami współdzielą tę samą elektronikę (produkowaną przez Sevel Nord / Stellantis Hordain)'
  ru: 'Коммерческая, минивэн и версии с другими марками используют одну и ту же электронику (производство Sevel Nord / Stellantis Hordain)'
  zh: '商用车、多用途车及贴牌版本共用相同的电子系统（由Sevel Nord/Stellantis Hordain制造）'
  hu: 'A haszonjármű, a kisbusz és az átcímkézett verziók ugyanazt az elektronikát használják (a Sevel Nord / Stellantis Hordain gyártja)'
  pt: 'As versões utilitária, monovolume e com outras marcas partilham a mesma eletrónica (fabricada pela Sevel Nord / Stellantis Hordain)'

versions:
  all:
    architecture: 'AEE2010.ev'
    years: '2016-'
    comment:
      en: '"Evolved" AEE2010 (BSI 2010 EV, from about 2016): same network split as AEE2010, used by the EMP2 cars from 2016 and the CMP cars. MDPLC/MDPLC_D are the motorised sliding doors, BSG the body builder interface, VCU/OBC/TBMU/CMEL the electric versions (from 2020). VTH is the blade head-up display (option)'
      fr: 'AEE2010 "évoluée" (BSI 2010 EV, à partir de 2016 environ) : même découpage réseau que l''AEE2010, utilisée par les voitures EMP2 à partir de 2016 et les voitures CMP. MDPLC/MDPLC_D sont les portes latérales coulissantes motorisées, BSG le boîtier transformateur carrossier, VCU/OBC/TBMU/CMEL les versions électriques (à partir de 2020). VTH est l''affichage tête haute sur lame (option)'
      es: 'AEE2010 "evolucionado" (BSI 2010 EV, desde aproximadamente 2016): mismo reparto de red que el AEE2010, utilizado por los coches EMP2 desde 2016 y los coches CMP. MDPLC/MDPLC_D son las puertas laterales correderas motorizadas, BSG la interfaz para carrozadores, VCU/OBC/TBMU/CMEL las versiones eléctricas (a partir de 2020). VTH es la pantalla de proyección tipo lámina (opcional)'
      de: '"Weiterentwickeltes" AEE2010 (BSI 2010 EV, ab etwa 2016): gleiche Netzwerkaufteilung wie AEE2010, verwendet von EMP2-Fahrzeugen ab 2016 und CMP-Fahrzeugen. MDPLC/MDPLC_D sind die motorisierten Schiebetüren, BSG die Aufbauherstellerschnittstelle, VCU/OBC/TBMU/CMEL die Elektroversionen (ab 2020). VTH ist das Blade-Head-up-Display (optional)'
      it: 'AEE2010 "evoluto" (BSI 2010 EV, da circa il 2016): stessa suddivisione di rete dell''AEE2010, utilizzato dalle auto EMP2 dal 2016 e dalle auto CMP. MDPLC/MDPLC_D sono le porte laterali scorrevoli motorizzate, BSG l''interfaccia per allestitori, VCU/OBC/TBMU/CMEL le versioni elettriche (dal 2020). VTH è il display head-up a lama (opzionale)'
      pl: '"Rozwinięty" AEE2010 (BSI 2010 EV, od około 2016 roku): ten sam podział sieci co AEE2010, stosowany w samochodach EMP2 od 2016 roku oraz w samochodach CMP. MDPLC/MDPLC_D to zmotoryzowane drzwi przesuwne, BSG to interfejs dla zabudowujących, VCU/OBC/TBMU/CMEL to wersje elektryczne (od 2020 roku). VTH to wyświetlacz przezierny typu "ostrze" (opcja)'
      ru: '"Улучшенная" AEE2010 (BSI 2010 EV, примерно с 2016 года): такое же разделение сети, как у AEE2010, используется в автомобилях EMP2 с 2016 года и в автомобилях CMP. MDPLC/MDPLC_D — моторизованные сдвижные двери, BSG — интерфейс для кузовостроителей, VCU/OBC/TBMU/CMEL — электрические версии (с 2020 года). VTH — пластинчатый дисплей на лобовом стекле (опция)'
      zh: '"改进型"AEE2010(BSI 2010 EV,约自2016年起):网络划分与AEE2010相同,自2016年起用于EMP2车型及CMP车型。MDPLC/MDPLC_D为电动滑门,BSG为改装商接口,VCU/OBC/TBMU/CMEL为电动版本(自2020年起)。VTH为叶片式抬头显示器(选装)'
      hu: '"Továbbfejlesztett" AEE2010 (BSI 2010 EV, kb. 2016-tól): ugyanaz a hálózati felosztás, mint az AEE2010-nél, az EMP2 járműveknél 2016-tól és a CMP járműveknél használják. Az MDPLC/MDPLC_D a motoros tolóajtók, a BSG a felépítménygyártói interfész, a VCU/OBC/TBMU/CMEL az elektromos változatok (2020-tól). A VTH a lapkás head-up kijelző (opció)'
      pt: 'AEE2010 "evoluída" (BSI 2010 EV, a partir de cerca de 2016): mesma divisão de rede que a AEE2010, usada pelos automóveis EMP2 a partir de 2016 e pelos automóveis CMP. MDPLC/MDPLC_D são as portas laterais corrediças motorizadas, BSG a interface para carroçadores, VCU/OBC/TBMU/CMEL as versões elétricas (a partir de 2020). VTH é o head-up display em lâmina (opcional)'
