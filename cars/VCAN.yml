codes:
  VCAN: ['citroen C8 (CAN)', 'peugeot 807 (CAN)', 'fiat Ulysse II', 'lancia Phedra']

brand: ['citroen', 'peugeot', 'fiat', 'other']
platform: 'Eurovan'
years: '2005-2014'
comment:
  en: 'Built by Sevel Nord on the Eurovan 2 base, but with PSA electronics. BCD is the "BTO" central warning lamps/odometer box, MDPLC the motorised sliding doors, TO1/TO2/TO3 the three sunroofs (independent controls, per the 807 handbook), CRT the head unit remote control'
  fr: 'Fabrique par Sevel Nord sur base Eurovan 2, mais avec une electronique PSA. BCD est le boitier temoins/odometre "BTO", MDPLC les portes coulissantes motorisees, TO1/TO2/TO3 les trois toits ouvrants (commandes independantes, notice de la 807), CRT la commande deportee de l''autoradio'
  es: 'Fabricada por Sevel Nord sobre la base Eurovan 2, pero con electrónica PSA. BCD es la caja de testigos/cuentakilómetros "BTO", MDPLC las puertas correderas motorizadas, TO1/TO2/TO3 los tres techos solares (mandos independientes, según el manual del 807), CRT el mando remoto del autorradio'
  de: 'Von Sevel Nord auf Basis des Eurovan 2 gebaut, jedoch mit PSA-Elektronik. BCD ist das "BTO"-Kontrollleuchten-/Kilometerzähler-Steuergerät, MDPLC die motorisierten Schiebetüren, TO1/TO2/TO3 die drei Schiebedächer (unabhängige Bedienung, laut Handbuch des 807), CRT die Fernbedienung des Radios'
  it: 'Costruita da Sevel Nord sulla base Eurovan 2, ma con elettronica PSA. BCD è la centralina spie/contachilometri "BTO", MDPLC le porte scorrevoli motorizzate, TO1/TO2/TO3 i tre tetti apribili (comandi indipendenti, secondo il manuale della 807), CRT il telecomando dell''autoradio'
  pl: 'Zbudowana przez Sevel Nord na bazie Eurovan 2, ale z elektroniką PSA. BCD to sterownik lampek kontrolnych/licznika przebiegu "BTO", MDPLC to zmotoryzowane drzwi przesuwne, TO1/TO2/TO3 to trzy szyberdachy (niezależne sterowanie, według instrukcji 807), CRT to zdalne sterowanie radiem'
  ru: 'Построена компанией Sevel Nord на базе Eurovan 2, но с электроникой PSA. BCD — блок контрольных ламп/одометра "BTO", MDPLC — моторизованные сдвижные двери, TO1/TO2/TO3 — три люка (независимое управление, согласно руководству 807), CRT — пульт дистанционного управления радио'
  zh: '由Sevel Nord基于Eurovan 2平台制造,但采用PSA电子系统。BCD为"BTO"警告灯/里程表控制盒,MDPLC为电动滑门,TO1/TO2/TO3为三个天窗(独立控制,依据807手册),CRT为主机遥控器'
  hu: 'A Sevel Nord gyártotta az Eurovan 2 alapokon, de PSA elektronikával. A BCD a "BTO" jelzőlámpa-/kilométeróra-egység, az MDPLC a motoros tolóajtók, a TO1/TO2/TO3 a három napfénytető (független vezérlés, a 807 kézikönyve szerint), a CRT a fejegység távirányítója'
  pt: 'Construída pela Sevel Nord com base na Eurovan 2, mas com eletrónica PSA. BCD é a caixa central de avisadores/conta-quilómetros "BTO", MDPLC as portas corrediças motorizadas, TO1/TO2/TO3 os três tetos de abrir (comandos independentes, segundo o manual do 807), CRT o comando remoto do autorrádio'

versions:
  all:
    architecture: 'AEE2004.full'
    years: '2005-2014'
    comment:
      en: 'Full CAN from mid 2005 (green dials = VAN, orange dials = CAN); new wiring in july 2006 and "evolved" BSI from july 2007. CLIM_AR: the top trims have a quad-zone automatic climate control (fr.wikipedia), a separate rear panel node is not confirmed'
      fr: 'Tout CAN à partir de mi-2005 (compteurs verts = VAN, orange = CAN) ; nouveau faisceau en juillet 2006 et BSI "évolué" en juillet 2007. CLIM_AR : les hautes finitions ont une climatisation automatique quadrizone (fr.wikipedia), un pupitre arrière séparé n''est pas confirmé'
      es: 'Todo CAN desde mediados de 2005 (esferas verdes = VAN, naranjas = CAN); nuevo cableado en julio de 2006 y BSI "evolucionado" desde julio de 2007. CLIM_AR: los acabados superiores tienen climatización automática de cuatro zonas (fr.wikipedia), no está confirmado un nodo de panel trasero independiente'
      de: 'Vollständig CAN ab Mitte 2005 (grüne Anzeigen = VAN, orange Anzeigen = CAN); neuer Kabelbaum im Juli 2006 und "weiterentwickeltes" BSI ab Juli 2007. CLIM_AR: die höheren Ausstattungen haben eine 4-Zonen-Klimaautomatik (fr.wikipedia), ein separates Bedienfeld hinten ist nicht bestätigt'
      it: 'Tutto CAN da metà 2005 (quadranti verdi = VAN, arancioni = CAN); nuovo cablaggio a luglio 2006 e BSI "evoluto" da luglio 2007. CLIM_AR: gli allestimenti superiori hanno un climatizzatore automatico a quattro zone (fr.wikipedia), un pannello posteriore separato non è confermato'
      pl: 'Pełny CAN od połowy 2005 roku (zielone wskaźniki = VAN, pomarańczowe = CAN); nowa instalacja w lipcu 2006 roku i "rozwinięty" BSI od lipca 2007 roku. CLIM_AR: wyższe wersje wyposażenia mają czterostrefową automatyczną klimatyzację (fr.wikipedia), osobny tylny panel sterowania nie jest potwierdzony'
      ru: 'Полностью CAN с середины 2005 года (зелёные шкалы = VAN, оранжевые = CAN); новая проводка в июле 2006 года и "улучшенное" BSI с июля 2007 года. CLIM_AR: в топовых комплектациях есть четырёхзонный автоматический климат-контроль (fr.wikipedia), отдельный задний узел панели не подтверждён'
      zh: '自2005年年中起全CAN总线(绿色仪表=VAN,橙色仪表=CAN);2006年7月更换新线束,2007年7月起配备"改进型"BSI。CLIM_AR:高配车型配备四区自动空调(fr.wikipedia),独立后排面板节点未获确认'
      hu: 'Teljes CAN 2005 közepétől (zöld műszerek = VAN, narancssárga műszerek = CAN); új huzalozás 2006 júliusában és "továbbfejlesztett" BSI 2007 júliusától. CLIM_AR: a felsőbb felszereltségeknél négyzónás automata klíma van (fr.wikipedia), külön hátsó panel csomópont nem megerősített'
      pt: 'Totalmente CAN a partir de meados de 2005 (mostradores verdes = VAN, laranja = CAN); nova cablagem em julho de 2006 e BSI "evoluído" a partir de julho de 2007. CLIM_AR: os acabamentos topo de gama têm climatização automática de quatro zonas (fr.wikipedia), um painel traseiro separado não é confirmado'
