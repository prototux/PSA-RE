codes:
  V8: 'citroen XM'  # not a confirmed project code (the XM was project V80 then Y30)
  V8MUX: 'citroen XM (Mux)'  # the few hundred multiplexed XM sold around 1994

brand: ['citroen']
years: '1989-2000'

versions:
  nonmux:
    architecture: 'none'
    years: '1989-2000'
    codes: ['V8']
    comment:
      en: 'Not multiplexed: ECUs (engine, ABS, airbag...) are wired individually and only reachable by K-line diagnostics'
      fr: 'Non multiplexée : les calculateurs (moteur, ABS, airbag...) sont câblés individuellement, diagnostic par ligne K uniquement'
      es: 'No multiplexado: las unidades de control (motor, ABS, airbag...) están cableadas individualmente, diagnóstico únicamente por línea K'
      de: 'Nicht multiplex: Die Steuergeräte (Motor, ABS, Airbag...) sind einzeln verdrahtet, Diagnose nur über K-Leitung'
      it: 'Non multiplato: le centraline (motore, ABS, airbag...) sono cablate singolarmente, diagnosi solo via linea K'
      pl: 'Bez multipleksowania: sterowniki (silnik, ABS, poduszka powietrzna...) są okablowane indywidualnie, diagnostyka tylko po linii K'
      ru: 'Немультиплексированная сеть: блоки управления (двигатель, ABS, подушка безопасности...) подключены индивидуально, диагностика только по линии K'
      zh: '非多路复用：各控制器（发动机、ABS、安全气囊等）独立布线，仅可通过K线进行诊断'
      hu: 'Nem multiplex: a vezérlőegységek (motor, ABS, légzsák...) egyenként vannak bekötve, diagnosztika csak K-vonalon'
      pt: 'Não multiplexado: as unidades de controlo (motor, ABS, airbag...) estão cabladas individualmente, diagnóstico apenas por linha K'
  mux:
    architecture: 'AEE2001.full'
    years: '1994'
    codes: ['V8MUX']
    comment:
      en: 'Pilot VAN multiplexed XM (a few hundred cars), the ancestor of the VAN networks later used in AEE2001. Architecture name and node list unknown, flagged as a guess'
      fr: 'XM multiplexée VAN pilote (quelques centaines de voitures), ancetre des réseaux VAN de l''AEE2001. Architecture et liste des calculateurs inconnues, à confirmer'
      es: 'XM multiplexada VAN piloto (algunos cientos de vehículos), la antecesora de las redes VAN utilizadas posteriormente en el AEE2001. Nombre de arquitectura y lista de nodos desconocidos, marcado como suposición'
      de: 'Pilot-Multiplex-VAN-XM (einige hundert Fahrzeuge), der Vorläufer der später im AEE2001 verwendeten VAN-Netzwerke. Architekturname und Knotenliste unbekannt, als Vermutung markiert'
      it: 'XM multiplata VAN pilota (poche centinaia di vetture), l''antenata delle reti VAN utilizzate successivamente nell''AEE2001. Nome dell''architettura ed elenco dei nodi sconosciuti, contrassegnato come ipotesi'
      pl: 'Pilotażowa multipleksowana VAN XM (kilkaset pojazdów), poprzedniczka sieci VAN używanych później w AEE2001. Nazwa architektury i lista węzłów nieznane, oznaczone jako przypuszczenie'
      ru: 'Пилотная мультиплексная VAN XM (несколько сотен автомобилей), предшественница сетей VAN, позже использованных в AEE2001. Название архитектуры и список узлов неизвестны, отмечено как предположение'
      zh: 'VAN多路复用试点车型XM（数百辆），是后来用于AEE2001的VAN网络的前身。架构名称及节点列表未知，标记为推测'
      hu: 'Kísérleti multiplex VAN XM (néhány száz autó), a később az AEE2001-ben használt VAN hálózatok elődje. Az architektúra neve és a csomópontlista ismeretlen, feltételezésként jelölve'
      pt: 'XM multiplexado VAN piloto (algumas centenas de veículos), o antecessor das redes VAN usadas mais tarde no AEE2001. Nome da arquitetura e lista de nós desconhecidos, assinalado como suposição'
