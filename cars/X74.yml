codes:
  X74: ['ds DS 7 Crossback', 'ds DS 7']

brand: ['ds']
platform: 'EMP2'
years: '2017-'

versions:
  all:
    architecture: 'AEE2010.ev'
    years: '2017-'
    comment:
      en: 'Kept the evolved AEE2010 BSI after the 2022 facelift. "Evolved" AEE2010 (BSI 2010 EV, from about 2016): same network split as AEE2010, used by the EMP2 cars from 2016 and the CMP cars. VCU/OBC/TBMU/CMEL/RMCU are the plug-in hybrid parts (electric motors, charger, traction battery), BCM the power tailgate, BAAS the hands-free tailgate sensor, IVC_D the driver attention camera. CSS drives the camera-controlled active suspension. BVN is the DS Night Vision infrared camera, CLOCK the B.R.M R180 clock that unfolds from the dashboard at start-up and sets itself from the touch screen time (higher trims; only on DS 7 and DS 9, and a multiplexed clock otherwise only on the RCZ and DS 5), SPB the multipoint massage seats'
      fr: 'Conserve le BSI AEE2010 évolué après le restylage de 2022. AEE2010 "évoluée" (BSI 2010 EV, à partir de 2016 environ) : même découpage réseau que l''AEE2010, utilisée par les voitures EMP2 à partir de 2016 et les voitures CMP. VCU/OBC/TBMU/CMEL/RMCU sont les éléments hybrides rechargeables (moteurs électriques, chargeur, batterie de traction), BCM le hayon motorisé, BAAS le capteur d''ouverture mains libres du hayon, IVC_D la caméra de vigilance conducteur. CSS pilote la suspension active pilotée par caméra. BVN est la caméra infrarouge DS Night Vision, CLOCK la montre B.R.M R180 qui se déploie de la planche de bord au démarrage et se règle sur l''heure de l''écran tactile (hautes finitions ; seulement DS 7 et DS 9, sinon une montre multiplexée n''existe que sur RCZ et DS 5), SPB les sièges massants multipoints'
      es: 'Conserva el BSI AEE2010 evolucionado tras el restyling de 2022. AEE2010 "evolucionado" (BSI 2010 EV, desde aproximadamente 2016): mismo reparto de red que el AEE2010, utilizado por los coches EMP2 desde 2016 y los coches CMP. VCU/OBC/TBMU/CMEL/RMCU son los elementos híbridos enchufables (motores eléctricos, cargador, batería de tracción), BCM el portón trasero motorizado, BAAS el sensor de apertura manos libres del portón, IVC_D la cámara de vigilancia del conductor. CSS controla la suspensión activa pilotada por cámara. BVN es la cámara infrarroja DS Night Vision, CLOCK el reloj B.R.M R180 que se despliega del salpicadero al arrancar y se ajusta con la hora de la pantalla táctil (acabados superiores; solo en DS 7 y DS 9, de lo contrario un reloj multiplexado solo existe en el RCZ y el DS 5), SPB los asientos con masaje multipunto'
      de: 'Behält das weiterentwickelte AEE2010-BSI nach dem Facelift 2022 bei. "Weiterentwickeltes" AEE2010 (BSI 2010 EV, ab etwa 2016): gleiche Netzwerkaufteilung wie AEE2010, verwendet von EMP2-Fahrzeugen ab 2016 und CMP-Fahrzeugen. VCU/OBC/TBMU/CMEL/RMCU sind die Plug-in-Hybrid-Komponenten (Elektromotoren, Ladegerät, Traktionsbatterie), BCM die elektrische Heckklappe, BAAS der Freihand-Sensor der Heckklappe, IVC_D die Fahreraufmerksamkeitskamera. CSS steuert die kameragesteuerte aktive Federung. BVN ist die DS-Night-Vision-Infrarotkamera, CLOCK die B.R.M-R180-Uhr, die sich beim Start aus dem Armaturenbrett ausklappt und sich nach der Zeit des Touchscreens einstellt (höhere Ausstattungen; nur bei DS 7 und DS 9, sonst gibt es eine multiplexed Uhr nur beim RCZ und DS 5), SPB die Mehrpunkt-Massagesitze'
      it: 'Mantiene il BSI AEE2010 evoluto dopo il restyling del 2022. AEE2010 "evoluto" (BSI 2010 EV, da circa il 2016): stessa suddivisione di rete dell''AEE2010, utilizzato dalle auto EMP2 dal 2016 e dalle auto CMP. VCU/OBC/TBMU/CMEL/RMCU sono i componenti ibridi plug-in (motori elettrici, caricabatterie, batteria di trazione), BCM il portellone motorizzato, BAAS il sensore di apertura mani libere del portellone, IVC_D la telecamera di attenzione del conducente. CSS pilota la sospensione attiva controllata da telecamera. BVN è la telecamera a infrarossi DS Night Vision, CLOCK l''orologio B.R.M R180 che si apre dal cruscotto all''avvio e si imposta sull''ora dello schermo touch (allestimenti superiori; solo su DS 7 e DS 9, altrimenti un orologio multiplexato esiste solo su RCZ e DS 5), SPB i sedili massaggianti multipunto'
      pl: 'Zachowuje rozwinięty BSI AEE2010 po liftingu z 2022 roku. "Rozwinięty" AEE2010 (BSI 2010 EV, od około 2016 roku): ten sam podział sieci co AEE2010, stosowany w samochodach EMP2 od 2016 roku oraz w samochodach CMP. VCU/OBC/TBMU/CMEL/RMCU to elementy hybrydy plug-in (silniki elektryczne, ładowarka, akumulator trakcyjny), BCM to elektryczna klapa bagażnika, BAAS to czujnik otwierania klapy bez użycia rąk, IVC_D to kamera monitorująca uwagę kierowcy. CSS steruje aktywnym zawieszeniem sterowanym kamerą. BVN to kamera na podczerwień DS Night Vision, CLOCK to zegar B.R.M R180 rozkładany z deski rozdzielczej przy uruchomieniu i ustawiany według czasu ekranu dotykowego (wyższe wersje wyposażenia; tylko DS 7 i DS 9, w innym przypadku multipleksowany zegar istnieje tylko w RCZ i DS 5), SPB to fotele z wielopunktowym masażem'
      ru: 'Сохраняет улучшенный BSI AEE2010 после рестайлинга 2022 года. "Улучшенная" AEE2010 (BSI 2010 EV, примерно с 2016 года): такое же разделение сети, как у AEE2010, используется в автомобилях EMP2 с 2016 года и в автомобилях CMP. VCU/OBC/TBMU/CMEL/RMCU — компоненты подключаемого гибрида (электродвигатели, зарядное устройство, тяговая батарея), BCM — электропривод багажника, BAAS — датчик бесконтактного открытия багажника, IVC_D — камера контроля внимания водителя. CSS управляет активной подвеской с камерным управлением. BVN — инфракрасная камера DS Night Vision, CLOCK — часы B.R.M R180, раскладывающиеся из передней панели при запуске и настраивающиеся по времени сенсорного экрана (топовые комплектации; только на DS 7 и DS 9, в остальных случаях мультиплексированные часы есть только на RCZ и DS 5), SPB — сиденья с многоточечным массажем'
      zh: '在2022年改款后仍保留改进型AEE2010 BSI。"改进型"AEE2010(BSI 2010 EV,约自2016年起):网络划分与AEE2010相同,自2016年起用于EMP2车型及CMP车型。VCU/OBC/TBMU/CMEL/RMCU为插电式混合动力部件(电动机、充电器、牵引电池),BCM为电动尾门,BAAS为尾门免提感应传感器,IVC_D为驾驶员注意力摄像头。CSS驱动摄像头控制的主动悬挂。BVN为DS Night Vision红外摄像头,CLOCK为启动时从仪表板展开并根据触摸屏时间自动校准的B.R.M R180时钟(高配车型;仅限DS 7和DS 9,其余情况下复用时钟仅见于RCZ和DS 5),SPB为多点按摩座椅'
      hu: 'A 2022-es ráncfelvarrás után is megtartja a továbbfejlesztett AEE2010 BSI-t. "Továbbfejlesztett" AEE2010 (BSI 2010 EV, kb. 2016-tól): ugyanaz a hálózati felosztás, mint az AEE2010-nél, az EMP2 járműveknél 2016-tól és a CMP járműveknél használják. A VCU/OBC/TBMU/CMEL/RMCU a plug-in hibrid alkatrészek (villanymotorok, töltő, vonóakkumulátor), a BCM a motoros csomagtérajtó, a BAAS a kihangosított csomagtérnyitás-érzékelő, az IVC_D a vezetőfigyelmi kamera. A CSS a kamerával vezérelt aktív felfüggesztést irányítja. A BVN a DS Night Vision infravörös kamera, a CLOCK a műszerfalból induláskor kihajtható és az érintőképernyő idejéhez igazodó B.R.M R180 óra (felsőbb felszereltségek; csak DS 7-en és DS 9-en, egyébként multiplexelt óra csak az RCZ-n és DS 5-ön van), az SPB a többpontos masszázsülések'
      pt: 'Manteve o BSI AEE2010 evoluído após o restyling de 2022. AEE2010 "evoluída" (BSI 2010 EV, a partir de cerca de 2016): mesma divisão de rede que a AEE2010, usada pelos automóveis EMP2 a partir de 2016 e pelos automóveis CMP. VCU/OBC/TBMU/CMEL/RMCU são os componentes híbridos plug-in (motores elétricos, carregador, bateria de tração), BCM a porta da mala motorizada, BAAS o sensor de abertura mãos-livres da porta da mala, IVC_D a câmara de vigilância do condutor. CSS aciona a suspensão ativa controlada por câmara. BVN é a câmara infravermelhos DS Night Vision, CLOCK o relógio B.R.M R180 que se desdobra do tablier no arranque e se ajusta pela hora do ecrã tátil (acabamentos superiores; apenas no DS 7 e DS 9, caso contrário um relógio multiplexado só existe no RCZ e DS 5), SPB os bancos com massagem multiponto'
