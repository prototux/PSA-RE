codes:
  A08: 'peugeot 1007'
  A08VAN: 'peugeot 1007 (VAN)'
  A08CAN: 'peugeot 1007 (CAN)'

brand: ['peugeot']
platform: 'PF1'
years: '2005-2009'
comment:
  en: 'Launched in VAN+CAN and switched to full CAN during its career'
  fr: 'Lancée en VAN+CAN puis passée au tout CAN en cours de carrière'
  es: 'Lanzado en VAN+CAN y pasó a todo CAN durante su vida comercial'
  de: 'Als VAN+CAN eingeführt und im Laufe der Bauzeit auf vollständiges CAN umgestellt'
  it: 'Lanciata in VAN+CAN e passata al tutto CAN nel corso della sua carriera'
  pl: 'Wprowadzony w architekturze VAN+CAN, a następnie przeszedł na wyłącznie CAN w trakcie produkcji'
  ru: 'Запущен как VAN+CAN, а затем в течение производственного цикла перешёл на полностью CAN'
  zh: '以VAN+CAN架构推出，在生产周期中切换为全CAN架构'
  hu: 'VAN+CAN architektúrával indult, majd a gyártási időszak alatt teljes CAN-ra váltott'
  pt: 'Lançado em VAN+CAN e passou a CAN total ao longo da sua vida comercial'

versions:
  van:
    architecture: 'AEE2001.full'
    years: '2005-2006'
    codes: ['A08', 'A08VAN']
    comment:
      en: 'Bi-VAN/CAN: CAN IS (250 kbit/s) for engine/gearbox/chassis, VAN comfort (125 kbit/s) for display, radio, clim, cluster, and VAN body buses (62.5 kbit/s) for airbag, COM2000, alarm and doors. MDPLC are the motorised sliding doors'
      fr: 'Bi-VAN/CAN : CAN IS (250 kbit/s) pour moteur/boîte/liaison au sol, VAN confort (125 kbit/s) pour écran, autoradio, clim, combiné, et VAN carrosserie (62.5 kbit/s) pour airbag, COM2000, alarme et portes. MDPLC pilote les portes coulissantes motorisees'
      es: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) para motor/caja de cambios/chasis, VAN confort (125 kbit/s) para pantalla, radio, clima, cuadro de instrumentos, y bus VAN carrocería (62,5 kbit/s) para airbag, COM2000, alarma y puertas. MDPLC controla las puertas correderas motorizadas'
      de: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) für Motor/Getriebe/Fahrwerk, VAN Komfort (125 kbit/s) für Display, Radio, Klimaanlage, Kombiinstrument, und VAN-Karosseriebus (62,5 kbit/s) für Airbag, COM2000, Alarmanlage und Türen. MDPLC steuert die motorisierten Schiebetüren'
      it: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) per motore/cambio/telaio, VAN comfort (125 kbit/s) per display, autoradio, climatizzatore, quadro strumenti, e bus VAN carrozzeria (62,5 kbit/s) per airbag, COM2000, allarme e porte. MDPLC comanda le porte scorrevoli motorizzate'
      pl: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) dla silnika/skrzyni biegów/podwozia, VAN komfort (125 kbit/s) dla wyświetlacza, radia, klimatyzacji, zestawu wskaźników, oraz magistrala VAN nadwozia (62,5 kbit/s) dla poduszki powietrznej, COM2000, alarmu i drzwi. MDPLC steruje elektrycznymi drzwiami przesuwnymi'
      ru: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 кбит/с) для двигателя/коробки передач/шасси, VAN комфорт (125 кбит/с) для дисплея, радио, кондиционера, приборной панели, и кузовная шина VAN (62,5 кбит/с) для подушки безопасности, COM2000, сигнализации и дверей. MDPLC управляет моторизованными сдвижными дверями'
      zh: '双VAN/CAN架构：双VAN/CAN架构：CAN IS（250 kbit/s）用于发动机/变速箱/底盘，VAN舒适总线（125 kbit/s）用于显示屏、收音机、空调、仪表组，VAN车身总线（62.5 kbit/s）用于安全气囊、COM2000、报警器和车门。MDPLC控制电动滑门'
      hu: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) a motorhoz/váltóhoz/futóműhöz, VAN komfort (125 kbit/s) a kijelzőhöz, rádióhoz, klímához, műszerfalhoz, és VAN karosszéria busz (62,5 kbit/s) a légzsákhoz, COM2000-hez, riasztóhoz és ajtókhoz. Az MDPLC vezérli a motoros tolóajtókat'
      pt: 'Bi-VAN/CAN: CAN IS (250 kbit/s) para motor/caixa de velocidades/chassis, VAN conforto (125 kbit/s) para ecrã, rádio, climatização, quadro de instrumentos, e bus VAN carroçaria (62,5 kbit/s) para airbag, COM2000, alarme e portas. O MDPLC controla as portas corrediças motorizadas'
    nodes:
      HS: ['BSI', 'CMM', 'BVA', 'ABS', 'DAE']
      VAN: ['BSI', 'HDC', 'CMB', 'EMF', 'RAD', 'BTEL', 'CDC', 'CLIM_AV', 'RBG', 'ALARM', 'AAS', 'CDPL', 'ADDGO', 'MAE', 'MDPLC']
    optional_nodes: ['BVA', 'BTEL', 'CDC', 'CLIM_AV', 'ALARM', 'AAS', 'CDPL', 'ADDGO', 'MAE']
    buses: ['HS.IS', 'VAN.CAR', 'VAN.CONF']
  can:
    architecture: 'AEE2004.full'
    years: '2006-2009'
    codes: ['A08', 'A08CAN']
    comment:
      en: 'Full CAN from late 2006 (some sources say mid 2007). Full CAN (CAN IS 500 kbit/s, CAN CONF and CAN CAR 125 kbit/s); late cars (2007-2008 onwards) got the "evolved" BSI generation'
      fr: 'Tout CAN à partir de fin 2006 (certaines sources disent mi-2007). Tout CAN (CAN IS 500 kbit/s, CAN CONF et CAN CAR 125 kbit/s) ; les dernières voitures (à partir de 2007-2008) ont reçu le BSI "évolué"'
      es: 'Todo CAN a partir de finales de 2006 (algunas fuentes dicen mediados de 2007). Todo CAN (CAN IS 500 kbit/s, CAN CONF y CAN CAR 125 kbit/s); los vehículos más recientes (a partir de 2007-2008) recibieron la generación de BSI "evolucionado"'
      de: 'Vollständiges CAN ab Ende 2006 (manche Quellen sagen Mitte 2007). vollständiges CAN (CAN IS 500 kbit/s, CAN CONF und CAN CAR 125 kbit/s); spätere Fahrzeuge (ab 2007-2008) erhielten die „weiterentwickelte" BSI-Generation'
      it: 'Tutto CAN da fine 2006 (alcune fonti dicono metà 2007). Tutto CAN (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); le vetture più recenti (dal 2007-2008) hanno ricevuto la generazione BSI "evoluta"'
      pl: 'Wyłącznie CAN od końca 2006 roku (niektóre źródła podają połowę 2007 roku). Wyłącznie CAN (CAN IS 500 kbit/s, CAN CONF i CAN CAR 125 kbit/s); nowsze pojazdy (od 2007-2008) otrzymały "rozwiniętą" generację BSI'
      ru: 'Полностью CAN с конца 2006 года (по некоторым данным — с середины 2007 года). Полностью CAN (CAN IS 500 кбит/с, CAN CONF и CAN CAR 125 кбит/с); более поздние автомобили (примерно с 2007-2008) получили «улучшенное» поколение BSI'
      zh: '2006年末起采用全CAN架构（部分资料称为2007年中）。全CAN架构（CAN IS 500 kbit/s，CAN CONF和CAN CAR 125 kbit/s）；较晚的车型（2007-2008年起）配备了"升级版"BSI'
      hu: 'Teljes CAN 2006 vége óta (egyes források szerint 2007 közepétől). Teljes CAN (CAN IS 500 kbit/s, CAN CONF és CAN CAR 125 kbit/s); a későbbi autók (kb. 2007-2008-tól) a „fejlesztett" BSI generációt kapták'
      pt: 'CAN total a partir de finais de 2006 (algumas fontes dizem meados de 2007). CAN total (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); os veículos mais recentes (a partir de 2007-2008) receberam a geração de BSI "evoluído"'
    nodes:
      HS: ['BSI', 'CMM', 'BVA', 'ABS', 'CAV', 'DAE', 'DSG']
      LS: ['BSI', 'BSM', 'HDC', 'CMB', 'EMF', 'RAD', 'BTEL', 'CDC', 'KML', 'CLIM_AV', 'RBG', 'ALARM', 'AAS', 'CDPL', 'MAE', 'MDPLC']
    optional_nodes: ['BVA', 'CAV', 'BTEL', 'CDC', 'KML', 'CLIM_AV', 'ALARM', 'AAS', 'CDPL', 'MAE', 'DSG']
    buses: ['HS.IS', 'LS.CAR', 'LS.CONF']
