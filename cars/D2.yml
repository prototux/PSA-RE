    comment:
      en: 'Full CAN (CAN IS 500 kbit/s, CAN CONF and CAN CAR 125 kbit/s); late cars (2007-2008 onwards) got the "evolved" BSI generation. CSS is the variable damping unit, BSC the boot module, TO1 the sunroof (D23)'
      fr: 'Tout CAN (CAN IS 500 kbit/s, CAN CONF et CAN CAR 125 kbit/s) ; les dernières voitures (à partir de 2007-2008) ont reçu le BSI "évolué". CSS est l''amortissement variable, BSC le boîtier de coffre, TO1 le toit ouvrant (D23)'
      es: 'Todo CAN (CAN IS 500 kbit/s, CAN CONF y CAN CAR 125 kbit/s); los vehículos más recientes (a partir de 2007-2008) recibieron la generación de BSI "evolucionado". CSS es la unidad de amortiguación variable, BSC el módulo de maletero, TO1 el techo solar (D23)'
      de: 'vollständiges CAN (CAN IS 500 kbit/s, CAN CONF und CAN CAR 125 kbit/s); spätere Fahrzeuge (ab 2007-2008) erhielten die „weiterentwickelte" BSI-Generation. CSS ist die variable Dämpfungseinheit, BSC das Kofferraummodul, TO1 das Schiebedach (D23)'
      it: 'Tutto CAN (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); le vetture più recenti (dal 2007-2008) hanno ricevuto la generazione BSI "evoluta". CSS è l''unità di ammortizzazione variabile, BSC il modulo bagagliaio, TO1 il tettuccio apribile (D23)'
      pl: 'Wyłącznie CAN (CAN IS 500 kbit/s, CAN CONF i CAN CAR 125 kbit/s); nowsze pojazdy (od 2007-2008) otrzymały "rozwiniętą" generację BSI. CSS to jednostka zmiennego tłumienia, BSC to moduł bagażnika, TO1 to szyberdach (D23)'
      ru: 'Полностью CAN (CAN IS 500 кбит/с, CAN CONF и CAN CAR 125 кбит/с); более поздние автомобили (примерно с 2007-2008) получили «улучшенное» поколение BSI. CSS — блок переменного демпфирования, BSC — модуль багажника, TO1 — люк (D23)'
      zh: '全CAN架构（CAN IS 500 kbit/s，CAN CONF和CAN CAR 125 kbit/s）；较晚的车型（2007-2008年起）配备了"升级版"BSI。CSS为可变阻尼单元，BSC为后备箱模块，TO1为天窗（D23）'
      hu: 'Teljes CAN (CAN IS 500 kbit/s, CAN CONF és CAN CAR 125 kbit/s); a későbbi autók (kb. 2007-2008-tól) a „fejlesztett" BSI generációt kapták. A CSS a változtatható csillapítás egység, a BSC a csomagtér modul, a TO1 a napfénytető (D23)'
      pt: 'CAN total (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); os veículos mais recentes (a partir de 2007-2008) receberam a geração de BSI "evoluído". O CSS é a unidade de amortecimento variável, o BSC o módulo da bagageira, o TO1 o teto de abrir (D23)'
