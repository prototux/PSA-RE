versions:
  all:
    architecture: 'AEE2010.ev'
    years: '2019-2024'
    comment:
      en: '"Evolved" AEE2010 (BSI 2010 EV, from about 2016): same network split as AEE2010, used by the EMP2 cars from 2016 and the CMP cars (called "R3" by some openpilot porters). CMM only on thermal versions; VCU/OBC/TBMU/CMEL/AVAS and the LIN heater/compressor (CTPE/CCE) only on the electric versions (e-CMP). PFHM are the retractable flush door handles. VTH is the head-up display (option)'
      fr: 'AEE2010 "évoluée" (BSI 2010 EV, à partir de 2016 environ) : même découpage réseau que l''AEE2010, utilisée par les voitures EMP2 à partir de 2016 et les voitures CMP (appelée "R3" par certains portages openpilot). CMM uniquement sur les versions thermiques ; VCU/OBC/TBMU/CMEL/AVAS et le chauffage/compresseur LIN (CTPE/CCE) uniquement sur les versions électriques (e-CMP). PFHM sont les poignées de porte affleurantes. VTH est l''affichage tête haute (option)'
      es: 'AEE2010 "evolucionado" (BSI 2010 EV, desde aproximadamente 2016): mismo reparto de red que el AEE2010, utilizado por los coches EMP2 desde 2016 y los coches CMP (llamada "R3" por algunos portadores de openpilot). CMM solo en las versiones térmicas; VCU/OBC/TBMU/CMEL/AVAS y la calefacción/compresor LIN (CTPE/CCE) solo en las versiones eléctricas (e-CMP). PFHM son las manetas de puerta enrasadas. VTH es la pantalla de proyección (opcional)'
      de: '"Weiterentwickeltes" AEE2010 (BSI 2010 EV, ab etwa 2016): gleiche Netzwerkaufteilung wie AEE2010, verwendet von EMP2-Fahrzeugen ab 2016 und CMP-Fahrzeugen (von manchen openpilot-Portierern "R3" genannt). CMM nur bei Verbrennerversionen; VCU/OBC/TBMU/CMEL/AVAS und die LIN-Heizung/-Kompressor (CTPE/CCE) nur bei den Elektroversionen (e-CMP). PFHM sind die bündigen Türgriffe. VTH ist das Head-up-Display (optional)'
      it: 'AEE2010 "evoluto" (BSI 2010 EV, da circa il 2016): stessa suddivisione di rete dell''AEE2010, utilizzato dalle auto EMP2 dal 2016 e dalle auto CMP (chiamata "R3" da alcuni portatori di openpilot). CMM solo sulle versioni termiche; VCU/OBC/TBMU/CMEL/AVAS e il riscaldatore/compressore LIN (CTPE/CCE) solo sulle versioni elettriche (e-CMP). PFHM sono le maniglie a scomparsa. VTH è il display head-up (opzionale)'
      pl: '"Rozwinięty" AEE2010 (BSI 2010 EV, od około 2016 roku): ten sam podział sieci co AEE2010, stosowany w samochodach EMP2 od 2016 roku oraz w samochodach CMP (nazywany "R3" przez niektórych twórców portów openpilot). CMM tylko w wersjach spalinowych; VCU/OBC/TBMU/CMEL/AVAS oraz ogrzewanie/sprężarka LIN (CTPE/CCE) tylko w wersjach elektrycznych (e-CMP). PFHM to chowane klamki drzwi. VTH to wyświetlacz przezierny (opcja)'
      ru: '"Улучшенная" AEE2010 (BSI 2010 EV, примерно с 2016 года): такое же разделение сети, как у AEE2010, используется в автомобилях EMP2 с 2016 года и в автомобилях CMP (некоторые разработчики портов openpilot называют её "R3"). CMM только на версиях с ДВС; VCU/OBC/TBMU/CMEL/AVAS и отопитель/компрессор LIN (CTPE/CCE) только на электрических версиях (e-CMP). PFHM — утопленные дверные ручки. VTH — дисплей на лобовом стекле (опция)'
      zh: '"改进型"AEE2010(BSI 2010 EV,约自2016年起):网络划分与AEE2010相同,自2016年起用于EMP2车型及CMP车型(部分openpilot移植者称之为"R3")。CMM仅用于燃油版本;VCU/OBC/TBMU/CMEL/AVAS及LIN加热器/压缩机(CTPE/CCE)仅用于电动版本(e-CMP)。PFHM为隐藏式车门把手。VTH为抬头显示器(选装)'
      hu: '"Továbbfejlesztett" AEE2010 (BSI 2010 EV, kb. 2016-tól): ugyanaz a hálózati felosztás, mint az AEE2010-nél, az EMP2 járműveknél 2016-tól és a CMP járműveknél használják (egyes openpilot-portolók "R3"-nak nevezik). A CMM csak a belső égésű motoros változatoknál található meg; a VCU/OBC/TBMU/CMEL/AVAS és a LIN fűtés/kompresszor (CTPE/CCE) csak az elektromos változatoknál (e-CMP). A PFHM a süllyeszthető ajtókilincsek. A VTH a head-up kijelző (opció)'
      pt: 'AEE2010 "evoluída" (BSI 2010 EV, a partir de cerca de 2016): mesma divisão de rede que a AEE2010, usada pelos automóveis EMP2 a partir de 2016 e pelos automóveis CMP (chamada "R3" por alguns portadores de openpilot). CMM apenas nas versões térmicas; VCU/OBC/TBMU/CMEL/AVAS e o aquecedor/compressor LIN (CTPE/CCE) apenas nas versões elétricas (e-CMP). PFHM são os puxadores de porta rasos retráteis. VTH é o head-up display (opcional)'
