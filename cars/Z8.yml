    comment:
      en: 'Bi-VAN/CAN: CAN IS (250 kbit/s) for engine/gearbox/chassis, VAN comfort (125 kbit/s) for display, radio, clim, cluster, and VAN body buses (62.5 kbit/s) for airbag, COM2000, alarm and doors. CSS is the variable damping (AMVAR) unit, BCM the power boot lid'
      fr: 'Bi-VAN/CAN : CAN IS (250 kbit/s) pour moteur/boîte/liaison au sol, VAN confort (125 kbit/s) pour écran, autoradio, clim, combiné, et VAN carrosserie (62.5 kbit/s) pour airbag, COM2000, alarme et portes. CSS est l''amortissement variable (AMVAR), BCM le coffre motorise'
      es: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) para motor/caja de cambios/chasis, VAN confort (125 kbit/s) para pantalla, radio, clima, cuadro de instrumentos, y bus VAN carrocería (62,5 kbit/s) para airbag, COM2000, alarma y puertas. CSS es la unidad de amortiguación variable (AMVAR), BCM el maletero motorizado'
      de: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) für Motor/Getriebe/Fahrwerk, VAN Komfort (125 kbit/s) für Display, Radio, Klimaanlage, Kombiinstrument, und VAN-Karosseriebus (62,5 kbit/s) für Airbag, COM2000, Alarmanlage und Türen. CSS ist die variable Dämpfungseinheit (AMVAR), BCM die motorisierte Kofferraumklappe'
      it: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) per motore/cambio/telaio, VAN comfort (125 kbit/s) per display, autoradio, climatizzatore, quadro strumenti, e bus VAN carrozzeria (62,5 kbit/s) per airbag, COM2000, allarme e porte. CSS è l''unità di ammortizzazione variabile (AMVAR), BCM il bagagliaio motorizzato'
      pl: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) dla silnika/skrzyni biegów/podwozia, VAN komfort (125 kbit/s) dla wyświetlacza, radia, klimatyzacji, zestawu wskaźników, oraz magistrala VAN nadwozia (62,5 kbit/s) dla poduszki powietrznej, COM2000, alarmu i drzwi. CSS to jednostka zmiennego tłumienia (AMVAR), BCM to elektryczna klapa bagażnika'
      ru: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 кбит/с) для двигателя/коробки передач/шасси, VAN комфорт (125 кбит/с) для дисплея, радио, кондиционера, приборной панели, и кузовная шина VAN (62,5 кбит/с) для подушки безопасности, COM2000, сигнализации и дверей. CSS — блок переменного демпфирования (AMVAR), BCM — моторизованная крышка багажника'
      zh: '双VAN/CAN架构：双VAN/CAN架构：CAN IS（250 kbit/s）用于发动机/变速箱/底盘，VAN舒适总线（125 kbit/s）用于显示屏、收音机、空调、仪表组，VAN车身总线（62.5 kbit/s）用于安全气囊、COM2000、报警器和车门。CSS为可变阻尼单元（AMVAR），BCM为电动后备箱盖'
      hu: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) a motorhoz/váltóhoz/futóműhöz, VAN komfort (125 kbit/s) a kijelzőhöz, rádióhoz, klímához, műszerfalhoz, és VAN karosszéria busz (62,5 kbit/s) a légzsákhoz, COM2000-hez, riasztóhoz és ajtókhoz. A CSS a változtatható csillapítás egység (AMVAR), a BCM a motoros csomagtérfedél'
      pt: 'Bi-VAN/CAN: CAN IS (250 kbit/s) para motor/caixa de velocidades/chassis, VAN conforto (125 kbit/s) para ecrã, rádio, climatização, quadro de instrumentos, e bus VAN carroçaria (62,5 kbit/s) para airbag, COM2000, alarme e portas. O CSS é a unidade de amortecimento variável (AMVAR), o BCM a bagageira motorizada'
