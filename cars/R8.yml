codes:
  R82: 'peugeot 508 II SW'
  R83: ['peugeot 508 II', 'peugeot 508L (China)']  # peugeot 508L (China): also called 508 Lounge
  R8: 'peugeot 508 II (2019+)'

brand: ['peugeot']
platform: 'EMP2'
years: '2018-2025'

versions:
  all:
    architecture: 'AEE2010.ev'
    years: '2018-2025'
    comment:
      en: 'Kept the evolved AEE2010 through the 2023 facelift. "Evolved" AEE2010 (BSI 2010 EV, from about 2016): same network split as AEE2010, used by the EMP2 cars from 2016 and the CMP cars. VCU/OBC/TBMU/CMEL/RMCU are the plug-in hybrid parts (electric motors, charger, traction battery), BCM the power tailgate, BAAS the hands-free tailgate sensor, IVC_D the driver attention camera. BVN is the Night Vision infrared camera (option, also on 3008/5008 II phase 2, 408 II and DS 4 II, DS 7, DS 9), CSS the piloted suspension (Active Suspension Control, GT/PSE and higher powered versions), CLIM_AR the quad-zone climate control rear panel'
      fr: 'Conserve l''AEE2010 évoluée même après le restylage de 2023. AEE2010 "évoluée" (BSI 2010 EV, à partir de 2016 environ) : même découpage réseau que l''AEE2010, utilisée par les voitures EMP2 à partir de 2016 et les voitures CMP. VCU/OBC/TBMU/CMEL/RMCU sont les éléments hybrides rechargeables (moteurs électriques, chargeur, batterie de traction), BCM le hayon motorisé, BAAS le capteur d''ouverture mains libres du hayon, IVC_D la caméra de vigilance conducteur. BVN est la caméra infrarouge Night Vision (option, aussi sur 3008/5008 II phase 2, 408 II, DS 4 II, DS 7, DS 9), CSS la suspension pilotée (GT/PSE et versions puissantes), CLIM_AR le pupitre arrière de la climatisation quadrizone'
      es: 'Conserva el AEE2010 evolucionado incluso tras el restyling de 2023. AEE2010 "evolucionado" (BSI 2010 EV, desde aproximadamente 2016): mismo reparto de red que el AEE2010, utilizado por los coches EMP2 desde 2016 y los coches CMP. VCU/OBC/TBMU/CMEL/RMCU son los elementos híbridos enchufables (motores eléctricos, cargador, batería de tracción), BCM el portón trasero motorizado, BAAS el sensor de apertura manos libres del portón, IVC_D la cámara de vigilancia del conductor. BVN es la cámara infrarroja Night Vision (opcional, también en el 3008/5008 II fase 2, 408 II, DS 4 II, DS 7, DS 9), CSS la suspensión pilotada (GT/PSE y versiones más potentes), CLIM_AR el panel trasero de la climatización de cuatro zonas'
      de: 'Behält das weiterentwickelte AEE2010 auch nach dem Facelift 2023 bei. "Weiterentwickeltes" AEE2010 (BSI 2010 EV, ab etwa 2016): gleiche Netzwerkaufteilung wie AEE2010, verwendet von EMP2-Fahrzeugen ab 2016 und CMP-Fahrzeugen. VCU/OBC/TBMU/CMEL/RMCU sind die Plug-in-Hybrid-Komponenten (Elektromotoren, Ladegerät, Traktionsbatterie), BCM die elektrische Heckklappe, BAAS der Freihand-Sensor der Heckklappe, IVC_D die Fahreraufmerksamkeitskamera. BVN ist die Night-Vision-Infrarotkamera (optional, auch beim 3008/5008 II Phase 2, 408 II, DS 4 II, DS 7, DS 9), CSS die gesteuerte Federung (Active Suspension Control, GT/PSE und leistungsstärkere Versionen), CLIM_AR das Bedienfeld hinten der 4-Zonen-Klimaautomatik'
      it: 'Mantiene l''AEE2010 evoluto anche dopo il restyling del 2023. AEE2010 "evoluto" (BSI 2010 EV, da circa il 2016): stessa suddivisione di rete dell''AEE2010, utilizzato dalle auto EMP2 dal 2016 e dalle auto CMP. VCU/OBC/TBMU/CMEL/RMCU sono i componenti ibridi plug-in (motori elettrici, caricabatterie, batteria di trazione), BCM il portellone motorizzato, BAAS il sensore di apertura mani libere del portellone, IVC_D la telecamera di attenzione del conducente. BVN è la telecamera a infrarossi Night Vision (opzionale, anche su 3008/5008 II fase 2, 408 II, DS 4 II, DS 7, DS 9), CSS la sospensione pilotata (Active Suspension Control, versioni GT/PSE e più potenti), CLIM_AR il pannello posteriore del climatizzatore a quattro zone'
      pl: 'Zachowuje rozwinięty AEE2010 nawet po liftingu z 2023 roku. "Rozwinięty" AEE2010 (BSI 2010 EV, od około 2016 roku): ten sam podział sieci co AEE2010, stosowany w samochodach EMP2 od 2016 roku oraz w samochodach CMP. VCU/OBC/TBMU/CMEL/RMCU to elementy hybrydy plug-in (silniki elektryczne, ładowarka, akumulator trakcyjny), BCM to elektryczna klapa bagażnika, BAAS to czujnik otwierania klapy bez użycia rąk, IVC_D to kamera monitorująca uwagę kierowcy. BVN to kamera na podczerwień Night Vision (opcja, również w 3008/5008 II faza 2, 408 II, DS 4 II, DS 7, DS 9), CSS to sterowane zawieszenie (Active Suspension Control, wersje GT/PSE i mocniejsze), CLIM_AR to tylny panel czterostrefowej klimatyzacji'
      ru: 'Сохраняет улучшенную AEE2010 даже после рестайлинга 2023 года. "Улучшенная" AEE2010 (BSI 2010 EV, примерно с 2016 года): такое же разделение сети, как у AEE2010, используется в автомобилях EMP2 с 2016 года и в автомобилях CMP. VCU/OBC/TBMU/CMEL/RMCU — компоненты подключаемого гибрида (электродвигатели, зарядное устройство, тяговая батарея), BCM — электропривод багажника, BAAS — датчик бесконтактного открытия багажника, IVC_D — камера контроля внимания водителя. BVN — инфракрасная камера Night Vision (опция, также на 3008/5008 II фаза 2, 408 II, DS 4 II, DS 7, DS 9), CSS — управляемая подвеска (Active Suspension Control, версии GT/PSE и более мощные), CLIM_AR — задняя панель четырёхзонного климат-контроля'
      zh: '在2023年改款后仍保留改进型AEE2010。"改进型"AEE2010(BSI 2010 EV,约自2016年起):网络划分与AEE2010相同,自2016年起用于EMP2车型及CMP车型。VCU/OBC/TBMU/CMEL/RMCU为插电式混合动力部件(电动机、充电器、牵引电池),BCM为电动尾门,BAAS为尾门免提感应传感器,IVC_D为驾驶员注意力摄像头。BVN为Night Vision红外摄像头(选装,同样用于3008/5008 II第二阶段、408 II、DS 4 II、DS 7、DS 9),CSS为可控悬挂(Active Suspension Control,GT/PSE及更高功率版本),CLIM_AR为四区空调后排面板'
      hu: 'A 2023-as ráncfelvarrás után is megtartja a továbbfejlesztett AEE2010-et. "Továbbfejlesztett" AEE2010 (BSI 2010 EV, kb. 2016-tól): ugyanaz a hálózati felosztás, mint az AEE2010-nél, az EMP2 járműveknél 2016-tól és a CMP járműveknél használják. A VCU/OBC/TBMU/CMEL/RMCU a plug-in hibrid alkatrészek (villanymotorok, töltő, vonóakkumulátor), a BCM a motoros csomagtérajtó, a BAAS a kihangosított csomagtérnyitás-érzékelő, az IVC_D a vezetőfigyelmi kamera. A BVN a Night Vision infravörös kamera (opció, a 3008/5008 II 2. fázisán, a 408 II-n és a DS 4 II-n, DS 7-en, DS 9-en is megtalálható), a CSS a szabályozott felfüggesztés (Active Suspension Control, GT/PSE és nagyobb teljesítményű változatok), a CLIM_AR a négyzónás klíma hátsó panelje'
      pt: 'Manteve a AEE2010 evoluída mesmo após o restyling de 2023. AEE2010 "evoluída" (BSI 2010 EV, a partir de cerca de 2016): mesma divisão de rede que a AEE2010, usada pelos automóveis EMP2 a partir de 2016 e pelos automóveis CMP. VCU/OBC/TBMU/CMEL/RMCU são os componentes híbridos plug-in (motores elétricos, carregador, bateria de tração), BCM a porta da mala motorizada, BAAS o sensor de abertura mãos-livres da porta da mala, IVC_D a câmara de vigilância do condutor. BVN é a câmara infravermelhos Night Vision (opcional, também no 3008/5008 II fase 2, 408 II, DS 4 II, DS 7, DS 9), CSS a suspensão pilotada (GT/PSE e versões mais potentes), CLIM_AR o painel traseiro da climatização de quatro zonas'
