  all:
    architecture: 'AEE2001.full'
    years: '2001-2004'
    comment:
      en: 'First bi-VAN/CAN Citroen: CAN IS (engine, gearbox, ABS/ESP, steering angle, Hydractive 3 suspension BHI), VAN CAR1 (BSM, airbag, COM2000), VAN CAR2 (FAP additive, sunroof, alarm, door modules), VAN comfort (cluster, display, radio, navigation, CD changer, clim, parking aid). The RT3 head unit talks to the colour display over MOST'
      fr: 'Première Citroen bi-VAN/CAN : CAN IS (moteur, boîte, ABS/ESP, angle volant, suspension Hydractive 3 BHI), VAN CAR1 (BSM, airbag, COM2000), VAN CAR2 (additif FAP, toit ouvrant, alarme, modules de portes), VAN confort (combiné, écran, autoradio, navigation, changeur CD, clim, aide au stationnement). Le RT3 dialogue avec l''écran couleur en MOST'
      es: 'Primer Citroën bi-VAN/CAN: CAN IS (motor, caja de cambios, ABS/ESP, ángulo de volante, suspensión Hydractive 3 BHI), VAN CAR1 (BSM, airbag, COM2000), VAN CAR2 (aditivo FAP, techo solar, alarma, módulos de puertas), VAN confort (cuadro de instrumentos, pantalla, radio, navegación, cambiador de CD, clima, ayuda al aparcamiento). La unidad principal RT3 se comunica con la pantalla en color mediante MOST'
      de: 'Erster bi-VAN/CAN-Citroën: CAN IS (Motor, Getriebe, ABS/ESP, Lenkwinkel, Fahrwerk Hydractive 3 BHI), VAN CAR1 (BSM, Airbag, COM2000), VAN CAR2 (FAP-Additiv, Schiebedach, Alarmanlage, Türmodule), VAN Komfort (Kombiinstrument, Display, Radio, Navigation, CD-Wechsler, Klimaanlage, Einparkhilfe). Das RT3-Radio kommuniziert über MOST mit dem Farbdisplay'
      it: 'Prima Citroën bi-VAN/CAN: CAN IS (motore, cambio, ABS/ESP, angolo sterzo, sospensione Hydractive 3 BHI), VAN CAR1 (BSM, airbag, COM2000), VAN CAR2 (additivo FAP, tettuccio apribile, allarme, moduli porte), VAN comfort (quadro strumenti, display, autoradio, navigazione, cambia CD, climatizzatore, assistenza al parcheggio). L''unità RT3 comunica con il display a colori tramite MOST'
      pl: 'Pierwszy bi-VAN/CAN Citroën: CAN IS (silnik, skrzynia biegów, ABS/ESP, kąt skrętu kierownicy, zawieszenie Hydractive 3 BHI), VAN CAR1 (BSM, poduszka powietrzna, COM2000), VAN CAR2 (dodatek FAP, szyberdach, alarm, moduły drzwi), VAN komfort (zestaw wskaźników, wyświetlacz, radio, nawigacja, zmieniarka CD, klimatyzacja, asysta parkowania). Jednostka RT3 komunikuje się z wyświetlaczem kolorowym przez MOST'
      ru: 'Первый Citroën bi-VAN/CAN: CAN IS (двигатель, коробка передач, ABS/ESP, угол поворота руля, подвеска Hydractive 3 BHI), VAN CAR1 (BSM, подушка безопасности, COM2000), VAN CAR2 (присадка FAP, люк, сигнализация, модули дверей), VAN комфорт (приборная панель, дисплей, радио, навигация, CD-чейнджер, кондиционер, парковочная ассистенция). Головное устройство RT3 связывается с цветным дисплеем по шине MOST'
      zh: '首款双VAN/CAN架构雪铁龙：CAN IS（发动机、变速箱、ABS/ESP、转向角、Hydractive 3 BHI悬挂），VAN CAR1（BSM、安全气囊、COM2000），VAN CAR2（FAP添加剂、天窗、报警器、车门模块），VAN舒适总线（仪表组、显示屏、收音机、导航、CD换碟机、空调、驻车辅助）。RT3主机通过MOST总线与彩色显示屏通信'
      hu: 'Az első bi-VAN/CAN Citroën: CAN IS (motor, váltó, ABS/ESP, kormányszög, Hydractive 3 BHI felfüggesztés), VAN CAR1 (BSM, légzsák, COM2000), VAN CAR2 (FAP adalék, napfénytető, riasztó, ajtómodulok), VAN komfort (műszerfal, kijelző, rádió, navigáció, CD-váltó, klíma, parkolássegítő). Az RT3 fejegység MOST-on keresztül kommunikál a színes kijelzővel'
      pt: 'Primeiro Citroën bi-VAN/CAN: CAN IS (motor, caixa de velocidades, ABS/ESP, ângulo do volante, suspensão Hydractive 3 BHI), VAN CAR1 (BSM, airbag, COM2000), VAN CAR2 (aditivo FAP, teto de abrir, alarme, módulos de portas), VAN conforto (quadro de instrumentos, ecrã, rádio, navegação, carregador de CD, climatização, ajuda ao estacionamento). A unidade principal RT3 comunica com o ecrã a cores através de MOST'
