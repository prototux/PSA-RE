codes:
  C58: ['citroen C4 Picasso ph2', 'citroen Grand C4 Picasso ph2']  # facelift of the first C4 Picasso (B58)

brand: ['citroen']
platform: 'PF2'
years: '2010-2013'

versions:
  all:
    architecture: 'AEE2004.full'
    years: '2010-2013'
    comment:
      en: 'Same full CAN architecture as the B58, with the "evolved" BSI generation. Full CAN (CAN IS 500 kbit/s, CAN CONF and CAN CAR 125 kbit/s); late cars (2007-2008 onwards) got the "evolved" BSI generation. As on the B58: BCD remote display box, CLIM_AR additional rear air conditioning (Grand C4 Picasso), probable CAAR for the pneumatic rear suspension (not confirmed)'
      fr: 'Même architecture tout CAN que la B58, avec le BSI "évolué". Tout CAN (CAN IS 500 kbit/s, CAN CONF et CAN CAR 125 kbit/s) ; les dernières voitures (à partir de 2007-2008) ont reçu le BSI "évolué". Comme sur la B58 : afficheur déporté BCD, climatisation additionnelle arrière CLIM_AR (Grand C4 Picasso), CAAR probable pour la suspension arrière pneumatique (non confirmé)'
      es: 'Misma arquitectura totalmente CAN que el B58, con el BSI "evolucionado". Todo CAN (CAN IS 500 kbit/s, CAN CONF y CAN CAR 125 kbit/s); los últimos coches (a partir de 2007-2008) recibieron el BSI "evolucionado". Como en el B58: pantalla remota BCD, climatización adicional trasera CLIM_AR (Grand C4 Picasso), probable CAAR para la suspensión neumática trasera (no confirmado)'
      de: 'Gleiche vollständige CAN-Architektur wie der B58, mit dem "weiterentwickelten" BSI. Vollständig CAN (CAN IS 500 kbit/s, CAN CONF und CAN CAR 125 kbit/s); spätere Fahrzeuge (ab 2007-2008) erhielten das "weiterentwickelte" BSI. Wie beim B58: Fernanzeige BCD, zusätzliche Klimaanlage hinten CLIM_AR (Grand C4 Picasso), vermutlich CAAR für die pneumatische Hinterachsfederung (nicht bestätigt)'
      it: 'Stessa architettura completamente CAN della B58, con il BSI "evoluto". Tutto CAN (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); le vetture più recenti (dal 2007-2008) hanno ricevuto il BSI "evoluto". Come sulla B58: display remoto BCD, climatizzazione aggiuntiva posteriore CLIM_AR (Grand C4 Picasso), probabile CAAR per la sospensione pneumatica posteriore (non confermato)'
      pl: 'Ta sama architektura pełnego CAN co w B58, z "rozwiniętym" BSI. Pełny CAN (CAN IS 500 kbit/s, CAN CONF i CAN CAR 125 kbit/s); późniejsze samochody (od 2007-2008) otrzymały "rozwinięty" BSI. Podobnie jak w B58: zdalny wyświetlacz BCD, dodatkowa klimatyzacja tylna CLIM_AR (Grand C4 Picasso), prawdopodobnie CAAR dla pneumatycznego zawieszenia tylnego (niepotwierdzone)'
      ru: 'Такая же полностью CAN-архитектура, как у B58, с "улучшенным" поколением BSI. Полностью CAN (CAN IS 500 кбит/с, CAN CONF и CAN CAR 125 кбит/с); поздние автомобили (начиная примерно с 2007-2008) получили "улучшенное" поколение BSI. Как и на B58: выносной дисплей BCD, дополнительный задний кондиционер CLIM_AR (Grand C4 Picasso), вероятно CAAR для пневматической задней подвески (не подтверждено)'
      zh: '与B58相同的全CAN架构,配备"改进型"BSI。全CAN(CAN IS 500 kbit/s,CAN CONF和CAN CAR 125 kbit/s);后期车型(2007-2008年起)配备"改进型"BSI。与B58相同:BCD远程显示盒,CLIM_AR后排附加空调(Grand C4 Picasso),CAAR可能用于后气动悬挂(未确认)'
      hu: 'Ugyanaz a teljes CAN architektúra, mint a B58-nál, a "továbbfejlesztett" BSI generációval. Teljes CAN (CAN IS 500 kbit/s, CAN CONF és CAN CAR 125 kbit/s); a későbbi (2007-2008-tól gyártott) autók a "továbbfejlesztett" BSI generációt kapták. Mint a B58-nál: BCD távkijelző doboz, CLIM_AR kiegészítő hátsó klíma (Grand C4 Picasso), feltehetően CAAR a pneumatikus hátsó felfüggesztéshez (nem megerősített)'
      pt: 'Mesma arquitetura totalmente CAN que o B58, com o BSI "evoluído". Totalmente CAN (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); os automóveis mais recentes (a partir de 2007-2008) receberam o BSI "evoluído". Tal como no B58: mostrador remoto BCD, climatização adicional traseira CLIM_AR (Grand C4 Picasso), CAAR provável para a suspensão traseira pneumática (não confirmado)'
