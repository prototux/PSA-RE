versions:
  all:
    architecture: 'AEE2004.ev'
    years: '2009-2020'
    comment:
      en: 'Designed around the 2007 evolution of AEE2004 ("evolved" BSI, evolved engine bay fuse box, LIN battery sensor): same CAN IS / CAN CONF / CAN CAR split as AEE2004 (Valeo "evolved" BSI shared with the late C2/C3). CGPL is the LPG unit of some EB engines'
      fr: 'Conçue autour de l''evolution 2007 de l''AEE2004 (BSI "évolué", BSM évolué, capteur batterie LIN) : même découpage CAN IS / CAN CONF / CAN CAR que l''AEE2004 (BSI Valeo "évolué" commun avec les dernières C2/C3). CGPL est le calculateur GPL de certains moteurs EB'
      es: 'Diseñada en torno a la evolución de 2007 del AEE2004 (BSI "evolucionado", caja de fusibles del compartimento motor evolucionada, sensor de batería LIN): misma división CAN IS / CAN CONF / CAN CAR que el AEE2004 (BSI "evolucionado" de Valeo, compartido con los últimos C2/C3). CGPL es la unidad de GLP de algunos motores EB'
      de: 'basierend auf der 2007er Weiterentwicklung des AEE2004 (weiterentwickeltes BSI, weiterentwickelter Sicherungskasten im Motorraum, LIN-Batteriesensor): gleiche CAN-IS-/CAN-CONF-/CAN-CAR-Aufteilung wie AEE2004 (weiterentwickeltes Valeo-BSI, gemeinsam mit den späten C2/C3). CGPL ist die LPG-Einheit einiger EB-Motoren'
      it: 'Progettata sull''evoluzione 2007 dell''AEE2004 (BSI "evoluto", scatola fusibili vano motore evoluta, sensore batteria LIN): stessa suddivisione CAN IS / CAN CONF / CAN CAR dell''AEE2004 (BSI Valeo "evoluto" condiviso con le ultime C2/C3). CGPL è la centralina GPL di alcuni motori EB'
      pl: 'Zaprojektowana na bazie ewolucji AEE2004 z 2007 roku ("rozwinięty" BSI, rozwinięta skrzynka bezpieczników w komorze silnika, czujnik akumulatora LIN): taki sam podział CAN IS / CAN CONF / CAN CAR jak w AEE2004 ("rozwinięty" BSI Valeo, wspólny z późniejszymi C2/C3). CGPL to sterownik LPG niektórych silników EB'
      ru: 'Разработана на основе версии AEE2004 2007 года («улучшенный» BSI, улучшенный блок предохранителей моторного отсека, LIN-датчик батареи): такое же разделение CAN IS / CAN CONF / CAN CAR, как у AEE2004 («улучшенный» BSI Valeo, общий с поздними C2/C3). CGPL — блок ГБО некоторых двигателей EB'
      zh: '基于AEE2004（2004年电气架构）2007年改进版设计（"升级版"BSI、升级版发动机舱保险丝盒、LIN电池传感器）：与AEE2004相同的CAN IS/CAN CONF/CAN CAR划分（与后期C2/C3共用的"升级版"Valeo BSI）。CGPL为部分EB发动机的液化石油气（LPG）控制器'
      hu: 'Az AEE2004 2007-es fejlesztésére épül ("fejlesztett" BSI, fejlesztett motortéri biztosítékdoboz, LIN akkumulátorérzékelő): ugyanaz a CAN IS / CAN CONF / CAN CAR felosztás, mint az AEE2004-nél (a késői C2/C3-mal közös "fejlesztett" Valeo BSI). A CGPL egyes EB motorok LPG-egysége'
      pt: 'Concebida com base na evolução de 2007 do AEE2004 (BSI "evoluído", caixa de fusíveis do compartimento do motor evoluída, sensor de bateria LIN): a mesma divisão CAN IS / CAN CONF / CAN CAR do AEE2004 (BSI "evoluído" da Valeo, partilhado com os últimos C2/C3). O CGPL é a unidade de GPL de alguns motores EB'
