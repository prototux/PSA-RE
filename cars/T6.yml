    comment:
      en: 'Full CAN (CAN IS 500 kbit/s, CAN CONF and CAN CAR 125 kbit/s); late cars (2007-2008 onwards) got the "evolved" BSI generation. Production went on until 2014 outside Europe'
      fr: 'Tout CAN (CAN IS 500 kbit/s, CAN CONF et CAN CAR 125 kbit/s) ; les dernières voitures (à partir de 2007-2008) ont reçu le BSI "évolué". Production poursuivie jusqu''en 2014 hors d''Europe'
      es: 'Todo CAN (CAN IS 500 kbit/s, CAN CONF y CAN CAR 125 kbit/s); los vehículos más recientes (a partir de 2007-2008) recibieron la generación de BSI "evolucionado". La producción continuó hasta 2014 fuera de Europa'
      de: 'vollständiges CAN (CAN IS 500 kbit/s, CAN CONF und CAN CAR 125 kbit/s); spätere Fahrzeuge (ab 2007-2008) erhielten die „weiterentwickelte" BSI-Generation. Die Produktion lief außerhalb Europas bis 2014 weiter'
      it: 'Tutto CAN (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); le vetture più recenti (dal 2007-2008) hanno ricevuto la generazione BSI "evoluta". La produzione è proseguita fino al 2014 fuori dall''Europa'
      pl: 'Wyłącznie CAN (CAN IS 500 kbit/s, CAN CONF i CAN CAR 125 kbit/s); nowsze pojazdy (od 2007-2008) otrzymały "rozwiniętą" generację BSI. Produkcja trwała do 2014 roku poza Europą'
      ru: 'Полностью CAN (CAN IS 500 кбит/с, CAN CONF и CAN CAR 125 кбит/с); более поздние автомобили (примерно с 2007-2008) получили «улучшенное» поколение BSI. Производство продолжалось до 2014 года за пределами Европы'
      zh: '全CAN架构（CAN IS 500 kbit/s，CAN CONF和CAN CAR 125 kbit/s）；较晚的车型（2007-2008年起）配备了"升级版"BSI。欧洲以外地区的生产一直持续到2014年'
      hu: 'Teljes CAN (CAN IS 500 kbit/s, CAN CONF és CAN CAR 125 kbit/s); a későbbi autók (kb. 2007-2008-tól) a „fejlesztett" BSI generációt kapták. A gyártás Európán kívül 2014-ig folytatódott'
      pt: 'CAN total (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); os veículos mais recentes (a partir de 2007-2008) receberam a geração de BSI "evoluído". A produção continuou até 2014 fora da Europa'
