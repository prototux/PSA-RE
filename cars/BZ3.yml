      en: 'Assumed identical to the C4 L (B73): Second generation full CAN: HS (IS, LAS...) for powertrain/chassis, LS CONF/CAR/INFO-DIV for body and infotainment, several LIN buses behind the BSI'
      fr: 'Supposée identique à la C4 L (B73) : Tout CAN de deuxième génération : HS (IS, LAS...) pour la chaîne de traction/liaison au sol, LS CONF/CAR/INFO-DIV pour l''habitacle et l''info-divertissement, plusieurs bus LIN derrière le BSI'
      es: 'Se supone idéntica al C4 L (B73): todo CAN de segunda generación: HS (IS, LAS...) para el grupo motopropulsor/chasis, LS CONF/CAR/INFO-DIV para el habitáculo y el infoentretenimiento, varios buses LIN detrás del BSI'
      de: 'Vermutlich identisch mit dem C4 L (B73): CAN-Vollausbau der zweiten Generation: HS (IS, LAS...) für Antriebsstrang/Fahrwerk, LS CONF/CAR/INFO-DIV für Innenraum und Infotainment, mehrere LIN-Busse hinter dem BSI'
      it: 'Si presume identica alla C4 L (B73): tutto CAN di seconda generazione: HS (IS, LAS...) per gruppo motopropulsore/telaio, LS CONF/CAR/INFO-DIV per abitacolo e infotainment, diversi bus LIN dietro il BSI'
      pl: 'Zakładana jako identyczna z C4 L (B73): wyłącznie CAN drugiej generacji: HS (IS, LAS...) dla układu napędowego/podwozia, LS CONF/CAR/INFO-DIV dla nadwozia i systemu multimedialnego, kilka magistrali LIN za BSI'
      ru: 'Предположительно идентична C4 L (B73): полностью CAN второго поколения: HS (IS, LAS...) для силового агрегата/шасси, LS CONF/CAR/INFO-DIV для салона и мультимедиа, несколько шин LIN за BSI'
      zh: '假定与C4 L（B73）相同：第二代全CAN架构：HS（IS、LAS等）用于动力总成/底盘，LS CONF/CAR/INFO-DIV用于车身和信息娱乐系统，BSI后方有多条LIN总线'
      hu: 'Feltehetően megegyezik a C4 L-lel (B73): második generációs teljes CAN: HS (IS, LAS...) a hajtáslánchoz/futóműhöz, LS CONF/CAR/INFO-DIV a karosszériához és az infotainmenthez, több LIN busz a BSI mögött'
      pt: 'Presume-se idêntica ao C4 L (B73): CAN total de segunda geração: HS (IS, LAS...) para o grupo motopropulsor/chassis, LS CONF/CAR/INFO-DIV para o habitáculo e o info-entretenimento, vários bus LIN atrás do BSI'
