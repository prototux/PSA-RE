codes:
  M69: ['peugeot Partner I (South America)', 'citroen Berlingo I (South America)']

brand: ['peugeot', 'citroen']
comment:
  en: 'Partner / Berlingo I built for South America, multiplexed with the AEE2004 BSI and the engines of the local market (flex fuel). The ECU list is partly guessed'
  fr: 'Partner / Berlingo I produit pour l''Amérique du Sud, multiplexé avec la BSI AEE2004 et les moteurs du marché local (flex fuel). La liste des calculateurs est en partie supposée'
  es: 'Partner / Berlingo I fabricado para Sudamérica, multiplexado con la BSI AEE2004 y los motores del mercado local (flex fuel). La lista de centralitas es en parte supuesta'
  de: 'Für Südamerika gebauter Partner / Berlingo I, vernetzt mit dem AEE2004-BSI und den Motoren des lokalen Marktes (Flex Fuel). Die Steuergeräteliste ist teilweise vermutet'
  it: 'Partner / Berlingo I prodotto per il Sud America, multiplexato con la BSI AEE2004 e i motori del mercato locale (flex fuel). L''elenco delle centraline è in parte ipotizzato'
  pl: 'Partner / Berlingo I produkowany dla Ameryki Południowej, z multipleksowaniem BSI AEE2004 i silnikami rynku lokalnego (flex fuel). Lista sterowników jest częściowo przypuszczalna'
  ru: 'Partner / Berlingo I для Южной Америки, с мультиплексной сетью на BSI AEE2004 и двигателями местного рынка (flex fuel). Список блоков управления частично предположительный'
  zh: '为南美市场生产的Partner / Berlingo I，采用AEE2004 BSI多路复用网络和当地市场的发动机（灵活燃料）。ECU列表部分为推测'
  hu: 'Dél-Amerikára gyártott Partner / Berlingo I, AEE2004 BSI multiplex hálózattal és a helyi piac motorjaival (flex fuel). A vezérlőegységek listája részben feltételezett'
  pt: 'Partner / Berlingo I produzido para a América do Sul, multiplexado com a BSI AEE2004 e os motores do mercado local (flex fuel). A lista de centralinas é em parte suposta'

