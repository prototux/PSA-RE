  rcz:
    architecture: 'AEE2004.ev'
    years: '2010-2015'
    codes: ['T75']
    comment:
      en: 'Same AEE2004 evolution as the 308, with three ECUs found on no other AEE2004 car: CLOCK (multiplexed analogue clock between the central vents, set from the multifunction screen), DEF (active rear spoiler, 2 deployment stages; the RCZ-R has a fixed wing instead) and BDCP (pyrotechnic active bonnet for pedestrian protection, standard). The only other PSA cars with a mobile spoiler and an active bonnet are the C6 V6 (X6), the 408 II (P54) also has an active bonnet'
      fr: 'Même évolution AEE2004 que la 308, avec trois calculateurs absents de toutes les autres voitures AEE2004 : CLOCK (montre analogique multiplexée entre les aérateurs centraux, réglée depuis l''écran multifonction), DEF (aileron arrière mobile, 2 positions ; la RCZ-R a un aileron fixe) et BDCP (capot actif pyrotechnique de protection des piétons, de série). Les seules autres PSA avec aileron mobile et capot actif sont les C6 V6 (X6), la 408 II (P54) a aussi un capot actif'
      es: 'Misma evolución AEE2004 que el 308, con tres unidades de control ausentes en el resto de coches AEE2004: CLOCK (reloj analógico multiplexado entre las salidas de aire centrales, ajustado desde la pantalla multifunción), DEF (alerón trasero activo, 2 posiciones; el RCZ-R tiene un alerón fijo) y BDCP (capó activo pirotécnico de protección de peatones, de serie). Los únicos otros PSA con alerón móvil y capó activo son el C6 V6 (X6), el 408 II (P54) también tiene capó activo'
      de: 'Gleiche AEE2004-Weiterentwicklung wie der 308, mit drei Steuergeräten, die bei keinem anderen AEE2004-Fahrzeug vorkommen: CLOCK (multiplexed Analoguhr zwischen den mittleren Lüftungsdüsen, über den Multifunktionsbildschirm eingestellt), DEF (aktiver Heckspoiler, 2 Ausfahrstufen; der RCZ-R hat stattdessen einen festen Flügel) und BDCP (pyrotechnische aktive Motorhaube zum Fußgängerschutz, serienmäßig). Die einzigen anderen PSA-Fahrzeuge mit beweglichem Spoiler und aktiver Motorhaube sind der C6 V6 (X6), der 408 II (P54) hat ebenfalls eine aktive Motorhaube'
      it: 'Stessa evoluzione AEE2004 della 308, con tre centraline assenti su tutte le altre vetture AEE2004: CLOCK (orologio analogico multiplexato tra le bocchette centrali, regolato dallo schermo multifunzione), DEF (alettone posteriore attivo, 2 posizioni; la RCZ-R ha invece un alettone fisso) e BDCP (cofano attivo pirotecnico per la protezione dei pedoni, di serie). Le uniche altre PSA con alettone mobile e cofano attivo sono la C6 V6 (X6), anche la 408 II (P54) ha il cofano attivo'
      pl: 'Ta sama ewolucja AEE2004 co w 308, z trzema sterownikami nieobecnymi w żadnym innym samochodzie AEE2004: CLOCK (multipleksowany zegar analogowy między centralnymi nawiewami, ustawiany z ekranu multimedialnego), DEF (aktywny tylny spojler, 2 pozycje; RCZ-R ma zamiast tego stały spojler) oraz BDCP (pirotechniczna aktywna maska chroniąca pieszych, seryjnie). Jedynymi innymi samochodami PSA z ruchomym spojlerem i aktywną maską są C6 V6 (X6), 408 II (P54) również ma aktywną maskę'
      ru: 'Такая же эволюция AEE2004, как у 308, с тремя блоками управления, отсутствующими на всех остальных автомобилях AEE2004: CLOCK (мультиплексированные аналоговые часы между центральными дефлекторами, настраиваемые с мультимедийного экрана), DEF (активный задний спойлер, 2 положения; у RCZ-R вместо этого фиксированное крыло) и BDCP (пиротехнический активный капот для защиты пешеходов, в стандартной комплектации). Единственные другие автомобили PSA с подвижным спойлером и активным капотом — это C6 V6 (X6), у 408 II (P54) также есть активный капот'
      zh: '与308相同的AEE2004改进版本,拥有其他AEE2004车型均没有的三个控制单元:CLOCK(位于中央出风口之间的复用模拟时钟,通过多功能屏幕设置)、DEF(主动后扰流板,两级展开;RCZ-R则为固定式扰流板)和BDCP(标配的行人保护烟火式主动机罩)。唯一配备可移动扰流板和主动机罩的其他标致雪铁龙车型是C6 V6(X6),408 II(P54)也配备主动机罩'
      hu: 'Ugyanaz az AEE2004 továbbfejlesztés, mint a 308-nál, három olyan vezérlőegységgel, amelyek egyetlen más AEE2004 autóban sem találhatók meg: CLOCK (a központi szellőzőnyílások között elhelyezett multiplexelt analóg óra, a multifunkciós képernyőről állítható), DEF (aktív hátsó spoiler, 2 kiemelési fokozat; az RCZ-R-nél helyette fix szárny van) és BDCP (gyalogosvédelmi pirotechnikus aktív motorháztető, sorozatgyártásban). Az egyetlen más PSA autó mozgatható spoilerrel és aktív motorháztetővel a C6 V6 (X6), a 408 II-nek (P54) is van aktív motorháztetője'
      pt: 'Mesma evolução AEE2004 que o 308, com três unidades de controlo ausentes de todos os outros automóveis AEE2004: CLOCK (relógio analógico multiplexado entre as saídas de ar centrais, ajustado a partir do ecrã multifunções), DEF (aerofólio traseiro ativo, 2 posições; o RCZ-R tem em vez disso um aerofólio fixo) e BDCP (capot ativo pirotécnico de proteção de peões, de série). Os únicos outros automóveis PSA com aerofólio móvel e capot ativo são o C6 V6 (X6); o 408 II (P54) também tem capot ativo'
