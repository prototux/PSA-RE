  cc:
    architecture: 'AEE2004.ev'
    years: '2009-2015'
    codes: ['T76']
    comment:
      en: 'Same AEE2004 evolution as the 308. BTE is the retractable hardtop controller (also on the 307 CC and 207 CC); the pyrotechnic pop-up roll bars of the 307 CC are carried over'
      fr: 'Même évolution AEE2004 que la 308. BTE est le boîtier de toit escamotable (aussi sur les 307 CC et 207 CC) ; les arceaux pyrotechniques escamotables de la 307 CC sont repris'
      es: 'Misma evolución AEE2004 que el 308. BTE es la unidad del techo retráctil (también en los 307 CC y 207 CC); se conservan los arcos pirotécnicos emergentes del 307 CC'
      de: 'Gleiche AEE2004-Weiterentwicklung wie der 308. BTE ist das Steuergerät des versenkbaren Hardtops (auch beim 307 CC und 207 CC); die pyrotechnischen ausfahrbaren Überrollbügel des 307 CC werden übernommen'
      it: 'Stessa evoluzione AEE2004 della 308. BTE è la centralina del tetto rigido retrattile (anche su 307 CC e 207 CC); gli archi pirotecnici estraibili della 307 CC sono ripresi'
      pl: 'Ta sama ewolucja AEE2004 co w 308. BTE to sterownik chowanego twardego dachu (również w 307 CC i 207 CC); pirotechniczne wysuwane pałąki z 307 CC zostały zachowane'
      ru: 'Такая же эволюция AEE2004, как у 308. BTE — блок управления складывающейся жёсткой крышей (также на 307 CC и 207 CC); пиротехнические выдвижные дуги безопасности 307 CC сохранены'
      zh: '与308相同的AEE2004改进版本。BTE为可伸缩硬顶控制器(也用于307 CC和207 CC);沿用307 CC的烟火式弹出防滚杠'
      hu: 'Ugyanaz az AEE2004 továbbfejlesztés, mint a 308-nál. A BTE a behúzható kemény tető vezérlője (a 307 CC-n és 207 CC-n is megtalálható); a 307 CC pirotechnikus kiugró biztonsági íveit átvették'
      pt: 'Mesma evolução AEE2004 que o 308. BTE é a unidade de controlo do tejadilho rígido retrátil (também no 307 CC e 207 CC); os arcos pirotécnicos rebatíveis do 307 CC são retomados'
