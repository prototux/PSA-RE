    comment:
      en: 'Designed around the 2007 evolution of AEE2004 ("evolved" BSI, evolved engine bay fuse box, LIN battery sensor): same CAN IS / CAN CONF / CAN CAR split as AEE2004. MATT is the dot matrix display of the cluster, BSTL the lane departure warning (AFIL, option). The 408 (T73) was produced until 2021 in China/South America'
      fr: 'Conçue autour de l''évolution 2007 de l''AEE2004 (BSI "évolué", BSM évolué, capteur batterie LIN) : même découpage CAN IS / CAN CONF / CAN CAR que l''AEE2004. MATT est l''afficheur matriciel du combiné, BSTL l''alerte de franchissement de ligne (AFIL, option). La 408 (T73) a été produite jusqu''en 2021 en Chine/Amérique du Sud'
      es: 'Diseñada en torno a la evolución de 2007 del AEE2004 (BSI "evolucionado", caja de fusibles del compartimento motor evolucionada, sensor de batería LIN): mismo reparto CAN IS / CAN CONF / CAN CAR que el AEE2004. MATT es la pantalla matricial del cuadro, BSTL la alerta de salida de carril (AFIL, opcional). El 408 (T73) se fabricó hasta 2021 en China/Sudamérica'
      de: 'Entwickelt auf Basis der Weiterentwicklung 2007 der AEE2004 ("weiterentwickeltes" BSI, weiterentwickelter Sicherungskasten im Motorraum, LIN-Batteriesensor): gleiche CAN IS / CAN CONF / CAN CAR-Aufteilung wie AEE2004. MATT ist das Punktmatrix-Display der Instrumententafel, BSTL die Spurverlassenswarnung (AFIL, optional). Der 408 (T73) wurde bis 2021 in China/Südamerika produziert'
      it: 'Progettata sull''evoluzione 2007 dell''AEE2004 (BSI "evoluto", scatola fusibili vano motore evoluta, sensore batteria LIN): stessa suddivisione CAN IS / CAN CONF / CAN CAR dell''AEE2004. MATT è il display a matrice di punti del quadro strumenti, BSTL l''avviso di superamento corsia (AFIL, opzionale). La 408 (T73) è stata prodotta fino al 2021 in Cina/Sud America'
      pl: 'Zaprojektowana na bazie ewolucji AEE2004 z 2007 roku ("rozwinięty" BSI, rozwinięta skrzynka bezpieczników w komorze silnika, czujnik akumulatora LIN): ten sam podział CAN IS / CAN CONF / CAN CAR co w AEE2004. MATT to matrycowy wyświetlacz zestawu wskaźników, BSTL to ostrzeżenie o zjeżdżaniu z pasa ruchu (AFIL, opcja). Model 408 (T73) był produkowany do 2021 roku w Chinach/Ameryce Południowej'
      ru: 'Разработана на основе эволюции AEE2004 2007 года ("улучшенный" BSI, улучшенный блок предохранителей моторного отсека, датчик батареи LIN): такое же разделение CAN IS / CAN CONF / CAN CAR, как у AEE2004. MATT — точечно-матричный дисплей приборной панели, BSTL — предупреждение о съезде с полосы (AFIL, опция). Модель 408 (T73) выпускалась до 2021 года в Китае/Южной Америке'
      zh: '基于AEE2004于2007年的改进版本设计("改进型"BSI、改进型发动机舱保险丝盒、LIN电池传感器):CAN IS/CAN CONF/CAN CAR划分与AEE2004相同。MATT为仪表盘点阵显示屏,BSTL为车道偏离预警(AFIL,选装)。408(T73)在中国/南美生产至2021年'
      hu: 'A AEE2004 2007-es továbbfejlesztésére épül ("továbbfejlesztett" BSI, továbbfejlesztett motortéri biztosítékdoboz, LIN akkumulátorérzékelő): ugyanaz a CAN IS / CAN CONF / CAN CAR felosztás, mint az AEE2004-nél. A MATT a műszerfal pontmátrix kijelzője, a BSTL a sávelhagyás-figyelmeztetés (AFIL, opció). A 408-as (T73) 2021-ig készült Kínában/Dél-Amerikában'
      pt: 'Concebida a partir da evolução de 2007 da AEE2004 (BSI "evoluído", caixa de fusíveis do compartimento motor evoluída, sensor de bateria LIN): mesma divisão CAN IS / CAN CONF / CAN CAR que a AEE2004. O MATT é o mostrador matricial do quadro de instrumentos, o BSTL o alerta de saída de faixa (AFIL, opcional). O 408 (T73) foi produzido até 2021 na China/América do Sul'
