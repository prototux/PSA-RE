    comment:
      en: 'Built by Sevel Nord but with PSA full CAN electronics ("transgamme" BSI, then "evolved" BSI). BSG is the body builder interface box'
      fr: 'Fabrique par Sevel Nord mais avec une electronique PSA tout CAN (BSI "transgamme" puis "evolue"). BSG est le boitier transformateur carrossier'
      es: 'Fabricado por Sevel Nord pero con electrónica PSA todo CAN (BSI "transgamme", luego "evolucionado"). BSG es la caja de interfaz para transformadores carroceros'
      de: 'Von Sevel Nord gebaut, aber mit PSA-CAN-Vollelektronik ("Transgamme"-BSI, dann weiterentwickeltes BSI). BSG ist die Schnittstellenbox für Aufbauhersteller'
      it: 'Costruita da Sevel Nord ma con elettronica PSA tutto CAN (BSI "transgamme", poi "evoluto"). BSG è la centralina di interfaccia per allestitori'
      pl: 'Produkowany przez Sevel Nord, ale z elektroniką PSA wyłącznie CAN (BSI "transgamme", następnie "rozwinięty"). BSG to skrzynka interfejsu dla zabudowy nadwozia'
      ru: 'Построен Sevel Nord, но с полностью CAN-электроникой PSA (BSI «transgamme», затем «улучшенный»). BSG — блок интерфейса для кузовных надстроек'
      zh: '由Sevel Nord制造，但采用PSA全CAN电子系统（"transgamme"BSI，后为"升级版"BSI）。BSG为车身改装商接口盒'
      hu: 'A Sevel Nord gyártja, de PSA teljes CAN elektronikával ("transgamme" BSI, majd "fejlesztett" BSI). A BSG a karosszéria-átalakítói interfészdoboz'
      pt: 'Fabricado pela Sevel Nord mas com eletrónica PSA CAN total (BSI "transgamme", depois "evoluído"). O BSG é a caixa de interface para carroçadores'
