codes:
  A42: 'citroen C3 Pluriel'

brand: ['citroen']
platform: 'PF1'
years: '2003-2010'

versions:
  van:
    architecture: 'AEE2001.full'
    years: '2003-2005'
    comment:
      en: 'Bi-VAN/CAN: CAN IS (250 kbit/s) for engine/gearbox/chassis, VAN comfort (125 kbit/s) for display, radio, clim, cluster, and VAN body buses (62.5 kbit/s) for airbag, COM2000, alarm and doors. TO1 is the electric roof module'
      fr: 'Bi-VAN/CAN : CAN IS (250 kbit/s) pour moteur/boîte/liaison au sol, VAN confort (125 kbit/s) pour écran, autoradio, clim, combiné, et VAN carrosserie (62.5 kbit/s) pour airbag, COM2000, alarme et portes. TO1 est le module de toit électrique'
      es: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) para motor/caja de cambios/chasis, VAN confort (125 kbit/s) para pantalla, radio, clima, cuadro de instrumentos, y bus VAN carrocería (62,5 kbit/s) para airbag, COM2000, alarma y puertas. TO1 es el módulo de techo eléctrico'
      de: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) für Motor/Getriebe/Fahrwerk, VAN Komfort (125 kbit/s) für Display, Radio, Klimaanlage, Kombiinstrument, und VAN-Karosseriebus (62,5 kbit/s) für Airbag, COM2000, Alarmanlage und Türen. TO1 ist das elektrische Dachmodul'
      it: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) per motore/cambio/telaio, VAN comfort (125 kbit/s) per display, autoradio, climatizzatore, quadro strumenti, e bus VAN carrozzeria (62,5 kbit/s) per airbag, COM2000, allarme e porte. TO1 è il modulo del tetto elettrico'
      pl: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) dla silnika/skrzyni biegów/podwozia, VAN komfort (125 kbit/s) dla wyświetlacza, radia, klimatyzacji, zestawu wskaźników, oraz magistrala VAN nadwozia (62,5 kbit/s) dla poduszki powietrznej, COM2000, alarmu i drzwi. TO1 to moduł elektrycznego dachu'
      ru: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 кбит/с) для двигателя/коробки передач/шасси, VAN комфорт (125 кбит/с) для дисплея, радио, кондиционера, приборной панели, и кузовная шина VAN (62,5 кбит/с) для подушки безопасности, COM2000, сигнализации и дверей. TO1 — модуль электрической крыши'
      zh: '双VAN/CAN架构：双VAN/CAN架构：CAN IS（250 kbit/s）用于发动机/变速箱/底盘，VAN舒适总线（125 kbit/s）用于显示屏、收音机、空调、仪表组，VAN车身总线（62.5 kbit/s）用于安全气囊、COM2000、报警器和车门。TO1为电动车顶模块'
      hu: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) a motorhoz/váltóhoz/futóműhöz, VAN komfort (125 kbit/s) a kijelzőhöz, rádióhoz, klímához, műszerfalhoz, és VAN karosszéria busz (62,5 kbit/s) a légzsákhoz, COM2000-hez, riasztóhoz és ajtókhoz. A TO1 az elektromos tető modul'
      pt: 'Bi-VAN/CAN: CAN IS (250 kbit/s) para motor/caixa de velocidades/chassis, VAN conforto (125 kbit/s) para ecrã, rádio, climatização, quadrante, e barramentos VAN de carroçaria (62,5 kbit/s) para airbag, COM2000, alarme e portas. O TO1 é o módulo do teto elétrico.'
    nodes:
      HS: ['BSI', 'CMM', 'BVA', 'ABS', 'DAE']
      VAN: ['BSI', 'HDC', 'CMB', 'EMF', 'RAD', 'BTEL', 'CDC', 'CLIM_AV', 'RBG', 'ALARM', 'AAS', 'CDPL', 'ADDGO', 'MAE', 'TO1']
    optional_nodes: ['BVA', 'BTEL', 'CDC', 'CLIM_AV', 'ALARM', 'AAS', 'CDPL', 'ADDGO', 'MAE']
    buses: ['HS.IS', 'VAN.CAR', 'VAN.CONF']
  can:
    architecture: 'AEE2004.full'
    years: '2005-2010'
    comment:
      en: 'Switched to full CAN in 2005 with the C3. Full CAN (CAN IS 500 kbit/s, CAN CONF and CAN CAR 125 kbit/s); late cars (2007-2008 onwards) got the "evolved" BSI generation'
      fr: 'Passage au tout CAN en 2005 avec la C3. Tout CAN (CAN IS 500 kbit/s, CAN CONF et CAN CAR 125 kbit/s) ; les dernières voitures (à partir de 2007-2008) ont reçu le BSI "évolué"'
      es: 'Pasó a todo CAN en 2005 con el C3. Todo CAN (CAN IS 500 kbit/s, CAN CONF y CAN CAR 125 kbit/s); los vehículos más recientes (a partir de 2007-2008) recibieron la generación de BSI "evolucionado"'
      de: 'Wechsel auf vollständiges CAN im Jahr 2005 mit dem C3. vollständiges CAN (CAN IS 500 kbit/s, CAN CONF und CAN CAR 125 kbit/s); spätere Fahrzeuge (ab 2007-2008) erhielten die „weiterentwickelte" BSI-Generation'
      it: 'Passaggio al tutto CAN nel 2005 con la C3. Tutto CAN (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); le vetture più recenti (dal 2007-2008) hanno ricevuto la generazione BSI "evoluta"'
      pl: 'Przejście na wyłącznie CAN w 2005 roku wraz z C3. Wyłącznie CAN (CAN IS 500 kbit/s, CAN CONF i CAN CAR 125 kbit/s); nowsze pojazdy (od 2007-2008) otrzymały "rozwiniętą" generację BSI'
      ru: 'Переход на полностью CAN в 2005 году вместе с C3. Полностью CAN (CAN IS 500 кбит/с, CAN CONF и CAN CAR 125 кбит/с); более поздние автомобили (примерно с 2007-2008) получили «улучшенное» поколение BSI'
      zh: '2005年随C3车型切换为全CAN架构。全CAN架构（CAN IS 500 kbit/s，CAN CONF和CAN CAR 125 kbit/s）；较晚的车型（2007-2008年起）配备了"升级版"BSI'
      hu: '2005-ben, a C3-mal együtt váltott teljes CAN-ra. Teljes CAN (CAN IS 500 kbit/s, CAN CONF és CAN CAR 125 kbit/s); a későbbi autók (kb. 2007-2008-tól) a „fejlesztett" BSI generációt kapták'
      pt: 'Passou a CAN total em 2005 com o C3. CAN total (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); os veículos mais recentes (a partir de 2007-2008) receberam a geração de BSI "evoluído"'
    nodes:
      HS: ['BSI', 'CMM', 'BVA', 'ABS', 'CAV', 'DAE']
      LS: ['BSI', 'BSM', 'HDC', 'CMB', 'EMF', 'RAD', 'BTEL', 'CDC', 'KML', 'CLIM_AV', 'RBG', 'ALARM', 'AAS', 'CDPL', 'MAE', 'TO1']
    optional_nodes: ['BVA', 'CAV', 'BTEL', 'CDC', 'KML', 'CLIM_AV', 'ALARM', 'AAS', 'CDPL', 'MAE']
    buses: ['HS.IS', 'LS.CAR', 'LS.CONF']
