  all:
    architecture: 'AEE2010.ev'
    years: '2016-2024'
    comment:
      en: '"Evolved" AEE2010 (BSI 2010 EV, from about 2016): same network split as AEE2010, used by the EMP2 cars from 2016 and the CMP cars. VCU/OBC/TBMU/CMEL/RMCU are the plug-in hybrid parts (electric motors, charger, traction battery), BCM the power tailgate, BAAS the hands-free tailgate sensor, IVC_D the driver attention camera. BVN is the Night Vision infrared camera, available from the 2020 facelift'
      fr: 'AEE2010 "évoluée" (BSI 2010 EV, à partir de 2016 environ) : même découpage réseau que l''AEE2010, utilisée par les voitures EMP2 à partir de 2016 et les voitures CMP. VCU/OBC/TBMU/CMEL/RMCU sont les éléments hybrides rechargeables (moteurs électriques, chargeur, batterie de traction), BCM le hayon motorisé, BAAS le capteur d''ouverture mains libres du hayon, IVC_D la caméra de vigilance conducteur. BVN est la caméra infrarouge Night Vision, disponible depuis le restylage de 2020'
      es: 'AEE2010 "evolucionado" (BSI 2010 EV, desde aproximadamente 2016): mismo reparto de red que el AEE2010, utilizado por los coches EMP2 desde 2016 y los coches CMP. VCU/OBC/TBMU/CMEL/RMCU son los elementos híbridos enchufables (motores eléctricos, cargador, batería de tracción), BCM el portón trasero motorizado, BAAS el sensor de apertura manos libres del portón, IVC_D la cámara de vigilancia del conductor. BVN es la cámara infrarroja Night Vision, disponible desde el restyling de 2020'
      de: '"Weiterentwickeltes" AEE2010 (BSI 2010 EV, ab etwa 2016): gleiche Netzwerkaufteilung wie AEE2010, verwendet von EMP2-Fahrzeugen ab 2016 und CMP-Fahrzeugen. VCU/OBC/TBMU/CMEL/RMCU sind die Plug-in-Hybrid-Komponenten (Elektromotoren, Ladegerät, Traktionsbatterie), BCM die elektrische Heckklappe, BAAS der Freihand-Sensor der Heckklappe, IVC_D die Fahreraufmerksamkeitskamera. BVN ist die Night-Vision-Infrarotkamera, verfügbar seit dem Facelift 2020'
      it: 'AEE2010 "evoluto" (BSI 2010 EV, da circa il 2016): stessa suddivisione di rete dell''AEE2010, utilizzato dalle auto EMP2 dal 2016 e dalle auto CMP. VCU/OBC/TBMU/CMEL/RMCU sono i componenti ibridi plug-in (motori elettrici, caricabatterie, batteria di trazione), BCM il portellone motorizzato, BAAS il sensore di apertura mani libere del portellone, IVC_D la telecamera di attenzione del conducente. BVN è la telecamera a infrarossi Night Vision, disponibile dal restyling del 2020'
      pl: '"Rozwinięty" AEE2010 (BSI 2010 EV, od około 2016 roku): ten sam podział sieci co AEE2010, stosowany w samochodach EMP2 od 2016 roku oraz w samochodach CMP. VCU/OBC/TBMU/CMEL/RMCU to elementy hybrydy plug-in (silniki elektryczne, ładowarka, akumulator trakcyjny), BCM to elektryczna klapa bagażnika, BAAS to czujnik otwierania klapy bez użycia rąk, IVC_D to kamera monitorująca uwagę kierowcy. BVN to kamera na podczerwień Night Vision, dostępna od liftingu z 2020 roku'
      ru: '"Улучшенная" AEE2010 (BSI 2010 EV, примерно с 2016 года): такое же разделение сети, как у AEE2010, используется в автомобилях EMP2 с 2016 года и в автомобилях CMP. VCU/OBC/TBMU/CMEL/RMCU — компоненты подключаемого гибрида (электродвигатели, зарядное устройство, тяговая батарея), BCM — электропривод багажника, BAAS — датчик бесконтактного открытия багажника, IVC_D — камера контроля внимания водителя. BVN — инфракрасная камера Night Vision, доступна с рестайлинга 2020 года'
      zh: '"改进型"AEE2010(BSI 2010 EV,约自2016年起):网络划分与AEE2010相同,自2016年起用于EMP2车型及CMP车型。VCU/OBC/TBMU/CMEL/RMCU为插电式混合动力部件(电动机、充电器、牵引电池),BCM为电动尾门,BAAS为尾门免提感应传感器,IVC_D为驾驶员注意力摄像头。BVN为Night Vision红外摄像头,自2020年改款起提供'
      hu: '"Továbbfejlesztett" AEE2010 (BSI 2010 EV, kb. 2016-tól): ugyanaz a hálózati felosztás, mint az AEE2010-nél, az EMP2 járműveknél 2016-tól és a CMP járműveknél használják. A VCU/OBC/TBMU/CMEL/RMCU a plug-in hibrid alkatrészek (villanymotorok, töltő, vonóakkumulátor), a BCM a motoros csomagtérajtó, a BAAS a kihangosított csomagtérnyitás-érzékelő, az IVC_D a vezetőfigyelmi kamera. A BVN a Night Vision infravörös kamera, a 2020-as ráncfelvarrástól elérhető'
      pt: 'AEE2010 "evoluída" (BSI 2010 EV, a partir de cerca de 2016): mesma divisão de rede que a AEE2010, usada pelos automóveis EMP2 a partir de 2016 e pelos automóveis CMP. VCU/OBC/TBMU/CMEL/RMCU são os componentes híbridos plug-in (motores elétricos, carregador, bateria de tração), BCM a porta da mala motorizada, BAAS o sensor de abertura mãos-livres da porta da mala, IVC_D a câmara de vigilância do condutor. BVN é a câmara infravermelhos Night Vision, disponível a partir do restyling de 2020'
