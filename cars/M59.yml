codes:
  M59: ['citroen Berlingo ph2', 'peugeot Partner ph2', 'citroen Berlingo First', 'peugeot Partner Origin']  # phase 2 of the first Berlingo/Partner (called "Berlingo II" in Citroen documents), later sold as Berlingo First / Partner Origin

brand: ['peugeot', 'citroen']
years: '2002-2011'

versions:
  all:
    architecture: 'AEE2001.full'
    years: '2002-2011'
    comment:
      en: 'Bi-VAN/CAN: CAN IS (250 kbit/s) for engine/gearbox/chassis, VAN comfort (125 kbit/s) for display, radio, clim, cluster, and VAN body buses (62.5 kbit/s) for airbag, COM2000, alarm and doors. Never switched to full CAN'
      fr: 'Bi-VAN/CAN : CAN IS (250 kbit/s) pour moteur/boîte/liaison au sol, VAN confort (125 kbit/s) pour écran, autoradio, clim, combiné, et VAN carrosserie (62.5 kbit/s) pour airbag, COM2000, alarme et portes. N''est jamais passé au tout CAN'
      es: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) para motor/caja de cambios/chasis, VAN confort (125 kbit/s) para pantalla, radio, clima, cuadro de instrumentos, y bus VAN carrocería (62,5 kbit/s) para airbag, COM2000, alarma y puertas. Nunca pasó a todo CAN'
      de: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) für Motor/Getriebe/Fahrwerk, VAN Komfort (125 kbit/s) für Display, Radio, Klimaanlage, Kombiinstrument, und VAN-Karosseriebus (62,5 kbit/s) für Airbag, COM2000, Alarmanlage und Türen. Nie auf vollständiges CAN umgestellt'
      it: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) per motore/cambio/telaio, VAN comfort (125 kbit/s) per display, autoradio, climatizzatore, quadro strumenti, e bus VAN carrozzeria (62,5 kbit/s) per airbag, COM2000, allarme e porte. Non è mai passata al tutto CAN'
      pl: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) dla silnika/skrzyni biegów/podwozia, VAN komfort (125 kbit/s) dla wyświetlacza, radia, klimatyzacji, zestawu wskaźników, oraz magistrala VAN nadwozia (62,5 kbit/s) dla poduszki powietrznej, COM2000, alarmu i drzwi. Nigdy nie przeszedł na wyłącznie CAN'
      ru: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 кбит/с) для двигателя/коробки передач/шасси, VAN комфорт (125 кбит/с) для дисплея, радио, кондиционера, приборной панели, и кузовная шина VAN (62,5 кбит/с) для подушки безопасности, COM2000, сигнализации и дверей. Никогда не переходил на полностью CAN'
      zh: '双VAN/CAN架构：双VAN/CAN架构：CAN IS（250 kbit/s）用于发动机/变速箱/底盘，VAN舒适总线（125 kbit/s）用于显示屏、收音机、空调、仪表组，VAN车身总线（62.5 kbit/s）用于安全气囊、COM2000、报警器和车门。从未升级为全CAN架构'
      hu: 'Bi-VAN/CAN: Bi-VAN/CAN: CAN IS (250 kbit/s) a motorhoz/váltóhoz/futóműhöz, VAN komfort (125 kbit/s) a kijelzőhöz, rádióhoz, klímához, műszerfalhoz, és VAN karosszéria busz (62,5 kbit/s) a légzsákhoz, COM2000-hez, riasztóhoz és ajtókhoz. Soha nem váltott teljes CAN-ra'
      pt: 'Bi-VAN/CAN: CAN IS (250 kbit/s) para motor/caixa de velocidades/chassis, VAN conforto (125 kbit/s) para ecrã, rádio, climatização, quadrante, e barramentos VAN de carroçaria (62,5 kbit/s) para airbag, COM2000, alarme e portas. Nunca passou a CAN total.'
    nodes:
      HS: ['BSI', 'CMM', 'ABS']
      VAN: ['BSI', 'HDC', 'CMB', 'EMF', 'RAD', 'BTEL', 'CDC', 'RBG', 'ALARM', 'AAS', 'CDPL', 'BLVV']
    optional_nodes: ['ABS', 'EMF', 'BTEL', 'CDC', 'ALARM', 'AAS', 'CDPL', 'BLVV']
    ecu_models:
      ABS: ['ABS81', 'ESP81']
      BLVV: ['BLVV']
      BSI: ['BSI']
      CMB: ['CLUSTER']
      CMM: ['EDC16C3DV4', 'EDC17C10_BR2', 'ME745', 'ME749']
      EMF: ['AMF']
      HDC: ['COM2000']
      RAD: ['RADIO', 'RDE']
      RBG: ['SAC_AUTOLIV']
    buses: ['HS.IS', 'VAN.CAR', 'VAN.CONF']
