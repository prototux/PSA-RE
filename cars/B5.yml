codes:
  B50: 'citroen C4'  # 3 door (coupe) version
  B51: ['citroen C4', 'citroen C-Quatre (China)']  # 5 door version
  B53: ['citroen C4 Sedan (Mercosur)', 'citroen C4 Pallas (Mercosur)', 'citroen C-Triomphe (China)']  # long wheelbase sedan
  B53C: 'citroen C-Triomphe (China)'
  B54: 'citroen C-Triomphe (China)'  # not confirmed, B53/B53C are the documented codes
  B58: ['citroen C4 Picasso', 'citroen Grand C4 Picasso']  # B585 = 5 seats, B587 = 7 seats (Grand)
  B5: 'citroen C4 I'

brand: ['citroen']
platform: 'PF2'
years: '2004-2011'
comment:
  en: 'The C4 sedans kept being produced for China and South America long after 2011'
  fr: 'Les C4 berlines ont ete produites pour la Chine et l''Amerique du Sud bien après 2011'
  es: 'Las berlinas C4 siguieron produciéndose para China y Sudamérica mucho después de 2011'
  de: 'Die C4-Limousinen wurden weit über 2011 hinaus für China und Südamerika produziert'
  it: 'Le berline C4 hanno continuato a essere prodotte per la Cina e il Sud America ben oltre il 2011'
  pl: 'Sedany C4 były produkowane dla Chin i Ameryki Południowej jeszcze długo po 2011 roku'
  ru: 'Седаны C4 продолжали выпускаться для Китая и Южной Америки ещё долго после 2011 года'
  zh: 'C4三厢车在2011年之后很长时间仍面向中国和南美市场生产'
  hu: 'A C4 szedánokat 2011 után is sokáig gyártották Kína és Dél-Amerika számára'
  pt: 'As berlinas C4 continuaram a ser produzidas para a China e a América do Sul muito depois de 2011'

versions:
  c4:
    architecture: 'AEE2004.full'
    years: '2004-2011'
    codes: ['B50', 'B51', 'B53', 'B53C', 'B54']
    comment:
      en: 'One of the first two full CAN Citroen (march 2004), first use of LIN. Full CAN (CAN IS 500 kbit/s, CAN CONF and CAN CAR 125 kbit/s); late cars (2007-2008 onwards) got the "evolved" BSI generation. BCD is the central digital speedometer box'
      fr: 'Une des deux premières Citroen tout CAN (mars 2004), première utilisation du LIN. Tout CAN (CAN IS 500 kbit/s, CAN CONF et CAN CAR 125 kbit/s) ; les dernières voitures (à partir de 2007-2008) ont reçu le BSI "évolué". BCD est le boîtier du tachymetre numérique central'
      es: 'Uno de los dos primeros Citroën todo CAN (marzo de 2004), primer uso del LIN. Todo CAN (CAN IS 500 kbit/s, CAN CONF y CAN CAR 125 kbit/s); los vehículos más recientes (a partir de 2007-2008) recibieron la generación de BSI "evolucionado". BCD es la caja central del velocímetro digital'
      de: 'Einer der ersten beiden Citroën mit vollständigem CAN (März 2004), erste Verwendung von LIN. vollständiges CAN (CAN IS 500 kbit/s, CAN CONF und CAN CAR 125 kbit/s); spätere Fahrzeuge (ab 2007-2008) erhielten die „weiterentwickelte" BSI-Generation. BCD ist der zentrale digitale Tachometer-Baustein'
      it: 'Una delle prime due Citroën tutto CAN (marzo 2004), primo utilizzo del LIN. Tutto CAN (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); le vetture più recenti (dal 2007-2008) hanno ricevuto la generazione BSI "evoluta". BCD è la centralina del tachimetro digitale centrale'
      pl: 'Jeden z pierwszych dwóch Citroënów wyłącznie CAN (marzec 2004 roku), pierwsze zastosowanie LIN. Wyłącznie CAN (CAN IS 500 kbit/s, CAN CONF i CAN CAR 125 kbit/s); nowsze pojazdy (od 2007-2008) otrzymały "rozwiniętą" generację BSI. BCD to centralny moduł cyfrowego prędkościomierza'
      ru: 'Один из первых двух Citroën полностью на CAN (март 2004 года), первое применение LIN. Полностью CAN (CAN IS 500 кбит/с, CAN CONF и CAN CAR 125 кбит/с); более поздние автомобили (примерно с 2007-2008) получили «улучшенное» поколение BSI. BCD — центральный блок цифрового спидометра'
      zh: '首批两款全CAN架构雪铁龙车型之一（2004年3月），首次使用LIN。全CAN架构（CAN IS 500 kbit/s，CAN CONF和CAN CAR 125 kbit/s）；较晚的车型（2007-2008年起）配备了"升级版"BSI。BCD为中央数字车速表控制盒'
      hu: 'Az egyik első két teljes CAN Citroën (2004 március), a LIN első alkalmazása. Teljes CAN (CAN IS 500 kbit/s, CAN CONF és CAN CAR 125 kbit/s); a későbbi autók (kb. 2007-2008-tól) a „fejlesztett" BSI generációt kapták. A BCD a központi digitális sebességmérő egység'
      pt: 'Um dos dois primeiros Citroën CAN total (março de 2004), primeira utilização do LIN. CAN total (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); os veículos mais recentes (a partir de 2007-2008) receberam a geração de BSI "evoluído". O BCD é a unidade central do velocímetro digital'
