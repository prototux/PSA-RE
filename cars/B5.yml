  picasso:
    architecture: 'AEE2004.full'
    years: '2006-2010'
    codes: ['B58']
    comment:
      en: 'Full CAN (CAN IS 500 kbit/s, CAN CONF and CAN CAR 125 kbit/s); late cars (2007-2008 onwards) got the "evolved" BSI generation. FSE is the electric parking brake, the cluster and the multifunction display are merged. BCD (remote display box) is listed for the B58 silhouettes by the AEE2004 organ table. CLIM_AR is the additional rear air conditioning with its own rear passenger controls (Grand C4 Picasso). The Exclusive trim has a pneumatic rear suspension with automatic height correction, probably the CAAR rear height corrector ECU (not confirmed)'
      fr: 'Tout CAN (CAN IS 500 kbit/s, CAN CONF et CAN CAR 125 kbit/s) ; les dernières voitures (à partir de 2007-2008) ont reçu le BSI "évolué". FSE est le frein de stationnement électrique, le combiné et l''écran multifonction sont regroupés. BCD (afficheur déporté) est listé pour les silhouettes B58 par la table des organes AEE2004. CLIM_AR est la climatisation additionnelle arrière avec ses commandes pour les passagers arrière (Grand C4 Picasso). La finition Exclusive a une suspension arrière pneumatique avec correction automatique d''assiette, probablement le calculateur de correction d''assiette arrière CAAR (non confirmé)'
      es: 'Todo CAN (CAN IS 500 kbit/s, CAN CONF y CAN CAR 125 kbit/s); los últimos coches (a partir de 2007-2008) recibieron el BSI "evolucionado". FSE es el freno de estacionamiento eléctrico, el cuadro y la pantalla multifunción están fusionados. BCD (pantalla remota) figura para las siluetas B58 en la tabla de órganos AEE2004. CLIM_AR es la climatización adicional trasera con sus propios mandos para los pasajeros traseros (Grand C4 Picasso). El acabado Exclusive tiene una suspensión trasera neumática con corrección automática de altura, probablemente la unidad de control de corrección de altura trasera CAAR (no confirmado)'
      de: 'Vollständig CAN (CAN IS 500 kbit/s, CAN CONF und CAN CAR 125 kbit/s); spätere Fahrzeuge (ab 2007-2008) erhielten das "weiterentwickelte" BSI. FSE ist die elektrische Feststellbremse, Kombiinstrument und Multifunktionsdisplay sind zusammengefasst. BCD (Fernanzeige) ist für die B58-Karosserievarianten in der AEE2004-Organtabelle aufgeführt. CLIM_AR ist die zusätzliche Klimaanlage hinten mit eigenen Bedienelementen für die Fondpassagiere (Grand C4 Picasso). Die Ausstattung Exclusive hat eine pneumatische Hinterachsfederung mit automatischer Höhenkorrektur, vermutlich das CAAR-Steuergerät zur Höhenkorrektur hinten (nicht bestätigt)'
      it: 'Tutto CAN (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); le vetture più recenti (dal 2007-2008) hanno ricevuto il BSI "evoluto". FSE è il freno di stazionamento elettrico, il quadro strumenti e il display multifunzione sono uniti. BCD (display remoto) è elencato per le carrozzerie B58 nella tabella organi AEE2004. CLIM_AR è la climatizzazione aggiuntiva posteriore con propri comandi per i passeggeri posteriori (Grand C4 Picasso). L''allestimento Exclusive ha una sospensione posteriore pneumatica con correzione automatica dell''assetto, probabilmente la centralina di correzione assetto posteriore CAAR (non confermato)'
      pl: 'Pełny CAN (CAN IS 500 kbit/s, CAN CONF i CAN CAR 125 kbit/s); późniejsze samochody (od 2007-2008) otrzymały "rozwinięty" BSI. FSE to elektryczny hamulec postojowy, zestaw wskaźników i wyświetlacz wielofunkcyjny są połączone. BCD (zdalny wyświetlacz) jest wymieniony dla nadwozi B58 w tabeli podzespołów AEE2004. CLIM_AR to dodatkowa klimatyzacja tylna z własnymi sterowaniami dla tylnych pasażerów (Grand C4 Picasso). Wersja Exclusive ma pneumatyczne tylne zawieszenie z automatyczną korektą wysokości, prawdopodobnie sterownik korekty wysokości tylnej CAAR (niepotwierdzone)'
      ru: 'Полностью CAN (CAN IS 500 кбит/с, CAN CONF и CAN CAR 125 кбит/с); поздние автомобили (начиная примерно с 2007-2008) получили "улучшенное" BSI. FSE — электрический стояночный тормоз, приборная панель и мультифункциональный дисплей объединены. BCD (выносной дисплей) указан для кузовов B58 в таблице узлов AEE2004. CLIM_AR — дополнительный задний кондиционер с собственным управлением для задних пассажиров (Grand C4 Picasso). Комплектация Exclusive имеет пневматическую заднюю подвеску с автоматической коррекцией дорожного просвета, вероятно блок управления CAAR коррекции заднего дорожного просвета (не подтверждено)'
      zh: '全CAN总线(CAN IS 500 kbit/s,CAN CONF和CAN CAR 125 kbit/s);后期车型(2007-2008年起)配备"改进型"BSI。FSE为电子驻车制动,仪表盘与多功能显示屏已合并。BCD(远程显示盒)在AEE2004部件表中列为B58车型专用。CLIM_AR为带独立后排乘客控制的附加后排空调(Grand C4 Picasso)。Exclusive配置配备带自动高度调节的后气动悬挂,可能是CAAR后高度校正控制单元(未确认)'
      hu: 'Teljes CAN (CAN IS 500 kbit/s, CAN CONF és CAN CAR 125 kbit/s); a későbbi (2007-2008-tól gyártott) autók a "továbbfejlesztett" BSI-t kapták. Az FSE az elektromos rögzítőfék, a műszerfal és a multifunkciós kijelző össze van vonva. A BCD (távkijelző) a B58 karosszériaváltozatoknál szerepel az AEE2004 alkatrésztáblázatban. A CLIM_AR a hátsó utasoknak saját kezelőszervekkel rendelkező kiegészítő hátsó klíma (Grand C4 Picasso). Az Exclusive felszereltségnél pneumatikus hátsó felfüggesztés van automatikus magasságkorrekcióval, feltehetően a CAAR hátsó magasságkorrektor vezérlőegység (nem megerősített)'
      pt: 'Totalmente CAN (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); os automóveis mais recentes (a partir de 2007-2008) receberam o BSI "evoluído". FSE é o travão de estacionamento elétrico, o quadro de instrumentos e o ecrã multifunções estão agrupados. BCD (mostrador remoto) é listado para as carroçarias B58 na tabela de órgãos AEE2004. CLIM_AR é a climatização adicional traseira com os seus próprios comandos para os passageiros traseiros (Grand C4 Picasso). O acabamento Exclusive tem uma suspensão traseira pneumática com correção automática de altura, provavelmente a unidade de controlo CAAR de correção de altura traseira (não confirmado)'
