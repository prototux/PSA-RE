brand: ['peugeot', 'opel', 'vauxhall']
platform: 'CMP'
years: '2019-'
comment:
  en: 'Not NEA: newer NEA infotainment units only work on these cars through an adapter'
  fr: 'Pas NEA : les autoradios NEA récents ne fonctionnent sur ces voitures qu''avec un adaptateur'
  es: 'No NEA: las unidades NEA más recientes solo funcionan en estos vehículos con un adaptador'
  de: 'Kein NEA: neuere NEA-Infotainment-Einheiten funktionieren an diesen Fahrzeugen nur mit einem Adapter'
  it: 'Non NEA: le unità infotainment NEA più recenti funzionano su queste vetture solo tramite un adattatore'
  pl: 'Nie NEA: nowsze jednostki multimedialne NEA działają w tych pojazdach tylko za pomocą adaptera'
  ru: 'Не NEA: более новые мультимедийные блоки NEA работают на этих автомобилях только через переходник'
  zh: '非NEA架构：较新的NEA信息娱乐主机只能通过转接器在这些车型上使用'
  hu: 'Nem NEA: az újabb NEA infotainment egységek csak adapterrel működnek ezeken az autókon'
  pt: 'Não NEA: os autorrádios NEA mais recentes só funcionam nestes veículos com um adaptador'

versions:
  all:
    architecture: 'AEE2010.ev'
    years: '2019-'
    comment:
      en: '"Evolved" AEE2010 (BSI 2010 EV, from about 2016): same network split as AEE2010, used by the EMP2 cars from 2016 and the CMP cars (called "R3" by some openpilot porters). CMM only on thermal versions; VCU/OBC/TBMU/CMEL/AVAS and the LIN heater/compressor (CTPE/CCE) only on the electric versions (e-CMP)'
      fr: 'AEE2010 "évoluée" (BSI 2010 EV, à partir de 2016 environ) : même découpage réseau que l''AEE2010, utilisée par les voitures EMP2 à partir de 2016 et les voitures CMP (appelée "R3" par certains portages openpilot). CMM uniquement sur les versions thermiques ; VCU/OBC/TBMU/CMEL/AVAS et le chauffage/compresseur LIN (CTPE/CCE) uniquement sur les versions électriques (e-CMP)'
      es: 'AEE2010 "evolucionado" (BSI 2010 EV, a partir de 2016 aproximadamente): misma división de red que el AEE2010, utilizada por los vehículos EMP2 a partir de 2016 y los vehículos CMP (llamada "R3" por algunos portadores de openpilot). CMM solo en versiones térmicas; VCU/OBC/TBMU/CMEL/AVAS y la calefacción/compresor LIN (CTPE/CCE) solo en las versiones eléctricas (e-CMP)'
      de: '„weiterentwickeltes" AEE2010 (BSI 2010 EV, ab etwa 2016): gleiche Netzwerkaufteilung wie AEE2010, verwendet bei EMP2-Fahrzeugen ab 2016 und CMP-Fahrzeugen (von manchen openpilot-Portierern "R3" genannt). CMM nur bei Verbrennerversionen; VCU/OBC/TBMU/CMEL/AVAS und die LIN-Heizung/-Kompressor (CTPE/CCE) nur bei den Elektroversionen (e-CMP)'
      it: 'AEE2010 "evoluto" (BSI 2010 EV, dal 2016 circa): stessa suddivisione di rete dell''AEE2010, utilizzata dalle vetture EMP2 dal 2016 e dalle vetture CMP (chiamata "R3" da alcuni porter di openpilot). CMM solo sulle versioni termiche; VCU/OBC/TBMU/CMEL/AVAS e il riscaldamento/compressore LIN (CTPE/CCE) solo sulle versioni elettriche (e-CMP)'
      pl: '"rozwinięty" AEE2010 (BSI 2010 EV, od około 2016 roku): taki sam podział sieci jak w AEE2010, stosowany w pojazdach EMP2 od 2016 roku oraz w pojazdach CMP (nazywany "R3" przez niektórych twórców portów openpilot). CMM tylko w wersjach spalinowych; VCU/OBC/TBMU/CMEL/AVAS oraz ogrzewanie/sprężarka LIN (CTPE/CCE) tylko w wersjach elektrycznych (e-CMP)'
      ru: '«улучшенный» AEE2010 (BSI 2010 EV, примерно с 2016 года): то же разделение сети, что и у AEE2010, используется на автомобилях EMP2 с 2016 года и автомобилях CMP (называется "R3" некоторыми разработчиками портов openpilot). CMM только на бензиновых/дизельных версиях; VCU/OBC/TBMU/CMEL/AVAS и LIN-обогреватель/компрессор (CTPE/CCE) только на электрических версиях (e-CMP)'
      zh: '"升级版"AEE2010（BSI 2010 EV，约自2016年起）：网络划分与AEE2010相同，自2016年起用于EMP2车型及CMP车型（部分openpilot移植者称之为"R3"）。CMM仅用于燃油版本；VCU/OBC/TBMU/CMEL/AVAS以及LIN加热器/压缩机（CTPE/CCE）仅用于电动版本（e-CMP）'
      hu: '"fejlesztett" AEE2010 (BSI 2010 EV, kb. 2016-tól): ugyanaz a hálózati felosztás, mint az AEE2010-nél, a 2016-tól gyártott EMP2 autóknál és a CMP autóknál használják (egyes openpilot portolók "R3"-nak nevezik). A CMM csak a belső égésű motoros verziókon; a VCU/OBC/TBMU/CMEL/AVAS és a LIN fűtés/kompresszor (CTPE/CCE) csak az elektromos verziókon (e-CMP)'
      pt: 'AEE2010 "evoluído" (BSI 2010 EV, a partir de cerca de 2016): mesma divisão de rede do AEE2010, utilizada pelos veículos EMP2 a partir de 2016 e pelos veículos CMP (chamada "R3" por alguns portadores do openpilot). O CMM apenas nas versões térmicas; VCU/OBC/TBMU/CMEL/AVAS e o aquecimento/compressor LIN (CTPE/CCE) apenas nas versões elétricas (e-CMP)'
