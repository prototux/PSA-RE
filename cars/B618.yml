    comment:
      en: '"Evolved" AEE2010 (BSI 2010 EV, from about 2016): same network split as AEE2010, used by the EMP2 cars from 2016 and the CMP cars (eco-type network split likely)'
      fr: 'AEE2010 "évoluée" (BSI 2010 EV, à partir de 2016 environ) : même découpage réseau que l''AEE2010, utilisée par les voitures EMP2 à partir de 2016 et les voitures CMP (découpage réseau de type eco probable)'
      es: 'AEE2010 "evolucionado" (BSI 2010 EV, a partir de 2016 aproximadamente): misma división de red que el AEE2010, utilizada por los vehículos EMP2 a partir de 2016 y los vehículos CMP (probablemente con división de red tipo eco)'
      de: '„weiterentwickeltes" AEE2010 (BSI 2010 EV, ab etwa 2016): gleiche Netzwerkaufteilung wie AEE2010, verwendet bei EMP2-Fahrzeugen ab 2016 und CMP-Fahrzeugen (wahrscheinlich mit Eco-Netzwerkaufteilung)'
      it: 'AEE2010 "evoluto" (BSI 2010 EV, dal 2016 circa): stessa suddivisione di rete dell''AEE2010, utilizzata dalle vetture EMP2 dal 2016 e dalle vetture CMP (probabilmente con suddivisione di rete di tipo eco)'
      pl: '"rozwinięty" AEE2010 (BSI 2010 EV, od około 2016 roku): taki sam podział sieci jak w AEE2010, stosowany w pojazdach EMP2 od 2016 roku oraz w pojazdach CMP (prawdopodobnie z podziałem sieci typu eco)'
      ru: '«улучшенный» AEE2010 (BSI 2010 EV, примерно с 2016 года): то же разделение сети, что и у AEE2010, используется на автомобилях EMP2 с 2016 года и автомобилях CMP (вероятно, с разделением сети типа eco)'
      zh: '"升级版"AEE2010（BSI 2010 EV，约自2016年起）：网络划分与AEE2010相同，自2016年起用于EMP2车型及CMP车型（可能为eco类型的网络划分）'
      hu: '"fejlesztett" AEE2010 (BSI 2010 EV, kb. 2016-tól): ugyanaz a hálózati felosztás, mint az AEE2010-nél, a 2016-tól gyártott EMP2 autóknál és a CMP autóknál használják (valószínűleg eco típusú hálózati felosztással)'
      pt: 'AEE2010 "evoluído" (BSI 2010 EV, a partir de cerca de 2016): mesma divisão de rede do AEE2010, utilizada pelos veículos EMP2 a partir de 2016 e pelos veículos CMP (provavelmente com divisão de rede tipo eco)'
