  phase1_eco:
    architecture: 'AEE2010.eco'
    years: '2013-2017'
    comment:
      en: 'Lower trims reportedly use the "eco" variant (to be confirmed). Low cost "eco" variant of AEE2010: the body nodes share a single CAN HABITACLE bus (plus INFO-DIV for the cluster/head unit); the engine bay fuse box (BSM) does not seem to be a diagnosable CAN node on these cars'
      fr: 'Les finitions d''entree de gamme utiliseraient la variante "eco" (a confirmer). Variante "eco" economique de l''AEE2010 : les calculateurs habitacle partagent un unique bus CAN HABITACLE (plus INFO-DIV pour le combine et l''autoradio) ; le BSM ne semble pas etre un noeud CAN diagnosable sur ces voitures'
      es: 'Se dice que los acabados de gama baja usan la variante "eco" (por confirmar). Variante económica "eco" del AEE2010: los módulos del habitáculo comparten un único bus CAN HABITACLE (más INFO-DIV para el cuadro de instrumentos/unidad principal); la caja de fusibles del compartimento motor (BSM) no parece ser un nodo CAN diagnosticable en estos vehículos'
      de: 'Die Basisausstattungen sollen angeblich die "Eco"-Variante nutzen (noch zu bestätigen). Kostengünstige „Eco"-Variante des AEE2010: Die Innenraumsteuergeräte teilen sich einen einzigen CAN-HABITACLE-Bus (plus INFO-DIV für Kombiinstrument/Head-Unit); der Sicherungskasten im Motorraum (BSM) scheint bei diesen Fahrzeugen kein diagnostizierbarer CAN-Knoten zu sein'
      it: 'Si dice che gli allestimenti base utilizzino la variante "eco" (da confermare). Variante economica "eco" dell''AEE2010: le centraline abitacolo condividono un unico bus CAN HABITACLE (più INFO-DIV per quadro strumenti/unità centrale); la scatola fusibili vano motore (BSM) non sembra essere un nodo CAN diagnosticabile su queste vetture'
      pl: 'Podobno wersje podstawowe wykorzystują wariant "eco" (do potwierdzenia). Ekonomiczny wariant "eco" AEE2010: sterowniki nadwozia współdzielą jedną magistralę CAN HABITACLE (plus INFO-DIV dla zestawu wskaźników/jednostki centralnej); skrzynka bezpieczników w komorze silnika (BSM) w tych pojazdach nie wydaje się być diagnozowalnym węzłem CAN'
      ru: 'Базовые версии, как сообщается, используют вариант "eco" (требует подтверждения). Экономичный вариант "eco" AEE2010: блоки кузова используют единую шину CAN HABITACLE (плюс INFO-DIV для приборной панели/головного устройства); блок предохранителей моторного отсека (BSM), похоже, не является диагностируемым узлом CAN на этих автомобилях'
      zh: '据称低配车型采用"eco"变体（待确认）。AEE2010的经济型"eco"变体：车身控制器共用一条CAN HABITACLE总线（另加用于仪表组/主机的INFO-DIV）；发动机舱保险丝盒（BSM）在这些车型上似乎不是可诊断的CAN节点'
      hu: 'A beszámolók szerint az alapkivitelek az "eco" változatot használják (megerősítésre vár). Az AEE2010 alacsony költségű "eco" változata: a karosszéria-vezérlőegységek egyetlen közös CAN HABITACLE buszt használnak (plusz INFO-DIV a műszerfalhoz/fejegységhez); a motortéri biztosítékdoboz (BSM) ezeken az autókon úgy tűnik, nem diagnosztizálható CAN csomópont'
      pt: 'As versões de acabamento inferior aparentemente utilizam a variante "eco" (a confirmar). Variante "eco" de baixo custo do AEE2010: os módulos de carroçaria partilham um único barramento CAN HABITACLE (mais o INFO-DIV para o quadrante/unidade central); a caixa de fusíveis do compartimento do motor (BSM) não parece ser um nó CAN diagnosticável nestes veículos.'
