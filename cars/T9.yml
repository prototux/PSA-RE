  phase2:
    architecture: 'AEE2010.ev'
    years: '2017-2021'
    comment:
      en: 'From the 2017 facelift. "Evolved" AEE2010 (BSI 2010 EV, from about 2016): same network split as AEE2010, used by the EMP2 cars from 2016 and the CMP cars'
      fr: 'À partir du restylage de 2017. AEE2010 "évoluée" (BSI 2010 EV, à partir de 2016 environ) : même découpage réseau que l''AEE2010, utilisée par les voitures EMP2 à partir de 2016 et les voitures CMP'
      es: 'A partir del restyling de 2017. AEE2010 "evolucionado" (BSI 2010 EV, a partir de 2016 aproximadamente): misma división de red que el AEE2010, utilizada por los vehículos EMP2 a partir de 2016 y los vehículos CMP'
      de: 'Ab dem Facelift 2017. „weiterentwickeltes" AEE2010 (BSI 2010 EV, ab etwa 2016): gleiche Netzwerkaufteilung wie AEE2010, verwendet bei EMP2-Fahrzeugen ab 2016 und CMP-Fahrzeugen'
      it: 'Dal restyling del 2017. AEE2010 "evoluto" (BSI 2010 EV, dal 2016 circa): stessa suddivisione di rete dell''AEE2010, utilizzata dalle vetture EMP2 dal 2016 e dalle vetture CMP'
      pl: 'Od liftingu z 2017 roku. "rozwinięty" AEE2010 (BSI 2010 EV, od około 2016 roku): taki sam podział sieci jak w AEE2010, stosowany w pojazdach EMP2 od 2016 roku oraz w pojazdach CMP'
      ru: 'С рестайлинга 2017 года. «улучшенный» AEE2010 (BSI 2010 EV, примерно с 2016 года): то же разделение сети, что и у AEE2010, используется на автомобилях EMP2 с 2016 года и автомобилях CMP'
      zh: '自2017年改款起。"升级版"AEE2010（BSI 2010 EV，约自2016年起）：网络划分与AEE2010相同，自2016年起用于EMP2车型及CMP车型'
      hu: 'A 2017-es ráncfelvarrástól. "fejlesztett" AEE2010 (BSI 2010 EV, kb. 2016-tól): ugyanaz a hálózati felosztás, mint az AEE2010-nél, a 2016-tól gyártott EMP2 autóknál és a CMP autóknál használják'
      pt: 'A partir do restyling de 2017. AEE2010 "evoluído" (BSI 2010 EV, a partir de cerca de 2016): mesma divisão de rede do AEE2010, utilizada pelos veículos EMP2 a partir de 2016 e pelos veículos CMP'
