  all:
    architecture: 'AEE2004.full'
    years: '2004-2008'
    comment:
      en: 'One of the first two full CAN Citroen (with the C4, 2004). Full CAN (CAN IS 500 kbit/s, CAN CONF and CAN CAR 125 kbit/s); late cars (2007-2008 onwards) got the "evolved" BSI generation. BSTL is the lane departure warning (AFIL)'
      fr: 'Une des deux premières Citroen tout CAN (avec la C4, 2004). Tout CAN (CAN IS 500 kbit/s, CAN CONF et CAN CAR 125 kbit/s) ; les dernières voitures (à partir de 2007-2008) ont reçu le BSI "évolué". BSTL est l''alerte de franchissement de ligne (AFIL)'
      es: 'Uno de los dos primeros Citroën todo CAN (junto con el C4, 2004). Todo CAN (CAN IS 500 kbit/s, CAN CONF y CAN CAR 125 kbit/s); los vehículos más recientes (a partir de 2007-2008) recibieron la generación de BSI "evolucionado". BSTL es la alerta de franqueo de línea (AFIL)'
      de: 'Einer der ersten beiden Citroën mit vollständigem CAN (mit dem C4, 2004). vollständiges CAN (CAN IS 500 kbit/s, CAN CONF und CAN CAR 125 kbit/s); spätere Fahrzeuge (ab 2007-2008) erhielten die „weiterentwickelte" BSI-Generation. BSTL ist die Spurverlassenswarnung (AFIL)'
      it: 'Una delle prime due Citroën tutto CAN (con la C4, 2004). Tutto CAN (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); le vetture più recenti (dal 2007-2008) hanno ricevuto la generazione BSI "evoluta". BSTL è l''allerta di superamento linea (AFIL)'
      pl: 'Jeden z pierwszych dwóch Citroënów wyłącznie CAN (wraz z C4, 2004 rok). Wyłącznie CAN (CAN IS 500 kbit/s, CAN CONF i CAN CAR 125 kbit/s); nowsze pojazdy (od 2007-2008) otrzymały "rozwiniętą" generację BSI. BSTL to ostrzeżenie o zjeździe z pasa ruchu (AFIL)'
      ru: 'Один из первых двух Citroën полностью на CAN (вместе с C4, 2004 год). Полностью CAN (CAN IS 500 кбит/с, CAN CONF и CAN CAR 125 кбит/с); более поздние автомобили (примерно с 2007-2008) получили «улучшенное» поколение BSI. BSTL — предупреждение о съезде с полосы (AFIL)'
      zh: '首批两款全CAN架构雪铁龙车型之一（与C4同期，2004年）。全CAN架构（CAN IS 500 kbit/s，CAN CONF和CAN CAR 125 kbit/s）；较晚的车型（2007-2008年起）配备了"升级版"BSI。BSTL为车道偏离预警（AFIL）'
      hu: 'Az egyik első két teljes CAN Citroën (a C4-gyel együtt, 2004). Teljes CAN (CAN IS 500 kbit/s, CAN CONF és CAN CAR 125 kbit/s); a későbbi autók (kb. 2007-2008-tól) a „fejlesztett" BSI generációt kapták. A BSTL a sávelhagyás-figyelmeztetés (AFIL)'
      pt: 'Um dos dois primeiros Citroën CAN total (com o C4, 2004). CAN total (CAN IS 500 kbit/s, CAN CONF e CAN CAR 125 kbit/s); os veículos mais recentes (a partir de 2007-2008) receberam a geração de BSI "evoluído". O BSTL é o aviso de mudança de faixa involuntária (AFIL)'
