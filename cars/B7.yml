versions:
  all:
    architecture: 'AEE2010.full'
    years: '2010-2022'
    comment:
      en: 'Second generation full CAN: HS (IS, LAS...) for powertrain/chassis, LS CONF/CAR/INFO-DIV for body and infotainment, several LIN buses behind the BSI. Some sources put the DS4 on the "eco" variant, which would only apply to some trims. SPB is the massage function of the DS4 front seats (not on the C4)'
      fr: 'Tout CAN de deuxième génération : HS (IS, LAS...) pour la chaîne de traction/liaison au sol, LS CONF/CAR/INFO-DIV pour l''habitacle et l''info-divertissement, plusieurs bus LIN derrière le BSI. Certaines sources placent la DS4 sur la variante "eco", ce qui ne concernerait que certaines finitions. SPB est la fonction massage des sièges avant de la DS4 (pas sur la C4)'
      es: 'CAN completo de segunda generación: HS (IS, LAS...) para la cadena cinemática/tren de rodaje, LS CONF/CAR/INFO-DIV para la carrocería y el infoentretenimiento, varios buses LIN detrás del BSI. Algunas fuentes sitúan al DS4 en la variante "eco", lo que solo afectaría a algunos acabados. SPB es la función de masaje de los asientos delanteros del DS4 (no en el C4)'
      de: 'Vollständiges CAN der zweiten Generation: HS (IS, LAS...) für Antriebsstrang/Fahrwerk, LS CONF/CAR/INFO-DIV für Karosserie und Infotainment, mehrere LIN-Busse hinter dem BSI. Manche Quellen ordnen den DS4 der "Eco"-Variante zu, was nur für einige Ausstattungen gelten würde. SPB ist die Massagefunktion der DS4-Vordersitze (nicht beim C4)'
      it: 'CAN completo di seconda generazione: HS (IS, LAS...) per catena cinematica/telaio, LS CONF/CAR/INFO-DIV per carrozzeria e infotainment, diversi bus LIN dietro il BSI. Alcune fonti collocano la DS4 sulla variante "eco", il che riguarderebbe solo alcuni allestimenti. SPB è la funzione massaggio dei sedili anteriori della DS4 (non sulla C4)'
      pl: 'Pełna sieć CAN drugiej generacji: HS (IS, LAS...) dla układu napędowego/podwozia, LS CONF/CAR/INFO-DIV dla nadwozia i systemu multimedialnego, kilka magistrali LIN za BSI. Niektóre źródła umieszczają DS4 w wariancie "eco", co dotyczyłoby tylko niektórych wersji wyposażenia. SPB to funkcja masażu przednich foteli w DS4 (brak w C4)'
      ru: 'Полностью CAN второго поколения: HS (IS, LAS...) для трансмиссии/шасси, LS CONF/CAR/INFO-DIV для кузова и мультимедиа, несколько шин LIN за BSI. Некоторые источники относят DS4 к варианту "eco", что касалось бы только некоторых комплектаций. SPB — функция массажа передних сидений DS4 (отсутствует на C4)'
      zh: '第二代全CAN总线:HS(IS、LAS等)用于动力总成/底盘,LS CONF/CAR/INFO-DIV用于车身和信息娱乐系统,BSI后方还有多条LIN总线。部分资料将DS4归为"eco"变体,这可能仅适用于部分配置。SPB为DS4前排座椅按摩功能(C4没有)'
      hu: 'Második generációs teljes CAN: HS (IS, LAS...) a hajtáslánchoz/alvázhoz, LS CONF/CAR/INFO-DIV a karosszériához és az infotainmenthez, több LIN busz a BSI mögött. Egyes források a DS4-et az "eco" változathoz sorolják, ami csak egyes felszereltségekre vonatkozna. Az SPB a DS4 első üléseinek masszázsfunkciója (a C4-en nincs)'
      pt: 'CAN completo de segunda geração: HS (IS, LAS...) para o grupo motopropulsor/chassis, LS CONF/CAR/INFO-DIV para a carroçaria e o info-entretenimento, vários barramentos LIN atrás do BSI. Algumas fontes colocam o DS4 na variante "eco", o que só se aplicaria a alguns acabamentos. SPB é a função de massagem dos bancos dianteiros do DS4 (não no C4)'
