# Input/output control (diag/<ARCH>.<variant>/<NODE>/ioctls/<ID>.yml)
# UDS: 2F <ID_HI> <ID_LO> <control> [state]; KWP2000: 30 <LID> <control> [state]
ioctl: 0xD100
name: 'HORN'
display_name:
  en: 'Horn'
  fr: 'Avertisseur sonore'
session: 0x03
params:
  STATE:
    bits: '1.7-1.0'
    type: 'enum'
    values:
      0x00:
        en: 'Off'
        fr: 'Arrêt'
      0x01:
        en: 'On'
        fr: 'Marche'
