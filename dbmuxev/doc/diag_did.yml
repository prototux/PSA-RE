# UDS data identifier (diag/<ARCH>.<variant>/<NODE>/dids/<DID>.yml)
# Read with 22 <DID_HI> <DID_LO>, write with 2E <DID_HI> <DID_LO> <data>
did: 0xF190                # 16 bit identifier
name: 'VIN'                # english, UPPER_SNAKE_CASE
display_name:
  en: 'Vehicle identification number'
  fr: "Numéro d'identification du véhicule"
comment:
  en: 'VIN stored in the ECU'
  fr: 'VIN mémorisé dans le calculateur'
kind: 'identification'     # live | config | identification | counter | other
access: 'read'             # read | write | read-write
session: 0x01              # optional, session needed
security_level: 0x03       # optional, security access level needed to write
length: 17                 # data length in bytes (after the DID), null if variable
variants: ['BSI_2010']     # optional, ECU sub-families this DID was seen on
params:                    # same format as frame signals, byte 1 = first data byte after the DID
  VIN:
    bits: '1.7-17.0'
    type: 'str'
