# VAN frame example (AEE2001 cars), eg. buses/AEE2001.full/VAN.CONF/8A4.yml
id: 0x8A4                  # 12 bit identifier
name: 'BSI_SLOW_DATA'
type: 'van'
length: 7                  # data field length, up to 28 bytes
comment:
  en: 'Slow changing data from the BSI (ignition, lighting...)'
  fr: 'Données lentes de la BSI (contact, éclairage...)'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['EMF', 'RAD', 'CMB']
van:
  access: 'write'          # write: the producer sends its data; read: the frame is a read request
  ack: true                # RAK bit: in-frame acknowledge requested
  rtr: false               # RTR bit
  reply: 'none'            # for read requests: in-frame (the producer fills the request frame) or deferred
  # requested_by: ['BSI']  # for read requests: nodes that poll it

signals:
  IGNITION:
    bits: '2.1-2.0'
    type: 'enum'
    values:
      0x00:
        en: 'Off'
        fr: 'Arrêt'
      0x01:
        en: 'Accessories'
        fr: 'Accessoires'
      0x02:
        en: 'Ignition on'
        fr: 'Contact mis'
      0x03:
        en: 'Cranking'
        fr: 'Démarrage'
