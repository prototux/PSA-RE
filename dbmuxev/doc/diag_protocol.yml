# Protocol definition (diag/protocols/<PROTOCOL>.yml)
protocol: 'UDS'
standard: 'ISO 14229'
comment:
  en: 'Unified diagnostic services'
  fr: 'Services de diagnostic unifiés'
transport: ['can-tp', 'doip']
services:
  0x22:
    name: 'READ_DATA_BY_IDENTIFIER'
    display_name:
      en: 'Read data by identifier'
      fr: 'Lecture de données par identifiant'
    request: '22 DID_HI DID_LO [DID_HI DID_LO...]'
    response: '62 DID_HI DID_LO DATA...'
negative_responses:
  0x31:
    en: 'Request out of range'
    fr: 'Requête hors limites'
algorithms:
  PSA_SEED_KEY:
    comment:
      en: 'Seed/key algorithm, see the pseudocode'
    pseudocode: '...'
