# Diagnostic trouble codes of one ECU (diag/<ARCH>.<variant>/<NODE>/dtcs.yml)
# Key: P/C/B/U + 4 hex digits, optionally followed by -XX (failure type byte, UDS)
'B1003-00':
  raw: 'D00300'            # optional, code as sent on the bus (hex)
  display_name:
    en: 'Secured coding fault'
    fr: 'Défaut télécodage sécurisé'
  comment:                 # optional
    en: 'Coding checksum error'
    fr: 'Erreur de somme de contrôle du télécodage'
  clues:                   # optional, what to check
    en: 'Re-code the ECU'
    fr: 'Refaire le télécodage'
  variants: ['BSI_2010']   # optional
