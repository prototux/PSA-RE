# Nodes file (nodes/<ARCH>.<variant>.yml)

BSI:                       # node name, uppercase, english or well known acronym
  bus:                     # buses it is connected to, '<network>.<bus>' from architectures.yml
    - 'HS.IS'
    - 'LS.CONF'
  id:                      # optional, electronic unit code per network (as used in supervision/version frames)
    HS: 0x12
    LS: 0x12
  alt: ['VSM', 'BCM']      # optional, other names
  name:
    en: 'Body control module'
    fr: 'Boîtier de servitude intelligent'
  comment:                 # optional
    en: 'Main gateway'
    fr: 'Passerelle principale'
  released: true           # optional, false for nodes never seen in a production car
  diag:                    # optional, diagnostic addressing summary (details in diag/<ARCH>.<variant>/<NODE>/ecu.yml)
    protocols: ['KWP2000', 'UDS']
    bus: 'LS.CONF'
    request_id: 0x752      # tester -> ECU
    response_id: 0x652     # ECU -> tester
    obd_request_id: 0x7E4  # optional, OBD (EOBD) addressing
    obd_response_id: 0x7EC
    kline_address: 0x4B    # optional, K-line target address
