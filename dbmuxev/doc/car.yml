# Car file (cars/<PROJECT>.yml)

codes:                     # project / silhouette codes -> commercial name(s)
  T91: ['peugeot 308 II', 'peugeot 308S (China)']
  T92: 'peugeot 308 II SW'
brand: ['peugeot']         # optional
names: ['Peugeot 308']     # optional, other commercial names
platform: 'EMP2'           # optional
years: '2013-2021'         # optional

versions:                  # one entry per architecture/generation change
  phase1:
    architecture: 'AEE2010.full'   # '<ARCH>.<variant>', or 'none' for non multiplexed cars
    years: '2013-2017'
    codes: ['T91', 'T92']  # optional, subset of the codes this version applies to
    nodes:                 # nodes fitted, per network
      HS: ['BSI', 'CMM', 'ABS', 'DAE', 'CAV']
      LS: ['BSI', 'BSM', 'HDC', 'CMB', 'BTEL', 'CLIM_AV', 'AAS']
    optional_nodes: ['AAS']        # nodes depending on options / trim
