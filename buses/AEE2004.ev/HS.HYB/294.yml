id: 0x294
name: 'TRACTION_BATTERY_DYNAMIC_DATA_4'
type: 'can'
length: 8
comment:
  en: 'Traction battery management data: measured HV current/voltage, disconnect state, unexpected contactor opening and hydrogen detection.'
  fr: 'Données du gestionnaire de batterie de traction : courant/tension HT mesurés, état de déconnexion, ouverture de contacteur non commandée et détection d''hydrogène.'
  es: 'Datos del gestor de la batería de tracción: corriente/tensión de alta tensión medidas, estado de desconexión, apertura de contactor no ordenada y detección de hidrógeno.'
  de: 'Daten des Traktionsbatteriemanagements: gemessener HV-Strom/-Spannung, Trennzustand, unbefohlenes Öffnen des Schützes und Wasserstofferkennung.'
  it: 'Dati del gestore della batteria di trazione: corrente/tensione ad alta tensione misurate, stato di disconnessione, apertura non comandata del contattore e rilevamento di idrogeno.'
  pl: 'Dane zarządzania baterią trakcyjną: zmierzony prąd/napięcie wysokiego napięcia, stan odłączenia, niezamierzone otwarcie stycznika oraz wykrycie wodoru.'
  ru: 'Данные управления тяговой батареей: измеренные ток/напряжение высокого напряжения, состояние отключения, непреднамеренное размыкание контактора и обнаружение водорода.'
  zh: '牵引电池管理数据:实测高压电流/电压、断开状态、非指令性接触器断开及氢气检测。'
  hu: 'A vonóakkumulátor-kezelés adatai: a mért nagyfeszültségű áram/feszültség, leválasztási állapot, nem parancsra történő mágneskapcsoló-nyitás és hidrogénérzékelés.'
  pt: 'Dados de gestão da bateria de tração: corrente/tensão de alta tensão medidas, estado de desconexão, abertura inesperada do contactor e deteção de hidrogénio.'
periodicity: ['10ms']
senders: ['TBMU']
receivers: ['HCU1']

signals:
  HV_BATTERY_MAX_DISCHARGE_CURRENT:
    bits: '1.7-2.4'
    comment:
      en: 'Maximum discharge current of the high-voltage battery'
      fr: 'Courant de décharge maximal de la batterie haute tension'
      es: 'Corriente de descarga máxima de la batería de alta tensión'
      de: 'Maximaler Entladestrom der Hochvoltbatterie'
      it: 'Corrente di scarica massima della batteria ad alta tensione'
      pl: 'Maksymalny prąd rozładowania akumulatora wysokiego napięcia'
      ru: 'Максимальный ток разряда высоковольтной батареи'
      zh: '高压电池最大放电电流'
      hu: 'A nagyfeszültségű akkumulátor maximális kisütőárama'
      pt: 'Corrente de descarga máxima da bateria de alta tensão'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 250
    units: 'A'
    invalid: 0xFFF
    default: 0x00

  HV_BATTERY_MAX_DISCHARGE_VOLTAGE:
    bits: '2.3-4.7'
    comment:
      en: 'Maximum discharge voltage of the high-voltage battery'
      fr: 'Tension de décharge maximale de la batterie haute tension'
      es: 'Tensión de descarga máxima de la batería de alta tensión'
      de: 'Maximale Entladespannung der Hochvoltbatterie'
      it: 'Tensione di scarica massima della batteria ad alta tensione'
      pl: 'Maksymalne napięcie rozładowania akumulatora wysokiego napięcia'
      ru: 'Максимальное напряжение разряда высоковольтной батареи'
      zh: '高压电池最大放电电压'
      hu: 'A nagyfeszültségű akkumulátor maximális kisütőfeszültsége'
      pt: 'Tensão de descarga máxima da bateria de alta tensão'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 500
    units: 'V'
    invalid: 0x1FFF
    default: 0x00

  HV_BATTERY_MAX_CHARGE_CURRENT:
    bits: '4.6-5.3'
    comment:
      en: 'Maximum charge current of the high-voltage battery'
      fr: 'Courant de charge maximal de la batterie haute tension'
      es: 'Corriente de carga máxima de la batería de alta tensión'
      de: 'Maximaler Ladestrom der Hochvoltbatterie'
      it: 'Corrente di carica massima della batteria ad alta tensione'
      pl: 'Maksymalny prąd ładowania akumulatora wysokiego napięcia'
      ru: 'Максимальный ток заряда высоковольтной батареи'
      zh: '高压电池最大充电电流'
      hu: 'A nagyfeszültségű akkumulátor maximális töltőárama'
      pt: 'Corrente de carga máxima da bateria de alta tensão'
    type: 'uint'
    factor: 0.1
    offset: -250
    min: -250
    max: 0
    units: 'A'
    invalid: 0xFFF
    default: 0x9C4

  HV_BATTERY_NOMINAL_DISCHARGE_CURRENT:
    bits: '5.2-7.7'
    comment:
      en: 'Nominal discharge current of the high-voltage battery'
