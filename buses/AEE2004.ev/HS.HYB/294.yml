      es: 'Corriente de descarga nominal de la batería de alta tensión'
      de: 'Nennentladestrom der Hochvoltbatterie'
      it: 'Corrente di scarica nominale della batteria ad alta tensione'
      pl: 'Nominalny prąd rozładowania akumulatora wysokiego napięcia'
      ru: 'Номинальный ток разряда высоковольтной батареи'
      zh: '高压电池额定放电电流'
      hu: 'A nagyfeszültségű akkumulátor névleges kisütőárama'
      pt: 'Corrente de descarga nominal da bateria de alta tensão'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 250
    units: 'A'
    invalid: 0xFFF
    default: 0x00

  HV_BATTERY_NOMINAL_CHARGE_CURRENT:
    bits: '7.6-8.3'
    comment:
      en: 'Nominal charge current of the high-voltage battery'
      fr: 'Courant de charge nominal de la batterie haute tension'
      es: 'Corriente de carga nominal de la batería de alta tensión'
      de: 'Nennladestrom der Hochvoltbatterie'
      it: 'Corrente di carica nominale della batteria ad alta tensione'
      pl: 'Nominalny prąd ładowania akumulatora wysokiego napięcia'
      ru: 'Номинальный ток заряда высоковольтной батареи'
      zh: '高压电池额定充电电流'
      hu: 'A nagyfeszültségű akkumulátor névleges töltőárama'
      pt: 'Corrente de carga nominal da bateria de alta tensão'
    type: 'uint'
    factor: 0.1
    offset: -250
    min: -250
    max: 0
    units: 'A'
    invalid: 0xFFF
    default: 0x9C4
