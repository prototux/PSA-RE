id: 0x248
name: 'CMM_DYNAMIC_DATA_UH'
type: 'can'
length: 7
comment:
  en: 'Engine dynamic data for hybrid variants: hybrid motor torque, resistant torque, pre-processed driver torque request, engine-restart and particulate-filter regeneration requests, raw powertrain state.'
  fr: 'Données dynamiques moteur pour variantes hybrides : couple moteur hybride, couple résistant, demande de couple conducteur avant traitement, demandes de redémarrage moteur et de régénération FAP, état brut du groupe motopropulseur.'
  es: 'Datos dinámicos del motor para variantes híbridas: par del motor híbrido, par resistente, solicitud de par del conductor antes de procesar, solicitudes de reinicio del motor y de regeneración del filtro de partículas, estado bruto del grupo motopropulsor.'
  de: 'Motor-Dynamikdaten für Hybridvarianten: Hybridmotor-Drehmoment, Widerstandsmoment, unverarbeitete Fahrer-Drehmomentanforderung, Motorneustart- und Partikelfilter-Regenerationsanforderungen, roher Antriebsstrangzustand.'
  it: 'Dati dinamici motore per varianti ibride: coppia motore ibrido, coppia resistente, richiesta di coppia guidatore prima dell''elaborazione, richieste di riavvio motore e rigenerazione FAP, stato grezzo del gruppo propulsore.'
  pl: 'Dane dynamiczne silnika dla wariantów hybrydowych: moment silnika hybrydowego, moment oporowy, nieprzetworzone żądanie momentu kierowcy, żądania ponownego uruchomienia silnika i regeneracji filtra cząstek stałych, surowy stan układu napędowego.'
  ru: 'Динамические данные двигателя для гибридных вариантов: крутящий момент гибридного двигателя, момент сопротивления, необработанный запрос крутящего момента водителя, запросы перезапуска двигателя и регенерации сажевого фильтра, необработанное состояние силового агрегата.'
  zh: '混合动力变体的发动机动态数据:混动电机扭矩、阻力扭矩、处理前的驾驶员扭矩请求、发动机重启和颗粒过滤器再生请求、动力总成原始状态。'
  hu: 'Motor dinamikus adatok hibrid változatokhoz: hibrid motornyomaték, ellenálló nyomaték, feldolgozás előtti vezetői nyomatékkérés, motor-újraindítási és részecskeszűrő-regenerálási kérések, a hajtáslánc nyers állapota.'
  pt: 'Dados dinâmicos do motor para variantes híbridas: binário do motor elétrico híbrido, binário resistente, pedido de binário do condutor pré-processado, pedidos de reinício do motor e de regeneração do filtro de partículas, estado em bruto do grupo motopropulsor.'
periodicity: ['10ms']
senders: ['CMM']
receivers: ['HCU2', 'TBMU', 'HCU1']

signals:
  CHECKSUM:
    bits: '1.7-1.4'
    comment:
      en: 'Frame checksum'
      fr: 'Somme de contrôle de la trame'
      es: 'Suma de comprobación de la trama'
      de: 'Frame-Prüfsumme'
      it: 'Checksum del frame'
      pl: 'Suma kontrolna ramki'
      ru: 'Контрольная сумма кадра'
      zh: '帧校验和'
      hu: 'Keret ellenőrző összege'
      pt: 'Soma de verificação da trama'
    type: 'uint'

  PROCESS_COUNTER:
    bits: '1.3-1.0'
    comment:
      en: 'Rolling counter incremented at each calculation cycle'
      fr: 'Compteur cyclique incrémenté à chaque cycle de calcul'
      es: 'Contador cíclico incrementado en cada ciclo de cálculo'
      de: 'Zyklischer Zähler, der bei jedem Berechnungszyklus erhöht wird'
      it: 'Contatore ciclico incrementato a ogni ciclo di calcolo'
      pl: 'Licznik cykliczny zwiększany przy każdym cyklu obliczeń'
      ru: 'Циклический счётчик, увеличивающийся на каждом цикле расчёта'
      zh: '每个计算周期递增的循环计数器'
      hu: 'A számítási ciklus minden lépésekor növekvő ciklikus számláló'
      pt: 'Contador cíclico incrementado a cada ciclo de cálculo'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00

