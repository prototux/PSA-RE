    type: 'uint'
    factor: 0.25
    min: 0
    max: 4000
    units: 'rpm'
    default: 0x00

  MAX_ENGINE_TORQUE:
    bits: '3.1-5.4'
    comment:
      en: 'Maximum engine torque'
      fr: 'Couple moteur maximal'
      es: 'Par de motor máximo'
      de: 'Maximales Motordrehmoment'
      it: 'Coppia motore massima'
      pl: 'Maksymalny moment obrotowy silnika'
      ru: 'Максимальный крутящий момент двигателя'
      zh: '最大发动机扭矩'
      hu: 'Maximális motornyomaték'
      pt: 'Binário máximo do motor'
    type: 'uint'
    factor: 0.0625
    offset: -500
    min: -500
    max: 500
    units: 'Nm'
    invalid: 0x3FFF
    default: 0x1F40

  ENGINE_TORQUE_LIMITATION_SYNTHESIS:
    bits: '5.3-7.6'
    comment:
      en: 'Combined synthesis of engine torque limitations'
      fr: 'Synthèse des limitations de couple moteur'
      es: 'Síntesis de las limitaciones de par de motor'
      de: 'Zusammenfassung der Motordrehmomentbegrenzungen'
      it: 'Sintesi delle limitazioni di coppia motore'
      pl: 'Zbiorcze zestawienie ograniczeń momentu silnika'
      ru: 'Сводная информация об ограничениях момента двигателя'
      zh: '发动机扭矩限值综合值'
      hu: 'A motornyomaték-korlátozások összesítése'
      pt: 'Síntese das limitações de binário do motor'
    type: 'uint'
    factor: 0.0625
    offset: -500
    min: -500
    max: 500
    units: 'Nm'
    invalid: 0x3FFF
    default: 0x1F40

  GEARBOX_BOOST_TORQUE:
    bits: '7.5-8.0'
    comment:
      en: 'Gearbox boosting (re-acceleration) torque'
      fr: 'Couple de relance de la boîte de vitesses'
      es: 'Par de reaceleración de la caja de cambios'
      de: 'Wiederbeschleunigungsmoment des Getriebes'
      it: 'Coppia di rilancio del cambio'
      pl: 'Moment doładowania (ponownego przyspieszenia) skrzyni biegów'
      ru: 'Момент повторного разгона коробки передач'
      zh: '变速箱重新加速扭矩'
      hu: 'A váltó újragyorsítási nyomatéka'
      pt: 'Binário de reaceleração da caixa de velocidades'
    type: 'uint'
    factor: 0.0625
    offset: -500
    min: -500
    max: 500
    units: 'Nm'
    invalid: 0x3FFF
    default: 0x1F40
