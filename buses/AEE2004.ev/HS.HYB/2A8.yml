id: 0x2A8
name: 'ENGINE_HYBRID_DYNAMIC_DATA_4'
type: 'can'
length: 8
comment:
  en: 'Engine dynamic data for hybrid variants: hybrid motor torque, resistant torque, pre-processed driver torque request, engine-restart and particulate-filter regeneration requests, raw powertrain state.'
  fr: 'Données dynamiques moteur pour variantes hybrides : couple moteur hybride, couple résistant, demande de couple conducteur avant traitement, demandes de redémarrage moteur et de régénération FAP, état brut du groupe motopropulseur.'
  es: 'Datos dinámicos del motor para variantes híbridas: par del motor híbrido, par resistente, solicitud de par del conductor antes de procesar, solicitudes de reinicio del motor y de regeneración del filtro de partículas, estado bruto del grupo motopropulsor.'
  de: 'Motor-Dynamikdaten für Hybridvarianten: Hybridmotor-Drehmoment, Widerstandsmoment, unverarbeitete Fahrer-Drehmomentanforderung, Motorneustart- und Partikelfilter-Regenerationsanforderungen, roher Antriebsstrangzustand.'
  it: 'Dati dinamici motore per varianti ibride: coppia motore ibrido, coppia resistente, richiesta di coppia guidatore prima dell''elaborazione, richieste di riavvio motore e rigenerazione FAP, stato grezzo del gruppo propulsore.'
  pl: 'Dane dynamiczne silnika dla wariantów hybrydowych: moment silnika hybrydowego, moment oporowy, nieprzetworzone żądanie momentu kierowcy, żądania ponownego uruchomienia silnika i regeneracji filtra cząstek stałych, surowy stan układu napędowego.'
  ru: 'Динамические данные двигателя для гибридных вариантов: крутящий момент гибридного двигателя, момент сопротивления, необработанный запрос крутящего момента водителя, запросы перезапуска двигателя и регенерации сажевого фильтра, необработанное состояние силового агрегата.'
  zh: '混合动力变体的发动机动态数据:混动电机扭矩、阻力扭矩、处理前的驾驶员扭矩请求、发动机重启和颗粒过滤器再生请求、动力总成原始状态。'
  hu: 'Motor dinamikus adatok hibrid változatokhoz: hibrid motornyomaték, ellenálló nyomaték, feldolgozás előtti vezetői nyomatékkérés, motor-újraindítási és részecskeszűrő-regenerálási kérések, a hajtáslánc nyers állapota.'
  pt: 'Dados dinâmicos do motor para variantes híbridas: binário do motor elétrico híbrido, binário resistente, pedido de binário do condutor pré-processado, pedidos de reinício do motor e de regeneração do filtro de partículas, estado em bruto do grupo motopropulsor.'
periodicity: ['10ms']
senders: ['CMM']
receivers: ['HCU1']

signals:
  CHECKSUM:
    bits: '1.7-1.4'
    comment:
      en: 'Frame checksum'
      fr: 'Somme de contrôle de la trame'
      es: 'Suma de comprobación de la trama'
      de: 'Frame-Prüfsumme'
      it: 'Checksum del frame'
      pl: 'Suma kontrolna ramki'
      ru: 'Контрольная сумма кадра'
      zh: '帧校验和'
      hu: 'Keret ellenőrző összege'
      pt: 'Soma de verificação da trama'
    type: 'uint'

  PROCESS_COUNTER:
    bits: '1.3-1.0'
    comment:
      en: 'Rolling counter incremented at each calculation cycle'
      fr: 'Compteur cyclique incrémenté à chaque cycle de calcul'
      es: 'Contador cíclico incrementado en cada ciclo de cálculo'
      de: 'Zyklischer Zähler, der bei jedem Berechnungszyklus erhöht wird'
      it: 'Contatore ciclico incrementato a ogni ciclo di calcolo'
      pl: 'Licznik cykliczny zwiększany przy każdym cyklu obliczeń'
      ru: 'Циклический счётчик, увеличивающийся на каждом цикле расчёта'
      zh: '每个计算周期递增的循环计数器'
      hu: 'A számítási ciklus minden lépésekor növekvő ciklikus számláló'
      pt: 'Contador cíclico incrementado a cada ciclo de cálculo'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00

  ENGINE_TORQUE_MAX_FILTERED:
    bits: '2.7-3.2'
    comment:
      en: 'Maximum engine torque, filtered'
      fr: 'Couple moteur maximal, filtré'
      es: 'Par de motor máximo, filtrado'
      de: 'Maximales Motordrehmoment, gefiltert'
      it: 'Coppia motore massima, filtrata'
      pl: 'Maksymalny moment obrotowy silnika, filtrowany'
      ru: 'Максимальный крутящий момент двигателя, фильтрованный'
      zh: '最大发动机扭矩(已滤波)'
      hu: 'Maximális motornyomaték, szűrve'
      pt: 'Binário máximo do motor, filtrado'
    type: 'uint'
    factor: 0.0625
    offset: -500
    min: -500
    max: 500
    units: 'Nm'
    invalid: 0x3FFF
    default: 0x1F40

  ENGINE_TORQUE_MIN_ACHIEVABLE:
    bits: '3.1-5.4'
    comment:
      en: 'Minimum achievable engine torque'
      fr: 'Couple moteur minimal réalisable'
      es: 'Par de motor mínimo realizable'
      de: 'Minimal erreichbares Motordrehmoment'
      it: 'Coppia motore minima realizzabile'
      pl: 'Minimalny osiągalny moment obrotowy silnika'
      ru: 'Минимальный достижимый крутящий момент двигателя'
      zh: '最小可实现发动机扭矩'
      hu: 'Minimálisan elérhető motornyomaték'
      pt: 'Binário mínimo realizável do motor'
    type: 'uint'
    factor: 0.0625
    offset: -500
    min: -500
    max: 500
    units: 'Nm'
    invalid: 0x3FFF
    default: 0x1F40

  ENGINE_FULL_LOAD_TORQUE_LIMIT:
    bits: '5.3-7.6'
    comment:
      en: 'Full-load torque limitation'
      fr: 'Limitation de couple à pleine charge'
      es: 'Limitación de par a plena carga'
      de: 'Volllast-Drehmomentbegrenzung'
      it: 'Limitazione di coppia a pieno carico'
      pl: 'Ograniczenie momentu przy pełnym obciążeniu'
      ru: 'Ограничение момента при полной нагрузке'
      zh: '全负荷扭矩限值'
      hu: 'Teljes terhelésű nyomatékkorlát'
      pt: 'Limitação de binário a plena carga'
    type: 'uint'
    factor: 0.0625
    offset: -500
    min: -500
    max: 500
    units: 'Nm'
    invalid: 0x3FFF
    default: 0x1F40

  ANTI_STALL_STRATEGY_REQUEST:
    bits: '7.4'
    comment:
      en: 'Anti-stall strategy activation request'
      fr: 'Demande d''activation de la stratégie anti-calage'
      es: 'Solicitud de activación de la estrategia antical'
      de: 'Anforderung zur Aktivierung der Abwürgeschutzstrategie'
      it: 'Richiesta di attivazione della strategia anti-stallo'
      pl: 'Żądanie aktywacji strategii przeciwdziałania gaśnięciu silnika'
      ru: 'Запрос активации стратегии предотвращения остановки двигателя'
      zh: '防熄火策略激活请求'
      hu: 'A leállásgátló stratégia aktiválási kérése'
      pt: 'Pedido de ativação da estratégia antical'
    type: 'bool'
    values:
      0x00:
        en: 'No anti-stall'
        fr: 'Pas d''anticalage'
        es: 'Sin antical (anti-calado)'
        de: 'Kein Abwürgeschutz'
        it: 'Nessun anti-stallo'
        pl: 'Brak zabezpieczenia przed gaśnięciem'
        ru: 'Без защиты от глохания'
        zh: '无防熄火'
        hu: 'Nincs lefulladásgátlás'
        pt: 'Sem anti-calagem'
      0x01:
        en: 'Anti-stall active'
        fr: 'Anticalage actif'
        es: 'Antical activo'
        de: 'Abwürgeschutz aktiv'
        it: 'Antistallo attivo'
        pl: 'Zabezpieczenie przed zgaśnięciem silnika aktywne'
        ru: 'Защита от глохнущего двигателя активна'
        zh: '防熄火功能激活'
        hu: 'Lefulladásgátló aktív'
        pt: 'Antical ativo'

  ENGINE_RESISTIVE_TORQUE_AT_ZERO_RPM:
    bits: '8.7-8.0'
    comment:
      en: 'Engine resistive (friction) torque at 0 RPM (crankshaft stopped)'
      fr: 'Couple résistif moteur à 0 tr/min (vilebrequin à l''arrêt)'
      es: 'Par resistente del motor a 0 rpm (cigüeñal parado)'
      de: 'Motorwiderstandsmoment bei 0 U/min (Kurbelwelle im Stillstand)'
      it: 'Coppia resistente motore a 0 giri/min (albero motore fermo)'
      pl: 'Moment oporowy silnika przy 0 obr./min (wał korbowy zatrzymany)'
      ru: 'Момент сопротивления двигателя при 0 об/мин (коленвал остановлен)'
      zh: '曲轴静止(0转速)时的发动机阻力矩'
      hu: 'Motor ellenállási nyomatéka 0 ford/perc-nél (forgattyústengely áll)'
      pt: 'Binário resistente do motor a 0 rpm (cambota parada)'
    type: 'uint'
    factor: 1
    min: 0
    max: 254
    units: 'Nm'
    invalid: 0xFF
    default: 0x00
