id: 0x087
name: 'STALK_SWITCH_STATUS'
type: 'can'
length: 3
comment:
  en: 'Steering column stalk switch status: indicator and lighting commands, front/rear wiper and washer requests, headlamp beam inversion.'
  fr: 'État des commandes au volant : commandes clignotant et éclairage, demandes d''essuyage/lavage avant et arrière, inversion du faisceau des phares.'
  es: 'Estado de las palancas de la columna de dirección: mandos de intermitente e iluminación, solicitudes de limpiaparabrisas/lavado delantero y trasero, inversión del haz de los faros.'
  de: 'Status der Lenksäulenhebel: Blinker- und Lichtsteuerung, Anforderungen für Wischer/Wäscher vorne/hinten, Umschaltung des Scheinwerferlichtbündels.'
  it: 'Stato delle leve al piantone: comandi indicatori e luci, richieste di tergicristallo/lavaggio anteriore e posteriore, inversione del fascio dei fari.'
  pl: 'Stan dźwigni kolumny kierowniczej: sterowanie kierunkowskazami i światłami, żądania wycieraczek/spryskiwaczy przód/tył, przełączenie wiązki świateł.'
  ru: 'Статус подрулевых рычагов: команды указателей поворота и света, запросы дворников/омывателя спереди/сзади, переключение пучка фар.'
  zh: '转向柱拨杆开关状态:转向灯和灯光指令、前/后雨刷和洗涤器请求、大灯光束反转。'
  hu: 'A kormányoszlop-karok állapota: index- és fényvezérlés, első/hátsó ablaktörlő és mosó kérések, fényszóró fénynyalábjának váltása.'
  pt: 'Estado do comutador de coluna de direção: comandos de piscas e de iluminação, pedidos de limpa e lava-para-brisas dianteiro/traseiro, inversão do feixe dos faróis.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['100ms', 'trigger']
senders: ['MIT']
receivers: ['BSI']

