id: 0x094
name: 'STEERING_COLUMN_SWITCHES'
type: 'can'
length: 7
comment:
  en: 'Steering column switch module state: lighting stalk, wiper stalk, indicators, cruise control / speed limiter, radio remote controls and scroll wheel, horn, RF reception and ignition switch state. Also used as presence-monitoring frame.'
  fr: 'État du module de commandes au volant : commande d''éclairage, commande d''essuyage, clignotants, régulateur/limiteur de vitesse, commandes radio au volant et molette, avertisseur, réception RF et état du contact. Utilisée aussi comme trame de supervision de présence.'
  es: 'Estado del módulo de mandos de columna de dirección: mando de luces, mando de limpiaparabrisas, intermitentes, regulador/limitador de velocidad, mandos de radio y rueda de desplazamiento, claxon, recepción RF y estado del contacto. Usada también como trama de supervisión de presencia.'
  de: 'Status des Lenksäulenschaltermoduls: Lichthebel, Wischerhebel, Blinker, Tempomat/Geschwindigkeitsbegrenzer, Radio-Fernbedienung und Scrollrad, Hupe, RF-Empfang und Zündschalterstatus. Wird auch als Präsenzüberwachungsrahmen genutzt.'
  it: 'Stato del modulo comandi al piantone: leva luci, leva tergicristallo, indicatori di direzione, regolatore/limitatore di velocità, comandi radio al volante e rotella, clacson, ricezione RF e stato del contatto. Usata anche come trama di supervisione della presenza.'
  pl: 'Stan modułu przełączników kolumny kierowniczej: dźwignia świateł, dźwignia wycieraczek, kierunkowskazy, tempomat/ogranicznik prędkości, zdalne sterowanie radiem i pokrętło, klakson, odbiór RF i stan stacyjki. Używana także jako ramka nadzoru obecności.'
  ru: 'Статус модуля переключателей рулевой колонки: рычаг света, рычаг дворников, указатели поворота, круиз-контроль/ограничитель скорости, управление радио и колесо прокрутки, звуковой сигнал, приём RF и состояние замка зажигания. Также используется как кадр контроля присутствия.'
  zh: '转向柱开关模块状态:灯光拨杆、雨刷拨杆、转向灯、巡航/限速控制、方向盘收音机控制和滚轮、喇叭、射频接收及点火开关状态。也用作存在监控帧。'
  hu: 'A kormányoszlop-kapcsoló modul állapota: fényváltó kar, ablaktörlő kar, index, tempomat/sebességhatároló, rádió távvezérlők és görgő, kürt, RF-vétel és gyújtáskapcsoló állapota. Jelenlét-felügyeleti keretként is használt.'
  pt: 'Estado do módulo de comutadores da coluna de direção: comutador de luzes, comutador do limpa-para-brisas, piscas, regulador de velocidade/limitador, comandos remotos de rádio e roda de deslocamento, buzina, receção RF e estado do interruptor de ignição. Também utilizada como trama de supervisão de presença.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['100ms', 'trigger']
senders: ['HDC']
receivers: ['BSI', 'BSM']

