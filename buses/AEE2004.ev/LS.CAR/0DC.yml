id: 0x0DC
name: 'REAR_BODY_STATUS_2'
type: 'can'
length: 3
comment:
  en: 'Rear body status: boot lock/unlock, brake pedal contact, fuel flap, rear window, reversing and stop lamp state, trailer detection.'
  fr: 'État du corps arrière : verrouillage/déverrouillage du coffre, contact pédale de frein, trappe à carburant, lunette arrière, feux de recul et de stop, détection de remorque.'
  es: 'Estado del cuerpo trasero: bloqueo/desbloqueo del maletero, contacto del pedal de freno, trampilla de combustible, luneta trasera, luces de marcha atrás y de stop, detección de remolque.'
  de: 'Status der Heckelektronik: Kofferraumver-/-entriegelung, Bremspedalkontakt, Tankklappe, Heckscheibe, Rückfahr- und Bremsleuchtenstatus, Anhängererkennung.'
  it: 'Stato del corpo posteriore: blocco/sblocco del bagagliaio, contatto pedale freno, sportello carburante, lunotto, stato luci retromarcia e stop, rilevamento rimorchio.'
  pl: 'Stan tylnej elektroniki nadwozia: blokada/odblokowanie bagażnika, styk pedału hamulca, klapka wlewu paliwa, tylna szyba, stan świateł cofania i stop, wykrywanie przyczepy.'
  ru: 'Статус задней электроники кузова: блокировка/разблокировка багажника, контакт педали тормоза, лючок топливного бака, заднее стекло, состояние фонарей заднего хода и стоп-сигналов, обнаружение прицепа.'
  zh: '车身后部状态:行李箱锁止/解锁、刹车踏板触点、油箱盖、后风挡、倒车灯和刹车灯状态、挂车检测。'
  hu: 'A hátsó karosszéria-vezérlés állapota: csomagtér zárás/nyitás, fékpedál érintkező, üzemanyagtöltő nyílás fedele, hátsó szélvédő, tolatólámpa és féklámpa állapota, pótkocsi érzékelése.'
  pt: 'Estado de servidão traseira: trancagem/destrancagem da bagageira, contacto do pedal do travão, tampa do depósito, vidro traseiro, estado das luzes de marcha-atrás e de travagem, deteção de reboque.'
observations:
  en: 'On state change of: TRUNK_OPEN_PUSH_BUTTON, TRUNK_LOCK_EXTERNAL_REQUEST, REAR_WINDOW_OPEN_PUSH_BUTTON, BRAKE_PEDAL_SWITCH'
  fr: 'Sur changement d''état de : TRUNK_OPEN_PUSH_BUTTON, TRUNK_LOCK_EXTERNAL_REQUEST, REAR_WINDOW_OPEN_PUSH_BUTTON, BRAKE_PEDAL_SWITCH'
  es: 'Al cambiar el estado de: TRUNK_OPEN_PUSH_BUTTON, TRUNK_LOCK_EXTERNAL_REQUEST, REAR_WINDOW_OPEN_PUSH_BUTTON, BRAKE_PEDAL_SWITCH'
  de: 'Bei Statusänderung von: TRUNK_OPEN_PUSH_BUTTON, TRUNK_LOCK_EXTERNAL_REQUEST, REAR_WINDOW_OPEN_PUSH_BUTTON, BRAKE_PEDAL_SWITCH'
  it: 'Al cambiamento di stato di: TRUNK_OPEN_PUSH_BUTTON, TRUNK_LOCK_EXTERNAL_REQUEST, REAR_WINDOW_OPEN_PUSH_BUTTON, BRAKE_PEDAL_SWITCH'
  pl: 'Wysyłane przy zmianie stanu: TRUNK_OPEN_PUSH_BUTTON, TRUNK_LOCK_EXTERNAL_REQUEST, REAR_WINDOW_OPEN_PUSH_BUTTON, BRAKE_PEDAL_SWITCH'
  ru: 'При изменении состояния: TRUNK_OPEN_PUSH_BUTTON, TRUNK_LOCK_EXTERNAL_REQUEST, REAR_WINDOW_OPEN_PUSH_BUTTON, BRAKE_PEDAL_SWITCH'
  zh: '当DEVERROU_COFFRE, TRUNK_LOCK_EXTERNAL_REQUEST, REAR_WINDOW_OPEN_PUSH_BUTTON, CONTACT_FREIN状态变化时'
  hu: 'A(z) TRUNK_OPEN_PUSH_BUTTON, TRUNK_LOCK_EXTERNAL_REQUEST, REAR_WINDOW_OPEN_PUSH_BUTTON, BRAKE_PEDAL_SWITCH állapotváltozásakor'
  pt: 'Na mudança de estado de: TRUNK_OPEN_PUSH_BUTTON, TRUNK_LOCK_EXTERNAL_REQUEST, REAR_WINDOW_OPEN_PUSH_BUTTON, BRAKE_PEDAL_SWITCH'
periodicity: ['100ms', 'trigger']
senders: ['BSR']
receivers: ['BSI']

