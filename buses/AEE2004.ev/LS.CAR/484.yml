id: 0x484
name: 'AIRBAG_FAULT_EVENT'
type: 'can'
length: 8
comment:
  en: 'Airbag computer: fault event, logged in the BSI fault log.'
  fr: 'Calculateur airbag : événement défaut, enregistré dans le journal des défauts du BSI.'
  es: 'Unidad de control del airbag: evento de fallo, registrado en el registro de fallos de la BSI.'
  de: 'Airbag-Steuergerät – Fehlerereignis, im Fehlerspeicher (Fehlerprotokoll) des BSI vermerkt.'
  it: 'Centralina airbag: evento di guasto, registrato nel registro guasti della BSI.'
  pl: 'Sterownik poduszek powietrznych – zdarzenie usterki, zapisywane w dzienniku usterek BSI.'
  ru: 'Блок управления подушками безопасности — событие неисправности, регистрируется в журнале неисправностей BSI.'
  zh: '安全气囊控制单元——故障事件,记录在BSI故障日志中。'
  hu: 'Légzsák vezérlőegység – hibaesemény, amelyet a BSI hibanaplójába rögzítenek.'
  pt: 'Computador do airbag: evento de avaria, registado no registo de avarias da BSI.'
periodicity: ['trigger']
senders: ['RBG']
receivers: ['BSI']

signals:
  HEADER_BITS_1:
    bits: '1.7-1.4'
    comment:
      en: 'First 4 header bits'
      fr: '4 premiers bits de l''en-tête'
      es: '4 primeros bits de la cabecera'
      de: 'Erste 4 Header-Bits'
      it: 'Primi 4 bit dell''intestazione'
      pl: 'Pierwsze 4 bity nagłówka'
      ru: 'Первые 4 бита заголовка'
      zh: '帧头前4位'
      hu: 'A fejléc első 4 bitje'
      pt: '4 primeiros bits do cabeçalho'
    type: 'uint'
    default: 0x05

  EVENT_TYPE:
