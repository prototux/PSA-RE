id: 0x121
name: 'GEARBOX_PREP_STATUS_LS'
type: 'can'
length: 6
comment:
  en: 'Rear-gear preparation-in-progress flag, relayed by the body computer on the car-comfort bus.'
  fr: 'Indicateur de préparation de marche arrière en cours, relayé par le BSI sur le bus carrosserie.'
  es: 'Indicador de preparación de marcha atrás en curso, retransmitido por la BSI en el bus de carrocería.'
  de: 'Anzeige einer laufenden Rückwärtsgang-Vorbereitung, weitergeleitet vom BSI auf dem Karosseriebus.'
  it: 'Indicatore di preparazione della retromarcia in corso, inoltrato dal BSI sul bus carrozzeria.'
  pl: 'Wskaźnik trwającego przygotowania biegu wstecznego, przekazywany przez BSI na magistrali nadwozia.'
  ru: 'Флаг подготовки заднего хода, ретранслируемый BSI по кузовной шине.'
  zh: '由车身控制器在车身总线上转发的倒挡准备中标志。'
  hu: 'A hátrameneti fokozat előkészítésének folyamatban lévő jelzője, amelyet a BSI továbbít a karosszériabuszon.'
  pt: 'Indicador de preparação da marcha-atrás em curso, retransmitido pela BSI no barramento de carroçaria.'
observations:
  en: 'On state change of: STOP_START_PREPARATION_STATUS'
  fr: 'Sur changement d''état de : STOP_START_PREPARATION_STATUS'
  es: 'Al cambiar el estado de: STOP_START_PREPARATION_STATUS'
  de: 'Bei Statusänderung von: STOP_START_PREPARATION_STATUS'
  it: 'Al cambiamento di stato di: STOP_START_PREPARATION_STATUS'
  pl: 'Wysyłane przy zmianie stanu: STOP_START_PREPARATION_STATUS'
  ru: 'При изменении состояния: STOP_START_PREPARATION_STATUS'
  zh: '当PREPA_AR_EN_COURS状态变化时'
  hu: 'A(z) STOP_START_PREPARATION_STATUS állapotváltozásakor'
  pt: 'Na mudança de estado de: STOP_START_PREPARATION_STATUS'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']

signals:
  STOP_START_PREPARATION_STATUS:
    bits: '1.7-1.6'
    comment:
      en: 'Stop-start restart preparation status'
      fr: 'État de préparation du redémarrage (stop & start)'
      es: 'Estado de preparación del reinicio (stop & start)'
      de: 'Status der Neustartvorbereitung (Stop & Start)'
      it: 'Stato di preparazione al riavvio (stop & start)'
      pl: 'Stan przygotowania do ponownego rozruchu (stop & start)'
      ru: 'Статус подготовки к перезапуску (стоп-старт)'
      zh: '停止启动(Stop-Start)重启准备状态'
      hu: 'Az újraindítás előkészítésének állapota (stop-start)'
      pt: 'Estado de preparação do reinício (stop & start)'
    type: 'enum'
    default: 0x01
    values:
      0x00:
        unused: true
      0x01:
        en: 'No restart preparation in progress'
        fr: 'Pas de préparation de redémarrage en cours'
        es: 'Sin preparación de reinicio en curso'
        de: 'Keine Neustartvorbereitung im Gange'
        it: 'Nessuna preparazione al riavvio in corso'
        pl: 'Brak trwającego przygotowania do ponownego uruchomienia'
        ru: 'Подготовка к перезапуску не выполняется'
        zh: '未进行重启准备'
        hu: 'Nincs folyamatban újraindítási előkészület'
        pt: 'Sem preparação de reinício em curso'
      0x02:
        en: 'Restart preparation in progress'
        fr: 'Préparation au redémarrage en cours'
        es: 'Preparación para el reinicio en curso'
        de: 'Neustartvorbereitung läuft'
        it: 'Preparazione al riavvio in corso'
        pl: 'Trwa przygotowanie do ponownego uruchomienia'
        ru: 'Идёт подготовка к перезапуску'
        zh: '重启准备中'
        hu: 'Újraindítás előkészítése folyamatban'
        pt: 'Preparação para reinício em curso'
      0x03:
        unused: true

  UNUSED_1:
    bits: '1.5-1.0'
    unused: true

  UNUSED_2:
    bits: '4.4-6.0'
    unused: true
