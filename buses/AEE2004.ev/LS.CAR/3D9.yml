id: 0x3D9
name: 'BSC_FAULT_DIAGNOSTICS'
type: 'can'
length: 8
comment:
  en: 'Fault diagnostics from the BSC node (rear body controller): general short/open-circuit fault flags for rear fog lights, cigarette lighter, indicators, unlock, boot light, roller shutter and number-plate lights; used both for remote diagnosis by the BSI and for degraded-mode operation (e.g. bulb-out warnings).'
  fr: 'Diagnostics de défaut du module BSC (calculateur arrière) : indicateurs de défaut général court-circuit/circuit ouvert pour antibrouillard arrière, allume-cigare, clignotants, déverrouillage, éclairage coffre, store enrouleur et éclairage de plaque ; utilisés pour le diagnostic déporté par la BSI et pour le mode dégradé (ex. alerte lampe grillée).'
  es: 'Diagnósticos de fallo del módulo BSC (controlador trasero): indicadores de fallo general de cortocircuito/circuito abierto para antiniebla trasero, encendedor, intermitentes, desbloqueo, luz de maletero, persiana enrollable y luces de matrícula; usados para el diagnóstico remoto por la BSI y para el modo degradado (p. ej. aviso de lámpara fundida).'
  de: 'Fehlerdiagnose des BSC-Moduls (hinteres Steuergerät): allgemeine Kurzschluss-/Unterbrechungs-Fehlerkennzeichen für Nebelschlussleuchte, Zigarettenanzünder, Blinker, Entriegelung, Kofferraumlicht, Rollo und Kennzeichenbeleuchtung; dienen sowohl der Ferndiagnose im BSI als auch dem degradierten Betrieb (z. B. Lampenausfallwarnung).'
  it: 'Diagnostica dei guasti del modulo BSC (centralina posteriore): indicatori di guasto generale corto circuito/circuito aperto per fendinebbia posteriore, accendisigari, indicatori di direzione, sblocco, luce baule, tapparella e luci targa; utilizzati per la diagnosi remota dalla BSI e per il funzionamento in modalità degradata (es. avviso lampada bruciata).'
  pl: 'Diagnostyka usterek modułu BSC (sterownik tylny): ogólne flagi zwarcia/przerwy obwodu dla tylnego światła przeciwmgielnego, zapalniczki, kierunkowskazów, odblokowania, oświetlenia bagażnika, rolety i oświetlenia tablicy rejestracyjnej; wykorzystywane do zdalnej diagnostyki przez BSI oraz do trybu awaryjnego (np. ostrzeżenia o przepalonej żarówce).'
  ru: 'Диагностика неисправностей модуля BSC (задний контроллер): флаги общей неисправности короткого замыкания/обрыва для заднего противотуманного фонаря, прикуривателя, поворотников, разблокировки, освещения багажника, шторки и подсветки номерного знака; используются для удалённой диагностики в BSI, а также для работы в аварийном режиме (например, предупреждения о перегоревшей лампе).'
  zh: 'BSC模块(后部控制器)的故障诊断:后雾灯、点烟器、转向灯、解锁、后备箱灯、卷帘和牌照灯的通用短路/断路故障标志;用于BSI的远程诊断以及降级模式运行(如灯泡损坏警告)。'
  hu: 'A BSC modul (hátsó vezérlő) hibadiagnosztikája: általános rövidzár/szakadás hibajelzők a hátsó ködlámpához, szivargyújtóhoz, indexekhez, kioldáshoz, csomagtérvilágításhoz, redőnyhöz és rendszámtábla-világításhoz; a BSI távdiagnosztikájához és a BSC csökkentett üzemmódjához (pl. izzókiégés-figyelmeztetés) egyaránt használva.'
  pt: 'Diagnóstico de avarias do nó BSC (computador de servidão traseiro): indicadores gerais de avaria de curto-circuito/circuito aberto do nevoeiro traseiro, isqueiro, piscas, destrancagem, luz da bagageira, estore enrolável e luzes da matrícula; utilizado tanto para diagnóstico remoto pela BSI como para funcionamento em modo degradado (por exemplo, avisos de lâmpada fundida).'
periodicity: ['100ms']
senders: ['BSC']
receivers: ['BSI']

