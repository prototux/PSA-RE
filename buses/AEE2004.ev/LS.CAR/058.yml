id: 0x058
name: 'AIRBAG_STATUS'
type: 'can'
length: 3
comment:
  en: 'Airbag computer status: bonnet switch active, general airbag state, centre and passenger airbag inhibition.'
  fr: 'État du calculateur airbag : contacteur capot actif, état général airbag, inhibition airbag central et passager.'
  es: 'Estado de la centralita de airbag: interruptor de capó activo, estado general del airbag, inhibición de airbag central y del pasajero.'
  de: 'Status des Airbag-Steuergeräts: Motorhaubenschalter aktiv, allgemeiner Airbag-Zustand, Deaktivierung Mittel- und Beifahrer-Airbag.'
  it: 'Stato della centralina airbag: interruttore cofano attivo, stato generale airbag, inibizione airbag centrale e passeggero.'
  pl: 'Stan sterownika poduszek powietrznych: aktywny wyłącznik maski, ogólny stan poduszek powietrznych, wyłączenie poduszki centralnej i pasażera.'
  ru: 'Статус блока управления подушками безопасности: активен выключатель капота, общее состояние подушек, отключение центральной и пассажирской подушки.'
  zh: '安全气囊控制单元状态:引擎盖开关激活、安全气囊总体状态、中央和乘客安全气囊禁用。'
  hu: 'A légzsák-vezérlőegység állapota: motorháztető-kapcsoló aktív, általános légzsákállapot, közép- és utaslégzsák letiltása.'
  pt: 'Estado do computador do airbag: comutador do capot ativo, estado geral do airbag, inibição do airbag central e do passageiro.'
observations:
  en: 'On state change of: ACTIVE_HOOD_STATUS, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, PASSENGER_PRESENCE_BELT_STATUS'
  fr: 'Sur changement d''état de : ACTIVE_HOOD_STATUS, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, PASSENGER_PRESENCE_BELT_STATUS'
  es: 'Al cambiar el estado de: ACTIVE_HOOD_STATUS, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, PASSENGER_PRESENCE_BELT_STATUS'
  de: 'Bei Statusänderung von: ACTIVE_HOOD_STATUS, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, PASSENGER_PRESENCE_BELT_STATUS'
  it: 'Al cambiamento di stato di: ACTIVE_HOOD_STATUS, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, PASSENGER_PRESENCE_BELT_STATUS'
  pl: 'Wysyłane przy zmianie stanu: ACTIVE_HOOD_STATUS, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, PASSENGER_PRESENCE_BELT_STATUS'
  ru: 'При изменении состояния: ACTIVE_HOOD_STATUS, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, PASSENGER_PRESENCE_BELT_STATUS'
  zh: '当ET_CAPOT_ACTIF, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, ET_PRES_BOUCL_PASS状态变化时'
  hu: 'A(z) ACTIVE_HOOD_STATUS, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, PASSENGER_PRESENCE_BELT_STATUS állapotváltozásakor'
  pt: 'Na mudança de estado de: ACTIVE_HOOD_STATUS, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, PASSENGER_PRESENCE_BELT_STATUS'
periodicity: ['500ms', 'trigger']
senders: ['RBG']
receivers: ['BSI']

