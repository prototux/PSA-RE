id: 0x0C6
name: 'BSX_RELIABILITY_PARAMETERS'
type: 'can'
length: 8
comment:
  en: 'Reliability parameters for BSX nodes: backup modes, LIN wake-up and equipment lists, pump and gearbox type, plus checksum bytes.'
  fr: 'Paramètres de fiabilisation pour les nœuds BSX : modes de secours, réveil LIN et listes d''équipements, type de pompe et de boîte de vitesses, ainsi que les octets de somme de contrôle.'
  es: 'Parámetros de fiabilidad para los nodos BSX: modos de emergencia, activación LIN y listas de equipos, tipo de bomba y de caja de cambios, además de los bytes de suma de comprobación.'
  de: 'Zuverlässigkeitsparameter für BSX-Knoten: Rückfallmodi, LIN-Weckung und Geräteliste, Pumpen- und Getriebetyp sowie Prüfsummenbytes.'
  it: 'Parametri di affidabilità per i nodi BSX: modalità di riserva, risveglio LIN ed elenchi apparecchiature, tipo di pompa e cambio, oltre ai byte di checksum.'
  pl: 'Parametry niezawodności węzłów BSX: tryby awaryjne, wybudzanie LIN i listy urządzeń, typ pompy i skrzyni biegów oraz bajty sumy kontrolnej.'
  ru: 'Параметры надёжности узлов BSX: резервные режимы, пробуждение LIN и списки оборудования, тип насоса и коробки передач, а также байты контрольной суммы.'
  zh: 'BSX节点的可靠性参数:备用模式、LIN唤醒和设备列表、泵和变速箱类型,以及校验和字节。'
  hu: 'A BSX csomópontok megbízhatósági paraméterei: tartalék üzemmódok, LIN ébresztés és eszközlisták, szivattyú- és váltótípus, valamint ellenőrzőösszeg-bájtok.'
  pt: 'Parâmetros de fiabilidade dos nós BSX: modos de recurso, listas de ativação LIN e de equipamento, tipo de bomba e de caixa de velocidades, além de bytes de soma de verificação.'
observations:
  en: 'On state change of: LIN_WAKEUP_COMMAND'
  fr: 'Sur changement d''état de : LIN_WAKEUP_COMMAND'
  es: 'Al cambiar el estado de: LIN_WAKEUP_COMMAND'
  de: 'Bei Statusänderung von: LIN_WAKEUP_COMMAND'
  it: 'Al cambiamento di stato di: LIN_WAKEUP_COMMAND'
  pl: 'Wysyłane przy zmianie stanu: LIN_WAKEUP_COMMAND'
  ru: 'При изменении состояния: LIN_WAKEUP_COMMAND'
  zh: '当REVEIL_LIN状态变化时'
  hu: 'A(z) LIN_WAKEUP_COMMAND állapotváltozásakor'
  pt: 'Na mudança de estado de: LIN_WAKEUP_COMMAND'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['BSC', 'BSM', 'BSR']

