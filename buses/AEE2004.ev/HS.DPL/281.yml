id: 0x281
name: 'SCR_DYNAMIC_DATA'
type: 'can'
length: 2
comment:
  en: 'SCR (AdBlue) system data: dosing circuit pressure.'
  fr: 'Données du système SCR (AdBlue) : pression du circuit de dosage.'
  es: 'Datos del sistema SCR (AdBlue): presión del circuito de dosificación.'
  de: 'Daten des SCR-Systems (AdBlue): Druck im Dosierkreislauf.'
  it: 'Dati del sistema SCR (AdBlue): pressione del circuito di dosaggio.'
  pl: 'Dane układu SCR (AdBlue): ciśnienie w obwodzie dozowania.'
  ru: 'Данные системы SCR (AdBlue): давление в дозирующем контуре.'
  zh: 'SCR(AdBlue尿素)系统数据:计量回路压力。'
  hu: 'Az SCR (AdBlue) rendszer adatai: az adagolókör nyomása.'
  pt: 'Dados do sistema SCR (AdBlue): pressão do circuito de dosagem.'
periodicity: ['10ms']
senders: ['SCR']
receivers: ['CMM']

signals:
  UREA_CIRCUIT_ABSOLUTE_PRESSURE:
    bits: '1.7-2.5'
    comment:
      en: 'Absolute pressure measured in the urea (AdBlue) circuit'
      fr: 'Pression absolue mesurée dans le circuit d''urée (AdBlue)'
      es: 'Presión absoluta medida en el circuito de urea (AdBlue)'
      de: 'Im Harnstoff-(AdBlue-)Kreislauf gemessener Absolutdruck'
      it: 'Pressione assoluta misurata nel circuito di urea (AdBlue)'
      pl: 'Ciśnienie bezwzględne mierzone w obiegu mocznika (AdBlue)'
      ru: 'Абсолютное давление, измеренное в контуре мочевины (AdBlue)'
      zh: '尿素(AdBlue)回路中测得的绝对压力'
      hu: 'A karbamid- (AdBlue-) körben mért abszolút nyomás'
      pt: 'Pressão absoluta medida no circuito de ureia (AdBlue)'
    type: 'uint'
    factor: 0.005
    min: 0
    max: 6.5
    units: 'bar'
    invalid: 0x7FF
    default: 0x00

  UNUSED_1:
    bits: '2.4-2.0'
    unused: true
