      es: 'Potencia eléctrica consumida por el cartucho calefactor M1 del SCR'
      de: 'Elektrische Leistungsaufnahme der SCR-Heizpatrone M1'
      it: 'Potenza elettrica assorbita dalla cartuccia riscaldante M1 dell''SCR'
      pl: 'Moc elektryczna pobierana przez grzałkę wkładu M1 układu SCR'
      ru: 'Электрическая мощность, потребляемая нагревателем картриджа M1 SCR'
      zh: 'SCR M1加热筒消耗的电功率'
      hu: 'Az SCR M1 fűtőpatron elektromos teljesítményfelvétele'
      pt: 'Potência elétrica consumida pelo cartucho de aquecimento M1 do SCR'
    type: 'uint'
    factor: 2
