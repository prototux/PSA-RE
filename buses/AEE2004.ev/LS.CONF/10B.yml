id: 0x10B
name: 'STEERING_WHEEL_ANGLE_LS'
type: 'can'
length: 7
comment:
  en: 'Steering-wheel angle, rotation speed and direction, sensor calibration/trim and fault status.'
  fr: 'Angle volant, vitesse et sens de rotation, calibration/trim du capteur et état de défaut.'
  es: 'Ángulo de volante, velocidad y sentido de giro, calibración/ajuste del sensor y estado de fallo.'
  de: 'Lenkradwinkel, Drehgeschwindigkeit und -richtung, Sensorkalibrierung/-abgleich und Fehlerstatus.'
  it: 'Angolo volante, velocità e direzione di rotazione, calibrazione/trim del sensore e stato di guasto.'
  pl: 'Kąt skrętu kierownicy, prędkość i kierunek obrotu, kalibracja/trym czujnika oraz stan usterki.'
  ru: 'Угол поворота руля, скорость и направление вращения, калибровка/тримминг датчика и статус неисправности.'
  zh: '方向盘转角、转速及转向方向、传感器校准/微调及故障状态。'
  hu: 'Kormányszög, forgási sebesség és irány, az érzékelő kalibrációja/finomhangolása, valamint a hibaállapot.'
  pt: 'Ângulo, velocidade e sentido de rotação do volante, calibração/ajuste do sensor e estado de avaria.'
periodicity: ['100ms']
senders: ['BSI']
receivers: ['DEF', 'SAM', 'AAS']

signals:
  STEERING_WHEEL_ANGLE:
    bits: '1.7-2.0'
    comment:
      en: 'Steering wheel angle'
      fr: 'Angle du volant'
      es: 'Ángulo del volante'
      de: 'Lenkradwinkel'
      it: 'Angolo del volante'
      pl: 'Kąt skrętu kierownicy'
      ru: 'Угол поворота рулевого колеса'
      zh: '方向盘转角'
      hu: 'A kormánykerék szöge'
      pt: 'Ângulo do volante'
    type: 'sint'
    factor: 0.1
    min: -780
    max: 780
    units: '°'
    invalid: 0x7FFF
    default: 0x00

  STEERING_WHEEL_ROTATION_SPEED:
    bits: '3.7-3.0'
    comment:
      en: 'Steering wheel rotation speed'
      fr: 'Vitesse de rotation du volant'
      es: 'Velocidad de rotación del volante'
