id: 0x127
name: 'VTH_CONTROL'
alt_names: ['COMMANDE_VTH']
type: 'can'
length: 2
comment:
  en: 'Authorisation and ambient light level for the HUD function, sent on change of state.'
  fr: 'Autorisation et niveau de luminosité ambiante de la fonction HUD, envoyés sur changement d''état.'
  es: 'Autorización y nivel de luz ambiente de la función HUD, enviados en cambio de estado.'
  de: 'Freigabe und Umgebungslichtstärke der HUD-Funktion, gesendet bei Zustandsänderung.'
  it: 'Autorizzazione e livello di luce ambientale della funzione HUD, inviati al cambio di stato.'
  pl: 'Autoryzacja i poziom oświetlenia otoczenia funkcji HUD, wysyłane przy zmianie stanu.'
  ru: 'Разрешение и уровень освещённости функции HUD, отправляемые при изменении состояния.'
  zh: 'VTH功能的授权和环境光水平,在状态变化时发送。'
  hu: 'A HUD funkció engedélyezése és környezeti fényszintje, állapotváltozáskor küldve.'
  pt: 'Autorização e nível de luz ambiente da função HUD, enviados na mudança de estado.'
observations:
  en: 'On state change of: HUD_ENABLED, HUD_SHOWROOM_MODE'
  fr: 'Sur changement d''état de : HUD_ENABLED, HUD_SHOWROOM_MODE'
  es: 'Al cambiar el estado de: HUD_ENABLED, HUD_SHOWROOM_MODE'
  de: 'Bei Statusänderung von: HUD_ENABLED, HUD_SHOWROOM_MODE'
  it: 'Al cambiamento di stato di: HUD_ENABLED, HUD_SHOWROOM_MODE'
  pl: 'Wysyłane przy zmianie stanu: HUD_ENABLED, HUD_SHOWROOM_MODE'
  ru: 'При изменении состояния: HUD_ENABLED, HUD_SHOWROOM_MODE'
  zh: '当AUTOR_VTH, SHOWROOM_VTH状态变化时'
  hu: 'A(z) HUD_ENABLED, HUD_SHOWROOM_MODE állapotváltozásakor'
  pt: 'Na mudança de estado de: HUD_ENABLED, HUD_SHOWROOM_MODE'
periodicity: ['100ms', 'trigger']
senders: ['BSI']
receivers: ['VTH']

signals:
  HUD_ENABLED:
    bits: '1.7'
    comment:
      en: 'Head-up display operation enabled'
      fr: 'Autorisation de fonctionnement de l''affichage tête haute'
      es: 'Funcionamiento de la pantalla frontal (HUD) habilitado'
      de: 'Freigabe des Head-up-Displays'
      it: 'Abilitazione del funzionamento del display head-up'
      pl: 'Zezwolenie na działanie wyświetlacza przezierowego HUD'
      ru: 'Разрешение работы проекционного дисплея (HUD)'
      zh: '抬头显示器操作启用'
      hu: 'Head-up kijelző működésének engedélyezése'
      pt: 'Funcionamento do ecrã head-up (HUD) habilitado'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Not allowed'
        fr: 'Non autorisé'
        es: 'No permitido'
        de: 'Nicht erlaubt'
        it: 'Non consentito'
        pl: 'Niedozwolone'
        ru: 'Не разрешено'
        zh: '不允许'
        hu: 'Nem engedélyezett'
        pt: 'Não permitido'
      0x01:
        en: 'Allowed'
        fr: 'Autorisé'
        es: 'Permitido'
        de: 'Erlaubt'
        it: 'Consentito'
        pl: 'Dozwolone'
        ru: 'Разрешено'
        zh: '允许'
        hu: 'Engedélyezve'
        pt: 'Permitido'

  HUD_SHOWROOM_MODE:
    bits: '1.6'
    comment:
      en: 'Head-up display showroom mode'
      fr: 'Mode showroom pour l''affichage tête haute'
      es: 'Modo showroom para la pantalla frontal (HUD)'
      de: 'Showroom-Modus für das Head-up-Display'
      it: 'Modalità showroom per il display head-up'
      pl: 'Tryb showroom dla wyświetlacza przezierowego'
      ru: 'Демонстрационный режим проекционного дисплея'
      zh: '抬头显示器展厅模式'
      hu: 'Head-up kijelző showroom üzemmódja'
      pt: 'Modo showroom para o visor frontal (HUD)'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Showroom mode inactive'
        fr: 'Mode showroom inactif'
        es: 'Modo showroom inactivo'
        de: 'Showroom-Modus inaktiv'
        it: 'Modalità showroom inattiva'
        pl: 'Tryb showroom nieaktywny'
        ru: 'Режим шоурума неактивен'
        zh: '展厅模式未激活'
        hu: 'Bemutatóterem üzemmód inaktív'
        pt: 'Modo showroom inativo'
      0x01:
        en: 'Showroom active'
        fr: 'Mode vitrine actif'
        es: 'Modo escaparate activo'
        de: 'Showroom-Modus aktiv'
        it: 'Modalità vetrina attiva'
        pl: 'Tryb ekspozycji aktywny'
        ru: 'Режим витрины активен'
        zh: '展厅模式激活'
        hu: 'Bemutatóterem üzemmód aktív'
        pt: 'Showroom ativo'

  UNUSED_1:
    bits: '1.5-1.0'
    unused: true

  AMBIENT_LIGHT_LEVEL:
    bits: '2.7-2.0'
    comment:
      en: 'Ambient brightness level'
      fr: 'Niveau de luminosité ambiante'
      es: 'Nivel de luminosidad ambiente'
      de: 'Umgebungshelligkeit'
      it: 'Livello di luminosità ambientale'
      pl: 'Poziom jasności otoczenia'
      ru: 'Уровень внешней освещённости'
      zh: '环境亮度等级'
      hu: 'Környezeti fényerőszint'
      pt: 'Nível de luminosidade ambiente'
    type: 'uint'
    factor: 1
    min: 0
    max: 255
    units: 'lux'
    invalid: 0xFF
    default: 0xFF
