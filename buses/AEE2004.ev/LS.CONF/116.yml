id: 0x116
name: 'ARTIV_VERSION'
type: 'can'
length: 3
comment:
  en: 'First sunroof status: control switch position, glass panel movement direction and position.'
  fr: 'État du premier toit ouvrant : position du contacteur de commande, sens de mouvement et position du panneau vitré.'
  es: 'Estado del primer techo solar: posición del interruptor de mando, dirección de movimiento y posición del panel de cristal.'
  de: 'Status des ersten Schiebedachs: Position des Bedienschalters, Bewegungsrichtung und Position des Glaspaneels.'
  it: 'Stato del primo tettuccio apribile: posizione dell''interruttore di comando, direzione di movimento e posizione del pannello in vetro.'
  pl: 'Stan pierwszego szyberdachu: pozycja przełącznika sterującego, kierunek ruchu i pozycja panelu szklanego.'
  ru: 'Статус первого люка: положение управляющего переключателя, направление движения и положение стеклянной панели.'
  zh: '第一个天窗状态:控制开关位置、玻璃面板运动方向及位置。'
  hu: 'A első napfénytető állapota: a kezelőkapcsoló helyzete, az üvegpanel mozgásiránya és helyzete.'
  pt: 'Estado do primeiro teto de abrir: posição do comutador de comando, sentido de movimento e posição do painel de vidro.'
periodicity: ['100ms']
senders: ['TO1']
receivers: ['BSI']

