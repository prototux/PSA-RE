id: 0x1AD
name: 'REAR_CLIMATE_MOTOR_COMMAND'
type: 'can'
length: 3
comment:
  en: 'Control of the rear climate-control module motors: blower and air-distribution flaps.'
  fr: 'Commande des moteurs du module de climatisation arrière : pulseur et volets de distribution d''air.'
  es: 'Control de los motores del módulo de climatización trasero: motor de ventilación y compuertas de distribución.'
  de: 'Ansteuerung der Motoren des hinteren Klimamoduls: Gebläse und Luftverteilklappen.'
  it: 'Controllo dei motori del modulo di climatizzazione posteriore: ventola e serrande di distribuzione aria.'
  pl: 'Sterowanie silnikami tylnego modułu klimatyzacji: dmuchawa i klapy rozdziału powietrza.'
  ru: 'Управление моторами заднего модуля климат-контроля: вентилятор и заслонки распределения воздуха.'
  zh: '后排空调模块电机控制:鼓风机和风门分配挡板。'
  hu: 'A hátsó klímamodul motorjainak vezérlése: fűtőventilátor és légelosztó terelőlapok.'
  pt: 'Comando dos motores do módulo de climatização traseira: ventilador e comportas de distribuição de ar.'
observations:
  en: 'On state change of: REAR_AC_ENABLED'
  fr: 'Sur changement d''état de : REAR_AC_ENABLED'
  es: 'Al cambiar el estado de: REAR_AC_ENABLED'
  de: 'Bei Statusänderung von: REAR_AC_ENABLED'
  it: 'Al cambiamento di stato di: REAR_AC_ENABLED'
  pl: 'Wysyłane przy zmianie stanu: REAR_AC_ENABLED'
  ru: 'При изменении состояния: REAR_AC_ENABLED'
  zh: '当AUTOR_CLIM_AR状态变化时'
  hu: 'A(z) REAR_AC_ENABLED állapotváltozásakor'
  pt: 'Na mudança de estado de: REAR_AC_ENABLED'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['CLIM_AR']

signals:
  REAR_BLOWER_MOTOR_SETPOINT:
    bits: '1.7-1.0'
    comment:
      en: 'Rear blower motor setpoint'
      fr: 'Consigne du moteur de pulseur arrière'
      es: 'Consigna del motor del ventilador trasero'
      de: 'Sollwert des hinteren Gebläsemotors'
      it: 'Setpoint del motore ventola posteriore'
      pl: 'Wartość zadana silnika dmuchawy tylnej'
      ru: 'Задание привода вентилятора отопителя сзади'
      zh: '后排鼓风机电机设定值'
      hu: 'Hátsó fűtőventilátor motor alapjele'
      pt: 'Consigna do motor do ventilador traseiro'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0xFF
    default: 0xFF

  REAR_DISTRIBUTION_MOTOR_SETPOINT:
    bits: '2.7-2.0'
    comment:
      en: 'Rear air distribution motor setpoint'
      fr: 'Consigne du moteur de distribution d''air arrière'
      es: 'Consigna del motor de distribución de aire trasero'
      de: 'Sollwert des hinteren Luftverteilungsmotors'
