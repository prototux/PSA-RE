        fr: 'Rappel de mémorisation'
        es: 'Recordatorio de memorización'
        de: 'Speicher-Erinnerung'
        it: 'Promemoria di memorizzazione'
        pl: 'Przypomnienie zapisu'
        ru: 'Напоминание о сохранении'
        zh: '存储提醒'
        hu: 'Emlékeztető a memorizálásra'
        pt: 'Lembrete de memorização'

  HUD_SCREEN_MANUAL_MOVEMENT:
