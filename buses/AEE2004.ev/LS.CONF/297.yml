        pt: 'Sem movimento manual do retrovisor'
      0x01:
        en: 'Manual movement of the mirror'
        fr: 'Mouvement manuel du rétroviseur'
        es: 'Movimiento manual del retrovisor'
        de: 'Manuelle Bewegung des Spiegels'
        it: 'Movimento manuale dello specchietto'
