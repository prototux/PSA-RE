      en: 'Mirror in manual movement'
      fr: 'Miroir en mouvement manuel'
      es: 'Espejo en movimiento manual'
      de: 'Spiegel in manueller Bewegung'
      it: 'Specchio in movimento manuale'
      pl: 'Lusterko w ruchu ręcznym'
      ru: 'Зеркало в ручном перемещении'
      zh: '反射镜手动移动中'
      hu: 'A tükör kézi mozgatás alatt'
      pt: 'Espelho em movimento manual'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No manual mirror movement'
        fr: 'Pas de mouvement manuel du rétroviseur'
        es: 'Sin movimiento manual del espejo'
        de: 'Keine manuelle Spiegelbewegung'
