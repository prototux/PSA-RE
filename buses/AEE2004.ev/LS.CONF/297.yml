id: 0x297
name: 'HUD_STATUS'
type: 'can'
length: 2
comment:
  en: 'Head-up display status: memory and recall, mirror movement, displayed speed.'
  fr: 'État de l''affichage tête haute : mémoire et rappel, mouvement du miroir, vitesse affichée.'
  es: 'Estado de la pantalla head-up: memoria y recuperación, movimiento del espejo, velocidad mostrada.'
  de: 'Status des Head-up-Displays: Memory und Abruf, Spiegelbewegung, angezeigte Geschwindigkeit.'
  it: 'Stato del display head-up: memoria e richiamo, movimento dello specchio, velocità visualizzata.'
  pl: 'Stan wyświetlacza przezierowego: pamięć i przywołanie, ruch lusterka, wyświetlana prędkość.'
  ru: 'Статус проекционного дисплея: память и вызов, движение зеркала, отображаемая скорость.'
  zh: '平视显示器状态:记忆及调用、反射镜移动、显示速度。'
  hu: 'A head-up kijelző állapota: memória és visszahívás, tükörmozgás, kijelzett sebesség.'
  pt: 'Estado do head-up display: memória e recuperação, movimento do espelho, velocidade apresentada.'
periodicity: ['200ms', 'trigger']
senders: ['VTH']
receivers: ['BSI', 'MATT']

signals:
  UNUSED_1:
    bits: '1.7-1.5'
    unused: true

  HUD_ACTIVATION_STATUS:
    bits: '1.4-1.3'
    comment:
      en: 'HUD activation status'
      fr: 'État d''activation de la HUD'
      es: 'Estado de activación de la HUD (HUD)'
      de: 'Aktivierungsstatus des Head-up-Displays (HUD)'
      it: 'Stato di attivazione dell''HUD (HUD)'
      pl: 'Stan aktywacji wyświetlacza przezierowego (HUD)'
      ru: 'Состояние активации проекционного дисплея (HUD)'
      zh: '抬头显示器（HUD）激活状态'
      hu: 'A head-up kijelző (HUD) aktiválási állapota'
      pt: 'Estado de ativação da HUD (HUD)'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'HUD not activated'
        fr: 'HUD non activée'
        es: 'HUD no activado'
        de: 'HUD nicht aktiviert'
        it: 'HUD non attivato'
        pl: 'HUD nieaktywowane'
        ru: 'HUD не активирован'
        zh: 'VTH未激活'
        hu: 'HUD nincs aktiválva'
        pt: 'HUD não ativado'
      0x01:
        en: 'HUD activated'
        fr: 'HUD activée'
        es: 'HUD activada'
        de: 'HUD aktiviert'
        it: 'HUD attivata'
        pl: 'HUD włączona'
        ru: 'HUD активирована'
        zh: 'VTH已激活'
        hu: 'A HUD aktiválva'
        pt: 'HUD ativada'
      0x02:
        en: 'Unavailable'
        fr: 'Indisponible'
        es: 'No disponible'
        de: 'Nicht verfügbar'
        it: 'Non disponibile'
        pl: 'Niedostępne'
        ru: 'Недоступно'
        zh: '不可用'
        hu: 'Nem elérhető'
        pt: 'Indisponível'
      0x03:
        en: 'Invalid'
        fr: 'Invalide'
        es: 'Inválido'
        de: 'Ungültig'
        it: 'Non valido'
        pl: 'Nieprawidłowe'
        ru: 'Недействительно'
        zh: '无效'
        hu: 'Érvénytelen'
        pt: 'Inválido'

  HUD_MEMORY_STATUS:
    bits: '1.2'
    comment:
      en: 'Storing in progress'
      fr: 'Mémorisation en cours'
      es: 'Memorización en curso'
      de: 'Speichervorgang läuft'
      it: 'Memorizzazione in corso'
      pl: 'Trwa zapis do pamięci'
      ru: 'Выполняется сохранение'
      zh: '记忆存储进行中'
      hu: 'Tárolás folyamatban'
      pt: 'Memorização em curso'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No memorisation in progress'
        fr: 'Pas de mémorisation en cours'
        es: 'Sin memorización en curso'
        de: 'Keine Speicherung im Gange'
        it: 'Nessuna memorizzazione in corso'
        pl: 'Brak trwającego zapamiętywania'
        ru: 'Нет выполняемого запоминания'
        zh: '无正在进行的记忆保存'
        hu: 'Nincs folyamatban lévő mentés'
        pt: 'Sem memorização em curso'
      0x01:
        en: 'Memorization in progress'
        fr: 'Mémorisation en cours'
        es: 'Memorización en curso'
        de: 'Speicherung läuft'
        it: 'Memorizzazione in corso'
        pl: 'Trwa zapamiętywanie'
        ru: 'Выполняется запоминание'
        zh: '正在存储'
        hu: 'Mentés folyamatban'
        pt: 'Memorização em curso'

  HUD_MEMORY_RECALL:
    bits: '1.1'
    comment:
      en: 'HUD memory recall'
      fr: 'Rappel mémorisation HUD'
      es: 'Recuperación de memoria de la HUD'
      de: 'Speicherabruf des Head-up-Displays'
      it: 'Richiamo memoria dell''HUD'
      pl: 'Przywołanie pamięci wyświetlacza przezierowego'
      ru: 'Вызов из памяти проекционного дисплея'
