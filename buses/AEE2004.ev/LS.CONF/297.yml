  SPEED_DISPLAYED_ON_HUD:
    bits: '2.7-2.0'
    comment:
      en: 'Speed displayed in the HUD'
      fr: 'Vitesse affichée à la HUD'
      es: 'Velocidad mostrada en la HUD'
      de: 'In der HUD angezeigte Geschwindigkeit'
      it: 'Velocità visualizzata sull''HUD'
      pl: 'Prędkość wyświetlana na wyświetlaczu przezierowym'
      ru: 'Скорость, отображаемая на проекционном дисплее'
