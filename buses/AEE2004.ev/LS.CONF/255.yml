id: 0x255
name: 'MIRROR_STATUS_FRONT_LEFT'
type: 'can'
length: 5
comment:
  en: 'Front-left mirror status: housing declutch/state, memory number and recall, horizontal/vertical position, outside temperature.'
  fr: 'État du rétroviseur avant gauche : débrayage/état du boîtier, numéro et rappel mémoire, position horizontale/verticale, température extérieure.'
  es: 'Estado del retrovisor delantero izquierdo: desembrague/estado de la carcasa, número y recuperación de memoria, posición horizontal/vertical, temperatura exterior.'
  de: 'Status des vorderen linken Außenspiegels: Gehäuseentkupplung/-zustand, Memory-Nummer und -Abruf, horizontale/vertikale Position, Außentemperatur.'
  it: 'Stato dello specchietto anteriore sinistro: disinnesto/stato dell''alloggiamento, numero e richiamo memoria, posizione orizzontale/verticale, temperatura esterna.'
  pl: 'Stan przedniego lewego lusterka: rozłączenie/stan obudowy, numer i przywołanie pamięci, pozycja pozioma/pionowa, temperatura zewnętrzna.'
  ru: 'Статус переднего левого зеркала: расцепление/состояние корпуса, номер и вызов памяти, горизонтальное/вертикальное положение, наружная температура.'
  zh: '左前后视镜状态:壳体脱离/状态、记忆编号及调用、水平/垂直位置、车外温度。'
  hu: 'A bal első tükör állapota: burkolat kikapcsolása/állapota, memóriaszám és -visszahívás, vízszintes/függőleges helyzet, külső hőmérséklet.'
  pt: 'Estado do espelho dianteiro esquerdo: desengate/estado da carcaça, número de memória e recuperação, posição horizontal/vertical, temperatura exterior.'
periodicity: ['1000ms', 'trigger']
senders: ['EDP_C']
receivers: ['BSI']

