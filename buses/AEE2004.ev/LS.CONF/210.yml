id: 0x210
name: 'CLIMATE_REQUEST'
type: 'can'
length: 6
comment:
  en: 'Air conditioning requests sent by the front climate control unit: compressor displacement demand, PTC/blower enable, air distribution and intake flap position, hot/cold mix position, electric power and refrigerant demand.'
  fr: 'Demandes de climatisation envoyées par l''unité de climatisation avant : demande de cylindrée compresseur, activation PTC/pulseur, position des volets de distribution et d''entrée d''air, position de mixage chaud/froid, puissance électrique et demande de réfrigérant.'
  es: 'Solicitudes de climatización enviadas por la unidad de climatización delantera: solicitud de cilindrada del compresor, activación de PTC/ventilador, posición de las trampillas de distribución y entrada de aire, posición de mezcla caliente/fría, potencia eléctrica y solicitud de refrigerante.'
  de: 'Von der vorderen Klimaeinheit gesendete Klimaanforderungen: Kompressorhubvolumenanforderung, PTC-/Gebläseaktivierung, Position der Verteil- und Lufteinlassklappen, Warm-/Kaltmischposition, elektrische Leistung und Kältemittelanforderung.'
  it: 'Richieste di climatizzazione inviate dall''unità di climatizzazione anteriore: richiesta di cilindrata compressore, attivazione PTC/ventola, posizione delle valvole di distribuzione e presa d''aria, posizione di miscelazione caldo/freddo, potenza elettrica e richiesta di refrigerante.'
  pl: 'Żądania klimatyzacji wysyłane przez przednią jednostkę klimatyzacji: żądanie pojemności skokowej sprężarki, aktywacja PTC/dmuchawy, pozycja przepustnic rozdziału i wlotu powietrza, pozycja mieszania ciepłego/zimnego, moc elektryczna i żądanie czynnika chłodniczego.'
  ru: 'Запросы кондиционирования, отправляемые передним блоком климат-контроля: запрос рабочего объёма компрессора, включение PTC/вентилятора, положение заслонок распределения и забора воздуха, положение смешивания горячего/холодного, электрическая мощность и запрос хладагента.'
  zh: '由前置空调单元发送的空调请求：压缩机排量需求、PTC/鼓风机启用、配风与进气风门位置、冷热混合位置、电功率及制冷剂需求。'
  hu: 'Az elülső klímaegység által küldött klímakérések: kompresszor-lökettérfogat igény, PTC/fúvóka engedélyezése, az elosztó- és beömlőnyílások helyzete, meleg/hideg keverési helyzet, elektromos teljesítmény és hűtőközeg-igény.'
  pt: 'Pedidos de ar condicionado enviados pela unidade de climatização dianteira: pedido de cilindrada do compressor, ativação do PTC/ventilador, posição das comportas de distribuição de ar e de entrada de ar, posição de mistura quente/frio, potência elétrica e pedido de refrigerante.'
periodicity: ['100ms', 'trigger']
senders: ['CLIM_AV']
receivers: ['BSI']

