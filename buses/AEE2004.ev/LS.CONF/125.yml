id: 0x125
name: 'RADIO_REPLY_PAYLOAD_2'
type: 'can-tp'
comment:
  en: 'CD list data (program info) sent by the radio; LIST_BLOCK_SIZE determines the data length.'
  fr: 'Données de liste des CD (infos programme) envoyées par la radio ; LIST_BLOCK_SIZE détermine la longueur des données.'
  es: 'Datos de la lista de CD (información de programa) enviados por la radio; LIST_BLOCK_SIZE determina la longitud de los datos'
  de: 'CD-Listendaten (Programminformationen) des Radios; LIST_BLOCK_SIZE bestimmt die Datenlänge'
  it: 'Dati dell''elenco CD (informazioni sul programma) inviati dalla radio; LIST_BLOCK_SIZE determina la lunghezza dei dati'
  pl: 'Dane listy CD (informacje o programie) wysyłane przez radio; LIST_BLOCK_SIZE określa długość danych'
  ru: 'Данные списка CD (информация о программе), отправляемые радио; LIST_BLOCK_SIZE определяет длину данных'
  zh: '收音机发送的 CD 列表数据（节目信息）；LIST_BLOCK_SIZE 决定数据长度'
  hu: 'A rádió által küldött CD-lista adatok (műsorinformáció); a LIST_BLOCK_SIZE határozza meg az adathosszt'
  pt: 'Dados da lista de CD (informação do programa) enviados pela rádio; LIST_BLOCK_SIZE determina o comprimento dos dados.'
periodicity: ['trigger']
senders: ['RAD', 'ICSV']
receivers: ['EMF', 'CMB']
isotp:
  flow_control_id: 0x11F

signals:
  SENT_DIRECTORY_TYPE:
