id: 0x26D
name: 'STEERING_BRAKE_COUPLING_DATA'
type: 'can'
length: 5
comment:
  en: 'Rear climate mixing and blower motor setpoints, sent by the BSI.'
  fr: 'Consignes des moteurs de mixage et de pulseur de la climatisation arrière, envoyées par la BSI.'
  es: 'Consignas de los motores de mezcla y de ventilador de la climatización trasera, enviadas por la BSI.'
  de: 'Sollwerte der Mischer- und Gebläsemotoren der Fondklimatisierung, von der BSI gesendet.'
  it: 'Setpoint dei motori di miscelazione e ventola della climatizzazione posteriore, inviati dalla BSI.'
  pl: 'Zadane wartości silników mieszania i dmuchawy tylnej klimatyzacji, wysyłane przez BSI.'
  ru: 'Заданные значения моторов смешения и вентилятора задней климатической установки, отправляемые BSI.'
  zh: '由BSI发送的后排空调混风电机及鼓风机设定值。'
  hu: 'A hátsó klíma keverő- és fúvómotorjainak alapjelei, a BSI küldi.'
  pt: 'Pontos de ajuste do motor de mistura e do ventilador da climatização traseira, enviados pela BSI.'
observations:
  en: 'On state change of: REAR_LEFT_BLOWER_SETPOINT, REAR_RIGHT_BLOWER_SETPOINT'
  fr: 'Sur changement d''état de : REAR_LEFT_BLOWER_SETPOINT, REAR_RIGHT_BLOWER_SETPOINT'
  es: 'Al cambiar el estado de: REAR_LEFT_BLOWER_SETPOINT, REAR_RIGHT_BLOWER_SETPOINT'
  de: 'Bei Statusänderung von: REAR_LEFT_BLOWER_SETPOINT, REAR_RIGHT_BLOWER_SETPOINT'
  it: 'Al cambiamento di stato di: REAR_LEFT_BLOWER_SETPOINT, REAR_RIGHT_BLOWER_SETPOINT'
  pl: 'Wysyłane przy zmianie stanu: REAR_LEFT_BLOWER_SETPOINT, REAR_RIGHT_BLOWER_SETPOINT'
  ru: 'При изменении состояния: REAR_LEFT_BLOWER_SETPOINT, REAR_RIGHT_BLOWER_SETPOINT'
  zh: '当CONS_PULSEUR_ARG, CONS_PULSEUR_ARD状态变化时'
  hu: 'A(z) REAR_LEFT_BLOWER_SETPOINT, REAR_RIGHT_BLOWER_SETPOINT állapotváltozásakor'
  pt: 'Na mudança de estado de: REAR_LEFT_BLOWER_SETPOINT, REAR_RIGHT_BLOWER_SETPOINT'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['CLIM_AV']

signals:
  REAR_LEFT_BLOWER_SETPOINT:
    bits: '1.7-1.0'
    comment:
      en: 'Rear left blower setpoint'
      fr: 'Consigne du pulseur arrière gauche'
      es: 'Consigna del ventilador trasero izquierdo'
      de: 'Sollwert des Gebläses hinten links'
      it: 'Valore di riferimento del ventilatore posteriore sinistro'
      pl: 'Wartość zadana dmuchawy tylnej lewej'
      ru: 'Заданное значение вентилятора сзади слева'
      zh: '左后鼓风机设定值'
      hu: 'Hátsó bal fűtőventilátor alapérték'
      pt: 'Consigna do ventilador traseiro esquerdo'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0xFF
    default: 0xFF

  REAR_RIGHT_BLOWER_SETPOINT:
    bits: '2.7-2.0'
    comment:
      en: 'Rear right blower setpoint'
      fr: 'Consigne du pulseur arrière droit'
      es: 'Consigna del ventilador trasero derecho'
      de: 'Sollwert des Gebläses hinten rechts'
      it: 'Valore di riferimento del ventilatore posteriore destro'
      pl: 'Wartość zadana dmuchawy tylnej prawej'
      ru: 'Заданное значение вентилятора сзади справа'
      zh: '右后鼓风机设定值'
      hu: 'Hátsó jobb fűtőventilátor alapérték'
      pt: 'Consigna do ventilador traseiro direito'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0xFF
    default: 0xFF

  REAR_LEFT_MIX_MOTOR_SETPOINT:
    bits: '3.7-3.0'
    comment:
      en: 'Rear left mix door motor setpoint'
      fr: 'Consigne du moteur de mixage arrière gauche'
      es: 'Consigna del motor de mezcla trasero izquierdo'
      de: 'Sollwert des Mischklappenmotors hinten links'
      it: 'Valore di riferimento del motorino di miscelazione posteriore sinistro'
      pl: 'Wartość zadana siłownika mieszania powietrza z tyłu po lewej'
      ru: 'Заданное значение привода смешивания воздуха сзади слева'
      zh: '左后混风电机设定值'
      hu: 'Hátsó bal keverőmotor alapérték'
      pt: 'Consigna do motor de mistura traseiro esquerdo'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0xFF
    default: 0xFF

  REAR_RIGHT_MIX_MOTOR_SETPOINT:
    bits: '4.7-4.0'
    comment:
      en: 'Rear right mix door motor setpoint'
      fr: 'Consigne du moteur de mixage arrière droit'
      es: 'Consigna del motor de mezcla trasero derecho'
      de: 'Sollwert des Mischklappenmotors hinten rechts'
      it: 'Valore di riferimento del motorino di miscelazione posteriore destro'
      pl: 'Wartość zadana siłownika mieszania powietrza z tyłu po prawej'
      ru: 'Заданное значение привода смешивания воздуха сзади справа'
      zh: '右后混风电机设定值'
      hu: 'Hátsó jobb keverőmotor alapérték'
      pt: 'Consigna do motor de mistura traseiro direito'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0xFF
    default: 0xFF

  SOLENOID_VALVE_COMMAND:
    bits: '5.7'
    comment:
      en: 'Solenoid valve control'
      fr: 'Commande de l''électrovanne'
      es: 'Control de electroválvula'
      de: 'Magnetventilsteuerung'
      it: 'Comando elettrovalvola'
      pl: 'Sterowanie elektrozaworem'
      ru: 'Управление электромагнитным клапаном'
      zh: '电磁阀控制'
      hu: 'Mágnesszelep vezérlése'
      pt: 'Comando da eletroválvula'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Off'
        fr: 'Arrêt'
        es: 'Apagado'
        de: 'Aus'
        it: 'Spento'
        pl: 'Wyłączone'
        ru: 'Выключено'
        zh: '关闭'
        hu: 'Kikapcsolva'
        pt: 'Desligado'
      0x01:
        en: 'On'
        fr: 'Marche'
        es: 'Encendido'
        de: 'Ein'
        it: 'Acceso'
        pl: 'Włączone'
        ru: 'Включено'
        zh: '开启'
        hu: 'Bekapcsolva'
        pt: 'Ligado'

  UNUSED_1:
    bits: '5.6-5.0'
    unused: true
