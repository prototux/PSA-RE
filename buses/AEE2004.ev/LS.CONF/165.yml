id: 0x165
name: 'RADIO_STATUS_GENERAL'
type: 'can'
length: 4
comment:
  en: 'Radio general status: amplifier on, dual-tuner mode, CD/CD-changer source, compressed audio format, Hi-Fi, mute, source presence and power state.'
  fr: 'État général de l''autoradio : ampli activé, mode double tuner, source CD/changeur CD, format audio compressé, Hi-Fi, coupure son, présence de source et état d''alimentation.'
  es: 'Estado general de la radio: amplificador activado, modo doble sintonizador, fuente CD/cambiador de CD, formato de audio comprimido, Hi-Fi, silencio, presencia de fuente y estado de alimentación.'
  de: 'Allgemeiner Radiostatus: Verstärker ein, Zweifach-Tuner-Modus, CD-/CD-Wechsler-Quelle, komprimiertes Audioformat, Hi-Fi, Stummschaltung, Quellenpräsenz und Einschaltzustand.'
  it: 'Stato generale della radio: amplificatore attivo, modalità doppio sintonizzatore, sorgente CD/caricatore CD, formato audio compresso, Hi-Fi, silenziamento, presenza sorgente e stato di alimentazione.'
  pl: 'Ogólny stan radia: włączony wzmacniacz, tryb podwójnego tunera, źródło CD/zmieniarki CD, skompresowany format audio, Hi-Fi, wyciszenie, obecność źródła i stan zasilania.'
  ru: 'Общий статус радио: усилитель включён, режим двойного тюнера, источник CD/CD-чейнджер, сжатый аудиоформат, Hi-Fi, отключение звука, наличие источника и состояние питания.'
  zh: '收音机总体状态:放大器开启、双调谐器模式、CD/CD换碟机信源、压缩音频格式、Hi-Fi、静音、信源存在及电源状态。'
  hu: 'Az autórádió általános állapota: erősítő bekapcsolva, kettős tuner mód, CD/CD-váltó forrás, tömörített hangformátum, Hi-Fi, némítás, forrás jelenléte és bekapcsolási állapot.'
  pt: 'Estado geral da rádio: amplificador ligado, modo dual-tuner, fonte CD/leitor de CD, formato áudio comprimido, Hi-Fi, silêncio, presença de fonte e estado de alimentação.'
periodicity: ['100ms', 'trigger']
senders: ['ICSV', 'RAD', 'BTEL', 'BTT']
receivers: ['EMF', 'BSI', 'KML', 'AMPLI', 'CMB', 'MDS', 'MATT', 'CDC']

