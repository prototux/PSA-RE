id: 0x168
name: 'COMBINE_ALERTS_INDICATORS'
type: 'can'
length: 8
comment:
  en: 'Instrument cluster telltale lamp commands sent on change: ABS, ASR, steering assist, parking brake and service/system faults.'
  fr: 'Commandes des témoins du combiné envoyées sur changement : ABS, ASR, assistance de direction, frein de parking et défauts service/système.'
  es: 'Órdenes de los testigos del cuadro enviadas al cambiar: ABS, ASR, asistencia de dirección, freno de estacionamiento y fallos de servicio/sistema.'
  de: 'Kontrollleuchtenbefehle des Kombiinstruments, gesendet bei Änderung: ABS, ASR, Lenkhilfe, Feststellbremse und Service-/Systemfehler.'
  it: 'Comandi delle spie del quadro strumenti inviati al cambio: ABS, ASR, servosterzo, freno di stazionamento e guasti servizio/sistema.'
  pl: 'Polecenia kontrolek zestawu wskaźników wysyłane przy zmianie: ABS, ASR, wspomaganie kierownicy, hamulec postojowy i usterki serwisowe/systemowe.'
  ru: 'Команды контрольных ламп приборной панели, отправляемые при изменении: ABS, ASR, усилитель руля, стояночный тормоз и неисправности обслуживания/системы.'
  zh: '仪表组指示灯命令，状态变化时发送：ABS、ASR、转向助力、驻车制动及维修/系统故障。'
  hu: 'A műszerfal jelzőlámpa-parancsai, változáskor küldve: ABS, ASR, kormányszervó, rögzítőfék és szerviz-/rendszerhibák.'
  pt: 'Comandos das luzes avisadoras do quadrante de instrumentos enviados na mudança: ABS, ASR, assistência de direção, travão de estacionamento e avarias de serviço/sistema.'
observations:
  en: 'On state change of: PARKING_BRAKE_TIGHT_FAULT, PARKING_BRAKE_FAULT, STT_INDICATOR'
  fr: 'Sur changement d''état de : PARKING_BRAKE_TIGHT_FAULT, PARKING_BRAKE_FAULT, STT_INDICATOR'
  es: 'Al cambiar el estado de: PARKING_BRAKE_TIGHT_FAULT, PARKING_BRAKE_FAULT, STT_INDICATOR'
  de: 'Bei Statusänderung von: PARKING_BRAKE_TIGHT_FAULT, PARKING_BRAKE_FAULT, STT_INDICATOR'
  it: 'Al cambiamento di stato di: PARKING_BRAKE_TIGHT_FAULT, PARKING_BRAKE_FAULT, STT_INDICATOR'
  pl: 'Wysyłane przy zmianie stanu: PARKING_BRAKE_TIGHT_FAULT, PARKING_BRAKE_FAULT, STT_INDICATOR'
  ru: 'При изменении состояния: PARKING_BRAKE_TIGHT_FAULT, PARKING_BRAKE_FAULT, STT_INDICATOR'
  zh: '当FSE_SER_DEF, PARKING_BRAKE_FAULT, DMD_ALLUM_STT状态变化时'
  hu: 'A(z) PARKING_BRAKE_TIGHT_FAULT, PARKING_BRAKE_FAULT, STT_INDICATOR állapotváltozásakor'
  pt: 'Na mudança de estado de: PARKING_BRAKE_TIGHT_FAULT, PARKING_BRAKE_FAULT, STT_INDICATOR'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['CMB', 'VTH', 'BCD', 'MATT', 'BGP']

