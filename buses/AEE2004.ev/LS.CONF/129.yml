id: 0x129
name: 'NAV_ZOOM_RECALL_DATA'
type: 'can'
length: 8
comment:
  en: 'Multi-frame navigation zoom-level and distance data sent to the display.'
  fr: 'Données multi-trames de niveau de zoom et de distance de navigation envoyées à l''afficheur.'
  es: 'Datos multi-trama de nivel de zoom y distancia de navegación enviados a la pantalla.'
  de: 'Mehrteilige Navigations-Zoomstufen- und Entfernungsdaten, an das Display gesendet.'
  it: 'Dati multi-trama di livello di zoom e distanza di navigazione inviati al display.'
  pl: 'Wieloramkowe dane poziomu przybliżenia i odległości nawigacji wysyłane do wyświetlacza.'
  ru: 'Многокадровые данные уровня масштабирования и расстояния навигации, отправляемые на дисплей.'
  zh: '发送给显示屏的多帧导航缩放级别及距离数据。'
  hu: 'A kijelzőnek küldött többkeretes navigációs nagyítási szint és távolság adatok.'
  pt: 'Dados multitrama de nível de zoom e distância de navegação enviados para o ecrã.'
periodicity: ['500ms', 'trigger']
senders: ['BTEL']
receivers: ['VTH', 'CMB']

signals:
  UNUSED_1:
    bits: '1.7-1.5'
    unused: true

