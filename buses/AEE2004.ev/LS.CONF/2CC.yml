id: 0x2CC
name: 'SLIDING_DOOR_COMMAND_2'
type: 'can'
length: 7
comment:
  en: 'Commands and status inputs for the powered sliding side door(s): lock/unlock, crash/breakdown info, child safety, fuel flap.'
  fr: 'Commandes et entrées d''état de la ou des portes latérales coulissantes motorisées : verrouillage/déverrouillage, infos choc/panne, sécurité enfants, trappe à carburant.'
  es: 'Comandos y entradas de estado de la(s) puerta(s) lateral(es) correderas motorizadas: bloqueo/desbloqueo, info de choque/avería, seguro para niños, tapa de combustible.'
  de: 'Befehle und Statuseingänge für die elektrische(n) Schiebetür(en): Ver-/Entriegeln, Crash-/Panneninfo, Kindersicherung, Tankklappe.'
  it: 'Comandi e ingressi di stato della/e porta/e scorrevole/i laterale/i motorizzata/e: blocco/sblocco, info urto/guasto, sicurezza bambini, sportello carburante.'
  pl: 'Polecenia i sygnały stanu elektrycznych drzwi przesuwnych: blokowanie/odblokowanie, info o zderzeniu/awarii, blokada dla dzieci, klapka wlewu paliwa.'
  ru: 'Команды и входные сигналы состояния электрической(их) сдвижной(ых) двери(ей): блокировка/разблокировка, информация об ударе/неисправности, защита от детей, лючок топливного бака.'
  zh: '电动侧滑门的命令与状态输入:上锁/解锁、碰撞/故障信息、儿童安全锁、油箱盖。'
  hu: 'Az elektromos oldalsó tolóajtó(k) parancsai és állapotjelei: zárás/nyitás, ütközés-/meghibásodás-információ, gyerekzár, üzemanyag-betoltő nyílás.'
  pt: 'Comandos e entradas de estado da(s) porta(s) lateral(is) corrediça(s) motorizada(s): bloqueio/desbloqueio, informação de choque/avaria, segurança para crianças, tampa do depósito de combustível.'
observations:
  en: 'On state change of: RIGHT_PSD_REMOTE_BUTTON_PRESS, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, BELT_STARTER_RESTART_STATE'
  fr: 'Sur changement d''état de : RIGHT_PSD_REMOTE_BUTTON_PRESS, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, BELT_STARTER_RESTART_STATE'
  es: 'Al cambiar el estado de: RIGHT_PSD_REMOTE_BUTTON_PRESS, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, BELT_STARTER_RESTART_STATE'
  de: 'Bei Statusänderung von: RIGHT_PSD_REMOTE_BUTTON_PRESS, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, BELT_STARTER_RESTART_STATE'
  it: 'Al cambiamento di stato di: RIGHT_PSD_REMOTE_BUTTON_PRESS, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, BELT_STARTER_RESTART_STATE'
  pl: 'Wysyłane przy zmianie stanu: RIGHT_PSD_REMOTE_BUTTON_PRESS, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, BELT_STARTER_RESTART_STATE'
  ru: 'При изменении состояния: RIGHT_PSD_REMOTE_BUTTON_PRESS, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, BELT_STARTER_RESTART_STATE'
  zh: '当APPUI_CDE_PLCD, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, ETAT_REDEM_AR2S状态变化时'
  hu: 'A(z) RIGHT_PSD_REMOTE_BUTTON_PRESS, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, BELT_STARTER_RESTART_STATE állapotváltozásakor'
  pt: 'Na mudança de estado de: RIGHT_PSD_REMOTE_BUTTON_PRESS, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, BELT_STARTER_RESTART_STATE'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['MDPLC']

