      0x00:
        en: 'No fault'
        fr: 'Défaut absent'
        es: 'Sin fallo'
        de: 'Kein Fehler'
        it: 'Guasto assente'
        pl: 'Brak usterki'
        ru: 'Неисправность отсутствует'
        zh: '无故障'
