id: 0x215
name: 'SLIDING_DOOR_STATUS_MONITOR'
type: 'can'
length: 5
comment:
  en: 'Status of both powered sliding doors (left, right): fault, obstacle detection, movement and position. Used by the BSI to monitor equipment connected to the body network.'
  fr: 'État des deux portes latérales coulissantes (gauche, droite) : défaut, détection d''obstacle, mouvement et position. Utilisée par la BSI pour surveiller les équipements du réseau carrosserie.'
  es: 'Estado de ambas puertas correderas laterales (izquierda, derecha): fallo, deteccion de obstáculo, movimiento y posición. Utilizada por la BSI para supervisar los equipos de la red de carrocería.'
  de: 'Status beider elektrischen Schiebetüren (links, rechts): Fehler, Hinderniserkennung, Bewegung und Position. Wird von der BSI zur Überwachung der Karosserie-Netzwerkgeräte verwendet.'
  it: 'Stato di entrambe le porte scorrevoli laterali (sinistra, destra): guasto, rilevamento ostacolo, movimento e posizione. Utilizzata dalla BSI per monitorare le apparecchiature collegate alla rete carrozzeria.'
  pl: 'Stan obu drzwi przesuwnych (lewych, prawych): usterka, wykrywanie przeszkody, ruch i pozycja. Wykorzystywana przez BSI do nadzoru urządzeń sieci nadwozia.'
  ru: 'Статус обеих сдвижных дверей (левой, правой): неисправность, обнаружение препятствия, движение и положение. Используется блоком BSI для контроля оборудования кузовной сети.'
  zh: '左右两侧滑门状态:故障、障碍物检测、运动及位置。由BSI用于监控车身网络设备。'
  hu: 'Mindkét (bal és jobb) tolóajtó állapota: hiba, akadályérzékelés, mozgás és pozíció. A BSI ezzel felügyeli a karosszériahálózat eszközeit.'
  pt: 'Estado das duas portas corrediças laterais (esquerda, direita): avaria, deteção de obstáculo, movimento e posição. Utilizada pela BSI para supervisionar os equipamentos da rede de carroçaria.'
periodicity: ['200ms', 'trigger']
senders: ['MDPLC']
receivers: ['BSI']

