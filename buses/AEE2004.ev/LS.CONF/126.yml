id: 0x126
name: 'PARKING_AID_COMMAND'
type: 'can'
length: 3
comment:
  en: 'Parking aid commands sent by the BSI on change: sound/visual inhibition requests, parking space measurement activation and cluster display request.'
  fr: 'Commandes d''aide au stationnement envoyées par la BSI sur changement : demandes d''inhibition sonore/visuelle, activation de la mesure de place de stationnement et demande d''affichage au combiné.'
  es: 'Órdenes de ayuda al aparcamiento enviadas por la BSI al cambiar: solicitudes de inhibición sonora/visual, activación de la medición de la plaza de aparcamiento y solicitud de visualización en el cuadro.'
  de: 'Von der BSI bei Änderung gesendete Einparkhilfebefehle: Anforderungen zur Ton-/Bildabschaltung, Aktivierung der Parklückenvermessung und Anzeigeanforderung am Kombiinstrument.'
  it: 'Comandi di assistenza al parcheggio inviati dalla BSI al cambio: richieste di inibizione sonora/visiva, attivazione della misurazione del posto auto e richiesta di visualizzazione sul quadro strumenti.'
  pl: 'Polecenia wspomagania parkowania wysyłane przez BSI przy zmianie: żądania wyłączenia dźwięku/obrazu, aktywacja pomiaru miejsca parkingowego i żądanie wyświetlenia na zestawie wskaźników.'
  ru: 'Команды парковочного ассистента, отправляемые BSI при изменении: запросы отключения звука/изображения, активация измерения парковочного места и запрос отображения на приборной панели.'
  zh: '由BSI在状态变化时发送的泊车辅助命令：声音/视觉抑制请求、停车位测量激活及仪表组显示请求。'
  hu: 'A BSI parkolássegítő parancsai, változáskor küldve: hang-/képtiltási kérések, a parkolóhely-mérés aktiválása és a műszerfali kijelzés kérése.'
  pt: 'Comandos da ajuda ao estacionamento enviados pela BSI na mudança: pedidos de inibição sonora/visual, ativação da medição do espaço de estacionamento e pedido de apresentação no quadrante.'
observations:
  en: 'On state change of: PARKING_AID_SOUND_INHIBITION, SPACE_MEASUREMENT_REQUEST, GEAR_POSITION_TO_DISPLAY'
  fr: 'Sur changement d''état de : PARKING_AID_SOUND_INHIBITION, SPACE_MEASUREMENT_REQUEST, GEAR_POSITION_TO_DISPLAY'
  es: 'Al cambiar el estado de: PARKING_AID_SOUND_INHIBITION, SPACE_MEASUREMENT_REQUEST, GEAR_POSITION_TO_DISPLAY'
  de: 'Bei Statusänderung von: PARKING_AID_SOUND_INHIBITION, SPACE_MEASUREMENT_REQUEST, GEAR_POSITION_TO_DISPLAY'
  it: 'Al cambiamento di stato di: PARKING_AID_SOUND_INHIBITION, SPACE_MEASUREMENT_REQUEST, GEAR_POSITION_TO_DISPLAY'
  pl: 'Wysyłane przy zmianie stanu: PARKING_AID_SOUND_INHIBITION, SPACE_MEASUREMENT_REQUEST, GEAR_POSITION_TO_DISPLAY'
  ru: 'При изменении состояния: PARKING_AID_SOUND_INHIBITION, SPACE_MEASUREMENT_REQUEST, GEAR_POSITION_TO_DISPLAY'
  zh: '当DMD_INHIB_SON, SPACE_MEASUREMENT_REQUEST, RAP_AFF_CMB状态变化时'
  hu: 'A(z) PARKING_AID_SOUND_INHIBITION, SPACE_MEASUREMENT_REQUEST, GEAR_POSITION_TO_DISPLAY állapotváltozásakor'
  pt: 'Na mudança de estado de: PARKING_AID_SOUND_INHIBITION, SPACE_MEASUREMENT_REQUEST, GEAR_POSITION_TO_DISPLAY'
periodicity: ['100ms', 'trigger']
senders: ['BSI']
receivers: ['AAS']

signals:
  UNUSED_1:
    bits: '1.7-1.5'
    unused: true

