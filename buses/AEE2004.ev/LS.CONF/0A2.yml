      pl: 'Nadmiar (overflow) pokrętła nawigacji na kierownicy'
      ru: 'Верхнее переполнение колеса прокрутки навигации на руле'
      zh: '方向盘导航滚轮上溢出'
      hu: 'A kormánykerék navigációs görgőjének felső túlcsordulása'
      pt: 'Estouro superior do botão rotativo de navegação do volante'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Command not activated'
        fr: 'Commande non activée'
        es: 'Comando no activado'
        de: 'Befehl nicht aktiviert'
        it: 'Comando non attivato'
        pl: 'Polecenie nieaktywowane'
        ru: 'Команда не активирована'
        zh: '指令未激活'
