id: 0x0A2
name: 'STEERING_WHEEL_COMMANDS'
type: 'can'
length: 5
comment:
  en: 'Steering wheel control buttons, used by the radio, CMB, EMF and BTEL.'
  fr: 'Boutons de commande au volant, utilisés par la radio, le CMB, l''EMF et le BTEL.'
  es: 'Botones de mando del volante, utilizados por la radio, el CMB, el EMF y el BTEL.'
  de: 'Bedientasten am Lenkrad, verwendet von Radio, CMB, EMF und BTEL.'
  it: 'Pulsanti di comando al volante, utilizzati da radio, CMB, EMF e BTEL.'
  pl: 'Przyciski sterujące na kierownicy, wykorzystywane przez radio, CMB, EMF i BTEL.'
  ru: 'Кнопки управления на руле, используются радиоприёмником, CMB, EMF и BTEL.'
  zh: '方向盘控制按钮，供收音机、CMB、EMF 和 BTEL 使用。'
  hu: 'Kormánykerék-vezérlő gombok, a rádió, a CMB, az EMF és a BTEL használja.'
  pt: 'Botões de comando no volante, utilizados pelo rádio, CMB, EMF e BTEL.'
periodicity: ['100ms', 'trigger']
senders: ['BSI', 'ICSV']
receivers: ['RAD', 'EMF', 'BTEL', 'KML', 'CMB', 'MDS', 'BTT', 'MATT']

signals:
  STEERING_WHEEL_NAV_MENU_SCROLL:
    bits: '1.7-1.0'
    comment:
      en: 'Steering wheel navigation menu scroll counter.'
      fr: 'Compteur de défilement du menu de navigation au volant.'
      es: 'Contador de desplazamiento del menú de navegación en el volante.'
      de: 'Bildlaufzähler des Navigationsmenüs am Lenkrad.'
      it: 'Contatore di scorrimento del menu di navigazione al volante.'
      pl: 'Licznik przewijania menu nawigacji na kierownicy.'
      ru: 'Счётчик прокрутки навигационного меню на рулевом колесе.'
      zh: '方向盘导航菜单滚动计数器。'
      hu: 'A kormánykeréken lévő navigációs menü görgetési számlálója.'
      pt: 'Contador de deslocamento do menu de navegação no volante'
    type: 'sint'
    factor: 1
    min: -128
    max: 127
    units: 'step'
    default: 0x00

  STEERING_WHEEL_NAV_MENU_SCROLL_OVERFLOW:
    bits: '2.7'
    comment:
      en: 'High overflow of the steering wheel navigation scroll wheel'
      fr: 'Débordement supérieur de la molette de navigation au volant'
      es: 'Desbordamiento superior de la rueda de navegación del volante'
      de: 'Überlauf des Navigations-Scrollrads am Lenkrad'
