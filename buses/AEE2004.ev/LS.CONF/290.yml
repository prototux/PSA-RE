      ru: 'Состояние индикации: ручная скорость заднего вентилятора'
      zh: '显示状态:后排送风机手动风速'
      hu: 'Kijelzési állapot: a hátsó fúvó kézi sebessége'
      pt: 'Estado de visualização: velocidade manual do ventilador traseiro'
