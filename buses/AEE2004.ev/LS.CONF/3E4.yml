id: 0x3E4
name: 'USB_UPDATE_STATUS'
type: 'can-tp'
comment:
  en: 'USB firmware update status: update state, version number and progress.'
  fr: 'État de la mise à jour par USB : état de la mise à jour, numéro de version et progression.'
  es: 'Estado de la actualización por USB: estado de la actualización, número de versión y progreso.'
  de: 'Status des USB-Firmware-Updates: Update-Status, Versionsnummer und Fortschritt.'
  it: 'Stato dell''aggiornamento firmware via USB: stato dell''aggiornamento, numero di versione e avanzamento.'
  pl: 'Stan aktualizacji oprogramowania przez USB: stan aktualizacji, numer wersji i postęp.'
  ru: 'Статус обновления прошивки через USB: статус обновления, номер версии и прогресс.'
  zh: 'USB固件更新状态:更新状态、版本号及进度。'
  hu: 'Az USB-s firmware-frissítés állapota: frissítési állapot, verziószám és folyamat előrehaladása.'
  pt: 'Estado da atualização de firmware USB: estado da atualização, número de versão e progresso.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['trigger']
senders: ['RAD', 'ICSV']
isotp:
  addressing: 'normal'

signals:
  UNUSED_1:
    bits: '1.7-1.4'
    unused: true

