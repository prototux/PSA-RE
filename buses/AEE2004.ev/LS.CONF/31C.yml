      de: 'Angeforderte Prüfung der Warnungen der Punktmatrix'
      it: 'Verifica degli allarmi richiesta dalla matrice a punti'
      pl: 'Żądane sprawdzenie alertów wyświetlacza matrycowego'
      ru: 'Запрошенная проверка предупреждений точечно-матричного дисплея'
      zh: '点阵显示屏请求的警报检查'
      hu: 'A pontmátrix kijelző riasztásainak kért ellenőrzése'
      pt: 'Verificação dos alertas solicitada pela matriz de pontos'
    type: 'bool'
