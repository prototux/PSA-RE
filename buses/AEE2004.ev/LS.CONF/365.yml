id: 0x365
name: 'RADIO_STATUS_CD_DISK'
type: 'can'
length: 5
comment:
  en: 'CD player disk status: elapsed time (minutes/seconds) and disk count.'
  fr: 'État du disque du lecteur CD : temps écoulé (minutes/secondes) et nombre de disques.'
  es: 'Estado del disco del reproductor de CD: tiempo transcurrido (minutos/segundos) y número de discos.'
  de: 'CD-Player-Datenträgerstatus: verstrichene Zeit (Minuten/Sekunden) und Anzahl der CDs.'
  it: 'Stato del disco del lettore CD: tempo trascorso (minuti/secondi) e numero di dischi.'
  pl: 'Stan płyty odtwarzacza CD: czas, który upłynął (minuty/sekundy) i liczba płyt.'
  ru: 'Статус диска CD-плеера: прошедшее время (минуты/секунды) и количество дисков.'
  zh: 'CD播放器光盘状态:已用时间(分/秒)及光盘数量。'
  hu: 'A CD-lejátszó lemezállapota: eltelt idő (perc/másodperc) és a lemezek száma.'
  pt: 'Estado do disco no leitor de CD: tempo decorrido (minutos/segundos) e número de discos.'
periodicity: ['500ms', 'trigger']
senders: ['RAD', 'ICSV']
receivers: ['EMF', 'CMB', 'MATT']

signals:
  TRACKS:
    bits: '1.7-1.0'
    comment:
      en: 'Number of tracks on the disc/directory being played'
      fr: 'Nombre de plages du disque/répertoire en cours de lecture'
      es: 'Número de pistas del disco/directorio en reproducción'
      de: 'Anzahl der Titel auf der abgespielten Disc/im Verzeichnis'
      it: 'Numero di tracce del disco/cartella in riproduzione'
      pl: 'Liczba ścieżek na odtwarzanej płycie/w katalogu'
      ru: 'Число дорожек на воспроизводимом диске/в каталоге'
      zh: '正在播放的光盘/目录中的曲目数'
      hu: 'A lejátszott lemez/könyvtár számainak száma'
      pt: 'Número de faixas do disco/diretório em reprodução'
    type: 'enum'
    default: 0xFF
    values:
      0xFF:
        en: 'If reading is not possible'
        fr: 'Si la lecture est impossible'
        es: 'Si la lectura no es posible'
        de: 'Wenn das Auslesen nicht möglich ist'
        it: 'Se la lettura non è possibile'
        pl: 'Jeśli odczyt jest niemożliwy'
        ru: 'Если считывание невозможно'
        zh: '如果无法读取'
        hu: 'Ha az olvasás nem lehetséges'
        pt: 'Se a leitura não for possível'

  TOTAL_DURATION_MINUTES:
    bits: '2.7-2.0'
    comment:
      en: 'Total duration of the CD/directory, minutes'
      fr: 'Durée totale du CD/répertoire, en minutes'
      es: 'Duración total del CD/directorio, en minutos'
      de: 'Gesamtdauer der CD/des Verzeichnisses, in Minuten'
      it: 'Durata totale del CD/cartella, in minuti'
      pl: 'Całkowity czas trwania CD/katalogu, w minutach'
      ru: 'Общая продолжительность CD/каталога, в минутах'
      zh: 'CD/目录总时长(分钟)'
      hu: 'A CD/könyvtár teljes időtartama percben'
      pt: 'Duração total do CD/diretório, em minutos'
    type: 'enum'
    default: 0xFF
    values:
      0xFF:
        en: 'Data unavailable'
        fr: 'Données indisponibles'
        es: 'Datos no disponibles'
        de: 'Daten nicht verfügbar'
        it: 'Dati non disponibili'
        pl: 'Dane niedostępne'
        ru: 'Данные недоступны'
        zh: '数据不可用'
        hu: 'Az adatok nem érhetők el'
        pt: 'Dados não disponíveis'

  TOTAL_DURATION_SECONDS:
    bits: '3.7-3.0'
    comment:
      en: 'Total duration of the CD/directory, seconds'
      fr: 'Durée totale du CD/répertoire, en secondes'
      es: 'Duración total del CD/directorio, en segundos'
      de: 'Gesamtdauer der CD/des Verzeichnisses, in Sekunden'
      it: 'Durata totale del CD/cartella, in secondi'
      pl: 'Całkowity czas trwania CD/katalogu, w sekundach'
      ru: 'Общая продолжительность CD/каталога, в секундах'
      zh: 'CD/目录总时长(秒)'
      hu: 'A CD/könyvtár teljes időtartama másodpercben'
      pt: 'Duração total do CD/diretório, em segundos'
    type: 'enum'
    default: 0xFF
    values:
      0xFF:
        en: 'Data unavailable'
        fr: 'Données indisponibles'
        es: 'Datos no disponibles'
        de: 'Daten nicht verfügbar'
        it: 'Dati non disponibili'
        pl: 'Dane niedostępne'
        ru: 'Данные недоступны'
        zh: '数据不可用'
        hu: 'Az adatok nem érhetők el'
        pt: 'Dados não disponíveis'

  NUMBER_OF_MP3_DIR:
    bits: '4.7-4.0'
    comment:
      en: 'Number of the current MP3 directory'
      fr: 'Numéro du répertoire courant en MP3'
      es: 'Número del directorio MP3 actual'
      de: 'Nummer des aktuellen MP3-Verzeichnisses'
      it: 'Numero della cartella MP3 corrente'
      pl: 'Numer bieżącego katalogu MP3'
      ru: 'Номер текущего каталога MP3'
      zh: '当前MP3目录编号'
      hu: 'Az aktuális MP3 könyvtár száma'
      pt: 'Número do diretório MP3 atual'
    type: 'uint'
    min: 0
    max: 254
    invalid: 0xFF
    default: 0x00

  UNUSED_1:
    bits: '5.7-5.0'
    unused: true
