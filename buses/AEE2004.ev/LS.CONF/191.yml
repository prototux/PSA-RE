id: 0x191
name: 'BLIND_SPOT_MONITORING_STATUS'
type: 'can'
length: 2
comment:
  en: 'Blind spot monitoring status: left/right object detection, sensor and system state, activation button.'
  fr: 'État de la surveillance des angles morts : détection d''objet gauche/droite, état des capteurs et du système, bouton d''activation.'
  es: 'Estado de la supervisión de ángulo muerto: detección de objeto izquierda/derecha, estado de los sensores y del sistema, botón de activación.'
  de: 'Status der Totwinkelüberwachung: Objekterkennung links/rechts, Sensor- und Systemzustand, Aktivierungstaste.'
  it: 'Stato del monitoraggio dell''angolo cieco: rilevamento oggetto sinistra/destra, stato dei sensori e del sistema, pulsante di attivazione.'
  pl: 'Stan monitorowania martwego pola: wykrywanie obiektu lewo/prawo, stan czujników i systemu, przycisk aktywacji.'
  ru: 'Статус контроля слепых зон: обнаружение объекта слева/справа, состояние датчиков и системы, кнопка активации.'
  zh: '盲点监测状态:左/右物体检测、传感器和系统状态、激活按钮。'
  hu: 'A holttér-figyelő rendszer állapota: bal/jobb oldali tárgyészlelés, érzékelő és rendszer állapota, aktiváló gomb.'
  pt: 'Estado da monitorização de ângulo morto: deteção de objeto esquerdo/direito, estado do sensor e do sistema, botão de ativação.'
periodicity: ['200ms', 'trigger']
senders: ['SAM']
receivers: ['BSI']

signals:
