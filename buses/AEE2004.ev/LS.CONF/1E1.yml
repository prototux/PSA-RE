        es: 'Rueda ligeramente desinflada'
        de: 'Leicht unterfülltes Rad'
        it: 'Ruota leggermente sgonfia'
        pl: 'Lekko niedopompowane koło'
        ru: 'Слегка спущенное колесо'
        zh: '轮胎轻微亏气'
        hu: 'Enyhén leeresztett kerék'
        pt: 'Roda ligeiramente desinflada'
      0x04:
        en: 'Severely deflated wheel'
        fr: 'Roue fortement dégonflée'
