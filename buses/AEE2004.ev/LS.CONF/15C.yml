id: 0x15C
name: 'WIND_DEFLECTOR_STATUS'
type: 'can'
length: 3
comment:
  en: 'Wind deflector status: not-initialised flag, movement and position.'
  fr: 'État du déflecteur : indicateur de non-initialisation, mouvement et position.'
  es: 'Estado del deflector de viento: indicador de no inicializado, movimiento y posición.'
  de: 'Status des Windabweisers: Nicht-initialisiert-Kennzeichen, Bewegung und Position.'
  it: 'Stato del deflettore: indicatore di non inizializzato, movimento e posizione.'
  pl: 'Stan deflektora powietrza: flaga braku inicjalizacji, ruch i pozycja.'
  ru: 'Статус ветроотражателя: флаг отсутствия инициализации, движение и положение.'
  zh: '风罩状态:未初始化标志、运动和位置。'
  hu: 'A szélterelő állapota: inicializálatlanság jelzője, mozgás és helyzet.'
  pt: 'Estado do defletor de ar: indicador de não inicializado, movimento e posição.'
periodicity: ['100ms']
senders: ['DEF']
receivers: ['BSI']

signals:
  UNUSED_1:
    bits: '1.7'
    unused: true

  DEFLECTOR_UNINITIALIZED:
