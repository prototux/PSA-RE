id: 0x036
name: 'RADIO_COMMANDS'
type: 'can'
length: 8
comment:
  en: 'Audio remote control commands from the steering column switch unit (under-wheel radio controls, excluding stalk end pushes), relayed by the BSI.'
  fr: 'Commandes de télécommande audio du commodo de colonne de direction (commandes radio sous volant, hors pushs en bout de commodo), relayées par la BSI.'
  es: 'Órdenes del mando a distancia de audio del mando bajo el volante (controles de radio bajo el volante, excluyendo los pulsadores en el extremo del mando), retransmitidas por la BSI.'
  de: 'Audio-Fernbedienungsbefehle des Lenksäulenschalters (Radiobedienung unter dem Lenkrad, ohne Lenkstockhebel-Endtaster), von der BSI weitergeleitet.'
  it: 'Comandi del telecomando audio della leva sotto il volante (comandi radio sotto il volante, esclusi i pulsanti all''estremità della leva), inoltrati dalla BSI.'
  pl: 'Polecenia zdalnego sterowania audio z dźwigienki kolumny kierownicy (sterowanie radiem pod kierownicą, z wyłączeniem przycisków na końcu dźwigienki), przekazywane przez BSI.'
  ru: 'Команды аудио-пульта подрулевого переключателя (управление радио под рулём, кроме кнопок на конце подрулевого рычага), ретранслируемые BSI.'
  zh: '来自转向柱组合开关的音频遥控命令（方向盘下方收音机控制，不含组合开关末端按键），由BSI转发。'
  hu: 'A kormányoszlop-kapcsoló egység audio-távvezérlő parancsai (kormány alatti rádiókezelés, a kar végi nyomógombok kivételével), a BSI továbbítja.'
  pt: 'Comandos remotos de áudio da unidade de comutadores da coluna de direção (comandos de rádio sob o volante, excluindo as pressões nas extremidades dos comutadores), retransmitidos pela BSI.'
observations:
  en: 'On state change of: DRIVER_MEMORY, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, HYBRID_STATUS_UPDATED'
  fr: 'Sur changement d''état de : DRIVER_MEMORY, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, HYBRID_STATUS_UPDATED'
  es: 'Al cambiar el estado de: DRIVER_MEMORY, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, HYBRID_STATUS_UPDATED'
  de: 'Bei Statusänderung von: DRIVER_MEMORY, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, HYBRID_STATUS_UPDATED'
  it: 'Al cambiamento di stato di: DRIVER_MEMORY, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, HYBRID_STATUS_UPDATED'
  pl: 'Wysyłane przy zmianie stanu: DRIVER_MEMORY, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, HYBRID_STATUS_UPDATED'
  ru: 'При изменении состояния: DRIVER_MEMORY, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, HYBRID_STATUS_UPDATED'
  zh: '当RAPP_MEM_C, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, UB_ETAT_GMP_HY状态变化时'
  hu: 'A(z) DRIVER_MEMORY, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, HYBRID_STATUS_UPDATED állapotváltozásakor'
  pt: 'Na mudança de estado de: DRIVER_MEMORY, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, HYBRID_STATUS_UPDATED'
