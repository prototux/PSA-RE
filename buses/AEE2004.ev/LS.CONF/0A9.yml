        pt: 'Flow control (FC)'

  SINGLE_FRAME_DATA_LENGTH:
    bits: '8.3-8.0'
    comment:
      en: 'Data length of a single-frame transport message.'
      fr: 'Longueur de données d''un message de transport en trame unique.'
      es: 'Longitud de datos de un mensaje de transporte de trama única'
      de: 'Datenlänge einer Einzelrahmen-Transportnachricht'
      it: 'Lunghezza dati di un messaggio di trasporto a frame singolo'
      pl: 'Długość danych komunikatu transportowego w pojedynczej ramce'
      ru: 'Длина данных однокадрового транспортного сообщения'
      zh: '单帧传输消息的数据长度'
      hu: 'Egykeretes szállítási üzenet adathossza'
      pt: 'Comprimento de dados de uma mensagem de transporte em trama única'
    type: 'uint'

