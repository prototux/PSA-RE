id: 0x1E5
name: 'RADIO_STATUS_AUDIO'
alt_names: ['ETAT_RADIO_GEN_AUD']
type: 'can'
length: 7
comment:
  en: 'Active-setting bits indicating to the display which audio setting is currently being adjusted, plus balance/bass/fader/treble/loudness levels.'
  fr: 'Bits de réglage actif indiquant à l''afficheur quel réglage audio est en cours d''ajustement, ainsi que les niveaux de balance/graves/fader/aigus/loudness.'
  es: 'Bits de ajuste activo que indican a la pantalla qué ajuste de audio se está modificando, además de los niveles de balance/graves/fader/agudos/loudness.'
  de: 'Bits für den aktiven Einstellungsstatus, die dem Display anzeigen, welche Audioeinstellung gerade angepasst wird, sowie Balance-/Bass-/Fader-/Höhen-/Loudness-Pegel.'
  it: 'Bit di impostazione attiva che indicano al display quale impostazione audio è in fase di regolazione, oltre ai livelli di bilanciamento/bassi/fader/acuti/loudness.'
  pl: 'Bity aktywnego ustawienia informujące wyświetlacz, które ustawienie audio jest właśnie regulowane, a także poziomy balansu/basów/fadera/tonów wysokich/loudness.'
  ru: 'Биты активной настройки, указывающие дисплею, какая аудионастройка сейчас регулируется, а также уровни баланса/басов/фейдера/высоких частот/громкости.'
  zh: '指示显示屏当前正在调整哪项音频设置的激活设置位,以及平衡/低音/前后声道/高音/响度电平。'
  hu: 'Az aktív beállítást jelző bitek, amelyek jelzik a kijelzőnek, épp mely hangbeállítás van állítás alatt, valamint a balansz/basszus/fader/magas/hangosság szintek.'
  pt: 'Bits de definição ativa a indicar ao visor qual a definição áudio a ser ajustada, além dos níveis de balanço/graves/fader/agudos/loudness.'
periodicity: ['500ms', 'trigger']
senders: ['RAD', 'BTEL', 'ICSV']
receivers: ['EMF', 'AMPLI', 'CMB']

