id: 0x1E8
name: 'ENGINE_MEAP_STATUS'
type: 'can'
length: 8
comment:
  en: 'Slow (low-priority) alert block, sent by the BSI.'
  fr: 'Bloc d''alertes lentes (basse priorité), envoyé par la BSI.'
  es: 'Bloque de alertas lentas (baja prioridad), enviado por la BSI.'
  de: 'Block der langsamen (niedrigprioren) Warnungen, gesendet von der BSI.'
  it: 'Blocco di allarmi lenti (bassa priorità), inviato dalla BSI.'
  pl: 'Blok wolnych alertów (niski priorytet), wysyłany przez BSI.'
  ru: 'Блок медленных (низкоприоритетных) предупреждений, отправляемый BSI.'
  zh: '由BSI发送的低优先级（慢速）警报块。'
  hu: 'A BSI által küldött lassú (alacsony prioritású) riasztásblokk.'
  pt: 'Bloco de alertas lentos (baixa prioridade), enviado pela BSI.'
periodicity: ['200ms']
senders: ['BSI']
receivers: ['CMB']

signals:
  SLOW_ALERTS_BLOCK_NUMBER:
    bits: '1.7-1.6'
    comment:
      en: 'Slow-alert data block identifier'
      fr: 'Identifiant du bloc de données d''alertes lentes'
      es: 'Identificador del bloque de datos de alertas lentas'
      de: 'Kennung des Datenblocks der langsamen Warnungen'
      it: 'Identificativo del blocco dati degli allarmi lenti'
      pl: 'Identyfikator bloku danych wolnych alertów'
      ru: 'Идентификатор блока данных медленных предупреждений'
      zh: '慢速报警数据块标识符'
      hu: 'A lassú riasztási adatblokk azonosítója'
      pt: 'Identificador do bloco de dados de alertas lentas'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'Invalid data'
        fr: 'données invalides'
        es: 'Datos inválidos'
        de: 'Ungültige Daten'
        it: 'Dati non validi'
        pl: 'Nieprawidłowe dane'
        ru: 'Недействительные данные'
        zh: '数据无效'
        hu: 'Érvénytelen adatok'
        pt: 'Dados inválidos'
      0x01:
        en: 'Data block no. 1'
        fr: 'Bloc de données n° 1'
        es: 'Bloque de datos n.º 1'
        de: 'Datenblock Nr. 1'
        it: 'Blocco dati n. 1'
        pl: 'Blok danych nr 1'
        ru: 'Блок данных № 1'
        zh: '数据块1号'
        hu: '1. számú adatblokk'
        pt: 'Bloco de dados n.º 1'
      0x02:
        en: 'Data block no. 2'
        fr: 'Bloc de données n° 2'
        es: 'Bloque de datos n.º 2'
        de: 'Datenblock Nr. 2'
        it: 'Blocco dati n. 2'
        pl: 'Blok danych nr 2'
        ru: 'Блок данных №2'
        zh: '数据块2号'
        hu: '2. sz. adatblokk'
        pt: 'Bloco de dados n.º 2'
      0x03:
        en: 'Invalid data'
        fr: 'données invalides'
        es: 'Datos inválidos'
        de: 'Ungültige Daten'
        it: 'Dati non validi'
        pl: 'Nieprawidłowe dane'
        ru: 'Недействительные данные'
        zh: '数据无效'
        hu: 'Érvénytelen adatok'
        pt: 'Dados inválidos'

  SLOW_ALERTS_DATA:
    bits: '1.5-8.0'
    comment:
      en: 'Slow-alert data (component-specific)'
      fr: 'Données d''alertes lentes (spécifique au composant)'
      es: 'Datos de alertas lentas (específicos del componente)'
      de: 'Daten der langsamen Warnungen (bauteilspezifisch)'
      it: 'Dati degli allarmi lenti (specifici del componente)'
      pl: 'Dane wolnych alertów (specyficzne dla podzespołu)'
      ru: 'Данные медленных предупреждений (зависит от узла)'
      zh: '慢速报警数据(具体取决于部件)'
      hu: 'Lassú riasztási adatok (alkatrész-specifikus)'
      pt: 'Dados de alertas lentos (específicos do componente)'
    type: 'uint'
    default: 0x00
