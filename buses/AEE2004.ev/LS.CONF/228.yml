id: 0x228
name: 'CLOCK_TIME'
type: 'can'
length: 2
comment:
  en: 'Clock hour and minute, sent by the telematics/display units.'
  fr: 'Heure et minute de l''horloge, envoyées par les unités télématique/afficheur.'
  es: 'Hora y minuto del reloj, enviados por las unidades telemática/pantalla.'
  de: 'Stunde und Minute der Uhr, von den Telematik-/Anzeigeeinheiten gesendet.'
  it: 'Ora e minuto dell''orologio, inviati dalle unità telematica/display.'
  pl: 'Godzina i minuta zegara, wysyłane przez jednostki telematyczną/wyświetlacz.'
  ru: 'Часы и минуты часов, отправляемые телематическим/дисплейным блоками.'
  zh: '由远程信息处理/显示单元发送的时钟小时和分钟。'
  hu: 'Az óra órája és perce, a telematikai/kijelző egységek küldik.'
  pt: 'Hora e minuto do relógio, enviados pelas unidades telemática/de visor.'
periodicity: ['trigger']
senders: ['BTEL', 'EMF']
receivers: ['CLOCK']

signals:
  UNUSED_1:
    bits: '1.7-1.5'
    unused: true

  TIME_HOUR:
    bits: '1.4-1.0'
    comment:
      en: 'Clock hour'
      fr: 'Heure de l''horloge'
      es: 'Hora del reloj'
      de: 'Uhrzeit (Stunde)'
      it: 'Ora dell''orologio'
      pl: 'Godzina zegara'
      ru: 'Часы (значение часов)'
      zh: '时钟小时'
      hu: 'Óra (óraérték)'
      pt: 'Hora do relógio'
    type: 'uint'
    factor: 1
    min: 0
    max: 23
    units: 'h'
    invalid: 0x1F

  UNUSED_2:
    bits: '2.7-2.6'
    unused: true

  TIME_MINUTE:
    bits: '2.5-2.0'
    comment:
      en: 'Clock minute'
      fr: 'Minutes de l''horloge'
      es: 'Minutos del reloj'
      de: 'Uhrzeit (Minute)'
      it: 'Minuti dell''orologio'
      pl: 'Minuty zegara'
      ru: 'Часы (значение минут)'
      zh: '时钟分钟'
      hu: 'Óra (percérték)'
      pt: 'Minuto do relógio'
    type: 'uint'
    factor: 1
    min: 0
    max: 59
    units: 'min'
    invalid: 0x3F
