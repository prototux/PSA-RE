        es: 'Apagado'
        de: 'Aus'
        it: 'Spento'
        pl: 'Wyłączony'
        ru: 'Выключено'
        zh: '关闭'
        hu: 'Kikapcsolva'
        pt: 'Desligado'
      0x01:
