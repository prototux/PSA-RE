id: 0x061
name: 'ELECTRIC_VEHICLE_INFO'
type: 'can'
length: 8
comment:
  en: 'Electric vehicle general information: auxiliary battery range, energy counter, turtle (limp-home) mode request and battery state of charge.'
  fr: 'Informations générales véhicule électrique : autonomie batterie auxiliaire, compteur d''énergie, demande de mode tortue et état de charge de la batterie.'
  es: 'Información general del vehículo eléctrico: autonomía de la batería auxiliar, contador de energía, solicitud de modo tortuga y estado de carga de la batería.'
  de: 'Allgemeine Elektrofahrzeuginformationen: Reichweite der Hilfsbatterie, Energiezähler, Schildkrötenmodusanforderung und Batterieladezustand.'
  it: 'Informazioni generali del veicolo elettrico: autonomia della batteria ausiliaria, contatore di energia, richiesta di modalità tartaruga e stato di carica della batteria.'
  pl: 'Ogólne informacje o pojeździe elektrycznym: zasięg akumulatora pomocniczego, licznik energii, żądanie trybu żółwia i stan naładowania akumulatora.'
  ru: 'Общая информация об электромобиле: запас хода вспомогательной батареи, счётчик энергии, запрос черепашьего режима и уровень заряда батареи.'
  zh: '电动车通用信息:辅助电池续航、电能计数器、龟速(跛行)模式请求及电池荷电状态。'
  hu: 'Az elektromos jármű általános információi: segédakkumulátor hatótávolsága, energiaszámláló, teknős (vészüzem) mód kérése és akkumulátor töltöttségi állapota.'
  pt: 'Informação geral do veículo elétrico: autonomia da bateria auxiliar, contador de energia, pedido de modo tartaruga e estado de carga da bateria.'
periodicity: ['200ms']
senders: ['BSI']
receivers: ['MDS', 'CMB', 'BTEL', 'EMF']

signals:
  BATTERY_STATUS:
    bits: '1.7-1.0'
    comment:
      en: 'Battery state of charge'
      fr: 'État de charge de la batterie'
      es: 'Estado de carga de la batería'
      de: 'Batterieladezustand'
      it: 'Stato di carica della batteria'
      pl: 'Stan naładowania akumulatora'
      ru: 'Уровень заряда батареи'
      zh: '电池充电状态'
      hu: 'Az akkumulátor töltöttségi állapota'
      pt: 'Estado de carga da bateria'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0x7F
    default: 0x00

  ZEV_RANGE_WITHOUT_AUX:
    bits: '2.7-3.6'
    comment:
      en: 'ZEV range without auxiliary consumers'
      fr: 'Autonomie en mode ZEV sans consommateurs auxiliaires'
      es: 'Autonomía en modo ZEV sin consumidores auxiliares'
      de: 'ZEV-Reichweite ohne Nebenverbraucher'
      it: 'Autonomia in modalità ZEV senza utenze ausiliarie'
      pl: 'Zasięg w trybie ZEV bez odbiorników pomocniczych'
      ru: 'Запас хода в режиме ZEV без вспомогательных потребителей'
      zh: '无辅助负载时的ZEV续航里程'
      hu: 'ZEV hatótávolság a kiegészítő fogyasztók nélkül'
      pt: 'Autonomia em modo ZEV sem consumidores auxiliares'
    type: 'uint'
    factor: 1
    min: 0
    max: 1022
    units: 'km'
    invalid: 0x3FF
    default: 0x00

  PLUG_IN_STATE:
