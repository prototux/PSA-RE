        fr: 'Fixe'
        es: 'Fijo'
        de: 'Dauerlicht'
        it: 'Fisso'
        pl: 'Ciągłe'
        ru: 'Постоянно'
        zh: '常亮'
        hu: 'Folyamatos'
        pt: 'Fixo'
      0x02:
        en: 'Flashing'
        fr: 'Clignotant'
        es: 'Intermitente'
        de: 'Blinkend'
        it: 'Lampeggiante'
        pl: 'Migający'
        ru: 'Мигающий'
        zh: '闪烁'
        hu: 'Villogó'
        pt: 'Intermitente'
      0x03:
        en: 'Value not used'
        fr: 'Valeur non utilisée'
        es: 'Valor no utilizado'
        de: 'Nicht verwendeter Wert'
        it: 'Valore non utilizzato'
        pl: 'Nieużywana wartość'
        ru: 'Неиспользуемое значение'
        zh: '未使用的值'
        hu: 'Nem használt érték'
