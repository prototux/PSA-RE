  TURTLE_MODE_REQUEST:
    bits: '3.3'
    comment:
      en: 'Request to light the ''turtle mode'' warning lamp'
      fr: 'Demande d''allumage du témoin mode tortue'
      es: 'Solicitud de encendido del testigo modo tortuga'
      de: 'Anforderung zum Einschalten der „Schildkrötenmodus“-Kontrollleuchte'
