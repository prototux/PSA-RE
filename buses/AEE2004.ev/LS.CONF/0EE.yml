id: 0x0EE
name: 'MEMORY_SEAT_COMMAND'
type: 'can'
length: 5
comment:
  en: 'BSI to driver memory seat module: recall/manual adjustment authorisations, steering column retraction, keypad lighting, economy mode and imminent sleep.'
  fr: 'BSI vers le module de mémorisation du siège conducteur : autorisations de rappel/réglage manuel, dégagement de la colonne de direction, éclairage du clavier, mode économie et veille imminente.'
  es: 'BSI al módulo de memoria del asiento del conductor: autorizaciones de recuperación/ajuste manual, retracción de la columna de dirección, iluminación del teclado, modo económico y reposo inminente.'
  de: 'BSI an das Fahrersitz-Memory-Modul: Freigaben für Speicherabruf/manuelle Verstellung, Lenksäulenrückzug, Tastaturbeleuchtung, Sparmodus und bevorstehender Ruhezustand.'
  it: 'BSI al modulo memoria del sedile conducente: autorizzazioni di richiamo/regolazione manuale, arretramento della colonna di sterzo, illuminazione della tastiera, modalità economica e stand-by imminente.'
  pl: 'BSI do modułu pamięci fotela kierowcy: zezwolenia na przywołanie/regulację ręczną, cofnięcie kolumny kierownicy, podświetlenie klawiatury, tryb oszczędny i zbliżający się tryb uśpienia.'
  ru: 'BSI в модуль памяти сиденья водителя: разрешения вызова из памяти/ручной регулировки, отвод рулевой колонки, подсветка клавиатуры, экономичный режим и скорый переход в спящий режим.'
  zh: 'BSI发送给驾驶员记忆座椅模块的信息：记忆调用/手动调节授权、转向柱回缩、键盘照明、节能模式及即将进入休眠。'
  hu: 'A BSI a vezetőülés-memória modul felé: memória-visszahívási/kézi állítási engedélyek, kormányoszlop visszahúzása, billentyűzet-világítás, takarékos üzemmód és a közelgő alvó állapot.'
  pt: 'Da BSI para o módulo de memória do banco do condutor: autorizações de recuperação/ajuste manual, retração da coluna de direção, iluminação do teclado, modo económico e adormecimento iminente.'
observations:
  en: 'On state change of: REAR_SEATS_MANUAL_CONTROL_ALLOWED, BUSINESS_SEAT_MANUAL_CONTROL_ALLOWED, REAR_SEAT_SWITCH_LIGHTING_ALLOWED, BUSINESS_SWITCH_LIGHTING_ALLOWED, PASSENGER_REAR_SEAT_GREETING, MIDDLE_REAR_SEAT_GREETING, DRIVER_REAR_SEAT_GREETING, REAR_FOOTWELL_LIGHT'
  fr: 'Sur changement d''état de : REAR_SEATS_MANUAL_CONTROL_ALLOWED, BUSINESS_SEAT_MANUAL_CONTROL_ALLOWED, REAR_SEAT_SWITCH_LIGHTING_ALLOWED, BUSINESS_SWITCH_LIGHTING_ALLOWED, PASSENGER_REAR_SEAT_GREETING, MIDDLE_REAR_SEAT_GREETING, DRIVER_REAR_SEAT_GREETING, REAR_FOOTWELL_LIGHT'
  es: 'Al cambiar el estado de: REAR_SEATS_MANUAL_CONTROL_ALLOWED, BUSINESS_SEAT_MANUAL_CONTROL_ALLOWED, REAR_SEAT_SWITCH_LIGHTING_ALLOWED, BUSINESS_SWITCH_LIGHTING_ALLOWED, PASSENGER_REAR_SEAT_GREETING, MIDDLE_REAR_SEAT_GREETING, DRIVER_REAR_SEAT_GREETING, REAR_FOOTWELL_LIGHT'
  de: 'Bei Statusänderung von: REAR_SEATS_MANUAL_CONTROL_ALLOWED, BUSINESS_SEAT_MANUAL_CONTROL_ALLOWED, REAR_SEAT_SWITCH_LIGHTING_ALLOWED, BUSINESS_SWITCH_LIGHTING_ALLOWED, PASSENGER_REAR_SEAT_GREETING, MIDDLE_REAR_SEAT_GREETING, DRIVER_REAR_SEAT_GREETING, REAR_FOOTWELL_LIGHT'
  it: 'Al cambiamento di stato di: REAR_SEATS_MANUAL_CONTROL_ALLOWED, BUSINESS_SEAT_MANUAL_CONTROL_ALLOWED, REAR_SEAT_SWITCH_LIGHTING_ALLOWED, BUSINESS_SWITCH_LIGHTING_ALLOWED, PASSENGER_REAR_SEAT_GREETING, MIDDLE_REAR_SEAT_GREETING, DRIVER_REAR_SEAT_GREETING, REAR_FOOTWELL_LIGHT'
  pl: 'Wysyłane przy zmianie stanu: REAR_SEATS_MANUAL_CONTROL_ALLOWED, BUSINESS_SEAT_MANUAL_CONTROL_ALLOWED, REAR_SEAT_SWITCH_LIGHTING_ALLOWED, BUSINESS_SWITCH_LIGHTING_ALLOWED, PASSENGER_REAR_SEAT_GREETING, MIDDLE_REAR_SEAT_GREETING, DRIVER_REAR_SEAT_GREETING, REAR_FOOTWELL_LIGHT'
  ru: 'При изменении состояния: REAR_SEATS_MANUAL_CONTROL_ALLOWED, BUSINESS_SEAT_MANUAL_CONTROL_ALLOWED, REAR_SEAT_SWITCH_LIGHTING_ALLOWED, BUSINESS_SWITCH_LIGHTING_ALLOWED, PASSENGER_REAR_SEAT_GREETING, MIDDLE_REAR_SEAT_GREETING, DRIVER_REAR_SEAT_GREETING, REAR_FOOTWELL_LIGHT'
  zh: '当AUTO_REGL_SG_ARR, BUSINESS_SEAT_MANUAL_CONTROL_ALLOWED, REAR_SEAT_SWITCH_LIGHTING_ALLOWED, BUSINESS_SWITCH_LIGHTING_ALLOWED, PASSENGER_REAR_SEAT_GREETING, MIDDLE_REAR_SEAT_GREETING, DRIVER_REAR_SEAT_GREETING, CAP_ARRIERE状态变化时'
  hu: 'A(z) REAR_SEATS_MANUAL_CONTROL_ALLOWED, BUSINESS_SEAT_MANUAL_CONTROL_ALLOWED, REAR_SEAT_SWITCH_LIGHTING_ALLOWED, BUSINESS_SWITCH_LIGHTING_ALLOWED, PASSENGER_REAR_SEAT_GREETING, MIDDLE_REAR_SEAT_GREETING, DRIVER_REAR_SEAT_GREETING, REAR_FOOTWELL_LIGHT állapotváltozásakor'
  pt: 'Na mudança de estado de: REAR_SEATS_MANUAL_CONTROL_ALLOWED, BUSINESS_SEAT_MANUAL_CONTROL_ALLOWED, REAR_SEAT_SWITCH_LIGHTING_ALLOWED, BUSINESS_SWITCH_LIGHTING_ALLOWED, PASSENGER_REAR_SEAT_GREETING, MIDDLE_REAR_SEAT_GREETING, DRIVER_REAR_SEAT_GREETING, REAR_FOOTWELL_LIGHT'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['BDM_A', 'BDM_C']

