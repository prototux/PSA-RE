id: 0x227
name: 'PUSH_BUTTON_LED_CONTROL'
type: 'can'
length: 5
comment:
  en: 'Lighting requests for the push button LEDs (parking aid, climate, ESP, parking brake, gear-lock, driving mode, child lock).'
  fr: 'Demandes d''allumage des LED des boutons poussoirs (aide au stationnement, climatisation, ESP, frein de parking, verrouillage boîte, mode de conduite, sécurité enfant).'
  es: 'Solicitudes de encendido de los LED de los botones pulsadores (ayuda al aparcamiento, climatización, ESP, freno de estacionamiento, bloqueo de caja, modo de conducción, seguro para niños).'
  de: 'Beleuchtungsanforderungen für die Taster-LEDs (Einparkhilfe, Klimaanlage, ESP, Feststellbremse, Getriebeverriegelung, Fahrmodus, Kindersicherung).'
  it: 'Richieste di accensione dei LED dei pulsanti (assistenza al parcheggio, climatizzatore, ESP, freno di stazionamento, blocco cambio, modalità di guida, sicurezza bambini).'
  pl: 'Żądania podświetlenia LED przycisków (wspomaganie parkowania, klimatyzacja, ESP, hamulec postojowy, blokada skrzyni biegów, tryb jazdy, blokada dla dzieci).'
  ru: 'Запросы подсветки светодиодов кнопок (парковочный ассистент, кондиционер, ESP, стояночный тормоз, блокировка коробки передач, режим движения, блокировка от детей).'
  zh: '按键LED的点亮请求（泊车辅助、空调、ESP、驻车制动、变速箱锁止、驾驶模式、儿童锁）。'
  hu: 'A nyomógombok LED-jeinek bekapcsolási kérései (parkolássegítő, klíma, ESP, rögzítőfék, váltózár, vezetési mód, gyerekzár).'
  pt: 'Pedidos de iluminação dos LED dos botões (ajuda ao estacionamento, climatização, ESP, travão de estacionamento, bloqueio de caixa, modo de condução, bloqueio para crianças).'
observations:
  en: 'On state change of: PARKING_AID_PUSH_LED_CONTROL, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, ARTIV_PUSH_LED_CONTROL'
  fr: 'Sur changement d''état de : PARKING_AID_PUSH_LED_CONTROL, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, ARTIV_PUSH_LED_CONTROL'
  es: 'Al cambiar el estado de: PARKING_AID_PUSH_LED_CONTROL, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, ARTIV_PUSH_LED_CONTROL'
  de: 'Bei Statusänderung von: PARKING_AID_PUSH_LED_CONTROL, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, ARTIV_PUSH_LED_CONTROL'
  it: 'Al cambiamento di stato di: PARKING_AID_PUSH_LED_CONTROL, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, ARTIV_PUSH_LED_CONTROL'
  pl: 'Wysyłane przy zmianie stanu: PARKING_AID_PUSH_LED_CONTROL, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, ARTIV_PUSH_LED_CONTROL'
  ru: 'При изменении состояния: PARKING_AID_PUSH_LED_CONTROL, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, ARTIV_PUSH_LED_CONTROL'
  zh: '当SORTIE_PUSH_AAS, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, SORTIE_PUSH_ARTIV状态变化时'
  hu: 'A(z) PARKING_AID_PUSH_LED_CONTROL, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, ARTIV_PUSH_LED_CONTROL állapotváltozásakor'
  pt: 'Na mudança de estado de: PARKING_AID_PUSH_LED_CONTROL, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, ARTIV_PUSH_LED_CONTROL'
periodicity: ['500ms', 'trigger']
