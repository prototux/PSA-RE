id: 0x482
name: 'STOP_START_SUPERVISOR_DATA'
type: 'can'
length: 6
comment:
  en: 'Stop-start supervisor data: system fault, button pressed, low-voltage battery state of charge and inhibition status.'
  fr: 'Données du superviseur stop-start : défaut système, bouton appuyé, état de charge batterie basse tension et état d''inhibition.'
  es: 'Datos del supervisor stop-start: fallo del sistema, botón pulsado, estado de carga de la batería de baja tensión y estado de inhibición.'
  de: 'Daten des Stopp-Start-Supervisors: Systemfehler, Taster gedrückt, Ladezustand der Niederspannungsbatterie und Sperrstatus.'
  it: 'Dati del supervisore stop-start: guasto sistema, pulsante premuto, stato di carica della batteria a bassa tensione e stato di inibizione.'
  pl: 'Dane nadzorcy stop-start: usterka systemu, wciśnięty przycisk, stan naładowania akumulatora niskiego napięcia i stan blokady.'
  ru: 'Данные супервизора старт-стоп: неисправность системы, нажатие кнопки, уровень заряда низковольтной батареи и статус блокировки.'
  zh: '启停监控数据:系统故障、按钮按下、低压电池充电状态和抑制状态。'
  hu: 'Stop-start felügyeleti adatok: rendszerhiba, gomb megnyomva, kisfeszültségű akkumulátor töltöttségi állapota és letiltási állapot.'
  pt: 'Dados do supervisor do stop-start: avaria do sistema, botão premido, estado de carga da bateria de baixa tensão e estado de inibição.'
observations:
  en: 'On change of the powertrain operating status'
  fr: 'Sur changement de l''état de fonctionnement du GMP'
  es: 'Al cambiar el estado de funcionamiento del grupo motopropulsor'
  de: 'Bei Änderung des Betriebszustands des Antriebsstrangs'
  it: 'Al cambiamento dello stato di funzionamento del gruppo motopropulsore'
  pl: 'Przy zmianie stanu pracy układu napędowego'
  ru: 'При изменении рабочего состояния силового агрегата'
  zh: '动力总成运行状态变化时'
  hu: 'A hajtáslánc üzemállapotának változásakor'
  pt: 'Na mudança do estado de funcionamento do grupo motopropulsor'
periodicity: ['100ms', 'trigger']
senders: ['SCDT', 'AR2S']
receivers: ['BSI', 'BVA']

