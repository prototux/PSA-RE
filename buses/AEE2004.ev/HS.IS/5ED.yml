id: 0x5ED
name: 'CLV_VERSION'
type: 'can'
length: 3
comment:
  en: 'Tyre pressure monitoring telltale status: system indicator and each wheel indicator (front/rear, left/right).'
  fr: 'État des témoins de surveillance de pression des pneus : témoin système et témoin de chaque roue (avant/arrière, gauche/droite).'
  es: 'Estado de los testigos de control de presión de neumáticos: testigo del sistema y testigo de cada rueda (delantera/trasera, izquierda/derecha).'
  de: 'Status der Reifendruckkontrollleuchten: Systemanzeige und Anzeige je Rad (vorne/hinten, links/rechts).'
  it: 'Stato delle spie di controllo pressione pneumatici: spia sistema e spia di ogni ruota (anteriore/posteriore, sinistra/destra).'
  pl: 'Stan kontrolek monitorowania ciśnienia w oponach: kontrolka systemu i kontrolka każdego koła (przód/tył, lewe/prawe).'
  ru: 'Статус индикаторов контроля давления в шинах: индикатор системы и индикатор каждого колеса (переднее/заднее, левое/правое).'
  zh: '胎压监测指示灯状态:系统指示灯和每个车轮的指示灯(前/后,左/右)。'
  hu: 'Az abroncsnyomás-ellenőrző jelzőlámpák állapota: rendszerjelző és az egyes kerekek jelzői (első/hátsó, bal/jobb).'
  pt: 'Estado do avisador de monitorização da pressão dos pneus: indicador do sistema e indicador de cada roda (dianteira/traseira, esquerda/direita).'
periodicity: ['300ms']
senders: ['ABS']
receivers: ['BSI']

signals:
  INDIRECT_TPMS_REAR_RIGHT_WHEEL_STATUS:
    bits: '1.7-1.5'
    comment:
      en: 'Indirect tyre-pressure status, rear right wheel'
      fr: 'État de la surveillance indirecte de la pression, roue arrière droite'
      es: 'Estado de la supervisión indirecta de la presión, rueda trasera derecha'
      de: 'Status der indirekten Reifendrucküberwachung, Rad hinten rechts'
      it: 'Stato del monitoraggio indiretto della pressione, ruota posteriore destra'
      pl: 'Stan pośredniego monitorowania ciśnienia, koło tylne prawe'
      ru: 'Статус косвенного контроля давления, заднее правое колесо'
      zh: '间接式胎压监测状态,右后轮'
      hu: 'Közvetett gumiabroncsnyomás-állapot, hátsó jobb kerék'
      pt: 'Estado da supervisão indireta da pressão, roda traseira direita'
    type: 'enum'
    default: 0x07
    values:
      0x00:
        unused: true
      0x01:
        en: 'Deflated wheel state'
        fr: 'État roue sous-gonflée'
        es: 'Estado de rueda desinflada'
        de: 'Zustand Reifen unterfüllt'
        it: 'Stato ruota sgonfia'
        pl: 'Stan koła niedopompowanego'
        ru: 'Состояние спущенного колеса'
        zh: '轮胎气压不足状态'
        hu: 'Alulfújt kerék állapota'
        pt: 'Estado de roda desinsuflada'
      0x02:
        en: 'Punctured wheel state'
        fr: 'État roue crevée'
        es: 'Estado de rueda pinchada'
        de: 'Zustand Reifenpanne'
        it: 'Stato ruota forata'
        pl: 'Stan przebitego koła'
        ru: 'Состояние прокола колеса'
        zh: '轮胎爆胎状态'
        hu: 'Defektes kerék állapota'
        pt: 'Estado de roda furada'
      0x03:
        unused: true
      0x04:
        en: 'Unknown wheel state'
        fr: 'État de roue inconnu'
        es: 'Estado de la rueda desconocido'
        de: 'Unbekannter Radzustand'
        it: 'Stato della ruota sconosciuto'
        pl: 'Nieznany stan koła'
        ru: 'Неизвестное состояние колеса'
        zh: '车轮状态未知'
        hu: 'Ismeretlen kerékállapot'
        pt: 'Estado da roda desconhecido'
      0x05:
        unused: true
      0x06:
        unused: true
      0x07:
        en: 'Normal wheel state'
        fr: 'État roue normale'
        es: 'Estado de rueda normal'
        de: 'Normaler Radzustand'
        it: 'Stato ruota normale'
        pl: 'Normalny stan koła'
        ru: 'Нормальное состояние колеса'
        zh: '车轮状态正常'
        hu: 'Normál kerékállapot'
        pt: 'Estado normal da roda'

