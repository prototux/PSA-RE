      0x00:
        en: 'CNG type not recognized'
        fr: 'Type GNV non reconnu'
        es: 'Tipo de GNC no reconocido'
        de: 'CNG-Typ nicht erkannt'
        it: 'Tipo di GNC non riconosciuto'
        pl: 'Nierozpoznany typ CNG'
        ru: 'Тип CNG не распознан'
