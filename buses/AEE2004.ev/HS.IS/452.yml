      it: 'Stato del lavavetro anteriore'
      pl: 'Stan spryskiwacza przedniej szyby'
      ru: 'Состояние переднего стеклоомывателя'
      zh: '前挡风玻璃洗涤器状态'
      hu: 'Az első szélvédőmosó állapota'
      pt: 'Estado do lava para-brisas dianteiro'
    type: 'bool'
    default: 0x00
