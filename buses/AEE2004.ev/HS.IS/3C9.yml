id: 0x3C9
name: 'AMT_DYNAMIC_DATA'
type: 'can'
length: 8
comment:
  en: 'Automated manual gearbox dynamic data 2: maximum transmissible clutch torque, clutch-open and torque-reserve requests, kickdown release, stop-shift inhibition, target ratio.'
  fr: 'Données dynamiques 2 de la boîte pilotée : couple max transmissible par l''embrayage, demandes d''ouverture d''embrayage et de réserve de couple, décollage kickdown, inhibition de passage au stop, rapport cible.'
  es: 'Datos dinámicos 2 de la caja pilotada: par máximo transmisible por el embrague, solicitudes de apertura de embrague y de reserva de par, liberación kickdown, inhibición de cambio en parada, marcha objetivo.'
  de: 'Dynamikdaten 2 des automatisierten Schaltgetriebes: maximal übertragbares Kupplungsmoment, Kupplungsöffnungs- und Drehmomentreserveanforderungen, Kickdown-Freigabe, Stopp-Schaltsperre, Zielübersetzung.'
  it: 'Dati dinamici 2 del cambio robotizzato: coppia massima trasmissibile dalla frizione, richieste di apertura frizione e riserva di coppia, rilascio kickdown, inibizione cambio all''arresto, marcia obiettivo.'
  pl: 'Dane dynamiczne 2 skrzyni zautomatyzowanej: maksymalny moment przenoszony przez sprzęgło, żądania rozłączenia sprzęgła i rezerwy momentu, zwolnienie kickdown, blokada zmiany biegu przy zatrzymaniu, bieg docelowy.'
  ru: 'Динамические данные 2 роботизированной коробки: максимальный передаваемый момент сцепления, запросы отключения сцепления и резерва момента, отпускание кикдауна, блокировка переключения при остановке, целевая передача.'
  zh: '自动手动变速箱动态数据2:离合器最大可传递扭矩、离合器分离和扭矩储备请求、强制降挡释放、停车换挡抑制、目标挡位。'
  hu: 'Az automatizált manuális váltó dinamikus adatai 2: a kuplung által átvihető maximális nyomaték, kuplungnyitási és nyomatéktartalék kérések, kickdown felengedés, megállásnál váltás tiltása, célfokozat.'
  pt: 'Dados dinâmicos 2 da caixa de velocidades pilotada: binário máximo transmissível pela embraiagem, pedidos de abertura da embraiagem e de reserva de binário, libertação de kickdown, inibição de mudança em paragem, relação-alvo.'
periodicity: ['10ms']
senders: ['BVA']
receivers: ['ABS', 'CMM']

signals:
  MAX_CLUTCH_TORQUE:
    bits: '1.7-1.0'
    comment:
      en: 'Maximum torque transmissible by the clutch'
      fr: 'Couple maximum transmissible par l''embrayage'
      es: 'Par máximo transmisible por el embrague'
      de: 'Maximal übertragbares Drehmoment der Kupplung'
      it: 'Coppia massima trasmissibile dalla frizione'
      pl: 'Maksymalny moment obrotowy przenoszony przez sprzęgło'
      ru: 'Максимальный момент, передаваемый сцеплением'
      zh: '离合器可传递的最大扭矩'
      hu: 'A kuplung által átvihető maximális nyomaték'
      pt: 'Binário máximo transmissível pela embraiagem'
    type: 'uint'
    factor: 2
    offset: -100
    min: -100
    max: 408
    units: 'Nm'
    invalid: 0xFF
    default: 0x32

  KICKDOWN_PICKUP_STATUS:
    bits: '2.7'
    comment:
      en: 'Kickdown (KD) pick-up in progress (torque setpoint synchronisation)'
      fr: 'Décollage kickdown (KD) en cours (synchronisation des consignes de couple)'
      es: 'Arranque kickdown (KD) en curso (sincronización de las consignas de par)'
      de: 'Kickdown-(KD-)Übernahme läuft (Synchronisation der Drehmoment-Sollwerte)'
      it: 'Ripresa kickdown (KD) in corso (sincronizzazione delle consegne di coppia)'
      pl: 'Trwa przejęcie kickdown (KD) (synchronizacja nastaw momentu)'
      ru: 'Выполняется захват кикдауна (KD) (синхронизация уставок момента)'
      zh: '急加速 (KD) 接管进行中(扭矩设定值同步)'
      hu: 'Kickdown (KD) átvétel folyamatban (nyomatékalapjel-szinkronizálás)'
      pt: 'Arranque kickdown (KD) em curso (sincronização das consignas de binário)'
    type: 'bool'
    values:
      0x00:
        en: 'no KD pick up'
        fr: 'Pas de décollage KD en cours'
        es: 'Sin arranque de kickdown en curso'
        de: 'Kein Kickdown-Anlauf im Gange'
        it: 'Nessuna partenza kickdown in corso'
        pl: 'Brak trwającego rozruchu kickdown'
        ru: 'Нет выполняемого разгона кикдаун'
        zh: '无正在进行的降挡加速'
        hu: 'Nincs folyamatban lévő kickdown-indítás'
        pt: 'Sem arranque de kickdown em curso'
      0x01:
