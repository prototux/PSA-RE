        fr: 'Décollage KD en cours'
        es: 'Recuperación KD en curso'
        de: 'KD-Aufnahme läuft'
        it: 'Ripresa KD in corso'
        pl: 'Trwa dociąganie KD'
        ru: 'Идёт выборка KD'
        zh: 'KD拾取进行中'
        hu: 'KD felvétel folyamatban'
        pt: 'Retoma KD em curso'

