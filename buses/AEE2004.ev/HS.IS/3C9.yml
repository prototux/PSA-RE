      en: 'Engine off (emergency stop) request from the gearbox'
      fr: 'Demande de coupure d''urgence du moteur thermique par la boîte de vitesses'
      es: 'Solicitud de parada de emergencia del motor térmico desde la caja de cambios'
      de: 'Notabschaltanforderung des Verbrennungsmotors durch das Getriebe'
