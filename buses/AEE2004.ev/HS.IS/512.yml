      zh: '电动压缩机/空气PTC加热器的功率限制请求'
      hu: 'Az elektromos kompresszor / légfűtő PTC-elem teljesítménykorlátozási kérése'
      pt: 'Pedido de limitação de potência do compressor elétrico / CTP de ar'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0x7F
    default: 0x00

  AIR_PTC_POWER_ACTIVATION_COMMAND:
    bits: '3.0'
    comment:
      en: 'Power activation command for the air PTC heater'
      fr: 'Commande d''activation de puissance de la CTP air'
      es: 'Comando de activación de potencia del calefactor PTC de aire'
