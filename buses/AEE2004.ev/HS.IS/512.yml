        fr: 'Demande de pilotage'
        es: 'Solicitud de control'
        de: 'Steueranforderung'
        it: 'Richiesta di controllo'
        pl: 'Żądanie sterowania'
        ru: 'Запрос управления'
        zh: '控制请求'
        hu: 'Vezérlési kérés'
        pt: 'Pedido de controlo'

