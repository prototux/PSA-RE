id: 0x468
name: 'ENGINE_DYNAMIC_DATA_3'
alt_names: ['GENERIC_ENGINE_DATA_3']
type: 'can'
length: 7
comment:
  en: 'Engine dynamic data 3, sent on turbo-transition or rear-preparation change: alternator regulation voltage setpoint, secondary brake-contact incoherence, engine and production faults, ignition state, damper and starter state, generator output level, starter protection.'
  fr: 'Données dynamiques moteur 3, émises sur changement de transition turbo ou de préparation arrière : consigne de tension de régulation alternateur, incohérence contact frein secondaire, défauts moteur et production, état contact véhicule, état amortisseur et démarreur, niveau de production générateur, protection démarreur.'
  es: 'Datos dinámicos del motor 3, enviados en cambio de transición turbo o de preparación trasera: consigna de tensión de regulación del alternador, incoherencia de contacto de freno secundario, fallos de motor y producción, estado de contacto del vehículo, estado del amortiguador y del motor de arranque, nivel de producción del generador, protección del motor de arranque.'
  de: 'Motor-Dynamikdaten 3, bei Turbo-Übergang oder Änderung der Heckvorbereitung gesendet: Sollwert der Generatorregelspannung, Inkohärenz des sekundären Bremskontakts, Motor- und Produktionsfehler, Zündkontaktstatus, Dämpfer- und Anlasserstatus, Generatorausgangsniveau, Anlasserschutz.'
  it: 'Dati dinamici motore 3, inviati al cambio di transizione turbo o di preparazione posteriore: setpoint di tensione di regolazione alternatore, incoerenza contatto freno secondario, guasti motore e produzione, stato contatto veicolo, stato ammortizzatore e motorino di avviamento, livello di produzione generatore, protezione motorino di avviamento.'
  pl: 'Dane dynamiczne silnika 3, wysyłane przy zmianie przejścia turbo lub przygotowania tylnego: nastawa napięcia regulacji alternatora, niespójność stykowa hamulca wtórnego, usterki silnika i produkcji, stan styku zapłonu, stan amortyzatora i rozrusznika, poziom produkcji generatora, ochrona rozrusznika.'
  ru: 'Динамические данные двигателя 3, отправляемые при изменении перехода турбонаддува или задней подготовки: уставка напряжения регулирования генератора, несогласованность вторичного контакта тормоза, неисправности двигателя и производства, состояние контакта зажигания, состояние демпфера и стартера, уровень выработки генератора, защита стартера.'
  zh: '发动机动态数据3,在涡轮过渡或后部准备状态变化时发送:发电机调节电压设定值、辅助制动触点不一致、发动机和生产故障、点火触点状态、减震器和起动机状态、发电机产出水平、起动机保护。'
  hu: 'Motor dinamikus adatok 3, turbóátmenet vagy hátsó előkészítés változásakor küldve: generátor szabályozási feszültség alapjel, másodlagos fékkontaktus inkoherencia, motor- és gyártási hibák, gyújtáskontaktus állapota, lengéscsillapító és indítómotor állapota, generátor kimeneti szintje, indítómotor védelem.'
  pt: 'Dados dinâmicos 3 do motor, enviados na transição do turbo ou na mudança de preparação traseira: ponto de ajuste de tensão de regulação do alternador, incoerência do contacto secundário do travão, avarias de motor e de produção, estado da ignição, estado do amortecedor e do motor de arranque, nível de saída do gerador, proteção do motor de arranque.'
observations:
  en: 'On state change of: TURBO_TRANSITION_IN_PROGRESS, STOP_START_PREPARATION_STATUS, ELECTRICAL_SUPPLY_STATUS_12V'
  fr: 'Sur changement d''état de : TURBO_TRANSITION_IN_PROGRESS, STOP_START_PREPARATION_STATUS, ELECTRICAL_SUPPLY_STATUS_12V'
  es: 'Al cambiar el estado de: TURBO_TRANSITION_IN_PROGRESS, STOP_START_PREPARATION_STATUS, ELECTRICAL_SUPPLY_STATUS_12V'
  de: 'Bei Statusänderung von: TURBO_TRANSITION_IN_PROGRESS, STOP_START_PREPARATION_STATUS, ELECTRICAL_SUPPLY_STATUS_12V'
  it: 'Al cambiamento di stato di: TURBO_TRANSITION_IN_PROGRESS, STOP_START_PREPARATION_STATUS, ELECTRICAL_SUPPLY_STATUS_12V'
  pl: 'Wysyłane przy zmianie stanu: TURBO_TRANSITION_IN_PROGRESS, STOP_START_PREPARATION_STATUS, ELECTRICAL_SUPPLY_STATUS_12V'
  ru: 'При изменении состояния: TURBO_TRANSITION_IN_PROGRESS, STOP_START_PREPARATION_STATUS, ELECTRICAL_SUPPLY_STATUS_12V'
  zh: '当TRANSIT_TURBO_CRS, STOP_START_PREPARATION_STATUS, ETAT_FEE状态变化时'
  hu: 'A(z) TURBO_TRANSITION_IN_PROGRESS, STOP_START_PREPARATION_STATUS, ELECTRICAL_SUPPLY_STATUS_12V állapotváltozásakor'
  pt: 'Na mudança de estado de: TURBO_TRANSITION_IN_PROGRESS, STOP_START_PREPARATION_STATUS, ELECTRICAL_SUPPLY_STATUS_12V'
periodicity: ['40ms', 'trigger']
senders: ['CMM', 'PIU']
