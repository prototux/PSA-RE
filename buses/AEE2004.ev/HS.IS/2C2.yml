id: 0x2C2
name: 'STARTER_GENERATOR_SUPERVISION_DATA'
type: 'can'
length: 8
comment:
  en: 'Starter-generator supervision data: motor stop/cutoff/start states, estimated rear-axle torque, alternator torque draw and communication/electrical/thermal faults.'
  fr: 'Données de supervision du démarreur-générateur : états d''arrêt/coupure/démarrage moteur, couple arrière estimé, prélèvement de couple alternateur et défauts de communication/électrique/thermique.'
  es: 'Datos de supervisión del motor de arranque-generador: estados de parada/corte/arranque del motor, par trasero estimado, toma de par del alternador y fallos de comunicación/eléctrico/térmico.'
  de: 'Überwachungsdaten des Starter-Generators: Motorstopp-/-abschalt-/-startzustände, geschätztes Hinterachsdrehmoment, Lichtmaschinen-Drehmomententnahme sowie Kommunikations-/elektrische/thermische Fehler.'
  it: 'Dati di supervisione del motorino di avviamento-generatore: stati di arresto/interruzione/avviamento motore, coppia posteriore stimata, prelievo di coppia dell''alternatore e guasti di comunicazione/elettrici/termici.'
  pl: 'Dane nadzoru rozrusznika-generatora: stany zatrzymania/wyłączenia/uruchomienia silnika, szacowany moment tylnej osi, pobór momentu alternatora oraz usterki komunikacji/elektryczne/termiczne.'
  ru: 'Данные контроля стартер-генератора: состояния остановки/отключения/запуска двигателя, расчётный момент задней оси, отбор момента генератором и коммуникационные/электрические/тепловые неисправности.'
  zh: '起动-发电一体机监控数据:发动机停止/切断/启动状态、估算后轴扭矩、发电机扭矩消耗以及通信/电气/热故障。'
  hu: 'Az indítómotor-generátor felügyeleti adatai: motorleállási/-lekapcsolási/-indítási állapotok, becsült hátsó nyomaték, generátor nyomatékfelvétele, valamint kommunikációs/elektromos/termikus hibák.'
  pt: 'Dados de supervisão do motor de arranque-gerador: estados de paragem/corte/arranque do motor, estimativa de binário do eixo traseiro, consumo de binário do alternador e avarias de comunicação/elétricas/térmicas.'
periodicity: ['10ms']
senders: ['AR2S', 'SCDT']
receivers: ['CMM']

signals:
  ALTERNATOR_TORQUE_DRAW:
    bits: '1.7-1.3'
    comment:
      en: 'Torque drawn by the alternator'
      fr: 'Couple prélevé par l''alternateur'
      es: 'Par absorbido por el alternador'
      de: 'Vom Generator aufgenommenes Drehmoment'
      it: 'Coppia assorbita dall''alternatore'
      pl: 'Moment obrotowy pobierany przez alternator'
      ru: 'Момент, отбираемый генератором'
      zh: '发电机消耗的扭矩'
      hu: 'A generátor által felvett nyomaték'
      pt: 'Binário absorvido pelo alternador'
    type: 'uint'
    factor: 1
    min: 0
    max: 30
    units: 'Nm'
    invalid: 0x1F
    default: 0x00

