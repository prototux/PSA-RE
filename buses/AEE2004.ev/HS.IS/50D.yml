id: 0x50D
name: 'BRAKE_ABR_STATUS'
alt_names: ['TRACTION_CONTROL_DATA']
type: 'can'
length: 7
comment:
  en: 'ABR (hill-descent assist) data from the ABS unit: brake fluid alert, wheel pulse counters and faults, AAFD/SFU function status, reference regulation and warning-lamp requests.'
  fr: 'Données ABR (aide au démarrage en côte/frein moteur) du calculateur ABS : alerte liquide de frein, compteurs et défauts d''impulsions roue, état des fonctions AAFD/SFU, régulation de référence et demandes de voyant.'
  es: 'Datos ABR (asistencia en pendiente) de la unidad ABS: alerta de líquido de frenos, contadores y fallos de impulsos de rueda, estado de las funciones AAFD/SFU, regulación de referencia y solicitudes de testigo.'
  de: 'ABR-Daten (Bergabfahrhilfe) vom ABS-Steuergerät: Bremsflüssigkeitswarnung, Radimpulszähler und -fehler, Status der AAFD-/SFU-Funktionen, Referenzregelung und Kontrollleuchtenanforderungen.'
  it: 'Dati ABR (assistenza in discesa) dell''unità ABS: allarme liquido freni, contatori e guasti impulsi ruota, stato delle funzioni AAFD/SFU, regolazione di riferimento e richieste spia.'
  pl: 'Dane ABR (asysta zjazdu ze wzniesienia) ze sterownika ABS: alarm płynu hamulcowego, liczniki i usterki impulsów koła, stan funkcji AAFD/SFU, regulacja odniesienia i żądania kontrolki.'
  ru: 'Данные ABR (система помощи при спуске) от блока ABS: сигнал тормозной жидкости, счётчики импульсов колёс и неисправности, статус функций AAFD/SFU, эталонное регулирование и запросы индикатора.'
  zh: '来自ABS单元的ABR(坡道辅助)数据:刹车液警报、车轮脉冲计数器和故障、AAFD/SFU功能状态、基准调节和警示灯请求。'
  hu: 'ABR (lejtőn induláshoz segítő funkció) adatok az ABS egységtől: fékfolyadék riasztás, kerékimpulzus-számlálók és hibák, AAFD/SFU funkció állapota, referencia-szabályozás és jelzőlámpa-kérések.'
  pt: 'Dados ABR (assistência à descida de encostas) da unidade ABS: alerta de líquido de travões, contadores e avarias de impulsos das rodas, estado das funções AAFD/SFU, regulação de referência e pedidos de luz avisadora.'
periodicity: ['100ms']
senders: ['ABS']
receivers:
  - 'ARTIV'
  - 'PIU'
  - 'BSI'
  - 'CMM'
  - 'FSE'
  - 'CSS'
  - 'BVA'
  - 'HCU1'
  - 'DAE'
  - 'ACC'
  - 'AMVAR'
  - 'AR2S'
  - 'CAAR'
  - 'ACCEL_SENSOR'
  - 'CAV'
  - 'CGPL'
  - 'CMEL'
  - 'DSG'
  - 'DIAG_TOOL'
  - 'BCP'
  - 'SBW'
  - 'SCDT'
  - 'BHI'
  - 'TBMU'

