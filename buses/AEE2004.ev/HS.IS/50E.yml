id: 0x50E
name: 'VEHICLE_SPEED_LIMITER_REQUEST'
alt_names: ['GATEWAY_DATA_2']
type: 'can'
length: 8
comment:
  en: 'Mixed periodic/event frame: vehicle speed setpoint change, cruise-control (cruise control/ACC) and speed-limiter (speed limiter) activation requests, cabin engine-stop authorisation.'
  fr: 'Trame mixte périodique/événementielle : changement de consigne de vitesse véhicule, demandes d''activation du régulateur (cruise control/ACC) et du limiteur de vitesse (speed limiter), autorisation d''arrêt moteur habitacle.'
  es: 'Trama mixta periódica/por evento: cambio de consigna de velocidad del vehículo, solicitudes de activación del regulador (cruise control/ACC) y del limitador de velocidad (speed limiter), autorización de parada del motor en habitáculo.'
  de: 'Gemischtes periodisches/ereignisgesteuertes Telegramm: Änderung des Fahrzeuggeschwindigkeits-Sollwerts, Aktivierungsanforderungen für Tempomat (cruise control/ACC) und Geschwindigkeitsbegrenzer (speed limiter), Freigabe des Motorstopps im Innenraum.'
  it: 'Trama mista periodica/su evento: cambio del setpoint di velocità veicolo, richieste di attivazione del regolatore (cruise control/ACC) e del limitatore di velocità (speed limiter), autorizzazione arresto motore abitacolo.'
  pl: 'Ramka mieszana okresowa/zdarzeniowa: zmiana nastawy prędkości pojazdu, żądania aktywacji tempomatu (cruise control/ACC) i ogranicznika prędkości (speed limiter), autoryzacja zatrzymania silnika w kabinie.'
  ru: 'Смешанный периодический/событийный кадр: изменение уставки скорости автомобиля, запросы активации круиз-контроля (cruise control/ACC) и ограничителя скорости (speed limiter), разрешение остановки двигателя из салона.'
  zh: '混合周期/事件帧:车速设定值变更、巡航控制(cruise control/ACC)和限速器(speed limiter)激活请求、座舱发动机停止授权。'
  hu: 'Vegyes periodikus/eseményalapú keret: jármű sebesség-alapjel változása, tempomat (cruise control/ACC) és sebességhatároló (speed limiter) aktiválási kérések, utastéri motorleállás engedélyezése.'
  pt: 'Trama mista periódica/evento: mudança do ponto de ajuste de velocidade do veículo, pedidos de ativação do regulador de velocidade (cruise control/ACC) e do limitador de velocidade (speed limiter), autorização de paragem do motor pelo habitáculo.'
observations:
  en: 'On state change of: VEHICLE_SPEED_SETPOINT_OR_LIMIT, LONGITUDINAL_REGULATION_TYPE'
  fr: 'Sur changement d''état de : VEHICLE_SPEED_SETPOINT_OR_LIMIT, LONGITUDINAL_REGULATION_TYPE'
  es: 'Al cambiar el estado de: VEHICLE_SPEED_SETPOINT_OR_LIMIT, LONGITUDINAL_REGULATION_TYPE'
  de: 'Bei Statusänderung von: VEHICLE_SPEED_SETPOINT_OR_LIMIT, LONGITUDINAL_REGULATION_TYPE'
  it: 'Al cambiamento di stato di: VEHICLE_SPEED_SETPOINT_OR_LIMIT, LONGITUDINAL_REGULATION_TYPE'
  pl: 'Wysyłane przy zmianie stanu: VEHICLE_SPEED_SETPOINT_OR_LIMIT, LONGITUDINAL_REGULATION_TYPE'
  ru: 'При изменении состояния: VEHICLE_SPEED_SETPOINT_OR_LIMIT, LONGITUDINAL_REGULATION_TYPE'
  zh: '当CONS_LIM_VITESSE_VEH, TYPE_REGUL_LONGI状态变化时'
  hu: 'A(z) VEHICLE_SPEED_SETPOINT_OR_LIMIT, LONGITUDINAL_REGULATION_TYPE állapotváltozásakor'
  pt: 'Na mudança de estado de: VEHICLE_SPEED_SETPOINT_OR_LIMIT, LONGITUDINAL_REGULATION_TYPE'
periodicity: ['100ms', 'trigger']
senders: ['BSI']
receivers:
  - 'PIU'
  - 'ABS'
  - 'SCDT'
  - 'CMM'
  - 'BVA'
  - 'AR2S'
  - 'HCU1'
