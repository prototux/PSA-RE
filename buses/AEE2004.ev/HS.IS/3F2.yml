      pl: 'Zakaz wejścia w tryb zeroemisyjny (ZEV)'
      ru: 'Запрет входа в режим нулевых выбросов (ZEV)'
      zh: '禁止进入零排放(ZEV)模式'
      hu: 'A nulla kibocsátású (ZEV) mód belépésének tiltása'
      pt: 'Proibição de entrada no modo zero emissões (ZEV)'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'ZEV authorized'
        fr: 'ZEV autorisé'
        es: 'ZEV autorizado'
        de: 'ZEV zulässig'
        it: 'ZEV autorizzato'
        pl: 'ZEV dozwolone'
        ru: 'ZEV разрешён'
        zh: '允许ZEV'
        hu: 'ZEV engedélyezve'
        pt: 'ZEV autorizado'
      0x01:
        en: 'ZEV forbidden'
        fr: 'ZEV interdit'
        es: 'ZEV prohibido'
        de: 'ZEV verboten'
        it: 'ZEV vietato'
        pl: 'ZEV zabronione'
        ru: 'ZEV запрещён'
        zh: '禁止ZEV'
        hu: 'ZEV tiltva'
        pt: 'ZEV proibido'

