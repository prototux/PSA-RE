id: 0x0D2
name: 'TYRE_PRESSURE_TRANSMITTER_STATUS'
type: 'can'
length: 5
comment:
  en: 'Unlocking confirmation frame sent by the BSI to the hybrid control unit (HCU1).'
  fr: 'Trame de confirmation de déverrouillage envoyée par la BSI au calculateur hybride (HCU1).'
  es: 'Trama de confirmación de desbloqueo enviada por la BSI a la unidad de control híbrida (HCU1).'
  de: 'Entriegelungsbestätigungsrahmen, von der BSI an das Hybridsteuergerät (HCU1) gesendet.'
  it: 'Trama di conferma di sblocco inviata dalla BSI alla centralina ibrida (HCU1).'
  pl: 'Ramka potwierdzenia odblokowania wysyłana przez BSI do sterownika hybrydowego (HCU1).'
  ru: 'Кадр подтверждения разблокировки, отправляемый BSI в гибридный блок управления (HCU1).'
  zh: '由BSI发送给混合动力控制单元(HCU1)的解锁确认帧。'
  hu: 'A BSI feloldási megerősítő kerete, a hibrid vezérlőegységnek (HCU1) küldve.'
  pt: 'Trama de confirmação de destrancagem enviada pela BSI à unidade de controlo híbrida (HCU1).'
observations:
  en: 'Event defined by the ADC MUX protocol'
  fr: 'Événement défini par le protocole ADC MUX'
  es: 'Evento definido por el protocolo ADC MUX'
  de: 'Durch das ADC-MUX-Protokoll definiertes Ereignis'
  it: 'Evento definito dal protocollo ADC MUX'
  pl: 'Zdarzenie zdefiniowane przez protokół ADC MUX'
  ru: 'Событие определяется протоколом ADC MUX'
  zh: '由ADC MUX协议定义的事件'
  hu: 'Az ADC MUX protokoll által meghatározott esemény'
  pt: 'Evento definido pelo protocolo ADC MUX'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['HCU1']

signals:
  BSI_UNLOCK_KEY_AUTHORIZATION:
    bits: '1.7-1.0'
    comment:
      en: 'Unlocking authorization (BSI key emission)'
      fr: 'Autorisation de déverrouillage (émission de la clé BSI)'
      es: 'Autorización de desbloqueo (emisión de la llave BSI)'
      de: 'Entriegelungsfreigabe (Aussenden des BSI-Schlüssels)'
      it: 'Autorizzazione allo sblocco (emissione della chiave BSI)'
      pl: 'Autoryzacja odblokowania (wysłanie klucza BSI)'
      ru: 'Разрешение на разблокировку (передача ключа BSI)'
      zh: '解锁授权(BSI密钥发送)'
      hu: 'Kioldási engedély (BSI kulcs kibocsátása)'
      pt: 'Autorização de desbloqueio (emissão da chave BSI)'
