id: 0x329
name: 'GEARBOX_STOP_START_DATA'
type: 'can'
length: 4
comment:
  en: 'Stop & start data from the gearbox: engine-stop/restart authorisations and requests, predicted resistive torque and lever P/N position.'
  fr: 'Données stop & start de la boîte de vitesses : autorisations et demandes d''arrêt/redémarrage moteur, couple résistant prédit et position du levier P/N.'
  es: 'Datos stop & start de la caja de cambios: autorizaciones y solicitudes de parada/reinicio del motor, par resistente previsto y posición de la palanca P/N.'
  de: 'Stopp-Start-Daten des Getriebes: Freigaben und Anforderungen zum Motorstopp/-neustart, vorhergesagtes Widerstandsdrehmoment und Hebelposition P/N.'
  it: 'Dati stop & start del cambio: autorizzazioni e richieste di arresto/riavvio motore, coppia resistente prevista e posizione della leva P/N.'
  pl: 'Dane funkcji stop & start ze skrzyni biegów: autoryzacje i żądania zatrzymania/ponownego uruchomienia silnika, przewidywany moment oporowy oraz pozycja dźwigni P/N.'
  ru: 'Данные функции старт-стоп от коробки передач: разрешения и запросы на остановку/перезапуск двигателя, прогнозируемый момент сопротивления и положение рычага P/N.'
  zh: '变速箱的启停(Stop&Start)数据:发动机停止/重启的授权与请求、预测阻力扭矩及P/N挡位。'
  hu: 'A váltó start-stop adatai: a motorleállítás/-újraindítás engedélyei és kérései, a becsült ellenállási nyomaték, valamint a kar P/N helyzete.'
  pt: 'Dados de stop & start da caixa de velocidades: autorizações e pedidos de paragem/reinício do motor, binário resistivo previsto e posição P/N da alavanca.'
periodicity: ['20ms']
senders: ['BVA']
receivers: ['CMM']

signals:
  CHECKSUM:
    bits: '1.7-1.4'
    comment:
      en: 'Gearbox (BV) dynamic frame checksum'
      fr: 'Somme de contrôle dynamique de la trame boîte de vitesses (BV)'
      es: 'Suma de comprobación dinámica de la trama de la caja de cambios (BV)'
      de: 'Dynamische Prüfsumme des Getriebe-(BV-)Frames'
      it: 'Checksum dinamico del frame del cambio (BV)'
      pl: 'Dynamiczna suma kontrolna ramki skrzyni biegów (BV)'
      ru: 'Динамическая контрольная сумма кадра коробки передач (BV)'
      zh: '变速箱(BV)动态帧校验和'
      hu: 'A sebességváltó (BV) dinamikus keretének ellenőrző összege'
      pt: 'Soma de verificação dinâmica da trama da caixa de velocidades (BV)'
    type: 'uint'

  PROCESS_COUNTER:
    bits: '1.3-1.0'
    comment:
      en: 'Free-running counter (0 to 15), incremented on each new calculation'
      fr: 'Compteur cyclique (0 à 15), incrémenté à chaque nouveau calcul'
      es: 'Contador cíclico (0 a 15), incrementado en cada nuevo cálculo'
      de: 'Umlaufender Zähler (0 bis 15), bei jeder neuen Berechnung erhöht'
      it: 'Contatore ciclico (0-15), incrementato a ogni nuovo calcolo'
      pl: 'Licznik cykliczny (0-15), zwiększany przy każdym nowym obliczeniu'
      ru: 'Циклический счётчик (0-15), увеличивается при каждом новом расчёте'
      zh: '循环计数器(0至15),每次新计算时递增'
      hu: 'Körforgó számláló (0–15), minden új számításkor nő'
      pt: 'Contador cíclico (0 a 15), incrementado a cada novo cálculo'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00

  GEARBOX_STOP_AUTHORIZATION:
    bits: '2.7'
    comment:
      en: 'Stop&start engine stop authorization from the gearbox'
      fr: 'Autorisation d''arrêt moteur Stop&Start donnée par la boîte de vitesses'
      es: 'Autorización de parada del motor Stop&Start dada por la caja de cambios'
