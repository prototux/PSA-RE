      pl: 'Autoryzacja zatrzymania silnika Stop&Start ze skrzyni biegów'
      ru: 'Разрешение остановки двигателя Stop&Start от коробки передач'
      zh: '变速箱给出的启停(Stop&Start)发动机停机授权'
      hu: 'A Stop&Start motorleállítás engedélye a sebességváltótól'
      pt: 'Autorização de paragem do motor Stop&Start dada pela caixa de velocidades'
    type: 'bool'
    default: 0x00
