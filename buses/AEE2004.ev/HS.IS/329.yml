    comment:
      en: 'Gearbox fault affecting the Stop & Start function'
      fr: 'Défaut de la boîte de vitesses identifié par la fonction Stop & Start'
      es: 'Fallo de la caja de cambios identificado por la función Stop & Start'
      de: 'Vom Stop-&-Start-System erkannter Getriebefehler'
      it: 'Guasto del cambio rilevato dalla funzione Stop & Start'
      pl: 'Usterka skrzyni biegów wykryta przez funkcję Stop & Start'
