      de: 'Marketing-Streckenschwelle (km)'
      it: 'Soglia di distanza marketing (km)'
      pl: 'Próg dystansu marketingowego (km)'
      ru: 'Пороговый маркетинговый пробег (км)'
      zh: '营销里程阈值(km)'
      hu: 'Marketing táv-küszöb (km)'
      pt: 'Limiar de distância de marketing (km)'
    type: 'uint'
    factor: 1000
    min: 0
    max: 30000
    units: 'km'
