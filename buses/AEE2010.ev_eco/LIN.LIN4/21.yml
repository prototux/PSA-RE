id: 0x21
name: 'WAKEUP_BAAS_L'
type: 'lin'
length: 2
comment:
  en: 'Fault memory inhibit command sent by the BSI over LIN to the outside air quality sensor.'
  fr: 'Commande d''inhibition de mémorisation de défaut envoyée par la BSI sur le bus LIN au capteur de qualité d''air extérieur.'
  es: 'Orden de inhibición de memorización de fallo enviada por la BSI por el bus LIN al sensor de calidad del aire exterior.'
  de: 'Fehlerspeicher-Sperrbefehl, von der BSI über den LIN-Bus an den Außenluftqualitätssensor gesendet.'
  it: 'Comando di inibizione della memorizzazione dei guasti inviato dalla BSI sul bus LIN al sensore di qualità dell''aria esterna.'
  pl: 'Polecenie blokady zapisu usterki wysyłane przez BSI po magistrali LIN do czujnika jakości powietrza zewnętrznego.'
  ru: 'Команда блокировки запоминания неисправности, отправляемая BSI по шине LIN на датчик качества наружного воздуха.'
  zh: '由BSI通过LIN总线发送给车外空气质量传感器的故障存储抑制命令。'
  hu: 'A BSI hibatár-tiltási parancsa a LIN buszon a kültéri levegőminőség-érzékelőnek.'
  pt: 'Comando de inibição da memória de avarias enviado pela BSI via LIN ao sensor de qualidade do ar exterior.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['OAQS']
lin:
  master: 'BSI'

signals:
  LOG_FAULTS:
    bits: '1.0'
    comment:
      en: 'Fault storage locking (fault memory logging disabled)'
      fr: 'Verrouillage de la mémorisation des défauts'
      es: 'Bloqueo del almacenamiento de fallos'
      de: 'Sperrung der Fehlerspeicherung'
      it: 'Blocco della memorizzazione dei guasti'
      pl: 'Blokada zapisu usterek'
      ru: 'Блокировка записи неисправностей в память'
      zh: '故障存储锁定'
      hu: 'A hibatárolás letiltása'
      pt: 'Bloqueio do armazenamento de avarias (registo na memória de avarias desativado)'
    type: 'bool'
    values:
      0x00:
        en: 'Deactivation'
        fr: 'Désactivation'
        es: 'Desactivación'
        de: 'Deaktivierung'
        it: 'Disattivazione'
        pl: 'Dezaktywacja'
        ru: 'Деактивация'
        zh: '停用'
        hu: 'Kikapcsolás'
        pt: 'Desativação'
      0x01:
        en: 'Activation'
        fr: 'Activation'
        es: 'Activación'
        de: 'Aktivierung'
        it: 'Attivazione'
        pl: 'Aktywacja'
        ru: 'Активация'
        zh: '激活'
        hu: 'Aktiválás'
        pt: 'Ativação'
