id: 0x10
name: 'BMF_LAMPS_STATUS'
type: 'lin'
length: 8
comment:
  en: 'Outside air quality sensor status: air quality index, CO/NH3/NO2 levels and software version'
  fr: 'État du capteur de qualité de l''air extérieur : indice de qualité de l''air, niveaux de CO/NH3/NO2 et version logicielle'
  es: 'Estado del sensor de calidad del aire exterior: índice de calidad del aire, niveles de CO/NH3/NO2 y versión de software'
  de: 'Status des Außenluftqualitätssensors: Luftqualitätsindex, CO-/NH3-/NO2-Werte und Softwareversion'
  it: 'Stato del sensore di qualità dell''aria esterna: indice di qualità dell''aria, livelli di CO/NH3/NO2 e versione software'
  pl: 'Stan czujnika jakości powietrza zewnętrznego: wskaźnik jakości powietrza, poziomy CO/NH3/NO2 i wersja oprogramowania'
  ru: 'Состояние датчика качества наружного воздуха: индекс качества воздуха, уровни CO/NH3/NO2 и версия ПО'
  zh: '车外空气质量传感器状态:空气质量指数、CO/NH3/NO2浓度及软件版本'
  hu: 'A külső levegőminőség-érzékelő állapota: levegőminőségi index, CO/NH3/NO2 szintek és szoftververzió'
  pt: 'Estado do sensor de qualidade do ar exterior: índice de qualidade do ar, níveis de CO/NH3/NO2 e versão de software.'
periodicity: ['trigger']
senders: ['OAQS']
receivers: ['BSI']
lin:
  master: 'BSI'

signals:
  OUTSIDE_AIR_TUNNEL_DETECTION:
    bits: '1.7'
    comment:
      en: 'Tunnel detection by the outside air quality sensor.'
      fr: 'Détection de tunnel par le capteur de qualité de l''air extérieur.'
      es: 'Detección de túnel por el sensor de calidad del aire exterior.'
      de: 'Tunnelerkennung durch den Außenluftqualitätssensor.'
      it: 'Rilevamento di galleria da parte del sensore di qualità dell''aria esterna.'
      pl: 'Wykrycie tunelu przez czujnik jakości powietrza zewnętrznego.'
      ru: 'Обнаружение тоннеля датчиком качества наружного воздуха.'
      zh: '车外空气质量传感器隧道检测。'
      hu: 'Alagút érzékelése a külső levegőminőség-érzékelő által.'
      pt: 'Deteção de túnel pelo sensor de qualidade do ar exterior.'
    type: 'bool'
    values:
      0x00:
        en: 'No tunnel detection'
        fr: 'Pas de détection de tunnel'
        es: 'Sin detección de túnel'
        de: 'Keine Tunnelerkennung'
        it: 'Nessun rilevamento galleria'
        pl: 'Brak wykrycia tunelu'
        ru: 'Обнаружение туннеля отсутствует'
        zh: '未检测到隧道'
        hu: 'Nincs alagút-érzékelés'
        pt: 'Sem deteção de túnel'
      0x01:
        en: 'tunnel detection'
        fr: 'tunnel detection'
        es: 'Detección de túnel'
        de: 'Tunnelerkennung'
        it: 'Rilevamento galleria'
        pl: 'Wykrywanie tunelu'
        ru: 'Обнаружение туннеля'
        zh: '隧道检测'
        hu: 'Alagút érzékelés'
        pt: 'deteção de túnel'

