id: 0x28
name: 'ADDITIVE_PUMP_COMMAND_2'
type: 'lin'
length: 2
comment:
  en: 'Authorisation command sent by the BSI over LIN to the cabin fine particles (PM) sensor.'
  fr: 'Commande d''autorisation envoyée par la BSI sur le bus LIN au capteur de particules fines habitacle.'
  es: 'Orden de autorización enviada por la BSI por el bus LIN al sensor de partículas finas del habitáculo.'
  de: 'Freigabebefehl, von der BSI über den LIN-Bus an den Feinstaubsensor des Innenraums gesendet.'
  it: 'Comando di autorizzazione inviato dalla BSI sul bus LIN al sensore di particolato fine dell''abitacolo.'
