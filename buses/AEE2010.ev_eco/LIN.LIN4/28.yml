  hu: 'A BSI engedélyezési parancsa a LIN buszon a beltéri finompor- (PM) érzékelőnek.'
  pt: 'Comando de autorização enviado pela BSI via LIN ao sensor de partículas finas (PM) do habitáculo.'
periodicity: ['trigger']
