id: 0x32D
name: 'BRAKE_ADAS_DATA'
type: 'can'
length: 8
comment:
  en: 'Outside pollutant concentration values: nitrogen dioxide, ozone, PM10, PM2.5 and sulphur dioxide.'
  fr: 'Valeurs de concentration des polluants extérieurs : dioxyde d''azote, ozone, PM10, PM2,5 et dioxyde de soufre.'
  es: 'Valores de concentración de contaminantes exteriores: dióxido de nitrógeno, ozono, PM10, PM2,5 y dióxido de azufre.'
  de: 'Außenschadstoffkonzentrationswerte: Stickstoffdioxid, Ozon, PM10, PM2,5 und Schwefeldioxid.'
  it: 'Valori di concentrazione degli inquinanti esterni: biossido di azoto, ozono, PM10, PM2,5 e biossido di zolfo.'
  pl: 'Wartości stężenia zanieczyszczeń zewnętrznych: dwutlenek azotu, ozon, PM10, PM2,5 i dwutlenek siarki.'
  ru: 'Значения концентрации внешних загрязнителей: диоксид азота, озон, PM10, PM2,5 и диоксид серы.'
  zh: '外部污染物浓度值：二氧化氮、臭氧、PM10、PM2.5和二氧化硫。'
  hu: 'A külső légszennyező anyagok koncentrációértékei: nitrogén-dioxid, ózon, PM10, PM2,5 és kén-dioxid.'
  pt: 'Valores de concentração de poluentes exteriores: dióxido de azoto, ozono, PM10, PM2,5 e dióxido de enxofre.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BTEL']

