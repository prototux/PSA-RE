id: 0x197
name: 'CLUSTER_DISPLAY_FIELD_STATUS'
type: 'can'
length: 3
comment:
  en: 'Instrument cluster display status: map database loading and selected display fields (ADAS, black panel, driver attention alert, dynamic, eco-coach, gauges, hybrid).'
  fr: 'État d''affichage du combiné : chargement de la base cartographique et champs d''affichage sélectionnés (ADAS, écran noir, alerte de vigilance, dynamique, éco-coach, jauges, hybride).'
  es: 'Estado de visualización del cuadro de instrumentos: carga de la base de datos cartográfica y campos de visualización seleccionados (ADAS, panel negro, alerta de atención del conductor, dinámico, eco-coach, indicadores, híbrido).'
  de: 'Anzeigestatus des Kombiinstruments: Laden der Kartendatenbank und ausgewählte Anzeigefelder (ADAS, Blackpanel, Aufmerksamkeitswarnung, dynamisch, Eco-Coach, Anzeigen, Hybrid).'
  it: 'Stato di visualizzazione del quadro strumenti: caricamento del database cartografico e campi di visualizzazione selezionati (ADAS, pannello nero, allarme attenzione conducente, dinamico, eco-coach, strumenti, ibrido).'
  pl: 'Stan wyświetlania zestawu wskaźników: wczytywanie bazy danych map i wybrane pola wyświetlania (ADAS, czarny panel, alarm uwagi kierowcy, dynamiczny, eco-coach, wskaźniki, hybrydowy).'
  ru: 'Статус дисплея приборной панели: загрузка картографической базы данных и выбранные поля отображения (ADAS, чёрная панель, предупреждение о внимании водителя, динамический, эко-коуч, приборы, гибрид).'
  zh: '仪表组显示状态:地图数据库加载及所选显示字段(ADAS、黑屏面板、驾驶员注意力警示、动态、节能教练、仪表、混合动力)。'
  hu: 'A műszeregység kijelzési állapota: térképadatbázis betöltése és a kiválasztott kijelzési mezők (ADAS, fekete panel, figyelmi riasztás, dinamikus, eco-coach, műszerek, hibrid).'
  pt: 'Estado de apresentação do quadrante de instrumentos: carregamento da base de dados do mapa e campos de apresentação selecionados (ADAS, ecrã preto, alerta de atenção do condutor, dinâmico, eco-coach, mostradores, híbrido).'
periodicity: ['1000ms', 'trigger']
senders: ['BTEL']
receivers: ['BSI']

