id: 0x363
name: 'HMI_GEARBOX_MIRROR_INFO'
type: 'can'
length: 5
comment:
  en: 'Human-machine interface data: parking brake function state, gear lever position and door mirror fold state.'
  fr: 'Données de l''interface homme-machine : état de la fonction frein de stationnement, position du levier de vitesses et état de rabattement des rétroviseurs.'
  es: 'Datos de la interfaz hombre-máquina: estado de la función del freno de estacionamiento, posición de la palanca de cambios y estado de plegado de los retrovisores.'
  de: 'Mensch-Maschine-Schnittstellendaten: Zustand der Feststellbremsfunktion, Wählhebelstellung und Einklappzustand der Außenspiegel.'
  it: 'Dati dell''interfaccia uomo-macchina: stato della funzione freno di stazionamento, posizione della leva del cambio e stato di ripiegamento degli specchietti.'
  pl: 'Dane interfejsu człowiek-maszyna: stan funkcji hamulca postojowego, pozycja dźwigni zmiany biegów i stan złożenia lusterek.'
  ru: 'Данные человеко-машинного интерфейса: состояние функции стояночного тормоза, положение рычага переключения передач и состояние складывания зеркал.'
  zh: '人机交互数据:驻车制动功能状态、换挡杆位置及后视镜折叠状态。'
  hu: 'Ember-gép interfész adatok: a rögzítőfék funkció állapota, a váltókar helyzete és a tükrök behajtási állapota.'
  pt: 'Dados da interface homem-máquina: estado da função de travão de estacionamento, posição da alavanca de velocidades e estado de dobragem dos espelhos retrovisores.'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['BTEL']

