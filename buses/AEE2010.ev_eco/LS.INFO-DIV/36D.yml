id: 0x36D
name: 'BRAKE_DYNAMIC_DATA'
type: 'can'
length: 8
comment:
  en: 'Outside and cabin air quality index levels and values, plus outside pollutant levels for carbon monoxide, nitrogen dioxide, ozone, PM10, PM2.5 and sulphur dioxide.'
  fr: 'Niveaux et valeurs d''indice de qualité de l''air extérieur et habitacle, ainsi que niveaux de polluants extérieurs pour le monoxyde de carbone, le dioxyde d''azote, l''ozone, les PM10, PM2,5 et le dioxyde de soufre.'
  es: 'Niveles y valores del índice de calidad del aire exterior y del habitáculo, así como niveles de contaminantes exteriores de monóxido de carbono, dióxido de nitrógeno, ozono, PM10, PM2,5 y dióxido de azufre.'
  de: 'Außen- und Innenraum-Luftqualitätsindex-Stufen und -Werte sowie Außenschadstoffstufen für Kohlenmonoxid, Stickstoffdioxid, Ozon, PM10, PM2,5 und Schwefeldioxid.'
  it: 'Livelli e valori dell''indice di qualità dell''aria esterna e dell''abitacolo, nonché livelli di inquinanti esterni per monossido di carbonio, biossido di azoto, ozono, PM10, PM2,5 e biossido di zolfo.'
  pl: 'Poziomy i wartości wskaźnika jakości powietrza zewnętrznego i w kabinie oraz poziomy zanieczyszczeń zewnętrznych dla tlenku węgla, dwutlenku azotu, ozonu, PM10, PM2,5 i dwutlenku siarki.'
  ru: 'Уровни и значения индекса качества наружного и салонного воздуха, а также уровни внешних загрязнителей: угарный газ, диоксид азота, озон, PM10, PM2,5 и диоксид серы.'
  zh: '车外及座舱空气质量指数等级与数值，以及车外一氧化碳、二氧化氮、臭氧、PM10、PM2.5和二氧化硫的污染等级。'
  hu: 'A kültéri és beltéri levegőminőségi index szintjei és értékei, valamint a kültéri szén-monoxid, nitrogén-dioxid, ózon, PM10, PM2,5 és kén-dioxid szennyezettségi szintjei.'
  pt: 'Níveis e valores do índice de qualidade do ar exterior e do habitáculo, além dos níveis de poluentes exteriores de monóxido de carbono, dióxido de azoto, ozono, PM10, PM2,5 e dióxido de enxofre.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BTEL']

signals:
  OUTSIDE_CO_VALUE:
    bits: '1.7-1.0'
    comment:
      en: 'Outside CO concentration (mg/m³)'
      fr: 'Concentration extérieure de CO (mg/m³)'
      es: 'Concentración exterior de CO (mg/m³)'
      de: 'CO-Konzentration außen (mg/m³)'
      it: 'Concentrazione esterna di CO (mg/m³)'
      pl: 'Zewnętrzne stężenie CO (mg/m³)'
      ru: 'Наружная концентрация CO (мг/м³)'
      zh: '室外 CO 浓度(mg/m³)'
      hu: 'Kültéri CO koncentráció (mg/m³)'
      pt: 'Concentração de CO no exterior (mg/m³)'
    type: 'uint'
    min: 0
    max: 152

  OUTSIDE_AIR_QUALITY_VALUE:
