id: 0x117
name: 'BCP_VERSION'
type: 'can'
length: 5
comment:
  en: 'Instrument panel warning lamp configuration sent by the telematics unit: ABS, ASR, power steering, parking aid, battery, fuel and other fault telltales.'
  fr: 'Configuration des témoins de tableau de bord envoyée par le boîtier télématique : ABS, ASR, direction assistée, aide au stationnement, batterie, carburant et autres témoins défaut.'
  es: 'Configuración de los testigos del cuadro de instrumentos enviada por la unidad telemática: ABS, ASR, dirección asistida, ayuda al aparcamiento, batería, combustible y otros testigos de fallo.'
  de: 'Konfiguration der Kontrollleuchten der Instrumententafel, von der Telematikeinheit gesendet: ABS, ASR, Servolenkung, Einparkhilfe, Batterie, Kraftstoff und weitere Fehlerkontrollleuchten.'
  it: 'Configurazione delle spie del cruscotto inviata dall''unità telematica: ABS, ASR, servosterzo, assistenza al parcheggio, batteria, carburante e altre spie di guasto.'
  pl: 'Konfiguracja kontrolek tablicy wskaźników wysyłana przez jednostkę telematyczną: ABS, ASR, wspomaganie kierownicy, wspomaganie parkowania, akumulator, paliwo i inne kontrolki usterek.'
  ru: 'Конфигурация контрольных ламп приборной панели, отправляемая телематическим блоком: ABS, ASR, усилитель руля, парковочный ассистент, батарея, топливо и другие лампы неисправностей.'
  zh: '由车载通信单元发送的仪表盘警示灯配置:ABS、ASR、助力转向、泊车辅助、电瓶、燃油及其他故障警示灯。'
  hu: 'A telematikai egység által küldött műszerfal-jelzőlámpa konfiguráció: ABS, ASR, szervokormány, parkolássegítő, akkumulátor, üzemanyag és egyéb hibajelzők.'
  pt: 'Configuração dos indicadores luminosos do quadrante enviada pela unidade telemática: ABS, ASR, direção assistida, ajuda ao estacionamento, bateria, combustível e outros indicadores de avaria.'
periodicity: ['1000ms']
senders: ['BTEL']
receivers: ['BSI']

