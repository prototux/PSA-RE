id: 0x3A9
name: 'TELEMATICS_CALL_BUTTON_STATUS_2'
type: 'can'
length: 2
comment:
  en: 'Telematics unit status: breakdown/emergency call buttons, mute and hold state.'
  fr: 'État du boîtier télématique : boutons appel panne/urgence, coupure son et maintien.'
  es: 'Estado de la unidad telemática: botones de llamada de avería/emergencia, silencio y retención.'
  de: 'Status der Telematikeinheit: Pannen-/Notruftasten, Stummschaltung und Halten.'
  it: 'Stato dell''unità telematica: pulsanti chiamata guasto/emergenza, silenziamento e mantenimento.'
  pl: 'Stan jednostki telematycznej: przyciski wezwania pomocy drogowej/awaryjnego, wyciszenie i podtrzymanie.'
  ru: 'Статус телематического блока: кнопки вызова помощи/экстренного вызова, отключение звука и удержание.'
  zh: '车载通信单元状态:故障/紧急呼叫按钮、静音和保持状态。'
  hu: 'A telematikai egység állapota: segélyhívó/vészhívó gombok, némítás és tartás állapota.'
  pt: 'Estado da unidade telemática: botões de avaria/chamada de emergência, estado de silêncio e de espera.'
periodicity: ['2000ms']
senders: ['MDS', 'ICSV']
receivers: ['OVIP', 'BTEL', 'BSI', 'RAD']

signals:
  UNUSED_1:
    bits: '1.7-1.4'
    unused: true

  SUAL_MUTE_REQUEST:
    bits: '1.3'
    comment:
      en: 'Mute request for the SUAL module'
      fr: 'Demande de mute du module SUAL'
      es: 'Solicitud de silencio del módulo SUAL'
      de: 'Stummschaltungsanforderung des SUAL-Moduls'
      it: 'Richiesta di silenziamento del modulo SUAL'
      pl: 'Żądanie wyciszenia modułu SUAL'
      ru: 'Запрос отключения звука модуля SUAL'
      zh: 'SUAL模块静音请求'
      hu: 'A SUAL modul némítási kérése'
      pt: 'Pedido de silêncio do módulo SUAL'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
        en: 'Requested'
        fr: 'Demandé'
        es: 'Solicitado'
        de: 'Angefordert'
        it: 'Richiesto'
        pl: 'Żądane'
        ru: 'Запрошено'
        zh: '已请求'
        hu: 'Kérve'
        pt: 'Pedido'

  NETWORK_MAINTAIN_REQUEST_MDC:
    bits: '1.2'
    comment:
      en: 'Network maintain request from the emergency call module (MDC)'
      fr: 'Demande de maintien réseau par le module d''appel d''urgence (MDC)'
      es: 'Solicitud de mantenimiento de red por el módulo de llamada de emergencia (MDC)'
      de: 'Netzwerk-Bereithalteanforderung des Notrufmoduls (MDC)'
      it: 'Richiesta di mantenimento rete dal modulo chiamata di emergenza (MDC)'
      pl: 'Żądanie podtrzymania sieci przez moduł połączeń alarmowych (MDC)'
      ru: 'Запрос поддержания сети от модуля экстренного вызова (MDC)'
      zh: '紧急呼叫模块(MDC)的网络保持请求'
      hu: 'A segélyhívó modul (MDC) hálózatfenntartási kérése'
      pt: 'Pedido de manutenção de rede pelo módulo de chamada de emergência (MDC)'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No hold request'
        fr: 'Pas de demande de maintien'
        es: 'Sin solicitud de mantenimiento'
        de: 'Keine Halteanforderung'
        it: 'Nessuna richiesta di mantenimento'
        pl: 'Brak żądania utrzymania'
        ru: 'Нет запроса удержания'
        zh: '无保持请求'
        hu: 'Nincs tartási kérés'
        pt: 'Sem pedido de manutenção'
      0x01:
        en: 'Hold request'
        fr: 'Demande de maintien'
        es: 'Solicitud de mantenimiento'
        de: 'Halteanforderung'
        it: 'Richiesta di mantenimento'
        pl: 'Żądanie podtrzymania'
        ru: 'Запрос удержания'
        zh: '保持请求'
        hu: 'Fenntartási kérés'
        pt: 'Pedido de manutenção'

  BREAKDOWN_CALL_IN_PROGRESS:
    bits: '1.1'
    comment:
      en: 'Breakdown assistance call in progress'
      fr: 'Appel de dépannage en cours'
      es: 'Llamada de asistencia en carretera en curso'
      de: 'Pannenhilfeanruf läuft'
      it: 'Chiamata di assistenza stradale in corso'
      pl: 'Trwa połączenie z pomocą drogową'
      ru: 'Идёт вызов службы помощи на дороге'
      zh: '道路救援呼叫进行中'
      hu: 'Folyamatban lévő segélyhívás (műszaki mentés)'
      pt: 'Chamada de assistência em viagem em curso'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No breakdown call'
        fr: 'Pas d''appel de dépannage'
        es: 'Sin llamada de asistencia'
        de: 'Kein Pannenruf'
        it: 'Nessuna chiamata di soccorso'
        pl: 'Brak wezwania pomocy drogowej'
        ru: 'Нет вызова помощи'
        zh: '无救援呼叫'
        hu: 'Nincs segélyhívás'
        pt: 'Sem chamada de avaria'
      0x01:
        en: 'Breakdown assistance call in progress'
        fr: 'Appel de dépannage en cours'
        es: 'Llamada de asistencia en carretera en curso'
        de: 'Pannenhilfe-Anruf läuft'
        it: 'Chiamata di assistenza stradale in corso'
        pl: 'Trwa połączenie z pomocą drogową'
        ru: 'Выполняется вызов техпомощи'
        zh: '道路救援呼叫进行中'
        hu: 'Segélyhívás folyamatban'
        pt: 'Chamada de assistência em viagem em curso'

  EMERGENCY_CALL_IN_PROGRESS:
    bits: '1.0'
    comment:
      en: 'Emergency call in progress'
      fr: 'Appel d''urgence en cours'
      es: 'Llamada de emergencia en curso'
      de: 'Notruf läuft'
      it: 'Chiamata di emergenza in corso'
      pl: 'Trwa połączenie alarmowe'
      ru: 'Идёт экстренный вызов'
      zh: '紧急呼叫进行中'
      hu: 'Folyamatban lévő segélyhívás'
      pt: 'Chamada de emergência em curso'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No emergency call'
        fr: 'Pas d''appel d''urgence'
        es: 'Sin llamada de emergencia'
        de: 'Kein Notruf'
        it: 'Nessuna chiamata di emergenza'
        pl: 'Brak wezwania alarmowego'
        ru: 'Нет экстренного вызова'
        zh: '无紧急呼叫'
        hu: 'Nincs vészhívás'
        pt: 'Sem chamada de emergência'
      0x01:
        en: 'Emergency call in progress'
        fr: 'Appel d''urgence en cours'
        es: 'Llamada de emergencia en curso'
        de: 'Notruf läuft'
        it: 'Chiamata di emergenza in corso'
        pl: 'Trwa połączenie alarmowe'
        ru: 'Экстренный вызов выполняется'
        zh: '紧急呼叫进行中'
        hu: 'Segélyhívás folyamatban'
        pt: 'Chamada de emergência em curso'

  UNUSED_2:
    bits: '2.7-2.0'
    unused: true

