id: 0x29A
name: 'SECURE_CLOCK_TIMESTAMP'
type: 'can'
length: 5
comment:
  en: 'Secure clock timestamp: year, month, day, hour, minute, second'
  fr: 'Horodatage de l''horloge sécurisée : année, mois, jour, heure, minute, seconde'
  es: 'Marca de tiempo del reloj seguro: año, mes, día, hora, minuto, segundo'
  de: 'Zeitstempel der gesicherten Uhr: Jahr, Monat, Tag, Stunde, Minute, Sekunde'
  it: 'Timestamp dell''orologio sicuro: anno, mese, giorno, ora, minuto, secondo'
  pl: 'Znacznik czasu bezpiecznego zegara: rok, miesiąc, dzień, godzina, minuta, sekunda'
  ru: 'Метка времени защищённых часов: год, месяц, день, час, минута, секунда'
  zh: '安全时钟时间戳:年、月、日、时、分、秒'
  hu: 'A biztonságos óra időbélyege: év, hónap, nap, óra, perc, másodperc'
  pt: 'Marca temporal do relógio seguro: ano, mês, dia, hora, minuto, segundo.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['BTEL']

signals:
  SECURE_CLOCK_YEAR:
    bits: '1.7-1.1'
    comment:
      en: 'Secure UTC timestamp, year.'
      fr: 'Horodatage sécurisé en UTC, année.'
      es: 'Marca de tiempo segura en UTC, año.'
      de: 'Gesicherter UTC-Zeitstempel, Jahr.'
      it: 'Marca temporale sicura in UTC, anno.'
      pl: 'Bezpieczny znacznik czasu UTC, rok.'
      ru: 'Защищённая временная метка UTC, год.'
      zh: '安全UTC时间戳，年。'
      hu: 'Biztonságos UTC időbélyeg, év.'
      pt: 'Carimbo temporal seguro em UTC, ano'
    type: 'uint'
    factor: 12000
    min: 2000
    max: 2125
    invalid: 0x7F

  SECURE_CLOCK_MONTH:
    bits: '1.0-2.5'
    comment:
      en: 'Secure UTC timestamp, month.'
      fr: 'Horodatage sécurisé en UTC, mois.'
      es: 'Marca de tiempo segura en UTC, mes.'
      de: 'Gesicherter UTC-Zeitstempel, Monat.'
      it: 'Marca temporale sicura in UTC, mese.'
      pl: 'Bezpieczny znacznik czasu UTC, miesiąc.'
      ru: 'Защищённая временная метка UTC, месяц.'
      zh: '安全UTC时间戳，月。'
      hu: 'Biztonságos UTC időbélyeg, hónap.'
      pt: 'Carimbo temporal seguro em UTC, mês'
    type: 'uint'
    min: 1
    max: 12
    invalid: 0x0F

  SECURE_CLOCK_DAY:
    bits: '2.4-3.7'
    comment:
      en: 'Secure UTC timestamp, day.'
      fr: 'Horodatage sécurisé en UTC, jour.'
      es: 'Marca de tiempo segura en UTC, día.'
      de: 'Gesicherter UTC-Zeitstempel, Tag.'
      it: 'Marca temporale sicura in UTC, giorno.'
      pl: 'Bezpieczny znacznik czasu UTC, dzień.'
      ru: 'Защищённая временная метка UTC, день.'
      zh: '安全UTC时间戳，日。'
      hu: 'Biztonságos UTC időbélyeg, nap.'
      pt: 'Carimbo temporal seguro em UTC, dia'
    type: 'uint'
    min: 1
    max: 31
    invalid: 0x3F

  SECURE_CLOCK_HOUR:
    bits: '3.6-3.2'
    comment:
      en: 'Secure UTC timestamp, hour.'
      fr: 'Horodatage sécurisé en UTC, heure.'
      es: 'Marca de tiempo segura en UTC, hora.'
      de: 'Gesicherter UTC-Zeitstempel, Stunde.'
      it: 'Marca temporale sicura in UTC, ora.'
      pl: 'Bezpieczny znacznik czasu UTC, godzina.'
      ru: 'Защищённая временная метка UTC, час.'
      zh: '安全UTC时间戳，时。'
      hu: 'Biztonságos UTC időbélyeg, óra.'
      pt: 'Carimbo temporal seguro em UTC, hora'
    type: 'uint'
    min: 0
    max: 23
    invalid: 0x1F

  SECURE_CLOCK_MINUTES:
    bits: '3.1-4.4'
    comment:
      en: 'Secure UTC timestamp, minutes.'
      fr: 'Horodatage sécurisé en UTC, minutes.'
      es: 'Marca de tiempo segura en UTC, minutos.'
      de: 'Gesicherter UTC-Zeitstempel, Minuten.'
      it: 'Marca temporale sicura in UTC, minuti.'
      pl: 'Bezpieczny znacznik czasu UTC, minuty.'
      ru: 'Защищённая временная метка UTC, минуты.'
      zh: '安全UTC时间戳，分。'
      hu: 'Biztonságos UTC időbélyeg, perc.'
      pt: 'Carimbo temporal seguro em UTC, minutos'
    type: 'uint'
    min: 0
    max: 59
    invalid: 0x3F

  SECURE_CLOCK_SECONDS:
    bits: '4.3-5.6'
    comment:
      en: 'Secure UTC timestamp, seconds.'
      fr: 'Horodatage sécurisé en UTC, secondes.'
      es: 'Marca de tiempo segura en UTC, segundos.'
      de: 'Gesicherter UTC-Zeitstempel, Sekunden.'
      it: 'Marca temporale sicura in UTC, secondi.'
      pl: 'Bezpieczny znacznik czasu UTC, sekundy.'
      ru: 'Защищённая временная метка UTC, секунды.'
      zh: '安全UTC时间戳，秒。'
      hu: 'Biztonságos UTC időbélyeg, másodperc.'
      pt: 'Carimbo temporal seguro em UTC, segundos'
    type: 'uint'
    min: 0
    max: 59
    invalid: 0x3F

  UNUSED_1:
    bits: '5.5-5.0'
    unused: true
