id: 0x15C
name: 'CLUSTER_TRIP_AND_CRUISE_STATUS'
type: 'can'
length: 5
comment:
  en: 'Instrument cluster status: cruise-control setpoint change, trip computer check/reset requests, display faults and engine start phase request.'
  fr: 'État du combiné : changement de consigne du régulateur, demandes de contrôle/remise à zéro de l''ordinateur de bord, défauts d''affichage et demande de phase de démarrage.'
  es: 'Estado del cuadro de instrumentos: cambio de consigna del regulador de velocidad, solicitudes de control/reinicio del ordenador de a bordo, fallos de visualización y solicitud de fase de arranque.'
  de: 'Status des Kombiinstruments: Änderung des Tempomat-Sollwerts, Prüf-/Rücksetzanforderungen des Bordcomputers, Anzeigefehler und Anforderung der Startphase.'
  it: 'Stato del quadro strumenti: cambio del setpoint del regolatore di velocità, richieste di controllo/azzeramento del computer di bordo, guasti di visualizzazione e richiesta di fase di avviamento.'
  pl: 'Stan zestawu wskaźników: zmiana wartości zadanej tempomatu, żądania kontroli/resetu komputera pokładowego, usterki wyświetlacza i żądanie fazy rozruchu.'
  ru: 'Статус приборной панели: изменение уставки круиз-контроля, запросы проверки/сброса бортового компьютера, неисправности дисплея и запрос фазы пуска.'
  zh: '仪表组状态:巡航控制设定值变更、行车电脑检查/复位请求、显示故障及发动机启动阶段请求。'
  hu: 'A műszeregység állapota: tempomat alapérték-változás, fedélzeti számítógép ellenőrzési/nullázási kérései, kijelzőhibák és motorindítási fázis kérése.'
  pt: 'Estado do quadrante de instrumentos: mudança do ponto de ajuste do regulador de velocidade, pedidos de verificação/reposição do computador de bordo, avarias de apresentação e pedido de fase de arranque do motor.'
periodicity: ['200ms', 'trigger']
senders: ['BTEL']
receivers: ['BSI']

