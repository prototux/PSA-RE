id: 0x097
name: 'HUD_STATUS'
type: 'can'
length: 2
comment:
  en: 'Head-up display status: activation, display fault, memory and recall, mirror movement, displayed speed.'
  fr: 'État de l''affichage tête haute : activation, défaut d''affichage, mémoire et rappel, mouvement du miroir, vitesse affichée.'
  es: 'Estado de la pantalla head-up: activación, fallo de visualización, memoria y recuperación, movimiento del espejo, velocidad mostrada.'
  de: 'Status des Head-up-Displays: Aktivierung, Anzeigefehler, Memory und Abruf, Spiegelbewegung, angezeigte Geschwindigkeit.'
  it: 'Stato del display head-up: attivazione, guasto di visualizzazione, memoria e richiamo, movimento dello specchio, velocità visualizzata.'
  pl: 'Stan wyświetlacza przezierowego: aktywacja, usterka wyświetlacza, pamięć i przywołanie, ruch lusterka, wyświetlana prędkość.'
  ru: 'Статус проекционного дисплея: активация, неисправность дисплея, память и вызов, движение зеркала, отображаемая скорость.'
  zh: '平视显示器状态:激活、显示故障、记忆及调用、反射镜移动、显示速度。'
  hu: 'A head-up kijelző állapota: aktiválás, kijelzőhiba, memória és visszahívás, tükörmozgás, kijelzett sebesség.'
  pt: 'Estado do head-up display: ativação, avaria de apresentação, memória e recuperação, movimento do espelho, velocidade apresentada.'
periodicity: ['200ms', 'trigger']
senders: ['BTEL']
receivers: ['BSI']

signals:
  MEDIA_DISPLAY_FAULT:
    bits: '1.5'
    comment:
      en: 'Media display fault'
      fr: 'Défaut d''affichage du média.'
      es: 'Fallo de visualización del medio'
      de: 'Fehler bei der Medienanzeige'
      it: 'Guasto di visualizzazione del supporto'
      pl: 'Usterka wyświetlania nośnika'
      ru: 'Неисправность отображения носителя'
      zh: '媒体显示故障'
      hu: 'Médiamegjelenítési hiba'
      pt: 'Falha de visualização do media'
    type: 'bool'
    values:
      0x00:
        en: 'No fault detected'
        fr: 'Pas de défaut'
        es: 'Sin fallo'
        de: 'Kein Fehler'
        it: 'Nessun guasto'
        pl: 'Brak usterki'
        ru: 'Неисправность не обнаружена'
        zh: '未检测到故障'
        hu: 'Nincs hiba'
        pt: 'Nenhuma avaria detetada'
      0x01:
        en: 'Failure detected'
        fr: 'Défaut détecté'
        es: 'Fallo detectado'
        de: 'Fehler erkannt'
        it: 'Guasto rilevato'
        pl: 'Wykryto usterkę'
        ru: 'Обнаружена неисправность'
        zh: '检测到故障'
        hu: 'Hiba észlelve'
        pt: 'Falha detetada'

