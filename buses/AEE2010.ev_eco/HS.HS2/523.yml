  zh: '电路断路器数据:处理计数器和唤醒状态。'
  hu: 'Az elektromos megszakító adatai: folyamatszámláló és ébresztési állapot.'
  pt: 'Dados do disjuntor elétrico: contador de processo e estado de ativação.'
periodicity: ['1000ms', 'trigger']
senders: ['ECB']
receivers: ['BSI', 'CMM', 'E_VCU']

