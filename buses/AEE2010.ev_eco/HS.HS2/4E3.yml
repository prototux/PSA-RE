id: 0x4E3
name: 'ELECTRIC_CIRCUIT_BREAKER_DATA'
type: 'can'
length: 8
comment:
  en: 'Electric circuit breaker data: process counter and wake-up status.'
  fr: 'Données du disjoncteur électrique : compteur de process et état de réveil.'
  es: 'Datos del disyuntor eléctrico: contador de proceso y estado de activación.'
  de: 'Daten des elektrischen Leistungsschalters: Prozesszähler und Weckstatus.'
  it: 'Dati dell''interruttore elettrico: contatore di processo e stato di risveglio.'
  pl: 'Dane wyłącznika elektrycznego: licznik procesu i stan wybudzenia.'
  ru: 'Данные электрического выключателя: счётчик процесса и статус пробуждения.'
  zh: '电路断路器数据:处理计数器和唤醒状态。'
  hu: 'Az elektromos megszakító adatai: folyamatszámláló és ébresztési állapot.'
  pt: 'Dados do disjuntor elétrico: contador de processo e estado de ativação.'
periodicity: ['100ms']
senders: ['ECB']
receivers: ['BSI', 'CMM', 'E_VCU']

signals:
  PROCESS_COUNTER_4B_4E3:
    bits: '1.3-1.0'
    comment:
      en: '4-bit process counter'
      fr: 'Compteur de process 4 bits'
      es: 'Contador de proceso de 4 bits'
      de: '4-Bit-Prozesszähler'
      it: 'Contatore di processo a 4 bit'
      pl: '4-bitowy licznik procesu'
      ru: '4-битный счётчик процесса'
      zh: '4位过程计数器'
      hu: '4 bites folyamatszámláló'
      pt: 'Contador de processo de 4 bits'
    type: 'uint'
    min: 0
    max: 0

  ECB_WAKEUP_STATUS:
    bits: '8.7'
    comment:
      en: 'Electronic circuit breaker network wake-up status'
      fr: 'État de réveil réseau du disjoncteur électronique'
      es: 'Estado de activación de red del disyuntor electrónico'
      de: 'Netzwerk-Aufwachstatus des elektronischen Trennschalters'
      it: 'Stato di risveglio rete dell''interruttore elettronico'
      pl: 'Stan wybudzenia sieci elektronicznego wyłącznika obwodu'
      ru: 'Статус пробуждения сети электронного автоматического выключателя'
      zh: '电子断路器网络唤醒状态'
      hu: 'Az elektronikus megszakító hálózati ébresztési állapota'
      pt: 'Estado de ativação de rede do disjuntor eletrónico'
    type: 'bool'
    values:
      0x00:
        en: 'No wake-up'
        fr: 'Pas de réveil'
        es: 'Sin activación'
        de: 'Kein Aufwachen'
        it: 'Nessun risveglio'
        pl: 'Brak wybudzenia'
        ru: 'Пробуждения нет'
        zh: '无唤醒'
        hu: 'Nincs ébresztés'
        pt: 'Sem ativação'
      0x01:
        en: 'Clock'
        fr: 'Réveil'
        es: 'Reloj despertador'
        de: 'Wecker'
        it: 'Sveglia'
        pl: 'Budzik'
        ru: 'Будильник'
        zh: '闹钟'
        hu: 'Ébresztőóra'
        pt: 'Relógio'
