      pl: 'Zadana wartość opóźnienia pojazdu z urządzenia wykrywającego'
      ru: 'Заданное замедление автомобиля от устройства обнаружения'
      zh: '探测装置发出的车辆减速度设定值'
      hu: 'Az érzékelő eszköz által kiadott jármű-lassítási alapjel'
