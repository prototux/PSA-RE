id: 0x2B6
name: 'ACC_DYNAMIC_STATE'
type: 'can'
length: 8
comment:
  en: 'Adaptive cruise control dynamic state 1: powertrain wheel-torque setpoint and potential setpoint, deceleration setpoint, torque-activation and brake-prefill requests, deceleration plateau request, ACC state.'
  fr: 'État dynamique 1 du régulateur adaptatif : consigne et consigne potentielle de couple roue du GMP, consigne de décélération, demandes d''activation de couple et de préremplissage frein, demande de plateau de décélération, état ACC.'
  es: 'Estado dinámico 1 del control de crucero adaptativo: consigna y consigna potencial de par de rueda del grupo motopropulsor, consigna de deceleración, solicitudes de activación de par y prellenado de freno, solicitud de meseta de deceleración, estado ACC.'
  de: 'Dynamischer Status 1 des adaptiven Tempomaten: Radmoment-Sollwert und potenzieller Sollwert des Antriebsstrangs, Verzögerungssollwert, Momentaktivierungs- und Bremsvorbefüllungsanforderungen, Verzögerungsplateau-Anforderung, ACC-Status.'
  it: 'Stato dinamico 1 del cruise control adattivo: setpoint e setpoint potenziale di coppia ruota del gruppo propulsore, setpoint di decelerazione, richieste di attivazione coppia e preriempimento freno, richiesta di plateau di decelerazione, stato ACC.'
  pl: 'Stan dynamiczny 1 aktywnego tempomatu: nastawa i potencjalna nastawa momentu koła układu napędowego, nastawa opóźnienia, żądania aktywacji momentu i wstępnego napełnienia hamulca, żądanie plateau opóźnienia, stan ACC.'
  ru: 'Динамическое состояние 1 адаптивного круиз-контроля: уставка и потенциальная уставка крутящего момента колеса силового агрегата, уставка замедления, запросы активации момента и преднаполнения тормоза, запрос плато замедления, состояние ACC.'
  zh: '自适应巡航控制动态状态1:动力总成车轮扭矩设定值和潜在设定值、减速设定值、扭矩激活和制动预填充请求、减速平台请求、ACC状态。'
  hu: 'Az adaptív tempomat dinamikus állapota 1: a hajtáslánc keréknyomaték alapjele és potenciális alapjele, lassítási alapjel, nyomatékaktiválási és fékelőtöltési kérések, lassítási fennsík kérés, ACC állapot.'
  pt: 'Estado dinâmico 1 do regulador de velocidade adaptativo: ponto de ajuste de binário nas rodas e ponto de ajuste potencial do grupo motopropulsor, ponto de ajuste de desaceleração, pedidos de ativação de binário e de pré-enchimento dos travões, pedido de patamar de desaceleração, estado do ACC.'
periodicity: ['20ms']
senders: ['CVM', 'ARTIV']
receivers: ['HCU2', 'BVA', 'ABS', 'CMM', 'BSI']

