id: 0x452
name: 'CRUISE_CONTROL_COMMAND_DATA'
type: 'can'
length: 6
comment:
  en: 'Wiper command sent to the ESP/dynamics unit: front wiper and washer state, cabin activation flag.'
  fr: 'Commande d''essuyage envoyée à l''unité ESP/dynamique : état essuie-glace et lave-glace avant, indicateur d''activation habitacle.'
  es: 'Comando de limpiaparabrisas enviado a la unidad ESP/dinámica: estado del limpiaparabrisas y lavaparabrisas delantero, indicador de activación del habitáculo.'
  de: 'Wischerbefehl an die ESP-/Fahrdynamikeinheit: Zustand von Frontwischer und -wäscher, Aktivierungskennzeichen Innenraum.'
  it: 'Comando tergicristallo inviato all''unità ESP/dinamica: stato tergicristallo e lavavetro anteriore, indicatore di attivazione abitacolo.'
  pl: 'Polecenie wycieraczek wysyłane do jednostki ESP/dynamiki: stan wycieraczki i spryskiwacza przedniego, flaga aktywacji kabiny.'
  ru: 'Команда стеклоочистителя, отправляемая блоку ESP/динамики: состояние переднего стеклоочистителя и омывателя, флаг активации салона.'
  zh: '发送给ESP/动态单元的雨刮命令:前雨刮和洗涤器状态、座舱激活标志。'
  hu: 'Az ESP/dinamikai egységnek küldött törlőparancs: az első ablaktörlő és mosó állapota, utastér aktiválási jelző.'
  pt: 'Comando do limpa-para-brisas enviado à unidade ESP/dinâmica: estado do limpa e lava-para-brisas dianteiro, indicador de ativação do habitáculo.'
periodicity: ['50ms']
senders: ['BSI', 'BSM']
receivers: ['CVM', 'ARTIV', 'ACC', 'ABS']

signals:
  FRONT_WIPER_STATE:
    bits: '1.7-1.6'
    comment:
      en: 'Front wiper state (off, confirmed wipe, low speed, high speed), sent when a rain sensor is fitted'
      fr: 'État des essuie-glaces avant (arrêt, essuyage confirmé, petite vitesse, grande vitesse), émis en présence d''un capteur de pluie'
      es: 'Estado de los limpiaparabrisas delanteros (parado, barrido confirmado, velocidad baja, velocidad alta), emitido cuando hay sensor de lluvia'
      de: 'Zustand der Frontscheibenwischer (aus, bestätigter Wischvorgang, niedrige Geschwindigkeit, hohe Geschwindigkeit), gesendet bei vorhandenem Regensensor'
      it: 'Stato dei tergicristalli anteriori (spento, tergitura confermata, bassa velocità, alta velocità), inviato in presenza di un sensore pioggia'
      pl: 'Stan wycieraczek przednich (wyłączone, potwierdzone wycieranie, mała prędkość, duża prędkość), wysyłany przy zamontowanym czujniku deszczu'
      ru: 'Состояние передних стеклоочистителей (выключены, подтверждённая протирка, низкая скорость, высокая скорость), передаётся при наличии датчика дождя'
      zh: '前雨刷状态(停止、确认刮水、低速、高速),在装有雨量传感器时发送'
      hu: 'Az első ablaktörlők állapota (leállítva, megerősített törlés, alacsony sebesség, magas sebesség), esőérzékelő megléte esetén küldve'
      pt: 'Estado dos limpa-para-brisas dianteiros (parado, limpeza confirmada, velocidade baixa, velocidade alta), emitido na presença de um sensor de chuva'
