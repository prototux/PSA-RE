id: 0x07
name: 'AIR_INTAKE_MOTOR_COMMAND'
type: 'lin'
length: 2
comment:
  en: 'Windshield defog humidity sensor status: diagnostic state, fault response and windshield temperature.'
  fr: 'État du capteur d''humidité de désembuage du pare-brise : état de diagnostic, réponse de défaut et température du pare-brise.'
  es: 'Estado del sensor de humedad de desempañado del parabrisas: estado de diagnóstico, respuesta de fallo y temperatura del parabrisas.'
  de: 'Status des Scheibenentfeuchtungs-Feuchtesensors: Diagnosestatus, Fehlerrückmeldung und Scheibentemperatur.'
  it: 'Stato del sensore di umidità per lo sbrinamento del parabrezza: stato diagnostico, risposta di guasto e temperatura del parabrezza.'
  pl: 'Stan czujnika wilgotności odparowania szyby przedniej: stan diagnostyczny, odpowiedź o usterce i temperatura szyby przedniej.'
  ru: 'Статус датчика влажности для обогрева лобового стекла: диагностическое состояние, ответ о неисправности и температура лобового стекла.'
  zh: '挡风玻璃除雾湿度传感器状态:诊断状态、故障响应及挡风玻璃温度。'
  hu: 'A szélvédő páramentesítő páraérzékelőjének állapota: diagnosztikai állapot, hibaválasz és a szélvédő hőmérséklete.'
  pt: 'Estado do sensor de humidade de desembaciamento do para-brisas: estado de diagnóstico, resposta de avaria e temperatura do para-brisas.'
periodicity: ['trigger']
senders: ['WDS']
receivers: ['BSI']
lin:
