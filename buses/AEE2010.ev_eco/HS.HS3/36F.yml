id: 0x36F
name: 'BSRF_COMMAND_9'
type: 'can'
length: 8
comment:
  en: 'Headlight flash request, electric parking brake commands front and rear, boot eject requests, hazard light request, fog light states, water pump command and horn command, sent by the BSI to the telematics gateway.'
  fr: 'Demande d''appel de phares, commandes de frein de stationnement électrique avant et arrière, demandes d''éjection de coffre, demande de feux de détresse, états antibrouillards, commande de pompe à eau et commande avertisseur sonore, envoyés par la BSI à la passerelle télématique.'
  es: 'Solicitud de ráfagas de faros, órdenes de freno de estacionamiento eléctrico delantero y trasero, solicitudes de expulsión del maletero, solicitud de luces de emergencia, estados de antiniebla, orden de bomba de agua y orden de claxon, enviados por la BSI a la pasarela telemática.'
  de: 'Lichthupenanforderung, Befehle der elektrischen Feststellbremse vorn und hinten, Kofferraum-Ausklink-Anforderungen, Warnblinkanforderung, Nebelscheinwerferzustände, Wasserpumpenbefehl und Hupenbefehl, von der BSI an das Telematik-Gateway gesendet.'
  it: 'Richiesta di lampeggio fari, comandi del freno di stazionamento elettrico anteriore e posteriore, richieste di espulsione bagagliaio, richiesta luci di emergenza, stati fendinebbia, comando pompa acqua e comando clacson, inviati dalla BSI al gateway telematico.'
  pl: 'Żądanie mignięcia światłami, polecenia elektrycznego hamulca postojowego przedniego i tylnego, żądania otwarcia bagażnika, żądanie świateł awaryjnych, stany świateł przeciwmgielnych, polecenie pompy wody i polecenie klaksonu, wysyłane przez BSI do bramki telematycznej.'
  ru: 'Запрос мигания фарами, команды электрического стояночного тормоза спереди и сзади, запросы открытия багажника, запрос аварийной сигнализации, состояния противотуманных фар, команда водяного насоса и команда звукового сигнала, отправляемые BSI в телематический шлюз.'
  zh: '远光灯闪烁请求、前后电子驻车制动命令、后备箱弹出请求、危险警示灯请求、雾灯状态、水泵命令及喇叭命令，由BSI发送给远程信息处理网关。'
  hu: 'Fényvillogtatási kérés, elülső és hátsó elektromos rögzítőfék parancsok, csomagtér-kiugratási kérések, vészvillogó-kérés, ködlámpaállapotok, vízszivattyú-parancs és duda-parancs, a BSI küldi a telematikai átjárónak.'
  pt: 'Pedido de mudança de luzes, comandos do travão de estacionamento elétrico dianteiro e traseiro, pedidos de ejeção da bagageira, pedido de luzes de emergência, estados do farol de nevoeiro, comando da bomba de água e comando da buzina, enviados pela BSI ao gateway telemático.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BSRF']

