id: 0x3A9
name: 'TELEMATICS_CALL_BUTTON_STATUS'
type: 'can'
length: 2
comment:
  en: 'Remote telematics unit status: breakdown/emergency call buttons, remote menu requests, mute and hold state.'
  fr: 'État du boîtier télématique distant : boutons appel panne/urgence, demandes de menu à distance, coupure son et maintien.'
  es: 'Estado de la unidad telemática remota: botones de llamada de avería/emergencia, solicitudes de menú remoto, silencio y retención.'
  de: 'Status der entfernten Telematikeinheit: Pannen-/Notruftasten, Fernmenüanforderungen, Stummschaltung und Halten.'
  it: 'Stato dell''unità telematica remota: pulsanti chiamata guasto/emergenza, richieste menu remoto, silenziamento e mantenimento.'
  pl: 'Stan zdalnej jednostki telematycznej: przyciski wezwania pomocy drogowej/awaryjnego, żądania zdalnego menu, wyciszenie i podtrzymanie.'
  ru: 'Статус удалённого телематического блока: кнопки вызова помощи/экстренного вызова, запросы удалённого меню, отключение звука и удержание.'
  zh: '远程车载通信单元状态:故障/紧急呼叫按钮、远程菜单请求、静音和保持状态。'
  hu: 'A távoli telematikai egység állapota: segélyhívó/vészhívó gombok, távoli menükérések, némítás és tartás állapota.'
  pt: 'Estado da unidade telemática remota: botões de avaria/chamada de emergência, pedidos de menu remoto, estado de silêncio e de espera.'
periodicity: ['200ms']
senders: ['BSRF']
receivers: ['BSI']

signals:
  UNUSED_1:
    bits: '1.7-1.4'
    unused: true

  SUAL_MUTE_REQUEST:
    bits: '1.3'
    comment:
      en: 'Mute request for the SUAL module'
      fr: 'Demande de mute du module SUAL'
      es: 'Solicitud de silencio del módulo SUAL'
      de: 'Stummschaltungsanforderung des SUAL-Moduls'
      it: 'Richiesta di silenziamento del modulo SUAL'
      pl: 'Żądanie wyciszenia modułu SUAL'
      ru: 'Запрос отключения звука модуля SUAL'
      zh: 'SUAL模块静音请求'
      hu: 'A SUAL modul némítási kérése'
      pt: 'Pedido de silêncio do módulo SUAL'
    type: 'bool'
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
        en: 'Requested'
        fr: 'Demandé'
        es: 'Solicitado'
        de: 'Angefordert'
        it: 'Richiesto'
        pl: 'Żądane'
        ru: 'Запрошено'
        zh: '已请求'
        hu: 'Kérve'
        pt: 'Pedido'

  NETWORK_MAINTAIN_REQUEST_MDC:
    bits: '1.2'
    comment:
      en: 'Network maintain request from the emergency call module (MDC)'
      fr: 'Demande de maintien réseau par le module d''appel d''urgence (MDC)'
      es: 'Solicitud de mantenimiento de red por el módulo de llamada de emergencia (MDC)'
      de: 'Netzwerk-Bereithalteanforderung des Notrufmoduls (MDC)'
      it: 'Richiesta di mantenimento rete dal modulo chiamata di emergenza (MDC)'
      pl: 'Żądanie podtrzymania sieci przez moduł połączeń alarmowych (MDC)'
