id: 0x294
name: 'TRACTION_BATTERY_DYNAMIC_DATA_4'
type: 'can'
length: 2
comment:
  en: 'Status of the horn, turn lights, lock/unlock and immobiliser after a remote-control action.'
  fr: 'État du klaxon, des clignotants, du verrouillage/déverrouillage et de l''antidemarrage après une action à distance.'
  es: 'Estado del claxon, los intermitentes, el bloqueo/desbloqueo y el inmovilizador tras una acción a distancia.'
  de: 'Status von Hupe, Blinklicht, Ver-/Entriegelung und Wegfahrsperre nach einer Fernbedienungsaktion.'
  it: 'Stato del clacson, degli indicatori di direzione, del blocco/sblocco e dell''immobilizzatore dopo un''azione remota.'
  pl: 'Stan klaksonu, kierunkowskazów, blokowania/odblokowania i immobilizera po zdalnym dzialaniu.'
  ru: 'Статус звукового сигнала, поворотников, блокировки/разблокировки и иммобилайзера после дистанционного действия.'
  zh: '远程控制操作后喇叭、转向灯、上锁/解锁及防盗锁定的状态。'
  hu: 'A duda, az iranyjelzők, a zárás/nyitás és az indításgátló állapota egy távvezérelt művelet után.'
  pt: 'Estado da buzina, dos piscas, do bloqueio/desbloqueio e do imobilizador após uma ação à distância.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['BSRF']

