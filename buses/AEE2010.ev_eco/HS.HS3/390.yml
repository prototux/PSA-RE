id: 0x390
name: 'ADAPTIVE_DAMPER_STATUS'
type: 'can'
length: 2
comment:
  en: 'Commands sent by the BSI to the steering column module: lane keeping haptic alerts, heated steering wheel authorisation, cruise control state, gear-shift paddle and heating switch types.'
  fr: 'Commandes envoyées par la BSI au module de colonne de direction : alertes haptiques de maintien de voie, autorisation de chauffage du volant, état du régulateur, types de palettes de changement de vitesse et de commutateur de chauffage.'
  es: 'Órdenes enviadas por la BSI al módulo de columna de dirección: alertas hápticas de mantenimiento de carril, autorización de calefacción del volante, estado del regulador, tipos de levas de cambio y de conmutador de calefacción.'
  de: 'Von der BSI an das Lenksäulenmodul gesendete Befehle: haptische Spurhaltewarnungen, Lenkradheizungsfreigabe, Tempomatzustand, Schaltwippentyp und Heizungsschaltertyp.'
  it: 'Comandi inviati dalla BSI al modulo colonna di sterzo: allarmi aptici di mantenimento corsia, autorizzazione riscaldamento volante, stato del regolatore, tipi di leve del cambio e di commutatore di riscaldamento.'
  pl: 'Polecenia wysyłane przez BSI do modułu kolumny kierownicy: alerty haptyczne utrzymania pasa, zezwolenie na ogrzewanie kierownicy, stan tempomatu, typy łopatek zmiany biegów i przełącznika ogrzewania.'
  ru: 'Команды, отправляемые BSI в модуль рулевой колонки: тактильные предупреждения удержания полосы, разрешение обогрева руля, состояние круиз-контроля, типы лепестков переключения передач и переключателя обогрева.'
  zh: '由BSI发送给转向柱模块的指令：车道保持触觉警报、方向盘加热授权、巡航控制状态、换挡拨片及加热开关类型。'
  hu: 'A BSI parancsai a kormányoszlop-modul felé: sávtartás haptikus riasztásai, kormányfűtés engedélyezése, sebességtartó állapota, váltófül és fűtéskapcsoló típusa.'
  pt: 'Comandos enviados pela BSI ao módulo da coluna de direção: alertas hápticos de manutenção de faixa, autorização de aquecimento do volante, estado do regulador de velocidade, patilhas de mudança e tipos de interruptor de aquecimento.'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['BSRF']

