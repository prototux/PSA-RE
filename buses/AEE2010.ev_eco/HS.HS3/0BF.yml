id: 0x0BF
name: 'WINDOW_SUNROOF_REQUEST'
type: 'can'
length: 6
comment:
  en: 'Window, sunroof/blind and door position requests and Bluetooth/card authentication requests, sent by the BSI to the smart door control module.'
  fr: 'Demandes de position des vitres, du toit ouvrant/store et des portes, et demandes d''authentification Bluetooth/carte, envoyées par la BSI au module de commande de porte intelligent.'
  es: 'Solicitudes de posición de las ventanillas, techo solar/persiana y puertas, y solicitudes de autenticación Bluetooth/tarjeta, enviadas por la BSI al módulo de control de puerta inteligente.'
  de: 'Anforderungen zur Fenster-, Schiebedach-/Rollo- und Türposition sowie Bluetooth-/Kartenauthentifizierungsanforderungen, von der BSI an das intelligente Türsteuermodul gesendet.'
  it: 'Richieste di posizione dei finestrini, del tettuccio apribile/tendina e delle porte, e richieste di autenticazione Bluetooth/scheda, inviate dalla BSI al modulo di comando porta intelligente.'
  pl: 'Żądania pozycji szyb, szyberdachu/rolety i drzwi oraz żądania uwierzytelnienia Bluetooth/karty, wysyłane przez BSI do inteligentnego modułu sterowania drzwiami.'
  ru: 'Запросы положения стёкол, люка/шторки и дверей, а также запросы аутентификации Bluetooth/карты, отправляемые BSI в интеллектуальный модуль управления дверью.'
  zh: '由BSI发送给智能车门控制模块的车窗、天窗/遮阳帘和车门位置请求，以及蓝牙/卡片认证请求。'
  hu: 'Az ablakok, a napfénytető/roló és az ajtók pozíciójára vonatkozó kérések, valamint Bluetooth-/kártya-hitelesítési kérések, amelyeket a BSI küld az intelligens ajtóvezérlő modulnak.'
  pt: 'Pedidos de posição de vidro, teto de abrir/estore e porta, e pedidos de autenticação Bluetooth/cartão, enviados pela BSI ao módulo de comando inteligente das portas.'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['BSRF']

