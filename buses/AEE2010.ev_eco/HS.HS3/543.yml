id: 0x543
name: 'EV_BATTERY_ENERGY'
type: 'can'
length: 6
comment:
  en: 'Remaining and total battery energy, and battery state of health (capacity and resistance)'
  fr: 'Énergie restante et totale de la batterie, et état de santé de la batterie (capacité et résistance)'
  es: 'Energía restante y total de la batería, y estado de salud de la batería (capacidad y resistencia)'
  de: 'Verbleibende und gesamte Batterieenergie sowie Batteriezustand (Kapazität und Widerstand)'
  it: 'Energia residua e totale della batteria, e stato di salute della batteria (capacità e resistenza)'
  pl: 'Pozostała i całkowita energia akumulatora oraz stan zdrowia akumulatora (pojemność i rezystancja)'
  ru: 'Оставшаяся и общая энергия батареи, а также состояние здоровья батареи (ёмкость и сопротивление)'
  zh: '电池剩余及总能量,以及电池健康状态(容量与内阻)'
  hu: 'Az akkumulátor fennmaradó és teljes energiája, valamint az akkumulátor állapota (kapacitás és ellenállás)'
  pt: 'Energia restante e total da bateria, e estado de saúde da bateria (capacidade e resistência).'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BSRF']

signals:
  BMS_REMAINING_BATTERY_ENERGY:
    bits: '1.7-2.5'
    comment:
      en: 'Remaining battery energy reported by the battery management system (BMS) (Wh)'
      fr: 'Énergie restante de la batterie indiquée par le système de gestion de batterie (BMS) (Wh)'
      es: 'Energía restante de la batería indicada por el sistema de gestión de batería (BMS) (Wh)'
      de: 'Vom Batteriemanagementsystem (BMS) gemeldete verbleibende Batterieenergie (Wh)'
      it: 'Energia residua della batteria indicata dal sistema di gestione della batteria (BMS) (Wh)'
      pl: 'Pozostała energia akumulatora zgłaszana przez system zarządzania akumulatorem (BMS) (Wh)'
      ru: 'Оставшаяся энергия батареи, сообщаемая системой управления батареей (BMS) (Вт·ч)'
      zh: '电池管理系统(BMS)报告的剩余电池能量(Wh)'
      hu: 'Az akkumulátor-kezelő rendszer (BMS) által jelentett fennmaradó akkumulátor-energia (Wh)'
      pt: 'Energia restante da bateria indicada pelo sistema de gestão da bateria (BMS) (Wh)'
    type: 'uint'
    factor: 32
    min: 0
    max: 65440
    units: 'Wh'
    invalid: 0x7FF

  BATTERY_ENERGY_EXTENDED_FLAG:
    bits: '2.4'
    comment:
      en: 'Flag indicating whether the battery energy value uses the extended range'
      fr: 'Indicateur signalant si la valeur d''énergie de la batterie utilise la plage étendue'
      es: 'Indicador que señala si el valor de energía de la batería utiliza el rango extendido'
      de: 'Kennzeichen, das anzeigt, ob der Batterieenergiewert den erweiterten Bereich verwendet'
      it: 'Indicatore che segnala se il valore di energia della batteria utilizza l''intervallo esteso'
      pl: 'Flaga wskazująca, czy wartość energii akumulatora wykorzystuje rozszerzony zakres'
      ru: 'Флаг, указывающий, использует ли значение энергии батареи расширенный диапазон'
      zh: '表示电池能量值是否使用扩展范围的标志'
      hu: 'Jelző, amely megmutatja, hogy az akkumulátor-energia értéke a kiterjesztett tartományt használja-e'
      pt: 'Indicador de se o valor de energia da bateria utiliza a gama alargada'
    type: 'bool'
    values:
      0x00:
        en: 'Battery energy not extended'
        fr: 'Énergie de la batterie non étendue'
        es: 'Energía de la batería no ampliada'
        de: 'Batterieenergie nicht erweitert'
        it: 'Energia della batteria non estesa'
        pl: 'Energia baterii nierozszerzona'
        ru: 'Энергия батареи не расширена'
        zh: '电池能量未扩展'
        hu: 'Akkumulátor energia nem kiterjesztett'
        pt: 'Energia da bateria não ampliada'
      0x01:
        en: 'Extended battery energy'
        fr: 'Énergie de batterie étendue'
        es: 'Energía de batería ampliada'
        de: 'Erweiterte Batterieenergie'
        it: 'Energia della batteria estesa'
        pl: 'Rozszerzona energia akumulatora'
        ru: 'Расширенная энергия батареи'
        zh: '扩展电池能量'
        hu: 'Kiterjesztett akkumulátorenergia'
        pt: 'Energia de bateria alargada'

  BMS_TOTAL_BATTERY_ENERGY:
    bits: '3.7-4.5'
    comment:
      en: 'Total battery energy reported by the battery management system (BMS) (Wh)'
      fr: 'Énergie totale de la batterie indiquée par le système de gestion de batterie (BMS) (Wh)'
      es: 'Energía total de la batería indicada por el sistema de gestión de batería (BMS) (Wh)'
      de: 'Vom Batteriemanagementsystem (BMS) gemeldete Gesamtbatterieenergie (Wh)'
      it: 'Energia totale della batteria indicata dal sistema di gestione della batteria (BMS) (Wh)'
      pl: 'Całkowita energia akumulatora zgłaszana przez system zarządzania akumulatorem (BMS) (Wh)'
      ru: 'Полная энергия батареи, сообщаемая системой управления батареей (BMS) (Вт·ч)'
      zh: '电池管理系统(BMS)报告的电池总能量(Wh)'
      hu: 'Az akkumulátor-kezelő rendszer (BMS) által jelentett teljes akkumulátor-energia (Wh)'
      pt: 'Energia total da bateria indicada pelo sistema de gestão da bateria (BMS) (Wh)'
    type: 'uint'
    factor: 32
    min: 0
    max: 65440
    units: 'Wh'
    invalid: 0x7FF

  HV_BATTERY_SOH_CAPACITY:
    bits: '5.7-5.1'
    comment:
      en: 'HV battery state of health, capacity-based'
      fr: 'État de santé de la batterie HT, basé sur la capacité'
      es: 'Estado de salud de la batería de alta tensión, basado en la capacidad'
      de: 'Alterungszustand (SOH) der HV-Batterie, kapazitätsbasiert'
      it: 'Stato di salute della batteria HT, basato sulla capacità'
      pl: 'Stan zdrowia akumulatora wysokiego napięcia, na podstawie pojemności'
      ru: 'Состояние работоспособности (SOH) ВВ батареи по ёмкости'
      zh: '基于容量的高压电池健康状态(SOH)'
      hu: 'A nagyfeszültségű akkumulátor állapota (SOH), kapacitás alapján'
      pt: 'Estado de saúde da bateria de alta tensão, baseado na capacidade'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0x7F

  HV_BATTERY_SOH_RESISTANCE:
    bits: '6.7-6.1'
    comment:
      en: 'HV battery state of health, resistance-based'
      fr: 'État de santé de la batterie HT, basé sur la résistance'
      es: 'Estado de salud de la batería de alta tensión, basado en la resistencia'
      de: 'Alterungszustand (SOH) der HV-Batterie, widerstandsbasiert'
      it: 'Stato di salute della batteria HT, basato sulla resistenza'
      pl: 'Stan zdrowia akumulatora wysokiego napięcia, na podstawie rezystancji'
      ru: 'Состояние работоспособности (SOH) ВВ батареи по сопротивлению'
      zh: '基于内阻的高压电池健康状态(SOH)'
      hu: 'A nagyfeszültségű akkumulátor állapota (SOH), ellenállás alapján'
      pt: 'Estado de saúde da bateria de alta tensão, baseado na resistência'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0x7F

