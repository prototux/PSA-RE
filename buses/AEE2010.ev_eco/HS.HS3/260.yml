id: 0x260
name: 'VEHICLE_PERSONALIZATION_STATUS_2'
type: 'can'
length: 8
comment:
  en: 'Personalization profile information used by the vehicle, defined by the profile message structure.'
  fr: 'Informations de profils de personnalisation à utiliser par le véhicule, définies par la structure du message profils.'
  es: 'Información de perfiles de personalización utilizada por el vehículo, definida por la estructura del mensaje de perfiles.'
  de: 'Vom Fahrzeug verwendete Personalisierungsprofilinformationen, definiert durch die Struktur der Profilnachricht.'
  it: 'Informazioni sui profili di personalizzazione utilizzati dal veicolo, definite dalla struttura del messaggio profili.'
  pl: 'Informacje profili personalizacji używane przez pojazd, zdefiniowane przez strukturę komunikatu profili.'
  ru: 'Информация профилей персонализации, используемых автомобилем, определяемая структурой сообщения профилей.'
  zh: '车辆使用的个性化配置文件信息，由配置文件消息结构定义。'
  hu: 'A jármű által használt személyre szabási profilinformációk, a profilüzenet szerkezete határozza meg.'
  pt: 'Informação de perfil de personalização utilizada pelo veículo, definida pela estrutura da mensagem de perfil.'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['BSRF']

