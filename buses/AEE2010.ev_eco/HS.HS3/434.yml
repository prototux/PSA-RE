id: 0x434
name: 'HV_BATTERY_MANAGEMENT_DATA_2'
type: 'can'
length: 8
comment:
  en: 'HV battery management data: engine auto-stop authorisation, warning-lamp reset command and request, climate-control inhibition, engine action request, and battery state of charge/state of health.'
  fr: 'Données de gestion batterie HT : autorisation d''arrêt automatique moteur, commande et demande de remise à zéro du voyant, inhibition climatisation, demande d''action moteur, et état de charge/état de santé de la batterie.'
  es: 'Datos de gestión de batería de alta tensión: autorización de parada automática del motor, comando y solicitud de reinicio del testigo, inhibición de la climatización, solicitud de acción del motor, y estado de carga/estado de salud de la batería.'
  de: 'Hochvoltbatterie-Managementdaten: Freigabe des automatischen Motorstopps, Rücksetzbefehl und -anforderung der Kontrollleuchte, Klimaanlagensperre, Motoraktionsanforderung sowie Ladezustand/Alterungszustand der Batterie.'
  it: 'Dati di gestione batteria AT: autorizzazione arresto automatico motore, comando e richiesta di reset spia, inibizione climatizzazione, richiesta di azione motore, e stato di carica/stato di salute della batteria.'
  pl: 'Dane zarządzania akumulatorem WN: autoryzacja automatycznego zatrzymania silnika, polecenie i żądanie kasowania kontrolki, blokada klimatyzacji, żądanie działania silnika oraz stan naładowania/stan zdrowia akumulatora.'
  ru: 'Данные управления высоковольтной батареей: разрешение автоматической остановки двигателя, команда и запрос сброса индикатора, блокировка кондиционера, запрос действия двигателя, а также уровень заряда/состояние батареи.'
  zh: '高压电池管理数据:发动机自动停止授权、警示灯复位命令和请求、空调抑制、发动机动作请求,以及电池充电状态/健康状态。'
  hu: 'Nagyfeszültségű akkumulátor kezelési adatok: motor automatikus leállásának engedélyezése, jelzőlámpa visszaállítási parancs és kérés, klíma letiltása, motorművelet kérése, valamint az akkumulátor töltöttségi/állapotszintje.'
  pt: 'Dados de gestão da bateria de alta tensão: autorização de paragem automática do motor, comando e pedido de reposição da luz avisadora, inibição da climatização, pedido de ação do motor, e estado de carga/estado de saúde da bateria.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BSRF']

signals:
  TIME_HV_BATT_HIGH_VOLTAGE:
    bits: '1.7-2.3'
    comment:
      en: 'Cumulative time the HV battery has spent at high voltage'
      fr: 'Durée cumulée pendant laquelle la batterie HT est restée en surtension'
      es: 'Tiempo acumulado en el que la batería de alta tensión ha estado en sobretensión'
      de: 'Kumulierte Zeit, in der die HV-Batterie bei hoher Spannung war'
      it: 'Tempo cumulativo in cui la batteria HT è rimasta ad alta tensione'
      pl: 'Łączny czas, przez jaki akumulator wysokiego napięcia był pod wysokim napięciem'
      ru: 'Суммарное время, в течение которого ВВ батарея находилась при высоком напряжении'
      zh: '高压电池处于高电压状态的累计时间'
      hu: 'Az az összesített idő, amíg a nagyfeszültségű akkumulátor magas feszültségen volt'
      pt: 'Tempo acumulado em que a bateria de alta tensão esteve em sobretensão'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 600
    units: 'h'
    invalid: 0x1FFF

  TIME_HV_BATT_HIGH_TEMP_HIGH_SOC:
    bits: '2.2-4.6'
    comment:
      en: 'Cumulative time the HV battery has spent at high temperature with high state of charge'
      fr: 'Durée cumulée pendant laquelle la batterie HT est restée à température élevée avec un état de charge élevé'
      es: 'Tiempo acumulado en el que la batería de alta tensión ha estado a temperatura alta con un estado de carga alto'
      de: 'Kumulierte Zeit, in der die HV-Batterie bei hoher Temperatur und hohem Ladezustand war'
      it: 'Tempo cumulativo in cui la batteria HT è rimasta ad alta temperatura con stato di carica elevato'
      pl: 'Łączny czas, przez jaki akumulator wysokiego napięcia był w wysokiej temperaturze przy wysokim stanie naładowania'
      ru: 'Суммарное время, в течение которого ВВ батарея находилась при высокой температуре и высоком уровне заряда'
      zh: '高压电池处于高温高荷电状态的累计时间'
      hu: 'Az az összesített idő, amíg a nagyfeszültségű akkumulátor magas hőmérsékleten és magas töltöttségi szinten volt'
      pt: 'Tempo acumulado em que a bateria de alta tensão esteve a temperatura elevada com um estado de carga elevado'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 600
    units: 'h'
    invalid: 0x1FFF

  TIME_HV_BATT_HIGH_TEMP_LOW_SOC:
    bits: '4.5-5.1'
    comment:
      en: 'Cumulative time the HV battery has spent at high temperature with low state of charge'
      fr: 'Durée cumulée pendant laquelle la batterie HT est restée à température élevée avec un état de charge faible'
      es: 'Tiempo acumulado en el que la batería de alta tensión ha estado a temperatura alta con un estado de carga bajo'
      de: 'Kumulierte Zeit, in der die HV-Batterie bei hoher Temperatur und niedrigem Ladezustand war'
      it: 'Tempo cumulativo in cui la batteria HT è rimasta ad alta temperatura con stato di carica basso'
      pl: 'Łączny czas, przez jaki akumulator wysokiego napięcia był w wysokiej temperaturze przy niskim stanie naładowania'
      ru: 'Суммарное время, в течение которого ВВ батарея находилась при высокой температуре и низком уровне заряда'
      zh: '高压电池处于高温低荷电状态的累计时间'
      hu: 'Az az összesített idő, amíg a nagyfeszültségű akkumulátor magas hőmérsékleten és alacsony töltöttségi szinten volt'
      pt: 'Tempo acumulado em que a bateria de alta tensão esteve a temperatura elevada com um estado de carga baixo'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 600
    units: 'h'
    invalid: 0x1FFF

  HV_BATTERY_TOTAL_NEGATIVE_CURRENT_AH:
    bits: '6.7-7.4'
    comment:
      en: 'Total negative (discharge) current quantity of the plug-in HV battery'
      fr: 'Quantité totale de courant négatif (décharge) de la batterie HT plug-in'
      es: 'Cantidad total de corriente negativa (descarga) de la batería de alta tensión plug-in'
      de: 'Gesamtmenge des negativen (Entlade-)Stroms der Plug-in-Hochvoltbatterie'
      it: 'Quantità totale di corrente negativa (scarica) della batteria plug-in ad alta tensione'
      pl: 'Całkowita ilość prądu ujemnego (rozładowania) akumulatora wysokiego napięcia plug-in'
      ru: 'Общее количество отрицательного тока (разряда) плагин-гибридной высоковольтной батареи'
      zh: '插电式高压电池负电流(放电)总量'
      hu: 'A plug-in nagyfeszültségű akkumulátor negatív (kisütési) áram összmennyisége'
      pt: 'Quantidade total de corrente negativa (descarga) da bateria de alta tensão plug-in'
    type: 'uint'
    factor: 125
    min: 0
    max: 500000
    units: 'Ah'
    invalid: 0xFFF

  TOTAL_HV_BATT_NEGATIVE_ENERGY_PLUGIN:
    bits: '7.3-8.0'
    comment:
      en: 'Total energy discharged from the HV battery since the last plug-in charge'
      fr: 'Énergie totale déchargée par la batterie HT depuis la dernière charge par prise'
      es: 'Energía total descargada de la batería de alta tensión desde la última carga por enchufe'
      de: 'Gesamte von der HV-Batterie abgegebene Energie seit der letzten Ladung über die Steckdose'
      it: 'Energia totale scaricata dalla batteria HT dall''ultima ricarica tramite presa'
      pl: 'Całkowita energia rozładowana z akumulatora wysokiego napięcia od ostatniego ładowania z gniazda'
      ru: 'Суммарная энергия, отданная ВВ батареей с момента последней зарядки от сети'
      zh: '自上次插电充电以来高压电池累计放电能量'
      hu: 'A nagyfeszültségű akkumulátorból leadott összes energia az utolsó hálózati töltés óta'
      pt: 'Energia total descarregada pela bateria de alta tensão desde a última carga por tomada'
    type: 'uint'
    factor: 35
    min: 0
    max: 140000
    units: 'kWh'
    invalid: 0xFFF
