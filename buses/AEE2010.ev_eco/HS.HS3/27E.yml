id: 0x27E
name: 'BRAKE_ECU_STATUS'
type: 'can'
length: 3
comment:
  en: 'Brake ECU status: tyre-pressure monitoring and wheel indicator states, brake pressure sensor state and space-saver spare wheel detection'
  fr: 'État du calculateur de freinage : indicateurs de surveillance de pression des pneus et des roues, état du capteur de pression de freinage et détection de roue de secours galette'
  es: 'Estado de la centralita de frenos: indicadores de supervisión de presión de neumáticos y ruedas, estado del sensor de presión de frenado y detección de rueda de repuesto de emergencia'
  de: 'Status des Bremsensteuergeräts: Reifendrucküberwachungs- und Radindikatoren, Zustand des Bremsdrucksensors und Erkennung eines Notrads'
  it: 'Stato della centralina freni: indicatori di monitoraggio pressione pneumatici e ruote, stato del sensore di pressione freni e rilevamento ruotino di scorta'
  pl: 'Stan sterownika hamulców: wskaźniki monitorowania ciśnienia w oponach i kołach, stan czujnika ciśnienia hamowania i wykrycie koła zapasowego dojazdowego'
  ru: 'Состояние блока управления тормозами: индикаторы контроля давления в шинах и колёсах, состояние датчика давления торможения и обнаружение докатки'
  zh: '制动ECU状态:胎压与车轮监测指示、制动压力传感器状态及应急备胎检测'
  hu: 'A fékvezérlő egység állapota: gumiabroncsnyomás-figyelő és kerékjelző állapotok, féknyomásérzékelő állapota és pótkerék (defektjavító kerék) érzékelése'
  pt: 'Estado da ECU dos travões: estados de monitorização da pressão dos pneus e dos indicadores de roda, estado do sensor de pressão de travagem e deteção da roda sobresselente compacta.'
periodicity: ['300ms']
senders: ['BSI']
receivers: ['BSRF']

