id: 0x350
name: 'CSS_SUSPENSION_STATUS'
type: 'can'
length: 8
comment:
  en: 'Front air conditioning status: heated windscreen/rear window activation, blower fault, air distribution, A/C request and front seat heating/ventilation requests.'
  fr: 'État de la climatisation avant : activation lunette/pare-brise chauffant, défaut pulseur, distribution d''air, demande de climatisation et demandes de chauffage/ventilation des sièges avant.'
  es: 'Estado de la climatización delantera: activación de luneta/parabrisas calefactado, fallo de ventilador, distribución de aire, solicitud de A/C y solicitudes de calefacción/ventilación de los asientos delanteros.'
  de: 'Status der vorderen Klimaanlage: Aktivierung Heckscheiben-/Frontscheibenheizung, Gebläsefehler, Luftverteilung, Klimaanforderung und Anforderungen für Sitzheizung/-belüftung vorne.'
  it: 'Stato del climatizzatore anteriore: attivazione lunotto/parabrezza riscaldato, guasto ventola, distribuzione dell''aria, richiesta A/C e richieste di riscaldamento/ventilazione dei sedili anteriori.'
  pl: 'Stan klimatyzacji przedniej: aktywacja ogrzewanej szyby tylnej/przedniej, usterka dmuchawy, dystrybucja powietrza, żądanie klimatyzacji i żądania ogrzewania/wentylacji przednich foteli.'
  ru: 'Статус переднего климат-контроля: активация обогрева заднего/лобового стекла, неисправность вентилятора, распределение воздуха, запрос кондиционера и запросы подогрева/вентиляции передних сидений.'
  zh: '前排空调状态:后/前挡风玻璃加热激活、风扇故障、气流分配、空调请求及前排座椅加热/通风请求。'
  hu: 'Az első klíma állapota: hátsó/első fűthető szélvédő aktiválása, ventilátorhiba, légelosztás, klímakérés és első ülésfűtés/-szellőztetés kérései.'
  pt: 'Estado da climatização dianteira: ativação do para-brisas/vidro traseiro aquecido, avaria do ventilador, distribuição de ar, pedido de ar condicionado e pedidos de aquecimento/ventilação dos bancos dianteiros.'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['BSRF']

