id: 0x3AD
name: 'EASY_MOVE_BVH2_DATA'
type: 'can'
length: 8
comment:
  en: 'Ozone (O3) air quality value received from an online service.'
  fr: 'Valeur d''ozone (O3) de la qualité de l''air reçue d''un service en ligne.'
  es: 'Valor de ozono (O3) de calidad del aire recibido de un servicio en línea.'
  de: 'Ozonwert (O3) der Luftqualität, von einem Online-Dienst empfangen.'
  it: 'Valore dell''ozono (O3) della qualità dell''aria ricevuto da un servizio online.'
  pl: 'Wartość ozonu (O3) jakości powietrza otrzymywana z usługi internetowej.'
  ru: 'Значение озона (O3) качества воздуха, полученное от онлайн-сервиса.'
  zh: '从在线服务获取的空气质量臭氧（O3）数值。'
  hu: 'Online szolgáltatástól kapott ózon (O3) levegőminőségi érték.'
  pt: 'Valor de qualidade do ar do ozono (O3) recebido de um serviço online.'
periodicity: ['1000ms']
senders: ['BSRF']
receivers: ['BSI']

signals:
  O3_CONCENTRATION_ONLINE:
    bits: '1.7-2.5'
    comment:
      en: 'O3 (ozone) concentration, from online data'
      fr: 'Concentration de O3 (ozone), depuis les données en ligne'
      es: 'Concentración de O3 (ozono), procedente de datos en línea'
      de: 'O3-Konzentration (Ozon), aus Online-Daten'
      it: 'Concentrazione di O3 (ozono), da dati online'
      pl: 'Stężenie O3 (ozonu), z danych online'
      ru: 'Концентрация O3 (озона), из онлайн-данных'
      zh: '臭氧(O3)浓度,来自在线数据'
      hu: 'O3 (ózon) koncentráció, online adatokból'
      pt: 'Concentração de O3 (ozono), a partir de dados em linha'
    type: 'uint'
    factor: 1
    min: 0
    max: 1208
    units: 'µg/m3'
    invalid: 0x7FF

  UNUSED_1:
    bits: '2.4-2.0'
    unused: true

  UNUSED_2:
    bits: '3.7-3.0'
    unused: true
