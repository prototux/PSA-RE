id: 0x2D4
name: 'REMOTE_ACTION_MONITORING_STATUS'
type: 'can'
length: 2
comment:
  en: 'Alarm and immobiliser monitoring status, including unauthorised start and break-in notifications.'
  fr: 'État de surveillance alarme et antidémarrage, incluant les notifications de démarrage non autorisé et d''effraction.'
  es: 'Estado de supervision de alarma e inmovilizador, incluidas las notificaciones de arranque no autorizado e intrusión.'
  de: 'Überwachungsstatus von Alarmanlage und Wegfahrsperre, einschließlich Meldungen zu unbefugtem Start und Einbruch.'
  it: 'Stato di monitoraggio allarme e immobilizzatore, incluse le notifiche di avviamento non autorizzato ed effrazione.'
  pl: 'Stan nadzoru alarmu i immobilizera, w tym powiadomienia o nieautoryzowanym uruchomieniu i wlamaniu.'
  ru: 'Статус контроля сигнализации и иммобилайзера, включая уведомления о несанкционированном пуске и взломе.'
  zh: '报警器及防盗锁定的监控状态,包括未授权启动及非法闯入通知。'
  hu: 'A riasztó és az indításgátló felügyeleti állapota, ideértve az illetéktelen indítási és betörési értesítéseket.'
  pt: 'Estado de supervisão do alarme e do imobilizador, incluindo notificações de arranque não autorizado e de intrusão.'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['BSRF']

