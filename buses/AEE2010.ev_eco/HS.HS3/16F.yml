  COOLING_SYSTEM_PRESSURE_2:
    bits: '7.7-7.0'
    comment:
      en: 'Cooling system pressure, sensor 2'
      fr: 'Pression du circuit de refroidissement, capteur 2'
      es: 'Presión del circuito de refrigeración, sensor 2'
      de: 'Kühlkreislaufdruck, Sensor 2'
      it: 'Pressione del circuito di raffreddamento, sensore 2'
      pl: 'Ciśnienie w układzie chłodzenia, czujnik 2'
