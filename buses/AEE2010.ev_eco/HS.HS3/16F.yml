    comment:
      en: 'Torque setpoint requested in the gearbox-engine torque dialog'
      fr: 'Consigne de couple demandée dans le dialogue de couple boîte-moteur'
      es: 'Consigna de par solicitada en el diálogo de par caja-motor'
      de: 'Angeforderter Drehmomentsollwert im Getriebe-Motor-Drehmomentdialog'
      it: 'Consegna di coppia richiesta nel dialogo di coppia cambio-motore'
      pl: 'Zadana wartość momentu żądana w dialogu momentu skrzynia-silnik'
      ru: 'Заданное значение момента, запрашиваемое в диалоге момент коробка-двигатель'
      zh: '变速箱-发动机扭矩对话中请求的扭矩设定值'
      hu: 'A váltó-motor nyomatékdialógusban kért nyomaték-alapjel'
      pt: 'Consigna de binário solicitada no diálogo de binário caixa-motor'
    type: 'uint'
