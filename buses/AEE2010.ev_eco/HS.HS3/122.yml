id: 0x122
name: 'MULTIPLEXED_BUTTONS_STATUS_2'
type: 'can'
length: 8
comment:
  en: 'Multiplexed push-button panel status: individual button states, scroll-wheel counters and ESP button.'
  fr: 'État du panneau de boutons multiplexés : états des différents boutons, compteurs de molette et bouton ESP.'
  es: 'Estado del panel de botones multiplexados: estados de los distintos botones, contadores de rueda y botón ESP.'
  de: 'Status des multiplexten Tastenfelds: Einzeltastenstatus, Scrollrad-Zähler und ESP-Taste.'
  it: 'Stato del pannello pulsanti multiplexati: stati dei singoli pulsanti, contatori rotella ed pulsante ESP.'
  pl: 'Stan multipleksowanego panelu przycisków: stany poszczególnych przycisków, liczniki pokrętła i przycisk ESP.'
  ru: 'Статус мультиплексированной панели кнопок: состояния отдельных кнопок, счётчики колеса прокрутки и кнопка ESP.'
  zh: '多路复用按钮面板状态:各按钮状态、滚轮计数器及ESP按钮。'
  hu: 'A multiplexelt nyomógombos panel állapota: egyedi gombállapotok, görgőszámlálók és ESP gomb.'
  pt: 'Estado do painel de botões multiplexado: estados individuais dos botões, contadores da roda de deslocamento e botão ESP.'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['BSRF']

signals:
  PANEL_KEY_1_PRESSED:
    bits: '1.7'
    comment:
      en: 'Press status of key 1 on the multiplexed front panel'
      fr: 'Etat d''appui de la touche 1 de la façade multiplexée'
      es: 'Estado de pulsación de la tecla 1 del panel frontal multiplexado'
      de: 'Tastenzustand der Taste 1 der multiplexierten Bedienblende'
      it: 'Stato di pressione del tasto 1 del pannello frontale multiplexato'
      pl: 'Stan naciśnięcia przycisku 1 multipleksowanego panelu przedniego'
      ru: 'Состояние нажатия кнопки 1 мультиплексированной передней панели'
      zh: '多路复用前面板按键1的按下状态'
      hu: 'A multiplexelt előlap 1. gombjának megnyomási állapota'
      pt: 'Estado de pressão da tecla 1 no painel frontal multiplexado'
    type: 'bool'
    values:
      0x00:
        en: 'Released'
        fr: 'Relache'
        es: 'Liberado'
        de: 'Losgelassen'
        it: 'Rilasciato'
        pl: 'Zwolnione'
        ru: 'Отпущено'
        zh: '已释放'
        hu: 'Elengedve'
        pt: 'Libertado'
      0x01:
        en: 'Pressed'
        fr: 'Appuyé'
        es: 'Pulsado'
        de: 'Gedrückt'
        it: 'Premuto'
        pl: 'Naciśnięty'
        ru: 'Нажато'
        zh: '已按下'
        hu: 'Megnyomva'
