id: 0x33E
name: 'BSRF_COMMAND_8'
type: 'can'
length: 8
comment:
  en: 'Intake air and fuel temperatures, sent by the BSI to the telematics gateway.'
  fr: 'Températures d''air d''admission et de carburant, envoyées par la BSI à la passerelle télématique.'
  es: 'Temperaturas del aire de admisión y del combustible, enviadas por la BSI a la pasarela telemática.'
  de: 'Ansaugluft- und Kraftstofftemperaturen, von der BSI an das Telematik-Gateway gesendet.'
  it: 'Temperature dell''aria di aspirazione e del carburante, inviate dalla BSI al gateway telematico.'
  pl: 'Temperatury powietrza dolotowego i paliwa, wysyłane przez BSI do bramki telematycznej.'
  ru: 'Температура впускного воздуха и топлива, отправляемая BSI в телематический шлюз.'
  zh: '进气温度和燃油温度，由BSI发送给远程信息处理网关。'
  hu: 'A szívólevegő és az üzemanyag hőmérséklete, a BSI küldi a telematikai átjárónak.'
  pt: 'Temperaturas do ar de admissão e do combustível, enviadas pela BSI ao gateway telemático.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BSRF']

signals:
  INTAKE_AIR_TEMPERATURE:
    bits: '1.7-1.0'
    comment:
      en: 'Intake air temperature sensor, on the throttle body or air flow meter (°C)'
      fr: 'Température de l''air d''admission, mesurée sur le boîtier papillon ou le débitmètre (°C)'
      es: 'Temperatura del aire de admisión, medida en el cuerpo de mariposa o el caudalímetro (°C)'
      de: 'Ansauglufttemperatur, gemessen am Drosselklappengehäuse oder Luftmassenmesser (°C)'
      it: 'Temperatura dell''aria di aspirazione, misurata sul corpo farfallato o sul debimetro (°C)'
      pl: 'Temperatura powietrza dolotowego, mierzona na przepustnicy lub przepływomierzu (°C)'
      ru: 'Температура впускного воздуха, измеренная на дроссельном узле или расходомере (°C)'
      zh: '进气温度,测量自节气门体或空气流量计(°C)'
      hu: 'A beszívott levegő hőmérséklete, a fojtószelepházon vagy a légtömegmérőn mérve (°C)'
      pt: 'Sensor de temperatura do ar de admissão, na borboleta ou no medidor de caudal (°C)'
    type: 'uint'
    factor: 1
    offset: -40
    min: -40
    max: 214
    units: '°C'
    invalid: 0xFF

  FUEL_TEMPERATURE:
    bits: '2.7-2.0'
    comment:
      en: 'Fuel temperature'
      fr: 'Température du carburant'
      es: 'Temperatura del combustible'
      de: 'Kraftstofftemperatur'
      it: 'Temperatura del carburante'
      pl: 'Temperatura paliwa'
      ru: 'Температура топлива'
      zh: '燃油温度'
      hu: 'Üzemanyag-hőmérséklet'
      pt: 'Temperatura do combustível'
    type: 'uint'
    factor: 1
    offset: -40
    min: -40
    max: 214
    units: '°C'
    invalid: 0xFF
