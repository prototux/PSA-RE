id: 0x1D1
name: 'SECURE_CLOCK_UPDATE_REQUEST'
type: 'can'
length: 6
comment:
  en: 'Request to update the secure clock (day, hour, minute, month, second, year), sent by the telematics gateway.'
  fr: 'Demande de mise à jour de l''horloge sécurisée (jour, heure, minute, mois, seconde, année), envoyée par la passerelle télématique.'
  es: 'Solicitud de actualización del reloj seguro (día, hora, minuto, mes, segundo, año), enviada por la pasarela telemática.'
  de: 'Anforderung zur Aktualisierung der gesicherten Uhr (Tag, Stunde, Minute, Monat, Sekunde, Jahr), gesendet vom Telematik-Gateway.'
  it: 'Richiesta di aggiornamento dell''orologio sicuro (giorno, ora, minuto, mese, secondo, anno), inviata dal gateway telematico.'
  pl: 'Żądanie aktualizacji zabezpieczonego zegara (dzień, godzina, minuta, miesiąc, sekunda, rok), wysyłane przez bramkę telematyczną.'
  ru: 'Запрос обновления защищённых часов (день, час, минута, месяц, секунда, год), отправляемый телематическим шлюзом.'
  zh: '由远程信息处理网关发送的安全时钟更新请求（日、时、分、月、秒、年）。'
  hu: 'A biztonságos óra frissítési kérése (nap, óra, perc, hónap, másodperc, év), a telematikai átjáró küldi.'
  pt: 'Pedido de atualização do relógio seguro (dia, hora, minuto, mês, segundo, ano), enviado pelo gateway telemático.'
periodicity: ['trigger']
senders: ['BSRF']
receivers: ['BSI']

signals:
  UNUSED_1:
    bits: '1.7-1.6'
    unused: true

  CLOCK_RESYNC_SECOND_FIELD:
    bits: '1.5-1.0'
    comment:
      en: 'Second field of the clock resynchronization request'
      fr: 'Champ seconde de la demande de resynchronisation de l''horloge'
      es: 'Campo segundo de la solicitud de resincronización del reloj'
      de: 'Sekundenfeld der Uhr-Resynchronisationsanforderung'
      it: 'Campo secondo della richiesta di risincronizzazione dell''orologio'
      pl: 'Pole sekundy żądania resynchronizacji zegara'
      ru: 'Поле секунды в запросе ресинхронизации часов'
      zh: '时钟重新同步请求中的“秒”字段'
      hu: 'Az óra-újraszinkronizálási kérés másodperc mezője'
      pt: 'Campo segundo do pedido de ressincronização do relógio'
    type: 'uint'
    min: 0
    max: 59
    invalid: 0x3F

  CLOCK_RESYNC_MINUTE_FIELD:
    bits: '2.5-2.0'
    comment:
      en: 'Minute field of the clock resynchronization request'
      fr: 'Champ minute de la demande de resynchronisation de l''horloge'
      es: 'Campo minuto de la solicitud de resincronización del reloj'
