      de: 'Verfügbarkeitsstatus der ferngesteuerten Lade-Programmierfunktion'
      it: 'Stato di disponibilità della funzione di programmazione della ricarica remota'
      pl: 'Stan dostępności funkcji zdalnego programowania ładowania'
      ru: 'Статус доступности функции дистанционного программирования зарядки'
      zh: '远程充电计划功能的可用性状态'
      hu: 'A távoli töltésütemezési funkció elérhetőségi állapota'
      pt: 'Estado de disponibilidade da função de programação de carregamento remoto'
