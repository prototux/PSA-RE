id: 0x35B
name: 'CHARGE_PROGRAM_SCREEN_REMOTE'
type: 'can'
length: 2
comment:
  en: 'Charge programming screen requests from the remote app: energy target, start time and charge type.'
  fr: 'Demandes de l''écran de programmation de recharge depuis l''application distante : énergie cible, heure de départ et type de recharge.'
  es: 'Solicitudes de la pantalla de programación de carga desde la aplicación remota: energía objetivo, hora de inicio y tipo de carga.'
  de: 'Anforderungen des Ladeprogrammierbildschirms über die Fernbedienungs-App: Energieziel, Startzeit und Ladeart.'
  it: 'Richieste della schermata di programmazione della ricarica dall''app remota: energia obiettivo, ora di inizio e tipo di ricarica.'
  pl: 'Żądania z ekranu programowania ładowania z aplikacji zdalnej: docelowa energia, godzina rozpoczęcia i typ ładowania.'
  ru: 'Запросы экрана программирования зарядки из удалённого приложения: целевая энергия, время начала и тип зарядки.'
  zh: '通过远程应用发出的充电编程屏幕请求:目标电量、开始时间和充电类型。'
  hu: 'A töltésprogramozási képernyő kérései a távoli alkalmazásból: célenergia, kezdési időpont és töltéstípus.'
  pt: 'Pedidos do ecrã de programação de carregamento, a partir da aplicação remota: objetivo de energia, hora de início e tipo de carregamento.'
periodicity: ['trigger']
senders: ['BSRF']
receivers: ['BSI']

