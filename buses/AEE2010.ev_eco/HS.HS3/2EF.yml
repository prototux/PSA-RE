id: 0x2EF
name: 'BSRF_COMMAND_6'
type: 'can'
length: 8
comment:
  en: 'Additive low level alert, red fault lamp request, idle regulation setpoint, brake switches, driver resume request, Easy Move fault, engine load-shedding, water-in-diesel alert and ESP disconnection, sent by the BSI to the telematics gateway.'
  fr: 'Alerte niveau bas d''additif, demande de voyant rouge défaut, consigne de régulation de ralenti, contacts de frein, demande de reprise conducteur, défaut Easy Move, délestage moteur, alerte eau dans le gazole et déconnexion ESP, envoyés par la BSI à la passerelle télématique.'
  es: 'Alerta de nivel bajo de aditivo, solicitud de testigo rojo de fallo, consigna de regulación de ralentí, contactos de freno, solicitud de reanudación del conductor, fallo Easy Move, deslastre del motor, alerta de agua en el gasóleo y desconexión ESP, enviados por la BSI a la pasarela telemática.'
  de: 'Warnung bei niedrigem Additivstand, Anforderung der roten Fehlerlampe, Leerlaufregelungs-Sollwert, Bremskontakte, Fahrerwiederaufnahmeanforderung, Easy-Move-Fehler, Motorlastabwurf, Wasser-im-Diesel-Warnung und ESP-Trennung, von der BSI an das Telematik-Gateway gesendet.'
  it: 'Allarme livello basso additivo, richiesta spia rossa guasto, setpoint di regolazione del minimo, contatti freno, richiesta di ripresa conducente, guasto Easy Move, distacco carico motore, allarme acqua nel gasolio e disconnessione ESP, inviati dalla BSI al gateway telematico.'
  pl: 'Alarm niskiego poziomu dodatku, żądanie czerwonej lampki usterki, zadana regulacja biegu jałowego, styki hamulca, żądanie wznowienia przez kierowcę, usterka Easy Move, zrzut obciążenia silnika, alarm wody w oleju napędowym i odłączenie ESP, wysyłane przez BSI do bramki telematycznej.'
  ru: 'Предупреждение о низком уровне присадки, запрос красной лампы неисправности, заданное значение регулировки холостого хода, контакты тормоза, запрос возобновления движения водителем, неисправность Easy Move, сброс нагрузки двигателя, предупреждение о воде в дизтопливе и отключение ESP, отправляемые BSI в телематический шлюз.'
  zh: '添加剂液位过低警报、红色故障灯请求、怠速调节设定值、刹车开关、驾驶员恢复请求、Easy Move故障、发动机负载脱扣、柴油含水警报及ESP断开，由BSI发送给远程信息处理网关。'
  hu: 'Adalékanyag-alacsonyszint riasztás, piros hibalámpa-kérés, alapjárat-szabályozási alapjel, fékkapcsolók, vezetői folytatási kérés, Easy Move hiba, motortehermentesítés, gázolaj-vizesedés riasztás és ESP-leválás, a BSI küldi a telematikai átjárónak.'
  pt: 'Alerta de nível baixo do aditivo, pedido de luz avisadora vermelha de avaria, ponto de ajuste de regulação do ralenti, interruptores de travão, pedido de retoma do condutor, avaria do Easy Move, corte de carga do motor, alerta de água no gasóleo e desativação do ESP, enviados pela BSI ao gateway telemático.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BSRF']

