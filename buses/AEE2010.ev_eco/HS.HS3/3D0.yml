id: 0x3D0
name: 'REAR_AIR_CONDITIONING_STATUS'
type: 'can'
length: 6
comment:
  en: 'Rear air conditioning display status: fault, air distribution, off mode and blower speed.'
  fr: 'État d''affichage de la climatisation arrière : défaut, distribution d''air, mode arrêt et vitesse de pulseur.'
  es: 'Estado de visualización de la climatización trasera: fallo, distribución de aire, modo apagado y velocidad de ventilador.'
  de: 'Anzeigestatus der hinteren Klimaanlage: Fehler, Luftverteilung, Aus-Modus und Gebläsedrehzahl.'
  it: 'Stato di visualizzazione del climatizzatore posteriore: guasto, distribuzione dell''aria, modalità off e velocità ventola.'
  pl: 'Stan wyświetlania klimatyzacji tylnej: usterka, dystrybucja powietrza, tryb wyłączenia i prędkość dmuchawy.'
  ru: 'Статус дисплея заднего климат-контроля: неисправность, распределение воздуха, режим выключения и скорость вентилятора.'
  zh: '后排空调显示状态:故障、气流分配、关闭模式及风扇速度。'
  hu: 'A hátsó klíma kijelzési állapota: hiba, légelosztás, kikapcsolt mód és ventilátorsebesség.'
  pt: 'Estado de apresentação da climatização traseira: avaria, distribuição de ar, modo desligado e velocidade do ventilador.'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['BSRF']

