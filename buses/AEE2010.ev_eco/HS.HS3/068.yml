id: 0x068
name: 'HYBRID_ZEV_DISTANCE'
type: 'can'
length: 8
comment:
  en: 'Corrected zero-emission distance and percentage for the current and previous two trips, relayed on the inter-system bus.'
  fr: 'Distance et pourcentage en zéro émission corrigés pour le trajet en cours et les deux précédents, relayés sur le bus inter-système.'
  es: 'Distancia y porcentaje en cero emisiones corregidos para el trayecto actual y los dos anteriores, retransmitidos en el bus intersistema.'
  de: 'Korrigierte emissionsfreie Strecke und Prozentsatz für die aktuelle und die letzten zwei Fahrten, weitergeleitet auf dem Inter-System-Bus.'
  it: 'Distanza e percentuale a zero emissioni corrette per il tragitto in corso e i due precedenti, inoltrate sul bus inter-sistema.'
  pl: 'Skorygowany dystans i procent trybu zeroemisyjnego dla bieżącej i dwóch poprzednich podróży, przekazywane na magistrali międzysystemowej.'
  ru: 'Скорректированное расстояние и процент нулевых выбросов для текущей и двух предыдущих поездок, ретранслируемые в межсистемной шине.'
  zh: '在系统间总线上转发的当前及前两次行程的零排放修正距离及百分比。'
  hu: 'A jelenlegi és az előző két útra vonatkozó korrigált zéró kibocsátású távolság és százalék, a rendszerközi buszon továbbítva.'
  pt: 'Distância e percentagem em zero emissões corrigidas para o trajeto atual e os dois anteriores, retransmitidas no barramento intersistema.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BSRF']

signals:
  ZEV_DISTANCE_PERCENT_CURRENT_TRIP_ADJUSTED:
    bits: '1.7-1.1'
    comment:
      en: 'Adjusted percentage of distance covered in ZEV mode for the current trip'
      fr: 'Pourcentage corrigé de la distance parcourue en mode ZEV pour le trajet en cours'
      es: 'Porcentaje corregido de la distancia recorrida en modo ZEV para el trayecto actual'
      de: 'Angepasster Prozentsatz der im ZEV-Modus zurückgelegten Strecke der aktuellen Fahrt'
      it: 'Percentuale corretta della distanza percorsa in modalità ZEV per il percorso in corso'
      pl: 'Skorygowany procent dystansu przejechanego w trybie ZEV dla bieżącej trasy'
      ru: 'Скорректированный процент расстояния в режиме ZEV для текущей поездки'
      zh: '当前行程ZEV模式行驶距离的修正百分比'
      hu: 'A jelenlegi út ZEV módban megtett távolságának korrigált százaléka'
      pt: 'Percentagem corrigida da distância percorrida em modo ZEV para o trajeto atual'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0x7F

  ZEV_DISTANCE_PERCENT_CURRENT_TRIP:
    bits: '1.0-2.2'
    comment:
      en: 'Percentage of distance covered in ZEV mode relative to the total distance of the current trip'
      fr: 'Pourcentage de la distance parcourue en mode ZEV par rapport à la distance totale du trajet en cours'
      es: 'Porcentaje de la distancia recorrida en modo ZEV respecto a la distancia total del trayecto actual'
      de: 'Prozentsatz der im ZEV-Modus zurückgelegten Strecke bezogen auf die Gesamtstrecke der aktuellen Fahrt'
      it: 'Percentuale della distanza percorsa in modalità ZEV rispetto alla distanza totale del percorso in corso'
      pl: 'Procent dystansu przejechanego w trybie ZEV w stosunku do całkowitego dystansu bieżącej trasy'
      ru: 'Процент расстояния в режиме ZEV относительно общего расстояния текущей поездки'
      zh: 'ZEV模式行驶距离占当前行程总距离的百分比'
      hu: 'A ZEV módban megtett távolság százaléka a jelenlegi út teljes távolságához viszonyítva'
      pt: 'Percentagem da distância percorrida em modo ZEV em relação à distância total do trajeto atual'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0x7F

