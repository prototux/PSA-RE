id: 0x394
name: 'HV_BATTERY_POWER_DATA'
type: 'can'
length: 1
comment:
  en: 'Remote-control request (2nd generation): charging data request or lock/unlock.'
  fr: 'Requête de commande à distance (2e génération) : demande de données de charge ou verrouillage/déverrouillage.'
  es: 'Solicitud de mando a distancia (2a generación): solicitud de datos de carga o bloqueo/desbloqueo.'
  de: 'Fernbedienungsanforderung (2. Generation): Ladedatenanforderung oder Ver-/Entriegelung.'
  it: 'Richiesta di comando remoto (2a generazione): richiesta dati di ricarica o blocco/sblocco.'
  pl: 'Zadanie zdalnego sterowania (2. generacja): zadanie danych ladowania lub blokowanie/odblokowanie.'
  ru: 'Запрос дистанционного управления (2-е поколение): запрос данных зарядки или блокировка/разблокировка.'
  zh: '远程控制请求(第2代):充电数据请求或上锁/解锁。'
  hu: 'Távvezérlési kérés (2. generáció): töltési adat kérés vagy zárás/nyitás.'
  pt: 'Pedido de comando à distância (2.ª geração): pedido de dados de carga ou bloqueio/desbloqueio.'
periodicity: ['trigger']
senders: ['BSRF']
receivers: ['BSI']

