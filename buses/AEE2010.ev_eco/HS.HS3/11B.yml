id: 0x11B
name: 'BEBA_VERSION'
type: 'can'
length: 7
comment:
  en: 'Climate preconditioning weekly programming screen requests from the remote app (part 2).'
  fr: 'Demandes de l''écran de programmation hebdomadaire du préconditionnement climatique depuis l''application distante (partie 2).'
  es: 'Solicitudes de la pantalla de programación semanal del preacondicionamiento climático desde la aplicación remota (parte 2).'
  de: 'Anforderungen des Bildschirms zur wöchentlichen Programmierung der Klima-Vorkonditionierung über die Fernbedienungs-App (Teil 2).'
  it: 'Richieste della schermata di programmazione settimanale del precondizionamento climatico dall''app remota (parte 2).'
  pl: 'Żądania z ekranu tygodniowego programowania klimatyzacji wstępnej z aplikacji zdalnej (część 2).'
  ru: 'Запросы экрана еженедельного программирования предварительного кондиционирования из удалённого приложения (часть 2).'
  zh: '通过远程应用发出的空调预调节每周编程屏幕请求(第2部分)。'
  hu: 'A klíma-előkondicionálás heti programozási képernyőjének kérései a távoli alkalmazásból (2. rész).'
  pt: 'Pedidos do ecrã de programação semanal do pré-condicionamento da climatização, a partir da aplicação remota (parte 2).'
periodicity: ['trigger']
senders: ['BSRF']
receivers: ['BSI']

signals:
  UNUSED_1:
    bits: '1.7-1.0'
    unused: true

  CLIMATE_PRECOND_REMOTE_SLOT3_ENABLED:
    bits: '2.7'
    comment:
      en: 'Remote thermal preconditioning schedule 3 enabled'
      fr: 'Activation à distance du créneau 3 de préconditionnement thermique'
      es: 'Activación remota del intervalo 3 de preacondicionamiento térmico'
      de: 'Fernaktivierung des Zeitfensters 3 der thermischen Vorkonditionierung'
      it: 'Attivazione remota dell''intervallo 3 di precondizionamento termico'
      pl: 'Zdalna aktywacja przedziału 3 wstępnej klimatyzacji'
      ru: 'Дистанционная активация интервала 3 термической предподготовки'
      zh: '远程启用第3个热预处理时段'
      hu: 'A(z) 3. távoli hőelőkészítési időablak aktiválása'
      pt: 'Ativação remota do intervalo 3 de pré-condicionamento térmico'
    type: 'bool'
