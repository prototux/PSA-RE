id: 0x37E
name: 'BSRF_COMMAND_10'
type: 'can'
length: 8
comment:
  en: 'Fuel flap eject request and reset-all-parameters request, sent by the BSI to the telematics gateway.'
  fr: 'Demande d''éjection de la trappe à carburant et demande de réinitialisation de tous les paramètres, envoyées par la BSI à la passerelle télématique.'
  es: 'Solicitud de expulsión de la trampilla de combustible y solicitud de reinicio de todos los parámetros, enviadas por la BSI a la pasarela telemática.'
  de: 'Anforderung zum Ausklinken der Tankklappe und Anforderung zum Zurücksetzen aller Parameter, von der BSI an das Telematik-Gateway gesendet.'
  it: 'Richiesta di espulsione dello sportello carburante e richiesta di reset di tutti i parametri, inviate dalla BSI al gateway telematico.'
  pl: 'Żądanie wysunięcia klapki wlewu paliwa i żądanie zresetowania wszystkich parametrów, wysyłane przez BSI do bramki telematycznej.'
  ru: 'Запрос открытия лючка топливного бака и запрос сброса всех параметров, отправляемые BSI в телематический шлюз.'
  zh: '燃油盖弹出请求及所有参数重置请求，由BSI发送给远程信息处理网关。'
  hu: 'Az üzemanyagtöltő-fedél kiugratási kérése és az összes paraméter visszaállítási kérése, a BSI küldi a telematikai átjárónak.'
  pt: 'Pedido de ejeção da tampa do depósito e pedido de reposição de todos os parâmetros, enviados pela BSI ao gateway telemático.'
periodicity: ['100ms']
senders: ['BSI']
receivers: ['BSRF']

signals:
  FUEL_DOOR_PUSH_REQUEST:
    bits: '2.7'
    comment:
      en: 'Fuel filler door push button pressed'
      fr: 'Bouton-poussoir de la trappe à carburant enfoncé'
      es: 'Botón de la trampilla de combustible pulsado'
      de: 'Taster der Tankklappe gedrückt'
      it: 'Pulsante dello sportello del serbatoio premuto'
      pl: 'Naciśnięcie przycisku klapki wlewu paliwa'
      ru: 'Нажата кнопка лючка топливного бака'
      zh: '油箱盖按钮已按下'
      hu: 'Az üzemanyag-betöltő ajtó nyomógombja megnyomva'
      pt: 'Botão da tampa de combustível premido'
    type: 'bool'
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
        en: 'Eject request'
        fr: 'Demande d''éjection'
        es: 'Solicitud de expulsión'
        de: 'Auswurfanforderung'
        it: 'Richiesta di espulsione'
        pl: 'Żądanie wysunięcia'
        ru: 'Запрос извлечения'
        zh: '弹出请求'
        hu: 'Kiadási kérés'
        pt: 'Pedido de ejeção'

  ALL_PARAMETERS_RESET_REQUEST:
    bits: '2.6'
    comment:
      en: 'Request to reset all parameters'
      fr: 'Demande de réinitialisation de tous les paramètres'
      es: 'Solicitud de reinicio de todos los parámetros'
      de: 'Anforderung zum Zurücksetzen aller Parameter'
      it: 'Richiesta di reset di tutti i parametri'
      pl: 'Żądanie zresetowania wszystkich parametrów'
      ru: 'Запрос сброса всех параметров'
      zh: '重置所有参数的请求'
      hu: 'Az összes paraméter visszaállításának kérése'
      pt: 'Pedido de reinício de todos os parâmetros'
    type: 'bool'
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
        en: 'Requested'
        fr: 'Demandé'
        es: 'Solicitado'
        de: 'Angefordert'
        it: 'Richiesto'
        pl: 'Żądane'
        ru: 'Запрошено'
        zh: '已请求'
        hu: 'Kérve'
        pt: 'Pedido'
