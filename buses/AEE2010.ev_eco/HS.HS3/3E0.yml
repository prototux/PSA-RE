id: 0x3E0
name: 'HYBRID_INFO'
type: 'can'
length: 8
comment:
  en: 'Hybrid battery state of charge and cumulative electric-driving time counters.'
  fr: 'État de charge de la batterie hybride et compteurs de temps cumulé en conduite électrique.'
  es: 'Estado de carga de la batería híbrida y contadores de tiempo acumulado en conducción eléctrica.'
  de: 'Ladezustand der Hybridbatterie und kumulierte Zähler der Elektrofahrzeit.'
  it: 'Stato di carica della batteria ibrida e contatori del tempo cumulato in guida elettrica.'
  pl: 'Stan naładowania akumulatora hybrydowego i liczniki skumulowanego czasu jazdy elektrycznej.'
  ru: 'Уровень заряда гибридной батареи и счётчики накопленного времени езды на электротяге.'
  zh: '混合动力电池荷电状态及累计纯电行驶时间计数。'
  hu: 'A hibrid akkumulátor töltöttségi állapota és a felhalmozott elektromos vezetési idő számlálói.'
  pt: 'Estado de carga da bateria híbrida e contadores de tempo acumulado em condução elétrica.'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['BSRF']

signals:
  BATTERY_STATUS:
    bits: '1.7-1.0'
    comment:
      en: 'Battery state of charge'
      fr: 'État de charge de la batterie'
      es: 'Estado de carga de la batería'
      de: 'Batterieladezustand'
      it: 'Stato di carica della batteria'
      pl: 'Stan naładowania akumulatora'
      ru: 'Уровень заряда батареи'
      zh: '电池充电状态'
      hu: 'Az akkumulátor töltöttségi állapota'
      pt: 'Estado de carga da bateria'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0x7F

  AVERAGE_FUEL_CONSUMPTION_1:
    bits: '2.7-2.0'
    comment:
      en: 'Average fuel consumption, memory 1'
      fr: 'Consommation moyenne, mémoire 1'
      es: 'Consumo medio, memoria 1'
      de: 'Durchschnittsverbrauch, Speicher 1'
      it: 'Consumo medio, memoria 1'
      pl: 'Średnie zużycie paliwa, pamięć 1'
      ru: 'Средний расход топлива, память 1'
      zh: '平均油耗,记忆位1'
      hu: 'Átlagfogyasztás, 1. memória'
