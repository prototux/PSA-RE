id: 0x160
name: 'CHARGING_SCHEDULE'
type: 'can'
length: 2
comment:
  en: 'Battery charging schedule profile information, defined by the profile message structure.'
  fr: 'Informations de profil de programmation de la recharge batterie, définies par la structure du message profils.'
  es: 'Información de perfil de programación de la recarga de la batería, definida por la estructura del mensaje de perfiles.'
  de: 'Profilinformationen zur Batterieladeprogrammierung, definiert durch die Struktur der Profilnachricht.'
  it: 'Informazioni di profilo di programmazione della ricarica batteria, definite dalla struttura del messaggio profili.'
  pl: 'Informacje profilu harmonogramu ładowania akumulatora, zdefiniowane przez strukturę komunikatu profili.'
  ru: 'Информация профиля расписания зарядки батареи, определяемая структурой сообщения профилей.'
  zh: '电池充电排程配置文件信息，由配置文件消息结构定义。'
  hu: 'Az akkumulátortöltés-ütemezés profiladatai, a profilüzenet szerkezete határozza meg.'
  pt: 'Informação de perfil de programação de carregamento da bateria, definida pela estrutura da mensagem de perfil.'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['BSRF']

signals:
  CHARGE_SCHEDULE_STATUS_AVAILABILITY:
    bits: '1.7'
    comment:
      en: 'Availability of the charging schedule status information'
      fr: 'Disponibilité de l''information d''état du programme de recharge'
      es: 'Disponibilidad de la información de estado del programa de recarga'
      de: 'Verfügbarkeit der Statusinformation des Ladeprogramms'
      it: 'Disponibilità dell''informazione di stato del programma di ricarica'
      pl: 'Dostępność informacji o stanie programu ładowania'
      ru: 'Доступность информации о состоянии программы зарядки'
      zh: '充电程序状态信息的可用性'
      hu: 'A töltési program állapotinformációjának elérhetősége'
      pt: 'Disponibilidade da informação de estado do programa de carregamento'
    type: 'bool'
    values:
      0x00:
        en: 'Unavailable'
        fr: 'Indisponible'
        es: 'No disponible'
        de: 'Nicht verfügbar'
        it: 'Non disponibile'
        pl: 'Niedostępne'
        ru: 'Недоступно'
        zh: '不可用'
        hu: 'Nem elérhető'
        pt: 'Indisponível'
      0x01:
        en: 'Available'
        fr: 'Disponible'
        es: 'Disponible'
        de: 'Verfügbar'
        it: 'Disponibile'
        pl: 'Dostępne'
        ru: 'Доступно'
        zh: '可用'
        hu: 'Elérhető'
        pt: 'Disponível'

  CHARGE_TYPE_MENU_STATUS:
    bits: '1.6'
    comment:
      en: 'Memorized charging type menu status (immediate or deferred)'
      fr: 'État mémorisé du menu type de recharge (immédiate ou différée)'
      es: 'Estado memorizado del menú de tipo de recarga (inmediata o diferida)'
      de: 'Gespeicherter Status des Lademodus-Menüs (sofort oder verzögert)'
      it: 'Stato memorizzato del menu tipo di ricarica (immediata o differita)'
      pl: 'Zapamiętany stan menu typu ładowania (natychmiastowe lub opóźnione)'
      ru: 'Сохранённое состояние меню типа зарядки (немедленная или отложенная)'
      zh: '充电类型菜单的已存储状态（立即或延迟）'
      hu: 'A töltéstípus menü tárolt állapota (azonnali vagy késleltetett)'
      pt: 'Estado memorizado do menu de tipo de carregamento (imediato ou diferido)'
    type: 'bool'
