      fr: 'Heure de départ mémorisée du programme de recharge, en minutes depuis minuit'
      es: 'Hora de inicio memorizada del programa de recarga, en minutos desde medianoche'
      de: 'Gespeicherte Startzeit des Ladeprogramms, in Minuten seit Mitternacht'
      it: 'Ora di avvio memorizzata del programma di ricarica, in minuti dalla mezzanotte'
      pl: 'Zapamiętana godzina rozpoczęcia programu ładowania, w minutach od północy'
      ru: 'Сохранённое время начала программы зарядки, в минутах от полуночи'
      zh: '充电程序的已存储起始时间（自午夜起的分钟数）'
      hu: 'A töltési program tárolt indítási ideje, éjféltől számított percben'
