id: 0x2DA
name: 'GSM_NETWORK_CLOCK'
type: 'can'
length: 5
comment:
  en: 'Date and time received from the mobile network, sent by the keyless-entry RF security box (BSRF) which hosts the GSM modem.'
  fr: 'Date et heure reçues du réseau mobile, envoyées par le boîtier de sécurité radiofréquence (BSRF) qui héberge le modem GSM.'
  es: 'Fecha y hora recibidas de la red móvil, enviadas por la caja de seguridad de radiofrecuencia (BSRF) que aloja el módem GSM.'
  de: 'Von Mobilfunknetz empfangenes Datum/Uhrzeit, gesendet von der Funksicherheitsbox (BSRF), die das GSM-Modem enthält.'
  it: 'Data e ora ricevute dalla rete mobile, inviate dalla centralina di sicurezza a radiofrequenza (BSRF) che ospita il modem GSM.'
  pl: 'Data i godzina odebrane z sieci komórkowej, wysyłane przez skrzynkę bezpieczeństwa RF (BSRF), w której znajduje się modem GSM.'
  ru: 'Дата и время, полученные из мобильной сети, отправляемые радиочастотным блоком безопасности (BSRF), содержащим GSM-модем.'
  zh: '从移动网络获取的日期和时间,由内置GSM模块的无钥匙进入射频安全盒(BSRF)发送。'
  hu: 'A mobilhálózatból kapott dátum és idő, amelyet a GSM-modemet tartalmazó rádiófrekvenciás biztonsági egység (BSRF) küld.'
  pt: 'Data e hora recebidas da rede móvel, enviadas pela caixa de segurança de radiofrequência de acesso sem chave (BSRF), que aloja o modem GSM.'
periodicity: ['trigger']
senders: ['BSRF']
receivers: ['BSI']

signals:
  GSM_CLOCK_YEAR:
    bits: '1.7-1.1'
    comment:
      en: 'External GSM clock: year'
      fr: 'Horloge externe GSM : année'
      es: 'Reloj externo GSM: año'
      de: 'Externe GSM-Uhr: Jahr'
      it: 'Orologio esterno GSM: anno'
      pl: 'Zewnętrzny zegar GSM: rok'
      ru: 'Внешние часы GSM: год'
      zh: '外部GSM时钟:年'
      hu: 'Külső GSM óra: év'
      pt: 'Relógio GSM externo: ano'
    type: 'uint'
    factor: 1.02
    min: 2000
    max: 2125
    units: 'year'
    invalid: 0x7F

  GSM_CLOCK_MONTH:
    bits: '1.0-2.5'
    comment:
      en: 'External GSM clock: month'
      fr: 'Horloge externe GSM : mois'
      es: 'Reloj externo GSM: mes'
      de: 'Externe GSM-Uhr: Monat'
      it: 'Orologio esterno GSM: mese'
      pl: 'Zewnętrzny zegar GSM: miesiąc'
      ru: 'Внешние часы GSM: месяц'
      zh: '外部GSM时钟:月'
      hu: 'Külső GSM óra: hónap'
      pt: 'Relógio GSM externo: mês'
    type: 'uint'
    factor: 1.01
    min: 1
    max: 12
    units: 'month'
    invalid: 0x0F

  GSM_CLOCK_DAY:
    bits: '2.4-2.0'
    comment:
      en: 'External GSM clock: day'
      fr: 'Horloge externe GSM : jour'
      es: 'Reloj externo GSM: día'
      de: 'Externe GSM-Uhr: Tag'
      it: 'Orologio esterno GSM: giorno'
      pl: 'Zewnętrzny zegar GSM: dzień'
      ru: 'Внешние часы GSM: день'
      zh: '外部GSM时钟:日'
      hu: 'Külső GSM óra: nap'
      pt: 'Relógio GSM externo: dia'
    type: 'uint'
    factor: 1.01
    min: 1
    max: 31
    units: 'day'

  GSM_CLOCK_HOUR:
    bits: '3.7-3.3'
    comment:
      en: 'External GSM clock: hour'
      fr: 'Horloge externe GSM : heure'
      es: 'Reloj externo GSM: hora'
      de: 'Externe GSM-Uhr: Stunde'
      it: 'Orologio esterno GSM: ora'
      pl: 'Zewnętrzny zegar GSM: godzina'
      ru: 'Внешние часы GSM: час'
      zh: '外部GSM时钟:时'
      hu: 'Külső GSM óra: óra'
      pt: 'Relógio GSM externo: hora'
    type: 'uint'
    factor: 1
    min: 0
    max: 23
    units: 'h'
    invalid: 0x1F

  GSM_CLOCK_MINUTE:
