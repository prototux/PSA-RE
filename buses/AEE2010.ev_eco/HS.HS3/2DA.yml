      zh: '外部GSM时钟:分'
      hu: 'Külső GSM óra: perc'
      pt: 'Relógio GSM externo: minuto'
    type: 'uint'
    factor: 1
    min: 0
    max: 59
    units: 'min'
    invalid: 0x3F

  GSM_CLOCK_SECOND:
    bits: '4.4-5.7'
    comment:
      en: 'External GSM clock: second'
      fr: 'Horloge externe GSM : seconde'
      es: 'Reloj externo GSM: segundo'
      de: 'Externe GSM-Uhr: Sekunde'
      it: 'Orologio esterno GSM: secondo'
      pl: 'Zewnętrzny zegar GSM: sekunda'
      ru: 'Внешние часы GSM: секунда'
      zh: '外部GSM时钟:秒'
      hu: 'Külső GSM óra: másodperc'
      pt: 'Relógio GSM externo: segundo'
    type: 'uint'
    factor: 1
    min: 0
    max: 59
    units: 's'
    invalid: 0x3F

