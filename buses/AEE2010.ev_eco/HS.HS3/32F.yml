id: 0x32F
name: 'BSRF_COMMAND_7'
type: 'can'
length: 8
comment:
  en: 'Parking validation request, alarm push acknowledgement, locks in progress, automatic low beam command, brake light command and cruise control fault, sent by the BSI to the telematics gateway.'
  fr: 'Demande de validation de stationnement, acquittement du push alarme, verrouillages en cours, commande automatique des feux de croisement, commande feu stop et défaut régulateur, envoyés par la BSI à la passerelle télématique.'
  es: 'Solicitud de validación de aparcamiento, acuse de recibo del botón de alarma, bloqueos en curso, orden automática de luces de cruce, orden de luz de freno y fallo del regulador, enviados por la BSI a la pasarela telemática.'
  de: 'Parkbestätigungsanforderung, Bestätigung der Alarmtaste, laufende Verriegelungen, automatischer Abblendlichtbefehl, Bremslichtbefehl und Tempomatfehler, von der BSI an das Telematik-Gateway gesendet.'
  it: 'Richiesta di convalida del parcheggio, conferma del pulsante allarme, chiusure in corso, comando automatico anabbaglianti, comando luce stop e guasto regolatore, inviati dalla BSI al gateway telematico.'
  pl: 'Żądanie zatwierdzenia parkowania, potwierdzenie przycisku alarmu, trwające blokowanie, automatyczne polecenie świateł mijania, polecenie światła stop i usterka tempomatu, wysyłane przez BSI do bramki telematycznej.'
  ru: 'Запрос подтверждения парковки, подтверждение кнопки сигнализации, идёт блокировка, автоматическая команда ближнего света, команда стоп-сигнала и неисправность круиз-контроля, отправляемые BSI в телематический шлюз.'
  zh: '泊车确认请求、报警按钮确认、正在锁止、自动近光灯命令、刹车灯命令及巡航控制故障，由BSI发送给远程信息处理网关。'
  hu: 'Parkolás-jóváhagyási kérés, riasztó nyomógomb nyugtázása, folyamatban lévő zárás, automatikus tompított fény parancs, féklámpaparancs és sebességtartó-hiba, a BSI küldi a telematikai átjárónak.'
  pt: 'Pedido de validação de estacionamento, confirmação de pressão do alarme, trancagem em curso, comando automático dos médios, comando da luz de travagem e avaria do regulador de velocidade, enviados pela BSI ao gateway telemático.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BSRF']

