id: 0x2BE
name: 'BSRF_COMMAND_5'
type: 'can'
length: 8
comment:
  en: 'Parking validation request, low water level alert, low/high beam faults, driver camera failure, LKA push button, hybrid powertrain state and average HV battery temperature, sent by the BSI to the telematics gateway.'
  fr: 'Demande de validation de stationnement, alerte niveau d''eau bas, défauts feux de croisement/route, défaillance caméra conducteur, bouton LKA et état de la chaîne de traction hybride et température moyenne batterie HT, envoyés par la BSI à la passerelle télématique.'
  es: 'Solicitud de validación de aparcamiento, alerta de nivel de agua bajo, fallos de luces de cruce/carretera, fallo de la cámara del conductor, botón LKA, estado de la cadena de tracción híbrida y temperatura media de la batería de alta tensión, enviados por la BSI a la pasarela telemática.'
  de: 'Parkbestätigungsanforderung, Warnung bei niedrigem Wasserstand, Abblend-/Fernlichtfehler, Fahrerkamera-Ausfall, LKA-Taster, Zustand des Hybridantriebs und mittlere HV-Batterietemperatur, von der BSI an das Telematik-Gateway gesendet.'
  it: 'Richiesta di convalida del parcheggio, allarme livello acqua basso, guasti anabbaglianti/abbaglianti, guasto della telecamera conducente, pulsante LKA, stato della catena di trazione ibrida e temperatura media della batteria AT, inviati dalla BSI al gateway telematico.'
  pl: 'Żądanie zatwierdzenia parkowania, alarm niskiego poziomu wody, usterki świateł mijania/drogowych, awaria kamery kierowcy, przycisk LKA, stan hybrydowego układu napędowego i średnia temperatura akumulatora WN, wysyłane przez BSI do bramki telematycznej.'
  ru: 'Запрос подтверждения парковки, предупреждение о низком уровне воды, неисправности ближнего/дальнего света, отказ камеры водителя, кнопка LKA, состояние гибридной силовой установки и средняя температура высоковольтной батареи, отправляемые BSI в телематический шлюз.'
  zh: '泊车确认请求、水位过低警报、近光/远光灯故障、驾驶员摄像头故障、车道保持辅助按钮、混合动力总成状态及高压电池平均温度，由BSI发送给远程信息处理网关。'
  hu: 'Parkolás-jóváhagyási kérés, alacsony vízszint-riasztás, tompított/távolsági fény hibák, vezetőkamera-meghibásodás, LKA nyomógomb, a hibrid hajtáslánc állapota és a nagyfeszültségű akkumulátor átlaghőmérséklete, a BSI küldi a telematikai átjárónak.'
  pt: 'Pedido de validação de estacionamento, alerta de nível baixo de água, avarias de médios/máximos, falha da câmara do condutor, botão LKA, estado do grupo motopropulsor híbrido e temperatura média da bateria de alta tensão, enviados pela BSI ao gateway telemático.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BSRF']

