id: 0x1EF
name: 'BSRF_COMMAND_4'
type: 'can'
length: 8
comment:
  en: 'Battery current range, resistive torque, braking-in-progress flag, battery currents and state of charge, sent by the BSI to the telematics gateway.'
  fr: 'Calibre de courant batterie, couple résistant, indicateur de freinage en cours, courants batterie et état de charge, envoyés par la BSI à la passerelle télématique.'
  es: 'Rango de corriente de la batería, par resistente, indicador de frenado en curso, corrientes de la batería y estado de carga, enviados por la BSI a la pasarela telemática.'
  de: 'Batteriestrombereich, Widerstandsmoment, Bremsung-in-Gang-Flag, Batterieströme und Ladezustand, von der BSI an das Telematik-Gateway gesendet.'
  it: 'Intervallo di corrente della batteria, coppia resistente, indicatore di frenata in corso, correnti della batteria e stato di carica, inviati dalla BSI al gateway telematico.'
  pl: 'Zakres prądu akumulatora, moment oporowy, flaga trwającego hamowania, prądy akumulatora i stan naładowania, wysyłane przez BSI do bramki telematycznej.'
  ru: 'Диапазон тока батареи, момент сопротивления, флаг активного торможения, токи батареи и состояние заряда, отправляемые BSI в телематический шлюз.'
  zh: '电池电流范围、阻力矩、制动进行中标志、电池电流及荷电状态，由BSI发送给远程信息处理网关。'
  hu: 'Akkumulátoráram-tartomány, ellenállási nyomaték, fékezés-folyamatban jelző, akkumulátoráramok és töltöttségi állapot, a BSI küldi a telematikai átjárónak.'
  pt: 'Gama de corrente da bateria, binário resistivo, indicador de travagem em curso, correntes da bateria e estado de carga, enviados pela BSI ao gateway telemático.'
periodicity: ['100ms']
senders: ['BSI']
receivers: ['BSRF']

