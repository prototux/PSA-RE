      es: 'Distancia absoluta recorrida por el vehículo (coincide con el valor mostrado al conductor)'
      de: 'Absolut zurückgelegte Strecke des Fahrzeugs (entspricht dem dem Fahrer angezeigten Wert)'
      it: 'Distanza assoluta percorsa dal veicolo (corrisponde al valore mostrato al conducente)'
