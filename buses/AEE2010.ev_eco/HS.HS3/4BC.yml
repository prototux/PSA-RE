id: 0x4BC
name: 'DIAGNOSTIC_SOCKET_FAULT_EVENT'
type: 'can'
length: 8
comment:
  en: 'Keyless-entry radio-frequency security box: fault event, logged in the BSI fault log.'
  fr: 'Boîtier de sécurité radiofréquence (mains libres) : événement défaut, enregistré dans le journal des défauts du BSI.'
  es: 'Caja de seguridad de radiofrecuencia (manos libres): evento de fallo, registrado en el registro de fallos de la BSI.'
  de: 'Funksicherheitsbox (Keyless) – Fehlerereignis, im Fehlerspeicher (Fehlerprotokoll) des BSI vermerkt.'
  it: 'Centralina di sicurezza a radiofrequenza (keyless): evento di guasto, registrato nel registro guasti della BSI.'
  pl: 'Skrzynka bezpieczeństwa RF (bezkluczykowa) – zdarzenie usterki, zapisywane w dzienniku usterek BSI.'
  ru: 'Блок радиочастотной безопасности (бесключевой доступ) — событие неисправности, регистрируется в журнале неисправностей BSI.'
  zh: '无钥匙进入射频安全盒——故障事件,记录在BSI故障日志中。'
  hu: 'Rádiófrekvenciás biztonsági egység (kulcs nélküli) – hibaesemény, amelyet a BSI hibanaplójába rögzítenek.'
  pt: 'Caixa de segurança de radiofrequência de acesso sem chave: evento de avaria, registado no registo de avarias da BSI.'
periodicity: ['trigger']
senders: ['BSRF']
receivers: ['BSI']

