  DTC_STATUS:
    bits: '1.3'
    comment:
      en: 'Fault status transition (to/from permanent)'
      fr: 'Transition d''état du défaut (vers/depuis permanent)'
      es: 'Transición del estado del fallo (hacia/desde permanente)'
      de: 'Statusübergang des Fehlers (zu/von permanent)'
      it: 'Transizione dello stato del guasto (verso/da permanente)'
      pl: 'Zmiana stanu usterki (na/z trwałej)'
      ru: 'Переход состояния неисправности (в постоянное/из постоянного)'
      zh: '故障状态转换(转为/转出永久性)'
      hu: 'A hibaállapot átmenete (állandósulásba/-ból)'
      pt: 'Transição do estado da falha (para/desde permanente)'
    type: 'bool'
    values:
      0x00:
        en: 'Transition from PERMANENT fault to INTERMITTENT fault (a previously confirmed failure is no longer detected)'
        fr: 'Passage de défaut PERMANENT à défaut FUGITIF (non-détection d''une défaillance auparavant confirmée)'
        es: 'Paso de fallo PERMANENTE a fallo INTERMITENTE (no detección de un fallo previamente confirmado)'
        de: 'Übergang von DAUERHAFTEM zu SPORADISCHEM Fehler (zuvor bestätigter Fehler wird nicht mehr erkannt)'
        it: 'Passaggio da guasto PERMANENTE a guasto INTERMITTENTE (mancato rilevamento di un guasto precedentemente confermato)'
        pl: 'Przejście z usterki TRWAŁEJ do usterki PRZEJŚCIOWEJ (brak wykrycia wcześniej potwierdzonej usterki)'
        ru: 'Переход от ПОСТОЯННОЙ неисправности к ПЕРЕМЕЖАЮЩЕЙСЯ (ранее подтверждённая неисправность больше не обнаруживается)'
        zh: '从永久性故障转为间歇性故障(此前确认的故障不再被检测到)'
        hu: 'Átmenet ÁLLANDÓ hibából ÁTMENETI hibába (korábban megerősített hiba már nem észlelhető)'
        pt: 'Transição de avaria PERMANENTE para avaria INTERMITENTE (uma falha anteriormente confirmada deixou de ser detetada)'
      0x01:
        en: 'Fault changed to permanent'
        fr: 'Passage du défaut à l''état permanent'
        es: 'Cambio del fallo a estado permanente'
        de: 'Übergang des Fehlers in den Zustand „permanent"'
        it: 'Passaggio del guasto allo stato permanente'
        pl: 'Przejście usterki w stan trwały'
        ru: 'Переход неисправности в постоянное состояние'
        zh: '故障转为永久状态'
        hu: 'A hiba állandósult állapotba váltása'
        pt: 'Mudança da falha para estado permanente'

