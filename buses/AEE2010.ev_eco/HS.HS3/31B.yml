id: 0x31B
name: 'CLIMATE_PRECOND_PROGRAM_SCREEN_REMOTE'
type: 'can'
length: 7
comment:
  en: 'Climate preconditioning weekly programming screen requests from the remote app (part 1).'
  fr: 'Demandes de l''écran de programmation hebdomadaire du préconditionnement climatique depuis l''application distante (partie 1).'
  es: 'Solicitudes de la pantalla de programación semanal del preacondicionamiento climático desde la aplicación remota (parte 1).'
  de: 'Anforderungen des Bildschirms zur wöchentlichen Programmierung der Klima-Vorkonditionierung über die Fernbedienungs-App (Teil 1).'
  it: 'Richieste della schermata di programmazione settimanale del precondizionamento climatico dall''app remota (parte 1).'
  pl: 'Żądania z ekranu tygodniowego programowania klimatyzacji wstępnej z aplikacji zdalnej (część 1).'
  ru: 'Запросы экрана еженедельного программирования предварительного кондиционирования из удалённого приложения (часть 1).'
  zh: '通过远程应用发出的空调预调节每周编程屏幕请求(第1部分)。'
  hu: 'A klíma-előkondicionálás heti programozási képernyőjének kérései a távoli alkalmazásból (1. rész).'
  pt: 'Pedidos do ecrã de programação semanal do pré-condicionamento da climatização, a partir da aplicação remota (parte 1).'
periodicity: ['trigger']
senders: ['BSRF']
receivers: ['BSI']

signals:
  CLIMATE_PRECOND_REMOTE_MENU_AVAILABILITY:
    bits: '1.7'
    comment:
      en: 'Information about the overall availability of the remote thermal preconditioning schedule menu'
      fr: 'Information sur la disponibilité globale du menu de programmation du préconditionnement thermique à distance'
      es: 'Información sobre la disponibilidad global del menú de programación remota del preacondicionamiento térmico'
      de: 'Information über die Gesamtverfügbarkeit des Menüs zur ferngesteuerten Programmierung der thermischen Vorkonditionierung'
      it: 'Informazione sulla disponibilità globale del menu di programmazione remota del precondizionamento termico'
      pl: 'Informacja o ogólnej dostępności menu zdalnego programowania wstępnej klimatyzacji'
      ru: 'Информация об общей доступности меню дистанционного программирования термической предподготовки'
      zh: '远程热预处理计划菜单总体可用性信息'
      hu: 'Információ a távoli hőelőkészítési ütemezési menü teljes elérhetőségéről'
      pt: 'Informação sobre a disponibilidade global do menu de programação do pré-condicionamento térmico remoto'
    type: 'bool'
    values:
      0x00:
        en: 'Unavailable'
        fr: 'Indisponible'
        es: 'No disponible'
        de: 'Nicht verfügbar'
        it: 'Non disponibile'
        pl: 'Niedostępne'
