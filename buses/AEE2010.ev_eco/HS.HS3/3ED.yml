  fr: 'Données de qualité de l''air (AQI, CO, NO2, PM10, PM2,5, SO2) reçues d''un service en ligne.'
  es: 'Datos de calidad del aire (AQI, CO, NO2, PM10, PM2,5, SO2) recibidos de un servicio en línea.'
