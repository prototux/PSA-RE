id: 0x4E7
name: 'HYBRID_VEHICLE_STOP_TIMER_2'
type: 'can'
length: 1
comment:
  en: 'Hybrid control unit engine coordination: start/stop requests, injection cut-off, deceleration and speed-regulation setpoint'
  fr: 'Coordination moteur par le calculateur hybride : demandes de démarrage/arrêt, coupure injection, décélération et consigne de régulation de régime'
  es: 'Coordinación del motor por la centralita híbrida: solicitudes de arranque/parada, corte de inyección, deceleración y consigna de regulación de régimen'
  de: 'Motorkoordination durch das Hybridsteuergerät: Start-/Stopp-Anforderungen, Einspritzabschaltung, Verzögerung und Drehzahlregelungs-Sollwert'
  it: 'Coordinamento motore da parte della centralina ibrida: richieste di avvio/arresto, taglio iniezione, decelerazione e valore di riferimento di regolazione regime'
  pl: 'Koordynacja silnika przez sterownik hybrydowy: żądania startu/zatrzymania, odcięcie wtrysku, hamowanie silnikiem i wartość zadana regulacji obrotów'
  ru: 'Координация двигателя гибридным блоком управления: запросы пуска/останова, отключение впрыска, замедление и уставка регулирования оборотов'
  zh: '混动控制单元的发动机协调:起停请求、喷油切断、减速及转速调节设定值'
  hu: 'A hibrid vezérlőegység motorkoordinációja: indítási/leállítási kérések, befecskendezés-lekapcsolás, lassítás és fordulatszám-szabályozási alapjel'
  pt: 'Coordenação do motor pela unidade de controlo híbrida: pedidos de arranque/paragem, corte de injeção, desaceleração e consigna de regulação de regime.'
periodicity: ['100ms']
senders: ['HCU1']
receivers: ['CMM']

signals:
  LAMBDA_SENSOR_HEATER_REQUEST:
    bits: '1.7'
    comment:
      en: 'Lambda sensor heater request.'
      fr: 'Demande de chauffage de la sonde lambda.'
      es: 'Solicitud de calentamiento de la sonda lambda.'
      de: 'Anforderung der Lambdasonden-Heizung.'
      it: 'Richiesta di riscaldamento della sonda lambda.'
      pl: 'Żądanie podgrzewania sondy lambda.'
      ru: 'Запрос подогрева лямбда-зонда.'
      zh: '氧传感器加热请求。'
      hu: 'A lambdaszonda-fűtés kérése.'
      pt: 'Pedido de aquecimento da sonda lambda'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
        en: 'Requested'
        fr: 'Demandé'
        es: 'Solicitado'
        de: 'Angefordert'
        it: 'Richiesto'
        pl: 'Żądane'
        ru: 'Запрошено'
        zh: '已请求'
        hu: 'Kérve'
        pt: 'Pedido'

  UNUSED_1:
    bits: '1.6-1.0'
    unused: true
