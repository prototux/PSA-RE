    type: 'uint'
    factor: 0.0625
    offset: -500
    min: -500
    max: 0
    units: 'Nm'
    invalid: 0x1FFF
    default: 0x1F40

  ENGINE_SPEED_CONTROLLER_MAX_TORQUE_LIMIT:
