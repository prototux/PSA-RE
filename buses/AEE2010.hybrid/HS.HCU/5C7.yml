id: 0x5C7
name: 'BSM_VERSION'
type: 'can'
length: 3
comment:
  en: 'Hybrid control data: time before vehicle stop.'
  fr: 'Données du contrôle hybride : temps avant arrêt du véhicule.'
  es: 'Datos del control híbrido: tiempo antes de la parada del vehículo.'
  de: 'Hybridsteuerungsdaten: Zeit bis zum Fahrzeugstillstand.'
  it: 'Dati del controllo ibrido: tempo prima dell''arresto del veicolo.'
  pl: 'Dane kontroli hybrydowej: czas do zatrzymania pojazdu.'
  ru: 'Данные гибридного управления: время до остановки автомобиля.'
  zh: '混合动力控制数据:车辆停止前的时间。'
  hu: 'Hibrid vezérlési adatok: a jármű megállásáig hátralévő idő.'
  pt: 'Dados de controlo híbrido: tempo até à paragem do veículo.'
periodicity: ['1000ms']
senders: ['HCU1']
receivers: ['HCU2']

signals:
  EPS_STOP_TIME:
    bits: '1.7-3.7'
    comment:
      en: 'Power steering (EPS) stop time (s)'
      fr: 'Temps d''arrêt de la direction assistée (EPS) (s)'
      es: 'Tiempo de parada de la dirección asistida (EPS) (s)'
      de: 'Abschaltzeit der Servolenkung (EPS) (s)'
      it: 'Tempo di arresto dello sterzo assistito (EPS) (s)'
      pl: 'Czas zatrzymania wspomagania kierownicy (EPS) (s)'
      ru: 'Время остановки усилителя руля (EPS) (с)'
      zh: '电动助力转向(EPS)停止时间(s)'
      hu: 'A szervokormány (EPS) leállási ideje (s)'
      pt: 'Tempo de paragem da direção assistida (EPS) (s)'
    type: 'uint'
    factor: 1
    min: 0
    max: 86399
    units: 's'
    default: 0x00

alternatives:
  - note:
      en: 'The content of this frame changes (multiplexed, selector not identified): other layout seen'
      fr: 'Le contenu de cette trame varie (multiplexée, sélecteur non identifié) : autre disposition observée'
      es: 'El contenido de esta trama varía (multiplexada, selector no identificado): otra disposición observada'
      de: 'Der Inhalt dieser Botschaft variiert (gemultiplext, Selektor nicht ermittelt): weitere beobachtete Belegung'
      it: 'Il contenuto di questo frame varia (multiplexato, selettore non identificato): altra disposizione osservata'
      pl: 'Zawartość tej ramki się zmienia (multipleksowana, selektor nieznany): inny zaobserwowany układ'
      ru: 'Содержимое этого кадра меняется (мультиплексирование, селектор не определён): другая наблюдаемая раскладка'
      zh: '此帧内容会变化（多路复用，未识别选择器）：观察到的另一种布局'
      hu: 'A keret tartalma változik (multiplexelt, a választó nem azonosított): másik megfigyelt elrendezés'
      pt: 'O conteúdo desta trama varia (multiplexada, seletor não identificado): outra disposição observada'
    signals:
      VEHICLE_STOP_TIME:
        bits: '1.7-3.7'
        comment:
          en: 'Vehicle stop duration (s)'
          fr: 'Durée d''arrêt du véhicule (s)'
          es: 'Duración de la parada del vehículo (s)'
          de: 'Stillstandsdauer des Fahrzeugs (s)'
          it: 'Durata di arresto del veicolo (s)'
          pl: 'Czas postoju pojazdu (s)'
          ru: 'Продолжительность остановки автомобиля (с)'
          zh: '车辆停止时长(s)'
          hu: 'A jármű állásidejének időtartama (s)'
          pt: 'Duração da paragem do veículo (s)'
        type: 'uint'
        factor: 1
        min: 0
        max: 86399
        units: 's'
        default: 0x00
