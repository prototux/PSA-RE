id: 0x247
name: 'HCU1_DYNAMIC_DATA_4'
type: 'can'
length: 7
comment:
  en: 'Front electric-motor torque and voltage setpoints, torque gradient limit and DC/DC converter mode, from the hybrid control unit.'
  fr: 'Consignes de couple et de tension du moteur électrique avant, limite de gradient de couple et mode du convertisseur DC/DC, issues du calculateur hybride.'
  es: 'Consignas de par y tensión del motor eléctrico delantero, límite de gradiente de par y modo del convertidor DC/DC, procedentes de la centralita híbrida.'
  de: 'Drehmoment- und Spannungs-Sollwerte des vorderen Elektromotors, Grenze des Drehmomentgradienten und DC/DC-Wandlermodus vom Hybridsteuergerät.'
  it: 'Valori richiesti di coppia e tensione del motore elettrico anteriore, limite del gradiente di coppia e modalità del convertitore DC/DC, dalla centralina ibrida.'
  pl: 'Zadane wartości momentu i napięcia przedniego silnika elektrycznego, ograniczenie gradientu momentu oraz tryb przetwornicy DC/DC z hybrydowego sterownika.'
  ru: 'Заданные значения крутящего момента и напряжения переднего электродвигателя, ограничение градиента момента и режим преобразователя DC/DC от гибридного блока управления.'
  zh: '前置电动机的扭矩和电压设定值、扭矩梯度限制及DC/DC变换器模式,来自混合动力控制单元。'
  hu: 'Az első elektromos motor nyomaték- és feszültség-alapjelei, a nyomatékgradiens határértéke, valamint a DC/DC átalakító üzemmódja a hibrid vezérlőegységtől.'
  pt: 'Pontos de ajuste de binário e tensão do motor elétrico dianteiro, limite de gradiente de binário e modo do conversor DC/DC, da unidade de controlo híbrida.'
periodicity: ['10ms']
senders: ['HCU1']
receivers: ['HCU2']

signals:
  PROCESS_COUNTER:
    bits: '1.7-1.4'
    comment:
      en: 'Rolling counter incremented at each calculation cycle'
      fr: 'Compteur cyclique incrémenté à chaque cycle de calcul'
      es: 'Contador cíclico incrementado en cada ciclo de cálculo'
      de: 'Zyklischer Zähler, der bei jedem Berechnungszyklus erhöht wird'
      it: 'Contatore ciclico incrementato a ogni ciclo di calcolo'
      pl: 'Licznik cykliczny zwiększany przy każdym cyklu obliczeń'
      ru: 'Циклический счётчик, увеличивающийся на каждом цикле расчёта'
      zh: '每个计算周期递增的循环计数器'
      hu: 'A számítási ciklus minden lépésekor növekvő ciklikus számláló'
      pt: 'Contador cíclico incrementado a cada ciclo de cálculo'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00

  EDTM_ESTIMATED_TORQUE:
    bits: '1.3-2.2'
    comment:
      en: 'Actual EDTM torque estimated by the level-2 safety supervisor'
      fr: 'Couple réel de l''EDTM estimé par le niveau 2 de sécurité'
      es: 'Par real de EDTM estimado por el supervisor de seguridad de nivel 2'
      de: 'Tatsächliches EDTM-Drehmoment, geschätzt von der Sicherheitsüberwachung Stufe 2'
      it: 'Coppia reale EDTM stimata dal supervisore di sicurezza di livello 2'
      pl: 'Rzeczywisty moment obrotowy EDTM szacowany przez nadzorcę bezpieczeństwa poziomu 2'
      ru: 'Фактический момент EDTM, оценённый супервизором безопасности уровня 2'
      zh: '二级安全监控器估算的EDTM实际扭矩'
      hu: 'A 2. szintű biztonsági felügyelő által becsült tényleges EDTM-nyomaték'
      pt: 'Binário real do EDTM estimado pelo supervisor de segurança de nível 2'
    type: 'uint'
    factor: 1
    offset: -500
    min: -500
    max: 500
    units: 'Nm'
    invalid: 0x3FF
    default: 0x1F4

  EDTM_MAX_PERMITTED_TORQUE:
    bits: '2.1-3.0'
    comment:
      en: 'EDTM maximum permitted torque, level-2 safety'
      fr: 'Couple maximum autorisé de l''EDTM, niveau 2 de sécurité'
      es: 'Par máximo permitido de EDTM, nivel de seguridad 2'
      de: 'Maximal zulässiges EDTM-Drehmoment, Sicherheitsstufe 2'
      it: 'Coppia massima consentita EDTM, sicurezza di livello 2'
      pl: 'Maksymalny dopuszczalny moment obrotowy EDTM, poziom bezpieczeństwa 2'
      ru: 'Максимально допустимый момент EDTM, уровень безопасности 2'
      zh: 'EDTM最大允许扭矩,2级安全'
      hu: 'Az EDTM maximálisan megengedett nyomatéka, 2. biztonsági szint'
      pt: 'Binário máximo permitido do EDTM, nível de segurança 2'
    type: 'uint'
    factor: 1
    offset: -500
    min: -500
    max: 500
    units: 'Nm'
    invalid: 0x3FF
    default: 0x1F4

  EDTM_MIN_PERMITTED_TORQUE:
    bits: '4.7-5.6'
    comment:
      en: 'EDTM minimum permitted torque, level-2 safety'
      fr: 'Couple minimum autorisé de l''EDTM, niveau 2 de sécurité'
      es: 'Par mínimo permitido de EDTM, nivel de seguridad 2'
      de: 'Minimal zulässiges EDTM-Drehmoment, Sicherheitsstufe 2'
      it: 'Coppia minima consentita EDTM, sicurezza di livello 2'
      pl: 'Minimalny dopuszczalny moment obrotowy EDTM, poziom bezpieczeństwa 2'
      ru: 'Минимально допустимый момент EDTM, уровень безопасности 2'
      zh: 'EDTM最小允许扭矩,2级安全'
      hu: 'Az EDTM minimálisan megengedett nyomatéka, 2. biztonsági szint'
      pt: 'Binário mínimo permitido do EDTM, nível de segurança 2'
    type: 'uint'
    factor: 1
    offset: -500
    min: -500
    max: 500
    units: 'Nm'
    invalid: 0x3FF
    default: 0x1F4

  HCU2_AKS_STATE_REQUEST:
