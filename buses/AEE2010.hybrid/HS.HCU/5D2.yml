id: 0x5D2
name: 'HYBRID_CONTROL_REQUESTS'
type: 'can'
length: 2
comment:
  en: 'Requests from the hybrid control unit: silent-vehicle sound activation, engine coolant heating, auxiliary battery power, eco-coach reset and fuel-flap eject authorisation.'
  fr: 'Demandes du calculateur hybride : activation du son véhicule silencieux, chauffage du liquide de refroidissement moteur, puissance batterie auxiliaire, remise à zéro eco-coach et autorisation d''éjection de la trappe à carburant.'
  es: 'Solicitudes de la unidad de control híbrido: activación del sonido de vehículo silencioso, calefacción del líquido refrigerante del motor, potencia de batería auxiliar, reinicio de eco-coach y autorización de expulsión de la trampilla de combustible.'
  de: 'Anforderungen des Hybrid-Steuergeräts: Aktivierung des Warngeräuschs für leise Fahrzeuge, Motorkühlmittelheizung, Hilfsbatterieleistung, Eco-Coach-Reset und Freigabe zum Ausstoßen der Tankklappe.'
  it: 'Richieste dell''unità di controllo ibrida: attivazione del suono veicolo silenzioso, riscaldamento del liquido di raffreddamento motore, potenza batteria ausiliaria, reset eco-coach e autorizzazione espulsione sportello carburante.'
  pl: 'Żądania z jednostki sterującej hybrydą: aktywacja dźwięku cichego pojazdu, podgrzewanie płynu chłodzącego silnika, moc akumulatora pomocniczego, reset eco-coach i autoryzacja wysunięcia klapki wlewu paliwa.'
  ru: 'Запросы от гибридного блока управления: активация звука для бесшумного автомобиля, подогрев охлаждающей жидкости двигателя, мощность вспомогательной батареи, сброс эко-тренера и разрешение на выброс лючка топливного бака.'
  zh: '混合动力控制单元的请求:静音车辆提示音激活、发动机冷却液加热、辅助电池功率、eco-coach复位以及油箱盖弹出授权。'
  hu: 'A hibrid vezérlőegység kérései: csendes jármű hangjelzés aktiválása, motor hűtőfolyadék fűtése, segédakkumulátor teljesítmény, eco-coach visszaállítás és üzemanyagtöltő fedél kiengedésének engedélyezése.'
  pt: 'Pedidos da unidade de controlo híbrida: ativação do som de veículo silencioso, aquecimento do líquido de arrefecimento do motor, alimentação da bateria auxiliar, reposição do eco-coach e autorização de ejeção da tampa do depósito.'
observations:
  en: 'On state change of: REVERSE_STATUS, SILENT_VEHICLE_SOUND_COMMAND, FUEL_FLAP_OPEN_AUTH_REQUEST'
  fr: 'Sur changement d''état de : REVERSE_STATUS, SILENT_VEHICLE_SOUND_COMMAND, FUEL_FLAP_OPEN_AUTH_REQUEST'
  es: 'Al cambiar el estado de: REVERSE_STATUS, SILENT_VEHICLE_SOUND_COMMAND, FUEL_FLAP_OPEN_AUTH_REQUEST'
  de: 'Bei Statusänderung von: REVERSE_STATUS, SILENT_VEHICLE_SOUND_COMMAND, FUEL_FLAP_OPEN_AUTH_REQUEST'
  it: 'Al cambiamento di stato di: REVERSE_STATUS, SILENT_VEHICLE_SOUND_COMMAND, FUEL_FLAP_OPEN_AUTH_REQUEST'
  pl: 'Wysyłane przy zmianie stanu: REVERSE_STATUS, SILENT_VEHICLE_SOUND_COMMAND, FUEL_FLAP_OPEN_AUTH_REQUEST'
  ru: 'При изменении состояния: REVERSE_STATUS, SILENT_VEHICLE_SOUND_COMMAND, FUEL_FLAP_OPEN_AUTH_REQUEST'
  zh: '当ETAT_MA, SILENT_VEHICLE_SOUND_COMMAND, RQ_AUTHOR_EJECT_FUEL_FLAP状态变化时'
  hu: 'A(z) REVERSE_STATUS, SILENT_VEHICLE_SOUND_COMMAND, FUEL_FLAP_OPEN_AUTH_REQUEST állapotváltozásakor'
  pt: 'Na mudança de estado de: REVERSE_STATUS, SILENT_VEHICLE_SOUND_COMMAND, FUEL_FLAP_OPEN_AUTH_REQUEST'
periodicity: ['1000ms', 'trigger']
senders: ['HCU2']
receivers: ['HCU1']

