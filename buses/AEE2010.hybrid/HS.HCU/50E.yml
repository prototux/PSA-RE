      pl: 'Suma kontrolna zabezpieczająca transmisję wartości zadanej tempomatu/ogranicznika prędkości przez CAN'
      ru: 'Контрольная сумма, обеспечивающая передачу заданного значения круиз-контроля/ограничителя скорости по CAN'
      zh: '通过CAN传输巡航/限速设定值的安全校验和'
      hu: 'A tempomat/sebességhatároló alapjelének CAN-on történő átvitelét biztosító ellenőrző összeg'
      pt: 'Soma de verificação que protege a transmissão da consigna do regulador/limitador de velocidade por CAN'
