        pl: 'Starsza tetrada VEHICLE_SPEED_SETPOINT_OR_LIMIT jest parzysta ORAZ młodsza tetrada jest nieparzysta'
        ru: 'Старший полубайт VEHICLE_SPEED_SETPOINT_OR_LIMIT чётный И младший полубайт нечётный'
