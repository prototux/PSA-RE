  fr: 'Données du contrôle hybride : temps avant arrêt du véhicule.'
  es: 'Datos del control híbrido: tiempo antes de la parada del vehículo.'
  de: 'Hybridsteuerungsdaten: Zeit bis zum Fahrzeugstillstand.'
