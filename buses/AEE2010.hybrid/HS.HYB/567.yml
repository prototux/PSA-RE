  FRAME_CHECKSUM:
    bits: '1.7-1.4'
    comment:
      en: '4-bit frame checksum'
      fr: 'Somme de contrôle de trame sur 4 bits'
      es: 'Suma de comprobación de trama de 4 bits'
      de: '4-Bit-Rahmenprüfsumme'
      it: 'Checksum della trama a 4 bit'
      pl: '4-bitowa suma kontrolna ramki'
      ru: '4-битная контрольная сумма кадра'
      zh: '4位帧校验和'
      hu: '4 bites keret-ellenőrzőösszeg'
      pt: 'Soma de verificação de trama de 4 bits'
    type: 'uint'

  PROCESS_COUNTER:
