id: 0x567
name: 'HYBRID_STATUS'
type: 'can'
length: 5
comment:
  en: 'Hybrid powertrain engine-start/stop requests and injection-cutoff commands from the hybrid control unit (HCU1).'
  fr: 'Demandes de démarrage/arrêt moteur et commandes de coupure d''injection issues du calculateur hybride (HCU1).'
  es: 'Solicitudes de arranque/parada del motor y órdenes de corte de inyección de la unidad de control híbrida (HCU1).'
  de: 'Motorstart-/Stopp-Anforderungen und Einspritzabschaltbefehle vom Hybridsteuergerät (HCU1).'
  it: 'Richieste di avviamento/arresto motore e comandi di interruzione iniezione dalla centralina ibrida (HCU1).'
  pl: 'Żądania uruchomienia/zatrzymania silnika i polecenia odcięcia wtrysku ze sterownika hybrydowego (HCU1).'
  ru: 'Запросы пуска/остановки двигателя и команды отключения впрыска от гибридного блока управления (HCU1).'
  zh: '来自混合动力控制单元(HCU1)的发动机启停请求及喷油切断指令。'
  hu: 'A motor indítási/leállítási kérései és a befecskendezés-lekapcsolási parancsok a hibrid vezérlőegységtől (HCU1).'
  pt: 'Pedidos de arranque/paragem do motor do grupo motopropulsor híbrido e comandos de corte de injeção da unidade de controlo híbrida (HCU1).'
observations:
  en: 'On state change of: ENGINE_START_REQUEST, ENGINE_STOP_REQUEST, HV_BATTERY_CONTACTOR_REQUEST'
  fr: 'Sur changement d''état de : ENGINE_START_REQUEST, ENGINE_STOP_REQUEST, HV_BATTERY_CONTACTOR_REQUEST'
  es: 'Al cambiar el estado de: ENGINE_START_REQUEST, ENGINE_STOP_REQUEST, HV_BATTERY_CONTACTOR_REQUEST'
  de: 'Bei Statusänderung von: ENGINE_START_REQUEST, ENGINE_STOP_REQUEST, HV_BATTERY_CONTACTOR_REQUEST'
  it: 'Al cambiamento di stato di: ENGINE_START_REQUEST, ENGINE_STOP_REQUEST, HV_BATTERY_CONTACTOR_REQUEST'
  pl: 'Wysyłane przy zmianie stanu: ENGINE_START_REQUEST, ENGINE_STOP_REQUEST, HV_BATTERY_CONTACTOR_REQUEST'
  ru: 'При изменении состояния: ENGINE_START_REQUEST, ENGINE_STOP_REQUEST, HV_BATTERY_CONTACTOR_REQUEST'
  zh: '当DDE_DEM_MTH, ENGINE_STOP_REQUEST, DMD_OUV_DISCONT状态变化时'
  hu: 'A(z) ENGINE_START_REQUEST, ENGINE_STOP_REQUEST, HV_BATTERY_CONTACTOR_REQUEST állapotváltozásakor'
  pt: 'Na mudança de estado de: ENGINE_START_REQUEST, ENGINE_STOP_REQUEST, HV_BATTERY_CONTACTOR_REQUEST'
periodicity: ['100ms', 'trigger']
senders: ['HCU1']
receivers: ['CMM', 'TBMU', 'HCU2']

