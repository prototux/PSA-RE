id: 0x527
name: 'BTE_SUPERVISION'
type: 'can'
length: 7
comment:
  en: 'Hybrid powertrain status from the hybrid control unit (HCU1): operating mode, performance mode, mileage and starter status.'
  fr: 'État de la chaîne de traction hybride issu du calculateur hybride (HCU1) : mode de fonctionnement, mode performance, kilométrage et état du démarreur.'
  es: 'Estado de la cadena de tracción híbrida de la unidad de control híbrida (HCU1): modo de funcionamiento, modo rendimiento, kilometraje y estado del motor de arranque.'
  de: 'Status des Hybridantriebs vom Hybridsteuergerät (HCU1): Betriebsmodus, Performance-Modus, Kilometerstand und Anlasserstatus.'
  it: 'Stato della trasmissione ibrida dalla centralina ibrida (HCU1): modalità di funzionamento, modalità performance, chilometraggio e stato del motorino di avviamento.'
  pl: 'Stan hybrydowego układu napędowego ze sterownika hybrydowego (HCU1): tryb pracy, tryb sportowy, przebieg i stan rozrusznika.'
  ru: 'Статус гибридной трансмиссии от гибридного блока управления (HCU1): режим работы, спортивный режим, пробег и статус стартера.'
  zh: '混合动力总成状态,来自混合动力控制单元(HCU1):运行模式、性能模式、里程和起动机状态。'
  hu: 'A hibrid hajtáslánc állapota a hibrid vezérlőegységtől (HCU1): üzemmód, teljesítménymód, kilométeróra-állás és indítómotor állapota.'
  pt: 'Estado do grupo motopropulsor híbrido da unidade de controlo híbrida (HCU1): modo de funcionamento, modo de desempenho, quilometragem e estado do motor de arranque.'
observations:
  en: 'On state change of: HYBRID_OPERATING_MODE, STARTUP_TYPE'
  fr: 'Sur changement d''état de : HYBRID_OPERATING_MODE, STARTUP_TYPE'
  es: 'Al cambiar el estado de: HYBRID_OPERATING_MODE, STARTUP_TYPE'
  de: 'Bei Statusänderung von: HYBRID_OPERATING_MODE, STARTUP_TYPE'
  it: 'Al cambiamento di stato di: HYBRID_OPERATING_MODE, STARTUP_TYPE'
  pl: 'Wysyłane przy zmianie stanu: HYBRID_OPERATING_MODE, STARTUP_TYPE'
  ru: 'При изменении состояния: HYBRID_OPERATING_MODE, STARTUP_TYPE'
  zh: '当MODE_FONCTION_HYB, TYPE_DE_DEMARRAGE_3状态变化时'
  hu: 'A(z) HYBRID_OPERATING_MODE, STARTUP_TYPE állapotváltozásakor'
  pt: 'Na mudança de estado de: HYBRID_OPERATING_MODE, STARTUP_TYPE'
periodicity: ['100ms', 'trigger']
senders: ['HCU1']
receivers: ['HCU2', 'TBMU', 'CMM']

signals:
  ODOMETER:
    bits: '1.7-3.0'
    comment:
      en: 'Absolute distance travelled by the vehicle (matching the value shown to the driver) (km)'
      fr: 'Kilométrage absolu parcouru par le véhicule (cohérent avec la valeur affichée au conducteur) (km)'
      es: 'Kilometraje absoluto recorrido por el vehículo (coherente con el valor mostrado al conductor) (km)'
      de: 'Absolute vom Fahrzeug zurückgelegte Strecke (übereinstimmend mit der dem Fahrer angezeigten Angabe) (km)'
      it: 'Chilometraggio assoluto percorso dal veicolo (coerente con il valore mostrato al conducente) (km)'
      pl: 'Bezwzględny przebieg pojazdu (zgodny z wartością wyświetlaną kierowcy) (km)'
      ru: 'Абсолютный пробег автомобиля (соответствующий значению, показываемому водителю) (км)'
      zh: '车辆行驶的绝对里程(与显示给驾驶员的数值一致)(km)'
      hu: 'A jármű által megtett abszolút távolság (megegyezik a vezetőnek kijelzett értékkel) (km)'
      pt: 'Distância absoluta percorrida pelo veículo (correspondente ao valor apresentado ao condutor) (km)'
    type: 'uint'
    factor: 1
    min: 0
    max: 16777214
    units: 'km'
    invalid: 0xFFFFFF
    default: 0x00

