        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x02:
        en: 'Requested'
        fr: 'Demandé'
        es: 'Solicitado'
        de: 'Angefordert'
        it: 'Richiesto'
        pl: 'Żądane'
        ru: 'Запрошено'
        zh: '已请求'
        hu: 'Kérve'
        pt: 'Pedido'
      0x03:
        unused: true

  TBMU_SLEEP_REQUEST:
    bits: '2.3-2.2'
    comment:
      en: 'Request for the TBMU to go into sleep mode'
      fr: 'Demande de mise en veille du TBMU'
      es: 'Solicitud de puesta en reposo del TBMU'
      de: 'Anforderung an das TBMU, in den Schlafmodus zu wechseln'
      it: 'Richiesta di messa in stand-by del TBMU'
      pl: 'Żądanie przejścia TBMU w tryb uśpienia'
      ru: 'Запрос перевода TBMU в спящий режим'
      zh: '请求TBMU进入休眠模式'
