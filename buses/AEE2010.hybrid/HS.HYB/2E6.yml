      0x03:
        en: 'Not defined'
        fr: 'Non défini'
        es: 'No definido'
        de: 'Nicht definiert'
        it: 'Non definito'
        pl: 'Nieokreślone'
        ru: 'Не определено'
        zh: '未定义'
        hu: 'Nincs meghatározva'
        pt: 'Não definido'

  HV_CONTACTOR_OPEN_REQUEST_REAR_EMOTOR:
    bits: '2.5-2.4'
    comment:
      en: 'High-voltage contactor opening request from the rear electric machine'
      fr: 'Demande d''ouverture des contacteurs haute tension par la machine électrique arrière'
      es: 'Solicitud de apertura de los contactores de alta tensión por la máquina eléctrica trasera'
      de: 'Anforderung zum Öffnen der Hochvoltschütze durch die hintere E-Maschine'
      it: 'Richiesta di apertura dei contattori ad alta tensione da parte della macchina elettrica posteriore'
      pl: 'Żądanie rozłączenia styczników wysokiego napięcia przez tylną maszynę elektryczną'
      ru: 'Запрос на размыкание высоковольтных контакторов от задней электромашины'
      zh: '后电机发出的高压接触器断开请求'
      hu: 'A hátsó elektromos gép nagyfeszültségű kontaktorok nyitási kérése'
      pt: 'Pedido de abertura dos contactores de alta tensão pela máquina elétrica traseira'
    type: 'enum'
    default: 0x00
