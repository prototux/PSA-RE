id: 0x766
name: 'FAULT_LOG_HCU2'
type: 'can'
length: 8
comment:
  en: 'Fault log frame from the HCU2 node: fault codes, status, mileage, frame index and time reference.'
  fr: 'Trame du journal des défauts du calculateur HCU2 : codes défaut, état, kilométrage, index de trame et référence horaire.'
  es: 'Trama del registro de fallos del nodo HCU2: códigos de fallo, estado, kilometraje, índice de trama y referencia horaria.'
  de: 'fault log-Fehlerspeicher-Rahmen des Steuergeräts HCU2: Fehlercodes, Status, Kilometerstand, Rahmenindex und Zeitreferenz.'
  it: 'Trama del registro guasti del nodo HCU2: codici guasto, stato, chilometraggio, indice trama e riferimento orario.'
  pl: 'Ramka dziennika usterek węzła HCU2: kody usterek, stan, przebieg, indeks ramki i odniesienie czasowe.'
  ru: 'Кадр журнала неисправностей узла HCU2: коды неисправностей, статус, пробег, индекс кадра и временная метка.'
  zh: 'HCU2节点的故障日志帧:故障代码、状态、里程、帧索引和时间参考。'
  hu: 'A HCU2 csomópont hibanapló kerete: hibakódok, állapot, futásteljesítmény, keretindex és időreferencia.'
  pt: 'Trama do registo de avarias do nó HCU2: códigos de avaria, estado, quilometragem, índice de trama e referência horária.'
observations:
  en: 'May be sent event-triggered as 3 groups of 3 frames, 100 ms apart, with different lengths, to the BSI'
  fr: 'Peut être émise de façon événementielle sous forme de 3 fois 3 trames, espacées de 100 ms, de longueur différente, vers la BSI'
  es: 'Puede enviarse de forma basada en eventos como 3 series de 3 tramas, separadas 100 ms, de longitud diferente, hacia la BSI'
  de: 'Kann ereignisgesteuert als 3-mal 3 Frames unterschiedlicher Länge, 100 ms auseinander, an die BSI gesendet werden'
  it: 'Può essere inviata in modo event-driven come 3 serie di 3 frame, distanziati di 100 ms, di lunghezza diversa, verso la BSI'
  pl: 'Może być wysyłana zdarzeniowo jako 3 razy po 3 ramki, w odstępie 100 ms, o różnej długości, do BSI'
  ru: 'Может отправляться по событию в виде 3 групп по 3 кадра с интервалом 100 мс и разной длиной, в адрес BSI'
  zh: '可事件触发地以3组共3帧的形式发送给BSI,间隔100毫秒,长度各不相同'
  hu: 'Eseményvezérelten küldhető 3-szor 3 keretként, 100 ms-os időközzel, eltérő hosszúsággal, a BSI felé'
  pt: 'Pode ser enviada de forma baseada em eventos como 3 grupos de 3 tramas, com 100 ms de intervalo, com comprimentos diferentes, para a BSI'
periodicity: ['trigger']
senders: ['HCU2', 'CMEL']
receivers: ['HCU1', 'CMM']

