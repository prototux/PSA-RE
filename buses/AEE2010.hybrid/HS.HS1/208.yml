id: 0x208
name: 'ENGINE_HYBRID_DYNAMIC_DATA_3'
type: 'can'
length: 8
comment:
  en: 'Front electric-motor torque and voltage setpoints, torque gradient limit and DC/DC converter mode, from the hybrid control unit.'
  fr: 'Consignes de couple et de tension du moteur électrique avant, limite de gradient de couple et mode du convertisseur DC/DC, issues du calculateur hybride.'
  es: 'Consignas de par y tensión del motor eléctrico delantero, límite de gradiente de par y modo del convertidor DC/DC, procedentes de la centralita híbrida.'
  de: 'Drehmoment- und Spannungs-Sollwerte des vorderen Elektromotors, Grenze des Drehmomentgradienten und DC/DC-Wandlermodus vom Hybridsteuergerät.'
  it: 'Valori richiesti di coppia e tensione del motore elettrico anteriore, limite del gradiente di coppia e modalità del convertitore DC/DC, dalla centralina ibrida.'
  pl: 'Zadane wartości momentu i napięcia przedniego silnika elektrycznego, ograniczenie gradientu momentu oraz tryb przetwornicy DC/DC z hybrydowego sterownika.'
  ru: 'Заданные значения крутящего момента и напряжения переднего электродвигателя, ограничение градиента момента и режим преобразователя DC/DC от гибридного блока управления.'
  zh: '前置电动机的扭矩和电压设定值、扭矩梯度限制及DC/DC变换器模式,来自混合动力控制单元。'
  hu: 'Az első elektromos motor nyomaték- és feszültség-alapjelei, a nyomatékgradiens határértéke, valamint a DC/DC átalakító üzemmódja a hibrid vezérlőegységtől.'
  pt: 'Pontos de ajuste de binário e tensão do motor elétrico dianteiro, limite de gradiente de binário e modo do conversor DC/DC, da unidade de controlo híbrida.'
periodicity: ['10ms']
senders: ['HCU1']
receivers: ['CVM', 'ABS', 'DAE', 'SBW', 'BCP', 'CSS', 'CAV', 'BVA', 'BSI', 'BSM', 'CMM']

signals:
  ENGINE_SPEED:
    bits: '1.7-2.0'
    comment:
      en: 'Engine speed (16-bit)'
      fr: 'Régime moteur (16 bits)'
      es: 'Régimen del motor (16 bits)'
      de: 'Motordrehzahl (16 Bit)'
      it: 'Regime motore (16 bit)'
      pl: 'Obroty silnika (16 bitów)'
      ru: 'Обороты двигателя (16 бит)'
      zh: '发动机转速(16位)'
      hu: 'Motorfordulatszám (16 bites)'
      pt: 'Regime do motor (16 bits)'
    type: 'uint'
    factor: 0.125
    min: 0
    max: 8191.75
    units: 'rpm'
    invalid: 0xFFFF
    default: 0xFFFF

  SHAFT_ACTUAL_TORQUE:
    bits: '3.7-3.0'
    comment:
      en: 'Actual torque available on the shaft, including the instantaneous engine and electric machine torque'
      fr: 'Couple réel disponible sur l''arbre, incluant le couple moteur et le couple de la machine électrique instantanés'
      es: 'Par real disponible en el árbol, incluyendo el par instantáneo del motor y de la máquina eléctrica'
      de: 'Tatsächlich verfügbares Drehmoment an der Welle, einschließlich des momentanen Motor- und E-Maschinendrehmoments'
      it: 'Coppia reale disponibile sull''albero, comprensiva della coppia istantanea del motore e della macchina elettrica'
      pl: 'Rzeczywisty moment obrotowy dostępny na wale, obejmujący chwilowy moment silnika i maszyny elektrycznej'
      ru: 'Фактический момент на валу, включая мгновенный момент двигателя и электромашины'
      zh: '轴上实际可用扭矩,包含发动机和电机的瞬时扭矩'
      hu: 'A tengelyen rendelkezésre álló tényleges nyomaték, beleértve a pillanatnyi motor- és elektromosgép-nyomatékot'
      pt: 'Binário real disponível no veio, incluindo o binário instantâneo do motor e da máquina elétrica'
    type: 'uint'
    factor: 2.5
    offset: -200
    min: -200
    max: 435
    units: 'Nm'
    invalid: 0xFF
    default: 0x50

