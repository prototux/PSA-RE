  STARTER_PROTECTION_STATUS:
    bits: '1.5'
    comment:
      en: 'The engine ECU cannot execute the start request because the engine is already running'
      fr: 'Le calculateur moteur ne peut pas exécuter la demande de démarrage car le moteur tourne déjà'
      es: 'La centralita del motor no puede ejecutar la solicitud de arranque porque el motor ya está girando'
      de: 'Das Motorsteuergerät kann die Startanforderung nicht ausführen, da der Motor bereits läuft'
      it: 'La centralina motore non può eseguire la richiesta di avviamento perché il motore è già in rotazione'
      pl: 'Sterownik silnika nie może wykonać żądania uruchomienia, ponieważ silnik już pracuje'
      ru: 'Блок управления двигателем не может выполнить запрос запуска, так как двигатель уже вращается'
      zh: '由于发动机已在运转,发动机ECU无法执行起动请求'
      hu: 'A motorvezérlő nem tudja végrehajtani az indítási kérést, mert a motor már forog'
      pt: 'A ECU do motor não pode executar o pedido de arranque porque o motor já está a funcionar'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Starter protection disabled'
        fr: 'Protection démarreur désactivée'
        es: 'Protección del motor de arranque desactivada'
        de: 'Anlasserschutz deaktiviert'
        it: 'Protezione motorino di avviamento disattivata'
