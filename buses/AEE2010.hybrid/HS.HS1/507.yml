  hu: 'Hibrid vezérlési adatok: a jármű megállásáig hátralévő idő.'
  pt: 'Dados de controlo híbrido: tempo até à paragem do veículo.'
observations:
  en: 'On state change of: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE'
  fr: 'Sur changement d''état de : COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE'
  es: 'Al cambiar el estado de: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE'
  de: 'Bei Statusänderung von: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE'
  it: 'Al cambiamento di stato di: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE'
  pl: 'Wysyłane przy zmianie stanu: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE'
  ru: 'При изменении состояния: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE'
  zh: '当ETAT_MTH, ELECTRIC_MOTOR_STATUS, RECHARGE状态变化时'
  hu: 'A(z) COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE állapotváltozásakor'
  pt: 'Na mudança de estado de: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE'
periodicity: ['100ms', 'trigger']
senders: ['HCU1']
receivers: ['ABS', 'BSI', 'BSM', 'AAS', 'CVM', 'BVA', 'BCP']

