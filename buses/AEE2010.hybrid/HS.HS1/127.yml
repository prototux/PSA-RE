      fr: 'Couple réel de la machine électrique arrière'
      es: 'Par real de la máquina eléctrica trasera'
      de: 'Tatsächliches Drehmoment der hinteren E-Maschine'
      it: 'Coppia reale della macchina elettrica posteriore'
      pl: 'Rzeczywisty moment obrotowy tylnej maszyny elektrycznej'
      ru: 'Фактический момент задней электромашины'
      zh: '后电机实际扭矩'
      hu: 'A hátsó elektromos gép tényleges nyomatéka'
      pt: 'Binário real da máquina elétrica traseira'
    type: 'sint'
