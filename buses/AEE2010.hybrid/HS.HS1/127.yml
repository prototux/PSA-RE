id: 0x127
name: 'ADAPTIVE_CRUISE_STATUS'
type: 'can'
length: 8
comment:
  en: 'Hybrid control data: time before vehicle stop.'
  fr: 'Données du contrôle hybride : temps avant arrêt du véhicule.'
  es: 'Datos del control híbrido: tiempo antes de la parada del vehículo.'
  de: 'Hybridsteuerungsdaten: Zeit bis zum Fahrzeugstillstand.'
  it: 'Dati del controllo ibrido: tempo prima dell''arresto del veicolo.'
  pl: 'Dane kontroli hybrydowej: czas do zatrzymania pojazdu.'
  ru: 'Данные гибридного управления: время до остановки автомобиля.'
  zh: '混合动力控制数据:车辆停止前的时间。'
  hu: 'Hibrid vezérlési adatok: a jármű megállásáig hátralévő idő.'
  pt: 'Dados de controlo híbrido: tempo até à paragem do veículo.'
periodicity: ['10ms']
senders: ['HCU1']
receivers: ['CSS', 'BSI', 'CMM', 'ABS']

signals:
  CHECKSUM_FRAME_127:
    bits: '1.7-1.4'
    comment:
      en: 'Frame checksum'
      fr: 'Somme de contrôle (checksum) de la trame'
      es: 'Suma de comprobación (checksum) de la trama'
      de: 'Prüfsumme (Checksum) des Rahmens'
      it: 'Checksum del frame'
      pl: 'Suma kontrolna (checksum) ramki'
      ru: 'Контрольная сумма кадра'
      zh: '帧校验和'
      hu: 'A keret ellenőrző összege (checksum)'
      pt: 'Soma de verificação da trama'
    type: 'uint'

  PROCESS_COUNTER_4B_127:
    bits: '1.3-1.0'
    comment:
      en: '4-bit process counter'
      fr: 'Compteur de process 4 bits'
      es: 'Contador de proceso de 4 bits'
      de: '4-Bit-Prozesszähler'
      it: 'Contatore di processo a 4 bit'
      pl: '4-bitowy licznik procesu'
      ru: '4-битный счётчик процесса'
      zh: '4位过程计数器'
      hu: '4 bites folyamatszámláló'
      pt: 'Contador de processo de 4 bits'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00

  GEAR_LEVER_VALIDATED_POSITION:
    bits: '2.7-2.5'
    comment:
      en: 'Validated gear lever position (P, R, N, D)'
      fr: 'Position validée du levier de vitesses (P, R, N, D)'
      es: 'Posición validada de la palanca de cambios (P, R, N, D)'
      de: 'Validierte Position des Wählhebels (P, R, N, D)'
      it: 'Posizione convalidata della leva del cambio (P, R, N, D)'
      pl: 'Zatwierdzona pozycja dźwigni zmiany biegów (P, R, N, D)'
      ru: 'Подтверждённое положение рычага переключения передач (P, R, N, D)'
      zh: '已确认的换挡杆位置(P、R、N、D)'
      hu: 'A sebességváltó kar érvényesített helyzete (P, R, N, D)'
      pt: 'Posição validada da alavanca de velocidades (P, R, N, D)'
    type: 'enum'
    values:
      0x00:
        en: 'P'
        fr: 'P'
        es: 'P'
        de: 'P'
        it: 'P'
        pl: 'P'
        ru: 'P'
        zh: 'P'
        hu: 'P'
        pt: 'P'
      0x01:
        en: 'R'
        fr: 'R'
        es: 'R'
        de: 'R'
        it: 'R'
        pl: 'R'
        ru: 'R'
        zh: 'R'
        hu: 'R'
        pt: 'R'
      0x02:
        en: 'N'
        fr: 'N'
        es: 'N'
        de: 'N'
        it: 'N'
        pl: 'N'
        ru: 'N'
        zh: 'N'
        hu: 'N'
        pt: 'N'
      0x03:
        en: 'D'
        fr: 'D'
        es: 'D'
        de: 'D'
        it: 'D'
        pl: 'D'
        ru: 'D'
        zh: 'D'
        hu: 'D'
        pt: 'D'
      0x04:
        unused: true
      0x05:
        unused: true
      0x06:
        unused: true
      0x07:
        en: 'Invalid'
        fr: 'Invalide'
        es: 'Inválido'
        de: 'Ungültig'
        it: 'Non valido'
        pl: 'Nieprawidłowe'
        ru: 'Недействительно'
        zh: '无效'
        hu: 'Érvénytelen'
        pt: 'Inválido'

  AC_COMPRESSOR_TORQUE_RELIEF_REQUEST:
    bits: '2.4-2.3'
    comment:
      en: 'Request from the hybrid powertrain coordination to relieve, inhibit or freeze the torque taken by the AC compressor'
      fr: 'Demande de la coordination du GMP hybride pour soulager, inhiber ou figer le couple prélevé par le compresseur de climatisation'
      es: 'Solicitud de la coordinación del GMP híbrido para aliviar, inhibir o fijar el par absorbido por el compresor de aire acondicionado'
      de: 'Anforderung der Hybridantriebskoordination zur Entlastung, Sperrung oder Einfrierung des vom Klimakompressor entnommenen Drehmoments'
      it: 'Richiesta di coordinamento del powertrain ibrido per alleggerire, inibire o congelare la coppia assorbita dal compressore del climatizzatore'
      pl: 'Żądanie koordynacji układu hybrydowego dotyczące odciążenia, zablokowania lub zamrożenia momentu pobieranego przez sprężarkę klimatyzacji'
      ru: 'Запрос от координации гибридного силового агрегата на разгрузку, блокировку или фиксацию момента, отбираемого компрессором кондиционера'
      zh: '混合动力总成协调请求减轻、抑制或冻结空调压缩机所占用的扭矩'
      hu: 'A hibrid hajtáslánc-koordináció kérése a klímakompresszor által elvont nyomaték tehermentesítésére, tiltására vagy rögzítésére'
      pt: 'Pedido da coordenação do GMP híbrido para aliviar, inibir ou fixar o binário absorvido pelo compressor de climatização'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
        en: 'Request to reduce AC compressor torque'
        fr: 'Demande de réduction du couple du compresseur de climatisation'
        es: 'Solicitud de reducción del par del compresor de aire acondicionado'
        de: 'Anforderung zur Reduzierung des Klimakompressor-Drehmoments'
        it: 'Richiesta di riduzione della coppia del compressore climatizzatore'
        pl: 'Żądanie redukcji momentu sprężarki klimatyzacji'
        ru: 'Запрос снижения момента компрессора кондиционера'
        zh: '请求降低空调压缩机扭矩'
        hu: 'A klímakompresszor nyomatékának csökkentési kérése'
        pt: 'Pedido de redução do binário do compressor de ar condicionado'
      0x02:
        en: 'AC compressor disengagement request'
        fr: 'Demande de désenclenchement du compresseur de climatisation'
        es: 'Solicitud de desactivación del compresor de climatización'
        de: 'Anforderung zum Ausschalten des Klimakompressors'
        it: 'Richiesta di disinnesto del compressore del climatizzatore'
        pl: 'Żądanie wyłączenia sprężarki klimatyzacji'
        ru: 'Запрос отключения компрессора кондиционера'
        zh: '空调压缩机脱离请求'
        hu: 'Klímakompresszor kikapcsolási kérés'
        pt: 'Pedido de desativação do compressor de ar condicionado'
      0x03:
        en: 'Freeze of the torque taken by the AC compressor'
        fr: 'Figeage du couple prélevé par le compresseur'
        es: 'Congelación del par absorbido por el compresor'
        de: 'Einfrieren des vom Kompressor aufgenommenen Drehmoments'
        it: 'Blocco della coppia assorbita dal compressore'
        pl: 'Zamrożenie momentu pobieranego przez sprężarkę'
        ru: 'Фиксация момента, отбираемого компрессором'
        zh: '冻结压缩机所占用的扭矩'
        hu: 'A kompresszor által elvont nyomaték rögzítése'
        pt: 'Congelamento do binário tomado pelo compressor de ar condicionado'

  UNUSED_1:
    bits: '2.2'
    unused: true

  DRIVER_DEMAND:
    bits: '2.1-3.0'
    comment:
      en: 'Driver demand (accelerator pedal request) (%)'
      fr: 'Volonté du conducteur (demande de la pédale d''accélérateur) (%)'
      es: 'Voluntad del conductor (solicitud del pedal acelerador) (%)'
      de: 'Fahrerwunsch (Fahrpedalanforderung) (%)'
      it: 'Richiesta del conducente (richiesta del pedale acceleratore) (%)'
      pl: 'Żądanie kierowcy (żądanie pedału przyspieszenia) (%)'
      ru: 'Запрос водителя (запрос педали акселератора) (%)'
      zh: '驾驶员意图(油门踏板请求)(%)'
      hu: 'A vezető kérése (gázpedál-kérés) (%)'
      pt: 'Vontade do condutor (pedido do pedal do acelerador) (%)'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 100
    units: '%'
    invalid: 0x3FF
    default: 0x00

  DRIVER_TORQUE_REQUEST_BEFORE_PROCESSING:
    bits: '4.7-4.0'
    comment:
      en: 'Torque requested by the driver before processing by the hybrid control unit (N.m)'
      fr: 'Couple demandé par le conducteur avant traitement par le calculateur hybride (N.m)'
      es: 'Par solicitado por el conductor antes del procesamiento por el calculador híbrido (N.m)'
      de: 'Vom Fahrer angefordertes Drehmoment vor der Verarbeitung durch das Hybridsteuergerät (N.m)'
      it: 'Coppia richiesta dal conducente prima dell''elaborazione da parte della centralina ibrida (N.m)'
      pl: 'Moment obrotowy żądany przez kierowcę przed przetworzeniem przez sterownik hybrydowy (N.m)'
      ru: 'Крутящий момент, запрошенный водителем, до обработки гибридным блоком управления (Н·м)'
      zh: '驾驶员请求扭矩(经混合动力控制单元处理前)(N.m)'
      hu: 'A vezető által kért nyomaték a hibrid vezérlőegység feldolgozása előtt (N.m)'
      pt: 'Binário solicitado pelo condutor antes do processamento pela unidade de controlo híbrida (N.m)'
    type: 'uint'
    factor: 2.5
    offset: -200
    min: -200
    max: 435
    units: 'Nm'
    invalid: 0xFF
    default: 0x50

  UNUSED_2:
    bits: '5.7-5.3'
    unused: true

  ICE_TORQUE_SETPOINT_2:
    bits: '5.2-6.0'
    comment:
      en: 'Combustion engine torque setpoint (N.m)'
      fr: 'Consigne de couple du moteur thermique (N.m)'
      es: 'Consigna de par del motor térmico (N.m)'
      de: 'Drehmomentsollwert des Verbrennungsmotors (N.m)'
      it: 'Valore di riferimento di coppia del motore termico (N.m)'
      pl: 'Nastawa momentu obrotowego silnika spalinowego (N.m)'
      ru: 'Заданный крутящий момент двигателя внутреннего сгорания (Н·м)'
      zh: '内燃机扭矩设定值(N.m)'
      hu: 'A belső égésű motor nyomaték-alapjele (N.m)'
      pt: 'Consigna de binário do motor térmico (N.m)'
    type: 'uint'
    factor: 0.5
    offset: -500
