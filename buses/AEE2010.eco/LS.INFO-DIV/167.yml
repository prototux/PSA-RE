id: 0x167
name: 'EMF_CONTROL_DATA'
type: 'can'
length: 8
comment:
  en: 'EMF control data, used for network supervision (sent every 100 ms while awake): action, emergency call, climate preconditioning request, reset requests, total odometer and interactive message pointer.'
  fr: 'Données de contrôle EMF, utilisées pour la supervision réseau (envoyées toutes les 100 ms à l''éveil) : action, appel d''urgence, demande de préconditionnement climatique, demandes de remise à zéro, kilométrage total et pointeur de message interactif.'
  es: 'Datos de control EMF, utilizados para la supervisión de la red (enviados cada 100 ms en vigilia): acción, llamada de emergencia, solicitud de preacondicionamiento climático, solicitudes de reinicio, kilometraje total y puntero de mensaje interactivo.'
  de: 'EMF-Steuerdaten, zur Netzwerküberwachung verwendet (alle 100 ms im Wachzustand gesendet): Aktion, Notruf, Anforderung der Klimavorkonditionierung, Rücksetzanforderungen, Gesamtkilometerstand und Zeiger für interaktive Nachrichten.'
  it: 'Dati di controllo EMF, utilizzati per la supervisione della rete (inviati ogni 100 ms da sveglio): azione, chiamata di emergenza, richiesta di precondizionamento climatico, richieste di reset, chilometraggio totale e puntatore messaggio interattivo.'
  pl: 'Dane sterujące EMF, wykorzystywane do nadzoru sieci (wysyłane co 100 ms podczas czuwania): akcja, wezwanie awaryjne, żądanie wstępnej klimatyzacji, żądania resetu, przebieg całkowity i wskaźnik wiadomości interaktywnej.'
  ru: 'Данные управления EMF, используемые для контроля сети (отправляются каждые 100 мс в активном режиме): действие, экстренный вызов, запрос предварительного кондиционирования, запросы сброса, общий пробег и указатель интерактивного сообщения.'
  zh: '用于网络监控的EMF控制数据(唤醒时每100毫秒发送一次):动作、紧急呼叫、空调预处理请求、复位请求、总里程和交互消息指针。'
  hu: 'EMF vezérlési adatok, hálózatfelügyelethez használva (ébren 100 ms-onként küldve): művelet, segélyhívás, klíma-előkondicionálási kérés, visszaállítási kérések, teljes futásteljesítmény és interaktív üzenetmutató.'
  pt: 'Dados de comando do EMF, utilizados para supervisão de rede (enviados a cada 100 ms enquanto ativo): ação, chamada de emergência, pedido de pré-condicionamento da climatização, pedidos de reposição, conta-quilómetros total e ponteiro de mensagem interativa.'
observations:
  en: 'On state change of: CHECK_STOP_REQUEST, BLACK_PANEL_STATUS'
  fr: 'Sur changement d''état de : CHECK_STOP_REQUEST, BLACK_PANEL_STATUS'
  es: 'Al cambiar el estado de: CHECK_STOP_REQUEST, BLACK_PANEL_STATUS'
  de: 'Bei Statusänderung von: CHECK_STOP_REQUEST, BLACK_PANEL_STATUS'
  it: 'Al cambiamento di stato di: CHECK_STOP_REQUEST, BLACK_PANEL_STATUS'
  pl: 'Wysyłane przy zmianie stanu: CHECK_STOP_REQUEST, BLACK_PANEL_STATUS'
  ru: 'При изменении состояния: CHECK_STOP_REQUEST, BLACK_PANEL_STATUS'
  zh: '当STOP_CHECK_EMF, ETAT_BP_DARK状态变化时'
  hu: 'A(z) CHECK_STOP_REQUEST, BLACK_PANEL_STATUS állapotváltozásakor'
  pt: 'Na mudança de estado de: CHECK_STOP_REQUEST, BLACK_PANEL_STATUS'
periodicity: ['100ms', 'trigger']
senders: ['BTEL', 'EMF']
receivers: ['CMB', 'BSI', 'RAD', 'ICSV']

