id: 0x1E7
name: 'ARTIV_AND_HYBRID_STATUS'
type: 'can'
length: 8
comment:
  en: 'Adaptive cruise control (target detection and gap) and hybrid system status: alert, detected target, display mode, gap setpoint.'
  fr: 'État du régulateur de distance adaptatif (détection de cible, écart) et du système hybride : alerte, cible détectée, mode d''affichage, consigne d''écart.'
  es: 'Estado del regulador de distancia adaptativo (detección de objetivo, separación) y del sistema híbrido: alerta, objetivo detectado, modo de visualización, consigna de separación.'
  de: 'Status des adaptiven Abstandsreglers (Zielobjekterkennung, Abstand) und des Hybridsystems: Warnung, erkanntes Ziel, Anzeigemodus, Abstandssollwert.'
  it: 'Stato del regolatore di distanza adattivo (rilevamento target, distanza) e del sistema ibrido: allarme, target rilevato, modalità di visualizzazione, setpoint di distanza.'
  pl: 'Stan adaptacyjnego regulatora odległości (wykrywanie celu, odstęp) i układu hybrydowego: alarm, wykryty cel, tryb wyświetlania, zadany odstęp.'
  ru: 'Статус адаптивного круиз-контроля (обнаружение цели, дистанция) и гибридной системы: сигнал тревоги, обнаруженная цель, режим отображения, заданная дистанция.'
  zh: '自适应巡航(目标探测、车距)及混合动力系统状态:告警、探测到的目标、显示模式、车距设定值。'
  hu: 'Az adaptív követési távolságszabályzó (célfelismerés, távolság) és a hibrid rendszer állapota: riasztás, felismert cél, kijelzési mód, távolság-alapérték.'
  pt: 'Estado do regulador de velocidade adaptativo (deteção de alvo e intervalo) e do sistema híbrido: alerta, alvo detetado, modo de apresentação, ponto de ajuste de intervalo.'
observations:
  en: 'On state change of: ARTIV_SELECTION_STATUS, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_TARGET, PLUG_INDICATOR_LAMP_REQUEST, PLUG_INDICATOR_LAMP_REQUEST'
  fr: 'Sur changement d''état de : ARTIV_SELECTION_STATUS, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_TARGET, PLUG_INDICATOR_LAMP_REQUEST, PLUG_INDICATOR_LAMP_REQUEST'
  es: 'Al cambiar el estado de: ARTIV_SELECTION_STATUS, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_TARGET, PLUG_INDICATOR_LAMP_REQUEST, PLUG_INDICATOR_LAMP_REQUEST'
  de: 'Bei Statusänderung von: ARTIV_SELECTION_STATUS, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_TARGET, PLUG_INDICATOR_LAMP_REQUEST, PLUG_INDICATOR_LAMP_REQUEST'
  it: 'Al cambiamento di stato di: ARTIV_SELECTION_STATUS, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_TARGET, PLUG_INDICATOR_LAMP_REQUEST, PLUG_INDICATOR_LAMP_REQUEST'
  pl: 'Wysyłane przy zmianie stanu: ARTIV_SELECTION_STATUS, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_TARGET, PLUG_INDICATOR_LAMP_REQUEST, PLUG_INDICATOR_LAMP_REQUEST'
  ru: 'При изменении состояния: ARTIV_SELECTION_STATUS, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_TARGET, PLUG_INDICATOR_LAMP_REQUEST, PLUG_INDICATOR_LAMP_REQUEST'
  zh: '当ETAT_SELEC_ARTIV, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_TARGET, PLUG_INDICATOR_LAMP_REQUEST, P_TEM_RTAB_PLUGGED状态变化时'
  hu: 'A(z) ARTIV_SELECTION_STATUS, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_TARGET, PLUG_INDICATOR_LAMP_REQUEST, PLUG_INDICATOR_LAMP_REQUEST állapotváltozásakor'
  pt: 'Na mudança de estado de: ARTIV_SELECTION_STATUS, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_TARGET, PLUG_INDICATOR_LAMP_REQUEST, PLUG_INDICATOR_LAMP_REQUEST'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['ICSV', 'BTEL', 'CMB', 'VTH', 'MATT', 'OVIP', 'MDS', 'RAD']

