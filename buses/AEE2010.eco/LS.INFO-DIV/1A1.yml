id: 0x1A1
name: 'BSI_DISPLAY_MESSAGE'
type: 'can'
length: 8
comment:
  en: 'New message pointer sent by the BSI to the display on change: message priority, media and content pointer.'
  fr: 'Pointeur de nouveau message envoyé par la BSI à l''afficheur sur changement : priorité, support et pointeur de contenu du message.'
  es: 'Puntero de nuevo mensaje enviado por la BSI a la pantalla al cambiar: prioridad, soporte y puntero de contenido del mensaje.'
  de: 'Von der BSI bei Änderung an das Display gesendeter Zeiger auf eine neue Nachricht: Priorität, Medium und Inhaltszeiger der Nachricht.'
  it: 'Puntatore di nuovo messaggio inviato dalla BSI al display al cambio: priorità, supporto e puntatore al contenuto del messaggio.'
  pl: 'Wskaźnik nowej wiadomości wysyłany przez BSI do wyświetlacza przy zmianie: priorytet, nośnik i wskaźnik treści wiadomości.'
  ru: 'Указатель нового сообщения, отправляемый BSI на дисплей при изменении: приоритет, носитель и указатель содержимого сообщения.'
  zh: '由BSI在状态变化时发送给显示屏的新消息指针：消息优先级、媒介及内容指针。'
  hu: 'A BSI által a kijelzőnek küldött új üzenet-mutató, változáskor: az üzenet prioritása, hordozója és tartalommutatója.'
  pt: 'Ponteiro de nova mensagem enviado pela BSI ao visor na mudança: prioridade da mensagem, média e ponteiro de conteúdo.'
observations:
  en: 'On state change of: DISPLAY_MESSAGE'
  fr: 'Sur changement d''état de : DISPLAY_MESSAGE'
  es: 'Al cambiar el estado de: DISPLAY_MESSAGE'
  de: 'Bei Statusänderung von: DISPLAY_MESSAGE'
  it: 'Al cambiamento di stato di: DISPLAY_MESSAGE'
  pl: 'Wysyłane przy zmianie stanu: DISPLAY_MESSAGE'
  ru: 'При изменении состояния: DISPLAY_MESSAGE'
  zh: '当NOUV_MESS状态变化时'
  hu: 'A(z) DISPLAY_MESSAGE állapotváltozásakor'
  pt: 'Na mudança de estado de: DISPLAY_MESSAGE'
periodicity: ['200ms', 'trigger']
senders: ['ICSV', 'BSI']
receivers: ['EMF', 'CMB', 'BTEL', 'MATT', 'OVIP', 'VTH', 'RAD']

