        es: 'Normal (+)'
        de: 'Normal (+)'
        it: 'Normale (+)'
        pl: 'Normalny (+)'
        ru: 'Нормальный (+)'
        zh: '正常 (+)'
        hu: 'Normál (+)'
        pt: 'Normal (+)'
