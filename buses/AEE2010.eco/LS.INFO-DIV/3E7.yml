  DISTANCE:
    bits: '4.7-5.0'
    comment:
      en: 'Mileage before maintenance'
      fr: 'Kilométrage avant maintenance'
      es: 'Kilometraje antes del mantenimiento'
      de: 'Kilometerstand bis zur Wartung'
      it: 'Chilometraggio prima della manutenzione'
      pl: 'Przebieg do przeglądu'
