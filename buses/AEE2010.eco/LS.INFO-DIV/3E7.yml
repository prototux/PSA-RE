      0x00:
        en: 'Normal (+)'
        fr: 'Normal (+)'
        es: 'Normal (+)'
        de: 'Normal (+)'
        it: 'Normale (+)'
        pl: 'Normalny (+)'
        ru: 'Нормальный (+)'
