        hu: 'Normál (+)'
        pt: 'Normal (+)'
      0x01:
        en: 'Maintenance overdue (-)'
        fr: 'Entretien dépassé (-)'
        es: 'Mantenimiento superado (-)'
        de: 'Wartung überschritten (-)'
        it: 'Manutenzione superata (-)'
        pl: 'Przekroczono termin serwisu (-)'
        ru: 'Просрочено обслуживание (-)'
        zh: '保养已超期(-)'
        hu: 'Karbantartás túllépve (-)'
        pt: 'Manutenção em atraso (-)'

  UNUSED_1:
