  TIME:
    bits: '2.3-3.0'
    comment:
      en: 'Number of days before/after the maintenance due date'
      fr: 'Nombre de jours avant/après l''échéance de maintenance'
      es: 'Número de días antes/después del vencimiento del mantenimiento'
      de: 'Anzahl der Tage vor/nach dem Wartungstermin'
      it: 'Numero di giorni prima/dopo la scadenza della manutenzione'
      pl: 'Liczba dni przed/po terminie przeglądu'
      ru: 'Количество дней до/после срока обслуживания'
      zh: '距保养到期前/后的天数'
      hu: 'A szerviz esedékessége előtti/utáni napok száma'
      pt: 'Número de dias antes/depois do vencimento da manutenção'
    type: 'uint'
