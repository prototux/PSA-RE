id: 0x31C
name: 'TRIP_COMPUTER_STATUS'
type: 'can'
length: 5
comment:
  en: 'Trip computer status: vehicle info display, self-check request/stop, trip 1/2 and partial odometer reset requests, message acknowledgement.'
  fr: 'État de l''ordinateur de bord : affichage des infos véhicule, demande/arrêt d''autocontrôle, demandes de remise à zéro trajet 1/2 et de l''odomètre partiel, accusé de réception message.'
  es: 'Estado del ordenador de a bordo: visualización de información del vehículo, solicitud/parada de autocomprobación, solicitudes de reinicio de trayecto 1/2 y del odómetro parcial, confirmación de mensaje.'
  de: 'Status des Bordcomputers: Fahrzeuginfoanzeige, Selbsttestanforderung/-stopp, Reset-Anforderungen Fahrt 1/2 und Tageskilometerzähler, Nachrichtenbestätigung.'
  it: 'Stato del computer di bordo: visualizzazione info veicolo, richiesta/arresto autotest, richieste di azzeramento percorso 1/2 e contachilometri parziale, conferma messaggio.'
  pl: 'Stan komputera pokładowego: wyświetlanie informacji o pojeździe, żądanie/zatrzymanie autotestu, żądania resetu trasy 1/2 i licznika przebiegu częściowego, potwierdzenie komunikatu.'
  ru: 'Статус бортового компьютера: отображение информации об автомобиле, запрос/остановка самопроверки, запросы сброса маршрута 1/2 и суточного пробега, подтверждение сообщения.'
  zh: '行车电脑状态:车辆信息显示、自检请求/停止、行程1/2及小计里程复位请求、消息确认。'
  hu: 'A fedélzeti számítógép állapota: járműinformáció kijelzése, önteszt kérése/leállítása, 1/2. útvonal és részleges kilométeróra nullázási kérései, üzenetnyugtázás.'
  pt: 'Estado do computador de bordo: apresentação de informação do veículo, pedido/paragem de autoverificação, pedidos de reposição das viagens 1/2 e do conta-quilómetros parcial, confirmação de mensagem.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['200ms', 'trigger']
senders: ['CMB', 'MATT']
receivers: ['BSI']

