id: 0x169
name: 'NAV_ARRIVAL_INFO'
type: 'can'
length: 8
comment:
  en: 'Navigation guidance data to the display: altitude, arrival estimate, remaining distance and calculation status.'
  fr: 'Données de guidage navigation vers l''écran : altitude, estimation d''arrivée, distance restante et état de calcul.'
  es: 'Datos de guía de navegación hacia la pantalla: altitud, estimación de llegada, distancia restante y estado de cálculo.'
  de: 'Navigations-Führungsdaten an das Display: Höhe, Ankunftsschätzung, Restdistanz und Berechnungsstatus.'
  it: 'Dati di guida alla navigazione verso il display: altitudine, stima di arrivo, distanza residua e stato di calcolo.'
  pl: 'Dane prowadzenia nawigacji do wyświetlacza: wysokość, szacowany czas przyjazdu, pozostała odległość i stan obliczeń.'
  ru: 'Данные навигационного сопровождения для дисплея: высота, расчётное время прибытия, оставшееся расстояние и статус вычисления.'
  zh: '发送给显示屏的导航引导数据:海拔、预计到达、剩余距离及计算状态。'
  hu: 'A kijelzőnek küldött navigációs vezetési adatok: tengerszint feletti magasság, érkezésbecslés, hátralévő távolság és számítási állapot.'
  pt: 'Dados de guiamento de navegação para o ecrã: altitude, estimativa de chegada, distância restante e estado de cálculo.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['1000ms', 'trigger']
senders: ['ICSV', 'BTEL', 'OVIP']
receivers: ['BSI', 'VTH', 'MATT', 'CMB']

