    comment:
      en: 'Lane keeping assist (LKA) button pressed by the user'
      fr: 'Bouton d''aide au maintien dans la voie (LKA) actionné par l''utilisateur'
      es: 'Botón de asistencia de mantenimiento de carril (LKA) pulsado por el usuario'
      de: 'Spurhalteassistent-(LKA-)Taste vom Nutzer gedrückt'
      it: 'Pulsante di mantenimento della corsia (LKA) premuto dall''utente'
      pl: 'Przycisk asystenta utrzymania pasa ruchu (LKA) wciśnięty przez użytkownika'
      ru: 'Кнопка помощника удержания в полосе (LKA) нажата пользователем'
      zh: '用户按下车道保持辅助(LKA)按钮'
      hu: 'A sávtartó asszisztens (LKA) gombját a felhasználó megnyomta'
      pt: 'Botão de assistência de manutenção de faixa (LKA) acionado pelo utilizador'
