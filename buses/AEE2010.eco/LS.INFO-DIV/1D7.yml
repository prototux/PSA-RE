id: 0x1D7
name: 'LEFT_LED_HEADLAMP_DRIVER_DATA'
type: 'can'
length: 1
comment:
  en: 'Steering wheel button status: lane keep/positioning assist activation, driving mode selector, heated steering wheel request.'
  fr: 'État des boutons au volant : activation de l''aide au maintien/positionnement dans la voie, sélecteur de mode de conduite, demande de volant chauffant.'
  es: 'Estado de los botones del volante: activación de la asistencia de mantenimiento/posicionamiento en el carril, selector de modo de conducción, solicitud de volante calefactado.'
  de: 'Status der Lenkradtasten: Aktivierung Spurhalte-/Spurpositionierungsassistent, Fahrmoduswahlschalter, Anforderung Lenkradheizung.'
  it: 'Stato dei pulsanti al volante: attivazione dell''assistenza al mantenimento/posizionamento in corsia, selettore modalità di guida, richiesta volante riscaldato.'
  pl: 'Stan przycisków na kierownicy: aktywacja asystenta utrzymania/pozycjonowania na pasie ruchu, przełącznik trybu jazdy, żądanie podgrzewanej kierownicy.'
  ru: 'Статус кнопок на руле: активация ассистента удержания/позиционирования в полосе, переключатель режима движения, запрос подогрева руля.'
  zh: '方向盘按钮状态:车道保持/定位辅助激活、驾驶模式选择器、方向盘加热请求。'
  hu: 'A kormánykerék gombjainak állapota: sávtartó/pozicionáló asszisztens aktiválása, vezetési mód választó, fűthető kormány kérése.'
  pt: 'Estado dos botões do volante: ativação da assistência de manutenção/posicionamento em faixa, seletor de modo de condução, pedido de aquecimento do volante.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['100ms', 'trigger']
senders: ['CMB', 'OVIP']
receivers: ['BSI']

signals:
  LKA_BUTTON_PRESSED:
