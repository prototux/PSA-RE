id: 0x527
name: 'TE_SUPERVISION'
type: 'can'
length: 8
comment:
  en: 'Hybrid control unit (HCU1) data: charge authorisations, available energy and mains power state.'
  fr: 'Données du calculateur hybride (HCU1) : autorisations de charge, énergie disponible et état de l''alimentation secteur.'
  es: 'Datos de la unidad de control híbrida (HCU1): autorizaciones de carga, energía disponible y estado de la alimentación de red.'
  de: 'Daten des Hybridsteuergeräts (HCU1): Ladefreigaben, verfügbare Energie und Netzversorgungszustand.'
  it: 'Dati della centralina ibrida (HCU1): autorizzazioni di ricarica, energia disponibile e stato dell''alimentazione di rete.'
  pl: 'Dane sterownika hybrydowego (HCU1): zezwolenia na ładowanie, dostępna energia i stan zasilania sieciowego.'
  ru: 'Данные гибридного блока управления (HCU1): разрешения на зарядку, доступная энергия и состояние сетевого питания.'
  zh: '混合动力控制单元(HCU1)数据:充电授权、可用能量和市电供电状态。'
  hu: 'A hibrid vezérlőegység (HCU1) adatai: töltési engedélyek, elérhető energia és hálózati tápellátás állapota.'
  pt: 'Dados da unidade de controlo híbrida (HCU1): autorizações de carga, energia disponível e estado da alimentação de rede.'
observations:
  en: 'On state change of: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE'
  fr: 'Sur changement d''état de : COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE'
  es: 'Al cambiar el estado de: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE'
  de: 'Bei Statusänderung von: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE'
  it: 'Al cambiamento di stato di: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE'
  pl: 'Wysyłane przy zmianie stanu: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE'
  ru: 'При изменении состояния: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE'
  zh: '当ETAT_MTH, ELECTRIC_MOTOR_STATUS, RECHARGE状态变化时'
  hu: 'A(z) COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE állapotváltozásakor'
  pt: 'Na mudança de estado de: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE'
periodicity: ['100ms', 'trigger']
senders: ['HCU1']
receivers: ['ABS', 'BSI', 'BCP']

