id: 0x5A7
name: 'HYBRID_VEHICLE_STOP_TIMER_3'
type: 'can'
length: 2
comment:
  en: 'Hybrid control data: time before vehicle stop.'
  fr: 'Données du contrôle hybride : temps avant arrêt du véhicule.'
  es: 'Datos del control híbrido: tiempo antes de la parada del vehículo.'
  de: 'Hybridsteuerungsdaten: Zeit bis zum Fahrzeugstillstand.'
  it: 'Dati del controllo ibrido: tempo prima dell''arresto del veicolo.'
  pl: 'Dane kontroli hybrydowej: czas do zatrzymania pojazdu.'
  ru: 'Данные гибридного управления: время до остановки автомобиля.'
  zh: '混合动力控制数据:车辆停止前的时间。'
  hu: 'Hibrid vezérlési adatok: a jármű megállásáig hátralévő idő.'
  pt: 'Dados de controlo híbrido: tempo até à paragem do veículo.'
periodicity: ['1000ms']
senders: ['HCU1']
receivers: ['BSI']

signals:
  BATTERY_THEORETICAL_MAX_CAPACITY:
    bits: '1.7-1.0'
    comment:
      en: 'Theoretical maximum capacity of the battery (kJ)'
      fr: 'Capacité maximale théorique de la batterie (kJ)'
      es: 'Capacidad máxima teórica de la batería (kJ)'
      de: 'Theoretische maximale Kapazität der Batterie (kJ)'
      it: 'Capacità massima teorica della batteria (kJ)'
      pl: 'Teoretyczna maksymalna pojemność akumulatora (kJ)'
      ru: 'Теоретическая максимальная ёмкость батареи (кДж)'
      zh: '电池理论最大容量(kJ)'
      hu: 'Az akkumulátor elméleti maximális kapacitása (kJ)'
      pt: 'Capacidade máxima teórica da bateria (kJ)'
    type: 'uint'
    factor: 256
    min: 0
    max: 60000
    units: 'kJ'
    invalid: 0x0F

  HV_BATTERY_CURRENT_INTEGRAL:
    bits: '2.7-2.1'
    comment:
      en: 'Integral of the HV traction battery current (A.h)'
      fr: 'Intégrale du courant de la batterie de traction haute tension (A.h)'
      es: 'Integral de la corriente de la batería de tracción de alta tensión (A.h)'
      de: 'Integral des Stroms der Hochvolt-Traktionsbatterie (A.h)'
      it: 'Integrale della corrente della batteria di trazione ad alta tensione (A.h)'
      pl: 'Całka prądu akumulatora trakcyjnego wysokiego napięcia (A.h)'
      ru: 'Интеграл тока высоковольтной тяговой батареи (А·ч)'
      zh: '高压牵引电池电流积分(A.h)'
      hu: 'A nagyfeszültségű vontatóakkumulátor áramának integrálja (A.h)'
      pt: 'Integral da corrente da bateria de tração de alta tensão (A.h)'
    type: 'uint'
    factor: 1
    offset: -48
    min: -48
    max: 80
    units: 'Ah'
    invalid: 0x7F
    default: 0x30

  UNUSED_1:
    bits: '2.0'
    unused: true
