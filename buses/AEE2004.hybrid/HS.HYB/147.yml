        fr: 'Accostage par le haut'
        es: 'Acoplamiento por arriba'
        de: 'Andocken von oben'
        it: 'Aggancio dall''alto'
        pl: 'Dokowanie od góry'
        ru: 'Стыковка сверху'
        zh: '从上方对接'
        hu: 'Felülről történő dokkolás'
        pt: 'Acoplamento por cima'

  CLUTCH_TORQUE_REQUEST:
    bits: '4.5-5.0'
    comment:
      en: 'Clutch torque request'
      fr: 'Consigne de couple d''embrayage'
      es: 'Consigna de par de embrague'
      de: 'Kupplungsdrehmoment-Sollwert'
      it: 'Richiesta di coppia della frizione'
      pl: 'Żądany moment obrotowy sprzęgła'
      ru: 'Заданный момент сцепления'
      zh: '离合器扭矩请求'
      hu: 'Kuplung nyomatékigénye'
      pt: 'Consigna de binário de embraiagem'
    type: 'uint'
    factor: 0.0625
    offset: -500
    min: -500
    max: 500
    units: 'Nm'
    invalid: 0x3FFF
    default: 0x1F40

  GEARBOX_COORDINATED_TORQUE_LIMIT:
    bits: '6.5-7.0'
    comment:
      en: 'Torque coordinated with gearbox limitations'
      fr: 'Couple coordonné avec les limitations de la boîte de vitesses'
      es: 'Par coordinado con las limitaciones de la caja de cambios'
