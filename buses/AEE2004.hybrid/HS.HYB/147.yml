      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
        en: 'Request in progress'
        fr: 'Demande en cours'
        es: 'Solicitud en curso'
        de: 'Anforderung läuft'
        it: 'Richiesta in corso'
        pl: 'Żądanie w toku'
        ru: 'Запрос выполняется'
        zh: '请求进行中'
        hu: 'Kérés folyamatban'
        pt: 'Pedido em curso'

  GEAR_ENGAGEMENT_APPROACH_TYPE:
    bits: '4.6'
    comment:
      en: 'Gear engagement approach type (from below or from above)'
      fr: 'Type d''approche pour l''engagement du rapport (par le bas ou par le haut)'
      es: 'Tipo de aproximación para el engranaje de la marcha (por abajo o por arriba)'
      de: 'Anfahrtstyp zum Einlegen des Gangs (von unten oder von oben)'
      it: 'Tipo di approccio per l''innesto della marcia (dal basso o dall''alto)'
      pl: 'Rodzaj podejścia do włączenia biegu (od dołu lub od góry)'
      ru: 'Тип подхода к включению передачи (снизу или сверху)'
      zh: '挂挡方式(自下方或自上方)'
      hu: 'A fokozat bekapcsolásának megközelítési típusa (alulról vagy felülről)'
      pt: 'Tipo de aproximação para o engate da mudança (por baixo ou por cima)'
    type: 'bool'
    default: 0x00
