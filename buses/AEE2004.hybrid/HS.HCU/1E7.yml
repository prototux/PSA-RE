id: 0x1E7
name: 'ARTIV_AND_HYBRID_STATUS'
type: 'can'
length: 8
comment:
  en: 'Front electric-motor torque and voltage setpoints, torque gradient limit and DC/DC converter mode, from the hybrid control unit.'
  fr: 'Consignes de couple et de tension du moteur électrique avant, limite de gradient de couple et mode du convertisseur DC/DC, issues du calculateur hybride.'
  es: 'Consignas de par y tensión del motor eléctrico delantero, límite de gradiente de par y modo del convertidor DC/DC, procedentes de la centralita híbrida.'
  de: 'Drehmoment- und Spannungs-Sollwerte des vorderen Elektromotors, Grenze des Drehmomentgradienten und DC/DC-Wandlermodus vom Hybridsteuergerät.'
  it: 'Valori richiesti di coppia e tensione del motore elettrico anteriore, limite del gradiente di coppia e modalità del convertitore DC/DC, dalla centralina ibrida.'
  pl: 'Zadane wartości momentu i napięcia przedniego silnika elektrycznego, ograniczenie gradientu momentu oraz tryb przetwornicy DC/DC z hybrydowego sterownika.'
  ru: 'Заданные значения крутящего момента и напряжения переднего электродвигателя, ограничение градиента момента и режим преобразователя DC/DC от гибридного блока управления.'
  zh: '前置电动机的扭矩和电压设定值、扭矩梯度限制及DC/DC变换器模式,来自混合动力控制单元。'
  hu: 'Az első elektromos motor nyomaték- és feszültség-alapjelei, a nyomatékgradiens határértéke, valamint a DC/DC átalakító üzemmódja a hibrid vezérlőegységtől.'
  pt: 'Pontos de ajuste de binário e tensão do motor elétrico dianteiro, limite de gradiente de binário e modo do conversor DC/DC, da unidade de controlo híbrida.'
periodicity: ['10ms']
senders: ['HCU1']
receivers: ['HCU2']

signals:
  CHECKSUM:
    bits: '1.7-1.4'
    comment:
      en: 'Frame checksum'
      fr: 'Somme de contrôle de la trame'
      es: 'Suma de comprobación de la trama'
      de: 'Frame-Prüfsumme'
      it: 'Checksum del frame'
      pl: 'Suma kontrolna ramki'
      ru: 'Контрольная сумма кадра'
      zh: '帧校验和'
      hu: 'Keret ellenőrző összege'
      pt: 'Soma de verificação da trama'
    type: 'uint'

  PROCESS_COUNTER:
    bits: '1.3-1.0'
    comment:
      en: 'Rolling counter incremented at each calculation cycle'
      fr: 'Compteur cyclique incrémenté à chaque cycle de calcul'
      es: 'Contador cíclico incrementado en cada ciclo de cálculo'
      de: 'Zyklischer Zähler, der bei jedem Berechnungszyklus erhöht wird'
      it: 'Contatore ciclico incrementato a ogni ciclo di calcolo'
      pl: 'Licznik cykliczny zwiększany przy każdym cyklu obliczeń'
      ru: 'Циклический счётчик, увеличивающийся на каждом цикле расчёта'
      zh: '每个计算周期递增的循环计数器'
      hu: 'A számítási ciklus minden lépésekor növekvő ciklikus számláló'
      pt: 'Contador cíclico incrementado a cada ciclo de cálculo'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00

  ENGINE_SPEED_CONTROLLER_PROPORTIONAL_GAIN:
    bits: '2.7-3.7'
    comment:
      en: 'Proportional gain of the engine speed controller'
      fr: 'Gain proportionnel du régulateur de régime moteur'
      es: 'Ganancia proporcional del regulador de régimen del motor'
      de: 'Proportionalverstärkung des Motordrehzahlreglers'
      it: 'Guadagno proporzionale del regolatore di regime motore'
      pl: 'Wzmocnienie proporcjonalne regulatora prędkości obrotowej silnika'
      ru: 'Пропорциональный коэффициент регулятора частоты вращения двигателя'
      zh: '发动机转速调节器比例增益'
      hu: 'A motorfordulatszám-szabályozó arányos erősítése'
      pt: 'Ganho proporcional do controlador de regime do motor'
    type: 'uint'
    factor: 0.03125
    min: 0
    max: 15.9375
    invalid: 0x1FF

  ENGINE_SPEED_CONTROLLER_INTEGRAL_GAIN:
    bits: '3.6-4.6'
    comment:
      en: 'Integral gain of the engine speed controller'
      fr: 'Gain intégral du régulateur de régime moteur'
      es: 'Ganancia integral del regulador de régimen del motor'
      de: 'Integralverstärkung des Motordrehzahlreglers'
      it: 'Guadagno integrale del regolatore di regime motore'
      pl: 'Wzmocnienie całkujące regulatora prędkości obrotowej silnika'
      ru: 'Интегральный коэффициент регулятора частоты вращения двигателя'
      zh: '发动机转速调节器积分增益'
      hu: 'A motorfordulatszám-szabályozó integráló erősítése'
      pt: 'Ganho integral do controlador de regime do motor'
    type: 'uint'
    factor: 0.03125
    min: 0
    max: 15.9375
    invalid: 0x1FF

  FRONT_EMOTOR_TORQUE_RAMP:
    bits: '4.5-5.5'
    comment:
      en: 'Front electric machine torque ramp'
      fr: 'Gradient de couple de la machine électrique avant'
      es: 'Gradiente de par de la máquina eléctrica delantera'
      de: 'Drehmomentrampe der vorderen E-Maschine'
      it: 'Gradiente di coppia della macchina elettrica anteriore'
      pl: 'Gradient momentu obrotowego przedniej maszyny elektrycznej'
      ru: 'Темп изменения момента передней электромашины'
      zh: '前电机扭矩变化率'
      hu: 'Az első elektromos gép nyomatékgradiense'
      pt: 'Rampa de binário da máquina elétrica dianteira'
    type: 'uint'
    factor: 10
    min: 0
    max: 3000
    units: 'Nm/s'
    invalid: 0x1FF
    default: 0x32

  EXTERNAL_SPEED_CONTROLLER_PROPORTIONAL_GAIN:
    bits: '5.4-6.4'
    comment:
      en: 'Proportional gain of the external speed regulation'
      fr: 'Gain proportionnel de la régulation externe de régime'
      es: 'Ganancia proporcional de la regulación externa de régimen'
      de: 'Proportionalverstärkung der externen Drehzahlregelung'
      it: 'Guadagno proporzionale della regolazione esterna di regime'
      pl: 'Wzmocnienie proporcjonalne zewnętrznej regulacji prędkości obrotowej'
      ru: 'Пропорциональный коэффициент внешнего регулирования частоты вращения'
      zh: '外部转速调节比例增益'
      hu: 'A külső fordulatszám-szabályozás arányos erősítése'
      pt: 'Ganho proporcional da regulação de velocidade externa'
    type: 'uint'
    factor: 0.03125
    min: 0
    max: 15.9375
    invalid: 0x1FF
