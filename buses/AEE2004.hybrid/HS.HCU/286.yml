id: 0x286
name: 'HCU2_DYNAMIC_DATA_5'
type: 'can'
length: 8
comment:
  en: 'Front electric-motor current and fault states (short circuit, mode, performance), from the hybrid control unit.'
  fr: 'Courant et états de défaut (court-circuit, mode, performance) du moteur électrique avant, issus du calculateur hybride.'
  es: 'Corriente y estados de fallo (cortocircuito, modo, rendimiento) del motor eléctrico delantero, procedentes de la centralita híbrida.'
  de: 'Strom und Fehlerzustände (Kurzschluss, Modus, Leistung) des vorderen Elektromotors vom Hybridsteuergerät.'
  it: 'Corrente e stati di guasto (cortocircuito, modalità, prestazioni) del motore elettrico anteriore, dalla centralina ibrida.'
  pl: 'Prąd i stany usterek (zwarcie, tryb, wydajność) przedniego silnika elektrycznego z hybrydowego sterownika.'
  ru: 'Ток и статусы неисправностей (короткое замыкание, режим, производительность) переднего электродвигателя от гибридного блока управления.'
  zh: '前置电动机的电流及故障状态(短路、模式、性能),来自混合动力控制单元。'
  hu: 'Az első elektromos motor árama és hibaállapotai (rövidzárlat, üzemmód, teljesítmény) a hibrid vezérlőegységtől.'
  pt: 'Corrente e estados de avaria (curto-circuito, modo, desempenho) do motor elétrico dianteiro, da unidade de controlo híbrida.'
periodicity: ['10ms']
senders: ['HCU2']
receivers: ['HCU1']

signals:
  CHECKSUM:
    bits: '1.7-1.4'
    comment:
      en: 'Frame checksum'
      fr: 'Somme de contrôle de la trame'
      es: 'Suma de comprobación de la trama'
      de: 'Frame-Prüfsumme'
      it: 'Checksum del frame'
      pl: 'Suma kontrolna ramki'
      ru: 'Контрольная сумма кадра'
      zh: '帧校验和'
      hu: 'Keret ellenőrző összege'
      pt: 'Soma de verificação da trama'
    type: 'uint'

  PROCESS_COUNTER:
    bits: '1.3-1.0'
    comment:
      en: 'Rolling counter incremented at each calculation cycle'
      fr: 'Compteur cyclique incrémenté à chaque cycle de calcul'
      es: 'Contador cíclico incrementado en cada ciclo de cálculo'
      de: 'Zyklischer Zähler, der bei jedem Berechnungszyklus erhöht wird'
      it: 'Contatore ciclico incrementato a ogni ciclo di calcolo'
      pl: 'Licznik cykliczny zwiększany przy każdym cyklu obliczeń'
      ru: 'Циклический счётчик, увеличивающийся на каждом цикле расчёта'
      zh: '每个计算周期递增的循环计数器'
      hu: 'A számítási ciklus minden lépésekor növekvő ciklikus számláló'
      pt: 'Contador cíclico incrementado a cada ciclo de cálculo'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00

  DCDC_HARDWARE_FAULT:
    bits: '2.7'
    comment:
      en: 'DC/DC converter hardware fault'
      fr: 'Défaut matériel du convertisseur DC/DC'
      es: 'Fallo de hardware del convertidor DC/DC'
      de: 'Hardwarefehler des DC/DC-Wandlers'
      it: 'Guasto hardware del convertitore DC/DC'
      pl: 'Usterka sprzętowa przetwornicy DC/DC'
      ru: 'Аппаратная неисправность DC/DC-преобразователя'
      zh: 'DC/DC转换器硬件故障'
      hu: 'A DC/DC átalakító hardverhibája'
      pt: 'Falha de hardware do conversor DC/DC'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No fault detected'
        fr: 'Pas de défaut'
        es: 'Sin fallo'
        de: 'Kein Fehler'
        it: 'Nessun guasto'
        pl: 'Brak usterki'
        ru: 'Неисправность не обнаружена'
        zh: '未检测到故障'
        hu: 'Nincs hiba'
        pt: 'Nenhuma avaria detetada'
      0x01:
        en: 'Hardware fault detected'
        fr: 'Défaut matériel détecté'
        es: 'Fallo de hardware detectado'
        de: 'Hardwarefehler erkannt'
        it: 'Guasto hardware rilevato'
        pl: 'Wykryto usterkę sprzętową'
        ru: 'Обнаружена аппаратная неисправность'
        zh: '检测到硬件故障'
        hu: 'Hardverhiba észlelve'
        pt: 'Avaria de hardware detetada'

  LV_SIDE_CURRENT:
    bits: '2.2-4.5'
    comment:
      en: 'Low-voltage side current'
      fr: 'Courant côté basse tension'
      es: 'Corriente en el lado de baja tensión'
      de: 'Strom auf der Niedervoltseite'
      it: 'Corrente lato bassa tensione'
      pl: 'Prąd po stronie niskiego napięcia'
      ru: 'Ток на стороне низкого напряжения'
      zh: '低压侧电流'
      hu: 'Áram a kisfeszültségű oldalon'
      pt: 'Corrente no lado de baixa tensão'
