        fr: 'Veille'
        es: 'En espera'
        de: 'Standby'
        it: 'Standby'
        pl: 'Tryb czuwania'
        ru: 'Ожидание'
        zh: '待机'
        hu: 'Készenlét'
        pt: 'Em espera'
      0x01:
        en: 'Buck'
        fr: 'Abaisseur'
        es: 'Reductor'
        de: 'Abwärtswandler'
        it: 'Buck (riduttore)'
        pl: 'Obniżający (buck)'
        ru: 'Понижающий (buck)'
        zh: '降压'
        hu: 'Csökkentő (buck)'
        pt: 'Buck'
      0x02:
        en: 'Boost'
        fr: 'Boost'
        es: 'Boost'
        de: 'Boost'
        it: 'Boost'
        pl: 'Boost'
        ru: 'Boost (форсаж)'
        zh: '增压'
        hu: 'Boost'
        pt: 'Boost'
      0x03:
        en: 'Derating'
        fr: 'Réduction de puissance'
        es: 'Reducción de potencia'
        de: 'Leistungsreduzierung'
        it: 'Riduzione di potenza'
        pl: 'Ograniczenie mocy'
        ru: 'Снижение мощности'
        zh: '降额'
        hu: 'Teljesítménycsökkentés'
        pt: 'Redução de potência'
      0x04:
        en: 'Failure'
        fr: 'Défaillance'
        es: 'Fallo'
        de: 'Ausfall'
        it: 'Guasto'
        pl: 'Awaria'
        ru: 'Отказ'
        zh: '故障'
        hu: 'Meghibásodás'
        pt: 'Falha'
      0x05:
        en: 'Off'
        fr: 'Arrêt'
        es: 'Apagado'
        de: 'Aus'
        it: 'Spento'
        pl: 'Wyłączone'
        ru: 'Выключено'
        zh: '关闭'
        hu: 'Kikapcsolva'
        pt: 'Desligado'
      0x06:
        unused: true
      0x07:
        en: 'Init'
        fr: 'Initialisation'
        es: 'Inicialización'
        de: 'Initialisierung'
        it: 'Inizializzazione'
        pl: 'Inicjalizacja'
        ru: 'Инициализация'
        zh: '初始化'
        hu: 'Inicializálás'
        pt: 'Inicialização'

  HCU2_POWER_LATCH_REQUEST:
    bits: '3.4'
    comment:
      en: 'HCU2 power latch request'
      fr: 'Demande de maintien d''alimentation (power latch) du HCU2'
      es: 'Solicitud de retención de alimentación (power latch) del HCU2'
      de: 'Anforderung der Selbsthaltung (Power Latch) des HCU2'
      it: 'Richiesta di automantenimento dell''alimentazione (power latch) dell''HCU2'
      pl: 'Żądanie podtrzymania zasilania (power latch) HCU2'
      ru: 'Запрос удержания питания (power latch) HCU2'
      zh: 'HCU2电源自锁请求'
      hu: 'A HCU2 önfenntartó tápellátásának (power latch) kérése'
      pt: 'Pedido de retenção de alimentação (power latch) do HCU2'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
        en: 'Requested'
        fr: 'Demandé'
        es: 'Solicitado'
        de: 'Angefordert'
        it: 'Richiesto'
        pl: 'Żądane'
        ru: 'Запрошено'
        zh: '已请求'
        hu: 'Kérve'
        pt: 'Pedido'

  FRONT_EMOTOR_FID:
    bits: '3.3-5.4'
    comment:
      en: 'Front electric machine identifier (FID)'
      fr: 'Identifiant (FID) de la machine électrique avant'
      es: 'Identificador (FID) de la máquina eléctrica delantera'
      de: 'Kennung (FID) der vorderen E-Maschine'
      it: 'Identificativo (FID) della macchina elettrica anteriore'
      pl: 'Identyfikator (FID) przedniej maszyny elektrycznej'
      ru: 'Идентификатор (FID) передней электромашины'
      zh: '前电机识别码(FID)'
      hu: 'Az első elektromos gép azonosítója (FID)'
      pt: 'Identificador (FID) da máquina elétrica dianteira'
    type: 'uint'
    min: 0
    max: 65535
    default: 0xFFFF

  FRONT_EMOTOR_COOLANT_TEMPERATURE:
    bits: '5.3-6.4'
    comment:
      en: 'Calculated coolant temperature of the front electric machine system'
      fr: 'Température calculée du système de refroidissement de la machine électrique avant'
      es: 'Temperatura calculada del sistema de refrigeración de la máquina eléctrica delantera'
      de: 'Berechnete Kühlmitteltemperatur des Systems der vorderen E-Maschine'
      it: 'Temperatura calcolata del sistema di raffreddamento della macchina elettrica anteriore'
      pl: 'Obliczona temperatura układu chłodzenia przedniej maszyny elektrycznej'
      ru: 'Расчётная температура охлаждающей жидкости системы передней электромашины'
      zh: '计算得出的前电机冷却系统温度'
      hu: 'Az első elektromosgép-rendszer számított hűtőfolyadék-hőmérséklete'
      pt: 'Temperatura calculada do sistema de refrigeração da máquina elétrica dianteira'
    type: 'uint'
    factor: 1
    offset: -40
    min: -40
    max: 214
    units: '°C'
    default: 0x28
