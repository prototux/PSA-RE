id: 0x4E6
name: 'HYBRID_MOTOR_TEMPERATURE'
type: 'can'
length: 4
comment:
  en: 'Hybrid electric motor temperatures: inverter, rotor and stator.'
  fr: 'Températures du moteur électrique hybride : onduleur, rotor et stator.'
  es: 'Temperaturas del motor eléctrico híbrido: inversor, rotor y estátor.'
  de: 'Temperaturen des Hybrid-Elektromotors: Wechselrichter, Rotor und Stator.'
  it: 'Temperature del motore elettrico ibrido: inverter, rotore e statore.'
  pl: 'Temperatury silnika elektrycznego hybrydy: falownik, wirnik i stojan.'
  ru: 'Температуры гибридного электродвигателя: инвертор, ротор и статор.'
  zh: '混合动力电机温度:逆变器、转子和定子。'
  hu: 'A hibrid elektromos motor hőmérsékletei: inverter, rotor és sztátor.'
  pt: 'Temperaturas do motor elétrico híbrido: inversor, rotor e estator.'
periodicity: ['100ms']
senders: ['HCU2']
receivers: ['HCU1']

signals:
  CHECKSUM:
    bits: '1.7-1.4'
    comment:
      en: 'Frame checksum'
      fr: 'Somme de contrôle de la trame'
      es: 'Suma de comprobación de la trama'
      de: 'Frame-Prüfsumme'
      it: 'Checksum del frame'
      pl: 'Suma kontrolna ramki'
      ru: 'Контрольная сумма кадра'
      zh: '帧校验和'
      hu: 'Keret ellenőrző összege'
      pt: 'Soma de verificação da trama'
    type: 'uint'

  PROCESS_COUNTER:
    bits: '1.3-1.0'
    comment:
      en: 'Rolling counter incremented at each calculation cycle'
      fr: 'Compteur cyclique incrémenté à chaque cycle de calcul'
      es: 'Contador cíclico incrementado en cada ciclo de cálculo'
      de: 'Zyklischer Zähler, der bei jedem Berechnungszyklus erhöht wird'
      it: 'Contatore ciclico incrementato a ogni ciclo di calcolo'
      pl: 'Licznik cykliczny zwiększany przy każdym cyklu obliczeń'
      ru: 'Циклический счётчик, увеличивающийся на каждом цикле расчёта'
      zh: '每个计算周期递增的循环计数器'
      hu: 'A számítási ciklus minden lépésekor növekvő ciklikus számláló'
      pt: 'Contador cíclico incrementado a cada ciclo de cálculo'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00

  INVERTER_TEMPERATURE:
    bits: '2.7-2.0'
    comment:
      en: 'Actual inverter temperature (°C)'
      fr: 'Température actuelle de l''onduleur (°C)'
      es: 'Temperatura actual del inversor (°C)'
      de: 'Aktuelle Wechselrichtertemperatur (°C)'
      it: 'Temperatura attuale dell''inverter (°C)'
      pl: 'Aktualna temperatura falownika (°C)'
      ru: 'Текущая температура инвертора (°C)'
      zh: '当前逆变器温度(°C)'
      hu: 'Az inverter aktuális hőmérséklete (°C)'
      pt: 'Temperatura atual do inversor (°C)'
    type: 'uint'
    factor: 1
    offset: -40
    min: -40
    max: 214
    units: '°C'
    invalid: 0xFF
    default: 0x00

  STATOR_TEMPERATURE:
    bits: '3.7-3.0'
    comment:
      en: 'Actual stator temperature (°C)'
      fr: 'Température actuelle du stator (°C)'
      es: 'Temperatura actual del estátor (°C)'
      de: 'Aktuelle Statortemperatur (°C)'
      it: 'Temperatura attuale dello statore (°C)'
      pl: 'Aktualna temperatura stojana (°C)'
      ru: 'Текущая температура статора (°C)'
      zh: '当前定子温度(°C)'
      hu: 'Az állórész aktuális hőmérséklete (°C)'
      pt: 'Temperatura atual do estator (°C)'
    type: 'uint'
    factor: 1
    offset: -40
    min: -40
    max: 214
    units: '°C'
    invalid: 0xFF
    default: 0x00

  ROTOR_TEMPERATURE:
    bits: '4.7-4.0'
    comment:
      en: 'Actual rotor temperature (°C)'
      fr: 'Température actuelle du rotor (°C)'
      es: 'Temperatura actual del rotor (°C)'
      de: 'Aktuelle Rotortemperatur (°C)'
      it: 'Temperatura attuale del rotore (°C)'
      pl: 'Aktualna temperatura wirnika (°C)'
      ru: 'Текущая температура ротора (°C)'
      zh: '当前转子温度(°C)'
      hu: 'A rotor aktuális hőmérséklete (°C)'
      pt: 'Temperatura atual do rotor (°C)'
    type: 'uint'
    factor: 1
    offset: -40
    min: -40
    max: 214
    units: '°C'
    invalid: 0xFF
    default: 0x3C
