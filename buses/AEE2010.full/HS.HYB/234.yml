id: 0x234
name: 'TRACTION_BATTERY_DYNAMIC_DATA_2'
type: 'can'
length: 8
comment:
  en: 'Traction battery management data: measured HV current/voltage, disconnect state, unexpected contactor opening and hydrogen detection.'
  fr: 'Données du gestionnaire de batterie de traction : courant/tension HT mesurés, état de déconnexion, ouverture de contacteur non commandée et détection d''hydrogène.'
  es: 'Datos del gestor de la batería de tracción: corriente/tensión de alta tensión medidas, estado de desconexión, apertura de contactor no ordenada y detección de hidrógeno.'
  de: 'Daten des Traktionsbatteriemanagements: gemessener HV-Strom/-Spannung, Trennzustand, unbefohlenes Öffnen des Schützes und Wasserstofferkennung.'
  it: 'Dati del gestore della batteria di trazione: corrente/tensione ad alta tensione misurate, stato di disconnessione, apertura non comandata del contattore e rilevamento di idrogeno.'
  pl: 'Dane zarządzania baterią trakcyjną: zmierzony prąd/napięcie wysokiego napięcia, stan odłączenia, niezamierzone otwarcie stycznika oraz wykrycie wodoru.'
  ru: 'Данные управления тяговой батареей: измеренные ток/напряжение высокого напряжения, состояние отключения, непреднамеренное размыкание контактора и обнаружение водорода.'
  zh: '牵引电池管理数据:实测高压电流/电压、断开状态、非指令性接触器断开及氢气检测。'
  hu: 'A vonóakkumulátor-kezelés adatai: a mért nagyfeszültségű áram/feszültség, leválasztási állapot, nem parancsra történő mágneskapcsoló-nyitás és hidrogénérzékelés.'
  pt: 'Dados de gestão da bateria de tração: corrente/tensão de alta tensão medidas, estado de desconexão, abertura inesperada do contactor e deteção de hidrogénio.'
periodicity: ['10ms']
senders: ['TBMU']
receivers: ['HCU1']

signals:
  FRAME_CHECKSUM:
    bits: '1.7-1.4'
    comment:
      en: 'Checksum of the frame'
      fr: 'Somme de contrôle (checksum) de la trame'
      es: 'Suma de comprobación (checksum) de la trama'
      de: 'Prüfsumme (Checksum) des Frames'
      it: 'Checksum del frame'
      pl: 'Suma kontrolna (checksum) ramki'
      ru: 'Контрольная сумма кадра'
      zh: '帧校验和'
      hu: 'A keret ellenőrző összege (checksum)'
      pt: 'Soma de verificação da trama'
    type: 'uint'

  PROCESS_COUNTER:
    bits: '1.3-1.0'
    comment:
      en: 'Rolling counter incremented at each calculation cycle'
      fr: 'Compteur cyclique incrémenté à chaque cycle de calcul'
      es: 'Contador cíclico incrementado en cada ciclo de cálculo'
      de: 'Zyklischer Zähler, der bei jedem Berechnungszyklus erhöht wird'
      it: 'Contatore ciclico incrementato a ogni ciclo di calcolo'
      pl: 'Licznik cykliczny zwiększany przy każdym cyklu obliczeń'
      ru: 'Циклический счётчик, увеличивающийся на каждом цикле расчёта'
      zh: '每个计算周期递增的循环计数器'
      hu: 'A számítási ciklus minden lépésekor növekvő ciklikus számláló'
      pt: 'Contador cíclico incrementado a cada ciclo de cálculo'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00

  HV_BATTERY_NOMINAL_DISCHARGE_POWER:
    bits: '2.7-2.0'
    comment:
      en: 'High-voltage battery nominal discharging power'
      fr: 'Puissance de décharge nominale de la batterie haute tension'
      es: 'Potencia de descarga nominal de la batería de alta tensión'
      de: 'Nennentladeleistung der Hochvoltbatterie'
      it: 'Potenza di scarica nominale della batteria ad alta tensione'
      pl: 'Nominalna moc rozładowania akumulatora wysokiego napięcia'
      ru: 'Номинальная мощность разряда высоковольтной батареи'
      zh: '高压电池额定放电功率'
      hu: 'A nagyfeszültségű akkumulátor névleges kisütési teljesítménye'
      pt: 'Potência de descarga nominal da bateria de alta tensão'
    type: 'uint'
    factor: 200
    min: 0
    max: 40000
    units: 'W'
    invalid: 0xFF
    default: 0x00

  HV_BATTERY_NOMINAL_CHARGE_POWER:
    bits: '3.7-3.0'
    comment:
      en: 'High-voltage battery nominal charging power'
      fr: 'Puissance de charge nominale de la batterie haute tension'
      es: 'Potencia de carga nominal de la batería de alta tensión'
      de: 'Nennladeleistung der Hochvoltbatterie'
