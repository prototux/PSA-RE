      en: 'TBMU acknowledge bit for the safety level'
      fr: 'Bit d''accusé de réception du TBMU pour le niveau de sécurité'
      es: 'Bit de acuse de recibo del TBMU para el nivel de seguridad'
      de: 'Quittierungsbit des TBMU für die Sicherheitsebene'
