      ru: 'Номинальная мощность заряда высоковольтной батареи'
      zh: '高压电池额定充电功率'
      hu: 'A nagyfeszültségű akkumulátor névleges töltési teljesítménye'
      pt: 'Potência de carga nominal da bateria de alta tensão'
    type: 'uint'
    factor: 200
    offset: -40000
    min: -40000
    max: 0
    units: 'W'
    invalid: 0xFF
    default: 0xC8

  PERFORMANCE_MODE_STATUS:
    bits: '4.7'
    comment:
      en: 'Performance mode activation status'
      fr: 'Etat d''activation du mode performance'
