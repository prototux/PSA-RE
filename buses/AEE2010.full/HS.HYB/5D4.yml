id: 0x5D4
name: 'HV_BATTERY_SAFETY_STATUS'
type: 'can'
length: 4
comment:
  en: 'High-voltage battery safety status from the battery management unit (TBMU): fuse state, insulation, crash signal and pyro-fuse control.'
  fr: 'État sécurité de la batterie haute tension issu du calculateur de gestion batterie (TBMU) : état du fusible, isolement, signal crash et pilotage pyrofusible.'
  es: 'Estado de seguridad de la batería de alta tensión de la unidad de gestión de batería (TBMU): estado del fusible, aislamiento, señal de choque y control del pirofusible.'
  de: 'Sicherheitsstatus der Hochvoltbatterie vom Batteriemanagement-Steuergerät (TBMU): Sicherungszustand, Isolation, Crashsignal und Pyrosicherungsansteuerung.'
  it: 'Stato di sicurezza della batteria ad alta tensione dalla centralina di gestione batteria (TBMU): stato del fusibile, isolamento, segnale crash e pilotaggio pirofusibile.'
  pl: 'Stan bezpieczeństwa akumulatora wysokiego napięcia ze sterownika zarządzania baterią (TBMU): stan bezpiecznika, izolacja, sygnał zderzenia i sterowanie bezpiecznikiem pirotechnicznym.'
  ru: 'Статус безопасности высоковольтной батареи от блока управления батареей (TBMU): состояние предохранителя, изоляция, сигнал столкновения и управление пиропредохранителем.'
  zh: '来自电池管理单元(TBMU)的高压电池安全状态:熔断器状态、绝缘、碰撞信号及烟火熔断器控制。'
  hu: 'A nagyfeszültségű akkumulátor biztonsági állapota az akkumulátor-vezérlő egységtől (TBMU): biztosíték állapota, szigetelés, ütközésjel és pirobiztosíték vezérlése.'
  pt: 'Estado de segurança da bateria de alta tensão da unidade de gestão da bateria (TBMU): estado do fusível, isolamento, sinal de colisão e comando do fusível pirotécnico.'
observations:
