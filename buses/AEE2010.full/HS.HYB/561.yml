id: 0x561
name: 'SCR_DYNAMIC_DATA'
type: 'can'
length: 4
comment:
  en: 'SCR (AdBlue) system data: dosing circuit pressure.'
  fr: 'Données du système SCR (AdBlue) : pression du circuit de dosage.'
  es: 'Datos del sistema SCR (AdBlue): presión del circuito de dosificación.'
  de: 'Daten des SCR-Systems (AdBlue): Druck im Dosierkreislauf.'
  it: 'Dati del sistema SCR (AdBlue): pressione del circuito di dosaggio.'
  pl: 'Dane układu SCR (AdBlue): ciśnienie w obwodzie dozowania.'
  ru: 'Данные системы SCR (AdBlue): давление в дозирующем контуре.'
  zh: 'SCR(AdBlue尿素)系统数据:计量回路压力。'
  hu: 'Az SCR (AdBlue) rendszer adatai: az adagolókör nyomása.'
  pt: 'Dados do sistema SCR (AdBlue): pressão do circuito de dosagem.'
observations:
  en: 'When UREA_LINE_PRESSURE rises above Threshold_1 after having been below Threshold_2'
  fr: 'Quand UREA_LINE_PRESSURE dépasse Threshold_1 après avoir été inférieur à Threshold_2'
  es: 'Cuando UREA_LINE_PRESSURE supera Threshold_1 tras haber estado por debajo de Threshold_2'
  de: 'Wenn UREA_LINE_PRESSURE über Threshold_1 steigt, nachdem es unter Threshold_2 lag'
  it: 'Quando UREA_LINE_PRESSURE supera Threshold_1 dopo essere stato inferiore a Threshold_2'
  pl: 'Gdy UREA_LINE_PRESSURE przekroczy Threshold_1 po tym, jak był poniżej Threshold_2'
  ru: 'Когда UREA_LINE_PRESSURE превышает Threshold_1 после того, как было ниже Threshold_2'
  zh: '当INFO_PRESSION_CIRCUIT在低于Threshold_2之后又升高超过Threshold_1时'
  hu: 'Amikor az UREA_LINE_PRESSURE a Threshold_2 alatti érték után a Threshold_1 fölé emelkedik'
  pt: 'Quando UREA_LINE_PRESSURE sobe acima do Threshold_1 após ter estado abaixo do Threshold_2'
periodicity: ['100ms', 'trigger']
senders: ['SCR']
receivers: ['CMM']

signals:
  UREA_ACCUMULATOR_VOLUME:
    bits: '1.7-1.0'
    comment:
      en: 'Urea (AdBlue) volume contained in the accumulator'
      fr: 'Volume d''urée (AdBlue) contenu dans l''accumulateur'
      es: 'Volumen de urea (AdBlue) contenido en el acumulador'
      de: 'Im Speicher enthaltenes Harnstoff-(AdBlue-)Volumen'
      it: 'Volume di urea (AdBlue) contenuto nell''accumulatore'
      pl: 'Objętość mocznika (AdBlue) zawarta w akumulatorze'
      ru: 'Объём мочевины (AdBlue) в накопителе'
      zh: '蓄能器中所含尿素(AdBlue)体积'
      hu: 'A tárolóban lévő karbamid (AdBlue) térfogata'
      pt: 'Volume de ureia (AdBlue) contido no acumulador'
    type: 'uint'
    factor: 0.25
    min: 0
    max: 60
    units: 'cm3'
    invalid: 0xFF

  UREA_TANK_LEVEL_EXTENDED:
    bits: '2.7-2.0'
    comment:
      en: 'Current urea (AdBlue) tank level, extended range'
      fr: 'Niveau étendu d''urée (AdBlue) courant dans le réservoir'
      es: 'Nivel extendido actual de urea (AdBlue) en el depósito'
      de: 'Aktueller erweiterter Harnstoff-(AdBlue-)Tankfüllstand'
      it: 'Livello esteso corrente di urea (AdBlue) nel serbatoio'
      pl: 'Bieżący rozszerzony poziom mocznika (AdBlue) w zbiorniku'
      ru: 'Текущий расширенный уровень мочевины (AdBlue) в баке'
      zh: '尿素(AdBlue)箱当前扩展液位'
      hu: 'A tartályban lévő karbamid (AdBlue) jelenlegi kiterjesztett szintje'
      pt: 'Nível atual estendido de ureia (AdBlue) no depósito'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 25.3
    units: 'L'
    invalid: 0xFF

  UREA_LINE_PRESSURE:
    bits: '3.7-4.6'
    comment:
      en: 'Urea (AdBlue) pressure measured/estimated in the delivery line'
      fr: 'Pression d''urée (AdBlue) mesurée/estimée dans la canalisation'
      es: 'Presión de urea (AdBlue) medida/estimada en la tubería'
      de: 'Gemessener/geschätzter Harnstoff-(AdBlue-)Druck in der Leitung'
      it: 'Pressione di urea (AdBlue) misurata/stimata nella tubazione'
      pl: 'Ciśnienie mocznika (AdBlue) mierzone/szacowane w przewodzie'
      ru: 'Измеренное/оценённое давление мочевины (AdBlue) в магистрали'
      zh: '管路中测得/估算的尿素(AdBlue)压力'
      hu: 'A vezetékben mért/becsült karbamid- (AdBlue-) nyomás'
      pt: 'Pressão de ureia (AdBlue) medida/estimada na linha de distribuição'
    type: 'uint'
    factor: 0.0125
    min: 0
    max: 10
    units: 'bar'
    default: 0x00

  UNUSED_1:
    bits: '4.5-4.0'
    unused: true
