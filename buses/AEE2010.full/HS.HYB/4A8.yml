id: 0x4A8
name: 'HYBRID_ENGINE_STATUS'
type: 'can'
length: 8
comment:
  en: 'Hybrid engine start/stop authorisations and torque data from the engine ECU (CMM).'
  fr: 'Autorisations de démarrage/arrêt moteur et données de couple hybride issues du calculateur moteur (CMM).'
  es: 'Autorizaciones de arranque/parada del motor y datos de par híbrido de la ECU del motor (CMM).'
  de: 'Motorstart-/Stoppfreigaben und Hybrid-Drehmomentdaten vom Motorsteuergerät (CMM).'
  it: 'Autorizzazioni di avviamento/arresto motore e dati di coppia ibrida dalla centralina motore (CMM).'
  pl: 'Zezwolenia na uruchomienie/zatrzymanie silnika i dane momentu obrotowego hybrydy ze sterownika silnika (CMM).'
  ru: 'Разрешения на пуск/остановку двигателя и данные гибридного крутящего момента от блока управления двигателем (CMM).'
  zh: '来自发动机控制单元(CMM)的混合动力发动机启停授权及扭矩数据。'
  hu: 'A hibrid motor indítási/leállítási engedélyei és nyomatékadatai a motorvezérlőtől (CMM).'
  pt: 'Autorizações de arranque/paragem do motor híbrido e dados de binário da unidade de controlo do motor (CMM).'
observations:
  en: 'On state change of: TORQUE_STRATEGY_ACTIVATION_REQUEST, ENGINE_START_REQUEST_COORDINATED, ANTI_STALL_STRATEGY_REQUEST, DPF_REGENERATION_REQUEST, COMBUSTION_BACKUP_MODE, ENGINE_BACKUP_MODE_2, ENGINE_BACKUP_SYSTEM_ACTIVE, ENGINE_BACKUP_SYSTEM_ACTIVE_2, ENGINE_BACKUP_MODE_5, ENGINE_BACKUP_MODE_6, DVA_PROTECTION_INTERVENTION'
  fr: 'Sur changement d''état de : TORQUE_STRATEGY_ACTIVATION_REQUEST, ENGINE_START_REQUEST_COORDINATED, ANTI_STALL_STRATEGY_REQUEST, DPF_REGENERATION_REQUEST, COMBUSTION_BACKUP_MODE, ENGINE_BACKUP_MODE_2, ENGINE_BACKUP_SYSTEM_ACTIVE, ENGINE_BACKUP_SYSTEM_ACTIVE_2, ENGINE_BACKUP_MODE_5, ENGINE_BACKUP_MODE_6, DVA_PROTECTION_INTERVENTION'
  es: 'Al cambiar el estado de: TORQUE_STRATEGY_ACTIVATION_REQUEST, ENGINE_START_REQUEST_COORDINATED, ANTI_STALL_STRATEGY_REQUEST, DPF_REGENERATION_REQUEST, COMBUSTION_BACKUP_MODE, ENGINE_BACKUP_MODE_2, ENGINE_BACKUP_SYSTEM_ACTIVE, ENGINE_BACKUP_SYSTEM_ACTIVE_2, ENGINE_BACKUP_MODE_5, ENGINE_BACKUP_MODE_6, DVA_PROTECTION_INTERVENTION'
  de: 'Bei Statusänderung von: TORQUE_STRATEGY_ACTIVATION_REQUEST, ENGINE_START_REQUEST_COORDINATED, ANTI_STALL_STRATEGY_REQUEST, DPF_REGENERATION_REQUEST, COMBUSTION_BACKUP_MODE, ENGINE_BACKUP_MODE_2, ENGINE_BACKUP_SYSTEM_ACTIVE, ENGINE_BACKUP_SYSTEM_ACTIVE_2, ENGINE_BACKUP_MODE_5, ENGINE_BACKUP_MODE_6, DVA_PROTECTION_INTERVENTION'
  it: 'Al cambiamento di stato di: TORQUE_STRATEGY_ACTIVATION_REQUEST, ENGINE_START_REQUEST_COORDINATED, ANTI_STALL_STRATEGY_REQUEST, DPF_REGENERATION_REQUEST, COMBUSTION_BACKUP_MODE, ENGINE_BACKUP_MODE_2, ENGINE_BACKUP_SYSTEM_ACTIVE, ENGINE_BACKUP_SYSTEM_ACTIVE_2, ENGINE_BACKUP_MODE_5, ENGINE_BACKUP_MODE_6, DVA_PROTECTION_INTERVENTION'
  pl: 'Wysyłane przy zmianie stanu: TORQUE_STRATEGY_ACTIVATION_REQUEST, ENGINE_START_REQUEST_COORDINATED, ANTI_STALL_STRATEGY_REQUEST, DPF_REGENERATION_REQUEST, COMBUSTION_BACKUP_MODE, ENGINE_BACKUP_MODE_2, ENGINE_BACKUP_SYSTEM_ACTIVE, ENGINE_BACKUP_SYSTEM_ACTIVE_2, ENGINE_BACKUP_MODE_5, ENGINE_BACKUP_MODE_6, DVA_PROTECTION_INTERVENTION'
  ru: 'При изменении состояния: TORQUE_STRATEGY_ACTIVATION_REQUEST, ENGINE_START_REQUEST_COORDINATED, ANTI_STALL_STRATEGY_REQUEST, DPF_REGENERATION_REQUEST, COMBUSTION_BACKUP_MODE, ENGINE_BACKUP_MODE_2, ENGINE_BACKUP_SYSTEM_ACTIVE, ENGINE_BACKUP_SYSTEM_ACTIVE_2, ENGINE_BACKUP_MODE_5, ENGINE_BACKUP_MODE_6, DVA_PROTECTION_INTERVENTION'
  zh: '当ACTIV_SC_HYB, ENGINE_START_REQUEST_COORDINATED, ANTI_STALL_STRATEGY_REQUEST, DPF_REGENERATION_REQUEST, COMBUSTION_BACKUP_MODE, ENGINE_BACKUP_MODE_2, ENGINE_BACKUP_SYSTEM_ACTIVE, ENGINE_BACKUP_SYSTEM_ACTIVE_2, ENGINE_BACKUP_MODE_5, ENGINE_BACKUP_MODE_6, DEFAILLANCE_CMM7状态变化时'
  hu: 'A(z) TORQUE_STRATEGY_ACTIVATION_REQUEST, ENGINE_START_REQUEST_COORDINATED, ANTI_STALL_STRATEGY_REQUEST, DPF_REGENERATION_REQUEST, COMBUSTION_BACKUP_MODE, ENGINE_BACKUP_MODE_2, ENGINE_BACKUP_SYSTEM_ACTIVE, ENGINE_BACKUP_SYSTEM_ACTIVE_2, ENGINE_BACKUP_MODE_5, ENGINE_BACKUP_MODE_6, DVA_PROTECTION_INTERVENTION állapotváltozásakor'
  pt: 'Na mudança de estado de: TORQUE_STRATEGY_ACTIVATION_REQUEST, ENGINE_START_REQUEST_COORDINATED, ANTI_STALL_STRATEGY_REQUEST, DPF_REGENERATION_REQUEST, COMBUSTION_BACKUP_MODE, ENGINE_BACKUP_MODE_2, ENGINE_BACKUP_SYSTEM_ACTIVE, ENGINE_BACKUP_SYSTEM_ACTIVE_2, ENGINE_BACKUP_MODE_5, ENGINE_BACKUP_MODE_6, DVA_PROTECTION_INTERVENTION'
periodicity: ['100ms', 'trigger']
senders: ['CMM']
receivers: ['HCU1', 'TBMU', 'HCU2']

