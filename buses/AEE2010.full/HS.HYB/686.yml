length: 8
comment:
  en: 'Diagnostic response relayed onto the CAN bus by a gateway module.'
  fr: 'Réponse de diagnostic relayée sur le réseau CAN par un calculateur passerelle.'
  es: 'Respuesta de diagnóstico retransmitida al bus CAN por un módulo pasarela.'
  de: 'Diagnoseantwort, von einem Gateway-Steuergerät auf den CAN-Bus weitergeleitet.'
  it: 'Risposta di diagnosi inoltrata sul bus CAN da una centralina gateway.'
  pl: 'Odpowiedź diagnostyczna przekazywana na magistrale CAN przez moduł bramy.'
  ru: 'Диагностический ответ, ретранслируемый на шину CAN шлюзовым блоком.'
  zh: '由网关模块转发到CAN总线的诊断响应。'
  hu: 'Egy átjáró vezérlőegység által a CAN buszra továbbított diagnosztikai válasz.'
  pt: 'Resposta de diagnóstico retransmitida na rede CAN por um módulo gateway.'
observations:
  en: 'Event-triggered, sent from the diagnostic tool to the ECU via BSI.'
  fr: 'Événementiel, envoyé de l''outil de diagnostic vers le calculateur via la BSI.'
  es: 'Basado en eventos, enviado desde la herramienta de diagnóstico hasta la ECU a través de la BSI.'
  de: 'Ereignisgesteuert, gesendet von das Diagnosegerät zu das Steuergerät über die BSI.'
  it: 'Basato su eventi, inviato da lo strumento diagnostico a la centralina tramite la BSI.'
  pl: 'Zdarzeniowe, wysyłane z narzędzie diagnostyczne do sterownik przez BSI.'
  ru: 'Событийное, передаётся от диагностический прибор к блок управления через BSI.'
  zh: '事件触发,从诊断工具发送到该ECU通过BSI。'
  hu: 'Eseményvezérelt, a diagnosztikai eszköz-tól a vezérlőegység felé küldve a BSI-n keresztül.'
  pt: 'Baseado em eventos, enviado da ferramenta de diagnóstico para a unidade de controlo via BSI.'
periodicity: ['trigger']
senders: ['CMEL']
receivers: ['VCU']

