      ru: 'Запрос рабочей ситуации, отправляемый блоку управления силовым агрегатом двигателем внутреннего сгорания'
      zh: '内燃机发送给动力总成ECU的运行状态请求'
      hu: 'A belső égésű motor által a hajtáslánc-vezérlőnek küldött üzemi helyzet kérés'
