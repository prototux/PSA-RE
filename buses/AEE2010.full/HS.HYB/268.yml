      de: 'Prüfsumme (Checksum) der Botschaft'
      it: 'Checksum del messaggio'
      pl: 'Suma kontrolna ramki'
      ru: 'Контрольная сумма кадра'
      zh: '报文校验和'
      hu: 'Üzenet ellenőrző összege (checksum)'
      pt: 'Soma de verificação da trama'
