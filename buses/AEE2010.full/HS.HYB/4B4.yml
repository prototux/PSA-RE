id: 0x4B4
name: 'HV_BATTERY_MANAGEMENT_DATA_4'
type: 'can'
length: 4
comment:
  en: 'HV battery management data: engine auto-stop authorisation, warning-lamp reset command and request, climate-control inhibition, engine action request, and battery state of charge/state of health.'
  fr: 'Données de gestion batterie HT : autorisation d''arrêt automatique moteur, commande et demande de remise à zéro du voyant, inhibition climatisation, demande d''action moteur, et état de charge/état de santé de la batterie.'
  es: 'Datos de gestión de batería de alta tensión: autorización de parada automática del motor, comando y solicitud de reinicio del testigo, inhibición de la climatización, solicitud de acción del motor, y estado de carga/estado de salud de la batería.'
  de: 'Hochvoltbatterie-Managementdaten: Freigabe des automatischen Motorstopps, Rücksetzbefehl und -anforderung der Kontrollleuchte, Klimaanlagensperre, Motoraktionsanforderung sowie Ladezustand/Alterungszustand der Batterie.'
  it: 'Dati di gestione batteria AT: autorizzazione arresto automatico motore, comando e richiesta di reset spia, inibizione climatizzazione, richiesta di azione motore, e stato di carica/stato di salute della batteria.'
  pl: 'Dane zarządzania akumulatorem WN: autoryzacja automatycznego zatrzymania silnika, polecenie i żądanie kasowania kontrolki, blokada klimatyzacji, żądanie działania silnika oraz stan naładowania/stan zdrowia akumulatora.'
  ru: 'Данные управления высоковольтной батареей: разрешение автоматической остановки двигателя, команда и запрос сброса индикатора, блокировка кондиционера, запрос действия двигателя, а также уровень заряда/состояние батареи.'
  zh: '高压电池管理数据:发动机自动停止授权、警示灯复位命令和请求、空调抑制、发动机动作请求,以及电池充电状态/健康状态。'
  hu: 'Nagyfeszültségű akkumulátor kezelési adatok: motor automatikus leállásának engedélyezése, jelzőlámpa visszaállítási parancs és kérés, klíma letiltása, motorművelet kérése, valamint az akkumulátor töltöttségi/állapotszintje.'
  pt: 'Dados de gestão da bateria de alta tensão: autorização de paragem automática do motor, comando e pedido de reposição da luz avisadora, inibição da climatização, pedido de ação do motor, e estado de carga/estado de saúde da bateria.'
observations:
  en: 'On state change of: HV_BATTERY_STATE, HV_BATTERY_CONTACTOR_UNCOMMANDED_OPEN_CAUSE, HV_BATTERY_INTERLOCK_LINE_STATUS, SERVICE_PLUG_STATUS, HV_BATTERY_MIN_VOLTAGE_WARNING, HV_BATTERY_WATER_DETECTED'
  fr: 'Sur changement d''état de : HV_BATTERY_STATE, HV_BATTERY_CONTACTOR_UNCOMMANDED_OPEN_CAUSE, HV_BATTERY_INTERLOCK_LINE_STATUS, SERVICE_PLUG_STATUS, HV_BATTERY_MIN_VOLTAGE_WARNING, HV_BATTERY_WATER_DETECTED'
  es: 'Al cambiar el estado de: HV_BATTERY_STATE, HV_BATTERY_CONTACTOR_UNCOMMANDED_OPEN_CAUSE, HV_BATTERY_INTERLOCK_LINE_STATUS, SERVICE_PLUG_STATUS, HV_BATTERY_MIN_VOLTAGE_WARNING, HV_BATTERY_WATER_DETECTED'
  de: 'Bei Statusänderung von: HV_BATTERY_STATE, HV_BATTERY_CONTACTOR_UNCOMMANDED_OPEN_CAUSE, HV_BATTERY_INTERLOCK_LINE_STATUS, SERVICE_PLUG_STATUS, HV_BATTERY_MIN_VOLTAGE_WARNING, HV_BATTERY_WATER_DETECTED'
  it: 'Al cambiamento di stato di: HV_BATTERY_STATE, HV_BATTERY_CONTACTOR_UNCOMMANDED_OPEN_CAUSE, HV_BATTERY_INTERLOCK_LINE_STATUS, SERVICE_PLUG_STATUS, HV_BATTERY_MIN_VOLTAGE_WARNING, HV_BATTERY_WATER_DETECTED'
  pl: 'Wysyłane przy zmianie stanu: HV_BATTERY_STATE, HV_BATTERY_CONTACTOR_UNCOMMANDED_OPEN_CAUSE, HV_BATTERY_INTERLOCK_LINE_STATUS, SERVICE_PLUG_STATUS, HV_BATTERY_MIN_VOLTAGE_WARNING, HV_BATTERY_WATER_DETECTED'
  ru: 'При изменении состояния: HV_BATTERY_STATE, HV_BATTERY_CONTACTOR_UNCOMMANDED_OPEN_CAUSE, HV_BATTERY_INTERLOCK_LINE_STATUS, SERVICE_PLUG_STATUS, HV_BATTERY_MIN_VOLTAGE_WARNING, HV_BATTERY_WATER_DETECTED'
  zh: '当HV_BATT_STATE, HV_BATTERY_CONTACTOR_UNCOMMANDED_OPEN_CAUSE, HV_BATTERY_INTERLOCK_LINE_STATUS, SERVICE_PLUG_STATUS, HV_BATTERY_MIN_VOLTAGE_WARNING, WATER_IN_HV_BATT状态变化时'
  hu: 'A(z) HV_BATTERY_STATE, HV_BATTERY_CONTACTOR_UNCOMMANDED_OPEN_CAUSE, HV_BATTERY_INTERLOCK_LINE_STATUS, SERVICE_PLUG_STATUS, HV_BATTERY_MIN_VOLTAGE_WARNING, HV_BATTERY_WATER_DETECTED állapotváltozásakor'
  pt: 'Na mudança de estado de: HV_BATTERY_STATE, HV_BATTERY_CONTACTOR_UNCOMMANDED_OPEN_CAUSE, HV_BATTERY_INTERLOCK_LINE_STATUS, SERVICE_PLUG_STATUS, HV_BATTERY_MIN_VOLTAGE_WARNING, HV_BATTERY_WATER_DETECTED'
periodicity: ['500ms', 'trigger']
senders: ['TBMU']
receivers: ['OBC', 'CMM', 'VCU']

