id: 0x4C8
name: 'CRASH_STATUS'
type: 'can'
length: 3
comment:
  en: 'Crash detection status, repeated every 50 ms once a crash is detected, until ignition is switched off.'
  fr: 'État de détection de choc, répété toutes les 50 ms une fois un choc détecté, jusqu''à la coupure du contact.'
  es: 'Estado de detección de impacto, repetido cada 50 ms una vez detectado un impacto, hasta el corte del contacto.'
  de: 'Crash-Erkennungsstatus, wiederholt alle 50 ms nach Erkennung eines Aufpralls, bis zum Abschalten der Zündung.'
  it: 'Stato di rilevamento urto, ripetuto ogni 50 ms una volta rilevato un urto, fino allo spegnimento del contatto.'
  pl: 'Stan wykrywania zderzenia, powtarzany co 50 ms po wykryciu zderzenia, aż do wyłączenia zapłonu.'
  ru: 'Статус обнаружения столкновения, повторяется каждые 50 мс после обнаружения удара, до выключения зажигания.'
  zh: '碰撞检测状态,一旦检测到碰撞,每50毫秒重复发送一次,直至点火开关关闭。'
  hu: 'Ütközésérzékelési állapot, ütközés észlelése után 50 ms-enként ismételve a gyújtás kikapcsolásáig.'
  pt: 'Estado de deteção de colisão, repetido a cada 50 ms assim que uma colisão é detetada, até a ignição ser desligada.'
observations:
  en: 'Sent to trigger passive safety devices in the event of a crash or rollover'
  fr: 'Émise pour déclencher les éléments de sécurité passive en cas de choc ou de retournement'
  es: 'Enviada para activar los elementos de seguridad pasiva en caso de choque o vuelco'
  de: 'Gesendet zur Auslösung der passiven Sicherheitselemente bei einem Aufprall oder Überschlag'
  it: 'Inviata per attivare gli elementi di sicurezza passiva in caso di urto o ribaltamento'
  pl: 'Wysyłane w celu uruchomienia elementów bezpieczeństwa biernego w razie zderzenia lub dachowania'
  ru: 'Отправляется для срабатывания элементов пассивной безопасности при столкновении или опрокидывании'
  zh: '在发生碰撞或翻车时发送,以触发被动安全装置'
  hu: 'Küldve a passzív biztonsági elemek működésbe hozatalához ütközés vagy borulás esetén'
  pt: 'Enviada para acionar os dispositivos de segurança passiva em caso de colisão ou capotamento'
periodicity: ['trigger']
senders: ['VCU', 'CMM', 'HCU1']
receivers: ['TBMU', 'CMEL', 'OBC']

signals:
  UNUSED_1:
    bits: '1.7-1.0'
    unused: true

  POST_COLLISION_BRAKING_REQUEST:
    bits: '2.7'
    comment:
      en: 'Braking request following a collision'
      fr: 'Demande de freinage suite à une collision'
      es: 'Solicitud de frenado tras una colisión'
      de: 'Bremsanforderung nach einer Kollision'
      it: 'Richiesta di frenata a seguito di una collisione'
      pl: 'Żądanie hamowania po kolizji'
      ru: 'Запрос торможения после столкновения'
      zh: '碰撞后的制动请求'
      hu: 'Fékezési kérés ütközést követően'
      pt: 'Pedido de travagem após uma colisão'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
