        fr: 'Demande de freinage suite à un choc'
        es: 'Solicitud de frenado tras un choque'
        de: 'Bremsanforderung nach Unfall'
        it: 'Richiesta di frenata dopo un urto'
        pl: 'Żądanie hamowania po zderzeniu'
        ru: 'Запрос торможения после столкновения'
        zh: '碰撞后制动请求'
        hu: 'Fékezési kérés ütközés után'
        pt: 'Pedido de travagem na sequência de um impacto'

  POST_COLLISION_BRAKING_LEVEL:
