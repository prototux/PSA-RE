id: 0x264
name: 'NOX_SENSOR'
type: 'can'
length: 8
comment:
  en: 'NOx sensor data: supply and short/open-circuit faults on the heater, LIN line and NOx cell, plus lambda values.'
  fr: 'Données du capteur NOx : défauts d''alimentation et de court-circuit/circuit ouvert sur le chauffage, la ligne LIN et la cellule NOx, ainsi que les valeurs lambda.'
  es: 'Datos del sensor NOx: fallos de alimentación y de cortocircuito/circuito abierto en el calentador, la línea LIN y la célula NOx, además de los valores lambda.'
  de: 'NOx-Sensordaten: Versorgungs- sowie Kurzschluss-/Unterbrechungsfehler an Heizung, LIN-Leitung und NOx-Zelle, sowie Lambda-Werte.'
  it: 'Dati del sensore NOx: guasti di alimentazione e di cortocircuito/circuito aperto su riscaldatore, linea LIN e cella NOx, oltre ai valori lambda.'
  pl: 'Dane czujnika NOx: usterki zasilania oraz zwarcia/przerwy obwodu grzałki, linii LIN i ogniwa NOx, a także wartości lambda.'
  ru: 'Данные датчика NOx: неисправности питания, короткого замыкания и обрыва цепи нагревателя, линии LIN и ячейки NOx, а также значения лямбда.'
  zh: 'NOx传感器数据:加热器、LIN线路及NOx电池的供电与短路/断路故障,以及氧传感器(lambda)数值。'
  hu: 'NOx-érzékelő adatai: a fűtés, a LIN-vonal és a NOx-cella tápellátási, valamint zárlat-/szakadáshibái, továbbá a lambda-értékek.'
  pt: 'Dados do sensor de NOx: avarias de alimentação e de curto-circuito/circuito aberto no aquecedor, na linha LIN e na célula de NOx, além de valores lambda.'
periodicity: ['10ms']
senders: ['NOX_SENSOR']
receivers: ['CMM']

