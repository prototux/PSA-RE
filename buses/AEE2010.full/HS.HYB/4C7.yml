id: 0x4C7
name: 'ELECTRIC_REAR_AXLE_STATUS'
type: 'can'
length: 4
comment:
  en: 'Electric rear axle drive status: warning-lamp and service-blink requests, clutch/inverter/overtemperature failure flags, power state and general status.'
  fr: 'État de l''essieu arrière électrique : demandes de voyant et de clignotement service, indicateurs de défaillance embrayage/onduleur/surchauffe, état de puissance et état général.'
  es: 'Estado del eje trasero eléctrico: solicitudes de testigo y parpadeo de servicio, indicadores de fallo de embrague/inversor/sobretemperatura, estado de potencia y estado general.'
  de: 'Status der elektrischen Hinterachse: Kontrollleuchten- und Service-Blinkanforderungen, Fehlerkennzeichen für Kupplung/Wechselrichter/Übertemperatur, Leistungszustand und Gesamtstatus.'
  it: 'Stato dell''asse posteriore elettrico: richieste di spia e lampeggio di servizio, indicatori di guasto frizione/inverter/surriscaldamento, stato di potenza e stato generale.'
  pl: 'Stan elektrycznej osi tylnej: żądania kontrolki i migania serwisowego, flagi usterki sprzęgła/falownika/przegrzania, stan mocy i stan ogólny.'
  ru: 'Статус электрического заднего моста: запросы индикатора и сервисного мигания, флаги неисправности сцепления/инвертора/перегрева, состояние мощности и общий статус.'
  zh: '电动后桥状态:警示灯和维修闪烁请求、离合器/逆变器/过温故障标志、功率状态和总体状态。'
  hu: 'Az elektromos hátsó tengely állapota: jelzőlámpa és szervizvillogás kérések, kuplung-/inverter-/túlmelegedés hibajelzők, teljesítményállapot és általános állapot.'
  pt: 'Estado do acionamento elétrico do eixo traseiro: pedidos da luz avisadora e de pisca de serviço, indicadores de avaria de embraiagem/inversor/sobretemperatura, estado de potência e estado geral.'
observations:
  en: 'On state change of: REAR_EMOTOR_FUNCTION_STATUS, REAR_EMOTOR_INVERTER_FAULT, REM_OVERTEMPERATURE_FAULT, REAR_EMOTOR_CLUTCH_FAULT'
  fr: 'Sur changement d''état de : REAR_EMOTOR_FUNCTION_STATUS, REAR_EMOTOR_INVERTER_FAULT, REM_OVERTEMPERATURE_FAULT, REAR_EMOTOR_CLUTCH_FAULT'
  es: 'Al cambiar el estado de: REAR_EMOTOR_FUNCTION_STATUS, REAR_EMOTOR_INVERTER_FAULT, REM_OVERTEMPERATURE_FAULT, REAR_EMOTOR_CLUTCH_FAULT'
  de: 'Bei Statusänderung von: REAR_EMOTOR_FUNCTION_STATUS, REAR_EMOTOR_INVERTER_FAULT, REM_OVERTEMPERATURE_FAULT, REAR_EMOTOR_CLUTCH_FAULT'
  it: 'Al cambiamento di stato di: REAR_EMOTOR_FUNCTION_STATUS, REAR_EMOTOR_INVERTER_FAULT, REM_OVERTEMPERATURE_FAULT, REAR_EMOTOR_CLUTCH_FAULT'
  pl: 'Wysyłane przy zmianie stanu: REAR_EMOTOR_FUNCTION_STATUS, REAR_EMOTOR_INVERTER_FAULT, REM_OVERTEMPERATURE_FAULT, REAR_EMOTOR_CLUTCH_FAULT'
  ru: 'При изменении состояния: REAR_EMOTOR_FUNCTION_STATUS, REAR_EMOTOR_INVERTER_FAULT, REM_OVERTEMPERATURE_FAULT, REAR_EMOTOR_CLUTCH_FAULT'
  zh: '当REM_STATE, REAR_EMOTOR_FUNCTION_STATUS, REAR_EMOTOR_INVERTER_FAULT, REM_OVERTEMPERATURE_FAULT, REM_CLUTCH_FAILURE状态变化时'
  hu: 'A(z), REAR_EMOTOR_FUNCTION_STATUS, REAR_EMOTOR_INVERTER_FAULT, REM_OVERTEMPERATURE_FAULT, REAR_EMOTOR_CLUTCH_FAULT állapotváltozásakor'
  pt: 'Na mudança de estado de: REAR_EMOTOR_FUNCTION_STATUS, REAR_EMOTOR_INVERTER_FAULT, REM_OVERTEMPERATURE_FAULT, REAR_EMOTOR_CLUTCH_FAULT'
periodicity: ['100ms', 'trigger']
senders: ['ERAD']
receivers: ['CMM']

