    max: 500
    units: 'Nm'
    invalid: 0x3FFF
    default: 0x1F40

  GEARBOX_BOOST_TORQUE:
    bits: '7.5-8.0'
    comment:
      en: 'Gearbox boosting (re-acceleration) torque'
      fr: 'Couple de relance de la boîte de vitesses'
      es: 'Par de reaceleración de la caja de cambios'
      de: 'Wiederbeschleunigungsmoment des Getriebes'
      it: 'Coppia di rilancio del cambio'
      pl: 'Moment doładowania (ponownego przyspieszenia) skrzyni biegów'
