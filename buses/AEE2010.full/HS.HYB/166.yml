      ru: 'Максимальный пиковый момент передней электромашины без ограничения по высокому напряжению'
      zh: '无高压限制时前电机的最大峰值扭矩'
      hu: 'Az első elektromos gép maximális csúcsnyomatéka nagyfeszültségű korlátozás nélkül'
