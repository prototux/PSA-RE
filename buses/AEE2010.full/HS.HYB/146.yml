id: 0x146
name: 'MOTOR_CONTROL_UNIT_TORQUE_LIMITS'
type: 'can'
length: 8
comment:
  en: 'Electric motor torque limits (nominal and peak, min and max) and service-warning flash request from the motor control unit.'
  fr: 'Limites de couple du moteur électrique (nominal et crête, min et max) et demande de clignotement du témoin service, issues du calculateur moteur.'
  es: 'Límites de par del motor eléctrico (nominal y pico, mín. y máx.) y solicitud de parpadeo del testigo de servicio, procedentes de la centralita del motor.'
  de: 'Drehmomentgrenzen des Elektromotors (Nenn- und Spitzenwert, min. und max.) sowie Blinkanforderung der Service-Warnleuchte vom Motorsteuergerät.'
  it: 'Limiti di coppia del motore elettrico (nominale e di picco, min. e max.) e richiesta di lampeggio della spia di servizio, dalla centralina motore.'
  pl: 'Limity momentu obrotowego silnika elektrycznego (nominalny i szczytowy, min. i maks.) oraz żądanie migania lampki serwisowej ze sterownika silnika.'
  ru: 'Пределы крутящего момента электродвигателя (номинальный и пиковый, мин. и макс.) и запрос мигания сервисной лампы от блока управления двигателем.'
  zh: '电动机的扭矩限值(额定值和峰值,最小值和最大值)及来自电机控制单元的服务警告灯闪烁请求。'
  hu: 'Az elektromos motor nyomatékhatárai (névleges és csúcsérték, min. és max.) valamint a szervizfigyelmeztető lámpa villogtatási kérése a motorvezérlő egységtől.'
  pt: 'Limites de binário do motor elétrico (nominal e de pico, mínimo e máximo) e pedido de pisca de aviso de serviço da unidade de controlo do motor.'
periodicity: ['10ms']
senders: ['CMEL']
receivers: ['CMM']

signals:
  FRAME_CHECKSUM:
    bits: '1.7-1.4'
    comment:
      en: 'Checksum of the frame'
      fr: 'Somme de contrôle (checksum) de la trame'
      es: 'Suma de comprobación (checksum) de la trama'
      de: 'Prüfsumme (Checksum) des Frames'
      it: 'Checksum del frame'
      pl: 'Suma kontrolna (checksum) ramki'
      ru: 'Контрольная сумма кадра'
      zh: '帧校验和'
      hu: 'A keret ellenőrző összege (checksum)'
      pt: 'Soma de verificação da trama'
    type: 'uint'

  PROCESS_COUNTER:
    bits: '1.3-1.0'
    comment:
      en: 'Rolling counter incremented at each calculation cycle'
      fr: 'Compteur cyclique incrémenté à chaque cycle de calcul'
      es: 'Contador cíclico incrementado en cada ciclo de cálculo'
      de: 'Zyklischer Zähler, der bei jedem Berechnungszyklus erhöht wird'
      it: 'Contatore ciclico incrementato a ogni ciclo di calcolo'
      pl: 'Licznik cykliczny zwiększany przy każdym cyklu obliczeń'
      ru: 'Циклический счётчик, увеличивающийся на каждом цикле расчёта'
      zh: '每个计算周期递增的循环计数器'
      hu: 'A számítási ciklus minden lépésekor növekvő ciklikus számláló'
      pt: 'Contador cíclico incrementado a cada ciclo de cálculo'
