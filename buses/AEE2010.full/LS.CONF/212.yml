id: 0x212
name: 'ENGINE_HYBRID_DYNAMIC_DATA_4'
type: 'can'
length: 2
comment:
  en: 'Driver memory seat module status: welcome position, steering column and seat movement, memory recall.'
  fr: 'État du boîtier de mémorisation conducteur : position accueil, mouvement colonne et siège, rappel mémoire.'
  es: 'Estado del módulo de memoria del asiento del conductor: posición de bienvenida, movimiento de columna y asiento, recuperación de memoria.'
  de: 'Status des Fahrersitz-Memory-Moduls: Begrüßungsposition, Lenksäulen- und Sitzbewegung, Memory-Abruf.'
  it: 'Stato del modulo memoria sedile conducente: posizione di benvenuto, movimento piantone e sedile, richiamo memoria.'
  pl: 'Stan modułu pamięci fotela kierowcy: pozycja powitalna, ruch kolumny kierowniczej i fotela, przywołanie pamięci.'
  ru: 'Статус модуля памяти сиденья водителя: приветственное положение, перемещение рулевой колонки и сиденья, вызов памяти.'
  zh: '驾驶员座椅记忆模块状态:迎宾位置、转向柱和座椅移动、记忆调用。'
  hu: 'A vezetőoldali memóriaülés-modul állapota: üdvözlő pozíció, kormányoszlop és ülés mozgása, memória-visszahívás.'
  pt: 'Estado do módulo de memória do banco do condutor: posição de boas-vindas, movimento da coluna de direção e do banco, recuperação de memória.'
periodicity: ['1000ms']
senders: ['BDM_C']
receivers: ['BSI']

