id: 0x14B
name: 'STL_DATA'
type: 'can'
length: 2
comment:
  en: 'Data sent by the BSI to the steering lock module: push-button press status'
  fr: 'Données envoyées par la BSI au module de verrouillage de colonne de direction : état de l''appui sur le bouton'
  es: 'Datos enviados por la BSI al módulo de bloqueo de la columna de dirección: estado de la pulsación del botón'
  de: 'Von der BSI an das Lenksäulenschloss-Modul gesendete Daten: Status des Tastendrucks'
  it: 'Dati inviati dalla BSI al modulo di bloccasterzo: stato della pressione del pulsante'
  pl: 'Dane wysyłane przez BSI do modułu blokady kolumny kierownicy: stan naciśnięcia przycisku'
  ru: 'Данные, отправляемые BSI модулю блокировки рулевой колонки: состояние нажатия кнопки'
  zh: '由BSI发送至转向锁模块的数据:按钮按下状态'
  hu: 'A BSI által a kormányzár modulnak küldött adatok: a nyomógomb állapota'
  pt: 'Dados enviados pela BSI ao módulo de bloqueio de direção: estado da pressão do botão.'
observations:
  en: 'On state change of: STL_PUSH_STATUS'
  fr: 'Sur changement d''état de : STL_PUSH_STATUS'
  es: 'Al cambiar el estado de: STL_PUSH_STATUS'
  de: 'Bei Statusänderung von: STL_PUSH_STATUS'
  it: 'Al cambiamento di stato di: STL_PUSH_STATUS'
  pl: 'Wysyłane przy zmianie stanu: STL_PUSH_STATUS'
  ru: 'При изменении состояния: STL_PUSH_STATUS'
  zh: '当APPUI_PUSH_STL状态变化时'
  hu: 'A(z) STL_PUSH_STATUS állapotváltozásakor'
  pt: 'Na mudança de estado de: STL_PUSH_STATUS'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['BSTL']

signals:
  STL_PUSH_STATUS:
    bits: '1.7'
    comment:
      en: 'STL push-button status.'
      fr: 'État d''appui du bouton-poussoir STL.'
      es: 'Estado de pulsación del botón STL.'
      de: 'Status der STL-Drucktaste.'
      it: 'Stato di pressione del pulsante STL.'
      pl: 'Stan naciśnięcia przycisku STL.'
      ru: 'Состояние нажатия кнопки STL.'
      zh: 'STL按钮按压状态。'
      hu: 'Az STL nyomógomb állapota.'
      pt: 'Estado de pressão do botão STL.'
    type: 'bool'
    values:
      0x00:
        en: 'Not pressed'
        fr: 'Pas d''appui'
        es: 'Sin pulsación'
        de: 'Nicht gedrückt'
        it: 'Non premuto'
        pl: 'Brak naciśnięcia'
        ru: 'Не нажато'
        zh: '未按下'
        hu: 'Nincs megnyomva'
        pt: 'Não premido'
      0x01:
        en: 'Pressed'
        fr: 'Appuyé'
        es: 'Pulsado'
        de: 'Gedrückt'
        it: 'Premuto'
        pl: 'Wciśnięty'
        ru: 'Нажато'
        zh: '已按下'
        hu: 'Megnyomva'
        pt: 'Premido'

  UNUSED_1:
    bits: '1.6-1.0'
    unused: true

  UNUSED_2:
    bits: '2.7-2.0'
    unused: true
