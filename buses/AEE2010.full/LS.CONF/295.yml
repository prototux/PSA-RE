id: 0x295
name: 'DRIVER_DOOR_WINDOW_STATUS'
type: 'can'
length: 6
comment:
  en: 'Driver door module window status: rear child-lock request, all-window not-initialised/movement/position, memory-in-progress flag.'
  fr: 'État des vitres du module porte conducteur : demande de sécurité enfant arrière, non-initialisation/mouvement/position de toutes les vitres, indicateur de mémorisation en cours.'
  es: 'Estado de las ventanillas del módulo de la puerta del conductor: solicitud de seguro para niños trasero, no inicialización/movimiento/posición de todas las ventanillas, indicador de memorización en curso.'
  de: 'Fensterstatus des Fahrertürmoduls: Anforderung Kindersicherung hinten, Nicht-initialisiert/Bewegung/Position aller Fenster, Kennzeichen laufender Speicherung.'
  it: 'Stato dei finestrini del modulo portiera conducente: richiesta di sicura bambini posteriore, non inizializzazione/movimento/posizione di tutti i finestrini, indicatore di memorizzazione in corso.'
  pl: 'Stan szyb modułu drzwi kierowcy: żądanie blokady dziecięcej z tyłu, brak inicjalizacji/ruch/pozycja wszystkich szyb, flaga trwającego zapisu do pamięci.'
  ru: 'Статус окон модуля двери водителя: запрос задней блокировки от детей, отсутствие инициализации/движение/положение всех окон, флаг выполняющегося сохранения в память.'
  zh: '驾驶员车门模块车窗状态:后排儿童锁请求、所有车窗未初始化/移动/位置、记忆进行中标志。'
  hu: 'A vezetőoldali ajtómodul ablakainak állapota: hátsó gyerekzár kérés, minden ablak inicializálatlansága/mozgása/helyzete, folyamatban lévő memorizálás jelzője.'
  pt: 'Estado dos vidros do módulo da porta do condutor: pedido de bloqueio para crianças traseiro, indicador de não inicializado/movimento/posição de todos os vidros, indicador de memorização em curso.'
observations:
  en: 'On state change of: REAR_CHILD_LOCK_REQUEST, MEMORY_KEY_PRESSED, KEY_1_PRESSED, KEY_2_PRESSED, KEY_3_PRESSED, KEY_4_PRESSED, KEY_5_PRESSED, KEY_6_PRESSED, KEY_7_PRESSED, MEMORY_STORE_IN_PROGRESS, MEMORY_RECALL_IN_PROGRESS, WINDOW_UNINITIALIZED, CHILD_LOCK_BUTTON_REQUEST, REMOTE_START_REQUEST'
  fr: 'Sur changement d''état de : REAR_CHILD_LOCK_REQUEST, MEMORY_KEY_PRESSED, KEY_1_PRESSED, KEY_2_PRESSED, KEY_3_PRESSED, KEY_4_PRESSED, KEY_5_PRESSED, KEY_6_PRESSED, KEY_7_PRESSED, MEMORY_STORE_IN_PROGRESS, MEMORY_RECALL_IN_PROGRESS, WINDOW_UNINITIALIZED, CHILD_LOCK_BUTTON_REQUEST, REMOTE_START_REQUEST'
  es: 'Al cambiar el estado de: REAR_CHILD_LOCK_REQUEST, MEMORY_KEY_PRESSED, KEY_1_PRESSED, KEY_2_PRESSED, KEY_3_PRESSED, KEY_4_PRESSED, KEY_5_PRESSED, KEY_6_PRESSED, KEY_7_PRESSED, MEMORY_STORE_IN_PROGRESS, MEMORY_RECALL_IN_PROGRESS, WINDOW_UNINITIALIZED, CHILD_LOCK_BUTTON_REQUEST, REMOTE_START_REQUEST'
  de: 'Bei Statusänderung von: REAR_CHILD_LOCK_REQUEST, MEMORY_KEY_PRESSED, KEY_1_PRESSED, KEY_2_PRESSED, KEY_3_PRESSED, KEY_4_PRESSED, KEY_5_PRESSED, KEY_6_PRESSED, KEY_7_PRESSED, MEMORY_STORE_IN_PROGRESS, MEMORY_RECALL_IN_PROGRESS, WINDOW_UNINITIALIZED, CHILD_LOCK_BUTTON_REQUEST, REMOTE_START_REQUEST'
  it: 'Al cambiamento di stato di: REAR_CHILD_LOCK_REQUEST, MEMORY_KEY_PRESSED, KEY_1_PRESSED, KEY_2_PRESSED, KEY_3_PRESSED, KEY_4_PRESSED, KEY_5_PRESSED, KEY_6_PRESSED, KEY_7_PRESSED, MEMORY_STORE_IN_PROGRESS, MEMORY_RECALL_IN_PROGRESS, WINDOW_UNINITIALIZED, CHILD_LOCK_BUTTON_REQUEST, REMOTE_START_REQUEST'
  pl: 'Wysyłane przy zmianie stanu: REAR_CHILD_LOCK_REQUEST, MEMORY_KEY_PRESSED, KEY_1_PRESSED, KEY_2_PRESSED, KEY_3_PRESSED, KEY_4_PRESSED, KEY_5_PRESSED, KEY_6_PRESSED, KEY_7_PRESSED, MEMORY_STORE_IN_PROGRESS, MEMORY_RECALL_IN_PROGRESS, WINDOW_UNINITIALIZED, CHILD_LOCK_BUTTON_REQUEST, REMOTE_START_REQUEST'
  ru: 'При изменении состояния: REAR_CHILD_LOCK_REQUEST, MEMORY_KEY_PRESSED, KEY_1_PRESSED, KEY_2_PRESSED, KEY_3_PRESSED, KEY_4_PRESSED, KEY_5_PRESSED, KEY_6_PRESSED, KEY_7_PRESSED, MEMORY_STORE_IN_PROGRESS, MEMORY_RECALL_IN_PROGRESS, WINDOW_UNINITIALIZED, CHILD_LOCK_BUTTON_REQUEST, REMOTE_START_REQUEST'
  zh: '当DMD_SECU_ENF_AR, MEMORY_KEY_PRESSED, KEY_1_PRESSED, KEY_2_PRESSED, KEY_3_PRESSED, KEY_4_PRESSED, KEY_5_PRESSED, KEY_6_PRESSED, KEY_7_PRESSED, MEMORY_STORE_IN_PROGRESS, MEMORY_RECALL_IN_PROGRESS, WINDOW_UNINITIALIZED, CHILD_LOCK_BUTTON_REQUEST, F_DMD_RDEP状态变化时'
  hu: 'A(z) REAR_CHILD_LOCK_REQUEST, MEMORY_KEY_PRESSED, KEY_1_PRESSED, KEY_2_PRESSED, KEY_3_PRESSED, KEY_4_PRESSED, KEY_5_PRESSED, KEY_6_PRESSED, KEY_7_PRESSED, MEMORY_STORE_IN_PROGRESS, MEMORY_RECALL_IN_PROGRESS, WINDOW_UNINITIALIZED, CHILD_LOCK_BUTTON_REQUEST, REMOTE_START_REQUEST állapotváltozásakor'
  pt: 'Na mudança de estado de: REAR_CHILD_LOCK_REQUEST, MEMORY_KEY_PRESSED, KEY_1_PRESSED, KEY_2_PRESSED, KEY_3_PRESSED, KEY_4_PRESSED, KEY_5_PRESSED, KEY_6_PRESSED, KEY_7_PRESSED, MEMORY_STORE_IN_PROGRESS, MEMORY_RECALL_IN_PROGRESS, WINDOW_UNINITIALIZED, CHILD_LOCK_BUTTON_REQUEST, REMOTE_START_REQUEST'
