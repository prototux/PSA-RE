id: 0x058
name: 'AIRBAG_STATUS'
type: 'can'
length: 1
comment:
  en: 'Airbag computer status: bonnet switch active, general airbag state, centre and passenger airbag inhibition.'
  fr: 'État du calculateur airbag : contacteur capot actif, état général airbag, inhibition airbag central et passager.'
  es: 'Estado de la centralita de airbag: interruptor de capó activo, estado general del airbag, inhibición de airbag central y del pasajero.'
  de: 'Status des Airbag-Steuergeräts: Motorhaubenschalter aktiv, allgemeiner Airbag-Zustand, Deaktivierung Mittel- und Beifahrer-Airbag.'
  it: 'Stato della centralina airbag: interruttore cofano attivo, stato generale airbag, inibizione airbag centrale e passeggero.'
  pl: 'Stan sterownika poduszek powietrznych: aktywny wyłącznik maski, ogólny stan poduszek powietrznych, wyłączenie poduszki centralnej i pasażera.'
  ru: 'Статус блока управления подушками безопасности: активен выключатель капота, общее состояние подушек, отключение центральной и пассажирской подушки.'
  zh: '安全气囊控制单元状态:引擎盖开关激活、安全气囊总体状态、中央和乘客安全气囊禁用。'
  hu: 'A légzsák-vezérlőegység állapota: motorháztető-kapcsoló aktív, általános légzsákállapot, közép- és utaslégzsák letiltása.'
  pt: 'Estado do computador do airbag: comutador do capot ativo, estado geral do airbag, inibição do airbag central e do passageiro.'
observations:
  en: 'On state change of: RBG_GENERAL_STATUS, INHIBIT_KEY_STATUS'
  fr: 'Sur changement d''état de : RBG_GENERAL_STATUS, INHIBIT_KEY_STATUS'
  es: 'Al cambiar el estado de: RBG_GENERAL_STATUS, INHIBIT_KEY_STATUS'
  de: 'Bei Statusänderung von: RBG_GENERAL_STATUS, INHIBIT_KEY_STATUS'
  it: 'Al cambiamento di stato di: RBG_GENERAL_STATUS, INHIBIT_KEY_STATUS'
  pl: 'Wysyłane przy zmianie stanu: RBG_GENERAL_STATUS, INHIBIT_KEY_STATUS'
  ru: 'При изменении состояния: RBG_GENERAL_STATUS, INHIBIT_KEY_STATUS'
  zh: '当ET_GEN_RBG, ET_CLEF_INHIB状态变化时'
  hu: 'A(z) RBG_GENERAL_STATUS, INHIBIT_KEY_STATUS állapotváltozásakor'
  pt: 'Na mudança de estado de: RBG_GENERAL_STATUS, INHIBIT_KEY_STATUS'
periodicity: ['500ms', 'trigger']
senders: ['RBG']
receivers: ['BSI']

signals:
  UNUSED_1:
    bits: '1.7'
    unused: true

  RBG_GENERAL_STATUS:
    bits: '1.6'
    comment:
      en: 'General operating state'
      fr: 'État de fonctionnement général'
      es: 'Estado de funcionamiento general'
      de: 'Allgemeiner Betriebszustand'
      it: 'Stato di funzionamento generale'
      pl: 'Ogólny stan działania'
      ru: 'Общее рабочее состояние'
      zh: '总体工作状态'
      hu: 'Általános üzemi állapot'
      pt: 'Estado geral de funcionamento'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No signalling'
        fr: 'Pas de signalisation'
        es: 'Sin señalización'
        de: 'Keine Signalisierung'
        it: 'Nessuna segnalazione'
        pl: 'Brak sygnalizacji'
