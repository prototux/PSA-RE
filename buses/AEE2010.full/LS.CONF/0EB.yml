id: 0x0EB
name: 'RETRACTABLE_ROOF_STATUS_2'
type: 'can'
length: 7
comment:
  en: 'Retractable hard-top status: authorisation to move, lock state, window state, cabriolet mode requests and roof position.'
  fr: 'État du toit escamotable : autorisation de mouvement, état de verrouillage, état des vitres, demandes de mode cabriolet et position du toit.'
  es: 'Estado del techo retráctil: autorización de movimiento, estado de bloqueo, estado de las ventanillas, solicitudes de modo descapotable y posición del techo.'
  de: 'Status des versenkbaren Hardtops: Bewegungsfreigabe, Verriegelungsstatus, Fensterstatus, Cabrio-Modus-Anforderungen und Dachposition.'
  it: 'Stato del tettuccio rigido retrattile: autorizzazione al movimento, stato di blocco, stato dei finestrini, richieste di modalità cabriolet e posizione del tetto.'
  pl: 'Stan chowanego twardego dachu: zezwolenie na ruch, stan blokady, stan szyb, żądania trybu kabriolet i pozycja dachu.'
  ru: 'Статус складной жёсткой крыши: разрешение на движение, состояние блокировки, состояние окон, запросы режима кабриолет и положение крыши.'
  zh: '硬顶敞篷车顶状态:移动许可、锁止状态、车窗状态、敞篷模式请求及车顶位置。'
  hu: 'A behúzható kemény tető állapota: mozgásengedély, zárállapot, ablakállapot, kabrió mód kérések és a tető helyzete.'
  pt: 'Estado do teto rígido retrátil: autorização de movimento, estado de trancagem, estado do vidro, pedidos do modo cabriolet e posição do teto.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['200ms', 'trigger']
senders: ['BTE']
receivers: ['BSI']

