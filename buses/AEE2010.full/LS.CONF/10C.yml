id: 0x10C
name: 'INFOTAINMENT_HEAD_UNIT_VERSION'
type: 'can'
length: 6
comment:
  en: 'Cabin personalisation commands from the BSI: welcome lighting, door sill and glovebox lighting, mirror folding, central locking and child-lock status.'
  fr: 'Commandes de personnalisation habitacle de la BSI : éclairage d''accueil, seuils de porte et boîte à gants, rabattement des rétroviseurs, verrouillage centralisé et état de la sécurité enfant.'
  es: 'Comandos de personalización del habitáculo de la BSI: iluminación de bienvenida, umbrales de puerta y guantera, plegado de retrovisores, cierre centralizado y estado del seguro para niños.'
  de: 'Komfort-Personalisierungsbefehle des BSI: Begrüßungsbeleuchtung, Türschweller- und Handschuhfachbeleuchtung, Spiegeleinklappung, Zentralverriegelung und Kindersicherungsstatus.'
  it: 'Comandi di personalizzazione abitacolo della BSI: illuminazione di benvenuto, soglie porta e vano portaoggetti, ripiegamento specchietti, chiusura centralizzata e stato blocco bambini.'
  pl: 'Polecenia personalizacji kabiny z BSI: oświetlenie powitalne, progi drzwi i schowek, składanie lusterek, centralny zamek i stan blokady dla dzieci.'
  ru: 'Команды персонализации салона от BSI: приветственная подсветка, подсветка порогов и бардачка, складывание зеркал, центральный замок и статус блокировки от детей.'
  zh: 'BSI发出的座舱个性化命令:迎宾灯光、门槛和手套箱照明、后视镜折叠、中控锁和儿童锁状态。'
  hu: 'A BSI kabin-személyre szabási parancsai: üdvözlő világítás, küszöb- és kesztyűtartó-világítás, tükörbehajtás, központi zár és gyerekzár állapota.'
  pt: 'Comandos de personalização do habitáculo da BSI: iluminação de boas-vindas, iluminação da soleira da porta e do porta-luvas, dobragem dos espelhos, trancagem centralizada e estado do bloqueio para crianças.'
observations:
  en: 'On state change of: WELCOME_AMBIENCE_CONFIG, STORAGE_TRAY_LIGHT_ENABLED, FRONT_DOOR_SILL_LIGHT_COMMAND, MEMORY_KEYPAD_LIGHT_ENABLED, BRIGHTNESS_LEVEL_REQUEST, CENTRAL_WINDOW_COMMAND, MANUAL_CLOSE_NO_ANTI_PINCH, WINDOW_SWITCH_OPERATION_AUTHORIZATION, REAR_CHILD_LOCK_STATE'
  fr: 'Sur changement d''état de : WELCOME_AMBIENCE_CONFIG, STORAGE_TRAY_LIGHT_ENABLED, FRONT_DOOR_SILL_LIGHT_COMMAND, MEMORY_KEYPAD_LIGHT_ENABLED, BRIGHTNESS_LEVEL_REQUEST, CENTRAL_WINDOW_COMMAND, MANUAL_CLOSE_NO_ANTI_PINCH, WINDOW_SWITCH_OPERATION_AUTHORIZATION, REAR_CHILD_LOCK_STATE'
  es: 'Al cambiar el estado de: WELCOME_AMBIENCE_CONFIG, STORAGE_TRAY_LIGHT_ENABLED, FRONT_DOOR_SILL_LIGHT_COMMAND, MEMORY_KEYPAD_LIGHT_ENABLED, BRIGHTNESS_LEVEL_REQUEST, CENTRAL_WINDOW_COMMAND, MANUAL_CLOSE_NO_ANTI_PINCH, WINDOW_SWITCH_OPERATION_AUTHORIZATION, REAR_CHILD_LOCK_STATE'
  de: 'Bei Statusänderung von: WELCOME_AMBIENCE_CONFIG, STORAGE_TRAY_LIGHT_ENABLED, FRONT_DOOR_SILL_LIGHT_COMMAND, MEMORY_KEYPAD_LIGHT_ENABLED, BRIGHTNESS_LEVEL_REQUEST, CENTRAL_WINDOW_COMMAND, MANUAL_CLOSE_NO_ANTI_PINCH, WINDOW_SWITCH_OPERATION_AUTHORIZATION, REAR_CHILD_LOCK_STATE'
  it: 'Al cambiamento di stato di: WELCOME_AMBIENCE_CONFIG, STORAGE_TRAY_LIGHT_ENABLED, FRONT_DOOR_SILL_LIGHT_COMMAND, MEMORY_KEYPAD_LIGHT_ENABLED, BRIGHTNESS_LEVEL_REQUEST, CENTRAL_WINDOW_COMMAND, MANUAL_CLOSE_NO_ANTI_PINCH, WINDOW_SWITCH_OPERATION_AUTHORIZATION, REAR_CHILD_LOCK_STATE'
  pl: 'Wysyłane przy zmianie stanu: WELCOME_AMBIENCE_CONFIG, STORAGE_TRAY_LIGHT_ENABLED, FRONT_DOOR_SILL_LIGHT_COMMAND, MEMORY_KEYPAD_LIGHT_ENABLED, BRIGHTNESS_LEVEL_REQUEST, CENTRAL_WINDOW_COMMAND, MANUAL_CLOSE_NO_ANTI_PINCH, WINDOW_SWITCH_OPERATION_AUTHORIZATION, REAR_CHILD_LOCK_STATE'
  ru: 'При изменении состояния: WELCOME_AMBIENCE_CONFIG, STORAGE_TRAY_LIGHT_ENABLED, FRONT_DOOR_SILL_LIGHT_COMMAND, MEMORY_KEYPAD_LIGHT_ENABLED, BRIGHTNESS_LEVEL_REQUEST, CENTRAL_WINDOW_COMMAND, MANUAL_CLOSE_NO_ANTI_PINCH, WINDOW_SWITCH_OPERATION_AUTHORIZATION, REAR_CHILD_LOCK_STATE'
  zh: '当CONFIG_AMBIANCE_ACCUEIL, STORAGE_TRAY_LIGHT_ENABLED, FRONT_DOOR_SILL_LIGHT_COMMAND, MEMORY_KEYPAD_LIGHT_ENABLED, BRIGHTNESS_LEVEL_REQUEST, CENTRAL_WINDOW_COMMAND, MANUAL_CLOSE_NO_ANTI_PINCH, WINDOW_SWITCH_OPERATION_AUTHORIZATION, ETAT_SECU_ENFANT_COI_AR状态变化时'
  hu: 'A(z) WELCOME_AMBIENCE_CONFIG, STORAGE_TRAY_LIGHT_ENABLED, FRONT_DOOR_SILL_LIGHT_COMMAND, MEMORY_KEYPAD_LIGHT_ENABLED, BRIGHTNESS_LEVEL_REQUEST, CENTRAL_WINDOW_COMMAND, MANUAL_CLOSE_NO_ANTI_PINCH, WINDOW_SWITCH_OPERATION_AUTHORIZATION, REAR_CHILD_LOCK_STATE állapotváltozásakor'
  pt: 'Na mudança de estado de: WELCOME_AMBIENCE_CONFIG, STORAGE_TRAY_LIGHT_ENABLED, FRONT_DOOR_SILL_LIGHT_COMMAND, MEMORY_KEYPAD_LIGHT_ENABLED, BRIGHTNESS_LEVEL_REQUEST, CENTRAL_WINDOW_COMMAND, MANUAL_CLOSE_NO_ANTI_PINCH, WINDOW_SWITCH_OPERATION_AUTHORIZATION, REAR_CHILD_LOCK_STATE'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['BTE', 'EDP_C']

