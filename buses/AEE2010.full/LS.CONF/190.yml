    comment:
      en: 'Rear right blower motor fault'
      fr: 'Défaut du moteur du pulseur arrière droit'
      es: 'Fallo del motor del ventilador trasero derecho'
      de: 'Fehler des Gebläsemotors hinten rechts'
      it: 'Guasto del motore ventola posteriore destra'
      pl: 'Usterka silnika dmuchawy tylnej prawej'
      ru: 'Неисправность двигателя заднего правого вентилятора'
      zh: '右后鼓风机电机故障'
      hu: 'A hátsó jobb fúvómotor hibája'
      pt: 'Falha do motor do ventilador traseiro direito'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Fault absent'
        fr: 'Défaut absent'
        es: 'Fallo ausente'
        de: 'Kein Fehler'
        it: 'Guasto assente'
        pl: 'Brak usterki'
        ru: 'Неисправность отсутствует'
        zh: '无故障'
        hu: 'Nincs hiba'
        pt: 'Falha ausente'
      0x01:
        en: 'Fault present'
        fr: 'Défaut présent'
        es: 'Fallo presente'
        de: 'Fehler vorhanden'
        it: 'Guasto presente'
        pl: 'Usterka obecna'
        ru: 'Неисправность присутствует'
        zh: '存在故障'
        hu: 'Hiba fennáll'
        pt: 'Falha presente'

  FRONT_BLOWER_MOTOR_FAULT:
    bits: '5.5'
    comment:
      en: 'Front blower motor fault'
      fr: 'Défaut du moteur de pulseur avant'
      es: 'Fallo del motor del ventilador delantero'
      de: 'Fehler des vorderen Gebläsemotors'
      it: 'Guasto del motore ventola anteriore'
      pl: 'Usterka silnika dmuchawy przedniej'
      ru: 'Неисправность переднего мотора вентилятора отопителя'
      zh: '前鼓风机电机故障'
      hu: 'Első fűtőventilátor motor hibája'
      pt: 'Falha do motor do ventilador dianteiro'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Fault absent'
        fr: 'Défaut absent'
        es: 'Fallo ausente'
        de: 'Kein Fehler'
        it: 'Guasto assente'
        pl: 'Brak usterki'
        ru: 'Неисправность отсутствует'
        zh: '无故障'
        hu: 'Nincs hiba'
        pt: 'Falha ausente'
      0x01:
        en: 'Fault present'
        fr: 'Défaut présent'
        es: 'Fallo presente'
        de: 'Fehler vorhanden'
        it: 'Guasto presente'
        pl: 'Usterka obecna'
        ru: 'Неисправность присутствует'
        zh: '存在故障'
        hu: 'Hiba fennáll'
        pt: 'Falha presente'

  UNUSED_1:
    bits: '5.4-5.0'
    unused: true

alternatives:
  - note:
      en: 'Also observed with a period of 200ms'
      fr: 'Aussi observée avec une période de 200ms'
      es: 'También observada con un periodo de 200ms'
      de: 'Auch mit einer Periode von 200ms beobachtet'
      it: 'Osservata anche con un periodo di 200ms'
      pl: 'Obserwowana także z okresem 200ms'
      ru: 'Также наблюдалась с периодом 200ms'
