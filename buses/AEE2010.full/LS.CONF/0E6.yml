id: 0x0E6
name: 'BRAKE_UNIT_STATUS'
type: 'can'
length: 8
comment:
  en: 'Brake unit status relayed by the body computer: brake fluid alert, hill-hold request, wheel pulse counters and start&stop brake demand.'
  fr: 'État de l''unité de freinage relayé par le BSI : alerte liquide de frein, demande hill-hold, compteurs d''impulsions roue et demande frein start&stop.'
  es: 'Estado de la unidad de frenos retransmitido por la BSI: alerta de líquido de frenos, solicitud de hill-hold, contadores de impulsos de rueda y demanda de freno start&stop.'
  de: 'Bremseinheitenstatus, weitergeleitet vom BSI: Bremsflüssigkeitswarnung, Berganfahrhilfe-Anforderung, Radimpulszähler und Start&Stop-Bremsanforderung.'
  it: 'Stato dell''unità frenante inoltrato dal BSI: allarme liquido freni, richiesta hill-hold, contatori di impulsi ruota e richiesta freno start&stop.'
  pl: 'Stan jednostki hamulcowej przekazywany przez BSI: alarm płynu hamulcowego, żądanie wspomagania ruszania pod górę, liczniki impulsów kół i żądanie hamulca start&stop.'
  ru: 'Статус тормозного блока, ретранслируемый BSI: предупреждение о тормозной жидкости, запрос удержания на подъёме, счётчики импульсов колёс и запрос тормоза старт-стоп.'
  zh: '由车身控制器转发的制动单元状态:制动液告警、坡道辅助请求、车轮脉冲计数及启停制动请求。'
  hu: 'A fékegység állapota, amelyet a BSI továbbít: fékfolyadék-riasztás, domborzati tartás kérése, kerékimpulzus-számlálók és start&stop fékigény.'
  pt: 'Estado da unidade de travagem retransmitido pela BSI: alerta de líquido de travões, pedido de hill-hold, contadores de impulsos de roda e pedido de travão do start&stop.'
periodicity: ['10060ms']
senders: ['BSI']
receivers: ['SAM']

