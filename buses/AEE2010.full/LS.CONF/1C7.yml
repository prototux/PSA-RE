id: 0x1C7
name: 'BRAKE_DYNAMIC_STATUS'
type: 'can'
length: 7
comment:
  en: 'Brake unit dynamic data relayed by the body computer: longitudinal wheel acceleration, distance travelled, vehicle motion and warning lamp request.'
  fr: 'Données dynamiques de l''unité de freinage relayées par le BSI : accélération longitudinale roues, distance parcourue, mouvement véhicule et demande de témoin warning.'
  es: 'Datos dinámicos de la unidad de frenos retransmitidos por la BSI: aceleración longitudinal de las ruedas, distancia recorrida, movimiento del vehículo y solicitud del testigo de emergencia.'
  de: 'Dynamische Bremseinheitendaten, weitergeleitet vom BSI: Längsbeschleunigung der Räder, zurückgelegte Strecke, Fahrzeugbewegung und Warnblinkanforderung.'
  it: 'Dati dinamici dell''unità frenante inoltrati dal BSI: accelerazione longitudinale ruote, distanza percorsa, movimento veicolo e richiesta spia warning.'
  pl: 'Dane dynamiczne jednostki hamulcowej przekazywane przez BSI: przyspieszenie wzdłużne kół, przebyty dystans, ruch pojazdu i żądanie lampki awaryjnej.'
  ru: 'Динамические данные тормозного блока, ретранслируемые BSI: продольное ускорение колёс, пройденное расстояние, движение автомобиля и запрос аварийной сигнализации.'
  zh: '由车身控制器转发的制动单元动态数据:车轮纵向加速度、行驶距离、车辆运动及危险警示灯请求。'
  hu: 'A fékegység dinamikus adatai, amelyeket a BSI továbbít: kerekek hosszirányú gyorsulása, megtett távolság, jármű mozgása és vészvillogó-kérés.'
  pt: 'Dados dinâmicos da unidade de travagem retransmitidos pela BSI: aceleração longitudinal das rodas, distância percorrida, movimento do veículo e pedido do avisador de emergência (warning).'
periodicity: ['200ms']
senders: ['BSI']
receivers: ['RBG']

signals:
  VEHICLE_SPEED_WHEEL_SENSORS:
    bits: '1.7-2.0'
    comment:
      en: 'Vehicle speed (wheel sensors)'
      fr: 'Vitesse du véhicule (capteurs de roues)'
