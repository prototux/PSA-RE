      de: 'Sollwert der Luftverteilung hinten rechts'
      it: 'Valore di riferimento della distribuzione dell''aria posteriore destra'
      pl: 'Wartość zadana rozdziału powietrza z tyłu po prawej'
      ru: 'Заданное значение распределения воздуха сзади справа'
      zh: '右后出风模式设定值'
      hu: 'Hátsó jobb légelosztás alapérték'
