  REAR_LEFT_AIR_DISTRIBUTION_SETPOINT:
    bits: '5.7-5.0'
    comment:
      en: 'Rear left air distribution setpoint'
      fr: 'Consigne de distribution d''air arrière gauche'
      es: 'Consigna de distribución de aire trasera izquierda'
      de: 'Sollwert der Luftverteilung hinten links'
      it: 'Valore di riferimento della distribuzione dell''aria posteriore sinistra'
      pl: 'Wartość zadana rozdziału powietrza z tyłu po lewej'
      ru: 'Заданное значение распределения воздуха сзади слева'
      zh: '左后出风模式设定值'
      hu: 'Hátsó bal légelosztás alapérték'
      pt: 'Consigna de distribuição de ar traseira esquerda'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
