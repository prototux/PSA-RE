id: 0x329
name: 'STOP_START_GEARBOX_DATA'
type: 'can'
length: 5
comment:
  en: 'Comfort feature requests: automated-parking activation and manoeuvre side, cabin air purifier and air-quality level, consumption-history reset, fragrance cartridge, and massage seat activation/intensity/zone/type.'
  fr: 'Demandes de fonctions confort : activation du parking automatisé et côté de manœuvre, purificateur d''air habitacle et niveau de qualité de l''air, remise à zéro de l''historique de consommation, cartouche de fragrance, et activation/intensité/zone/type du massage des sièges.'
  es: 'Solicitudes de funciones de confort: activación del aparcamiento automatizado y lado de maniobra, purificador de aire del habitáculo y nivel de calidad del aire, reinicio del historial de consumo, cartucho de fragancia, y activación/intensidad/zona/tipo del masaje de asientos.'
  de: 'Komfortfunktionsanforderungen: Aktivierung des automatisierten Einparkens und Manöverseite, Innenraum-Luftreiniger und Luftqualitätsstufe, Rücksetzung des Verbrauchsverlaufs, Duftkartusche, sowie Aktivierung/Intensität/Zone/Typ der Sitzmassage.'
  it: 'Richieste di funzioni comfort: attivazione del parcheggio automatizzato e lato di manovra, purificatore d''aria abitacolo e livello di qualità dell''aria, reset della cronologia dei consumi, cartuccia di fragranza, e attivazione/intensità/zona/tipo del massaggio dei sedili.'
  pl: 'Żądania funkcji komfortu: aktywacja zautomatyzowanego parkowania i strona manewru, oczyszczacz powietrza w kabinie i poziom jakości powietrza, reset historii zużycia, wkład zapachowy, oraz aktywacja/intensywność/strefa/typ masażu foteli.'
  ru: 'Запросы функций комфорта: активация автоматизированной парковки и сторона манёвра, очиститель воздуха салона и уровень качества воздуха, сброс истории расхода, ароматический картридж, а также активация/интенсивность/зона/тип массажа сидений.'
  zh: '舒适功能请求:自动泊车激活及操作方向、座舱空气净化器及空气质量等级、油耗历史复位、香氛盒,以及座椅按摩的激活/强度/区域/类型。'
  hu: 'Kényelmi funkció kérések: automatizált parkolás aktiválása és a manőver oldala, utastéri légtisztító és levegőminőség-szint, fogyasztási előzmények törlése, illatpatron, valamint az ülésmasszázs aktiválása/intenzitása/zónája/típusa.'
  pt: 'Pedidos de funções de conforto: ativação do estacionamento automático e lado da manobra, purificador de ar do habitáculo e nível de qualidade do ar, reposição do histórico de consumo, cartucho de fragrância, e ativação/intensidade/zona/tipo da massagem do banco.'
observations:
  en: 'On state change of: FUNCTION_SELECTION_REQUEST'
  fr: 'Sur changement d''état de : FUNCTION_SELECTION_REQUEST'
  es: 'Al cambiar el estado de: FUNCTION_SELECTION_REQUEST'
  de: 'Bei Statusänderung von: FUNCTION_SELECTION_REQUEST'
  it: 'Al cambiamento di stato di: FUNCTION_SELECTION_REQUEST'
  pl: 'Wysyłane przy zmianie stanu: FUNCTION_SELECTION_REQUEST'
  ru: 'При изменении состояния: FUNCTION_SELECTION_REQUEST'
  zh: '当DMD_SELECT_ACHV状态变化时'
  hu: 'A(z) FUNCTION_SELECTION_REQUEST állapotváltozásakor'
  pt: 'Na mudança de estado de: FUNCTION_SELECTION_REQUEST'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['CLIM_AV', 'CLIM_AR']

