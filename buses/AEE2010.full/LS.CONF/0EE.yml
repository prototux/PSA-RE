id: 0x0EE
name: 'MEMORY_SEAT_COMMAND'
type: 'can'
length: 5
comment:
  en: 'BSI to driver memory seat module: recall/manual adjustment authorisations, steering column retraction, keypad lighting, economy mode and imminent sleep.'
  fr: 'BSI vers le module de mémorisation du siège conducteur : autorisations de rappel/réglage manuel, dégagement de la colonne de direction, éclairage du clavier, mode économie et veille imminente.'
  es: 'BSI al módulo de memoria del asiento del conductor: autorizaciones de recuperación/ajuste manual, retracción de la columna de dirección, iluminación del teclado, modo económico y reposo inminente.'
  de: 'BSI an das Fahrersitz-Memory-Modul: Freigaben für Speicherabruf/manuelle Verstellung, Lenksäulenrückzug, Tastaturbeleuchtung, Sparmodus und bevorstehender Ruhezustand.'
  it: 'BSI al modulo memoria del sedile conducente: autorizzazioni di richiamo/regolazione manuale, arretramento della colonna di sterzo, illuminazione della tastiera, modalità economica e stand-by imminente.'
  pl: 'BSI do modułu pamięci fotela kierowcy: zezwolenia na przywołanie/regulację ręczną, cofnięcie kolumny kierownicy, podświetlenie klawiatury, tryb oszczędny i zbliżający się tryb uśpienia.'
  ru: 'BSI в модуль памяти сиденья водителя: разрешения вызова из памяти/ручной регулировки, отвод рулевой колонки, подсветка клавиатуры, экономичный режим и скорый переход в спящий режим.'
  zh: 'BSI发送给驾驶员记忆座椅模块的信息：记忆调用/手动调节授权、转向柱回缩、键盘照明、节能模式及即将进入休眠。'
  hu: 'A BSI a vezetőülés-memória modul felé: memória-visszahívási/kézi állítási engedélyek, kormányoszlop visszahúzása, billentyűzet-világítás, takarékos üzemmód és a közelgő alvó állapot.'
  pt: 'Da BSI para o módulo de memória do banco do condutor: autorizações de recuperação/ajuste manual, retração da coluna de direção, iluminação do teclado, modo económico e adormecimento iminente.'
observations:
  en: 'On state change of: DRIVER_SEAT_GREETING, DRIVER_SEAT_MANUAL_CONTROL_ALLOWED, PASSENGER_SEAT_MANUAL_CONTROL_ALLOWED, COLUMN_MANUAL_CONTROL_ALLOWED, DRIVER_MEMORY_KEYPAD_LIGHTING_ALLOWED, SEAT_MASSAGE_AUTHORIZATION, DRIVER_SEAT_FAST_FORWARD_FOR_REAR_ACCESS, PASSENGER_SEAT_FAST_FORWARD_FOR_REAR_ACCESS'
  fr: 'Sur changement d''état de : DRIVER_SEAT_GREETING, DRIVER_SEAT_MANUAL_CONTROL_ALLOWED, PASSENGER_SEAT_MANUAL_CONTROL_ALLOWED, COLUMN_MANUAL_CONTROL_ALLOWED, DRIVER_MEMORY_KEYPAD_LIGHTING_ALLOWED, SEAT_MASSAGE_AUTHORIZATION, DRIVER_SEAT_FAST_FORWARD_FOR_REAR_ACCESS, PASSENGER_SEAT_FAST_FORWARD_FOR_REAR_ACCESS'
  es: 'Al cambiar el estado de: DRIVER_SEAT_GREETING, DRIVER_SEAT_MANUAL_CONTROL_ALLOWED, PASSENGER_SEAT_MANUAL_CONTROL_ALLOWED, COLUMN_MANUAL_CONTROL_ALLOWED, DRIVER_MEMORY_KEYPAD_LIGHTING_ALLOWED, SEAT_MASSAGE_AUTHORIZATION, DRIVER_SEAT_FAST_FORWARD_FOR_REAR_ACCESS, PASSENGER_SEAT_FAST_FORWARD_FOR_REAR_ACCESS'
  de: 'Bei Statusänderung von: DRIVER_SEAT_GREETING, DRIVER_SEAT_MANUAL_CONTROL_ALLOWED, PASSENGER_SEAT_MANUAL_CONTROL_ALLOWED, COLUMN_MANUAL_CONTROL_ALLOWED, DRIVER_MEMORY_KEYPAD_LIGHTING_ALLOWED, SEAT_MASSAGE_AUTHORIZATION, DRIVER_SEAT_FAST_FORWARD_FOR_REAR_ACCESS, PASSENGER_SEAT_FAST_FORWARD_FOR_REAR_ACCESS'
  it: 'Al cambiamento di stato di: DRIVER_SEAT_GREETING, DRIVER_SEAT_MANUAL_CONTROL_ALLOWED, PASSENGER_SEAT_MANUAL_CONTROL_ALLOWED, COLUMN_MANUAL_CONTROL_ALLOWED, DRIVER_MEMORY_KEYPAD_LIGHTING_ALLOWED, SEAT_MASSAGE_AUTHORIZATION, DRIVER_SEAT_FAST_FORWARD_FOR_REAR_ACCESS, PASSENGER_SEAT_FAST_FORWARD_FOR_REAR_ACCESS'
  pl: 'Wysyłane przy zmianie stanu: DRIVER_SEAT_GREETING, DRIVER_SEAT_MANUAL_CONTROL_ALLOWED, PASSENGER_SEAT_MANUAL_CONTROL_ALLOWED, COLUMN_MANUAL_CONTROL_ALLOWED, DRIVER_MEMORY_KEYPAD_LIGHTING_ALLOWED, SEAT_MASSAGE_AUTHORIZATION, DRIVER_SEAT_FAST_FORWARD_FOR_REAR_ACCESS, PASSENGER_SEAT_FAST_FORWARD_FOR_REAR_ACCESS'
  ru: 'При изменении состояния: DRIVER_SEAT_GREETING, DRIVER_SEAT_MANUAL_CONTROL_ALLOWED, PASSENGER_SEAT_MANUAL_CONTROL_ALLOWED, COLUMN_MANUAL_CONTROL_ALLOWED, DRIVER_MEMORY_KEYPAD_LIGHTING_ALLOWED, SEAT_MASSAGE_AUTHORIZATION, DRIVER_SEAT_FAST_FORWARD_FOR_REAR_ACCESS, PASSENGER_SEAT_FAST_FORWARD_FOR_REAR_ACCESS'
  zh: '当ACCUEIL_BDM_C, DRIVER_SEAT_MANUAL_CONTROL_ALLOWED, PASSENGER_SEAT_MANUAL_CONTROL_ALLOWED, COLUMN_MANUAL_CONTROL_ALLOWED, DRIVER_MEMORY_KEYPAD_LIGHTING_ALLOWED, SEAT_MASSAGE_AUTHORIZATION, DRIVER_SEAT_FAST_FORWARD_FOR_REAR_ACCESS, AUTO_SIEG_AR_CMD_BDM_P状态变化时'
  hu: 'A(z) DRIVER_SEAT_GREETING, DRIVER_SEAT_MANUAL_CONTROL_ALLOWED, PASSENGER_SEAT_MANUAL_CONTROL_ALLOWED, COLUMN_MANUAL_CONTROL_ALLOWED, DRIVER_MEMORY_KEYPAD_LIGHTING_ALLOWED, SEAT_MASSAGE_AUTHORIZATION, DRIVER_SEAT_FAST_FORWARD_FOR_REAR_ACCESS, PASSENGER_SEAT_FAST_FORWARD_FOR_REAR_ACCESS állapotváltozásakor'
  pt: 'Na mudança de estado de: DRIVER_SEAT_GREETING, DRIVER_SEAT_MANUAL_CONTROL_ALLOWED, PASSENGER_SEAT_MANUAL_CONTROL_ALLOWED, COLUMN_MANUAL_CONTROL_ALLOWED, DRIVER_MEMORY_KEYPAD_LIGHTING_ALLOWED, SEAT_MASSAGE_AUTHORIZATION, DRIVER_SEAT_FAST_FORWARD_FOR_REAR_ACCESS, PASSENGER_SEAT_FAST_FORWARD_FOR_REAR_ACCESS'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['BDM_C']

