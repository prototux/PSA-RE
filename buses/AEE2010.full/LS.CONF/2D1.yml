id: 0x2D1
name: 'SAM_PARKING_DATA'
type: 'can'
length: 2
comment:
  en: 'SAM parking-aid module data: display request, measured side, LED request, module state and detected object/slot size, left and right.'
  fr: 'Données du module d''aide au stationnement SAM : demande d''affichage, côté mesuré, demande LED, état du module et objet/taille de place détecté, gauche et droite.'
  es: 'Datos del módulo de ayuda al estacionamiento SAM: solicitud de visualización, lado medido, solicitud LED, estado del módulo y objeto/tamaño de plaza detectado, izquierda y derecha.'
  de: 'Daten des Einparkhilfe-Moduls SAM: Anzeigeanforderung, gemessene Seite, LED-Anforderung, Modulstatus und erkanntes Objekt/erkannte Lückengröße, links und rechts.'
  it: 'Dati del modulo di assistenza al parcheggio SAM: richiesta di visualizzazione, lato misurato, richiesta LED, stato del modulo e oggetto/dimensione posto rilevato, sinistra e destra.'
  pl: 'Dane modułu czujników parkowania SAM: żądanie wyświetlania, mierzona strona, żądanie LED, stan modułu oraz wykryty obiekt/rozmiar miejsca, lewe i prawe.'
  ru: 'Данные модуля парковочного ассистента SAM: запрос отображения, измеряемая сторона, запрос LED, статус модуля и обнаруженный объект/размер места, слева и справа.'
  zh: 'SAM驻车辅助模块数据:显示请求、测量侧、LED请求、模块状态以及检测到的物体/车位尺寸,左右两侧。'
  hu: 'A SAM parkolássegítő modul adatai: megjelenítési kérés, mért oldal, LED kérés, modul állapota és az észlelt tárgy/hely mérete, bal és jobb oldalon.'
  pt: 'Dados do módulo de ajuda ao estacionamento SAM: pedido de apresentação, lado medido, pedido de LED, estado do módulo e tamanho do objeto/vaga detetado, esquerda e direita.'
observations:
  en: 'On state change of: MEASURED_DISTANCE, SAM_LEFT_OBJECT_PRESENT, SAM_RIGHT_OBJECT_PRESENT, SAM_LED_REQUEST'
  fr: 'Sur changement d''état de : MEASURED_DISTANCE, SAM_LEFT_OBJECT_PRESENT, SAM_RIGHT_OBJECT_PRESENT, SAM_LED_REQUEST'
  es: 'Al cambiar el estado de: MEASURED_DISTANCE, SAM_LEFT_OBJECT_PRESENT, SAM_RIGHT_OBJECT_PRESENT, SAM_LED_REQUEST'
  de: 'Bei Statusänderung von: MEASURED_DISTANCE, SAM_LEFT_OBJECT_PRESENT, SAM_RIGHT_OBJECT_PRESENT, SAM_LED_REQUEST'
  it: 'Al cambiamento di stato di: MEASURED_DISTANCE, SAM_LEFT_OBJECT_PRESENT, SAM_RIGHT_OBJECT_PRESENT, SAM_LED_REQUEST'
  pl: 'Wysyłane przy zmianie stanu: MEASURED_DISTANCE, SAM_LEFT_OBJECT_PRESENT, SAM_RIGHT_OBJECT_PRESENT, SAM_LED_REQUEST'
  ru: 'При изменении состояния: MEASURED_DISTANCE, SAM_LEFT_OBJECT_PRESENT, SAM_RIGHT_OBJECT_PRESENT, SAM_LED_REQUEST'
  zh: '当AFFICHAGE_MPD, MEASURED_DISTANCE, SAM_LEFT_OBJECT_PRESENT, SAM_RIGHT_OBJECT_PRESENT, DMD_LED_SAM状态变化时'
  hu: 'A(z), MEASURED_DISTANCE, SAM_LEFT_OBJECT_PRESENT, SAM_RIGHT_OBJECT_PRESENT, SAM_LED_REQUEST állapotváltozásakor'
  pt: 'Na mudança de estado de: MEASURED_DISTANCE, SAM_LEFT_OBJECT_PRESENT, SAM_RIGHT_OBJECT_PRESENT, SAM_LED_REQUEST'
periodicity: ['100ms', 'trigger']
senders: ['SAM']
receivers: ['BSI']

