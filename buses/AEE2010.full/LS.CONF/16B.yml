id: 0x16B
name: 'SUNROOF_MODULE_COMMAND'
type: 'can'
length: 2
comment:
  en: 'Commands sent by the BSI to the electric sunroof module: general auto window function, parking brake contact, locking state and central window control.'
  fr: 'Commandes envoyées par la BSI au module de toit ouvrant électrique : fonction générale de vitre automatique, contact frein de stationnement, état de condamnation et commande centralisée des vitres.'
  es: 'Órdenes enviadas por la BSI al módulo del techo solar eléctrico: función general de ventanilla automática, contacto del freno de estacionamiento, estado de bloqueo y mando centralizado de ventanillas.'
  de: 'Von der BSI an das elektrische Schiebedachmodul gesendete Befehle: allgemeine Fensterautomatikfunktion, Feststellbremsenkontakt, Verriegelungszustand und zentrale Fensterbedienung.'
  it: 'Comandi inviati dalla BSI al modulo tettuccio apribile elettrico: funzione generale finestrino automatico, contatto freno di stazionamento, stato di chiusura e comando centralizzato finestrini.'
  pl: 'Polecenia wysyłane przez BSI do modułu elektrycznego szyberdachu: ogólna funkcja automatycznej szyby, styk hamulca postojowego, stan zamknięcia i centralne sterowanie szybami.'
  ru: 'Команды, отправляемые BSI в модуль электрического люка: общая функция автоматического стекла, контакт стояночного тормоза, состояние блокировки и централизованное управление стёклами.'
  zh: '由BSI发送给电动天窗模块的指令：车窗自动化通用功能、驻车制动触点、锁止状态及车窗集中控制。'
  hu: 'A BSI parancsai az elektromos napfénytető-modul felé: általános automatikus ablakfunkció, rögzítőfék-érintkező, záróállapot és központi ablakvezérlés.'
  pt: 'Comandos enviados pela BSI ao módulo do teto de abrir elétrico: função geral automática dos vidros, contacto do travão de estacionamento, estado de trancagem e comando centralizado dos vidros.'
observations:
  en: 'On state change of: ELECTRICAL_SUPPLY_STATUS_12V'
  fr: 'Sur changement d''état de : ELECTRICAL_SUPPLY_STATUS_12V'
  es: 'Al cambiar el estado de: ELECTRICAL_SUPPLY_STATUS_12V'
  de: 'Bei Statusänderung von: ELECTRICAL_SUPPLY_STATUS_12V'
  it: 'Al cambiamento di stato di: ELECTRICAL_SUPPLY_STATUS_12V'
  pl: 'Wysyłane przy zmianie stanu: ELECTRICAL_SUPPLY_STATUS_12V'
  ru: 'При изменении состояния: ELECTRICAL_SUPPLY_STATUS_12V'
  zh: '当ETAT_FEE状态变化时'
  hu: 'A(z) ELECTRICAL_SUPPLY_STATUS_12V állapotváltozásakor'
  pt: 'Na mudança de estado de: ELECTRICAL_SUPPLY_STATUS_12V'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['BTE']

