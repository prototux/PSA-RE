id: 0x018
name: 'AIR_INTAKE_MOTOR_COMMAND_3'
type: 'can'
length: 5
comment:
  en: 'Airbag system status: passenger airbag inhibition, rollover and rear impact detection, fired pyrotechnic igniters and crash detected flag. Also used by the body computer as the presence-monitoring frame for the airbag ECU.'
  fr: 'État du système airbag : inhibition airbag passager, détection de retournement et de choc arrière, allumeurs pyrotechniques déclenchés et indicateur de choc détecté. Utilisée aussi par la BSI comme trame de supervision de présence du calculateur airbag.'
  es: 'Estado del sistema de airbag: inhibición del airbag del pasajero, detección de vuelco y de impacto trasero, iniciadores pirotécnicos disparados e indicador de impacto detectado. Usada también por la BSI como trama de supervisión de presencia de la centralita de airbag.'
  de: 'Status des Airbagsystems: Beifahrer-Airbag-Deaktivierung, Überschlag- und Heckaufprallerkennung, ausgelöste pyrotechnische Zünder und Crash-erkannt-Kennzeichen. Wird auch von der BSI als Präsenzüberwachungsrahmen des Airbag-Steuergeräts genutzt.'
  it: 'Stato del sistema airbag: inibizione airbag passeggero, rilevamento ribaltamento e urto posteriore, inneschi pirotecnici attivati e indicatore di urto rilevato. Usata anche dalla BSI come trama di supervisione della presenza della centralina airbag.'
  pl: 'Stan systemu poduszek powietrznych: wyłączenie poduszki pasażera, wykrycie przewrócenia i uderzenia tylnego, zadziałane zapłonniki pirotechniczne oraz flaga wykrytego zderzenia. Używana także przez BSI jako ramka nadzoru obecności sterownika poduszek powietrznych.'
  ru: 'Статус системы подушек безопасности: отключение подушки пассажира, обнаружение опрокидывания и заднего удара, сработавшие пиротехнические воспламенители и флаг обнаруженного столкновения. Также используется BSI как кадр контроля присутствия блока подушек безопасности.'
  zh: '安全气囊系统状态:乘客安全气囊禁用、翻车和后部碰撞检测、已触发的火药式点火器及碰撞检测标志。BSI也将其用作安全气囊控制单元的存在监控帧。'
  hu: 'A légzsákrendszer állapota: utas légzsák letiltása, borulás- és hátsó ütközésérzékelés, kioldott pirotechnikai gyújtók és ütközésérzékelési jelző. A BSI a légzsák-vezérlőegység jelenlét-felügyeleti kereteként is használja.'
  pt: 'Estado do sistema de airbags: inibição do airbag do passageiro, deteção de capotamento e de impacto traseiro, ignitores pirotécnicos disparados e indicador de colisão detetada. Também utilizada pelo computador de servidão como trama de supervisão de presença da unidade de controlo do airbag.'
observations:
  en: 'On state change of: PASSENGER_AIRBAG_INHIBITION_STATUS, CRASH_DETECTED_SINCE_LAST_POWER_UP, AUTOMATIC_ECALL_TRIGGER'
  fr: 'Sur changement d''état de : PASSENGER_AIRBAG_INHIBITION_STATUS, CRASH_DETECTED_SINCE_LAST_POWER_UP, AUTOMATIC_ECALL_TRIGGER'
  es: 'Al cambiar el estado de: PASSENGER_AIRBAG_INHIBITION_STATUS, CRASH_DETECTED_SINCE_LAST_POWER_UP, AUTOMATIC_ECALL_TRIGGER'
  de: 'Bei Statusänderung von: PASSENGER_AIRBAG_INHIBITION_STATUS, CRASH_DETECTED_SINCE_LAST_POWER_UP, AUTOMATIC_ECALL_TRIGGER'
  it: 'Al cambiamento di stato di: PASSENGER_AIRBAG_INHIBITION_STATUS, CRASH_DETECTED_SINCE_LAST_POWER_UP, AUTOMATIC_ECALL_TRIGGER'
  pl: 'Wysyłane przy zmianie stanu: PASSENGER_AIRBAG_INHIBITION_STATUS, CRASH_DETECTED_SINCE_LAST_POWER_UP, AUTOMATIC_ECALL_TRIGGER'
  ru: 'При изменении состояния: PASSENGER_AIRBAG_INHIBITION_STATUS, CRASH_DETECTED_SINCE_LAST_POWER_UP, AUTOMATIC_ECALL_TRIGGER'
  zh: '当ET_INHIBITION, CRASH_DETECTED_SINCE_LAST_POWER_UP, ECALL_CRASH状态变化时'
  hu: 'A(z) PASSENGER_AIRBAG_INHIBITION_STATUS, CRASH_DETECTED_SINCE_LAST_POWER_UP, AUTOMATIC_ECALL_TRIGGER állapotváltozásakor'
  pt: 'Na mudança de estado de: PASSENGER_AIRBAG_INHIBITION_STATUS, CRASH_DETECTED_SINCE_LAST_POWER_UP, AUTOMATIC_ECALL_TRIGGER'
periodicity: ['200ms', 'trigger']
senders: ['RBG']
receivers: ['EDP_C', 'BSI']

