  hu: 'A(z) DRIVER_MEMORY, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, ECO_MODE, DRIVER_MEMORY_COUNT, ENGINE_BAY_ACC_POWER_COMMAND, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, HYBRID_STATUS_UPDATED, RADIO_ON_OFF_TOGGLE, RADIO_ON_OFF_SYNC állapotváltozásakor'
