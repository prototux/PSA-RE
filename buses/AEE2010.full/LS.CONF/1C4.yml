id: 0x1C4
name: 'RBG_COMMAND'
type: 'can'
length: 4
comment:
  en: 'Commands sent by the BSI to the RBG (seatbelt/airbag interface) module: seatbelt buckle states for all seating positions, auto-inhibit request and HMI activation pack.'
  fr: 'Commandes envoyées par la BSI au module RBG (interface ceintures/airbag) : états de bouclage de ceinture pour toutes les places, demande d''inhibition automatique et pack d''activation IHM.'
  es: 'Órdenes enviadas por la BSI al módulo RBG (interfaz de cinturones/airbag): estados de cierre del cinturón para todas las plazas, solicitud de inhibición automática y paquete de activación de IHM.'
  de: 'Von der BSI an das RBG-Modul (Gurt-/Airbag-Schnittstelle) gesendete Befehle: Gurtschlosszustände für alle Sitzplätze, automatische Sperranforderung und HMI-Aktivierungspaket.'
  it: 'Comandi inviati dalla BSI al modulo RBG (interfaccia cinture/airbag): stati di chiusura cintura per tutti i posti, richiesta di inibizione automatica e pacchetto di attivazione HMI.'
  pl: 'Polecenia wysyłane przez BSI do modułu RBG (interfejs pasów/poduszki powietrznej): stany zapięcia pasów dla wszystkich miejsc, żądanie automatycznego wyłączenia i pakiet aktywacji interfejsu.'
  ru: 'Команды, отправляемые BSI в модуль RBG (интерфейс ремней/подушек безопасности): состояния пряжек ремней для всех мест, запрос автоматического отключения и пакет активации интерфейса.'
  zh: '由BSI发送给RBG（安全带/气囊接口）模块的命令：所有座位的安全带锁扣状态、自动抑制请求及人机界面激活包。'
  hu: 'A BSI parancsai az RBG (öv-/légzsák-interfész) modul felé: az összes üléshely biztonságiöv-csat állapota, automatikus tiltási kérés és a kezelőfelület aktiválási csomagja.'
  pt: 'Comandos enviados pela BSI ao módulo RBG (interface de cinto de segurança/airbag): estados do fecho do cinto de segurança para todas as posições de banco, pedido de auto-inibição e pacote de ativação da IHM.'
periodicity: ['100ms', 'trigger']
senders: ['BSI']
receivers: ['RBG']

