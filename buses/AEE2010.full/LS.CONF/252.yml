        fr: 'Dernier arrêt normal'
        es: 'Última parada normal'
        de: 'Letzter normaler Stopp'
        it: 'Ultimo arresto normale'
        pl: 'Ostatni normalny postój'
        ru: 'Последняя нормальная остановка'
