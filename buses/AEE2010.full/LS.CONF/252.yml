  SEAT_ACCESS_STOP_EARLY_PASSENGER:
    bits: '2.7'
    comment:
      en: 'Last rear-seat access motion was stopped before complete execution (passenger side)'
      fr: 'Le dernier mouvement de la fonction d''accès aux places arrière a été arrêté avant son terme (côté passager)'
      es: 'El último movimiento de la función de acceso a las plazas traseras se detuvo antes de completarse (lado pasajero)'
      de: 'Die letzte Bewegung der Fondzugangsfunktion wurde vor vollständiger Ausführung gestoppt (Beifahrerseite)'
      it: 'L''ultimo movimento della funzione di accesso ai sedili posteriori è stato interrotto prima del completamento (lato passeggero)'
      pl: 'Ostatni ruch funkcji dostępu do tylnych siedzeń został zatrzymany przed pełnym wykonaniem (strona pasażera)'
      ru: 'Последнее движение функции доступа к задним сиденьям было остановлено до завершения (сторона пассажира)'
      zh: '后排座椅进出功能的最后一次动作在完全执行前被停止(乘客侧)'
      hu: 'A hátsó ülésekhez való hozzáférés funkció utolsó mozgása a teljes végrehajtás előtt megállt (utas oldal)'
      pt: 'O último movimento da função de acesso aos bancos traseiros foi interrompido antes de terminar (lado do passageiro)'
