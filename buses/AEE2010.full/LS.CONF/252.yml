      ru: 'Сиденье пассажира в положении для доступа к задним сиденьям'
      zh: '乘客座椅处于便于进入后排的位置'
      hu: 'Az utasülés a hátsó ülésekhez való hozzáférést lehetővé tevő helyzetben van'
