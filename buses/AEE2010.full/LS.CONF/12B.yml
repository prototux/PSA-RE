id: 0x12B
name: 'AAS_VERSION'
type: 'can'
length: 1
comment:
  en: 'Configuration frame for the retractable hard-top: boot/tailgate airbag inhibition and roof authorisation.'
  fr: 'Trame de configuration du toit escamotable : inhibition airbag de coffre et autorisation toit.'
  es: 'Trama de configuración del techo retráctil: inhibición del airbag del maletero y autorización del techo.'
  de: 'Konfigurationstelegramm für das versenkbare Hardtop: Kofferraum-Airbag-Sperre und Dachfreigabe.'
  it: 'Trama di configurazione del tettuccio rigido retrattile: inibizione airbag baule e autorizzazione tetto.'
  pl: 'Ramka konfiguracyjna chowanego dachu twardego: blokada poduszki bagażnika i autoryzacja dachu.'
  ru: 'Кадр конфигурации складной жёсткой крыши: блокировка подушки багажника и разрешение крыши.'
  zh: '可收藏硬顶的配置帧:后备箱安全气囊抑制和车顶授权。'
  hu: 'A behúzható kemény tető konfigurációs kerete: csomagtér légzsák letiltása és tető engedélyezése.'
  pt: 'Trama de configuração do teto rígido retrátil: inibição do airbag da bagageira/porta traseira e autorização do teto.'
observations:
  en: 'On state change of: BTE_LOCK, BTE_TRUNK_LOCK'
  fr: 'Sur changement d''état de : BTE_LOCK, BTE_TRUNK_LOCK'
  es: 'Al cambiar el estado de: BTE_LOCK, BTE_TRUNK_LOCK'
  de: 'Bei Statusänderung von: BTE_LOCK, BTE_TRUNK_LOCK'
  it: 'Al cambiamento di stato di: BTE_LOCK, BTE_TRUNK_LOCK'
  pl: 'Wysyłane przy zmianie stanu: BTE_LOCK, BTE_TRUNK_LOCK'
  ru: 'При изменении состояния: BTE_LOCK, BTE_TRUNK_LOCK'
  zh: '当AUT_TE, AC_COF_BAG_INH状态变化时'
  hu: 'A(z) BTE_LOCK, BTE_TRUNK_LOCK állapotváltozásakor'
  pt: 'Na mudança de estado de: BTE_LOCK, BTE_TRUNK_LOCK'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['BTE']

signals:
  BTE_LOCK:
    bits: '1.7'
    comment:
      en: 'Authorization for convertible roof (TE) operation.'
      fr: 'Autorisation de fonctionnement du toit escamotable (TE).'
      es: 'Autorización de funcionamiento del techo escamoteable (TE).'
      de: 'Freigabe für den Betrieb des Klappdachs (TE).'
      it: 'Autorizzazione al funzionamento del tetto scomparibile (TE).'
      pl: 'Zezwolenie na działanie chowanego dachu (TE).'
      ru: 'Разрешение на работу складной крыши (TE).'
      zh: '折叠车顶(TE)运行授权。'
      hu: 'A behajtható tető (TE) működésének engedélyezése.'
      pt: 'Autorização de funcionamento do tejadilho retrátil (TE).'
    type: 'bool'
    values:
      0x00:
        en: 'Not authorized'
        fr: 'Non autorisé'
        es: 'No autorizado'
        de: 'Nicht erlaubt'
        it: 'Non autorizzato'
        pl: 'Niedozwolone'
        ru: 'Не разрешено'
        zh: '不允许'
        hu: 'Nincs engedélyezve'
        pt: 'Não autorizado'
      0x01:
        en: 'Authorised'
        fr: 'Autorisé'
        es: 'Autorizado'
        de: 'Zulässig'
        it: 'Autorizzato'
        pl: 'Dozwolone'
        ru: 'Разрешено'
        zh: '已授权'
        hu: 'Engedélyezve'
        pt: 'Autorizado'

  UNUSED_1:
    bits: '1.6-1.1'
    unused: true

  BTE_TRUNK_LOCK:
    bits: '1.0'
    comment:
      en: 'Trunk lock actuator disabled.'
      fr: 'Actionneur de serrure du coffre à bagages inhibé.'
      es: 'Actuador de la cerradura del maletero inhibido.'
      de: 'Stellantrieb des Kofferraumschlosses deaktiviert.'
      it: 'Attuatore della serratura del bagagliaio disabilitato.'
      pl: 'Wyłączony siłownik zamka bagażnika.'
      ru: 'Исполнительный механизм замка багажника отключён.'
      zh: '行李箱锁执行器被禁用。'
      hu: 'A csomagtér záractuátora letiltva.'
      pt: 'Atuador da fechadura da mala inibido.'
    type: 'bool'
    values:
      0x00:
        en: 'Command allowed'
        fr: 'Commande possible'
        es: 'Comando posible'
        de: 'Befehl möglich'
        it: 'Comando possibile'
        pl: 'Polecenie możliwe'
        ru: 'Команда возможна'
        zh: '指令可行'
        hu: 'Parancs lehetséges'
        pt: 'Comando permitido'
      0x01:
        en: 'Command inhibited'
        fr: 'Commande inhibée'
        es: 'Orden inhibida'
        de: 'Befehl gesperrt'
        it: 'Comando inibito'
        pl: 'Polecenie zablokowane'
        ru: 'Команда заблокирована'
        zh: '指令被禁止'
        hu: 'Parancs letiltva'
        pt: 'Comando inibido'
