id: 0x310
name: 'REAR_AC_INTERNAL_SENSOR_INFO'
type: 'can'
length: 6
comment:
  en: 'Rear-zone blown-air and evaporator temperatures from the front air conditioning control module.'
  fr: 'Températures d''air soufflé arrière et d''évaporateur issues du module de contrôle climatisation avant.'
  es: 'Temperaturas de aire soplado de la zona trasera y del evaporador del módulo de control del climatizador delantero.'
  de: 'Hintere Ausblastemperatur und Verdampfertemperatur vom vorderen Klimasteuermodul.'
  it: 'Temperature dell''aria soffiata posteriore e dell''evaporatore dal modulo di controllo del climatizzatore anteriore.'
  pl: 'Tylne temperatury nadmuchu powietrza i parownika z przedniego modułu sterowania klimatyzacją.'
  ru: 'Задняя температура выдуваемого воздуха и испарителя от переднего модуля управления кондиционером.'
  zh: '来自前部空调控制模块的后区出风及蒸发器温度。'
  hu: 'A hátsó zóna befúvási és párologtató hőmérséklete az elülső klíma vezérlőmoduljától.'
  pt: 'Temperaturas do ar soprado da zona traseira e do evaporador provenientes do módulo de controlo da climatização dianteira.'
periodicity: ['50025ms']
senders: ['CLIM_AV', 'CLIM_AR']
receivers: ['BSI']

signals:
  REAR_LEFT_BLOWN_AIR_TEMPERATURE:
    bits: '1.7-2.0'
    comment:
      en: 'Rear left blown air temperature'
      fr: 'Température de l''air soufflé arrière gauche'
      es: 'Temperatura del aire impulsado trasero izquierdo'
      de: 'Temperatur der ausgeblasenen Luft hinten links'
      it: 'Temperatura dell''aria soffiata posteriore sinistra'
      pl: 'Temperatura nawiewanego powietrza z tyłu po lewej'
      ru: 'Температура обдуваемого воздуха сзади слева'
      zh: '左后出风口空气温度'
      hu: 'A hátsó bal oldali befúvott levegő hőmérséklete'
      pt: 'Temperatura do ar insuflado traseiro esquerdo'
    type: 'uint'
    factor: 0.1
    offset: -40
    min: -40
    max: 85
    invalid: 0xFFFF
    default: 0xFFFF

  REAR_RIGHT_BLOWN_AIR_TEMPERATURE:
    bits: '3.7-4.0'
    comment:
      en: 'Rear right blown air temperature'
      fr: 'Température de l''air soufflé arrière droit'
      es: 'Temperatura del aire impulsado trasero derecho'
      de: 'Temperatur der ausgeblasenen Luft hinten rechts'
      it: 'Temperatura dell''aria soffiata posteriore destra'
      pl: 'Temperatura nawiewanego powietrza z tyłu po prawej'
      ru: 'Температура обдуваемого воздуха сзади справа'
      zh: '右后出风口空气温度'
      hu: 'A hátsó jobb oldali befúvott levegő hőmérséklete'
      pt: 'Temperatura do ar insuflado traseiro direito'
    type: 'uint'
    factor: 0.1
    offset: -40
    min: -40
    max: 85
    invalid: 0xFFFF
    default: 0xFFFF

  REAR_EVAPORATOR_PROBE_TEMPERATURE_2:
    bits: '5.7-6.0'
    comment:
      en: 'Rear evaporator probe temperature'
      fr: 'Température de la sonde évaporateur arrière'
      es: 'Temperatura de la sonda del evaporador trasero'
      de: 'Hintere Verdampfersondentemperatur'
      it: 'Temperatura della sonda evaporatore posteriore'
      pl: 'Temperatura czujnika parownika tylnego'
      ru: 'Температура датчика заднего испарителя'
      zh: '后蒸发器探头温度'
      hu: 'A hátsó elpárologtató érzékelő hőmérséklete'
      pt: 'Temperatura da sonda do evaporador traseiro'
    type: 'uint'
    factor: 0.1
    offset: -40
    min: -40
    max: 85
    invalid: 0xFFFF
    default: 0xFFFF

alternatives:
  - note:
      en: 'Also observed with a period of 500ms'
      fr: 'Aussi observée avec une période de 500ms'
      es: 'También observada con un periodo de 500ms'
      de: 'Auch mit einer Periode von 500ms beobachtet'
      it: 'Osservata anche con un periodo di 500ms'
      pl: 'Obserwowana także z okresem 500ms'
      ru: 'Также наблюдалась с периодом 500ms'
      zh: '也观察到周期为500ms'
      hu: 'Megfigyelve 500ms periódussal is'
      pt: 'Também observada com um período de 500ms'
    periodicity: ['500ms']
