id: 0x152
name: 'DRIVER_MEMORY_KEYPAD_STATUS'
type: 'can'
length: 1
comment:
  en: 'Driver memory keypad button presses (memory 1-7 and M).'
  fr: 'Appuis sur le clavier mémoire conducteur (mémoires 1 à 7 et M).'
  es: 'Pulsaciones del teclado de memoria del conductor (memorias 1 a 7 y M).'
  de: 'Tastendrücke des Fahrer-Memory-Tastenfelds (Memory 1-7 und M).'
  it: 'Pressioni sulla tastiera memoria conducente (memorie 1-7 e M).'
  pl: 'Naciśnięcia klawiatury pamięci kierowcy (pamięci 1-7 i M).'
  ru: 'Нажатия клавиатуры памяти водителя (память 1-7 и M).'
  zh: '驾驶员记忆键盘按键(记忆1-7及M)。'
  hu: 'A vezetőoldali memóriabillentyűzet gombnyomásai (1-7. memória és M).'
  pt: 'Pressões dos botões do teclado de memória do condutor (memória 1-7 e M).'
observations:
  en: 'On button press'
  fr: 'Sur appui d''une touche'
  es: 'Al pulsar un botón'
  de: 'Beim Tastendruck'
  it: 'Alla pressione di un pulsante'
  pl: 'Przy naciśnięciu przycisku'
  ru: 'При нажатии кнопки'
  zh: '按键按下时'
  hu: 'Gombnyomáskor'
  pt: 'Na pressão de um botão'
periodicity: ['200ms', 'trigger']
senders: ['BDM_C']
receivers: ['BSI']

signals:
  MEMORY_KEY_PRESSED:
    bits: '1.7'
    comment:
      en: 'Save/memory key pressed'
      fr: 'Touche mémorisation appuyée'
      es: 'Tecla de memorización pulsada'
      de: 'Speichertaste gedrückt'
      it: 'Tasto di memorizzazione premuto'
      pl: 'Naciśnięto przycisk zapisu do pamięci'
      ru: 'Нажата клавиша сохранения в память'
      zh: '记忆按键被按下'
      hu: 'Memóriagomb megnyomva'
      pt: 'Tecla de memorização pressionada'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Key released'
        fr: 'Touche relachee'
        es: 'Tecla soltada'
        de: 'Taste losgelassen'
        it: 'Tasto rilasciato'
        pl: 'Przycisk zwolniony'
        ru: 'Кнопка отпущена'
        zh: '按键已释放'
        hu: 'Gomb elengedve'
        pt: 'Tecla solta'
      0x01:
        en: 'Key pressed'
        fr: 'Touche appuyée'
        es: 'Tecla pulsada'
        de: 'Taste gedrückt'
        it: 'Tasto premuto'
        pl: 'Wciśnięty przycisk'
        ru: 'Кнопка нажата'
        zh: '按键已按下'
        hu: 'Gomb megnyomva'
        pt: 'Tecla premida'

  UNUSED_1:
    bits: '1.6-1.2'
    unused: true

  KEY_2_PRESSED:
    bits: '1.1'
    comment:
      en: 'Key 2 pressed'
      fr: 'Touche 2 appuyée'
      es: 'Tecla 2 pulsada'
      de: 'Taste 2 gedrückt'
      it: 'Tasto 2 premuto'
      pl: 'Naciśnięto przycisk 2'
      ru: 'Нажата клавиша 2'
      zh: '按键2被按下'
      hu: 'A(z) 2. gomb megnyomva'
      pt: 'Tecla 2 pressionada'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Key released'
        fr: 'Touche relachee'
        es: 'Tecla soltada'
        de: 'Taste losgelassen'
        it: 'Tasto rilasciato'
        pl: 'Przycisk zwolniony'
        ru: 'Кнопка отпущена'
        zh: '按键已释放'
        hu: 'Gomb elengedve'
        pt: 'Tecla solta'
      0x01:
        en: 'Key pressed'
        fr: 'Touche appuyée'
        es: 'Tecla pulsada'
        de: 'Taste gedrückt'
        it: 'Tasto premuto'
        pl: 'Wciśnięty przycisk'
        ru: 'Кнопка нажата'
        zh: '按键已按下'
        hu: 'Gomb megnyomva'
        pt: 'Tecla premida'

  KEY_1_PRESSED:
    bits: '1.0'
    comment:
      en: 'Key 1 pressed'
      fr: 'Touche 1 appuyée'
      es: 'Tecla 1 pulsada'
      de: 'Taste 1 gedrückt'
      it: 'Tasto 1 premuto'
      pl: 'Naciśnięto przycisk 1'
      ru: 'Нажата клавиша 1'
      zh: '按键1被按下'
      hu: 'A(z) 1. gomb megnyomva'
      pt: 'Tecla 1 pressionada'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Key released'
        fr: 'Touche relachee'
        es: 'Tecla soltada'
        de: 'Taste losgelassen'
        it: 'Tasto rilasciato'
        pl: 'Przycisk zwolniony'
        ru: 'Кнопка отпущена'
        zh: '按键已释放'
        hu: 'Gomb elengedve'
        pt: 'Tecla solta'
      0x01:
        en: 'Key pressed'
        fr: 'Touche appuyée'
        es: 'Tecla pulsada'
        de: 'Taste gedrückt'
        it: 'Tasto premuto'
        pl: 'Wciśnięty przycisk'
        ru: 'Кнопка нажата'
        zh: '按键已按下'
        hu: 'Gomb megnyomva'
        pt: 'Tecla premida'
