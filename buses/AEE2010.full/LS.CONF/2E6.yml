      en: 'Driver request status for activating/deactivating the parking space measurement (SAM) function'
      fr: 'État de la demande conducteur d''activation/désactivation de la fonction de mesure de place (SAM)'
      es: 'Estado de la solicitud del conductor de activación/desactivación de la función de medición de plaza (SAM)'
      de: 'Status der Fahreranforderung zur Aktivierung/Deaktivierung der Parklückenvermessung (SAM)'
      it: 'Stato della richiesta del conducente di attivazione/disattivazione della funzione di misurazione dello spazio (SAM)'
      pl: 'Stan żądania kierowcy dotyczącego aktywacji/dezaktywacji funkcji pomiaru miejsca (SAM)'
      ru: 'Статус запроса водителя на активацию/деактивацию функции измерения места (SAM)'
      zh: '驾驶员对车位测量(SAM)功能激活/停用请求的状态'
      hu: 'A vezető SAM (helymérés) funkció be-/kikapcsolására vonatkozó kérésének állapota'
      pt: 'Estado do pedido do condutor de ativação/desativação da função de medição de lugar (SAM)'
