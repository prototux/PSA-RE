id: 0x2E6
name: 'SAM_MODULE_COMMAND'
type: 'can'
length: 2
comment:
  en: 'Command frame for the SAM module: push-button, ambient light level, degradation status and forced-info request.'
  fr: 'Trame de commande du module SAM : bouton-poussoir, niveau de luminosité ambiante, état de dégradation et demande de forçage d''info.'
  es: 'Trama de comando del módulo SAM: pulsador, nivel de luz ambiente, estado de degradación y solicitud de forzado de información.'
  de: 'Befehlstelegramm für das SAM-Modul: Taster, Umgebungslichtstärke, Degradationsstatus und Anforderung zur Informationserzwingung.'
  it: 'Trama di comando del modulo SAM: pulsante, livello di luce ambientale, stato di degradazione e richiesta di forzatura informazioni.'
  pl: 'Ramka poleceń modułu SAM: przycisk, poziom oświetlenia otoczenia, stan degradacji i żądanie wymuszenia informacji.'
  ru: 'Кадр команд для модуля SAM: кнопка, уровень освещённости, статус деградации и запрос принудительной информации.'
  zh: 'SAM模块的命令帧:按钮、环境光水平、降级状态和强制信息请求。'
  hu: 'A SAM modul parancskerete: nyomógomb, környezeti fényszint, degradációs állapot és kényszerített infó kérése.'
  pt: 'Trama de comando para o módulo SAM: botão, nível de luz ambiente, estado de degradação e pedido de informação forçada.'
observations:
  en: 'On state change of: SPACE_MEASUREMENT_REQUEST, GEAR_POSITION_TO_DISPLAY, SAM_ACTIVATION_REQUEST_STATUS'
  fr: 'Sur changement d''état de : SPACE_MEASUREMENT_REQUEST, GEAR_POSITION_TO_DISPLAY, SAM_ACTIVATION_REQUEST_STATUS'
  es: 'Al cambiar el estado de: SPACE_MEASUREMENT_REQUEST, GEAR_POSITION_TO_DISPLAY, SAM_ACTIVATION_REQUEST_STATUS'
  de: 'Bei Statusänderung von: SPACE_MEASUREMENT_REQUEST, GEAR_POSITION_TO_DISPLAY, SAM_ACTIVATION_REQUEST_STATUS'
  it: 'Al cambiamento di stato di: SPACE_MEASUREMENT_REQUEST, GEAR_POSITION_TO_DISPLAY, SAM_ACTIVATION_REQUEST_STATUS'
  pl: 'Wysyłane przy zmianie stanu: SPACE_MEASUREMENT_REQUEST, GEAR_POSITION_TO_DISPLAY, SAM_ACTIVATION_REQUEST_STATUS'
  ru: 'При изменении состояния: SPACE_MEASUREMENT_REQUEST, GEAR_POSITION_TO_DISPLAY, SAM_ACTIVATION_REQUEST_STATUS'
  zh: '当DMD_ACTIV_MPD, GEAR_POSITION_TO_DISPLAY, ETAT_DMD_SAM状态变化时'
  hu: 'A(z) SPACE_MEASUREMENT_REQUEST, GEAR_POSITION_TO_DISPLAY, SAM_ACTIVATION_REQUEST_STATUS állapotváltozásakor'
  pt: 'Na mudança de estado de: SPACE_MEASUREMENT_REQUEST, GEAR_POSITION_TO_DISPLAY, SAM_ACTIVATION_REQUEST_STATUS'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['SAM']

signals:
  UNUSED_1:
    bits: '1.7-1.5'
    unused: true

  SAM_ACTIVATION_REQUEST_STATUS:
    bits: '1.4-1.3'
