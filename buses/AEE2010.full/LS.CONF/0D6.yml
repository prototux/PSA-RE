id: 0x0D6
name: 'RETRACTABLE_ROOF_STATUS'
type: 'can'
length: 6
comment:
  en: 'Retractable hard-top status: boot open, roof locked, system fault, inhibition requests and push-button/joystick commands.'
  fr: 'État du toit escamotable : coffre ouvert, toit verrouillé, défaut système, demandes d''inhibition et commandes bouton-poussoir/joystick.'
  es: 'Estado del techo retráctil: maletero abierto, techo bloqueado, fallo del sistema, solicitudes de inhibición y comandos de pulsador/joystick.'
  de: 'Status des versenkbaren Hardtops: Kofferraum offen, Dach verriegelt, Systemfehler, Sperranforderungen und Taster-/Joystick-Befehle.'
  it: 'Stato del tettuccio rigido retrattile: baule aperto, tetto bloccato, guasto sistema, richieste di inibizione e comandi pulsante/joystick.'
  pl: 'Stan chowanego dachu twardego: otwarty bagażnik, zablokowany dach, usterka systemu, żądania blokady oraz polecenia przycisku/joysticka.'
  ru: 'Статус складной жёсткой крыши: багажник открыт, крыша заблокирована, неисправность системы, запросы блокировки и команды кнопки/джойстика.'
  zh: '可收藏硬顶状态:后备箱打开、车顶锁定、系统故障、抑制请求以及按钮/操纵杆命令。'
  hu: 'A behúzható kemény tető állapota: csomagtér nyitva, tető záró, rendszerhiba, letiltási kérések és nyomógomb-/joystick-parancsok.'
  pt: 'Estado do teto rígido retrátil: bagageira aberta, teto trancado, avaria do sistema, pedidos de inibição e comandos do botão/joystick.'
periodicity: ['200ms', 'trigger']
senders: ['BTE']
receivers: ['BSI', 'EDP_C']

signals:
  BTE_FAULT:
    bits: '1.7'
    comment:
      en: 'Convertible roof (TE) system fault.'
      fr: 'Défaut du système du toit escamotable (TE).'
      es: 'Fallo del sistema del techo escamoteable (TE).'
      de: 'Fehler im Klappdachsystem (TE).'
      it: 'Guasto del sistema del tetto scomparibile (TE).'
      pl: 'Usterka systemu chowanego dachu (TE).'
      ru: 'Неисправность системы складной крыши (TE).'
      zh: '折叠车顶(TE)系统故障。'
      hu: 'A behajtható tető (TE) rendszerének hibája.'
      pt: 'Falha do sistema do teto retrátil (TE)'
    type: 'bool'
    values:
      0x00:
        en: 'No fault detected'
        fr: 'Pas de défaut'
        es: 'Sin fallo'
        de: 'Kein Fehler'
        it: 'Nessun guasto'
        pl: 'Brak usterki'
