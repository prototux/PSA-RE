id: 0x12D
name: 'FRONT_CLIMATE_MOTOR_COMMAND_2'
type: 'can'
length: 8
comment:
  en: 'Front climate mixing, air intake and blower motor setpoints, plus rear blower authorisation and purifier fan command, sent by the BSI.'
  fr: 'Consignes des moteurs de mixage, d''entrée d''air et de pulseur avant, autorisation du pulseur arrière et commande du ventilateur purificateur, envoyées par la BSI.'
  es: 'Consignas de los motores de mezcla, entrada de aire y ventilador delantero, autorización del ventilador trasero y orden del ventilador purificador, enviadas por la BSI.'
  de: 'Sollwerte der Misch-, Lufteinlass- und Gebläsemotoren vorn, Freigabe des Fondgebläses und Ansteuerung des Reinigungslüfters, von der BSI gesendet.'
  it: 'Setpoint dei motori di miscelazione, presa d''aria e ventola anteriore, autorizzazione della ventola posteriore e comando della ventola purificatrice, inviati dalla BSI.'
  pl: 'Zadane wartości silników mieszania, wlotu powietrza i dmuchawy przedniej, zezwolenie na dmuchawę tylną i polecenie wentylatora oczyszczacza, wysyłane przez BSI.'
  ru: 'Заданные значения моторов смешения, забора воздуха и переднего вентилятора, разрешение заднего вентилятора и команда вентилятора очистителя, отправляемые BSI.'
  zh: '由BSI发送的前排混风、进气及鼓风机电机设定值，以及后鼓风机授权和净化风扇命令。'
  hu: 'Az elülső keverő-, levegőbeömlő- és fúvómotorok alapjelei, a hátsó fúvóka engedélyezése és a légtisztító ventilátor parancsa, a BSI küldi.'
  pt: 'Pontos de ajuste dos motores de mistura, entrada de ar e ventilador da climatização dianteira, além da autorização do ventilador traseiro e do comando da ventoinha do purificador, enviados pela BSI.'
observations:
  en: 'On state change of: FRONT_BLOWER_MOTOR_SETPOINT, AIR_INTAKE_MOTOR_SETPOINT'
  fr: 'Sur changement d''état de : FRONT_BLOWER_MOTOR_SETPOINT, AIR_INTAKE_MOTOR_SETPOINT'
  es: 'Al cambiar el estado de: FRONT_BLOWER_MOTOR_SETPOINT, AIR_INTAKE_MOTOR_SETPOINT'
  de: 'Bei Statusänderung von: FRONT_BLOWER_MOTOR_SETPOINT, AIR_INTAKE_MOTOR_SETPOINT'
  it: 'Al cambiamento di stato di: FRONT_BLOWER_MOTOR_SETPOINT, AIR_INTAKE_MOTOR_SETPOINT'
  pl: 'Wysyłane przy zmianie stanu: FRONT_BLOWER_MOTOR_SETPOINT, AIR_INTAKE_MOTOR_SETPOINT'
  ru: 'При изменении состояния: FRONT_BLOWER_MOTOR_SETPOINT, AIR_INTAKE_MOTOR_SETPOINT'
  zh: '当CONS_PULSEUR_AVANT, CONS_MOT_ENT_AIR状态变化时'
  hu: 'A(z) FRONT_BLOWER_MOTOR_SETPOINT, AIR_INTAKE_MOTOR_SETPOINT állapotváltozásakor'
  pt: 'Na mudança de estado de: FRONT_BLOWER_MOTOR_SETPOINT, AIR_INTAKE_MOTOR_SETPOINT'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['CLIM_AR', 'CLIM_AV']

