id: 0x5A8
name: 'ENGINE_PERFORMANCE_DATA_3'
type: 'can'
length: 8
comment:
  en: 'Engine performance data sent by the engine ECU: displayed torque and power, minimum torque and performance index.'
  fr: 'Données de performance moteur envoyées par le calculateur moteur : couple et puissance affichés, couple minimal et indice de performance.'
  es: 'Datos de rendimiento del motor enviados por la centralita del motor: par y potencia mostrados, par mínimo e índice de rendimiento.'
  de: 'Vom Motorsteuergerät gesendete Motorleistungsdaten: angezeigtes Drehmoment und Leistung, Mindestdrehmoment und Leistungsindex.'
  it: 'Dati di prestazione motore inviati dalla centralina motore: coppia e potenza visualizzate, coppia minima e indice di prestazione.'
  pl: 'Dane osiągów silnika wysyłane przez sterownik silnika: wyświetlany moment obrotowy i moc, minimalny moment obrotowy i wskaźnik osiągów.'
  ru: 'Данные о характеристиках двигателя, отправляемые ЭБУ двигателя: отображаемый крутящий момент и мощность, минимальный крутящий момент и индекс производительности.'
  zh: '由发动机ECU发送的发动机性能数据：显示的扭矩和功率、最小扭矩和性能指数。'
  hu: 'A motorvezérlő egység által küldött motorteljesítmény-adatok: kijelzett nyomaték és teljesítmény, minimális nyomaték és teljesítményindex.'
  pt: 'Dados de desempenho do motor enviados pela unidade de controlo do motor: binário e potência apresentados, binário mínimo e índice de desempenho.'
periodicity: ['1000ms']
senders: ['CMM']
receivers: ['BSI']

