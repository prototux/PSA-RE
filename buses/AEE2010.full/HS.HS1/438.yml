id: 0x438
name: 'ENGINE_PERFORMANCE_DATA'
type: 'can'
length: 8
comment:
  en: 'Engine performance data sent by the engine ECU: displayed torque and power, minimum torque and performance index.'
  fr: 'Données de performance moteur envoyées par le calculateur moteur : couple et puissance affichés, couple minimal et indice de performance.'
  es: 'Datos de rendimiento del motor enviados por la centralita del motor: par y potencia mostrados, par mínimo e índice de rendimiento.'
  de: 'Vom Motorsteuergerät gesendete Motorleistungsdaten: angezeigtes Drehmoment und Leistung, Mindestdrehmoment und Leistungsindex.'
  it: 'Dati di prestazione motore inviati dalla centralina motore: coppia e potenza visualizzate, coppia minima e indice di prestazione.'
  pl: 'Dane osiągów silnika wysyłane przez sterownik silnika: wyświetlany moment obrotowy i moc, minimalny moment obrotowy i wskaźnik osiągów.'
  ru: 'Данные о характеристиках двигателя, отправляемые ЭБУ двигателя: отображаемый крутящий момент и мощность, минимальный крутящий момент и индекс производительности.'
  zh: '由发动机ECU发送的发动机性能数据：显示的扭矩和功率、最小扭矩和性能指数。'
  hu: 'A motorvezérlő egység által küldött motorteljesítmény-adatok: kijelzett nyomaték és teljesítmény, minimális nyomaték és teljesítményindex.'
  pt: 'Dados de desempenho do motor enviados pela unidade de controlo do motor: binário e potência apresentados, binário mínimo e índice de desempenho.'
periodicity: ['50ms']
senders: ['CMM']
receivers: ['BSI']

signals:
  ENGINE_TORQUE_MINIMUM:
    bits: '1.7-1.0'
    comment:
      en: 'Minimum engine torque (N.m)'
      fr: 'Couple moteur minimum (N.m)'
      es: 'Par motor mínimo (N.m)'
      de: 'Mindestes Motordrehmoment (N.m)'
      it: 'Coppia motore minima (N.m)'
      pl: 'Minimalny moment obrotowy silnika (N.m)'
      ru: 'Минимальный крутящий момент двигателя (Н·м)'
      zh: '最小发动机扭矩(N.m)'
      hu: 'Minimális motornyomaték (N.m)'
      pt: 'Binário mínimo do motor (N.m)'
    type: 'uint'
    factor: 2
    offset: -100
    min: -100
    max: 408
    units: 'Nm'
    invalid: 0xFF
    default: 0x00

  ENGINE_SPEED_AT_MAX_TORQUE:
    bits: '2.7-3.6'
    comment:
      en: 'Engine speed at maximum torque (rpm)'
      fr: 'Régime moteur au couple maximum (tr/min)'
      es: 'Régimen del motor en el par máximo (rpm)'
      de: 'Motordrehzahl bei maximalem Drehmoment (U/min)'
      it: 'Regime motore alla coppia massima (giri/min)'
      pl: 'Prędkość obrotowa silnika przy maksymalnym momencie obrotowym (obr/min)'
      ru: 'Обороты двигателя при максимальном крутящем моменте (об/мин)'
      zh: '最大扭矩时的发动机转速(rpm)'
      hu: 'Motorfordulatszám a maximális nyomatéknál (ford/perc)'
      pt: 'Regime do motor no binário máximo (rpm)'
    type: 'uint'
    factor: 10
    min: 0
    max: 6000
    units: 'rpm'
    invalid: 0x3FF
    default: 0x1F4

  ENGINE_PERFORMANCE_INDEX:
    bits: '3.5-4.7'
    comment:
      en: 'Engine performance indicator (%)'
      fr: 'Indicateur de performance moteur (%)'
      es: 'Indicador de rendimiento del motor (%)'
      de: 'Motorleistungsindikator (%)'
      it: 'Indicatore di prestazione del motore (%)'
      pl: 'Wskaźnik osiągów silnika (%)'
      ru: 'Индикатор производительности двигателя (%)'
      zh: '发动机性能指标(%)'
      hu: 'Motorteljesítmény-mutató (%)'
      pt: 'Indicador de desempenho do motor (%)'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    default: 0x64

  SPORT_MODE_DISPLAY_BOOST_PRESSURE_RATIO:
    bits: '4.6-4.0'
    comment:
      en: 'Maximum boost pressure ratio for sport-mode display'
      fr: 'Ratio de pression de suralimentation maximum pour l''affichage en mode sport'
      es: 'Relación de presión de sobrealimentación máxima para la pantalla en modo deportivo'
      de: 'Maximales Ladedruckverhältnis für die Sportmodus-Anzeige'
      it: 'Rapporto di pressione di sovralimentazione massima per la visualizzazione in modalità sport'
      pl: 'Maksymalny stosunek ciśnienia doładowania do wyświetlania w trybie sport'
      ru: 'Максимальное отношение давления наддува для отображения в спортивном режиме'
      zh: '运动模式显示用的最大增压比'
      hu: 'Maximális töltőnyomás-arány a sport módú kijelzéshez'
      pt: 'Relação de pressão de sobrealimentação máxima para a visualização em modo desportivo'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0x7F
    default: 0x00

  SPORT_MODE_DISPLAY_POWER:
    bits: '5.7-6.7'
    comment:
      en: 'Current power for sport-mode display'
      fr: 'Puissance courante pour l''affichage en mode sport'
      es: 'Potencia actual para la pantalla en modo deportivo'
      de: 'Aktuelle Leistung für die Sportmodus-Anzeige'
      it: 'Potenza attuale per la visualizzazione in modalità sport'
      pl: 'Bieżąca moc do wyświetlania w trybie sport'
      ru: 'Текущая мощность для отображения в спортивном режиме'
      zh: '运动模式显示用的当前功率'
      hu: 'Aktuális teljesítmény a sport módú kijelzéshez'
      pt: 'Potência atual para a visualização em modo desportivo'
    type: 'uint'
    factor: 1
    min: 0
    max: 400
    units: 'hp'
    invalid: 0x1FF
    default: 0x00

  SPORT_MODE_DISPLAY_POWER_RATIO:
    bits: '6.6-6.0'
    comment:
      en: 'Maximum power ratio for sport-mode display'
      fr: 'Ratio de puissance maximum pour l''affichage en mode sport'
      es: 'Relación de potencia máxima para la pantalla en modo deportivo'
      de: 'Maximales Leistungsverhältnis für die Sportmodus-Anzeige'
      it: 'Rapporto di potenza massima per la visualizzazione in modalità sport'
      pl: 'Maksymalny stosunek mocy do wyświetlania w trybie sport'
      ru: 'Максимальное отношение мощности для отображения в спортивном режиме'
      zh: '运动模式显示用的最大功率比'
      hu: 'Maximális teljesítményarány a sport módú kijelzéshez'
      pt: 'Relação de potência máxima para a visualização em modo desportivo'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0x7F
    default: 0x00

  SPORT_MODE_DISPLAY_TORQUE:
    bits: '7.7-8.7'
    comment:
      en: 'Current torque for sport-mode display'
      fr: 'Couple courant pour l''affichage en mode sport'
      es: 'Par motor actual para la pantalla en modo deportivo'
      de: 'Aktuelles Drehmoment für die Sportmodus-Anzeige'
      it: 'Coppia attuale per la visualizzazione in modalità sport'
      pl: 'Bieżący moment obrotowy do wyświetlania w trybie sport'
      ru: 'Текущий крутящий момент для отображения в спортивном режиме'
      zh: '运动模式显示用的当前扭矩'
      hu: 'Aktuális nyomaték a sport módú kijelzéshez'
      pt: 'Binário atual para a visualização em modo desportivo'
    type: 'uint'
    factor: 1
    min: 0
    max: 500
    units: 'Nm'
    invalid: 0x1FF
    default: 0x00

  SPORT_MODE_DISPLAY_TORQUE_RATIO:
    bits: '8.6-8.0'
    comment:
      en: 'Maximum torque ratio for sport-mode display'
      fr: 'Ratio de couple maximum pour l''affichage en mode sport'
      es: 'Relación de par máximo para la pantalla en modo deportivo'
      de: 'Maximales Drehmomentverhältnis für die Sportmodus-Anzeige'
      it: 'Rapporto di coppia massima per la visualizzazione in modalità sport'
      pl: 'Maksymalny stosunek momentu obrotowego do wyświetlania w trybie sport'
      ru: 'Максимальное отношение крутящего момента для отображения в спортивном режиме'
      zh: '运动模式显示用的最大扭矩比'
      hu: 'Maximális nyomatékarány a sport módú kijelzéshez'
      pt: 'Relação de binário máximo para a visualização em modo desportivo'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0x7F
    default: 0x00
