id: 0x5DE
name: 'NAV_ROAD_CONTEXT_INFO_2'
type: 'can'
length: 7
comment:
  en: 'Road context data relayed to the inter-system bus by the body computer (BSI) gateway: country code, driving side, distance to next junction/speed camera, number of lanes and speed zone.'
  fr: 'Données de contexte routier relayées sur le bus inter-système par la passerelle BSI : code pays, côté de circulation, distance au prochain carrefour/radar, nombre de voies et zone de vitesse.'
  es: 'Datos de contexto de la carretera retransmitidos al bus intersistema por la pasarela BSI: código de país, lado de circulación, distancia a la próxima intersección/radar, número de carriles y zona de velocidad.'
  de: 'Straßenkontextdaten, vom BSI-Gateway an den Inter-System-Bus weitergeleitet: Ländercode, Fahrseite, Entfernung zur nächsten Kreuzung/zum nächsten Blitzer, Fahrspuranzahl und Geschwindigkeitszone.'
  it: 'Dati di contesto stradale inoltrati al bus inter-sistema dal gateway BSI: codice paese, lato di guida, distanza dal prossimo incrocio/autovelox, numero di corsie e zona di velocità.'
  pl: 'Dane kontekstu drogowego przekazywane do magistrali międzysystemowej przez bramkę BSI: kod kraju, strona ruchu, odległość do najbliższego skrzyżowania/fotoradaru, liczba pasów i strefa prędkości.'
  ru: 'Данные дорожного контекста, ретранслируемые в межсистемную шину шлюзом BSI: код страны, сторона движения, расстояние до следующего перекрёстка/камеры, число полос и зона скорости.'
  zh: '由车身控制器(BSI)网关转发到系统间总线的道路环境数据:国家代码、行驶方向、距下一路口/测速点距离、车道数及限速区。'
  hu: 'A BSI átjáró által a rendszerközi buszra továbbított útkontextus-adatok: országkód, közlekedési oldal, távolság a következő csomóponttól/sebességmérőtől, sávok száma és sebességzóna.'
  pt: 'Dados de contexto rodoviário retransmitidos no barramento intersistema pela gateway da BSI: código do país, lado de condução, distância ao próximo cruzamento/radar, número de faixas e zona de velocidade.'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['CVM']

