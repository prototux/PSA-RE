id: 0x3B8
name: 'ENGINE_COASTING_DATA'
type: 'can'
length: 8
comment:
  en: 'Engine coasting (sailing/freewheel) state and real torque data, sent by the engine ECU.'
  fr: 'État de roue libre moteur (coasting/sailing) et données de couple réel, envoyés par le calculateur moteur.'
  es: 'Estado de rueda libre del motor (coasting/sailing) y datos de par real, enviados por la centralita del motor.'
  de: 'Zustand des Motorausrollens (Segeln/Freilauf) und Realdrehmoment-Daten, gesendet vom Motorsteuergerät.'
  it: 'Stato di ruota libera motore (coasting/sailing) e dati di coppia reale, inviati dalla centralina motore.'
  pl: 'Stan wybiegu silnika (żeglowanie/luz) i dane rzeczywistego momentu obrotowego, wysyłane przez sterownik silnika.'
  ru: 'Состояние выбега двигателя (накат/свободный ход) и данные реального крутящего момента, отправляемые ЭБУ двигателя.'
  zh: '发动机滑行（顺风/空转）状态及实际扭矩数据，由发动机ECU发送。'
  hu: 'A motor kigördülési (vitorlázás/szabadonfutás) állapota és a tényleges nyomaték adatai, a motorvezérlő egység küldi.'
  pt: 'Estado de deslize do motor (marcha livre/roda livre) e dados de binário real, enviados pela unidade de controlo do motor.'
periodicity: ['40ms']
senders: ['CMM']
receivers: ['BSI']

signals:
  ENGINE_SPEED_COMPLEMENT:
    bits: '1.7-2.0'
    comment:
      en: 'One''s complement of the engine speed, for functional safety'
      fr: 'Complément à 1 du régime moteur, pour la sécurité de fonctionnement'
      es: 'Complemento a 1 del régimen del motor, para la seguridad funcional'
      de: 'Einerkomplement der Motordrehzahl, für die Betriebssicherheit'
      it: 'Complemento a 1 del regime motore, per la sicurezza funzionale'
      pl: 'Dopełnienie do 1 obrotów silnika, dla bezpieczeństwa funkcjonalnego'
      ru: 'Дополнение до 1 оборотов двигателя, для функциональной безопасности'
      zh: '发动机转速的反码,用于功能安全'
      hu: 'A motorfordulatszám egyes komplemense, funkcionális biztonság céljából'
      pt: 'Complemento a 1 do regime do motor, para a segurança funcional'
    type: 'uint'
    min: 1
    max: 65535
    invalid: 0x00
    default: 0x00

  ACTUAL_TORQUE_COMPLEMENT:
    bits: '3.7-3.0'
    comment:
      en: 'One''s complement of the actual torque, for functional safety'
      fr: 'Complément à 1 du couple réel, pour la sécurité de fonctionnement'
      es: 'Complemento a 1 del par real, para la seguridad funcional'
      de: 'Einerkomplement des tatsächlichen Drehmoments, für die Betriebssicherheit'
