id: 0x0A9
name: 'IMMOBILIZER_SEED_GEARBOX_BSI'
type: 'can'
length: 5
comment:
  en: 'Immobiliser seed (challenge) sent by the gearbox ECU to the body computer (BSI), with the immobiliser computation status.'
  fr: 'Graine (défi) d''antidémarrage envoyée par le calculateur de boîte de vitesses au BSI, avec l''état du calcul d''antidémarrage.'
  es: 'Semilla (desafío) del inmovilizador enviada por la ECU de la caja de cambios a la BSI, con el estado del cálculo del inmovilizador.'
  de: 'Wegfahrsperren-Seed (Challenge) vom Getriebesteuergerät an das BSI, mit dem Status der Wegfahrsperrenberechnung.'
  it: 'Seme (challenge) dell''immobilizer inviato dalla centralina del cambio al BSI, con lo stato del calcolo dell''immobilizer.'
  pl: 'Ziarno (wyzwanie) immobilisera wysyłane przez sterownik skrzyni biegów do BSI, wraz ze stanem obliczeń immobilisera.'
  ru: 'Сид (запрос) иммобилайзера, отправляемый блоком управления коробкой передач в BSI, со статусом вычисления иммобилайзера.'
  zh: '变速箱控制单元发送给车身控制器(BSI)的防盗锁止种子(挑战值),并附带防盗锁止计算状态。'
  hu: 'A váltó vezérlőegysége által a BSI-nek küldött indításgátló-seed (challenge), az indításgátló-számítás állapotával együtt.'
  pt: 'Semente (desafio) do imobilizador enviada pela ECU da caixa de velocidades à BSI, com o estado do cálculo do imobilizador.'
observations:
  en: 'The transmission period changes when IMMO_LOCAL_ID_GEARBOX_BSI changes value'
  fr: 'La période d''émission change quand IMMO_LOCAL_ID_GEARBOX_BSI change de valeur'
  es: 'El período de transmisión cambia cuando IMMO_LOCAL_ID_GEARBOX_BSI cambia de valor'
  de: 'Die Sendeperiode ändert sich, wenn sich der Wert von IMMO_LOCAL_ID_GEARBOX_BSI ändert'
  it: 'Il periodo di trasmissione cambia quando IMMO_LOCAL_ID_GEARBOX_BSI cambia valore'
  pl: 'Okres transmisji zmienia się, gdy zmienia się wartość IMMO_LOCAL_ID_GEARBOX_BSI'
  ru: 'Период передачи меняется при изменении значения IMMO_LOCAL_ID_GEARBOX_BSI'
  zh: '当BV_BSI_IMMO_LID的值变化时,发送周期随之改变'
  hu: 'Az adási periódus megváltozik, ha a(z) IMMO_LOCAL_ID_GEARBOX_BSI értéke megváltozik'
  pt: 'O período de transmissão muda quando IMMO_LOCAL_ID_GEARBOX_BSI muda de valor'
periodicity: ['trigger']
senders: ['BVA']
receivers: ['BSI']

signals:
  IMMO_LOCAL_ID_GEARBOX_BSI:
    bits: '1.7-1.0'
    comment:
      en: 'Immobiliser function local identifier (gearbox-BSI)'
