      es: 'Identificador local de la función antirrobo (caja de cambios-BSI)'
      de: 'Lokale Kennung der Wegfahrsperrenfunktion (Getriebe-BSI)'
      it: 'Identificativo locale della funzione immobilizzatore (cambio-BSI)'
      pl: 'Lokalny identyfikator funkcji immobilizera (skrzynia biegów-BSI)'
      ru: 'Локальный идентификатор функции иммобилайзера (коробка передач-BSI)'
      zh: '防盗锁止功能本地标识符(变速箱-BSI)'
      hu: 'Az indításgátló funkció helyi azonosítója (váltó-BSI)'
      pt: 'Identificador local da função imobilizador (caixa de velocidades-BSI)'
    type: 'enum'
