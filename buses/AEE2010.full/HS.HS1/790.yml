id: 0x790
name: 'CSS_SUPERVISION'
type: 'can'
length: 8
comment:
  en: 'Network supervision: transmission quality counters and fault presence of the sending ECU'
  fr: 'Supervision réseau : compteurs de qualité de transmission et présence de défaut du calculateur émetteur'
  es: 'Supervisión de red: contadores de calidad de transmisión y presencia de fallos de la centralita emisora'
  de: 'Netzwerküberwachung: Übertragungsqualitätszähler und Fehlerstatus des sendenden Steuergeräts'
  it: 'Supervisione rete: contatori di qualità di trasmissione e presenza di guasti della centralina mittente'
  pl: 'Nadzór sieci: liczniki jakości transmisji i obecność usterki sterownika nadawcy'
  ru: 'Супервизия сети: счётчики качества передачи и наличие неисправности передающего блока'
  zh: '网络监控:传输质量计数器及发送方ECU的故障状态'
  hu: 'Hálózatfelügyelet: átviteli minőség számlálók és az adó vezérlőegység hibaállapota'
  pt: 'Supervisão de rede: contadores de qualidade de transmissão e presença de avaria da ECU emissora.'
observations:
  en: 'Mixed frame, only for ECUs that support wake-up modes (RCD); sent on each change of the ECU''s electronic life-cycle phase'
  fr: 'Trame MIXTE, uniquement pour les calculateurs gérant les modes de réveil (RCD) ; émise à chaque changement de phase de vie électronique du calculateur'
  es: 'Trama MIXTA, solo para ECU que gestionan los modos de activación (RCD); enviada en cada cambio de fase de vida electrónica de la ECU'
  de: 'MIXTE-Frame, nur für Steuergeräte mit Aufwachmodi (RCD); gesendet bei jeder Änderung der elektronischen Lebensphase des Steuergeräts'
  it: 'Frame MISTO, solo per le centraline che gestiscono le modalità di risveglio (RCD); inviato a ogni cambio di fase di vita elettronica della centralina'
  pl: 'Ramka MIXTE, tylko dla sterowników obsługujących tryby wybudzania (RCD); wysyłana przy każdej zmianie elektronicznej fazy życia sterownika'
  ru: 'Смешанный кадр (MIXTE), только для блоков управления с режимами пробуждения (RCD); отправляется при каждой смене электронной фазы жизни блока управления'
  zh: '混合帧,仅适用于支持唤醒模式(RCD)的ECU;该ECU电子生命周期阶段每次变化时发送'
  hu: 'MIXTE keret, csak az ébresztési módokat (RCD) kezelő vezérlőegységeknél; a vezérlőegység elektronikus életciklus-fázisának minden változásakor küldve'
  pt: 'Trama mista, apenas para unidades de controlo que suportam modos de ativação (RCD); enviada em cada mudança da fase do ciclo de vida eletrónico da unidade de controlo'
periodicity: ['1000ms', 'trigger']
senders: ['CSS']

signals:
  ECU_CONFIRMED_ABSENT_STATUS:
    bits: '2.7-5.0'
    comment:
      en: '"Confirmed absent" status flags of the supervised ECUs: 0 if present, 1 if confirmed absent (0 by default for unsupervised ECUs).'
      fr: 'Indicateurs de statut "confirmé absent" des calculateurs supervisés : 0 si présent, 1 si confirmé absent (0 par défaut si non supervisé).'
      es: 'Indicadores de estado "confirmado ausente" de las unidades de control supervisadas: 0 si está presente, 1 si está confirmado ausente (0 por defecto si no se supervisa).'
      de: 'Statusflags "bestätigt fehlend" der überwachten Steuergeräte: 0 wenn vorhanden, 1 wenn bestätigt fehlend (Standard 0, wenn nicht überwacht).'
      it: 'Flag di stato "confermato assente" delle centraline supervisionate: 0 se presente, 1 se confermato assente (0 di default se non supervisionata).'
      pl: 'Flagi statusu "potwierdzona nieobecność" nadzorowanych sterowników: 0 jeśli obecny, 1 jeśli potwierdzona nieobecność (domyślnie 0, jeśli nienadzorowany).'
      ru: 'Флаги статуса "подтверждено отсутствие" контролируемых блоков управления: 0, если присутствует, 1, если подтверждено отсутствие (по умолчанию 0, если не контролируется).'
      zh: '受监控控制单元的"确认缺失"状态标志：存在为0，确认缺失为1（未监控时默认为0）。'
      hu: 'A felügyelt vezérlőegységek "megerősítve hiányzik" állapotjelzői: 0, ha jelen van, 1, ha megerősítve hiányzik (alapértelmezetten 0, ha nem felügyelt).'
      pt: 'Indicadores de estado "confirmado ausente" das unidades de controlo supervisionadas: 0 se presente, 1 se confirmado ausente (0 por defeito se não supervisionada)'
    type: 'uint'
    default: 0x00

