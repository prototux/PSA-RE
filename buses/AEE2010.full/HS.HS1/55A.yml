id: 0x55A
name: 'LVNSD_DATA_3'
type: 'can'
length: 7
comment:
  en: 'LVNSD node data: service-blink request, battery diagnostic state and switch state.'
  fr: 'Données du module LVNSD : demande de clignotement service, état de diagnostic batterie et état du contacteur.'
  es: 'Datos del módulo LVNSD: solicitud de parpadeo de servicio, estado de diagnóstico de batería y estado del interruptor.'
  de: 'Daten des LVNSD-Moduls: Service-Blinkanforderung, Batteriediagnosestatus und Schalterzustand.'
  it: 'Dati del modulo LVNSD: richiesta di lampeggio di servizio, stato di diagnosi batteria e stato dell''interruttore.'
  pl: 'Dane modułu LVNSD: żądanie migania serwisowego, stan diagnostyki akumulatora i stan przełącznika.'
  ru: 'Данные модуля LVNSD: запрос сервисного мигания, состояние диагностики батареи и состояние переключателя.'
  zh: 'LVNSD模块数据:维修闪烁请求、电池诊断状态和开关状态。'
  hu: 'Az LVNSD modul adatai: szervizvillogás kérése, akkumulátor-diagnosztikai állapot és kapcsoló állapota.'
  pt: 'Dados do nó LVNSD: pedido de pisca de serviço, estado de diagnóstico da bateria e estado do interruptor.'
observations:
  en: 'Sent when the power-supply network diagnosis finishes: 2 frames (one per LID value), 50 ms apart'
  fr: 'Émise à la finalisation du diagnostic du réseau d''alimentation : 2 trames (une par valeur de LID), espacées de 50 ms'
  es: 'Enviada al finalizar el diagnóstico de la red de alimentación: 2 tramas (una por valor de LID), separadas 50 ms'
  de: 'Gesendet nach Abschluss der Diagnose des Versorgungsnetzes: 2 Frames (einer pro LID-Wert), 50 ms auseinander'
  it: 'Inviata al termine della diagnosi della rete di alimentazione: 2 frame (uno per valore di LID), distanziati di 50 ms'
  pl: 'Wysyłane po zakończeniu diagnostyki sieci zasilania: 2 ramki (po jednej na wartość LID), w odstępie 50 ms'
  ru: 'Отправляется по завершении диагностики сети питания: 2 кадра (по одному на значение LID) с интервалом 50 мс'
  zh: '供电网络诊断完成时发送:2帧(每个LID值一帧),间隔50毫秒'
  hu: 'Küldve a tápellátó hálózat diagnosztikájának befejezésekor: 2 keret (LID-értékenként egy), 50 ms-os időközzel'
  pt: 'Enviada quando o diagnóstico da rede de alimentação termina: 2 tramas (uma por valor de LID), com 50 ms de intervalo'
periodicity: ['100ms', 'trigger']
senders: ['LVNSD']
receivers: ['CMM']

