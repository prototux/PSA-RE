    comment:
      en: 'Gearbox dynamic frame checksum (initial value depends on the frame ID)'
      fr: 'Somme de contrôle dynamique de la trame boîte de vitesses (valeur initiale dépendant de l''identifiant de trame)'
      es: 'Suma de comprobación dinámica de la trama de la caja de cambios (valor inicial según el identificador de trama)'
      de: 'Dynamische Prüfsumme des Getriebe-Frames (Startwert abhängig von der Frame-ID)'
      it: 'Checksum dinamico del frame del cambio (valore iniziale in base all''ID del frame)'
      pl: 'Dynamiczna suma kontrolna ramki skrzyni biegów (wartość początkowa zależna od identyfikatora ramki)'
      ru: 'Динамическая контрольная сумма кадра коробки передач (начальное значение зависит от идентификатора кадра)'
      zh: '变速箱动态帧校验和(初始值取决于帧ID)'
      hu: 'A sebességváltó dinamikus keretének ellenőrző összege (a kezdőérték a keretazonosítótól függ)'
      pt: 'Soma de verificação dinâmica da trama da caixa de velocidades (valor inicial dependente do identificador da trama)'
