id: 0x329
name: 'STOP_START_GEARBOX_DATA'
type: 'can'
length: 5
comment:
  en: 'Stop & Start data sent by the BSI to the gearbox: restart and stop authorisations, gearbox state, predicted resistive torque and restart request.'
  fr: 'Données Stop & Start envoyées par la BSI à la boîte de vitesses : autorisations de redémarrage et d''arrêt, état boîte, couple résistant prédit et demande de redémarrage.'
  es: 'Datos de Stop & Start enviados por la BSI a la caja de cambios: autorizaciones de reinicio y de parada, estado de la caja, par resistente previsto y solicitud de reinicio.'
  de: 'Von der BSI an das Getriebe gesendete Stop&Start-Daten: Neustart- und Stoppfreigaben, Getriebezustand, vorhergesagtes Widerstandsmoment und Neustartanforderung.'
  it: 'Dati Stop & Start inviati dalla BSI al cambio: autorizzazioni di riavvio e arresto, stato cambio, coppia resistente prevista e richiesta di riavvio.'
  pl: 'Dane funkcji Stop & Start wysyłane przez BSI do skrzyni biegów: zezwolenia na ponowny rozruch i zatrzymanie, stan skrzyni biegów, przewidywany moment oporowy i żądanie ponownego rozruchu.'
  ru: 'Данные Start-Stop, отправляемые BSI в коробку передач: разрешения перезапуска и остановки, состояние коробки передач, прогнозируемый момент сопротивления и запрос перезапуска.'
  zh: '由BSI发送给变速箱的启停数据：重启和停止授权、变速箱状态、预测阻力矩和重启请求。'
  hu: 'A BSI által a váltónak küldött start&stop adatok: újraindítási és leállási engedélyek, váltóállapot, előre jelzett ellenállási nyomaték és újraindítási kérés.'
  pt: 'Dados de Stop & Start enviados pela BSI à caixa de velocidades: autorizações de reinício e paragem, estado da caixa de velocidades, binário resistivo previsto e pedido de reinício.'
periodicity: ['20ms']
senders: ['BSI']
receivers: ['HCU2', 'CMM']

signals:
  CHECKSUM:
