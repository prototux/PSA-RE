id: 0x7F9
name: 'ON_CAN_DIAG_RESPONSE_34'
type: 'can'
length: 8
comment:
  en: 'Diagnostic response relayed onto the CAN bus by a gateway module.'
  fr: 'Réponse de diagnostic relayée sur le réseau CAN par un calculateur passerelle.'
  es: 'Respuesta de diagnóstico retransmitida al bus CAN por un módulo pasarela.'
  de: 'Diagnoseantwort, von einem Gateway-Steuergerät auf den CAN-Bus weitergeleitet.'
  it: 'Risposta di diagnosi inoltrata sul bus CAN da una centralina gateway.'
  pl: 'Odpowiedź diagnostyczna przekazywana na magistrale CAN przez moduł bramy.'
  ru: 'Диагностический ответ, ретранслируемый на шину CAN шлюзовым блоком.'
  zh: '由网关模块转发到CAN总线的诊断响应。'
  hu: 'Egy átjáró vezérlőegység által a CAN buszra továbbított diagnosztikai válasz.'
  pt: 'Resposta de diagnóstico retransmitida na rede CAN por um módulo gateway.'
observations:
  en: 'Event-triggered, sent from the ECU to the diagnostic tool via BSI.'
  fr: 'Événementiel, envoyé de le calculateur vers l''outil de diagnostic via la BSI.'
  es: 'Basado en eventos, enviado desde la ECU hasta la herramienta de diagnóstico a través de la BSI.'
  de: 'Ereignisgesteuert, gesendet von das Steuergerät zu das Diagnosegerät über die BSI.'
  it: 'Basato su eventi, inviato da la centralina a lo strumento diagnostico tramite la BSI.'
  pl: 'Zdarzeniowe, wysyłane z sterownik do narzędzie diagnostyczne przez BSI.'
  ru: 'Событийное, передаётся от блок управления к диагностический прибор через BSI.'
  zh: '事件触发,从该ECU发送到诊断工具通过BSI。'
  hu: 'Eseményvezérelt, a vezérlőegység-tól a diagnosztikai eszköz felé küldve a BSI-n keresztül.'
  pt: 'Baseado em eventos, enviado da unidade de controlo para a ferramenta de diagnóstico via BSI.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['DIAG_TOOL']

signals:
  DIAGNOSTIC_DATA:
    bits: '1.7-8.0'
    comment:
      en: 'Diagnostic data'
      fr: 'Données de diagnostic'
      es: 'Datos de diagnóstico'
      de: 'Diagnosedaten'
      it: 'Dati diagnostici'
      pl: 'Dane diagnostyczne'
      ru: 'Диагностические данные'
      zh: '诊断数据'
      hu: 'Diagnosztikai adatok'
      pt: 'Dados de diagnóstico'
    type: 'uint'
