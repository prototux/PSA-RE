id: 0x4D2
name: 'VIN_WMI_DATA'
type: 'can'
length: 3
comment:
  en: 'World Manufacturer Identifier (WMI) section of the VIN, sent by the BSI.'
  fr: 'Section identifiant mondial du constructeur (WMI) du VIN, envoyée par la BSI.'
  es: 'Sección del identificador mundial del fabricante (WMI) del VIN, enviada por la BSI.'
  de: 'Weltweiter Herstellerkennungsabschnitt (WMI) der Fahrgestellnummer, gesendet von der BSI.'
  it: 'Sezione identificativo mondiale del costruttore (WMI) del VIN, inviata dalla BSI.'
  pl: 'Sekcja światowego identyfikatora producenta (WMI) numeru VIN, wysyłana przez BSI.'
  ru: 'Раздел всемирного идентификатора изготовителя (WMI) VIN-номера, отправляемый BSI.'
  zh: '车辆识别码(VIN)中的世界制造商识别码部分(WMI)，由BSI发送。'
  hu: 'A VIN világméretű gyártóazonosító szakasza (WMI), a BSI küldi.'
  pt: 'Secção do identificador mundial do fabricante (WMI) do VIN, enviada pela BSI.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['CMM']

signals:
  WMI_CHAR_1:
    bits: '1.7-1.0'
    comment:
      en: 'First WMI character.'
      fr: 'Premier caractère du WMI.'
      es: 'Primer carácter del WMI.'
      de: 'Erstes Zeichen der WMI.'
      it: 'Primo carattere del WMI.'
      pl: 'Pierwszy znak WMI.'
      ru: 'Первый символ WMI.'
      zh: 'WMI的第一个字符。'
      hu: 'A WMI első karaktere.'
      pt: 'Primeiro carácter do WMI.'
    type: 'str'
    default: 0x3F

  WMI_CHAR_2:
    bits: '2.7-2.0'
    comment:
      en: 'Second WMI character.'
      fr: 'Deuxième caractère du WMI.'
      es: 'Segundo carácter del WMI.'
      de: 'Zweites Zeichen der WMI.'
      it: 'Secondo carattere del WMI.'
      pl: 'Drugi znak WMI.'
      ru: 'Второй символ WMI.'
      zh: 'WMI的第二个字符。'
      hu: 'A WMI második karaktere.'
      pt: 'Segundo carácter do WMI.'
    type: 'str'
    default: 0x3F

  WMI_CHAR_3:
    bits: '3.7-3.0'
    comment:
      en: 'Third WMI character.'
      fr: 'Troisième caractère du WMI.'
      es: 'Tercer carácter del WMI.'
      de: 'Drittes Zeichen der WMI.'
      it: 'Terzo carattere del WMI.'
      pl: 'Trzeci znak WMI.'
      ru: 'Третий символ WMI.'
      zh: 'WMI的第三个字符。'
      hu: 'A WMI harmadik karaktere.'
      pt: 'Terceiro carácter do WMI.'
    type: 'str'
    default: 0x3F
