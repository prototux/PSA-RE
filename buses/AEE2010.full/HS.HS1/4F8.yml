        en: 'Opening requested'
        fr: 'Demande d''ouverture'
        es: 'Solicitud de apertura'
        de: 'Öffnungsanforderung'
        it: 'Richiesta di apertura'
        pl: 'Żądanie otwarcia'
        ru: 'Запрос открытия'
        zh: '开启请求'
        hu: 'Nyitási kérés'
        pt: 'Pedido de abertura'

