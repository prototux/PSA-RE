      ru: 'Запрос открытия/закрытия модуля низковольтной батареи'
      zh: '低压蓄电池模块开/关请求'
      hu: 'Az alacsony feszültségű akkumulátor-modul nyitási/zárási kérése'
      pt: 'Pedido de abertura/fecho do módulo da bateria de baixa tensão'
    type: 'bool'
    default: 0x00
