id: 0x4F8
name: 'ENGINE_ECU_DATA_8'
type: 'can'
length: 8
comment:
  en: 'Engine ECU data: power-reduction-off request, atmospheric pressure, main wake-up and SCR purge wake-up.'
  fr: 'Données du calculateur moteur : demande de suppression de réduction de puissance, pression atmosphérique, réveil principal et réveil de purge SCR.'
  es: 'Datos de la centralita del motor: solicitud de supresión de reducción de potencia, presión atmosférica, activación principal y activación de purga SCR.'
  de: 'Motorsteuergerätdaten: Anforderung zur Aufhebung der Leistungsreduzierung, Luftdruck, Hauptweckung und SCR-Spülweckung.'
  it: 'Dati della centralina motore: richiesta di rimozione riduzione potenza, pressione atmosferica, risveglio principale e risveglio di spurgo SCR.'
  pl: 'Dane sterownika silnika: żądanie zniesienia redukcji mocy, ciśnienie atmosferyczne, główne wybudzenie i wybudzenie przedmuchu SCR.'
  ru: 'Данные ЭБУ двигателя: запрос отмены снижения мощности, атмосферное давление, главное пробуждение и пробуждение продувки SCR.'
  zh: '发动机ECU数据:解除功率降低请求、大气压力、主唤醒和SCR吹扫唤醒。'
  hu: 'Motorvezérlő adatok: teljesítménycsökkentés megszüntetésének kérése, légköri nyomás, fő ébresztés és SCR öblítési ébresztés.'
  pt: 'Dados da unidade de controlo do motor: pedido de desativação da redução de potência, pressão atmosférica, ativação principal e ativação de purga SCR.'
observations:
  en: 'On state change of: LV_BATTERY_MODE_REQUEST, LV_BATTERY_DIAG_REQUEST, ENGINE_RUN_NEED_IGNORING_GBX, ENGINE_START_WITH_SSC, STEERING_LOAD_SHED_REQUEST, EBD_LOAD_SHED_REQUEST'
  fr: 'Sur changement d''état de : LV_BATTERY_MODE_REQUEST, LV_BATTERY_DIAG_REQUEST, ENGINE_RUN_NEED_IGNORING_GBX, ENGINE_START_WITH_SSC, STEERING_LOAD_SHED_REQUEST, EBD_LOAD_SHED_REQUEST'
  es: 'Al cambiar el estado de: LV_BATTERY_MODE_REQUEST, LV_BATTERY_DIAG_REQUEST, ENGINE_RUN_NEED_IGNORING_GBX, ENGINE_START_WITH_SSC, STEERING_LOAD_SHED_REQUEST, EBD_LOAD_SHED_REQUEST'
  de: 'Bei Statusänderung von: LV_BATTERY_MODE_REQUEST, LV_BATTERY_DIAG_REQUEST, ENGINE_RUN_NEED_IGNORING_GBX, ENGINE_START_WITH_SSC, STEERING_LOAD_SHED_REQUEST, EBD_LOAD_SHED_REQUEST'
  it: 'Al cambiamento di stato di: LV_BATTERY_MODE_REQUEST, LV_BATTERY_DIAG_REQUEST, ENGINE_RUN_NEED_IGNORING_GBX, ENGINE_START_WITH_SSC, STEERING_LOAD_SHED_REQUEST, EBD_LOAD_SHED_REQUEST'
  pl: 'Wysyłane przy zmianie stanu: LV_BATTERY_MODE_REQUEST, LV_BATTERY_DIAG_REQUEST, ENGINE_RUN_NEED_IGNORING_GBX, ENGINE_START_WITH_SSC, STEERING_LOAD_SHED_REQUEST, EBD_LOAD_SHED_REQUEST'
  ru: 'При изменении состояния: LV_BATTERY_MODE_REQUEST, LV_BATTERY_DIAG_REQUEST, ENGINE_RUN_NEED_IGNORING_GBX, ENGINE_START_WITH_SSC, STEERING_LOAD_SHED_REQUEST, EBD_LOAD_SHED_REQUEST'
  zh: '当MODE_LVNSD_REQ, LV_BATTERY_DIAG_REQUEST, ENGINE_RUN_NEED_IGNORING_GBX, ENGINE_START_WITH_SSC, STEERING_LOAD_SHED_REQUEST, EBD_POWER_CUT_REQ状态变化时'
  hu: 'A(z) LV_BATTERY_MODE_REQUEST, LV_BATTERY_DIAG_REQUEST, ENGINE_RUN_NEED_IGNORING_GBX, ENGINE_START_WITH_SSC, STEERING_LOAD_SHED_REQUEST, EBD_LOAD_SHED_REQUEST állapotváltozásakor'
  pt: 'Na mudança de estado de: LV_BATTERY_MODE_REQUEST, LV_BATTERY_DIAG_REQUEST, ENGINE_RUN_NEED_IGNORING_GBX, ENGINE_START_WITH_SSC, STEERING_LOAD_SHED_REQUEST, EBD_LOAD_SHED_REQUEST'
periodicity: ['100ms', 'trigger']
senders: ['CMM']
receivers: ['LVNSD', 'BVA', 'BSI', 'DAE', 'ABS', 'VCU']

signals:
