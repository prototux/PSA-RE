id: 0x229
name: 'GEARBOX_DYNAMIC_DATA_V2'
type: 'can'
length: 4
comment:
  en: 'Gearbox dynamic data, version 2: gearbox input speed, validated lever position, engaged gear and final target ratio.'
  fr: 'Données dynamiques boîte, version 2 : régime d''entrée boîte, position levier validée, rapport engagé et rapport cible final.'
  es: 'Datos dinámicos de la caja de cambios, versión 2: régimen de entrada de caja, posición de palanca validada, marcha engranada y marcha objetivo final.'
  de: 'Getriebe-Dynamikdaten, Version 2: Getriebeeingangsdrehzahl, validierte Hebelposition, eingelegter Gang und finale Zielübersetzung.'
  it: 'Dati dinamici del cambio, versione 2: regime di ingresso cambio, posizione leva validata, marcia innestata e marcia obiettivo finale.'
  pl: 'Dane dynamiczne skrzyni biegów, wersja 2: obroty wejściowe skrzyni, zwalidowana pozycja dźwigni, włączony bieg i finalny bieg docelowy.'
  ru: 'Динамические данные коробки передач, версия 2: входная скорость коробки, подтверждённое положение рычага, включённая передача и итоговая целевая передача.'
  zh: '变速箱动态数据,版本2:变速箱输入转速、已验证的换挡杆位置、已啮合挡位和最终目标挡位。'
  hu: 'Váltó dinamikus adatok, 2. verzió: váltó bemeneti fordulatszám, érvényesített váltókar pozíció, bekapcsolt fokozat és végső célfokozat.'
  pt: 'Dados dinâmicos da caixa de velocidades, versão 2: velocidade de entrada da caixa, posição validada da alavanca, relação engrenada e relação-alvo final.'
periodicity: ['10ms']
senders: ['BVA', 'E_VCU']
receivers: ['CMM', 'VCU', 'ABS']

