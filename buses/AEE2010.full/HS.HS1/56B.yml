id: 0x56B
name: 'FRONT_CAMERA_COMMAND_2'
type: 'can'
length: 4
comment:
  en: 'Commands sent by the BSI to the front camera module: lane detection authorisation, auto/manual washer and wiper commands, units/language and occultation state.'
  fr: 'Commandes envoyées par la BSI au module caméra avant : autorisation de détection de voie, commandes de lavage/essuyage auto/manuel, unités/langue et état d''occultation.'
  es: 'Órdenes enviadas por la BSI al módulo de cámara delantera: autorización de detección de carril, órdenes de lavado/limpiaparabrisas automático/manual, unidades/idioma y estado de ocultación.'
  de: 'Von der BSI an das Frontkameramodul gesendete Befehle: Spurerkennungsfreigabe, automatische/manuelle Wasch-/Wischbefehle, Einheiten/Sprache und Verdunkelungszustand.'
  it: 'Comandi inviati dalla BSI al modulo telecamera anteriore: autorizzazione di rilevamento corsia, comandi di lavaggio/tergicristallo automatico/manuale, unità/lingua e stato di oscuramento.'
  pl: 'Polecenia wysyłane przez BSI do przedniego modułu kamery: zezwolenie na wykrywanie pasa, polecenia automatycznego/ręcznego spryskiwacza i wycieraczek, jednostki/język i stan zaciemnienia.'
  ru: 'Команды, отправляемые BSI в передний модуль камеры: разрешение обнаружения полосы, автоматические/ручные команды омывателя и стеклоочистителя, единицы измерения/язык и состояние затемнения.'
  zh: '由BSI发送给前置摄像头模块的指令：车道检测授权、自动/手动洗涤及雨刷命令、单位/语言及遮蔽状态。'
  hu: 'A BSI parancsai az első kameramodul felé: sávérzékelés engedélyezése, automatikus/kézi mosó- és törlőparancsok, mértékegység/nyelv és elsötétítési állapot.'
  pt: 'Comandos enviados pela BSI ao módulo da câmara dianteira: autorização de deteção de faixa, comandos automáticos/manuais de lava e limpa-para-brisas, unidades/idioma e estado de ocultação.'
observations:
  en: 'On state change of: AUTO_WIPE_MODE, RAIN_SENSOR_WIPER_STATE, DISTANCE_UNIT'
  fr: 'Sur changement d''état de : AUTO_WIPE_MODE, RAIN_SENSOR_WIPER_STATE, DISTANCE_UNIT'
  es: 'Al cambiar el estado de: AUTO_WIPE_MODE, RAIN_SENSOR_WIPER_STATE, DISTANCE_UNIT'
  de: 'Bei Statusänderung von: AUTO_WIPE_MODE, RAIN_SENSOR_WIPER_STATE, DISTANCE_UNIT'
  it: 'Al cambiamento di stato di: AUTO_WIPE_MODE, RAIN_SENSOR_WIPER_STATE, DISTANCE_UNIT'
  pl: 'Wysyłane przy zmianie stanu: AUTO_WIPE_MODE, RAIN_SENSOR_WIPER_STATE, DISTANCE_UNIT'
  ru: 'При изменении состояния: AUTO_WIPE_MODE, RAIN_SENSOR_WIPER_STATE, DISTANCE_UNIT'
  zh: '当ETAT_AFIL, AUTO_WIPE_MODE, RAIN_SENSOR_WIPER_STATE, UNITE_DISTANCE状态变化时'
  hu: 'A(z), AUTO_WIPE_MODE, RAIN_SENSOR_WIPER_STATE, DISTANCE_UNIT állapotváltozásakor'
  pt: 'Na mudança de estado de: AUTO_WIPE_MODE, RAIN_SENSOR_WIPER_STATE, DISTANCE_UNIT'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['CVM']

