id: 0x58E
name: 'RITCS_VENT_TEMPERATURE'
type: 'can'
length: 8
comment:
  en: 'RITCS blown-air temperature: front and rear, left and right vents.'
  fr: 'Température de l''air soufflé RITCS : avant et arrière, gauche et droite.'
  es: 'Temperatura del aire soplado RITCS: delantero y trasero, izquierdo y derecho.'
  de: 'RITCS-Zulufttemperatur: vorne und hinten, links und rechts.'
  it: 'Temperatura dell''aria soffiata RITCS: anteriore e posteriore, sinistra e destra.'
  pl: 'Temperatura nawiewu RITCS: przód i tył, lewa i prawa strona.'
  ru: 'Температура обдуваемого воздуха RITCS: перед и зад, слева и справа.'
  zh: 'RITCS送风温度:前后、左右。'
  hu: 'RITCS fúvott levegő hőmérséklete: elöl és hátul, bal és jobb oldalon.'
  pt: 'Temperatura do ar soprado do RITCS: saídas dianteiras e traseiras, esquerda e direita.'
periodicity: ['1000ms']
senders: ['BSI']

signals:
  REAR_RIGHT_BLOWN_AIR_TEMPERATURE:
    bits: '1.7-2.0'
    comment:
      en: 'Rear right blown air temperature'
      fr: 'Température de l''air soufflé arrière droit'
      es: 'Temperatura del aire impulsado trasero derecho'
      de: 'Temperatur der ausgeblasenen Luft hinten rechts'
      it: 'Temperatura dell''aria soffiata posteriore destra'
      pl: 'Temperatura nawiewanego powietrza z tyłu po prawej'
      ru: 'Температура обдуваемого воздуха сзади справа'
      zh: '右后出风口空气温度'
      hu: 'A hátsó jobb oldali befúvott levegő hőmérséklete'
      pt: 'Temperatura do ar insuflado traseiro direito'
    type: 'uint'
    factor: 0.1
    offset: -40
    min: -40
    max: 85
    units: '°C'
    invalid: 0xFFFF
    default: 0xFFFF

  REAR_LEFT_BLOWN_AIR_TEMPERATURE:
    bits: '3.7-4.0'
    comment:
