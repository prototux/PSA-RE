id: 0x350
name: 'CSS_SUSPENSION_STATUS'
type: 'can'
length: 4
comment:
  en: 'Sport mode state and suspension warning-lamp request from the CSS node.'
  fr: 'État du mode sport et demande de voyant suspension du module CSS.'
  es: 'Estado del modo deportivo y solicitud de testigo de suspensión del módulo CSS.'
  de: 'Sportmodus-Zustand und Anforderung der Fahrwerks-Kontrollleuchte vom CSS-Modul.'
  it: 'Stato della modalità sport e richiesta spia sospensioni dal modulo CSS.'
  pl: 'Stan trybu sportowego i żądanie kontrolki zawieszenia z modułu CSS.'
  ru: 'Состояние спортивного режима и запрос индикатора подвески от модуля CSS.'
  zh: '来自CSS模块的运动模式状态和悬挂警示灯请求。'
  hu: 'A CSS modul sport üzemmód állapota és felfüggesztés jelzőlámpa-kérése.'
  pt: 'Estado do modo desportivo e pedido da luz avisadora da suspensão do nó CSS.'
periodicity: ['40ms']
senders: ['CSS']
receivers: ['BSI', 'BCP']

signals:
  VEHICLE_ATTITUDE:
    bits: '1.7-2.6'
    comment:
      en: 'Vehicle attitude (pitch angle) (°)'
      fr: 'Assiette du véhicule (°)'
      es: 'Actitud del vehículo (°)'
      de: 'Fahrzeugneigung (Nickwinkel) (°)'
      it: 'Assetto del veicolo (°)'
      pl: 'Pochylenie pojazdu (°)'
      ru: 'Продольный крен (дифферент) автомобиля (°)'
      zh: '车辆姿态角(俯仰角)(°)'
      hu: 'A jármű dőlésszöge (°)'
      pt: 'Atitude do veículo (ângulo de inclinação) (°)'
    type: 'sint'
    factor: 0.006
    min: -3
    max: 3
    units: '°'
    invalid: 0x1FF
    default: 0x00

  VARIABLE_DAMPER_MODE:
