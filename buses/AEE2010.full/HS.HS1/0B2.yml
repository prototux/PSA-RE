id: 0x0B2
name: 'IMMOBILIZER_KEY_BSI_GEARBOX'
type: 'can'
length: 5
comment:
  en: 'Immobiliser key response sent by the body computer (BSI) to the gearbox ECU, part of the challenge/response authentication exchange.'
  fr: 'Réponse de clé d''antidémarrage envoyée par le BSI au calculateur de boîte de vitesses, dans le cadre de l''échange d''authentification défi/réponse.'
  es: 'Respuesta de clave del inmovilizador enviada por la BSI a la ECU de la caja de cambios, parte del intercambio de autenticación de desafío/respuesta.'
  de: 'Wegfahrsperren-Schlüsselantwort vom BSI an das Getriebesteuergerät, Teil des Challenge-Response-Authentifizierungsaustauschs.'
  it: 'Risposta chiave dell''immobilizer inviata dal BSI alla centralina del cambio, parte dello scambio di autenticazione challenge/response.'
  pl: 'Odpowiedź kluczowa immobilisera wysyłana przez BSI do sterownika skrzyni biegów, część wymiany uwierzytelniania challenge/response.'
  ru: 'Ответ ключа иммобилайзера, отправляемый BSI блоку управления коробкой передач, часть обмена аутентификацией challenge/response.'
  zh: '车身控制器(BSI)发送给变速箱控制单元的防盗锁止密钥响应,属于挑战/响应认证交换的一部分。'
  hu: 'A BSI által a váltó vezérlőegységnek küldött indításgátló-kulcsválasz, a challenge/response hitelesítési csere része.'
  pt: 'Resposta de chave do imobilizador enviada pela BSI à ECU da caixa de velocidades, parte da troca de autenticação desafio/resposta.'
observations:
  en: 'Reception of an unlock request from BV'
  fr: 'Réception d''une demande de déverrouillage du BV'
  es: 'Recepción de una solicitud de desbloqueo del BV'
  de: 'Empfang einer Entriegelungsanforderung von BV'
  it: 'Ricezione di una richiesta di sblocco da BV'
  pl: 'Odebranie żądania odblokowania od BV'
  ru: 'Получение запроса на разблокировку от BV'
  zh: '接收到来自BV的解锁请求'
  hu: 'Zárnyitási kérés fogadása a(z) BV részéről'
  pt: 'Receção de um pedido de destrancagem da BV'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['BVA']

