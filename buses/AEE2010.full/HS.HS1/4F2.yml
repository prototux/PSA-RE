id: 0x4F2
name: 'HYBRID_BATTERY_DATA'
type: 'can'
length: 8
comment:
  en: 'Hybrid battery data sent by the BSI: estimated internal resistance and voltage, charge state, and heater/climate power demands.'
  fr: 'Données de batterie hybride envoyées par la BSI : résistance interne et tension estimées, état de charge, et demandes de puissance chauffage/climatisation.'
  es: 'Datos de la batería híbrida enviados por la BSI: resistencia interna y tensión estimadas, estado de carga, y demandas de potencia de calefacción/climatización.'
  de: 'Von der BSI gesendete Hybridbatteriedaten: geschätzter Innenwiderstand und geschätzte Spannung, Ladezustand und Heizungs-/Klimaleistungsanforderungen.'
  it: 'Dati della batteria ibrida inviati dalla BSI: resistenza interna e tensione stimate, stato di carica e richieste di potenza riscaldamento/climatizzazione.'
  pl: 'Dane akumulatora hybrydowego wysyłane przez BSI: szacowana rezystancja wewnętrzna i napięcie, stan naładowania oraz zapotrzebowanie na moc ogrzewania/klimatyzacji.'
  ru: 'Данные гибридной батареи, отправляемые BSI: расчётное внутреннее сопротивление и напряжение, состояние заряда и запросы мощности отопления/кондиционирования.'
  zh: '由BSI发送的混合动力电池数据：估算的内阻和电压、荷电状态以及暖风/空调功率需求。'
  hu: 'A BSI által küldött hibrid akkumulátor adatok: becsült belső ellenállás és feszültség, töltöttségi állapot, valamint fűtési/klíma teljesítményigény.'
  pt: 'Dados da bateria híbrida enviados pela BSI: resistência interna e tensão estimadas, estado de carga e pedidos de potência de aquecimento/climatização.'
periodicity: ['100ms']
senders: ['BSI']
receivers: ['CMM']

signals:
  BATTERY_SOC_HIGH_RESOLUTION:
    bits: '1.7-2.6'
    comment:
      en: 'Battery state of charge, high-resolution value'
      fr: 'État de charge de la batterie, valeur à résolution élevée'
      es: 'Estado de carga de la batería, valor de alta resolución'
      de: 'Batterieladezustand, hochauflösender Wert'
      it: 'Stato di carica della batteria, valore ad alta risoluzione'
      pl: 'Stan naładowania akumulatora, wartość o wysokiej rozdzielczości'
      ru: 'Уровень заряда батареи, значение высокого разрешения'
      zh: '电池荷电状态,高分辨率数值'
      hu: 'Az akkumulátor töltöttségi állapota, nagy felbontású érték'
      pt: 'Estado de carga da bateria, valor de alta resolução'
