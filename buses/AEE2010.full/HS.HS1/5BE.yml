      zh: '到第3个检测到的交通标志的纵向距离(m)'
      hu: 'A 3. számú észlelt közúti jelzőtábla hosszirányú távolsága (m)'
      pt: 'Distância longitudinal ao 3.º sinal de trânsito detetado (m)'
    type: 'uint'
    factor: 0.5
    min: 0
    max: 122
    units: 'm'
    default: 0x00

