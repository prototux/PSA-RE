id: 0x5BE
name: 'TRAFFIC_SIGN_RECOGNITION_DATA_2'
type: 'can'
length: 7
comment:
  en: 'Traffic-sign recognition data from the camera: identifiers and screen position of up to two detected signs, plus supplementary panels.'
  fr: 'Données de reconnaissance des panneaux de signalisation de la caméra : identifiants et position à l''écran de deux panneaux détectés, plus panonceaux complémentaires.'
  es: 'Datos de reconocimiento de señales de tráfico de la cámara: identificadores y posición en pantalla de hasta dos señales detectadas, más paneles complementarios.'
  de: 'Verkehrszeichenerkennungsdaten der Kamera: Kennungen und Bildschirmposition von bis zu zwei erkannten Schildern, plus Zusatzschildern.'
  it: 'Dati di riconoscimento segnali stradali della telecamera: identificatori e posizione sullo schermo di fino a due segnali rilevati, più pannelli integrativi.'
  pl: 'Dane rozpoznawania znaków drogowych z kamery: identyfikatory i pozycja na ekranie do dwóch wykrytych znaków, plus tabliczki dodatkowe.'
  ru: 'Данные распознавания дорожных знаков от камеры: идентификаторы и положение на экране до двух обнаруженных знаков, а также дополнительные таблички.'
  zh: '摄像头交通标志识别数据:最多两个检测到的标志的标识符和屏幕位置,以及补充标牌。'
  hu: 'A kamera közlekedési tábla felismerési adatai: legfeljebb két észlelt tábla azonosítója és képernyőpozíciója, valamint kiegészítő táblák.'
  pt: 'Dados de reconhecimento de sinais de trânsito da câmara: identificadores e posição no ecrã de até dois sinais detetados, além de painéis adicionais.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['trigger']
senders: ['CVM']
receivers: ['BSI']

signals:
  TRAFFIC_SIGN_ID_3:
    bits: '1.7-1.0'
    comment:
      en: 'Identifier of detected traffic sign 3'
      fr: 'Identifiant du panneau de signalisation détecté 3'
      es: 'Identificador de la señal de tráfico detectada 3'
      de: 'Kennung des erkannten Verkehrsschilds 3'
      it: 'Identificativo del cartello stradale rilevato 3'
      pl: 'Identyfikator wykrytego znaku drogowego 3'
      ru: 'Идентификатор обнаруженного дорожного знака 3'
      zh: '检测到的交通标志3的标识符'
      hu: 'A 3. érzékelt közlekedési tábla azonosítója'
      pt: 'Identificador do sinal de trânsito detetado 3'
    type: 'uint'
    min: 1
    max: 254
    invalid: 0xFF
    default: 0x00

  TRAFFIC_SIGN_X_POSITION_3:
    bits: '2.7-2.0'
    comment:
      en: 'Longitudinal distance to the 3rd detected traffic sign (m)'
      fr: 'Distance longitudinale du 3e panneau de signalisation détecté (m)'
