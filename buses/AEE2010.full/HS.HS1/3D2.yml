      it: 'Risultato del test diagnostico OBD 1 (BSI)'
      pl: 'Wynik testu diagnostycznego OBD 1 (BSI)'
      ru: 'Результат диагностического теста OBD 1 (BSI)'
      zh: 'OBD诊断测试1的结果(BSI)'
      hu: 'A(z) 1. OBD diagnosztikai teszt eredménye (BSI)'
      pt: 'Resultado do teste de diagnóstico OBD 1 (BSI)'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'Diagnostic not concluded'
        fr: 'Diagnostic non statué'
        es: 'Diagnóstico no concluido'
        de: 'Diagnose nicht abgeschlossen'
        it: 'Diagnosi non conclusa'
        pl: 'Diagnostyka niezakończona'
