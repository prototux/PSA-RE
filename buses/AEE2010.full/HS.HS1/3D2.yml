id: 0x3D2
name: 'BSI_OBD_FAULT_STATUS'
type: 'can'
length: 6
comment:
  en: 'OBD fault status and in-use performance ratio counters for the BSI.'
  fr: 'État des défauts OBD et compteurs de ratio d''utilisation (IUPR) de la BSI.'
  es: 'Estado de fallos OBD y contadores de ratio de uso (IUPR) de la BSI.'
  de: 'OBD-Fehlerstatus und Nutzungshäufigkeits-Zähler (IUPR) der BSI.'
  it: 'Stato dei guasti OBD e contatori del rapporto di utilizzo (IUPR) della BSI.'
  pl: 'Stan usterek OBD i liczniki współczynnika wykorzystania (IUPR) BSI.'
  ru: 'Состояние неисправностей OBD и счётчики коэффициента использования (IUPR) BSI.'
  zh: 'BSI的OBD故障状态及使用率计数器(IUPR)。'
  hu: 'A BSI OBD hibaállapota és a használati arány (IUPR) számlálói.'
  pt: 'Estado de avarias OBD e contadores da taxa de desempenho em utilização da BSI.'
periodicity: ['100ms']
senders: ['BSI']
receivers: ['CMM']

signals:
  BSI_OBD_FAULT_STATUS_1:
    bits: '1.7-1.6'
    comment:
