id: 0x532
name: 'HYBRID_BATTERY_DATA_2'
type: 'can'
length: 3
comment:
  en: 'Hybrid battery data sent by the BSI: processed maximum current, normalized internal resistance and minimum voltage.'
  fr: 'Données de batterie hybride envoyées par la BSI : courant maximal traité, résistance interne normalisée et tension minimale.'
  es: 'Datos de la batería híbrida enviados por la BSI: corriente máxima procesada, resistencia interna normalizada y tensión mínima.'
  de: 'Von der BSI gesendete Hybridbatteriedaten: verarbeiteter Maximalstrom, normierter Innenwiderstand und Mindestspannung.'
  it: 'Dati della batteria ibrida inviati dalla BSI: corrente massima elaborata, resistenza interna normalizzata e tensione minima.'
  pl: 'Dane akumulatora hybrydowego wysyłane przez BSI: przetworzony prąd maksymalny, znormalizowana rezystancja wewnętrzna i napięcie minimalne.'
  ru: 'Данные гибридной батареи, отправляемые BSI: обработанный максимальный ток, нормализованное внутреннее сопротивление и минимальное напряжение.'
  zh: '由BSI发送的混合动力电池数据：处理后的最大电流、归一化内阻和最小电压。'
  hu: 'A BSI által küldött hibrid akkumulátor adatok: feldolgozott maximális áram, normalizált belső ellenállás és minimális feszültség.'
  pt: 'Dados da bateria híbrida enviados pela BSI: corrente máxima processada, resistência interna normalizada e tensão mínima.'
periodicity: ['100ms']
senders: ['BSI']
receivers: ['CMM']

signals:
  BATTERY_MIN_VOLTAGE:
    bits: '1.7-2.6'
    comment:
      en: 'Minimum battery voltage'
      fr: 'Tension minimale de la batterie'
      es: 'Tensión mínima de la batería'
      de: 'Mindestspannung der Batterie'
      it: 'Tensione minima della batteria'
      pl: 'Minimalne napięcie akumulatora'
      ru: 'Минимальное напряжение батареи'
      zh: '电池最低电压'
      hu: 'Az akkumulátor minimális feszültsége'
      pt: 'Tensão mínima da bateria'
    type: 'uint'
    factor: 0.01
    offset: 3
    min: 3
    max: 13
    units: 'V'
    invalid: 0x3FF
    default: 0x3F9
    alternatives:
      - note:
          en: 'Also observed with another scaling (factor 0.013)'
          fr: 'Aussi observé avec une autre mise à l''échelle (factor 0.013)'
          es: 'También observado con otro escalado (factor 0.013)'
          de: 'Auch mit anderer Skalierung beobachtet (factor 0.013)'
          it: 'Osservato anche con un''altra scala (factor 0.013)'
          pl: 'Obserwowany także z innym skalowaniem (factor 0.013)'
          ru: 'Также наблюдался с другим масштабом (factor 0.013)'
          zh: '也观察到使用另一种缩放（factor 0.013）'
          hu: 'Megfigyelve más skálázással is (factor 0.013)'
          pt: 'Também observado com outra escala (factor 0.013)'
        factor: 0.013

  BATTERY_MAX_DISCHARGE_CURRENT:
    bits: '2.5-2.0'
    comment:
      en: 'Maximum battery discharge current'
      fr: 'Courant maximal de décharge de la batterie'
      es: 'Corriente máxima de descarga de la batería'
      de: 'Maximaler Entladestrom der Batterie'
      it: 'Corrente massima di scarica della batteria'
      pl: 'Maksymalny prąd rozładowania akumulatora'
      ru: 'Максимальный ток разряда батареи'
      zh: '电池最大放电电流'
      hu: 'Az akkumulátor maximális kisütési árama'
      pt: 'Corrente máxima de descarga da bateria'
    type: 'uint'
    factor: 20
    offset: -1500
    min: -1500
    max: -300
    units: 'A'
    invalid: 0x3F
    default: 0x3E

  BATTERY_NORMALIZED_INTERNAL_RESISTANCE:
    bits: '3.7-3.1'
    comment:
      en: 'Normalized battery internal resistance'
      fr: 'Résistance interne normalisée de la batterie'
      es: 'Resistencia interna normalizada de la batería'
      de: 'Normierter Innenwiderstand der Batterie'
      it: 'Resistenza interna normalizzata della batteria'
      pl: 'Znormalizowana rezystancja wewnętrzna akumulatora'
      ru: 'Нормированное внутреннее сопротивление батареи'
      zh: '标准化的电池内阻'
      hu: 'Az akkumulátor normalizált belső ellenállása'
      pt: 'Resistência interna normalizada da bateria'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 10
    units: 'mOhm'
    invalid: 0x7F
    default: 0x7E
