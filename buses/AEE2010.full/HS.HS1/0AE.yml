id: 0x0AE
name: 'IMMOBILIZER_KEY_BSI_MCU'
type: 'can'
length: 5
comment:
  en: 'Immobiliser key response sent by the body computer (BSI) to the electric motor control unit (MCU), part of the challenge/response authentication exchange.'
  fr: 'Réponse de clé d''antidémarrage envoyée par le BSI au calculateur de la machine électrique (MCU), dans le cadre de l''échange d''authentification défi/réponse.'
  es: 'Respuesta de clave del inmovilizador enviada por la BSI a la unidad de control del motor eléctrico (MCU), parte del intercambio de autenticación de desafío/respuesta.'
  de: 'Wegfahrsperren-Schlüsselantwort vom BSI an das Elektromotor-Steuergerät (MCU), Teil des Challenge-Response-Authentifizierungsaustauschs.'
  it: 'Risposta chiave dell''immobilizer inviata dal BSI alla centralina del motore elettrico (MCU), parte dello scambio di autenticazione challenge/response.'
  pl: 'Odpowiedź kluczowa immobilisera wysyłana przez BSI do sterownika silnika elektrycznego (MCU), część wymiany uwierzytelniania challenge/response.'
  ru: 'Ответ ключа иммобилайзера, отправляемый BSI блоку управления электродвигателем (MCU), часть обмена аутентификацией challenge/response.'
  zh: '车身控制器(BSI)发送给电机控制单元(MCU)的防盗锁止密钥响应,属于挑战/响应认证交换的一部分。'
  hu: 'A BSI által az elektromos motor vezérlőegységének (MCU) küldött indításgátló-kulcsválasz, a challenge/response hitelesítési csere része.'
  pt: 'Resposta de chave do imobilizador enviada pela BSI à unidade de controlo do motor elétrico (MCU), parte da troca de autenticação desafio/resposta.'
observations:
  en: 'Reception of an unlock request from MCU'
  fr: 'Réception d''une demande de déverrouillage du MCU'
  es: 'Recepción de una solicitud de desbloqueo del MCU'
  de: 'Empfang einer Entriegelungsanforderung von MCU'
  it: 'Ricezione di una richiesta di sblocco da MCU'
  pl: 'Odebranie żądania odblokowania od MCU'
  ru: 'Получение запроса на разблокировку от MCU'
  zh: '接收到来自MCU的解锁请求'
  hu: 'Zárnyitási kérés fogadása a(z) MCU részéről'
  pt: 'Receção de um pedido de destrancagem da MCU'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['VCU', 'E_VCU']

