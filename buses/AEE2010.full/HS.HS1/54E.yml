      pl: 'Licznik przebiegu pojazdu, rozdzielczość 0,1 km; nieprawidłowy, gdy wszystkie bity ustawione'
      ru: 'Общий пробег автомобиля, разрешение 0,1 км; недействительно, если все биты установлены'
      zh: '车辆总里程表,分辨率 0.1 公里;所有位为 1 时无效'
