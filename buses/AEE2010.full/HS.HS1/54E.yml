      fr: 'Odomètre partiel (compteur journalier)'
      es: 'Cuentakilómetros parcial (contador de viaje)'
      de: 'Tageskilometerzähler'
      it: 'Contachilometri parziale (contatore di viaggio)'
      pl: 'Licznik dzienny (przebieg cząstkowy)'
      ru: 'Суточный счётчик пробега'
      zh: '分段里程表(行程表)'
      hu: 'Részleges kilométeróra (útszámláló)'
      pt: 'Conta-quilómetros parcial (diário de viagem)'
