    alternatives:
      - note:
          en: 'Also observed with another scaling (factor 20685)'
          fr: 'Aussi observé avec une autre mise à l''échelle (factor 20685)'
          es: 'También observado con otro escalado (factor 20685)'
          de: 'Auch mit anderer Skalierung beobachtet (factor 20685)'
          it: 'Osservato anche con un''altra scala (factor 20685)'
          pl: 'Obserwowany także z innym skalowaniem (factor 20685)'
          ru: 'Также наблюдался с другим масштабом (factor 20685)'
          zh: '也观察到使用另一种缩放（factor 20685）'
          hu: 'Megfigyelve más skálázással is (factor 20685)'
          pt: 'Também observado com outra escala (factor 20685)'
        factor: 20685

