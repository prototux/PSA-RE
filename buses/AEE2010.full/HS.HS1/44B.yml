id: 0x44B
name: 'RIGHT_LANE_LINE_INFO'
type: 'can-tp'
comment:
  en: 'Right lane line detection data from the front camera: curvature, distance to line, heading angle, line type and detection status for lane keeping and departure warning.'
  fr: 'Données de détection de la ligne de voie droite par la caméra avant : courbure, distance à la ligne, angle de cap, type de ligne et état de détection pour l''aide au maintien de voie et l''alerte de franchissement.'
  es: 'Datos de detección de la línea del carril derecho por la cámara delantera: curvatura, distancia a la línea, ángulo de rumbo, tipo de línea y estado de detección para la asistencia de mantenimiento de carril y la alerta de salida.'
  de: 'Erkennungsdaten der rechten Fahrspurlinie durch die Frontkamera: Krümmung, Abstand zur Linie, Kurswinkel, Linientyp und Erkennungsstatus für Spurhalteassistent und Spurverlassenswarnung.'
  it: 'Dati di rilevamento della linea di corsia destra dalla telecamera anteriore: curvatura, distanza dalla linea, angolo di rotta, tipo di linea e stato di rilevamento per il mantenimento di corsia e l''avviso di superamento.'
  pl: 'Dane wykrywania prawej linii pasa ruchu z przedniej kamery: krzywizna, odległość do linii, kąt kursu, typ linii i stan wykrywania dla wspomagania utrzymania pasa i ostrzegania o zjeździe.'
  ru: 'Данные обнаружения правой линии полосы движения передней камерой: кривизна, расстояние до линии, курсовой угол, тип линии и статус обнаружения для удержания в полосе и предупреждения о выезде.'
  zh: '前置摄像头的右车道线检测数据：曲率、到车道线的距离、航向角、车道线类型和用于车道保持辅助与偏离预警的检测状态。'
  hu: 'A jobb sávvonal érzékelési adatai az első kamerából: görbület, vonaltávolság, iránypontosság, vonaltípus és érzékelési állapot a sávtartáshoz és a lesodródás-figyelmeztetéshez.'
  pt: 'Dados de deteção da linha de faixa direita da câmara dianteira: curvatura, distância à linha, ângulo de rumo, tipo de linha e estado de deteção para manutenção de faixa e aviso de saída de faixa.'
periodicity: ['50ms']
senders: ['CVM']
receivers: ['BSI']
isotp:
  addressing: 'normal'

signals:
  RIGHT_LINE_ESTIMATED_CURVATURE:
    bits: '1.7-2.0'
    comment:
      en: 'Estimated curvature of the right lane line'
      fr: 'Courbure estimée de la ligne droite'
      es: 'Curvatura estimada de la línea derecha'
      de: 'Geschätzte Krümmung der rechten Fahrbahnlinie'
      it: 'Curvatura stimata della linea di corsia destra'
      pl: 'Szacowana krzywizna prawej linii pasa'
      ru: 'Оценочная кривизна правой линии полосы'
      zh: '右侧车道线的估算曲率'
      hu: 'A jobb oldali sávvonal becsült görbülete'
      pt: 'Curvatura estimada da linha direita'
    type: 'sint'
    factor: 2.0e-06
    min: -0.05
    max: 0.05
    units: 'm-1'
    invalid: 0x7FFF
    default: 0x7FFE

  RIGHT_LINE_CURVATURE_DERIVATIVE:
    bits: '3.7-4.0'
    comment:
      en: 'Derivative of the road curvature, estimated from the right lane line'
      fr: 'Dérivée de la courbure de la route, estimée à partir de la ligne droite'
      es: 'Derivada de la curvatura de la carretera, estimada a partir de la línea derecha'
      de: 'Ableitung der Straßenkrümmung, geschätzt aus der rechten Fahrbahnlinie'
      it: 'Derivata della curvatura della strada, stimata dalla linea di corsia destra'
      pl: 'Pochodna krzywizny drogi, szacowana na podstawie prawej linii pasa'
      ru: 'Производная кривизны дороги, оценённая по правой линии полосы'
      zh: '根据右侧车道线估算的道路曲率导数'
      hu: 'Az útgörbület deriváltja, a jobb oldali sávvonalból becsülve'
      pt: 'Derivada da curvatura da estrada, estimada a partir da linha direita'
    type: 'sint'
    factor: 4.0e-09
    min: -0.00012
    max: 0.00012
    invalid: 0x7FFF
    default: 0x7FFE

  RIGHT_LINE_HEADING_ANGLE:
    bits: '5.7-6.4'
    comment:
      en: 'Vehicle heading angle relative to the right lane line'
      fr: 'Angle de cap du véhicule par rapport à la ligne droite'
      es: 'Ángulo de rumbo del vehículo respecto a la línea derecha'
      de: 'Kurswinkel des Fahrzeugs relativ zur rechten Fahrbahnlinie'
      it: 'Angolo di direzione del veicolo rispetto alla linea di corsia destra'
      pl: 'Kąt kursu pojazdu względem prawej linii pasa'
      ru: 'Курсовой угол автомобиля относительно правой линии полосы'
      zh: '车辆相对右侧车道线的航向角'
      hu: 'A jármű haladási szöge a jobb oldali sávvonalhoz képest'
      pt: 'Ângulo de rumo do veículo em relação à linha de faixa direita'
    type: 'sint'
    factor: 0.015
    min: -30
    max: 30
    units: '°'
    invalid: 0x7FF
    default: 0x7FE

