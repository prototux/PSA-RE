      it: 'Posizione del joystick / richiesta del conducente'
      pl: 'Pozycja joysticka / żądanie kierowcy'
      ru: 'Положение джойстика / запрос водителя'
      zh: '操纵杆位置/驾驶员请求'
      hu: 'A joystick helyzete / a vezető kérése'
      pt: 'Posição do joystick / pedido do condutor'
    type: 'enum'
