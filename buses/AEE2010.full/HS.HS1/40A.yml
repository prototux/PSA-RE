id: 0x40A
name: 'SHIFT_BY_WIRE_DYNAMIC_DATA'
type: 'can'
length: 3
comment:
  en: 'Shift-by-wire data: lever/joystick position, neutral-forcing request, driving mode and fault state.'
  fr: 'Données de la commande de boîte électrique (shift-by-wire) : position du levier/joystick, demande de forçage point mort, mode de conduite et état de défaut.'
  es: 'Datos del selector de marchas electrónico (shift-by-wire): posición de la palanca/joystick, solicitud de forzado a punto muerto, modo de conducción y estado de fallo.'
  de: 'Daten der elektronischen Gangwahl (Shift-by-Wire): Hebel-/Joystickposition, Anforderung zur Neutralstellung, Fahrmodus und Fehlerstatus.'
  it: 'Dati del selettore marce elettronico (shift-by-wire): posizione della leva/joystick, richiesta di forzatura in folle, modalità di guida e stato di guasto.'
  pl: 'Dane elektronicznej dźwigni zmiany biegów (shift-by-wire): pozycja dźwigni/joysticka, żądanie wymuszenia biegu neutralnego, tryb jazdy i stan usterki.'
  ru: 'Данные электронного переключения передач (shift-by-wire): положение рычага/джойстика, запрос принудительного перевода в нейтраль, режим движения и статус неисправности.'
  zh: '电子换挡(Shift-by-Wire)数据:挡杆/操纵杆位置、强制空挡请求、驾驶模式及故障状态。'
  hu: 'Az elektronikus váltókar (shift-by-wire) adatai: kar-/joystickpozíció, üresbe kényszerítés kérése, vezetési mód és hibaállapot.'
  pt: 'Dados de shift-by-wire: posição da alavanca/joystick, pedido de forçar ponto morto, modo de condução e estado de avaria.'
periodicity: ['20ms']
senders: ['SBW']
receivers: ['BVA', 'BSI', 'ABS']

