id: 0x596
name: 'CAMERA_LANE_TRACKING_DATA_5'
type: 'can'
length: 4
comment:
  en: 'Camera lane-tracking data: lead-vehicle lane-crossing flags, cluster angle/distance left and right, minimum cluster distance/angle and perception status.'
  fr: 'Données de suivi de voie de la caméra : indicateurs de franchissement de voie du véhicule leader, angle/distance de cluster gauche et droite, distance/angle minimal du cluster et état de perception.'
  es: 'Datos de seguimiento de carril de la cámara: indicadores de cruce de carril del vehículo líder, ángulo/distancia del clúster izquierdo y derecho, distancia/ángulo mínimo del clúster y estado de percepción.'
  de: 'Spurführungsdaten der Kamera: Fahrspurüberquerungskennzeichen des vorausfahrenden Fahrzeugs, Cluster-Winkel/-Abstand links und rechts, minimaler Cluster-Abstand/-Winkel und Wahrnehmungsstatus.'
  it: 'Dati di tracciamento corsia della telecamera: indicatori di attraversamento corsia del veicolo che precede, angolo/distanza del cluster sinistro e destro, distanza/angolo minimo del cluster e stato di percezione.'
  pl: 'Dane śledzenia pasa ruchu z kamery: flagi przekroczenia pasa przez pojazd poprzedzający, kąt/odległość klastra lewego i prawego, minimalna odległość/kąt klastra i stan percepcji.'
  ru: 'Данные слежения за полосой от камеры: флаги пересечения полосы ведущим автомобилем, угол/расстояние кластера слева и справа, минимальное расстояние/угол кластера и статус восприятия.'
  zh: '摄像头车道追踪数据:前车压线标志、左右聚类角度/距离、最小聚类距离/角度和感知状态。'
  hu: 'A kamera sávkövetési adatai: az előttünk haladó jármű sávelhagyási jelzői, bal és jobb oldali klaszterszög/-távolság, minimális klasztertávolság/-szög és érzékelési állapot.'
  pt: 'Dados de seguimento de faixa da câmara: indicadores de cruzamento de faixa do veículo da frente, ângulo/distância do agrupamento à esquerda e à direita, distância/ângulo mínimo do agrupamento e estado de perceção.'
observations:
  en: 'On state change of: CONDITIONAL_SPEED_LIMIT_CAMERA, CONDITIONAL_SPEED_SIGN_TYPE'
  fr: 'Sur changement d''état de : CONDITIONAL_SPEED_LIMIT_CAMERA, CONDITIONAL_SPEED_SIGN_TYPE'
  es: 'Al cambiar el estado de: CONDITIONAL_SPEED_LIMIT_CAMERA, CONDITIONAL_SPEED_SIGN_TYPE'
  de: 'Bei Statusänderung von: CONDITIONAL_SPEED_LIMIT_CAMERA, CONDITIONAL_SPEED_SIGN_TYPE'
  it: 'Al cambiamento di stato di: CONDITIONAL_SPEED_LIMIT_CAMERA, CONDITIONAL_SPEED_SIGN_TYPE'
  pl: 'Wysyłane przy zmianie stanu: CONDITIONAL_SPEED_LIMIT_CAMERA, CONDITIONAL_SPEED_SIGN_TYPE'
  ru: 'При изменении состояния: CONDITIONAL_SPEED_LIMIT_CAMERA, CONDITIONAL_SPEED_SIGN_TYPE'
  zh: '当VITESSE_ILV_C, TYPE_PANNEAU_ILV_C状态变化时'
  hu: 'A(z) CONDITIONAL_SPEED_LIMIT_CAMERA, CONDITIONAL_SPEED_SIGN_TYPE állapotváltozásakor'
  pt: 'Na mudança de estado de: CONDITIONAL_SPEED_LIMIT_CAMERA, CONDITIONAL_SPEED_SIGN_TYPE'
periodicity: ['300ms', 'trigger']
senders: ['CVM']
receivers: ['BSI']

signals:
