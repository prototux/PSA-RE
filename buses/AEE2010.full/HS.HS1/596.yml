    bits: '1.7-1.0'
    comment:
      en: 'Conditional speed limit read by the camera (km/h)'
      fr: 'Vitesse conditionnelle lue par la caméra (km/h)'
      es: 'Velocidad condicional leída por la cámara (km/h)'
      de: 'Von der Kamera gelesene bedingte Geschwindigkeitsbegrenzung (km/h)'
