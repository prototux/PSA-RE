        fr: 'Pas de demande de serrage'
        es: 'Sin solicitud de apriete'
        de: 'Keine Anforderung zum Straffen'
        it: 'Nessuna richiesta di serraggio'
        pl: 'Brak żądania dokręcenia'
        ru: 'Нет запроса на затягивание'
        zh: '无收紧请求'
        hu: 'Nincs meghúzási kérés'
        pt: 'Sem pedido de aperto'
      0x01:
        en: 'Locking request'
        fr: 'Demande de verrouillage'
        es: 'Solicitud de bloqueo'
        de: 'Verriegelungsanforderung'
        it: 'Richiesta di blocco'
        pl: 'Żądanie zablokowania'
        ru: 'Запрос блокировки'
        zh: '锁止请求'
        hu: 'Zárási kérés'
        pt: 'Pedido de trancagem'

  ACPK_VELOCITY_LIMIT:
    bits: '3.3-4.4'
    comment:
      en: 'Maximum vehicle speed for braking control during longitudinal control'
      fr: 'Vitesse maximale du véhicule pour le contrôle du freinage en contrôle longitudinal'
      es: 'Velocidad máxima del vehículo para el control de frenado en control longitudinal'
      de: 'Maximale Fahrzeuggeschwindigkeit für die Bremsregelung während der Längsregelung'
      it: 'Velocità massima del veicolo per il controllo della frenata durante il controllo longitudinale'
      pl: 'Maksymalna prędkość pojazdu dla sterowania hamowaniem podczas sterowania wzdłużnego'
      ru: 'Максимальная скорость автомобиля для управления торможением при продольном управлении'
      zh: '纵向控制期间制动控制的最大车速'
      hu: 'A fékvezérléshez tartozó maximális járműsebesség a hosszirányú vezérlés alatt'
      pt: 'Velocidade máxima do veículo para o controlo de travagem em controlo longitudinal'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 25.5
    units: 'km/h'
    default: 0x00

  ACPK_MANOEUVRE_IMMINENT:
    bits: '4.3'
    comment:
