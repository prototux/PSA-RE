id: 0x5E3
name: 'CABIN_SPEED_SECTION_COMMAND'
type: 'can'
length: 8
comment:
  en: 'Navigation speed-limit section data relayed to the cabin/HVAC system: activation, remaining distance and time, and distance to up to five upcoming speed sections.'
  fr: 'Données des tronçons de limitation de vitesse de la navigation relayées vers le système habitacle/climatisation : activation, distance et temps restants, et distance jusqu''à cinq tronçons de vitesse à venir.'
  es: 'Datos de los tramos de límite de velocidad de la navegación retransmitidos al sistema de habitáculo/climatización: activación, distancia y tiempo restantes, y distancia hasta cinco tramos de velocidad próximos.'
  de: 'An das Innenraum-/Klimasystem weitergeleitete Geschwindigkeitsbegrenzungsabschnittsdaten der Navigation: Aktivierung, verbleibende Distanz und Zeit sowie Distanz zu bis zu fünf kommenden Geschwindigkeitsabschnitten.'
  it: 'Dati dei tratti di limite di velocità della navigazione inoltrati al sistema abitacolo/climatizzazione: attivazione, distanza e tempo restanti, e distanza fino a cinque tratti di velocità futuri.'
  pl: 'Dane odcinków ograniczenia prędkości z nawigacji przekazywane do układu kabiny/klimatyzacji: aktywacja, pozostały dystans i czas oraz odległość do maksymalnie pięciu nadchodzących odcinków prędkości.'
  ru: 'Данные участков ограничения скорости от навигации, ретранслируемые в систему салона/климата: активация, оставшееся расстояние и время, а также расстояние до пяти предстоящих участков скорости.'
  zh: '转发给座舱/空调系统的导航限速路段数据：激活状态、剩余距离和时间，以及最多五个即将到来的限速路段的距离。'
  hu: 'A belső tér/klíma rendszernek továbbított navigációs sebességkorlátozási szakaszadatok: aktiválás, hátralévő táv és idő, valamint a táv legfeljebb öt közelgő sebességszakaszig.'
  pt: 'Dados de secções de limite de velocidade da navegação retransmitidos ao sistema de climatização do habitáculo: ativação, distância e tempo restantes, e distância até cinco secções de velocidade seguintes.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['CMM']

signals:
  REMAINING_DISTANCE_SPEED_0_30:
    bits: '1.7-1.1'
    comment:
      en: 'Percentage of remaining distance at 0-30 km/h'
      fr: 'Pourcentage de distance restante à une vitesse de 0 à 30 km/h'
      es: 'Porcentaje de distancia restante a una velocidad de 0 a 30 km/h'
      de: 'Prozentsatz der Restdistanz bei 0-30 km/h'
      it: 'Percentuale di distanza rimanente a una velocità di 0-30 km/h'
      pl: 'Procent pozostałego dystansu przy prędkości 0-30 km/h'
      ru: 'Процент оставшегося расстояния при скорости 0-30 км/ч'
      zh: '0-30 km/h 速度下的剩余距离百分比'
      hu: 'Hátralévő távolság százaléka 0-30 km/h sebességnél'
      pt: 'Percentagem de distância restante a uma velocidade de 0 a 30 km/h'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
