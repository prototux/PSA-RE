id: 0x4FA
name: 'LVNSD_DATA'
type: 'can'
length: 4
comment:
  en: 'LVNSD node data: service-blink request, battery diagnostic state and switch state.'
  fr: 'Données du module LVNSD : demande de clignotement service, état de diagnostic batterie et état du contacteur.'
  es: 'Datos del módulo LVNSD: solicitud de parpadeo de servicio, estado de diagnóstico de batería y estado del interruptor.'
  de: 'Daten des LVNSD-Moduls: Service-Blinkanforderung, Batteriediagnosestatus und Schalterzustand.'
  it: 'Dati del modulo LVNSD: richiesta di lampeggio di servizio, stato di diagnosi batteria e stato dell''interruttore.'
  pl: 'Dane modułu LVNSD: żądanie migania serwisowego, stan diagnostyki akumulatora i stan przełącznika.'
  ru: 'Данные модуля LVNSD: запрос сервисного мигания, состояние диагностики батареи и состояние переключателя.'
  zh: 'LVNSD模块数据:维修闪烁请求、电池诊断状态和开关状态。'
  hu: 'Az LVNSD modul adatai: szervizvillogás kérése, akkumulátor-diagnosztikai állapot és kapcsoló állapota.'
  pt: 'Dados do nó LVNSD: pedido de pisca de serviço, estado de diagnóstico da bateria e estado do interruptor.'
observations:
  en: 'On state change of: LV_BATTERY_DIAG_RESULT, LV_BATTERY_SWITCH_STATE'
  fr: 'Sur changement d''état de : LV_BATTERY_DIAG_RESULT, LV_BATTERY_SWITCH_STATE'
  es: 'Al cambiar el estado de: LV_BATTERY_DIAG_RESULT, LV_BATTERY_SWITCH_STATE'
  de: 'Bei Statusänderung von: LV_BATTERY_DIAG_RESULT, LV_BATTERY_SWITCH_STATE'
  it: 'Al cambiamento di stato di: LV_BATTERY_DIAG_RESULT, LV_BATTERY_SWITCH_STATE'
  pl: 'Wysyłane przy zmianie stanu: LV_BATTERY_DIAG_RESULT, LV_BATTERY_SWITCH_STATE'
  ru: 'При изменении состояния: LV_BATTERY_DIAG_RESULT, LV_BATTERY_SWITCH_STATE'
  zh: '当LVNSD_BATT_DIAG_STATE, SWITCH_ACTUAL_STATE状态变化时'
  hu: 'A(z) LV_BATTERY_DIAG_RESULT, LV_BATTERY_SWITCH_STATE állapotváltozásakor'
  pt: 'Na mudança de estado de: LV_BATTERY_DIAG_RESULT, LV_BATTERY_SWITCH_STATE'
periodicity: ['100ms', 'trigger']
senders: ['LVNSD']
receivers: ['CMM']

signals:
  CHECKSUM_FRAME_4FA:
    bits: '1.7-1.4'
    comment:
      en: 'Frame checksum'
      fr: 'Somme de contrôle (checksum) de la trame'
      es: 'Suma de comprobación (checksum) de la trama'
      de: 'Prüfsumme (Checksum) des Rahmens'
      it: 'Checksum del frame'
      pl: 'Suma kontrolna (checksum) ramki'
      ru: 'Контрольная сумма кадра'
      zh: '帧校验和'
      hu: 'A keret ellenőrző összege (checksum)'
      pt: 'Soma de verificação da trama'
    type: 'uint'

  PROCESS_COUNTER_4B_4FA:
    bits: '1.3-1.0'
    comment:
      en: '4-bit process counter'
      fr: 'Compteur de process 4 bits'
      es: 'Contador de proceso de 4 bits'
      de: '4-Bit-Prozesszähler'
      it: 'Contatore di processo a 4 bit'
      pl: '4-bitowy licznik procesu'
      ru: '4-битный счётчик процесса'
      zh: '4位过程计数器'
      hu: '4 bites folyamatszámláló'
      pt: 'Contador de processo de 4 bits'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00

  LV_BATTERY_DIAG_RESULT:
    bits: '2.7-2.5'
    comment:
      en: 'Conclusion of the low-voltage battery diagnostic'
      fr: 'Conclusion du diagnostic de la batterie basse tension'
      es: 'Conclusión del diagnóstico de la batería de baja tensión'
      de: 'Ergebnis der Diagnose der Niedervoltbatterie'
      it: 'Conclusione della diagnosi della batteria a bassa tensione'
      pl: 'Wynik diagnostyki akumulatora niskiego napięcia'
      ru: 'Результат диагностики низковольтной батареи'
      zh: '低压蓄电池诊断结论'
      hu: 'Az alacsony feszültségű akkumulátor diagnosztikájának eredménye'
      pt: 'Conclusão do diagnóstico da bateria de baixa tensão'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'Not carried out'
        fr: 'Non réalisé'
        es: 'No realizado'
        de: 'Nicht durchgeführt'
        it: 'Non eseguito'
        pl: 'Niewykonane'
        ru: 'Не выполнено'
        zh: '未执行'
        hu: 'Nincs végrehajtva'
        pt: 'Não realizado'
      0x01:
        en: 'Reliable'
        fr: 'Fiable'
        es: 'Fiable'
        de: 'Zuverlässig'
        it: 'Affidabile'
        pl: 'Niezawodne'
        ru: 'Надёжно'
        zh: '可靠'
        hu: 'Megbízható'
        pt: 'Fiável'
      0x02:
        en: 'Level 1 unreliable'
        fr: 'Niveau 1 non fiable'
        es: 'Nivel 1 no fiable'
        de: 'Stufe 1 unzuverlässig'
        it: 'Livello 1 non affidabile'
        pl: 'Niewiarygodny poziom 1'
        ru: 'Уровень 1 ненадёжен'
        zh: '1级不可靠'
        hu: '1. szint nem megbízható'
        pt: 'Nível 1 não fiável'
      0x03:
        en: 'Level 2 not reliable'
        fr: 'Niveau 2 non fiable'
        es: 'Nivel 2 no fiable'
        de: 'Stufe 2 nicht zuverlässig'
        it: 'Livello 2 non affidabile'
        pl: 'Poziom 2 niewiarygodny'
        ru: 'Уровень 2 недостоверен'
        zh: '等级2不可靠'
        hu: '2. szint nem megbízható'
        pt: 'Nível 2 não fiável'
      0x04:
        en: 'Test not feasible or not reliable'
        fr: 'Test impossible ou non fiable'
        es: 'Prueba no viable o no fiable'
        de: 'Test nicht durchführbar oder nicht zuverlässig'
        it: 'Test non fattibile o non affidabile'
        pl: 'Test niemożliwy lub niewiarygodny'
        ru: 'Тест невозможен или ненадёжен'
        zh: '测试不可行或不可靠'
        hu: 'Teszt nem végezhető el vagy nem megbízható'
        pt: 'Teste inviável ou não fiável'
      0x05:
        unused: true
      0x06:
        unused: true
      0x07:
        unused: true

  LV_BATTERY_SWITCH_STATE:
    bits: '2.4-2.3'
    comment:
      en: 'Low-voltage battery switch state'
      fr: 'État du commutateur de la batterie basse tension'
      es: 'Estado del conmutador de la batería de baja tensión'
      de: 'Schalterzustand der Niedervoltbatterie'
      it: 'Stato del commutatore della batteria a bassa tensione'
      pl: 'Stan przełącznika akumulatora niskiego napięcia'
      ru: 'Состояние переключателя низковольтной батареи'
      zh: '低压蓄电池开关状态'
      hu: 'Az alacsony feszültségű akkumulátor kapcsolójának állapota'
      pt: 'Estado do comutador da bateria de baixa tensão'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'Switch closed'
        fr: 'Contacteur fermé'
        es: 'Interruptor cerrado'
        de: 'Schalter geschlossen'
        it: 'Interruttore chiuso'
        pl: 'Przełącznik zamknięty'
        ru: 'Переключатель замкнут'
        zh: '开关闭合'
        hu: 'Kapcsoló zárva'
        pt: 'Interruptor fechado'
      0x01:
        en: 'Switch open'
        fr: 'Contacteur ouvert'
        es: 'Interruptor abierto'
        de: 'Schalter offen'
        it: 'Interruttore aperto'
        pl: 'Przełącznik otwarty'
        ru: 'Выключатель разомкнут'
        zh: '开关断开'
        hu: 'Kapcsoló nyitva'
        pt: 'Comutador aberto'
      0x02:
        en: 'Failure detected'
        fr: 'Défaut détecté'
        es: 'Fallo detectado'
        de: 'Fehler erkannt'
        it: 'Guasto rilevato'
        pl: 'Wykryto usterkę'
        ru: 'Обнаружена неисправность'
        zh: '检测到故障'
        hu: 'Hiba észlelve'
        pt: 'Falha detetada'
      0x03:
        unused: true

  LV_BATTERY_STOP_SERVICE_BLINK_REQUEST:
    bits: '2.2'
    comment:
      en: 'Request from the low-voltage battery module to blink the Stop and Service warning lamps on the display'
      fr: 'Demande par le module de batterie basse tension du clignotement des témoins Stop et Service sur l''affichage'
      es: 'Solicitud del módulo de la batería de baja tensión de parpadeo de los testigos Stop y Service en la pantalla'
      de: 'Anforderung des Niedervoltbatterie-Moduls zum Blinken der Stop- und Service-Kontrollleuchten auf der Anzeige'
      it: 'Richiesta del modulo batteria a bassa tensione di lampeggio delle spie Stop e Service sul display'
      pl: 'Żądanie modułu akumulatora niskiego napięcia dotyczące migania lampek Stop i Service na wyświetlaczu'
      ru: 'Запрос от модуля низковольтной батареи на мигание ламп Stop и Service на дисплее'
      zh: '低压蓄电池模块请求在显示屏上闪烁Stop和Service警告灯'
      hu: 'Az alacsony feszültségű akkumulátor-modul kérése a Stop és Service jelzőlámpák villogtatására a kijelzőn'
      pt: 'Pedido do módulo da bateria de baixa tensão de intermitência das luzes avisadoras Stop e Service no visor'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
        en: 'Requested'
        fr: 'Demandé'
        es: 'Solicitado'
        de: 'Angefordert'
        it: 'Richiesto'
        pl: 'Żądane'
        ru: 'Запрошено'
        zh: '已请求'
        hu: 'Kérve'
        pt: 'Pedido'

  UNUSED_1:
    bits: '2.1-4.0'
    unused: true
