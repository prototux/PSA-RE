id: 0x42B
name: 'LEFT_LANE_LINE_INFO'
type: 'can-tp'
comment:
  en: 'Left lane line detection data from the front camera: curvature, heading angle, line type and detection status for lane keeping and departure warning.'
  fr: 'Données de détection de la ligne de voie gauche par la caméra avant : courbure, angle de cap, type de ligne et état de détection pour l''aide au maintien de voie et l''alerte de franchissement.'
  es: 'Datos de detección de la línea del carril izquierdo por la cámara delantera: curvatura, ángulo de rumbo, tipo de línea y estado de detección para la asistencia de mantenimiento de carril y la alerta de salida.'
  de: 'Erkennungsdaten der linken Fahrspurlinie durch die Frontkamera: Krümmung, Kurswinkel, Linientyp und Erkennungsstatus für Spurhalteassistent und Spurverlassenswarnung.'
  it: 'Dati di rilevamento della linea di corsia sinistra dalla telecamera anteriore: curvatura, angolo di rotta, tipo di linea e stato di rilevamento per il mantenimento di corsia e l''avviso di superamento.'
  pl: 'Dane wykrywania lewej linii pasa ruchu z przedniej kamery: krzywizna, kąt kursu, typ linii i stan wykrywania dla wspomagania utrzymania pasa i ostrzegania o zjeździe.'
  ru: 'Данные обнаружения левой линии полосы движения передней камерой: кривизна, курсовой угол, тип линии и статус обнаружения для удержания в полосе и предупреждения о выезде.'
  zh: '前置摄像头的左车道线检测数据：曲率、航向角、车道线类型和用于车道保持辅助与偏离预警的检测状态。'
  hu: 'A bal sávvonal érzékelési adatai az első kamerából: görbület, iránypontosság, vonaltípus és érzékelési állapot a sávtartáshoz és a lesodródás-figyelmeztetéshez.'
  pt: 'Dados de deteção da linha de faixa esquerda da câmara dianteira: curvatura, ângulo de rumo, tipo de linha e estado de deteção para manutenção de faixa e aviso de saída de faixa.'
periodicity: ['50ms']
senders: ['CVM']
receivers: ['BSI']
isotp:
  addressing: 'normal'

signals:
  LEFT_LINE_ESTIMATED_CURVATURE:
    bits: '1.7-2.0'
    comment:
      en: 'Estimated curvature of the left lane line'
      fr: 'Courbure estimée de la ligne gauche'
      es: 'Curvatura estimada de la línea izquierda'
      de: 'Geschätzte Krümmung der linken Fahrbahnlinie'
      it: 'Curvatura stimata della linea di corsia sinistra'
      pl: 'Szacowana krzywizna lewej linii pasa'
      ru: 'Оценочная кривизна левой линии полосы'
      zh: '左侧车道线的估算曲率'
      hu: 'A bal oldali sávvonal becsült görbülete'
      pt: 'Curvatura estimada da linha esquerda'
    type: 'sint'
    factor: 2.0e-06
    min: -0.05
    max: 0.05
    units: 'm-1'
    invalid: 0x7FFF
    default: 0x7FFE

  LEFT_LINE_CURVATURE_DERIVATIVE:
    bits: '3.7-4.0'
    comment:
      en: 'Derivative of the road curvature, estimated from the left lane line'
      fr: 'Dérivée de la courbure de la route, estimée à partir de la ligne gauche'
      es: 'Derivada de la curvatura de la carretera, estimada a partir de la línea izquierda'
      de: 'Ableitung der Straßenkrümmung, geschätzt aus der linken Fahrbahnlinie'
      it: 'Derivata della curvatura della strada, stimata dalla linea di corsia sinistra'
      pl: 'Pochodna krzywizny drogi, szacowana na podstawie lewej linii pasa'
      ru: 'Производная кривизны дороги, оценённая по левой линии полосы'
      zh: '根据左侧车道线估算的道路曲率导数'
      hu: 'Az útgörbület deriváltja, a bal oldali sávvonalból becsülve'
      pt: 'Derivada da curvatura da estrada, estimada a partir da linha esquerda'
    type: 'sint'
    factor: 4.0e-09
    min: -0.00012
    max: 0.00012
    invalid: 0x7FFF
    default: 0x7FFE

  LEFT_LINE_HEADING_ANGLE:
    bits: '5.7-6.4'
    comment:
      en: 'Vehicle heading angle relative to the left lane line'
      fr: 'Angle de cap du véhicule par rapport à la ligne gauche'
      es: 'Ángulo de rumbo del vehículo respecto a la línea izquierda'
      de: 'Kurswinkel des Fahrzeugs relativ zur linken Fahrbahnlinie'
      it: 'Angolo di direzione del veicolo rispetto alla linea di corsia sinistra'
      pl: 'Kąt kursu pojazdu względem lewej linii pasa'
      ru: 'Курсовой угол автомобиля относительно левой линии полосы'
      zh: '车辆相对左侧车道线的航向角'
      hu: 'A jármű haladási szöge a bal oldali sávvonalhoz képest'
      pt: 'Ângulo de rumo do veículo em relação à linha de faixa esquerda'
    type: 'sint'
    factor: 0.015
    min: -30
    max: 30
    units: '°'
    invalid: 0x7FF
    default: 0x7FE

