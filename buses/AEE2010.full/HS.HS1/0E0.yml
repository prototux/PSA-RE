id: 0x0E0
name: 'IMMOBILIZER_KEY_UCC_ENGINE'
type: 'can'
length: 5
comment:
  en: 'Immobiliser key response sent by the after-market client unit (UCC) to the engine ECU, part of the challenge/response authentication exchange.'
  fr: 'Réponse de clé d''antidémarrage envoyée par l''unité client (UCC) au calculateur moteur, dans le cadre de l''échange d''authentification défi/réponse.'
  es: 'Respuesta de clave del inmovilizador enviada por la unidad cliente (UCC) a la ECU del motor, parte del intercambio de autenticación de desafío/respuesta.'
  de: 'Wegfahrsperren-Schlüsselantwort von der Kundeneinheit (UCC) an das Motorsteuergerät, Teil des Challenge-Response-Authentifizierungsaustauschs.'
  it: 'Risposta chiave dell''immobilizer inviata dall''unità cliente (UCC) alla centralina motore, parte dello scambio di autenticazione challenge/response.'
  pl: 'Odpowiedź kluczowa immobilisera wysyłana przez jednostkę kliencką (UCC) do sterownika silnika, część wymiany uwierzytelniania challenge/response.'
  ru: 'Ответ ключа иммобилайзера, отправляемый клиентским блоком (UCC) блоку управления двигателем, часть обмена аутентификацией challenge/response.'
  zh: '客户端单元(UCC)发送给发动机控制单元的防盗锁止密钥响应,属于挑战/响应认证交换的一部分。'
  hu: 'Az ügyfélegység (UCC) által a motorvezérlőnek küldött indításgátló-kulcsválasz, a challenge/response hitelesítési csere része.'
  pt: 'Resposta de chave do imobilizador enviada pela unidade cliente (UCC) à ECU do motor, parte da troca de autenticação desafio/resposta.'
observations:
  en: 'Reception of an unlock request from UCC'
  fr: 'Réception d''une demande de déverrouillage du UCC'
  es: 'Recepción de una solicitud de desbloqueo del UCC'
  de: 'Empfang einer Entriegelungsanforderung von UCC'
  it: 'Ricezione di una richiesta di sblocco da UCC'
  pl: 'Odebranie żądania odblokowania od UCC'
  ru: 'Получение запроса на разблокировку от UCC'
  zh: '接收到来自UCC的解锁请求'
  hu: 'Zárnyitási kérés fogadása a(z) UCC részéről'
  pt: 'Receção de um pedido de destrancagem da UCC'
periodicity: ['trigger']
senders: []  # TODO: find the sender(s)
receivers: ['CMM']

signals:
  IMMO_LOCAL_ID_UCC_CMM:
    bits: '1.7-1.0'
    comment:
      en: 'Immobiliser function local identifier (client ECU-engine ECU)'
      fr: 'Identifiant local de la fonction antidémarrage (calculateur client-calculateur moteur)'
      es: 'Identificador local de la función antirrobo (centralita cliente-centralita del motor)'
      de: 'Lokale Kennung der Wegfahrsperrenfunktion (Client-Steuergerät-Motorsteuergerät)'
      it: 'Identificativo locale della funzione immobilizzatore (centralina client-centralina motore)'
      pl: 'Lokalny identyfikator funkcji immobilizera (sterownik kliencki-sterownik silnika)'
      ru: 'Локальный идентификатор функции иммобилайзера (клиентский блок-блок управления двигателем)'
      zh: '防盗锁止功能本地标识符(客户端ECU-发动机ECU)'
      hu: 'Az indításgátló funkció helyi azonosítója (kliens vezérlőegység-motorvezérlő egység)'
      pt: 'Identificador local da função antirroubo (unidade cliente-unidade do motor)'
    type: 'enum'
    values:
      0x04:
        en: 'UCC key transmission'
        fr: 'Emission de la clef UCC'
        es: 'Transmisión de la clave UCC'
        de: 'Übertragung des UCC-Schlüssels'
        it: 'Trasmissione della chiave UCC'
        pl: 'Transmisja klucza UCC'
        ru: 'Передача ключа UCC'
        zh: 'UCC密钥发送'
        hu: 'UCC kulcs küldése'
        pt: 'Transmissão da chave UCC'

  IMMO_KEY_32:
    bits: '2.7-5.0'
    comment:
      en: 'BSI authentication key (32 bits)'
      fr: 'Clé d''authentification de la BSI (32 bits)'
      es: 'Clave de autenticación de la BSI (32 bits)'
      de: 'BSI-Authentifizierungsschlüssel (32 Bit)'
      it: 'Chiave di autenticazione della BSI (32 bit)'
      pl: 'Klucz uwierzytelniający BSI (32 bity)'
      ru: 'Ключ аутентификации BSI (32 бита)'
      zh: 'BSI认证密钥(32位)'
      hu: 'BSI hitelesítési kulcs (32 bit)'
      pt: 'Chave de autenticação da BSI (32 bits)'
    type: 'uint'
    factor: 1
    min: 0
    max: 4294967295
