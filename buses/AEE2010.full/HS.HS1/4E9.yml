id: 0x4E9
name: 'GEARBOX_DATA_2'
type: 'can'
length: 4
comment:
  en: 'Gearbox data: gear-change refused, fault state, start inhibition, sport mode, lever position display, driving program, engaged mechanical gear, target gear and driver-requested gear display.'
  fr: 'Données boîte de vitesses : changement de rapport refusé, état de défaut, inhibition de démarrage, mode sport, affichage position levier, programme de conduite, rapport mécanique engagé, rapport cible et affichage du rapport demandé par le conducteur.'
  es: 'Datos de la caja de cambios: cambio de marcha rechazado, estado de fallo, inhibición de arranque, modo deportivo, visualización de posición de palanca, programa de conducción, marcha mecánica engranada, marcha objetivo y visualización de la marcha solicitada por el conductor.'
  de: 'Getriebedaten: Gangwechsel abgelehnt, Fehlerzustand, Startsperre, Sportmodus, Hebelpositionsanzeige, Fahrprogramm, eingelegter mechanischer Gang, Zielgang und Anzeige des vom Fahrer angeforderten Gangs.'
  it: 'Dati del cambio: cambio marcia rifiutato, stato di guasto, inibizione avviamento, modalità sport, visualizzazione posizione leva, programma di guida, marcia meccanica innestata, marcia obiettivo e visualizzazione della marcia richiesta dal guidatore.'
  pl: 'Dane skrzyni biegów: odmowa zmiany biegu, stan usterki, blokada rozruchu, tryb sportowy, wyświetlanie pozycji dźwigni, program jazdy, włączony bieg mechaniczny, bieg docelowy i wyświetlanie biegu żądanego przez kierowcę.'
  ru: 'Данные коробки передач: отказ переключения передачи, статус неисправности, блокировка запуска, спортивный режим, отображение положения рычага, программа движения, включённая механическая передача, целевая передача и отображение передачи, запрошенной водителем.'
  zh: '变速箱数据:换挡被拒绝、故障状态、启动抑制、运动模式、换挡杆位置显示、驾驶程序、已啮合的机械挡位、目标挡位以及驾驶员请求挡位显示。'
  hu: 'Váltóadatok: fokozatváltás elutasítva, hibaállapot, indítástiltás, sport mód, váltókar pozíció kijelzése, vezetési program, bekapcsolt mechanikus fokozat, célfokozat és a vezető által kért fokozat kijelzése.'
  pt: 'Dados da caixa de velocidades: mudança recusada, estado de avaria, inibição de arranque, modo desportivo, apresentação da posição da alavanca, programa de condução, relação mecânica engrenada, relação-alvo e apresentação da relação pedida pelo condutor.'
observations:
  en: 'On state change of: GEARBOX_FREEWHEELING_STATUS, FREEWHEELING_AUTHORIZATION_GEARBOX, GEARBOX_PARK_STATE, EAGB_DRIVE_STATE, EAGB_FAILSAFE_STATE, PEM_FAILSAFE_STATE, SSC_FAULT_STATE, GEARBOX_EMERGENCY_MODE, EAGB_WATER_PUMP_FAULT'
  fr: 'Sur changement d''état de : GEARBOX_FREEWHEELING_STATUS, FREEWHEELING_AUTHORIZATION_GEARBOX, GEARBOX_PARK_STATE, EAGB_DRIVE_STATE, EAGB_FAILSAFE_STATE, PEM_FAILSAFE_STATE, SSC_FAULT_STATE, GEARBOX_EMERGENCY_MODE, EAGB_WATER_PUMP_FAULT'
  es: 'Al cambiar el estado de: GEARBOX_FREEWHEELING_STATUS, FREEWHEELING_AUTHORIZATION_GEARBOX, GEARBOX_PARK_STATE, EAGB_DRIVE_STATE, EAGB_FAILSAFE_STATE, PEM_FAILSAFE_STATE, SSC_FAULT_STATE, GEARBOX_EMERGENCY_MODE, EAGB_WATER_PUMP_FAULT'
  de: 'Bei Statusänderung von: GEARBOX_FREEWHEELING_STATUS, FREEWHEELING_AUTHORIZATION_GEARBOX, GEARBOX_PARK_STATE, EAGB_DRIVE_STATE, EAGB_FAILSAFE_STATE, PEM_FAILSAFE_STATE, SSC_FAULT_STATE, GEARBOX_EMERGENCY_MODE, EAGB_WATER_PUMP_FAULT'
  it: 'Al cambiamento di stato di: GEARBOX_FREEWHEELING_STATUS, FREEWHEELING_AUTHORIZATION_GEARBOX, GEARBOX_PARK_STATE, EAGB_DRIVE_STATE, EAGB_FAILSAFE_STATE, PEM_FAILSAFE_STATE, SSC_FAULT_STATE, GEARBOX_EMERGENCY_MODE, EAGB_WATER_PUMP_FAULT'
  pl: 'Wysyłane przy zmianie stanu: GEARBOX_FREEWHEELING_STATUS, FREEWHEELING_AUTHORIZATION_GEARBOX, GEARBOX_PARK_STATE, EAGB_DRIVE_STATE, EAGB_FAILSAFE_STATE, PEM_FAILSAFE_STATE, SSC_FAULT_STATE, GEARBOX_EMERGENCY_MODE, EAGB_WATER_PUMP_FAULT'
  ru: 'При изменении состояния: GEARBOX_FREEWHEELING_STATUS, FREEWHEELING_AUTHORIZATION_GEARBOX, GEARBOX_PARK_STATE, EAGB_DRIVE_STATE, EAGB_FAILSAFE_STATE, PEM_FAILSAFE_STATE, SSC_FAULT_STATE, GEARBOX_EMERGENCY_MODE, EAGB_WATER_PUMP_FAULT'
  zh: '当ETAT_BV_FREEWHEELING, FREEWHEELING_AUTHORIZATION_GEARBOX, GEARBOX_PARK_STATE, EAGB_DRIVE_STATE, EAGB_FAILSAFE_STATE, PEM_FAILSAFE_STATE, SSC_FAULT_STATE, GEARBOX_EMERGENCY_MODE, EAGB_WATER_PUMP_FAILURE_STATE状态变化时'
  hu: 'A(z) GEARBOX_FREEWHEELING_STATUS, FREEWHEELING_AUTHORIZATION_GEARBOX, GEARBOX_PARK_STATE, EAGB_DRIVE_STATE, EAGB_FAILSAFE_STATE, PEM_FAILSAFE_STATE, SSC_FAULT_STATE, GEARBOX_EMERGENCY_MODE, EAGB_WATER_PUMP_FAULT állapotváltozásakor'
  pt: 'Na mudança de estado de: GEARBOX_FREEWHEELING_STATUS, FREEWHEELING_AUTHORIZATION_GEARBOX, GEARBOX_PARK_STATE, EAGB_DRIVE_STATE, EAGB_FAILSAFE_STATE, PEM_FAILSAFE_STATE, SSC_FAULT_STATE, GEARBOX_EMERGENCY_MODE, EAGB_WATER_PUMP_FAULT'
periodicity: ['100ms', 'trigger']
senders: ['BVA']
receivers: ['ABS', 'CMM', 'BSI', 'AAS', 'LVNSD', 'VCU']

