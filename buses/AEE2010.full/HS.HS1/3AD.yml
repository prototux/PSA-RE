      de: 'Geschätzte Kraft der elektrischen Feststellbremse (EPB) am hinteren rechten Bremssattel'
      it: 'Stima della forza del freno di stazionamento elettrico (EPB) applicata alla pinza posteriore destra'
      pl: 'Szacowana siła elektrycznego hamulca postojowego (EPB) na tylnym prawym zacisku'
