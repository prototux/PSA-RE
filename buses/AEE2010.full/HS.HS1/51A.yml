id: 0x51A
name: 'LVNSD_OBD_FAULT_STATUS'
type: 'can'
length: 6
comment:
  en: 'OBD fault monitor readiness and status bits from the LVNSD (light-vehicle non-selective diagnostic) module.'
  fr: 'Bits d''état et de disponibilité des moniteurs de défaut OBD issus du module LVNSD (diagnostic non sélectif véhicule léger).'
  es: 'Bits de estado y preparación de los monitores de fallo OBD del módulo LVNSD (diagnóstico no selectivo de vehículo ligero).'
  de: 'Bereitschafts- und Statusbits der OBD-Fehlerüberwachung vom LVNSD-Modul (nicht selektive OBD-Diagnose für Leichtfahrzeuge).'
  it: 'Bit di stato e prontezza dei monitor di guasto OBD dal modulo LVNSD (diagnostica non selettiva per veicoli leggeri).'
  pl: 'Bity gotowości i stanu monitorów usterek OBD z modułu LVNSD (nieselektywna diagnostyka pojazdów lekkich).'
  ru: 'Биты готовности и статуса мониторов неисправностей OBD от модуля LVNSD (неселективная диагностика лёгких транспортных средств).'
  zh: '来自LVNSD(轻型车非选择性诊断)模块的OBD故障监控就绪及状态位。'
  hu: 'Az OBD hibafigyelők készenléti és állapotbitjei az LVNSD (könnyűgépjármű nem szelektív diagnosztikai) modultól.'
  pt: 'Bits de estado e disponibilidade dos monitores de avaria OBD do módulo LVNSD (diagnóstico não seletivo de veículo ligeiro).'
periodicity: ['100ms']
senders: ['LVNSD']
receivers: ['BVA']

signals:
  LVNSD_OBD_FAULT_STATUS_1:
    bits: '1.7-1.6'
    comment:
      en: 'Result of OBD diagnostic test 1 (LVNSD)'
      fr: 'Résultat du test de diagnostic OBD 1 (LVNSD)'
      es: 'Resultado de la prueba de diagnóstico OBD 1 (LVNSD)'
      de: 'Ergebnis des OBD-Diagnosetests 1 (LVNSD)'
      it: 'Risultato del test diagnostico OBD 1 (LVNSD)'
      pl: 'Wynik testu diagnostycznego OBD 1 (LVNSD)'
      ru: 'Результат диагностического теста OBD 1 (LVNSD)'
      zh: 'OBD诊断测试1的结果(LVNSD)'
      hu: 'A(z) 1. OBD diagnosztikai teszt eredménye (LVNSD)'
      pt: 'Resultado do teste de diagnóstico OBD 1 (LVNSD)'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'Diagnostic not concluded'
        fr: 'Diagnostic non statué'
        es: 'Diagnóstico no concluido'
        de: 'Diagnose nicht abgeschlossen'
        it: 'Diagnosi non conclusa'
        pl: 'Diagnostyka niezakończona'
        ru: 'Диагностика не завершена'
        zh: '诊断未完成'
