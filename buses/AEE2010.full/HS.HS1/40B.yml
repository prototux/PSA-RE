id: 0x40B
name: 'SECONDARY_LANE_LINE_DATA'
type: 'can-tp'
comment:
  en: 'Secondary lane line detection data from the camera module (CVM): distance to left/right line and detection type for lane-keeping.'
  fr: 'Données secondaires de détection des lignes de voie issues du module caméra (CVM) : distance aux lignes gauche/droite et type de détection pour l''aide au maintien.'
  es: 'Datos secundarios de detección de las líneas de carril del módulo de cámara (CVM): distancia a las líneas izquierda/derecha y tipo de detección para el mantenimiento de carril.'
  de: 'Sekundäre Fahrspurlinien-Erkennungsdaten vom Kameramodul (CVM): Abstand zur linken/rechten Linie und Erkennungstyp für den Spurhalteassistenten.'
  it: 'Dati secondari di rilevamento delle linee di corsia dal modulo telecamera (CVM): distanza dalle linee sinistra/destra e tipo di rilevamento per il mantenimento di corsia.'
  pl: 'Dodatkowe dane wykrywania linii pasa ruchu z modułu kamery (CVM): odległość do lewej/prawej linii i typ wykrywania dla wspomagania utrzymania pasa.'
  ru: 'Дополнительные данные обнаружения линий полосы модулем камеры (CVM): расстояние до левой/правой линии и тип обнаружения для удержания полосы.'
  zh: '来自摄像头模块(CVM)的辅助车道线检测数据:左右车道线距离及用于车道保持的检测类型。'
  hu: 'Másodlagos sávvonal-érzékelési adatok a kameramodultól (CVM): bal/jobb vonaltávolság és érzékelési típus a sávtartáshoz.'
  pt: 'Dados secundários de deteção das linhas de faixa do módulo de câmara (CVM): distância às linhas esquerda/direita e tipo de deteção para a assistência de manutenção de faixa.'
periodicity: ['50ms']
senders: ['CVM']
receivers: ['BSI']
isotp:
  addressing: 'normal'

signals:
  SECONDARY_LEFT_LINE_DISTANCE:
    bits: '1.7-2.6'
    comment:
      en: 'Distance from the camera to the secondary left line edge'
      fr: 'Distance de la caméra au bord de la ligne secondaire gauche'
      es: 'Distancia de la cámara al borde de la línea secundaria izquierda'
      de: 'Abstand der Kamera zur sekundären linken Linienkante'
      it: 'Distanza della telecamera dal bordo della linea secondaria sinistra'
      pl: 'Odległość kamery od krawędzi drugorzędnej linii lewej'
      ru: 'Расстояние от камеры до края вторичной левой линии'
      zh: '摄像头到次要左侧车道线边缘的距离'
      hu: 'A kamera távolsága a másodlagos bal vonal szélétől'
      pt: 'Distância da câmara à borda da linha secundária esquerda'
    type: 'sint'
    factor: 0.016
    min: -5
    max: 5
    units: 'm'
    invalid: 0x1FF
    default: 0x1FE

  SECONDARY_RIGHT_LINE_DISTANCE:
    bits: '2.5-3.4'
    comment:
      en: 'Distance from the camera to the secondary right line edge'
      fr: 'Distance de la caméra au bord de la ligne secondaire droite'
      es: 'Distancia de la cámara al borde de la línea secundaria derecha'
      de: 'Abstand der Kamera zur sekundären rechten Linienkante'
      it: 'Distanza della telecamera dal bordo della linea secondaria destra'
      pl: 'Odległość kamery od krawędzi drugorzędnej linii prawej'
      ru: 'Расстояние от камеры до края вторичной правой линии'
      zh: '摄像头到次要右侧车道线边缘的距离'
      hu: 'A kamera távolsága a másodlagos jobb vonal szélétől'
      pt: 'Distância da câmara à borda da linha secundária direita'
    type: 'sint'
    factor: 0.016
    min: -5
    max: 5
    units: 'm'
    invalid: 0x1FF
    default: 0x1FE

