      en: 'Horizontal distance to the far-left edge of the detected vehicle in the camera''s field of view (m)'
      fr: 'Distance horizontale du bord extrême gauche du véhicule détecté dans le champ de vision de la caméra (m)'
      es: 'Distancia horizontal del borde extremo izquierdo del vehículo detectado en el campo de visión de la cámara (m)'
      de: 'Horizontalabstand zum äußersten linken Rand des im Kamerasichtfeld erkannten Fahrzeugs (m)'
      it: 'Distanza orizzontale dal bordo estremo sinistro del veicolo rilevato nel campo visivo della telecamera (m)'
      pl: 'Odległość pozioma do skrajnie lewej krawędzi pojazdu wykrytego w polu widzenia kamery (m)'
      ru: 'Горизонтальное расстояние до крайнего левого края обнаруженного автомобиля в поле зрения камеры (м)'
      zh: '摄像头视野中检测到车辆最左边缘的水平距离(m)'
      hu: 'A kamera látómezejében észlelt jármű bal szélének vízszintes távolsága (m)'
      pt: 'Distância horizontal até ao extremo esquerdo do veículo detetado no campo de visão da câmara (m)'
