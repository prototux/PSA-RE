id: 0x7C0
name: 'STEERING_WHEEL_CALIBRATION'
type: 'can'
length: 2
comment:
  en: 'Steering wheel angle calibration data, sent by the ABS/ESP ECU.'
  fr: 'Données de calibration de l''angle volant, envoyées par le calculateur ABS/ESP.'
  es: 'Datos de calibración del ángulo del volante, enviados por la centralita ABS/ESP.'
  de: 'Kalibrierdaten des Lenkradwinkels, gesendet vom ABS/ESP-Steuergerät.'
  it: 'Dati di calibrazione dell''angolo volante, inviati dalla centralina ABS/ESP.'
  pl: 'Dane kalibracji kąta koła kierownicy, wysyłane przez sterownik ABS/ESP.'
  ru: 'Данные калибровки угла поворота рулевого колеса, отправляемые блоком ABS/ESP.'
  zh: '由ABS/ESP控制单元发送的方向盘转角校准数据。'
  hu: 'A kormánykerék-szög kalibrációs adatai, az ABS/ESP vezérlőegység küldi.'
  pt: 'Dados de calibração do ângulo do volante, enviados pela unidade de controlo ABS/ESP.'
observations:
  en: 'a) via the diagnostic line, b) when the ESP detects an inconsistency, c) when the ESP no longer detects an inconsistency'
  fr: 'a) par action sur la ligne diagnostic, b) quand l''ESP détecte une incohérence, c) quand l''ESP ne détecte plus d''incohérence'
  es: 'a) mediante la línea de diagnóstico, b) cuando el ESP detecta una incoherencia, c) cuando el ESP deja de detectar una incoherencia'
  de: 'a) über die Diagnoseleitung, b) wenn das ESP eine Unstimmigkeit erkennt, c) wenn das ESP keine Unstimmigkeit mehr erkennt'
  it: 'a) tramite la linea diagnostica, b) quando l''ESP rileva un''incoerenza, c) quando l''ESP non rileva più un''incoerenza'
  pl: 'a) przez linię diagnostyczną, b) gdy ESP wykryje niespójność, c) gdy ESP przestanie wykrywać niespójność'
  ru: 'a) через диагностическую линию, b) когда ESP обнаруживает несоответствие, c) когда ESP больше не обнаруживает несоответствие'
  zh: 'a) 通过诊断线触发,b) ESP检测到不一致时,c) ESP不再检测到不一致时'
  hu: 'a) a diagnosztikai vonalon keresztül, b) amikor az ESP inkonzisztenciát észlel, c) amikor az ESP már nem észlel inkonzisztenciát'
  pt: 'a) através da linha de diagnóstico, b) quando o ESP deteta uma inconsistência, c) quando o ESP deixa de detetar uma inconsistência'
periodicity: ['trigger']
senders: ['ABS']
receivers: ['CAV']

signals:
  STEERING_ANGLE_SENSOR_DATA_1:
    bits: '1.7-1.4'
    comment:
      en: 'Steering angle sensor data, part 1'
      fr: 'Données du capteur d''angle volant, partie 1'
      es: 'Datos del sensor de ángulo de volante, parte 1'
      de: 'Daten des Lenkwinkelsensors, Teil 1'
      it: 'Dati del sensore angolo sterzo, parte 1'
      pl: 'Dane czujnika kąta skrętu kierownicy, część 1'
      ru: 'Данные датчика угла поворота руля, часть 1'
      zh: '方向盘转角传感器数据，第1部分'
      hu: 'A kormányszög-érzékelő adatainak 1. része'
      pt: 'Dados do sensor de ângulo do volante, parte 1'
    type: 'enum'
    values:
      0x00:
        en: 'If CCW_Vol = invalid / No meaning'
        fr: 'Si CCW_Vol = invalide / Sans signification'
        es: 'Si CCW_Vol = no válido / Sin significado'
        de: 'Wenn CCW_Vol = ungültig / Ohne Bedeutung'
        it: 'Se CCW_Vol = non valido / Senza significato'
        pl: 'Jeśli CCW_Vol = nieprawidłowe / Bez znaczenia'
        ru: 'Если CCW_Vol = недействительно / Без значения'
        zh: '若 CCW_Vol = 无效 / 无意义'
        hu: 'Ha CCW_Vol = érvénytelen / Nincs jelentése'
        pt: 'Se CCW_Vol = inválido / Sem significado'
      0x01:
        en: 'if CCW_vol = inconsistency / Detected failure of S'
        fr: 'Si CCW_Vol = incoherence / Incoherence info Vitesse Volant detectee'
        es: 'Si CCW_Vol = incoherencia / Incoherencia de la información de velocidad del volante detectada'
        de: 'Wenn CCW_Vol = Inkonsistenz / Inkonsistenz der Lenkradgeschwindigkeitsinformation erkannt'
        it: 'Se CCW_Vol = incoerenza / Rilevata incoerenza dell''informazione di velocità del volante'
        pl: 'Jeśli CCW_Vol = niespójność / Wykryto niespójność informacji o prędkości kierownicy'
        ru: 'Если CCW_Vol = несоответствие / обнаружено несоответствие данных скорости руля'
        zh: '若CCW_Vol=不一致/检测到方向盘转速信息不一致'
        hu: 'Ha CCW_Vol = inkonzisztencia / a kormánykerék-sebesség adat inkonzisztenciáját észlelte'
        pt: 'Se CCW_Vol = incoerência / Incoerência da informação de velocidade do volante detetada'
      0x02:
        en: 'If steering angle command word = inconsistent / detected steering angle information failure'
        fr: 'Si mot de commande angle volant = incohérent / défaillance détectée de l''information angle volant'
        es: 'Si palabra de comando de ángulo de volante = incoherente / fallo detectado en la información de ángulo de volante'
        de: 'Wenn Lenkwinkel-Befehlswort = inkonsistent / erkannter Fehler der Lenkwinkelinformation'
        it: 'Se parola di comando angolo sterzo = incoerente / guasto rilevato dell''informazione angolo sterzo'
        pl: 'Jeśli słowo sterujące kąta skrętu kierownicy = niespójne / wykryta usterka informacji o kącie skrętu'
        ru: 'Если управляющее слово угла поворота руля = несогласовано / обнаружена неисправность информации об угле поворота руля'
        zh: '若方向盘转角命令字=不一致/检测到转角信息故障'
        hu: 'Ha a kormányszög-vezérlőszó inkonzisztens / a kormányszög-információ hibáját észlelték'
        pt: 'Se a palavra de comando do ângulo do volante = inconsistente / falha detetada na informação de ângulo do volante'
      0x03:
        en: 'If CCW_Vol = inconsistency / detected failure of steering wheel angle and speed information'
        fr: 'Si CCW_Vol = incohérence / incohérence des informations d''angle et de vitesse volant détectée'
        es: 'Si CCW_Vol = incoherencia / incoherencia detectada en la información de ángulo y velocidad del volante'
        de: 'Wenn CCW_Vol = Inkonsistenz / erkannte Störung der Lenkwinkel- und -geschwindigkeitsinformation'
        it: 'Se CCW_Vol = incoerenza / incoerenza rilevata delle informazioni di angolo e velocità volante'
        pl: 'Jeśli CCW_Vol = niespójność / wykryta niespójność informacji o kącie i prędkości kierownicy'
        ru: 'Если CCW_Vol = несоответствие / обнаружен сбой информации об угле и скорости руля'
        zh: '若CCW_Vol=不一致／检测到方向盘转角与转速信息不一致'
        hu: 'Ha CCW_Vol = inkonzisztencia / a kormányszög- és sebességinformáció észlelt hibája'
        pt: 'Se CCW_Vol = incoerência / falha detetada na informação de ângulo e velocidade do volante'
      0x05:
        en: 'If CCW_Vol = config / bits 3-0 of the steering wheel sensor frame ID (305h)'
        fr: 'Si CCW_Vol = config / bits 3 à 0 de l''ID de la trame capteur angle volant 305h'
        es: 'Si CCW_Vol = config / bits 3 a 0 del ID de la trama del sensor de ángulo del volante 305h'
        de: 'Wenn CCW_Vol = Konfig / Bits 3–0 der ID des Lenkwinkelsensor-Rahmens 305h'
        it: 'Se CCW_Vol = config / bit da 3 a 0 dell''ID della trama del sensore angolo volante 305h'
        pl: 'Jeśli CCW_Vol = config / bity 3-0 identyfikatora ramki czujnika kąta kierownicy 305h'
        ru: 'Если CCW_Vol = config / биты 3-0 идентификатора кадра датчика угла руля 305h'
        zh: '若CCW_Vol=config／方向盘转角传感器帧ID（305h）的第3-0位'
        hu: 'Ha CCW_Vol = config / a kormányszög-érzékelő keretének (305h) 3–0. bitje'
        pt: 'Se CCW_Vol = config / bits 3 a 0 do ID da trama do sensor de ângulo do volante (305h)'

