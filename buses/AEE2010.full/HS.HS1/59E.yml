      zh: '到第1个检测到的交通标志的纵向距离(m)'
      hu: 'Az 1. számú észlelt közúti jelzőtábla hosszirányú távolsága (m)'
      pt: 'Distância longitudinal ao 1.º sinal de trânsito detetado (m)'
    type: 'uint'
    factor: 0.5
    min: 0
    max: 122
    units: 'm'
    default: 0x00

