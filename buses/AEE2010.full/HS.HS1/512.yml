id: 0x512
name: 'BSI_DRIVE_MODE_REQUESTS'
type: 'can'
length: 4
comment:
  en: 'Requests from the BSI: cabin thermal preconditioning and type, vehicle locked-in/locked-out status, and drive axle/dynamic/energy mode selection.'
  fr: 'Demandes de la BSI : préconditionnement thermique habitacle et son type, statut véhicule verrouillé dedans/dehors, et sélection du mode d''essieu moteur/dynamique/énergie.'
  es: 'Solicitudes de la BSI: precondicionamiento térmico del habitáculo y su tipo, estado de vehículo bloqueado dentro/fuera, y selección de modo de eje motriz/dinámico/energía.'
  de: 'Anforderungen des BSI: thermische Vorkonditionierung des Innenraums und deren Typ, Status Fahrzeug innen/außen verriegelt, sowie Auswahl des Antriebsachsen-/Fahrdynamik-/Energiemodus.'
  it: 'Richieste della BSI: precondizionamento termico dell''abitacolo e relativo tipo, stato veicolo bloccato dentro/fuori, e selezione della modalità asse motore/dinamica/energia.'
  pl: 'Żądania z BSI: wstępna klimatyzacja kabiny i jej typ, status pojazdu zablokowanego wewnątrz/na zewnątrz oraz wybór trybu osi napędowej/dynamiki/energii.'
  ru: 'Запросы от BSI: тепловое предварительное кондиционирование салона и его тип, статус блокировки автомобиля изнутри/снаружи, а также выбор режима ведущего моста/динамики/энергии.'
  zh: 'BSI的请求:座舱热预处理及其类型、车辆内/外锁定状态,以及驱动桥/动态/能量模式选择。'
  hu: 'A BSI kérései: utastér termikus előkondicionálása és típusa, jármű belülről/kívülről zárt állapota, valamint a hajtott tengely/dinamika/energia üzemmód kiválasztása.'
  pt: 'Pedidos da BSI: pré-condicionamento térmico do habitáculo e tipo, estado de veículo trancado por dentro/por fora, e seleção do modo de eixo motor/dinâmico/energia.'
observations:
  en: 'On state change of: DYNAMIC_DRIVE_MODE_REQUEST, ENERGY_MODE_REQUEST, DRIVE_AXLE_MODE_REQUEST, VEHICLE_LOCKED_FROM_INSIDE, VEHICLE_LOCKED_FROM_OUTSIDE'
  fr: 'Sur changement d''état de : DYNAMIC_DRIVE_MODE_REQUEST, ENERGY_MODE_REQUEST, DRIVE_AXLE_MODE_REQUEST, VEHICLE_LOCKED_FROM_INSIDE, VEHICLE_LOCKED_FROM_OUTSIDE'
  es: 'Al cambiar el estado de: DYNAMIC_DRIVE_MODE_REQUEST, ENERGY_MODE_REQUEST, DRIVE_AXLE_MODE_REQUEST, VEHICLE_LOCKED_FROM_INSIDE, VEHICLE_LOCKED_FROM_OUTSIDE'
  de: 'Bei Statusänderung von: DYNAMIC_DRIVE_MODE_REQUEST, ENERGY_MODE_REQUEST, DRIVE_AXLE_MODE_REQUEST, VEHICLE_LOCKED_FROM_INSIDE, VEHICLE_LOCKED_FROM_OUTSIDE'
  it: 'Al cambiamento di stato di: DYNAMIC_DRIVE_MODE_REQUEST, ENERGY_MODE_REQUEST, DRIVE_AXLE_MODE_REQUEST, VEHICLE_LOCKED_FROM_INSIDE, VEHICLE_LOCKED_FROM_OUTSIDE'
  pl: 'Wysyłane przy zmianie stanu: DYNAMIC_DRIVE_MODE_REQUEST, ENERGY_MODE_REQUEST, DRIVE_AXLE_MODE_REQUEST, VEHICLE_LOCKED_FROM_INSIDE, VEHICLE_LOCKED_FROM_OUTSIDE'
  ru: 'При изменении состояния: DYNAMIC_DRIVE_MODE_REQUEST, ENERGY_MODE_REQUEST, DRIVE_AXLE_MODE_REQUEST, VEHICLE_LOCKED_FROM_INSIDE, VEHICLE_LOCKED_FROM_OUTSIDE'
  zh: '当STDE_DRV_DYN_MODE_REQ, ENERGY_MODE_REQUEST, DRIVE_AXLE_MODE_REQUEST, VEHICLE_LOCKED_FROM_INSIDE, LOCKED_VEHICLE_OUT状态变化时'
  hu: 'A(z) DYNAMIC_DRIVE_MODE_REQUEST, ENERGY_MODE_REQUEST, DRIVE_AXLE_MODE_REQUEST, VEHICLE_LOCKED_FROM_INSIDE, VEHICLE_LOCKED_FROM_OUTSIDE állapotváltozásakor'
  pt: 'Na mudança de estado de: DYNAMIC_DRIVE_MODE_REQUEST, ENERGY_MODE_REQUEST, DRIVE_AXLE_MODE_REQUEST, VEHICLE_LOCKED_FROM_INSIDE, VEHICLE_LOCKED_FROM_OUTSIDE'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['VCU', 'E_VCU']

