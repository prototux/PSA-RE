id: 0x32C
name: 'GAS_SYSTEM_DYNAMIC_DATA_2'
type: 'can'
length: 4
comment:
  en: 'Real-time LPG system correction data from the gas ECU: ignition timing, lambda and injection time deltas.'
  fr: 'Données dynamiques du système GPL issues du calculateur gaz : corrections d''avance, de richesse et de temps d''injection.'
  es: 'Datos dinámicos del sistema GLP de la ECU de gas: correcciones de avance, riqueza y tiempo de inyección.'
  de: 'Echtzeit-Korrekturdaten des Flüssiggassystems vom Gassteuergerät: Zündwinkel-, Lambda- und Einspritzzeitkorrekturen.'
  it: 'Dati dinamici del sistema GPL dalla centralina gas: correzioni di anticipo, lambda e tempo di iniezione.'
  pl: 'Dane dynamiczne instalacji LPG ze sterownika gazowego: korekty kąta wyprzedzenia zapłonu, lambda i czasu wtrysku.'
  ru: 'Динамические данные коррекции системы ГБО от блока управления газом: угол опережения, лямбда и время впрыска.'
  zh: '来自燃气控制单元的LPG系统动态修正数据:点火提前角、氧传感器及喷油时间修正量。'
  hu: 'Az LPG-rendszer valós idejű korrekciós adatai a gázvezérlőtől: gyújtásidőzítés, lambda és befecskendezési idő eltérések.'
  pt: 'Dados de correção em tempo real do sistema GPL da unidade de controlo a gás: avanço à ignição, lambda e deltas de tempo de injeção.'
periodicity: ['20ms']
senders: ['GAS']
receivers: ['CMM']

signals:
  LPG_HIGH_PRESSURE:
    bits: '1.7-1.0'
    comment:
      en: 'LPG high pressure'
      fr: 'Haute pression GPL'
      es: 'Alta presión GLP'
      de: 'LPG-Hochdruck'
      it: 'Alta pressione GPL'
      pl: 'Wysokie ciśnienie LPG'
      ru: 'Высокое давление LPG'
      zh: 'LPG高压'
      hu: 'LPG magas nyomás'
      pt: 'Alta pressão de GPL'
    type: 'uint'
    factor: 1
    offset: 2
    min: 2
    max: 250
    units: 'bar'
    invalid: 0xFF
    default: 0x00

  LPG_GAS_TEMPERATURE:
    bits: '2.7-2.0'
    comment:
      en: 'LPG gas temperature'
      fr: 'Température du gaz GPL'
      es: 'Temperatura del gas GLP'
      de: 'LPG-Gastemperatur'
      it: 'Temperatura del gas GPL'
      pl: 'Temperatura gazu LPG'
      ru: 'Температура газа LPG'
      zh: 'LPG燃气温度'
      hu: 'LPG gázhőmérséklet'
      pt: 'Temperatura do gás GPL'
    type: 'uint'
    factor: 1
    offset: -40
    min: -40
    max: 130
    units: '°C'
    invalid: 0xFF
    default: 0x00

  LPG_GAS_PRESSURE:
    bits: '3.7-4.2'
    comment:
      en: 'LPG gas pressure'
      fr: 'Pression du gaz GPL'
      es: 'Presión del gas GLP'
      de: 'LPG-Gasdruck'
      it: 'Pressione del gas GPL'
      pl: 'Ciśnienie gazu LPG'
      ru: 'Давление газа LPG'
      zh: 'LPG燃气压力'
      hu: 'LPG gáznyomás'
      pt: 'Pressão do gás GPL'
    type: 'uint'
    factor: 1
    offset: 500
    min: 500
    max: 5000
    units: 'mbar'
    invalid: 0x3FFF
    default: 0x00
