id: 0x557
name: 'ON_CAN_L_DIAG_RESPONSE'
type: 'can'
length: 8
comment:
  en: 'Diagnostic response relayed onto the CAN bus (L) by a gateway module.'
  fr: 'Réponse de diagnostic relayée sur le réseau CAN (L) par un calculateur passerelle.'
  es: 'Respuesta de diagnóstico retransmitida al bus CAN (L) por un módulo pasarela.'
  de: 'Diagnoseantwort, von einem Gateway-Steuergerät auf den CAN-Bus (L) weitergeleitet.'
  it: 'Risposta di diagnosi inoltrata sul bus CAN (L) da una centralina gateway.'
  pl: 'Odpowiedź diagnostyczna przekazywana na magistrale CAN (L) przez moduł bramy.'
  ru: 'Диагностический ответ, ретранслируемый на шину CAN (L) шлюзовым блоком.'
  zh: '由网关模块转发到CAN总线 (L)的诊断响应。'
  hu: 'Egy átjáró vezérlőegység által a CAN buszra (L) továbbított diagnosztikai válasz.'
  pt: 'Resposta de diagnóstico retransmitida na rede CAN (L) por um módulo gateway.'
observations:
  en: 'Event-triggered, sent from the ECU to the diagnostic tool.'
  fr: 'Événementiel, envoyé de le calculateur vers l''outil de diagnostic.'
  es: 'Basado en eventos, enviado desde la ECU hasta la herramienta de diagnóstico.'
  de: 'Ereignisgesteuert, gesendet von das Steuergerät zu das Diagnosegerät.'
  it: 'Basato su eventi, inviato da la centralina a lo strumento diagnostico.'
  pl: 'Zdarzeniowe, wysyłane z sterownik do narzędzie diagnostyczne.'
  ru: 'Событийное, передаётся от блок управления к диагностический прибор.'
  zh: '事件触发,从该ECU发送到诊断工具。'
  hu: 'Eseményvezérelt, a vezérlőegység-tól a diagnosztikai eszköz felé küldve.'
  pt: 'Baseado em eventos, enviado da unidade de controlo para a ferramenta de diagnóstico.'
periodicity: ['trigger']
senders: ['BCP']
receivers: ['DIAG_TOOL', 'BSI']

signals:
  DIAGNOSTIC_DATA:
    bits: '1.7-8.0'
    comment:
      en: 'Diagnostic data'
      fr: 'Données de diagnostic'
      es: 'Datos de diagnóstico'
      de: 'Diagnosedaten'
      it: 'Dati diagnostici'
      pl: 'Dane diagnostyczne'
      ru: 'Диагностические данные'
      zh: '诊断数据'
      hu: 'Diagnosztikai adatok'
      pt: 'Dados de diagnóstico'
    type: 'uint'
