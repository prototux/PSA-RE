id: 0x1E8
name: 'ENGINE_MEAP_STATUS'
type: 'can'
length: 8
comment:
  en: 'Engine ECU data 3: MEAP command, redemption counter, MEAP actuator software position and rear preparation in progress.'
  fr: 'Données calculateur moteur 3 : commande MEAP, compteur de rachats, position logicielle de l''actionneur MEAP et préparation arrière en cours.'
  es: 'Datos de la centralita del motor 3: comando MEAP, contador de canjes, posición software del actuador MEAP y preparación trasera en curso.'
  de: 'Motorsteuergerät-Daten 3: MEAP-Befehl, Einlösezähler, Software-Position des MEAP-Aktuators und laufende Heckvorbereitung.'
  it: 'Dati della centralina motore 3: comando MEAP, contatore riscatti, posizione software dell''attuatore MEAP e preparazione posteriore in corso.'
  pl: 'Dane sterownika silnika 3: polecenie MEAP, licznik wykupów, pozycja programowa siłownika MEAP i trwające przygotowanie tylne.'
  ru: 'Данные ЭБУ двигателя 3: команда MEAP, счётчик погашений, программная позиция привода MEAP и выполняемая задняя подготовка.'
  zh: '发动机ECU数据3:MEAP命令、兑换计数器、MEAP执行器软件位置和后部准备进行中。'
  hu: 'Motorvezérlő adatok 3: MEAP parancs, beváltásszámláló, a MEAP aktuátor szoftveres pozíciója és folyamatban lévő hátsó előkészítés.'
  pt: 'Dados 3 da unidade de controlo do motor: comando MEAP, contador de resgate, posição de software do atuador MEAP e preparação traseira em curso.'
observations:
  en: 'On state change of: STOP_START_PREPARATION_STATUS, MEAP_SOFTWARE_POSITION'
  fr: 'Sur changement d''état de : STOP_START_PREPARATION_STATUS, MEAP_SOFTWARE_POSITION'
  es: 'Al cambiar el estado de: STOP_START_PREPARATION_STATUS, MEAP_SOFTWARE_POSITION'
  de: 'Bei Statusänderung von: STOP_START_PREPARATION_STATUS, MEAP_SOFTWARE_POSITION'
  it: 'Al cambiamento di stato di: STOP_START_PREPARATION_STATUS, MEAP_SOFTWARE_POSITION'
  pl: 'Wysyłane przy zmianie stanu: STOP_START_PREPARATION_STATUS, MEAP_SOFTWARE_POSITION'
  ru: 'При изменении состояния: STOP_START_PREPARATION_STATUS, MEAP_SOFTWARE_POSITION'
  zh: '当PREPA_AR_EN_COURS, POS_MEAP_SOFT状态变化时'
  hu: 'A(z) STOP_START_PREPARATION_STATUS, MEAP_SOFTWARE_POSITION állapotváltozásakor'
  pt: 'Na mudança de estado de: STOP_START_PREPARATION_STATUS, MEAP_SOFTWARE_POSITION'
periodicity: ['1000ms', 'trigger']
senders: ['CMM']
receivers: ['ABS', 'BSI', 'BVA', 'HCU1', 'SBW']

