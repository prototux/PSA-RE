id: 0x2EC
name: 'IHU_POWER_STAGE_DATA'
type: 'can'
length: 7
comment:
  en: 'LED headlamp power-stage driver data: activation, measured current, resistance and status for each channel.'
  fr: 'Données du driver de puissance du phare LED (IHU) : activation, courant mesuré, résistance et état pour chaque canal.'
  es: 'Datos del driver de potencia del faro LED (IHU): activación, corriente medida, resistencia y estado de cada canal.'
  de: 'Daten der Leistungsendstufe des LED-Scheinwerfers (IHU): Aktivierung, gemessener Strom, Widerstand und Status je Kanal.'
  it: 'Dati dello stadio di potenza del faro LED (IHU): attivazione, corrente misurata, resistenza e stato per ciascun canale.'
  pl: 'Dane stopnia mocy reflektora LED (IHU): aktywacja, mierzony prąd, rezystancja i stan dla każdego kanału.'
  ru: 'Данные силового каскада светодиодной фары (IHU): активация, измеренный ток, сопротивление и статус для каждого канала.'
  zh: 'LED大灯功率级驱动数据:每个通道的激活状态、实测电流、电阻及状态。'
  hu: 'A LED fényszóró teljesítményfokozatának (IHU) adatai: aktiválás, mért áram, ellenállás és állapot csatornánként.'
  pt: 'Dados do andar de potência do driver dos faróis LED: ativação, corrente medida, resistência e estado de cada canal.'
periodicity: ['20ms']
senders: ['IHU']
receivers: ['CMM']

