id: 0x608
name: 'EOBD_PID_DATA'
type: 'can'
length: 8
comment:
  en: 'Engine EOBD diagnostic data; meaning depends on the requested LID/PID.'
  fr: 'Données de diagnostic moteur EOBD ; la signification dépend du LID/PID demandé.'
  es: 'Datos de diagnóstico EOBD del motor; el significado depende del LID/PID solicitado.'
  de: 'EOBD-Diagnosedaten des Motors; die Bedeutung hängt vom angeforderten LID/PID ab.'
  it: 'Dati diagnostici EOBD del motore; il significato dipende dal LID/PID richiesto.'
  pl: 'Dane diagnostyczne silnika EOBD; znaczenie zależy od żądanego LID/PID.'
  ru: 'Диагностические данные двигателя EOBD; значение зависит от запрошенного LID/PID.'
  zh: '发动机EOBD诊断数据;含义取决于所请求的LID/PID。'
  hu: 'Motor EOBD diagnosztikai adatok; a jelentés a kért LID/PID-től függ.'
  pt: 'Dados de diagnóstico EOBD do motor; o significado depende do LID/PID pedido.'
periodicity: ['100ms']
senders: ['CMM']
receivers: ['BVA']

