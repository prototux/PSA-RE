id: 0x5F6
name: 'CAMERA_ADAS_STATUS'
type: 'can'
length: 8
comment:
  en: 'Camera-based ADAS status 2: ACC, AEB, FCW and HBA enabled flags, camera focus fault, driving side and daytime indicator.'
  fr: 'État ADAS caméra 2 : indicateurs d''activation ACC, AEB, FCW et HBA, défaut de mise au point caméra, sens de conduite et indicateur jour.'
  es: 'Estado ADAS de la cámara 2: indicadores de activación ACC, AEB, FCW y HBA, fallo de enfoque de cámara, lado de conducción e indicador diurno.'
  de: 'Kamerabasierter ADAS-Status 2: Aktivierungskennzeichen für ACC, AEB, FCW und HBA, Kamera-Fokusfehler, Fahrseite und Tageslichtanzeige.'
  it: 'Stato ADAS telecamera 2: indicatori di attivazione ACC, AEB, FCW e HBA, guasto messa a fuoco telecamera, lato di guida e indicatore diurno.'
  pl: 'Stan ADAS kamery 2: flagi aktywacji ACC, AEB, FCW i HBA, usterka ostrości kamery, strona ruchu i wskaźnik dzienny.'
  ru: 'Статус ADAS камеры 2: флаги активации ACC, AEB, FCW и HBA, ошибка фокусировки камеры, сторона движения и дневной индикатор.'
  zh: '基于摄像头的ADAS状态2:ACC、AEB、FCW和HBA启用标志、摄像头失焦故障、行驶方向和白天指示。'
  hu: 'Kamera alapú ADAS állapot 2: ACC, AEB, FCW és HBA aktiválási jelzők, kamera fókuszhiba, közlekedési oldal és nappali jelző.'
  pt: 'Estado 2 do ADAS baseado em câmara: indicadores de ativação de ACC, AEB, FCW e HBA, avaria de focagem da câmara, lado de condução e indicador diurno.'
observations:
  en: 'Event-triggered frame with a 40 ms exclusion time, sent on each computation cycle, i.e. every 40/50 ms; set as mixed'
  fr: 'Trame événementielle avec un temps d''exclusion de 40 ms, émise à chaque cycle de calcul, soit toutes les 40/50 ms ; définie en mixte'
  es: 'Trama basada en eventos con un tiempo de exclusión de 40 ms, enviada en cada ciclo de cálculo, es decir cada 40/50 ms; definida como mixta'
  de: 'Ereignisgesteuerter Frame mit 40 ms Sperrzeit, gesendet bei jedem Berechnungszyklus, also alle 40/50 ms; als mixte definiert'
  it: 'Frame basato su eventi con tempo di esclusione di 40 ms, inviato a ogni ciclo di calcolo, ossia ogni 40/50 ms; definito misto'
  pl: 'Ramka zdarzeniowa z 40 ms czasem wykluczenia, wysyłana przy każdym cyklu obliczeniowym, czyli co 40/50 ms; ustawiona jako mieszana'
  ru: 'Событийный кадр с временем исключения 40 мс, отправляется на каждом цикле вычисления, то есть каждые 40/50 мс; задан как смешанный'
  zh: '事件触发帧,排除时间为40毫秒,每个计算周期(即每40/50毫秒)发送;设为混合类型'
  hu: 'Eseményvezérelt keret 40 ms kizárási idővel, minden számítási ciklusban, azaz 40/50 ms-onként küldve; mixte típusúként megadva'
  pt: 'Trama baseada em eventos com um tempo de exclusão de 40 ms, enviada em cada ciclo de cálculo, ou seja, a cada 40/50 ms; definida como mista'
periodicity: ['55ms', 'trigger']
senders: ['CVM']
receivers: ['ARTIV']

