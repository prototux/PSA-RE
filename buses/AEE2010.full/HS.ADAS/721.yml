id: 0x721
name: 'OBJECT09_DATA_2'
type: 'can'
length: 8
comment:
  en: 'Motion status, lane, time-to-collision and turn/brake signals of ADAS-tracked object 09.'
  fr: 'État de mouvement, voie, temps avant collision et signaux clignotant/frein de l''objet 09 suivi par l''ADAS.'
  es: 'Estado de movimiento, carril, tiempo hasta colisión y señales de freno/intermitente del objeto 09 detectado por el ADAS.'
  de: 'Bewegungsstatus, Fahrspur, Zeit bis zur Kollision sowie Brems-/Blinksignale des vom ADAS erkannten Objekts 09.'
  it: 'Stato di movimento, corsia, tempo alla collisione e segnali freno/indicatore dell''oggetto 09 rilevato dall''ADAS.'
  pl: 'Stan ruchu, pas ruchu, czas do kolizji oraz sygnały hamowania/kierunkowskazu obiektu 09 wykrytego przez ADAS.'
  ru: 'Статус движения, полоса, время до столкновения и сигналы торможения/поворота объекта 09, обнаруженного ADAS.'
  zh: 'ADAS探测目标09的运动状态、车道、碰撞时间及刹车/转向灯信号。'
  hu: 'Az ADAS által érzékelt 09. objektum mozgásállapota, sávja, ütközésig hátralévő ideje, valamint fék-/irányjelző jelei.'
  pt: 'Estado de movimento, faixa, tempo até à colisão e sinais de pisca/travão do objeto 09 detetado pelo ADAS.'
observations:
  en: 'Event-triggered frame with a 40 ms exclusion time, sent on each computation cycle, i.e. every 40/50 ms; set as mixed'
  fr: 'Trame événementielle avec un temps d''exclusion de 40 ms, émise à chaque cycle de calcul, soit toutes les 40/50 ms ; définie en mixte'
  es: 'Trama basada en eventos con un tiempo de exclusión de 40 ms, enviada en cada ciclo de cálculo, es decir cada 40/50 ms; definida como mixta'
  de: 'Ereignisgesteuerter Frame mit 40 ms Sperrzeit, gesendet bei jedem Berechnungszyklus, also alle 40/50 ms; als mixte definiert'
  it: 'Frame basato su eventi con tempo di esclusione di 40 ms, inviato a ogni ciclo di calcolo, ossia ogni 40/50 ms; definito misto'
  pl: 'Ramka zdarzeniowa z 40 ms czasem wykluczenia, wysyłana przy każdym cyklu obliczeniowym, czyli co 40/50 ms; ustawiona jako mieszana'
  ru: 'Событийный кадр с временем исключения 40 мс, отправляется на каждом цикле вычисления, то есть каждые 40/50 мс; задан как смешанный'
  zh: '事件触发帧,排除时间为40毫秒,每个计算周期(即每40/50毫秒)发送;设为混合类型'
  hu: 'Eseményvezérelt keret 40 ms kizárási idővel, minden számítási ciklusban, azaz 40/50 ms-onként küldve; mixte típusúként megadva'
  pt: 'Trama baseada em eventos com um tempo de exclusão de 40 ms, enviada em cada ciclo de cálculo, ou seja, a cada 40/50 ms; definida como mista'
periodicity: ['55ms', 'trigger']
senders: ['CVM']
receivers: ['ARTIV']

