  ADAS_OBJECT_9_INVERSE_TTC:
    bits: '1.7-2.6'
    comment:
      en: 'Inverse time-to-collision with tracked object 9.'
      fr: 'Inverse du temps avant collision avec l''objet suivi 9.'
      es: 'Inversa del tiempo hasta la colisión con el objeto seguido 9.'
      de: 'Kehrwert der Zeit bis zur Kollision mit dem verfolgten Objekt 9.'
      it: 'Inverso del tempo alla collisione con l''oggetto tracciato 9.'
      pl: 'Odwrotność czasu do kolizji ze śledzonym obiektem 9.'
      ru: 'Обратная величина времени до столкновения с отслеживаемым объектом 9.'
      zh: '与跟踪目标9的碰撞时间的倒数。'
      hu: 'A(z) 9. követett objektummal való ütközésig hátralévő idő reciproka.'
      pt: 'Inversa do tempo até à colisão com o objeto rastreado 9.'
    type: 'sint'
    factor: 0.015625
    min: -8
    max: 7.9844
    units: 's-1'
    invalid: 0x200

