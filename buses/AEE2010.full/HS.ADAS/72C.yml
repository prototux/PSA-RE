id: 0x72C
name: 'OBJECT12_DATA'
type: 'can'
length: 8
comment:
  en: 'Class, distance, relative speed and angle of ADAS-tracked object 12, sent by the CVM.'
  fr: 'Classe, distance, vitesse relative et angle de l''objet 12 suivi par l''ADAS, envoyés par le CVM.'
  es: 'Clase, distancia, velocidad relativa y ángulo del objeto 12 detectado por el ADAS, enviados por el CVM.'
  de: 'Klasse, Abstand, Relativgeschwindigkeit und Winkel des vom ADAS erkannten Objekts 12, gesendet vom CVM.'
  it: 'Classe, distanza, velocità relativa e angolo dell''oggetto 12 rilevato dall''ADAS, inviati dal CVM.'
  pl: 'Klasa, odległość, prędkość względna i kąt obiektu 12 wykrytego przez ADAS, wysyłane przez CVM.'
  ru: 'Класс, расстояние, относительная скорость и угол объекта 12, обнаруженного системой ADAS, передаются модулем CVM.'
  zh: '由CVM发送的ADAS探测目标12的类别、距离、相对速度和角度。'
  hu: 'Az ADAS által érzékelt 12. objektum osztálya, távolsága, relatív sebessége és szöge, a CVM által küldve.'
  pt: 'Classe, distância, velocidade relativa e ângulo do objeto 12 detetado pelo ADAS, enviados pelo CVM.'
observations:
  en: 'Event-triggered frame with a 40 ms exclusion time, sent on each computation cycle, i.e. every 40/50 ms; set as mixed'
  fr: 'Trame événementielle avec un temps d''exclusion de 40 ms, émise à chaque cycle de calcul, soit toutes les 40/50 ms ; définie en mixte'
  es: 'Trama basada en eventos con un tiempo de exclusión de 40 ms, enviada en cada ciclo de cálculo, es decir cada 40/50 ms; definida como mixta'
  de: 'Ereignisgesteuerter Frame mit 40 ms Sperrzeit, gesendet bei jedem Berechnungszyklus, also alle 40/50 ms; als mixte definiert'
  it: 'Frame basato su eventi con tempo di esclusione di 40 ms, inviato a ogni ciclo di calcolo, ossia ogni 40/50 ms; definito misto'
  pl: 'Ramka zdarzeniowa z 40 ms czasem wykluczenia, wysyłana przy każdym cyklu obliczeniowym, czyli co 40/50 ms; ustawiona jako mieszana'
  ru: 'Событийный кадр с временем исключения 40 мс, отправляется на каждом цикле вычисления, то есть каждые 40/50 мс; задан как смешанный'
  zh: '事件触发帧,排除时间为40毫秒,每个计算周期(即每40/50毫秒)发送;设为混合类型'
  hu: 'Eseményvezérelt keret 40 ms kizárási idővel, minden számítási ciklusban, azaz 40/50 ms-onként küldve; mixte típusúként megadva'
  pt: 'Trama baseada em eventos com um tempo de exclusão de 40 ms, enviada em cada ciclo de cálculo, ou seja, a cada 40/50 ms; definida como mista'
periodicity: ['55ms', 'trigger']
senders: ['CVM']
receivers: ['ARTIV']

signals:
  OBJ12_ID:
    bits: '1.7-1.1'
    comment:
      en: 'Identifier of tracked object 12'
      fr: 'Identifiant de l''objet suivi 12'
      es: 'Identificador del objeto rastreado 12'
      de: 'Kennung des verfolgten Objekts 12'
      it: 'Identificativo dell''oggetto tracciato 12'
      pl: 'Identyfikator śledzonego obiektu 12'
      ru: 'Идентификатор отслеживаемого объекта 12'
      zh: '跟踪对象12的标识符'
      hu: 'A(z) 12. követett objektum azonosítója'
      pt: 'Identificador do objeto rastreado 12'
    type: 'uint'
    min: 0
    max: 127

