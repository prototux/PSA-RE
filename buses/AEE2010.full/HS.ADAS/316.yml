        fr: 'Pas de demande de pilotage UCF'
        es: 'Sin solicitud de control UCF'
        de: 'Keine UCF-Ansteuerungsanforderung'
        it: 'Nessuna richiesta di pilotaggio UCF'
        pl: 'Brak żądania sterowania UCF'
        ru: 'Нет запроса управления UCF'
        zh: '无UCF控制请求'
        hu: 'Nincs UCF vezérlési kérés'
        pt: 'Sem pedido de controlo UCF'
      0x01:
        en: 'UCF control request'
        fr: 'Demande de pilotage UCF'
        es: 'Solicitud de control UCF'
        de: 'UCF-Ansteuerungsanforderung'
        it: 'Richiesta di comando UCF'
        pl: 'Żądanie sterowania UCF'
        ru: 'Запрос управления UCF'
        zh: 'UCF 控制请求'
        hu: 'UCF vezérlési kérés'
        pt: 'Pedido de controlo UCF'

  UNUSED_1:
    bits: '2.6-2.0'
    unused: true
