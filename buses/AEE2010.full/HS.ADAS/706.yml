id: 0x706
name: 'OBJECT02_DATA_3'
type: 'can'
length: 6
comment:
  en: 'Angle measurement quality and rate of change for ADAS-tracked object 02.'
  fr: 'Qualité et vitesse de variation de l''angle mesure pour l''objet 02 suivi par l''ADAS.'
  es: 'Calidad y velocidad de variación del ángulo medido para el objeto 02 detectado por el ADAS.'
  de: 'Qualität und Änderungsrate des gemessenen Winkels für das vom ADAS erkannte Objekt 02.'
  it: 'Qualità e velocità di variazione dell''angolo misurato per l''oggetto 02 rilevato dall''ADAS.'
  pl: 'Jakość i szybkość zmian mierzonego kąta dla obiektu 02 wykrytego przez ADAS.'
  ru: 'Качество и скорость изменения измеренного угла для объекта 02, обнаруженного ADAS.'
  zh: 'ADAS探测目标02的角度测量质量与变化速率。'
  hu: 'Az ADAS által érzékelt 02. objektum mért szögének minősége és változási sebessége.'
  pt: 'Qualidade e velocidade de variação do ângulo medido para o objeto 02 detetado pelo ADAS.'
observations:
  en: 'Event-triggered frame with a 40 ms exclusion time, sent on each computation cycle, i.e. every 40/50 ms; set as mixed'
  fr: 'Trame événementielle avec un temps d''exclusion de 40 ms, émise à chaque cycle de calcul, soit toutes les 40/50 ms ; définie en mixte'
  es: 'Trama basada en eventos con un tiempo de exclusión de 40 ms, enviada en cada ciclo de cálculo, es decir cada 40/50 ms; definida como mixta'
  de: 'Ereignisgesteuerter Frame mit 40 ms Sperrzeit, gesendet bei jedem Berechnungszyklus, also alle 40/50 ms; als mixte definiert'
  it: 'Frame basato su eventi con tempo di esclusione di 40 ms, inviato a ogni ciclo di calcolo, ossia ogni 40/50 ms; definito misto'
  pl: 'Ramka zdarzeniowa z 40 ms czasem wykluczenia, wysyłana przy każdym cyklu obliczeniowym, czyli co 40/50 ms; ustawiona jako mieszana'
  ru: 'Событийный кадр с временем исключения 40 мс, отправляется на каждом цикле вычисления, то есть каждые 40/50 мс; задан как смешанный'
  zh: '事件触发帧,排除时间为40毫秒,每个计算周期(即每40/50毫秒)发送;设为混合类型'
  hu: 'Eseményvezérelt keret 40 ms kizárási idővel, minden számítási ciklusban, azaz 40/50 ms-onként küldve; mixte típusúként megadva'
  pt: 'Trama baseada em eventos com um tempo de exclusão de 40 ms, enviada em cada ciclo de cálculo, ou seja, a cada 40/50 ms; definida como mista'
periodicity: ['55ms', 'trigger']
senders: ['CVM']
receivers: ['ARTIV']

signals:
  ADAS_OBJECT_2_LEFT_ANGLE_STD:
    bits: '1.7-1.0'
    comment:
      en: 'Standard deviation of the left angle of tracked object 2.'
      fr: 'Écart type de l''angle gauche de l''objet suivi 2.'
      es: 'Desviación estándar del ángulo izquierdo del objeto seguido 2.'
      de: 'Standardabweichung des linken Winkels des verfolgten Objekts 2.'
      it: 'Deviazione standard dell''angolo sinistro dell''oggetto tracciato 2.'
      pl: 'Odchylenie standardowe lewego kąta śledzonego obiektu 2.'
      ru: 'Среднеквадратичное отклонение левого угла отслеживаемого объекта 2.'
      zh: '跟踪目标2左侧角度的标准差。'
      hu: 'A(z) 2. követett objektum bal szögének szórása.'
      pt: 'Desvio padrão do ângulo esquerdo do objeto rastreado 2.'
    type: 'uint'
    factor: 0.0002
    min: 0
    max: 0.051
    units: 'rad'
    default: 0x00

  ADAS_OBJECT_2_RIGHT_ANGLE_STD:
    bits: '2.7-2.0'
    comment:
      en: 'Standard deviation of the right angle of tracked object 2.'
      fr: 'Écart type de l''angle droit de l''objet suivi 2.'
      es: 'Desviación estándar del ángulo derecho del objeto seguido 2.'
      de: 'Standardabweichung des rechten Winkels des verfolgten Objekts 2.'
      it: 'Deviazione standard dell''angolo destro dell''oggetto tracciato 2.'
      pl: 'Odchylenie standardowe prawego kąta śledzonego obiektu 2.'
      ru: 'Среднеквадратичное отклонение правого угла отслеживаемого объекта 2.'
      zh: '跟踪目标2右侧角度的标准差。'
      hu: 'A(z) 2. követett objektum jobb szögének szórása.'
      pt: 'Desvio padrão do ângulo direito do objeto rastreado 2.'
    type: 'uint'
    factor: 0.0002
    min: 0
    max: 0.051
    units: 'rad'
    default: 0x00

  ADAS_OBJECT_2_LEFT_ANGLE_SPEED:
