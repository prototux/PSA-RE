id: 0x336
name: 'CAMERA_STEERING_BRAKE_DATA'
type: 'can'
length: 5
comment:
  en: 'Steering-wheel angle, reconstructed brake-pedal press and master-cylinder pressure, as seen by the driver-assistance camera.'
  fr: 'Angle volant, appui pédale de frein reconstruit et pression du maître-cylindre, tels que vus par la caméra d''aide à la conduite.'
  es: 'Ángulo de volante, pulsación de pedal de freno reconstruida y presión del cilindro maestro, según la cámara de asistencia a la conducción.'
  de: 'Lenkradwinkel, rekonstruierte Bremspedalbetätigung und Hauptbremszylinderdruck, wie von der Fahrassistenzkamera erfasst.'
  it: 'Angolo volante, pressione del pedale freno ricostruita e pressione del cilindro maestro, rilevati dalla telecamera di assistenza alla guida.'
  pl: 'Kąt skrętu kierownicy, odtworzone naciśnięcie pedału hamulca i ciśnienie w pompie hamulcowej, wg kamery systemu wspomagania kierowcy.'
  ru: 'Угол поворота руля, восстановленное нажатие педали тормоза и давление в главном тормозном цилиндре, по данным камеры помощи водителю.'
  zh: '方向盘转角、重建的制动踏板按压情况及主缸压力,由驾驶辅助摄像头提供。'
  hu: 'Kormányszög, rekonstruált fékpedál-nyomás és főfékhenger-nyomás, a vezetéstámogató kamera adatai alapján.'
  pt: 'Ângulo do volante, pressão do pedal do travão reconstruída e pressão do cilindro mestre, tal como vistos pela câmara de assistência à condução.'
periodicity: ['20ms']
senders: ['ARTIV']
receivers: ['CVM']

signals:
  STEERING_WHEEL_ANGLE:
    bits: '1.7-2.0'
    comment:
      en: 'Steering wheel angle'
      fr: 'Angle du volant'
      es: 'Ángulo del volante'
      de: 'Lenkradwinkel'
      it: 'Angolo del volante'
      pl: 'Kąt skrętu kierownicy'
      ru: 'Угол поворота рулевого колеса'
      zh: '方向盘转角'
      hu: 'A kormánykerék szöge'
      pt: 'Ângulo do volante'
    type: 'sint'
    factor: 0.1
    min: -780
    max: 780
    units: '°'
    invalid: 0x7FFF
    default: 0x00

  STEERING_WHEEL_ANGLE_SENSOR_FAULT_CODE:
    bits: '3.7-3.4'
    comment:
      en: 'Steering wheel angle sensor fault code'
      fr: 'Code défaut du capteur d''angle volant'
      es: 'Código de fallo del sensor de ángulo del volante'
      de: 'Fehlercode des Lenkradwinkelsensors'
      it: 'Codice di guasto del sensore dell''angolo del volante'
      pl: 'Kod usterki czujnika kąta skrętu kierownicy'
      ru: 'Код неисправности датчика угла поворота руля'
      zh: '方向盘角度传感器故障代码'
      hu: 'A kormánykerékszög-érzékelő hibakódja'
      pt: 'Código de falha do sensor de ângulo do volante'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'No fault, or fault no longer present'
        fr: 'Pas ou plus de défaut'
        es: 'Sin fallo, o fallo ya no presente'
        de: 'Kein Fehler bzw. Fehler nicht mehr vorhanden'
        it: 'Nessun guasto o guasto non più presente'
        pl: 'Brak usterki lub usterka już nieobecna'
        ru: 'Нет неисправности или неисправность больше не присутствует'
        zh: '无故障或故障已消失'
        hu: 'Nincs hiba, vagy a hiba már nem áll fenn'
        pt: 'Sem falha, ou falha já não presente'
      0x01:
        en: 'Inconsistency detected by ESP on steering wheel rotation speed information'
        fr: 'Incohérence détectée par l''ESP sur l''information de vitesse de rotation du volant'
        es: 'Incoherencia detectada por el ESP en la información de velocidad de rotación del volante'
        de: 'Von ESP erkannte Unstimmigkeit bei der Lenkraddrehzahlinformation'
        it: 'Incoerenza rilevata dall''ESP sull''informazione di velocità di rotazione del volante'
        pl: 'Niespójność wykryta przez ESP w informacji o prędkości obrotowej kierownicy'
        ru: 'Несоответствие, обнаруженное ESP в информации о скорости вращения руля'
        zh: 'ESP检测到方向盘转速信息不一致'
        hu: 'Az ESP által észlelt inkonzisztencia a kormánykerék forgási sebesség-adatában'
        pt: 'Inconsistência detetada pelo ESP na informação de velocidade de rotação do volante'
      0x02:
        en: 'Inconsistency detected by ESP on steering-wheel angle info (if sensor state and calibration OK)'
        fr: 'Incohérence détectée par l''ESP sur l''info d''angle volant (si état capteur et calibration OK)'
        es: 'Incoherencia detectada por el ESP en la información del ángulo del volante (si el estado del sensor y la calibración son correctos)'
        de: 'Von ESP erkannte Unstimmigkeit bei Lenkradwinkelinfo (bei OK-Sensorstatus und -kalibrierung)'
        it: 'Incoerenza rilevata dall''ESP sulle informazioni dell''angolo del volante (se stato sensore e calibrazione OK)'
        pl: 'Niespójność wykryta przez ESP w informacji o kącie kierownicy (jeśli stan czujnika i kalibracja są OK)'
        ru: 'Несоответствие, обнаруженное ESP по углу руля (если состояние датчика и калибровка в норме)'
        zh: 'ESP检测到方向盘转角信息不一致(若传感器状态与标定正常)'
        hu: 'Az ESP inkonzisztenciát észlelt a kormánykerék-szög adatokban (ha az érzékelő állapota és kalibrációja rendben van)'
        pt: 'Inconsistência detetada pelo ESP na informação do ângulo do volante (se estado do sensor e calibração OK)'
      0x03:
        en: 'Inconsistency detected by ESP on steering-wheel angle and rotation speed'
        fr: 'Incohérence détectée par l''ESP sur l''angle et la vitesse de rotation du volant'
        es: 'Incoherencia detectada por el ESP en el ángulo y la velocidad de rotación del volante'
        de: 'Vom ESP erkannte Inkonsistenz bei Lenkwinkel und Drehgeschwindigkeit'
        it: 'Incoerenza rilevata dall''ESP sull''angolo e la velocità di rotazione del volante'
        pl: 'Niespójność wykryta przez ESP w kącie i prędkości obrotu kierownicy'
        ru: 'Несоответствие, обнаруженное ESP по углу и скорости вращения руля'
        zh: 'ESP检测到方向盘角度与转速不一致'
        hu: 'Az ESP inkonzisztenciát észlelt a kormányszög és a forgási sebesség között'
        pt: 'Inconsistência detetada pelo ESP no ângulo e na velocidade de rotação do volante'
      0x0C:
        en: 'Internal faults detected by the steering wheel angle sensor (if Etat_capt_vol and Calibration_vol = 0)'
        fr: 'Défauts internes détectés par le capteur d''angle volant (si État_capt_vol et Calibration_vol = 0)'
        es: 'Fallos internos detectados por el sensor de ángulo de volante (si Etat_capt_vol y Calibration_vol = 0)'
        de: 'Interne Fehler, erkannt vom Lenkradwinkelsensor (wenn Etat_capt_vol und Calibration_vol = 0)'
        it: 'Guasti interni rilevati dal sensore angolo volante (se Etat_capt_vol e Calibration_vol = 0)'
        pl: 'Usterki wewnętrzne wykryte przez czujnik kąta koła kierownicy (jeśli Etat_capt_vol i Calibration_vol = 0)'
        ru: 'Внутренние неисправности, обнаруженные датчиком угла поворота руля (если Etat_capt_vol и Calibration_vol = 0)'
        zh: '方向盘转角传感器检测到内部故障(若Etat_capt_vol和Calibration_vol=0)'
        hu: 'A kormányszög-érzékelő által észlelt belső hibák (ha Etat_capt_vol és Calibration_vol = 0)'
        pt: 'Avarias internas detetadas pelo sensor de ângulo do volante (se Etat_capt_vol e Calibration_vol = 0)'

  STEERING_WHEEL_ANGLE_SENSOR_STATUS:
    bits: '3.3'
    comment:
      en: 'Internal status of the steering wheel angle sensor'
      fr: 'Statut interne du capteur d''angle volant'
      es: 'Estado interno del sensor de ángulo del volante'
      de: 'Interner Status des Lenkradwinkelsensors'
      it: 'Stato interno del sensore dell''angolo del volante'
      pl: 'Stan wewnętrzny czujnika kąta skrętu kierownicy'
      ru: 'Внутреннее состояние датчика угла поворота руля'
      zh: '方向盘角度传感器内部状态'
      hu: 'A kormánykerékszög-érzékelő belső állapota'
      pt: 'Estado interno do sensor de ângulo do volante'
    type: 'bool'
    default: 0x01
    values:
      0x00:
        en: 'Sensor faulty'
        fr: 'Capteur en défaut'
        es: 'Sensor defectuoso'
        de: 'Sensor fehlerhaft'
        it: 'Sensore guasto'
        pl: 'Uszkodzony czujnik'
        ru: 'Датчик неисправен'
        zh: '传感器故障'
        hu: 'Az érzékelő hibás'
        pt: 'Sensor com falha'
      0x01:
        en: 'Sensor OK'
        fr: 'Capteur OK'
        es: 'Sensor OK'
        de: 'Sensor OK'
        it: 'Sensore OK'
        pl: 'Czujnik OK'
        ru: 'Датчик исправен'
        zh: '传感器正常'
        hu: 'Érzékelő rendben'
        pt: 'Sensor OK'

  BRAKE_PEDAL_PRESS_RECONSTRUCTED:
    bits: '3.2-3.1'
    comment:
      en: 'Reconstructed brake pedal press'
      fr: 'Appui sur la pédale de frein reconstruit'
      es: 'Pulsación del pedal de freno reconstruida'
      de: 'Rekonstruierte Bremspedalbetätigung'
      it: 'Pressione del pedale del freno ricostruita'
      pl: 'Zrekonstruowane naciśnięcie pedału hamulca'
      ru: 'Восстановленное нажатие педали тормоза'
      zh: '重建的刹车踏板按下状态'
      hu: 'Rekonstruált fékpedál-benyomás'
      pt: 'Pressão do pedal de travão reconstruída'
    type: 'enum'
    default: 0x01
    values:
      0x00:
        en: 'Reconstructed brake pedal press signal faulty'
        fr: 'Signal reconstruit d''appui frein hors service'
        es: 'Señal reconstruida de pulsación de freno averiada'
        de: 'Rekonstruiertes Bremspedal-Betätigungssignal fehlerhaft'
        it: 'Segnale ricostruito di pressione del pedale freno guasto'
        pl: 'Odtworzony sygnał naciśnięcia pedału hamulca uszkodzony'
        ru: 'Восстановленный сигнал нажатия педали тормоза неисправен'
        zh: '重建的刹车踏板按压信号故障'
        hu: 'Az újraépített fékpedál-nyomás jel hibás'
        pt: 'Sinal de pressão do pedal do travão reconstruído avariado'
      0x01:
        en: 'No brake pedal press'
        fr: 'Pas d''appui sur la pédale de frein'
        es: 'Sin pulsación del pedal de freno'
        de: 'Kein Bremspedaldruck'
        it: 'Nessuna pressione sul pedale del freno'
        pl: 'Brak naciśnięcia pedału hamulca'
        ru: 'Нет нажатия на педаль тормоза'
        zh: '未踩下刹车踏板'
        hu: 'Nincs fékpedál-nyomás'
        pt: 'Sem pressão no pedal do travão'
      0x02:
        en: 'Brake pedal pressed'
        fr: 'Appui pédale de frein'
        es: 'Pulsación del pedal de freno'
        de: 'Bremspedal betätigt'
        it: 'Pressione del pedale del freno'
        pl: 'Naciśnięcie pedału hamulca'
        ru: 'Нажатие педали тормоза'
        zh: '刹车踏板按下'
        hu: 'Fékpedál megnyomva'
        pt: 'Pedal do travão premido'
      0x03:
        unused: true

  UNUSED_1:
    bits: '3.0'
    unused: true

  MASTER_CYLINDER_PRESSURE:
    bits: '4.7-5.4'
    comment:
      en: 'Master cylinder pressure'
      fr: 'Pression du maître-cylindre'
      es: 'Presión del cilindro maestro'
      de: 'Hauptbremszylinderdruck'
      it: 'Pressione del cilindro maestro'
      pl: 'Ciśnienie w pompie hamulcowej głównej'
      ru: 'Давление в главном тормозном цилиндре'
      zh: '制动主缸压力'
      hu: 'Főfékhenger nyomása'
      pt: 'Pressão do cilindro mestre'
    type: 'uint'
    factor: 0.1
    offset: -55
    min: -55
    max: 354.4
    units: 'bar'
    invalid: 0xFFF
    default: 0x226

  UNUSED_2:
    bits: '5.3-5.0'
    unused: true
