id: 0x3C9
name: 'AMT_DYNAMIC_DATA_2_V2'
type: 'can'
length: 8
comment:
  en: 'Automated manual gearbox dynamic data 2, version 2: maximum transmissible clutch torque, target ratio, extended gearbox input speed and transmitted-torque resolution.'
  fr: 'Données dynamiques 2 de la boîte pilotée, version 2 : couple max transmissible par l''embrayage, rapport cible, régime d''entrée boîte étendu et résolution du couple émis.'
  es: 'Datos dinámicos 2 de la caja pilotada, versión 2: par máximo transmisible por el embrague, marcha objetivo, régimen de entrada de caja extendido y resolución del par transmitido.'
  de: 'Dynamikdaten 2 des automatisierten Schaltgetriebes, Version 2: maximal übertragbares Kupplungsmoment, Zielübersetzung, erweiterte Getriebeeingangsdrehzahl und Auflösung des übertragenen Drehmoments.'
  it: 'Dati dinamici 2 del cambio robotizzato, versione 2: coppia massima trasmissibile dalla frizione, marcia obiettivo, regime di ingresso cambio esteso e risoluzione della coppia trasmessa.'
  pl: 'Dane dynamiczne 2 skrzyni zautomatyzowanej, wersja 2: maksymalny moment przenoszony przez sprzęgło, bieg docelowy, rozszerzone obroty wejściowe skrzyni i rozdzielczość przekazywanego momentu.'
  ru: 'Динамические данные 2 роботизированной коробки, версия 2: максимальный передаваемый момент сцепления, целевая передача, расширенная входная скорость коробки и разрешение передаваемого момента.'
  zh: '自动手动变速箱动态数据2,版本2:离合器最大可传递扭矩、目标挡位、扩展变速箱输入转速和传递扭矩分辨率。'
  hu: 'Az automatizált manuális váltó dinamikus adatai 2, 2. verzió: a kuplung által átvihető maximális nyomaték, célfokozat, kiterjesztett váltó bemeneti fordulatszám és az átvitt nyomaték felbontása.'
  pt: 'Dados dinâmicos 2 da caixa de velocidades pilotada, versão 2: binário máximo transmissível pela embraiagem, relação-alvo, velocidade de entrada da caixa estendida e resolução do binário transmitido.'
periodicity: ['10ms']
senders: ['BSM', 'CVM']
receivers: ['ARTIV']

signals:
  MAX_CLUTCH_TORQUE:
    bits: '1.7-1.0'
    comment:
      en: 'Maximum torque transmissible by the clutch'
      fr: 'Couple maximum transmissible par l''embrayage'
      es: 'Par máximo transmisible por el embrague'
      de: 'Maximal übertragbares Drehmoment der Kupplung'
      it: 'Coppia massima trasmissibile dalla frizione'
      pl: 'Maksymalny moment obrotowy przenoszony przez sprzęgło'
      ru: 'Максимальный момент, передаваемый сцеплением'
      zh: '离合器可传递的最大扭矩'
      hu: 'A kuplung által átvihető maximális nyomaték'
      pt: 'Binário máximo transmissível pela embraiagem'
    type: 'uint'
    factor: 2
    offset: -100
    min: -100
    max: 408
    units: 'Nm'
    invalid: 0xFF
    default: 0x32

