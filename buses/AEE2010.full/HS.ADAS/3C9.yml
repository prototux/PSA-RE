        fr: 'Défaut'
        es: 'Fallo'
        de: 'Fehler'
        it: 'Guasto'
        pl: 'Usterka'
        ru: 'Неисправность'
        zh: '故障'
        hu: 'Hiba'
        pt: 'Falha'
