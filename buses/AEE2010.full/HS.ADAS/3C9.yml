        it: 'Inibita (attivazione xVV non possibile)'
        pl: 'Zablokowana (aktywacja xVV niemożliwa)'
        ru: 'Заблокировано (активация xVV невозможна)'
        zh: '已禁用（无法激活xVV）'
        hu: 'Letiltva (az xVV aktiválása nem lehetséges)'
        pt: 'Inibida (ativação do xVV impossível)'
      0x01:
        en: 'Standby (automatic gearbox available for powertrain-controlled shift)'
        fr: 'Attente (boîte automatique disponible pour commande par le GMP)'
        es: 'Espera (caja automática disponible para mando del grupo motopropulsor)'
        de: 'Standby (Automatikgetriebe für Antriebsstrangsteuerung verfügbar)'
        it: 'Attesa (cambio automatico disponibile per comando del gruppo motopropulsore)'
        pl: 'Oczekiwanie (skrzynia automatyczna dostępna do sterowania przez zespół napędowy)'
        ru: 'Ожидание (АКПП доступна для управления от силового агрегата)'
        zh: '待机(自动变速箱可供动力总成控制换挡)'
        hu: 'Készenlét (az automata váltó elérhető a hajtáslánc-vezérelt váltáshoz)'
        pt: 'Standby (caixa automática disponível para mudança controlada pelo grupo motopropulsor)'
      0x02:
        en: 'Active (control request recorded by the automatic gearbox)'
        fr: 'Active (demande de pilotage enregistrée par la boîte de vitesses automatique)'
        es: 'Activa (solicitud de control registrada por la caja de cambios automática)'
        de: 'Aktiv (Steueranforderung vom Automatikgetriebe erfasst)'
        it: 'Attiva (richiesta di controllo registrata dal cambio automatico)'
        pl: 'Aktywna (żądanie sterowania zarejestrowane przez automatyczną skrzynię biegów)'
        ru: 'Активно (запрос управления зарегистрирован автоматической коробкой передач)'
        zh: '激活(自动变速箱已记录控制请求)'
        hu: 'Aktív (a vezérlési kérést az automata váltó rögzítette)'
        pt: 'Ativo (pedido de controlo registado pela caixa automática)'
      0x03:
