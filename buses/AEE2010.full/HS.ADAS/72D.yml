      de: 'Kehrwert der Zeit bis zur Kollision mit dem verfolgten Objekt 12 (s-1)'
      it: 'Inverso del tempo alla collisione con l''oggetto tracciato 12 (s-1)'
      pl: 'Odwrotność czasu do kolizji ze śledzonym obiektem 12 (s-1)'
