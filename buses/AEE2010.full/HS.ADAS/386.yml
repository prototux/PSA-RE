id: 0x386
name: 'VEHICLE_DYNAMICS_REGULATION_STATUS'
type: 'can'
length: 3
comment:
  en: 'Vehicle dynamics regulation status from the radar/ESP node: ABS/ASR/ESP regulation flags, travel direction and raw yaw rate.'
  fr: 'État de régulation dynamique du véhicule depuis le module radar/ESP : indicateurs de régulation ABS/ASR/ESP, sens de déplacement et vitesse de lacet brute.'
  es: 'Estado de regulación dinámica del vehículo desde el módulo radar/ESP: indicadores de regulación ABS/ASR/ESP, sentido de marcha y velocidad de guiñada bruta.'
  de: 'Fahrdynamik-Regelstatus vom Radar-/ESP-Modul: ABS-/ASR-/ESP-Regelkennzeichen, Fahrtrichtung und rohe Gierrate.'
  it: 'Stato di regolazione dinamica del veicolo dal modulo radar/ESP: indicatori di regolazione ABS/ASR/ESP, senso di marcia e velocità di imbardata grezza.'
  pl: 'Stan regulacji dynamiki pojazdu z modułu radaru/ESP: flagi regulacji ABS/ASR/ESP, kierunek jazdy i surowa prędkość odchylenia.'
  ru: 'Статус регулирования динамики автомобиля от модуля радара/ESP: флаги регулирования ABS/ASR/ESP, направление движения и необработанная скорость рыскания.'
  zh: '来自雷达/ESP模块的车辆动态调节状态:ABS/ASR/ESP调节标志、行驶方向和原始横摆角速度。'
  hu: 'Jármű dinamikai szabályozási állapot a radar-/ESP modultól: ABS/ASR/ESP szabályozási jelzők, haladási irány és nyers legyezőszög-sebesség.'
  pt: 'Estado de regulação da dinâmica do veículo do nó radar/ESP: indicadores de regulação ABS/ASR/ESP, sentido de marcha e velocidade de guinada em bruto.'
periodicity: ['40ms']
senders: ['ARTIV']
receivers: ['CVM']

signals:
  RAW_YAW_RATE:
    bits: '1.7-2.4'
    comment:
      en: 'Raw yaw rate (12-bit)'
      fr: 'Vitesse de lacet brute (12 bits)'
      es: 'Velocidad de guiñada bruta (12 bits)'
      de: 'Roher Gierratenwert (12 Bit)'
      it: 'Velocità di imbardata grezza (12 bit)'
      pl: 'Surowa prędkość odchylania (12 bitów)'
      ru: 'Необработанная скорость рыскания (12 бит)'
      zh: '原始横摆角速度(12位)'
      hu: 'Nyers legyezési szögsebesség (12 bit)'
      pt: 'Velocidade de guinada bruta (12 bits)'
    type: 'uint'
    factor: 0.08
    offset: -163.84
    min: -163.84
    max: 163.68
    units: '°/s'
    invalid: 0xFFF
    default: 0x800

  VEHICLE_DIRECTION:
    bits: '2.3-2.2'
    comment:
      en: 'Vehicle direction of travel'
      fr: 'Sens de roulage du véhicule'
      es: 'Sentido de marcha del vehículo'
      de: 'Fahrtrichtung des Fahrzeugs'
      it: 'Senso di marcia del veicolo'
      pl: 'Kierunek jazdy pojazdu'
      ru: 'Направление движения автомобиля'
