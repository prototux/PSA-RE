        it: 'Verso il retro'
        pl: 'Do tyłu'
        ru: 'Назад'
        zh: '朝向后方'
        hu: 'Hátrafelé'
        pt: 'Para trás'
      0x03:
        en: 'Invalid'
        fr: 'Invalide'
        es: 'Inválido'
        de: 'Ungültig'
        it: 'Non valido'
        pl: 'Nieprawidłowe'
        ru: 'Недействительно'
