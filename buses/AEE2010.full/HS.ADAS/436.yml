id: 0x436
name: 'OBJECT_LIST_HEADER'
type: 'can'
length: 6
comment:
  en: 'Summary of ADAS-tracked objects: count, closest in-path vehicle, cut-in and pedestrian/cyclist alerts.'
  fr: 'Résumé des objets suivis par l''ADAS : nombre, véhicule le plus proche dans la voie, alertes d''insertion et de piéton/cycliste.'
  es: 'Resumen de los objetos detectados por el ADAS: número, vehículo más cercano en el carril, alertas de intrusión y de peatón/ciclista.'
  de: 'Zusammenfassung der vom ADAS erkannten Objekte: Anzahl, nächstes Fahrzeug in der Spur, Einscher- und Fußgänger-/Radfahrer-Warnungen.'
  it: 'Riepilogo degli oggetti rilevati dall''ADAS: numero, veicolo più vicino nella corsia, allarmi di inserimento e pedone/ciclista.'
  pl: 'Podsumowanie obiektów wykrytych przez ADAS: liczba, najbliższy pojazd na pasie, alerty wjazdu i pieszego/rowerzysty.'
  ru: 'Сводка объектов, обнаруженных ADAS: количество, ближайший автомобиль в полосе, предупреждения о подрезании и пешеходе/велосипедисте.'
  zh: 'ADAS探测目标汇总:数量、本车道最近车辆、加塞及行人/骑行者预警。'
  hu: 'Az ADAS által érzékelt objektumok összesítése: darabszám, legközelebbi sávbeli jármű, besorolási és gyalogos-/kerékpáros-riasztások.'
  pt: 'Resumo dos objetos detetados pelo ADAS: número, veículo mais próximo na faixa, alertas de inserção e de peão/ciclista.'
observations:
  en: 'Event-triggered frame with a 40 ms exclusion time, sent on each computation cycle, i.e. every 40/50 ms; set as mixed'
  fr: 'Trame événementielle avec un temps d''exclusion de 40 ms, émise à chaque cycle de calcul, soit toutes les 40/50 ms ; définie en mixte'
  es: 'Trama basada en eventos con un tiempo de exclusión de 40 ms, enviada en cada ciclo de cálculo, es decir cada 40/50 ms; definida como mixta'
  de: 'Ereignisgesteuerter Frame mit 40 ms Sperrzeit, gesendet bei jedem Berechnungszyklus, also alle 40/50 ms; als mixte definiert'
  it: 'Frame basato su eventi con tempo di esclusione di 40 ms, inviato a ogni ciclo di calcolo, ossia ogni 40/50 ms; definito misto'
  pl: 'Ramka zdarzeniowa z 40 ms czasem wykluczenia, wysyłana przy każdym cyklu obliczeniowym, czyli co 40/50 ms; ustawiona jako mieszana'
  ru: 'Событийный кадр с временем исключения 40 мс, отправляется на каждом цикле вычисления, то есть каждые 40/50 мс; задан как смешанный'
  zh: '事件触发帧,排除时间为40毫秒,每个计算周期(即每40/50毫秒)发送;设为混合类型'
  hu: 'Eseményvezérelt keret 40 ms kizárási idővel, minden számítási ciklusban, azaz 40/50 ms-onként küldve; mixte típusúként megadva'
  pt: 'Trama baseada em eventos com um tempo de exclusão de 40 ms, enviada em cada ciclo de cálculo, ou seja, a cada 40/50 ms; definida como mista'
periodicity: ['55ms', 'trigger']
senders: ['CVM']
receivers: ['ARTIV']

