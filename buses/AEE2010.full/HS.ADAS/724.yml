id: 0x724
name: 'OBJECT10_DATA'
type: 'can'
length: 8
comment:
  en: 'Class, distance, relative speed and angle of ADAS-tracked object 10, sent by the CVM.'
  fr: 'Classe, distance, vitesse relative et angle de l''objet 10 suivi par l''ADAS, envoyés par le CVM.'
  es: 'Clase, distancia, velocidad relativa y ángulo del objeto 10 detectado por el ADAS, enviados por el CVM.'
  de: 'Klasse, Abstand, Relativgeschwindigkeit und Winkel des vom ADAS erkannten Objekts 10, gesendet vom CVM.'
  it: 'Classe, distanza, velocità relativa e angolo dell''oggetto 10 rilevato dall''ADAS, inviati dal CVM.'
  pl: 'Klasa, odległość, prędkość względna i kąt obiektu 10 wykrytego przez ADAS, wysyłane przez CVM.'
  ru: 'Класс, расстояние, относительная скорость и угол объекта 10, обнаруженного системой ADAS, передаются модулем CVM.'
  zh: '由CVM发送的ADAS探测目标10的类别、距离、相对速度和角度。'
  hu: 'Az ADAS által érzékelt 10. objektum osztálya, távolsága, relatív sebessége és szöge, a CVM által küldve.'
  pt: 'Classe, distância, velocidade relativa e ângulo do objeto 10 detetado pelo ADAS, enviados pelo CVM.'
observations:
  en: 'Event-triggered frame with a 40 ms exclusion time, sent on each computation cycle, i.e. every 40/50 ms; set as mixed'
  fr: 'Trame événementielle avec un temps d''exclusion de 40 ms, émise à chaque cycle de calcul, soit toutes les 40/50 ms ; définie en mixte'
  es: 'Trama basada en eventos con un tiempo de exclusión de 40 ms, enviada en cada ciclo de cálculo, es decir cada 40/50 ms; definida como mixta'
  de: 'Ereignisgesteuerter Frame mit 40 ms Sperrzeit, gesendet bei jedem Berechnungszyklus, also alle 40/50 ms; als mixte definiert'
  it: 'Frame basato su eventi con tempo di esclusione di 40 ms, inviato a ogni ciclo di calcolo, ossia ogni 40/50 ms; definito misto'
  pl: 'Ramka zdarzeniowa z 40 ms czasem wykluczenia, wysyłana przy każdym cyklu obliczeniowym, czyli co 40/50 ms; ustawiona jako mieszana'
  ru: 'Событийный кадр с временем исключения 40 мс, отправляется на каждом цикле вычисления, то есть каждые 40/50 мс; задан как смешанный'
  zh: '事件触发帧,排除时间为40毫秒,每个计算周期(即每40/50毫秒)发送;设为混合类型'
  hu: 'Eseményvezérelt keret 40 ms kizárási idővel, minden számítási ciklusban, azaz 40/50 ms-onként küldve; mixte típusúként megadva'
  pt: 'Trama baseada em eventos com um tempo de exclusão de 40 ms, enviada em cada ciclo de cálculo, ou seja, a cada 40/50 ms; definida como mista'
periodicity: ['55ms', 'trigger']
senders: ['CVM']
receivers: ['ARTIV']

signals:
  ADAS_OBJECT_10_ID:
    bits: '1.7-1.1'
    comment:
      en: 'Identifier of tracked object 10.'
      fr: 'Identifiant de l''objet suivi 10.'
      es: 'Identificador del objeto seguido 10.'
      de: 'Kennung des verfolgten Objekts 10.'
      it: 'Identificativo dell''oggetto tracciato 10.'
      pl: 'Identyfikator śledzonego obiektu 10.'
      ru: 'Идентификатор отслеживаемого объекта 10.'
      zh: '跟踪目标10的标识符。'
      hu: 'A(z) 10. követett objektum azonosítója.'
      pt: 'Identificador do objeto rastreado 10.'
    type: 'uint'
    min: 0
    max: 127

  ADAS_OBJECT_10_LONGITUDINAL_DISTANCE:
    bits: '2.7-3.4'
    comment:
      en: 'Longitudinal distance to tracked object 10.'
      fr: 'Distance longitudinale à l''objet suivi 10.'
      es: 'Distancia longitudinal al objeto seguido 10.'
      de: 'Längsabstand zum verfolgten Objekt 10.'
      it: 'Distanza longitudinale dall''oggetto tracciato 10.'
      pl: 'Odległość wzdłużna do śledzonego obiektu 10.'
      ru: 'Продольное расстояние до отслеживаемого объекта 10.'
      zh: '到跟踪目标10的纵向距离。'
      hu: 'A(z) 10. követett objektum hosszirányú távolsága.'
      pt: 'Distância longitudinal ao objeto rastreado 10.'
    type: 'uint'
    factor: 0.05
    min: 0
    max: 204.75
    units: 'm'

  ADAS_OBJECT_10_RELATIVE_VELOCITY:
    bits: '3.3-4.0'
    comment:
      en: 'Relative velocity of tracked object 10.'
      fr: 'Vitesse relative de l''objet suivi 10.'
      es: 'Velocidad relativa del objeto seguido 10.'
      de: 'Relativgeschwindigkeit des verfolgten Objekts 10.'
      it: 'Velocità relativa dell''oggetto tracciato 10.'
      pl: 'Prędkość względna śledzonego obiektu 10.'
      ru: 'Относительная скорость отслеживаемого объекта 10.'
      zh: '跟踪目标10的相对速度。'
      hu: 'A(z) 10. követett objektum relatív sebessége.'
      pt: 'Velocidade relativa do objeto rastreado 10.'
    type: 'sint'
    factor: 0.05
    min: -102.4
    max: 102.35
    units: 'm/s'

  ADAS_OBJECT_10_MSG_COUNTER_1:
    bits: '5.7-5.6'
    comment:
      en: 'Message counter for tracked object 10 data block 1.'
      fr: 'Compteur de message pour le bloc de données 1 de l''objet suivi 10.'
      es: 'Contador de mensajes del bloque de datos 1 del objeto seguido 10.'
      de: 'Nachrichtenzähler für Datenblock 1 des verfolgten Objekts 10.'
      it: 'Contatore messaggi per il blocco dati 1 dell''oggetto tracciato 10.'
      pl: 'Licznik komunikatów dla bloku danych 1 śledzonego obiektu 10.'
      ru: 'Счётчик сообщений блока данных 1 отслеживаемого объекта 10.'
      zh: '跟踪目标10数据块1的消息计数器。'
      hu: 'A(z) 10. követett objektum 1. adatblokkjának üzenetszámlálója.'
      pt: 'Contador de mensagens do bloco de dados 10 do objeto rastreado 1.'
    type: 'uint'
    min: 0
    max: 3

  ADAS_OBJECT_10_LEFT_ANGLE:
    bits: '5.5-6.1'
    comment:
      en: 'Left-edge angle of tracked object 10.'
      fr: 'Angle du bord gauche de l''objet suivi 10.'
      es: 'Ángulo del borde izquierdo del objeto seguido 10.'
      de: 'Winkel der linken Kante des verfolgten Objekts 10.'
      it: 'Angolo del bordo sinistro dell''oggetto tracciato 10.'
      pl: 'Kąt lewej krawędzi śledzonego obiektu 10.'
      ru: 'Угол левого края отслеживаемого объекта 10.'
      zh: '跟踪目标10左边缘角度。'
      hu: 'A(z) 10. követett objektum bal szélének szöge.'
      pt: 'Ângulo do bordo esquerdo do objeto rastreado 10.'
    type: 'sint'
    factor: 0.0002
    min: -0.8192
    max: 0.819
    units: 'rad'

  ADAS_OBJECT_10_RIGHT_ANGLE:
    bits: '7.7-8.3'
    comment:
      en: 'Right-edge angle of tracked object 10.'
      fr: 'Angle du bord droit de l''objet suivi 10.'
      es: 'Ángulo del borde derecho del objeto seguido 10.'
      de: 'Winkel der rechten Kante des verfolgten Objekts 10.'
      it: 'Angolo del bordo destro dell''oggetto tracciato 10.'
      pl: 'Kąt prawej krawędzi śledzonego obiektu 10.'
      ru: 'Угол правого края отслеживаемого объекта 10.'
      zh: '跟踪目标10右边缘角度。'
      hu: 'A(z) 10. követett objektum jobb szélének szöge.'
      pt: 'Ângulo do bordo direito do objeto rastreado 10.'
    type: 'sint'
    factor: 0.0002
    min: -0.8192
    max: 0.819
    units: 'rad'

  ADAS_OBJECT_10_CLASS:
    bits: '8.2-8.0'
    comment:
      en: 'Class of tracked object 10 (unknown, truck, car, motorbike, bicycle).'
      fr: 'Classe de l''objet suivi 10 (inconnu, camion, voiture, moto, vélo).'
      es: 'Clase del objeto seguido 10 (desconocido, camión, coche, moto, bicicleta).'
      de: 'Klasse des verfolgten Objekts 10 (unbekannt, Lkw, Pkw, Motorrad, Fahrrad).'
      it: 'Classe dell''oggetto tracciato 10 (sconosciuto, camion, auto, moto, bicicletta).'
      pl: 'Klasa śledzonego obiektu 10 (nieznany, ciężarówka, samochód, motocykl, rower).'
      ru: 'Класс отслеживаемого объекта 10 (неизвестно, грузовик, легковой автомобиль, мотоцикл, велосипед).'
      zh: '跟踪目标10的类别（未知、卡车、轿车、摩托车、自行车）。'
      hu: 'A(z) 10. követett objektum osztálya (ismeretlen, teherautó, személyautó, motorkerékpár, kerékpár).'
      pt: 'Classe do objeto rastreado 10 (desconhecido, camião, carro, mota, bicicleta).'
