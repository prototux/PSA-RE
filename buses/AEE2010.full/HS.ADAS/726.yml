      de: 'Linker Randwinkel des verfolgten Objekts 10 (rad)'
      it: 'Angolo del bordo sinistro dell''oggetto tracciato 10 (rad)'
      pl: 'Kąt lewej krawędzi śledzonego obiektu 10 (rad)'
      ru: 'Угол левого края отслеживаемого объекта 10 (рад)'
