      de: 'Linker Randwinkel des verfolgten Objekts 12 (rad)'
      it: 'Angolo del bordo sinistro dell''oggetto tracciato 12 (rad)'
      pl: 'Kąt lewej krawędzi śledzonego obiektu 12 (rad)'
      ru: 'Угол левого края отслеживаемого объекта 12 (рад)'
