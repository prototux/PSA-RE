id: 0x456
name: 'ROAD_TYPE_DATA'
type: 'can'
length: 1
comment:
  en: 'Road type and lane detection activity data from the camera module (CVM): construction area and road type flags.'
  fr: 'Données de type de route et d''activité de détection de voie issues du module caméra (CVM) : indicateurs de zone de travaux et de type de route.'
  es: 'Datos de tipo de carretera y actividad de detección de carril del módulo de cámara (CVM): indicadores de zona de obras y tipo de carretera.'
  de: 'Straßentyp- und Fahrspurerkennungsaktivitätsdaten vom Kameramodul (CVM): Baustellenbereichs- und Straßentyp-Flags.'
  it: 'Dati sul tipo di strada e sull''attività di rilevamento corsia dal modulo telecamera (CVM): indicatori di zona di lavori e tipo di strada.'
  pl: 'Dane typu drogi i aktywności wykrywania pasa z modułu kamery (CVM): flagi strefy robót i typu drogi.'
  ru: 'Данные о типе дороги и активности обнаружения полосы от модуля камеры (CVM): флаги зоны строительства и типа дороги.'
  zh: '来自摄像头模块(CVM)的道路类型及车道检测活动数据:施工区域及道路类型标志。'
  hu: 'Az útburkolattípus és a sávérzékelési aktivitás adatai a kameramodultól (CVM): útépítési terület és útburkolattípus jelzők.'
  pt: 'Dados de tipo de estrada e atividade de deteção de faixa do módulo de câmara (CVM): indicadores de zona de obras e de tipo de estrada.'
observations:
  en: 'Event-triggered frame with a 40 ms exclusion time, sent when signal processing is finished; set as mixed for CAN network load calculation'
  fr: 'Trame événementielle avec un temps d''exclusion de 40 ms, émise lorsque le traitement du signal est terminé ; définie en mixte pour le calcul de la charge réseau'
  es: 'Trama basada en eventos con un tiempo de exclusión de 40 ms, enviada al finalizar el procesamiento de la señal; definida como mixta para el cálculo de la carga de red'
  de: 'Ereignisgesteuerter Frame mit 40 ms Sperrzeit, gesendet nach Abschluss der Signalverarbeitung; als mixte definiert zur Berechnung der Netzlast'
  it: 'Frame basato su eventi con tempo di esclusione di 40 ms, inviato al termine dell''elaborazione del segnale; definito misto per il calcolo del carico di rete'
  pl: 'Ramka zdarzeniowa z 40 ms czasem wykluczenia, wysyłana po zakończeniu przetwarzania sygnału; ustawiona jako mieszana do obliczenia obciążenia sieci'
  ru: 'Событийный кадр с временем исключения 40 мс, отправляется по завершении обработки сигнала; задан как смешанный для расчёта загрузки сети'
  zh: '事件触发帧,排除时间为40毫秒,信号处理完成时发送;设为混合类型以计算CAN网络负载'
  hu: 'Eseményvezérelt keret 40 ms kizárási idővel, a jelfeldolgozás befejezésekor küldve; mixte típusúként megadva a hálózati terhelés számításához'
  pt: 'Trama baseada em eventos com um tempo de exclusão de 40 ms, enviada quando o processamento do sinal termina; definida como mista para o cálculo da carga da rede CAN'
periodicity: ['55ms', 'trigger']
senders: ['CVM']
receivers: ['ARTIV']

