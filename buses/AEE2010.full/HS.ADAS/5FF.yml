id: 0x5FF
name: 'LANE_RIGHT0_GEOMETRY_DATA'
type: 'can'
length: 4
comment:
  en: 'Right ego-lane boundary geometry from the camera module (CVM): lane change flag, mark width, time-to-line-crossing and view range.'
  fr: 'Géométrie de la ligne droite de la voie courante issue du module caméra (CVM) : indicateur de changement de voie, largeur du marquage, temps avant franchissement et portée de vue.'
  es: 'Geometría de la línea derecha del carril actual del módulo de cámara (CVM): indicador de cambio de carril, ancho de la marca, tiempo hasta el cruce y alcance de visión.'
  de: 'Geometrie der rechten Begrenzungslinie der eigenen Fahrspur vom Kameramodul (CVM): Spurwechselanzeige, Markierungsbreite, Zeit bis zur Linienüberschreitung und Sichtweite.'
  it: 'Geometria della linea destra della corsia attuale dal modulo telecamera (CVM): indicatore di cambio corsia, larghezza della segnaletica, tempo all''attraversamento e portata visiva.'
  pl: 'Geometria prawej linii bieżącego pasa z modułu kamery (CVM): flaga zmiany pasa, szerokość oznakowania, czas do przekroczenia linii i zasięg widzenia.'
  ru: 'Геометрия правой линии текущей полосы от модуля камеры (CVM): флаг смены полосы, ширина разметки, время до пересечения линии и дальность обзора.'
  zh: '来自摄像头模块(CVM)的本车道右边界几何数据:变道标志、标线宽度、越线时间及视距范围。'
  hu: 'A jelenlegi sáv jobb szélének geometriája a kameramodultól (CVM): sávváltás jelzője, jelzésszélesség, vonalátlépésig hátralévő idő és látótávolság.'
  pt: 'Geometria da linha direita da faixa atual do módulo de câmara (CVM): indicador de mudança de faixa, largura da marcação, tempo até ao cruzamento da linha e alcance de visão.'
observations:
  en: 'Event-triggered frame with a 40 ms exclusion time, sent on each computation cycle, i.e. every 40/50 ms; set as mixed'
  fr: 'Trame événementielle avec un temps d''exclusion de 40 ms, émise à chaque cycle de calcul, soit toutes les 40/50 ms ; définie en mixte'
  es: 'Trama basada en eventos con un tiempo de exclusión de 40 ms, enviada en cada ciclo de cálculo, es decir cada 40/50 ms; definida como mixta'
  de: 'Ereignisgesteuerter Frame mit 40 ms Sperrzeit, gesendet bei jedem Berechnungszyklus, also alle 40/50 ms; als mixte definiert'
  it: 'Frame basato su eventi con tempo di esclusione di 40 ms, inviato a ogni ciclo di calcolo, ossia ogni 40/50 ms; definito misto'
  pl: 'Ramka zdarzeniowa z 40 ms czasem wykluczenia, wysyłana przy każdym cyklu obliczeniowym, czyli co 40/50 ms; ustawiona jako mieszana'
  ru: 'Событийный кадр с временем исключения 40 мс, отправляется на каждом цикле вычисления, то есть каждые 40/50 мс; задан как смешанный'
  zh: '事件触发帧,排除时间为40毫秒,每个计算周期(即每40/50毫秒)发送;设为混合类型'
  hu: 'Eseményvezérelt keret 40 ms kizárási idővel, minden számítási ciklusban, azaz 40/50 ms-onként küldve; mixte típusúként megadva'
  pt: 'Trama baseada em eventos com um tempo de exclusão de 40 ms, enviada em cada ciclo de cálculo, ou seja, a cada 40/50 ms; definida como mista'
periodicity: ['55ms', 'trigger']
senders: ['CVM']
receivers: ['ARTIV']

signals:
  R0_LANE_LINE_LENGTH:
    bits: '1.7-1.0'
    comment:
      en: 'Length of the detected line (right line 0)'
      fr: 'Longueur de la ligne détectée (ligne droite 0)'
      es: 'Longitud de la línea detectada (línea derecha 0)'
      de: 'Länge der erkannten Linie (rechte Linie 0)'
      it: 'Lunghezza della linea rilevata (linea destra 0)'
      pl: 'Długość wykrytej linii (linia prawa 0)'
      ru: 'Длина обнаруженной линии (правая линия 0)'
      zh: '检测到的车道线长度 (右侧车道线0)'
      hu: 'Az észlelt vonal hossza (jobb 0. vonal)'
      pt: 'Comprimento da linha detetada (linha direita 0)'
    type: 'uint'
    factor: 0.5
    min: 0
    max: 127.5
    units: 'm'

  R0_LANE_TIME_TO_CROSS:
    bits: '2.7-2.0'
    comment:
      en: 'Time to line crossing (right line 0)'
      fr: 'Temps avant franchissement de ligne (ligne droite 0)'
      es: 'Tiempo hasta cruzar la línea (línea derecha 0)'
      de: 'Zeit bis zum Überfahren der Linie (rechte Linie 0)'
      it: 'Tempo al superamento della linea (linea destra 0)'
      pl: 'Czas do przekroczenia linii (linia prawa 0)'
      ru: 'Время до пересечения линии (правая линия 0)'
      zh: '越线剩余时间 (右侧车道线0)'
      hu: 'Vonalátlépésig hátralévő idő (jobb 0. vonal)'
      pt: 'Tempo até cruzamento da linha (linha direita 0)'
    type: 'uint'
    factor: 0.01
    min: 0
    max: 2.55
    units: 's'

  R0_LANE_MARK_WIDTH:
    bits: '3.7-3.1'
    comment:
      en: 'Width of the line markings (right line 0)'
      fr: 'Largeur des marquages de la ligne (ligne droite 0)'
      es: 'Anchura de las marcas de la línea (línea derecha 0)'
      de: 'Breite der Linienmarkierung (rechte Linie 0)'
      it: 'Larghezza della segnaletica orizzontale (linea destra 0)'
      pl: 'Szerokość oznakowania linii (linia prawa 0)'
      ru: 'Ширина дорожной разметки (правая линия 0)'
      zh: '车道标线宽度 (右侧车道线0)'
      hu: 'A vonaljelzés szélessége (jobb 0. vonal)'
      pt: 'Largura das marcas da linha (linha direita 0)'
    type: 'uint'
    factor: 0.01
    min: 0
    max: 1.27
    units: 'm'

  R0_LANE_CHANGE_DETECTED:
    bits: '3.0'
    comment:
      en: 'Lane change detected (MobilEye) (right line 0)'
      fr: 'Changement de voie détecté (MobilEye) (ligne droite 0)'
      es: 'Cambio de carril detectado (MobilEye) (línea derecha 0)'
      de: 'Spurwechsel erkannt (MobilEye) (rechte Linie 0)'
      it: 'Cambio corsia rilevato (MobilEye) (linea destra 0)'
      pl: 'Wykryto zmianę pasa ruchu (MobilEye) (linia prawa 0)'
      ru: 'Обнаружена смена полосы движения (MobilEye) (правая линия 0)'
      zh: '检测到变道(MobilEye) (右侧车道线0)'
      hu: 'Sávváltás érzékelve (MobilEye) (jobb 0. vonal)'
      pt: 'Mudança de faixa detetada (MobilEye) (linha direita 0)'
    type: 'bool'
    values:
      0x00:
        en: 'No line change'
        fr: 'Pas de changement de voie'
        es: 'Sin cambio de carril'
        de: 'Kein Fahrspurwechsel'
        it: 'Nessun cambio di corsia'
        pl: 'Brak zmiany pasa ruchu'
        ru: 'Нет смены полосы'
        zh: '无变道'
        hu: 'Nincs sávváltás'
        pt: 'Sem mudança de faixa'
      0x01:
        en: 'Line change'
        fr: 'Changement de ligne'
        es: 'Cambio de línea'
        de: 'Zeilenwechsel'
        it: 'Cambio linea'
        pl: 'Zmiana linii'
        ru: 'Смена строки'
        zh: '行切换'
        hu: 'Sorváltás'
        pt: 'Mudança de linha'

  MSG_COUNTER_LR0DAT2:
    bits: '4.7-4.6'
    comment:
      en: 'Message counter for the right line 0, data set 2 frame'
      fr: 'Compteur de message pour la trame ligne droite 0, jeu de données 2'
      es: 'Contador de mensajes para la trama línea derecha 0, conjunto de datos 2'
      de: 'Nachrichtenzähler für den Frame rechte Linie 0, Datensatz 2'
      it: 'Contatore messaggi per il frame linea destra 0, set di dati 2'
      pl: 'Licznik komunikatów dla ramki linii prawej 0, zestawu danych 2'
      ru: 'Счётчик сообщений для кадра правой линии 0, набора данных 2'
      zh: '右侧车道线0数据组2帧的消息计数器'
      hu: 'Üzenetszámláló a jobb 0. vonal, 2. adatkészlet kerethez'
      pt: 'Contador de mensagens da trama linha direita 0, conjunto de dados 2'
    type: 'uint'
    min: 0
    max: 3
