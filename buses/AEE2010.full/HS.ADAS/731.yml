id: 0x731
name: 'ADAS_OBJECT_13_DATA_2'
type: 'can'
length: 8
comment:
  en: 'ADAS tracked object 13: brake light, lane, motion status, turn signal and detection confidence, sent by the front camera/radar module.'
  fr: 'Objet suivi par l''ADAS n°13 : feu stop, voie, état de mouvement, clignotant et niveau de confiance de détection, envoyés par le module caméra/radar avant.'
  es: 'Objeto seguido por el ADAS n.º 13: luz de freno, carril, estado de movimiento, intermitente y nivel de confianza de detección, enviados por el módulo cámara/radar delantero.'
  de: 'Vom ADAS verfolgtes Objekt Nr. 13: Bremslicht, Fahrspur, Bewegungsstatus, Blinker und Erkennungssicherheit, gesendet vom Front-Kamera-/Radarmodul.'
  it: 'Oggetto tracciato dall''ADAS n. 13: luce di stop, corsia, stato di movimento, indicatore di direzione e livello di confidenza del rilevamento, inviati dal modulo telecamera/radar anteriore.'
  pl: 'Obiekt śledzony przez ADAS nr 13: światło stop, pas ruchu, stan ruchu, kierunkowskaz i poziom pewności detekcji, wysyłane przez przedni moduł kamery/radaru.'
  ru: 'Объект №13, отслеживаемый системой ADAS: стоп-сигнал, полоса движения, статус движения, поворотник и достоверность обнаружения, отправляемые передним модулем камеры/радара.'
  zh: 'ADAS跟踪的13号目标：刹车灯、车道、运动状态、转向灯及检测置信度，由前置摄像头/雷达模块发送。'
  hu: 'Az ADAS által követett 13. objektum: féklámpa, sáv, mozgásállapot, index és az észlelés megbízhatósága, az első kamera/radar modul küldi.'
  pt: 'Objeto rastreado ADAS 13: luz de travagem, faixa, estado de movimento, sinal de mudança de direção e confiança de deteção, enviado pelo módulo de câmara/radar dianteiro.'
observations:
  en: 'Event-triggered frame with a 40 ms exclusion time, sent on each computation cycle, i.e. every 40/50 ms; set as mixed'
  fr: 'Trame événementielle avec un temps d''exclusion de 40 ms, émise à chaque cycle de calcul, soit toutes les 40/50 ms ; définie en mixte'
  es: 'Trama basada en eventos con un tiempo de exclusión de 40 ms, enviada en cada ciclo de cálculo, es decir cada 40/50 ms; definida como mixta'
  de: 'Ereignisgesteuerter Frame mit 40 ms Sperrzeit, gesendet bei jedem Berechnungszyklus, also alle 40/50 ms; als mixte definiert'
  it: 'Frame basato su eventi con tempo di esclusione di 40 ms, inviato a ogni ciclo di calcolo, ossia ogni 40/50 ms; definito misto'
  pl: 'Ramka zdarzeniowa z 40 ms czasem wykluczenia, wysyłana przy każdym cyklu obliczeniowym, czyli co 40/50 ms; ustawiona jako mieszana'
  ru: 'Событийный кадр с временем исключения 40 мс, отправляется на каждом цикле вычисления, то есть каждые 40/50 мс; задан как смешанный'
  zh: '事件触发帧,排除时间为40毫秒,每个计算周期(即每40/50毫秒)发送;设为混合类型'
  hu: 'Eseményvezérelt keret 40 ms kizárási idővel, minden számítási ciklusban, azaz 40/50 ms-onként küldve; mixte típusúként megadva'
  pt: 'Trama baseada em eventos com um tempo de exclusão de 40 ms, enviada em cada ciclo de cálculo, ou seja, a cada 40/50 ms; definida como mista'
periodicity: ['55ms', 'trigger']
senders: ['CVM']
receivers: ['ARTIV']

