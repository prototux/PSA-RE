  AC_COMPRESSOR_CUTOFF_REQUEST_GEARBOX:
    bits: '1.7'
    comment:
      en: 'AC compressor cutoff request for gearbox torque management'
      fr: 'Demande de délestage du compresseur de climatisation pour la gestion du couple de la boîte de vitesses'
      es: 'Solicitud de desconexión del compresor de climatización para la gestión del par de la caja de cambios'
      de: 'Anforderung zur Abschaltung des Klimakompressors für das Drehmomentmanagement des Getriebes'
      it: 'Richiesta di disattivazione del compressore del climatizzatore per la gestione della coppia del cambio'
      pl: 'Żądanie odłączenia sprężarki klimatyzacji na potrzeby zarządzania momentem skrzyni biegów'
      ru: 'Запрос отключения компрессора кондиционера для управления моментом коробки передач'
      zh: '为变速箱扭矩管理而请求切断空调压缩机'
      hu: 'A klímakompresszor lekapcsolási kérése a váltómű nyomatékkezelése érdekében'
      pt: 'Pedido de deslastre do compressor de climatização para a gestão do binário da caixa de velocidades'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No request'
