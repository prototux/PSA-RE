id: 0x349
name: 'GEARBOX_SYNCHRONISATION_DATA_2'
type: 'can'
length: 8
comment:
  en: 'Automatic gearbox synchronisation data: requested engine torque/idle-speed setpoints, gear-change and torque-converter state.'
  fr: 'Données de synchronisation de la boîte automatique : consignes de couple moteur/régime de ralenti demandées, état de changement de rapport et du convertisseur de couple.'
  es: 'Datos de sincronización de la caja automática: consignas de par motor/régimen de ralentí solicitadas, estado de cambio de marcha y del convertidor de par.'
  de: 'Synchronisationsdaten des Automatikgetriebes: angeforderte Motordrehmoment-/Leerlaufdrehzahl-Sollwerte, Schaltzustand und Zustand des Drehmomentwandlers.'
  it: 'Dati di sincronizzazione del cambio automatico: valori richiesti di coppia motore/regime minimo, stato di cambiata e del convertitore di coppia.'
  pl: 'Dane synchronizacji automatycznej skrzyni biegów: żądane wartości momentu silnika/obrotów biegu jałowego, stan zmiany biegu i przetwornika momentu.'
  ru: 'Данные синхронизации автоматической коробки передач: запрошенные заданные значения крутящего момента двигателя/оборотов холостого хода, состояние переключения передачи и гидротрансформатора.'
  zh: '自动变速箱同步数据:请求的发动机扭矩/怠速转速设定值、换挡状态及变矩器状态。'
  hu: 'Az automata váltó szinkronizációs adatai: a kért motornyomaték-/alapjárati fordulatszám-alapjelek, a fokozatváltás és a nyomatékváltó állapota.'
  pt: 'Dados de sincronização da caixa de velocidades automática: pontos de ajuste de binário do motor pedido/rotação de ralenti, estado de mudança e do conversor de binário.'
periodicity: ['10ms']
senders: ['BSM', 'CVM']
receivers: ['ARTIV']

