id: 0x497
name: 'FRONT_LIGHTING_UNIT_DATA'
type: 'can'
length: 5
comment:
  en: 'Front lighting control data, partly relayed from other networks: beam-levelling position commands, fault log context, electrical network and reverse-gear state, operating mode.'
  fr: 'Données de commande d''éclairage avant, partiellement relayées depuis d''autres réseaux : commandes de position du correcteur d''assiette, contexte du journal de défauts, état du réseau électrique et de la marche arrière, mode de fonctionnement.'
  es: 'Datos de control de iluminación delantera, parcialmente retransmitidos desde otras redes: comandos de posición del corrector de altura, contexto del registro de fallos, estado de la red eléctrica y de la marcha atrás, modo de funcionamiento.'
  de: 'Frontbeleuchtungs-Steuerdaten, teilweise aus anderen Netzwerken weitergeleitet: Positionsbefehle des Leuchtweitenreglers, Fehlerprotokoll-Kontext, Zustand des Bordnetzes und des Rückwärtsgangs, Betriebsmodus.'
  it: 'Dati di controllo illuminazione anteriore, in parte inoltrati da altre reti: comandi di posizione del correttore di assetto, contesto del registro guasti, stato della rete elettrica e della retromarcia, modalità di funzionamento.'
  pl: 'Dane sterowania oświetleniem przednim, częściowo przekazywane z innych sieci: polecenia pozycji regulatora zasięgu świateł, kontekst dziennika usterek, stan sieci elektrycznej i biegu wstecznego, tryb pracy.'
  ru: 'Данные управления передним освещением, частично ретранслируемые из других сетей: команды положения корректора света, контекст журнала неисправностей, состояние бортовой сети и заднего хода, режим работы.'
  zh: '前照明控制数据,部分从其他网络转发:光束调平位置命令、故障日志上下文、电气网络和倒挡状态、工作模式。'
  hu: 'Első világítás-vezérlési adatok, részben más hálózatokból továbbítva: fényelosztás-állítás pozícióparancsai, hibanapló kontextus, elektromos hálózat és hátrameneti fokozat állapota, üzemmód.'
  pt: 'Dados de comando da iluminação dianteira, parcialmente retransmitidos de outras redes: comandos de posição de nivelamento do feixe, contexto do registo de avarias, estado da rede elétrica e da marcha-atrás, modo de funcionamento.'
periodicity: ['100ms']
senders: ['BCP']
receivers: ['LED_DRIVER']

