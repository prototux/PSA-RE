id: 0x277
name: 'LED_DRIVER_LEFT_LEVELLING_POSITION'
type: 'can'
length: 2
comment:
  en: 'Left headlight beam-levelling actuator: current position and direction sign.'
  fr: 'Actionneur de correcteur d''assiette du phare gauche : position actuelle et signe de direction.'
  es: 'Actuador de nivelación del faro izquierdo: posición actual y signo de dirección.'
  de: 'Leuchtweitenregler-Aktuator des linken Scheinwerfers: aktuelle Position und Richtungsvorzeichen.'
  it: 'Attuatore correttore di assetto del faro sinistro: posizione attuale e segno di direzione.'
  pl: 'Siłownik regulacji zasięgu lewego reflektora: aktualna pozycja i znak kierunku.'
  ru: 'Привод корректора света левой фары: текущее положение и знак направления.'
  zh: '左前大灯光束调平执行器:当前位置和方向符号。'
  hu: 'A bal fényszóró fényelosztás-állító aktuátora: aktuális pozíció és irányelőjel.'
  pt: 'Atuador de nivelamento do feixe do farol esquerdo: posição atual e sinal de direção.'
periodicity: ['20ms']
senders: ['LED_DRIVER']
receivers: ['BCP']

signals:
  LEFT_HEADLAMP_LEVEL_SIGN:
    bits: '1.7'
    comment:
      en: 'Sign of the left headlamp levelling position'
      fr: 'Signe de la position de correction d''assiette du projecteur gauche'
      es: 'Signo de la posición de nivelación del faro izquierdo'
      de: 'Vorzeichen der Niveauregulierungsposition des linken Scheinwerfers'
      it: 'Segno della posizione di correzione assetto del faro sinistro'
      pl: 'Znak pozycji korekcji zasięgu lewego reflektora'
      ru: 'Знак положения корректора уровня левой фары'
      zh: '左前照灯调平位置符号'
      hu: 'A bal fényszóró szintezési helyzetének előjele'
      pt: 'Sinal da posição de nivelamento do farol esquerdo'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Positive'
        fr: 'Positif'
        es: 'Positivo'
        de: 'Positiv'
        it: 'Positivo'
        pl: 'Dodatnie'
        ru: 'Положительное'
        zh: '正'
        hu: 'Pozitív'
        pt: 'Positivo'
      0x01:
        en: 'Negative'
        fr: 'Négative'
        es: 'Negativo'
        de: 'Negativ'
        it: 'Negativo'
        pl: 'Ujemny'
        ru: 'Отрицательный'
        zh: '负'
        hu: 'Negatív'
        pt: 'Negativo'

  LEFT_HEADLAMP_LEVEL_POSITION:
    bits: '1.6-2.5'
    comment:
      en: 'Current left headlamp levelling actuator position (%rad)'
      fr: 'Position actuelle de l''actionneur de correcteur d''assiette du projecteur gauche (%rad)'
      es: 'Posición actual del actuador de nivelación del faro izquierdo (%rad)'
      de: 'Aktuelle Position des Niveauregulierungsstellglieds des linken Scheinwerfers (%rad)'
      it: 'Posizione attuale dell''attuatore di correzione assetto del faro sinistro (%rad)'
      pl: 'Aktualna pozycja siłownika korektora zasięgu lewego reflektora (%rad)'
      ru: 'Текущее положение привода корректора уровня левой фары (%rad)'
      zh: '左前照灯调平执行器当前位置(%rad)'
      hu: 'A bal fényszóró szintező aktuátorának aktuális helyzete (%rad)'
      pt: 'Posição atual do atuador de nivelamento do farol esquerdo (%rad)'
    type: 'uint'
    factor: 0.01
    min: 0
    max: 10.2
    units: '%rad'
    invalid: 0x3FF
    default: 0x00
