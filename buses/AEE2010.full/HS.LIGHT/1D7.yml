id: 0x1D7
name: 'LEFT_LED_HEADLAMP_DRIVER_DATA'
type: 'can'
length: 7
comment:
  en: 'Left LED headlamp driver data: high-beam fading, power factor and shadow-edge angles/fading.'
  fr: 'Données du driver LED du phare gauche : fondu du feu de route, facteur de puissance et angles/fondu de la zone d''ombre.'
  es: 'Datos del driver LED del faro izquierdo: atenuación de las luces de carretera, factor de potencia y ángulos/atenuación de la zona de sombra.'
  de: 'Daten des LED-Treibers des linken Scheinwerfers: Fernlicht-Überblendung, Leistungsfaktor sowie Winkel/Überblendung der Schattenkante.'
  it: 'Dati del driver LED del faro sinistro: dissolvenza degli abbaglianti, fattore di potenza e angoli/dissolvenza del bordo d''ombra.'
  pl: 'Dane sterownika LED lewego reflektora: zanikanie światła drogowego, współczynnik mocy oraz kąty/zanikanie krawędzi cienia.'
  ru: 'Данные драйвера светодиодной фары слева: плавное изменение дальнего света, коэффициент мощности и углы/затухание границы тени.'
  zh: '左侧LED大灯驱动数据:远光渐变、功率因数以及阴影边缘角度/渐变。'
  hu: 'A bal oldali LED fényszóró meghajtójának adatai: távfény áttűnés, teljesítménytényező, valamint az árnyékhatár szögei/áttűnése.'
  pt: 'Dados do driver do farol LED esquerdo: esbatimento dos máximos, fator de potência e ângulos/esbatimento da linha de corte.'
periodicity: ['10ms']
senders: ['LED_DRIVER']

signals:
  LEFT_HIGH_BEAM_FADING_TIME:
    bits: '1.7-1.0'
    comment:
      en: 'Left high beam fading time'
      fr: 'Temps de fondu (fading) du feu de route gauche'
      es: 'Tiempo de atenuación (fading) de la luz de carretera izquierda'
      de: 'Abblendzeit (Fading) des linken Fernlichts'
      it: 'Tempo di dissolvenza (fading) dell''abbagliante sinistro'
      pl: 'Czas płynnego przejścia (fading) światła drogowego lewego'
      ru: 'Время плавного перехода (fading) левой фары дальнего света'
      zh: '左远光灯渐变时间'
      hu: 'A bal távolsági fényszóró áttűnési (fading) ideje'
      pt: 'Tempo de esbatimento (fading) dos máximos esquerdos'
    type: 'uint'
    factor: 0.02
    min: 0
    max: 5
    units: 's'
    default: 0x00

  HEADLAMP_SHADOW_FADE_UP_LEFT:
    bits: '2.7-2.0'
    comment:
      en: 'Fade-up time of the darkness (cut-off) zone, left headlamp'
      fr: 'Temps de fondu montant de la zone d''obscurité, phare gauche'
      es: 'Tiempo de desvanecimiento ascendente de la zona de oscuridad, faro izquierdo'
      de: 'Aufblendzeit des Dunkelbereichs, linker Scheinwerfer'
      it: 'Tempo di dissolvenza in aumento della zona d''ombra, faro sinistro'
      pl: 'Czas zanikania w górę strefy zaciemnienia, lewy reflektor'
      ru: 'Время плавного появления тёмной зоны, левая фара'
      zh: '左大灯暗区渐亮时间'
      hu: 'A sötét zóna felfelé történő elhalványulási ideje, bal fényszóró'
      pt: 'Tempo de esbatimento ascendente da zona de escuridão, farol esquerdo'
    type: 'uint'
    factor: 0.02
    min: 0
    max: 5
    units: 's'
    default: 0x00

  HEADLAMP_SHADOW_FADE_DOWN_LEFT:
    bits: '3.7-3.0'
    comment:
      en: 'Fade-down time of the darkness (cut-off) zone, left headlamp'
      fr: 'Temps de fondu descendant de la zone d''obscurité, phare gauche'
      es: 'Tiempo de desvanecimiento descendente de la zona de oscuridad, faro izquierdo'
      de: 'Abblendzeit des Dunkelbereichs, linker Scheinwerfer'
      it: 'Tempo di dissolvenza in diminuzione della zona d''ombra, faro sinistro'
      pl: 'Czas zanikania w dół strefy zaciemnienia, lewy reflektor'
      ru: 'Время плавного затемнения тёмной зоны, левая фара'
      zh: '左大灯暗区渐暗时间'
      hu: 'A sötét zóna lefelé történő elhalványulási ideje, bal fényszóró'
      pt: 'Tempo de esbatimento descendente da zona de escuridão, farol esquerdo'
    type: 'uint'
    factor: 0.02
    min: 0
    max: 5
    units: 's'
    default: 0x00

  LEFT_LIGHT_POWER_FACTOR:
    bits: '4.7-5.6'
    comment:
      en: 'Left headlamp power factor'
      fr: 'Facteur de puissance du phare gauche'
      es: 'Factor de potencia del faro izquierdo'
      de: 'Leistungsfaktor des linken Scheinwerfers'
      it: 'Fattore di potenza del faro sinistro'
      pl: 'Współczynnik mocy lewego reflektora'
      ru: 'Коэффициент мощности левой фары'
      zh: '左大灯功率因数'
      hu: 'A bal fényszóró teljesítménytényezője'
      pt: 'Fator de potência do farol esquerdo'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 100
    units: '%'
    default: 0x00

  LEFT_HEADLAMP_SHADOW_ANGLE:
    bits: '5.5-6.5'
    comment:
      en: 'Left headlamp shadow (masking) angle, measured from the left'
      fr: 'Angle d''occultation (ombre) du phare gauche, mesuré depuis la gauche'
      es: 'Ángulo de ocultación (sombra) del faro izquierdo, medido desde la izquierda'
      de: 'Abschattungswinkel des linken Scheinwerfers, von links gemessen'
      it: 'Angolo di oscuramento (ombra) del faro sinistro, misurato da sinistra'
      pl: 'Kąt zacienienia (maskowania) lewego reflektora, mierzony od lewej'
      ru: 'Угол затенения (маскирования) левой фары, измеренный слева'
      zh: '左大灯遮光角(从左侧测量)'
      hu: 'A bal fényszóró árnyékolási szöge, balról mérve'
      pt: 'Ângulo de ocultação (sombra) do farol esquerdo, medido a partir da esquerda'
    type: 'sint'
    factor: 0.1
    min: -25
    max: 25
    units: '°'
    default: 0x00

  HEADLAMP_SHADOW_RIGHT_ANGLE_LEFT:
    bits: '6.4-7.4'
    comment:
      en: 'Right darkness (cut-off) angle, seen from the left headlamp'
      fr: 'Angle droit d''obscurité vu depuis le phare gauche'
      es: 'Ángulo derecho de oscuridad visto desde el faro izquierdo'
      de: 'Rechter Dunkelbereichswinkel, gesehen vom linken Scheinwerfer'
      it: 'Angolo destro di oscurità visto dal faro sinistro'
      pl: 'Prawy kąt zaciemnienia widziany z lewego reflektora'
      ru: 'Правый угол затемнения, видимый от левой фары'
      zh: '从左大灯观察的右侧暗区角度'
      hu: 'A bal fényszóróból nézett jobb sötétedési szög'
      pt: 'Ângulo direito de escuridão (corte), visto a partir do farol esquerdo'
    type: 'sint'
    factor: 0.1
    min: -25
    max: 25
    units: '°'
    default: 0x00
