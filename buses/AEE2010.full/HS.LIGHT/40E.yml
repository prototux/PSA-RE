id: 0x40E
name: 'BSI_DATA_2'
type: 'can'
length: 5
comment:
  en: 'Body controller data 7: left/right indicator requests, low/high-beam state, fuel level info, and daytime-running/motorway/town/dynamic-bend lighting inhibitions.'
  fr: 'Données BSI 7 : demandes de clignotant droit/gauche, état feux de croisement/route, info niveau carburant, et inhibitions d''éclairage diurne/autoroute/ville/virage dynamique.'
  es: 'Datos de la BSI 7: solicitudes de intermitente derecho/izquierdo, estado de luces de cruce/carretera, información de nivel de combustible, e inhibiciones de iluminación diurna/autopista/ciudad/curva dinámica.'
  de: 'BSI-Daten 7: Blinkeranforderungen rechts/links, Abblend-/Fernlichtstatus, Kraftstoffstandinfo, sowie Sperren für Tagfahrlicht/Autobahn-/Stadt-/dynamisches Kurvenlicht.'
  it: 'Dati BSI 7: richieste indicatore destro/sinistro, stato anabbagliante/abbagliante, info livello carburante, e inibizioni illuminazione diurna/autostrada/città/curva dinamica.'
  pl: 'Dane BSI 7: żądania kierunkowskazu prawego/lewego, stan świateł mijania/drogowych, informacja o poziomie paliwa oraz blokady oświetlenia dziennego/autostradowego/miejskiego/dynamicznego doświetlania zakrętów.'
  ru: 'Данные BSI 7: запросы правого/левого поворотника, статус ближнего/дальнего света, информация об уровне топлива, а также блокировки дневных ходовых огней/автомагистрального/городского/динамического поворотного освещения.'
  zh: 'BSI数据7:左右转向灯请求、近光/远光状态、燃油油位信息,以及日间行车灯/高速公路/市区/弯道动态照明抑制。'
  hu: 'BSI adatok 7: jobb/bal index kérések, tompított/távolsági fény állapota, üzemanyagszint infó, valamint nappali menetfény/autópálya/városi/dinamikus kanyarfény-kikapcsolások.'
  pt: 'Dados 7 do computador de servidão: pedidos de piscas esquerdo/direito, estado dos médios/máximos, informação do nível de combustível, e inibições da iluminação diurna/autoestrada/cidade/curva dinâmica.'
observations:
  en: 'On state change of: LOW_BEAM_COMMAND, HIGH_BEAM_COMMAND, HEADLIGHT_FLASH_COMMAND, SIDE_LIGHTS_COMMAND, WELCOME_LIGHTING_MODE, WELCOME_SCREEN_COLOR, SILENT_VEHICLE_SOUND_COMMAND, REVERSE_STATUS, DRL_COMMAND'
  fr: 'Sur changement d''état de : LOW_BEAM_COMMAND, HIGH_BEAM_COMMAND, HEADLIGHT_FLASH_COMMAND, SIDE_LIGHTS_COMMAND, WELCOME_LIGHTING_MODE, WELCOME_SCREEN_COLOR, SILENT_VEHICLE_SOUND_COMMAND, REVERSE_STATUS, DRL_COMMAND'
  es: 'Al cambiar el estado de: LOW_BEAM_COMMAND, HIGH_BEAM_COMMAND, HEADLIGHT_FLASH_COMMAND, SIDE_LIGHTS_COMMAND, WELCOME_LIGHTING_MODE, WELCOME_SCREEN_COLOR, SILENT_VEHICLE_SOUND_COMMAND, REVERSE_STATUS, DRL_COMMAND'
  de: 'Bei Statusänderung von: LOW_BEAM_COMMAND, HIGH_BEAM_COMMAND, HEADLIGHT_FLASH_COMMAND, SIDE_LIGHTS_COMMAND, WELCOME_LIGHTING_MODE, WELCOME_SCREEN_COLOR, SILENT_VEHICLE_SOUND_COMMAND, REVERSE_STATUS, DRL_COMMAND'
  it: 'Al cambiamento di stato di: LOW_BEAM_COMMAND, HIGH_BEAM_COMMAND, HEADLIGHT_FLASH_COMMAND, SIDE_LIGHTS_COMMAND, WELCOME_LIGHTING_MODE, WELCOME_SCREEN_COLOR, SILENT_VEHICLE_SOUND_COMMAND, REVERSE_STATUS, DRL_COMMAND'
  pl: 'Wysyłane przy zmianie stanu: LOW_BEAM_COMMAND, HIGH_BEAM_COMMAND, HEADLIGHT_FLASH_COMMAND, SIDE_LIGHTS_COMMAND, WELCOME_LIGHTING_MODE, WELCOME_SCREEN_COLOR, SILENT_VEHICLE_SOUND_COMMAND, REVERSE_STATUS, DRL_COMMAND'
  ru: 'При изменении состояния: LOW_BEAM_COMMAND, HIGH_BEAM_COMMAND, HEADLIGHT_FLASH_COMMAND, SIDE_LIGHTS_COMMAND, WELCOME_LIGHTING_MODE, WELCOME_SCREEN_COLOR, SILENT_VEHICLE_SOUND_COMMAND, REVERSE_STATUS, DRL_COMMAND'
  zh: '当CMD_FEUX_CROIST, HIGH_BEAM_COMMAND, HEADLIGHT_FLASH_COMMAND, SIDE_LIGHTS_COMMAND, WELCOME_LIGHTING_MODE, WELCOME_SCREEN_COLOR, SILENT_VEHICLE_SOUND_COMMAND, REVERSE_STATUS, CMD_DRL状态变化时'
  hu: 'A(z) LOW_BEAM_COMMAND, HIGH_BEAM_COMMAND, HEADLIGHT_FLASH_COMMAND, SIDE_LIGHTS_COMMAND, WELCOME_LIGHTING_MODE, WELCOME_SCREEN_COLOR, SILENT_VEHICLE_SOUND_COMMAND, REVERSE_STATUS, DRL_COMMAND állapotváltozásakor'
  pt: 'Na mudança de estado de: LOW_BEAM_COMMAND, HIGH_BEAM_COMMAND, HEADLIGHT_FLASH_COMMAND, SIDE_LIGHTS_COMMAND, WELCOME_LIGHTING_MODE, WELCOME_SCREEN_COLOR, SILENT_VEHICLE_SOUND_COMMAND, REVERSE_STATUS, DRL_COMMAND'
