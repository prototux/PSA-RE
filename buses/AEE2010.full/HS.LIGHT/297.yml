id: 0x297
name: 'LED_DRIVER_RIGHT_LEVELLING_POSITION'
type: 'can'
length: 2
comment:
  en: 'Right headlight beam-levelling actuator: current position and direction sign.'
  fr: 'Actionneur de correcteur d''assiette du phare droit : position actuelle et signe de direction.'
  es: 'Actuador de nivelación del faro derecho: posición actual y signo de dirección.'
  de: 'Leuchtweitenregler-Aktuator des rechten Scheinwerfers: aktuelle Position und Richtungsvorzeichen.'
  it: 'Attuatore correttore di assetto del faro destro: posizione attuale e segno di direzione.'
  pl: 'Siłownik regulacji zasięgu prawego reflektora: aktualna pozycja i znak kierunku.'
  ru: 'Привод корректора света правой фары: текущее положение и знак направления.'
  zh: '右前大灯光束调平执行器:当前位置和方向符号。'
  hu: 'A jobb fényszóró fényelosztás-állító aktuátora: aktuális pozíció és irányelőjel.'
  pt: 'Atuador de nivelamento do feixe do farol direito: posição atual e sinal de direção.'
periodicity: ['20ms']
senders: ['LED_DRIVER']
receivers: ['BCP']

signals:
  RIGHT_HEADLAMP_LEVEL_SIGN:
    bits: '1.7'
    comment:
      en: 'Sign of the right headlamp levelling position'
      fr: 'Signe de la position de correction d''assiette du projecteur droit'
      es: 'Signo de la posición de nivelación del faro derecho'
      de: 'Vorzeichen der Niveauregulierungsposition des rechten Scheinwerfers'
      it: 'Segno della posizione di correzione assetto del faro destro'
      pl: 'Znak pozycji korekcji zasięgu prawego reflektora'
      ru: 'Знак положения корректора уровня правой фары'
      zh: '右前照灯调平位置符号'
      hu: 'A jobb fényszóró szintezési helyzetének előjele'
      pt: 'Sinal da posição de nivelamento do farol direito'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Positive'
        fr: 'Positif'
        es: 'Positivo'
        de: 'Positiv'
        it: 'Positivo'
        pl: 'Dodatnie'
        ru: 'Положительное'
        zh: '正'
        hu: 'Pozitív'
        pt: 'Positivo'
      0x01:
        en: 'Negative'
        fr: 'Négative'
        es: 'Negativo'
        de: 'Negativ'
        it: 'Negativo'
        pl: 'Ujemny'
        ru: 'Отрицательный'
        zh: '负'
        hu: 'Negatív'
        pt: 'Negativo'

  RIGHT_HEADLAMP_LEVEL_POSITION:
    bits: '1.6-2.5'
    comment:
      en: 'Current right headlamp levelling actuator position (%rad)'
      fr: 'Position actuelle de l''actionneur de correcteur d''assiette du projecteur droit (%rad)'
      es: 'Posición actual del actuador de nivelación del faro derecho (%rad)'
      de: 'Aktuelle Position des Niveauregulierungsstellglieds des rechten Scheinwerfers (%rad)'
      it: 'Posizione attuale dell''attuatore di correzione assetto del faro destro (%rad)'
      pl: 'Aktualna pozycja siłownika korektora zasięgu prawego reflektora (%rad)'
      ru: 'Текущее положение привода корректора уровня правой фары (%rad)'
      zh: '右前照灯调平执行器当前位置(%rad)'
      hu: 'A jobb fényszóró szintező aktuátorának aktuális helyzete (%rad)'
      pt: 'Posição atual do atuador de nivelamento do farol direito (%rad)'
    type: 'uint'
    factor: 0.01
    min: 0
    max: 10.2
    units: '%rad'
    invalid: 0x3FF
    default: 0x00
