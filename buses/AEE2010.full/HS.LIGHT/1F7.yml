id: 0x1F7
name: 'RIGHT_LED_HEADLAMP_DRIVER_DATA'
type: 'can'
length: 7
comment:
  en: 'Right LED headlamp driver data: high-beam fading, power factor and shadow-edge angles/fading.'
  fr: 'Données du driver LED du phare droit : fondu du feu de route, facteur de puissance et angles/fondu de la zone d''ombre.'
  es: 'Datos del driver LED del faro derecho: atenuación de las luces de carretera, factor de potencia y ángulos/atenuación de la zona de sombra.'
  de: 'Daten des LED-Treibers des rechten Scheinwerfers: Fernlicht-Überblendung, Leistungsfaktor sowie Winkel/Überblendung der Schattenkante.'
  it: 'Dati del driver LED del faro destro: dissolvenza degli abbaglianti, fattore di potenza e angoli/dissolvenza del bordo d''ombra.'
  pl: 'Dane sterownika LED prawego reflektora: zanikanie światła drogowego, współczynnik mocy oraz kąty/zanikanie krawędzi cienia.'
  ru: 'Данные драйвера светодиодной фары справа: плавное изменение дальнего света, коэффициент мощности и углы/затухание границы тени.'
  zh: '右侧LED大灯驱动数据:远光渐变、功率因数以及阴影边缘角度/渐变。'
  hu: 'A jobb oldali LED fényszóró meghajtójának adatai: távfény áttűnés, teljesítménytényező, valamint az árnyékhatár szögei/áttűnése.'
  pt: 'Dados do driver do farol LED direito: esbatimento dos máximos, fator de potência e ângulos/esbatimento da linha de corte.'
periodicity: ['10ms']
senders: ['LED_DRIVER']

signals:
  HEADLAMP_HIGH_BEAM_FADE_RIGHT:
    bits: '1.7-1.0'
    comment:
      en: 'Fade time of the high beam, right headlamp'
      fr: 'Temps de fondu des feux de route, phare droit'
      es: 'Tiempo de desvanecimiento de las luces de carretera, faro derecho'
      de: 'Abblendzeit des Fernlichts, rechter Scheinwerfer'
      it: 'Tempo di dissolvenza degli abbaglianti, faro destro'
      pl: 'Czas zanikania świateł drogowych, prawy reflektor'
      ru: 'Время плавного изменения дальнего света, правая фара'
      zh: '右大灯远光渐变时间'
      hu: 'A távolsági fény elhalványulási ideje, jobb fényszóró'
      pt: 'Tempo de esbatimento dos máximos, farol direito'
    type: 'uint'
    factor: 0.02
    min: 0
    max: 5
    units: 's'
    default: 0x00

  HEADLAMP_SHADOW_FADE_UP_RIGHT:
    bits: '2.7-2.0'
    comment:
      en: 'Fade-up time of the darkness (cut-off) zone, right headlamp'
      fr: 'Temps de fondu montant de la zone d''obscurité, phare droit'
      es: 'Tiempo de desvanecimiento ascendente de la zona de oscuridad, faro derecho'
      de: 'Aufblendzeit des Dunkelbereichs, rechter Scheinwerfer'
      it: 'Tempo di dissolvenza in aumento della zona d''ombra, faro destro'
      pl: 'Czas zanikania w górę strefy zaciemnienia, prawy reflektor'
      ru: 'Время плавного появления тёмной зоны, правая фара'
      zh: '右大灯暗区渐亮时间'
      hu: 'A sötét zóna felfelé történő elhalványulási ideje, jobb fényszóró'
      pt: 'Tempo de esbatimento ascendente da zona de escuridão, farol direito'
    type: 'uint'
    factor: 0.02
    min: 0
    max: 5
    units: 's'
    default: 0x00

  HEADLAMP_SHADOW_FADE_DOWN_RIGHT:
    bits: '3.7-3.0'
    comment:
      en: 'Fade-down time of the darkness (cut-off) zone, right headlamp'
      fr: 'Temps de fondu descendant de la zone d''obscurité, phare droit'
      es: 'Tiempo de desvanecimiento descendente de la zona de oscuridad, faro derecho'
      de: 'Abblendzeit des Dunkelbereichs, rechter Scheinwerfer'
      it: 'Tempo di dissolvenza in diminuzione della zona d''ombra, faro destro'
      pl: 'Czas zanikania w dół strefy zaciemnienia, prawy reflektor'
      ru: 'Время плавного затемнения тёмной зоны, правая фара'
      zh: '右大灯暗区渐暗时间'
      hu: 'A sötét zóna lefelé történő elhalványulási ideje, jobb fényszóró'
      pt: 'Tempo de esbatimento descendente da zona de escuridão, farol direito'
    type: 'uint'
    factor: 0.02
    min: 0
    max: 5
    units: 's'
    default: 0x00

  HEADLAMP_POWER_FACTOR_RIGHT:
    bits: '4.7-5.6'
    comment:
      en: 'Power factor of the right headlamp LEDs'
      fr: 'Facteur de puissance des LED du phare droit'
      es: 'Factor de potencia de los LED del faro derecho'
      de: 'Leistungsfaktor der LEDs des rechten Scheinwerfers'
      it: 'Fattore di potenza dei LED del faro destro'
      pl: 'Współczynnik mocy diod LED prawego reflektora'
      ru: 'Коэффициент мощности светодиодов правой фары'
      zh: '右大灯LED功率系数'
      hu: 'A jobb fényszóró LED-jeinek teljesítménytényezője'
      pt: 'Fator de potência dos LED do farol direito'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 100
    units: '%'
    default: 0x00

  HEADLAMP_SHADOW_LEFT_ANGLE_RIGHT:
    bits: '5.5-6.5'
    comment:
      en: 'Left darkness (cut-off) angle, seen from the right headlamp'
      fr: 'Angle gauche d''obscurité vu depuis le phare droit'
      es: 'Ángulo izquierdo de oscuridad visto desde el faro derecho'
      de: 'Linker Dunkelbereichswinkel, gesehen vom rechten Scheinwerfer'
      it: 'Angolo sinistro di oscurità visto dal faro destro'
      pl: 'Lewy kąt zaciemnienia widziany z prawego reflektora'
      ru: 'Левый угол затемнения, видимый от правой фары'
      zh: '从右大灯观察的左侧暗区角度'
      hu: 'A jobb fényszóróból nézett bal sötétedési szög'
      pt: 'Ângulo esquerdo de escuridão (corte), visto a partir do farol direito'
    type: 'sint'
    factor: 0.1
    min: -25
    max: 25
    units: '°'
    default: 0x00

  HEADLAMP_SHADOW_RIGHT_ANGLE_RIGHT:
    bits: '6.4-7.4'
    comment:
      en: 'Right darkness (cut-off) angle, seen from the right headlamp'
      fr: 'Angle droit d''obscurité vu depuis le phare droit'
      es: 'Ángulo derecho de oscuridad visto desde el faro derecho'
      de: 'Rechter Dunkelbereichswinkel, gesehen vom rechten Scheinwerfer'
      it: 'Angolo destro di oscurità visto dal faro destro'
      pl: 'Prawy kąt zaciemnienia widziany z prawego reflektora'
      ru: 'Правый угол затемнения, видимый от правой фары'
      zh: '从右大灯观察的右侧暗区角度'
      hu: 'A jobb fényszóróból nézett jobb sötétedési szög'
      pt: 'Ângulo direito de escuridão (corte), visto a partir do farol direito'
    type: 'sint'
    factor: 0.1
    min: -25
    max: 25
    units: '°'
    default: 0x00
