id: 0x4B7
name: 'LED_DRIVER_LEFT_STATUS'
type: 'can'
length: 3
comment:
  en: 'Left headlight LED driver status 2: low/high-beam and indicator diagnostics, beam-levelling actuator state, electrical level, step loss, temperature and voltage.'
  fr: 'État 2 du pilote LED du phare gauche : diagnostics feux de croisement/route et clignotant, état de l''actionneur de correcteur d''assiette, niveau électrique, perte de pas, température et tension.'
  es: 'Estado 2 del driver LED del faro izquierdo: diagnósticos de luces de cruce/carretera e intermitente, estado del actuador de nivelación, nivel eléctrico, pérdida de pasos, temperatura y tensión.'
  de: 'Status 2 des LED-Treibers des linken Scheinwerfers: Diagnose von Abblend-/Fernlicht und Blinker, Zustand des Leuchtweitenreglers, elektrischer Pegel, Schrittverlust, Temperatur und Spannung.'
  it: 'Stato 2 del driver LED del faro sinistro: diagnostica anabbagliante/abbagliante e indicatore, stato attuatore correttore assetto, livello elettrico, perdita di passi, temperatura e tensione.'
  pl: 'Stan 2 sterownika LED lewego reflektora: diagnostyka świateł mijania/drogowych i kierunkowskazu, stan siłownika regulacji zasięgu, poziom elektryczny, utrata kroków, temperatura i napięcie.'
  ru: 'Статус 2 LED-драйвера левой фары: диагностика ближнего/дальнего света и поворотника, состояние привода корректора света, электрический уровень, потеря шагов, температура и напряжение.'
  zh: '左前大灯LED驱动器状态2:近光/远光和转向灯诊断、光束调节执行器状态、电气水平、步进丢失、温度和电压。'
  hu: 'A bal fényszóró LED-meghajtójának 2. állapota: tompított/távolsági fény és index diagnosztika, fényelosztás-állító aktuátor állapota, elektromos szint, lépésvesztés, hőmérséklet és feszültség.'
  pt: 'Estado 2 do driver de LED do farol esquerdo: diagnóstico dos médios/máximos e piscas, estado do atuador de nivelamento do feixe, nível elétrico, perda de passo, temperatura e tensão.'
periodicity: ['100ms']
senders: ['LED_DRIVER']
receivers: ['BCP']

