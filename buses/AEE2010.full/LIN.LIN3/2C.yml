id: 0x2C
name: 'HANDSFREE_TAILGATE_SENSOR_TR_STATUS'
type: 'lin'
length: 6
comment:
  en: 'Hands-free tailgate-opening sensor (TR) status: gesture detection and fault flags.'
  fr: 'État du capteur (TR) d''ouverture mains libres du coffre : détection de geste et défauts.'
  es: 'Estado del sensor (TR) de apertura manos libres del maletero: detección de gesto y fallos.'
  de: 'Status des Freihand-Öffnungssensors der Heckklappe (TR): Gestenerkennung und Fehler.'
  it: 'Stato del sensore (TR) di apertura mani libere del portellone: rilevamento gesto e guasti.'
  pl: 'Stan czujnika (TR) otwierania bagażnika bez użycia rąk: wykrywanie gestu i usterki.'
  ru: 'Статус датчика бесконтактного открытия багажника (TR): распознавание жеста и неисправности.'
  zh: '免提尾门开启传感器(TR)状态:手势检测和故障标志。'
  hu: 'A kihúzott kezes csomagtérnyitó érzékelő (TR) állapota: gesztusfelismerés és hibajelzők.'
  pt: 'Estado do sensor de abertura mãos-livres da porta traseira (TR): deteção de gesto e indicadores de avaria.'
periodicity: ['trigger']
senders: ['BAAS']
receivers: ['BSI']
lin:
  master: 'BSI'

signals:
  BAAS_TAILGATE_RESPONSE_ERROR:
    bits: '1.2'
    comment:
      en: 'Tailgate BAAS slave reports an error in the response field'
      fr: 'L''esclave BAAS hayon signale une erreur dans le champ réponse'
      es: 'El esclavo BAAS del portón indica un error en el campo de respuesta'
      de: 'Der Heckklappen-BAAS-Slave meldet einen Fehler im Antwortfeld'
      it: 'Lo slave BAAS del portellone segnala un errore nel campo di risposta'
      pl: 'Urządzenie podrzędne BAAS klapy tylnej zgłasza błąd w polu odpowiedzi'
      ru: 'Ведомое устройство BAAS задней двери сообщает об ошибке в поле ответа'
      zh: '尾门BAAS从设备在响应字段中报告错误'
      hu: 'A csomagtérajtó BAAS alárendelt egysége hibát jelez a válasz mezőben'
      pt: 'O escravo BAAS da porta da bagageira assinala um erro no campo de resposta'
    type: 'bool'
    values:
      0x00:
        en: 'No error detected'
        fr: 'Aucune erreur détectée'
        es: 'No se ha detectado ningún error'
        de: 'Kein Fehler erkannt'
        it: 'Nessun errore rilevato'
        pl: 'Nie wykryto błędu'
        ru: 'Ошибок не обнаружено'
        zh: '未检测到错误'
        hu: 'Nincs észlelt hiba'
        pt: 'Nenhum erro detetado'
      0x01:
        en: 'Error detected'
        fr: 'Erreur détectée'
        es: 'Error detectado'
        de: 'Fehler erkannt'
        it: 'Errore rilevato'
        pl: 'Wykryto błąd'
        ru: 'Обнаружена ошибка'
        zh: '检测到错误'
        hu: 'Hiba észlelve'
        pt: 'Erro detetado'

  BAA_VALID_GESTURE_TAILGATE:
    bits: '1.1'
    comment:
      en: 'Status indicating whether a valid hands-free access (BAA) gesture was recognized on the tailgate opening'
      fr: 'État indiquant si un geste valide d''accès mains libres (BAA) a été reconnu sur le hayon'
      es: 'Estado que indica si se ha reconocido un gesto válido de acceso manos libres (BAA) en el portón'
      de: 'Status, der anzeigt, ob eine gültige Freihandzugangs-Geste (BAA) an der Heckklappe erkannt wurde'
      it: 'Stato che indica se è stato riconosciuto un gesto valido di accesso mani libere (BAA) sul portellone'
      pl: 'Stan wskazujący, czy rozpoznano prawidłowy gest dostępu bezdotykowego (BAA) przy klapie tylnej'
      ru: 'Статус, указывающий, распознан ли действительный жест доступа без помощи рук (BAA) на задней двери'
      zh: '表示尾门是否识别到有效免提进入(BAA)手势的状态'
      hu: 'Állapot, amely jelzi, hogy érvényes kihands-free hozzáférési (BAA) gesztust érzékeltek-e a csomagtérajtón'
      pt: 'Estado que indica se foi reconhecido um gesto válido de acesso mãos-livres (BAA) na porta da mala'
    type: 'bool'
    values:
      0x00:
        en: 'Not detected'
        fr: 'Non détecté'
        es: 'No detectado'
        de: 'Nicht erkannt'
        it: 'Non rilevato'
        pl: 'Nie wykryto'
        ru: 'Не обнаружено'
        zh: '未检测到'
        hu: 'Nem észlelt'
        pt: 'Não detetado'
      0x01:
        en: 'Detected'
        fr: 'Détecté'
        es: 'Detectado'
        de: 'Erkannt'
        it: 'Rilevato'
        pl: 'Wykryto'
        ru: 'Обнаружено'
        zh: '已检测到'
        hu: 'Észlelve'
        pt: 'Detetado'

