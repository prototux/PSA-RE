id: 0x24
name: 'REAR_LEFT_TAILGATE_LAMP_STATUS'
type: 'lin'
length: 8
comment:
  en: 'Left rear tailgate-mounted lamp cluster status: indicator, position and stop lamp state and faults.'
  fr: 'État du bloc optique arrière gauche côté hayon : état et défauts des feux clignotant, position et stop.'
  es: 'Estado del bloque óptico trasero izquierdo lado portón: estado y fallos de las luces intermitente, posición y freno.'
  de: 'Status der hinteren Heckklappen-Leuchteneinheit links: Zustand und Fehler von Blinker-, Positions- und Bremsleuchte.'
  it: 'Stato del gruppo ottico posteriore sinistro lato portellone: stato e guasti delle luci indicatore, posizione e stop.'
  pl: 'Stan tylnego lewego zespołu lamp w klapie bagażnika: stan i usterki świateł kierunkowskazu, pozycyjnego i stop.'
  ru: 'Статус левого заднего фонаря в двери багажника: состояние и неисправности указателя поворота, габарита и стоп-сигнала.'
  zh: '尾门左后组合灯状态:转向灯、位置灯和刹车灯的状态及故障。'
  hu: 'A hátsó csomagtérajtó lámpaegység (bal) állapota: index, helyzetjelző és féklámpa állapota és hibái.'
  pt: 'Estado do bloco ótico traseiro esquerdo montado na porta da bagageira: estado e avarias dos piscas, luz de presença e de travagem.'
periodicity: ['trigger']
senders: ['FEU_AR']
receivers: ['BSI']
lin:
  master: 'BSI'

