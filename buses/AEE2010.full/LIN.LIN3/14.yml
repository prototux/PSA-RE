      de: 'Sollwert des vorderen Luftverteilungsmotors 1'
      it: 'Setpoint del motore di distribuzione anteriore 1'
      pl: 'Wartość zadana przedniego silnika rozdziału powietrza 1'
      ru: 'Задание переднего привода распределения воздуха 1'
      zh: '前排1号空气分配电机设定值'
      hu: 'Első 1. légelosztó motor alapjele'
