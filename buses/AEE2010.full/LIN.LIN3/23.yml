        pl: 'Licznik prób równy 0'
        ru: 'Счётчик попыток равен 0'
        zh: '尝试计数器等于0'
        hu: 'A próbálkozásszámláló 0'
        pt: 'Contador de tentativas igual a 0'
      0x01:
        en: 'Attempt counter equals 1'
        fr: 'Compteur de tentatives égal à 1'
        es: 'Contador de intentos igual a 1'
        de: 'Versuchszähler gleich 1'
        it: 'Contatore tentativi pari a 1'
        pl: 'Licznik prób równy 1'
        ru: 'Счётчик попыток равен 1'
        zh: '尝试计数器等于1'
        hu: 'A próbálkozásszámláló értéke 1'
        pt: 'Contador de tentativas igual a 1'
      0x02:
        en: 'Attempt counter equals 2'
        fr: 'Compteur de tentatives égal à 2'
        es: 'Contador de intentos igual a 2'
        de: 'Versuchszähler gleich 2'
