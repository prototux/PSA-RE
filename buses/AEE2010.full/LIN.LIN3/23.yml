id: 0x23
name: 'WAKEUP_BAAS_TR'
type: 'lin'
length: 8
comment:
  en: 'Sent by a node waking up the network; indicates the cause of the wake-up'
  fr: 'Émise par un organe qui réveille le réseau ; indique la cause du réveil'
  es: 'Enviada por un nodo que activa la red; indica la causa de la activación'
  de: 'Von einem Steuergerät gesendet, das das Netzwerk weckt; gibt die Weckursache an'
  it: 'Inviata da un nodo che risveglia la rete; indica la causa del risveglio'
  pl: 'Wysyłana przez węzeł budzący sieć; wskazuje przyczynę wybudzenia'
  ru: 'Отправляется узлом, пробуждающим сеть; указывает причину пробуждения'
  zh: '由唤醒网络的节点发送,指示唤醒原因'
  hu: 'A hálózatot ébresztő csomópont küldi; jelzi az ébresztés okát'
  pt: 'Enviada por um nó que desperta a rede; indica a causa do despertar.'
periodicity: ['trigger']
senders: ['BAAS']
lin:
  master: 'BSI'

signals:
  BAA_VALID_GESTURE_TAILGATE:
    bits: '1.0'
    comment:
      en: 'Status indicating whether a valid hands-free access (BAA) gesture was recognized on the tailgate opening'
      fr: 'État indiquant si un geste valide d''accès mains libres (BAA) a été reconnu sur le hayon'
      es: 'Estado que indica si se ha reconocido un gesto válido de acceso manos libres (BAA) en el portón'
      de: 'Status, der anzeigt, ob eine gültige Freihandzugangs-Geste (BAA) an der Heckklappe erkannt wurde'
      it: 'Stato che indica se è stato riconosciuto un gesto valido di accesso mani libere (BAA) sul portellone'
      pl: 'Stan wskazujący, czy rozpoznano prawidłowy gest dostępu bezdotykowego (BAA) przy klapie tylnej'
      ru: 'Статус, указывающий, распознан ли действительный жест доступа без помощи рук (BAA) на задней двери'
      zh: '表示尾门是否识别到有效免提进入(BAA)手势的状态'
      hu: 'Állapot, amely jelzi, hogy érvényes kihands-free hozzáférési (BAA) gesztust érzékeltek-e a csomagtérajtón'
      pt: 'Estado que indica se foi reconhecido um gesto válido de acesso mãos-livres (BAA) na porta da mala'
    type: 'bool'
    values:
      0x00:
        en: 'Not detected'
        fr: 'Non détecté'
        es: 'No detectado'
        de: 'Nicht erkannt'
        it: 'Non rilevato'
        pl: 'Nie wykryto'
        ru: 'Не обнаружено'
        zh: '未检测到'
        hu: 'Nem észlelt'
        pt: 'Não detetado'
      0x01:
        en: 'Detected'
        fr: 'Détecté'
        es: 'Detectado'
        de: 'Erkannt'
        it: 'Rilevato'
        pl: 'Wykryto'
        ru: 'Обнаружено'
        zh: '已检测到'
        hu: 'Észlelve'
        pt: 'Detetado'

  BAA_WAKEUP_ATTEMPT_COUNTER_TAILGATE:
    bits: '2.0-3.7'
    comment:
      en: 'Number of hands-free access (BAA) wake-up attempts by the tailgate slave ECU'
      fr: 'Nombre de tentatives de réveil de l''accès mains libres (BAA) par le calculateur esclave du hayon'
      es: 'Número de intentos de activación del acceso manos libres (BAA) por el calculador esclavo del portón'
      de: 'Anzahl der Aufwachversuche des Freihandzugangs (BAA) durch das Slave-Steuergerät der Heckklappe'
      it: 'Numero di tentativi di risveglio dell''accesso mani libere (BAA) da parte della centralina slave del portellone'
      pl: 'Liczba prób wybudzenia dostępu bezdotykowego (BAA) przez podrzędny sterownik klapy tylnej'
      ru: 'Число попыток пробуждения системы доступа без помощи рук (BAA) подчинённым блоком управления задней дверью'
      zh: '尾门从属ECU的免提进入(BAA)唤醒尝试次数'
      hu: 'A kihands-free hozzáférés (BAA) ébresztési kísérleteinek száma a csomagtérajtó alárendelt vezérlőegységétől'
      pt: 'Número de tentativas de ativação do acesso mãos-livres (BAA) pela unidade escrava da porta da mala'
    type: 'enum'
    values:
      0x00:
