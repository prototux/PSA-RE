id: 0x11
name: 'ELECTRIC_COMPRESSOR_HEATER_COMMAND'
type: 'lin'
length: 4
comment:
  en: 'Commands sent over LIN to the electric AC compressor and PTC heater: activation, power limit and speed setpoints, fault erase and consumption cutoff.'
  fr: 'Commandes envoyées sur le bus LIN au compresseur électrique de climatisation et au chauffage PTC : activation, consignes de puissance limite et de régime, effacement défaut et coupure de consommation.'
  es: 'Órdenes enviadas por el bus LIN al compresor eléctrico de climatización y a la calefacción PTC: activación, consignas de límite de potencia y de régimen, borrado de fallo y corte de consumo.'
  de: 'Über den LIN-Bus an den elektrischen Klimakompressor und die PTC-Heizung gesendete Befehle: Aktivierung, Leistungsgrenz- und Drehzahlsollwerte, Fehlerlöschung und Verbrauchsabschaltung.'
  it: 'Comandi inviati sul bus LIN al compressore elettrico del climatizzatore e al riscaldatore PTC: attivazione, setpoint di potenza limite e di regime, cancellazione guasto e interruzione del consumo.'
  pl: 'Polecenia wysyłane po magistrali LIN do elektrycznej sprężarki klimatyzacji i grzałki PTC: aktywacja, zadana moc graniczna i obroty, kasowanie usterki i odcięcie poboru mocy.'
  ru: 'Команды, отправляемые по шине LIN на электрический компрессор кондиционера и PTC-нагреватель: активация, заданные значения предельной мощности и оборотов, стирание неисправности и отключение потребления.'
  zh: '通过LIN总线发送给电动空调压缩机和PTC加热器的命令：激活、功率限值和转速设定值、故障清除及耗电切断。'
  hu: 'A LIN buszon az elektromos klímakompresszornak és a PTC-fűtésnek küldött parancsok: aktiválás, teljesítményhatár- és fordulatszám-alapjelek, hibatörlés és fogyasztás-lekapcsolás.'
  pt: 'Comandos enviados via LIN ao compressor elétrico de ar condicionado e ao aquecedor PTC: ativação, limite de potência e pontos de ajuste de velocidade, apagamento de avarias e corte de consumo.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['CTPA']
lin:
  master: 'BSI'

signals:
  AIR_PTC_POWER_ACTIVATION_COMMAND:
    bits: '1.7'
    comment:
      en: 'Power activation command for the air PTC heater'
      fr: 'Commande d''activation de puissance de la CTP air'
      es: 'Comando de activación de potencia del calefactor PTC de aire'
      de: 'Leistungsaktivierungsbefehl des Luft-PTC-Heizelements'
      it: 'Comando di attivazione della potenza della CTP aria'
      pl: 'Polecenie aktywacji mocy grzałki PTC powietrza'
      ru: 'Команда активации мощности воздушного PTC-нагревателя'
      zh: '空气PTC加热器功率激活指令'
      hu: 'A légfűtő PTC-elem teljesítmény-aktiválási parancsa'
      pt: 'Comando de ativação de potência do CTP de ar'
    type: 'bool'
    values:
      0x00:
        en: 'No action'
        fr: 'Pas de pilotage'
        es: 'Sin acción'
        de: 'Keine Ansteuerung'
        it: 'Nessuna azione'
        pl: 'Brak sterowania'
        ru: 'Нет управления'
        zh: '无操作'
        hu: 'Nincs vezérlés'
        pt: 'Sem controlo'
      0x01:
        en: 'Control'
        fr: 'Pilotage'
        es: 'Control'
        de: 'Ansteuerung'
        it: 'Comando'
        pl: 'Sterowanie'
        ru: 'Управление'
        zh: '控制'
        hu: 'Vezérlés'
        pt: 'Controlo'

