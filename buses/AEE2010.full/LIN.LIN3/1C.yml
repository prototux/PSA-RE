        pl: 'Nieobecny / schowany'
        ru: 'Отсутствует / убран'
        zh: '缺失/已缩回'
        hu: 'Hiányzik / behúzva'
        pt: 'Ausente / retraído'
      0x01:
        en: 'Deployed'
        fr: 'Déployé'
        es: 'Desplegado'
        de: 'Ausgefahren'
        it: 'Estratto'
        pl: 'Rozłożony'
        ru: 'Развёрнут'
        zh: '已展开'
        hu: 'Kihajtva'
        pt: 'Desdobrado'
      0x02:
        en: 'Moving'
