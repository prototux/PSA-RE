id: 0x1C
name: 'MOTION_SENSOR_COMMAND_RIGHT'
type: 'lin'
length: 2
comment:
  en: 'Command and state for the right ultrasonic anti-lift/motion sensor, including tow hitch presence, sent by the BSI.'
  fr: 'Commande et état du capteur anti-soulèvement/mouvement à ultrasons droit, incluant la présence d''attelage, envoyés par la BSI.'
  es: 'Orden y estado del sensor de movimiento/antielevación por ultrasonidos derecho, incluyendo la presencia de enganche de remolque, enviados por la BSI.'
  de: 'Befehl und Zustand des rechten Ultraschall-Anhebe-/Bewegungssensors, einschließlich Anhängerkupplungserkennung, gesendet von der BSI.'
  it: 'Comando e stato del sensore anti-sollevamento/movimento a ultrasuoni destro, inclusa la presenza del gancio traino, inviati dalla BSI.'
  pl: 'Polecenie i stan prawego ultradźwiękowego czujnika ruchu/uniesienia, w tym obecność haka holowniczego, wysyłane przez BSI.'
  ru: 'Команда и состояние правого ультразвукового датчика подъёма/движения, включая наличие фаркопа, отправляемые BSI.'
  zh: '右侧超声波防举升/移动传感器的命令与状态（包含拖车钩存在检测），由BSI发送。'
  hu: 'A jobb oldali ultrahangos megemelés-/mozgásérzékelő parancsa és állapota, beleértve a vonóhorog jelenlétét, a BSI küldi.'
  pt: 'Comando e estado do sensor ultrassónico anti-elevação/movimento direito, incluindo presença de engate de reboque, enviados pela BSI.'
periodicity: ['trigger']
senders: ['BSI']
lin:
  master: 'BSI'

signals:
  BAA_TOW_HITCH_STATUS:
    bits: '1.5-1.4'
    comment:
      en: 'Status of the tow hitch used by the "loaded arms access" function'
      fr: 'État de l''attelage utilisé par la fonction « accès bras chargés »'
      es: 'Estado del enganche de remolque utilizado por la función "acceso brazos cargados"'
      de: 'Status der von der Funktion "beladene Arme Zugang" genutzten Anhängerkupplung'
      it: 'Stato del gancio traino utilizzato dalla funzione "accesso braccia cariche"'
      pl: 'Stan haka holowniczego wykorzystywanego przez funkcję "dostęp z obciążonymi rękami"'
      ru: 'Состояние тягово-сцепного устройства, используемого функцией "доступ с занятыми руками"'
      zh: '“负重双手进出”功能所用牵引钩的状态'
      hu: 'A „terhelt karokkal történő hozzáférés” funkció által használt vonóhorog állapota'
      pt: 'Estado do engate de reboque utilizado pela função «acesso com braços carregados»'
    type: 'enum'
    values:
      0x00:
        en: 'Absent / retracted'
        fr: 'Absent / rétracté'
        es: 'Ausente / retraído'
        de: 'Nicht vorhanden / eingefahren'
