id: 0x13
name: 'REAR_LIGHT_COMMAND'
type: 'lin'
length: 2
comment:
  en: 'Rear light intensity level and delay, sent by the BSI over LIN.'
  fr: 'Niveau d''intensité et temporisation des feux arrière, envoyés par la BSI sur le bus LIN.'
  es: 'Nivel de intensidad y temporización de las luces traseras, enviados por la BSI por el bus LIN.'
  de: 'Intensitätsstufe und Verzögerung der Heckleuchten, von der BSI über den LIN-Bus gesendet.'
  it: 'Livello di intensità e temporizzazione delle luci posteriori, inviati dalla BSI sul bus LIN.'
  pl: 'Poziom natężenia i opóźnienie świateł tylnych, wysyłane przez BSI po magistrali LIN.'
  ru: 'Уровень интенсивности и задержка задних фонарей, отправляемые BSI по шине LIN.'
  zh: '由BSI通过LIN总线发送的尾灯亮度等级及延时。'
  hu: 'A hátsó lámpák fényerőszintje és késleltetése, a BSI küldi a LIN buszon.'
  pt: 'Nível de intensidade e atraso das luzes traseiras, enviados pela BSI via LIN.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['FEU_AR']
lin:
  master: 'BSI'

