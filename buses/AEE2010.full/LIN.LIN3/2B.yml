id: 0x2B
name: 'HANDSFREE_TAILGATE_SENSOR_LEFT_STATUS'
type: 'lin'
length: 4
comment:
  en: 'Left hands-free tailgate-opening sensor status: gesture detection and fault flags.'
  fr: 'État du capteur gauche d''ouverture mains libres du coffre : détection de geste et défauts.'
  es: 'Estado del sensor izquierdo de apertura manos libres del maletero: detección de gesto y fallos.'
  de: 'Status des linken Freihand-Öffnungssensors der Heckklappe: Gestenerkennung und Fehler.'
  it: 'Stato del sensore sinistro di apertura mani libere del portellone: rilevamento gesto e guasti.'
  pl: 'Stan lewego czujnika otwierania bagażnika bez użycia rąk: wykrywanie gestu i usterki.'
  ru: 'Статус левого датчика бесконтактного открытия багажника: распознавание жеста и неисправности.'
  zh: '左侧免提尾门开启传感器状态:手势检测和故障标志。'
  hu: 'A bal oldali kihúzott kezes csomagtérnyitó érzékelő állapota: gesztusfelismerés és hibajelzők.'
  pt: 'Estado do sensor esquerdo de abertura mãos-livres da porta traseira: deteção de gesto e indicadores de avaria.'
periodicity: ['trigger']
senders: ['BAAS']
receivers: ['BSI']
lin:
  master: 'BSI'

signals:
  BAAS_LEFT_RESPONSE_ERROR:
    bits: '1.2'
    comment:
      en: 'Left BAAS slave reports an error in the response field'
      fr: 'L''esclave BAAS gauche signale une erreur dans le champ réponse'
      es: 'El esclavo BAAS izquierdo indica un error en el campo de respuesta'
      de: 'Der linke BAAS-Slave meldet einen Fehler im Antwortfeld'
      it: 'Lo slave BAAS sinistro segnala un errore nel campo di risposta'
      pl: 'Urządzenie podrzędne BAAS lewe zgłasza błąd w polu odpowiedzi'
      ru: 'Ведомое устройство левого BAAS сообщает об ошибке в поле ответа'
      zh: '左侧BAAS从设备在响应字段中报告错误'
      hu: 'A bal oldali BAAS alárendelt egység hibát jelez a válasz mezőben'
      pt: 'O escravo BAAS esquerdo assinala um erro no campo de resposta'
    type: 'bool'
    values:
      0x00:
        en: 'No error detected'
        fr: 'Aucune erreur détectée'
        es: 'No se ha detectado ningún error'
        de: 'Kein Fehler erkannt'
        it: 'Nessun errore rilevato'
        pl: 'Nie wykryto błędu'
        ru: 'Ошибок не обнаружено'
        zh: '未检测到错误'
        hu: 'Nincs észlelt hiba'
        pt: 'Nenhum erro detetado'
      0x01:
        en: 'Error detected'
        fr: 'Erreur détectée'
        es: 'Error detectado'
        de: 'Fehler erkannt'
        it: 'Errore rilevato'
        pl: 'Wykryto błąd'
        ru: 'Обнаружена ошибка'
        zh: '检测到错误'
        hu: 'Hiba észlelve'
        pt: 'Erro detetado'

  BAA_VALID_GESTURE_LEFT:
    bits: '1.1'
    comment:
      en: 'Status indicating whether a valid hands-free access (BAA) gesture was recognized on the left opening (sliding door or tailgate)'
      fr: 'État indiquant si un geste valide d''accès mains libres (BAA) a été reconnu sur l''ouvrant gauche (porte coulissante ou hayon)'
      es: 'Estado que indica si se ha reconocido un gesto válido de acceso manos libres (BAA) en la abertura izquierda (puerta corredera o portón)'
      de: 'Status, der anzeigt, ob eine gültige Freihandzugangs-Geste (BAA) an der linken Öffnung (Schiebetür oder Heckklappe) erkannt wurde'
      it: 'Stato che indica se è stato riconosciuto un gesto valido di accesso mani libere (BAA) sull''apertura sinistra (porta scorrevole o portellone)'
      pl: 'Stan wskazujący, czy rozpoznano prawidłowy gest dostępu bezdotykowego (BAA) przy lewym otworze (drzwi przesuwne lub klapa tylna)'
      ru: 'Статус, указывающий, распознан ли действительный жест доступа без помощи рук (BAA) на левом проёме (сдвижная дверь или задняя дверь)'
      zh: '表示左侧开口(滑动门或尾门)是否识别到有效免提进入(BAA)手势的状态'
      hu: 'Állapot, amely jelzi, hogy érvényes kihands-free hozzáférési (BAA) gesztust érzékeltek-e a bal oldali nyíláson (tolóajtó vagy csomagtérajtó)'
      pt: 'Estado que indica se foi reconhecido um gesto válido de acesso mãos-livres (BAA) na abertura esquerda (porta corrediça ou porta da mala)'
    type: 'bool'
    values:
      0x00:
        en: 'Not detected'
        fr: 'Non détecté'
        es: 'No detectado'
        de: 'Nicht erkannt'
        it: 'Non rilevato'
        pl: 'Nie wykryto'
        ru: 'Не обнаружено'
        zh: '未检测到'
        hu: 'Nem észlelt'
        pt: 'Não detetado'
      0x01:
        en: 'Detected'
        fr: 'Détecté'
        es: 'Detectado'
        de: 'Erkannt'
        it: 'Rilevato'
        pl: 'Wykryto'
        ru: 'Обнаружено'
        zh: '已检测到'
        hu: 'Észlelve'
        pt: 'Detetado'

  BAAS_SENSOR_STATE_LEFT:
    bits: '1.0'
    comment:
      en: 'Sensor state of the busy-arms access function on the left opening (left sliding door or tailgate)'
      fr: 'État du capteur de la fonction d''accès à bras occupés sur l''ouvrant gauche (porte coulissante gauche ou hayon)'
      es: 'Estado del sensor de la función de acceso con brazos ocupados en la abertura izquierda (puerta corredera izquierda o portón)'
      de: 'Sensorstatus der Funktion für den Zugang mit belegten Armen an der linken Öffnung (linke Schiebetür oder Heckklappe)'
      it: 'Stato del sensore della funzione di accesso a mani occupate sull''apertura sinistra (porta scorrevole sinistra o portellone)'
      pl: 'Stan czujnika funkcji dostępu z zajętymi rękami dla lewego otworu (lewe drzwi przesuwne lub klapa tylna)'
      ru: 'Состояние датчика функции доступа с занятыми руками для левого проёма (левая сдвижная дверь или задняя дверь)'
      zh: '左侧开口(左侧滑门或尾门)免提进出功能传感器状态'
      hu: 'A kéz nélküli hozzáférés funkció érzékelőjének állapota a bal oldali nyíláson (bal oldali tolóajtó vagy csomagtérajtó)'
      pt: 'Estado do sensor da função de acesso com braços ocupados na abertura esquerda (porta corrediça esquerda ou porta da mala)'
    type: 'bool'
    values:
      0x00:
        en: 'Defective'
        fr: 'Défectueux'
        es: 'Defectuoso'
        de: 'Defekt'
        it: 'Difettoso'
        pl: 'Uszkodzony'
        ru: 'Неисправно'
        zh: '有缺陷'
        hu: 'Hibás'
        pt: 'Defeituoso'
      0x01:
        en: 'Operational'
        fr: 'Opérationnel'
        es: 'Operativo'
        de: 'Betriebsbereit'
        it: 'Operativo'
        pl: 'Sprawny'
        ru: 'Работоспособно'
        zh: '运行正常'
        hu: 'Üzemképes'
        pt: 'Operacional'

