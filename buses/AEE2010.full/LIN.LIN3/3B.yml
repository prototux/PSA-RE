id: 0x3B
name: 'FLUSH_HANDLE_STATUS_RR'
type: 'lin'
length: 8
comment:
  en: 'LIN3 network power state command, sent by the BSI, including communication-off information.'
  fr: 'Commande d''état d''alimentation du réseau LIN3, envoyée par la BSI, incluant l''information de coupure de communication.'
  es: 'Orden de estado de alimentación de la red LIN3, enviada por la BSI, incluyendo la información de corte de comunicación.'
  de: 'Befehl zum Versorgungszustand des LIN3-Netzwerks, von der BSI gesendet, einschließlich Kommunikationsausfallinformation.'
  it: 'Comando di stato di alimentazione della rete LIN3, inviato dalla BSI, comprese le informazioni di interruzione della comunicazione.'
  pl: 'Polecenie stanu zasilania sieci LIN3, wysyłane przez BSI, wraz z informacją o wyłączeniu komunikacji.'
  ru: 'Команда состояния питания сети LIN3, отправляемая BSI, включая информацию об отключении связи.'
  zh: '由BSI发送的LIN3网络供电状态命令，包含通信关闭信息。'
  hu: 'A LIN3 hálózat tápellátási állapotának parancsa, a BSI küldi, a kommunikáció-kikapcsolási információval együtt.'
  pt: 'Comando do estado de alimentação da rede LIN3, enviado pela BSI, incluindo informação de comunicação desativada.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['CLIM_AV']
lin:
  master: 'BSI'

signals:
  LIN_NETWORK_COMMAND:
    bits: '1.7-1.0'
    comment:
      en: 'LIN network wake-up/sleep command'
      fr: 'Commande de mise en veille/réveil du réseau LIN'
      es: 'Mando de reposo/activación de la red LIN'
      de: 'Schlaf-/Aufwachbefehl des LIN-Netzwerks'
      it: 'Comando di stand-by/risveglio della rete LIN'
      pl: 'Polecenie uśpienia/wybudzenia sieci LIN'
      ru: 'Команда перехода в сон/пробуждения сети LIN'
      zh: 'LIN 总线休眠/唤醒指令'
      hu: 'LIN hálózat alvó/ébresztési parancs'
      pt: 'Comando de repouso/ativação da rede LIN'
    type: 'enum'
    values:
      0x00:
        en: 'Preparing to enter sleep mode'
        fr: 'Préparation à la mise en veille'
        es: 'Preparación para entrar en reposo'
        de: 'Vorbereitung auf den Ruhezustand'
        it: 'Preparazione all''ingresso in standby'
        pl: 'Przygotowanie do przejścia w stan uśpienia'
        ru: 'Подготовка к переходу в спящий режим'
        zh: '准备进入休眠'
        hu: 'Felkészülés alvó módra'
        pt: 'A preparar para entrar em modo adormecido'
      0x01:
        en: 'Wake-up authorisation'
        fr: 'Autorisation du réveil'
        es: 'Autorización de activación'
        de: 'Weckfreigabe'
        it: 'Autorizzazione al risveglio'
        pl: 'Zezwolenie na wybudzenie'
        ru: 'Разрешение пробуждения'
        zh: '唤醒授权'
        hu: 'Ébresztési engedély'
        pt: 'Autorização de ativação'
      0xFF:
        en: 'Invalid'
        fr: 'Invalide'
        es: 'Inválido'
        de: 'Ungültig'
        it: 'Non valido'
        pl: 'Nieprawidłowe'
        ru: 'Недействительно'
        zh: '无效'
        hu: 'Érvénytelen'
        pt: 'Inválido'

  COM_OFF_STATE:
    bits: '2.0'
    comment:
      en: 'Communication off (COM OFF) state'
      fr: 'État de communication désactivée (COM OFF)'
      es: 'Estado de comunicación desactivada (COM OFF)'
      de: 'Status der deaktivierten Kommunikation (COM OFF)'
      it: 'Stato di comunicazione disattivata (COM OFF)'
      pl: 'Stan wyłączonej komunikacji (COM OFF)'
      ru: 'Состояние отключённой связи (COM OFF)'
      zh: '通信关闭(COM OFF)状态'
      hu: 'Kommunikáció kikapcsolva (COM OFF) állapot'
      pt: 'Estado de comunicação desligada (COM OFF)'
    type: 'bool'
    values:
      0x00:
        en: 'Not activated'
        fr: 'Non activé'
        es: 'No activado'
        de: 'Nicht aktiviert'
        it: 'Non attivato'
        pl: 'Nieaktywowane'
        ru: 'Не активировано'
        zh: '未激活'
        hu: 'Nincs aktiválva'
        pt: 'Não ativado'
      0x01:
        en: 'Activated'
        fr: 'Activé'
        es: 'Activado'
        de: 'Aktiviert'
        it: 'Attivato'
        pl: 'Aktywowane'
        ru: 'Активировано'
        zh: '已激活'
        hu: 'Aktiválva'
        pt: 'Ativado'
