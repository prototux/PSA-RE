      pl: 'Usterka zabezpieczenia (temperatura, prąd, przeciążenie, zablokowany moment)'
      ru: 'Неисправность защитного отключения (температура, ток, перегрузка, заблокированный момент)'
      zh: '保护性关闭故障(温度、电流、过载、扭矩卡滞)'
      hu: 'Védelmi leállási hiba (hőmérséklet, áram, túlterhelés, blokkolt nyomaték)'
