id: 0x12
name: 'AC_COMPRESSOR_STATUS'
type: 'lin'
length: 6
comment:
  en: 'Electric A/C compressor status: supply/protection faults, operating speed, current consumption and power limitation.'
  fr: 'État du compresseur de climatisation électrique : défauts d''alimentation/protection, régime de fonctionnement, consommation de courant et limitation de puissance.'
  es: 'Estado del compresor eléctrico de A/C: fallos de alimentación/protección, régimen de funcionamiento, consumo de corriente y limitación de potencia.'
  de: 'Status des elektrischen Klimakompressors: Versorgungs-/Schutzfehler, Betriebsdrehzahl, Stromaufnahme und Leistungsbegrenzung.'
  it: 'Stato del compressore A/C elettrico: guasti di alimentazione/protezione, regime di funzionamento, consumo di corrente e limitazione di potenza.'
  pl: 'Stan elektrycznej sprężarki klimatyzacji: usterki zasilania/zabezpieczeń, prędkość obrotowa, pobór prądu i ograniczenie mocy.'
  ru: 'Статус электрического компрессора кондиционера: неисправности питания/защиты, рабочая скорость, потребляемый ток и ограничение мощности.'
  zh: '电动空调压缩机状态:供电/保护故障、运行转速、电流消耗及功率限制。'
  hu: 'Az elektromos klímakompresszor állapota: tápellátási/védelmi hibák, üzemi fordulatszám, áramfelvétel és teljesítménykorlátozás.'
  pt: 'Estado do compressor elétrico de ar condicionado: avarias de alimentação/proteção, velocidade de funcionamento, consumo de corrente e limitação de potência.'
periodicity: ['trigger']
senders: ['CCE']
receivers: ['BSI']
lin:
  master: 'BSI'

signals:
  ELECTRIC_COMPRESSOR_CURRENT:
    bits: '1.0-2.0'
    comment:
      en: 'Electric compressor current consumption'
      fr: 'Courant consommé par le compresseur électrique'
      es: 'Corriente consumida por el compresor eléctrico'
      de: 'Vom elektrischen Kompressor aufgenommener Strom'
      it: 'Corrente assorbita dal compressore elettrico'
      pl: 'Prąd pobierany przez sprężarkę elektryczną'
      ru: 'Ток, потребляемый электрическим компрессором'
      zh: '电动压缩机消耗电流'
      hu: 'Az elektromos kompresszor áramfelvétele'
      pt: 'Consumo de corrente do compressor elétrico'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 50
    units: 'A'
    invalid: 0x1FF

  PROTECTION_FAULT:
    bits: '3.4-3.1'
    comment:
      en: 'Protective shutdown fault (temperature, current, overload, torque blocked)'
