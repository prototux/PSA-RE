id: 0x278
name: 'ENGINE_HYBRID_DYNAMIC_DATA_6'
type: 'can'
length: 5
comment:
  en: 'Real-time engine torque data for hybrid coordination: engine and resistive torque, torque limits and target idle speed'
  fr: 'Données dynamiques de couple moteur pour la coordination hybride : couple moteur et résistant, limites de couple et régime de ralenti cible'
  es: 'Datos dinámicos del par motor para la coordinación híbrida: par motor y resistente, límites de par y régimen de ralentí objetivo'
  de: 'Dynamische Motordrehmomentdaten für die Hybridkoordination: Motor- und Widerstandsmoment, Drehmomentgrenzen und Ziel-Leerlaufdrehzahl'
  it: 'Dati dinamici di coppia motore per il coordinamento ibrido: coppia motore e resistente, limiti di coppia e regime del minimo target'
  pl: 'Dynamiczne dane momentu obrotowego silnika do koordynacji hybrydowej: moment silnika i moment oporowy, limity momentu i docelowe obroty biegu jałowego'
  ru: 'Динамические данные крутящего момента двигателя для гибридной координации: момент двигателя и момент сопротивления, пределы момента и целевые обороты холостого хода'
  zh: '用于混动协调的发动机转矩动态数据:发动机转矩与阻力转矩、转矩限值及目标怠速'
  hu: 'A hibrid koordinációhoz szükséges dinamikus motornyomaték-adatok: motor- és ellennyomaték, nyomatékhatárok és cél alapjárati fordulatszám'
  pt: 'Dados de binário do motor em tempo real para a coordenação híbrida: binário do motor e resistente, limites de binário e regime de ralenti alvo.'
periodicity: ['10ms']
senders: ['CMM']
receivers: ['HCU1']

signals:
  FRAME_CHECKSUM:
    bits: '1.7-1.4'
    comment:
      en: 'Checksum of the frame'
      fr: 'Somme de contrôle (checksum) de la trame'
      es: 'Suma de comprobación (checksum) de la trama'
      de: 'Prüfsumme (Checksum) des Frames'
      it: 'Checksum del frame'
      pl: 'Suma kontrolna (checksum) ramki'
      ru: 'Контрольная сумма кадра'
      zh: '帧校验和'
      hu: 'A keret ellenőrző összege (checksum)'
      pt: 'Soma de verificação da trama'
    type: 'uint'

  PROCESS_COUNTER:
    bits: '1.3-1.0'
    comment:
      en: 'Rolling counter incremented at each calculation cycle'
      fr: 'Compteur cyclique incrémenté à chaque cycle de calcul'
      es: 'Contador cíclico incrementado en cada ciclo de cálculo'
      de: 'Zyklischer Zähler, der bei jedem Berechnungszyklus erhöht wird'
      it: 'Contatore ciclico incrementato a ogni ciclo di calcolo'
      pl: 'Licznik cykliczny zwiększany przy każdym cyklu obliczeń'
      ru: 'Циклический счётчик, увеличивающийся на каждом цикле расчёта'
      zh: '每个计算周期递增的循环计数器'
      hu: 'A számítási ciklus minden lépésekor növekvő ciklikus számláló'
      pt: 'Contador cíclico incrementado a cada ciclo de cálculo'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00

  ENGINE_RPM_UNFILTERED:
    bits: '2.7-3.3'
    comment:
      en: 'Unfiltered engine speed.'
      fr: 'Régime moteur non filtré.'
      es: 'Régimen del motor sin filtrar.'
      de: 'Ungefilterte Motordrehzahl.'
      it: 'Regime motore non filtrato.'
      pl: 'Niefiltrowana prędkość obrotowa silnika.'
      ru: 'Нефильтрованная частота вращения двигателя.'
      zh: '未滤波发动机转速。'
      hu: 'Szűretlen motorfordulatszám.'
      pt: 'Regime do motor não filtrado.'
    type: 'uint'
    factor: 1
    min: 0
    max: 8190
    units: 'rpm'
    invalid: 0x1FFF
    default: 0x1FFE

  ENGINE_START_REQUEST_COORDINATED:
    bits: '3.2'
    comment:
