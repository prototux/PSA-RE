id: 0x238
name: 'ENGINE_TORQUE_DYNAMICS'
type: 'can'
length: 8
comment:
  en: 'Real-time engine torque data for hybrid coordination: engine and resistive torque, torque limits and target idle speed'
  fr: 'Données dynamiques de couple moteur pour la coordination hybride : couple moteur et résistant, limites de couple et régime de ralenti cible'
  es: 'Datos dinámicos del par motor para la coordinación híbrida: par motor y resistente, límites de par y régimen de ralentí objetivo'
  de: 'Dynamische Motordrehmomentdaten für die Hybridkoordination: Motor- und Widerstandsmoment, Drehmomentgrenzen und Ziel-Leerlaufdrehzahl'
  it: 'Dati dinamici di coppia motore per il coordinamento ibrido: coppia motore e resistente, limiti di coppia e regime del minimo target'
  pl: 'Dynamiczne dane momentu obrotowego silnika do koordynacji hybrydowej: moment silnika i moment oporowy, limity momentu i docelowe obroty biegu jałowego'
  ru: 'Динамические данные крутящего момента двигателя для гибридной координации: момент двигателя и момент сопротивления, пределы момента и целевые обороты холостого хода'
  zh: '用于混动协调的发动机转矩动态数据:发动机转矩与阻力转矩、转矩限值及目标怠速'
  hu: 'A hibrid koordinációhoz szükséges dinamikus motornyomaték-adatok: motor- és ellennyomaték, nyomatékhatárok és cél alapjárati fordulatszám'
  pt: 'Dados de binário do motor em tempo real para a coordenação híbrida: binário do motor e resistente, limites de binário e regime de ralenti alvo.'
periodicity: ['10ms']
senders: ['CMM']
receivers: ['HCU1']

signals:
  PROCESS_COUNTER_4BIT:
    bits: '1.7-1.4'
    comment:
      en: '4-bit rolling process counter.'
      fr: 'Compteur de process tournant sur 4 bits.'
      es: 'Contador de proceso rotativo de 4 bits.'
      de: '4-Bit-Umlaufzähler des Prozesses.'
      it: 'Contatore di processo a rotazione a 4 bit.'
      pl: '4-bitowy licznik przebiegu procesu.'
      ru: '4-битный циклический счётчик процесса.'
      zh: '4位循环处理计数器。'
      hu: '4 bites körforgó folyamatszámláló.'
      pt: 'Contador de processo rotativo de 4 bits'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00

  FRAME_CHECKSUM:
    bits: '1.3-1.0'
    comment:
      en: 'Frame checksum.'
      fr: 'Somme de contrôle de la trame.'
      es: 'Suma de comprobación de la trama.'
      de: 'Prüfsumme des Rahmens.'
      it: 'Checksum del frame.'
      pl: 'Suma kontrolna ramki.'
      ru: 'Контрольная сумма кадра.'
      zh: '帧校验和。'
      hu: 'A keret ellenőrző összege.'
      pt: 'Soma de verificação da trama.'
    type: 'uint'

  ENGINE_TORQUE:
    bits: '2.7-3.5'
    comment:
      en: 'Engine torque'
      fr: 'Couple moteur'
      es: 'Par de motor'
      de: 'Motordrehmoment'
      it: 'Coppia motore'
      pl: 'Moment obrotowy silnika'
      ru: 'Крутящий момент двигателя'
      zh: '发动机扭矩'
      hu: 'Motornyomaték'
      pt: 'Binário do motor'
    type: 'uint'
    factor: 0.5
    offset: -500
    min: -500
    max: 500
    units: 'Nm'
    invalid: 0x7FF
    default: 0x3E8

  HYBRID_RESISTING_TORQUE:
    bits: '3.4-4.2'
    comment:
      en: 'Engine loss (resisting) torque.'
      fr: 'Couple de perte moteur.'
      es: 'Par de pérdida del motor.'
      de: 'Motorverlustmoment.'
      it: 'Coppia di perdita del motore.'
      pl: 'Moment strat silnika.'
      ru: 'Момент потерь двигателя.'
      zh: '发动机损失转矩。'
      hu: 'Motorveszteségi nyomaték.'
      pt: 'Binário de perda do motor.'
    type: 'uint'
    factor: 0.5
    offset: -500
    min: -500
    max: 500
    units: 'Nm'
    invalid: 0x7FF
    default: 0x3E8

  FINAL_TARGET_IDLE_SPEED:
    bits: '4.1-6.6'
    comment:
      en: 'Final target idle speed.'
      fr: 'Régime de ralenti cible final.'
      es: 'Régimen de ralentí objetivo final.'
      de: 'Endgültige Ziel-Leerlaufdrehzahl.'
      it: 'Regime del minimo target finale.'
      pl: 'Docelowa prędkość obrotowa biegu jałowego (końcowa).'
      ru: 'Итоговая целевая частота вращения холостого хода.'
      zh: '最终目标怠速转速。'
      hu: 'A végleges célalapjárati fordulatszám.'
      pt: 'Regime de ralenti alvo final.'
    type: 'uint'
    factor: 1
    min: 0
    max: 4000
    units: 'rpm'
    invalid: 0xFFF
    default: 0x00

  TORQUE_LIMIT_SYNTHESIS:
    bits: '6.5-7.3'
    comment:
      en: 'Synthesis of torque limitations'
      fr: 'Synthèse des limitations de couple'
      es: 'Síntesis de las limitaciones de par'
      de: 'Zusammenfassung der Drehmomentbegrenzungen'
      it: 'Sintesi delle limitazioni di coppia'
      pl: 'Zestawienie ograniczeń momentu obrotowego'
      ru: 'Сводка ограничений крутящего момента'
      zh: '转矩限制汇总'
      hu: 'Nyomatékkorlátozások összegzése'
      pt: 'Síntese das limitações de binário'
    type: 'uint'
    factor: 0.5
    offset: -500
    min: -500
    max: 500
    units: 'Nm'
    invalid: 0x7FF
    default: 0x3E8

  ENGINE_MIN_ACHIEVABLE_TORQUE:
    bits: '7.2-8.0'
    comment:
      en: 'Minimum achievable engine torque'
      fr: 'Couple moteur minimal réalisable'
      es: 'Par motor mínimo alcanzable'
      de: 'Minimal erreichbares Motordrehmoment'
      it: 'Coppia motore minima ottenibile'
      pl: 'Minimalny osiągalny moment obrotowy silnika'
      ru: 'Минимальный достижимый крутящий момент двигателя'
      zh: '发动机可实现的最小转矩'
      hu: 'Elérhető minimális motornyomaték'
      pt: 'Binário mínimo do motor alcançável'
    type: 'uint'
    factor: 0.5
    offset: -500
    min: -500
    max: 500
    units: 'Nm'
    invalid: 0x7FF
    default: 0x3E8
