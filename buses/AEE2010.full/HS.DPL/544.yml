id: 0x544
name: 'NOX_SENSOR_STATUS'
type: 'can'
length: 8
comment:
  en: 'NOx sensor status: calibration ID, failure status, heater cycle, internal temperature, sensitivity factor, sensor initialisation temperature, measurement and regeneration status, protection tube monitoring.'
  fr: 'État du capteur NOx : identifiant de calibration, état de défaillance, cycle de chauffage, température interne, facteur de sensibilité, température d''initialisation, état de mesure et de régénération, surveillance du tube de protection.'
  es: 'Estado del sensor NOx: identificador de calibración, estado de fallo, ciclo de calentamiento, temperatura interna, factor de sensibilidad, temperatura de inicialización, estado de medición y regeneración, supervisión del tubo de protección.'
  de: 'NOx-Sensorstatus: Kalibrierungs-ID, Fehlerstatus, Heizzyklus, interne Temperatur, Empfindlichkeitsfaktor, Initialisierungstemperatur, Mess- und Regenerationsstatus, Überwachung des Schutzrohrs.'
  it: 'Stato del sensore NOx: ID di calibrazione, stato di guasto, ciclo di riscaldamento, temperatura interna, fattore di sensibilità, temperatura di inizializzazione, stato di misura e rigenerazione, monitoraggio del tubo di protezione.'
  pl: 'Stan czujnika NOx: identyfikator kalibracji, stan usterki, cykl grzania, temperatura wewnętrzna, współczynnik czułości, temperatura inicjalizacji, stan pomiaru i regeneracji, monitorowanie rurki ochronnej.'
  ru: 'Статус датчика NOx: идентификатор калибровки, статус неисправности, цикл нагрева, внутренняя температура, коэффициент чувствительности, температура инициализации, статус измерения и регенерации, мониторинг защитной трубки.'
  zh: 'NOx传感器状态:校准ID、故障状态、加热周期、内部温度、灵敏度系数、初始化温度、测量和再生状态、保护管监测。'
  hu: 'NOx-érzékelő állapota: kalibrációs azonosító, hibaállapot, fűtési ciklus, belső hőmérséklet, érzékenységi tényező, inicializálási hőmérséklet, mérési és regenerációs állapot, védőcső felügyelete.'
  pt: 'Estado do sensor de NOx: ID de calibração, estado de falha, ciclo do aquecedor, temperatura interna, fator de sensibilidade, temperatura de inicialização do sensor, estado de medição e regeneração, monitorização do tubo de proteção.'
periodicity: ['100ms']
senders: ['NOX_SENSOR']
receivers: ['CMM']

