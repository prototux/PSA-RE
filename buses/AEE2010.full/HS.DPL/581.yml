      es: 'Potencia eléctrica consumida por la calefacción de la línea de alimentación del SCR'
      de: 'Elektrische Leistungsaufnahme der Heizung der SCR-Versorgungsleitung'
      it: 'Potenza elettrica assorbita dal riscaldamento della linea di alimentazione SCR'
      pl: 'Moc elektryczna pobierana przez ogrzewanie przewodu zasilającego SCR'
      ru: 'Электрическая мощность, потребляемая подогревом магистрали подачи SCR'
      zh: 'SCR供给管路加热器消耗的电功率'
      hu: 'Az SCR tápvezeték fűtésének elektromos teljesítményfelvétele'
