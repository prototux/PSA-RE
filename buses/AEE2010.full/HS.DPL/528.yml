        fr: 'Réveil principal atteint (maintenu 800 ms)'
        es: 'Activación principal alcanzada (mantenida 800 ms)'
        de: 'Hauptaufwecken erreicht (800 ms gehalten)'
        it: 'Risveglio principale raggiunto (mantenuto 800 ms)'
