id: 0x528
name: 'ENGINE_ECU_DATA_10'
type: 'can'
length: 2
comment:
  en: 'Engine ECU data: power-reduction-off request, atmospheric pressure, main wake-up and SCR purge wake-up.'
  fr: 'Données du calculateur moteur : demande de suppression de réduction de puissance, pression atmosphérique, réveil principal et réveil de purge SCR.'
  es: 'Datos de la centralita del motor: solicitud de supresión de reducción de potencia, presión atmosférica, activación principal y activación de purga SCR.'
  de: 'Motorsteuergerätdaten: Anforderung zur Aufhebung der Leistungsreduzierung, Luftdruck, Hauptweckung und SCR-Spülweckung.'
  it: 'Dati della centralina motore: richiesta di rimozione riduzione potenza, pressione atmosferica, risveglio principale e risveglio di spurgo SCR.'
  pl: 'Dane sterownika silnika: żądanie zniesienia redukcji mocy, ciśnienie atmosferyczne, główne wybudzenie i wybudzenie przedmuchu SCR.'
  ru: 'Данные ЭБУ двигателя: запрос отмены снижения мощности, атмосферное давление, главное пробуждение и пробуждение продувки SCR.'
  zh: '发动机ECU数据:解除功率降低请求、大气压力、主唤醒和SCR吹扫唤醒。'
  hu: 'Motorvezérlő adatok: teljesítménycsökkentés megszüntetésének kérése, légköri nyomás, fő ébresztés és SCR öblítési ébresztés.'
  pt: 'Dados da unidade de controlo do motor: pedido de desativação da redução de potência, pressão atmosférica, ativação principal e ativação de purga SCR.'
periodicity: ['100ms']
senders: ['CMM']
receivers: ['NOX_SENSOR']

signals:
  UNUSED_1:
    bits: '1.7-1.2'
    unused: true

  INITIAL_VALUES_REQUEST:
    bits: '1.1'
    comment:
      en: 'Request for initial values'
      fr: 'Demande des valeurs initiales'
      es: 'Solicitud de los valores iniciales'
      de: 'Anforderung der Anfangswerte'
      it: 'Richiesta dei valori iniziali'
      pl: 'Żądanie wartości początkowych'
      ru: 'Запрос начальных значений'
      zh: '初始值请求'
      hu: 'A kezdeti értékek kérése'
      pt: 'Pedido dos valores iniciais'
    type: 'bool'
    default: 0x01
    values:
      0x00:
        en: 'Init values not requested'
        fr: 'Valeurs d''initialisation non demandées'
        es: 'Valores de inicialización no solicitados'
        de: 'Initialisierungswerte nicht angefordert'
        it: 'Valori di inizializzazione non richiesti'
        pl: 'Nie zażądano wartości inicjalizacyjnych'
        ru: 'Значения инициализации не запрошены'
        zh: '未请求初始化值'
        hu: 'Nincs kérve inicializálási érték'
        pt: 'Valores de inicialização não solicitados'
      0x01:
        en: 'Init values requested'
        fr: 'Demande des valeurs d''initialisation'
        es: 'Solicitud de valores de inicialización'
        de: 'Anforderung der Initialisierungswerte'
        it: 'Richiesta dei valori di inizializzazione'
        pl: 'Żądanie wartości inicjalizacyjnych'
        ru: 'Запрос значений инициализации'
        zh: '请求初始化值'
        hu: 'Inicializálási értékek kérése'
        pt: 'Pedido dos valores de inicialização'

  MEASUREMENT_REQUEST:
    bits: '1.0'
    comment:
      en: 'Measurement request'
      fr: 'Demande de mesure'
      es: 'Solicitud de medición'
      de: 'Messanforderung'
