        fr: 'Mesures non demandées'
        es: 'Medición no solicitada'
        de: 'Messung nicht angefordert'
        it: 'Misurazione non richiesta'
        pl: 'Pomiar nie żądany'
        ru: 'Измерение не запрошено'
        zh: '未请求测量'
        hu: 'Mérés nincs kérve'
        pt: 'Medição não pedida'
      0x01:
        en: 'Measurement requested'
        fr: 'Demande de mesures'
        es: 'Solicitud de mediciones'
        de: 'Messung angefordert'
        it: 'Richiesta di misurazioni'
