id: 0x564
name: 'NOX_SENSOR_DATA'
type: 'can'
length: 8
comment:
  en: 'NOx sensor data 2: calibration and component identifiers, heater fault and diagnostic status.'
  fr: 'Données capteur NOx 2 : identifiants de calibration et de composant, défaut et diagnostic du réchauffeur.'
  es: 'Datos del sensor NOx 2: identificadores de calibración y componente, fallo y diagnóstico del calentador.'
  de: 'NOx-Sensordaten 2: Kalibrierungs- und Bauteilkennungen, Heizungsfehler und Diagnosestatus.'
  it: 'Dati sensore NOx 2: identificatori di calibrazione e componente, guasto e diagnosi del riscaldatore.'
  pl: 'Dane czujnika NOx 2: identyfikatory kalibracji i komponentu, usterka i diagnostyka grzałki.'
  ru: 'Данные датчика NOx 2: идентификаторы калибровки и компонента, неисправность и диагностика нагревателя.'
  zh: 'NOx传感器数据2:校准和组件标识符、加热器故障和诊断状态。'
  hu: 'NOx-érzékelő adatok 2: kalibrációs és alkatrészazonosítók, fűtőelem hiba és diagnosztikai állapot.'
  pt: 'Dados 2 do sensor de NOx: identificadores de calibração e de componente, avaria do aquecedor e estado de diagnóstico.'
periodicity: ['100ms']
senders: ['NOX_SENSOR']
receivers: ['CMM']

