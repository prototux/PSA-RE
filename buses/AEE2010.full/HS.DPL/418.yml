id: 0x418
name: 'ENGINE_ECU_DATA_4'
type: 'can'
length: 2
comment:
  en: 'Engine ECU data: power-reduction-off request, atmospheric pressure, main wake-up and SCR purge wake-up.'
  fr: 'Données du calculateur moteur : demande de suppression de réduction de puissance, pression atmosphérique, réveil principal et réveil de purge SCR.'
  es: 'Datos de la centralita del motor: solicitud de supresión de reducción de potencia, presión atmosférica, activación principal y activación de purga SCR.'
  de: 'Motorsteuergerätdaten: Anforderung zur Aufhebung der Leistungsreduzierung, Luftdruck, Hauptweckung und SCR-Spülweckung.'
  it: 'Dati della centralina motore: richiesta di rimozione riduzione potenza, pressione atmosferica, risveglio principale e risveglio di spurgo SCR.'
  pl: 'Dane sterownika silnika: żądanie zniesienia redukcji mocy, ciśnienie atmosferyczne, główne wybudzenie i wybudzenie przedmuchu SCR.'
  ru: 'Данные ЭБУ двигателя: запрос отмены снижения мощности, атмосферное давление, главное пробуждение и пробуждение продувки SCR.'
  zh: '发动机ECU数据:解除功率降低请求、大气压力、主唤醒和SCR吹扫唤醒。'
  hu: 'Motorvezérlő adatok: teljesítménycsökkentés megszüntetésének kérése, légköri nyomás, fő ébresztés és SCR öblítési ébresztés.'
  pt: 'Dados da unidade de controlo do motor: pedido de desativação da redução de potência, pressão atmosférica, ativação principal e ativação de purga SCR.'
periodicity: ['50ms']
senders: ['CMM']
receivers: ['SCR']

signals:
  MAIN_WAKEUP_STATUS:
    bits: '1.7-1.6'
    comment:
      en: 'Main network wake-up request (RCD)'
      fr: 'Demande de réveil principal du réseau (RCD)'
      es: 'Solicitud de activación principal de la red (RCD)'
      de: 'Anforderung des Hauptnetzwerk-Aufwachens (RCD)'
      it: 'Richiesta di risveglio principale della rete (RCD)'
      pl: 'Żądanie głównego wybudzenia sieci (RCD)'
      ru: 'Запрос основного пробуждения сети (RCD)'
      zh: '主网络唤醒请求(RCD)'
      hu: 'A hálózat fő ébresztési kérése (RCD)'
      pt: 'Pedido de ativação principal da rede (RCD)'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'Invalid RCD'
        fr: 'RCD invalide'
        es: 'RCD no válido'
        de: 'Ungültiges RCD'
        it: 'RCD non valido'
        pl: 'Nieprawidłowy RCD'
        ru: 'Недействительный RCD'
        zh: 'RCD无效'
        hu: 'Érvénytelen RCD'
        pt: 'RCD inválido'
      0x01:
        en: 'No main wake-up request'
        fr: 'Pas de demande de réveil principal'
        es: 'Sin solicitud de activación principal'
        de: 'Keine Anforderung der Hauptaufwachfunktion'
        it: 'Nessuna richiesta di riattivazione principale'
        pl: 'Brak żądania głównego wybudzenia'
        ru: 'Нет запроса основного пробуждения'
        zh: '无主唤醒请求'
        hu: 'Nincs fő ébresztési kérés'
        pt: 'Sem pedido de despertar principal'
      0x02:
        en: 'Main wake-up request'
        fr: 'Demande de réveil principal'
        es: 'Solicitud de activación principal'
        de: 'Hauptaufweckanforderung'
        it: 'Richiesta di risveglio principale'
        pl: 'Żądanie głównego wybudzenia'
        ru: 'Запрос основного пробуждения'
        zh: '主唤醒请求'
        hu: 'Fő ébresztési kérés'
        pt: 'Pedido de ativação principal'
      0x03:
        en: 'Invalid'
        fr: 'Invalide'
        es: 'Inválido'
        de: 'Ungültig'
        it: 'Non valido'
        pl: 'Nieprawidłowe'
        ru: 'Недействительно'
        zh: '无效'
        hu: 'Érvénytelen'
        pt: 'Inválido'

  POWER_LOAD_SHED_REQUEST_2:
    bits: '1.5'
    comment:
      en: 'Power load-shedding need'
      fr: 'Besoin de délestage de puissance'
      es: 'Necesidad de reducción de carga de potencia'
      de: 'Bedarf an Leistungslastabwurf'
      it: 'Necessità di distacco della potenza'
      pl: 'Zapotrzebowanie na zrzut mocy'
      ru: 'Потребность в снижении нагрузки по мощности'
      zh: '功率卸载需求'
      hu: 'Teljesítmény-terheléskorlátozási igény'
      pt: 'Necessidade de redução de carga de potência'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No load-shedding need'
        fr: 'Absence de besoin de délestage'
        es: 'Sin necesidad de deslastre'
        de: 'Kein Lastabwurfbedarf'
        it: 'Nessuna necessità di distacco di carico'
        pl: 'Brak potrzeby zrzutu obciążenia'
        ru: 'Нет потребности в сбросе нагрузки'
        zh: '无卸载需求'
        hu: 'Nincs terheléscsökkentési igény'
        pt: 'Sem necessidade de corte de carga'
      0x01:
        en: 'Load-shedding need present'
        fr: 'Besoin de délestage présent'
        es: 'Necesidad de deslastre presente'
        de: 'Lastabwurfbedarf vorhanden'
        it: 'Necessità di distacco carico presente'
        pl: 'Obecne zapotrzebowanie na zrzut obciążenia'
        ru: 'Присутствует потребность в сбросе нагрузки'
        zh: '存在负载脱扣需求'
        hu: 'Tehermentesítési igény jelen van'
        pt: 'Necessidade de deslastre presente'

  SCR_PURGE_WAKEUP_REQUEST:
    bits: '1.4'
    comment:
      en: 'Wake-up request for SCR system draining'
      fr: 'Demande de réveil pour la purge du système SCR'
      es: 'Solicitud de activación para la purga del sistema SCR'
      de: 'Aufwachanforderung zum Entleeren des SCR-Systems'
      it: 'Richiesta di risveglio per lo spurgo del sistema SCR'
      pl: 'Żądanie wybudzenia w celu opróżnienia układu SCR'
      ru: 'Запрос пробуждения для слива системы SCR'
      zh: 'SCR系统排空唤醒请求'
      hu: 'Ébresztési kérés az SCR-rendszer leürítéséhez'
      pt: 'Pedido de ativação para a purga do sistema SCR'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Wake-up not requested'
        fr: 'Pas de demande de réveil'
        es: 'Sin solicitud de activación'
        de: 'Keine Weckanforderung'
        it: 'Nessuna richiesta di risveglio'
        pl: 'Brak żądania wybudzenia'
        ru: 'Пробуждение не запрошено'
        zh: '未请求唤醒'
        hu: 'Ébresztés nincs kérve'
        pt: 'Sem pedido de ativação'
      0x01:
        en: 'Wake-up requested'
        fr: 'Demande de réveil'
        es: 'Solicitud de despertar'
        de: 'Weckanforderung'
        it: 'Richiesta di risveglio'
        pl: 'Żądanie wybudzenia'
        ru: 'Запрошено пробуждение'
        zh: '已请求唤醒'
        hu: 'Ébresztés kérve'
        pt: 'Pedido de despertar'

  ATMOSPHERIC_PRESSURE:
    bits: '1.3-2.7'
    comment:
      en: 'Atmospheric pressure (hPa)'
      fr: 'Pression atmosphérique (hPa)'
      es: 'Presión atmosférica (hPa)'
      de: 'Atmosphärendruck (hPa)'
      it: 'Pressione atmosferica (hPa)'
      pl: 'Ciśnienie atmosferyczne (hPa)'
      ru: 'Атмосферное давление (гПа)'
      zh: '大气压力(hPa)'
      hu: 'Légköri nyomás (hPa)'
      pt: 'Pressão atmosférica (hPa)'
    type: 'uint'
    factor: 15
    offset: 685
    min: 685
    max: 1120
    units: 'hPa'
    invalid: 0x1F
    default: 0x1E

  UNUSED_1:
    bits: '2.6-2.0'
    unused: true
