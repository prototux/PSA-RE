id: 0x3D9
name: 'BSE_LIGHTING_DIAG'
type: 'can'
length: 1
comment:
  en: 'Lighting diagnostics from the BSE node: front fog lights and static cornering lights, left and right.'
  fr: 'Diagnostics d''éclairage du module BSE : antibrouillards avant et feux statiques de virage, gauche et droite.'
  es: 'Diagnósticos de iluminación del módulo BSE: antinieblas delanteros y luces estáticas de curva, izquierda y derecha.'
  de: 'Beleuchtungsdiagnose des BSE-Moduls: Nebelscheinwerfer vorne und statisches Kurvenlicht, links und rechts.'
  it: 'Diagnostica illuminazione del modulo BSE: fendinebbia anteriori e luci statiche di svolta, sinistra e destra.'
  pl: 'Diagnostyka oświetlenia modułu BSE: przednie światła przeciwmgielne i statyczne doświetlanie zakrętów, lewe i prawe.'
  ru: 'Диагностика освещения модуля BSE: передние противотуманные фары и статический поворотный свет, слева и справа.'
  zh: 'BSE模块的照明诊断:前雾灯和静态转弯灯,左右两侧。'
  hu: 'A BSE modul világítási diagnosztikája: első ködfényszórók és statikus kanyarfény, bal és jobb oldalon.'
  pt: 'Diagnóstico de iluminação do nó BSE: nevoeiro dianteiro e luzes de curva estáticas, esquerda e direita.'
periodicity: ['2000ms']
senders: ['BSE']
receivers: ['BSI']

signals:
  FRONT_RIGHT_FOG_LIGHT_DIAG:
    bits: '1.7-1.6'
    comment:
      en: 'Front right fog light diagnostic'
      fr: 'Diagnostic du feu antibrouillard avant droit'
      es: 'Diagnóstico del faro antiniebla delantero derecho'
      de: 'Diagnose des rechten vorderen Nebelscheinwerfers'
      it: 'Diagnosi del faro fendinebbia anteriore destro'
      pl: 'Diagnostyka przedniego prawego światła przeciwmgielnego'
      ru: 'Диагностика правой передней противотуманной фары'
      zh: '右前雾灯诊断'
      hu: 'Jobb első ködlámpa diagnosztika'
      pt: 'Diagnóstico do farol antinevoeiro dianteiro direito'
