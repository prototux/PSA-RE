id: 0x046
name: 'ENGINE_BAY_BOX_SLOW_COMMAND'
type: 'can'
length: 5
comment:
  en: 'Slow commands sent by the BSI to the engine bay relay box: electric water pump command, boost pressure setpoint, fuel pump cutoff, relay requests, starter authorisation and oil level measurement.'
  fr: 'Commandes lentes envoyées par la BSI au boîtier relais moteur : commande de pompe à eau électrique, consigne de suralimentation, coupure pompe à carburant, demandes de relais, autorisation démarreur et mesure du niveau d''huile.'
  es: 'Órdenes lentas enviadas por la BSI a la caja de relés del motor: orden de bomba de agua eléctrica, consigna de sobrealimentación, corte de la bomba de combustible, solicitudes de relé, autorización de arranque y medición del nivel de aceite.'
  de: 'Langsame Befehle, die von der BSI an das Motorraum-Relaismodul gesendet werden: Ansteuerung der elektrischen Wasserpumpe, Ladedrucksollwert, Kraftstoffpumpenabschaltung, Relaisanforderungen, Anlasserfreigabe und Ölstandsmessung.'
  it: 'Comandi lenti inviati dalla BSI alla centralina relè vano motore: comando pompa acqua elettrica, setpoint sovralimentazione, interruzione pompa carburante, richieste relè, autorizzazione avviamento e misurazione livello olio.'
  pl: 'Wolne polecenia wysyłane przez BSI do skrzynki przekaźników w komorze silnika: sterowanie elektryczną pompą wody, zadane doładowanie, odcięcie pompy paliwa, żądania przekaźników, zezwolenie rozrusznika i pomiar poziomu oleju.'
  ru: 'Медленные команды, отправляемые BSI в блок реле моторного отсека: управление электрическим водяным насосом, заданное наддувное давление, отключение топливного насоса, запросы реле, разрешение стартера и измерение уровня масла.'
  zh: '由BSI发送给发动机舱继电器盒的慢速命令：电动水泵命令、增压设定值、燃油泵切断、继电器请求、起动机授权及机油液位测量。'
  hu: 'A BSI által a motortéri relédoboznak küldött lassú parancsok: elektromos vízszivattyú vezérlése, feltöltési nyomás alapjel, üzemanyagszivattyú lekapcsolása, relékérések, indítómotor engedélyezése és olajszintmérés.'
  pt: 'Comandos lentos enviados pela BSI à caixa de relés do compartimento do motor: comando da bomba de água elétrica, ponto de ajuste da pressão de sobrealimentação, corte da bomba de combustível, pedidos de relé, autorização do motor de arranque e medição do nível de óleo.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['CAFR', 'CVM', 'BSM']

