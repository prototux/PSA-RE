id: 0x3DC
name: 'TRAILER_HITCH_STATUS'
type: 'can'
length: 1
comment:
  en: 'Trailer hitch presence detection.'
  fr: 'Détection de présence d''attelage remorque.'
  es: 'Detección de presencia del enganche de remolque.'
  de: 'Erkennung der Anhängerkupplung.'
  it: 'Rilevamento della presenza del gancio traino.'
  pl: 'Wykrywanie obecności haka holowniczego.'
  ru: 'Обнаружение наличия прицепного устройства.'
  zh: '挂车牵引钩存在检测。'
  hu: 'Vontatóhorog jelenlétének érzékelése.'
  pt: 'Deteção de presença do engate de reboque.'
periodicity: ['2000ms']
senders: ['BSG']
receivers: ['BSI', 'BCM']

signals:
  UNUSED_1:
    bits: '1.7-1.1'
    unused: true

  TRAILER_PRESENCE:
    bits: '1.0'
    comment:
      en: 'Trailer presence'
      fr: 'Présence d''une remorque'
      es: 'Presencia de un remolque'
      de: 'Vorhandensein eines Anhängers'
      it: 'Presenza di un rimorchio'
      pl: 'Obecność przyczepy'
      ru: 'Наличие прицепа'
      zh: '挂车存在'
      hu: 'Pótkocsi megléte'
      pt: 'Presença de reboque'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No trailer'
        fr: 'Pas de remorque'
        es: 'Sin remolque'
        de: 'Kein Anhänger'
        it: 'Nessun rimorchio'
        pl: 'Brak przyczepy'
        ru: 'Нет прицепа'
        zh: '无拖车'
        hu: 'Nincs pótkocsi'
        pt: 'Sem reboque'
      0x01:
        en: 'Trailer present'
        fr: 'Remorque présente'
        es: 'Remolque presente'
        de: 'Anhänger vorhanden'
        it: 'Rimorchio presente'
        pl: 'Przyczepa obecna'
        ru: 'Прицеп присутствует'
        zh: '有拖车'
        hu: 'Pótkocsi jelen'
        pt: 'Reboque presente'

alternatives:
  - note:
      en: 'Also observed with a period of 200ms'
      fr: 'Aussi observée avec une période de 200ms'
      es: 'También observada con un periodo de 200ms'
      de: 'Auch mit einer Periode von 200ms beobachtet'
      it: 'Osservata anche con un periodo di 200ms'
      pl: 'Obserwowana także z okresem 200ms'
      ru: 'Также наблюдалась с периодом 200ms'
      zh: '也观察到周期为200ms'
      hu: 'Megfigyelve 200ms periódussal is'
      pt: 'Também observada com um período de 200ms'
    periodicity: ['200ms']
