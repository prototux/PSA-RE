id: 0x7BD
name: 'DRIVER_MONITORING_LEFT_EYE_GAZE'
type: 'can'
length: 8
comment:
  en: 'Left eye gaze direction and measurement quality, from the driver monitoring camera.'
  fr: 'Direction du regard de l''œil gauche et qualité de mesure, fournies par la caméra de surveillance du conducteur.'
  es: 'Dirección de la mirada del ojo izquierdo y calidad de la medición, de la cámara de monitorización del conductor.'
  de: 'Blickrichtung des linken Auges und Messqualitaet, von der Fahrerüberwachungskamera.'
  it: 'Direzione dello sguardo dell''occhio sinistro e qualità della misura, dalla telecamera di monitoraggio del conducente.'
  pl: 'Kierunek spojrzenia lewego oka i jakość pomiaru, z kamery monitorowania kierowcy.'
  ru: 'Направление взгляда левого глаза и качество измерения, от камеры контроля состояния водителя.'
  zh: '驾驶员监控摄像头提供的左眼视线方向及测量质量。'
  hu: 'A vezetőfigyelő kamera által szolgáltatott bal szem tekintetiránya és mérési minősége.'
  pt: 'Direção do olhar do olho esquerdo e qualidade da medição, fornecidas pela câmara de monitorização do condutor.'
periodicity: ['100ms']
senders: ['IVC_D']

signals:
  DRIVER_LEFT_EYE_DIRECTION_QUALITY:
    bits: '1.7-1.0'
    comment:
      en: 'Confidence quality of the driver''s left eye gaze direction measurement.'
      fr: 'Qualité de confiance de la mesure de direction du regard de l''œil gauche du conducteur.'
      es: 'Calidad de confianza de la medición de la dirección de la mirada del ojo izquierdo del conductor.'
      de: 'Vertrauensqualität der Blickrichtungsmessung des linken Auges des Fahrers.'
      it: 'Qualità di affidabilità della misurazione della direzione dello sguardo dell''occhio sinistro del conducente.'
      pl: 'Jakość (pewność) pomiaru kierunku spojrzenia lewego oka kierowcy.'
      ru: 'Достоверность измерения направления взгляда левого глаза водителя.'
      zh: '驾驶员左眼视线方向测量的置信质量。'
      hu: 'A vezető bal szeme nézési irányának mérési megbízhatósági minősége.'
      pt: 'Qualidade de confiança da medição da direção do olhar do olho esquerdo do condutor.'
    type: 'uint'

  DRIVER_LEFT_EYE_DIRECTION_VECTOR_X:
    bits: '2.7-3.0'
    comment:
      en: 'X-component of the driver''s left eye gaze direction vector.'
      fr: 'Composante X du vecteur de direction du regard de l''œil gauche du conducteur.'
      es: 'Componente X del vector de dirección de la mirada del ojo izquierdo del conductor.'
      de: 'X-Komponente des Blickrichtungsvektors des linken Auges des Fahrers.'
      it: 'Componente X del vettore di direzione dello sguardo dell''occhio sinistro del conducente.'
      pl: 'Składowa X wektora kierunku spojrzenia lewego oka kierowcy.'
      ru: 'Компонента X вектора направления взгляда левого глаза водителя.'
      zh: '驾驶员左眼视线方向向量的X分量。'
      hu: 'A vezető bal szeme nézési irányvektorának X összetevője.'
      pt: 'Componente X do vetor de direção do olhar do olho esquerdo do condutor.'
    type: 'uint'

  DRIVER_LEFT_EYE_DIRECTION_VECTOR_Y:
