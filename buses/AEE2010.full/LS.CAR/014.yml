id: 0x014
name: 'FRONT_CLIMATE_MOTOR_COMMAND'
type: 'can'
length: 2
comment:
  en: 'Steering wheel cruise control buttons: activate/deactivate, speed limiter/cruise selection, set +/-, gap adjustment and OK confirmation.'
  fr: 'Boutons de régulateur/limiteur de vitesse au volant : activation/désactivation, sélection limiteur/régulateur, réglage +/-, ajustement de l''écart et confirmation OK.'
  es: 'Botones del regulador de velocidad en el volante: activación/desactivación, selección limitador/regulador, ajuste +/-, ajuste de separación y confirmación OK.'
  de: 'Tempomat-Tasten am Lenkrad: Aktivierung/Deaktivierung, Auswahl Geschwindigkeitsbegrenzer/Tempomat, Einstellung +/-, Abstandsanpassung und OK-Bestätigung.'
  it: 'Pulsanti del regolatore di velocità al volante: attivazione/disattivazione, selezione limitatore/regolatore, regolazione +/-, regolazione distanza e conferma OK.'
  pl: 'Przyciski tempomatu na kierownicy: aktywacja/dezaktywacja, wybór ogranicznika/tempomatu, regulacja +/-, regulacja odstępu i potwierdzenie OK.'
  ru: 'Кнопки круиз-контроля на руле: включение/выключение, выбор ограничителя/круиз-контроля, настройка +/-, регулировка дистанции и подтверждение OK.'
  zh: '方向盘巡航控制按钮:激活/停用、限速器/巡航选择、设定+/-、车距调整及OK确认。'
  hu: 'A tempomat gombjai a kormányon: aktiválás/deaktiválás, sebességhatároló/tempomat kiválasztása, +/- beállítás, távolság-beállítás és OK megerősítés.'
  pt: 'Botões do regulador de velocidade no volante: ativar/desativar, seleção limitador/regulador, ajuste +/-, ajuste de intervalo e confirmação OK.'
periodicity: ['100ms', 'trigger']
senders: ['HDC']
receivers: ['BSI']

signals:
  STEERING_WHEEL_PUSH_BUTTON_1:
    bits: '1.7'
    comment:
      en: 'Physical press support for activation/deactivation (button 1)'
      fr: 'Appui physique sur le push pour activation/désactivation (bouton 1)'
      es: 'Soporte de pulsación física para activación/desactivación (botón 1)'
      de: 'Physische Tastenbetätigung zur Aktivierung/Deaktivierung (Taste 1)'
      it: 'Supporto pressione fisica per attivazione/disattivazione (pulsante 1)'
      pl: 'Fizyczne naciśnięcie w celu aktywacji/dezaktywacji (przycisk 1)'
      ru: 'Физическое нажатие для активации/деактивации (кнопка 1)'
      zh: '用于激活/停用的物理按压支持(按钮1)'
      hu: 'Fizikai megnyomás az aktiváláshoz/deaktiváláshoz (1. gomb)'
