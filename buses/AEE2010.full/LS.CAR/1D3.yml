id: 0x1D3
name: 'KEY_PRESENCE_STATUS_REAR'
type: 'can'
length: 4
comment:
  en: 'Key presence detection near the rear door handle (unlock and remote-key zones), sent by the door handle module.'
  fr: 'Détection de présence de clé au niveau de la poignée arrière (zones déverrouillage et mains-libres), envoyée par le module de poignée.'
  es: 'Detección de presencia de la llave en la manija trasera (zonas de desbloqueo y manos libres), enviada por el módulo de manija.'
  de: 'Schlüsselerkennung am hinteren Türgriff (Entriegelungs- und Freisprechzonen), gesendet vom Türgriffmodul.'
  it: 'Rilevamento di presenza chiave alla maniglia posteriore (zone sblocco e mani libere), inviato dal modulo maniglia.'
  pl: 'Wykrywanie obecności kluczyka przy tylnej klamce (strefy odblokowania i bezobsługowa), wysyłane przez moduł klamki.'
  ru: 'Обнаружение присутствия ключа у задней дверной ручки (зоны разблокировки и hands-free), отправляемое модулем дверной ручки.'
  zh: '后车门把手附近的钥匙存在检测（解锁及免钥匙区域），由门把手模块发送。'
  hu: 'A kulcs jelenlétének érzékelése a hátsó ajtókilincsnél (kioldási és kihangosított zónák), a kilincsmodul küldi.'
  pt: 'Deteção de presença da chave junto ao puxador da porta traseira (zonas de destrancagem e de chave à distância), enviada pelo módulo do puxador.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['500ms', 'trigger']
senders: ['LCE']
receivers: ['BSI']

signals:
  REAR_KEY_PRESENT_RANDOM:
    bits: '1.7-2.0'
    comment:
      en: 'Rear key present random challenge value'
      fr: 'Valeur aléatoire (random) de présence de clé arrière'
      es: 'Valor aleatorio (random) de presencia de llave trasera'
      de: 'Zufallswert (Random) der hinteren Schlüsselerkennung'
      it: 'Valore casuale (random) di presenza della chiave posteriore'
      pl: 'Wartość losowa (random) obecności tylnego kluczyka'
      ru: 'Случайное значение (random) присутствия заднего ключа'
      zh: '后钥匙存在随机挑战值'
      hu: 'A hátsó kulcs jelenlétének véletlen (random) értéke'
      pt: 'Valor aleatório (random) de presença de chave traseira'
    type: 'uint'
    min: 0
    max: 65535
    default: 0x00

  REAR_KEY_PRESENT_PASSWORD:
    bits: '3.7-4.0'
    comment:
      en: 'Rear key present password value'
      fr: 'Valeur du mot de passe de présence de clé arrière'
      es: 'Valor de la contraseña de presencia de llave trasera'
      de: 'Passwortwert der hinteren Schlüsselerkennung'
      it: 'Valore della password di presenza della chiave posteriore'
      pl: 'Wartość hasła obecności tylnego kluczyka'
      ru: 'Значение пароля присутствия заднего ключа'
      zh: '后钥匙存在密码值'
      hu: 'A hátsó kulcs jelenlétének jelszóértéke'
      pt: 'Valor da palavra-passe de presença de chave traseira'
    type: 'uint'
    min: 0
    max: 65535
    default: 0x00
