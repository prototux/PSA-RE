id: 0x093
name: 'HANDSFREE_ACCESS_MODULE_STATUS'
type: 'can'
length: 3
comment:
  en: 'Hands-free access module status: pairing, wake-up and unlock configuration commands, identification responses.'
  fr: 'État du module d''accès mains libres : commandes de configuration déverrouillage/réveil, appairage, réponses d''identification.'
  es: 'Estado del módulo de acceso manos libres: comandos de configuración de desbloqueo/activación, emparejamiento, respuestas de identificación.'
  de: 'Status des Freihand-Zugangsmoduls: Konfigurationsbefehle für Entriegelung/Aufwecken, Kopplung, Identifikationsantworten.'
  it: 'Stato del modulo di accesso mani libere: comandi di configurazione sblocco/risveglio, associazione, risposte di identificazione.'
  pl: 'Stan modułu dostępu bezkluczykowego: polecenia konfiguracji odblokowania/wybudzenia, parowanie, odpowiedzi identyfikacyjne.'
  ru: 'Статус модуля бесключевого доступа: команды конфигурации разблокировки/пробуждения, сопряжение, ответы идентификации.'
  zh: '免钥匙进入模块状态:解锁/唤醒配置命令、配对、识别响应。'
  hu: 'A kihúzott kezes beléptető modul állapota: kioldási/ébresztési konfigurációs parancsok, párosítás, azonosítási válaszok.'
  pt: 'Estado do módulo de acesso mãos-livres: comandos de emparelhamento, ativação e configuração de destrancagem, respostas de identificação.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['200ms', 'trigger']
senders: ['BML']
receivers: ['BSI']

