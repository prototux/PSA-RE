id: 0x14E
name: 'KEY_PAIRING_DATA_3'
type: 'can'
length: 8
comment:
  en: 'Key pairing data (part 3) from the body computer: HF identifier, badge number and end of the pairing sequence marker.'
  fr: 'Données d''appairage de clé (partie 3) issues du BSI : identifiant HF, numéro de badge et marqueur de fin de séquence.'
  es: 'Datos de emparejamiento de llave (parte 3) de la BSI: identificador HF, número de tarjeta y marcador de fin de secuencia.'
  de: 'Schlüsselkopplungsdaten (Teil 3) vom BSI: HF-Kennung, Badge-Nummer und Endmarker der Kopplungssequenz.'
  it: 'Dati di accoppiamento chiave (parte 3) dal BSI: identificativo HF, numero badge e marcatore di fine sequenza.'
  pl: 'Dane parowania kluczyka (część 3) z BSI: identyfikator HF, numer karty i znacznik końca sekwencji.'
  ru: 'Данные сопряжения ключа (часть 3) от BSI: HF-идентификатор, номер метки и маркер конца последовательности сопряжения.'
  zh: '来自车身控制器的钥匙配对数据(第3部分):HF标识符、卡片编号及配对序列结束标记。'
  hu: 'Kulcspárosítási adatok (3. rész) a BSI-től: HF-azonosító, kártyaszám és a párosítási sorozat végjelzője.'
  pt: 'Dados de emparelhamento de chave (parte 3) da BSI: identificador HF, número do cartão e marcador de fim da sequência de emparelhamento.'
observations:
  en: 'Depends on the associated diagnostic class'
  fr: 'Dépend de la classe de diagnostic associée'
  es: 'Depende de la clase de diagnóstico asociada'
  de: 'Abhängig von der zugehörigen Diagnoseklasse'
  it: 'Dipende dalla classe diagnostica associata'
  pl: 'Zależy od powiązanej klasy diagnostycznej'
  ru: 'Зависит от связанного диагностического класса'
  zh: '取决于相关诊断类别'
  hu: 'A kapcsolódó diagnosztikai osztálytól függ'
  pt: 'Depende da classe de diagnóstico associada'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['BML']

signals:
  HF_IDENTIFICATION_CODE:
    bits: '1.7-2.0'
    comment:
      en: 'HF identification code'
      fr: 'Code d''identification HF'
      es: 'Código de identificación HF'
      de: 'HF-Identifikationscode'
      it: 'Codice di identificazione HF'
      pl: 'Kod identyfikacyjny RF'
      ru: 'Идентификационный код РЧ'
      zh: '射频识别码'
      hu: 'RF azonosítókód'
      pt: 'Código de identificação HF'
    type: 'uint'
    min: 0
    max: 65535

  ADML_IDE_CODE:
    bits: '3.7-6.0'
    comment:
      en: 'ADML identification (IDE) code'
      fr: 'Code IDE de l''ADML'
      es: 'Código IDE del ADML'
      de: 'IDE-Code des ADML'
      it: 'Codice IDE dell''ADML'
      pl: 'Kod IDE modułu ADML'
      ru: 'Код IDE модуля ADML'
      zh: 'ADML的IDE识别码'
      hu: 'Az ADML IDE azonosító kódja'
      pt: 'Código IDE do ADML'
    type: 'uint'
    min: 0
    max: 4294967295

  BML_END_MARKER:
    bits: '7.7-7.0'
    comment:
      en: 'BML end marker'
      fr: 'Marqueur de fin BML'
      es: 'Marcador de fin BML'
      de: 'BML-Endmarker'
      it: 'Marcatore di fine BML'
      pl: 'Znacznik końca BML'
      ru: 'Маркер конца BML'
      zh: 'BML结束标记'
      hu: 'BML végjelző'
      pt: 'Marcador de fim BML'
    type: 'uint'
    min: 0
    max: 255

  BADGE_NUMBER_BML:
    bits: '8.7-8.5'
    comment:
      en: 'Badge number'
      fr: 'Numéro de badge'
      es: 'Número de tarjeta'
      de: 'Badge-Nummer'
      it: 'Numero badge'
      pl: 'Numer breloka'
      ru: 'Номер метки'
      zh: '钥匙卡编号'
      hu: 'Jelvényszám'
      pt: 'Número de cartão'
    type: 'uint'
    min: 0
    max: 5

  UNUSED_1:
    bits: '8.4-8.0'
    unused: true
