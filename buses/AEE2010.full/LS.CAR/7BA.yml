id: 0x7BA
name: 'DRIVER_HEAD_POSITION'
type: 'can'
length: 8
comment:
  en: 'Driver head position data from the driver-monitoring camera (IVC_D): current sector and X/Y/Z head position with quality indicator.'
  fr: 'Données de position de la tête du conducteur issues de la caméra de surveillance conducteur (IVC_D) : secteur courant et position X/Y/Z de la tête avec indicateur de qualité.'
  es: 'Datos de posición de la cabeza del conductor de la cámara de monitorización del conductor (IVC_D): sector actual y posición X/Y/Z de la cabeza con indicador de calidad.'
  de: 'Kopfpositionsdaten des Fahrers von der Fahrerüberwachungskamera (IVC_D): aktueller Sektor und X/Y/Z-Kopfposition mit Qualitätsindikator.'
  it: 'Dati di posizione della testa del conducente dalla telecamera di monitoraggio del conducente (IVC_D): settore attuale e posizione X/Y/Z della testa con indicatore di qualità.'
  pl: 'Dane pozycji głowy kierowcy z kamery monitorowania kierowcy (IVC_D): bieżący sektor i pozycja głowy X/Y/Z ze wskaźnikiem jakości.'
  ru: 'Данные положения головы водителя от камеры контроля состояния водителя (IVC_D): текущий сектор и положение головы X/Y/Z с индикатором качества.'
  zh: '来自驾驶员监控摄像头(IVC_D)的驾驶员头部位置数据:当前区域及X/Y/Z头部位置和质量指示。'
  hu: 'A vezető fejhelyzet-adatai a vezetőfigyelő kamerától (IVC_D): aktuális szektor és X/Y/Z fejhelyzet minőségjelzővel.'
  pt: 'Dados de posição da cabeça do condutor da câmara de monitorização do condutor (IVC_D): setor atual e posição X/Y/Z da cabeça com indicador de qualidade.'
periodicity: ['100ms']
senders: ['IVC_D']

signals:
  DRIVER_HEAD_POSITION_QUALITY:
    bits: '1.7-1.0'
    comment:
      en: 'Confidence quality of the driver''s head position measurement.'
      fr: 'Qualité de confiance de la mesure de position de la tête du conducteur.'
      es: 'Calidad de confianza de la medición de la posición de la cabeza del conductor.'
      de: 'Vertrauensqualität der Kopfpositionsmessung des Fahrers.'
      it: 'Qualità di affidabilità della misurazione della posizione della testa del conducente.'
      pl: 'Jakość (pewność) pomiaru pozycji głowy kierowcy.'
      ru: 'Достоверность измерения положения головы водителя.'
      zh: '驾驶员头部位置测量的置信质量。'
      hu: 'A vezető fejpozíció-mérésének megbízhatósági minősége.'
      pt: 'Qualidade de confiança da medição da posição da cabeça do condutor.'
    type: 'uint'

  DRIVER_HEAD_POSITION_X:
    bits: '2.7-3.0'
    comment:
      en: 'X-coordinate of the driver''s head position, from the driver monitoring camera.'
      fr: 'Coordonnée X de la position de la tête du conducteur, issue de la caméra de surveillance conducteur.'
      es: 'Coordenada X de la posición de la cabeza del conductor, de la cámara de vigilancia del conductor.'
      de: 'X-Koordinate der Kopfposition des Fahrers, von der Fahrerüberwachungskamera.'
      it: 'Coordinata X della posizione della testa del conducente, dalla telecamera di monitoraggio del conducente.'
      pl: 'Współrzędna X pozycji głowy kierowcy, z kamery monitorującej kierowcę.'
      ru: 'Координата X положения головы водителя, от камеры контроля водителя.'
      zh: '来自驾驶员监控摄像头的驾驶员头部位置X坐标。'
      hu: 'A vezető fejpozíciójának X koordinátája, a vezetőfigyelő kamerából.'
      pt: 'Coordenada X da posição da cabeça do condutor, da câmara de monitorização do condutor.'
    type: 'uint'

  DRIVER_HEAD_POSITION_Y:
    bits: '4.7-5.0'
    comment:
      en: 'Y-coordinate of the driver''s head position, from the driver monitoring camera.'
      fr: 'Coordonnée Y de la position de la tête du conducteur, issue de la caméra de surveillance conducteur.'
      es: 'Coordenada Y de la posición de la cabeza del conductor, de la cámara de vigilancia del conductor.'
      de: 'Y-Koordinate der Kopfposition des Fahrers, von der Fahrerüberwachungskamera.'
      it: 'Coordinata Y della posizione della testa del conducente, dalla telecamera di monitoraggio del conducente.'
      pl: 'Współrzędna Y pozycji głowy kierowcy, z kamery monitorującej kierowcę.'
      ru: 'Координата Y положения головы водителя, от камеры контроля водителя.'
      zh: '来自驾驶员监控摄像头的驾驶员头部位置Y坐标。'
      hu: 'A vezető fejpozíciójának Y koordinátája, a vezetőfigyelő kamerából.'
      pt: 'Coordenada Y da posição da cabeça do condutor, da câmara de monitorização do condutor.'
    type: 'uint'

  DRIVER_HEAD_POSITION_Z:
    bits: '6.7-7.0'
    comment:
      en: 'Z-coordinate of the driver''s head position, from the driver monitoring camera.'
      fr: 'Coordonnée Z de la position de la tête du conducteur, issue de la caméra de surveillance conducteur.'
      es: 'Coordenada Z de la posición de la cabeza del conductor, de la cámara de vigilancia del conductor.'
      de: 'Z-Koordinate der Kopfposition des Fahrers, von der Fahrerüberwachungskamera.'
      it: 'Coordinata Z della posizione della testa del conducente, dalla telecamera di monitoraggio del conducente.'
      pl: 'Współrzędna Z pozycji głowy kierowcy, z kamery monitorującej kierowcę.'
      ru: 'Координата Z положения головы водителя, от камеры контроля водителя.'
      zh: '来自驾驶员监控摄像头的驾驶员头部位置Z坐标。'
      hu: 'A vezető fejpozíciójának Z koordinátája, a vezetőfigyelő kamerából.'
      pt: 'Coordenada Z da posição da cabeça do condutor, da câmara de monitorização do condutor.'
    type: 'uint'

  DRIVER_CAMERA_SECTOR_ID:
    bits: '8.7-8.0'
    comment:
      en: 'Current detection sector reported by the driver monitoring camera.'
      fr: 'Secteur de détection courant remonté par la caméra de surveillance conducteur.'
      es: 'Sector de detección actual comunicado por la cámara de vigilancia del conductor.'
      de: 'Aktueller Erkennungssektor der Fahrerüberwachungskamera.'
      it: 'Settore di rilevamento corrente riportato dalla telecamera di monitoraggio del conducente.'
      pl: 'Bieżący sektor detekcji zgłaszany przez kamerę monitorującą kierowcę.'
      ru: 'Текущий сектор обнаружения, сообщаемый камерой контроля водителя.'
      zh: '驾驶员监控摄像头报告的当前检测扇区。'
      hu: 'A vezetőfigyelő kamera által jelentett aktuális érzékelési szektor.'
      pt: 'Setor de deteção atual comunicado pela câmara de vigilância do condutor'
    type: 'uint'
