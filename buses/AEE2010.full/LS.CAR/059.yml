id: 0x059
name: 'FRONT_FOG_LIGHT_OUTPUT_STATUS'
type: 'can'
length: 1
comment:
  en: 'Front fog light output state, relayed downstream by the engine-bay junction box (BSM) over the LIN bus.'
  fr: 'État de sortie des feux antibrouillard avant, relayé en aval par le boîtier de servitude moteur (BSM) sur le bus LIN.'
  es: 'Estado de salida de los antinieblas delanteros, retransmitido por la caja de servicios del motor (BSM) en el bus LIN.'
  de: 'Ausgangszustand der vorderen Nebelscheinwerfer, weitergeleitet vom Motorraum-Verteilerkasten (BSM) über den LIN-Bus.'
  it: 'Stato di uscita dei fendinebbia anteriori, inoltrato dalla scatola servizi motore (BSM) sul bus LIN.'
  pl: 'Stan wyjścia przednich świateł przeciwmgielnych, przekazywany przez skrzynkę rozdzielczą silnika (BSM) na magistrali LIN.'
  ru: 'Состояние выхода передних противотуманных фар, ретранслируемое блоком моторного отсека (BSM) по шине LIN.'
  zh: '前雾灯输出状态,由发动机舱配电盒(BSM)通过LIN总线转发。'
  hu: 'Az elülső ködlámpák kimeneti állapota, amelyet a motortéri elosztódoboz (BSM) továbbít a LIN buszon.'
  pt: 'Estado de saída do farol de nevoeiro dianteiro, retransmitido a jusante pela caixa de junção do compartimento do motor (BSM) via barramento LIN.'
observations:
  en: 'On state change of: AF_FRONT_OUTPUT_STATUS'
  fr: 'Sur changement d''état de : AF_FRONT_OUTPUT_STATUS'
  es: 'Al cambiar el estado de: AF_FRONT_OUTPUT_STATUS'
  de: 'Bei Statusänderung von: AF_FRONT_OUTPUT_STATUS'
  it: 'Al cambiamento di stato di: AF_FRONT_OUTPUT_STATUS'
  pl: 'Wysyłane przy zmianie stanu: AF_FRONT_OUTPUT_STATUS'
  ru: 'При изменении состояния: AF_FRONT_OUTPUT_STATUS'
  zh: '当SORTIE_AF_AV状态变化时'
  hu: 'A(z) AF_FRONT_OUTPUT_STATUS állapotváltozásakor'
  pt: 'Na mudança de estado de: AF_FRONT_OUTPUT_STATUS'
periodicity: ['200ms', 'trigger']
senders: ['BSM']
receivers: ['BSI']

signals:
  UNUSED_1:
    bits: '1.7-1.1'
    unused: true

  AF_FRONT_OUTPUT_STATUS:
    bits: '1.0'
    comment:
      en: 'Front AF output status'
      fr: 'État de la sortie AF avant'
      es: 'Estado de la salida AF delantera'
      de: 'Status des vorderen AF-Ausgangs'
      it: 'Stato dell''uscita AF anteriore'
      pl: 'Stan wyjścia AF przedniego'
      ru: 'Состояние переднего выхода AF'
      zh: '前AF输出状态'
      hu: 'Első AF kimenet állapota'
      pt: 'Estado da saída AF dianteira'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Front wiper park exit not detected'
        fr: 'Sortie de position de repos de l''essuie-glace avant non détectée'
        es: 'Salida de la posición de reposo del limpiaparabrisas delantero no detectada'
        de: 'Verlassen der Ruhestellung des Frontwischers nicht erkannt'
        it: 'Uscita dalla posizione di riposo del tergicristallo anteriore non rilevata'
        pl: 'Nie wykryto opuszczenia pozycji spoczynkowej wycieraczki przedniej'
        ru: 'Выход из парковочного положения переднего стеклоочистителя не обнаружен'
        zh: '未检测到前雨刷离开停靠位置'
        hu: 'Az első ablaktörlő nyugalmi helyzetből való kilépése nincs érzékelve'
        pt: 'Saída da posição de repouso do limpa-para-brisas dianteiro não detetada'
      0x01:
        en: 'Front AF exit detected'
        fr: 'Sortie AF avant détectée'
        es: 'Salida delantera AF detectada'
        de: 'Vorderer AF-Ausgang erkannt'
        it: 'Uscita anteriore AF rilevata'
        pl: 'Wykryto wyjście AF z przodu'
        ru: 'Обнаружен передний выход AF'
        zh: '检测到前方AF退出'
        hu: 'Elülső AF kilépés észlelve'
        pt: 'Saída dianteira AF detetada'
