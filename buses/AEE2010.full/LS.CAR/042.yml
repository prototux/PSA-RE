id: 0x042
name: 'TRANSPONDER_AUTH_COMMAND_AES_PASSWORD'
type: 'can'
length: 2
comment:
  en: 'AES-encrypted password sent by the BSI to the key transponder for authentication.'
  fr: 'Mot de passe chiffré AES envoyé par la BSI au transpondeur de clé pour l''authentification.'
  es: 'Contraseña cifrada con AES enviada por la BSI al transpondedor de la llave para la autenticación.'
  de: 'AES-verschlüsseltes Passwort, von der BSI zur Authentifizierung an den Schlüsseltransponder gesendet.'
  it: 'Password cifrata AES inviata dalla BSI al transponder della chiave per l''autenticazione.'
  pl: 'Zaszyfrowane AES hasło wysyłane przez BSI do transpondera kluczyka w celu uwierzytelnienia.'
  ru: 'Пароль, зашифрованный AES, отправляемый BSI в транспондер ключа для аутентификации.'
  zh: '由BSI发送给钥匙应答器用于认证的AES加密密码。'
  hu: 'AES-titkosított jelszó, amelyet a BSI küld a kulcstranszpondernek hitelesítéshez.'
  pt: 'Palavra-passe encriptada com AES, enviada pela BSI ao transponder da chave para autenticação.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['HDC', 'LCE']

signals:
  AES_AUTH_MAC_CODE:
    bits: '1.7-2.0'
    comment:
      en: '16-bit MAC authentication code for key/badge authentication using the AES algorithm (immobilizer function)'
      fr: 'Code d''authentification MAC sur 16 bits pour l''authentification de la clé/badge selon l''algorithme AES (fonction antidémarrage)'
      es: 'Código de autenticación MAC de 16 bits para la autenticación de llave/tarjeta con el algoritmo AES (función antiarranque)'
      de: '16-Bit-MAC-Authentifizierungscode für die Schlüssel-/Badge-Authentifizierung nach dem AES-Algorithmus (Wegfahrsperrenfunktion)'
      it: 'Codice di autenticazione MAC a 16 bit per l''autenticazione di chiave/badge con l''algoritmo AES (funzione immobilizer)'
      pl: '16-bitowy kod uwierzytelniania MAC do uwierzytelniania klucza/karty za pomocą algorytmu AES (funkcja immobilizera)'
      ru: '16-битный код аутентификации MAC для аутентификации ключа/метки по алгоритму AES (функция иммобилайзера)'
      zh: '使用AES算法进行钥匙/卡片认证的16位MAC认证码(防盗锁止功能)'
      hu: '16 bites MAC hitelesítési kód a kulcs/kártya AES algoritmussal történő hitelesítéséhez (indításgátló funkció)'
      pt: 'Código de autenticação MAC de 16 bits para a autenticação de chave/cartão utilizando o algoritmo AES (função do imobilizador)'
    type: 'uint'
