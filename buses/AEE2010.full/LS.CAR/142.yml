id: 0x142
name: 'TRANSPONDER_READ_COMMAND'
type: 'can'
length: 3
comment:
  en: 'Encrypted read command and identifiers sent by the BSI to the key transponder.'
  fr: 'Commande de lecture chiffrée et identifiants envoyés par la BSI au transpondeur de clé.'
  es: 'Orden de lectura cifrada e identificadores enviados por la BSI al transpondedor de la llave.'
  de: 'Verschlüsselter Lesebefehl und Kennungen, von der BSI an den Schlüsseltransponder gesendet.'
  it: 'Comando di lettura cifrato e identificativi inviati dalla BSI al transponder della chiave.'
  pl: 'Zaszyfrowane polecenie odczytu i identyfikatory wysyłane przez BSI do transpondera kluczyka.'
  ru: 'Зашифрованная команда чтения и идентификаторы, отправляемые BSI в транспондер ключа.'
  zh: '由BSI发送给钥匙应答器的加密读取命令及标识符。'
  hu: 'Titkosított olvasási parancs és azonosítók, amelyeket a BSI küld a kulcstranszpondernek.'
  pt: 'Comando de leitura encriptado e identificadores, enviados pela BSI ao transponder da chave.'
observations:
  en: 'Depends on the ECU (component-specific behaviour)'
  fr: 'Dépend du calculateur (comportement propre à l''organe)'
  es: 'Depende de la ECU (comportamiento propio del componente)'
  de: 'Abhängig vom Steuergerät (bauteilspezifisches Verhalten)'
  it: 'Dipende dalla centralina (comportamento specifico del componente)'
  pl: 'Zależy od sterownika (zachowanie specyficzne dla podzespołu)'
  ru: 'Зависит от блока управления (поведение конкретного узла)'
  zh: '取决于该ECU的具体行为'
  hu: 'A vezérlőegységtől függ (alkatrész-specifikus viselkedés)'
  pt: 'Depende da unidade de controlo (comportamento específico do componente)'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['HDC', 'LCE']

signals:
  TRANSPONDER_IDENT_REQUEST:
    bits: '1.7'
    comment:
      en: 'Transponder identification request'
      fr: 'Demande d''identification du transpondeur'
      es: 'Solicitud de identificación del transpondedor'
      de: 'Anforderung zur Transponder-Identifikation'
      it: 'Richiesta di identificazione del transponder'
      pl: 'Żądanie identyfikacji transpondera'
      ru: 'Запрос идентификации транспондера'
      zh: '应答器识别请求'
      hu: 'Transzponder azonosításának kérése'
      pt: 'Pedido de identificação do transponder'
    type: 'bool'
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande d''identification'
        es: 'Sin solicitud de identificación'
        de: 'Keine Identifikationsanforderung'
        it: 'Nessuna richiesta di identificazione'
        pl: 'Brak żądania identyfikacji'
        ru: 'Нет запроса идентификации'
        zh: '无识别请求'
        hu: 'Nincs azonosítási kérés'
        pt: 'Sem pedido de identificação'
      0x01:
        en: 'Identification requested'
        fr: 'Demande d''identification'
        es: 'Solicitud de identificación'
        de: 'Identifikation angefordert'
        it: 'Identificazione richiesta'
        pl: 'Żądanie identyfikacji'
        ru: 'Запрошена идентификация'
        zh: '请求识别'
        hu: 'Azonosítás kérve'
        pt: 'Pedido de identificação'

