      de: 'Anzahl der Fehlerereignis-Frames'
      it: 'Numero di trame di evento guasto'
      pl: 'Liczba ramek zdarzeń usterek'
      ru: 'Количество кадров событий неисправностей'
      zh: '故障事件帧数量'
      hu: 'Hibaesemény-keretek száma'
      pt: 'Número de tramas de eventos de falha'
