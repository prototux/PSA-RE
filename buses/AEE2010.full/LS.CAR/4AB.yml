id: 0x4AB
name: 'ANTITHEFT_SENSOR_FAULT_EVENT'
type: 'can'
length: 8
comment:
  en: 'Volumetric/movement antitheft sensor: fault event, logged in the BSI fault log.'
  fr: 'Capteur antivol volumétrique/mouvement : événement défaut, enregistré dans le journal des défauts du BSI.'
  es: 'Sensor antirrobo volumétrico/de movimiento: evento de fallo, registrado en el registro de fallos de la BSI.'
  de: 'Volumen-/Bewegungssensor der Diebstahlwarnanlage – Fehlerereignis, im Fehlerspeicher (Fehlerprotokoll) des BSI vermerkt.'
  it: 'Sensore antifurto volumetrico/movimento: evento di guasto, registrato nel registro guasti della BSI.'
  pl: 'Czujnik antywłamaniowy (objętościowy/ruchu) – zdarzenie usterki, zapisywane w dzienniku usterek BSI.'
  ru: 'Объёмный датчик/датчик движения противоугонной сигнализации — событие неисправности, регистрируется в журнале неисправностей BSI.'
  zh: '容积式/移动防盗传感器——故障事件,记录在BSI故障日志中。'
  hu: 'Térfogat-/mozgásérzékelő (riasztó) – hibaesemény, amelyet a BSI hibanaplójába rögzítenek.'
  pt: 'Sensor antirroubo volumétrico/de movimento: evento de avaria, registado no registo de avarias da BSI.'
observations:
  en: 'Timing defined by the diagnostic procedure'
  fr: 'Périodicité définie par la procédure de diagnostic'
  es: 'Temporización definida por el procedimiento de diagnóstico'
  de: 'Zeitverhalten durch das Diagnoseverfahren festgelegt'
  it: 'Tempistica definita dalla procedura diagnostica'
  pl: 'Zgodnie z procedurą diagnostyczną'
  ru: 'Периодичность определяется диагностической процедурой'
  zh: '由诊断程序定义发送时机'
  hu: 'Az időzítést a diagnosztikai eljárás határozza meg'
  pt: 'Temporização definida pelo procedimento de diagnóstico'
periodicity: ['trigger']
senders: ['BCM']
receivers: ['BSI']

