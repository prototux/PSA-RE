id: 0x154
name: 'IMMOBILIZER_AUTHENTICATION_RESPONSE'
type: 'can'
length: 5
comment:
  en: 'Transponder authentication response: encrypted key bytes and attempt counter, sent by the immobiliser reader.'
  fr: 'Réponse d''authentification transpondeur : octets de clé chiffres et compteur d''essais, envoyés par le lecteur antidémarrage.'
  es: 'Respuesta de autenticación del transpondedor: bytes de clave cifrados y contador de intentos, enviados por el lector del inmovilizador.'
  de: 'Transponder-Authentifizierungsantwort: verschlüsselte Schlüsselbytes und Versuchszähler, vom Wegfahrsperren-Leser gesendet.'
  it: 'Risposta di autenticazione del transponder: byte di chiave cifrati e contatore dei tentativi, inviati dal lettore dell''immobilizzatore.'
  pl: 'Odpowiedź uwierzytelniania transpondera: zaszyfrowane bajty klucza i licznik prób, wysyłane przez czytnik immobilizera.'
  ru: 'Ответ аутентификации транспондера: зашифрованные байты ключа и счётчик попыток, отправляемые считывателем иммобилайзера.'
  zh: '应答器身份验证响应:由防盗锁定读取器发送的加密密钥字节及尝试次数计数。'
  hu: 'Transzponder hitelesítési válasz: titkosított kulcsbájtok és próbálkozásszámláló, az indításgátló-olvasó által küldve.'
  pt: 'Resposta de autenticação do transponder: bytes de chave encriptados e contador de tentativas, enviados pelo leitor do imobilizador.'
observations:
  en: 'Depends on the associated diagnostic class'
  fr: 'Dépend de la classe de diagnostic associée'
  es: 'Depende de la clase de diagnóstico asociada'
  de: 'Abhängig von der zugehörigen Diagnoseklasse'
  it: 'Dipende dalla classe diagnostica associata'
  pl: 'Zależy od powiązanej klasy diagnostycznej'
  ru: 'Зависит от связанного диагностического класса'
  zh: '取决于相关诊断类别'
  hu: 'A kapcsolódó diagnosztikai osztálytól függ'
  pt: 'Depende da classe de diagnóstico associada'
periodicity: ['trigger']
senders: ['LCE', 'HDC']
receivers: ['BSI']

signals:
