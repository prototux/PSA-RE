      fr: 'Réponse cryptée du transpondeur disponible'
      es: 'Respuesta cifrada del transpondedor disponible'
      de: 'Verschlüsselte Transponderantwort verfügbar'
      it: 'Risposta cifrata del transponder disponibile'
      pl: 'Dostępna zaszyfrowana odpowiedź transpondera'
      ru: 'Доступен зашифрованный ответ транспондера'
      zh: '应答器加密响应可用'
      hu: 'A titkosított transzponderválasz elérhető'
      pt: 'Resposta cifrada do transponder disponível'
    type: 'bool'
    values:
      0x00:
        en: 'No ciphered response'
        fr: 'Pas de réponse chiffrée'
