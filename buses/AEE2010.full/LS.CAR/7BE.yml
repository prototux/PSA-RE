id: 0x7BE
name: 'DRIVER_MONITORING_RIGHT_EYE_POSITION'
type: 'can'
length: 8
comment:
  en: 'Right eye openness and 3D position, from the driver monitoring camera.'
  fr: 'Ouverture et position 3D de l''œil droit, fournies par la caméra de surveillance du conducteur.'
  es: 'Apertura y posición 3D del ojo derecho, de la cámara de monitorización del conductor.'
  de: 'Öffnungsgrad und 3D-Position des rechten Auges, von der Fahrerüberwachungskamera.'
  it: 'Apertura e posizione 3D dell''occhio destro, dalla telecamera di monitoraggio del conducente.'
  pl: 'Stopień otwarcia i pozycja 3D prawego oka, z kamery monitorowania kierowcy.'
  ru: 'Степень открытия и 3D-положение правого глаза, от камеры контроля состояния водителя.'
  zh: '驾驶员监控摄像头提供的右眼睁开程度及三维位置。'
  hu: 'A vezetőfigyelő kamera által szolgáltatott jobb szem nyitottsága és 3D pozíciója.'
  pt: 'Abertura e posição 3D do olho direito, fornecidas pela câmara de monitorização do condutor.'
periodicity: ['100ms']
senders: ['IVC_D']

