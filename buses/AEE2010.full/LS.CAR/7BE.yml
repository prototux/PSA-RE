      pl: 'Jakość (pewność) pomiaru otwarcia prawego oka kierowcy.'
      ru: 'Достоверность измерения открытия правого глаза водителя.'
      zh: '驾驶员右眼开合度测量的置信质量。'
      hu: 'A vezető jobb szeme nyitottság-mérésének megbízhatósági minősége.'
      pt: 'Qualidade de confiança da medição de abertura do olho direito do condutor.'
