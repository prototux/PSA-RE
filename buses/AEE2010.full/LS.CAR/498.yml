id: 0x498
name: 'BOP_FAULT_EVENT'
type: 'can'
length: 8
comment:
  en: 'Fault log event block sent by the BOP module, with frame number and count.'
  fr: 'Bloc d''événement du journal des défauts envoyé par le module BOP, avec numéro et nombre de trames.'
  es: 'Bloque de evento del registro de fallos enviado por el módulo BOP, con número y cantidad de tramas.'
  de: 'Fehlerprotokoll-Ereignisblock, gesendet vom BOP-Modul, mit Rahmennummer und -anzahl.'
  it: 'Blocco di evento del registro guasti inviato dal modulo BOP, con numero e conteggio delle trame.'
  pl: 'Blok zdarzenia dziennika usterek wysyłany przez moduł BOP, z numerem i liczbą ramek.'
  ru: 'Блок события журнала неисправностей, отправляемый модулем BOP, с номером и количеством кадров.'
  zh: '由BOP模块发送的故障日志事件块，包含帧编号和帧数量。'
  hu: 'A BOP modul által küldött hibanapló-esemény blokk, keretszámmal és keretdarabszámmal.'
  pt: 'Bloco de eventos do registo de avarias enviado pelo módulo BOP, com número e contagem de tramas.'
periodicity: ['trigger']
senders: ['BSG']
receivers: ['BSI']

signals:
  FAULT_EVENT_FRAME_COUNT:
    bits: '1.7-1.6'
    comment:
      en: 'Number of fault event frames'
      fr: 'Nombre de trames d''événements de défaut'
      es: 'Número de tramas de eventos de fallo'
      de: 'Anzahl der Fehlerereignis-Frames'
      it: 'Numero di trame di evento guasto'
      pl: 'Liczba ramek zdarzeń usterek'
      ru: 'Количество кадров событий неисправностей'
      zh: '故障事件帧数量'
      hu: 'Hibaesemény-keretek száma'
      pt: 'Número de tramas de eventos de falha'
    type: 'enum'
    values:
      0x00:
        en: 'Invalid'
        fr: 'Invalide'
        es: 'Inválido'
        de: 'Ungültig'
        it: 'Non valido'
        pl: 'Nieprawidłowe'
        ru: 'Недействительно'
        zh: '无效'
        hu: 'Érvénytelen'
        pt: 'Inválido'
      0x01:
        en: '1 frame'
        fr: '1 trame'
        es: '1 trama'
        de: '1 Rahmen'
        it: '1 trama'
        pl: '1 ramka'
        ru: '1 кадр'
        zh: '1帧'
        hu: '1 keret'
        pt: '1 trama'
      0x02:
        en: '2 frames'
        fr: '2 trames'
        es: '2 tramas'
