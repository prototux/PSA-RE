id: 0x00E
name: 'SEAT_MASSAGE_STATUS_2'
type: 'can'
length: 3
comment:
  en: 'Commands from the BSI to the immobilizer reader: key/push-button ignition authorisations, mirror pairing/identification requests, boot and child-lock states, learning states.'
  fr: 'Commandes de la BSI vers le lecteur antidémarrage : autorisations d''allumage à clé/bouton poussoir, demandes d''appairage/identification rétroviseur, états du coffre et de la sécurité enfant, états d''apprentissage.'
  es: 'Órdenes de la BSI al lector del inmovilizador: autorizaciones de encendido con llave/botón, solicitudes de emparejamiento/identificación de espejo, estados del maletero y del seguro para niños, estados de aprendizaje.'
  de: 'Befehle der BSI an den Wegfahrsperren-Leser: Zündfreigaben über Schlüssel/Taster, Spiegel-Kopplungs-/Identifikationsanforderungen, Kofferraum- und Kindersicherungszustände, Lernzustände.'
  it: 'Comandi della BSI al lettore dell''immobilizzatore: autorizzazioni di accensione a chiave/pulsante, richieste di abbinamento/identificazione specchietto, stati bagagliaio e sicurezza bambini, stati di apprendimento.'
  pl: 'Polecenia z BSI do czytnika immobilizera: zezwolenia na zapłon kluczykiem/przyciskiem, żądania parowania/identyfikacji lusterka, stany bagażnika i blokady dla dzieci, stany uczenia.'
  ru: 'Команды от BSI к считывателю иммобилайзера: разрешения зажигания ключом/кнопкой, запросы сопряжения/идентификации зеркала, состояния багажника и блокировки от детей, состояния обучения.'
  zh: '由BSI发送给防盗读卡器的指令：钥匙/按钮点火授权、后视镜配对/识别请求、后备箱及儿童锁状态、学习状态。'
  hu: 'A BSI parancsai az indításgátló olvasó felé: kulcsos/nyomógombos gyújtásengedélyek, tükörpárosítási/azonosítási kérések, csomagtér- és gyerekzár-állapotok, tanítási állapotok.'
  pt: 'Comandos da BSI para o leitor do imobilizador: autorizações de ignição por chave/botão, pedidos de emparelhamento/identificação do espelho, estados de bagageira e bloqueio para crianças, estados de aprendizagem.'
observations:
  en: 'On state change of any parameter except: HANDS_FREE_ACCESS_STATUS, HANDS_FREE_MODULE_OUTSIDE_LOCATION_REQUEST, HANDS_FREE_MODULE_INSIDE_LOCATION_REQUEST'
  fr: 'Sur changement d''état de tout paramètre sauf : HANDS_FREE_ACCESS_STATUS, HANDS_FREE_MODULE_OUTSIDE_LOCATION_REQUEST, HANDS_FREE_MODULE_INSIDE_LOCATION_REQUEST'
  es: 'Al cambiar el estado de cualquier parámetro excepto: HANDS_FREE_ACCESS_STATUS, HANDS_FREE_MODULE_OUTSIDE_LOCATION_REQUEST, HANDS_FREE_MODULE_INSIDE_LOCATION_REQUEST'
  de: 'Bei Statusänderung eines beliebigen Parameters außer: HANDS_FREE_ACCESS_STATUS, HANDS_FREE_MODULE_OUTSIDE_LOCATION_REQUEST, HANDS_FREE_MODULE_INSIDE_LOCATION_REQUEST'
  it: 'Al cambiamento di stato di qualsiasi parametro tranne: HANDS_FREE_ACCESS_STATUS, HANDS_FREE_MODULE_OUTSIDE_LOCATION_REQUEST, HANDS_FREE_MODULE_INSIDE_LOCATION_REQUEST'
  pl: 'Przy zmianie stanu dowolnego parametru oprócz: HANDS_FREE_ACCESS_STATUS, HANDS_FREE_MODULE_OUTSIDE_LOCATION_REQUEST, HANDS_FREE_MODULE_INSIDE_LOCATION_REQUEST'
  ru: 'При изменении состояния любого параметра, кроме: HANDS_FREE_ACCESS_STATUS, HANDS_FREE_MODULE_OUTSIDE_LOCATION_REQUEST, HANDS_FREE_MODULE_INSIDE_LOCATION_REQUEST'
  zh: '除ETAT_FCT_AML, HANDS_FREE_MODULE_OUTSIDE_LOCATION_REQUEST, DMD_LOC_INT_BML外,任意参数状态变化时'
  hu: 'Bármely paraméter állapotváltozásakor, kivéve: HANDS_FREE_ACCESS_STATUS, HANDS_FREE_MODULE_OUTSIDE_LOCATION_REQUEST, HANDS_FREE_MODULE_INSIDE_LOCATION_REQUEST'
  pt: 'Na mudança de estado de qualquer parâmetro exceto: HANDS_FREE_ACCESS_STATUS, HANDS_FREE_MODULE_OUTSIDE_LOCATION_REQUEST, HANDS_FREE_MODULE_INSIDE_LOCATION_REQUEST'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['BML', 'AVE', 'LCE']

