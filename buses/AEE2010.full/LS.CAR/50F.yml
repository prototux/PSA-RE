id: 0x50F
name: 'TPMS_WHEEL_STATE'
type: 'can'
length: 8
comment:
  en: 'Network supervision: diagnostic session, network management state and communication fault counters'
  fr: 'Supervision réseau : session de diagnostic, état de gestion réseau et compteurs de défauts de communication'
  es: 'Supervisión de red: sesión de diagnóstico, estado de gestión de red y contadores de fallos de comunicación'
  de: 'Netzwerküberwachung: Diagnosesitzung, Netzwerkmanagement-Status und Kommunikationsfehlerzähler'
  it: 'Supervisione rete: sessione diagnostica, stato di gestione rete e contatori di errori di comunicazione'
  pl: 'Nadzór sieci: sesja diagnostyczna, stan zarządzania siecią i liczniki błędów komunikacji'
  ru: 'Супервизия сети: диагностическая сессия, состояние сетевого управления и счётчики ошибок связи'
  zh: '网络监控:诊断会话、网络管理状态及通信故障计数器'
  hu: 'Hálózatfelügyelet: diagnosztikai munkamenet, hálózatkezelési állapot és kommunikációs hibaszámlálók'
  pt: 'Supervisão de rede: sessão de diagnóstico, estado da gestão de rede e contadores de avarias de comunicação.'
periodicity: ['10000ms']
senders: ['AVE']
receivers: ['BSI']

signals:
  UNUSED_1:
    bits: '1.7-1.6'
    unused: true

  COM_LOSS_FAULT:
    bits: '1.5'
    comment:
      en: 'Communication loss fault.'
      fr: 'Défaut de perte de communication.'
      es: 'Fallo de pérdida de comunicación.'
      de: 'Kommunikationsverlustfehler.'
      it: 'Guasto di perdita di comunicazione.'
      pl: 'Usterka utraty komunikacji.'
      ru: 'Неисправность потери связи.'
      zh: '通信丢失故障。'
      hu: 'Kommunikációvesztési hiba.'
      pt: 'Falha de perda de comunicação.'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No fault detected'
        fr: 'Pas de défaut'
        es: 'Sin fallo'
        de: 'Kein Fehler'
        it: 'Nessun guasto'
        pl: 'Brak usterki'
        ru: 'Неисправность не обнаружена'
        zh: '未检测到故障'
        hu: 'Nincs hiba'
        pt: 'Nenhuma avaria detetada'
      0x01:
        en: 'Fault present'
        fr: 'Défaut présent'
        es: 'Fallo presente'
        de: 'Fehler vorhanden'
        it: 'Guasto presente'
        pl: 'Usterka obecna'
        ru: 'Неисправность присутствует'
        zh: '存在故障'
        hu: 'Hiba fennáll'
        pt: 'Falha presente'

  NERR_BIT_STATUS:
    bits: '1.4'
    comment:
      en: 'NERR (network error) bit status.'
      fr: 'État du bit NERR (défaut réseau).'
      es: 'Estado del bit NERR (error de red).'
      de: 'Status des NERR-Bits (Netzwerkfehler).'
      it: 'Stato del bit NERR (errore di rete).'
      pl: 'Stan bitu NERR (błąd sieci).'
      ru: 'Состояние бита NERR (сетевая ошибка).'
      zh: 'NERR（网络错误）位状态。'
      hu: 'A NERR (hálózati hiba) bit állapota.'
      pt: 'Estado do bit NERR (falha de rede).'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No fault detected'
        fr: 'Pas de défaut'
        es: 'Sin fallo'
        de: 'Kein Fehler'
        it: 'Nessun guasto'
        pl: 'Brak usterki'
        ru: 'Неисправность не обнаружена'
        zh: '未检测到故障'
        hu: 'Nincs hiba'
        pt: 'Nenhuma avaria detetada'
      0x01:
        en: 'Fault present'
        fr: 'Défaut présent'
        es: 'Fallo presente'
        de: 'Fehler vorhanden'
        it: 'Guasto presente'
        pl: 'Usterka obecna'
        ru: 'Неисправность присутствует'
        zh: '存在故障'
        hu: 'Hiba fennáll'
        pt: 'Falha presente'

  SUPERVISION_TASK_STATE:
    bits: '1.3'
    comment:
      en: 'Network supervision task state.'
      fr: 'État de la tâche de supervision réseau.'
      es: 'Estado de la tarea de supervisión de red.'
      de: 'Status der Netzwerküberwachungsaufgabe.'
      it: 'Stato dell''attività di supervisione di rete.'
      pl: 'Stan zadania nadzoru sieci.'
      ru: 'Состояние задачи сетевого контроля.'
      zh: '网络监控任务状态。'
      hu: 'A hálózatfelügyeleti feladat állapota.'
      pt: 'Estado da tarefa de supervisão de rede.'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'NM disabled'
        fr: 'NM inactive'
        es: 'NM desactivado'
        de: 'NM deaktiviert'
        it: 'NM disattivato'
        pl: 'NM dezaktywowany'
        ru: 'NM отключён'
        zh: 'NM已停用'
        hu: 'NM kikapcsolva'
        pt: 'NM desativado'
      0x01:
        en: 'NM enabled'
        fr: 'NM activé'
        es: 'NM activado'
        de: 'NM aktiviert'
        it: 'NM attivo'
        pl: 'NM aktywne'
        ru: 'NM активен'
        zh: 'NM已启用'
        hu: 'NM aktiválva'
        pt: 'NM ativado'

  UNUSED_2:
    bits: '1.2-1.0'
    unused: true

  NERR_FAULT_COUNTER_VALUE:
    bits: '2.7-2.0'
    comment:
      en: 'Value of the NERR fault counter for the line diagnosis.'
      fr: 'Valeur du compteur de défauts NERR du diagnostic de ligne.'
      es: 'Valor del contador de fallos NERR del diagnóstico de línea.'
      de: 'Wert des Fehlerzählers NERR der Leitungsdiagnose.'
      it: 'Valore del contatore di guasti NERR della diagnosi di linea.'
      pl: 'Wartość licznika usterek NERR diagnostyki linii.'
      ru: 'Значение счётчика неисправностей NERR диагностики линии.'
      zh: '线路诊断的C_DEF_NERR故障计数器值。'
      hu: 'A vonaldiagnosztika NERR hibaszámlálójának értéke.'
      pt: 'Valor do contador de falhas NERR do diagnóstico de linha'
    type: 'uint'
    min: 0
    max: 255
    default: 0x00

  PFHM_N_AS_COUNTER:
    bits: '3.7-3.0'
    comment:
      en: 'Rolling counter incremented at each "message not sent" detection, after 1 attempt on the N_As timeout; reset to 0 at initialization.'
      fr: 'Compteur tournant incrémenté à chaque détection "message non émis" après 1 tentative sur timeout N_As, initialisé à 0.'
      es: 'Contador rotativo incrementado en cada detección de "mensaje no emitido" tras 1 intento con tiempo de espera N_As, inicializado a 0.'
      de: 'Umlaufzähler, der bei jeder Erkennung von "Nachricht nicht gesendet" nach 1 Versuch beim N_As-Timeout erhöht wird, bei Initialisierung auf 0 gesetzt.'
      it: 'Contatore a rotazione incrementato a ogni rilevamento di "messaggio non inviato" dopo 1 tentativo sul timeout N_As, inizializzato a 0.'
      pl: 'Licznik cykliczny zwiększany przy każdym wykryciu "niewysłanej wiadomości" po 1 próbie w czasie oczekiwania N_As, zerowany przy inicjalizacji.'
      ru: 'Циклический счётчик, увеличивающийся при каждом обнаружении "неотправленного сообщения" после 1 попытки по тайм-ауту N_As, обнуляется при инициализации.'
      zh: '每次检测到"消息未发送"（N_As超时尝试1次后）时递增的循环计数器，初始化时清零。'
      hu: 'Minden "nem küldött üzenet" észlelésnél növekvő körforgó számláló (N_As időtúllépés 1 kísérlet után), inicializáláskor 0-ra áll.'
      pt: 'Contador rotativo incrementado a cada deteção de "mensagem não emitida" após 1 tentativa com tempo de espera N_As esgotado, inicializado a 0'
    type: 'uint'
    min: 0
    max: 255
    default: 0x00

  PFHM_BUS_OFF_COUNTER:
    bits: '4.7-4.0'
    comment:
      en: 'Rolling counter incremented by 1 at each "bus-off" fault, reset to 0 at initialization.'
      fr: 'Compteur tournant incrémenté de 1 à chaque défaut "bus-off", initialisé à 0.'
      es: 'Contador rotativo incrementado en 1 en cada fallo "bus-off", inicializado a 0.'
      de: 'Umlaufzähler, der bei jedem "Bus-off"-Fehler um 1 erhöht wird, bei Initialisierung auf 0 gesetzt.'
      it: 'Contatore a rotazione incrementato di 1 a ogni guasto "bus-off", inizializzato a 0.'
      pl: 'Licznik cykliczny zwiększany o 1 przy każdym błędzie "bus-off", zerowany przy inicjalizacji.'
      ru: 'Циклический счётчик, увеличивающийся на 1 при каждой ошибке "bus-off", обнуляется при инициализации.'
      zh: '每次发生"总线关闭"故障时递增1的循环计数器，初始化时清零。'
      hu: 'Minden "bus-off" hibánál 1-gyel növekvő körforgó számláló, inicializáláskor 0-ra áll.'
      pt: 'Contador rotativo incrementado em 1 a cada falha "bus-off", reiniciado a 0 na inicialização'
    type: 'uint'
    min: 0
    max: 255
    default: 0x00

  PFHM_COM_LOSS_COUNTER:
    bits: '5.7-5.0'
    comment:
      en: 'Rolling counter incremented by 1 at each "communication loss" transition, reset to 0 at initialization.'
      fr: 'Compteur tournant incrémenté de 1 à chaque transition "perte de communication", initialisé à 0.'
      es: 'Contador rotativo incrementado en 1 en cada transición de "pérdida de comunicación", inicializado a 0.'
      de: 'Umlaufzähler, der bei jedem Übergang "Kommunikationsverlust" um 1 erhöht wird, bei Initialisierung auf 0 gesetzt.'
      it: 'Contatore a rotazione incrementato di 1 a ogni transizione di "perdita di comunicazione", inizializzato a 0.'
      pl: 'Licznik cykliczny zwiększany o 1 przy każdej zmianie stanu "utraty komunikacji", zerowany przy inicjalizacji.'
      ru: 'Циклический счётчик, увеличивающийся на 1 при каждом переходе "потеря связи", обнуляется при инициализации.'
      zh: '每次"通信丢失"状态转变时递增1的循环计数器，初始化时清零。'
      hu: 'Minden "kommunikációvesztés" átmenetnél 1-gyel növekvő körforgó számláló, inicializáláskor 0-ra áll.'
      pt: 'Contador rotativo incrementado em 1 a cada transição de "perda de comunicação", reiniciado a 0 na inicialização'
    type: 'uint'
    min: 0
    max: 255
    default: 0x00

  ABSENT_AVE:
    bits: '6.7-6.0'
    comment:
      en: 'Absent computer(s) supervised by the electronic anti-theft system.'
      fr: 'Calculateur(s) supervisé(s) absent(s) détecté(s) par l''antivol électronique.'
      es: 'Ordenador(es) supervisado(s) ausente(s) detectado(s) por el sistema antirrobo electrónico.'
      de: 'Von die elektronische Diebstahlsicherung als fehlend erkannte(s) überwachte(s) Steuergerät(e).'
      it: 'Centralina/e supervisionata/e rilevata/e assente/i da il sistema antifurto elettronico.'
      pl: 'Sterownik(i) nadzorowany(e) wykryty(e) jako nieobecny(e) przez elektroniczny system antywłamaniowy.'
      ru: 'Контролируемый(е) блок(и) управления, отсутствие которых обнаружено модулем электронную противоугонную систему.'
      zh: '由电子防盗系统监测到缺失的受监控控制单元。'
      hu: 'A(z) az elektronikus lopásgátlót által hiányzóként észlelt felügyelt vezérlőegység(ek).'
      pt: 'Unidade(s) de controlo supervisionada(s) ausente(s), detetada(s) por o sistema antirroubo eletrónico'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'No control unit absent'
        fr: 'Pas de calculateur absent'
        es: 'Ninguna centralita ausente'
        de: 'Kein Steuergerät fehlt'
        it: 'Nessuna centralina assente'
        pl: 'Brak nieobecnego sterownika'
        ru: 'Отсутствующих блоков управления нет'
        zh: '无缺失的控制单元'
        hu: 'Nincs hiányzó vezérlőegység'
        pt: 'Nenhuma centralina ausente'
      0x12:
        en: 'BSI absent'
        fr: 'BSI absent'
        es: 'BSI ausente'
        de: 'BSI fehlt'
        it: 'BSI assente'
        pl: 'Brak BSI'
        ru: 'BSI отсутствует'
        zh: 'BSI缺失'
        hu: 'BSI hiányzik'
        pt: 'BSI ausente'

  UNUSED_3:
    bits: '7.7-7.0'
    unused: true

  UNUSED_4:
    bits: '8.7-8.0'
    unused: true
