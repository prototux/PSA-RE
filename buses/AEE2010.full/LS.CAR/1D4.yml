id: 0x1D4
name: 'IMMOBILIZER_AUTHENTICATION_RESPONSE_AES'
type: 'can'
length: 7
comment:
  en: 'Transponder AES authentication response: encrypted key bytes and attempt counter, sent by the immobiliser reader.'
  fr: 'Réponse d''authentification AES transpondeur : octets de clé chiffres et compteur d''essais, envoyés par le lecteur antidémarrage.'
  es: 'Respuesta de autenticación AES del transpondedor: bytes de clave cifrados y contador de intentos, enviados por el lector del inmovilizador.'
  de: 'Transponder-AES-Authentifizierungsantwort: verschlüsselte Schlüsselbytes und Versuchszähler, vom Wegfahrsperren-Leser gesendet.'
  it: 'Risposta di autenticazione AES del transponder: byte di chiave cifrati e contatore dei tentativi, inviati dal lettore dell''immobilizzatore.'
  pl: 'Odpowiedź uwierzytelniania AES transpondera: zaszyfrowane bajty klucza i licznik prób, wysyłane przez czytnik immobilizera.'
  ru: 'Ответ AES-аутентификации транспондера: зашифрованные байты ключа и счётчик попыток, отправляемые считывателем иммобилайзера.'
  zh: '应答器AES身份验证响应:由防盗锁定读取器发送的加密密钥字节及尝试次数计数。'
  hu: 'Transzponder AES hitelesítési válasz: titkosított kulcsbájtok és próbálkozásszámláló, az indításgátló-olvasó által küldve.'
  pt: 'Resposta de autenticação AES do transponder: bytes de chave encriptados e contador de tentativas, enviados pelo leitor do imobilizador.'
periodicity: ['trigger']
senders: ['HDC', 'LCE']
receivers: ['BSI']

signals:
  TRANSPONDER_ENCRYPTED_MEMORY_AES_1:
    bits: '1.7-1.0'
    comment:
      en: 'Encrypted transponder user memory answer, byte 1 (AES)'
      fr: 'Réponse chiffrée de la mémoire utilisateur du transpondeur, octet 1 (AES)'
      es: 'Respuesta cifrada de la memoria de usuario del transpondedor, byte 1 (AES)'
      de: 'Verschlüsselte Antwort des Transponder-Benutzerspeichers, Byte 1 (AES)'
      it: 'Risposta cifrata della memoria utente del transponder, byte 1 (AES)'
      pl: 'Zaszyfrowana odpowiedź pamięci użytkownika transpondera, bajt 1 (AES)'
      ru: 'Зашифрованный ответ пользовательской памяти транспондера, байт 1 (AES)'
      zh: '应答器用户存储器加密响应,字节1(AES)'
      hu: 'A transzponder felhasználói memóriájának titkosított válasza, 1. bájt (AES)'
      pt: 'Resposta da memória de utilizador do transponder encriptada, byte 1 (AES)'
