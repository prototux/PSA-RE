        pt: 'Falha'

  HEATED_STEERING_WHEEL_TEMPERATURE:
    bits: '2.7-2.0'
    comment:
      en: 'Heated steering wheel temperature sensor value'
      fr: 'Valeur de la sonde de température du volant chauffant'
      es: 'Valor del sensor de temperatura del volante calefactado'
      de: 'Temperaturfühlerwert der Lenkradheizung'
      it: 'Valore del sensore di temperatura del volante riscaldato'
      pl: 'Wartość czujnika temperatury ogrzewanej kierownicy'
