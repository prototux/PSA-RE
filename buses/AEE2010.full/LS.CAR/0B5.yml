id: 0x0B5
name: 'HEATED_STEERING_WHEEL_STATUS'
type: 'can'
length: 8
comment:
  en: 'Heated steering wheel status: heating state, temperature, degraded-mode and context-loss events, fault response.'
  fr: 'État du volant chauffant : état de chauffe, température, événements de mode dégradé et de perte de contexte, réponse de défaut.'
  es: 'Estado del volante calefactado: estado de calefacción, temperatura, eventos de modo degradado y de pérdida de contexto, respuesta de fallo.'
  de: 'Status der Lenkradheizung: Heizzustand, Temperatur, Ereignisse für degradierten Modus und Kontextverlust, Fehlerrückmeldung.'
  it: 'Stato del volante riscaldato: stato di riscaldamento, temperatura, eventi di modalità degradata e perdita di contesto, risposta di guasto.'
  pl: 'Stan podgrzewanej kierownicy: stan ogrzewania, temperatura, zdarzenia trybu awaryjnego i utraty kontekstu, odpowiedź o usterce.'
  ru: 'Статус подогрева руля: состояние нагрева, температура, события деградированного режима и потери контекста, ответ о неисправности.'
  zh: '方向盘加热状态:加热状态、温度、降级模式和上下文丢失事件、故障响应。'
  hu: 'A fűthető kormány állapota: fűtési állapot, hőmérséklet, korlátozott üzemmód és kontextusvesztés események, hibaválasz.'
  pt: 'Estado do volante aquecido: estado de aquecimento, temperatura, eventos de modo degradado e de perda de contexto, resposta de avaria.'
periodicity: ['40ms']
senders: ['HDC']
receivers: ['BSI']

signals:
  HEATED_STEERING_WHEEL_STATE:
    bits: '1.2-1.0'
    comment:
      en: 'Heated steering wheel state'
      fr: 'État du volant chauffant'
      es: 'Estado del volante calefactado'
      de: 'Status der Lenkradheizung'
      it: 'Stato del volante riscaldato'
      pl: 'Stan ogrzewania kierownicy'
      ru: 'Состояние подогрева руля'
      zh: '方向盘加热状态'
      hu: 'Fűthető kormánykerék állapota'
      pt: 'Estado do volante aquecido'
    type: 'enum'
    values:
      0x00:
        en: 'Off'
        fr: 'Arrêt'
        es: 'Apagado'
        de: 'Aus'
        it: 'Spento'
        pl: 'Wyłączone'
        ru: 'Выключено'
        zh: '关闭'
        hu: 'Kikapcsolva'
        pt: 'Desligado'
      0x01:
        en: 'Level 1'
        fr: 'Niveau 1'
        es: 'Nivel 1'
        de: 'Stufe 1'
        it: 'Livello 1'
        pl: 'Poziom 1'
        ru: 'Уровень 1'
        zh: '等级1'
        hu: '1. szint'
        pt: 'Nível 1'
      0x02:
        en: 'Level 2'
        fr: 'Niveau 2'
        es: 'Nivel 2'
        de: 'Stufe 2'
        it: 'Livello 2'
        pl: 'Poziom 2'
        ru: 'Уровень 2'
        zh: '2级'
        hu: '2. szint'
        pt: 'Nível 2'
      0x03:
        en: 'Level 3'
        fr: 'Niveau 3'
        es: 'Nivel 3'
        de: 'Stufe 3'
        it: 'Livello 3'
        pl: 'Poziom 3'
        ru: 'Уровень 3'
        zh: '级别3'
        hu: '3. szint'
        pt: 'Nível 3'
      0x04:
        en: 'Load shedding'
        fr: 'Délestage'
        es: 'Deslastre'
        de: 'Lastabwurf'
        it: 'Distacco del carico'
        pl: 'Zrzut obciążenia'
        ru: 'Сброс нагрузки'
        zh: '负载削减'
        hu: 'Terheléskorlátozás'
        pt: 'Corte de carga'
