        es: 'Pertinencia de los contextos BSI no garantizada'
        de: 'Relevanz der BSI-Kontexte nicht sichergestellt'
        it: 'Pertinenza dei contesti BSI non garantita'
        pl: 'Trafność kontekstów BSI niezapewniona'
        ru: 'Актуальность контекстов BSI не гарантирована'
        zh: 'BSI上下文的相关性未得到保证'
        hu: 'A BSI kontextusok relevanciája nem biztosított'
