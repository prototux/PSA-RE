        unused: true
      0x06:
        en: 'Invalid'
        fr: 'Non valide'
        es: 'No válido'
        de: 'Ungültig'
        it: 'Non valido'
        pl: 'Nieprawidłowe'
        ru: 'Недействительно'
        zh: '无效'
        hu: 'Érvénytelen'
        pt: 'Não válido'
      0x07:
        en: 'Failure'
        fr: 'Défaillance'
        es: 'Fallo'
        de: 'Ausfall'
        it: 'Guasto'
        pl: 'Awaria'
        ru: 'Отказ'
        zh: '故障'
