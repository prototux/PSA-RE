      pt: 'Valor do sensor de temperatura do volante aquecido'
    type: 'uint'
    factor: 1
    offset: -15
    min: -15
    max: 45
    units: '°C'
    invalid: 0xFF

  BSI_CONTEXT_RELEVANCE:
