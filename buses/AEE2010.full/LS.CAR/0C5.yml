id: 0x0C5
name: 'BDCP_COMMAND'
type: 'can'
length: 1
comment:
  en: 'Impact sensor inhibition command, sent by the BSI to the BDCP module.'
  fr: 'Commande d''inhibition du capteur de choc, envoyée par la BSI au module BDCP.'
  es: 'Orden de inhibición del sensor de impacto, enviada por la BSI al módulo BDCP.'
  de: 'Aufprallsensor-Sperrbefehl, von der BSI an das BDCP-Modul gesendet.'
  it: 'Comando di inibizione del sensore d''urto, inviato dalla BSI al modulo BDCP.'
  pl: 'Polecenie wyłączenia czujnika uderzenia, wysyłane przez BSI do modułu BDCP.'
  ru: 'Команда блокировки датчика удара, отправляемая BSI в модуль BDCP.'
  zh: '由BSI发送给BDCP模块的碰撞传感器抑制命令。'
  hu: 'Az ütközésérzékelő tiltási parancsa, a BSI küldi a BDCP modulnak.'
  pt: 'Comando de inibição do sensor de impacto, enviado pela BSI ao módulo BDCP.'
observations:
  en: 'On state change of: ACTIVE_HOOD_INHIBIT_REQUEST'
  fr: 'Sur changement d''état de : ACTIVE_HOOD_INHIBIT_REQUEST'
  es: 'Al cambiar el estado de: ACTIVE_HOOD_INHIBIT_REQUEST'
  de: 'Bei Statusänderung von: ACTIVE_HOOD_INHIBIT_REQUEST'
  it: 'Al cambiamento di stato di: ACTIVE_HOOD_INHIBIT_REQUEST'
  pl: 'Wysyłane przy zmianie stanu: ACTIVE_HOOD_INHIBIT_REQUEST'
  ru: 'При изменении состояния: ACTIVE_HOOD_INHIBIT_REQUEST'
  zh: '当CHOC_INHIB_CAPACT状态变化时'
  hu: 'A(z) ACTIVE_HOOD_INHIBIT_REQUEST állapotváltozásakor'
  pt: 'Na mudança de estado de: ACTIVE_HOOD_INHIBIT_REQUEST'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['BDCP']

signals:
  UNUSED_1:
    bits: '1.7-1.1'
    unused: true

  ACTIVE_HOOD_INHIBIT_REQUEST:
    bits: '1.0'
    comment:
      en: 'Active hood inhibition request'
      fr: 'Demande d''inhibition du capot actif'
      es: 'Solicitud de inhibición del capó activo'
      de: 'Anforderung zur Deaktivierung der aktiven Motorhaube'
      it: 'Richiesta di inibizione del cofano attivo'
      pl: 'Żądanie wyłączenia aktywnej maski'
      ru: 'Запрос блокировки активного капота'
      zh: '主动式发动机罩禁用请求'
      hu: 'Az aktív motorháztető letiltási kérése'
      pt: 'Pedido de inibição do capot ativo'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'False'
        fr: 'Faux'
        es: 'Falso'
        de: 'Falsch'
        it: 'Falso'
        pl: 'Fałsz'
        ru: 'Ложь'
        zh: '假'
        hu: 'Hamis'
        pt: 'Falso'
      0x01:
        en: 'True'
        fr: 'Vrai'
        es: 'Verdadero'
        de: 'Wahr'
        it: 'Vero'
        pl: 'Prawda'
        ru: 'Истина'
        zh: '真'
        hu: 'Igaz'
        pt: 'Verdadeiro'
