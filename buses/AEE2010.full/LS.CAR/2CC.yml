id: 0x2CC
name: 'SLIDING_DOOR_WINDOW_COMMAND'
type: 'can'
length: 4
comment:
  en: 'Sliding door window commands and state: crash detection, load shedding, door length, window movement/position and push button permissions.'
  fr: 'Commandes et état de vitre de porte coulissante : détection de choc, délestage, longueur de porte, mouvement/position de vitre et permissions de bouton poussoir.'
  es: 'Órdenes y estado de la ventanilla de puerta corredera: detección de choque, deslastre, longitud de puerta, movimiento/posición de ventanilla y permisos de botón pulsador.'
  de: 'Befehle und Zustand des Schiebetürfensters: Stoßerkennung, Lastabwurf, Türlänge, Fensterbewegung/-position und Tasterberechtigungen.'
  it: 'Comandi e stato del finestrino della porta scorrevole: rilevamento urto, distacco carico, lunghezza porta, movimento/posizione finestrino e permessi pulsante.'
  pl: 'Polecenia i stan szyby drzwi przesuwnych: wykrywanie uderzenia, zrzut obciążenia, długość drzwi, ruch/pozycja szyby i uprawnienia przycisku.'
  ru: 'Команды и состояние стекла раздвижной двери: обнаружение удара, сброс нагрузки, длина двери, движение/положение стекла и разрешения кнопки.'
  zh: '滑动门车窗命令与状态：碰撞检测、负载脱扣、门长度、车窗运动/位置及按钮许可。'
  hu: 'A tolóajtó ablakának parancsai és állapota: ütközésérzékelés, tehermentesítés, ajtóhossz, ablakmozgás/-pozíció és nyomógomb-engedélyek.'
  pt: 'Comandos e estado do vidro da porta corrediça: deteção de colisão, corte de carga, comprimento da porta, movimento/posição do vidro e permissões dos botões.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['MDPLC']

