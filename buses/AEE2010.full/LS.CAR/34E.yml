id: 0x34E
name: 'TRANSPONDER_AES_KEY_PROGRAMMING_2'
type: 'can-tp'
comment:
  en: 'AES key programming data for the transponder (part 2): key reference and packet counter.'
  fr: 'Données de programmation de clé AES du transpondeur (partie 2) : référence de clé et compteur de paquet.'
  es: 'Datos de programación de clave AES del transpondedor (parte 2): referencia de clave y contador de paquete.'
  de: 'AES-Schlüssel-Programmierdaten des Transponders (Teil 2): Schlüsselreferenz und Paketzähler.'
  it: 'Dati di programmazione della chiave AES del transponder (parte 2): riferimento chiave e contatore pacchetti.'
  pl: 'Dane programowania klucza AES transpondera (część 2): numer klucza i licznik pakietów.'
  ru: 'Данные программирования AES-ключа транспондера (часть 2): номер ключа и счётчик пакетов.'
  zh: '应答器的AES密钥编程数据(第2部分):密钥编号及数据包计数。'
  hu: 'A transzponder AES-kulcs programozási adatai (2. rész): kulcs azonosító és csomagszámláló.'
  pt: 'Dados de programação da chave AES do transponder (parte 2): referência da chave e contador de pacotes.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['LCE']
isotp:
  addressing: 'normal'

signals:
  LEARNING_PACKAGE_COUNTER:
    bits: '1.7-1.4'
    comment:
      en: 'Counter marking the set of learning frames belonging to the same code'
      fr: 'Compteur marquant l''ensemble des trames d''apprentissage appartenant à un même code'
      es: 'Contador que marca el conjunto de tramas de aprendizaje pertenecientes al mismo código'
      de: 'Zähler zur Kennzeichnung der zu einem gemeinsamen Code gehörenden Lernrahmen'
      it: 'Contatore che contrassegna l''insieme dei frame di apprendimento appartenenti allo stesso codice'
      pl: 'Licznik oznaczający zestaw ramek uczenia należących do tego samego kodu'
      ru: 'Счётчик, отмечающий набор кадров обучения, относящихся к одному коду'
      zh: '标记属于同一代码的一组学习帧的计数器'
      hu: 'Az azonos kódhoz tartozó betanító keretek csoportját jelölő számláló'
      pt: 'Contador que marca o conjunto de tramas de aprendizagem pertencentes ao mesmo código'
    type: 'uint'
    min: 0
    max: 15

  RSK_PART_NUMBER:
    bits: '1.3-1.0'
    comment:
      en: 'Sub-addressing code defining the meaning of the PROG_RSK_STREAM stream contents'
      fr: 'Code de sous-adressage définissant la signification du contenu du flux PROG_RSK_STREAM'
      es: 'Código de subdireccionamiento que define el significado del contenido del flujo PROG_RSK_STREAM'
      de: 'Subadressierungscode, der die Bedeutung des Inhalts des PROG_RSK_STREAM-Datenstroms festlegt'
      it: 'Codice di indirizzamento secondario che definisce il significato del contenuto del flusso PROG_RSK_STREAM'
      pl: 'Kod podadresowania określający znaczenie zawartości strumienia PROG_RSK_STREAM'
      ru: 'Код субадресации, определяющий значение содержимого потока PROG_RSK_STREAM'
      zh: '定义PROG_RSK流内容含义的子地址代码'
      hu: 'Almcímzési kód, amely meghatározza a PROG_RSK_STREAM adatfolyam tartalmának jelentését'
      pt: 'Código de subendereçamento que define o significado do conteúdo do fluxo PROG_RSK_STREAM'
    type: 'uint'

  PROG_RSK_STREAM:
    bits: '2.7-8.0'
    comment:
      en: 'Stream carrying the codes used to learn an electronic key or IML, including the RSK code, according to the RSK_PART_NUMBER value'
      fr: 'Flux transportant les codes utilisés pour l''apprentissage d''une clé électronique ou IML, dont le code RSK, selon la valeur de RSK_PART_NUMBER'
      es: 'Flujo que transporta los códigos utilizados para el aprendizaje de una llave electrónica o IML, incluido el código RSK, según el valor de RSK_PART_NUMBER'
      de: 'Datenstrom mit den Codes zum Einlernen eines elektronischen Schlüssels oder IML, einschließlich des RSK-Codes, gemäß dem Wert von RSK_PART_NUMBER'
      it: 'Flusso che trasporta i codici utilizzati per l''apprendimento di una chiave elettronica o IML, incluso il codice RSK, in base al valore di RSK_PART_NUMBER'
      pl: 'Strumień przenoszący kody wykorzystywane do uczenia klucza elektronicznego lub IML, w tym kod RSK, zgodnie z wartością RSK_PART_NUMBER'
      ru: 'Поток, содержащий коды для обучения электронного ключа или IML, включая код RSK, в зависимости от значения RSK_PART_NUMBER'
      zh: '携带用于电子钥匙或IML学习的代码(包括RSK代码)的数据流,根据RSK_PART_NUMBER的值'
      hu: 'Az elektronikus kulcs vagy IML betanításához használt kódokat (köztük az RSK-kódot) hordozó adatfolyam, az RSK_PART_NUMBER értéke szerint'
      pt: 'Fluxo que transporta os códigos utilizados para a aprendizagem de uma chave eletrónica ou IML, incluindo o código RSK, de acordo com o valor de RSK_PART_NUMBER'
    type: 'str'
