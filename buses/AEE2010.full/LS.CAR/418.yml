id: 0x418
name: 'ENGINE_ECU_DATA_4'
type: 'can'
length: 2
comment:
  en: 'Network wake-up frame sent by the BOP module; repeated every 10 ms until the BSI commands frame is received.'
  fr: 'Trame de réveil réseau envoyée par le module BOP ; répétée toutes les 10 ms jusqu''à réception de la trame de commandes de la BSI.'
  es: 'Trama de despertar de red enviada por el módulo BOP; repetida cada 10 ms hasta recibir la trama de órdenes de la BSI.'
  de: 'Netzwerk-Weckrahmen, gesendet vom BOP-Modul; wiederholt alle 10 ms bis zum Empfang des BSI-Befehlsrahmens.'
  it: 'Trama di risveglio rete inviata dal modulo BOP; ripetuta ogni 10 ms fino alla ricezione della trama comandi della BSI.'
  pl: 'Ramka wybudzenia sieci wysyłana przez moduł BOP; powtarzana co 10 ms do momentu odebrania ramki poleceń BSI.'
  ru: 'Кадр пробуждения сети, отправляемый модулем BOP; повторяется каждые 10 мс до получения командного кадра BSI.'
  zh: '由BOP模块发送的网络唤醒帧；每10毫秒重复发送，直到收到BSI命令帧为止。'
  hu: 'A BOP modul által küldött hálózatébresztő keret; 10 ms-onként ismétlődik, amíg meg nem érkezik a BSI parancskerete.'
  pt: 'Trama de ativação de rede enviada pelo módulo BOP; repetida a cada 10 ms até ser recebida a trama de comandos da BSI.'
periodicity: ['trigger']
senders: ['BSG']
receivers: ['BSI']

signals:
  PSD_NETWORK_WAKEUP_PADDING:
    bits: '1.7-1.0'
    comment:
      en: '8 zero bits used to wake up the network'
      fr: '8 bits à zéro utilisés pour le réveil du réseau'
      es: '8 bits a cero utilizados para la activación de la red'
      de: '8 Nullbits zum Aufwecken des Netzwerks'
      it: '8 bit a zero utilizzati per il risveglio della rete'
      pl: '8 zerowych bitów wykorzystywanych do wybudzenia sieci'
      ru: '8 нулевых бит, используемых для пробуждения сети'
      zh: '用于唤醒网络的8个零位'
      hu: '8 nullás bit a hálózat ébresztéséhez'
      pt: '8 bits a zero utilizados para a ativação da rede'
    type: 'uint'

  WAKEUP_BY_DOME_LIGHT_REQUEST:
    bits: '2.7'
    comment:
      en: 'Wake-up caused by a dome light request'
      fr: 'Réveil provoqué par une demande d''allumage du plafonnier'
      es: 'Activación provocada por una solicitud de encendido de la luz de techo'
      de: 'Aufwachen durch eine Innenleuchten-Anforderung'
      it: 'Riattivazione causata da una richiesta di accensione della luce interna'
      pl: 'Wybudzenie spowodowane żądaniem włączenia lampki sufitowej'
      ru: 'Пробуждение по запросу включения плафона освещения салона'
      zh: '由顶灯请求触发的唤醒'
      hu: 'A belső világítás kérése által kiváltott ébresztés'
      pt: 'Despertar causado por um pedido da luz de teto'
    type: 'bool'
    values:
      0x00:
        en: 'Cause that did not trigger wake-up'
        fr: 'Cause n''ayant pas provoqué le réveil'
        es: 'Causa que no provocó la activación'
        de: 'Ursache, die kein Aufwecken ausgelöst hat'
        it: 'Causa che non ha provocato il risveglio'
        pl: 'Przyczyna, która nie spowodowała wybudzenia'
        ru: 'Причина, не вызвавшая пробуждение'
        zh: '未触发唤醒的原因'
        hu: 'Az ébresztést ki nem váltó ok'
        pt: 'Causa que não desencadeou a ativação'
      0x01:
        en: 'Wake-up cause'
        fr: 'Cause du réveil'
        es: 'Causa del despertar'
        de: 'Weckursache'
        it: 'Causa del risveglio'
        pl: 'Przyczyna wybudzenia'
        ru: 'Причина пробуждения'
        zh: '唤醒原因'
        hu: 'Ébresztés oka'
        pt: 'Causa do despertar'

