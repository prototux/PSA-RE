id: 0x08E
name: 'BML_AUTH_COMMAND'
type: 'can'
length: 8
comment:
  en: 'Encrypted authentication command and code sent by the BSI to the BML (steering lock) module.'
  fr: 'Commande et code d''authentification chiffrés envoyés par la BSI au module BML (antivol de direction).'
  es: 'Orden y código de autenticación cifrados enviados por la BSI al módulo BML (bloqueo de dirección).'
  de: 'Verschlüsselter Authentifizierungsbefehl und -code, von der BSI an das BML-Modul (Lenkradsperre) gesendet.'
  it: 'Comando e codice di autenticazione cifrati inviati dalla BSI al modulo BML (bloccasterzo).'
  pl: 'Zaszyfrowane polecenie i kod uwierzytelnienia wysyłane przez BSI do modułu BML (blokada kierownicy).'
  ru: 'Зашифрованная команда и код аутентификации, отправляемые BSI в модуль BML (замок рулевой колонки).'
  zh: '由BSI发送给BML（转向锁）模块的加密认证命令及代码。'
  hu: 'Titkosított hitelesítési parancs és kód, amelyet a BSI küld a BML (kormányzár) modulnak.'
  pt: 'Comando e código de autenticação encriptados, enviados pela BSI ao módulo BML (bloqueio de direção).'
observations:
  en: 'On +APC power-up and power-down'
  fr: 'Sur mise et coupure du +APC'
  es: 'Al activar y desactivar el +APC'
  de: 'Beim Ein- und Ausschalten von +APC'
  it: 'All''attivazione e disattivazione del +APC'
  pl: 'Przy włączeniu i wyłączeniu +APC'
  ru: 'При включении и выключении +APC'
  zh: '+APC上电及断电时'
  hu: 'A +APC be- és kikapcsolásakor'
  pt: 'Na ativação e desativação do +APC'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['BML']

signals:
  TRANSPONDER_RANDOM_CHALLENGE:
    bits: '1.7-4.0'
    comment:
      en: 'Random challenge code'
      fr: 'Code aléatoire'
      es: 'Código aleatorio'
      de: 'Zufallscode (Challenge)'
      it: 'Codice casuale'
      pl: 'Losowy kod'
      ru: 'Случайный код запроса'
      zh: '随机挑战码'
      hu: 'Véletlen kihívási kód'
      pt: 'Código aleatório de desafio'
    type: 'uint'

  TRANSPONDER_ENCRYPTED_PASSWORD:
    bits: '5.7-8.0'
    comment:
      en: 'Transponder encrypted password'
      fr: 'Mot de passe crypté du transpondeur'
      es: 'Contraseña cifrada del transpondedor'
      de: 'Verschlüsseltes Transponder-Passwort'
      it: 'Password cifrata del transponder'
      pl: 'Zaszyfrowane hasło transpondera'
      ru: 'Зашифрованный пароль транспондера'
      zh: '应答器加密密码'
      hu: 'Transzponder titkosított jelszava'
      pt: 'Palavra-passe encriptada do transponder'
    type: 'uint'
