id: 0x114
name: 'BATTERY_MANAGEMENT_UNIT_VERSION'
type: 'can'
length: 5
comment:
  en: 'Immobiliser transponder status: identification code read from the transponder and from the RF key, identification execution state, attempt counter, key approach detection.'
  fr: 'État du transpondeur antidémarrage : code d''identification lu sur le transpondeur et sur la clé RF, état d''exécution de l''identification, compteur d''essais, détection d''approche de la clé.'
  es: 'Estado del transpondedor del inmovilizador: código de identificación leído del transpondedor y de la llave RF, estado de ejecución de la identificación, contador de intentos, detección de aproximación de la llave.'
  de: 'Status des Wegfahrsperren-Transponders: Identifikationscode vom Transponder und vom HF-Schlüssel gelesen, Ausführungsstatus der Identifikation, Versuchszähler, Erkennung der Schlüsselannäherung.'
  it: 'Stato del transponder dell''immobilizzatore: codice di identificazione letto dal transponder e dalla chiave RF, stato di esecuzione dell''identificazione, contatore dei tentativi, rilevamento avvicinamento chiave.'
  pl: 'Stan transpondera immobilizera: kod identyfikacyjny odczytany z transpondera i z kluczyka RF, stan wykonania identyfikacji, licznik prób, wykrycie zbliżenia kluczyka.'
  ru: 'Статус транспондера иммобилайзера: идентификационный код, считанный с транспондера и с радиоключа, статус выполнения идентификации, счётчик попыток, обнаружение приближения ключа.'
  zh: '防盗应答器状态:从应答器和射频钥匙读取的识别码、识别执行状态、尝试计数器、钥匙接近检测。'
  hu: 'Az indításgátló transzponder állapota: a transzponderről és az RF-kulcsról olvasott azonosító kód, azonosítás végrehajtási állapota, kísérletszámláló, kulcsközelítés érzékelése.'
  pt: 'Estado do transponder do imobilizador: código de identificação lido do transponder e da chave RF, estado de execução da identificação, contador de tentativas, deteção de aproximação da chave.'
observations:
  en: 'On +APC power-up'
  fr: 'Sur mise du +APC'
  es: 'Al activarse el +APC'
  de: 'Beim Einschalten von +APC'
  it: 'All''attivazione del +APC'
  pl: 'Przy włączeniu +APC'
  ru: 'При включении +APC'
  zh: '+APC上电时'
  hu: 'A +APC bekapcsolásakor'
  pt: 'Na ativação do +APC'
periodicity: ['trigger']
senders: ['HDC', 'LCE']
receivers: ['BSI']

