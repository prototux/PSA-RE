id: 0x054
name: 'AVE_AUTHENTICATION_RESPONSE'
type: 'can'
length: 4
comment:
  en: 'Authentication response and status from the steering-lock module (AVE): state, encrypted key bytes, decoder command status.'
  fr: 'Réponse d''authentification et état du module antivol de direction (AVE) : état, octets de clé chiffres, statut de la commande de décodage.'
  es: 'Respuesta de autenticación y estado del módulo de bloqueo de dirección (AVE): estado, bytes de clave cifrados, estado del comando de decodificación.'
  de: 'Authentifizierungsantwort und Status des Lenkradschloss-Moduls (AVE): Zustand, verschlüsselte Schlüsselbytes, Decoder-Befehlsstatus.'
  it: 'Risposta di autenticazione e stato del modulo bloccasterzo (AVE): stato, byte di chiave cifrati, stato del comando di decodifica.'
  pl: 'Odpowiedź uwierzytelniania i stan modulu blokady kierownicy (AVE): stan, zaszyfrowane bajty klucza, stan polecenia dekodowania.'
  ru: 'Ответ аутентификации и статус модуля блокировки руля (AVE): состояние, зашифрованные байты ключа, статус команды декодирования.'
  zh: '转向锁模块(AVE)的身份验证响应及状态:状态、加密密钥字节、解码命令状态。'
  hu: 'A kormányzár modul (AVE) hitelesítési válasza és állapota: állapot, titkosított kulcsbájtok, dekoderparancs-állapot.'
  pt: 'Resposta de autenticação e estado do módulo antifurto de direção (AVE): estado, bytes de chave encriptados, estado do comando de descodificação.'
observations:
  en: 'Depends on the associated diagnostic class'
  fr: 'Dépend de la classe de diagnostic associée'
  es: 'Depende de la clase de diagnóstico asociada'
  de: 'Abhängig von der zugehörigen Diagnoseklasse'
  it: 'Dipende dalla classe diagnostica associata'
  pl: 'Zależy od powiązanej klasy diagnostycznej'
  ru: 'Зависит от связанного диагностического класса'
  zh: '取决于相关诊断类别'
  hu: 'A kapcsolódó diagnosztikai osztálytól függ'
  pt: 'Depende da classe de diagnóstico associada'
periodicity: ['trigger']
senders: ['AVE']
receivers: ['BSI']

