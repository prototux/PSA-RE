id: 0x3D3
name: 'VALVE_LEARNING_STATUS'
type: 'can'
length: 1
comment:
  en: 'Electric valve actuator self-learning status for the rear, front-right and front-left units.'
  fr: 'État d''apprentissage des actionneurs de vanne électrique arrière, avant droit et avant gauche.'
  es: 'Estado de autoaprendizaje del actuador de válvula eléctrica trasero, delantero derecho y delantero izquierdo.'
  de: 'Selbstlernstatus der elektrischen Ventilstellglieder hinten, vorne rechts und vorne links.'
  it: 'Stato di autoapprendimento degli attuatori della valvola elettrica posteriore, anteriore destro e anteriore sinistro.'
  pl: 'Stan samouczenia siłowników zaworu elektrycznego tylnego, przedniego prawego i przedniego lewego.'
  ru: 'Статус самообучения электрического клапанного привода: задний, передний правый и передний левый.'
  zh: '后部、前右和前左电动阀执行器的自学习状态。'
  hu: 'A hátsó, jobb és bal első elektromos szelepaktuátor önbeállási állapota.'
  pt: 'Estado de autoaprendizagem do atuador da válvula elétrica das unidades traseira, dianteira direita e dianteira esquerda.'
periodicity: ['500450ms']
senders: ['LCE']
receivers: ['BSI']

