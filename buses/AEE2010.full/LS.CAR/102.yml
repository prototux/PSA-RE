id: 0x102
name: 'SCDT_VERSION'
type: 'can'
length: 2
comment:
  en: 'Request to the steering column module to play a chime/sound, with volume.'
  fr: 'Demande au module de colonne de direction d''émettre un son/bip, avec le niveau sonore.'
  es: 'Solicitud al módulo de columna de dirección de emitir un sonido/aviso, con el nivel sonoro.'
  de: 'Anforderung an das Lenksäulenmodul, einen Klang/Ton mit Lautstärke auszugeben.'
  it: 'Richiesta al modulo colonna di sterzo di emettere un suono/segnale acustico, con il livello sonoro.'
  pl: 'Żądanie do modułu kolumny kierownicy odtworzenia dźwięku/sygnału, wraz z poziomem głośności.'
  ru: 'Запрос модулю рулевой колонки на воспроизведение звукового сигнала с указанием громкости.'
  zh: '向转向柱模块发出的播放提示音请求，附带音量。'
  hu: 'Kérés a kormányoszlop-modul felé egy hang/csengőhang lejátszására, a hangerővel együtt.'
  pt: 'Pedido ao módulo da coluna de direção para reproduzir um sinal sonoro/som, com volume.'
observations:
  en: 'On state change of: SOUND_REQUEST, SOUND_VOLUME'
  fr: 'Sur changement d''état de : SOUND_REQUEST, SOUND_VOLUME'
  es: 'Al cambiar el estado de: SOUND_REQUEST, SOUND_VOLUME'
  de: 'Bei Statusänderung von: SOUND_REQUEST, SOUND_VOLUME'
  it: 'Al cambiamento di stato di: SOUND_REQUEST, SOUND_VOLUME'
  pl: 'Wysyłane przy zmianie stanu: SOUND_REQUEST, SOUND_VOLUME'
  ru: 'При изменении состояния: SOUND_REQUEST, SOUND_VOLUME'
  zh: '当EM_SON_CMD_BRT, NIV_SON_CMD_BRT状态变化时'
  hu: 'A(z) SOUND_REQUEST, SOUND_VOLUME állapotváltozásakor'
  pt: 'Na mudança de estado de: SOUND_REQUEST, SOUND_VOLUME'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['HDC']

