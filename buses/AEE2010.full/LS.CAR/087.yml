id: 0x087
name: 'STALK_MODULE_STATUS'
type: 'can'
length: 3
comment:
  en: 'Steering column stalk switch commands: indicators, lights, front/rear wiper and washer requests, sent by the stalk module.'
  fr: 'Commandes du commodo de colonne de direction : clignotants, feux, demandes d''essuyage/lavage avant et arrière, envoyées par le module commodo.'
  es: 'Órdenes del mando bajo el volante: intermitentes, luces, solicitudes de limpiaparabrisas/lavado delantero y trasero, enviadas por el módulo de mando.'
  de: 'Befehle des Lenkstockschalters: Blinker, Licht, Anforderungen für Wischer/Waschanlage vorn und hinten, gesendet vom Lenkstockschaltermodul.'
  it: 'Comandi della leva sotto il volante: indicatori di direzione, luci, richieste di tergicristallo/lavavetro anteriore e posteriore, inviati dal modulo leva.'
  pl: 'Polecenia dźwigienki kolumny kierownicy: kierunkowskazy, światła, żądania wycieraczek/spryskiwaczy przednich i tylnych, wysyłane przez moduł dźwigienki.'
  ru: 'Команды подрулевого переключателя: указатели поворота, свет, запросы переднего/заднего стеклоочистителя и омывателя, отправляемые модулем подрулевого переключателя.'
  zh: '转向柱组合开关的指令：转向灯、大灯、前后雨刷/洗涤请求，由组合开关模块发送。'
  hu: 'A kormányoszlop-kar parancsai: index, világítás, első/hátsó ablaktörlő és mosó kérések, a kar modulja küldi.'
  pt: 'Comandos do comutador de coluna de direção: piscas, luzes, pedidos de limpa e lava-para-brisas dianteiro/traseiro, enviados pelo módulo do comutador.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['100ms', 'trigger']
senders: ['MIT']
receivers: ['BSI']

