      pl: 'Kąt kursu pojazdu względem prawej linii pasa'
      ru: 'Курсовой угол автомобиля относительно правой линии полосы'
      zh: '车辆相对右侧车道线的航向角'
      hu: 'A jármű haladási szöge a jobb oldali sávvonalhoz képest'
      pt: 'Ângulo de rumo do veículo em relação à linha de faixa direita'
    type: 'sint'
    factor: 0.015
    min: -30
