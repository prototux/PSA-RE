id: 0x09C
name: 'RIGHT_LANE_LINE_DATA'
type: 'can'
length: 8
comment:
  en: 'Right lane line detection data from the camera module (CVM): curvature, heading angle, distance to line and detection quality for lane-keeping and departure warning.'
  fr: 'Données de détection de la ligne de voie droite issues du module caméra (CVM) : courbure, angle de cap, distance à la ligne et qualité de détection pour l''aide au maintien et l''alerte de franchissement.'
  es: 'Datos de detección de la línea de carril derecha del módulo de cámara (CVM): curvatura, ángulo de rumbo, distancia a la línea y calidad de detección para el mantenimiento de carril y la alerta de salida.'
  de: 'Erkennungsdaten der rechten Fahrspurlinie vom Kameramodul (CVM): Krümmung, Kurswinkel, Abstand zur Linie und Erkennungsqualität für Spurhalteassistent und Spurverlassenswarnung.'
  it: 'Dati di rilevamento della linea di corsia destra dal modulo telecamera (CVM): curvatura, angolo di rotta, distanza dalla linea e qualità di rilevamento per il mantenimento di corsia e l''allerta di uscita.'
  pl: 'Dane wykrywania prawej linii pasa ruchu z modułu kamery (CVM): krzywizna, kąt kursu, odległość do linii i jakość wykrywania dla wspomagania utrzymania pasa i ostrzegania o zjeździe.'
  ru: 'Данные обнаружения правой линии полосы движения модулем камеры (CVM): кривизна, курсовой угол, расстояние до линии и качество обнаружения для удержания полосы и предупреждения о выезде.'
  zh: '来自摄像头模块(CVM)的右车道线检测数据:曲率、航向角、与车道线的距离及用于车道保持和偏离预警的检测质量。'
  hu: 'A jobb oldali sávvonal érzékelési adatai a kameramodultól (CVM): görbület, iránylat, vonaltávolság és érzékelési minőség a sávtartáshoz és a lesodródásjelzéshez.'
  pt: 'Dados de deteção da linha de faixa direita do módulo de câmara (CVM): curvatura, ângulo de rumo, distância à linha e qualidade de deteção para a assistência de manutenção de faixa e o alerta de saída de faixa.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['5025ms']
senders: ['CVM']
receivers: ['BSI']

signals:
  RIGHT_LINE_ESTIMATED_CURVATURE:
    bits: '1.7-2.0'
    comment:
      en: 'Estimated curvature of the right lane line'
      fr: 'Courbure estimée de la ligne droite'
      es: 'Curvatura estimada de la línea derecha'
      de: 'Geschätzte Krümmung der rechten Fahrbahnlinie'
      it: 'Curvatura stimata della linea di corsia destra'
      pl: 'Szacowana krzywizna prawej linii pasa'
      ru: 'Оценочная кривизна правой линии полосы'
      zh: '右侧车道线的估算曲率'
      hu: 'A jobb oldali sávvonal becsült görbülete'
      pt: 'Curvatura estimada da linha direita'
    type: 'sint'
    factor: 2.0e-06
    min: -0.05
    max: 0.05
    units: 'm-1'
    invalid: 0x7FFF
    default: 0x7FFE

  RIGHT_LINE_CURVATURE_DERIVATIVE:
    bits: '3.7-4.0'
    comment:
      en: 'Derivative of the road curvature, estimated from the right lane line'
      fr: 'Dérivée de la courbure de la route, estimée à partir de la ligne droite'
      es: 'Derivada de la curvatura de la carretera, estimada a partir de la línea derecha'
      de: 'Ableitung der Straßenkrümmung, geschätzt aus der rechten Fahrbahnlinie'
      it: 'Derivata della curvatura della strada, stimata dalla linea di corsia destra'
      pl: 'Pochodna krzywizny drogi, szacowana na podstawie prawej linii pasa'
      ru: 'Производная кривизны дороги, оценённая по правой линии полосы'
      zh: '根据右侧车道线估算的道路曲率导数'
      hu: 'Az útgörbület deriváltja, a jobb oldali sávvonalból becsülve'
      pt: 'Derivada da curvatura da estrada, estimada a partir da linha direita'
    type: 'sint'
    factor: 4.0e-09
    min: -0.00012
    max: 0.00012
    invalid: 0x7FFF
    default: 0x7FFE

  RIGHT_LINE_HEADING_ANGLE:
