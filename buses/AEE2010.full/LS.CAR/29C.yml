id: 0x29C
name: 'BSG_LIGHTING_DIAG'
type: 'can'
length: 2
comment:
  en: 'Lighting supply diagnostics from the BSG node: position, stop, indicator, fog and reversing light circuits.'
  fr: 'Diagnostics d''alimentation d''éclairage du module BSG : circuits feux de position, stop, clignotants, antibrouillard et marche arrière.'
  es: 'Diagnósticos de alimentación de iluminación del módulo BSG: circuitos de luces de posición, freno, intermitentes, antiniebla y marcha atrás.'
  de: 'Beleuchtungsversorgungsdiagnose des BSG-Moduls: Stromkreise für Stand-, Brems-, Blink-, Nebel- und Rückfahrlicht.'
  it: 'Diagnostica di alimentazione illuminazione del modulo BSG: circuiti luci di posizione, stop, indicatori, fendinebbia e retromarcia.'
  pl: 'Diagnostyka zasilania oświetlenia z modułu BSG: obwody świateł pozycyjnych, stop, kierunkowskazów, przeciwmgielnych i cofania.'
  ru: 'Диагностика питания освещения от модуля BSG: цепи габаритных огней, стоп-сигналов, поворотников, противотуманных фар и заднего хода.'
  zh: 'BSG模块的照明供电诊断:示宽灯、刹车灯、转向灯、雾灯和倒车灯电路。'
  hu: 'A BSG modul világítás-táplálási diagnosztikája: helyzetjelző, féklámpa, index, köd- és tolatólámpa áramkörök.'
  pt: 'Diagnóstico de alimentação da iluminação do nó BSG: circuitos das luzes de presença, travagem, piscas, nevoeiro e marcha-atrás.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['1000ms', 'trigger']
senders: ['BSG']
receivers: ['BSI']

