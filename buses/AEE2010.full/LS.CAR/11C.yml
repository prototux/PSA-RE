      de: 'Fehler im Spurverlassenswarnsystem (STL) vorhanden.'
      it: 'Guasto presente nel sistema di avviso di superamento linea (STL).'
      pl: 'Obecna usterka systemu ostrzegania o zjeździe z pasa (STL).'
      ru: 'Наличие неисправности в системе предупреждения о пересечении полосы (STL).'
      zh: '车道偏离预警系统(STL)存在故障。'
      hu: 'Hiba van jelen a sávelhagyás-jelző rendszerben (STL).'
      pt: 'Falha presente no sistema de aviso de mudança de faixa involuntária (STL)'
