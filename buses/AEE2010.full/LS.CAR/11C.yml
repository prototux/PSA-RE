id: 0x11C
name: 'COLUMN_MODULE_DIAG_INFO_CVM'
type: 'can'
length: 5
comment:
  en: 'Faults and requests relayed by the camera module (CVM) between column-mounted modules: wiper state, distance travelled, headlamp and degraded-mode requests.'
  fr: 'Défauts et demandes relayés par le module caméra (CVM) entre les modules de colonne : état essuyage, distance parcourue, demandes feux et mode dégradé.'
  es: 'Fallos y solicitudes retransmitidos por el módulo de cámara (CVM) entre los módulos de columna: estado de limpiaparabrisas, distancia recorrida, solicitudes de luces y modo degradado.'
  de: 'Vom Kameramodul (CVM) zwischen den Lenksäulenmodulen weitergeleitete Fehler und Anforderungen: Wischerstatus, zurückgelegte Strecke, Scheinwerfer- und Notlaufanforderungen.'
  it: 'Guasti e richieste inoltrati dal modulo telecamera (CVM) tra i moduli del piantone: stato tergicristallo, distanza percorsa, richieste luci e modalità degradata.'
  pl: 'Usterki i żądania przekazywane przez moduł kamery (CVM) między modułami kolumny kierownicy: stan wycieraczek, przebyty dystans, żądania świateł i trybu awaryjnego.'
  ru: 'Неисправности и запросы, ретранслируемые модулем камеры (CVM) между модулями рулевой колонки: состояние стеклоочистителя, пройденное расстояние, запросы света и аварийного режима.'
  zh: '由摄像头模块(CVM)在转向柱模块之间转发的故障与请求:雨刮状态、行驶距离、大灯及降级模式请求。'
  hu: 'A kameramodul (CVM) által a kormányoszlop-modulok között továbbított hibák és kérések: ablaktörlő állapota, megtett távolság, fényszóró- és korlátozott üzemmód kérések.'
  pt: 'Avarias e pedidos retransmitidos pelo módulo de câmara (CVM) entre os módulos da coluna de direção: estado dos limpa-para-brisas, distância percorrida, pedidos de faróis e modo degradado.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['200ms', 'trigger']
senders: ['CVM']
receivers: ['BSI', 'BSTL']

signals:
  STL_FAULT_PRESENT:
    bits: '1.7'
    comment:
      en: 'Fault present in the lane departure warning system (STL).'
      fr: 'Défaut présent sur le système d''avertissement de franchissement de ligne (STL).'
