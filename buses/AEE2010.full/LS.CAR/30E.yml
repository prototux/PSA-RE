id: 0x30E
name: 'KEY_PAIRING_DATA_READER'
type: 'can'
length: 7
comment:
  en: 'Key pairing data for the electronic card reader (LCE): encrypted codes and badge number.'
  fr: 'Données d''appairage de clé pour le lecteur de carte électronique (LCE) : codes chiffrés et numéro de badge.'
  es: 'Datos de emparejamiento de llave para el lector de tarjeta electrónica (LCE): códigos cifrados y número de tarjeta.'
  de: 'Schlüsselkopplungsdaten für den elektronischen Kartenleser (LCE): verschlüsselte Codes und Badge-Nummer.'
  it: 'Dati di accoppiamento chiave per il lettore di scheda elettronica (LCE): codici cifrati e numero badge.'
  pl: 'Dane parowania kluczyka dla czytnika karty elektronicznej (LCE): zaszyfrowane kody i numer karty.'
  ru: 'Данные сопряжения ключа для считывателя электронной карты (LCE): зашифрованные коды и номер метки.'
  zh: '电子卡读卡器(LCE)的钥匙配对数据:加密代码及卡片编号。'
  hu: 'Az elektronikus kártyaolvasó (LCE) kulcspárosítási adatai: titkosított kódok és kártyaszám.'
  pt: 'Dados de emparelhamento de chave para o leitor de cartão eletrónico (LCE): códigos encriptados e número do cartão.'
observations:
  en: 'Depends on the associated diagnostic class'
  fr: 'Dépend de la classe de diagnostic associée'
  es: 'Depende de la clase de diagnóstico asociada'
  de: 'Abhängig von der zugehörigen Diagnoseklasse'
  it: 'Dipende dalla classe diagnostica associata'
  pl: 'Zależy od powiązanej klasy diagnostycznej'
  ru: 'Зависит от связанного диагностического класса'
  zh: '取决于相关诊断类别'
  hu: 'A kapcsolódó diagnosztikai osztálytól függ'
  pt: 'Depende da classe de diagnóstico associada'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['LCE']

signals:
  RSK_CODE_HIGH:
    bits: '1.7-2.0'
    comment:
      en: 'RSK code, high part'
      fr: 'Code RSK, partie haute'
      es: 'Código RSK, parte alta'
      de: 'RSK-Code, oberer Teil'
      it: 'Codice RSK, parte alta'
      pl: 'Kod RSK, część górna'
      ru: 'Код RSK, старшая часть'
      zh: 'RSK码,高位部分'
      hu: 'RSK-kód, felső rész'
      pt: 'Código RSK, parte alta'
    type: 'uint'
    min: 0
    max: 65535

  RSK_CODE_LOW:
    bits: '3.7-6.0'
    comment:
      en: 'RSK code, low part'
      fr: 'Code RSK, partie basse'
      es: 'Código RSK, parte baja'
      de: 'RSK-Code, unterer Teil'
      it: 'Codice RSK, parte bassa'
      pl: 'Kod RSK, część dolna'
      ru: 'Код RSK, младшая часть'
      zh: 'RSK码,低位部分'
      hu: 'RSK-kód, alsó rész'
      pt: 'Código RSK, parte baixa'
    type: 'uint'
    min: 0
    max: 4294967295

  BADGE_NUMBER_LCE:
    bits: '7.7-7.5'
    comment:
      en: 'Badge number'
      fr: 'Numéro de badge'
      es: 'Número de tarjeta'
      de: 'Badge-Nummer'
      it: 'Numero badge'
      pl: 'Numer breloka'
      ru: 'Номер метки'
      zh: '钥匙卡编号'
      hu: 'Jelvényszám'
      pt: 'Número de cartão'
    type: 'uint'
    min: 0
    max: 5

  UNUSED_1:
    bits: '7.4-7.0'
    unused: true
