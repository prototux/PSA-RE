id: 0x215
name: 'POWER_SLIDING_DOOR_LEFT_STATUS'
type: 'can'
length: 2
comment:
  en: 'Power sliding door (left) status: door command, movement request, striker state and reject request.'
  fr: 'État de la porte coulissante électrique (gauche) : commande de porte, demande de mouvement, état de la gâche et demande de rejet.'
  es: 'Estado de la puerta corredera eléctrica (izquierda): mando de puerta, solicitud de movimiento, estado del cerrojo y solicitud de rechazo.'
  de: 'Status der elektrischen Schiebetür (links): Türbefehl, Bewegungsanforderung, Schließbügelstatus und Ablehnungsanforderung.'
  it: 'Stato della porta scorrevole elettrica (sinistra): comando porta, richiesta di movimento, stato del nottolino e richiesta di rigetto.'
  pl: 'Stan elektrycznych drzwi przesuwnych (lewych): polecenie drzwi, żądanie ruchu, stan zapadki i żądanie odrzucenia.'
  ru: 'Статус электрической сдвижной двери (левой): команда двери, запрос движения, состояние защёлки и запрос отклонения.'
  zh: '电动滑门(左)状态:车门指令、移动请求、锁扣状态及拒绝请求。'
  hu: 'Az elektromos tolóajtó (bal) állapota: ajtóparancs, mozgáskérés, zárnyelv állapota és elutasítási kérés.'
  pt: 'Estado da porta corrediça elétrica (esquerda): comando da porta, pedido de movimento, estado do trinco e pedido de rejeição.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['200ms', 'trigger']
senders: ['MDPLC']
receivers: ['BSI']

signals:
  LEFT_SLIDING_DOOR_COMMAND:
    bits: '1.7-1.6'
    comment:
      en: 'Left sliding side door command'
      fr: 'Commande porte latérale gauche'
      es: 'Orden de la puerta corredera izquierda'
      de: 'Befehl linke Schiebetür'
      it: 'Comando porta scorrevole sinistra'
      pl: 'Polecenie lewych drzwi przesuwnych'
      ru: 'Команда левой сдвижной двери'
      zh: '左侧滑门指令'
      hu: 'Bal tolóajtó parancs'
      pt: 'Comando da porta lateral corrediça esquerda'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'Off'
        fr: 'Pas de commande'
        es: 'Sin orden'
        de: 'Kein Befehl'
        it: 'Nessun comando'
        pl: 'Brak polecenia'
        ru: 'Нет команды'
        zh: '无指令'
        hu: 'Nincs parancs'
        pt: 'Sem comando'
      0x01:
        en: 'Opening'
        fr: 'Ouverture'
        es: 'Apertura'
        de: 'Öffnung'
        it: 'Apertura'
        pl: 'Otwieranie'
        ru: 'Открытие'
        zh: '开启'
        hu: 'Nyitás'
        pt: 'Abertura'
      0x02:
