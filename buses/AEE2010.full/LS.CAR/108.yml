      de: 'Taster der Heckklappen-Fernbedienung gedrückt'
      it: 'Pulsante del telecomando del portellone premuto'
      pl: 'Naciśnięcie przycisku pilota klapy tylnej'
      ru: 'Нажата кнопка пульта дистанционного управления дверью багажника'
      zh: '尾门遥控按钮已按下'
      hu: 'A csomagtérajtó távirányítójának gombja megnyomva'
      pt: 'Botão do comando à distância da porta da mala premido'
    type: 'bool'
    default: 0x00
    values:
