id: 0x047
name: 'REAR_BODY_MODULE_COMMAND'
type: 'can'
length: 6
comment:
  en: 'Commands sent by the BSI to the rear body module: neck heater and seat heater authorisations, rear indicator commands, boot area lighting.'
  fr: 'Commandes envoyées par la BSI au module de servitude arrière : autorisations de chauffage de nuque et de siège, commandes de clignotants arrière, éclairage du coffre.'
  es: 'Órdenes enviadas por la BSI al módulo de servidumbre trasero: autorizaciones de calefacción de nuca y de asiento, órdenes de intermitentes traseros, iluminación del maletero.'
  de: 'Von der BSI an das hintere Bordnetzmodul gesendete Befehle: Nacken- und Sitzheizungsfreigaben, Befehle für hintere Blinker, Kofferraumbeleuchtung.'
  it: 'Comandi inviati dalla BSI al modulo servizi posteriore: autorizzazioni riscaldamento nuca e sedile, comandi indicatori posteriori, illuminazione bagagliaio.'
  pl: 'Polecenia wysyłane przez BSI do tylnego modułu obsługowego: zezwolenia na ogrzewanie karku i fotela, polecenia tylnych kierunkowskazów, oświetlenie bagażnika.'
  ru: 'Команды, отправляемые BSI в задний сервисный модуль кузова: разрешения обогрева шеи и сиденья, команды задних указателей поворота, освещение багажника.'
  zh: '由BSI发送给后车身服务模块的指令：颈部加热和座椅加热授权、后转向灯命令、后备箱照明。'
  hu: 'A BSI parancsai a hátsó karosszériaellátó modul felé: nyakfűtés és ülésfűtés engedélyek, hátsó index parancsok, csomagtérvilágítás.'
  pt: 'Comandos enviados pela BSI ao módulo de servidão traseiro: autorizações de aquecimento de nuca e de banco, comandos dos piscas traseiros, iluminação da bagageira.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['BSG']

