id: 0x1CB
name: 'WIPER_SENSOR_STATUS_2'
type: 'can'
length: 2
comment:
  en: 'Wiper stalk sensor status: fault, switch position and angular position, gatewayed from the LIN bus.'
  fr: 'État du capteur de la commande d''essuie-glace : défaut, position du contacteur et position angulaire, relayé depuis le bus LIN.'
  es: 'Estado del sensor de la palanca del limpiaparabrisas: fallo, posición del interruptor y posición angular, retransmitido desde el bus LIN.'
  de: 'Status des Wischerhebelsensors: Fehler, Schalterstellung und Winkelposition, vom LIN-Bus weitergeleitet.'
  it: 'Stato del sensore della leva tergicristallo: guasto, posizione dell''interruttore e posizione angolare, inoltrato dal bus LIN.'
  pl: 'Stan czujnika dźwigni wycieraczek: usterka, pozycja przełącznika i pozycja kątowa, przekazywane z magistrali LIN.'
  ru: 'Статус датчика подрулевого переключателя дворников: неисправность, положение переключателя и угловое положение, ретранслируется с шины LIN.'
  zh: '雨刷拨杆传感器状态:故障、开关位置和角度位置,由LIN总线网关转发。'
  hu: 'Az ablaktörlő kar érzékelőjének állapota: hiba, kapcsolóállás és szöghelyzet, a LIN buszról átjárón keresztül.'
  pt: 'Estado do sensor do comutador do limpa-para-brisas: avaria, posição do comutador e posição angular, encaminhado a partir do barramento LIN.'
observations:
  en: 'Depends on the associated diagnostic class'
  fr: 'Dépend de la classe de diagnostic associée'
  es: 'Depende de la clase de diagnóstico asociada'
  de: 'Abhängig von der zugehörigen Diagnoseklasse'
  it: 'Dipende dalla classe diagnostica associata'
  pl: 'Zależy od powiązanej klasy diagnostycznej'
  ru: 'Зависит от связанного диагностического класса'
  zh: '取决于相关诊断类别'
  hu: 'A kapcsolódó diagnosztikai osztálytól függ'
  pt: 'Depende da classe de diagnóstico associada'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['CVM']

