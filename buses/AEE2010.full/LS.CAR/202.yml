id: 0x202
name: 'TRANSPONDER_AES_KEY_PROGRAMMING'
type: 'can-tp'
length_min: 2
comment:
  en: 'AES key programming data for the transponder (part 1): key reference and packet counter.'
  fr: 'Données de programmation de clé AES du transpondeur (partie 1) : référence de clé et compteur de paquet.'
  es: 'Datos de programación de clave AES del transpondedor (parte 1): referencia de clave y contador de paquete.'
  de: 'AES-Schlüssel-Programmierdaten des Transponders (Teil 1): Schlüsselreferenz und Paketzähler.'
  it: 'Dati di programmazione della chiave AES del transponder (parte 1): riferimento chiave e contatore pacchetti.'
  pl: 'Dane programowania klucza AES transpondera (część 1): numer klucza i licznik pakietów.'
  ru: 'Данные программирования AES-ключа транспондера (часть 1): номер ключа и счётчик пакетов.'
  zh: '应答器的AES密钥编程数据(第1部分):密钥编号及数据包计数。'
  hu: 'A transzponder AES-kulcs programozási adatai (1. rész): kulcs azonosító és csomagszámláló.'
  pt: 'Dados de programação da chave AES do transponder (parte 1): referência da chave e contador de pacotes.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['HDC', 'LCE']
isotp:
  addressing: 'normal'

signals:
  LEARNING_PACKAGE_COUNTER:
    bits: '1.7-1.4'
    comment:
      en: 'Counter marking the set of learning frames belonging to the same code'
      fr: 'Compteur marquant l''ensemble des trames d''apprentissage appartenant à un même code'
      es: 'Contador que marca el conjunto de tramas de aprendizaje pertenecientes al mismo código'
      de: 'Zähler zur Kennzeichnung der zu einem gemeinsamen Code gehörenden Lernrahmen'
      it: 'Contatore che contrassegna l''insieme dei frame di apprendimento appartenenti allo stesso codice'
      pl: 'Licznik oznaczający zestaw ramek uczenia należących do tego samego kodu'
      ru: 'Счётчик, отмечающий набор кадров обучения, относящихся к одному коду'
      zh: '标记属于同一代码的一组学习帧的计数器'
      hu: 'Az azonos kódhoz tartozó betanító keretek csoportját jelölő számláló'
      pt: 'Contador que marca o conjunto de tramas de aprendizagem pertencentes ao mesmo código'
    type: 'uint'
    min: 0
    max: 15

  ISK_PART_NUMBER:
    bits: '1.3-1.0'
    comment:
      en: 'Sub-addressing code defining the meaning of the PROG_ISK_STREAM stream contents'
      fr: 'Code de sous-adressage définissant la signification du contenu du flux PROG_ISK_STREAM'
      es: 'Código de subdireccionamiento que define el significado del contenido del flujo PROG_ISK_STREAM'
      de: 'Subadressierungscode, der die Bedeutung des Inhalts des PROG_ISK_STREAM-Datenstroms festlegt'
      it: 'Codice di indirizzamento secondario che definisce il significato del contenuto del flusso PROG_ISK_STREAM'
      pl: 'Kod podadresowania określający znaczenie zawartości strumienia PROG_ISK_STREAM'
      ru: 'Код субадресации, определяющий значение содержимого потока PROG_ISK_STREAM'
      zh: '定义PROG_ISK流内容含义的子地址代码'
      hu: 'Almcímzési kód, amely meghatározza a PROG_ISK_STREAM adatfolyam tartalmának jelentését'
      pt: 'Código de subendereçamento que define o significado do conteúdo do fluxo PROG_ISK_STREAM'
    type: 'uint'

  PROG_ISK_STREAM:
    bits: '2.7-8.0'
    comment:
      en: 'Stream carrying the parts of the ISK code, according to the ISK_PART_NUMBER value'
      fr: 'Flux transportant les différentes parties du code ISK, selon la valeur de ISK_PART_NUMBER'
      es: 'Flujo que transporta las distintas partes del código ISK, según el valor de ISK_PART_NUMBER'
      de: 'Datenstrom mit den Teilen des ISK-Codes, gemäß dem Wert von ISK_PART_NUMBER'
      it: 'Flusso che trasporta le diverse parti del codice ISK, in base al valore di ISK_PART_NUMBER'
      pl: 'Strumień przenoszący poszczególne części kodu ISK, zgodnie z wartością ISK_PART_NUMBER'
      ru: 'Поток, содержащий части кода ISK, в зависимости от значения ISK_PART_NUMBER'
      zh: '根据ISK_PART_NUMBER的值携带ISK代码各部分的数据流'
      hu: 'Az ISK-kód részeit hordozó adatfolyam, az ISK_PART_NUMBER értéke szerint'
      pt: 'Fluxo que transporta as diferentes partes do código ISK, de acordo com o valor de ISK_PART_NUMBER'
    type: 'str'
