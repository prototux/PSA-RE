id: 0x1D5
name: 'POWER_SLIDING_DOOR_RIGHT_STATUS'
type: 'can'
length: 2
comment:
  en: 'Power sliding door (right) status: door command, movement request, striker state and reject request.'
  fr: 'État de la porte coulissante électrique (droite) : commande de porte, demande de mouvement, état de la gâche et demande de rejet.'
  es: 'Estado de la puerta corredera eléctrica (derecha): mando de puerta, solicitud de movimiento, estado del cerrojo y solicitud de rechazo.'
  de: 'Status der elektrischen Schiebetür (rechts): Türbefehl, Bewegungsanforderung, Schließbügelstatus und Ablehnungsanforderung.'
  it: 'Stato della porta scorrevole elettrica (destra): comando porta, richiesta di movimento, stato del nottolino e richiesta di rigetto.'
  pl: 'Stan elektrycznych drzwi przesuwnych (prawych): polecenie drzwi, żądanie ruchu, stan zapadki i żądanie odrzucenia.'
  ru: 'Статус электрической сдвижной двери (правой): команда двери, запрос движения, состояние защёлки и запрос отклонения.'
  zh: '电动滑门(右)状态:车门指令、移动请求、锁扣状态及拒绝请求。'
  hu: 'Az elektromos tolóajtó (jobb) állapota: ajtóparancs, mozgáskérés, zárnyelv állapota és elutasítási kérés.'
  pt: 'Estado da porta corrediça elétrica (direita): comando da porta, pedido de movimento, estado do trinco e pedido de rejeição.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['200ms', 'trigger']
senders: ['MDPLC']
receivers: ['BSI']

