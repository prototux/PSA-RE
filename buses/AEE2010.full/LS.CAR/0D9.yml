id: 0x0D9
name: 'BSM_LIGHTING_DIAG'
type: 'can'
length: 5
comment:
  en: 'Diagnostics from the BSM node: front fog lights, ignition-on and starter commands, AC compressor, low-beam, daytime-running and high-beam lights, left and right.'
  fr: 'Diagnostics du module BSM : antibrouillards avant, commandes contact et démarreur, compresseur clim, feux de croisement, feux de jour et feux de route, gauche et droite.'
  es: 'Diagnósticos del módulo BSM: antinieblas delanteros, comandos de contacto y arranque, compresor de A/C, luces de cruce, luces diurnas y luces de carretera, izquierda y derecha.'
  de: 'Diagnose des BSM-Moduls: Nebelscheinwerfer vorne, Zündungs-Ein- und Anlasserbefehle, Klimakompressor, Abblendlicht, Tagfahrlicht und Fernlicht, links und rechts.'
  it: 'Diagnostica del modulo BSM: fendinebbia anteriori, comandi accensione e motorino di avviamento, compressore A/C, anabbaglianti, luci diurne e abbaglianti, sinistra e destra.'
  pl: 'Diagnostyka modułu BSM: przednie światła przeciwmgielne, polecenia zapłonu i rozrusznika, sprężarka klimatyzacji, światła mijania, światła dzienne i drogowe, lewe i prawe.'
  ru: 'Диагностика модуля BSM: передние противотуманные фары, команды зажигания и стартера, компрессор кондиционера, ближний свет, дневные ходовые огни и дальний свет, слева и справа.'
  zh: 'BSM模块诊断:前雾灯、点火和启动机命令、空调压缩机、近光灯、日间行车灯和远光灯,左右两侧。'
  hu: 'A BSM modul diagnosztikája: első ködfényszórók, gyújtás-be és indítómotor parancsok, klímakompresszor, tompított fény, nappali menetfény és távolsági fény, bal és jobb oldalon.'
  pt: 'Diagnóstico do nó BSM: nevoeiro dianteiro, comandos de ignição ligada e motor de arranque, compressor de ar condicionado, médios, luzes diurnas e máximos, esquerda e direita.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['1000ms', 'trigger']
senders: ['BSM']
receivers: ['BSI']

