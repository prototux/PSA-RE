id: 0x214
name: 'TRACTION_BATTERY_DYNAMIC_DATA'
type: 'can'
length: 2
comment:
  en: 'Steering column switch module status (part 2): front/rear wiper stalk positions, light-sensor input, single-notch push detection and automatic wiper request.'
  fr: 'État du module de commandes au volant (partie 2) : positions des manettes d''essuie-glace avant/arrière, entrée capteur de luminosité, détection de poussée d''un cran et demande d''essuyage automatique.'
  es: 'Estado del módulo de mandos de columna de dirección (parte 2): posiciones de las palancas de limpiaparabrisas delantero/trasero, entrada del sensor de luz, detección de pulsación de un paso y solicitud de limpiaparabrisas automático.'
  de: 'Status des Lenksäulenschaltermoduls (Teil 2): Positionen der Wischerhebel vorne/hinten, Lichtsensoreingang, Erkennung einer Rastenbetätigung und Anforderung des automatischen Wischers.'
  it: 'Stato del modulo comandi al piantone (parte 2): posizioni delle leve tergicristallo anteriore/posteriore, ingresso sensore di luce, rilevamento pressione di uno scatto e richiesta tergicristallo automatico.'
  pl: 'Stan modułu przełączników kolumny kierowniczej (część 2): pozycje dźwigni wycieraczek przód/tył, wejście czujnika światła, wykrywanie wciśnięcia o jeden krok i żądanie automatycznych wycieraczek.'
  ru: 'Статус модуля переключателей рулевой колонки (часть 2): положения рычагов дворников спереди/сзади, вход датчика света, обнаружение нажатия на одну позицию и запрос автоматических дворников.'
  zh: '转向柱开关模块状态(第2部分):前/后雨刷拨杆位置、光线传感器输入、单档按压检测及自动雨刷请求。'
  hu: 'A kormányoszlop-kapcsoló modul állapota (2. rész): első/hátsó ablaktörlő kar helyzete, fényérzékelő bemenet, egylépéses nyomás érzékelése és automatikus ablaktörlés kérése.'
  pt: 'Estado do módulo de comutadores da coluna de direção (parte 2): posições dos comutadores do limpa-para-brisas dianteiro/traseiro, entrada do sensor de luz, deteção de pressão de um só clique e pedido de limpeza automática.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['100ms', 'trigger']
senders: ['HDC']
receivers: ['BSI']

