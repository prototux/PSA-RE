id: 0x007
name: 'AIR_INTAKE_MOTOR_COMMAND'
type: 'can'
length: 6
comment:
  en: 'Rapid commands sent by the BSI to the engine bay relay box: water heater command, AC compressor, load shedding, engine mount, PWM fan commands and alternator excitation.'
  fr: 'Commandes rapides envoyées par la BSI au boîtier relais moteur : commande réchauffeur d''eau, compresseur de climatisation, délestage, support moteur, commandes ventilateur PWM et excitation alternateur.'
  es: 'Órdenes rápidas enviadas por la BSI a la caja de relés del motor: orden de calentador de agua, compresor de climatización, deslastre, soporte motor, órdenes de ventilador PWM y excitación del alternador.'
  de: 'Schnelle Befehle, die von der BSI an das Motorraum-Relaismodul gesendet werden: Wasserheizungsbefehl, Klimakompressor, Lastabwurf, Motorlager, PWM-Lüfterbefehle und Lichtmaschinenerregung.'
  it: 'Comandi rapidi inviati dalla BSI alla centralina relè vano motore: comando riscaldatore acqua, compressore climatizzatore, distacco carico, supporto motore, comandi ventola PWM ed eccitazione alternatore.'
  pl: 'Szybkie polecenia wysyłane przez BSI do skrzynki przekaźników w komorze silnika: polecenie podgrzewacza wody, sprężarka klimatyzacji, zrzut obciążenia, mocowanie silnika, polecenia wentylatora PWM i wzbudzenie alternatora.'
  ru: 'Быстрые команды, отправляемые BSI в блок реле моторного отсека: команда подогревателя воды, компрессор кондиционера, сброс нагрузки, опора двигателя, ШИМ-команды вентилятора и возбуждение генератора.'
  zh: '由BSI发送给发动机舱继电器盒的快速命令：水加热器命令、空调压缩机、负载脱扣、发动机支架、PWM风扇命令及交流发电机励磁。'
  hu: 'A BSI által a motortéri relédoboznak küldött gyors parancsok: vízmelegítő parancs, klímakompresszor, tehermentesítés, motortartó, PWM ventilátorparancsok és generátorgerjesztés.'
  pt: 'Comandos rápidos enviados pela BSI à caixa de relés do compartimento do motor: comando do aquecedor de água, compressor de ar condicionado, corte de carga, suporte do motor, comandos PWM da ventoinha e excitação do alternador.'
periodicity: ['10050ms']
senders: ['BSI']
receivers: ['BSM', 'BSG', 'CVM', 'CAFR']

