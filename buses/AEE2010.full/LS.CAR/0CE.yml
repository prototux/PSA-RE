  BML_START_MARKER:
    bits: '1.7-1.0'
    comment:
      en: 'BML start marker'
      fr: 'Marqueur de début BML'
      es: 'Marcador de inicio BML'
      de: 'BML-Startmarker'
      it: 'Marcatore di inizio BML'
      pl: 'Znacznik początku BML'
      ru: 'Маркер начала BML'
      zh: 'BML起始标记'
      hu: 'BML kezdőjelző'
      pt: 'Marcador de início BML'
    type: 'uint'
    min: 0
    max: 255

  IN_CODE:
    bits: '2.7-4.0'
    comment:
      en: 'IN code'
      fr: 'Code IN'
      es: 'Código IN'
      de: 'IN-Code'
      it: 'Codice IN'
      pl: 'Kod IN'
      ru: 'Код IN'
      zh: 'IN码'
      hu: 'IN kód'
      pt: 'Código IN'
