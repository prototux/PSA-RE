id: 0x0CE
name: 'KEY_PAIRING_DATA'
type: 'can'
length: 8
comment:
  en: 'Key pairing data (part 1) from the body computer: steering-lock code and start of the pairing sequence marker.'
  fr: 'Données d''appairage de clé (partie 1) issues du BSI : code de verrouillage de colonne et marqueur de début de séquence.'
  es: 'Datos de emparejamiento de llave (parte 1) de la BSI: código de bloqueo de columna y marcador de inicio de secuencia.'
  de: 'Schlüsselkopplungsdaten (Teil 1) vom BSI: Lenksäulenverriegelungscode und Startmarker der Kopplungssequenz.'
  it: 'Dati di accoppiamento chiave (parte 1) dal BSI: codice di bloccaggio piantone e marcatore di inizio sequenza.'
  pl: 'Dane parowania kluczyka (część 1) z BSI: kod blokady kolumny kierownicy i znacznik początku sekwencji.'
  ru: 'Данные сопряжения ключа (часть 1) от BSI: код блокировки рулевой колонки и маркер начала последовательности сопряжения.'
  zh: '来自车身控制器的钥匙配对数据(第1部分):转向柱锁止代码及配对序列开始标记。'
  hu: 'Kulcspárosítási adatok (1. rész) a BSI-től: kormányoszlop-zár kód és a párosítási sorozat kezdőjelzője.'
  pt: 'Dados de emparelhamento de chave (parte 1) da BSI: código de bloqueio da coluna de direção e marcador de início da sequência de emparelhamento.'
observations:
  en: 'Depends on the associated diagnostic class'
  fr: 'Dépend de la classe de diagnostic associée'
  es: 'Depende de la clase de diagnóstico asociada'
  de: 'Abhängig von der zugehörigen Diagnoseklasse'
  it: 'Dipende dalla classe diagnostica associata'
  pl: 'Zależy od powiązanej klasy diagnostycznej'
  ru: 'Зависит от связанного диагностического класса'
  zh: '取决于相关诊断类别'
  hu: 'A kapcsolódó diagnosztikai osztálytól függ'
  pt: 'Depende da classe de diagnóstico associada'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['BML']

