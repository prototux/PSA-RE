id: 0x111
name: 'SUSPENSION_VERSION'
type: 'can'
length: 3
comment:
  en: 'Driver monitoring camera status: camera failure, driver detection change, eye-closure and field-of-view status, estimated distraction and drowsiness levels.'
  fr: 'État de la caméra de surveillance du conducteur : défaillance caméra, changement de détection du conducteur, état de fermeture des yeux et de champ de vision, niveaux estimés de distraction et de somnolence.'
  es: 'Estado de la cámara de supervisión del conductor: fallo de la cámara, cambio de detección del conductor, estado de cierre de ojos y de campo de visión, niveles estimados de distracción y somnolencia.'
  de: 'Status der Fahrerüberwachungskamera: Kameraausfall, Änderung der Fahrererkennung, Status Augenschluss und Sichtfeld, geschätzte Ablenkungs- und Müdigkeitswerte.'
  it: 'Stato della telecamera di monitoraggio del conducente: guasto della telecamera, cambio di rilevamento del conducente, stato di chiusura degli occhi e campo visivo, livelli stimati di distrazione e sonnolenza.'
  pl: 'Stan kamery monitorującej kierowcę: awaria kamery, zmiana wykrycia kierowcy, stan zamknięcia oczu i pola widzenia, szacowane poziomy rozproszenia uwagi i senności.'
  ru: 'Статус камеры мониторинга водителя: сбой камеры, изменение обнаружения водителя, состояние закрытия глаз и поля зрения, расчётные уровни отвлечения и сонливости.'
  zh: '驾驶员监测摄像头状态:摄像头故障、驾驶员检测变化、闭眼和视野状态、估计的分心和困倦程度。'
  hu: 'A vezetőfigyelő kamera állapota: kamerahiba, a vezetőfelismerés változása, szemcsukódási és látótér-állapot, becsült figyelemelterelési és álmossági szint.'
  pt: 'Estado da câmara de monitorização do condutor: falha da câmara, mudança de deteção do condutor, estado de fecho dos olhos e de campo de visão, níveis estimados de distração e sonolência.'
periodicity: ['1000ms']
senders: ['IVC_D']
receivers: ['BSI']

