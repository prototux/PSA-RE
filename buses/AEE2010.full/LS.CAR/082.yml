id: 0x082
name: 'TRANSPONDER_AUTH_COMMAND_AES_RANDOM'
type: 'can'
length: 8
comment:
  en: 'AES authentication random number sent by the BSI to the key transponder.'
  fr: 'Nombre aléatoire d''authentification AES envoyé par la BSI au transpondeur de clé.'
  es: 'Número aleatorio de autenticación AES enviado por la BSI al transpondedor de la llave.'
  de: 'AES-Authentifizierungszufallszahl, von der BSI an den Schlüsseltransponder gesendet.'
  it: 'Numero casuale di autenticazione AES inviato dalla BSI al transponder della chiave.'
  pl: 'Losowa liczba uwierzytelnienia AES wysyłana przez BSI do transpondera kluczyka.'
  ru: 'Случайное число аутентификации AES, отправляемое BSI в транспондер ключа.'
  zh: '由BSI发送给钥匙应答器的AES认证随机数。'
  hu: 'AES hitelesítési véletlen szám, amelyet a BSI küld a kulcstranszpondernek.'
  pt: 'Número aleatório de autenticação AES, enviado pela BSI ao transponder da chave.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['HDC', 'LCE']

signals:
  AES_AUTH_RANDOM_NUMBER:
    bits: '1.7-8.0'
    comment:
      en: '64-bit random number for key/badge authentication using the AES algorithm (immobilizer function)'
      fr: 'Nombre aléatoire sur 64 bits pour l''authentification de la clé/badge selon l''algorithme AES (fonction antidémarrage)'
      es: 'Número aleatorio de 64 bits para la autenticación de llave/tarjeta con el algoritmo AES (función antiarranque)'
      de: '64-Bit-Zufallszahl für die Schlüssel-/Badge-Authentifizierung nach dem AES-Algorithmus (Wegfahrsperrenfunktion)'
      it: 'Numero casuale a 64 bit per l''autenticazione di chiave/badge con l''algoritmo AES (funzione immobilizer)'
      pl: '64-bitowa liczba losowa do uwierzytelniania klucza/karty za pomocą algorytmu AES (funkcja immobilizera)'
      ru: '64-битное случайное число для аутентификации ключа/метки по алгоритму AES (функция иммобилайзера)'
      zh: '使用AES算法进行钥匙/卡片认证的64位随机数(防盗锁止功能)'
      hu: '64 bites véletlen szám a kulcs/kártya AES algoritmussal történő hitelesítéséhez (indításgátló funkció)'
      pt: 'Número aleatório de 64 bits para a autenticação da chave/cartão com o algoritmo AES (função antiarranque)'
    type: 'uint'
