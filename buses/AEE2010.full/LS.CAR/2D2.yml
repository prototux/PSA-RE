id: 0x2D2
name: 'BOP_STATUS'
type: 'can'
length: 1
comment:
  en: 'Rear seatbelt buckle state (second row) and interior light 3 activation request, reported on the body network.'
  fr: 'État de bouclage des ceintures arrière (deuxième rang) et demande d''allumage du plafonnier 3, remontés sur le réseau carrosserie.'
  es: 'Estado de cierre de los cinturones traseros (segunda fila) y solicitud de encendido de la luz interior 3, reportados en la red de carrocería.'
  de: 'Zustand der Gurtschlösser hinten (zweite Reihe) und Aktivierungsanforderung der Innenleuchte 3, auf dem Karosserienetzwerk gemeldet.'
  it: 'Stato di chiusura delle cinture posteriori (seconda fila) e richiesta di accensione della luce interna 3, riportati sulla rete carrozzeria.'
  pl: 'Stan zapięcia tylnych pasów bezpieczeństwa (drugi rząd) i żądanie włączenia oświetlenia wnętrza 3, zgłaszane w sieci nadwozia.'
  ru: 'Состояние пряжек задних ремней безопасности (второй ряд) и запрос включения плафона освещения салона 3, передаваемые по кузовной сети.'
  zh: '后排（第二排）安全带锁扣状态及车内照明3的开启请求，通过车身网络上报。'
  hu: 'A hátsó (második sor) biztonsági öv csatjának állapota és a 3. beltéri lámpa bekapcsolási kérése, a karosszériahálózaton jelentve.'
  pt: 'Estado do fecho do cinto de segurança traseiro (segunda fila) e pedido de ativação da luz interior 3, reportados na rede de servidão.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['200ms', 'trigger']
senders: ['BSG']
receivers: ['BSI']

signals:
  UNUSED_1:
    bits: '1.7-1.5'
    unused: true

