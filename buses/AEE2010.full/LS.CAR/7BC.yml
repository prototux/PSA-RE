id: 0x7BC
name: 'DRIVER_EYE_STATE'
type: 'can'
length: 8
comment:
  en: 'Driver left eye opening measurement and position data from the driver-monitoring camera (IVC_D), with quality indicator.'
  fr: 'Données de mesure d''ouverture et de position de l''œil gauche du conducteur issues de la caméra de surveillance conducteur (IVC_D), avec indicateur de qualité.'
  es: 'Datos de medición de apertura y posición del ojo izquierdo del conductor de la cámara de monitorización del conductor (IVC_D), con indicador de calidad.'
  de: 'Messdaten zur Öffnung und Position des linken Auges des Fahrers von der Fahrerüberwachungskamera (IVC_D), mit Qualitätsindikator.'
  it: 'Dati di misurazione dell''apertura e della posizione dell''occhio sinistro del conducente dalla telecamera di monitoraggio del conducente (IVC_D), con indicatore di qualità.'
  pl: 'Dane pomiaru otwarcia i pozycji lewego oka kierowcy z kamery monitorowania kierowcy (IVC_D), ze wskaźnikiem jakości.'
  ru: 'Данные измерения открытия и положения левого глаза водителя от камеры контроля состояния водителя (IVC_D), с индикатором качества.'
  zh: '来自驾驶员监控摄像头(IVC_D)的驾驶员左眼开合度及位置测量数据,附带质量指示。'
  hu: 'A vezető bal szemének nyitottsági mérési és pozícióadatai a vezetőfigyelő kamerától (IVC_D), minőségjelzővel.'
  pt: 'Dados de medição de abertura e posição do olho esquerdo do condutor da câmara de monitorização do condutor (IVC_D), com indicador de qualidade.'
periodicity: ['100ms']
senders: ['IVC_D']

signals:
  DRIVER_LEFT_EYE_OPENING_QUALITY:
    bits: '1.7-1.0'
    comment:
      en: 'Confidence quality of the driver''s left eye opening measurement.'
      fr: 'Qualité de confiance de la mesure d''ouverture de l''œil gauche du conducteur.'
      es: 'Calidad de confianza de la medición de apertura del ojo izquierdo del conductor.'
      de: 'Vertrauensqualität der Öffnungsmessung des linken Auges des Fahrers.'
      it: 'Qualità di affidabilità della misurazione di apertura dell''occhio sinistro del conducente.'
      pl: 'Jakość (pewność) pomiaru otwarcia lewego oka kierowcy.'
      ru: 'Достоверность измерения открытия левого глаза водителя.'
      zh: '驾驶员左眼开合度测量的置信质量。'
      hu: 'A vezető bal szeme nyitottság-mérésének megbízhatósági minősége.'
      pt: 'Qualidade de confiança da medição de abertura do olho esquerdo do condutor.'
    type: 'uint'

  DRIVER_LEFT_EYE_POSITION_X:
    bits: '2.7-3.0'
    comment:
      en: 'X-coordinate of the driver''s left eye position.'
      fr: 'Coordonnée X de la position de l''œil gauche du conducteur.'
      es: 'Coordenada X de la posición del ojo izquierdo del conductor.'
      de: 'X-Koordinate der Position des linken Auges des Fahrers.'
      it: 'Coordinata X della posizione dell''occhio sinistro del conducente.'
      pl: 'Współrzędna X pozycji lewego oka kierowcy.'
      ru: 'Координата X положения левого глаза водителя.'
      zh: '驾驶员左眼位置X坐标。'
      hu: 'A vezető bal szemének X pozíciókoordinátája.'
      pt: 'Coordenada X da posição do olho esquerdo do condutor.'
    type: 'uint'

  DRIVER_LEFT_EYE_POSITION_Y:
    bits: '4.7-5.0'
    comment:
      en: 'Y-coordinate of the driver''s left eye position.'
      fr: 'Coordonnée Y de la position de l''œil gauche du conducteur.'
      es: 'Coordenada Y de la posición del ojo izquierdo del conductor.'
      de: 'Y-Koordinate der Position des linken Auges des Fahrers.'
      it: 'Coordinata Y della posizione dell''occhio sinistro del conducente.'
      pl: 'Współrzędna Y pozycji lewego oka kierowcy.'
      ru: 'Координата Y положения левого глаза водителя.'
      zh: '驾驶员左眼位置Y坐标。'
      hu: 'A vezető bal szemének Y pozíciókoordinátája.'
      pt: 'Coordenada Y da posição do olho esquerdo do condutor.'
    type: 'uint'

  DRIVER_LEFT_EYE_POSITION_Z:
    bits: '6.7-7.0'
    comment:
      en: 'Z-coordinate of the driver''s left eye position.'
      fr: 'Coordonnée Z de la position de l''œil gauche du conducteur.'
      es: 'Coordenada Z de la posición del ojo izquierdo del conductor.'
      de: 'Z-Koordinate der Position des linken Auges des Fahrers.'
      it: 'Coordinata Z della posizione dell''occhio sinistro del conducente.'
      pl: 'Współrzędna Z pozycji lewego oka kierowcy.'
      ru: 'Координата Z положения левого глаза водителя.'
      zh: '驾驶员左眼位置Z坐标。'
      hu: 'A vezető bal szemének Z pozíciókoordinátája.'
      pt: 'Coordenada Z da posição do olho esquerdo do condutor.'
    type: 'uint'

  DRIVER_LEFT_EYE_OPENING:
    bits: '8.7-8.0'
    comment:
      en: 'Opening measurement of the driver''s left eye.'
      fr: 'Mesure d''ouverture de l''œil gauche du conducteur.'
      es: 'Medida de apertura del ojo izquierdo del conductor.'
      de: 'Öffnungsmaß des linken Auges des Fahrers.'
      it: 'Misura di apertura dell''occhio sinistro del conducente.'
      pl: 'Pomiar otwarcia lewego oka kierowcy.'
      ru: 'Измерение открытия левого глаза водителя.'
      zh: '驾驶员左眼开合度测量值。'
      hu: 'A vezető bal szemének nyitottság-mérése.'
      pt: 'Medição de abertura do olho esquerdo do condutor.'
    type: 'uint'
