id: 0x194
name: 'RF_KEY_CODE_MESSAGE'
type: 'can'
length: 8
comment:
  en: 'Rolling-code fragments from the remote control (RF key fob), reassembled in reception order.'
  fr: 'Fragments de code tournant de la télécommande (clé mains-libres), réassemblés dans l''ordre de réception.'
  es: 'Fragmentos de código variable del mando a distancia (llave manos libres), reensamblados en el orden de recepción.'
  de: 'Rollcode-Fragmente der Fernbedienung (Funkschlüssel), in Empfangsreihenfolge zusammengesetzt.'
  it: 'Frammenti di codice variabile del telecomando (chiave mani libere), riassemblati nell''ordine di ricezione.'
  pl: 'Fragmenty kodu zmiennego pilota (klucza zbliżeniowego), składane w kolejności odbioru.'
  ru: 'Фрагменты плавающего кода пульта (ключа-брелока), собираемые в порядке приёма.'
  zh: '遥控器(免钥匙进入钥匙)滚动码分段,按接收顺序重组。'
  hu: 'A tavvezerlő (kihangosító kulcs) gördülő kódjának töredékei, vételi sorrendben összeállítva.'
  pt: 'Fragmentos de código variável do comando à distância (chave mãos-livres), remontados pela ordem de receção.'
observations:
  en: 'Reception of a remote-control RF message'
  fr: 'Réception d''un message RF de télécommande'
  es: 'Recepción de un mensaje de RF del mando a distancia'
  de: 'Empfang einer Funkfernbedienungs-Nachricht'
  it: 'Ricezione di un messaggio RF del telecomando'
  pl: 'Odebranie wiadomości RF z pilota'
  ru: 'Получение радиосообщения от пульта дистанционного управления'
  zh: '接收到遥控器射频消息时'
  hu: 'Távirányító RF üzenetének fogadásakor'
  pt: 'Receção de uma mensagem RF do comando à distância'
periodicity: ['trigger']
senders: ['HDC']
receivers: ['BSI', 'BCM']

signals:
  HF_RECEIVER_CODE_1:
    bits: '1.7-1.0'
    comment:
      en: 'HF (remote control) receiver code.'
      fr: 'Code du récepteur HF (télécommande).'
      es: 'Código del receptor HF (mando a distancia).'
      de: 'HF-Empfängercode (Fernbedienung).'
      it: 'Codice del ricevitore HF (telecomando).'
      pl: 'Kod odbiornika HF (pilota).'
      ru: 'Код HF-приёмника (пульта дистанционного управления).'
      zh: 'HF（遥控器）接收器代码。'
      hu: 'A HF (távirányító) vevő kódja.'
      pt: 'Código do recetor HF (comando à distância)'
    type: 'uint'

