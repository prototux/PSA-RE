id: 0x0D3
name: 'ALARM_ACTIVATION'
type: 'can'
length: 2
comment:
  en: 'Commands from the body computer to the ultrasonic alarm module: arm/disarm, volumetric (interior) protection exclusion, door-open audible signal, and ignition-on presence.'
  fr: 'Commandes de la BSI vers le module d''alarme ultrasons : armement/désarmement, exclusion de la protection volumétrique intérieure, signal sonore porte ouverte, et présence après contact.'
  es: 'Órdenes de la BSI al módulo de alarma por ultrasonidos: armado/desarmado, exclusión de la protección volumétrica interior, señal sonora de puerta abierta y presencia con contacto puesto.'
  de: 'Befehle der BSI an das Ultraschall-Alarmmodul: Scharf-/Unscharfschalten, Ausschluss des Innenraum-Volumenschutzes, akustisches Signal bei geöffneter Tür und Präsenz bei eingeschalteter Zündung.'
  it: 'Comandi della BSI al modulo allarme a ultrasuoni: inserimento/disinserimento, esclusione della protezione volumetrica interna, segnale acustico porta aperta e presenza con contatto inserito.'
  pl: 'Polecenia z BSI do modułu alarmu ultradźwiękowego: uzbrojenie/rozbrojenie, wyłączenie ochrony wnętrza (czujników ruchu), sygnał dźwiękowy otwartych drzwi oraz obecność przy włączonym zapłonie.'
  ru: 'Команды от BSI к ультразвуковому модулю сигнализации: постановка/снятие с охраны, отключение объёмной защиты салона, звуковой сигнал открытой двери и присутствие при включённом зажигании.'
  zh: '车身控制器发送给超声波报警模块的指令：布防/撤防、内部容积保护排除、车门打开提示音以及点火开启时的存在检测。'
  hu: 'A karosszéria-vezérlő parancsai az ultrahangos riasztómodul felé: élesítés/hatástalanítás, a belső térfogatvédelem kizárása, ajtónyitási hangjelzés és jelenlét gyújtáskapcsolt állapotban.'
  pt: 'Comandos do computador de servidão para o módulo de alarme ultrassónico: armar/desarmar, exclusão da proteção volumétrica (interior), sinal sonoro de porta aberta e presença com ignição ligada.'
observations:
  en: 'On state change of: VOLUMETRIC_EXCLUSION_REQUEST, DOOR_OPEN_BEEP_REQUEST, IGNITION_ON'
  fr: 'Sur changement d''état de : VOLUMETRIC_EXCLUSION_REQUEST, DOOR_OPEN_BEEP_REQUEST, IGNITION_ON'
  es: 'Al cambiar el estado de: VOLUMETRIC_EXCLUSION_REQUEST, DOOR_OPEN_BEEP_REQUEST, IGNITION_ON'
  de: 'Bei Statusänderung von: VOLUMETRIC_EXCLUSION_REQUEST, DOOR_OPEN_BEEP_REQUEST, IGNITION_ON'
  it: 'Al cambiamento di stato di: VOLUMETRIC_EXCLUSION_REQUEST, DOOR_OPEN_BEEP_REQUEST, IGNITION_ON'
  pl: 'Wysyłane przy zmianie stanu: VOLUMETRIC_EXCLUSION_REQUEST, DOOR_OPEN_BEEP_REQUEST, IGNITION_ON'
  ru: 'При изменении состояния: VOLUMETRIC_EXCLUSION_REQUEST, DOOR_OPEN_BEEP_REQUEST, IGNITION_ON'
  zh: '当FONC_ACT_US, VOLUMETRIC_EXCLUSION_REQUEST, DOOR_OPEN_BEEP_REQUEST, ALIM_APC_ACT_US状态变化时'
  hu: 'A(z), VOLUMETRIC_EXCLUSION_REQUEST, DOOR_OPEN_BEEP_REQUEST, IGNITION_ON állapotváltozásakor'
  pt: 'Na mudança de estado de: VOLUMETRIC_EXCLUSION_REQUEST, DOOR_OPEN_BEEP_REQUEST, IGNITION_ON'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['ALARM']

