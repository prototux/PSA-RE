id: 0x04E
name: 'AVE_AUTH_COMMAND'
type: 'can'
length: 6
comment:
  en: 'Authentication command sent by the BSI to the AVE (electric steering lock) module: command, encryption info state, encrypted code, random number and decryption status.'
  fr: 'Commande d''authentification envoyée par la BSI au module AVE (antivol électrique de direction) : commande, état des informations de chiffrement, code chiffré, nombre aléatoire et état de déchiffrement.'
  es: 'Orden de autenticación enviada por la BSI al módulo AVE (bloqueo de dirección eléctrico): orden, estado de la información de cifrado, código cifrado, número aleatorio y estado de descifrado.'
  de: 'Von der BSI an das AVE-Modul (elektrische Lenkradsperre) gesendeter Authentifizierungsbefehl: Befehl, Verschlüsselungsinfo-Status, verschlüsselter Code, Zufallszahl und Entschlüsselungsstatus.'
  it: 'Comando di autenticazione inviato dalla BSI al modulo AVE (bloccasterzo elettrico): comando, stato delle informazioni di cifratura, codice cifrato, numero casuale e stato di decifratura.'
  pl: 'Polecenie uwierzytelnienia wysyłane przez BSI do modułu AVE (elektryczna blokada kierownicy): polecenie, stan informacji szyfrowania, zaszyfrowany kod, liczba losowa i stan deszyfrowania.'
  ru: 'Команда аутентификации, отправляемая BSI в модуль AVE (электрический замок рулевой колонки): команда, состояние информации шифрования, зашифрованный код, случайное число и статус расшифровки.'
  zh: '由BSI发送给AVE（电子转向锁）模块的认证命令：命令、加密信息状态、加密代码、随机数及解密状态。'
  hu: 'A BSI hitelesítési parancsa az AVE (elektromos kormányzár) modul felé: parancs, titkosítási információ állapota, titkosított kód, véletlen szám és visszafejtési állapot.'
  pt: 'Comando de autenticação enviado pela BSI ao módulo AVE (bloqueio elétrico da direção): comando, estado da informação de encriptação, código encriptado, número aleatório e estado de desencriptação.'
observations:
  en: 'On +APC power-up and power-down'
  fr: 'Sur mise et coupure du +APC'
  es: 'Al activar y desactivar el +APC'
  de: 'Beim Ein- und Ausschalten von +APC'
  it: 'All''attivazione e disattivazione del +APC'
  pl: 'Przy włączeniu i wyłączeniu +APC'
  ru: 'При включении и выключении +APC'
  zh: '+APC上电及断电时'
  hu: 'A +APC be- és kikapcsolásakor'
  pt: 'Na ativação e desativação do +APC'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['AVE']

signals:
  AVE_RANDOM_CODE:
    bits: '1.7-2.0'
    comment:
      en: 'Random code used for the AVE authentication exchange'
      fr: 'Code aléatoire utilisé pour l''échange d''authentification AVE'
      es: 'Código aleatorio utilizado para el intercambio de autenticación AVE'
      de: 'Zufallscode für den AVE-Authentifizierungsaustausch'
      it: 'Codice casuale utilizzato per lo scambio di autenticazione AVE'
      pl: 'Kod losowy używany w wymianie uwierzytelniania AVE'
      ru: 'Случайный код, используемый при обмене аутентификацией AVE'
      zh: '用于AVE认证交换的随机码'
      hu: 'Az AVE hitelesítési cseréhez használt véletlen kód'
      pt: 'Código aleatório utilizado para a troca de autenticação AVE'
    type: 'uint'

  AVE_CIPHERED_PASSWORD:
    bits: '3.7-4.0'
    comment:
      en: 'Ciphered password used for the AVE authentication exchange'
      fr: 'Mot de passe chiffré utilisé pour l''échange d''authentification AVE'
      es: 'Contraseña cifrada utilizada para el intercambio de autenticación AVE'
      de: 'Verschlüsseltes Passwort für den AVE-Authentifizierungsaustausch'
      it: 'Password cifrata utilizzata per lo scambio di autenticazione AVE'
      pl: 'Zaszyfrowane hasło używane w wymianie uwierzytelniania AVE'
      ru: 'Зашифрованный пароль, используемый при обмене аутентификацией AVE'
      zh: '用于AVE认证交换的加密密码'
      hu: 'Az AVE hitelesítési cseréhez használt titkosított jelszó'
      pt: 'Palavra-passe cifrada utilizada na troca de autenticação AVE'
    type: 'uint'

  UNUSED_1:
    bits: '5.7-5.5'
    unused: true

  AVE_DECIPHER_STATUS:
    bits: '5.4-5.3'
    comment:
      en: 'Deciphering status of the AVE authentication exchange'
