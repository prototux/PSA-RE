      pl: 'Stan odszyfrowywania wymiany uwierzytelniania AVE'
      ru: 'Статус расшифровки обмена аутентификацией AVE'
      zh: 'AVE认证交换的解密状态'
      hu: 'Az AVE hitelesítési csere visszafejtési állapota'
      pt: 'Estado de decifragem da troca de autenticação AVE'
    type: 'enum'
    values:
      0x00:
        en: 'Status NOK'
        fr: 'Status NOK'
        es: 'Estado NOK'
        de: 'Status NOK'
        it: 'Stato NOK'
        pl: 'Stan NOK'
        ru: 'Статус NOK'
        zh: '状态NOK'
        hu: 'Állapot NOK'
        pt: 'Estado NOK'
      0x01:
        en: 'Status OK'
        fr: 'État OK'
        es: 'Estado OK'
        de: 'Status OK'
        it: 'Stato OK'
        pl: 'Stan OK'
        ru: 'Статус ОК'
        zh: '状态正常'
        hu: 'Állapot OK'
        pt: 'Estado OK'
      0x02:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
