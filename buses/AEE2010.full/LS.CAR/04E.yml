        hu: 'Nem titkosított információ'
        pt: 'Informação não cifrada'
      0x01:
        en: 'Information ciphered'
        fr: 'Information cryptée'
        es: 'Información cifrada'
        de: 'Information verschlüsselt'
        it: 'Informazione cifrata'
        pl: 'Informacja zaszyfrowana'
        ru: 'Информация зашифрована'
        zh: '信息已加密'
        hu: 'Titkosított információ'
        pt: 'Informação cifrada'

  AVE_LOCK_COMMAND:
    bits: '5.1-5.0'
    comment:
      en: 'Lock/unlock command for the electronic immobilizer (AVE) authentication'
      fr: 'Commande de verrouillage/déverrouillage pour l''authentification antivol électronique (AVE)'
      es: 'Comando de bloqueo/desbloqueo para la autenticación del antirrobo electrónico (AVE)'
      de: 'Verriegelungs-/Entriegelungsbefehl für die Authentifizierung der elektronischen Wegfahrsperre (AVE)'
      it: 'Comando di blocco/sblocco per l''autenticazione dell''antifurto elettronico (AVE)'
      pl: 'Polecenie blokady/odblokowania uwierzytelniania elektronicznej blokady rozruchu (AVE)'
      ru: 'Команда блокировки/разблокировки для аутентификации электронного иммобилайзера (AVE)'
