        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
        en: 'Locking request'
        fr: 'Demande de verrouillage'
        es: 'Solicitud de bloqueo'
        de: 'Verriegelungsanforderung'
        it: 'Richiesta di blocco'
        pl: 'Żądanie zablokowania'
        ru: 'Запрос блокировки'
        zh: '落锁请求'
        hu: 'Zárási kérés'
        pt: 'Pedido de bloqueio'
      0x02:
