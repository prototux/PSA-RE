    alternatives:
      - note:
          en: 'Also observed at bits 5.3'
          fr: 'Aussi observé aux bits 5.3'
          es: 'También observado en los bits 5.3'
          de: 'Auch an den Bits 5.3 beobachtet'
          it: 'Osservato anche ai bit 5.3'
          pl: 'Obserwowany także na bitach 5.3'
          ru: 'Также наблюдался в битах 5.3'
          zh: '也观察到位于位5.3'
          hu: 'Megfigyelve a(z) 5.3 biteken is'
          pt: 'Também observado nos bits 5.3'
        bits: '5.3'

  INFO_CIPHER_STATUS:
    bits: '5.2'
    comment:
      en: 'Status of whether the information is ciphered or not'
      fr: 'État indiquant si l''information est chiffrée ou non'
      es: 'Estado que indica si la información está cifrada o no'
      de: 'Status, ob die Information verschlüsselt ist oder nicht'
      it: 'Stato che indica se l''informazione è cifrata o meno'
