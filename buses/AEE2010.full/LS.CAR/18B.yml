id: 0x18B
name: 'DRIVING_SCHOOL_MODULE_COMMAND'
type: 'can'
length: 1
comment:
  en: 'Commands to the driving-school (dual-control) module: instructor-side lighting tell-tales and push-button indicator lamps.'
  fr: 'Commandes vers le module auto-école (double commande) : témoins d''éclairage et voyants des boutons-poussoirs côté moniteur.'
  es: 'Comandos al módulo de autoescuela (doble mando): testigos de iluminación y pilotos de los pulsadores del instructor.'
  de: 'Befehle an das Fahrschulmodul (Doppelsteuerung): Beleuchtungskontrollleuchten und Tasten-Kontrollleuchten auf der Fahrlehrerseite.'
  it: 'Comandi al modulo scuola guida (doppio comando): spie di illuminazione e spie dei pulsanti lato istruttore.'
  pl: 'Polecenia do modułu nauki jazdy (podwójne sterowanie): kontrolki oświetlenia i lampki przycisków po stronie instruktora.'
  ru: 'Команды для модуля автошколы (двойное управление): индикаторы освещения и кнопочные индикаторы со стороны инструктора.'
  zh: '发送给驾校(双控)模块的命令:教练侧照明指示灯和按钮指示灯。'
  hu: 'Az autósiskola (kettős vezérlésű) modulnak küldött parancsok: oktatói oldali világítás- és nyomógomb-jelzőfények.'
  pt: 'Comandos para o módulo de duplo comando (auto-escola): avisadores de iluminação do lado do instrutor e luzes indicadoras dos botões.'
observations:
  en: 'On state change of: LEFT_INDICATOR_BUTTON_LAMP, RIGHT_INDICATOR_BUTTON_LAMP'
  fr: 'Sur changement d''état de : LEFT_INDICATOR_BUTTON_LAMP, RIGHT_INDICATOR_BUTTON_LAMP'
  es: 'Al cambiar el estado de: LEFT_INDICATOR_BUTTON_LAMP, RIGHT_INDICATOR_BUTTON_LAMP'
  de: 'Bei Statusänderung von: LEFT_INDICATOR_BUTTON_LAMP, RIGHT_INDICATOR_BUTTON_LAMP'
  it: 'Al cambiamento di stato di: LEFT_INDICATOR_BUTTON_LAMP, RIGHT_INDICATOR_BUTTON_LAMP'
  pl: 'Wysyłane przy zmianie stanu: LEFT_INDICATOR_BUTTON_LAMP, RIGHT_INDICATOR_BUTTON_LAMP'
  ru: 'При изменении состояния: LEFT_INDICATOR_BUTTON_LAMP, RIGHT_INDICATOR_BUTTON_LAMP'
  zh: '当VOY_CLIGG_CDE_MAE, VOY_CLIGD_CDE_MAE状态变化时'
  hu: 'A(z) LEFT_INDICATOR_BUTTON_LAMP, RIGHT_INDICATOR_BUTTON_LAMP állapotváltozásakor'
  pt: 'Na mudança de estado de: LEFT_INDICATOR_BUTTON_LAMP, RIGHT_INDICATOR_BUTTON_LAMP'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['MAE']

signals:
  LEFT_INDICATOR_BUTTON_LAMP:
    bits: '1.7'
    comment:
      en: 'Left turn indicator push-button backlight'
      fr: 'Rétroéclairage de la touche clignotant gauche'
      es: 'Retroiluminación del botón de intermitente izquierdo'
      de: 'Hintergrundbeleuchtung der Taste linker Blinker'
      it: 'Retroilluminazione del pulsante indicatore di direzione sinistro'
      pl: 'Podświetlenie przycisku lewego kierunkowskazu'
      ru: 'Подсветка кнопки левого поворотника'
      zh: '左转向灯按钮背光'
      hu: 'A bal irányjelző gombjának háttérvilágítása'
      pt: 'Retroiluminação da tecla de pisca-pisca esquerdo'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Lamp off'
        fr: 'Témoin éteint'
        es: 'Testigo apagado'
        de: 'Kontrollleuchte aus'
        it: 'Spia spenta'
        pl: 'Kontrolka wyłączona'
        ru: 'Индикатор выключен'
        zh: '指示灯熄灭'
        hu: 'Jelzőlámpa kikapcsolva'
        pt: 'Luz avisadora apagada'
      0x01:
        en: 'Lamp on'
        fr: 'Témoin allumé'
        es: 'Testigo encendido'
        de: 'Lampe an'
        it: 'Spia accesa'
        pl: 'Lampka włączona'
        ru: 'Лампа горит'
        zh: '指示灯亮起'
        hu: 'Lámpa világít'
        pt: 'Luz avisadora acesa'

  RIGHT_INDICATOR_BUTTON_LAMP:
    bits: '1.6'
    comment:
      en: 'Right turn indicator push-button backlight'
      fr: 'Rétroéclairage de la touche clignotant droit'
      es: 'Retroiluminación del botón de intermitente derecho'
      de: 'Hintergrundbeleuchtung der Taste rechter Blinker'
      it: 'Retroilluminazione del pulsante indicatore di direzione destro'
      pl: 'Podświetlenie przycisku prawego kierunkowskazu'
