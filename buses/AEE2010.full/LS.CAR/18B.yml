  SIDELIGHTS:
    bits: '1.5'
    comment:
      en: 'Side marker lights telltale lit'
      fr: 'Allumage du témoin de feux de position'
      es: 'Encendido del testigo de luces de posición'
      de: 'Aufleuchten der Standlicht-Kontrollleuchte'
      it: 'Accensione della spia delle luci di posizione'
      pl: 'Zapalenie kontrolki świateł postojowych'
      ru: 'Включение индикатора габаритных огней'
      zh: '示宽灯指示灯点亮'
      hu: 'A helyzetjelző lámpák visszajelzőjének kigyulladása'
