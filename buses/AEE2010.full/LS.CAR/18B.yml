      zh: '右转向灯按钮背光'
      hu: 'A jobb irányjelző gombjának háttérvilágítása'
      pt: 'Retroiluminação da tecla de pisca-pisca direito'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Lamp off'
        fr: 'Témoin éteint'
        es: 'Testigo apagado'
        de: 'Kontrollleuchte aus'
        it: 'Spia spenta'
        pl: 'Kontrolka wyłączona'
        ru: 'Индикатор выключен'
        zh: '指示灯熄灭'
        hu: 'Jelzőlámpa kikapcsolva'
        pt: 'Luz avisadora apagada'
      0x01:
        en: 'Lamp on'
        fr: 'Témoin allumé'
        es: 'Testigo encendido'
        de: 'Lampe an'
        it: 'Spia accesa'
        pl: 'Lampka włączona'
        ru: 'Лампа горит'
        zh: '指示灯亮起'
        hu: 'Lámpa világít'
