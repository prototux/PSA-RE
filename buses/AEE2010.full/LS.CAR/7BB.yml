id: 0x7BB
name: 'DRIVER_HEAD_DIRECTION'
type: 'can'
length: 8
comment:
  en: 'Driver head direction vector data from the driver-monitoring camera (IVC_D), with quality indicator.'
  fr: 'Données de vecteur de direction de la tête du conducteur issues de la caméra de surveillance conducteur (IVC_D), avec indicateur de qualité.'
  es: 'Datos del vector de dirección de la cabeza del conductor de la cámara de monitorización del conductor (IVC_D), con indicador de calidad.'
  de: 'Kopfrichtungsvektordaten des Fahrers von der Fahrerüberwachungskamera (IVC_D), mit Qualitätsindikator.'
  it: 'Dati del vettore di direzione della testa del conducente dalla telecamera di monitoraggio del conducente (IVC_D), con indicatore di qualità.'
  pl: 'Dane wektora kierunku głowy kierowcy z kamery monitorowania kierowcy (IVC_D), ze wskaźnikiem jakości.'
  ru: 'Данные вектора направления головы водителя от камеры контроля состояния водителя (IVC_D), с индикатором качества.'
  zh: '来自驾驶员监控摄像头(IVC_D)的驾驶员头部方向向量数据,附带质量指示。'
  hu: 'A vezető fejirány-vektor adatai a vezetőfigyelő kamerától (IVC_D), minőségjelzővel.'
  pt: 'Dados do vetor de direção da cabeça do condutor da câmara de monitorização do condutor (IVC_D), com indicador de qualidade.'
periodicity: ['100ms']
senders: ['IVC_D']

signals:
  DRIVER_HEAD_DIRECTION_QUALITY:
    bits: '1.7-1.0'
    comment:
      en: 'Confidence quality of the driver''s head direction measurement.'
      fr: 'Qualité de confiance de la mesure de direction de la tête du conducteur.'
      es: 'Calidad de confianza de la medición de la dirección de la cabeza del conductor.'
      de: 'Vertrauensqualität der Kopfrichtungsmessung des Fahrers.'
      it: 'Qualità di affidabilità della misurazione della direzione della testa del conducente.'
      pl: 'Jakość (pewność) pomiaru kierunku głowy kierowcy.'
      ru: 'Достоверность измерения направления головы водителя.'
      zh: '驾驶员头部朝向测量的置信质量。'
      hu: 'A vezető fejirány-mérésének megbízhatósági minősége.'
      pt: 'Qualidade de confiança da medição da direção da cabeça do condutor.'
    type: 'uint'

  DRIVER_HEAD_DIRECTION_VECTOR_X:
    bits: '2.7-3.0'
    comment:
      en: 'X-component of the driver''s head direction vector.'
      fr: 'Composante X du vecteur de direction de la tête du conducteur.'
      es: 'Componente X del vector de dirección de la cabeza del conductor.'
      de: 'X-Komponente des Kopfrichtungsvektors des Fahrers.'
      it: 'Componente X del vettore di direzione della testa del conducente.'
      pl: 'Składowa X wektora kierunku głowy kierowcy.'
      ru: 'Компонента X вектора направления головы водителя.'
      zh: '驾驶员头部朝向向量的X分量。'
      hu: 'A vezető fejirány-vektorának X összetevője.'
      pt: 'Componente X do vetor de direção da cabeça do condutor.'
    type: 'uint'

  DRIVER_HEAD_DIRECTION_VECTOR_Y:
    bits: '4.7-5.0'
    comment:
      en: 'Y-component of the driver''s head direction vector.'
      fr: 'Composante Y du vecteur de direction de la tête du conducteur.'
      es: 'Componente Y del vector de dirección de la cabeza del conductor.'
      de: 'Y-Komponente des Kopfrichtungsvektors des Fahrers.'
      it: 'Componente Y del vettore di direzione della testa del conducente.'
      pl: 'Składowa Y wektora kierunku głowy kierowcy.'
      ru: 'Компонента Y вектора направления головы водителя.'
      zh: '驾驶员头部朝向向量的Y分量。'
      hu: 'A vezető fejirány-vektorának Y összetevője.'
      pt: 'Componente Y do vetor de direção da cabeça do condutor.'
    type: 'uint'

  DRIVER_HEAD_DIRECTION_VECTOR_Z:
    bits: '6.7-7.0'
    comment:
      en: 'Z-component of the driver''s head direction vector.'
      fr: 'Composante Z du vecteur de direction de la tête du conducteur.'
      es: 'Componente Z del vector de dirección de la cabeza del conductor.'
      de: 'Z-Komponente des Kopfrichtungsvektors des Fahrers.'
      it: 'Componente Z del vettore di direzione della testa del conducente.'
      pl: 'Składowa Z wektora kierunku głowy kierowcy.'
      ru: 'Компонента Z вектора направления головы водителя.'
      zh: '驾驶员头部朝向向量的Z分量。'
      hu: 'A vezető fejirány-vektorának Z összetevője.'
      pt: 'Componente Z do vetor de direção da cabeça do condutor.'
    type: 'uint'

  UNUSED_1:
    bits: '8.7-8.0'
    unused: true
