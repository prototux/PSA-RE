      de: 'Steuerung der Nebelscheinwerfer / Zusatzscheinwerfer'
      it: 'Comando dei fendinebbia anteriori / luci aggiuntive'
      pl: 'Sterowanie przednimi światłami przeciwmgielnymi / światłami dodatkowymi'
      ru: 'Управление передними противотуманными фарами / дополнительным светом'
      zh: '前雾灯/辅助灯控制'
      hu: 'Az első ködlámpa/kiegészítő lámpa vezérlése'
      pt: 'Comando dos faróis de nevoeiro dianteiros / luzes adicionais'
    type: 'enum'
    default: 0x00
    values:
