        pt: 'Nevoeiro esquerdo ligado'
      0x03:
        en: 'Front fog lights on'
        fr: 'Feux antibrouillard avant allumés'
        es: 'Luces antiniebla delanteras encendidas'
        de: 'Nebelscheinwerfer vorne eingeschaltet'
        it: 'Fendinebbia anteriori accesi'
        pl: 'Przednie światła przeciwmgielne włączone'
        ru: 'Передние противотуманные фары включены'
        zh: '前雾灯已开启'
