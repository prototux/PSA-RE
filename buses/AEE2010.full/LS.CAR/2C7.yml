      pl: 'Konfiguracja wyjścia ABAV (PWM lub zał./wył.)'
      ru: 'Конфигурация выхода ABAV (ШИМ или вкл/выкл)'
      zh: 'ABAV输出配置（PWM或开关型）'
      hu: 'Az ABAV kimenet konfigurációja (PWM vagy be/ki)'
      pt: 'Configuração da saída ABAV (PWM ou tudo ou nada)'
    type: 'bool'
