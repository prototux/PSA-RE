id: 0x2C7
name: 'FRONT_FOG_LIGHT_COMMAND'
type: 'can'
length: 3
comment:
  en: 'Front fog light PWM configuration and command, sent by the BSI.'
  fr: 'Configuration PWM et commande des antibrouillards avant, envoyées par la BSI.'
  es: 'Configuración PWM y orden de los antiniebla delanteros, enviadas por la BSI.'
  de: 'PWM-Konfiguration und Ansteuerung der Frontnebelscheinwerfer, von der BSI gesendet.'
  it: 'Configurazione PWM e comando dei fendinebbia anteriori, inviati dalla BSI.'
  pl: 'Konfiguracja PWM i sterowanie przednimi światłami przeciwmgielnymi, wysyłane przez BSI.'
  ru: 'Конфигурация ШИМ и команда передних противотуманных фар, отправляемые BSI.'
  zh: '由BSI发送的前雾灯PWM配置与控制命令。'
  hu: 'Az elülső ködfényszórók PWM-konfigurációja és vezérlése, a BSI küldi.'
  pt: 'Configuração e comando PWM do farol de nevoeiro dianteiro, enviados pela BSI.'
periodicity: ['10080ms']
senders: ['BSI']
receivers: ['BSE']

signals:
  FRONT_FOG_LIGHT_PWM_DUTY_CYCLE:
    bits: '1.7-1.0'
    comment:
      en: 'PWM duty cycle of the front fog light or directional fog light'
      fr: 'Rapport cyclique PWM du feu antibrouillard avant ou antibrouillard directionnel'
      es: 'Ciclo de trabajo PWM del faro antiniebla delantero o antiniebla direccional'
      de: 'PWM-Tastverhältnis des vorderen Nebelscheinwerfers oder Kurvenlichts'
      it: 'Duty cycle PWM del fendinebbia anteriore o fendinebbia direzionale'
      pl: 'Wypełnienie PWM przedniego światła przeciwmgielnego lub kierunkowego światła przeciwmgielnego'
      ru: 'Коэффициент заполнения ШИМ передней или поворотной противотуманной фары'
      zh: '前雾灯或转向雾灯的PWM占空比'
      hu: 'Az elülső köd- vagy kanyarköd-lámpa PWM kitöltési tényezője'
      pt: 'Ciclo de trabalho PWM do farol antinevoeiro dianteiro ou antinevoeiro direcional'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0xFF
    default: 0x00

  UNUSED_1:
    bits: '2.7-2.0'
    unused: true

  FRONT_FOG_LIGHT_CONTROL:
    bits: '3.7-3.6'
    comment:
