        pl: 'PWM'
        ru: 'ШИМ'
        zh: 'PWM'
        hu: 'PWM'
        pt: 'PWM'
      0x01:
        en: 'Digital (on/off)'
        fr: 'Tout ou rien (TOR)'
        es: 'Todo o nada (TOR)'
        de: 'Ein/Aus (TOR)'
