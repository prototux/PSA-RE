        fr: 'Lampes éteintes'
        es: 'Lámparas apagadas'
        de: 'Leuchten aus'
        it: 'Spie spente'
        pl: 'Lampki zgaszone'
        ru: 'Лампы выключены'
        zh: '指示灯熄灭'
        hu: 'A lámpák kikapcsolva'
        pt: 'Lâmpadas apagadas'
      0x01:
        en: 'Right fog light on'
        fr: 'Brouillard AV Droite Allume'
        es: 'Faro antiniebla delantero derecho encendido'
        de: 'Nebelscheinwerfer vorne rechts an'
        it: 'Fendinebbia anteriore destro acceso'
        pl: 'Prawe przednie światło przeciwmgielne włączone'
        ru: 'Правая передняя противотуманная фара включена'
        zh: '右前雾灯开启'
        hu: 'Jobb első ködlámpa bekapcsolva'
        pt: 'Farol antinevoeiro dianteiro direito aceso'
      0x02:
        en: 'Left fog light on'
        fr: 'Antibrouillard avant gauche allumé'
        es: 'Antiniebla delantero izquierdo encendido'
        de: 'Nebelscheinwerfer vorne links eingeschaltet'
        it: 'Fendinebbia anteriore sinistro acceso'
        pl: 'Włączone przednie lewe światło przeciwmgielne'
