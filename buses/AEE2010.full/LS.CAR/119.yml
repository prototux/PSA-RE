id: 0x119
name: 'ACCELERATION_SENSOR_VERSION'
type: 'can'
length: 3
comment:
  en: 'Additional diagnostics from the BSM node: horn, relay lines, headlights left/right, main relay, and cooling fan PWM left/right.'
  fr: 'Diagnostics supplémentaires du module BSM : avertisseur sonore, lignes de relais, phares gauche/droite, relais principal, et PWM ventilateur gauche/droite.'
  es: 'Diagnósticos adicionales del módulo BSM: claxon, líneas de relé, faros izquierdo/derecho, relé principal, y PWM del ventilador izquierdo/derecho.'
  de: 'Zusätzliche Diagnose des BSM-Moduls: Hupe, Relaisleitungen, Scheinwerfer links/rechts, Hauptrelais, und Lüfter-PWM links/rechts.'
  it: 'Diagnostica aggiuntiva del modulo BSM: clacson, linee relè, fari sinistro/destro, relè principale, e PWM ventola sinistra/destra.'
  pl: 'Dodatkowa diagnostyka modułu BSM: klakson, linie przekaźników, reflektory lewy/prawy, przekaźnik główny, i PWM wentylatora lewy/prawy.'
  ru: 'Дополнительная диагностика модуля BSM: звуковой сигнал, линии реле, фары слева/справа, главное реле, и ШИМ вентилятора слева/справа.'
  zh: 'BSM模块的附加诊断:喇叭、继电器线路、左右前照灯、主继电器,以及左右风扇PWM。'
  hu: 'A BSM modul további diagnosztikája: kürt, relévonalak, bal/jobb fényszóró, főrelé, és bal/jobb ventilátor PWM.'
  pt: 'Diagnóstico adicional do nó BSM: buzina, linhas de relé, faróis esquerdo/direito, relé principal e PWM da ventoinha de arrefecimento esquerda/direita.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['1000ms', 'trigger']
senders: ['BSM']
receivers: ['BSI']

