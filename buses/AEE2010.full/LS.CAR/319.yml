      pl: 'Żądanie włączenia świateł awaryjnych dla przeróbki nadwozia'
      ru: 'Запрос включения аварийной сигнализации для переоборудования кузова'
      zh: '请求打开危险报警灯以进行车身改装'
      hu: 'A vészvillogó bekapcsolásának kérése a karosszéria-átalakításhoz'
      pt: 'Pedido de acendimento das luzes de emergência para transformação carroçadora'
    type: 'bool'
