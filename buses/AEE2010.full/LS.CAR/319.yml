id: 0x319
name: 'LATERAL_ACCEL_YAW_SENSOR_DATA'
type: 'can'
length: 1
comment:
  en: 'Trailer connector status: warning lamp command and battery energy boost request.'
  fr: 'État du connecteur remorque : commande voyant d''alerte et demande d''augmentation d''énergie batterie.'
  es: 'Estado del conector de remolque: mando del testigo de alerta y solicitud de aumento de energía de batería.'
  de: 'Status des Anhängersteckers: Ansteuerung der Warnleuchte und Anforderung zur Batterieenergieanhebung.'
  it: 'Stato del connettore rimorchio: comando spia di allarme e richiesta di incremento energia batteria.'
  pl: 'Stan złącza przyczepy: sterowanie kontrolką ostrzegawczą i żądanie zwiększenia energii akumulatora.'
  ru: 'Статус разъёма прицепа: команда сигнальной лампы и запрос повышения энергии аккумулятора.'
  zh: '挂车连接器状态:警示灯指令和电池能量提升请求。'
  hu: 'A pótkocsi-csatlakozó állapota: figyelmeztető lámpa vezérlése és akkumulátorenergia-növelési kérés.'
  pt: 'Estado do conector do reboque: comando da luz avisadora e pedido de reforço de energia da bateria.'
observations:
  en: 'On state change of: BODY_BUILDER_WARNING_LAMP_REQUEST'
  fr: 'Sur changement d''état de : BODY_BUILDER_WARNING_LAMP_REQUEST'
  es: 'Al cambiar el estado de: BODY_BUILDER_WARNING_LAMP_REQUEST'
  de: 'Bei Statusänderung von: BODY_BUILDER_WARNING_LAMP_REQUEST'
  it: 'Al cambiamento di stato di: BODY_BUILDER_WARNING_LAMP_REQUEST'
  pl: 'Wysyłane przy zmianie stanu: BODY_BUILDER_WARNING_LAMP_REQUEST'
  ru: 'При изменении состояния: BODY_BUILDER_WARNING_LAMP_REQUEST'
  zh: '当CDE_WARNING_TC状态变化时'
  hu: 'A(z) BODY_BUILDER_WARNING_LAMP_REQUEST állapotváltozásakor'
  pt: 'Na mudança de estado de: BODY_BUILDER_WARNING_LAMP_REQUEST'
periodicity: ['200ms', 'trigger']
senders: ['BSG']
receivers: ['BSI']

signals:
