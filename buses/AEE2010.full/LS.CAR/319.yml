    bits: '1.7'
    comment:
      en: 'Request to switch on the hazard warning lights for body conversion'
      fr: 'Demande d''allumage des feux de détresse pour transformation carrossier'
      es: 'Solicitud de encendido de las luces de emergencia para transformación de carrocero'
      de: 'Anforderung zum Einschalten der Warnblinkanlage für Aufbauumbauten'
