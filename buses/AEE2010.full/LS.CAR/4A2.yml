id: 0x4A2
name: 'BPVA_FAULT_EVENT'
type: 'can'
length: 8
comment:
  en: 'BPVA module (rear parking aid): fault event, logged in the BSI fault log.'
  fr: 'Module BPVA (aide au stationnement arrière) : événement défaut, enregistré dans le journal des défauts du BSI.'
  es: 'Módulo BPVA (ayuda al aparcamiento trasero): evento de fallo, registrado en el registro de fallos de la BSI.'
  de: 'BPVA-Modul (Einparkhilfe hinten) – Fehlerereignis, im Fehlerspeicher (Fehlerprotokoll) des BSI vermerkt.'
  it: 'Modulo BPVA (assistenza parcheggio posteriore): evento di guasto, registrato nel registro guasti della BSI.'
  pl: 'Moduł BPVA (wspomaganie parkowania z tyłu) – zdarzenie usterki, zapisywane w dzienniku usterek BSI.'
  ru: 'Модуль BPVA (задняя парковочная помощь) — событие неисправности, регистрируется в журнале неисправностей BSI.'
  zh: 'BPVA模块(后泊车辅助)——故障事件,记录在BSI故障日志中。'
  hu: 'BPVA modul (hátsó tolatássegítő) – hibaesemény, amelyet a BSI hibanaplójába rögzítenek.'
  pt: 'Módulo BPVA (ajuda ao estacionamento traseiro): evento de avaria, registado no registo de avarias da BSI.'
observations:
  en: 'Timing defined by the diagnostic procedure'
  fr: 'Périodicité définie par la procédure de diagnostic'
  es: 'Temporización definida por el procedimiento de diagnóstico'
  de: 'Zeitverhalten durch das Diagnoseverfahren festgelegt'
  it: 'Tempistica definita dalla procedura diagnostica'
  pl: 'Zgodnie z procedurą diagnostyczną'
  ru: 'Периодичность определяется диагностической процедурой'
  zh: '由诊断程序定义发送时机'
  hu: 'Az időzítést a diagnosztikai eljárás határozza meg'
  pt: 'Temporização definida pelo procedimento de diagnóstico'
periodicity: ['trigger']
senders: ['BSTL']
receivers: ['BSI']

