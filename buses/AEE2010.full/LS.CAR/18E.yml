id: 0x18E
name: 'BML_AES_KEY_PROGRAMMING'
type: 'can'
length: 2
comment:
  en: 'AES code programming data for the BML hands-free access module (part 2): code reference and packet counter.'
  fr: 'Données de programmation de code AES du module mains-libres BML (partie 2) : référence de code et compteur de paquet.'
  es: 'Datos de programación de código AES del módulo manos libres BML (parte 2): referencia de código y contador de paquete.'
  de: 'AES-Code-Programmierdaten des Freisprech-Zugangsmoduls BML (Teil 2): Codereferenz und Paketzähler.'
  it: 'Dati di programmazione del codice AES del modulo di accesso mani libere BML (parte 2): riferimento codice e contatore pacchetti.'
  pl: 'Dane programowania kodu AES modulu dostępu bezkluczykowego BML (część 2): numer kodu i licznik pakietów.'
  ru: 'Данные программирования AES-кода модуля бесключевого доступа BML (часть 2): номер кода и счётчик пакетов.'
  zh: '免钥匙进入模块BML的AES代码编程数据(第2部分):代码编号及数据包计数。'
  hu: 'A kihangosító (BML) modul AES-kód programozási adatai (2. rész): kód azonosító és csomagszámláló.'
  pt: 'Dados de programação do código AES do módulo mãos-livres BML (parte 2): referência do código e contador de pacotes.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['BML']

signals:
  LEARNING_PACKAGE_COUNTER:
    bits: '1.7-1.4'
    comment:
      en: 'Counter marking the set of learning frames belonging to the same code'
      fr: 'Compteur marquant l''ensemble des trames d''apprentissage appartenant à un même code'
      es: 'Contador que marca el conjunto de tramas de aprendizaje pertenecientes al mismo código'
      de: 'Zähler zur Kennzeichnung der zu einem gemeinsamen Code gehörenden Lernrahmen'
      it: 'Contatore che contrassegna l''insieme dei frame di apprendimento appartenenti allo stesso codice'
      pl: 'Licznik oznaczający zestaw ramek uczenia należących do tego samego kodu'
      ru: 'Счётчик, отмечающий набор кадров обучения, относящихся к одному коду'
      zh: '标记属于同一代码的一组学习帧的计数器'
      hu: 'Az azonos kódhoz tartozó betanító keretek csoportját jelölő számláló'
      pt: 'Contador que marca o conjunto de tramas de aprendizagem pertencentes ao mesmo código'
    type: 'uint'
    min: 0
    max: 15

  BML_CODE_NUMBER:
    bits: '1.3-1.0'
    comment:
      en: 'Sub-addressing code defining the meaning of the PROG_CODE_BML_STREAM stream contents'
      fr: 'Code de sous-adressage définissant la signification du contenu du flux PROG_CODE_BML_STREAM'
      es: 'Código de subdireccionamiento que define el significado del contenido del flujo PROG_CODE_BML_STREAM'
      de: 'Subadressierungscode, der die Bedeutung des Inhalts des PROG_CODE_BML_STREAM-Datenstroms festlegt'
      it: 'Codice di indirizzamento secondario che definisce il significato del contenuto del flusso PROG_CODE_BML_STREAM'
      pl: 'Kod podadresowania określający znaczenie zawartości strumienia PROG_CODE_BML_STREAM'
      ru: 'Код субадресации, определяющий значение содержимого потока PROG_CODE_BML_STREAM'
      zh: '定义PROG_CODE_BML流内容含义的子地址代码'
      hu: 'Almcímzési kód, amely meghatározza a PROG_CODE_BML_STREAM adatfolyam tartalmának jelentését'
      pt: 'Código de subendereçamento que define o significado do conteúdo do fluxo PROG_CODE_BML_STREAM'
    type: 'uint'

  PROG_CODE_BML_STREAM:
    bits: '2.7-2.1'
    comment:
      en: 'Stream carrying the various remote control secret codes'
      fr: 'Flux transportant les différents codes secrets de la télécommande'
      es: 'Flujo que transporta los distintos códigos secretos del mando a distancia'
      de: 'Datenstrom mit den verschiedenen Geheimcodes der Fernbedienung'
      it: 'Flusso che trasporta i vari codici segreti del telecomando'
      pl: 'Strumień przenoszący różne tajne kody pilota'
      ru: 'Поток, содержащий различные секретные коды брелока'
      zh: '携带遥控器各种密钥的数据流'
      hu: 'A távirányító különböző titkos kódjait hordozó adatfolyam'
      pt: 'Fluxo que transporta os vários códigos secretos do comando à distância'
    type: 'uint'

  UNUSED_1:
    bits: '2.0'
    unused: true
