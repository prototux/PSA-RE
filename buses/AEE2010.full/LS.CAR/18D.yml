      it: 'Accensione della spia degli anabbaglianti'
      pl: 'Zapalenie kontrolki świateł mijania'
      ru: 'Включение индикатора ближнего света'
      zh: '近光灯指示灯点亮'
      hu: 'A tompított fényszóró visszajelzőjének kigyulladása'
      pt: 'Indicador luminoso das luzes de cruzamento aceso'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Low beams off'
        fr: 'Feux de croisement éteints'
        es: 'Luces de cruce apagadas'
