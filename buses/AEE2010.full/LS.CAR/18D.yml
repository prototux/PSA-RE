id: 0x18D
name: 'STALK_MODULE_COMMAND'
type: 'can'
length: 1
comment:
  en: 'Commands sent by the BSI to the stalk module: low/high beam and front fog states, indicator and position lamp telltales.'
  fr: 'Commandes envoyées par la BSI au module commodo : états des feux de croisement/route et antibrouillard avant, témoins de clignotants et de feux de position.'
  es: 'Órdenes enviadas por la BSI al módulo de mando: estados de luces de cruce/carretera y antiniebla delanteros, testigos de intermitentes y de luces de posición.'
  de: 'Von der BSI an das Lenkstockschaltermodul gesendete Befehle: Abblend-/Fernlicht- und Frontnebelscheinwerferzustände, Blinker- und Standlicht-Kontrollleuchten.'
  it: 'Comandi inviati dalla BSI al modulo leva: stati di anabbaglianti/abbaglianti e fendinebbia anteriori, spie indicatori di direzione e luci di posizione.'
  pl: 'Polecenia wysyłane przez BSI do modułu dźwigienki: stany świateł mijania/drogowych i przednich przeciwmgielnych, kontrolki kierunkowskazów i świateł pozycyjnych.'
  ru: 'Команды, отправляемые BSI в модуль подрулевого переключателя: состояния ближнего/дальнего света и передних противотуманных фар, индикаторы поворотников и габаритных огней.'
  zh: '由BSI发送给组合开关模块的命令：近光/远光及前雾灯状态，转向灯及示宽灯指示灯。'
  hu: 'A BSI parancsai a kormánykar-modul felé: tompított/távolsági fény és elülső ködfényszóró állapotok, index- és helyzetjelzőlámpa-jelzők.'
  pt: 'Comandos enviados pela BSI ao módulo do comutador de coluna: estados de máximos/médios e nevoeiro dianteiro, avisadores de piscas e luzes de presença.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['MIT']

