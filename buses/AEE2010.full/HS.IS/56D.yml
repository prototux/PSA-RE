id: 0x56D
name: 'BRAKE_DATA_2_TRISENSOR_REQUEST'
type: 'can'
length: 3
comment:
  en: 'Sent by the ABS unit to the Bosch tri-sensor to trigger its response in the sensor data frame: activation info, ignition-cycle counter, CRC and info pointer.'
  fr: 'Envoyée par le calculateur ABS au tricapteur Bosch pour déclencher sa réponse dans la trame de données capteur : info d''activation, compteur de cycles contact, CRC et pointeur d''info.'
  es: 'Enviada por la unidad ABS al tricaptador Bosch para provocar su respuesta en la trama de datos del sensor: información de activación, contador de ciclos de contacto, CRC y puntero de información.'
  de: 'Vom ABS-Steuergerät an den Bosch-Trisensor gesendet, um dessen Antwort im Sensordatentelegramm auszulösen: Aktivierungsinfo, Zündzykluszähler, CRC und Info-Zeiger.'
  it: 'Inviata dall''unità ABS al tricaptatore Bosch per attivare la sua risposta nella trama dati sensore: informazioni di attivazione, contatore cicli contatto, CRC e puntatore info.'
  pl: 'Wysyłana przez sterownik ABS do triczujnika Bosch w celu wywołania jego odpowiedzi w ramce danych czujnika: informacja aktywacji, licznik cykli zapłonu, CRC i wskaźnik informacji.'
  ru: 'Отправляется блоком ABS трёхдатчику Bosch для вызова его ответа в кадре данных датчика: информация активации, счётчик циклов зажигания, CRC и указатель информации.'
  zh: '由ABS单元发送给博世三传感器,以触发其在传感器数据帧中的响应:激活信息、点火循环计数器、CRC和信息指针。'
  hu: 'Az ABS egység küldi a Bosch háromtengelyes érzékelőnek, hogy kiváltsa annak válaszát az érzékelő adatkeretében: aktiválási info, gyújtásciklus-számláló, CRC és infomutató.'
  pt: 'Enviada pela unidade ABS ao tri-sensor Bosch para acionar a sua resposta na trama de dados do sensor: informação de ativação, contador de ciclos de ignição, CRC e ponteiro de informação.'
observations:
  en: 'Sent by the Bosch ESP in response to the Bosch tri-sensor'
  fr: 'Émise par l''ESP Bosch en réponse au tri-capteur Bosch'
  es: 'Enviada por el ESP Bosch en respuesta al tri-sensor Bosch'
  de: 'Gesendet vom Bosch-ESP als Antwort auf den Bosch-Dreifachsensor'
  it: 'Inviata dall''ESP Bosch in risposta al tri-sensore Bosch'
  pl: 'Wysyłane przez ESP Bosch w odpowiedzi na czujnik trójfunkcyjny Bosch'
  ru: 'Отправляется ESP Bosch в ответ на трёхкомпонентный датчик Bosch'
  zh: '由博世ESP响应博世三合一传感器时发送'
  hu: 'A Bosch ESP küldi a Bosch háromfunkciós érzékelőre adott válaszként'
  pt: 'Enviada pelo ESP Bosch em resposta ao tri-sensor Bosch'
periodicity: ['trigger']
senders: ['ABS']
receivers: ['ACCEL_SENSOR']

