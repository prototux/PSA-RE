      it: 'Posizione del pedale dell''acceleratore del conducente, utilizzata dal gruppo motopropulsore'
      pl: 'Położenie pedału przyspieszenia kierowcy, wykorzystywane przez zespół napędowy'
      ru: 'Положение педали акселератора водителя, используемое силовым агрегатом'
      zh: '动力总成使用的驾驶员加速踏板位置'
      hu: 'A vezető gázpedáljának helyzete, az erőátviteli rendszer által használva'
