id: 0x2E8
name: 'ENGINE_GEARBOX_DYNAMIC_DATA'
type: 'can'
length: 8
comment:
  en: 'Engine-gearbox dynamic data: powertrain wheel-torque potential setpoint, min/max powertrain ratio, active torque control, accelerator pedal position and transmission piloting status.'
  fr: 'Données dynamiques moteur-boîte : consigne potentielle de couple roue du GMP, rapport GMP min/max, contrôle de couple actif, position pédale d''accélérateur et état de pilotage de la transmission.'
  es: 'Datos dinámicos motor-caja: consigna potencial de par de rueda del grupo motopropulsor, relación GMP mín/máx, control de par activo, posición del pedal acelerador y estado de pilotaje de la transmisión.'
  de: 'Motor-Getriebe-Dynamikdaten: potenzieller Radmoment-Sollwert des Antriebsstrangs, min./max. Antriebsstrangübersetzung, aktive Momentregelung, Gaspedalstellung und Getriebesteuerungsstatus.'
  it: 'Dati dinamici motore-cambio: setpoint potenziale di coppia ruota del gruppo propulsore, rapporto GMP min/max, controllo coppia attivo, posizione pedale acceleratore e stato di pilotaggio della trasmissione.'
  pl: 'Dane dynamiczne silnik-skrzynia: potencjalna nastawa momentu koła układu napędowego, min/maks przełożenie układu napędowego, aktywna kontrola momentu, pozycja pedału przyspieszenia i stan sterowania transmisją.'
  ru: 'Динамические данные двигатель-коробка: потенциальная уставка крутящего момента колеса силового агрегата, мин/макс передаточное число силового агрегата, активное управление моментом, положение педали акселератора и статус управления трансмиссией.'
  zh: '发动机-变速箱动态数据:动力总成车轮扭矩潜在设定值、动力总成最小/最大传动比、主动扭矩控制、加速踏板位置和变速器控制状态。'
  hu: 'Motor-váltó dinamikus adatok: a hajtáslánc keréknyomaték potenciális alapjele, min/max hajtáslánc-áttétel, aktív nyomatékszabályozás, gázpedál pozíció és a hajtómű vezérlési állapota.'
  pt: 'Dados dinâmicos motor-caixa de velocidades: ponto de ajuste potencial de binário nas rodas do grupo motopropulsor, relação mínima/máxima da caixa, controlo de binário ativo, posição do pedal do acelerador e estado de pilotagem da transmissão.'
periodicity: ['20ms']
senders: ['CMM']
receivers: ['BVA']

signals:
  POWERTRAIN_WHEEL_TORQUE_ABSOLUTE_POTENTIAL_REQUEST:
    bits: '1.7-1.0'
    comment:
      en: 'Powertrain absolute potential wheel torque request'
      fr: 'Demande de couple roue potentiel absolu du groupe motopropulseur'
      es: 'Solicitud de par en rueda potencial absoluto del grupo motopropulsor'
      de: 'Absolute potenzielle Radmomentanforderung des Antriebsstrangs'
      it: 'Richiesta di coppia ruota potenziale assoluta del gruppo motopropulsore'
      pl: 'Żądanie bezwzględnego potencjalnego momentu na kole zespołu napędowego'
      ru: 'Запрос абсолютного потенциального момента на колесе силового агрегата'
      zh: '动力总成绝对潜在车轮扭矩请求'
      hu: 'Az erőátviteli rendszer abszolút potenciális kerék-nyomatékigénye'
      pt: 'Pedido de binário na roda potencial absoluto do grupo motopropulsor'
    type: 'uint'
    factor: 20
    offset: -1000
    min: -1000
    max: 4000
    units: 'Nm'
    invalid: 0xFF
    default: 0x32

  POWERTRAIN_ACCELERATOR_POSITION:
    bits: '2.7-2.0'
    comment:
      en: 'Driver accelerator pedal position, as used by the powertrain'
      fr: 'Position de la pédale d''accélérateur du conducteur, utilisée par le groupe motopropulseur'
