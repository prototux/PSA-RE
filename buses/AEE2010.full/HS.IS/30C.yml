id: 0x30C
name: 'IHU_POWER_STAGE_DATA_2'
type: 'can'
length: 6
comment:
  en: 'LED headlamp power-stage driver data: activation, measured current, resistance and status for each channel.'
  fr: 'Données du driver de puissance du phare LED (IHU) : activation, courant mesuré, résistance et état pour chaque canal.'
  es: 'Datos del driver de potencia del faro LED (IHU): activación, corriente medida, resistencia y estado de cada canal.'
  de: 'Daten der Leistungsendstufe des LED-Scheinwerfers (IHU): Aktivierung, gemessener Strom, Widerstand und Status je Kanal.'
  it: 'Dati dello stadio di potenza del faro LED (IHU): attivazione, corrente misurata, resistenza e stato per ciascun canale.'
  pl: 'Dane stopnia mocy reflektora LED (IHU): aktywacja, mierzony prąd, rezystancja i stan dla każdego kanału.'
  ru: 'Данные силового каскада светодиодной фары (IHU): активация, измеренный ток, сопротивление и статус для каждого канала.'
  zh: 'LED大灯功率级驱动数据:每个通道的激活状态、实测电流、电阻及状态。'
  hu: 'A LED fényszóró teljesítményfokozatának (IHU) adatai: aktiválás, mért áram, ellenállás és állapot csatornánként.'
  pt: 'Dados do andar de potência do driver dos faróis LED: ativação, corrente medida, resistência e estado de cada canal.'
periodicity: ['20ms']
senders: ['IHU']
receivers: ['CMM']

signals:
  FRAME_CHECKSUM:
    bits: '1.7-1.4'
    comment:
      en: 'Checksum of the frame'
      fr: 'Somme de contrôle (checksum) de la trame'
      es: 'Suma de comprobación (checksum) de la trama'
      de: 'Prüfsumme (Checksum) des Frames'
      it: 'Checksum del frame'
      pl: 'Suma kontrolna (checksum) ramki'
      ru: 'Контрольная сумма кадра'
      zh: '帧校验和'
      hu: 'A keret ellenőrző összege (checksum)'
      pt: 'Soma de verificação da trama'
    type: 'uint'

  PROCESS_COUNTER:
    bits: '1.3-1.0'
    comment:
      en: 'Rolling counter incremented at each calculation cycle'
      fr: 'Compteur cyclique incrémenté à chaque cycle de calcul'
      es: 'Contador cíclico incrementado en cada ciclo de cálculo'
      de: 'Zyklischer Zähler, der bei jedem Berechnungszyklus erhöht wird'
      it: 'Contatore ciclico incrementato a ogni ciclo di calcolo'
      pl: 'Licznik cykliczny zwiększany przy każdym cyklu obliczeń'
      ru: 'Циклический счётчик, увеличивающийся на каждом цикле расчёта'
      zh: '每个计算周期递增的循环计数器'
      hu: 'A számítási ciklus minden lépésekor növekvő ciklikus számláló'
      pt: 'Contador cíclico incrementado a cada ciclo de cálculo'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00

  CHANNEL3_POWER_STAGE_CURRENT:
    bits: '2.7-2.0'
    comment:
      en: 'Channel 3 power stage current measurement'
      fr: 'Mesure de courant de l''étage de puissance du canal 3'
      es: 'Medición de corriente de la etapa de potencia del canal 3'
      de: 'Strommessung der Leistungsstufe von Kanal 3'
      it: 'Misura della corrente dello stadio di potenza del canale 3'
      pl: 'Pomiar prądu stopnia mocy kanału 3'
      ru: 'Измерение тока силового каскада канала 3'
      zh: '通道3功率级电流测量值'
      hu: 'A 3. csatorna teljesítményfokozatának árammérése'
      pt: 'Medição de corrente do estágio de potência do canal 3'
