id: 0x771
name: 'FAULT_LOG_BHI_RAW'
type: 'can'
length: 8
comment:
  en: 'Raw fault log data frame for the BHI node.'
  fr: 'Trame brute du journal des défauts du calculateur BHI.'
  es: 'Trama de datos en bruto del registro de fallos del nodo BHI.'
  de: 'Rohdaten-Rahmen des Fehlerspeichers des Steuergeräts BHI.'
  it: 'Trama dati grezzi del registro guasti del nodo BHI.'
  pl: 'Ramka surowych danych dziennika usterek węzła BHI.'
  ru: 'Кадр необработанных данных журнала неисправностей узла BHI.'
  zh: 'BHI节点故障日志原始数据帧。'
  hu: 'A BHI csomópont hibanapló nyers adatkerete.'
  pt: 'Trama de dados em bruto do registo de avarias do nó BHI.'
observations:
  en: 'May be sent event-triggered as 3 groups of 3 frames, 100 ms apart, with different lengths, to the BSI'
  fr: 'Peut être émise de façon événementielle sous forme de 3 fois 3 trames, espacées de 100 ms, de longueur différente, vers la BSI'
  es: 'Puede enviarse de forma basada en eventos como 3 series de 3 tramas, separadas 100 ms, de longitud diferente, hacia la BSI'
  de: 'Kann ereignisgesteuert als 3-mal 3 Frames unterschiedlicher Länge, 100 ms auseinander, an die BSI gesendet werden'
  it: 'Può essere inviata in modo event-driven come 3 serie di 3 frame, distanziati di 100 ms, di lunghezza diversa, verso la BSI'
  pl: 'Może być wysyłana zdarzeniowo jako 3 razy po 3 ramki, w odstępie 100 ms, o różnej długości, do BSI'
  ru: 'Может отправляться по событию в виде 3 групп по 3 кадра с интервалом 100 мс и разной длиной, в адрес BSI'
  zh: '可事件触发地以3组共3帧的形式发送给BSI,间隔100毫秒,长度各不相同'
  hu: 'Eseményvezérelten küldhető 3-szor 3 keretként, 100 ms-os időközzel, eltérő hosszúsággal, a BSI felé'
  pt: 'Pode ser enviada de forma baseada em eventos como 3 grupos de 3 tramas, com 100 ms de intervalo, com comprimentos diferentes, para a BSI'
periodicity: ['trigger']
senders: ['BHI']
receivers: ['BSI']

signals:
  FAULT_LOG_REQUEST_DATA:
    bits: '1.7-8.0'
    comment:
      en: 'Data of the fault log request'
      fr: 'Données de la demande du journal de défauts'
      es: 'Datos de la solicitud del registro de fallos'
      de: 'Daten der Fehlerprotokoll-Anfrage'
      it: 'Dati della richiesta del registro guasti'
      pl: 'Dane żądania dziennika usterek'
      ru: 'Данные запроса журнала неисправностей'
      zh: '故障日志请求数据'
      hu: 'A hibanapló kérés adatai'
      pt: 'Dados do pedido do registo de falhas'
    type: 'uint'

alternatives:
  - note:
      en: 'Other layout observed for this frame (other software or car version)'
      fr: 'Autre disposition observée pour cette trame (autre version de logiciel ou de véhicule)'
      es: 'Otra disposición observada para esta trama (otra versión de software o de vehículo)'
      de: 'Andere beobachtete Belegung dieser Botschaft (andere Software- oder Fahrzeugversion)'
      it: 'Altra disposizione osservata per questo frame (altra versione di software o di vettura)'
      pl: 'Inny zaobserwowany układ tej ramki (inna wersja oprogramowania lub samochodu)'
      ru: 'Другая наблюдаемая раскладка этого кадра (другая версия ПО или автомобиля)'
      zh: '此帧观察到的另一种布局（其他软件或车型版本）'
      hu: 'A keret másik megfigyelt elrendezése (más szoftver- vagy autóverzió)'
      pt: 'Outra disposição observada para esta trama (outra versão de software ou de veículo)'
    periodicity: ['trigger']
    senders: ['BHI']
    receivers: ['BSI']
    signals:
      FRAME_COUNT:
        bits: '1.7-1.6'
        comment:
          en: 'Number of frames'
          fr: 'Nombre de trames'
          es: 'Número de tramas'
          de: 'Anzahl der Frames'
          it: 'Numero di frame'
          pl: 'Liczba ramek'
          ru: 'Количество кадров'
          zh: '帧数'
          hu: 'A keretek száma'
          pt: 'Número de tramas'
        type: 'enum'
        default: 0x02
        values:
          0x00:
            unused: true
          0x01:
            en: 'One frame'
            fr: 'Une trame'
            es: 'Una trama'
            de: 'Ein Rahmen'
            it: 'Un frame'
            pl: 'Jedna ramka'
            ru: 'Один кадр'
            zh: '一帧'
            hu: 'Egy keret'
            pt: 'Uma trama'
          0x02:
            en: 'Two frames'
            fr: 'Deux trames'
            es: 'Dos tramas'
            de: 'Zwei Rahmen'
            it: 'Due trame'
            pl: 'Dwie ramki'
            ru: 'Два кадра'
            zh: '两帧'
            hu: 'Két keret'
            pt: 'Duas tramas'
          0x03:
            en: 'Three frames'
            fr: 'Trois trames'
            es: 'Tres tramas'
            de: 'Drei Frames'
            it: 'Tre frame'
            pl: 'Trzy ramki'
            ru: 'Три кадра'
            zh: '三帧'
            hu: 'Három keret'
            pt: 'Três tramas'
      FRAME_NUMBER:
        bits: '1.5-1.4'
        comment:
          en: 'Frame number'
          fr: 'Numéro de la trame'
          es: 'Número de trama'
          de: 'Framenummer'
          it: 'Numero del frame'
          pl: 'Numer ramki'
          ru: 'Номер кадра'
          zh: '帧编号'
          hu: 'Keretszám'
          pt: 'Número da trama'
        type: 'enum'
        values:
          0x00:
            unused: true
          0x01:
            en: 'Frame number 1'
            fr: 'Trame numéro 1'
            es: 'Trama número 1'
            de: 'Rahmen Nummer 1'
            it: 'Trama numero 1'
            pl: 'Ramka nr 1'
            ru: 'Кадр номер 1'
            zh: '帧编号1'
            hu: '1. számú keret'
            pt: 'Trama número 1'
          0x02:
            en: 'Frame number 2'
            fr: 'Trame numéro 2'
            es: 'Trama número 2'
            de: 'Rahmen Nummer 2'
            it: 'Trama numero 2'
            pl: 'Ramka nr 2'
            ru: 'Кадр номер 2'
            zh: '帧编号2'
            hu: '2. számú keret'
            pt: 'Trama número 2'
          0x03:
            en: 'Frame number 3'
            fr: 'Trame numéro 3'
            es: 'Trama número 3'
            de: 'Rahmen Nummer 3'
            it: 'Trama numero 3'
            pl: 'Ramka numer 3'
            ru: 'Кадр номер 3'
            zh: '第3帧'
            hu: '3. keret'
            pt: 'Trama número 3'
      DTC_STATUS:
        bits: '1.3'
        comment:
          en: 'Fault status transition (to/from permanent)'
          fr: 'Transition d''état du défaut (vers/depuis permanent)'
          es: 'Transición del estado del fallo (hacia/desde permanente)'
          de: 'Statusübergang des Fehlers (zu/von permanent)'
          it: 'Transizione dello stato del guasto (verso/da permanente)'
          pl: 'Zmiana stanu usterki (na/z trwałej)'
          ru: 'Переход состояния неисправности (в постоянное/из постоянного)'
          zh: '故障状态转换(转为/转出永久性)'
          hu: 'A hibaállapot átmenete (állandósulásba/-ból)'
          pt: 'Transição do estado da falha (para/desde permanente)'
        type: 'bool'
        values:
          0x00:
            en: 'Transition from permanent fault to transient fault'
            fr: 'Passage d''un défaut permanent à un défaut fugitif'
            es: 'Transición de fallo permanente a fallo transitorio'
            de: 'Übergang von Dauerfehler zu vorübergehendem Fehler'
            it: 'Passaggio da guasto permanente a guasto transitorio'
            pl: 'Przejście z usterki trwałej do usterki przejściowej'
            ru: 'Переход от постоянной неисправности к кратковременной'
            zh: '从永久故障转为瞬时故障'
            hu: 'Átmenet állandó hibából átmeneti hibába'
            pt: 'Transição de falha permanente para falha transitória'
          0x01:
            en: 'Fault set to permanent'
            fr: 'Passage du défaut à permanent'
            es: 'Paso del fallo a permanente'
            de: 'Fehler auf dauerhaft gesetzt'
            it: 'Passaggio del guasto a permanente'
            pl: 'Zmiana usterki na trwałą'
            ru: 'Перевод неисправности в постоянную'
            zh: '故障转为永久性'
            hu: 'A hiba állandósítva'
            pt: 'Passagem da falha a permanente'
      UNUSED_1:
        bits: '1.2'
        unused: true
      ECU_AEE2004_COMPLIANCE:
        bits: '1.1-1.0'
        comment:
          en: 'ECU compliance with the AEE2004 fault log standard'
          fr: 'Conformité du calculateur à la norme de journal de défauts AEE2004'
          es: 'Conformidad de la unidad de control con la norma de registro de fallos AEE2004'
          de: 'Konformität des Steuergeräts mit dem Fehlerprotokollstandard AEE2004'
          it: 'Conformità della centralina allo standard del registro guasti AEE2004'
          pl: 'Zgodność sterownika ze standardem dziennika usterek AEE2004'
          ru: 'Соответствие блока управления стандарту журнала неисправностей AEE2004'
          zh: 'ECU符合AEE2004故障日志标准的情况'
          hu: 'A vezérlőegység megfelelése az AEE2004 hibanapló-szabványnak'
          pt: 'Conformidade da unidade de controlo com a norma de registo de falhas AEE2004'
        type: 'enum'
        values:
          0x00:
            en: '2004 EEA ECU (carried over)'
            fr: 'Calculateur reconduit AEE2004'
            es: 'Unidad de control AEE2004 reutilizada'
            de: 'Übernommenes AEE2004-Steuergerät'
            it: 'Centralina AEE2004 riportata'
            pl: 'Sterownik przeniesiony AEE2004'
            ru: 'Блок управления AEE2004 (перенесённый)'
            zh: '沿用的AEE2004控制器'
            hu: 'Átvitt AEE2004 vezérlőegység'
            pt: 'Unidade de controlo AEE2004 (reconduzida)'
          0x01:
            en: 'ECU compliant with EU2010'
            fr: 'Calculateur conforme à la norme EU2010'
            es: 'Unidad de control conforme a la norma EU2010'
            de: 'Steuergerät gemäß EU2010-Norm'
            it: 'Centralina conforme alla norma EU2010'
            pl: 'Sterownik zgodny z normą EU2010'
            ru: 'Блок управления, соответствующий норме EU2010'
            zh: '符合EU2010标准的控制单元'
            hu: 'EU2010 szabványnak megfelelő vezérlőegység'
            pt: 'Unidade de controlo conforme com EU2010'
      FAULT_LOG_ODOMETER:
        bits: '2.7-4.0'
        comment:
          en: 'Absolute distance travelled by the vehicle (matches the value shown to the driver)'
          fr: 'Distance absolue parcourue par le véhicule (correspond à la valeur affichée au conducteur)'
          es: 'Distancia absoluta recorrida por el vehículo (coincide con el valor mostrado al conductor)'
          de: 'Absolut zurückgelegte Strecke des Fahrzeugs (entspricht dem dem Fahrer angezeigten Wert)'
          it: 'Distanza assoluta percorsa dal veicolo (corrisponde al valore mostrato al conducente)'
          pl: 'Bezwzględny przebieg pojazdu (zgodny z wartością wyświetlaną kierowcy)'
          ru: 'Абсолютный пробег автомобиля (соответствует значению, показываемому водителю)'
          zh: '车辆行驶的绝对里程(与显示给驾驶员的值一致)'
          hu: 'A jármű által megtett abszolút táv (megegyezik a vezetőnek kijelzett értékkel)'
          pt: 'Distância absoluta percorrida pelo veículo (corresponde ao valor apresentado ao condutor)'
        type: 'uint'
        factor: 1
        min: 0
        max: 16777214
        units: 'km'
        invalid: 0xFFFFFF
      VEHICLE_TIME_COUNTER:
        bits: '5.7-8.0'
        comment:
          en: 'Vehicle time counter'
          fr: 'Compteur temporel du véhicule'
          es: 'Contador de tiempo del vehículo'
          de: 'Zeitzähler des Fahrzeugs'
          it: 'Contatore temporale del veicolo'
          pl: 'Licznik czasu pojazdu'
          ru: 'Счётчик времени автомобиля'
          zh: '车辆时间计数器'
          hu: 'Jármű időszámlálója'
          pt: 'Contador de tempo do veículo'
        type: 'uint'
        factor: 0.1
        min: 0
        max: 429496729.3
        units: 's'
        invalid: 0xFFFFFFFF
        default: 0xFFFFFFFE
