id: 0x398
name: 'CAAR_SINGLE_SENSOR_DATA'
type: 'can'
length: 4
comment:
  en: 'Sent only on vehicles fitted with a single ride-height sensor: compensation state and operating mode of the self-levelling suspension.'
  fr: 'Émise uniquement sur les véhicules équipés d''un seul capteur de hauteur : état de compensation et mode de fonctionnement de la suspension auto-nivelante.'
  es: 'Enviada solo en vehículos equipados con un único sensor de altura: estado de compensación y modo de funcionamiento de la suspensión autonivelante.'
  de: 'Nur bei Fahrzeugen mit einem einzelnen Höhensensor gesendet: Kompensationsstatus und Betriebsmodus der selbstnivellierenden Federung.'
  it: 'Inviata solo sui veicoli dotati di un unico sensore di altezza: stato di compensazione e modalità operativa della sospensione autolivellante.'
  pl: 'Wysyłana tylko w pojazdach wyposażonych w jeden czujnik wysokości: stan kompensacji i tryb pracy zawieszenia samopoziomującego.'
  ru: 'Отправляется только на автомобилях с одним датчиком высоты: статус компенсации и режим работы самовыравнивающейся подвески.'
  zh: '仅在配备单一高度传感器的车辆上发送:自动调平悬挂的补偿状态和工作模式。'
  hu: 'Csak egyetlen magasságérzékelővel felszerelt járműveken kerül elküldésre: az önszintező felfüggesztés kompenzációs állapota és üzemmódja.'
  pt: 'Enviada apenas em veículos equipados com um único sensor de altura: estado de compensação e modo de funcionamento da suspensão autonivelante.'
periodicity: ['20ms']
senders: ['CAAR']
receivers: ['ABS', 'BSI', 'FSE']

signals:
  REAR_SUSPENSION_TRAVEL_HEIGHT:
    bits: '1.7-1.0'
    comment:
      en: 'Rear suspension travel height'
      fr: 'Hauteur de débattement de la suspension arrière'
      es: 'Altura de recorrido de la suspensión trasera'
      de: 'Federweghöhe hinten'
      it: 'Altezza di escursione della sospensione posteriore'
      pl: 'Wysokość skoku zawieszenia tylnego'
      ru: 'Высота хода задней подвески'
      zh: '后悬架行程高度'
      hu: 'Hátsó futómű lengésmagassága'
      pt: 'Altura de curso da suspensão traseira'
    type: 'sint'
    factor: 2
    min: -254
    max: 254
    units: 'mm'
    invalid: 0x80

  SUSPENSION_TRAVEL_ANGLE:
    bits: '2.7-2.0'
    comment:
      en: 'Suspension travel angle'
      fr: 'Angle de débattement de la suspension'
      es: 'Ángulo de recorrido de la suspensión'
      de: 'Federwegwinkel'
      it: 'Angolo di escursione della sospensione'
      pl: 'Kąt skoku zawieszenia'
      ru: 'Угол хода подвески'
      zh: '悬架行程角度'
      hu: 'Futómű lengésszöge'
      pt: 'Ângulo de curso da suspensão'
    type: 'sint'
    factor: 0.5
    min: -63.5
    max: 63.5
    units: '°'
    invalid: 0x80
    default: 0x00

  PROCESS_COUNTER_4BIT:
    bits: '3.7-3.4'
    comment:
      en: '4-bit process counter'
      fr: 'Compteur de process 4 bits'
      es: 'Contador de proceso de 4 bits'
      de: '4-Bit-Prozesszähler'
      it: 'Contatore di processo a 4 bit'
      pl: '4-bitowy licznik procesu'
      ru: '4-битный счётчик процесса'
