id: 0x633
name: 'EOBD_FRAME'
type: 'can'
length: 8
comment:
  en: 'European On-Board Diagnostics (EOBD) code and data frame from the engine ECU.'
  fr: 'Trame de code et données de diagnostic embarqué européen (EOBD) du calculateur moteur.'
  es: 'Trama de código y datos de diagnóstico a bordo europeo (EOBD) de la centralita del motor.'
  de: 'EOBD-Code- und Datentelegramm (europäische On-Board-Diagnose) des Motorsteuergeräts.'
  it: 'Trama di codice e dati di diagnosi di bordo europea (EOBD) della centralina motore.'
  pl: 'Ramka kodu i danych europejskiej diagnostyki pokładowej (EOBD) ze sterownika silnika.'
  ru: 'Кадр кода и данных европейской бортовой диагностики (EOBD) от ЭБУ двигателя.'
  zh: '发动机ECU发出的欧洲车载诊断(EOBD)代码和数据帧。'
  hu: 'Az európai fedélzeti diagnosztika (EOBD) kód- és adatkerete a motorvezérlőtől.'
  pt: 'Trama de código e dados de diagnóstico de bordo europeu (EOBD) da unidade de controlo do motor.'
observations:
  en: 'Request via the K/L diagnostic line'
  fr: 'Demande via la ligne diagnostic K, L'
  es: 'Solicitud a través de la línea de diagnóstico K, L'
  de: 'Anforderung über die Diagnoseleitung K, L'
  it: 'Richiesta tramite la linea diagnostica K, L'
  pl: 'Żądanie przez linię diagnostyczną K, L'
  ru: 'Запрос через диагностическую линию K, L'
  zh: '通过K、L诊断线请求时'
  hu: 'Kérés a K/L diagnosztikai vonalon keresztül'
  pt: 'Pedido através da linha de diagnóstico K/L'
periodicity: ['trigger']
senders: ['CMM']
receivers: ['BVA', 'AR2S', 'BSI']

signals:
  EOBD_CODE:
    bits: '1.7-1.0'
    comment:
      en: 'EOBD service code'
      fr: 'Code EOBD'
      es: 'Código EOBD'
      de: 'EOBD-Code'
      it: 'Codice EOBD'
      pl: 'Kod EOBD'
      ru: 'Код EOBD'
      zh: 'EOBD代码'
      hu: 'EOBD kód'
      pt: 'Código EOBD'
    type: 'enum'
    values:
      0x00:
        en: 'Variable'
        fr: 'Variable'
        es: 'Variable'
        de: 'Variabel'
        it: 'Variabile'
        pl: 'Zmienna'
        ru: 'Переменная'
        zh: '可变'
        hu: 'Változó'
        pt: 'Variável'

  EOBD_DATA:
    bits: '2.7-8.0'
    comment:
      en: 'EOBD data'
      fr: 'Donnée EOBD'
      es: 'Dato EOBD'
      de: 'EOBD-Daten'
      it: 'Dato EOBD'
      pl: 'Dane EOBD'
      ru: 'Данные EOBD'
      zh: 'EOBD数据'
      hu: 'EOBD adat'
      pt: 'Dado EOBD'
    type: 'uint'

alternatives:
  - note:
      en: 'Other layout observed for this frame (other software or car version)'
      fr: 'Autre disposition observée pour cette trame (autre version de logiciel ou de véhicule)'
      es: 'Otra disposición observada para esta trama (otra versión de software o de vehículo)'
      de: 'Andere beobachtete Belegung dieser Botschaft (andere Software- oder Fahrzeugversion)'
      it: 'Altra disposizione osservata per questo frame (altra versione di software o di vettura)'
      pl: 'Inny zaobserwowany układ tej ramki (inna wersja oprogramowania lub samochodu)'
      ru: 'Другая наблюдаемая раскладка этого кадра (другая версия ПО или автомобиля)'
      zh: '此帧观察到的另一种布局（其他软件或车型版本）'
      hu: 'A keret másik megfigyelt elrendezése (más szoftver- vagy autóverzió)'
      pt: 'Outra disposição observada para esta trama (outra versão de software ou de veículo)'
    periodicity: ['trigger']
    senders: ['CMM']
    receivers: ['SCDT', 'BVA', 'BSI']
    signals:
      EOBD_RESPONSE_MODE:
        bits: '1.7-1.0'
        comment:
          en: 'Mode of the EOBD request response'
          fr: 'Mode de la réponse à la requête E_OBD'
          es: 'Modo de la respuesta a la solicitud E_OBD'
          de: 'Modus der Antwort auf die E_OBD-Anfrage'
          it: 'Modalità della risposta alla richiesta E_OBD'
          pl: 'Tryb odpowiedzi na żądanie E_OBD'
          ru: 'Режим ответа на запрос E_OBD'
          zh: 'E_OBD请求响应模式'
          hu: 'Az E_OBD kérésre adott válasz módja'
          pt: 'Modo da resposta ao pedido E_OBD'
        type: 'uint'
      EOBD_REQUEST_DATA_CODE:
        bits: '2.7-8.0'
        comment:
          en: 'Data and code of the EOBD request'
          fr: 'Données et code de la requête E_OBD'
          es: 'Datos y código de la solicitud E_OBD'
          de: 'Daten und Code der E_OBD-Anfrage'
          it: 'Dati e codice della richiesta E_OBD'
          pl: 'Dane i kod żądania E_OBD'
          ru: 'Данные и код запроса E_OBD'
          zh: 'E_OBD请求的数据与代码'
          hu: 'Az E_OBD kérés adatai és kódja'
          pt: 'Dados e código do pedido E_OBD'
        type: 'uint'
