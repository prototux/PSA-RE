id: 0x589
name: 'GEARBOX_DATA_3'
type: 'can'
length: 2
comment:
  en: 'Gearbox data: gear-change refused, fault state, start inhibition, sport mode, lever position display, driving program, engaged mechanical gear, target gear and driver-requested gear display.'
  fr: 'Données boîte de vitesses : changement de rapport refusé, état de défaut, inhibition de démarrage, mode sport, affichage position levier, programme de conduite, rapport mécanique engagé, rapport cible et affichage du rapport demandé par le conducteur.'
  es: 'Datos de la caja de cambios: cambio de marcha rechazado, estado de fallo, inhibición de arranque, modo deportivo, visualización de posición de palanca, programa de conducción, marcha mecánica engranada, marcha objetivo y visualización de la marcha solicitada por el conductor.'
  de: 'Getriebedaten: Gangwechsel abgelehnt, Fehlerzustand, Startsperre, Sportmodus, Hebelpositionsanzeige, Fahrprogramm, eingelegter mechanischer Gang, Zielgang und Anzeige des vom Fahrer angeforderten Gangs.'
  it: 'Dati del cambio: cambio marcia rifiutato, stato di guasto, inibizione avviamento, modalità sport, visualizzazione posizione leva, programma di guida, marcia meccanica innestata, marcia obiettivo e visualizzazione della marcia richiesta dal guidatore.'
  pl: 'Dane skrzyni biegów: odmowa zmiany biegu, stan usterki, blokada rozruchu, tryb sportowy, wyświetlanie pozycji dźwigni, program jazdy, włączony bieg mechaniczny, bieg docelowy i wyświetlanie biegu żądanego przez kierowcę.'
  ru: 'Данные коробки передач: отказ переключения передачи, статус неисправности, блокировка запуска, спортивный режим, отображение положения рычага, программа движения, включённая механическая передача, целевая передача и отображение передачи, запрошенной водителем.'
  zh: '变速箱数据:换挡被拒绝、故障状态、启动抑制、运动模式、换挡杆位置显示、驾驶程序、已啮合的机械挡位、目标挡位以及驾驶员请求挡位显示。'
  hu: 'Váltóadatok: fokozatváltás elutasítva, hibaállapot, indítástiltás, sport mód, váltókar pozíció kijelzése, vezetési program, bekapcsolt mechanikus fokozat, célfokozat és a vezető által kért fokozat kijelzése.'
  pt: 'Dados da caixa de velocidades: mudança recusada, estado de avaria, inibição de arranque, modo desportivo, apresentação da posição da alavanca, programa de condução, relação mecânica engrenada, relação-alvo e apresentação da relação pedida pelo condutor.'
observations:
  en: 'Mixed frame: periodic every 1000 ms and/or on state change of: GEARBOX_LOW_SPEED_LIMITATION_REQUEST, GEARBOX_HIGH_SPEED_LIMITATION_REQUEST'
  fr: 'Trame mixte : périodique toutes les 1000 ms et/ou sur changement d''état de : GEARBOX_LOW_SPEED_LIMITATION_REQUEST, GEARBOX_HIGH_SPEED_LIMITATION_REQUEST'
  es: 'Trama mixta: periódica cada 1000 ms y/o al cambiar el estado de: GEARBOX_LOW_SPEED_LIMITATION_REQUEST, GEARBOX_HIGH_SPEED_LIMITATION_REQUEST'
  de: 'Mixte-Frame: periodisch alle 1000 ms und/oder bei Statusänderung von: GEARBOX_LOW_SPEED_LIMITATION_REQUEST, GEARBOX_HIGH_SPEED_LIMITATION_REQUEST'
  it: 'Frame misto: periodico ogni 1000 ms e/o al cambiamento di stato di: GEARBOX_LOW_SPEED_LIMITATION_REQUEST, GEARBOX_HIGH_SPEED_LIMITATION_REQUEST'
  pl: 'Ramka mieszana: wysyłana okresowo co 1000 ms i/lub przy zmianie stanu: GEARBOX_LOW_SPEED_LIMITATION_REQUEST, GEARBOX_HIGH_SPEED_LIMITATION_REQUEST'
  ru: 'Смешанный кадр: периодический каждые 1000 мс и/или при изменении состояния: GEARBOX_LOW_SPEED_LIMITATION_REQUEST, GEARBOX_HIGH_SPEED_LIMITATION_REQUEST'
  zh: '混合帧:每1000毫秒周期发送,和/或当DDE_LIM_B_VIT_BV, DDE_LIM_H_VIT_BV状态变化时发送'
  hu: 'Vegyes keret: 1000 ms-onként periodikus és/vagy a GEARBOX_LOW_SPEED_LIMITATION_REQUEST, GEARBOX_HIGH_SPEED_LIMITATION_REQUEST állapotváltozásakor küldve'
  pt: 'Trama mista: periódica a cada 1000 ms e/ou na mudança de estado de: GEARBOX_LOW_SPEED_LIMITATION_REQUEST, GEARBOX_HIGH_SPEED_LIMITATION_REQUEST'
periodicity: ['1000ms', 'trigger']
senders: ['BVA']
receivers: ['CMM']

signals:
  GEARBOX_COUPLING_TEMPERATURE:
    bits: '1.7-1.0'
    comment:
      en: 'Gearbox coupling temperature summary'
      fr: 'Synthèse des températures de couplage de la boîte de vitesses'
      es: 'Resumen de las temperaturas de acoplamiento de la caja de cambios'
      de: 'Zusammenfassung der Kupplungstemperaturen des Getriebes'
      it: 'Sintesi delle temperature di accoppiamento del cambio'
      pl: 'Podsumowanie temperatur sprzęgania skrzyni biegów'
      ru: 'Сводная температура сцепления коробки передач'
      zh: '变速箱联轴温度汇总'
      hu: 'A váltó tengelykapcsoló-hőmérsékleteinek összefoglalása'
      pt: 'Resumo das temperaturas de acoplamento da caixa de velocidades'
    type: 'uint'
    factor: 2
    offset: -40
    min: -40
    max: 466
    units: '°C'
    invalid: 0xFF
    default: 0xFE

  UNUSED_1:
    bits: '2.7-2.0'
    unused: true
