id: 0x34D
name: 'ESP_SYNCHRONISATION_DATA'
type: 'can'
length: 8
comment:
  en: 'ESP synchronisation data: ESP disconnected, ASR+ state, hill-start assist state, ESP regulation and warning-lamp requests.'
  fr: 'Données de synchronisation ESP : ESP déconnecté, état ASR+, état assistance au démarrage en côte, régulation ESP et demandes de voyant.'
  es: 'Datos de sincronización ESP: ESP desconectado, estado ASR+, estado de asistencia de arranque en pendiente, regulación ESP y solicitudes de testigo.'
  de: 'ESP-Synchronisationsdaten: ESP getrennt, ASR+-Status, Berganfahrhilfe-Status, ESP-Regelung und Kontrollleuchtenanforderungen.'
  it: 'Dati di sincronizzazione ESP: ESP disconnesso, stato ASR+, stato assistenza partenza in salita, regolazione ESP e richieste spia.'
  pl: 'Dane synchronizacji ESP: ESP odłączony, stan ASR+, stan asystenta ruszania pod górę, regulacja ESP i żądania kontrolki.'
  ru: 'Данные синхронизации ESP: ESP отключён, статус ASR+, статус ассистента старта в гору, регулирование ESP и запросы индикатора.'
  zh: 'ESP同步数据:ESP断开、ASR+状态、上坡辅助状态、ESP调节和警示灯请求。'
  hu: 'ESP szinkronizációs adatok: ESP lekapcsolva, ASR+ állapot, hegyimenet-segítő állapota, ESP szabályozás és jelzőlámpa-kérések.'
  pt: 'Dados de sincronização do ESP: ESP desativado, estado do ASR+, estado da ajuda ao arranque em subida, regulação do ESP e pedidos da luz avisadora.'
periodicity: ['20ms']
senders: ['ABS']
receivers:
  - 'CVM'
  - 'DAE'
  - 'BHI'
  - 'ASR'
  - 'SCDT'
  - 'FSE'
  - 'CSS'
  - 'CMM'
  - 'CAAR'
  - 'BVA'
  - 'AR2S'
  - 'BSI'
  - 'AAS'
  - 'HCU1'
  - 'ARTIV'

