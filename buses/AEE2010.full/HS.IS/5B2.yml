id: 0x5B2
name: 'CONTEXT'
type: 'can'
length: 8
comment:
  en: 'Context data: SCR load-shedding, service interval exceeded and maintenance reset acknowledgement.'
  fr: 'Données de contexte : délestage SCR, dépassement de l''échéance d''entretien et accusé de remise à zéro entretien.'
  es: 'Datos de contexto: reducción de carga SCR, vencimiento del intervalo de mantenimiento y confirmación de reinicio de mantenimiento.'
  de: 'Kontextdaten: SCR-Lastabwurf, überschrittenes Wartungsintervall und Bestätigung des Wartungsresets.'
  it: 'Dati di contesto: riduzione carico SCR, intervallo di manutenzione superato e conferma di reset manutenzione.'
  pl: 'Dane kontekstowe: zrzut obciążenia SCR, przekroczony interwał przeglądu i potwierdzenie kasowania przeglądu.'
  ru: 'Контекстные данные: сброс нагрузки SCR, превышение интервала обслуживания и подтверждение сброса напоминания об обслуживании.'
  zh: '上下文数据:SCR减载、保养周期超期以及保养复位确认。'
  hu: 'Kontextus adatok: SCR terheléscsökkentés, szerviz esedékesség túllépése és szerviz-nullázás visszaigazolása.'
  pt: 'Dados de contexto: corte de carga SCR, intervalo de revisão excedido e confirmação de reposição da manutenção.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['DSG', 'CSS', 'ABS', 'CMM', 'BVA', 'AR2S', 'HCU1', 'ARTIV']

signals:
  TOTAL_ADDITIVE_QUANTITY:
    bits: '1.7-2.0'
    comment:
      en: 'Mass of metal additive retained in the particulate filter since commissioning'
      fr: 'Masse d''additif métallique retenue dans le filtre à particules depuis sa mise en service'
      es: 'Masa de aditivo metálico retenida en el filtro de partículas desde su puesta en servicio'
      de: 'Seit Inbetriebnahme im Partikelfilter zurückgehaltene Menge an Metalladditiv'
      it: 'Massa di additivo metallico trattenuta nel filtro antiparticolato dalla sua messa in servizio'
      pl: 'Masa dodatku metalicznego zatrzymana w filtrze cząstek stałych od uruchomienia'
      ru: 'Масса металлической присадки, накопленной в сажевом фильтре с момента ввода в эксплуатацию'
      zh: '自投入使用以来颗粒过滤器中保留的金属添加剂质量'
      hu: 'Az üzembe helyezés óta a részecskeszűrőben megkötött fém adalékanyag tömege'
      pt: 'Massa de aditivo metálico retida no filtro de partículas desde a sua entrada em serviço'
    type: 'uint'
    factor: 0.05
    min: 0
    max: 3276.5
    units: 'g'
    invalid: 0xFFFF
    default: 0xFFFF

  OUTSIDE_AIR_TEMPERATURE:
    bits: '3.7-3.0'
    comment:
      en: 'Outside air temperature (°C)'
      fr: 'Température d''air extérieur (°C)'
      es: 'Temperatura del aire exterior (°C)'
      de: 'Außenlufttemperatur (°C)'
      it: 'Temperatura dell''aria esterna (°C)'
      pl: 'Temperatura powietrza zewnętrznego (°C)'
      ru: 'Температура наружного воздуха (°C)'
      zh: '车外空气温度(°C)'
      hu: 'Külső levegő hőmérséklete (°C)'
      pt: 'Temperatura do ar exterior (°C)'
    type: 'uint'
    factor: 0.5
    offset: -40
    min: -40
    max: 85
    units: '°C'
    invalid: 0xFF
    default: 0xFC

