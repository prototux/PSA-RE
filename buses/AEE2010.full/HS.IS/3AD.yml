id: 0x3AD
name: 'EASY_MOVE_BVH2_DATA'
type: 'can'
length: 8
comment:
  en: 'Easy Move data specific to the BVH2 gearbox variant: calibrated longitudinal acceleration, parking-brake force estimate, cruise-control inhibit request and fault states.'
  fr: 'Données Easy Move spécifiques à la variante boîte BVH2 : accélération longitudinale calibrée, estimation d''effort du frein de stationnement, demande d''inhibition du régulateur de vitesse et états de défaut.'
  es: 'Datos Easy Move específicos de la variante de caja BVH2: aceleración longitudinal calibrada, estimación de esfuerzo del freno de estacionamiento, solicitud de inhibición del control de crucero y estados de fallo.'
  de: 'Easy-Move-Daten speziell für die Getriebevariante BVH2: kalibrierte Längsbeschleunigung, geschätzte Feststellbremskraft, Sperranforderung des Tempomaten und Fehlerzustände.'
  it: 'Dati Easy Move specifici per la variante di cambio BVH2: accelerazione longitudinale calibrata, stima della forza del freno di stazionamento, richiesta di inibizione del cruise control e stati di guasto.'
  pl: 'Dane Easy Move specyficzne dla wariantu skrzyni BVH2: skalibrowane przyspieszenie wzdłużne, szacowana siła hamulca postojowego, żądanie zablokowania tempomatu i stany usterek.'
  ru: 'Данные Easy Move для варианта коробки передач BVH2: калиброванное продольное ускорение, оценка усилия стояночного тормоза, запрос блокировки круиз-контроля и статусы неисправностей.'
  zh: '针对BVH2变速箱型号的Easy Move专用数据:标定纵向加速度、驻车制动力估算值、巡航控制禁用请求及故障状态。'
  hu: 'A BVH2 váltóváltozatra jellemző Easy Move adatok: kalibrált hosszirányú gyorsulás, rögzítőfék-erő becslése, sebességtartó automatika letiltási kérése és hibaállapotok.'
  pt: 'Dados Easy Move específicos da variante de caixa de velocidades BVH2: aceleração longitudinal calibrada, estimativa da força do travão de estacionamento, pedido de inibição do regulador de velocidade e estados de avaria.'
periodicity: ['20ms']
senders: ['ABS']
receivers: ['AR2S', 'BSI', 'BVA', 'CAAR', 'CMM', 'HCU1']

