id: 0x513
name: 'ELECTRIC_PARKING_BRAKE_DATA'
type: 'can'
length: 8
comment:
  en: 'Electric (secondary) parking brake data: red warning-lamp alert, fault, button state, brake state, display and EasyMove function wake-up.'
  fr: 'Données du frein de parking électrique (secondaire) : alerte voyant rouge, défaut, état du bouton, état du frein, réveil affichage et fonction EasyMove.'
  es: 'Datos del freno de estacionamiento eléctrico (secundario): alerta de testigo rojo, fallo, estado del botón, estado del freno, activación de pantalla y función EasyMove.'
  de: 'Daten der elektrischen (sekundären) Feststellbremse: Warnung der roten Kontrollleuchte, Fehler, Tasterzustand, Bremszustand, Displayweckung und EasyMove-Funktion.'
  it: 'Dati del freno di stazionamento elettrico (secondario): allarme spia rossa, guasto, stato pulsante, stato freno, risveglio display e funzione EasyMove.'
  pl: 'Dane elektrycznego (wtórnego) hamulca postojowego: alarm czerwonej kontrolki, usterka, stan przycisku, stan hamulca, wybudzenie wyświetlacza i funkcja EasyMove.'
  ru: 'Данные электрического (вторичного) стояночного тормоза: сигнал красного индикатора, неисправность, состояние кнопки, состояние тормоза, пробуждение дисплея и функция EasyMove.'
  zh: '电子(辅助)驻车制动数据:红色警示灯警报、故障、按钮状态、制动状态、显示屏唤醒和EasyMove功能。'
  hu: 'Az elektromos (másodlagos) rögzítőfék adatai: piros jelzőlámpa riasztás, hiba, gombállapot, fékállapot, kijelző-ébresztés és EasyMove funkció.'
  pt: 'Dados do travão de estacionamento elétrico (secundário): alerta da luz avisadora vermelha, avaria, estado do botão, estado do travão, apresentação e ativação da função EasyMove.'
periodicity: ['50ms']
senders: ['FSE']
receivers: ['ABS', 'CAAR', 'BSI', 'HCU1']

