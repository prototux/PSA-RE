id: 0x4FE
name: 'ELECTRONIC_SHIFT_LEVER_DATA'
type: 'can'
length: 3
comment:
  en: 'Electronic gear-shift lever data: acknowledgement validation, brake request, fault, direction control, driver action, lever movement and position, unlock request.'
  fr: 'Données du levier de sélection électronique : validation d''acquittement, demande de frein, défaut, contrôle de direction, action conducteur, mouvement et position du levier, demande de déverrouillage.'
  es: 'Datos de la palanca de cambio electrónica: validación de confirmación, solicitud de freno, fallo, control de dirección, acción del conductor, movimiento y posición de la palanca, solicitud de desbloqueo.'
  de: 'Daten des elektronischen Schalthebels: Bestätigungsvalidierung, Bremsanforderung, Fehler, Richtungssteuerung, Fahreraktion, Hebelbewegung und -position, Entriegelungsanforderung.'
  it: 'Dati della leva del cambio elettronica: convalida di conferma, richiesta di freno, guasto, controllo direzione, azione del guidatore, movimento e posizione della leva, richiesta di sblocco.'
  pl: 'Dane elektronicznej dźwigni zmiany biegów: walidacja potwierdzenia, żądanie hamulca, usterka, sterowanie kierunkiem, działanie kierowcy, ruch i pozycja dźwigni, żądanie odblokowania.'
  ru: 'Данные электронного рычага переключения передач: подтверждение квитирования, запрос тормоза, неисправность, управление направлением, действие водителя, движение и положение рычага, запрос разблокировки.'
  zh: '电子换挡杆数据:确认验证、制动请求、故障、方向控制、驾驶员操作、换挡杆移动和位置、解锁请求。'
  hu: 'Az elektronikus váltókar adatai: nyugtázás érvényesítése, fékkérés, hiba, irányvezérlés, vezetői művelet, kar mozgása és pozíciója, kioldási kérés.'
  pt: 'Dados da alavanca eletrónica de mudanças: validação de confirmação, pedido de travão, avaria, controlo de direção, ação do condutor, movimento e posição da alavanca, pedido de destrancagem.'
observations:
  en: 'On state change of: MONOSTABLE_LEVER_POSITION, GEAR_LEVER_MOVEMENT, DRIVER_LEVER_TAKEOVER_REQUEST'
  fr: 'Sur changement d''état de : MONOSTABLE_LEVER_POSITION, GEAR_LEVER_MOVEMENT, DRIVER_LEVER_TAKEOVER_REQUEST'
  es: 'Al cambiar el estado de: MONOSTABLE_LEVER_POSITION, GEAR_LEVER_MOVEMENT, DRIVER_LEVER_TAKEOVER_REQUEST'
  de: 'Bei Statusänderung von: MONOSTABLE_LEVER_POSITION, GEAR_LEVER_MOVEMENT, DRIVER_LEVER_TAKEOVER_REQUEST'
  it: 'Al cambiamento di stato di: MONOSTABLE_LEVER_POSITION, GEAR_LEVER_MOVEMENT, DRIVER_LEVER_TAKEOVER_REQUEST'
  pl: 'Wysyłane przy zmianie stanu: MONOSTABLE_LEVER_POSITION, GEAR_LEVER_MOVEMENT, DRIVER_LEVER_TAKEOVER_REQUEST'
  ru: 'При изменении состояния: MONOSTABLE_LEVER_POSITION, GEAR_LEVER_MOVEMENT, DRIVER_LEVER_TAKEOVER_REQUEST'
  zh: '当POS_MONOSTABLE_LEVER, GEAR_LEVER_MOVEMENT, DRIVER_LEVER_TAKEOVER_REQUEST, ACPK_VALIDATION_REQEST状态变化时'
  hu: 'A(z) MONOSTABLE_LEVER_POSITION, GEAR_LEVER_MOVEMENT, DRIVER_LEVER_TAKEOVER_REQUEST állapotváltozásakor'
  pt: 'Na mudança de estado de: MONOSTABLE_LEVER_POSITION, GEAR_LEVER_MOVEMENT, DRIVER_LEVER_TAKEOVER_REQUEST'
periodicity: ['100ms', 'trigger']
senders: ['ESM', 'BSI']
receivers: ['CMM', 'BVA', 'AAS', 'SBW', 'ABS']

