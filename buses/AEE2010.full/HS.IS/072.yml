id: 0x072
name: 'ENGINE_UNLOCK_STATUS_BSI'
type: 'can'
length: 5
comment:
  en: 'Engine ECU status sent to the body controller, for the engine-immobiliser unlocking function.'
  fr: 'État du calculateur moteur envoyé à la BSI, pour la fonction de déverrouillage antidémarrage.'
  es: 'Estado de la centralita del motor enviado a la BSI, para la función de desbloqueo del inmovilizador.'
  de: 'An das Karosseriesteuergerät (BSI) gesendeter Motorsteuergerätestatus für die Wegfahrsperren-Entriegelungsfunktion.'
  it: 'Stato della centralina motore inviato alla BSI, per la funzione di sblocco dell''immobilizzatore.'
  pl: 'Stan sterownika silnika wysyłany do BSI, dla funkcji odblokowania immobilizera.'
  ru: 'Статус блока управления двигателем, отправляемый в BSI, для функции разблокировки иммобилайзера.'
  zh: '发送给车身控制器(BSI)的发动机控制单元状态,用于发动机防盗锁止解锁功能。'
  hu: 'A motorvezérlő állapota, amelyet a karosszéria-vezérlőegységnek (BSI) küld az indításgátló feloldási funkcióhoz.'
  pt: 'Estado da unidade de controlo do motor enviado ao computador de servidão, para a função de destrancagem do imobilizador do motor.'
observations:
  en: 'Event defined by the ADC MUX protocol, sent by the CMM, then periodically every 100 ms except while identical RQD frames are being sent'
  fr: 'Événement défini par le protocole ADC MUX, émis par the CMM, puis périodiquement toutes les 100 ms sauf pendant l''émission des trames RQD de même identifiant'
  es: 'Evento definido por el protocolo ADC MUX, enviado por the CMM, luego periódicamente cada 100 ms salvo durante el envío de tramas RQD del mismo identificador'
  de: 'Durch das ADC-MUX-Protokoll definiertes Ereignis, gesendet von the CMM, danach periodisch alle 100 ms außer während der Übertragung identischer RQD-Frames'
  it: 'Evento definito dal protocollo ADC MUX, inviato da the CMM, poi periodicamente ogni 100 ms tranne durante l''invio di frame RQD con lo stesso identificatore'
  pl: 'Zdarzenie zdefiniowane przez protokół ADC MUX, wysyłane przez the CMM, następnie okresowo co 100 ms z wyjątkiem czasu wysyłania ramek RQD o tym samym identyfikatorze'
  ru: 'Событие определяется протоколом ADC MUX, отправляется the CMM, затем периодически каждые 100 мс, кроме времени передачи кадров RQD с тем же идентификатором'
  zh: '由ADC MUX协议定义的事件,由the CMM发送,此后每100毫秒周期发送,发送相同标识符的RQD帧期间除外'
  hu: 'Az ADC MUX protokoll által meghatározott esemény, a the CMM küldi, majd 100 ms-onként periodikusan, kivéve az azonos azonosítójú RQD keretek küldése közben'
  pt: 'Evento definido pelo protocolo ADC MUX, enviado pela CMM, depois periodicamente a cada 100 ms, exceto enquanto são enviadas tramas RQD idênticas'
periodicity: ['trigger']
senders: ['CMM']
receivers: ['BSI']

