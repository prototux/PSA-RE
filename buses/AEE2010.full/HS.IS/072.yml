        pt: 'Bloqueado'

  UNUSED_1:
    bits: '3.7-3.0'
    unused: true

  UNUSED_2:
    bits: '4.7-4.0'
    unused: true

  UNUSED_3:
    bits: '5.7-5.0'
    unused: true

