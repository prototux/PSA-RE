id: 0x0A8
name: 'IMMO_RESPONSE'
type: 'can'
length: 5
comment:
  en: 'Unlocking confirmation frame sent by the BSI to the engine ECU.'
  fr: 'Trame de confirmation de déverrouillage envoyée par la BSI au calculateur moteur.'
  es: 'Trama de confirmación de desbloqueo enviada por la BSI a la centralita del motor.'
  de: 'Entriegelungsbestätigungsrahmen, von der BSI an das Motorsteuergerät gesendet.'
  it: 'Trama di conferma di sblocco inviata dalla BSI alla centralina motore.'
  pl: 'Ramka potwierdzenia odblokowania wysyłana przez BSI do sterownika silnika.'
  ru: 'Кадр подтверждения разблокировки, отправляемый BSI в ЭБУ двигателя.'
  zh: '由BSI发送给发动机ECU的解锁确认帧。'
  hu: 'A BSI feloldási megerősítő kerete, a motorvezérlő egységnek küldve.'
  pt: 'Trama de confirmação de destrancagem enviada pela BSI à unidade de controlo do motor.'
observations:
  en: 'Event defined by the ADC MUX protocol'
  fr: 'Événement défini par le protocole ADC MUX'
  es: 'Evento definido por el protocolo ADC MUX'
  de: 'Durch das ADC-MUX-Protokoll definiertes Ereignis'
  it: 'Evento definito dal protocollo ADC MUX'
  pl: 'Zdarzenie zdefiniowane przez protokół ADC MUX'
  ru: 'Событие определяется протоколом ADC MUX'
  zh: '由ADC MUX协议定义的事件'
  hu: 'Az ADC MUX protokoll által meghatározott esemény'
  pt: 'Evento definido pelo protocolo ADC MUX'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['CMM']

