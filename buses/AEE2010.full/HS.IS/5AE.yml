id: 0x5AE
name: 'RITCS_DATA'
type: 'can'
length: 5
comment:
  en: 'RITCS data 2: blower motor faults, AC compressor and low-beam status, eCall crash trigger, washer fluid level alert, and cruise-control/speed-limiter selection buttons.'
  fr: 'Données RITCS 2 : défauts moteur pulseur, état compresseur clim et feux de croisement, déclenchement crash eCall, alerte niveau liquide lave-glace, et boutons de sélection régulateur/limiteur de vitesse.'
  es: 'Datos RITCS 2: fallos del motor del ventilador, estado del compresor de A/C y luces de cruce, disparo de choque eCall, alerta de nivel de líquido lavaparabrisas, y botones de selección de regulador/limitador de velocidad.'
  de: 'RITCS-Daten 2: Gebläsemotorfehler, Klimakompressor- und Abblendlichtstatus, eCall-Crash-Auslösung, Warnung Waschwasserstand, sowie Auswahltasten für Tempomat/Geschwindigkeitsbegrenzer.'
  it: 'Dati RITCS 2: guasti motore ventola, stato compressore A/C e anabbaglianti, attivazione crash eCall, allarme livello liquido lavavetro, e pulsanti di selezione regolatore/limitatore di velocità.'
  pl: 'Dane RITCS 2: usterki silnika dmuchawy, stan sprężarki klimatyzacji i świateł mijania, wyzwolenie zderzenia eCall, alarm poziomu płynu spryskiwacza oraz przyciski wyboru tempomatu/ogranicznika prędkości.'
  ru: 'Данные RITCS 2: неисправности мотора вентилятора, статус компрессора кондиционера и ближнего света, срабатывание eCall при аварии, предупреждение об уровне жидкости омывателя, а также кнопки выбора круиз-контроля/ограничителя скорости.'
  zh: 'RITCS数据2:鼓风机电机故障、空调压缩机和近光灯状态、eCall碰撞触发、洗涤液液位警报,以及巡航控制/限速器选择按钮。'
  hu: 'RITCS adatok 2: fűtőventilátor-motor hibák, klímakompresszor és tompított fény állapota, eCall ütközésjelzés, mosófolyadékszint-riasztás, valamint tempomat/sebességhatároló választógombok.'
  pt: 'Dados 2 do RITCS: avarias do motor do ventilador, estado do compressor de ar condicionado e dos médios, acionamento de colisão eCall, alerta de nível do líquido lava-vidros e botões de seleção do regulador de velocidade/limitador de velocidade.'
periodicity: ['1000ms']
senders: ['BSI']

