id: 0x53F
name: 'LANE_DEPARTURE_WARNING_RIGHT_STATUS'
type: 'can'
length: 2
comment:
  en: 'Right-side lane-departure warning status: warning active, alert arc, catch-up and rest states, functional side.'
  fr: 'État de l''avertisseur de franchissement de ligne côté droit : avertissement actif, arc d''alerte, états rattrapage et repos, côté fonctionnel.'
  es: 'Estado del avisador de salida de carril lado derecho: aviso activo, arco de alerta, estados de recuperación y reposo, lado funcional.'
  de: 'Status der Spurverlassenswarnung rechts: Warnung aktiv, Warnbogen, Nachführ- und Ruhezustand, funktionale Seite.'
  it: 'Stato dell''avviso di superamento corsia lato destro: avviso attivo, arco di allerta, stati di recupero e riposo, lato funzionale.'
  pl: 'Stan ostrzegania o zjeżdżaniu z pasa po prawej stronie: ostrzeżenie aktywne, łuk alarmu, stany dogonienia i spoczynku, strona funkcjonalna.'
  ru: 'Статус предупреждения о выезде из полосы справа: предупреждение активно, дуга оповещения, состояния наверстывания и покоя, функциональная сторона.'
  zh: '右侧车道偏离预警状态:预警激活、警示弧、追赶和静止状态、功能侧。'
  hu: 'A jobb oldali sávelhagyás-figyelmeztetés állapota: figyelmeztetés aktív, riasztási ív, utolérési és nyugalmi állapotok, funkcionális oldal.'
  pt: 'Estado do aviso de saída de faixa do lado direito: aviso ativo, arco de alerta, estados de recuperação e repouso, lado funcional.'
periodicity: ['100ms']
senders: ['BSM']
receivers: ['BSI']

