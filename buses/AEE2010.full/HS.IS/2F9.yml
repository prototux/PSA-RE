      pl: 'CRC klastra czujników inercyjnych'
      ru: 'CRC инерциального блока датчиков'
      zh: '惯性传感器组CRC'
      hu: 'A tehetetlenségi érzékelő-egység CRC-je'
      pt: 'CRC do conjunto de sensores inerciais'
