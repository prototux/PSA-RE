id: 0x2F9
name: 'YAW_LATERAL_LONGITUDINAL_SENSOR_DATA'
type: 'can'
length: 7
comment:
  en: 'Bosch triple sensor data: lateral and longitudinal acceleration, yaw rate, raw-value validity flags and under/over-voltage status.'
  fr: 'Données du tricapteur Bosch : accélération latérale et longitudinale, vitesse de lacet, indicateurs de validité des valeurs brutes et état de sous/surtension.'
  es: 'Datos del tricapteur Bosch: aceleración lateral y longitudinal, velocidad de guiñada, indicadores de validez de los valores brutos y estado de sub/sobretensión.'
  de: 'Daten des Bosch-Dreifachsensors: Quer- und Längsbeschleunigung, Gierrate, Gültigkeitsflags der Rohwerte und Unter-/Überspannungsstatus.'
  it: 'Dati del triplo sensore Bosch: accelerazione laterale e longitudinale, velocità di imbardata, indicatori di validità dei valori grezzi e stato di sotto/sovratensione.'
  pl: 'Dane potrójnego czujnika Bosch: przyspieszenie boczne i wzdłużne, prędkość odchylania, flagi ważności wartości surowych oraz stan pod-/przenapięcia.'
  ru: 'Данные тройного датчика Bosch: боковое и продольное ускорение, скорость рыскания, флаги достоверности сырых значений и статус пониженного/повышенного напряжения.'
  zh: '博世三合一传感器数据:横向和纵向加速度、横摆角速度、原始值有效性标志以及欠压/过压状态。'
  hu: 'A Bosch hármas érzékelő adatai: keresztirányú és hosszirányú gyorsulás, legyezési szögsebesség, a nyers értékek érvényességi jelzői, valamint az alul-/túlfeszültség állapota.'
  pt: 'Dados do sensor triplo Bosch: aceleração lateral e longitudinal, velocidade de guinada, indicadores de validade dos valores em bruto e estado de subtensão/sobretensão.'
periodicity: ['10ms']
senders: ['ACCEL_SENSOR']
receivers: ['ABS', 'ACC']

