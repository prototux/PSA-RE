id: 0x38D
name: 'VEHICLE_DYNAMICS_WHEELS'
type: 'can'
length: 8
comment:
  en: 'Vehicle speed, distance and longitudinal acceleration computed from the wheels, plus a warning-lamp request.'
  fr: 'Vitesse véhicule, distance et accélération longitudinale calculées à partir des roues, ainsi qu''une demande de voyant.'
  es: 'Velocidad del vehículo, distancia y aceleración longitudinal calculadas a partir de las ruedas, además de una solicitud de testigo.'
  de: 'Aus den Rädern berechnete Fahrzeuggeschwindigkeit, Strecke und Längsbeschleunigung, sowie eine Kontrollleuchtenanforderung.'
  it: 'Velocità veicolo, distanza e accelerazione longitudinale calcolate dalle ruote, oltre a una richiesta spia.'
  pl: 'Prędkość pojazdu, dystans i przyspieszenie wzdłużne obliczone na podstawie kół, oraz żądanie kontrolki.'
  ru: 'Скорость автомобиля, расстояние и продольное ускорение, рассчитанные по колёсам, а также запрос индикатора.'
  zh: '根据车轮计算的车速、距离和纵向加速度,以及警示灯请求。'
  hu: 'A kerekekből számított jármű sebesség, táv és hosszirányú gyorsulás, valamint egy jelzőlámpa-kérés.'
  pt: 'Velocidade do veículo, distância e aceleração longitudinal calculadas a partir das rodas, além de um pedido da luz avisadora.'
periodicity: ['40ms']
senders: ['ABS']
receivers:
  - 'SBW'
  - 'CVM'
  - 'ESM'
  - 'BHI'
  - 'BSI'
  - 'DAE'
  - 'SCDT'
  - 'BCP'
  - 'FSE'
  - 'CSS'
  - 'CMM'
  - 'CAAR'
  - 'BVA'
  - 'AR2S'
  - 'DSG'
  - 'BEBA'
  - 'AAS'
  - 'HCU1'
  - 'BSM'
  - 'ARTIV'
  - 'CAV'

signals:
  VEHICLE_SPEED_WHEEL_SENSORS:
    bits: '1.7-2.0'
    comment:
      en: 'Vehicle speed (wheel sensors)'
      fr: 'Vitesse du véhicule (capteurs de roues)'
      es: 'Velocidad del vehículo (sensores de rueda)'
      de: 'Fahrzeuggeschwindigkeit (Raddrehzahlsensoren)'
      it: 'Velocità del veicolo (sensori ruota)'
      pl: 'Prędkość pojazdu (czujniki kół)'
      ru: 'Скорость автомобиля (датчики колёс)'
      zh: '车速(车轮传感器)'
      hu: 'Járműsebesség (kerékérzékelők)'
      pt: 'Velocidade do veículo (sensores de roda)'
    type: 'uint'
    factor: 0.01
    min: 0
    max: 655.34
    units: 'km/h'
    invalid: 0xFFFF
    default: 0xFFFF

  ODOMETER_WHEEL_SENSOR:
