id: 0x7E5
name: 'EOBD_REQUEST_ON_CAN_7'
type: 'can'
length: 8
comment:
  en: 'EOBD diagnostic request broadcast on the CAN bus to all ECUs'
  fr: 'Requête de diagnostic EOBD diffusée sur le bus CAN à tous les calculateurs'
  es: 'Solicitud de diagnóstico EOBD difundida en el bus CAN a todas las centralitas'
  de: 'EOBD-Diagnoseanfrage, auf dem CAN-Bus an alle Steuergeräte gesendet'
  it: 'Richiesta diagnostica EOBD trasmessa sul bus CAN a tutte le centraline'
  pl: 'Żądanie diagnostyczne EOBD rozgłaszane na magistrali CAN do wszystkich sterowników'
  ru: 'Диагностический запрос EOBD, рассылаемый по шине CAN всем блокам управления'
  zh: '通过CAN总线向所有ECU广播的EOBD诊断请求'
  hu: 'Az összes vezérlőegységnek szóló, CAN-buszon szórt EOBD diagnosztikai kérés'
  pt: 'Pedido de diagnóstico EOBD difundido na rede CAN para todas as ECU.'
observations:
  en: 'Event-triggered, sent from the diagnostic tool to the GAS function hosted in an ECU via BSI.'
  fr: 'Événementiel, envoyé de l''outil de diagnostic vers la fonction GAZ hébergée dans un calculateur via la BSI.'
  es: 'Basado en eventos, enviado desde la herramienta de diagnóstico hasta la función GAS alojada en una ECU a través de la BSI.'
  de: 'Ereignisgesteuert, gesendet von das Diagnosegerät zu die in einem Steuergerät gehostete GAS-Funktion über die BSI.'
  it: 'Basato su eventi, inviato da lo strumento diagnostico a la funzione GAS ospitata in una centralina tramite la BSI.'
  pl: 'Zdarzeniowe, wysyłane z narzędzie diagnostyczne do funkcja GAZ hostowana w sterowniku przez BSI.'
  ru: 'Событийное, передаётся от диагностический прибор к функция GAZ, размещённая в блоке управления через BSI.'
  zh: '事件触发,从诊断工具发送到承载于某ECU中的GAS功能通过BSI。'
  hu: 'Eseményvezérelt, a diagnosztikai eszköz-tól egy vezérlőegységben futó GAS funkció felé küldve a BSI-n keresztül.'
  pt: 'Baseado em eventos, enviado da ferramenta de diagnóstico para a função GAS alojada numa unidade de controlo via BSI.'
periodicity: ['trigger']
senders: ['DIAG_TOOL']
receivers: ['CGPL']

signals:
  DIAGNOSTIC_DATA:
    bits: '1.7-8.0'
    comment:
      en: 'Diagnostic data'
      fr: 'Données de diagnostic'
      es: 'Datos de diagnóstico'
      de: 'Diagnosedaten'
      it: 'Dati diagnostici'
      pl: 'Dane diagnostyczne'
      ru: 'Диагностические данные'
      zh: '诊断数据'
      hu: 'Diagnosztikai adatok'
      pt: 'Dados de diagnóstico'
    type: 'uint'
