id: 0x092
name: 'ELECTRONICS_INTEGRITY_DIAG'
type: 'can'
length: 1
comment:
  en: 'Electronics integrity diagnostic frame from the hybrid control unit (HCU1), sent every 100 ms for one second: diagnostic mode and fault-clear request.'
  fr: 'Trame de diagnostic d''intégrité électronique du calculateur hybride (HCU1), émise toutes les 100 ms pendant une seconde : mode diagnostic et demande d''effacement défaut.'
  es: 'Trama de diagnóstico de integridad electrónica de la unidad de control híbrida (HCU1), enviada cada 100 ms durante un segundo: modo de diagnóstico y solicitud de borrado de fallo.'
  de: 'Elektronik-Integritätsdiagnoserahmen vom Hybridsteuergerät (HCU1), alle 100 ms für eine Sekunde gesendet: Diagnosemodus und Fehlerlöschanforderung.'
  it: 'Trama di diagnostica dell''integrità elettronica dalla centralina ibrida (HCU1), inviata ogni 100 ms per un secondo: modalità diagnostica e richiesta di cancellazione guasto.'
  pl: 'Ramka diagnostyki integralności elektroniki ze sterownika hybrydowego (HCU1), wysyłana co 100 ms przez jedną sekundę: tryb diagnostyczny i żądanie kasowania usterki.'
  ru: 'Кадр диагностики целостности электроники от гибридного блока управления (HCU1), отправляемый каждые 100 мс в течение одной секунды: диагностический режим и запрос очистки неисправности.'
  zh: '来自混合动力控制单元(HCU1)的电子完整性诊断帧,每100毫秒发送一次,持续一秒:诊断模式及故障清除请求。'
  hu: 'Elektronikai integritás diagnosztikai keret a hibrid vezérlőegységtől (HCU1), 100 ms-onként egy másodpercig küldve: diagnosztikai mód és hibatörlési kérés.'
  pt: 'Trama de diagnóstico de integridade eletrónica da unidade de controlo híbrida (HCU1), enviada a cada 100 ms durante um segundo: modo de diagnóstico e pedido de apagamento de avaria.'
observations:
  en: 'Event-triggered, sent from BSI to the inter-system ECUs.'
  fr: 'Événementiel, envoyé de BSI vers les calculateurs inter-systèmes.'
  es: 'Basado en eventos, enviado desde BSI hasta las ECU intersistemas.'
  de: 'Ereignisgesteuert, gesendet von BSI zu die systemübergreifenden Steuergeräte.'
  it: 'Basato su eventi, inviato da BSI a le centraline inter-sistema.'
  pl: 'Zdarzeniowe, wysyłane z BSI do sterowniki międzysystemowe.'
  ru: 'Событийное, передаётся от BSI к межсистемные блоки управления.'
  zh: '事件触发,从BSI发送到跨系统ECU。'
  hu: 'Eseményvezérelt, BSI-tól a rendszerközi vezérlőegységek felé küldve.'
  pt: 'Baseado em eventos, enviado da BSI para as unidades de controlo intersistema.'
periodicity: ['trigger']
senders: ['BSI']
receivers:
  - 'ESM'
  - 'AR2S'
  - 'BVA'
  - 'CAAR'
  - 'ACCEL_SENSOR'
  - 'CAV'
  - 'CMM'
  - 'CSS'
  - 'DSG'
  - 'FSE'
  - 'BCP'
  - 'SBW'
  - 'SCDT'
  - 'BHI'
  - 'TBMU'
  - 'ACC'
  - 'ARTIV'
  - 'BEBA'
  - 'ABS'
  - 'BSM'
  - 'HCU1'
  - 'DAE'
  - 'DMTR'

