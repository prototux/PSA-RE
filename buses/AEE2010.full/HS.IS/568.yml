      es: 'Corrección promediada de la regulación de la riqueza de mezcla'
      de: 'Gemittelte Korrektur der Gemischregelung'
      it: 'Correzione media della regolazione del titolo aria-carburante'
      pl: 'Uśredniona korekta regulacji bogactwa mieszanki'
      ru: 'Усреднённая коррекция регулирования состава смеси'
      zh: '空燃比调节的平均修正值'
      hu: 'A levegő-üzemanyag arány szabályozásának átlagolt korrekciója'
      pt: 'Correção média da regulação da riqueza da mistura'
    type: 'uint'
