id: 0x7EF
name: 'EOBD_REQUEST_ON_CAN_12'
type: 'can'
length: 8
comment:
  en: 'EOBD response relayed onto the CAN bus by the hybrid control unit (HCU2), from AR2S to the diagnostic tool.'
  fr: 'Réponse EOBD relayée sur le réseau CAN par le calculateur hybride (HCU2), de l''AR2S vers l''outil de diagnostic.'
  es: 'Respuesta EOBD retransmitida al bus CAN por la unidad de control híbrida (HCU2), del AR2S a la herramienta de diagnóstico.'
  de: 'EOBD-Antwort, vom Hybridsteuergerät (HCU2) auf den CAN-Bus weitergeleitet, vom AR2S an das Diagnosetool.'
  it: 'Risposta EOBD inoltrata sul bus CAN dall''unità di controllo ibrida (HCU2), dall''AR2S allo strumento di diagnosi.'
  pl: 'Odpowiedź EOBD przekazywana na magistrale CAN przez sterownik hybrydowy (HCU2), z AR2S do narzędzia diagnostycznego.'
  ru: 'Ответ EOBD, ретранслируемый на шину CAN гибридным блоком управления (HCU2), от AR2S к диагностическому инструменту.'
  zh: '由混合动力控制单元(HCU2)转发到CAN总线的EOBD响应,从AR2S发送给诊断工具。'
  hu: 'A hibrid vezérlőegység (HCU2) által a CAN buszra továbbított EOBD válasz, az AR2S-től a diagnosztikai eszköz felé.'
  pt: 'Resposta EOBD retransmitida na rede CAN pela unidade de controlo híbrida (HCU2), do AR2S para a ferramenta de diagnóstico.'
observations:
  en: 'Event-triggered, sent from the diagnostic tool to the ECUs.'
  fr: 'Événementiel, envoyé de l''outil de diagnostic vers les calculateurs.'
  es: 'Basado en eventos, enviado desde la herramienta de diagnóstico hasta las ECU.'
  de: 'Ereignisgesteuert, gesendet von das Diagnosegerät zu die Steuergeräte.'
  it: 'Basato su eventi, inviato da lo strumento diagnostico a le centraline.'
  pl: 'Zdarzeniowe, wysyłane z narzędzie diagnostyczne do sterowniki.'
  ru: 'Событийное, передаётся от диагностический прибор к блоки управления.'
  zh: '事件触发,从诊断工具发送到各ECU。'
  hu: 'Eseményvezérelt, a diagnosztikai eszköz-tól a vezérlőegységek felé küldve.'
  pt: 'Baseado em eventos, enviado da ferramenta de diagnóstico para as unidades de controlo.'
periodicity: ['trigger']
senders: ['CMM', 'HCU1']
receivers: ['DIAG_TOOL']

signals:
  DIAGNOSTIC_DATA:
    bits: '1.7-8.0'
    comment:
      en: 'Diagnostic data'
      fr: 'Données de diagnostic'
      es: 'Datos de diagnóstico'
      de: 'Diagnosedaten'
      it: 'Dati diagnostici'
      pl: 'Dane diagnostyczne'
      ru: 'Диагностические данные'
      zh: '诊断数据'
      hu: 'Diagnosztikai adatok'
      pt: 'Dados de diagnóstico'
    type: 'uint'
