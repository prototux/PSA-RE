        fr: 'Assistance activée en mode nominal'
        es: 'Asistencia activada en modo nominal'
        de: 'Assistenz im Nominalmodus aktiviert'
        it: 'Assistenza attivata in modalità nominale'
        pl: 'Wspomaganie aktywowane w trybie nominalnym'
        ru: 'Помощь активирована в номинальном режиме'
        zh: '辅助功能在标称模式下已激活'
        hu: 'Segítségnyújtás aktiválva névleges üzemmódban'
