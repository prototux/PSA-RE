        ru: 'Помощь активирована в деградированном режиме'
        zh: '辅助功能在降级模式下已激活'
        hu: 'Segítségnyújtás aktiválva korlátozott üzemmódban'
        pt: 'Assistência ativada em modo degradado'
      0x03:
        en: 'Assistance activated in STTa mode'
        fr: 'Assistance activée en mode STTa'
        es: 'Asistencia activada en modo STTa'
        de: 'Unterstützung im STTa-Modus aktiviert'
        it: 'Assistenza attivata in modalità STTa'
        pl: 'Wspomaganie aktywne w trybie STTa'
        ru: 'Помощь активирована в режиме STTa'
        zh: 'STTa模式下辅助已激活'
        hu: 'Segédfunkció aktiválva STTa módban'
        pt: 'Assistência ativada em modo STTa'
      0x04:
        en: 'Assistance activated in STTd mode'
        fr: 'Assistance activée en mode STTd'
        es: 'Asistencia activada en modo STTd'
        de: 'Unterstützung im STTd-Modus aktiviert'
        it: 'Assistenza attivata in modalità STTd'
        pl: 'Wspomaganie aktywowane w trybie STTd'
        ru: 'Помощь активирована в режиме STTd'
        zh: 'STTd模式下辅助已激活'
        hu: 'Segítség aktiválva STTd módban'
        pt: 'Assistência ativada em modo STTd'
      0x05:
        en: 'Assistance activated in Idle & Go mode'
        fr: 'Assistance activée en mode Idle & Go'
        es: 'Asistencia activada en modo Idle & Go'
        de: 'Assistenz aktiviert im Idle & Go-Modus'
        it: 'Assistenza attivata in modalità Idle & Go'
        pl: 'Wspomaganie aktywowane w trybie Idle & Go'
        ru: 'Помощь активирована в режиме Idle & Go'
