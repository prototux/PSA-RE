id: 0x389
name: 'GEARBOX_DYNAMIC_DATA_2'
type: 'can'
length: 6
comment:
  en: 'Gearbox dynamic data: gear-change refused, estimated/maximum/minimum clutch torque, warning-lamp request, emergency-stop request, redemption request and hybrid paddle-actuator state.'
  fr: 'Données dynamiques boîte : changement de rapport refusé, couple d''embrayage estimé/max/mini, demande de voyant, demande d''arrêt d''urgence, demande de rachat et état de l''actionneur palette hybride.'
  es: 'Datos dinámicos de la caja de cambios: cambio de marcha rechazado, par de embrague estimado/máximo/mínimo, solicitud de testigo, solicitud de parada de emergencia, solicitud de canje y estado del actuador de paleta híbrida.'
  de: 'Getriebe-Dynamikdaten: Gangwechsel abgelehnt, geschätztes/maximales/minimales Kupplungsmoment, Kontrollleuchtenanforderung, Notstopp-Anforderung, Einlöseanforderung und Zustand des Hybrid-Schaltwippenaktuators.'
  it: 'Dati dinamici del cambio: cambio marcia rifiutato, coppia frizione stimata/massima/minima, richiesta spia, richiesta di arresto di emergenza, richiesta di riscatto e stato dell''attuatore paddle ibrido.'
  pl: 'Dane dynamiczne skrzyni biegów: odmowa zmiany biegu, szacowany/maksymalny/minimalny moment sprzęgła, żądanie kontrolki, żądanie zatrzymania awaryjnego, żądanie wykupu i stan siłownika łopatki hybrydowej.'
  ru: 'Динамические данные коробки передач: отказ переключения передачи, расчётный/максимальный/минимальный момент сцепления, запрос индикатора, запрос аварийной остановки, запрос погашения и состояние гибридного привода лепестков.'
  zh: '变速箱动态数据:换挡被拒绝、估计/最大/最小离合器扭矩、警示灯请求、紧急停止请求、兑换请求和混合动力拨片执行器状态。'
  hu: 'Váltó dinamikus adatok: fokozatváltás elutasítva, becsült/maximális/minimális kuplungnyomaték, jelzőlámpa-kérés, vészleállítási kérés, beváltási kérés és hibrid váltófül aktuátor állapota.'
  pt: 'Dados dinâmicos da caixa de velocidades: mudança recusada, binário de embraiagem estimado/máximo/mínimo, pedido da luz avisadora, pedido de paragem de emergência, pedido de resgate e estado do atuador de patilhas híbrido.'
periodicity: ['40ms']
senders: ['BVA']
receivers: ['BSI', 'CMM']

signals:
  VEHICLE_SPEED:
    bits: '1.7-2.0'
    comment:
      en: 'Vehicle speed (16-bit)'
      fr: 'Vitesse du véhicule (16 bits)'
      es: 'Velocidad del vehículo (16 bits)'
      de: 'Fahrzeuggeschwindigkeit (16 Bit)'
      it: 'Velocità del veicolo (16 bit)'
      pl: 'Prędkość pojazdu (16 bitów)'
      ru: 'Скорость автомобиля (16 бит)'
      zh: '车速(16位)'
      hu: 'Járműsebesség (16 bites)'
      pt: 'Velocidade do veículo (16 bits)'
    type: 'uint'
    factor: 0.01
    min: 0
    max: 655.34
    units: 'km/h'
    invalid: 0xFFFF
    default: 0xFFFF

  DISTANCE_COUNTER:
    bits: '3.7-4.0'
    comment:
      en: 'Travelled distance counter (16-bit)'
      fr: 'Compteur de distance parcourue (16 bits)'
      es: 'Contador de distancia recorrida (16 bits)'
      de: 'Zähler der zurückgelegten Strecke (16 Bit)'
      it: 'Contatore di distanza percorsa (16 bit)'
      pl: 'Licznik przebytego dystansu (16 bitów)'
      ru: 'Счётчик пройденного расстояния (16 бит)'
      zh: '行驶距离计数器(16位)'
      hu: 'Megtett út számlálója (16 bites)'
      pt: 'Contador de distância percorrida (16 bits)'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 6553.5
    units: 'm'
    default: 0x00

  LONGITUDINAL_ACCELERATION:
    bits: '5.7-5.0'
    comment:
      en: 'Longitudinal acceleration'
      fr: 'Accélération longitudinale'
      es: 'Aceleración longitudinal'
      de: 'Längsbeschleunigung'
      it: 'Accelerazione longitudinale'
      pl: 'Przyspieszenie wzdłużne'
      ru: 'Продольное ускорение'
      zh: '纵向加速度'
      hu: 'Hosszirányú gyorsulás'
      pt: 'Aceleração longitudinal'
    type: 'uint'
    factor: 0.08
    offset: -14
    min: -14
    max: 6.32
    units: 'm/s2'
    invalid: 0xFF
    default: 0x00
