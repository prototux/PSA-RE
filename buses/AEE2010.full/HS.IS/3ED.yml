id: 0x3ED
name: 'SUSPENSION_REBOUND_LEVEL'
type: 'can'
length: 4
comment:
  en: 'Suspension rebound level, front left/right and rear left/right.'
  fr: 'Niveau de rebond de la suspension, avant gauche/droite et arrière gauche/droite.'
  es: 'Nivel de rebote de la suspensión, delantero izquierdo/derecho y trasero izquierdo/derecho.'
  de: 'Federungs-Rebound-Niveau, vorne links/rechts und hinten links/rechts.'
  it: 'Livello di rimbalzo della sospensione, anteriore sinistro/destro e posteriore sinistro/destro.'
  pl: 'Poziom odbicia zawieszenia, przód lewy/prawy i tył lewy/prawy.'
  ru: 'Уровень отбоя подвески, спереди слева/справа и сзади слева/справа.'
  zh: '悬挂回弹水平,前左/右和后左/右。'
  hu: 'Felfüggesztés visszapattanási szintje, elöl bal/jobb és hátul bal/jobb.'
  pt: 'Nível de extensão da suspensão, dianteiro esquerdo/direito e traseiro esquerdo/direito.'
periodicity: ['40ms']
senders: ['ABS']
receivers: ['CSS']

signals:
  FRONT_LEFT_WHEEL_BOUNCE_LEVEL:
    bits: '1.7-1.0'
    comment:
      en: 'Front left wheel bounce level'
      fr: 'Niveau de rebond de la roue avant gauche'
      es: 'Nivel de rebote de la rueda delantera izquierda'
      de: 'Einfederungsniveau des linken Vorderrads'
      it: 'Livello di rimbalzo della ruota anteriore sinistra'
      pl: 'Poziom odbicia koła przedniego lewego'
      ru: 'Уровень отскока переднего левого колеса'
      zh: '左前轮跳动水平'
      hu: 'Bal elülső kerék felpattanási szintje'
      pt: 'Nível de ressalto da roda dianteira esquerda'
    type: 'uint'
    factor: 0.0001
    min: 0
    max: 0.025
    units: 'm'
    invalid: 0xFF
    default: 0x00

