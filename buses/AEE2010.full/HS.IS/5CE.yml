id: 0x5CE
name: 'RITCS_DATA_2'
type: 'can'
length: 3
comment:
  en: 'RITCS data 3: ASR, power-steering, suspension, particulate-filter and parking-sensor telltales, travel side, crash info and number of detected lanes.'
  fr: 'Données RITCS 3 : témoins ASR, direction assistée, suspension, filtre à particules et aide au stationnement, côté de circulation, info crash et nombre de voies détectées.'
  es: 'Datos RITCS 3: testigos de ASR, dirección asistida, suspensión, filtro de partículas y ayuda al estacionamiento, lado de circulación, información de choque y número de carriles detectados.'
  de: 'RITCS-Daten 3: Kontrollleuchten für ASR, Servolenkung, Federung, Partikelfilter und Einparkhilfe, Fahrseite, Unfallinfo und Anzahl erkannter Fahrspuren.'
  it: 'Dati RITCS 3: spie ASR, servosterzo, sospensione, filtro antiparticolato e sensori di parcheggio, lato di marcia, info incidente e numero di corsie rilevate.'
  pl: 'Dane RITCS 3: kontrolki ASR, wspomagania kierownicy, zawieszenia, filtra cząstek stałych i czujników parkowania, strona ruchu, informacja o zderzeniu i liczba wykrytych pasów.'
  ru: 'Данные RITCS 3: индикаторы ASR, усилителя руля, подвески, сажевого фильтра и парковочных датчиков, сторона движения, информация об аварии и число обнаруженных полос.'
  zh: 'RITCS数据3:ASR、动力转向、悬挂、颗粒过滤器和泊车传感器指示灯、行驶方向、碰撞信息以及检测到的车道数。'
  hu: 'RITCS adatok 3: ASR, szervokormány, felfüggesztés, részecskeszűrő és parkolásérzékelő jelzőfények, haladási oldal, ütközési infó és az érzékelt sávok száma.'
  pt: 'Dados 3 do RITCS: avisadores de ASR, direção assistida, suspensão, filtro de partículas e sensores de estacionamento, lado de marcha, informação de colisão e número de faixas detetadas.'
periodicity: ['1000ms']
senders: ['BSI']

