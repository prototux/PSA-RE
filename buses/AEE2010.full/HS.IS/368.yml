id: 0x368
name: 'GAS_ENGINE_CORRECTION_DATA'
type: 'can'
length: 7
comment:
  en: 'Engine operating mode data for LPG/CNG-fuelled operation, sent by the engine ECU.'
  fr: 'Données de mode de fonctionnement moteur pour le fonctionnement au gaz (GPL/GNV), envoyées par le calculateur moteur.'
  es: 'Datos del modo de funcionamiento del motor con gas (GLP/GNC), enviados por la ECU del motor.'
  de: 'Motorbetriebsmodusdaten für den Gasbetrieb (Flüssig-/Erdgas), vom Motorsteuergerät gesendet.'
  it: 'Dati della modalità di funzionamento del motore a gas (GPL/metano), inviati dalla centralina motore.'
  pl: 'Dane trybu pracy silnika zasilanego gazem (LPG/CNG), wysyłane przez sterownik silnika.'
  ru: 'Данные режима работы двигателя на газе (ГБО), отправляемые блоком управления двигателем.'
  zh: '发动机燃气(LPG/CNG)运行模式数据,由发动机控制单元发送。'
  hu: 'A motor gázüzemű (LPG/CNG) működési módjának adatai, amelyeket a motorvezérlő küld.'
  pt: 'Dados do modo de funcionamento do motor para funcionamento a GPL/GNC, enviados pela unidade de controlo do motor.'
periodicity: ['10ms']
senders: ['CMM']
receivers: ['BSI']

