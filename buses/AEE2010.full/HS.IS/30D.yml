id: 0x30D
name: 'WHEEL_SPEED_RAW'
type: 'can'
length: 8
comment:
  en: 'Unfiltered wheel speeds, front and rear, left and right.'
  fr: 'Vitesses roues non filtrées, avant et arrière, gauche et droite.'
  es: 'Velocidades de rueda sin filtrar, delantera y trasera, izquierda y derecha.'
  de: 'Ungefilterte Raddrehzahlen, vorne und hinten, links und rechts.'
  it: 'Velocità ruota non filtrate, anteriore e posteriore, sinistra e destra.'
  pl: 'Niefiltrowane prędkości kół, przód i tył, lewe i prawe.'
  ru: 'Нефильтрованные скорости колёс, спереди и сзади, слева и справа.'
  zh: '未经滤波的车轮速度,前后左右。'
  hu: 'Szűretlen kerék sebességek, elöl és hátul, bal és jobb oldalon.'
  pt: 'Velocidades das rodas não filtradas, dianteiras e traseiras, esquerda e direita.'
periodicity: ['20ms']
senders: ['ABS']
receivers: ['CVM', 'AAS', 'CMM', 'ACC', 'BVA', 'HCU1', 'BSM', 'DAE', 'ARTIV']

signals:
  FRONT_LEFT_WHEEL_SPEED_UNFILTERED:
    bits: '1.7-2.0'
    comment:
      en: 'Unfiltered front left wheel speed'
      fr: 'Vitesse de la roue avant gauche non filtrée'
      es: 'Velocidad de la rueda delantera izquierda sin filtrar'
      de: 'Ungefilterte Raddrehzahl vorne links'
      it: 'Velocità ruota anteriore sinistra non filtrata'
      pl: 'Niefiltrowana prędkość koła przedniego lewego'
      ru: 'Нефильтрованная скорость переднего левого колеса'
      zh: '未经滤波的左前轮速度'
      hu: 'Szűretlen elülső bal keréksebesség'
      pt: 'Velocidade da roda dianteira esquerda não filtrada'
    type: 'uint'
    factor: 0.01
    min: 0
    max: 655.33
    units: 'km/h'
    invalid: 0xFFFF
    default: 0xFFFE

  FRONT_RIGHT_WHEEL_SPEED_UNFILTERED:
    bits: '3.7-4.0'
    comment:
      en: 'Unfiltered front right wheel speed'
      fr: 'Vitesse de la roue avant droite non filtrée'
