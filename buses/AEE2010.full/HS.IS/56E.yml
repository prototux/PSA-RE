id: 0x56E
name: 'BSI_CABIN_DATA_14'
type: 'can'
length: 6
comment:
  en: 'Body controller cabin data: hybrid blower setpoint, load-shedding requests for ABS/ESP, electric power steering, EasyMove and suspension, demisting request and hybrid zero-emission cabin inhibition.'
  fr: 'Données habitacle de la BSI : consigne pulseur hybride, demandes de délestage ABS/ESP, direction assistée électrique, EasyMove et suspension, demande de désembuage et inhibition du mode zéro émission habitacle hybride.'
  es: 'Datos del habitáculo de la BSI: consigna del ventilador híbrido, solicitudes de reducción de carga de ABS/ESP, dirección asistida eléctrica, EasyMove y suspensión, solicitud de desempañado e inhibición del modo cero emisiones del habitáculo híbrido.'
  de: 'BSI-Innenraumdaten: Sollwert des Hybrid-Gebläses, Lastabwurfanforderungen für ABS/ESP, elektrische Servolenkung, EasyMove und Federung, Anforderung Entfeuchtung und Sperre des emissionsfreien Hybridmodus im Innenraum.'
  it: 'Dati abitacolo della BSI: setpoint ventola ibrida, richieste di riduzione carico per ABS/ESP, servosterzo elettrico, EasyMove e sospensione, richiesta di disappannamento e inibizione della modalità zero emissioni abitacolo ibrido.'
  pl: 'Dane kabiny z BSI: nastawa dmuchawy hybrydowej, żądania zrzutu obciążenia dla ABS/ESP, elektrycznego wspomagania kierownicy, EasyMove i zawieszenia, żądanie odparowania szyb i blokada trybu zero emisji w kabinie hybrydowej.'
  ru: 'Данные салона от BSI: уставка гибридного вентилятора, запросы сброса нагрузки для ABS/ESP, электроусилителя руля, EasyMove и подвески, запрос осушения стёкол и блокировка режима нулевых выбросов в салоне гибрида.'
  zh: 'BSI座舱数据:混合动力鼓风机设定值、ABS/ESP减载请求、电动助力转向、EasyMove和悬挂减载请求、除雾请求以及混合动力座舱零排放模式抑制。'
  hu: 'BSI utastér adatok: hibrid fűtőventilátor alapjel, ABS/ESP, elektromos szervokormány, EasyMove és felfüggesztés terheléscsökkentési kérések, páramentesítési kérés és a hibrid utastér nulla emissziós módjának letiltása.'
  pt: 'Dados do habitáculo do computador de servidão: ponto de ajuste do ventilador híbrido, pedidos de corte de carga para ABS/ESP, direção assistida elétrica, EasyMove e suspensão, pedido de desembaciamento e inibição do habitáculo em modo híbrido de emissões zero.'
observations:
  en: 'On state change of: BRAKE_SWITCH1_STUCK_RELEASED_FAULT, BRAKE_SWITCH1_STUCK_PRESSED_FAULT, BRAKE_SWITCH2_STUCK_RELEASED_FAULT, BRAKE_SWITCH2_STUCK_PRESSED_FAULT, BRAKE_DIAG_PRESSED_WINDOW_REACHED, BRAKE_DIAG_RELEASED_WINDOW_REACHED, FREEWHEELING_AUTHORIZATION_BSI'
  fr: 'Sur changement d''état de : BRAKE_SWITCH1_STUCK_RELEASED_FAULT, BRAKE_SWITCH1_STUCK_PRESSED_FAULT, BRAKE_SWITCH2_STUCK_RELEASED_FAULT, BRAKE_SWITCH2_STUCK_PRESSED_FAULT, BRAKE_DIAG_PRESSED_WINDOW_REACHED, BRAKE_DIAG_RELEASED_WINDOW_REACHED, FREEWHEELING_AUTHORIZATION_BSI'
  es: 'Al cambiar el estado de: BRAKE_SWITCH1_STUCK_RELEASED_FAULT, BRAKE_SWITCH1_STUCK_PRESSED_FAULT, BRAKE_SWITCH2_STUCK_RELEASED_FAULT, BRAKE_SWITCH2_STUCK_PRESSED_FAULT, BRAKE_DIAG_PRESSED_WINDOW_REACHED, BRAKE_DIAG_RELEASED_WINDOW_REACHED, FREEWHEELING_AUTHORIZATION_BSI'
  de: 'Bei Statusänderung von: BRAKE_SWITCH1_STUCK_RELEASED_FAULT, BRAKE_SWITCH1_STUCK_PRESSED_FAULT, BRAKE_SWITCH2_STUCK_RELEASED_FAULT, BRAKE_SWITCH2_STUCK_PRESSED_FAULT, BRAKE_DIAG_PRESSED_WINDOW_REACHED, BRAKE_DIAG_RELEASED_WINDOW_REACHED, FREEWHEELING_AUTHORIZATION_BSI'
  it: 'Al cambiamento di stato di: BRAKE_SWITCH1_STUCK_RELEASED_FAULT, BRAKE_SWITCH1_STUCK_PRESSED_FAULT, BRAKE_SWITCH2_STUCK_RELEASED_FAULT, BRAKE_SWITCH2_STUCK_PRESSED_FAULT, BRAKE_DIAG_PRESSED_WINDOW_REACHED, BRAKE_DIAG_RELEASED_WINDOW_REACHED, FREEWHEELING_AUTHORIZATION_BSI'
  pl: 'Wysyłane przy zmianie stanu: BRAKE_SWITCH1_STUCK_RELEASED_FAULT, BRAKE_SWITCH1_STUCK_PRESSED_FAULT, BRAKE_SWITCH2_STUCK_RELEASED_FAULT, BRAKE_SWITCH2_STUCK_PRESSED_FAULT, BRAKE_DIAG_PRESSED_WINDOW_REACHED, BRAKE_DIAG_RELEASED_WINDOW_REACHED, FREEWHEELING_AUTHORIZATION_BSI'
  ru: 'При изменении состояния: BRAKE_SWITCH1_STUCK_RELEASED_FAULT, BRAKE_SWITCH1_STUCK_PRESSED_FAULT, BRAKE_SWITCH2_STUCK_RELEASED_FAULT, BRAKE_SWITCH2_STUCK_PRESSED_FAULT, BRAKE_DIAG_PRESSED_WINDOW_REACHED, BRAKE_DIAG_RELEASED_WINDOW_REACHED, FREEWHEELING_AUTHORIZATION_BSI'
  zh: '当CT_FREIN1_HS_RELACHE, BRAKE_SWITCH1_STUCK_PRESSED_FAULT, BRAKE_SWITCH2_STUCK_RELEASED_FAULT, BRAKE_SWITCH2_STUCK_PRESSED_FAULT, BRAKE_DIAG_PRESSED_WINDOW_REACHED, BRAKE_DIAG_RELEASED_WINDOW_REACHED, CAB_FREEWHEELING_AUTH状态变化时'
  hu: 'A(z) BRAKE_SWITCH1_STUCK_RELEASED_FAULT, BRAKE_SWITCH1_STUCK_PRESSED_FAULT, BRAKE_SWITCH2_STUCK_RELEASED_FAULT, BRAKE_SWITCH2_STUCK_PRESSED_FAULT, BRAKE_DIAG_PRESSED_WINDOW_REACHED, BRAKE_DIAG_RELEASED_WINDOW_REACHED, FREEWHEELING_AUTHORIZATION_BSI állapotváltozásakor'
  pt: 'Na mudança de estado de: BRAKE_SWITCH1_STUCK_RELEASED_FAULT, BRAKE_SWITCH1_STUCK_PRESSED_FAULT, BRAKE_SWITCH2_STUCK_RELEASED_FAULT, BRAKE_SWITCH2_STUCK_PRESSED_FAULT, BRAKE_DIAG_PRESSED_WINDOW_REACHED, BRAKE_DIAG_RELEASED_WINDOW_REACHED, FREEWHEELING_AUTHORIZATION_BSI'
periodicity: ['100ms', 'trigger']
