id: 0x36D
name: 'BRAKE_DYNAMIC_DATA'
type: 'can'
length: 4
comment:
  en: 'Brake control unit data: hydraulic hold state, road-slope estimation and vehicle-motion-control status.'
  fr: 'Données du calculateur de freinage : état de maintien hydraulique, estimation de la pente et état du contrôle de mouvement du véhicule.'
  es: 'Datos de la centralita de frenos: estado de retención hidráulica, estimación de la pendiente y estado del control de movimiento del vehículo.'
  de: 'Daten des Bremssteuergeräts: Zustand des hydraulischen Haltens, Steigungsschätzung und Status der Fahrzeugbewegungsregelung.'
  it: 'Dati della centralina freni: stato di mantenimento idraulico, stima della pendenza e stato del controllo del movimento del veicolo.'
  pl: 'Dane sterownika hamulców: stan podtrzymania hydraulicznego, szacowanie nachylenia drogi i stan kontroli ruchu pojazdu.'
  ru: 'Данные блока управления тормозами: состояние гидравлического удержания, оценка уклона дороги и статус контроля движения автомобиля.'
  zh: '制动控制单元数据:液压保持状态、坡度估算及车辆运动控制状态。'
  hu: 'A fékvezérlő egység adatai: hidraulikus tartás állapota, lejtő becslése és a jármű mozgásszabályozásának állapota.'
  pt: 'Dados da unidade de controlo de travagem: estado de retenção hidráulica, estimativa de inclinação da estrada e estado de controlo de movimento do veículo.'
periodicity: ['40ms']
senders: ['ABS']
receivers: ['AAS']

signals:
  VMC_STATUS:
    bits: '1.7-1.6'
    comment:
      en: 'Status of longitudinal control by the braking system'
      fr: 'État du contrôle longitudinal par le système de freinage'
      es: 'Estado del control longitudinal por el sistema de frenado'
      de: 'Status der Längsregelung durch das Bremssystem'
      it: 'Stato del controllo longitudinale tramite l''impianto frenante'
      pl: 'Stan sterowania wzdłużnego przez układ hamulcowy'
      ru: 'Статус продольного управления тормозной системой'
      zh: '制动系统纵向控制状态'
      hu: 'A fékrendszer általi hosszirányú szabályozás állapota'
      pt: 'Estado do controlo longitudinal pelo sistema de travagem'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'Unavailable'
        fr: 'Indisponible'
        es: 'No disponible'
        de: 'Nicht verfügbar'
        it: 'Non disponibile'
        pl: 'Niedostępne'
        ru: 'Недоступно'
        zh: '不可用'
        hu: 'Nem elérhető'
        pt: 'Indisponível'
      0x01:
        en: 'Ready'
        fr: 'Prêt'
        es: 'Listo'
        de: 'Bereit'
        it: 'Pronto'
        pl: 'Gotowy'
        ru: 'Готово'
        zh: '就绪'
        hu: 'Kész'
        pt: 'Pronto'
      0x02:
        en: 'Active'
        fr: 'Actif'
        es: 'Activo'
        de: 'Aktiv'
        it: 'Attivo'
        pl: 'Aktywny'
        ru: 'Активно'
        zh: '激活'
        hu: 'Aktív'
        pt: 'Ativo'
      0x03:
        unused: true

  UNUSED_1:
    bits: '1.5'
    unused: true

  HYDRAULIC_HOLD_STATUS:
    bits: '1.4'
    comment:
      en: 'Status of the hydraulic pressure level needed to hold the vehicle stationary'
      fr: 'État du niveau de pression hydraulique nécessaire pour maintenir le véhicule à l''arrêt'
