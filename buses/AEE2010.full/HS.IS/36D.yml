      pl: 'Stan poziomu ciśnienia hydraulicznego potrzebnego do utrzymania pojazdu w miejscu'
      ru: 'Состояние уровня гидравлического давления, необходимого для удержания автомобиля на месте'
      zh: '维持车辆静止所需液压压力水平的状态'
      hu: 'A jármű álló helyzetben tartásához szükséges hidraulikanyomás-szint állapota'
      pt: 'Estado do nível de pressão hidráulica necessário para manter o veículo parado'
    type: 'bool'
