id: 0x32C
name: 'GAS_SYSTEM_DYNAMIC_DATA_2'
type: 'can'
length: 4
comment:
  en: 'LPG/CNG system data: system state, ignition-timing and lambda corrections.'
  fr: 'Données du système gaz (GPL/GNV) : état du système, corrections d''avance à l''allumage et de richesse (lambda).'
  es: 'Datos del sistema de gas (GLP/GNC): estado del sistema, correcciones de avance de encendido y de riqueza (lambda).'
  de: 'Daten des Gassystems (LPG/CNG): Systemzustand sowie Korrekturen von Zündwinkel und Lambda-Wert.'
  it: 'Dati del sistema a gas (GPL/GNC): stato del sistema, correzioni dell''anticipo di accensione e della miscela (lambda).'
  pl: 'Dane instalacji gazowej (LPG/CNG): stan układu oraz korekty kąta wyprzedzenia zapłonu i współczynnika lambda.'
  ru: 'Данные газовой системы (СНГ/КПГ): состояние системы, коррекции угла опережения зажигания и коэффициента лямбда.'
  zh: '燃气系统(LPG/CNG)数据:系统状态、点火提前角及空燃比(氧传感器)修正。'
  hu: 'A gázrendszer (LPG/CNG) adatai: rendszerállapot, valamint a gyújtásidőzítés és a lambda-érték korrekciói.'
  pt: 'Dados do sistema GPL/GNC: estado do sistema, correções de avanço à ignição e de lambda.'
periodicity: ['20ms']
senders: ['GAS']
receivers: ['CMM']

signals:
  LPG_HIGH_PRESSURE:
    bits: '1.7-1.0'
    comment:
      en: 'LPG high pressure'
      fr: 'Haute pression GPL'
      es: 'Alta presión GLP'
      de: 'LPG-Hochdruck'
      it: 'Alta pressione GPL'
      pl: 'Wysokie ciśnienie LPG'
      ru: 'Высокое давление LPG'
      zh: 'LPG高压'
      hu: 'LPG magas nyomás'
      pt: 'Alta pressão de GPL'
    type: 'uint'
    factor: 1
    offset: 2
    min: 2
    max: 250
    units: 'bar'
    invalid: 0xFF
    default: 0x00

  LPG_GAS_TEMPERATURE:
    bits: '2.7-2.0'
    comment:
      en: 'LPG gas temperature'
      fr: 'Température du gaz GPL'
      es: 'Temperatura del gas GLP'
      de: 'LPG-Gastemperatur'
      it: 'Temperatura del gas GPL'
      pl: 'Temperatura gazu LPG'
      ru: 'Температура газа LPG'
      zh: 'LPG燃气温度'
      hu: 'LPG gázhőmérséklet'
      pt: 'Temperatura do gás GPL'
    type: 'uint'
    factor: 1
    offset: -40
    min: -40
    max: 130
    units: '°C'
    invalid: 0xFF
    default: 0x00

  LPG_GAS_PRESSURE:
    bits: '3.7-4.2'
    comment:
      en: 'LPG gas pressure'
      fr: 'Pression du gaz GPL'
      es: 'Presión del gas GLP'
      de: 'LPG-Gasdruck'
      it: 'Pressione del gas GPL'
      pl: 'Ciśnienie gazu LPG'
      ru: 'Давление газа LPG'
      zh: 'LPG燃气压力'
      hu: 'LPG gáznyomás'
      pt: 'Pressão do gás GPL'
    type: 'uint'
    factor: 1
    offset: 500
    min: 500
    max: 5000
    units: 'mbar'
    invalid: 0x3FFF
    default: 0x00
