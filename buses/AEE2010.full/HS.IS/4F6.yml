      es: 'Información de objetivo detectado'
      de: 'Information zum erkannten Ziel'
      it: 'Informazione sul bersaglio rilevato'
      pl: 'Informacja o wykrytym celu'
      ru: 'Информация об обнаруженной цели'
      zh: '检测到目标的信息'
      hu: 'Az észlelt céltárgy adata'
      pt: 'Informação do alvo detetado'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Initialisation or no target detected'
        fr: 'Initialisation ou pas de cible détectée'
        es: 'Inicialización o sin objetivo detectado'
        de: 'Initialisierung oder kein Ziel erkannt'
        it: 'Inizializzazione o nessun bersaglio rilevato'
        pl: 'Inicjalizacja lub brak wykrytego celu'
        ru: 'Инициализация или цель не обнаружена'
        zh: '初始化或未检测到目标'
