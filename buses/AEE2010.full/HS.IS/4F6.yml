      fr: 'Sens de circulation (à droite ou à gauche)'
      es: 'Sentido de circulación (por la derecha o por la izquierda)'
      de: 'Verkehrsrichtung (rechts oder links)'
      it: 'Senso di marcia (a destra o a sinistra)'
      pl: 'Kierunek ruchu drogowego (prawostronny lub lewostronny)'
