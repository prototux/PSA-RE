id: 0x4F6
name: 'ACC_RADAR_DATA_V2'
type: 'can'
length: 5
comment:
  en: 'Adaptive cruise control radar data, version 2: target detected, distance, sensor state, target-change info, travel direction, time gap and relative speed.'
  fr: 'Données radar du régulateur de vitesse adaptatif, version 2 : cible détectée, distance, état capteur, info de changement de cible, sens de circulation, intervalle temporel et vitesse relative.'
  es: 'Datos del radar del control de crucero adaptativo, versión 2: objetivo detectado, distancia, estado del sensor, información de cambio de objetivo, sentido de circulación, intervalo de tiempo y velocidad relativa.'
  de: 'Radardaten des adaptiven Tempomaten, Version 2: erkanntes Ziel, Abstand, Sensorstatus, Zielwechselinfo, Fahrtrichtung, Zeitlücke und Relativgeschwindigkeit.'
  it: 'Dati radar del cruise control adattivo, versione 2: bersaglio rilevato, distanza, stato sensore, info cambio bersaglio, senso di marcia, intervallo temporale e velocità relativa.'
  pl: 'Dane radaru aktywnego tempomatu, wersja 2: wykryty cel, odległość, stan czujnika, informacja o zmianie celu, kierunek jazdy, odstęp czasowy i prędkość względna.'
  ru: 'Данные радара адаптивного круиз-контроля, версия 2: обнаруженная цель, расстояние, состояние датчика, информация о смене цели, направление движения, временной интервал и относительная скорость.'
  zh: '自适应巡航控制雷达数据,版本2:检测到的目标、距离、传感器状态、目标变更信息、行驶方向、时间间隔和相对速度。'
  hu: 'Az adaptív tempomat radaradatai, 2. verzió: észlelt célpont, távolság, érzékelő állapota, célpontváltás infó, haladási irány, időrés és relatív sebesség.'
  pt: 'Dados do radar do regulador de velocidade adaptativo, versão 2: alvo detetado, distância, estado do sensor, informação de mudança de alvo, sentido de marcha, intervalo de tempo e velocidade relativa.'
periodicity: ['100ms']
senders: ['ARTIV']
receivers: ['BSI']

signals:
  ARTIV_TIME_GAP:
    bits: '1.7-1.0'
    comment:
      en: 'Time gap to the vehicle ahead (ARTIV radar)'
      fr: 'Intervalle de temps avec le véhicule qui précède (radar ARTIV)'
      es: 'Intervalo de tiempo con el vehículo precedente (radar ARTIV)'
      de: 'Zeitabstand zum vorausfahrenden Fahrzeug (ARTIV-Radar)'
      it: 'Intervallo di tempo dal veicolo che precede (radar ARTIV)'
      pl: 'Odstęp czasowy od poprzedzającego pojazdu (radar ARTIV)'
      ru: 'Временной интервал до впереди идущего автомобиля (радар ARTIV)'
      zh: '与前车的时间间隔(ARTIV雷达)'
      hu: 'Az előttük haladó járműtől mért időrés (ARTIV radar)'
      pt: 'Intervalo de tempo com o veículo precedente (radar ARTIV)'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 25.4
    units: 's'
    invalid: 0xFF
    default: 0xFF

  ARTIV_DISTANCE:
    bits: '2.7-2.0'
    comment:
      en: 'Distance to the vehicle ahead (ARTIV radar)'
      fr: 'Distance au véhicule qui précède (radar ARTIV)'
      es: 'Distancia al vehículo precedente (radar ARTIV)'
      de: 'Abstand zum vorausfahrenden Fahrzeug (ARTIV-Radar)'
      it: 'Distanza dal veicolo che precede (radar ARTIV)'
      pl: 'Odległość do poprzedzającego pojazdu (radar ARTIV)'
      ru: 'Дистанция до впереди идущего автомобиля (радар ARTIV)'
      zh: '与前车的距离(ARTIV雷达)'
      hu: 'Az előttük haladó járműtől mért távolság (ARTIV radar)'
      pt: 'Distância ao veículo da frente (radar ARTIV)'
    type: 'uint'
    factor: 1
    min: 0
    max: 253
    units: 'm'
    invalid: 0xFF
    default: 0xFE

  ARTIV_SENSOR_STATE:
