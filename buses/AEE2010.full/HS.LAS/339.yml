      de: 'Kalibrierstatusbit des Beschleunigungs-/Gierratensensors'
      it: 'Bit di stato di calibrazione del sensore di accelerazione/imbardata'
      pl: 'Bit stanu kalibracji czujnika przyspieszenia/odchylenia'
      ru: 'Бит статуса калибровки датчика ускорения/рыскания'
      zh: '加速度/横摆传感器的校准状态位'
      hu: 'A gyorsulás-/legyezési érzékelő kalibrációs állapotbitje'
      pt: 'Bit de estado de calibração do sensor de aceleração/guinada'
    type: 'bool'
