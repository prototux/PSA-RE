id: 0x339
name: 'YAW_LATERAL_SENSOR_DATA'
type: 'can'
length: 8
comment:
  en: 'Dual-sensor (yaw/lateral acceleration) data: raw lateral acceleration, calibration and error bits, test mode, internal sensor info and error number.'
  fr: 'Données du bicapteur (lacet/accélération latérale) : accélération latérale brute, bits de calibration et d''erreur, mode test, info interne capteur et numéro d''erreur.'
  es: 'Datos del bicaptador (guiñada/aceleración lateral): aceleración lateral bruta, bits de calibración y error, modo de prueba, información interna del sensor y número de error.'
  de: 'Daten des Doppelsensors (Gierrate/Querbeschleunigung): rohe Querbeschleunigung, Kalibrierungs- und Fehlerbits, Testmodus, interne Sensorinfo und Fehlernummer.'
  it: 'Dati del bisensore (imbardata/accelerazione laterale): accelerazione laterale grezza, bit di calibrazione ed errore, modalità test, info interna sensore e numero di errore.'
  pl: 'Dane biczujnika (odchylenie/przyspieszenie boczne): surowe przyspieszenie boczne, bity kalibracji i błędu, tryb testowy, wewnętrzna informacja czujnika i numer błędu.'
  ru: 'Данные двухдатчика (рыскание/боковое ускорение): необработанное боковое ускорение, биты калибровки и ошибки, тестовый режим, внутренняя информация датчика и номер ошибки.'
  zh: '双传感器(横摆/横向加速度)数据:原始横向加速度、校准和错误位、测试模式、传感器内部信息和错误编号。'
  hu: 'A kettős érzékelő (legyezés/oldalirányú gyorsulás) adatai: nyers oldalirányú gyorsulás, kalibrációs és hibabitek, tesztmód, belső érzékelő infó és hibaszám.'
  pt: 'Dados do sensor duplo (guinada/aceleração lateral): aceleração lateral em bruto, bits de calibração e de erro, modo de teste, informação interna do sensor e número de erro.'
observations:
  en: 'Sent on reception of a periodic (20 ms) request frame from the brake ECU'
  fr: 'Émise sur réception d''une trame requête périodique (20 ms) transmise par le calculateur de freinage'
  es: 'Enviada al recibir una trama de solicitud periódica (20 ms) del ECU de frenos'
  de: 'Gesendet beim Empfang eines periodischen (20 ms) Anforderungsrahmens vom Bremssteuergerät'
  it: 'Inviata alla ricezione di un frame di richiesta periodico (20 ms) dalla centralina freni'
  pl: 'Wysyłane po odebraniu okresowej (20 ms) ramki żądania od sterownika hamulców'
  ru: 'Отправляется при получении периодического (20 мс) кадра запроса от блока управления тормозами'
  zh: '接收到制动ECU发送的周期性(20毫秒)请求帧时发送'
  hu: 'Küldve a fékrendszer vezérlőegységétől érkező periodikus (20 ms) kérőkeret fogadásakor'
  pt: 'Enviada na receção de uma trama de pedido periódica (20 ms) da unidade de controlo de travagem'
periodicity: ['trigger']
senders: ['ACCEL_SENSOR']
receivers: ['ABS']

