        es: 'Reanudación del regulador/limitador de velocidad mediante el pedal del acelerador'
        de: 'Fortsetzung von Tempomat/Geschwindigkeitsbegrenzer über das Gaspedal'
        it: 'Ripresa del regolatore/limitatore di velocità tramite il pedale dell''acceleratore'
        pl: 'Wznowienie tempomatu/ogranicznika pedałem przyspieszenia'
