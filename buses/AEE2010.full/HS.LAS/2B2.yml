        it: 'cruise control in attesa / speed limiter in attesa - speed limiter non effettiva'
        pl: 'cruise control oczekuje / speed limiter oczekuje - speed limiter nieaktywne'
        ru: 'cruise control ожидает / speed limiter ожидает - speed limiter не действует'
        zh: 'RVV等待中/LVV等待中 - LVV未生效'
        hu: 'cruise control várakozik / speed limiter várakozik - az speed limiter nem aktív'
        pt: 'cruise control em espera / speed limiter em espera - speed limiter não efetivo'
      0x01:
