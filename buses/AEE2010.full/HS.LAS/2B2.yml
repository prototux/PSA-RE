id: 0x2B2
name: 'ENGINE_DYNAMIC_DATA_2'
type: 'can'
length: 1
comment:
  en: 'Engine dynamic data 2, sent in every configuration: A/C compressor power-reduction setpoint, engine-clutch contact, level-2 safety load shedding, water-in-diesel alert, cooling-fan setpoint status, refrigerant pressure, and MIL requests (fixed/flashing).'
  fr: 'Données dynamiques moteur 2, émises dans toutes les configurations : consigne de réduction de puissance compresseur clim, contact embrayage moteur, délestage sécurité niveau 2, alerte eau dans le gazole, état d''application de la consigne GMV, pression réfrigérant, et demandes de voyant MIL (fixe/clignotant).'
  es: 'Datos dinámicos del motor 2, enviados en todas las configuraciones: consigna de reducción de potencia del compresor de A/C, contacto del embrague motor, reducción de carga de seguridad nivel 2, alerta de agua en el gasóleo, estado de aplicación de la consigna del ventilador, presión de refrigerante, y solicitudes de testigo MIL (fijo/parpadeante).'
  de: 'Motor-Dynamikdaten 2, in jeder Konfiguration gesendet: Sollwert zur Leistungsreduzierung des Klimakompressors, Motorkupplungskontakt, Sicherheitslastabwurf Stufe 2, Wasser-im-Diesel-Warnung, Status der Lüfter-Sollwertanwendung, Kältemitteldruck, und MIL-Anforderungen (fest/blinkend).'
  it: 'Dati dinamici motore 2, inviati in ogni configurazione: setpoint di riduzione potenza compressore A/C, contatto frizione motore, riduzione carico di sicurezza livello 2, allarme acqua nel gasolio, stato di applicazione del setpoint ventola, pressione refrigerante, e richieste spia MIL (fissa/lampeggiante).'
  pl: 'Dane dynamiczne silnika 2, wysyłane w każdej konfiguracji: nastawa redukcji mocy sprężarki A/C, styk sprzęgła silnika, zrzut obciążenia bezpieczeństwa poziomu 2, alarm wody w oleju napędowym, stan zastosowania nastawy wentylatora, ciśnienie czynnika chłodniczego, i żądania kontrolki MIL (stałe/migające).'
  ru: 'Динамические данные двигателя 2, отправляемые в любой конфигурации: уставка снижения мощности компрессора кондиционера, контакт сцепления двигателя, сброс нагрузки безопасности уровня 2, предупреждение о воде в дизтопливе, статус применения уставки вентилятора, давление хладагента, и запросы индикатора MIL (постоянный/мигающий).'
  zh: '发动机动态数据2,在所有配置下发送:空调压缩机功率降低设定值、发动机离合器触点、二级安全减载、柴油含水警报、冷却风扇设定值应用状态、制冷剂压力,以及MIL(常亮/闪烁)请求。'
  hu: 'Motor dinamikus adatok 2, minden konfigurációban küldve: klímakompresszor teljesítménycsökkentési alapjel, motorkuplung érintkező, 2. szintű biztonsági terheléscsökkentés, gázolajban lévő víz riasztás, ventilátor alapjel alkalmazási állapota, hűtőközeg nyomás, és MIL (folyamatos/villogó) kérések.'
  pt: 'Dados dinâmicos 2 do motor, enviados em todas as configurações: ponto de ajuste de redução de potência do compressor de ar condicionado, contacto embraiagem-motor, corte de carga de segurança de nível 2, alerta de água no gasóleo, estado do ponto de ajuste da ventoinha de arrefecimento, pressão do refrigerante, e pedidos da luz MIL (fixa/intermitente).'
periodicity: ['20ms']
senders: ['BSI']
receivers: ['ARTIV', 'CAV', 'ECR', 'CVM']

