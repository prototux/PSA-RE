      de: 'Status der Tempomat-Funktion (cruise control) oder des Geschwindigkeitsbegrenzers (speed limiter)'
      it: 'Stato della funzione cruise control (cruise control) o limitatore di velocità (speed limiter)'
      pl: 'Stan funkcji tempomatu (cruise control) lub ogranicznika prędkości (speed limiter)'
      ru: 'Статус функции круиз-контроля (cruise control) или ограничителя скорости (speed limiter)'
      zh: '巡航控制(cruise control)或限速器(speed limiter)功能状态'
