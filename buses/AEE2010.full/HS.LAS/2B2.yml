        fr: 'cruise control active / speed limiter effective'
        es: 'cruise control activo / speed limiter efectivo'
        de: 'cruise control aktiv / speed limiter wirksam'
        it: 'cruise control attivo / speed limiter effettivo'
        pl: 'cruise control aktywny / speed limiter skuteczny'
        ru: 'cruise control активен / speed limiter эффективен'
        zh: 'RVV激活/LVV生效'
        hu: 'cruise control aktív / speed limiter érvényes'
