id: 0x4ED
name: 'ESP_DIAGNOSTIC_DATA'
type: 'can'
length: 5
comment:
  en: 'ESP diagnostic data: blank-fault diagnosis active, lateral-acceleration and yaw-rate sensor faults, OBD diagnostics for the CAN buses, inertial sensor, master-cylinder sensor, brake booster sensor and wheel-speed sensors.'
  fr: 'Données de diagnostic ESP : diagnostic de panne à vide actif, défauts capteurs accélération latérale et vitesse de lacet, diagnostics OBD pour les bus CAN, capteur inertiel, capteur de maître-cylindre, capteur de servofrein et capteurs de vitesse roue.'
  es: 'Datos de diagnóstico ESP: diagnóstico de fallo en vacío activo, fallos de sensores de aceleración lateral y velocidad de guiñada, diagnósticos OBD para los buses CAN, sensor inercial, sensor de cilindro maestro, sensor de servofreno y sensores de velocidad de rueda.'
  de: 'ESP-Diagnosedaten: Leerlauf-Fehlerdiagnose aktiv, Fehler der Querbeschleunigungs- und Gierratensensoren, OBD-Diagnosen für die CAN-Busse, Inertialsensor, Hauptbremszylindersensor, Bremskraftverstärkersensor und Raddrehzahlsensoren.'
  it: 'Dati diagnostici ESP: diagnosi di guasto a vuoto attiva, guasti sensori accelerazione laterale e velocità di imbardata, diagnostica OBD per i bus CAN, sensore inerziale, sensore del cilindro maestro, sensore del servofreno e sensori di velocità ruota.'
  pl: 'Dane diagnostyczne ESP: aktywna diagnoza usterki na pusto, usterki czujników przyspieszenia bocznego i prędkości odchylenia, diagnostyka OBD dla magistral CAN, czujnik inercyjny, czujnik pompy hamulcowej, czujnik wspomagania hamulca i czujniki prędkości kół.'
  ru: 'Диагностические данные ESP: активна диагностика неисправности вхолостую, неисправности датчиков бокового ускорения и скорости рыскания, диагностика OBD для шин CAN, инерциальный датчик, датчик главного тормозного цилиндра, датчик усилителя тормозов и датчики скорости колёс.'
  zh: 'ESP诊断数据:空载故障诊断激活、横向加速度和横摆角速度传感器故障、CAN总线OBD诊断、惯性传感器、制动主缸传感器、真空助力器传感器和车轮速度传感器。'
  hu: 'ESP diagnosztikai adatok: üresjárati hibadiagnosztika aktív, oldalirányú gyorsulás- és legyezőszög-érzékelő hibák, OBD diagnosztika a CAN buszokhoz, inerciaérzékelő, főfékhenger-érzékelő, fékrásegítő-érzékelő és keréksebesség-érzékelők.'
  pt: 'Dados de diagnóstico do ESP: diagnóstico de avaria em branco ativo, avarias dos sensores de aceleração lateral e velocidade de guinada, diagnóstico OBD dos barramentos CAN, sensor inercial, sensor do cilindro mestre, sensor do servofreio e sensores de velocidade das rodas.'
periodicity: ['100ms']
senders: ['ABS']
receivers: ['HCU2']

signals:
  UNUSED_1:
    bits: '1.7-1.1'
    unused: true

  ESP_DIAG_PRESSURE_SENSOR_FUNCTIONAL:
    bits: '1.0'
    comment:
      en: 'ESP diagnostic: pressure sensor functional test'
      fr: 'Diagnostic ESP : test fonctionnel du capteur de pression'
      es: 'Diagnóstico ESP: prueba funcional del sensor de presión'
      de: 'ESP-Diagnose: Funktionstest des Drucksensors'
      it: 'Diagnosi ESP: test funzionale del sensore di pressione'
      pl: 'Diagnostyka ESP: test funkcjonalny czujnika ciśnienia'
      ru: 'Диагностика ESP: функциональный тест датчика давления'
      zh: 'ESP诊断:压力传感器功能测试'
      hu: 'ESP-diagnosztika: a nyomásérzékelő funkcionális tesztje'
      pt: 'Diagnóstico ESP: teste funcional do sensor de pressão'
    type: 'bool'
