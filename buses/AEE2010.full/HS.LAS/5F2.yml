      de: 'Ungewöhnliches Spurverlassen nach rechts erkannt.'
      it: 'Superamento anomalo rilevato a destra.'
      pl: 'Wykryto nieprawidłowy zjazd z pasa w prawo.'
      ru: 'Обнаружено ненормальное пересечение полосы вправо.'
      zh: '检测到右侧异常车道偏离。'
