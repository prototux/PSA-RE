id: 0x5F2
name: 'FRONT_CAMERA_INFO'
type: 'can'
length: 2
comment:
  en: 'Front camera module data: lighting function faults, distance travelled, headlight commutation and degraded mode requests, wiping state.'
  fr: 'Données du module caméra avant : défauts des fonctions d''éclairage, distance parcourue, demandes de commutation feux et de mode dégradé, état d''essuyage.'
  es: 'Datos del módulo de cámara delantera: fallos de las funciones de alumbrado, distancia recorrida, solicitudes de conmutación de luces y de modo degradado, estado de limpiaparabrisas.'
  de: 'Daten des Frontkameramoduls: Fehler der Lichtfunktionen, zurückgelegte Strecke, Lichtumschalt- und Degradationsmodusanforderungen, Wischerzustand.'
  it: 'Dati del modulo telecamera anteriore: guasti delle funzioni di illuminazione, distanza percorsa, richieste di commutazione luci e modalità degradata, stato tergicristallo.'
  pl: 'Dane przedniego modułu kamery: usterki funkcji oświetlenia, przejechany dystans, żądania przełączania świateł i trybu ograniczonego, stan wycieraczek.'
  ru: 'Данные переднего модуля камеры: неисправности функций освещения, пройденное расстояние, запросы переключения света и деградированного режима, состояние стеклоочистителя.'
  zh: '前置摄像头模块数据：照明功能故障、行驶距离、大灯切换及降级模式请求、雨刷状态。'
  hu: 'Az első kameramodul adatai: világítási funkciók hibái, megtett táv, fényváltási és korlátozott üzemmód kérések, ablaktörlő állapota.'
  pt: 'Dados do módulo de câmara dianteira: avarias da função de iluminação, distância percorrida, comutação dos faróis e pedidos de modo degradado, estado de limpeza.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['200ms', 'trigger']
senders: ['BSM']
receivers: ['ECR']

signals:
