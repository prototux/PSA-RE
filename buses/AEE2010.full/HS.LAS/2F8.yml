id: 0x2F8
name: 'ENGINE_HYBRID_DYNAMIC_DATA_13'
type: 'can'
length: 7
comment:
  en: 'Engine dynamic data for hybrid variants: hybrid motor torque, resistant torque, pre-processed driver torque request, engine-restart and particulate-filter regeneration requests, raw powertrain state.'
  fr: 'Données dynamiques moteur pour variantes hybrides : couple moteur hybride, couple résistant, demande de couple conducteur avant traitement, demandes de redémarrage moteur et de régénération FAP, état brut du groupe motopropulseur.'
  es: 'Datos dinámicos del motor para variantes híbridas: par del motor híbrido, par resistente, solicitud de par del conductor antes de procesar, solicitudes de reinicio del motor y de regeneración del filtro de partículas, estado bruto del grupo motopropulsor.'
  de: 'Motor-Dynamikdaten für Hybridvarianten: Hybridmotor-Drehmoment, Widerstandsmoment, unverarbeitete Fahrer-Drehmomentanforderung, Motorneustart- und Partikelfilter-Regenerationsanforderungen, roher Antriebsstrangzustand.'
  it: 'Dati dinamici motore per varianti ibride: coppia motore ibrido, coppia resistente, richiesta di coppia guidatore prima dell''elaborazione, richieste di riavvio motore e rigenerazione FAP, stato grezzo del gruppo propulsore.'
  pl: 'Dane dynamiczne silnika dla wariantów hybrydowych: moment silnika hybrydowego, moment oporowy, nieprzetworzone żądanie momentu kierowcy, żądania ponownego uruchomienia silnika i regeneracji filtra cząstek stałych, surowy stan układu napędowego.'
  ru: 'Динамические данные двигателя для гибридных вариантов: крутящий момент гибридного двигателя, момент сопротивления, необработанный запрос крутящего момента водителя, запросы перезапуска двигателя и регенерации сажевого фильтра, необработанное состояние силового агрегата.'
  zh: '混合动力变体的发动机动态数据:混动电机扭矩、阻力扭矩、处理前的驾驶员扭矩请求、发动机重启和颗粒过滤器再生请求、动力总成原始状态。'
  hu: 'Motor dinamikus adatok hibrid változatokhoz: hibrid motornyomaték, ellenálló nyomaték, feldolgozás előtti vezetői nyomatékkérés, motor-újraindítási és részecskeszűrő-regenerálási kérések, a hajtáslánc nyers állapota.'
  pt: 'Dados dinâmicos do motor para variantes híbridas: binário do motor elétrico híbrido, binário resistente, pedido de binário do condutor pré-processado, pedidos de reinício do motor e de regeneração do filtro de partículas, estado em bruto do grupo motopropulsor.'
periodicity: ['20ms']
senders: ['CMM']
receivers: ['CVM', 'ARTIV', 'ABS']

signals:
  UNUSED_1:
    bits: '1.7-1.0'
    unused: true

  POWERTRAIN_WHEEL_TORQUE_MAX:
    bits: '2.7-3.3'
    comment:
      en: 'Maximum powertrain wheel torque'
      fr: 'Couple roue maximal du groupe motopropulseur'
      es: 'Par en rueda máximo del grupo motopropulsor'
      de: 'Maximales Radmoment des Antriebsstrangs'
      it: 'Coppia ruota massima del gruppo motopropulsore'
      pl: 'Maksymalny moment na kole zespołu napędowego'
      ru: 'Максимальный момент на колесе силового агрегата'
      zh: '动力总成最大车轮扭矩'
      hu: 'Az erőátviteli rendszer maximális kerék-nyomatéka'
      pt: 'Binário máximo na roda do grupo motopropulsor'
    type: 'uint'
    factor: 2
    offset: -4000
    min: -4000
    max: 11000
    units: 'Nm'
    invalid: 0x1FFF
    default: 0x1D4C

  POWERTRAIN_WHEEL_TORQUE_MAX_UNCONTROLLED_OFFSET:
    bits: '3.2-4.0'
    comment:
      en: 'Offset for the maximum non-controllable powertrain wheel torque'
      fr: 'Décalage du couple roue maximal non pilotable du groupe motopropulseur'
      es: 'Desplazamiento del par en rueda máximo no controlable del grupo motopropulsor'
      de: 'Offset für das maximale nicht steuerbare Radmoment des Antriebsstrangs'
      it: 'Offset della coppia ruota massima non pilotabile del gruppo motopropulsore'
      pl: 'Przesunięcie maksymalnego niekontrolowanego momentu na kole zespołu napędowego'
      ru: 'Смещение максимального неуправляемого момента на колесе силового агрегата'
      zh: '动力总成最大不可控车轮扭矩的偏移量'
      hu: 'Az erőátviteli rendszer nem vezérelhető maximális kerék-nyomatékának eltolása'
      pt: 'Desvio para o binário máximo na roda não controlável do grupo motopropulsor'
    type: 'uint'
    factor: 2
    min: 0
    max: 4000
    units: 'Nm'
    invalid: 0x7FF
    default: 0x00

  POWERTRAIN_WHEEL_TORQUE_MIN:
    bits: '5.7-6.3'
    comment:
      en: 'Minimum powertrain wheel torque'
      fr: 'Couple roue minimal du groupe motopropulseur'
      es: 'Par en rueda mínimo del grupo motopropulsor'
      de: 'Minimales Radmoment des Antriebsstrangs'
      it: 'Coppia ruota minima del gruppo motopropulsore'
      pl: 'Minimalny moment na kole zespołu napędowego'
      ru: 'Минимальный момент на колесе силового агрегата'
      zh: '动力总成最小车轮扭矩'
      hu: 'Az erőátviteli rendszer minimális kerék-nyomatéka'
      pt: 'Binário mínimo na roda do grupo motopropulsor'
    type: 'uint'
    factor: 2
    offset: -4000
    min: -4000
    max: 11000
    units: 'Nm'
    invalid: 0x1FFF
    default: 0x00

  POWERTRAIN_WHEEL_TORQUE_MIN_UNCONTROLLED_OFFSET:
    bits: '6.2-7.0'
    comment:
      en: 'Offset for the minimum non-controllable powertrain wheel torque'
      fr: 'Décalage du couple roue minimal non pilotable du groupe motopropulseur'
      es: 'Desplazamiento del par en rueda mínimo no controlable del grupo motopropulsor'
      de: 'Offset für das minimale nicht steuerbare Radmoment des Antriebsstrangs'
      it: 'Offset della coppia ruota minima non pilotabile del gruppo motopropulsore'
      pl: 'Przesunięcie minimalnego niekontrolowanego momentu na kole zespołu napędowego'
      ru: 'Смещение минимального неуправляемого момента на колесе силового агрегата'
      zh: '动力总成最小不可控车轮扭矩的偏移量'
      hu: 'Az erőátviteli rendszer nem vezérelhető minimális kerék-nyomatékának eltolása'
      pt: 'Desvio para o binário mínimo na roda não controlável do grupo motopropulsor'
    type: 'uint'
    factor: 2
    min: 0
    max: 4000
    units: 'Nm'
    invalid: 0x7FF
