id: 0x32D
name: 'BRAKE_ADAS_DATA'
type: 'can'
length: 8
comment:
  en: 'Brake unit data for ADAS: calibrated longitudinal acceleration, ACC deceleration/stop state, brake force and fault flags.'
  fr: 'Données du calculateur de frein pour l''ADAS : accélération longitudinale calibrée, état de décélération/arrêt ACC, effort de freinage et indicateurs de défaut.'
  es: 'Datos de la centralita de frenos para el ADAS: aceleración longitudinal calibrada, estado de deceleración/parada del ACC, esfuerzo de frenado e indicadores de fallo.'
  de: 'Bremssteuergerätdaten für ADAS: kalibrierte Längsbeschleunigung, ACC-Verzögerungs-/Stoppzustand, Bremskraft und Fehlerkennungen.'
  it: 'Dati della centralina freni per l''ADAS: accelerazione longitudinale calibrata, stato di decelerazione/arresto ACC, forza frenante e indicatori di guasto.'
  pl: 'Dane sterownika hamulców dla ADAS: skalibrowane przyspieszenie wzdłużne, stan opóźnienia/zatrzymania ACC, siła hamowania oraz flagi usterek.'
  ru: 'Данные блока управления тормозами для ADAS: калиброванное продольное ускорение, состояние замедления/остановки ACC, тормозное усилие и флаги неисправности.'
  zh: '用于高级驾驶辅助(ADAS)的制动控制单元数据:标定纵向加速度、ACC减速/停车状态、制动力及故障标志。'
  hu: 'A fékvezérlő ADAS-adatai: kalibrált hosszirányú gyorsulás, ACC lassítási/megállási állapot, fékerő és hibajelzők.'
  pt: 'Dados da unidade de travagem para o ADAS: aceleração longitudinal calibrada, estado de desaceleração/paragem do ACC, força de travagem e indicadores de avaria.'
periodicity: ['20ms']
senders: ['ABS']
receivers: ['CMM', 'HCU2', 'CVM', 'BSI', 'ECR', 'ARTIV']

signals:
  CALIBRATED_LONGITUDINAL_ACCELERATION:
    bits: '1.7-2.4'
    comment:
      en: 'Calibrated longitudinal acceleration'
      fr: 'Accélération longitudinale calibrée'
      es: 'Aceleración longitudinal calibrada'
      de: 'Kalibrierte Längsbeschleunigung'
      it: 'Accelerazione longitudinale calibrata'
      pl: 'Skalibrowane przyspieszenie wzdłużne'
      ru: 'Откалиброванное продольное ускорение'
      zh: '校准后的纵向加速度'
      hu: 'Kalibrált hosszirányú gyorsulás'
      pt: 'Aceleração longitudinal calibrada'
    type: 'uint'
    factor: 0.02
    offset: -40.96
    min: -40.96
    max: 40.92
    units: 'm/s2'
    invalid: 0xFFF
    default: 0x800

  FARC_DECELERATION_FUNCTION_STATUS:
    bits: '2.3-2.2'
    comment:
      en: 'FARC (adaptive cruise) deceleration function status'
