  BRAKE_RELEASED_FAILSAFE_STATUS:
    bits: '3.7'
    comment:
      en: 'Message from the ESP informing the perception system that it detected the stationary vehicle slipping and released the brakes; the driver must take back control'
      fr: 'Message de l''ESP informant le système de perception qu''il a détecté un glissement du véhicule à l''arrêt et relâche donc les freins ; le conducteur doit reprendre le contrôle'
      es: 'Mensaje del ESP que informa al sistema de percepción de que ha detectado un deslizamiento del vehículo detenido y por tanto suelta los frenos; el conductor debe retomar el control'
      de: 'Meldung des ESP an das Umfeld-Wahrnehmungssystem, dass ein Rutschen des stehenden Fahrzeugs erkannt und die Bremsen deshalb gelöst wurden; der Fahrer muss die Kontrolle übernehmen'
      it: 'Messaggio dell''ESP che informa il sistema di percezione di aver rilevato uno slittamento del veicolo fermo e di aver quindi rilasciato i freni; il conducente deve riprendere il controllo'
      pl: 'Komunikat z ESP informujący system percepcji o wykryciu poślizgu nieruchomego pojazdu, w związku z czym hamulce zostały zwolnione; kierowca musi przejąć kontrolę'
      ru: 'Сообщение от ESP, информирующее систему восприятия об обнаружении проскальзывания неподвижного автомобиля и об отпускании тормозов; водитель должен взять управление на себя'
      zh: '来自ESP的消息,告知感知系统检测到静止车辆打滑并因此松开刹车;驾驶员必须重新接管控制'
      hu: 'Az ESP üzenete, amely tájékoztatja az érzékelő rendszert, hogy az álló jármű megcsúszását észlelte, ezért kiengedte a fékeket; a vezetőnek vissza kell vennie az irányítást'
      pt: 'Mensagem do ESP a informar o sistema de perceção de que detetou um deslizamento do veículo parado e por isso soltou os travões; o condutor deve retomar o controlo'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No need to release the brakes, no skid detected'
        fr: 'Pas besoin de relâcher les freins, aucun dérapage détecté'
        es: 'No es necesario soltar los frenos, no se detectó derrape'
        de: 'Kein Bremsenlösen nötig, kein Rutschen erkannt'
        it: 'Nessuna necessità di rilasciare i freni, nessuno slittamento rilevato'
        pl: 'Nie ma potrzeby zwalniania hamulców, nie wykryto poślizgu'
        ru: 'Нет необходимости отпускать тормоза, занос не обнаружен'
        zh: '无需松开制动，未检测到打滑'
        hu: 'Nem szükséges elengedni a fékeket, nincs észlelt megcsúszás'
        pt: 'Não é necessário soltar os travões, não foi detetada derrapagem'
      0x01:
        en: 'ESC releasing the brakes after detecting a skid'
        fr: 'L''ESC relâche les freins après avoir détecté un dérapage'
        es: 'El ESC libera los frenos tras detectar un derrape'
        de: 'Das ESP löst die Bremsen, da es ein Rutschen erkannt hat'
        it: 'L''ESC rilascia i freni dopo aver rilevato uno slittamento'
        pl: 'ESC zwalnia hamulce po wykryciu poślizgu'
        ru: 'ESC отпускает тормоза после обнаружения заноса'
        zh: 'ESC检测到打滑后松开制动'
        hu: 'Az ESC megcsúszás észlelése után elengedi a fékeket'
        pt: 'O ESC liberta os travões após detetar uma derrapagem'

