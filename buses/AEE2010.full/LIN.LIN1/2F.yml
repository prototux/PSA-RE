id: 0x2F
name: 'BSRF_COMMAND'
type: 'lin'
length: 4
comment:
  en: 'Rain/light sensor: fault event, logged in the BSI fault log.'
  fr: 'Capteur de pluie et de luminosité : événement défaut, enregistré dans le journal des défauts du BSI.'
  es: 'Sensor de lluvia y luz: evento de fallo, registrado en el registro de fallos de la BSI.'
  de: 'Regen-/Lichtsensor – Fehlerereignis, im Fehlerspeicher (Fehlerprotokoll) des BSI vermerkt.'
  it: 'Sensore pioggia/luce: evento di guasto, registrato nel registro guasti della BSI.'
  pl: 'Czujnik deszczu/światła – zdarzenie usterki, zapisywane w dzienniku usterek BSI.'
  ru: 'Датчик дождя и света — событие неисправности, регистрируется в журнале неисправностей BSI.'
  zh: '雨量/光线传感器——故障事件,记录在BSI故障日志中。'
  hu: 'Eső-/fényérzékelő – hibaesemény, amelyet a BSI hibanaplójába rögzítenek.'
  pt: 'Sensor de chuva/luz: evento de avaria, registado no registo de avarias da BSI.'
periodicity: ['trigger']
senders: ['CDPL']
receivers: ['BSI']
lin:
  master: 'BSI'

signals:
  DEGRADED_MODE_NUMBER:
    bits: '1.2-2.6'
    comment:
      en: 'Degraded mode number'
      fr: 'Numéro de mode dégradé'
      es: 'Número de modo degradado'
      de: 'Nummer des Degradationsmodus'
      it: 'Numero della modalità degradata'
      pl: 'Numer trybu ograniczonego'
      ru: 'Номер деградированного режима'
      zh: '降级模式编号'
      hu: 'Korlátozott üzemmód száma'
      pt: 'Número do modo degradado'
    type: 'uint'
    min: 0
    max: 15
    invalid: 0x1F

  UNUSED_3:
    bits: '2.5-2.1'
    unused: true

  UNUSED_4:
    bits: '3.7-3.0'
    unused: true

  UNUSED_5:
    bits: '4.7-4.0'
    unused: true

alternatives:
  - note:
      en: 'The content of this frame changes (multiplexed, selector not identified): other layout seen'
      fr: 'Le contenu de cette trame varie (multiplexée, sélecteur non identifié) : autre disposition observée'
      es: 'El contenido de esta trama varía (multiplexada, selector no identificado): otra disposición observada'
      de: 'Der Inhalt dieser Botschaft variiert (gemultiplext, Selektor nicht ermittelt): weitere beobachtete Belegung'
      it: 'Il contenuto di questo frame varia (multiplexato, selettore non identificato): altra disposizione osservata'
      pl: 'Zawartość tej ramki się zmienia (multipleksowana, selektor nieznany): inny zaobserwowany układ'
      ru: 'Содержимое этого кадра меняется (мультиплексирование, селектор не определён): другая наблюдаемая раскладка'
      zh: '此帧内容会变化（多路复用，未识别选择器）：观察到的另一种布局'
      hu: 'A keret tartalma változik (multiplexelt, a választó nem azonosított): másik megfigyelt elrendezés'
      pt: 'O conteúdo desta trama varia (multiplexada, seletor não identificado): outra disposição observada'
    signals:
      BSI_CONTEXT_RELEVANCE:
        bits: '1.1'
        comment:
          en: 'BSI contexts relevance'
          fr: 'Pertinence des contextes BSI'
          es: 'Relevancia de los contextos de la BSI'
          de: 'Relevanz der BSI-Kontexte'
          it: 'Rilevanza dei contesti BSI'
          pl: 'Trafność kontekstów BSI'
          ru: 'Актуальность контекстов BSI'
          zh: 'BSI上下文相关性'
          hu: 'A BSI kontextusok relevanciája'
          pt: 'Relevância dos contextos da BSI'
        type: 'bool'
        values:
          0x00:
            en: 'BSI context matching ensured'
            fr: 'Cohérence des contextes BSI assurée'
            es: 'Coherencia de los contextos de la BSI garantizada'
            de: 'Übereinstimmung der BSI-Kontexte sichergestellt'
            it: 'Coerenza dei contesti BSI garantita'
            pl: 'Zapewniona spójność kontekstów BSI'
            ru: 'Обеспечено соответствие контекстов BSI'
            zh: '已确保BSI上下文一致性'
            hu: 'A BSI kontextusok egyezősége biztosítva'
            pt: 'Correspondência de contexto da BSI garantida'
          0x01:
            en: 'Matching of BSI contexts not ensured'
            fr: 'Pertinence des contextes BSI non assurée'
            es: 'Pertinencia de los contextos BSI no garantizada'
            de: 'Übereinstimmung der BSI-Kontexte nicht gewährleistet'
            it: 'Pertinenza dei contesti BSI non garantita'
            pl: 'Zgodność kontekstów BSI niezapewniona'
            ru: 'Соответствие контекстов BSI не гарантировано'
            zh: 'BSI上下文匹配未保证'
            hu: 'A BSI-kontextusok egyezése nem biztosított'
            pt: 'Correspondência dos contextos BSI não garantida'
      UNUSED_3:
        bits: '2.5-2.1'
        unused: true
      UNUSED_4:
        bits: '3.7-3.0'
        unused: true
      UNUSED_5:
        bits: '4.7-4.0'
        unused: true
