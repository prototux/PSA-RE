id: 0x05
name: 'RAIN_LIGHT_SENSOR_FAST_DATA'
type: 'lin'
length: 2
comment:
  en: 'Rain/light sensor fast-rate data: automatic lighting request, wiper state and sweep speed.'
  fr: 'Données rapides du capteur de pluie et de luminosité : demande d''éclairage automatique, état et vitesse de balayage des essuie-glaces.'
  es: 'Datos de alta frecuencia del sensor de lluvia y luz: solicitud de iluminación automática, estado y velocidad de barrido de los limpiaparabrisas.'
  de: 'Schnelle Daten des Regen-/Lichtsensors: Anforderung automatischer Beleuchtung, Wischerstatus und Wischgeschwindigkeit.'
  it: 'Dati ad alta frequenza del sensore pioggia/luce: richiesta di illuminazione automatica, stato e velocità di spazzata dei tergicristalli.'
  pl: 'Szybkie dane czujnika deszczu/światła: żądanie automatycznego oświetlenia, stan i prędkość pracy wycieraczek.'
  ru: 'Быстрые данные датчика дождя/света: запрос автоматического освещения, состояние и скорость хода дворников.'
  zh: '雨光传感器高速数据:自动照明请求、雨刷状态及刮扫速度。'
  hu: 'Az eső-/fényérzékelő gyors adatai: automatikus világítás kérése, ablaktörlő állapota és sebessége.'
  pt: 'Dados a alta cadência do sensor de chuva/luz: pedido de iluminação automática, estado do limpa-para-brisas e velocidade de varrimento.'
periodicity: ['trigger']
senders: ['CDPL']
receivers: ['BSI']
lin:
  master: 'BSI'

signals:
  AAF_REQUEST:
    bits: '1.7'
    comment:
      en: 'AAF request'
      fr: 'Demande de l''AAF'
      es: 'Solicitud de AAF'
      de: 'AAF-Anforderung'
      it: 'Richiesta AAF'
      pl: 'Żądanie AAF'
      ru: 'Запрос AAF'
      zh: 'AAF请求'
      hu: 'AAF-kérés'
      pt: 'Pedido do AAF'
    type: 'bool'
    values:
      0x00:
        en: 'Dusk'
        fr: 'Crépuscule'
        es: 'Crepúsculo'
        de: 'Dämmerung'
        it: 'Crepuscolo'
        pl: 'Zmierzch'
        ru: 'Сумерки'
        zh: '黄昏'
        hu: 'Szürkület'
        pt: 'Crepúsculo'
      0x01:
        en: 'Tunnel'
        fr: 'Tunnel'
        es: 'Túnel'
        de: 'Tunnel'
        it: 'Galleria'
        pl: 'Tunel'
        ru: 'Туннель'
        zh: '隧道'
        hu: 'Alagút'
        pt: 'Túnel'

  RAIN_SENSOR_WIPER_STATE:
    bits: '1.6-1.5'
    comment:
      en: 'Wiper state controlled by the rain sensor'
      fr: 'État de l''essuyage piloté par le capteur de pluie'
      es: 'Estado del limpiaparabrisas controlado por el sensor de lluvia'
      de: 'Vom Regensensor gesteuerter Wischerzustand'
      it: 'Stato del tergicristallo controllato dal sensore pioggia'
      pl: 'Stan wycieraczek sterowanych czujnikiem deszczu'
      ru: 'Состояние стеклоочистителя, управляемого датчиком дождя'
      zh: '雨量传感器控制的雨刷状态'
      hu: 'Az esőszenzor által vezérelt ablaktörlő állapota'
      pt: 'Estado da limpeza controlada pelo sensor de chuva'
    type: 'enum'
