id: 0x10
name: 'BMF_LAMPS_STATUS'
type: 'lin'
length: 4
comment:
  en: 'Multifunction lamp driver module status: passenger airbag warning lamp and various indicator lamp outputs, fault state.'
  fr: 'État du module de commande de voyants multifonction : voyant airbag passager et diverses sorties de voyants, état de défaut.'
  es: 'Estado del módulo de control de testigos multifunción: testigo de airbag del pasajero y varias salidas de testigos, estado de fallo.'
  de: 'Status des Multifunktions-Kontrollleuchten-Ansteuermoduls: Beifahrer-Airbag-Kontrollleuchte und diverse Kontrollleuchtenausgänge, Fehlerstatus.'
  it: 'Stato del modulo di comando spie multifunzione: spia airbag passeggero e varie uscite spie, stato di guasto.'
  pl: 'Stan modułu sterowania kontrolkami wielofunkcyjnymi: kontrolka poduszki powietrznej pasażera i różne wyjścia kontrolek, stan usterki.'
  ru: 'Статус модуля управления многофункциональными индикаторами: индикатор подушки безопасности пассажира и различные выходы индикаторов, состояние неисправности.'
  zh: '多功能指示灯驱动模块状态:乘客安全气囊警示灯和各种指示灯输出、故障状态。'
  hu: 'A többfunkciós jelzőlámpa-vezérlő modul állapota: utas légzsák jelzőlámpa és különféle jelzőlámpa-kimenetek, hibaállapot.'
  pt: 'Estado do módulo driver de lâmpadas multifunções: luz avisadora do airbag do passageiro e várias saídas de luzes indicadoras, estado de avaria.'
periodicity: ['trigger']
senders: ['TNB']
lin:
  master: 'BSI'

