id: 0x38
name: 'FLUSH_HANDLE_STATUS_FL'
type: 'lin'
length: 8
comment:
  en: 'Alarm siren status: LIN fault/degraded mode, battery/link tamper detection, alert and recharge state, supervision state, context-loss event, fault response.'
  fr: 'État de la sirène d''alarme : défaut/mode dégradé LIN, détection de sabotage batterie/liaison, état d''alerte et de recharge, état de surveillance, événement de perte de contexte, réponse de défaut.'
  es: 'Estado de la sirena de alarma: fallo/modo degradado LIN, detección de sabotaje de batería/enlace, estado de alerta y de recarga, estado de supervisión, evento de pérdida de contexto, respuesta de fallo.'
  de: 'Status der Alarmsirene: LIN-Fehler/degradierter Modus, Manipulationserkennung Batterie/Verbindung, Alarm- und Ladezustand, Überwachungsstatus, Kontextverlustereignis, Fehlerrückmeldung.'
  it: 'Stato della sirena d''allarme: guasto/modalità degradata LIN, rilevamento manomissione batteria/collegamento, stato di allarme e di ricarica, stato di supervisione, evento di perdita di contesto, risposta di guasto.'
  pl: 'Stan syreny alarmowej: usterka/tryb awaryjny LIN, wykrycie sabotażu akumulatora/łącza, stan alarmu i ładowania, stan nadzoru, zdarzenie utraty kontekstu, odpowiedź o usterce.'
  ru: 'Статус сирены сигнализации: неисправность/деградированный режим LIN, обнаружение вмешательства в батарею/связь, состояние тревоги и подзарядки, состояние контроля, событие потери контекста, ответ о неисправности.'
  zh: '报警器状态:LIN故障/降级模式、电池/连接篡改检测、警报和充电状态、监控状态、上下文丢失事件、故障响应。'
  hu: 'A riasztósziréna állapota: LIN hiba/korlátozott üzemmód, akkumulátor-/kapcsolat-szabotázs érzékelése, riasztási és töltési állapot, felügyeleti állapot, kontextusvesztés esemény, hibaválasz.'
  pt: 'Estado da sirene de alarme: avaria/modo degradado LIN, deteção de sabotagem da bateria/ligação, estado de alerta e de recarga, estado de supervisão, evento de perda de contexto, resposta de avaria.'
periodicity: ['trigger']
senders: ['SIR']
receivers: ['BSI']
lin:
  master: 'BSI'

