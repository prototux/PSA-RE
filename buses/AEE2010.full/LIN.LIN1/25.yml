id: 0x25
name: 'RAIN_LIGHT_SENSOR_SLOW_DATA'
type: 'lin'
length: 4
comment:
  en: 'Rain/light sensor slow-rate data: degraded mode request and ambient light level.'
  fr: 'Données lentes du capteur de pluie et de luminosité : demande de mode dégradé et niveau de luminosité ambiante.'
  es: 'Datos de baja frecuencia del sensor de lluvia y luz: solicitud de modo degradado y nivel de luz ambiental.'
  de: 'Langsame Daten des Regen-/Lichtsensors: Anforderung des degradierten Modus und Umgebungslichtpegel.'
  it: 'Dati a bassa frequenza del sensore pioggia/luce: richiesta di modalità degradata e livello di luce ambientale.'
  pl: 'Wolne dane czujnika deszczu/światła: żądanie trybu awaryjnego i poziom światła otoczenia.'
  ru: 'Медленные данные датчика дождя/света: запрос деградированного режима и уровень окружающего освещения.'
  zh: '雨光传感器低速数据:降级模式请求和环境光水平。'
  hu: 'Az eső-/fényérzékelő lassú adatai: korlátozott üzemmód kérése és környezeti fényszint.'
  pt: 'Dados a baixa cadência do sensor de chuva/luz: pedido de modo degradado e nível de luz ambiente.'
periodicity: ['trigger']
senders: ['CDPL']
receivers: ['BSI']
lin:
  master: 'BSI'

signals:
  UNUSED_1:
    bits: '1.7-1.2'
    unused: true

  CDP_STATUS:
    bits: '1.1'
    comment:
      en: 'CDP module status (normal or faulty)'
      fr: 'État du module CDP (normal ou défaillant)'
      es: 'Estado del módulo CDP (normal o defectuoso)'
      de: 'Status des CDP-Moduls (normal oder fehlerhaft)'
      it: 'Stato del modulo CDP (normale o guasto)'
      pl: 'Stan modułu CDP (normalny lub uszkodzony)'
      ru: 'Состояние модуля CDP (норма или неисправность)'
      zh: 'CDP模块状态（正常或故障）'
      hu: 'A CDP modul állapota (normál vagy hibás)'
      pt: 'Estado do módulo CDP (normal ou com falha)'
    type: 'bool'
    values:
      0x00:
        en: 'Normal'
        fr: 'Normal'
        es: 'Normal'
        de: 'Normal'
        it: 'Normale'
        pl: 'Normalny'
        ru: 'Нормальный'
        zh: '正常'
        hu: 'Normál'
        pt: 'Normal'
      0x01:
        en: 'Faulty'
        fr: 'Défaillant'
        es: 'Defectuoso'
        de: 'Fehlerhaft'
        it: 'Guasto'
        pl: 'Uszkodzone'
        ru: 'Неисправно'
        zh: '故障'
        hu: 'Hibás'
        pt: 'Avariado'

  AMBIENT_LIGHT_LEVEL:
    bits: '2.7-2.0'
    comment:
      en: 'Ambient light level'
      fr: 'Niveau de lumière ambiante'
      es: 'Nivel de luz ambiental'
      de: 'Umgebungslichtstärke'
      it: 'Livello di luce ambientale'
      pl: 'Poziom światła otoczenia'
      ru: 'Уровень окружающей освещённости'
      zh: '环境光水平'
      hu: 'A környezeti fény szintje'
      pt: 'Nível de luz ambiente'
    type: 'uint'
    min: 0
    max: 254
    invalid: 0xFF

  UNUSED_2:
    bits: '3.7-3.0'
    unused: true

  UNUSED_3:
    bits: '4.7-4.0'
    unused: true
