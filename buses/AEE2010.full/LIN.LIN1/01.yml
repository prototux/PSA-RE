id: 0x01
name: 'BSI_RAPID_COMMAND'
type: 'lin'
length: 2
comment:
  en: 'Rapid commands sent to the BSI over LIN: washer command, wiper speed setpoint, manual wipe request and speed number.'
  fr: 'Commandes rapides envoyées à la BSI sur le bus LIN : commande de lavage, consigne de vitesse d''essuyage, demande d''essuyage manuel et numéro de vitesse.'
  es: 'Órdenes rápidas enviadas a la BSI por el bus LIN: orden de lavado, consigna de velocidad de limpiaparabrisas, solicitud de limpieza manual y número de velocidad.'
  de: 'Schnelle Befehle, die über den LIN-Bus an die BSI gesendet werden: Waschanlagenbefehl, Wischgeschwindigkeits-Sollwert, manuelle Wischanforderung und Geschwindigkeitsnummer.'
  it: 'Comandi rapidi inviati alla BSI sul bus LIN: comando lavaggio, setpoint velocità tergicristallo, richiesta di pulizia manuale e numero di velocità.'
  pl: 'Szybkie polecenia wysyłane do BSI po magistrali LIN: polecenie spryskiwacza, zadana prędkość wycierania, żądanie ręcznego wycierania i numer prędkości.'
  ru: 'Быстрые команды, отправляемые в BSI по шине LIN: команда омывателя, заданная скорость стеклоочистителя, запрос ручной протирки и номер скорости.'
  zh: '通过LIN总线发送给BSI的快速命令：洗涤命令、雨刷速度设定值、手动雨刷请求和速度挡位编号。'
  hu: 'A BSI-nek a LIN buszon küldött gyors parancsok: mosóberendezés-parancs, törlési sebesség alapjel, kézi törlési kérés és sebességfokozat száma.'
  pt: 'Comandos rápidos enviados à BSI via LIN: comando de lava-para-brisas, ponto de ajuste de velocidade do limpa-para-brisas, pedido de limpeza manual e número de velocidade.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['ESV']
lin:
  master: 'BSI'

signals:
  UNUSED_1:
    bits: '1.7-1.6'
    unused: true

  MANUAL_WIPING_REQUEST:
    bits: '1.5'
    comment:
      en: 'Manual wiping request'
      fr: 'Demande d''essuyage manuel'
      es: 'Solicitud de limpieza manual'
      de: 'Anforderung des manuellen Wischbetriebs'
      it: 'Richiesta di tergitura manuale'
      pl: 'Żądanie ręcznego wycierania'
      ru: 'Запрос ручной работы стеклоочистителя'
      zh: '手动雨刮请求'
      hu: 'A kézi ablaktörlés kérése'
      pt: 'Pedido de limpeza manual'
    type: 'bool'
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
        en: 'Request in progress'
        fr: 'Demande en cours'
        es: 'Solicitud en curso'
        de: 'Anforderung läuft'
        it: 'Richiesta in corso'
        pl: 'Żądanie w toku'
        ru: 'Запрос выполняется'
        zh: '请求进行中'
        hu: 'Kérés folyamatban'
        pt: 'Pedido em curso'

