id: 0x0C
name: 'ALARM_COMMAND'
type: 'lin'
length: 2
comment:
  en: 'Commands sent by the BSI to the alarm siren module: surveillance activation, siren/volumetric activation, alert, fault erase and fault memory inhibit.'
  fr: 'Commandes envoyées par la BSI au module sirène d''alarme : activation de la surveillance, activation sirène/volumétrique, alerte, effacement et inhibition de mémorisation des défauts.'
  es: 'Órdenes enviadas por la BSI al módulo de sirena de alarma: activación de la vigilancia, activación de sirena/volumétrica, alerta, borrado e inhibición de memorización de fallos.'
  de: 'Von der BSI an das Alarmsirenenmodul gesendete Befehle: Überwachungsaktivierung, Sirenen-/Volumenschutzaktivierung, Alarm, Fehlerlöschung und Fehlerspeicher-Sperrung.'
  it: 'Comandi inviati dalla BSI al modulo sirena allarme: attivazione della sorveglianza, attivazione sirena/volumetrica, allarme, cancellazione e inibizione della memorizzazione dei guasti.'
  pl: 'Polecenia wysyłane przez BSI do modułu syreny alarmowej: aktywacja nadzoru, aktywacja syreny/czujnika ruchu, alarm, kasowanie i blokada zapisu usterek.'
  ru: 'Команды, отправляемые BSI в модуль сирены сигнализации: активация наблюдения, активация сирены/объёмного датчика, тревога, стирание и блокировка запоминания неисправностей.'
  zh: '由BSI发送给报警喇叭模块的指令：监视激活、喇叭/容积传感器激活、警报、故障清除和故障存储抑制。'
  hu: 'A BSI parancsai a riasztószirénamodul felé: felügyelet aktiválása, sziréna/térfogatérzékelő aktiválása, riasztás, hibatörlés és hibatár tiltása.'
  pt: 'Comandos enviados pela BSI ao módulo da sirene de alarme: ativação da vigilância, ativação sirene/volumétrico, alerta, apagamento de avarias e inibição da memória de avarias.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['SIR']
lin:
  master: 'BSI'

