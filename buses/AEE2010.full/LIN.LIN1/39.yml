id: 0x39
name: 'FLUSH_HANDLE_STATUS_FR'
type: 'lin'
length: 8
comment:
  en: 'Ultrasonic interior-intrusion sensor status: LIN fault/degraded mode, intrusion detection, supervision state, context-loss event.'
  fr: 'État du capteur ultrasons de surveillance volumétrique : défaut/mode dégradé LIN, détection d''effraction, état de surveillance, événement de perte de contexte.'
  es: 'Estado del sensor ultrasónico de intrusión interior: fallo/modo degradado LIN, detección de intrusión, estado de supervisión, evento de pérdida de contexto.'
  de: 'Status des Ultraschall-Innenraumüberwachungssensors: LIN-Fehler/degradierter Modus, Einbrucherkennung, Überwachungsstatus, Kontextverlustereignis.'
  it: 'Stato del sensore ultrasuoni di intrusione volumetrica: guasto/modalità degradata LIN, rilevamento intrusione, stato di supervisione, evento di perdita di contesto.'
  pl: 'Stan ultradźwiękowego czujnika wykrywania włamania: usterka/tryb awaryjny LIN, wykrycie włamania, stan nadzoru, zdarzenie utraty kontekstu.'
  ru: 'Статус ультразвукового датчика объёмного контроля салона: неисправность/деградированный режим LIN, обнаружение вторжения, состояние контроля, событие потери контекста.'
  zh: '超声波车内入侵传感器状态:LIN故障/降级模式、入侵检测、监控状态、上下文丢失事件。'
  hu: 'Az ultrahangos térfigyelő (behatolásérzékelő) állapota: LIN hiba/korlátozott üzemmód, behatolás-érzékelés, felügyeleti állapot, kontextusvesztés esemény.'
  pt: 'Estado do sensor ultrassónico de intrusão interior: avaria/modo degradado LIN, deteção de intrusão, estado de supervisão, evento de perda de contexto.'
periodicity: ['trigger']
senders: ['MUS']
receivers: ['BSI']
lin:
  master: 'BSI'

