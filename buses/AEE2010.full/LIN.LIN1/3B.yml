id: 0x3B
name: 'FLUSH_HANDLE_STATUS_RR'
type: 'lin'
length: 8
comment:
  en: 'LIN1 network power state command, sent by the BSI.'
  fr: 'Commande d''état d''alimentation du réseau LIN1, envoyée par la BSI.'
  es: 'Orden de estado de alimentación de la red LIN1, enviada por la BSI.'
  de: 'Befehl zum Versorgungszustand des LIN1-Netzwerks, von der BSI gesendet.'
  it: 'Comando di stato di alimentazione della rete LIN1, inviato dalla BSI.'
  pl: 'Polecenie stanu zasilania sieci LIN1, wysyłane przez BSI.'
  ru: 'Команда состояния питания сети LIN1, отправляемая BSI.'
  zh: '由BSI发送的LIN1网络供电状态命令。'
  hu: 'A LIN1 hálózat tápellátási állapotának parancsa, a BSI küldi.'
  pt: 'Comando do estado de alimentação da rede LIN1, enviado pela BSI.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['ESV']
lin:
  master: 'BSI'

