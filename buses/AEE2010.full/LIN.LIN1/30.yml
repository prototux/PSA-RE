id: 0x30
name: 'FRONT_BODY_MODULE_COMMAND'
type: 'lin'
length: 8
comment:
  en: 'Commands sent by the BSI to the front body module: parking sensor button, passenger seat memory activation, ignition state, indicator/lamp outputs.'
  fr: 'Commandes envoyées par la BSI au module de servitude avant : bouton d''aide au stationnement, activation mémoire siège passager, état d''allumage, sorties clignotants/lanternes.'
  es: 'Órdenes enviadas por la BSI al módulo de servidumbre delantero: botón de ayuda al aparcamiento, activación de memoria del asiento del pasajero, estado de encendido, salidas de intermitentes/luces.'
  de: 'Von der BSI an das vordere Bordnetzmodul gesendete Befehle: Einparkhilfetaste, Aktivierung des Beifahrersitzspeichers, Zündzustand, Blinker-/Leuchtenausgänge.'
  it: 'Comandi inviati dalla BSI al modulo servizi anteriore: pulsante di assistenza al parcheggio, attivazione memoria sedile passeggero, stato di accensione, uscite indicatori/luci.'
  pl: 'Polecenia wysyłane przez BSI do przedniego modułu obsługowego: przycisk czujników parkowania, aktywacja pamięci fotela pasażera, stan zapłonu, wyjścia kierunkowskazów/świateł.'
  ru: 'Команды, отправляемые BSI в передний сервисный модуль кузова: кнопка парковочных датчиков, активация памяти сиденья пассажира, состояние зажигания, выходы указателей поворота/фонарей.'
  zh: '由BSI发送给前车身服务模块的指令：泊车辅助按钮、乘客座椅记忆激活、点火状态、转向灯/示宽灯输出。'
  hu: 'A BSI parancsai az elülső karosszériaellátó modul felé: parkolóradar gomb, utasülés memória aktiválása, gyújtásállapot, index-/lámpakimenetek.'
  pt: 'Comandos enviados pela BSI ao módulo de servidão dianteiro: botão de ajuda ao estacionamento, ativação da memória do banco do passageiro, estado da ignição, saídas de piscas/luzes.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['TNB']
lin:
  master: 'BSI'

