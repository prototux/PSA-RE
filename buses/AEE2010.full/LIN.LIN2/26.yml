id: 0x26
name: 'BSI_SLOW_COMMAND'
type: 'lin'
length: 4
comment:
  en: 'Rain/light sensor configuration commands from the body computer: fault erase, sensitivity settings and external temperature/vehicle speed input.'
  fr: 'Commandes de configuration du capteur de pluie et de luminosité issues du BSI : effacement défaut, réglages de sensibilité et entrée température extérieure/vitesse véhicule.'
  es: 'Órdenes de configuración del sensor de lluvia y luz de la BSI: borrado de fallo, ajustes de sensibilidad y entrada de temperatura exterior/velocidad del vehículo.'
  de: 'Konfigurationsbefehle des Regen-/Lichtsensors vom BSI: Fehlerlöschung, Empfindlichkeitseinstellungen und Außentemperatur-/Fahrzeuggeschwindigkeitseingang.'
  it: 'Comandi di configurazione del sensore pioggia/luce dal BSI: cancellazione guasto, impostazioni di sensibilità e ingresso temperatura esterna/velocità veicolo.'
  pl: 'Polecenia konfiguracji czujnika deszczu/światła z BSI: kasowanie usterki, ustawienia czułości i wejście temperatury zewnętrznej/prędkości pojazdu.'
  ru: 'Команды конфигурации датчика дождя/света от BSI: очистка неисправности, настройки чувствительности и ввод наружной температуры/скорости автомобиля.'
  zh: '来自车身控制器的雨量/光线传感器配置命令:故障清除、灵敏度设置及车外温度/车速输入。'
  hu: 'Az eső-/fényérzékelő konfigurációs parancsai a BSI-től: hibatörlés, érzékenységi beállítások és külső hőmérséklet-/járműsebesség-bemenet.'
  pt: 'Comandos de configuração do sensor de chuva e luminosidade da BSI: apagamento de avaria, ajustes de sensibilidade e entrada de temperatura exterior/velocidade do veículo.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['CLOCK']
lin:
  master: 'BSI'

signals:
  VEHICLE_SPEED_LINEAR:
    bits: '1.0-2.1'
    comment:
      en: 'Vehicle speed'
      fr: 'Vitesse du véhicule'
      es: 'Velocidad del vehículo'
      de: 'Fahrzeuggeschwindigkeit'
      it: 'Velocità del veicolo'
      pl: 'Prędkość pojazdu'
      ru: 'Скорость автомобиля'
      zh: '车速'
      hu: 'Járműsebesség'
      pt: 'Velocidade do veículo'
    type: 'uint'
    min: 0
    max: 254
    invalid: 0xFF

  EXTERNAL_TEMPERATURE:
    bits: '2.0-3.1'
    comment:
      en: 'Outside temperature, T = N/2 - 40 °C; specific codes indicate sensor absent or unmanaged'
      fr: 'Température extérieure, T = N/2 - 40 °C ; codes spécifiques pour capteur absent ou code non géré'
      es: 'Temperatura exterior, T = N/2 - 40 °C; códigos específicos para sensor ausente o código no gestionado'
      de: 'Außentemperatur, T = N/2 - 40 °C; spezielle Codes für fehlenden Sensor oder nicht verwalteten Code'
      it: 'Temperatura esterna, T = N/2 - 40 °C; codici specifici per sensore assente o codice non gestito'
      pl: 'Temperatura zewnętrzna, T = N/2 - 40 °C; specjalne kody dla braku czujnika lub nieobsługiwanego kodu'
      ru: 'Наружная температура, T = N/2 - 40 °C; специальные коды для отсутствующего датчика или необработанного кода'
      zh: '车外温度,T = N/2 - 40°C;特定代码表示传感器缺失或代码未处理'
      hu: 'Külső hőmérséklet, T = N/2 - 40 °C; külön kódok jelzik a hiányzó érzékelőt vagy a nem kezelt kódot'
      pt: 'Temperatura exterior, T = N/2 - 40 °C; códigos específicos para sensor ausente ou código não gerido'
    type: 'uint'
    factor: 0.5
    offset: -40
    min: 0
    max: 250
    invalid: 0xFF

  RAIN_SENSOR_SENSITIVITY_REQUESTED:
    bits: '3.0-4.6'
    comment:
      en: 'Requested rain sensor sensitivity'
      fr: 'Sensibilité demandée du capteur de pluie'
      es: 'Sensibilidad solicitada del sensor de lluvia'
      de: 'Angeforderte Empfindlichkeit des Regensensors'
      it: 'Sensibilità richiesta del sensore pioggia'
      pl: 'Żądana czułość czujnika deszczu'
      ru: 'Запрошенная чувствительность датчика дождя'
      zh: '请求的雨量传感器灵敏度'
      hu: 'Az esőérzékelő kért érzékenysége'
      pt: 'Sensibilidade pedida do sensor de chuva'
    type: 'uint'
    min: 0
    max: 7

alternatives:
  - note:
      en: 'The content of this frame changes (multiplexed, selector not identified): other layout seen'
      fr: 'Le contenu de cette trame varie (multiplexée, sélecteur non identifié) : autre disposition observée'
      es: 'El contenido de esta trama varía (multiplexada, selector no identificado): otra disposición observada'
      de: 'Der Inhalt dieser Botschaft variiert (gemultiplext, Selektor nicht ermittelt): weitere beobachtete Belegung'
      it: 'Il contenuto di questo frame varia (multiplexato, selettore non identificato): altra disposizione osservata'
      pl: 'Zawartość tej ramki się zmienia (multipleksowana, selektor nieznany): inny zaobserwowany układ'
      ru: 'Содержимое этого кадра меняется (мультиплексирование, селектор не определён): другая наблюдаемая раскладка'
      zh: '此帧内容会变化（多路复用，未识别选择器）：观察到的另一种布局'
      hu: 'A keret tartalma változik (multiplexelt, a választó nem azonosított): másik megfigyelt elrendezés'
      pt: 'O conteúdo desta trama varia (multiplexada, seletor não identificado): outra disposição observada'
    signals:
      VEHICLE_SPEED_LINEAR:
        bits: '1.0-2.1'
        comment:
          en: 'Vehicle speed'
          fr: 'Vitesse du véhicule'
          es: 'Velocidad del vehículo'
          de: 'Fahrzeuggeschwindigkeit'
          it: 'Velocità del veicolo'
          pl: 'Prędkość pojazdu'
          ru: 'Скорость автомобиля'
          zh: '车速'
          hu: 'Járműsebesség'
          pt: 'Velocidade do veículo'
        type: 'uint'
        min: 0
        max: 254
        invalid: 0xFF
      CLEAR_FAULTS:
        bits: '3.7'
        comment:
          en: 'Global fault memory erase request'
          fr: 'Demande d''effacement global des défauts'
          es: 'Solicitud de borrado global de fallos'
          de: 'Anforderung zum globalen Löschen der Fehlerspeicher'
          it: 'Richiesta di cancellazione globale dei guasti'
          pl: 'Żądanie globalnego kasowania usterek'
          ru: 'Запрос глобального стирания неисправностей'
          zh: '全局故障清除请求'
          hu: 'Globális hibatörlési kérés'
          pt: 'Pedido de apagamento global das falhas'
        type: 'bool'
        values:
          0x00:
            en: 'No request'
            fr: 'Pas de demande'
            es: 'Sin solicitud'
            de: 'Keine Anforderung'
            it: 'Nessuna richiesta'
            pl: 'Brak żądania'
            ru: 'Нет запроса'
            zh: '无请求'
            hu: 'Nincs kérés'
            pt: 'Sem pedido'
          0x01:
            en: 'Delete request'
            fr: 'Demande d''effacement'
            es: 'Solicitud de borrado'
            de: 'Löschanforderung'
            it: 'Richiesta di cancellazione'
            pl: 'Żądanie usunięcia'
            ru: 'Запрос удаления'
            zh: '删除请求'
            hu: 'Törlési kérés'
            pt: 'Pedido de apagamento'
      LOG_FAULTS:
        bits: '3.6'
        comment:
          en: 'Fault storage locking (fault memory logging disabled)'
          fr: 'Verrouillage de la mémorisation des défauts'
          es: 'Bloqueo del almacenamiento de fallos'
          de: 'Sperrung der Fehlerspeicherung'
          it: 'Blocco della memorizzazione dei guasti'
          pl: 'Blokada zapisu usterek'
          ru: 'Блокировка записи неисправностей в память'
          zh: '故障存储锁定'
          hu: 'A hibatárolás letiltása'
          pt: 'Bloqueio do armazenamento de avarias (registo na memória de avarias desativado)'
        type: 'bool'
        values:
          0x00:
            en: 'Deactivation'
            fr: 'Désactivation'
            es: 'Desactivación'
            de: 'Deaktivierung'
            it: 'Disattivazione'
            pl: 'Dezaktywacja'
            ru: 'Деактивация'
            zh: '停用'
            hu: 'Kikapcsolás'
            pt: 'Desativação'
          0x01:
            en: 'Activation'
            fr: 'Activation'
            es: 'Activación'
            de: 'Aktivierung'
            it: 'Attivazione'
            pl: 'Aktywacja'
            ru: 'Активация'
            zh: '激活'
            hu: 'Aktiválás'
            pt: 'Ativação'
      LIGHT_SENSOR_SENSITIVITY_REQUESTED:
        bits: '3.3-3.1'
        comment:
          en: 'Requested light sensor sensitivity'
          fr: 'Sensibilité demandée du capteur de luminosité'
          es: 'Sensibilidad solicitada del sensor de luminosidad'
          de: 'Angeforderte Empfindlichkeit des Lichtsensors'
          it: 'Sensibilità richiesta del sensore di luminosità'
          pl: 'Żądana czułość czujnika natężenia światła'
          ru: 'Запрошенная чувствительность датчика освещённости'
          zh: '请求的光线传感器灵敏度'
          hu: 'A fényérzékelő kért érzékenysége'
          pt: 'Sensibilidade pedida do sensor de luminosidade'
        type: 'uint'
        min: 0
        max: 7
      RAIN_SENSOR_SENSITIVITY_REQUESTED:
        bits: '3.0-4.6'
        comment:
          en: 'Requested rain sensor sensitivity'
          fr: 'Sensibilité demandée du capteur de pluie'
          es: 'Sensibilidad solicitada del sensor de lluvia'
          de: 'Angeforderte Empfindlichkeit des Regensensors'
          it: 'Sensibilità richiesta del sensore pioggia'
          pl: 'Żądana czułość czujnika deszczu'
          ru: 'Запрошенная чувствительность датчика дождя'
          zh: '请求的雨量传感器灵敏度'
          hu: 'Az esőérzékelő kért érzékenysége'
          pt: 'Sensibilidade pedida do sensor de chuva'
        type: 'uint'
        min: 0
        max: 7
