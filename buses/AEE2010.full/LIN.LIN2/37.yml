      hu: 'A MEAP2 modul hardver-azonosítója'
      pt: 'Referência de hardware do módulo MEAP2'
    type: 'uint'
    factor: 0.01
    min: 0
    max: 100

  MEAP2_SOFTWARE_REFERENCE:
    bits: '6.0-8.3'
    comment:
      en: 'Software reference of the MEAP2 module'
      fr: 'Référence logicielle du module MEAP2'
      es: 'Referencia de software del módulo MEAP2'
      de: 'Software-Referenz des MEAP2-Moduls'
      it: 'Riferimento software del modulo MEAP2'
      pl: 'Numer referencyjny oprogramowania modułu MEAP2'
      ru: 'Номер версии ПО модуля MEAP2'
      zh: 'MEAP2模块的软件参考编号'
      hu: 'A MEAP2 modul szoftver-azonosítója'
      pt: 'Referência de software do módulo MEAP2'
    type: 'uint'
    factor: 0.01
    min: 0
    max: 100
