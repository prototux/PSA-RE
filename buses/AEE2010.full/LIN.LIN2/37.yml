  fr: 'Références matérielle, logicielle et pièce du deuxième module MEAP.'
  es: 'Referencias de hardware, software y número de pieza del segundo módulo MEAP.'
  de: 'Hardware-, Software- und Teilenummer-Referenzen des zweiten MEAP-Moduls.'
  it: 'Riferimenti hardware, software e numero di parte del secondo modulo MEAP.'
  pl: 'Numery referencyjne sprzętu, oprogramowania i części drugiego modułu MEAP.'
  ru: 'Ссылки на аппаратную часть, ПО и номер детали второго модуля MEAP.'
  zh: '第二个MEAP模块的硬件、软件及零件编号参考信息。'
  hu: 'A második MEAP modul hardver-, szoftver- és alkatrészszám-referenciái.'
  pt: 'Referências de hardware, software e número de peça do segundo módulo MEAP.'
periodicity: ['trigger']
senders: ['MEAP']
receivers: ['BSI']
