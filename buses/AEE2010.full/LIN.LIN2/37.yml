signals:
  MEAP2_PSA_REFERENCE:
    bits: '1.0-4.5'
    comment:
      en: 'PSA part reference of the MEAP2 module'
      fr: 'Référence pièce PSA du module MEAP2'
      es: 'Referencia de pieza PSA del módulo MEAP2'
      de: 'PSA-Teilenummer des MEAP2-Moduls'
      it: 'Riferimento pezzo PSA del modulo MEAP2'
      pl: 'Numer części PSA modułu MEAP2'
      ru: 'Номер детали PSA модуля MEAP2'
      zh: 'MEAP2模块的PSA零件编号'
      hu: 'A MEAP2 modul PSA alkatrészszáma'
      pt: 'Referência de peça PSA do módulo MEAP2'
    type: 'uint'
    min: 0
    max: 999999

  MEAP2_HARDWARE_REFERENCE:
    bits: '4.0-6.3'
    comment:
      en: 'Hardware reference of the MEAP2 module'
      fr: 'Référence matérielle du module MEAP2'
      es: 'Referencia de hardware del módulo MEAP2'
      de: 'Hardware-Referenz des MEAP2-Moduls'
      it: 'Riferimento hardware del modulo MEAP2'
      pl: 'Numer referencyjny sprzętu modułu MEAP2'
      ru: 'Аппаратный номер модуля MEAP2'
