id: 0x0A
name: 'BATTERY_MONITOR_MEASUREMENTS'
type: 'lin'
length: 2
comment:
  en: 'Battery monitor measurements: amp-hour counter and low-current internal resistance.'
  fr: 'Mesures du moniteur de batterie : compteur ampères-heures et résistance interne à faible courant.'
  es: 'Mediciones del monitor de batería: contador de amperios-hora y resistencia interna a baja corriente.'
  de: 'Messwerte der Batterieüberwachung: Amperestunden-Zähler und Innenwiderstand bei niedrigem Strom.'
  it: 'Misure del monitor batteria: contatore amperora e resistenza interna a bassa corrente.'
  pl: 'Pomiary monitora akumulatora: licznik amperogodzin i rezystancja wewnętrzna przy małym prądzie.'
  ru: 'Измерения монитора батареи: счётчик ампер-часов и внутреннее сопротивление при малом токе.'
  zh: '电池监测器测量值:安时计数器及低电流内阻。'
  hu: 'Az akkumulátorfigyelő mérései: amperóra-számláló és alacsony áramú belső ellenállás.'
  pt: 'Medições do monitor da bateria: contador de amperes-hora e resistência interna a baixa corrente.'
periodicity: ['trigger']
senders: ['BECB']
receivers: ['BSI']
lin:
  master: 'BSI'

signals:
  BATTERY_AH_COUNTER:
    bits: '1.0-2.1'
    comment:
      en: 'Battery amp-hour counter'
      fr: 'Compteur A.h de la batterie'
      es: 'Contador de amperios-hora de la batería'
      de: 'Amperestunden-Zähler der Batterie'
      it: 'Contatore amperora della batteria'
      pl: 'Licznik amperogodzin akumulatora'
      ru: 'Счётчик ампер-часов батареи'
      zh: '电池安时计数器'
      hu: 'Az akkumulátor amperóra-számlálója'
      pt: 'Contador de amperes-hora da bateria'
    type: 'uint'
    factor: 1
    offset: -120
    min: -120
    max: 120
    units: 'Ah'
    invalid: 0xFF
    alternatives:
      - note:
          en: 'Also observed at bits 1.7-1.0'
          fr: 'Aussi observé aux bits 1.7-1.0'
          es: 'También observado en los bits 1.7-1.0'
          de: 'Auch an den Bits 1.7-1.0 beobachtet'
          it: 'Osservato anche ai bit 1.7-1.0'
          pl: 'Obserwowany także na bitach 1.7-1.0'
          ru: 'Также наблюдался в битах 1.7-1.0'
          zh: '也观察到位于位1.7-1.0'
          hu: 'Megfigyelve a(z) 1.7-1.0 biteken is'
          pt: 'Também observado nos bits 1.7-1.0'
        bits: '1.7-1.0'
