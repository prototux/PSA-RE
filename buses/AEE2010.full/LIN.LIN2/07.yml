id: 0x07
name: 'AIR_INTAKE_MOTOR_COMMAND'
type: 'lin'
length: 2
comment:
  en: 'Second air intake flap motor command, sent by the BSI over LIN.'
  fr: 'Commande du deuxième moteur de volet d''entrée d''air, envoyée par la BSI sur le bus LIN.'
  es: 'Orden del segundo motor de la trampilla de entrada de aire, enviada por la BSI por el bus LIN.'
  de: 'Ansteuerung des zweiten Lufteinlassklappenmotors, von der BSI über den LIN-Bus gesendet.'
  it: 'Comando del secondo motore della valvola di presa d''aria, inviato dalla BSI sul bus LIN.'
  pl: 'Sterowanie drugim silnikiem przepustnicy wlotu powietrza, wysyłane przez BSI po magistrali LIN.'
  ru: 'Управление вторым электродвигателем заслонки забора воздуха, отправляемое BSI по шине LIN.'
  zh: '由BSI通过LIN总线发送的第二个进气风门电机命令。'
  hu: 'A második levegőbeömlő nyílás motorjának vezérlése, a BSI küldi a LIN buszon.'
  pt: 'Comando do segundo motor da comporta de entrada de ar, enviado pela BSI via LIN.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['MEAP']
lin:
  master: 'BSI'

