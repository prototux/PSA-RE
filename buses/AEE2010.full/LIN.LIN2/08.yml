id: 0x08
name: 'ADDITIVE_PUMP_COMMAND'
type: 'lin'
length: 2
comment:
  en: 'Additive (e.g. AdBlue) pump volume command, sent by the BSI over LIN.'
  fr: 'Commande de volume de la pompe à additif (ex. AdBlue), envoyée par la BSI sur le bus LIN.'
  es: 'Orden de volumen de la bomba de aditivo (p. ej. AdBlue), enviada por la BSI por el bus LIN.'
  de: 'Volumenbefehl der Additivpumpe (z. B. AdBlue), von der BSI über den LIN-Bus gesendet.'
  it: 'Comando di volume della pompa additivo (es. AdBlue), inviato dalla BSI sul bus LIN.'
  pl: 'Polecenie objętości pompy dodatku (np. AdBlue), wysyłane przez BSI po magistrali LIN.'
  ru: 'Команда объёма насоса присадки (например, AdBlue), отправляемая BSI по шине LIN.'
  zh: '由BSI通过LIN总线发送的添加剂（如AdBlue）泵体积命令。'
  hu: 'Az adalékanyag- (pl. AdBlue) szivattyú térfogatparancsa, a BSI küldi a LIN buszon.'
  pt: 'Comando de volume da bomba de aditivo (por exemplo, AdBlue), enviado pela BSI via LIN.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['ADDGO']
lin:
  master: 'BSI'

signals:
  ADDITIVE_INJECTION_VOLUME:
    bits: '1.0-2.1'
    comment:
      en: 'Additive injection unit volume'
      fr: 'Volume élémentaire d''additif à injecter'
      es: 'Volumen elemental de aditivo a inyectar'
      de: 'Elementares Einspritzvolumen des Additivs'
      it: 'Volume elementare di additivo da iniettare'
      pl: 'Jednostkowa objętość dodatku do wtrysku'
      ru: 'Элементарный объём впрыскиваемой присадки'
      zh: '添加剂单次喷射量'
      hu: 'Adalékanyag befecskendezési egységtérfogat'
      pt: 'Volume elementar de aditivo a injetar'
    type: 'enum'
    factor: 5
    invalid: 0xFF
    values:
      0x00:
        en: 'Control forbidden'
        fr: 'Pilotage interdit'
        es: 'Control prohibido'
        de: 'Ansteuerung verboten'
        it: 'Pilotaggio vietato'
        pl: 'Sterowanie zabronione'
        ru: 'Управление запрещено'
        zh: '禁止控制'
        hu: 'A vezérlés tiltva'
        pt: 'Controlo proibido'
      0x01:
        en: 'Control authorized'
        fr: 'Pilotage autorisé'
        es: 'Control autorizado'
        de: 'Steuerung zulässig'
        it: 'Pilotaggio autorizzato'
        pl: 'Sterowanie dozwolone'
        ru: 'Управление разрешено'
        zh: '允许控制'
        hu: 'A vezérlés engedélyezett'
        pt: 'Controlo autorizado'
