id: 0x10
name: 'BMF_LAMPS_STATUS'
type: 'lin'
length: 8
comment:
  en: 'Auxiliary (fuel-fired) heater activation request sent by the BSI: outside air pressure, diagnostic routine request, fuel type, heating power and pump/valve control.'
  fr: 'Demande d''activation du chauffage d''appoint (à combustible) envoyée par la BSI : pression d''air extérieure, demande de routine diagnostic, type de carburant, puissance de chauffe et commande pompe/vanne.'
  es: 'Solicitud de activación de la calefacción auxiliar (de combustible) enviada por la BSI: presión de aire exterior, solicitud de rutina de diagnóstico, tipo de combustible, potencia de calefacción y mando de bomba/válvula.'
  de: 'Von der BSI gesendete Aktivierungsanforderung der Zusatzheizung (Brennstoff): Außenluftdruck, Diagnoseroutinenanforderung, Kraftstoffart, Heizleistung und Pumpen-/Ventilsteuerung.'
  it: 'Richiesta di attivazione del riscaldamento ausiliario (a combustibile) inviata dalla BSI: pressione aria esterna, richiesta routine diagnostica, tipo di carburante, potenza di riscaldamento e comando pompa/valvola.'
  pl: 'Żądanie aktywacji ogrzewania dodatkowego (na paliwo) wysyłane przez BSI: ciśnienie powietrza zewnętrznego, żądanie procedury diagnostycznej, rodzaj paliwa, moc grzewcza i sterowanie pompą/zaworem.'
  ru: 'Запрос активации автономного (топливного) отопителя, отправляемый BSI: наружное давление воздуха, запрос диагностической процедуры, тип топлива, мощность нагрева и управление насосом/клапаном.'
  zh: '由BSI发送的辅助（燃油）加热器激活请求：外部气压、诊断例程请求、燃料类型、加热功率及水泵/阀门控制。'
  hu: 'A BSI által küldött pótfűtés (tüzelőanyagos) aktiválási kérés: külső légnyomás, diagnosztikai rutin kérése, üzemanyag típusa, fűtőteljesítmény és szivattyú-/szelepvezérlés.'
  pt: 'Pedido de ativação do aquecedor auxiliar (a combustível) enviado pela BSI: pressão do ar exterior, pedido de rotina de diagnóstico, tipo de combustível, potência de aquecimento e comando da bomba/válvula.'
periodicity: ['trigger']
senders: ['BSI']
lin:
  master: 'BSI'

