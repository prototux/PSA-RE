id: 0x04
name: 'WIPER_SENSOR_STATUS'
type: 'lin'
length: 2
comment:
  en: 'PTC water heater power command and consumption cutoff, sent by the BSI over LIN.'
  fr: 'Commande de puissance du chauffage d''eau PTC et coupure de consommation, envoyées par la BSI sur le bus LIN.'
  es: 'Orden de potencia del calentador de agua PTC y corte de consumo, enviadas por la BSI por el bus LIN.'
  de: 'Leistungsbefehl der PTC-Wasserheizung und Verbrauchsabschaltung, von der BSI über den LIN-Bus gesendet.'
  it: 'Comando di potenza del riscaldatore d''acqua PTC e interruzione del consumo, inviati dalla BSI sul bus LIN.'
  pl: 'Polecenie mocy grzałki wody PTC i odcięcie poboru mocy, wysyłane przez BSI po magistrali LIN.'
  ru: 'Команда мощности PTC-водонагревателя и отключение потребления, отправляемые BSI по шине LIN.'
  zh: '由BSI通过LIN总线发送的PTC水加热器功率命令及耗电切断。'
  hu: 'A PTC vízmelegítő teljesítményparancsa és fogyasztás-lekapcsolása, a BSI küldi a LIN buszon.'
  pt: 'Comando de potência do aquecedor de água PTC e corte de consumo, enviados pela BSI via LIN.'
periodicity: ['trigger']
senders: ['BSI']
lin:
  master: 'BSI'

signals:
  LV_PTC_HEATER_CUTOFF_REQUEST:
    bits: '1.7'
    comment:
      en: 'Request to cut off the low-voltage PTC water heater control'
      fr: 'Demande de coupure de la commande du réchauffeur PTC eau basse tension'
      es: 'Solicitud de corte del mando del calentador de agua PTC de baja tensión'
      de: 'Anforderung zur Abschaltung der Ansteuerung des Niedervolt-PTC-Wasserheizers'
      it: 'Richiesta di interruzione del comando del riscaldatore PTC acqua a bassa tensione'
      pl: 'Żądanie odcięcia sterowania niskonapięciową nagrzewnicą wody PTC'
      ru: 'Запрос на отключение управления низковольтным PTC-водонагревателем'
      zh: '低压PTC水加热器控制切断请求'
      hu: 'Az alacsony feszültségű PTC vízmelegítő vezérlésének lekapcsolási kérése'
      pt: 'Pedido de corte do comando do aquecedor de água PTC de baixa tensão'
    type: 'bool'
    values:
      0x00:
        en: 'No demand'
        fr: 'Aucune demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无需求'
        hu: 'Nincs igény'
        pt: 'Sem pedido'
      0x01:
        en: 'Demand'
        fr: 'Demande'
        es: 'Solicitud'
        de: 'Anforderung'
        it: 'Richiesta'
        pl: 'Żądanie'
        ru: 'Запрос'
        zh: '请求'
        hu: 'Igény'
        pt: 'Pedido'

  LOW_VOLTAGE_PTC_COOLANT_HEATER_COMMAND:
    bits: '1.0-2.2'
    comment:
      en: 'Low-voltage PTC coolant heater command'
      fr: 'Commande du réchauffeur PTC de liquide de refroidissement basse tension'
      es: 'Mando del calentador PTC del refrigerante de baja tensión'
      de: 'Ansteuerung der Niederspannungs-PTC-Kühlmittelheizung'
      it: 'Comando del riscaldatore PTC del liquido di raffreddamento a bassa tensione'
      pl: 'Sterowanie grzałką PTC płynu chłodzącego niskiego napięcia'
      ru: 'Управление низковольтным PTC-нагревателем охлаждающей жидкости'
      zh: '低压 PTC 冷却液加热器控制'
      hu: 'Kisfeszültségű PTC hűtőfolyadék-fűtés vezérlés'
      pt: 'Comando do aquecedor PTC do líquido de refrigeração de baixa tensão'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0x7F

  LOG_FAULTS:
    bits: '2.0'
    comment:
      en: 'Fault storage locking (fault memory logging disabled)'
      fr: 'Verrouillage de la mémorisation des défauts'
      es: 'Bloqueo del almacenamiento de fallos'
      de: 'Sperrung der Fehlerspeicherung'
      it: 'Blocco della memorizzazione dei guasti'
      pl: 'Blokada zapisu usterek'
      ru: 'Блокировка записи неисправностей в память'
      zh: '故障存储锁定'
      hu: 'A hibatárolás letiltása'
      pt: 'Bloqueio do armazenamento de avarias (registo na memória de avarias desativado)'
    type: 'bool'
    values:
      0x00:
        en: 'Deactivation'
        fr: 'Désactivation'
        es: 'Desactivación'
        de: 'Deaktivierung'
        it: 'Disattivazione'
        pl: 'Dezaktywacja'
        ru: 'Деактивация'
        zh: '停用'
        hu: 'Kikapcsolás'
        pt: 'Desativação'
      0x01:
        en: 'Activation'
        fr: 'Activation'
        es: 'Activación'
        de: 'Aktivierung'
        it: 'Attivazione'
        pl: 'Aktywacja'
        ru: 'Активация'
        zh: '激活'
        hu: 'Aktiválás'
        pt: 'Ativação'
