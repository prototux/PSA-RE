id: 0x25
name: 'RAIN_LIGHT_SENSOR_SLOW_DATA'
type: 'lin'
length: 8
comment:
  en: 'Electric coolant heater status: supply/protection/temperature-sensor faults, interlock state and current consumption.'
  fr: 'État du chauffage électrique du liquide de refroidissement : défauts d''alimentation/protection/sonde de température, état de l''interverrouillage et consommation de courant.'
  es: 'Estado del calentador eléctrico del refrigerante: fallos de alimentación/protección/sonda de temperatura, estado del enclavamiento y consumo de corriente.'
  de: 'Status der elektrischen Kühlmittelheizung: Versorgungs-/Schutz-/Temperatursensorfehler, Verriegelungsstatus und Stromaufnahme.'
  it: 'Stato del riscaldatore elettrico del liquido di raffreddamento: guasti di alimentazione/protezione/sonda di temperatura, stato dell''interblocco e consumo di corrente.'
  pl: 'Stan elektrycznego podgrzewacza płynu chłodzącego: usterki zasilania/zabezpieczeń/czujnika temperatury, stan blokady i pobór prądu.'
  ru: 'Статус электрического подогревателя охлаждающей жидкости: неисправности питания/защиты/датчика температуры, состояние блокировки и потребляемый ток.'
  zh: '电动冷却液加热器状态:供电/保护/温度传感器故障、联锁状态及电流消耗。'
  hu: 'Az elektromos hűtőfolyadék-fűtés állapota: tápellátási/védelmi/hőmérséklet-érzékelő hibák, reteszelési állapot és áramfelvétel.'
  pt: 'Estado do aquecedor elétrico de líquido de arrefecimento: avarias de alimentação/proteção/sensor de temperatura, estado de intertravamento e consumo de corrente.'
periodicity: ['trigger']
senders: ['CTPE']
lin:
  master: 'BSI'

signals:
  PTC_HEATER_WATER_TEMPERATURE:
    bits: '1.0-2.1'
    comment:
      en: 'Water temperature around the PTC heater (low-voltage side)'
      fr: 'Température de l''eau autour du réchauffeur PTC (basse tension)'
      es: 'Temperatura del agua alrededor del calentador PTC (baja tensión)'
      de: 'Wassertemperatur um den PTC-Heizer (Niederspannungsseite)'
      it: 'Temperatura dell''acqua intorno al riscaldatore PTC (bassa tensione)'
      pl: 'Temperatura wody wokół grzałki PTC (strona niskiego napięcia)'
      ru: 'Температура воды вокруг PTC-нагревателя (низковольтная сторона)'
      zh: 'PTC加热器周围的水温（低压侧）'
      hu: 'A víz hőmérséklete a PTC fűtő körül (kisfeszültségű oldal)'
      pt: 'Temperatura da água em torno do aquecedor PTC (baixa tensão)'
    type: 'uint'
    factor: 1
    offset: -40
    min: -40
    max: 214
    units: '°C'
    invalid: 0xFF

  PTC_HEATER_CURRENT:
    bits: '2.0-3.0'
    comment:
      en: 'PTC water heater current draw (low-voltage side)'
      fr: 'Courant consommé par le réchauffeur d''eau PTC (basse tension)'
      es: 'Corriente consumida por el calentador de agua PTC (baja tensión)'
      de: 'Stromaufnahme des PTC-Wasserheizers (Niederspannungsseite)'
      it: 'Corrente assorbita dal riscaldatore d''acqua PTC (bassa tensione)'
      pl: 'Pobór prądu grzałki PTC do wody (strona niskiego napięcia)'
      ru: 'Потребляемый ток PTC-нагревателя охлаждающей жидкости (низковольтная сторона)'
      zh: 'PTC水加热器电流消耗（低压侧）'
      hu: 'A PTC vízmelegítő áramfelvétele (kisfeszültségű oldal)'
      pt: 'Consumo de corrente do aquecedor de água PTC (lado de baixa tensão)'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 50
    units: 'A'
    invalid: 0x1FF

