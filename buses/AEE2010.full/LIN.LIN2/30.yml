id: 0x30
name: 'FRONT_BODY_MODULE_COMMAND'
type: 'lin'
length: 8
comment:
  en: 'Auxiliary heater (BECH) status: fan, dosing pump, glow plug, flame detection and operating faults.'
  fr: 'État du chauffage additionnel (BECH) : ventilateur, pompe de dosage, bougie de préchauffage, détection de flamme et défauts de fonctionnement.'
  es: 'Estado de la calefacción auxiliar (BECH): ventilador, bomba dosificadora, bujía de precalentamiento, detección de llama y fallos de funcionamiento.'
  de: 'Status des Zuheizers (BECH): Gebläse, Dosierpumpe, Glühkerze, Flammenerkennung und Betriebsstörungen.'
  it: 'Stato del riscaldatore ausiliario (BECH): ventola, pompa dosatrice, candeletta, rilevazione fiamma e guasti di funzionamento.'
  pl: 'Stan nagrzewnicy dodatkowej (BECH): wentylator, pompa dozująca, świeca żarowa, wykrywanie płomienia i usterki pracy.'
  ru: 'Статус дополнительного отопителя (BECH): вентилятор, дозирующий насос, свеча накаливания, обнаружение пламени и неисправности работы.'
  zh: '辅助加热器(BECH)状态:风扇、计量泵、预热塞、火焰检测和运行故障。'
  hu: 'A kiegészítő fűtés (BECH) állapota: ventilátor, adagolószivattyú, izzógyertya, lángérzékelés és üzemi hibák.'
  pt: 'Estado do aquecedor auxiliar (BECH): ventilador, bomba de dosagem, vela incandescente, deteção de chama e avarias de funcionamento.'
periodicity: ['trigger']
senders: ['BECH']
lin:
  master: 'BSI'

signals:
  HEATING_DEVICE_WATER_TEMPERATURE:
