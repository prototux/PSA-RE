    comment:
      en: 'Heating device water temperature'
      fr: 'Température de l''eau du dispositif de chauffage'
      es: 'Temperatura del agua del dispositivo de calefacción'
      de: 'Wassertemperatur der Heizeinrichtung'
      it: 'Temperatura dell''acqua del dispositivo di riscaldamento'
      pl: 'Temperatura wody urządzenia grzewczego'
      ru: 'Температура воды отопительного устройства'
      zh: '加热装置水温'
      hu: 'A fűtőberendezés víz-hőmérséklete'
      pt: 'Temperatura da água do dispositivo de aquecimento'
    type: 'uint'
    factor: 1
    offset: -40
    min: -40
    max: 214
