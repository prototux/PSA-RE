id: 0x28
name: 'ADDITIVE_PUMP_COMMAND_2'
type: 'lin'
length: 2
comment:
  en: 'Second additive pump authorisation and volume command, sent by the BSI over LIN.'
  fr: 'Autorisation et commande de volume de la deuxième pompe à additif, envoyées par la BSI sur le bus LIN.'
  es: 'Autorización y orden de volumen de la segunda bomba de aditivo, enviadas por la BSI por el bus LIN.'
  de: 'Freigabe und Volumenbefehl der zweiten Additivpumpe, von der BSI über den LIN-Bus gesendet.'
  it: 'Autorizzazione e comando di volume della seconda pompa additivo, inviati dalla BSI sul bus LIN.'
  pl: 'Zezwolenie i polecenie objętości drugiej pompy dodatku, wysyłane przez BSI po magistrali LIN.'
  ru: 'Разрешение и команда объёма второго насоса присадки, отправляемые BSI по шине LIN.'
  zh: '由BSI通过LIN总线发送的第二个添加剂泵的授权及体积命令。'
  hu: 'A második adalékanyag-szivattyú engedélyezése és térfogatparancsa, a BSI küldi a LIN buszon.'
  pt: 'Autorização e comando de volume da segunda bomba de aditivo, enviados pela BSI via LIN.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['ADDGO']
lin:
  master: 'BSI'

signals:
  ADDITIVE_INJECTION_VOLUME_2:
    bits: '1.0-2.1'
    comment:
      en: 'Additive injection unit volume (pump 2)'
      fr: 'Volume élémentaire d''additif à injecter (pompe 2)'
      es: 'Volumen elemental de aditivo a inyectar (bomba 2)'
      de: 'Elementares Einspritzvolumen des Additivs (Pumpe 2)'
      it: 'Volume elementare di additivo da iniettare (pompa 2)'
      pl: 'Jednostkowa objętość dodatku do wtrysku (pompa 2)'
      ru: 'Элементарный объём впрыскиваемой присадки (насос 2)'
      zh: '添加剂单次喷射量(2号泵)'
      hu: 'Adalékanyag befecskendezési egységtérfogat (2. szivattyú)'
      pt: 'Volume elementar de aditivo a injetar (bomba 2)'
    type: 'uint'
    factor: 5
    min: 0
    max: 253
    invalid: 0xFF

  ADDITIVE_PUMP_2_AUTHORIZATION:
    bits: '2.0'
    comment:
      en: 'Additive pump 2 control authorization'
      fr: 'Autorisation de pilotage de la pompe d''additif 2'
      es: 'Autorización de control de la bomba de aditivo 2'
      de: 'Freigabe der Ansteuerung der Additivpumpe 2'
      it: 'Autorizzazione di comando della pompa additivo 2'
      pl: 'Zezwolenie na sterowanie pompą dodatku 2'
      ru: 'Разрешение управления насосом присадки 2'
      zh: '2号添加剂泵控制授权'
      hu: '2. adalékanyag-szivattyú vezérlés engedélyezése'
      pt: 'Autorização de controlo da bomba de aditivo 2'
    type: 'bool'
    values:
      0x00:
        en: 'Control forbidden'
        fr: 'Pilotage interdit'
        es: 'Control prohibido'
        de: 'Ansteuerung verboten'
        it: 'Pilotaggio vietato'
        pl: 'Sterowanie zabronione'
        ru: 'Управление запрещено'
        zh: '禁止控制'
        hu: 'A vezérlés tiltva'
        pt: 'Controlo proibido'
      0x01:
        en: 'Control authorized'
        fr: 'Pilotage autorisé'
        es: 'Control autorizado'
        de: 'Ansteuerung zulässig'
        it: 'Comando autorizzato'
        pl: 'Sterowanie dozwolone'
        ru: 'Управление разрешено'
        zh: '控制已授权'
        hu: 'Vezérlés engedélyezve'
        pt: 'Controlo autorizado'
