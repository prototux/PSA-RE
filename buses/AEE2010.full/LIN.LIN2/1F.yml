id: 0x1F
name: 'BATTERY_MONITOR_WAKEUP_STATUS'
type: 'lin'
length: 2
comment:
  en: 'Battery monitor wake-up status: wake-up attempt counter and predicted-voltage threshold flag.'
  fr: 'État de réveil du moniteur de batterie : compteur de tentatives de réveil et indicateur de seuil de tension prédite.'
  es: 'Estado de activación del monitor de batería: contador de intentos de activación e indicador de umbral de tensión prevista.'
  de: 'Aufwachstatus der Batterieüberwachung: Zähler für Aufwachversuche und Kennzeichen für den vorhergesagten Spannungsschwellwert.'
  it: 'Stato di risveglio del monitor batteria: contatore dei tentativi di risveglio e indicatore di soglia di tensione prevista.'
  pl: 'Stan wybudzania monitora akumulatora: licznik prób wybudzenia i flaga progu przewidywanego napięcia.'
  ru: 'Статус пробуждения монитора батареи: счётчик попыток пробуждения и флаг порога прогнозируемого напряжения.'
  zh: '电池监测器唤醒状态:唤醒尝试计数器及预测电压阈值标志。'
  hu: 'Az akkumulátorfigyelő ébresztési állapota: ébresztési kísérletek számlálója és a becsült feszültségküszöb jelzője.'
  pt: 'Estado de ativação do monitor da bateria: contador de tentativas de ativação e indicador do limiar de tensão previsto.'
periodicity: ['trigger']
senders: ['BECB']
receivers: ['BSI']
lin:
  master: 'BSI'

signals:
  UNUSED_1:
    bits: '1.7-1.2'
    unused: true

  UPRED_THRESHOLD_REACHED:
    bits: '1.1'
    comment:
      en: 'Underinflation detection threshold reached'
      fr: 'Seuil de détection de sous-gonflage atteint'
      es: 'Umbral de detección de baja presión alcanzado'
      de: 'Schwelle zur Erkennung von Unterdruck erreicht'
      it: 'Soglia di rilevamento sottogonfiaggio raggiunta'
      pl: 'Osiągnięto próg wykrywania niskiego ciśnienia'
      ru: 'Достигнут порог обнаружения недостаточного давления'
      zh: '达到胎压不足检测阈值'
      hu: 'Elérve az alacsony nyomás észlelési küszöbe'
      pt: 'Limiar de deteção de pressão insuficiente atingido'
    type: 'bool'
    values:
      0x00:
        en: 'No threshold exceeded'
        fr: 'Pas de seuil franchi'
        es: 'Ningún umbral superado'
        de: 'Kein Schwellenwert überschritten'
        it: 'Nessuna soglia superata'
        pl: 'Brak przekroczonego progu'
        ru: 'Ни один порог не превышен'
        zh: '未超出阈值'
        hu: 'Nincs küszöbérték túllépve'
        pt: 'Nenhum limiar excedido'
      0x01:
        en: 'Threshold exceeded'
        fr: 'Seuil franchi'
        es: 'Umbral superado'
        de: 'Schwellenwert überschritten'
        it: 'Soglia superata'
        pl: 'Próg przekroczony'
        ru: 'Порог превышен'
        zh: '超过阈值'
        hu: 'Küszöbérték túllépve'
        pt: 'Limiar excedido'

  UNUSED_2:
    bits: '2.7-2.4'
    unused: true

  WAKEUP_ATTEMPT_COUNTER:
    bits: '2.3-2.0'
    comment:
      en: 'Number of wake-up attempts by the ECU'
      fr: 'Nombre de tentatives de réveil du calculateur'
      es: 'Número de intentos de activación del calculador'
      de: 'Anzahl der Aufwachversuche des Steuergeräts'
      it: 'Numero di tentativi di risveglio della centralina'
      pl: 'Liczba prób wybudzenia sterownika'
      ru: 'Число попыток пробуждения блока управления'
      zh: 'ECU唤醒尝试次数'
      hu: 'A vezérlőegység ébresztési kísérleteinek száma'
      pt: 'Número de tentativas de ativação da unidade de controlo'
    type: 'uint'
    min: 0
    max: 14
