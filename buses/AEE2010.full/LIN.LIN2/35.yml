id: 0x35
name: 'BATTERY_MONITOR_STATUS'
type: 'lin'
length: 8
comment:
  en: 'Battery monitor status: internal faults (current, RAM, ROM, coding, temperature, voltage, watchdog), low-current internal resistance state, state-of-charge status and value.'
  fr: 'État du moniteur de batterie : défauts internes (courant, RAM, ROM, télécodage, température, tension, watchdog), état de résistance interne à faible courant, statut et valeur de l''état de charge.'
  es: 'Estado del monitor de batería: fallos internos (corriente, RAM, ROM, telecodificación, temperatura, tensión, watchdog), estado de resistencia interna a baja corriente, estado y valor del estado de carga.'
  de: 'Status der Batterieüberwachung: interne Fehler (Strom, RAM, ROM, Codierung, Temperatur, Spannung, Watchdog), Zustand des Innenwiderstands bei niedrigem Strom, Ladezustandsstatus und -wert.'
  it: 'Stato del monitor batteria: guasti interni (corrente, RAM, ROM, codifica, temperatura, tensione, watchdog), stato della resistenza interna a bassa corrente, stato e valore dello stato di carica.'
  pl: 'Stan monitora akumulatora: usterki wewnętrzne (prąd, RAM, ROM, kodowanie, temperatura, napięcie, watchdog), stan rezystancji wewnętrznej przy małym prądzie, status i wartość stanu naładowania.'
  ru: 'Статус монитора батареи: внутренние неисправности (ток, RAM, ROM, кодирование, температура, напряжение, сторожевой таймер), состояние внутреннего сопротивления при малом токе, статус и значение заряда.'
  zh: '电池监测器状态:内部故障(电流、RAM、ROM、编码、温度、电压、看门狗)、低电流内阻状态、荷电状态及数值。'
  hu: 'Az akkumulátorfigyelő állapota: belső hibák (áram, RAM, ROM, kódolás, hőmérséklet, feszültség, watchdog), alacsony áramú belső ellenállás állapota, töltöttségi állapot és érték.'
  pt: 'Estado do monitor da bateria: avarias internas (corrente, RAM, ROM, codificação, temperatura, tensão, watchdog), estado da resistência interna a baixa corrente, estado e valor do estado de carga.'
periodicity: ['trigger']
senders: ['BECB']
receivers: ['BSI']
lin:
  master: 'BSI'

signals:
  BATTERY_STATE_OF_CHARGE:
    bits: '1.0-2.2'
    comment:
      en: 'Battery state of charge value'
      fr: 'Valeur de l''état de charge de la batterie'
      es: 'Valor del estado de carga de la batería'
      de: 'Wert des Ladezustands der Batterie'
      it: 'Valore dello stato di carica della batteria'
      pl: 'Wartość stanu naładowania akumulatora'
      ru: 'Значение уровня заряда батареи'
      zh: '电池荷电状态值'
      hu: 'Az akkumulátor töltöttségi állapotának értéke'
      pt: 'Valor do estado de carga da bateria'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0x7F
    alternatives:
      - note:
          en: 'Also observed at bits 1.6-1.0'
          fr: 'Aussi observé aux bits 1.6-1.0'
          es: 'También observado en los bits 1.6-1.0'
          de: 'Auch an den Bits 1.6-1.0 beobachtet'
          it: 'Osservato anche ai bit 1.6-1.0'
          pl: 'Obserwowany także na bitach 1.6-1.0'
          ru: 'Также наблюдался в битах 1.6-1.0'
          zh: '也观察到位于位1.6-1.0'
          hu: 'Megfigyelve a(z) 1.6-1.0 biteken is'
          pt: 'Também observado nos bits 1.6-1.0'
        bits: '1.6-1.0'

