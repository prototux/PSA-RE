id: 0x0F
name: 'ANTITHEFT_PUSH_BUTTON_STATUS'
type: 'lin'
length: 2
comment:
  en: 'Anti-theft box status: push-button state, clutch/brake pedal switch, electric parking brake command, power relay.'
  fr: 'État du boîtier antivol : état du bouton poussoir, contacteur pédale, commande de frein de stationnement électrique, relais de puissance.'
  es: 'Estado de la unidad antirrobo: estado del pulsador, interruptor de pedal, mando del freno de estacionamiento eléctrico, relé de potencia.'
  de: 'Status der Diebstahlsicherungseinheit: Tastenstatus, Pedalschalter, Ansteuerung der elektrischen Feststellbremse, Leistungsrelais.'
  it: 'Stato dell''unità antifurto: stato del pulsante, interruttore pedale, comando del freno di stazionamento elettrico, relè di potenza.'
  pl: 'Stan modułu antywłamaniowego: stan przycisku, wyłącznik pedału, sterowanie elektrycznym hamulcem postojowym, przekaźnik mocy.'
  ru: 'Статус блока противоугонной защиты: состояние кнопки, выключатель педали, команда электрического стояночного тормоза, силовое реле.'
  zh: '防盗盒状态:按钮状态、踏板开关、电子驻车制动指令、功率继电器。'
  hu: 'A lopásgátló egység állapota: nyomógomb állapota, pedálkapcsoló, elektromos rögzítőfék parancs, teljesítményrelé.'
  pt: 'Estado da caixa antirroubo: estado do botão, comutador do pedal de embraiagem/travão, comando do travão de estacionamento elétrico, relé de potência.'
periodicity: ['trigger']
senders: []  # TODO: find the sender(s)
lin:
  master: 'BSI'

