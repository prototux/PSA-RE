              zh: '也观察到位于位4.7-4.2'
              hu: 'Megfigyelve a(z) 4.7-4.2 biteken is'
              pt: 'Também observado nos bits 4.7-4.2'
            bits: '4.7-4.2'
      BATTERY_MIN_VOLTAGE:
        bits: '6.1-7.0'
        comment:
          en: 'Minimum battery voltage measured at the last start'
          fr: 'Tension batterie minimale mesurée au dernier démarrage.'
          es: 'Tensión mínima de la batería medida en el último arranque'
          de: 'Minimale Batteriespannung, gemessen beim letzten Start'
          it: 'Tensione minima della batteria misurata all''ultimo avviamento'
          pl: 'Minimalne napięcie akumulatora zmierzone przy ostatnim uruchomieniu'
          ru: 'Минимальное напряжение батареи, измеренное при последнем пуске'
          zh: '上次启动时测得的电池最低电压'
          hu: 'Az utolsó indításkor mért minimális akkumulátorfeszültség'
          pt: 'Tensão mínima da bateria medida no último arranque.'
        type: 'uint'
        factor: 0.013
        min: 3
        max: 13
        units: 'V'
        invalid: 0x3FF
        alternatives:
          - note:
              en: 'Also observed at bits 6.1-7.2. Also observed with another scaling (factor 0.1)'
              fr: 'Aussi observé aux bits 6.1-7.2. Aussi observé avec une autre mise à l''échelle (factor 0.1)'
              es: 'También observado en los bits 6.1-7.2. También observado con otro escalado (factor 0.1)'
              de: 'Auch an den Bits 6.1-7.2 beobachtet. Auch mit anderer Skalierung beobachtet (factor 0.1)'
              it: 'Osservato anche ai bit 6.1-7.2. Osservato anche con un''altra scala (factor 0.1)'
              pl: 'Obserwowany także na bitach 6.1-7.2. Obserwowany także z innym skalowaniem (factor 0.1)'
              ru: 'Также наблюдался в битах 6.1-7.2. Также наблюдался с другим масштабом (factor 0.1)'
              zh: '也观察到位于位6.1-7.2. 也观察到使用另一种缩放（factor 0.1）'
              hu: 'Megfigyelve a(z) 6.1-7.2 biteken is. Megfigyelve más skálázással is (factor 0.1)'
              pt: 'Também observado nos bits 6.1-7.2. Também observado com outra escala (factor 0.1)'
            bits: '6.1-7.2'
            factor: 0.1
