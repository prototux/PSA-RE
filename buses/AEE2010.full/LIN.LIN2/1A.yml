id: 0x1A
name: 'CLOCK_MODULE_COMMAND'
type: 'lin'
length: 5
comment:
  en: 'Commands sent by the BSI to the clock module over LIN: panel backlight, fault erase, powertrain/day-night/electrical system states, clock hour/minute and brightness.'
  fr: 'Commandes envoyées par la BSI au module horloge sur le bus LIN : rétroéclairage du panneau, effacement défaut, états GMP/jour-nuit/réseau électrique, heure/minute de l''horloge et luminosité.'
  es: 'Órdenes enviadas por la BSI al módulo reloj por el bus LIN: retroiluminación del panel, borrado de fallo, estados de GMP/día-noche/red eléctrica, hora/minuto del reloj y luminosidad.'
  de: 'Von der BSI an das Uhrmodul über den LIN-Bus gesendete Befehle: Panel-Hintergrundbeleuchtung, Fehlerlöschung, Antriebs-/Tag-Nacht-/Bordnetzzustände, Uhrzeit/Minute und Helligkeit.'
  it: 'Comandi inviati dalla BSI al modulo orologio sul bus LIN: retroilluminazione del pannello, cancellazione guasto, stati GMP/giorno-notte/rete elettrica, ora/minuto dell''orologio e luminosità.'
  pl: 'Polecenia wysyłane przez BSI do modułu zegara po magistrali LIN: podświetlenie panelu, kasowanie usterki, stany napędu/dzień-noc/sieci elektrycznej, godzina/minuta zegara i jasność.'
  ru: 'Команды, отправляемые BSI в модуль часов по шине LIN: подсветка панели, стирание неисправности, состояния силовой установки/день-ночь/электросети, часы/минуты и яркость.'
  zh: '由BSI通过LIN总线发送给时钟模块的命令：面板背光、故障清除、动力总成/昼夜/电气系统状态、时钟时分及亮度。'
  hu: 'A BSI parancsai az óramodul felé a LIN buszon: panel háttérvilágítása, hibatörlés, hajtáslánc-/nappal-éjszaka-/elektromos rendszer állapotok, óra/perc és fényerő.'
  pt: 'Comandos enviados pela BSI ao módulo do relógio via LIN: retroiluminação do painel, apagamento de avarias, estados do grupo motopropulsor/dia-noite/sistema elétrico, hora/minuto do relógio e luminosidade.'
periodicity: ['trigger']
senders: ['BSI']
lin:
  master: 'BSI'

