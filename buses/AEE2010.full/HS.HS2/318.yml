  ACC_TORQUE_EFFECTIVE_STATUS:
    bits: '5.0'
    comment:
      en: 'Whether the torque requested by the ACC (adaptive cruise) is effectively applied'
      fr: 'Effectivité du couple demandé par le régulateur adaptatif (ACC)'
      es: 'Efectividad del par solicitado por el control de crucero adaptativo (ACC)'
      de: 'Wirksamkeit des vom adaptiven Tempomaten (ACC) angeforderten Drehmoments'
      it: 'Effettività della coppia richiesta dal cruise control adattivo (ACC)'
      pl: 'Skuteczność momentu żądanego przez adaptacyjny tempomat (ACC)'
      ru: 'Эффективность момента, запрошенного адаптивным круиз-контролем (ACC)'
      zh: '自适应巡航(ACC)请求扭矩的生效状态'
      hu: 'Az adaptív sebességtartó (ACC) által kért nyomaték érvényesülése'
      pt: 'Efetividade do binário solicitado pelo regulador adaptativo (ACC)'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'The torque requested by the ACC is not achieved (driver torque achieved)'
        fr: 'Le couple demandé par le régulateur de vitesse adaptatif n''est pas réalisé (couple conducteur réalisé)'
        es: 'El par solicitado por el control de crucero adaptativo no se logra (par del conductor logrado)'
        de: 'Das vom ACC angeforderte Drehmoment wird nicht erreicht (Fahrerdrehmoment erreicht)'
        it: 'La coppia richiesta dal cruise control adattivo non è raggiunta (coppia del conducente raggiunta)'
        pl: 'Moment żądany przez adaptacyjny tempomat nie jest osiągany (moment kierowcy osiągnięty)'
        ru: 'Крутящий момент, запрошенный адаптивным круиз-контролем, не достигнут (момент водителя достигнут)'
        zh: '自适应巡航请求的扭矩未实现（驾驶员扭矩已实现）'
        hu: 'Az adaptív tempomat által kért nyomaték nem valósul meg (a vezetői nyomaték megvalósul)'
        pt: 'O binário pedido pelo regulador de velocidade adaptativo não é alcançado (binário do condutor alcançado)'
      0x01:
        en: 'The torque requested by the MDD is achieved'
        fr: 'Le couple demandé par le MDD est réalisé'
        es: 'El par solicitado por el MDD se ha alcanzado'
        de: 'Das vom MDD angeforderte Drehmoment ist erreicht'
        it: 'La coppia richiesta dal MDD è realizzata'
        pl: 'Moment obrotowy żądany przez MDD został osiągnięty'
        ru: 'Момент, запрошенный MDD, достигнут'
        zh: 'MDD请求的扭矩已实现'
        hu: 'Az MDD által kért nyomaték elérve'
        pt: 'O binário pedido pela MDD é atingido'
