id: 0x54C
name: 'NIGHT_VISION_DETECTION'
type: 'can'
length: 4
comment:
  en: 'Night-vision system data: animal and pedestrian detection, pedestrian alert state and system state.'
  fr: 'Données du système de vision nocturne : détection d''animal et de piéton, état d''alerte piéton et état système.'
  es: 'Datos del sistema de visión nocturna: detección de animal y peatón, estado de alerta de peatón y estado del sistema.'
  de: 'Daten des Nachtsichtsystems: Tier- und Fußgängererkennung, Fußgänger-Warnstatus und Systemstatus.'
  it: 'Dati del sistema di visione notturna: rilevamento animale e pedone, stato di allerta pedone e stato del sistema.'
  pl: 'Dane systemu widzenia nocnego: wykrycie zwierzęcia i pieszego, stan alarmu pieszego i stan systemu.'
  ru: 'Данные системы ночного видения: обнаружение животного и пешехода, статус предупреждения о пешеходе и статус системы.'
  zh: '夜视系统数据:动物和行人检测、行人警报状态和系统状态。'
  hu: 'Az éjjellátó rendszer adatai: állat- és gyalogosészlelés, gyalogos-riasztási állapot és rendszerállapot.'
  pt: 'Dados do sistema de visão noturna: deteção de animais e peões, estado do alerta de peões e estado do sistema.'
observations:
  en: 'On state change of: PEDESTRIAN_DETECTION_ALERT, ANIMAL_DETECTION_ALERT, PEDESTRIAN_DETECTION_STATE, PEDESTRIAN_DETECTION_FUNCTION_STATUS'
  fr: 'Sur changement d''état de : PEDESTRIAN_DETECTION_ALERT, ANIMAL_DETECTION_ALERT, PEDESTRIAN_DETECTION_STATE, PEDESTRIAN_DETECTION_FUNCTION_STATUS'
  es: 'Al cambiar el estado de: PEDESTRIAN_DETECTION_ALERT, ANIMAL_DETECTION_ALERT, PEDESTRIAN_DETECTION_STATE, PEDESTRIAN_DETECTION_FUNCTION_STATUS'
  de: 'Bei Statusänderung von: PEDESTRIAN_DETECTION_ALERT, ANIMAL_DETECTION_ALERT, PEDESTRIAN_DETECTION_STATE, PEDESTRIAN_DETECTION_FUNCTION_STATUS'
  it: 'Al cambiamento di stato di: PEDESTRIAN_DETECTION_ALERT, ANIMAL_DETECTION_ALERT, PEDESTRIAN_DETECTION_STATE, PEDESTRIAN_DETECTION_FUNCTION_STATUS'
  pl: 'Wysyłane przy zmianie stanu: PEDESTRIAN_DETECTION_ALERT, ANIMAL_DETECTION_ALERT, PEDESTRIAN_DETECTION_STATE, PEDESTRIAN_DETECTION_FUNCTION_STATUS'
  ru: 'При изменении состояния: PEDESTRIAN_DETECTION_ALERT, ANIMAL_DETECTION_ALERT, PEDESTRIAN_DETECTION_STATE, PEDESTRIAN_DETECTION_FUNCTION_STATUS'
  zh: '当AVN_DETECT_PEDESTRIAN, ANIMAL_DETECTION_ALERT, PEDESTRIAN_DETECTION_STATE, AVN_STATE状态变化时'
  hu: 'A(z) PEDESTRIAN_DETECTION_ALERT, ANIMAL_DETECTION_ALERT, PEDESTRIAN_DETECTION_STATE, PEDESTRIAN_DETECTION_FUNCTION_STATUS állapotváltozásakor'
  pt: 'Na mudança de estado de: PEDESTRIAN_DETECTION_ALERT, ANIMAL_DETECTION_ALERT, PEDESTRIAN_DETECTION_STATE, PEDESTRIAN_DETECTION_FUNCTION_STATUS'
periodicity: ['200ms', 'trigger']
senders: ['BVN']
receivers: ['BSI']

