id: 0x2CD
name: 'WHEEL_PULSE_COUNTER_DATA'
type: 'can'
length: 3
comment:
  en: 'Wheel-speed sensor pulse counters and fault flags for each wheel.'
  fr: 'Compteurs d''impulsions des capteurs de vitesse de roue et indicateurs de défaut pour chaque roue.'
  es: 'Contadores de impulsos de los sensores de velocidad de rueda e indicadores de fallo de cada rueda.'
  de: 'Impulszähler der Raddrehzahlsensoren und Fehlerkennungen für jedes Rad.'
  it: 'Contatori di impulsi dei sensori di velocità ruota e indicatori di guasto per ciascuna ruota.'
  pl: 'Liczniki impulsów czujników prędkości koła oraz flagi usterek dla każdego koła.'
  ru: 'Счётчики импульсов датчиков скорости колёс и флаги неисправности для каждого колеса.'
  zh: '各车轮轮速传感器脉冲计数及故障标志。'
  hu: 'A kerékfordulatszám-érzékelők impulzusszámlálói és hibajelzői kerekenként.'
  pt: 'Contadores de impulsos e indicadores de avaria dos sensores de velocidade das rodas, para cada roda.'
periodicity: ['20ms']
senders: ['ABS']
receivers: ['VCU', 'CMM', 'BVA', 'BSI', 'E_VCU', 'BVN']

signals:
  AUTOMATIC_BRAKING_CIRCUIT_PRESSURE:
    bits: '1.7-1.0'
    comment:
      en: 'Hydraulic circuit pressure during automatic braking'
      fr: 'Pression du circuit hydraulique en cas de freinage automatique'
      es: 'Presión del circuito hidráulico en caso de frenado automático'
      de: 'Hydraulikdruck bei automatischer Bremsung'
      it: 'Pressione del circuito idraulico in caso di frenata automatica'
      pl: 'Ciśnienie w układzie hydraulicznym podczas automatycznego hamowania'
      ru: 'Давление в гидравлическом контуре при автоматическом торможении'
      zh: '自动制动时液压回路压力'
      hu: 'A hidraulikus kör nyomása automatikus fékezéskor'
      pt: 'Pressão do circuito hidráulico em caso de travagem automática'
    type: 'uint'
    factor: 0.2
    min: 0
    max: 50.6
    units: 'bar'
    invalid: 0xFF
    default: 0x00
