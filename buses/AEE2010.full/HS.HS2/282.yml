id: 0x282
name: 'ELECTRONIC_BRAKE_BOOSTER_DATA'
type: 'can'
length: 5
comment:
  en: 'Electronic brake booster data: brake-pedal position and activation state, plus external braking-request priority and status.'
  fr: 'Données de l''amplificateur de freinage électronique : position et activation de la pédale de frein, ainsi que priorité et état des demandes de freinage externes.'
  es: 'Datos del servofreno electrónico: posición y activación del pedal de freno, así como prioridad y estado de las solicitudes de frenado externas.'
  de: 'Daten des elektronischen Bremskraftverstärkers: Bremspedalposition und -aktivierung sowie Priorität und Status externer Bremsanforderungen.'
  it: 'Dati del servofreno elettronico: posizione e attivazione del pedale del freno, nonché priorità e stato delle richieste di frenata esterne.'
  pl: 'Dane elektronicznego wspomagania hamowania: pozycja i aktywacja pedału hamulca oraz priorytet i stan zewnętrznych żądań hamowania.'
  ru: 'Данные электронного усилителя тормозов: положение и активация педали тормоза, а также приоритет и статус внешних запросов торможения.'
  zh: '电子制动助力器数据:制动踏板位置及激活状态,以及外部制动请求的优先级和状态。'
  hu: 'Az elektronikus fékrásegítő adatai: a fékpedál helyzete és aktiválása, valamint a külső fékezési kérések prioritása és állapota.'
  pt: 'Dados do servofreio eletrónico: posição e estado de ativação do pedal do travão, além de prioridade e estado do pedido de travagem externo.'
periodicity: ['10ms']
senders: ['EBB']
receivers: ['ABS']

signals:
  PROCESS_COUNTER:
    bits: '1.7-1.4'
    comment:
      en: 'Rolling counter incremented at each calculation cycle'
      fr: 'Compteur cyclique incrémenté à chaque cycle de calcul'
      es: 'Contador cíclico incrementado en cada ciclo de cálculo'
      de: 'Zyklischer Zähler, der bei jedem Berechnungszyklus erhöht wird'
      it: 'Contatore ciclico incrementato a ogni ciclo di calcolo'
      pl: 'Licznik cykliczny zwiększany przy każdym cyklu obliczeń'
      ru: 'Циклический счётчик, увеличивающийся на каждом цикле расчёта'
      zh: '每个计算周期递增的循环计数器'
      hu: 'A számítási ciklus minden lépésekor növekvő ciklikus számláló'
      pt: 'Contador cíclico incrementado a cada ciclo de cálculo'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00

  FRAME_CHECKSUM:
    bits: '1.3-1.0'
    comment:
      en: 'Checksum of the frame'
      fr: 'Somme de contrôle (checksum) de la trame'
      es: 'Suma de comprobación (checksum) de la trama'
      de: 'Prüfsumme (Checksum) des Frames'
      it: 'Checksum del frame'
      pl: 'Suma kontrolna (checksum) ramki'
      ru: 'Контрольная сумма кадра'
      zh: '帧校验和'
      hu: 'A keret ellenőrző összege (checksum)'
      pt: 'Soma de verificação da trama'
    type: 'uint'

  EBB_BRAKE_PEDAL_POSITION:
    bits: '2.7-3.4'
    comment:
      en: 'Brake pedal position sent by the electric brake booster (EBB)'
      fr: 'Position de la pédale de frein transmise par le servofrein électrique (EBB)'
      es: 'Posición del pedal de freno transmitida por el servofreno eléctrico (EBB)'
      de: 'Vom elektrischen Bremskraftverstärker (EBB) übermittelte Bremspedalposition'
      it: 'Posizione del pedale del freno trasmessa dal servofreno elettrico (EBB)'
      pl: 'Pozycja pedału hamulca przesyłana przez elektryczny wspomagacz hamulca (EBB)'
      ru: 'Положение педали тормоза, передаваемое электрическим усилителем тормозов (EBB)'
      zh: '电子制动助力器(EBB)发送的刹车踏板位置'
      hu: 'Az elektromos fékrásegítő (EBB) által küldött fékpedál-helyzet'
      pt: 'Posição do pedal do travão transmitida pelo servofreio elétrico (EBB)'
    type: 'uint'
    factor: 0.015625
    offset: -5
    min: -5
    max: 47
    units: 'mm'
    invalid: 0xFFF

  EBB_BRAKE_PEDAL_FLUID_POSITION:
    bits: '3.3-4.0'
    comment:
      en: 'Brake pedal position representing the brake fluid volume moved'
      fr: 'Position de la pédale de frein représentant le volume de liquide de frein déplacé'
      es: 'Posición del pedal de freno que representa el volumen de líquido de frenos desplazado'
      de: 'Bremspedalposition entsprechend dem verschobenen Bremsflüssigkeitsvolumen'
      it: 'Posizione del pedale del freno che rappresenta il volume di liquido dei freni spostato'
      pl: 'Pozycja pedału hamulca odpowiadająca przemieszczonej objętości płynu hamulcowego'
      ru: 'Положение педали тормоза, соответствующее перемещённому объёму тормозной жидкости'
      zh: '表示制动液移动量的刹车踏板位置'
      hu: 'A fékpedál helyzete, amely a mozgatott fékfolyadék-térfogatot jelzi'
      pt: 'Posição do pedal do travão que representa o volume de líquido de travões deslocado'
    type: 'uint'
    factor: 0.015625
    offset: -5
    min: -5
    max: 47
    units: 'mm'
    invalid: 0xFFF

  EBR_FUNCTION_STATUS:
    bits: '5.7-5.6'
    comment:
      en: 'Status of the external braking request (EBR) function'
      fr: 'Etat de la fonction de demande de freinage externe (EBR)'
      es: 'Estado de la función de solicitud de frenado externa (EBR)'
      de: 'Status der Funktion der externen Bremsanforderung (EBR)'
      it: 'Stato della funzione di richiesta di frenata esterna (EBR)'
      pl: 'Stan funkcji zewnętrznego żądania hamowania (EBR)'
      ru: 'Состояние функции внешнего запроса торможения (EBR)'
      zh: '外部制动请求(EBR)功能状态'
      hu: 'A külső fékkérés (EBR) funkció állapota'
      pt: 'Estado da função de pedido de travagem externo (EBR)'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'EBR not initialised'
        fr: 'EBR non initialisé'
        es: 'EBR no inicializado'
        de: 'EBR nicht initialisiert'
        it: 'EBR non inizializzato'
        pl: 'EBR niezainicjowany'
        ru: 'EBR не инициализирован'
        zh: 'EBR未初始化'
        hu: 'EBR nincs inicializálva'
        pt: 'EBR não inicializado'
      0x01:
        en: 'EBR Not Available'
        fr: 'EBR non disponible'
        es: 'EBR no disponible'
        de: 'EBR nicht verfügbar'
        it: 'EBR non disponibile'
        pl: 'EBR niedostępne'
        ru: 'EBR недоступно'
        zh: 'EBR不可用'
        hu: 'EBR nem elérhető'
        pt: 'EBR não disponível'
      0x02:
        en: 'EBR available'
        fr: 'EBR disponible'
        es: 'EBR disponible'
        de: 'EBR verfügbar'
        it: 'EBR disponibile'
        pl: 'EBR dostępny'
        ru: 'EBR доступен'
        zh: 'EBR可用'
        hu: 'EBR elérhető'
        pt: 'EBR disponível'
      0x03:
        unused: true

  EBR_BRAKING_PRIORITY_STATUS:
    bits: '5.5'
    comment:
      en: 'External braking request (EBR) dominates the braking torque'
      fr: 'La demande de freinage externe (EBR) est dominante sur le couple de freinage'
      es: 'La solicitud de frenado externa (EBR) predomina sobre el par de frenado'
      de: 'Die externe Bremsanforderung (EBR) dominiert das Bremsmoment'
      it: 'La richiesta di frenata esterna (EBR) è dominante sulla coppia frenante'
      pl: 'Zewnętrzne żądanie hamowania (EBR) dominuje nad momentem hamowania'
      ru: 'Внешний запрос торможения (EBR) преобладает над тормозным моментом'
      zh: '外部制动请求(EBR)主导制动扭矩'
      hu: 'A külső fékkérés (EBR) dominál a fékező nyomaték felett'
      pt: 'O pedido de travagem externo (EBR) domina o binário de travagem'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'EBR does not dominate the braking torque'
        fr: 'L''EBR ne domine pas le couple de freinage'
        es: 'El EBR no domina el par de frenado'
        de: 'EBR dominiert nicht das Bremsmoment'
        it: 'L''EBR non domina la coppia frenante'
        pl: 'EBR nie dominuje nad momentem hamowania'
        ru: 'EBR не доминирует над тормозным моментом'
        zh: 'EBR未主导制动扭矩'
        hu: 'Az EBR nem dominál a fékezőnyomatékban'
        pt: 'O EBR não domina o binário de travagem'
      0x01:
        en: 'EBR dominates the brake torque'
        fr: 'L''EBR domine le couple de freinage'
        es: 'El EBR domina el par de frenado'
        de: 'EBR dominiert das Bremsmoment'
        it: 'L''EBR domina la coppia frenante'
        pl: 'EBR dominuje moment hamowania'
        ru: 'EBR доминирует над тормозным моментом'
        zh: 'EBR主导制动扭矩'
        hu: 'Az EBR uralja a fékezőnyomatékot'
        pt: 'O EBR domina o binário de travagem'

  UNUSED_1:
    bits: '5.4-5.0'
    unused: true
