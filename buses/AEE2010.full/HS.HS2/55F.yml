id: 0x55F
name: 'BSI_FAULT_LOG_ACK'
type: 'can'
length: 1
comment:
  en: 'Acknowledgement frame for the BSI fault log.'
  fr: 'Trame d''accusé de réception du journal des défauts de la BSI.'
  es: 'Trama de confirmación del registro de fallos de la BSI.'
  de: 'Bestätigungsrahmen für das Fehlerprotokoll der BSI.'
  it: 'Trama di conferma del registro guasti della BSI.'
  pl: 'Ramka potwierdzająca dziennik usterek BSI.'
  ru: 'Кадр подтверждения журнала неисправностей BSI.'
  zh: 'BSI故障日志的确认帧。'
  hu: 'A BSI hibanaplójának nyugtázó kerete.'
  pt: 'Trama de confirmação do registo de avarias da BSI.'
observations:
  en: 'Event-triggered, sent from BSI to the ECUs.'
  fr: 'Événementiel, envoyé de BSI vers les calculateurs.'
  es: 'Basado en eventos, enviado desde BSI hasta las ECU.'
  de: 'Ereignisgesteuert, gesendet von BSI zu die Steuergeräte.'
  it: 'Basato su eventi, inviato da BSI a le centraline.'
  pl: 'Zdarzeniowe, wysyłane z BSI do sterowniki.'
  ru: 'Событийное, передаётся от BSI к блоки управления.'
  zh: '事件触发,从BSI发送到各ECU。'
  hu: 'Eseményvezérelt, BSI-tól a vezérlőegységek felé küldve.'
  pt: 'Baseado em eventos, enviado da BSI para as unidades de controlo.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['BVN', 'ACCEL_SENSOR', 'MCM', 'ARTIV']

