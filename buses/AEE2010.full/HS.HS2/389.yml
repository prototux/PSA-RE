id: 0x389
name: 'GEARBOX_DYNAMIC_DATA_2'
type: 'can'
length: 5
comment:
  en: 'Longitudinal acceleration, distance travelled and vehicle speed, sent by the BSI to the gearbox.'
  fr: 'Accélération longitudinale, distance parcourue et vitesse véhicule, envoyées par la BSI à la boîte de vitesses.'
  es: 'Aceleración longitudinal, distancia recorrida y velocidad del vehículo, enviadas por la BSI a la caja de cambios.'
  de: 'Längsbeschleunigung, zurückgelegte Strecke und Fahrzeuggeschwindigkeit, von der BSI an das Getriebe gesendet.'
  it: 'Accelerazione longitudinale, distanza percorsa e velocità del veicolo, inviate dalla BSI al cambio.'
  pl: 'Przyspieszenie wzdłużne, przejechany dystans i prędkość pojazdu, wysyłane przez BSI do skrzyni biegów.'
  ru: 'Продольное ускорение, пройденное расстояние и скорость автомобиля, отправляемые BSI в коробку передач.'
  zh: '由BSI发送给变速箱的纵向加速度、行驶距离和车速。'
  hu: 'Hosszirányú gyorsulás, megtett táv és jármű sebessége, a BSI küldi a váltónak.'
  pt: 'Aceleração longitudinal, distância percorrida e velocidade do veículo, enviadas pela BSI à caixa de velocidades.'
periodicity: ['40ms']
senders: ['BVA']
receivers: ['BSI']

signals:
  VEHICLE_SPEED:
    bits: '1.7-2.0'
    comment:
      en: 'Vehicle speed (16-bit)'
      fr: 'Vitesse du véhicule (16 bits)'
      es: 'Velocidad del vehículo (16 bits)'
      de: 'Fahrzeuggeschwindigkeit (16 Bit)'
      it: 'Velocità del veicolo (16 bit)'
      pl: 'Prędkość pojazdu (16 bitów)'
      ru: 'Скорость автомобиля (16 бит)'
      zh: '车速(16位)'
      hu: 'Járműsebesség (16 bites)'
      pt: 'Velocidade do veículo (16 bits)'
    type: 'uint'
    factor: 0.01
    min: 0
    max: 655.34
    units: 'km/h'
    invalid: 0xFFFF
    default: 0xFFFF

  DISTANCE_COUNTER:
    bits: '3.7-4.0'
    comment:
      en: 'Travelled distance counter (16-bit)'
      fr: 'Compteur de distance parcourue (16 bits)'
      es: 'Contador de distancia recorrida (16 bits)'
      de: 'Zähler der zurückgelegten Strecke (16 Bit)'
      it: 'Contatore di distanza percorsa (16 bit)'
      pl: 'Licznik przebytego dystansu (16 bitów)'
      ru: 'Счётчик пройденного расстояния (16 бит)'
      zh: '行驶距离计数器(16位)'
      hu: 'Megtett út számlálója (16 bites)'
      pt: 'Contador de distância percorrida (16 bits)'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 6553.5
    units: 'm'
    default: 0x00

  LONGITUDINAL_ACCELERATION:
    bits: '5.7-5.0'
    comment:
      en: 'Longitudinal acceleration'
      fr: 'Accélération longitudinale'
      es: 'Aceleración longitudinal'
      de: 'Längsbeschleunigung'
      it: 'Accelerazione longitudinale'
      pl: 'Przyspieszenie wzdłużne'
      ru: 'Продольное ускорение'
      zh: '纵向加速度'
      hu: 'Hosszirányú gyorsulás'
      pt: 'Aceleração longitudinal'
    type: 'uint'
    factor: 0.08
    offset: -14
    min: -14
    max: 6.32
    units: 'm/s2'
    invalid: 0xFF
    default: 0x00

