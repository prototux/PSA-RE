        fr: 'Pré-régulation en cours'
        es: 'Preregulación en curso'
        de: 'Vorregelung läuft'
        it: 'Preregolazione in corso'
        pl: 'Trwa preregulacja'
        ru: 'Выполняется предварительное регулирование'
        zh: '预调节进行中'
        hu: 'Előszabályozás folyamatban'
        pt: 'Pré-regulação em curso'

