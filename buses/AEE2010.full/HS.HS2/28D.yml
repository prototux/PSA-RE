id: 0x28D
name: 'ESP_HYBRID_COUPLING_DATA'
type: 'can'
length: 7
comment:
  en: 'ESP data for the hybrid rear-axle coupling: torque setpoints and coupling/decoupling requests.'
  fr: 'Données ESP pour le couplage de l''essieu arrière hybride : consignes de couple et demandes de couplage/découplage.'
  es: 'Datos ESP para el acoplamiento del eje trasero híbrido: consignas de par y solicitudes de acoplamiento/desacoplamiento.'
  de: 'ESP-Daten für die Kopplung der hybriden Hinterachse: Drehmoment-Sollwerte und Kopplungs-/Entkopplungsanforderungen.'
  it: 'Dati ESP per l''accoppiamento dell''asse posteriore ibrido: valori di coppia richiesti e richieste di accoppiamento/disaccoppiamento.'
  pl: 'Dane ESP dla sprzężenia hybrydowej osi tylnej: zadane wartości momentu oraz żądania sprzężenia/rozprzężenia.'
  ru: 'Данные ESP для сцепления гибридной задней оси: заданные значения крутящего момента и запросы на сцепление/расцепление.'
  zh: '混合动力后桥耦合的ESP数据:扭矩设定值及耦合/解耦请求。'
  hu: 'ESP-adatok a hibrid hátsó tengely kapcsolásához: nyomaték-alapjelek, valamint kapcsolási/szétkapcsolási kérések.'
  pt: 'Dados do ESP para o acoplamento híbrido do eixo traseiro: pontos de ajuste de binário e pedidos de acoplamento/desacoplamento.'
periodicity: ['10ms']
senders: ['ABS']
receivers: ['BSI', 'HCU2']

signals:
  REAR_ASR_PRE_REGULATION_STATUS:
    bits: '1.3'
    comment:
      en: 'Rear traction control (ASR) pre-regulation status'
      fr: 'État de pré-régulation de l''antipatinage (ASR) arrière'
      es: 'Estado de preregulación del control de tracción (ASR) trasero'
      de: 'Vorregelungsstatus der hinteren Antriebsschlupfregelung (ASR)'
      it: 'Stato di preregolazione del controllo di trazione (ASR) posteriore'
      pl: 'Stan wstępnej regulacji tylnego ASR'
      ru: 'Статус предварительного регулирования задней антипробуксовочной системы (ASR)'
      zh: '后驱动防滑(ASR)预调节状态'
      hu: 'A hátsó kipörgésgátló (ASR) előszabályozási állapota'
      pt: 'Estado de pré-regulação do controlo de tração (ASR) traseiro'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No pre-regulation'
        fr: 'Pas de pré-régulation'
        es: 'Sin preregulación'
        de: 'Keine Vorregelung'
        it: 'Nessuna preregolazione'
        pl: 'Brak wstępnej regulacji'
        ru: 'Без предварительного регулирования'
