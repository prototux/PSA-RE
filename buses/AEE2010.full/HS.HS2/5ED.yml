      fr: 'État de la surveillance indirecte de la pression, roue arrière droite'
      es: 'Estado de la supervisión indirecta de la presión, rueda trasera derecha'
      de: 'Status der indirekten Reifendrucküberwachung, Rad hinten rechts'
      it: 'Stato del monitoraggio indiretto della pressione, ruota posteriore destra'
      pl: 'Stan pośredniego monitorowania ciśnienia, koło tylne prawe'
      ru: 'Статус косвенного контроля давления, заднее правое колесо'
      zh: '间接式胎压监测状态,右后轮'
      hu: 'Közvetett gumiabroncsnyomás-állapot, hátsó jobb kerék'
      pt: 'Estado da supervisão indireta da pressão, roda traseira direita'
    type: 'enum'
    default: 0x07
    values:
      0x00:
        unused: true
      0x01:
