id: 0x508
name: 'ENGINE_VCU_POWER_REQUEST'
type: 'can'
length: 4
comment:
  en: 'Power management request exchanged between the engine ECU and the electric vehicle control unit.'
  fr: 'Demande de gestion de puissance échangée entre le calculateur moteur et l''unité de contrôle du véhicule électrique.'
  es: 'Solicitud de gestión de potencia intercambiada entre la centralita del motor y la unidad de control del vehículo eléctrico.'
  de: 'Leistungsmanagement-Anforderung, die zwischen dem Motorsteuergerät und der Steuereinheit des Elektrofahrzeugs ausgetauscht wird.'
  it: 'Richiesta di gestione della potenza scambiata tra la centralina motore e l''unità di controllo del veicolo elettrico.'
  pl: 'Żądanie zarządzania mocą wymieniane między sterownikiem silnika a jednostką sterującą pojazdu elektrycznego.'
  ru: 'Запрос управления мощностью, которым обмениваются ЭБУ двигателя и блок управления электромобилем.'
  zh: '发动机ECU与电动车控制单元之间交换的功率管理请求。'
  hu: 'A motorvezérlő és az elektromos jármű vezérlőegysége közötti teljesítménykezelési kérés.'
  pt: 'Pedido de gestão de potência trocado entre a unidade de controlo do motor e a unidade de controlo do veículo elétrico.'
periodicity: ['1000ms']
senders: ['CMM', 'E_VCU']
receivers: ['BSI']

