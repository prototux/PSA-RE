      es: 'Contador de deterioro de la correa de accesorios'
      de: 'Verschleißzähler des Nebenaggregateriemens'
      it: 'Contatore di usura della cinghia degli accessori'
      pl: 'Licznik uszkodzeń paska osprzętu'
      ru: 'Счётчик повреждений ремня привода навесного оборудования'
      zh: '附件皮带损坏计数器'
      hu: 'A segédhajtás-szíj károsodásának számlálója'
      pt: 'Contador de danos da correia de acessórios'
    type: 'uint'
