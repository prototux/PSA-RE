id: 0x322
name: 'ELECTRONIC_BRAKE_BOOSTER_DATA_2'
type: 'can'
length: 5
comment:
  en: 'Electronic brake booster data: brake-pedal position and activation state, plus external braking-request priority and status.'
  fr: 'Données de l''amplificateur de freinage électronique : position et activation de la pédale de frein, ainsi que priorité et état des demandes de freinage externes.'
  es: 'Datos del servofreno electrónico: posición y activación del pedal de freno, así como prioridad y estado de las solicitudes de frenado externas.'
  de: 'Daten des elektronischen Bremskraftverstärkers: Bremspedalposition und -aktivierung sowie Priorität und Status externer Bremsanforderungen.'
  it: 'Dati del servofreno elettronico: posizione e attivazione del pedale del freno, nonché priorità e stato delle richieste di frenata esterne.'
  pl: 'Dane elektronicznego wspomagania hamowania: pozycja i aktywacja pedału hamulca oraz priorytet i stan zewnętrznych żądań hamowania.'
  ru: 'Данные электронного усилителя тормозов: положение и активация педали тормоза, а также приоритет и статус внешних запросов торможения.'
  zh: '电子制动助力器数据:制动踏板位置及激活状态,以及外部制动请求的优先级和状态。'
  hu: 'Az elektronikus fékrásegítő adatai: a fékpedál helyzete és aktiválása, valamint a külső fékezési kérések prioritása és állapota.'
  pt: 'Dados do servofreio eletrónico: posição e estado de ativação do pedal do travão, além de prioridade e estado do pedido de travagem externo.'
periodicity: ['20ms']
senders: ['EBB']
receivers: ['ABS', 'BSI', 'CMM']

signals:
  EBB_REGEN_BRAKE_BLENDING_POTENTIAL:
    bits: '1.7-1.0'
    comment:
      en: 'iBooster force (pressure) compensation potential for the ESP regenerative brake blending function'
      fr: 'Potentiel de compensation d''effort (pression) de l''iBooster pour la fonction de freinage récupératif piloté par l''ESP'
      es: 'Potencial de compensación de esfuerzo (presión) del iBooster para la función de frenado regenerativo controlado por el ESP'
      de: 'Kraft-(Druck-)Kompensationspotenzial des iBoosters für die vom ESP gesteuerte Rekuperationsbrems-Überblendung'
      it: 'Potenziale di compensazione dello sforzo (pressione) dell''iBooster per la funzione di frenata rigenerativa gestita dall''ESP'
      pl: 'Potencjał kompensacji siły (ciśnienia) iBoostera dla funkcji mieszania hamowania odzyskowego sterowanej przez ESP'
      ru: 'Потенциал компенсации усилия (давления) iBooster для функции регенеративного торможения, управляемой ESP'
      zh: 'iBooster为ESP控制的再生制动混合功能提供的力(压力)补偿潜力'
      hu: 'Az iBooster erő-(nyomás-)kompenzációs potenciálja az ESP által vezérelt regeneratív fékkeveréshez'
      pt: 'Potencial de compensação de esforço (pressão) do iBooster para a função de travagem regenerativa controlada pelo ESP'
    type: 'uint'
    factor: 0.5
    min: 0
    max: 125
    units: 'bar'
    invalid: 0xFF

  EBB_BRAKE_ASSIST_SATURATION_PRESSURE:
    bits: '2.7-2.0'
