      es: 'Presión de saturación de la asistencia de frenado proporcionada por el EBB'
      de: 'Sättigungsdruck der vom EBB bereitgestellten Bremsunterstützung'
      it: 'Pressione di saturazione dell''assistenza alla frenata fornita dall''EBB'
