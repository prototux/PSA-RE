      it: 'Richiesta di allerta aptica di collisione (ARC)'
      pl: 'Żądanie ostrzeżenia haptycznego o kolizji (ARC)'
      ru: 'Запрос тактильного предупреждения о столкновении (ARC)'
      zh: '碰撞触觉警报请求(ARC)'
      hu: 'Ütközés esetén taktilis figyelmeztetés kérése (ARC)'
      pt: 'Pedido de alerta hático de colisão (ARC)'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No haptic alert request'
        fr: 'Pas de demande d''alerte haptique'
        es: 'Sin solicitud de alerta háptica'
        de: 'Keine Anforderung einer haptischen Warnung'
        it: 'Nessuna richiesta di allerta aptica'
