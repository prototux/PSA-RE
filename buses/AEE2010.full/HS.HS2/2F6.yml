id: 0x2F6
name: 'COLLISION_ASSIST_DYNAMIC_DATA'
type: 'can'
length: 8
comment:
  en: 'Collision-avoidance data: target detection, distance to vehicle ahead, deceleration setpoint and brake-prefill/haptic-alert requests.'
  fr: 'Données d''aide à l''évitement de collision : détection de cible, distance au véhicule précédent, consigne de décélération et demandes de préremplissage frein/alerte haptique.'
  es: 'Datos de asistencia a la prevención de colisiones: detección de objetivo, distancia al vehículo precedente, consigna de deceleración y solicitudes de prellenado de freno/alerta háptica.'
  de: 'Daten der Kollisionsvermeidung: Zielerkennung, Abstand zum vorausfahrenden Fahrzeug, Verzögerungs-Sollwert sowie Anforderungen zur Bremsdruck-Vorbefüllung/haptischen Warnung.'
  it: 'Dati di assistenza anticollisione: rilevamento del bersaglio, distanza dal veicolo che precede, valore richiesto di decelerazione e richieste di preriempimento freni/allerta aptica.'
  pl: 'Dane wspomagania unikania kolizji: wykrycie celu, odległość od poprzedzającego pojazdu, zadana wartość opóźnienia oraz żądania wstępnego napełnienia hamulców/alertu haptycznego.'
  ru: 'Данные системы предотвращения столкновений: обнаружение цели, дистанция до впереди идущего автомобиля, заданное значение замедления и запросы предварительного наполнения тормозов/тактильного предупреждения.'
  zh: '碰撞规避数据:目标探测、与前车距离、减速度设定值以及制动预填充/触觉警报请求。'
  hu: 'Ütközéselkerülési adatok: célfelismerés, távolság az előttünk haladó járműtől, lassítási alapjel, valamint fékrásegítés előtöltési/haptikus figyelmeztetési kérések.'
  pt: 'Dados de prevenção de colisão: deteção de alvo, distância ao veículo da frente, ponto de ajuste de desaceleração e pedidos de pré-enchimento dos travões/alerta háptico.'
periodicity: ['20ms']
senders: ['CVM', 'ARTIV']
receivers: ['BSI', 'CMM', 'ABS']

