id: 0x578
name: 'ENGINE_ECU_DATA_15'
type: 'can'
length: 6
comment:
  en: 'Engine ECU data: power-reduction-off request, atmospheric pressure, main wake-up and SCR purge wake-up.'
  fr: 'Données du calculateur moteur : demande de suppression de réduction de puissance, pression atmosphérique, réveil principal et réveil de purge SCR.'
  es: 'Datos de la centralita del motor: solicitud de supresión de reducción de potencia, presión atmosférica, activación principal y activación de purga SCR.'
  de: 'Motorsteuergerätdaten: Anforderung zur Aufhebung der Leistungsreduzierung, Luftdruck, Hauptweckung und SCR-Spülweckung.'
  it: 'Dati della centralina motore: richiesta di rimozione riduzione potenza, pressione atmosferica, risveglio principale e risveglio di spurgo SCR.'
  pl: 'Dane sterownika silnika: żądanie zniesienia redukcji mocy, ciśnienie atmosferyczne, główne wybudzenie i wybudzenie przedmuchu SCR.'
  ru: 'Данные ЭБУ двигателя: запрос отмены снижения мощности, атмосферное давление, главное пробуждение и пробуждение продувки SCR.'
  zh: '发动机ECU数据:解除功率降低请求、大气压力、主唤醒和SCR吹扫唤醒。'
  hu: 'Motorvezérlő adatok: teljesítménycsökkentés megszüntetésének kérése, légköri nyomás, fő ébresztés és SCR öblítési ébresztés.'
  pt: 'Dados da unidade de controlo do motor: pedido de desativação da redução de potência, pressão atmosférica, ativação principal e ativação de purga SCR.'
observations:
  en: 'On state change of: OBD_CONDITION_COUNTER_SYNC_STATUS, IGNITION_COUNTER_SYNC_STATUS, EAGB_DRIVE_ACTIVATION_REQUEST'
  fr: 'Sur changement d''état de : OBD_CONDITION_COUNTER_SYNC_STATUS, IGNITION_COUNTER_SYNC_STATUS, EAGB_DRIVE_ACTIVATION_REQUEST'
  es: 'Al cambiar el estado de: OBD_CONDITION_COUNTER_SYNC_STATUS, IGNITION_COUNTER_SYNC_STATUS, EAGB_DRIVE_ACTIVATION_REQUEST'
  de: 'Bei Statusänderung von: OBD_CONDITION_COUNTER_SYNC_STATUS, IGNITION_COUNTER_SYNC_STATUS, EAGB_DRIVE_ACTIVATION_REQUEST'
  it: 'Al cambiamento di stato di: OBD_CONDITION_COUNTER_SYNC_STATUS, IGNITION_COUNTER_SYNC_STATUS, EAGB_DRIVE_ACTIVATION_REQUEST'
  pl: 'Wysyłane przy zmianie stanu: OBD_CONDITION_COUNTER_SYNC_STATUS, IGNITION_COUNTER_SYNC_STATUS, EAGB_DRIVE_ACTIVATION_REQUEST'
  ru: 'При изменении состояния: OBD_CONDITION_COUNTER_SYNC_STATUS, IGNITION_COUNTER_SYNC_STATUS, EAGB_DRIVE_ACTIVATION_REQUEST'
  zh: '当SYNCHRO_OBD_COND, IGNITION_COUNTER_SYNC_STATUS, EAGB_DRIVE_REQUEST状态变化时'
  hu: 'A(z) OBD_CONDITION_COUNTER_SYNC_STATUS, IGNITION_COUNTER_SYNC_STATUS, EAGB_DRIVE_ACTIVATION_REQUEST állapotváltozásakor'
  pt: 'Na mudança de estado de: OBD_CONDITION_COUNTER_SYNC_STATUS, IGNITION_COUNTER_SYNC_STATUS, EAGB_DRIVE_ACTIVATION_REQUEST'
periodicity: ['100ms', 'trigger']
senders: ['CMM', 'E_VCU']
receivers: ['ABS', 'EBB', 'BVA', 'BSI', 'LVNSD']

