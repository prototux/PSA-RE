      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
