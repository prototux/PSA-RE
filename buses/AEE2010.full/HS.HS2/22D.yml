    comment:
      en: 'Vehicle speed used by the EBB (electronic brake booster)'
      fr: 'Vitesse véhicule utilisée par l''EBB (amplificateur de freinage électronique)'
      es: 'Velocidad del vehículo utilizada por el EBB (servofreno electrónico)'
