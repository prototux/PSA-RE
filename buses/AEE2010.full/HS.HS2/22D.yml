    invalid: 0xFF
    default: 0xFE

  DRIVER_BRAKE_TORQUE_REQUEST:
    bits: '6.7-6.1'
    comment:
      en: 'Braking torque requested by the driver'
      fr: 'Couple de freinage demandé par le conducteur'
      es: 'Par de frenado solicitado por el conductor'
      de: 'Vom Fahrer angefordertes Bremsmoment'
      it: 'Coppia frenante richiesta dal conducente'
      pl: 'Moment hamowania żądany przez kierowcę'
      ru: 'Тормозной момент, запрошенный водителем'
      zh: '驾驶员请求的制动扭矩'
      hu: 'A vezető által kért fékezőnyomaték'
