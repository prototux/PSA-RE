id: 0x22D
name: 'ESC_EXTERNAL_TARGET_REQUEST_3'
type: 'can'
length: 8
comment:
  en: 'External stability control target request (e.g. from a driving assistance system), with frame counter and checksum.'
  fr: 'Requête externe de consigne pour le contrôle de stabilité (ex. aide à la conduite), avec compteur de trame et somme de contrôle.'
  es: 'Solicitud externa de consigna para el control de estabilidad (p. ej. desde un sistema de asistencia a la conducción), con contador de trama y suma de comprobación.'
  de: 'Externe Sollwertanforderung für die Stabilitätskontrolle (z. B. von einem Fahrassistenzsystem), mit Rahmenzähler und Prüfsumme.'
  it: 'Richiesta esterna di setpoint per il controllo di stabilità (ad es. da un sistema di assistenza alla guida), con contatore di trama e checksum.'
  pl: 'Zewnętrzne żądanie wartości zadanej dla kontroli stabilności (np. z systemu wspomagania jazdy), z licznikiem ramek i sumą kontrolną.'
  ru: 'Внешний запрос уставки для системы контроля устойчивости (например, от системы помощи водителю), со счётчиком кадров и контрольной суммой.'
  zh: '来自(例如驾驶辅助系统的)车身稳定控制外部目标请求,含帧计数器和校验和。'
  hu: 'Külső célérték-kérés a menetstabilizáló rendszer számára (pl. vezetéstámogató rendszertől), keretszámlálóval és ellenőrző összeggel.'
  pt: 'Pedido de alvo do controlo de estabilidade externo (por exemplo, de um sistema de assistência à condução), com contador de trama e soma de verificação.'
periodicity: ['20ms']
senders: ['ABS']
receivers: ['CMM', 'EBB', 'VCU']

signals:
  ABS_WHEEL_LOCK_PRESSURE_ESTIMATE:
    bits: '1.7-1.0'
    comment:
      en: 'Wheel lock-up pressure estimated by the ESC, so the brake booster avoids applying unnecessary and harmful amplification'
      fr: 'Pression de blocage des roues estimée par l''ESC, pour éviter que l''amplificateur de freinage applique une amplification inutile et néfaste'
      es: 'Presión de bloqueo de ruedas estimada por el ESC, para evitar que el servofreno aplique una amplificación innecesaria y perjudicial'
      de: 'Vom ESC geschätzter Raddruck bei Blockierung, damit der Bremskraftverstärker keine unnötige und schädliche Verstärkung anwendet'
      it: 'Pressione di bloccaggio ruota stimata dall''ESC, per evitare che il servofreno applichi un''amplificazione inutile e dannosa'
      pl: 'Ciśnienie blokowania kół szacowane przez ESC, aby wspomaganie hamowania nie stosowało zbędnego i szkodliwego wzmocnienia'
      ru: 'Давление блокировки колёс, оцениваемое ESC, чтобы усилитель тормозов не применял ненужное и вредное усиление'
      zh: 'ESC估算的车轮抱死压力,避免制动助力器施加不必要且有害的助力'
      hu: 'Az ESC által becsült kerékblokkolási nyomás, hogy a fékrásegítő ne alkalmazzon felesleges és káros erősítést'
      pt: 'Pressão de bloqueio das rodas estimada pelo ESC, para evitar que o amplificador de travagem aplique uma amplificação desnecessária e prejudicial'
    type: 'uint'
    factor: 1
    min: 0
    max: 250
    units: 'bar'

  REAR_AXLE_TORQUE_REQUEST:
    bits: '2.7-3.7'
    comment:
      en: 'Torque requested by the ESC on the rear axle'
      fr: 'Couple demandé par l''ESC sur l''essieu arrière'
      es: 'Par solicitado por el ESC en el eje trasero'
      de: 'Vom ESC an der Hinterachse angefordertes Drehmoment'
      it: 'Coppia richiesta dall''ESC sull''assale posteriore'
      pl: 'Moment obrotowy żądany przez ESC na osi tylnej'
      ru: 'Момент, запрошенный ESC на задней оси'
      zh: 'ESC对后轴请求的扭矩'
      hu: 'Az ESC által a hátsó tengelyen kért nyomaték'
      pt: 'Binário solicitado pelo ESC no eixo traseiro'
    type: 'uint'
    factor: 1
    offset: -250
    min: -250
    max: 250
    units: 'Nm'
    invalid: 0x1FE
    default: 0x00

  ESP_REAR_TORQUE_REQUEST_STATUS:
    bits: '3.6-3.4'
    comment:
      en: 'ESP rear electric machine torque request status'
      fr: 'Type de pilotage du couple de la machine électrique arrière par l''ESP'
      es: 'Estado de solicitud de par de la máquina eléctrica trasera por el ESP'
      de: 'Ansteuerungsart des hinteren E-Maschinen-Drehmoments durch das ESP'
      it: 'Stato di richiesta di coppia della macchina elettrica posteriore da parte dell''ESP'
      pl: 'Stan żądania momentu obrotowego tylnej maszyny elektrycznej przez ESP'
      ru: 'Статус запроса момента задней электромашины от ESP'
      zh: 'ESP对后电机扭矩请求的状态'
      hu: 'A hátsó elektromos gép nyomatékigénylésének állapota az ESP-től'
      pt: 'Estado de pedido de binário da máquina elétrica traseira pelo ESP'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'No action on torque'
        fr: 'Pas d''action sur le couple'
        es: 'Sin acción sobre el par'
        de: 'Kein Eingriff auf das Drehmoment'
        it: 'Nessuna azione sulla coppia'
        pl: 'Brak działania na moment obrotowy'
        ru: 'Нет воздействия на крутящий момент'
        zh: '对扭矩无操作'
        hu: 'Nincs beavatkozás a nyomatékba'
        pt: 'Sem ação sobre o binário'
      0x01:
        unused: true
      0x02:
        unused: true
      0x03:
        unused: true
      0x04:
        unused: true
      0x05:
        en: 'Reduction request (ASR)'
        fr: 'Consigne de réduction (ASR)'
        es: 'Consigna de reducción (ASR)'
        de: 'Reduktionsanforderung (ASR)'
        it: 'Richiesta di riduzione (ASR)'
        pl: 'Żądanie redukcji (ASR)'
        ru: 'Запрос снижения (ASR)'
        zh: '降低请求(ASR)'
        hu: 'Csökkentési kérés (ASR)'
        pt: 'Consigna de redução (ASR)'
      0x06:
        en: 'Increase setpoint (MSR)'
        fr: 'Consigne d''augmentation (MSR)'
        es: 'Consigna de aumento (MSR)'
        de: 'Erhöhungssollwert (MSR)'
        it: 'Setpoint di aumento (MSR)'
        pl: 'Wartość zadana zwiększenia (MSR)'
        ru: 'Уставка увеличения (MSR)'
        zh: '增加设定值（MSR）'
        hu: 'Növelési beállított érték (MSR)'
        pt: 'Consigna de aumento (MSR)'
      0x07:
        unused: true

  FRONT_REAR_TORQUE_SPLIT_FREEZE_REQUEST:
