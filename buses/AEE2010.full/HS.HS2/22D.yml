    comment:
      en: 'Request to freeze the static front-rear torque split'
      fr: 'Demande de figeage de la répartition statique de couple avant-arrière'
      es: 'Solicitud de congelación del reparto estático de par delantero-trasero'
      de: 'Anforderung zum Einfrieren der statischen Vorne-Hinten-Drehmomentverteilung'
      it: 'Richiesta di blocco della ripartizione statica di coppia anteriore-posteriore'
      pl: 'Żądanie zamrożenia statycznego podziału momentu przód-tył'
      ru: 'Запрос фиксации статического распределения момента спереди-сзади'
      zh: '请求锁定前后静态扭矩分配'
      hu: 'Az első-hátsó statikus nyomatékelosztás lefagyasztásának kérése'
