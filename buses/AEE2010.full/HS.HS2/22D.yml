        pl: 'Żądanie zamrożenia'
        ru: 'Запрос фиксации'
        zh: '请求冻结'
        hu: 'Rögzítési kérés'
        pt: 'Pedido de congelamento'

  REAR_EMACHINE_TORQUE_SAFETY_DISABLE:
    bits: '3.0'
    comment:
      en: 'Safety flag to disable the rear electric machine torque'
      fr: 'Drapeau de sécurité d''inhibition du couple de la machine électrique arrière'
      es: 'Indicador de seguridad para desactivar el par de la máquina eléctrica trasera'
      de: 'Sicherheitsflag zur Deaktivierung des Drehmoments der hinteren E-Maschine'
      it: 'Flag di sicurezza per disattivare la coppia della macchina elettrica posteriore'
      pl: 'Flaga bezpieczeństwa wyłączająca moment obrotowy tylnej maszyny elektrycznej'
