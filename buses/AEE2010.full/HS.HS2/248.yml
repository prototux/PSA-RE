        ru: 'Обнаружение неактивно'
        zh: '检测未激活'
        hu: 'Érzékelés inaktív'
        pt: 'Deteção inativa'
      0x01:
        en: 'Detection in progress'
        fr: 'Détection en cours'
        es: 'Detección en curso'
        de: 'Erkennung läuft'
        it: 'Rilevamento in corso'
        pl: 'Wykrywanie w toku'
        ru: 'Обнаружение выполняется'
        zh: '检测进行中'
        hu: 'Észlelés folyamatban'
        pt: 'Deteção em curso'
      0x02:
        en: 'Detection completed'
        fr: 'Détection effective'
        es: 'Detección efectiva'
        de: 'Erkennung abgeschlossen'
        it: 'Rilevamento effettuato'
        pl: 'Wykrywanie zakończone'
        ru: 'Обнаружение завершено'
        zh: '检测完成'
        hu: 'Érzékelés befejezve'
        pt: 'Deteção concluída'
      0x03:
        en: 'Detection ended'
        fr: 'Fin de détection'
        es: 'Fin de la detección'
        de: 'Erkennung beendet'
        it: 'Fine del rilevamento'
        pl: 'Koniec wykrywania'
        ru: 'Обнаружение завершено'
        zh: '检测结束'
        hu: 'Az érzékelés vége'
        pt: 'Fim da deteção'

  UNUSED_1:
    bits: '8.4-8.0'
    unused: true
