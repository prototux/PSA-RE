id: 0x248
name: 'ENGINE_DYNAMIC_DATA_V2'
type: 'can'
length: 8
comment:
  en: 'Engine and resistive torque, gearbox torque limits and gear-shift state, second version of the engine ECU dynamic frame.'
  fr: 'Couple moteur thermique et résistant, limites de couple boîte de vitesses et état de passage de rapport, seconde version de la trame dynamique du calculateur moteur.'
  es: 'Par del motor térmico y resistente, límites de par de la caja de cambios y estado de cambio de marcha, segunda versión de la trama dinámica de la centralita del motor.'
  de: 'Verbrennungsmotor- und Widerstandsdrehmoment, Getriebedrehmomentgrenzen und Schaltzustand, zweite Version des dynamischen Rahmens des Motorsteuergeräts.'
  it: 'Coppia motore termico e resistente, limiti di coppia del cambio e stato di cambiata, seconda versione della trama dinamica della centralina motore.'
  pl: 'Moment obrotowy silnika spalinowego i moment oporowy, limity momentu skrzyni biegów i stan zmiany biegu, druga wersja ramki dynamicznej sterownika silnika.'
  ru: 'Крутящий момент теплового двигателя и момент сопротивления, пределы момента коробки передач и состояние переключения передачи, вторая версия динамического кадра блока управления двигателем.'
  zh: '热机扭矩与阻力扭矩、变速箱扭矩限值及换挡状态,发动机控制单元动态帧的第二版本。'
  hu: 'Belső égésű motor nyomatéka és ellenállási nyomaték, a váltó nyomatékhatárai és a fokozatváltás állapota, a motorvezérlő dinamikus keretének második változata.'
  pt: 'Binário do motor e resistente, limites de binário da caixa de velocidades e estado de mudança de velocidade, segunda versão da trama dinâmica da unidade de controlo do motor.'
periodicity: ['10ms']
senders: ['CMM']
receivers: ['ABS']

signals:
  EMACHINE_TORQUE_REQUEST_RAW:
    bits: '1.7-2.5'
    comment:
      en: 'Electric machine torque request, before processing'
      fr: 'Couple demandé à la machine électrique, avant traitement'
      es: 'Par solicitado a la máquina eléctrica, antes del procesamiento'
      de: 'Angefordertes Drehmoment der E-Maschine, vor der Verarbeitung'
      it: 'Coppia richiesta alla macchina elettrica, prima dell''elaborazione'
      pl: 'Moment żądany od maszyny elektrycznej, przed przetworzeniem'
      ru: 'Момент, запрошенный от электромашины, до обработки'
      zh: '对电机的扭矩请求(处理前)'
      hu: 'A villanymotortól kért nyomaték, feldolgozás előtt'
      pt: 'Binário solicitado à máquina elétrica, antes do processamento'
    type: 'uint'
    factor: 0.5
    offset: -500
    min: -500
    max: 500
    units: 'Nm'
    invalid: 0x7FF
    default: 0x3E8

  ENGINE_TORQUE:
    bits: '2.4-3.2'
    comment:
      en: 'Engine torque'
      fr: 'Couple moteur'
      es: 'Par de motor'
      de: 'Motordrehmoment'
      it: 'Coppia motore'
      pl: 'Moment obrotowy silnika'
      ru: 'Крутящий момент двигателя'
      zh: '发动机扭矩'
      hu: 'Motornyomaték'
      pt: 'Binário do motor'
    type: 'uint'
    factor: 0.5
    offset: -500
    min: -500
    max: 500
    units: 'Nm'
    invalid: 0x7FF
    default: 0x3E8

  ENGINE_LOSS_TORQUE:
    bits: '3.1-4.1'
    comment:
      en: 'Engine loss torque'
      fr: 'Couple de perte moteur'
      es: 'Par de pérdida del motor'
      de: 'Motorverlustmoment'
      it: 'Coppia di perdita motore'
      pl: 'Moment strat silnika'
      ru: 'Момент потерь двигателя'
      zh: '发动机损耗扭矩'
      hu: 'Motor veszteségi nyomatéka'
