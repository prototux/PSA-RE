      zh: '传动系舒适间隙检测状态'
      hu: 'A hajtáslánc kényelmi holtjátékának felismerési állapota'
      pt: 'Estado de deteção da folga de conforto da transmissão'
    type: 'enum'
    default: 0x00
    values:
      0x00:
