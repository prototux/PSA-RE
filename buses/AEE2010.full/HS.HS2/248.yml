    default: 0x3E8

  ENGINE_TORQUE_PRECISION_INDEX:
    bits: '7.2-8.7'
    comment:
      en: 'Engine torque precision index'
      fr: 'Indice de précision du couple moteur'
      es: 'Índice de precisión del par de motor'
      de: 'Genauigkeitsindex des Motordrehmoments'
      it: 'Indice di precisione della coppia motore'
      pl: 'Wskaźnik dokładności momentu obrotowego silnika'
