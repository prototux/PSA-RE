    min: 0
    max: 255
    units: 'Nm'
    invalid: 0x1FF
    default: 0x00

  IDLE_SPEED_REGULATION_TORQUE:
    bits: '4.0-6.6'
    comment:
      en: 'Idle speed regulation torque'
      fr: 'Couple de régulation du régime de ralenti'
      es: 'Par de regulación del ralentí'
      de: 'Leerlaufregelungsdrehmoment'
      it: 'Coppia di regolazione del regime minimo'
      pl: 'Moment regulacji obrotów biegu jałowego'
      ru: 'Момент регулирования холостого хода'
      zh: '怠速调节扭矩'
      hu: 'Alapjárati fordulatszám-szabályozó nyomaték'
      pt: 'Binário de regulação do regime de ralenti'
    type: 'uint'
    factor: 0.5
