id: 0x3B2
name: 'BSI_WAKEUP_REQUESTS_2'
type: 'can'
length: 2
comment:
  en: 'BSI wake-up requests: driver ignition need, post-drive, pre-drive, electrical/thermal preconditioning, and delayed-stop HMI wake-up.'
  fr: 'Demandes de réveil de la BSI : besoin de contact conducteur, post-conduite, pré-conduite, préconditionnement électrique/thermique, et réveil IHM d''arrêt différé.'
  es: 'Solicitudes de activación de la BSI: necesidad de contacto del conductor, post-conducción, pre-conducción, precondicionamiento eléctrico/térmico, y activación IHM de parada diferida.'
  de: 'BSI-Weckanforderungen: Fahrerzündungsbedarf, Nachfahr-, Vorfahr-, elektrische/thermische Vorkonditionierung, und verzögerte Stopp-HMI-Weckung.'
  it: 'Richieste di risveglio della BSI: necessità di accensione conducente, post-guida, pre-guida, precondizionamento elettrico/termico, e risveglio HMI di arresto ritardato.'
  pl: 'Żądania wybudzenia BSI: potrzeba zapłonu kierowcy, po jeździe, przed jazdą, wstępna klimatyzacja elektryczna/termiczna, oraz wybudzenie HMI opóźnionego zatrzymania.'
  ru: 'Запросы пробуждения BSI: потребность в зажигании водителя, после поездки, перед поездкой, электрическое/тепловое предварительное кондиционирование, и отложенное пробуждение HMI при остановке.'
  zh: 'BSI唤醒请求:驾驶员点火需求、驾驶后、驾驶前、电气/热预处理,以及延迟停车HMI唤醒。'
  hu: 'BSI ébresztési kérések: vezetői gyújtásigény, vezetés utáni, vezetés előtti, elektromos/termikus előkondicionálás, és késleltetett leállás HMI ébresztés.'
  pt: 'Pedidos de ativação da BSI: necessidade de ignição pelo condutor, pós-condução, pré-condução, pré-condicionamento elétrico/térmico, e ativação da IHM de paragem diferida.'
periodicity: ['40ms']
senders: ['BSI']
receivers: ['BVN']

signals:
  VEHICLE_ATTITUDE:
