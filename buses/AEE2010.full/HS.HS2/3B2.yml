    comment:
      en: 'Vehicle attitude (pitch angle) (°)'
      fr: 'Assiette du véhicule (°)'
      es: 'Actitud del vehículo (°)'
      de: 'Fahrzeugneigung (Nickwinkel) (°)'
      it: 'Assetto del veicolo (°)'
      pl: 'Pochylenie pojazdu (°)'
      ru: 'Продольный крен (дифферент) автомобиля (°)'
      zh: '车辆姿态角(俯仰角)(°)'
      hu: 'A jármű dőlésszöge (°)'
      pt: 'Atitude do veículo (ângulo de inclinação) (°)'
    type: 'sint'
    factor: 0.006
    min: -3
    max: 3
    units: '°'
    invalid: 0x1FF
    default: 0x00
    alternatives:
      - note:
          en: 'Also observed with another scaling (factor 0.0006)'
          fr: 'Aussi observé avec une autre mise à l''échelle (factor 0.0006)'
          es: 'También observado con otro escalado (factor 0.0006)'
          de: 'Auch mit anderer Skalierung beobachtet (factor 0.0006)'
          it: 'Osservato anche con un''altra scala (factor 0.0006)'
          pl: 'Obserwowany także z innym skalowaniem (factor 0.0006)'
          ru: 'Также наблюдался с другим масштабом (factor 0.0006)'
          zh: '也观察到使用另一种缩放（factor 0.0006）'
          hu: 'Megfigyelve más skálázással is (factor 0.0006)'
          pt: 'Também observado com outra escala (factor 0.0006)'
        factor: 0.0006

