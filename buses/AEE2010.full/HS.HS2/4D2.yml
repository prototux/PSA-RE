id: 0x4D2
name: 'VIN_WMI_DATA'
type: 'can'
length: 3
comment:
  en: 'World manufacturer identifier (WMI) of the VIN, sent by the BSI.'
  fr: 'Identifiant mondial du constructeur (WMI) du VIN, émis par le BSI.'
  es: 'Identificador mundial del fabricante (WMI) del VIN, enviado por el BSI.'
  de: 'Weltweiter Herstelleridentifikator (WMI) der VIN, gesendet vom BSI.'
  it: 'Identificativo mondiale del costruttore (WMI) del VIN, inviato dal BSI.'
  pl: 'Światowy identyfikator producenta (WMI) numeru VIN, wysyłany przez BSI.'
  ru: 'Всемирный идентификатор производителя (WMI) номера VIN, отправляется блоком BSI.'
  zh: 'VIN 中的世界制造商识别码（WMI），由 BSI 发送。'
  hu: 'A VIN világméretű gyártóazonosítója (WMI), a BSI küldi.'
  pt: 'Identificador mundial do fabricante (WMI) do VIN, enviado pela BSI.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BVN', 'CMM']

signals:
  WMI_CHAR_1:
    bits: '1.7-1.0'
    comment:
      en: 'First WMI character.'
      fr: 'Premier caractère du WMI.'
      es: 'Primer carácter del WMI.'
      de: 'Erstes Zeichen der WMI.'
      it: 'Primo carattere del WMI.'
      pl: 'Pierwszy znak WMI.'
      ru: 'Первый символ WMI.'
      zh: 'WMI的第一个字符。'
      hu: 'A WMI első karaktere.'
      pt: 'Primeiro carácter do WMI.'
    type: 'str'
    default: 0x3F

  WMI_CHAR_2:
    bits: '2.7-2.0'
    comment:
      en: 'Second WMI character.'
      fr: 'Deuxième caractère du WMI.'
      es: 'Segundo carácter del WMI.'
      de: 'Zweites Zeichen der WMI.'
      it: 'Secondo carattere del WMI.'
      pl: 'Drugi znak WMI.'
      ru: 'Второй символ WMI.'
      zh: 'WMI的第二个字符。'
      hu: 'A WMI második karaktere.'
      pt: 'Segundo carácter do WMI.'
    type: 'str'
    default: 0x3F

  WMI_CHAR_3:
    bits: '3.7-3.0'
    comment:
      en: 'Third WMI character.'
      fr: 'Troisième caractère du WMI.'
      es: 'Tercer carácter del WMI.'
      de: 'Drittes Zeichen der WMI.'
      it: 'Terzo carattere del WMI.'
      pl: 'Trzeci znak WMI.'
      ru: 'Третий символ WMI.'
      zh: 'WMI的第三个字符。'
      hu: 'A WMI harmadik karaktere.'
      pt: 'Terceiro carácter do WMI.'
    type: 'str'
    default: 0x3F
