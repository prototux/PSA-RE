id: 0x392
name: 'BSI_WAKEUP_REQUESTS'
type: 'can'
length: 2
comment:
  en: 'BSI wake-up requests: driver ignition need, post-drive, pre-drive, electrical/thermal preconditioning, and delayed-stop HMI wake-up.'
  fr: 'Demandes de réveil de la BSI : besoin de contact conducteur, post-conduite, pré-conduite, préconditionnement électrique/thermique, et réveil IHM d''arrêt différé.'
  es: 'Solicitudes de activación de la BSI: necesidad de contacto del conductor, post-conducción, pre-conducción, precondicionamiento eléctrico/térmico, y activación IHM de parada diferida.'
  de: 'BSI-Weckanforderungen: Fahrerzündungsbedarf, Nachfahr-, Vorfahr-, elektrische/thermische Vorkonditionierung, und verzögerte Stopp-HMI-Weckung.'
  it: 'Richieste di risveglio della BSI: necessità di accensione conducente, post-guida, pre-guida, precondizionamento elettrico/termico, e risveglio HMI di arresto ritardato.'
  pl: 'Żądania wybudzenia BSI: potrzeba zapłonu kierowcy, po jeździe, przed jazdą, wstępna klimatyzacja elektryczna/termiczna, oraz wybudzenie HMI opóźnionego zatrzymania.'
  ru: 'Запросы пробуждения BSI: потребность в зажигании водителя, после поездки, перед поездкой, электрическое/тепловое предварительное кондиционирование, и отложенное пробуждение HMI при остановке.'
  zh: 'BSI唤醒请求:驾驶员点火需求、驾驶后、驾驶前、电气/热预处理,以及延迟停车HMI唤醒。'
  hu: 'BSI ébresztési kérések: vezetői gyújtásigény, vezetés utáni, vezetés előtti, elektromos/termikus előkondicionálás, és késleltetett leállás HMI ébresztés.'
  pt: 'Pedidos de ativação da BSI: necessidade de ignição pelo condutor, pós-condução, pré-condução, pré-condicionamento elétrico/térmico, e ativação da IHM de paragem diferida.'
periodicity: ['50ms']
senders: ['BSI']
receivers: ['VCU', 'CMM', 'BVA', 'E_VCU']

signals:
  DELAYED_CHARGE_WAKEUP_REQUEST:
    bits: '1.7'
    comment:
      en: 'Wake-up request to start delayed charging'
      fr: 'Demande de réveil pour démarrer la recharge différée'
      es: 'Solicitud de activación para iniciar la carga diferida'
      de: 'Aufwachanforderung zum Start des verzögerten Ladevorgangs'
      it: 'Richiesta di risveglio per avviare la ricarica differita'
      pl: 'Żądanie wybudzenia w celu rozpoczęcia opóźnionego ładowania'
      ru: 'Запрос пробуждения для запуска отложенной зарядки'
      zh: '启动延迟充电的唤醒请求'
      hu: 'Ébresztési kérés a késleltetett töltés indításához'
      pt: 'Pedido de despertar para iniciar o carregamento diferido'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No wakeup'
        fr: 'Pas de réveil'
        es: 'Sin activación'
        de: 'Kein Aufwecken'
        it: 'Nessun risveglio'
        pl: 'Brak wybudzenia'
        ru: 'Нет пробуждения'
        zh: '无唤醒'
        hu: 'Nincs ébresztés'
        pt: 'Sem ativação'
      0x01:
        en: 'Clock'
        fr: 'Réveil'
        es: 'Reloj despertador'
        de: 'Wecker'
        it: 'Sveglia'
        pl: 'Budzik'
        ru: 'Будильник'
        zh: '闹钟'
        hu: 'Ébresztőóra'
        pt: 'Relógio'

  PRE_DRIVE_WAKEUP:
    bits: '1.6'
    comment:
      en: 'Partial wake-up status for CMM, VCU, TCU, MCU and TBMU wake-up ahead of driving.'
      fr: 'État du réveil partiel pour le réveil des calculateurs CMM, VCU, TCU, MCU et TBMU en anticipation de la mise en roulage.'
      es: 'Estado del despertar parcial para el despertar de las centralitas CMM, VCU, TCU, MCU y TBMU antes de circular.'
      de: 'Status des Teil-Weckens für das Wecken der Steuergeräte CMM, VCU, TCU, MCU und TBMU vor der Fahrt.'
      it: 'Stato del risveglio parziale per il risveglio delle centraline CMM, VCU, TCU, MCU e TBMU prima della marcia.'
      pl: 'Stan częściowego wybudzenia dla wybudzenie sterowników CMM, VCU, TCU, MCU i TBMU przed jazdą.'
      ru: 'Статус частичного пробуждения для пробуждение блоков CMM, VCU, TCU, MCU и TBMU перед началом движения.'
      zh: '驾驶前唤醒CMM、VCU、TCU、MCU和TBMU控制单元的部分唤醒状态。'
      hu: 'Részleges felébresztési állapot: a CMM, VCU, TCU, MCU és TBMU vezérlők felébresztését vezetés előtt.'
      pt: 'Estado da ativação parcial para a ativação das centralinas CMM, VCU, TCU, MCU e TBMU antes da condução.'
    type: 'bool'
    default: 0x00
    values:
      0x00:
