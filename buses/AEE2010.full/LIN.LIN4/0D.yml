id: 0x0D
name: 'SEAT_MASSAGE_STATUS'
type: 'lin'
length: 2
comment:
  en: 'Seat massage module status (channel 1): push-button, fault, massage intensity/type/state, lumbar memory and recall, fault response.'
  fr: 'État du module de massage du siège (canal 1) : bouton poussoir, défaut, intensité/type/état du massage, mémoire et rappel lombaire, réponse de défaut.'
  es: 'Estado del módulo de masaje del asiento (canal 1): pulsador, fallo, intensidad/tipo/estado del masaje, memoria y recuperación lumbar, respuesta de fallo.'
  de: 'Status des Sitzmassagemoduls (Kanal 1): Taster, Fehler, Massageintensität/-typ/-zustand, Lordosen-Memory und -Abruf, Fehlerrückmeldung.'
  it: 'Stato del modulo massaggio sedile (canale 1): pulsante, guasto, intensità/tipo/stato del massaggio, memoria e richiamo lombare, risposta di guasto.'
  pl: 'Stan modułu masażu fotela (kanał 1): przycisk, usterka, intensywność/typ/stan masażu, pamięć i przywołanie lędźwiowe, odpowiedź o usterce.'
  ru: 'Статус модуля массажа сиденья (канал 1): кнопка, неисправность, интенсивность/тип/состояние массажа, память и вызов поясничной поддержки, ответ о неисправности.'
  zh: '座椅按摩模块状态(通道1):按钮、故障、按摩强度/类型/状态、腰托记忆及调用、故障响应。'
  hu: 'Az ülésmasszázs-modul állapota (1. csatorna): nyomógomb, hiba, masszázsintenzitás/-típus/-állapot, deréktámasz-memória és -visszahívás, hibaválasz.'
  pt: 'Estado do módulo de massagem do banco (canal 1): botão, avaria, intensidade/tipo/estado da massagem, memória e recuperação lombar, resposta de avaria.'
periodicity: ['trigger']
senders: ['SPB']
receivers: ['BSI']
lin:
  master: 'BSI'

