id: 0x0C
name: 'ALARM_COMMAND'
type: 'lin'
length: 8
comment:
  en: 'Commands sent by the BSI to the ambient lighting module over LIN: fault erase, showroom mode and personalised ambient lighting block activation.'
  fr: 'Commandes envoyées par la BSI au module d''éclairage d''ambiance sur le bus LIN : effacement défaut, mode showroom et activation des blocs d''éclairage d''ambiance personnalisé.'
  es: 'Órdenes enviadas por la BSI al módulo de iluminación ambiental por el bus LIN: borrado de fallo, modo showroom y activación de los bloques de iluminación ambiental personalizada.'
  de: 'Von der BSI an das Ambientebeleuchtungsmodul über den LIN-Bus gesendete Befehle: Fehlerlöschung, Showroom-Modus und Aktivierung personalisierter Ambientebeleuchtungsblöcke.'
  it: 'Comandi inviati dalla BSI al modulo di illuminazione ambiente sul bus LIN: cancellazione guasto, modalità showroom e attivazione dei blocchi di illuminazione ambiente personalizzata.'
  pl: 'Polecenia wysyłane przez BSI do modułu oświetlenia nastrojowego po magistrali LIN: kasowanie usterki, tryb showroom i aktywacja bloków spersonalizowanego oświetlenia nastrojowego.'
  ru: 'Команды, отправляемые BSI в модуль атмосферной подсветки по шине LIN: стирание неисправности, режим шоурума и активация блоков персонализированной подсветки.'
  zh: '由BSI通过LIN总线发送给氛围灯模块的命令：故障清除、展厅模式及个性化氛围灯区块激活。'
  hu: 'A BSI parancsai a hangulatvilágítási modul felé a LIN buszon: hibatörlés, bemutatóterem mód és a személyre szabott hangulatvilágítási blokkok aktiválása.'
  pt: 'Comandos enviados pela BSI ao módulo de iluminação ambiente via LIN: apagamento de avarias, modo showroom e ativação do bloco de iluminação ambiente personalizada.'
periodicity: ['trigger']
senders: ['BSI']
lin:
  master: 'BSI'

