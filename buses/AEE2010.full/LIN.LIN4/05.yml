            zh: '未监控'
            hu: 'Nem felügyelt'
            pt: 'Não monitorizado'
          0x01:
            en: 'Seat belt unfastened'
            fr: 'Ceinture de sécurité non attachée'
            es: 'Cinturón de seguridad sin abrochar'
            de: 'Sicherheitsgurt nicht angelegt'
            it: 'Cintura di sicurezza non allacciata'
            pl: 'Niezapięty pas bezpieczeństwa'
            ru: 'Ремень безопасности не пристёгнут'
            zh: '安全带未系好'
            hu: 'A biztonsági öv nincs becsatolva'
            pt: 'Cinto de segurança não apertado'
          0x02:
            en: 'Seat belt fastened'
            fr: 'Ceinture bouclée'
            es: 'Cinturón abrochado'
            de: 'Sicherheitsgurt angelegt'
