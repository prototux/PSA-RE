id: 0x33
name: 'SUNROOF_AND_SUNSHADE_STATUS'
type: 'lin'
length: 8
comment:
  en: 'Sunroof and sunshade (LIN) status: power-hold request, movement and position of the roof panel and sunshade, not-initialised flags, fault response.'
  fr: 'État du toit ouvrant et du store (LIN) : demande de maintien d''alimentation, mouvement et position du panneau de toit et du store, indicateurs de non-initialisation, réponse de défaut.'
  es: 'Estado del techo solar y del parasol (LIN): solicitud de mantenimiento de alimentación, movimiento y posición del panel del techo y del parasol, indicadores de no inicializado, respuesta de fallo.'
  de: 'Status von Schiebedach und Sonnenrollo (LIN): Anforderung zum Halten der Versorgung, Bewegung und Position von Dachelement und Rollo, Nicht-initialisiert-Kennzeichen, Fehlerrückmeldung.'
  it: 'Stato del tettuccio apribile e della tendina parasole (LIN): richiesta di mantenimento alimentazione, movimento e posizione del pannello del tetto e della tendina, indicatori di non inizializzato, risposta di guasto.'
  pl: 'Stan szyberdachu i rolety przeciwsłonecznej (LIN): żądanie podtrzymania zasilania, ruch i pozycja panelu dachu i rolety, flagi braku inicjalizacji, odpowiedź o usterce.'
  ru: 'Статус люка и шторки (LIN): запрос удержания питания, движение и положение панели крыши и шторки, флаги отсутствия инициализации, ответ о неисправности.'
  zh: '天窗和遮阳帘(LIN)状态:保持供电请求、车顶面板和遮阳帘的运动及位置、未初始化标志、故障响应。'
  hu: 'A napfénytető és a napellenző (LIN) állapota: tápellátás-tartási kérés, a tetőpanel és a napellenző mozgása és helyzete, inicializálatlansági jelzők, hibaválasz.'
  pt: 'Estado do teto de abrir e do estore (LIN): pedido de retenção de alimentação, movimento e posição do painel do teto e do estore, indicadores de não inicializado, resposta de avaria.'
periodicity: ['trigger']
senders: ['TO1']
receivers: ['BSI']
lin:
  master: 'BSI'

