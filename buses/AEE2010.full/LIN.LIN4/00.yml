id: 0x00
name: 'SEAT_CLIMATE_MODULE_STATUS_REAR_RIGHT'
type: 'lin'
length: 1
comment:
  en: 'Seat heating/ventilation module status (rear-right seat): fan, heater and temperature sensor faults.'
  fr: 'État du module de chauffage/ventilation du siège arrière droit : défauts ventilateur, chauffage et sonde de température.'
  es: 'Estado del módulo de calefacción/ventilación del asiento trasero derecho: fallos de ventilador, calefactor y sonda de temperatura.'
  de: 'Status des Sitzheizungs-/Belüftungsmoduls (Rücksitz rechts): Fehler bei Gebläse, Heizung und Temperatursensor.'
  it: 'Stato del modulo di riscaldamento/ventilazione sedile (sedile posteriore destro): guasti ventola, riscaldatore e sonda di temperatura.'
  pl: 'Stan modułu ogrzewania/wentylacji fotela (tylny prawy fotel): usterki wentylatora, grzałki i czujnika temperatury.'
  ru: 'Статус модуля подогрева/вентиляции сиденья (заднее правое сиденье): неисправности вентилятора, нагревателя и датчика температуры.'
  zh: '座椅加热/通风模块状态(右后座):风扇、加热器和温度传感器故障。'
  hu: 'Az ülésfűtés/-szellőztetés modul állapota (hátsó jobb ülés): ventilátor, fűtés és hőmérséklet-érzékelő hibák.'
  pt: 'Estado do módulo de aquecimento/ventilação do banco (banco traseiro direito): avarias da ventoinha, do aquecedor e do sensor de temperatura.'
periodicity: ['trigger']
senders: ['BRNC']
receivers: ['BSI']
lin:
  master: 'BSI'

signals:
  SEAT_HEATING_TEMP_SENSOR_FAULT:
    bits: '1.5-1.4'
    comment:
