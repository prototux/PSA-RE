      fr: 'Défaut du capteur de température du siège chauffant'
      es: 'Fallo del sensor de temperatura del asiento calefactado'
      de: 'Fehler des Temperatursensors der Sitzheizung'
      it: 'Guasto del sensore di temperatura del sedile riscaldato'
      pl: 'Usterka czujnika temperatury fotela podgrzewanego'
      ru: 'Неисправность датчика температуры подогрева сиденья'
      zh: '座椅加热温度传感器故障'
      hu: 'A fűthető ülés hőmérséklet-érzékelőjének hibája'
      pt: 'Falha do sensor de temperatura do banco aquecido'
    type: 'enum'
