id: 0x01
name: 'BSI_RAPID_COMMAND'
type: 'lin'
length: 4
comment:
  en: 'Self-test status of the occupant classification sensor: calibration, sensor and parameter errors.'
  fr: 'État d''autotest du capteur de classification d''occupant : étalonnage, erreurs capteur et paramètres.'
  es: 'Estado de autoprueba del sensor de clasificación de ocupante: calibración, errores de sensor y parámetros.'
  de: 'Selbsttest-Status des Insassenklassifizierungssensors: Kalibrierung, Sensor- und Parameterfehler.'
  it: 'Stato di autotest del sensore di classificazione occupante: calibrazione, errori sensore e parametri.'
  pl: 'Stan autotestu czujnika klasyfikacji pasażera: kalibracja, błędy czujnika i parametrów.'
  ru: 'Статус самодиагностики датчика классификации пассажира: калибровка, ошибки датчика и параметров.'
  zh: '乘员分类传感器自检状态:标定、传感器及参数错误。'
  hu: 'Az utasfelismerő erzekelő önteszt állapota: kalibráció, erzekelő- és paraméterhibák.'
  pt: 'Estado de autoteste do sensor de classificação de ocupante: calibração, erros de sensor e de parâmetros.'
periodicity: ['trigger']
senders: ['OCS']
lin:
  master: 'BSI'

signals:
  OCS_ECU_ERROR:
    bits: '1.7'
    comment:
      en: 'Occupant classification system (OCS) ECU error (RAM error, watchdog error, etc.)'
      fr: 'Erreur du calculateur du système de classification d''occupant (OCS) (erreur RAM, watchdog, etc.)'
      es: 'Error del calculador del sistema de clasificación de ocupantes (OCS) (error de RAM, watchdog, etc.)'
      de: 'Steuergerätefehler des Beifahrer-Klassifizierungssystems (OCS) (RAM-Fehler, Watchdog-Fehler usw.)'
      it: 'Errore della centralina del sistema di classificazione occupante (OCS) (errore RAM, watchdog, ecc.)'
      pl: 'Błąd sterownika systemu klasyfikacji pasażera (OCS) (błąd RAM, watchdog itp.)'
      ru: 'Ошибка блока управления системы классификации пассажира (OCS) (ошибка ОЗУ, сторожевого таймера и т.д.)'
      zh: '乘员分类系统(OCS)ECU错误(RAM错误、看门狗错误等)'
      hu: 'Az utasosztályozó rendszer (OCS) vezérlőegység hibája (RAM-hiba, watchdog-hiba stb.)'
      pt: 'Erro da unidade de controlo do sistema de classificação de ocupantes (OCS) (erro de RAM, watchdog, etc.)'
    type: 'bool'
    values:
      0x00:
        en: 'No error'
        fr: 'no error'
        es: 'Sin error'
        de: 'Kein Fehler'
        it: 'Nessun errore'
        pl: 'Brak błędu'
        ru: 'Нет ошибки'
        zh: '无错误'
        hu: 'Nincs hiba'
        pt: 'Sem erro'
      0x01:
        en: 'Error detected'
        fr: 'Erreur détectée'
        es: 'Error detectado'
        de: 'Fehler erkannt'
        it: 'Errore rilevato'
        pl: 'Wykryto błąd'
        ru: 'Обнаружена ошибка'
        zh: '检测到错误'
        hu: 'Hiba észlelve'
        pt: 'Erro detetado'

