        fr: 'Bouton-poussoir appuyé'
        es: 'Botón pulsador presionado'
        de: 'Drucktaste gedrückt'
        it: 'Pulsante premuto'
        pl: 'Przycisk wciśnięty'
        ru: 'Кнопка нажата'
        zh: '按钮已按下'
