id: 0x14
name: 'FRONT_CLIMATE_MOTOR_COMMAND'
type: 'lin'
length: 2
comment:
  en: 'Rear-view button module status: fault, fault response, view-change and on/off push-button states.'
  fr: 'État du module de bouton de vue de recul : défaut, réponse de défaut, états des boutons de changement de vue et marche/arrêt.'
  es: 'Estado del módulo del botón de vista trasera: fallo, respuesta de fallo, estados de los botones de cambio de vista y encendido/apagado.'
  de: 'Status des Rückfahrsichttaster-Moduls: Fehler, Fehlerrückmeldung, Zustände der Ansichtswechsel- und Ein/Aus-Taster.'
  it: 'Stato del modulo pulsante vista posteriore: guasto, risposta di guasto, stati dei pulsanti di cambio vista e accensione/spegnimento.'
  pl: 'Stan modułu przycisku widoku wstecznego: usterka, odpowiedź o usterce, stany przycisków zmiany widoku i włączenia/wyłączenia.'
  ru: 'Статус модуля кнопки вида заднего хода: неисправность, ответ о неисправности, состояния кнопок смены вида и вкл/выкл.'
  zh: '后视按钮模块状态:故障、故障响应、视图切换及开关按钮状态。'
  hu: 'A tolatóképernyő-gomb modul állapota: hiba, hibaválasz, nézetváltó és be-/kikapcsoló gombok állapota.'
  pt: 'Estado do módulo do botão de marcha-atrás: avaria, resposta de avaria, mudança de vista e estados do botão ligar/desligar.'
periodicity: ['trigger']
senders: ['AVP']
receivers: ['BSI']
lin:
  master: 'BSI'

signals:
  VIEW_ON_OFF_BUTTON_STATE:
    bits: '1.6'
    comment:
      en: 'View on/off push-button state.'
      fr: 'État du bouton marche/arrêt.'
      es: 'Estado del botón de encendido/apagado de la vista'
      de: 'Status der Ein-/Aus-Taste der Ansicht'
      it: 'Stato del pulsante on/off della vista'
      pl: 'Stan przycisku włączenia/wyłączenia widoku'
      ru: 'Состояние кнопки включения/выключения вида'
      zh: '视图开／关按钮状态'
      hu: 'A nézet be/ki gombjának állapota'
      pt: 'Estado do botão de ligar/desligar a vista'
    type: 'bool'
    values:
      0x00:
        en: 'Push released'
        fr: 'Bouton relâché'
        es: 'Pulsador liberado'
        de: 'Taste losgelassen'
        it: 'Pulsante rilasciato'
        pl: 'Przycisk zwolniony'
        ru: 'Кнопка отпущена'
        zh: '按钮释放'
        hu: 'Gomb elengedve'
        pt: 'Botão libertado'
      0x01:
        en: 'Push button pressed'
        fr: 'Bouton-poussoir appuyé'
        es: 'Botón pulsador presionado'
        de: 'Drucktaste gedrückt'
        it: 'Pulsante premuto'
        pl: 'Przycisk wciśnięty'
        ru: 'Кнопка нажата'
        zh: '按钮已按下'
        hu: 'Nyomógomb megnyomva'
        pt: 'Botão premido'

  VIEW_CHANGE_BUTTON_STATE:
    bits: '1.5'
    comment:
      en: 'View change push-button state.'
      fr: 'État du bouton de changement de vue.'
      es: 'Estado del botón de cambio de vista'
      de: 'Status der Taste zum Ansichtswechsel'
      it: 'Stato del pulsante di cambio vista'
      pl: 'Stan przycisku zmiany widoku'
      ru: 'Состояние кнопки смены вида'
      zh: '视图切换按钮状态'
      hu: 'A nézetváltó gomb állapota'
      pt: 'Estado do botão de mudança de vista'
    type: 'bool'
    values:
      0x00:
        en: 'Push released'
        fr: 'Bouton relâché'
        es: 'Pulsador liberado'
        de: 'Taste losgelassen'
        it: 'Pulsante rilasciato'
        pl: 'Przycisk zwolniony'
        ru: 'Кнопка отпущена'
        zh: '按钮释放'
        hu: 'Gomb elengedve'
        pt: 'Botão libertado'
      0x01:
