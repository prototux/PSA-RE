  SERVICE_REQUEST_RESPONSE:
    bits: '1.4'
    comment:
      en: 'Response to a service request'
      fr: 'Réponse à une requête de service.'
      es: 'Respuesta a una solicitud de servicio'
      de: 'Antwort auf eine Serviceanfrage'
      it: 'Risposta a una richiesta di servizio'
      pl: 'Odpowiedź na żądanie usługi'
      ru: 'Ответ на запрос обслуживания'
      zh: '服务请求响应'
      hu: 'Válasz szervizkérésre'
      pt: 'Resposta a um pedido de serviço.'
    type: 'bool'
    values:
      0x00:
        en: 'No error detected'
        fr: 'Aucune erreur détectée'
        es: 'No se ha detectado ningún error'
        de: 'Kein Fehler erkannt'
        it: 'Nessun errore rilevato'
        pl: 'Nie wykryto błędu'
        ru: 'Ошибок не обнаружено'
        zh: '未检测到错误'
        hu: 'Nincs hiba észlelve'
