  es: 'Estado del módulo de masaje del asiento (canal 2): pulsador, fallo, intensidad/tipo/estado del masaje, respuesta de fallo.'
  de: 'Status des Sitzmassagemoduls (Kanal 2): Taster, Fehler, Massageintensität/-typ/-zustand, Fehlerrückmeldung.'
