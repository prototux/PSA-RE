  zh: '座椅按摩模块状态(通道2):按钮、故障、按摩强度/类型/状态、故障响应。'
  hu: 'Az ülésmasszázs-modul állapota (2. csatorna): nyomógomb, hiba, masszázsintenzitás/-típus/-állapot, hibaválasz.'
  pt: 'Estado do módulo de massagem do banco (canal 2): botão, avaria, intensidade/tipo/estado da massagem, resposta de avaria.'
periodicity: ['trigger']
senders: ['SPB']
receivers: ['BSI']
lin:
