id: 0x0B
name: 'DRIVER_MEMORY_SEAT_STATUS'
type: 'lin'
length: 2
comment:
  en: 'Driver memory seat module status (LIN variant): auto-position in progress, welcome/exit positions, seat movement and memory recall, comfort position, memory key 1, fault response.'
  fr: 'État du module de mémorisation du siège conducteur (variante LIN) : positionnement automatique en cours, positions accueil/sortie, mouvement et rappel mémoire du siège, position confort, touche mémoire 1, réponse de défaut.'
  es: 'Estado del módulo de memoria del asiento del conductor (variante LIN): posicionamiento automático en curso, posiciones de bienvenida/salida, movimiento y recuperación de memoria del asiento, posición confort, tecla de memoria 1, respuesta de fallo.'
  de: 'Status des Fahrersitz-Memory-Moduls (LIN-Variante): automatische Positionierung läuft, Begrüßungs-/Ausstiegspositionen, Sitzbewegung und Memory-Abruf, Komfortposition, Memory-Taste 1, Fehlerrückmeldung.'
  it: 'Stato del modulo memoria sedile conducente (variante LIN): posizionamento automatico in corso, posizioni di benvenuto/uscita, movimento e richiamo memoria del sedile, posizione comfort, tasto memoria 1, risposta di guasto.'
  pl: 'Stan modułu pamięci fotela kierowcy (wariant LIN): trwające automatyczne pozycjonowanie, pozycje powitalna/wyjścia, ruch i przywołanie pamięci fotela, pozycja komfortowa, przycisk pamięci 1, odpowiedź o usterce.'
  ru: 'Статус модуля памяти сиденья водителя (вариант LIN): выполняется автопозиционирование, положения приветствия/выхода, перемещение и вызов памяти сиденья, комфортное положение, клавиша памяти 1, ответ о неисправности.'
  zh: '驾驶员座椅记忆模块状态(LIN变体):自动定位进行中、迎宾/离开位置、座椅移动和记忆调用、舒适位置、记忆键1、故障响应。'
  hu: 'A vezetőoldali memóriaülés-modul állapota (LIN változat): folyamatban lévő automatikus pozicionálás, üdvözlő/kiszállási pozíciók, ülésmozgás és memória-visszahívás, kényelmi pozíció, 1. memóriagomb, hibaválasz.'
  pt: 'Estado do módulo de memória do banco do condutor (variante LIN): posicionamento automático em curso, posições de boas-vindas/saída, movimento do banco e recuperação de memória, posição de conforto, tecla de memória 1, resposta de avaria.'
periodicity: ['trigger']
senders: ['BDM_C']
receivers: ['BSI']
lin:
  master: 'BSI'

