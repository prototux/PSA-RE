id: 0x32
name: 'REAR_CAMERA_DISPLAY_COMMAND'
type: 'lin'
length: 8
comment:
  en: 'Commands sent by the BSI to the reversing camera display module: vehicle brand, selected view, units/language, image overlay and transformation.'
  fr: 'Commandes envoyées par la BSI au module d''affichage de la caméra de recul : marque du véhicule, vue sélectionnée, unités/langue, calque et transformation d''image.'
  es: 'Órdenes enviadas por la BSI al módulo de visualización de la cámara de marcha atrás: marca del vehículo, vista seleccionada, unidades/idioma, superposición y transformación de imagen.'
  de: 'Von der BSI an das Rückfahrkamera-Anzeigemodul gesendete Befehle: Fahrzeugmarke, gewählte Ansicht, Einheiten/Sprache, Bildüberlagerung und -transformation.'
  it: 'Comandi inviati dalla BSI al modulo display della telecamera di retromarcia: marca del veicolo, vista selezionata, unità/lingua, overlay e trasformazione dell''immagine.'
  pl: 'Polecenia wysyłane przez BSI do modułu wyświetlacza kamery cofania: marka pojazdu, wybrany widok, jednostki/język, nakładka i transformacja obrazu.'
  ru: 'Команды, отправляемые BSI в модуль дисплея камеры заднего вида: марка автомобиля, выбранный вид, единицы измерения/язык, наложение и преобразование изображения.'
  zh: '由BSI发送给倒车摄像头显示模块的命令：车辆品牌、所选视图、单位/语言、图像叠加及变换。'
  hu: 'A BSI parancsai a tolatókamera kijelzőmodulja felé: jármű márkája, kiválasztott nézet, mértékegység/nyelv, képréteg és képtranszformáció.'
  pt: 'Comandos enviados pela BSI ao módulo do visor da câmara de marcha-atrás: marca do veículo, vista selecionada, unidades/idioma, sobreposição e transformação de imagem.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['AVP']
lin:
  master: 'BSI'

