      CONFIG_CONSUMPTION_UNIT:
        bits: '5.4'
        comment:
          en: 'Fuel consumption unit (volume per 100 distance units, or distance per volume unit)'
          fr: 'Unité de consommation de carburant (volume aux 100 unités de distance, ou distance par unité de volume)'
          es: 'Unidad de consumo de combustible (volumen por 100 unidades de distancia, o distancia por unidad de volumen)'
          de: 'Kraftstoffverbrauchseinheit (Volumen pro 100 Streckeneinheiten oder Strecke pro Volumeneinheit)'
          it: 'Unità di consumo carburante (volume per 100 unità di distanza, o distanza per unità di volume)'
          pl: 'Jednostka zużycia paliwa (objętość na 100 jednostek odległości lub odległość na jednostkę objętości)'
          ru: 'Единица расхода топлива (объём на 100 единиц расстояния или расстояние на единицу объёма)'
          zh: '燃油消耗单位(每100距离单位的体积,或每体积单位的距离)'
          hu: 'Üzemanyag-fogyasztási egység (térfogat 100 távolságegységenként, vagy távolság térfogategységenként)'
          pt: 'Unidade de consumo de combustível (volume por 100 unidades de distância, ou distância por unidade de volume)'
        type: 'bool'
        values:
          0x00:
            en: 'Volume for 100 distance units (e.g. 1/100 km)'
            fr: 'Volume pour 100 unités de distance (ex. : 1/100 km)'
            es: 'Volumen por 100 unidades de distancia (ej.: 1/100 km)'
            de: 'Volumen pro 100 Entfernungseinheiten (z. B. 1/100 km)'
            it: 'Volume per 100 unità di distanza (es.: 1/100 km)'
            pl: 'Objętość na 100 jednostek odległości (np. 1/100 km)'
            ru: 'Объём на 100 единиц расстояния (напр. 1/100 км)'
            zh: '每100距离单位的容量(如1/100公里)'
            hu: 'Térfogat 100 távolságegységenként (pl. 1/100 km)'
            pt: 'Volume por 100 unidades de distância (por exemplo, 1/100 km)'
          0x01:
            en: 'Distance per volume unit (e.g. mpg, km/l)'
            fr: 'Distance par unite de volume (ex : mpg, km/l)'
            es: 'Distancia por unidad de volumen (p. ej., mpg, km/l)'
            de: 'Strecke pro Volumeneinheit (z. B. mpg, km/l)'
            it: 'Distanza per unità di volume (ad es. mpg, km/l)'
            pl: 'Odległość na jednostkę objętości (np. mpg, km/l)'
            ru: 'Расстояние на единицу объёма (например, миль/галлон, км/л)'
            zh: '每单位容积行驶距离(如mpg、km/l)'
            hu: 'Távolság térfogategységenként (pl. mpg, km/l)'
            pt: 'Distância por unidade de volume (ex.: mpg, km/l)'
      BRIGHTNESS:
        bits: '5.0-6.5'
        comment:
          en: 'Brightness level to apply (0 = minimum, 15 = maximum)'
          fr: 'Niveau de luminosité à appliquer (0 = minimum, 15 = maximum)'
          es: 'Nivel de brillo a aplicar (0 = mínimo, 15 = máximo)'
          de: 'Anzuwendender Helligkeitswert (0 = minimal, 15 = maximal)'
          it: 'Livello di luminosità da applicare (0 = minimo, 15 = massimo)'
          pl: 'Poziom jasności do zastosowania (0 = minimum, 15 = maksimum)'
          ru: 'Применяемый уровень яркости (0 = минимум, 15 = максимум)'
          zh: '应用的亮度级别(0=最小,15=最大)'
          hu: 'Alkalmazandó fényerőszint (0 = minimum, 15 = maximum)'
          pt: 'Nível de luminosidade a aplicar (0 = mínimo, 15 = máximo)'
