id: 0x31
name: 'SEAT_COMFORT_COMMAND'
type: 'lin'
length: 8
comment:
  en: 'Seat comfort commands: driver welcome position, massage authorisation/activation/intensity and heated seat commands.'
  fr: 'Commandes de confort siège : position d''accueil conducteur, autorisation/activation/intensité du massage et commandes de chauffage des sièges.'
  es: 'Órdenes de confort del asiento: posición de bienvenida del conductor, autorización/activación/intensidad del masaje y órdenes de calefacción de los asientos.'
  de: 'Sitzkomfortbefehle: Fahrer-Begrüßungsposition, Massage-Freigabe/-Aktivierung/-Intensität und Sitzheizungsbefehle.'
  it: 'Comandi di comfort del sedile: posizione di accoglienza conducente, autorizzazione/attivazione/intensità del massaggio e comandi di riscaldamento dei sedili.'
  pl: 'Polecenia komfortu fotela: pozycja powitalna kierowcy, zezwolenie/aktywacja/intensywność masażu i polecenia ogrzewania foteli.'
  ru: 'Команды комфорта сиденья: приветственное положение водителя, разрешение/активация/интенсивность массажа и команды обогрева сидений.'
  zh: '座椅舒适性命令：驾驶员迎宾位置、按摩授权/激活/强度及座椅加热命令。'
  hu: 'Az ülés kényelmi parancsai: vezetői üdvözlőpozíció, masszázs engedélyezése/aktiválása/intenzitása és az ülésfűtés parancsai.'
  pt: 'Comandos de conforto dos bancos: posição de boas-vindas do condutor, autorização/ativação/intensidade da massagem e comandos de aquecimento dos bancos.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['BRNC', 'BDM_C', 'SPB']
lin:
  master: 'BSI'

