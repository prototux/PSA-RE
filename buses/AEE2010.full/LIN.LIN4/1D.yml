id: 0x1D
name: 'WAKEUP_MUS'
type: 'lin'
length: 4
comment:
  en: 'PLMB module: fault event, logged in the BSI fault log.'
  fr: 'Module PLMB : événement défaut, enregistré dans le journal des défauts du BSI.'
  es: 'Módulo PLMB: evento de fallo, registrado en el registro de fallos de la BSI.'
  de: 'PLMB-Modul – Fehlerereignis, im Fehlerspeicher (Fehlerprotokoll) des BSI vermerkt.'
  it: 'Modulo PLMB: evento di guasto, registrato nel registro guasti della BSI.'
  pl: 'Moduł PLMB – zdarzenie usterki, zapisywane w dzienniku usterek BSI.'
  ru: 'Модуль PLMB — событие неисправности, регистрируется в журнале неисправностей BSI.'
  zh: 'PLMB模块——故障事件,记录在BSI故障日志中。'
  hu: 'PLMB modul – hibaesemény, amelyet a BSI hibanaplójába rögzítenek.'
  pt: 'Módulo PLMB: evento de avaria, registado no registo de avarias da BSI.'
periodicity: ['trigger']
senders: ['BPL']
receivers: ['BSI']
lin:
  master: 'BSI'

signals:
  DEGRADED_MODE_NUMBER:
    bits: '1.2-2.6'
    comment:
      en: 'Degraded mode number'
      fr: 'Numéro de mode dégradé'
      es: 'Número de modo degradado'
      de: 'Nummer des Degradationsmodus'
      it: 'Numero della modalità degradata'
      pl: 'Numer trybu ograniczonego'
      ru: 'Номер деградированного режима'
      zh: '降级模式编号'
      hu: 'Korlátozott üzemmód száma'
      pt: 'Número do modo degradado'
    type: 'uint'
    min: 0
    max: 15
    invalid: 0x1F

alternatives:
  - note:
      en: 'The content of this frame changes (multiplexed, selector not identified): other layout seen'
      fr: 'Le contenu de cette trame varie (multiplexée, sélecteur non identifié) : autre disposition observée'
      es: 'El contenido de esta trama varía (multiplexada, selector no identificado): otra disposición observada'
      de: 'Der Inhalt dieser Botschaft variiert (gemultiplext, Selektor nicht ermittelt): weitere beobachtete Belegung'
      it: 'Il contenuto di questo frame varia (multiplexato, selettore non identificato): altra disposizione osservata'
      pl: 'Zawartość tej ramki się zmienia (multipleksowana, selektor nieznany): inny zaobserwowany układ'
      ru: 'Содержимое этого кадра меняется (мультиплексирование, селектор не определён): другая наблюдаемая раскладка'
      zh: '此帧内容会变化（多路复用，未识别选择器）：观察到的另一种布局'
      hu: 'A keret tartalma változik (multiplexelt, a választó nem azonosított): másik megfigyelt elrendezés'
      pt: 'O conteúdo desta trama varia (multiplexada, seletor não identificado): outra disposição observada'
    signals:
      BSI_CONTEXT_RELEVANCE:
        bits: '1.1'
        comment:
          en: 'BSI contexts relevance'
          fr: 'Pertinence des contextes BSI'
          es: 'Relevancia de los contextos de la BSI'
          de: 'Relevanz der BSI-Kontexte'
          it: 'Rilevanza dei contesti BSI'
          pl: 'Trafność kontekstów BSI'
          ru: 'Актуальность контекстов BSI'
          zh: 'BSI上下文相关性'
          hu: 'A BSI kontextusok relevanciája'
          pt: 'Relevância dos contextos da BSI'
        type: 'bool'
        values:
          0x00:
            en: 'Relevance of the BSI contexts ensured'
            fr: 'Pertinence des contextes BSI assurée'
            es: 'Pertinencia de los contextos BSI garantizada'
            de: 'Relevanz der BSI-Kontexte sichergestellt'
            it: 'Pertinenza dei contesti BSI garantita'
            pl: 'Trafność kontekstów BSI zapewniona'
            ru: 'Достоверность контекстов BSI обеспечена'
            zh: 'BSI情境相关性已确保'
            hu: 'A BSI kontextusok relevanciája biztosítva'
            pt: 'Pertinência dos contextos BSI assegurada'
          0x01:
            en: 'Relevance of the BSI contexts not ensured'
            fr: 'Pertinence des contextes BSI non assurée'
            es: 'Pertinencia de los contextos BSI no garantizada'
            de: 'Relevanz der BSI-Kontexte nicht sichergestellt'
            it: 'Pertinenza dei contesti BSI non garantita'
            pl: 'Trafność kontekstów BSI niezapewniona'
            ru: 'Актуальность контекстов BSI не гарантирована'
            zh: 'BSI上下文的相关性未得到保证'
            hu: 'A BSI kontextusok relevanciája nem biztosított'
            pt: 'Pertinência dos contextos BSI não garantida'
      EVENT_TYPE:
        bits: '1.0'
        comment:
          en: 'Event type'
          fr: 'Type d''événement'
          es: 'Tipo de evento'
          de: 'Ereignistyp'
          it: 'Tipo di evento'
          pl: 'Typ zdarzenia'
          ru: 'Тип события'
          zh: '事件类型'
          hu: 'Eseménytípus'
          pt: 'Tipo de evento'
        type: 'bool'
        values:
          0x00:
            en: 'Disappearance'
            fr: 'Disparition'
            es: 'Desaparición'
            de: 'Verschwinden'
            it: 'Scomparsa'
            pl: 'Zanik'
            ru: 'Исчезновение'
            zh: '消失'
            hu: 'Eltűnés'
            pt: 'Desaparecimento'
          0x01:
            en: 'Appearance'
            fr: 'Apparition'
            es: 'Aparición'
            de: 'Erscheinen'
            it: 'Comparsa'
            pl: 'Pojawienie się'
