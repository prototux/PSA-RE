id: 0x15
name: 'BSI_SLOW_DATA'
type: 'lin'
length: 2
comment:
  en: 'Sunroof and sunblind commands sent by the BSI over LIN: automatic function, load shedding, fault erase, central closing and speed information.'
  fr: 'Commandes du toit ouvrant et du store envoyées par la BSI sur le bus LIN : fonction automatique, délestage, effacement défaut, fermeture centralisée et information de vitesse.'
  es: 'Órdenes del techo solar y del estor enviadas por la BSI por el bus LIN: función automática, deslastre, borrado de fallo, cierre centralizado e información de velocidad.'
  de: 'Von der BSI über den LIN-Bus gesendete Schiebedach- und Sonnenrollobefehle: Automatikfunktion, Lastabwurf, Fehlerlöschung, zentrales Schließen und Geschwindigkeitsinformation.'
  it: 'Comandi del tettuccio apribile e della tendina inviati dalla BSI sul bus LIN: funzione automatica, distacco carico, cancellazione guasto, chiusura centralizzata e informazioni di velocità.'
  pl: 'Polecenia szyberdachu i rolety wysyłane przez BSI po magistrali LIN: funkcja automatyczna, zrzut obciążenia, kasowanie usterki, zamykanie centralne i informacja o prędkości.'
  ru: 'Команды люка и шторки, отправляемые BSI по шине LIN: автоматическая функция, сброс нагрузки, стирание неисправности, централизованное закрытие и информация о скорости.'
  zh: '由BSI通过LIN总线发送的天窗及遮阳帘命令：自动功能、负载脱扣、故障清除、集中关闭及速度信息。'
  hu: 'A napfénytető és a napellenző parancsai, a BSI küldi a LIN buszon: automatikus funkció, tehermentesítés, hibatörlés, központi zárás és sebességinformáció.'
  pt: 'Comandos do teto de abrir e do estore enviados pela BSI via LIN: função automática, corte de carga, apagamento de avarias, fecho centralizado e informação de velocidade.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['TO1']
lin:
  master: 'BSI'

