id: 0x06
name: 'CLOCK_FAULT_STATUS'
type: 'lin'
length: 2
comment:
  en: 'Rear-view camera status: display view mode and fault response.'
  fr: 'État de la caméra de recul : mode d''affichage de la vue et réponse de défaut.'
  es: 'Estado de la cámara de visión trasera: modo de visualización y respuesta de fallo.'
  de: 'Status der Rückfahrkamera: Anzeigemodus und Fehlerrückmeldung.'
  it: 'Stato della telecamera posteriore: modalità di visualizzazione e risposta di guasto.'
  pl: 'Stan kamery cofania: tryb wyświetlania widoku i odpowiedź o usterce.'
  ru: 'Статус камеры заднего вида: режим отображения и ответ о неисправности.'
  zh: '倒车影像状态:显示视图模式及故障响应。'
  hu: 'A tolatókamera állapota: nézet megjelenítési módja és hibaválasz.'
  pt: 'Estado da câmara de marcha-atrás: modo de apresentação da vista e resposta de avaria.'
periodicity: ['trigger']
senders: ['AVP']
lin:
  master: 'BSI'

