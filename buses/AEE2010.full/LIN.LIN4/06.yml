      ru: 'Отображаемый режим камеры заднего вида (задний или панорамный обзор)'
      zh: '显示的后摄像头视图模式（后视或全景）'
      hu: 'A megjelenített hátsó kamera nézet módja (hátsó vagy panorámás)'
