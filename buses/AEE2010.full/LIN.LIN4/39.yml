id: 0x39
name: 'FLUSH_HANDLE_STATUS_FR'
type: 'lin'
length: 2
comment:
  en: 'Ambient lighting module status: showroom display colour and fault response.'
  fr: 'État du module d''éclairage d''ambiance : couleur d''affichage showroom et réponse de défaut.'
  es: 'Estado del módulo de iluminación ambiental: color de visualización showroom y respuesta de fallo.'
  de: 'Status des Ambientebeleuchtungsmoduls: Showroom-Anzeigefarbe und Fehlerrückmeldung.'
  it: 'Stato del modulo di illuminazione ambientale: colore di visualizzazione showroom e risposta di guasto.'
  pl: 'Stan modułu oświetlenia nastrojowego: kolor wyświetlania w trybie showroom i odpowiedź o usterce.'
  ru: 'Статус модуля атмосферной подсветки: цвет отображения в режиме шоурум и ответ о неисправности.'
  zh: '氛围灯模块状态:展厅显示颜色及故障响应。'
  hu: 'A hangulatvilágítás modul állapota: bemutatótermi megjelenítési szín és hibaválasz.'
  pt: 'Estado do módulo de iluminação ambiente: cor de apresentação showroom e resposta de avaria.'
periodicity: ['trigger']
senders: ['BPL']
lin:
  master: 'BSI'

signals:
  AMBIENT_LIGHT_COLOR:
    bits: '1.1-2.7'
    comment:
      en: 'Current ambient lighting colour'
      fr: 'Couleur d''ambiance en cours'
      es: 'Color actual de la iluminación ambiental'
      de: 'Aktuelle Farbe der Ambientebeleuchtung'
      it: 'Colore corrente dell''illuminazione ambiente'
      pl: 'Bieżący kolor oświetlenia nastrojowego'
      ru: 'Текущий цвет атмосферной подсветки'
      zh: '当前氛围灯颜色'
      hu: 'Az aktuális hangulatfény színe'
      pt: 'Cor de ambiente atual'
    type: 'uint'
    min: 0
    max: 7

alternatives:
  - note:
      en: 'The content of this frame changes (multiplexed, selector not identified): other layout seen'
      fr: 'Le contenu de cette trame varie (multiplexée, sélecteur non identifié) : autre disposition observée'
      es: 'El contenido de esta trama varía (multiplexada, selector no identificado): otra disposición observada'
      de: 'Der Inhalt dieser Botschaft variiert (gemultiplext, Selektor nicht ermittelt): weitere beobachtete Belegung'
      it: 'Il contenuto di questo frame varia (multiplexato, selettore non identificato): altra disposizione osservata'
      pl: 'Zawartość tej ramki się zmienia (multipleksowana, selektor nieznany): inny zaobserwowany układ'
      ru: 'Содержимое этого кадра меняется (мультиплексирование, селектор не определён): другая наблюдаемая раскладка'
      zh: '此帧内容会变化（多路复用，未识别选择器）：观察到的另一种布局'
      hu: 'A keret tartalma változik (multiplexelt, a választó nem azonosított): másik megfigyelt elrendezés'
      pt: 'O conteúdo desta trama varia (multiplexada, seletor não identificado): outra disposição observada'
    signals:
      PLMB_RESPONSE_ERROR:
        bits: '1.0'
        comment:
          en: 'PLMB slave reports an error in the response field'
          fr: 'Esclave PLMB : erreur dans le champ réponse'
          es: 'El esclavo PLMB contiene un error en el campo de respuesta'
          de: 'PLMB-Slave meldet einen Fehler im Antwortfeld'
          it: 'Lo slave PLMB contiene un errore nel campo risposta'
          pl: 'Podrzędny moduł PLMB zgłasza błąd w polu odpowiedzi'
          ru: 'Подчинённое устройство PLMB сообщает об ошибке в поле ответа'
          zh: 'PLMB从设备响应字段中存在错误'
          hu: 'A PLMB alegység hibát jelez a válaszmezőben'
          pt: 'Escravo PLMB: erro no campo de resposta'
        type: 'bool'
        values:
          0x00:
            en: 'No error detected'
            fr: 'Aucune erreur détectée'
            es: 'No se ha detectado ningún error'
            de: 'Kein Fehler erkannt'
            it: 'Nessun errore rilevato'
            pl: 'Nie wykryto błędu'
            ru: 'Ошибок не обнаружено'
            zh: '未检测到错误'
            hu: 'Nincs észlelt hiba'
            pt: 'Nenhum erro detetado'
          0x01:
            en: 'Error detected'
            fr: 'Erreur détectée'
            es: 'Error detectado'
            de: 'Fehler erkannt'
            it: 'Errore rilevato'
            pl: 'Wykryto błąd'
            ru: 'Обнаружена ошибка'
            zh: '检测到错误'
            hu: 'Hiba észlelve'
            pt: 'Erro detetado'
