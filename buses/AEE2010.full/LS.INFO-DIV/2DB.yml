id: 0x2DB
name: 'CHARGE_PROGRAM_SCREEN'
type: 'can'
length: 2
comment:
  en: 'Charge programming screen requests: energy target, start time and charge type.'
  fr: 'Demandes de l''écran de programmation de recharge : énergie cible, heure de départ et type de recharge.'
  es: 'Solicitudes de la pantalla de programación de carga: energía objetivo, hora de inicio y tipo de carga.'
  de: 'Anforderungen des Ladeprogrammierbildschirms: Energieziel, Startzeit und Ladeart.'
  it: 'Richieste della schermata di programmazione della ricarica: energia obiettivo, ora di inizio e tipo di ricarica.'
  pl: 'Żądania z ekranu programowania ładowania: docelowa energia, godzina rozpoczęcia i typ ładowania.'
  ru: 'Запросы экрана программирования зарядки: целевая энергия, время начала и тип зарядки.'
  zh: '充电编程屏幕请求:目标电量、开始时间和充电类型。'
  hu: 'A töltésprogramozási képernyő kérései: célenergia, kezdési időpont és töltéstípus.'
  pt: 'Pedidos do ecrã de programação de carregamento: objetivo de energia, hora de início e tipo de carregamento.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['trigger']
senders: ['BTEL', 'MDS', 'OVIP']
receivers: ['BSI']

