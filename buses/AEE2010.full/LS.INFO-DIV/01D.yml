id: 0x01D
name: 'WAKEUP_MUS'
type: 'can'
length: 1
comment:
  en: 'Handshake frame sent by the steering column lock module (SDCM) back to the body computer (BSI) during the pairing sequence.'
  fr: 'Trame de handshake envoyée par le module de blocage de colonne de direction (SDCM) vers le BSI lors de l''appairage.'
  es: 'Trama de enlace (handshake) enviada por el módulo de bloqueo de la columna de dirección (SDCM) a la BSI durante el emparejamiento.'
  de: 'Handshake-Rahmen vom Lenksäulenverriegelungsmodul (SDCM) zurück an das BSI während der Kopplungssequenz.'
  it: 'Trama di handshake inviata dal modulo di bloccaggio piantone sterzo (SDCM) al BSI durante l''accoppiamento.'
  pl: 'Ramka uzgadniania (handshake) wysyłana przez moduł blokady kolumny kierownicy (SDCM) z powrotem do BSI podczas parowania.'
  ru: 'Кадр рукопожатия, отправляемый модулем блокировки рулевой колонки (SDCM) обратно BSI во время сопряжения.'
  zh: '转向柱锁止模块(SDCM)在配对过程中回传给车身控制器(BSI)的握手帧。'
  hu: 'Kézfogás (handshake) keret, amelyet a kormányoszlop-zár modul (SDCM) küld vissza a BSI-nek a párosítás során.'
  pt: 'Trama de acordo enviada pelo módulo de bloqueio da coluna de direção (SDCM) de volta ao computador de servidão (BSI) durante a sequência de emparelhamento.'
periodicity: ['trigger']
senders: ['SDCM']
receivers: ['BSI']

signals:
  HANDSHAKE_SDCM_TO_BSI:
    bits: '1.7'
    comment:
      en: 'Handshake for the communication frame sent by the SDCM to the BSI'
      fr: 'Prise de contact pour la trame de communication envoyée du SDCM à la BSI'
      es: 'Protocolo de enlace para la trama de comunicación enviada del SDCM a la BSI'
      de: 'Handshake für den von SDCM an BSI gesendeten Kommunikations-Frame'
      it: 'Handshake per la trama di comunicazione inviata dal SDCM alla BSI'
      pl: 'Uzgadnianie (handshake) dla ramki komunikacyjnej wysyłanej z SDCM do BSI'
      ru: 'Согласование (handshake) для кадра связи, отправляемого от SDCM к BSI'
      zh: '由SDCM发送至BSI的通信帧握手'
      hu: 'Az SDCM által a BSI-nek küldött kommunikációs kerethez tartozó kézfogás (handshake)'
      pt: 'Handshake da trama de comunicação enviada pelo SDCM à BSI'
    type: 'bool'
    values:
      0x00:
        en: 'NACK'
        fr: 'NACK'
        es: 'NACK'
        de: 'NACK'
        it: 'NACK'
        pl: 'NACK'
        ru: 'NACK'
        zh: 'NACK'
        hu: 'NACK'
        pt: 'NACK'
      0x01:
        en: 'ACK'
        fr: 'ACK'
        es: 'ACK'
        de: 'ACK'
        it: 'ACK'
        pl: 'ACK'
        ru: 'ACK (подтверждение)'
        zh: 'ACK(确认)'
        hu: 'ACK'
        pt: 'ACK'

  UNUSED_1:
    bits: '1.6-1.0'
    unused: true
