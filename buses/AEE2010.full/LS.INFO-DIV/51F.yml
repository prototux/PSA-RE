        fr: 'NM inactive'
        es: 'NM desactivado'
        de: 'NM deaktiviert'
        it: 'NM disattivato'
        pl: 'NM dezaktywowany'
        ru: 'NM отключён'
        zh: 'NM已停用'
        hu: 'NM kikapcsolva'
        pt: 'NM desativado'
