        fr: 'NM activé'
        es: 'NM activado'
        de: 'NM aktiviert'
        it: 'NM attivo'
        pl: 'NM aktywne'
        ru: 'NM активен'
        zh: 'NM已启用'
        hu: 'NM aktiválva'
        pt: 'NM ativado'

