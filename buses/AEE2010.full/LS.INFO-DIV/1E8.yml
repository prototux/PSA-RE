id: 0x1E8
name: 'ENGINE_MEAP_STATUS'
type: 'can'
length: 8
comment:
  en: 'Preconditioning and cruise-control/speed-limiter menu status: preconditioning activation and schedule time, five speed presets, recall request, availability.'
  fr: 'État du menu préconditionnement et régulateur/limiteur de vitesse : activation et heure programmée du préconditionnement, cinq consignes de vitesse mémorisées, demande de rappel, disponibilité.'
  es: 'Estado del menú de preacondicionamiento y regulador/limitador de velocidad: activación y hora programada del preacondicionamiento, cinco consignas de velocidad memorizadas, solicitud de recuperación, disponibilidad.'
  de: 'Status des Menüs für Vorkonditionierung und Tempomat/Geschwindigkeitsbegrenzer: Aktivierung und geplante Uhrzeit der Vorkonditionierung, fünf gespeicherte Geschwindigkeitsvorgaben, Abrufanforderung, Verfügbarkeit.'
  it: 'Stato del menu precondizionamento e regolatore/limitatore di velocità: attivazione e orario programmato del precondizionamento, cinque setpoint di velocità memorizzati, richiesta di richiamo, disponibilità.'
  pl: 'Stan menu klimatyzacji wstępnej i tempomatu/ogranicznika prędkości: aktywacja i zaplanowana godzina klimatyzacji wstępnej, pięć zapamiętanych wartości prędkości, żądanie przywołania, dostępność.'
  ru: 'Статус меню предварительного кондиционирования и круиз-контроля/ограничителя скорости: активация и запланированное время кондиционирования, пять сохранённых уставок скорости, запрос вызова, доступность.'
  zh: '预调节与巡航/限速菜单状态:预调节激活及计划时间、五个预设速度值、调用请求、可用性。'
  hu: 'Az előkondicionálás és tempomat/sebességhatároló menü állapota: előkondicionálás aktiválása és ütemezett ideje, öt tárolt sebességérték, visszahívási kérés, elérhetőség.'
  pt: 'Estado do menu de pré-condicionamento e do regulador/limitador de velocidade: ativação do pré-condicionamento e hora programada, cinco predefinições de velocidade, pedido de recuperação, disponibilidade.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['1000ms', 'trigger']
senders: ['ICSV', 'BSI']
receivers: ['CMB', 'MATT', 'EMF', 'BTEL', 'OVIP', 'RAD']

