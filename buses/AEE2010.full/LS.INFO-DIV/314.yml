id: 0x314
name: 'REMOTE_TELEMATICS_ORDER'
type: 'can-tp'
comment:
  en: 'Remote command sent from the diagnostic/telematics tool, with packet counter and reference number.'
  fr: 'Commande à distance envoyée par l''outil de diagnostic/télématique, avec compteur de paquet et numéro de référence.'
  es: 'Comando remoto enviado desde la herramienta de diagnóstico/telemática, con contador de paquete y número de referencia.'
  de: 'Fernbefehl vom Diagnose-/Telematiktool, mit Paketzähler und Referenznummer.'
  it: 'Comando remoto inviato dallo strumento di diagnosi/telematica, con contatore pacchetti e numero di riferimento.'
  pl: 'Polecenie zdalne wysyłane z narzędzia diagnostycznego/telematycznego, z licznikiem pakietów i numerem referencyjnym.'
  ru: 'Удалённая команда, отправленная диагностическим/телематическим инструментом, со счётчиком пакетов и номером ссылки.'
  zh: '由诊断/远程信息处理工具发送的远程命令,含数据包计数及参考编号。'
  hu: 'A diagnosztikai/telematikai eszköz által küldött távoli parancs, csomagszámlálóval és referenciaszámmal.'
  pt: 'Comando à distância enviado pela ferramenta de diagnóstico/telemática, com contador de pacotes e número de referência.'
periodicity: ['trigger']
senders: ['MDS']
receivers: ['BSI']
isotp:
  addressing: 'normal'

signals:
  REMOTE_ORDER_PACKAGE_COUNTER:
    bits: '1.7-1.4'
    comment:
      en: 'Counter for remote action requests'
      fr: 'Compteur des demandes d''actions à distance'
      es: 'Contador de las solicitudes de acciones remotas'
      de: 'Zähler der Fernaktionsanforderungen'
      it: 'Contatore delle richieste di azioni remote'
      pl: 'Licznik żądań działań zdalnych'
      ru: 'Счётчик запросов удалённых действий'
      zh: '远程操作请求计数器'
      hu: 'A távoli műveletkérések számlálója'
      pt: 'Contador dos pedidos de ações remotas'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00

  REMOTE_ORDER_SEGMENT_NUMBER:
    bits: '1.3-1.0'
    comment:
      en: 'Segment number for remote action requests'
      fr: 'Numéro de segment des demandes d''actions à distance'
      es: 'Número de segmento de las solicitudes de acciones remotas'
      de: 'Segmentnummer der Fernaktionsanforderungen'
      it: 'Numero di segmento delle richieste di azioni remote'
      pl: 'Numer segmentu żądań działań zdalnych'
      ru: 'Номер сегмента запросов удалённых действий'
      zh: '远程操作请求分段编号'
      hu: 'A távoli műveletkérések szegmensszáma'
      pt: 'Número de segmento dos pedidos de ações remotas'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00

  REMOTE_ORDER_PAYLOAD:
    bits: '2.7-8.0'
    comment:
      en: 'Payload data of the remote action requests'
      fr: 'Données utiles des demandes d''actions à distance'
      es: 'Datos útiles de las solicitudes de acciones remotas'
      de: 'Nutzdaten der Fernaktionsanforderungen'
      it: 'Dati utili delle richieste di azioni remote'
      pl: 'Dane użyteczne żądań działań zdalnych'
      ru: 'Полезные данные запросов удалённых действий'
      zh: '远程操作请求的有效负载数据'
      hu: 'A távoli műveletkérések hasznos adatai'
      pt: 'Dados úteis dos pedidos de ações remotas'
    type: 'uint'
    default: 0x00
