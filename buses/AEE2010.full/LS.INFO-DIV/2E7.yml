      es: 'Número universal del aspecto memorizado 1'
      de: 'Universelle Nummer des gespeicherten Erscheinungsbilds 1'
      it: 'Numero universale dell''aspetto memorizzato 1'
      pl: 'Uniwersalny numer zapisanego wyglądu 1'
      ru: 'Универсальный номер сохранённого облика 1'
      zh: '已存储外观1的通用编号'
      hu: 'A(z) 1. tárolt megjelenés univerzális száma'
