id: 0x2E7
name: 'DISPLAY_MODE_REQUEST'
type: 'can'
length: 8
comment:
  en: 'Display appearance/skin list data (part 1), relayed between the infotainment sources and the instrument cluster.'
  fr: 'Données de liste d''apparence d''affichage (partie 1), relayées entre les sources multimédia et le combiné.'
  es: 'Datos de la lista de apariencia de la pantalla (parte 1), retransmitidos entre las fuentes multimedia y el cuadro de instrumentos.'
  de: 'Anzeigeerscheinungsbild-Listendaten (Teil 1), weitergeleitet zwischen den Infotainmentquellen und dem Kombiinstrument.'
  it: 'Dati dell''elenco aspetto display (parte 1), inoltrati tra le sorgenti infotainment e il quadro strumenti.'
  pl: 'Dane listy wyglądu wyświetlacza (część 1), przekazywane między źródłami multimedialnymi a zestawem wskaźników.'
  ru: 'Данные списка оформления дисплея (часть 1), ретранслируемые между источниками мультимедиа и комбинацией приборов.'
  zh: '显示外观/主题列表数据(第1部分),在信息娱乐信号源与仪表组之间转发。'
  hu: 'A kijelző megjelenési listájának adatai (1. rész), amelyeket az infotainment források és a műszeregység között továbbítanak.'
  pt: 'Dados da lista de aparência/tema do ecrã (parte 1), retransmitidos entre as fontes multimédia e o quadrante.'
observations:
  en: 'Depends on the associated diagnostic class'
  fr: 'Dépend de la classe de diagnostic associée'
  es: 'Depende de la clase de diagnóstico asociada'
  de: 'Abhängig von der zugehörigen Diagnoseklasse'
  it: 'Dipende dalla classe diagnostica associata'
  pl: 'Zależy od powiązanej klasy diagnostycznej'
  ru: 'Зависит от связанного диагностического класса'
  zh: '取决于相关诊断类别'
  hu: 'A kapcsolódó diagnosztikai osztálytól függ'
  pt: 'Depende da classe de diagnóstico associada'
periodicity: ['trigger']
senders: ['ICSV', 'CMB']
receivers: ['BTEL', 'OVIP', 'RAD']

