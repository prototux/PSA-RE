id: 0x1D0
name: 'REAR_FRAGRANCE_DIFFUSER_INFO'
type: 'can'
length: 1
comment:
  en: 'Cabin fragrance diffuser status: selection, intensity and cartridge type.'
  fr: 'État du diffuseur de parfum habitacle : sélection, intensité et type de cartouche.'
  es: 'Estado del difusor de fragancia del habitáculo: selección, intensidad y tipo de cartucho.'
  de: 'Status des Innenraum-Dufterzeugers: Auswahl, Intensität und Kartuschentyp.'
  it: 'Stato del diffusore di profumo dell''abitacolo: selezione, intensità e tipo di cartuccia.'
  pl: 'Stan dyfuzora zapachu we wnętrzu: wybór, intensywność i typ wkładu.'
  ru: 'Статус диффузора ароматизатора салона: выбор, интенсивность и тип картриджа.'
  zh: '车内香氛扩散器状态:选择、浓度及香氛盒类型。'
  hu: 'Az utastéri illatosító állapota: kiválasztás, intenzitás és patrontípus.'
  pt: 'Estado do difusor de fragrância do habitáculo: seleção, intensidade e tipo de cartucho.'
observations:
  en: 'On state change of: FRAGRANCE_INTENSITY, FRAGRANCE_DIFFUSER_STATE, FRAGRANCE_SELECTION'
  fr: 'Sur changement d''état de : FRAGRANCE_INTENSITY, FRAGRANCE_DIFFUSER_STATE, FRAGRANCE_SELECTION'
  es: 'Al cambiar el estado de: FRAGRANCE_INTENSITY, FRAGRANCE_DIFFUSER_STATE, FRAGRANCE_SELECTION'
  de: 'Bei Statusänderung von: FRAGRANCE_INTENSITY, FRAGRANCE_DIFFUSER_STATE, FRAGRANCE_SELECTION'
  it: 'Al cambiamento di stato di: FRAGRANCE_INTENSITY, FRAGRANCE_DIFFUSER_STATE, FRAGRANCE_SELECTION'
  pl: 'Wysyłane przy zmianie stanu: FRAGRANCE_INTENSITY, FRAGRANCE_DIFFUSER_STATE, FRAGRANCE_SELECTION'
  ru: 'При изменении состояния: FRAGRANCE_INTENSITY, FRAGRANCE_DIFFUSER_STATE, FRAGRANCE_SELECTION'
  zh: '当FRAGRANCE_INTENSITY, FRAGRANCE_DIFFUSER_STATE, FRAGRANCE_SELECTION状态变化时'
  hu: 'A(z) FRAGRANCE_INTENSITY, FRAGRANCE_DIFFUSER_STATE, FRAGRANCE_SELECTION állapotváltozásakor'
  pt: 'Na mudança de estado de: FRAGRANCE_INTENSITY, FRAGRANCE_DIFFUSER_STATE, FRAGRANCE_SELECTION'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['OVIP', 'BTEL', 'RAD']

signals:
  FRAGRANCE_CARTRIDGE_TYPE:
    bits: '1.7-1.5'
    comment:
      en: 'Fragrance cartridge type'
      fr: 'Type de cartouche de parfum'
      es: 'Tipo de cartucho de perfume'
      de: 'Duftkartuschentyp'
      it: 'Tipo di cartuccia di fragranza'
      pl: 'Typ wkładu zapachowego'
      ru: 'Тип ароматического картриджа'
      zh: '香氛盒类型'
      hu: 'Illatpatron típusa'
      pt: 'Tipo de cartucho de fragrância'
    type: 'uint'
    min: 0
    max: 7

  FRAGRANCE_INTENSITY:
    bits: '1.4-1.3'
    comment:
      en: 'Fragrance intensity diffused by the system'
      fr: 'Intensité du parfum diffusé par le système'
      es: 'Intensidad del perfume difundido por el sistema'
      de: 'Vom System verbreitete Duftintensität'
      it: 'Intensità della fragranza diffusa dal sistema'
      pl: 'Intensywność zapachu rozprzestrzenianego przez system'
      ru: 'Интенсивность аромата, распространяемого системой'
      zh: '系统释放的香氛浓度'
      hu: 'A rendszer által terjesztett illat intenzitása'
      pt: 'Intensidade da fragrância difundida pelo sistema'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'Unavailable'
        fr: 'Indisponible'
        es: 'No disponible'
        de: 'Nicht verfügbar'
        it: 'Non disponibile'
        pl: 'Niedostępne'
        ru: 'Недоступно'
        zh: '不可用'
        hu: 'Nem elérhető'
        pt: 'Indisponível'
      0x01:
