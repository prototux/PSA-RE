        fr: '1'
        es: '1'
        de: '1'
        it: '1'
        pl: '1'
        ru: '1'
        zh: '1'
        hu: '1'
        pt: '1'
      0x02:
        en: '2'
        fr: '2'
        es: '2'
        de: '2'
        it: '2'
        pl: '2'
        ru: '2'
        zh: '2'
        hu: '2'
        pt: '2'
      0x03:
        en: '3'
        fr: '3'
        es: '3'
        de: '3'
        it: '3'
        pl: '3'
        ru: '3'
        zh: '3'
        hu: '3'
