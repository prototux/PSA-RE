  FRAGRANCE_DIFFUSER_STATE:
    bits: '1.2'
    comment:
      en: 'Fragrance cartridge type (0 = no cartridge in drawer)'
      fr: 'Type de cartouche de parfum (0 = pas de cartouche dans le tiroir)'
      es: 'Tipo de cartucho de perfume (0 = sin cartucho en el cajón)'
      de: 'Duftkartuschentyp (0 = keine Kartusche in der Schublade)'
