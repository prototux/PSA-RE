id: 0x1E0
name: 'RADIO_CONFIG_STATUS'
type: 'can'
length: 7
comment:
  en: 'Radio configuration and status: ambience selection, CD-text, scan, random track, PTY and RDS settings.'
  fr: 'Configuration et état de l''autoradio : sélection d''ambiance, CD-text, balayage, lecture aléatoire, PTY et réglages RDS.'
  es: 'Configuración y estado de la radio: selección de ambiente, CD-text, escaneo, reproducción aleatoria, PTY y ajustes RDS.'
  de: 'Konfiguration und Status des Radios: Ambiente-Auswahl, CD-Text, Scan, Zufallswiedergabe, PTY und RDS-Einstellungen.'
  it: 'Configurazione e stato dell''autoradio: selezione ambiente, CD-text, scansione, riproduzione casuale, PTY e impostazioni RDS.'
  pl: 'Konfiguracja i stan radia: wybór klimatu dźwięku, CD-text, skanowanie, odtwarzanie losowe, PTY i ustawienia RDS.'
  ru: 'Конфигурация и статус радио: выбор эквалайзера, CD-текст, сканирование, случайное воспроизведение, PTY и настройки RDS.'
  zh: '收音机的配置和状态:音效选择、CD文本、扫描、随机播放、PTY和RDS设置。'
  hu: 'A rádió konfigurációja és állapota: hangzás kiválasztása, CD-szöveg, pásztázás, véletlen lejátszás, PTY és RDS beállítások.'
  pt: 'Configuração e estado da rádio: seleção de ambiente, CD-text, varrimento, faixa aleatória, definições PTY e RDS.'
observations:
  en: 'On parameter change'
  fr: 'Sur modification d''un paramètre'
  es: 'Al modificar un parámetro'
  de: 'Bei Parameteränderung'
  it: 'Alla modifica di un parametro'
  pl: 'Przy zmianie wartości parametru'
  ru: 'При изменении параметра'
  zh: '参数被修改时'
  hu: 'Paraméter módosításakor'
  pt: 'Na mudança de parâmetro'
periodicity: ['500ms', 'trigger']
senders: ['RAD', 'ICSV']
receivers: ['EMF']

