id: 0x2A7
name: 'CRUISE_CONTROL_PRESET_SPEEDS'
type: 'can'
length: 7
comment:
  en: 'Preset speed values (up to 6) and availability information for the cruise control.'
  fr: 'Valeurs de vitesse préréglées (jusqu''à 6) et information de disponibilité pour le régulateur de vitesse.'
  es: 'Valores de velocidad preajustados (hasta 6) e información de disponibilidad para el regulador de velocidad.'
  de: 'Voreingestellte Geschwindigkeitswerte (bis zu 6) und Verfügbarkeitsinformation für den Tempomaten.'
  it: 'Valori di velocità preimpostati (fino a 6) e informazioni di disponibilità per il regolatore di velocità.'
  pl: 'Wstępnie ustawione wartości prędkości (do 6) i informacja o dostępności dla tempomatu.'
  ru: 'Предустановленные значения скорости (до 6) и информация о доступности круиз-контроля.'
  zh: '巡航控制的预设速度值（最多6个）及可用性信息。'
  hu: 'A sebességtartó előre beállított sebességértékei (legfeljebb 6) és elérhetőségi információja.'
  pt: 'Valores de velocidade predefinidos (até 6) e informação de disponibilidade do regulador de velocidade.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['1000ms', 'trigger']
senders: ['ICSV', 'BSI']
receivers: ['CMB', 'BTEL', 'OVIP', 'MATT', 'RAD']

