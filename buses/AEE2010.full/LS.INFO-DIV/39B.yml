id: 0x39B
name: 'CLOCK_UPDATE_REQUEST'
type: 'can'
length: 5
comment:
  en: 'Clock update request: year, month, day, hour, minute and time-format mode.'
  fr: 'Demande de mise à jour de l''horloge : année, mois, jour, heure, minute et mode de format horaire.'
  es: 'Solicitud de actualización del reloj: año, mes, día, hora, minuto y modo de formato horario.'
  de: 'Anforderung zur Aktualisierung der Uhr: Jahr, Monat, Tag, Stunde, Minute und Zeitformatmodus.'
  it: 'Richiesta di aggiornamento orologio: anno, mese, giorno, ora, minuto e modalità formato ora.'
  pl: 'Żądanie aktualizacji zegara: rok, miesiąc, dzień, godzina, minuta i tryb formatu czasu.'
  ru: 'Запрос обновления часов: год, месяц, день, час, минута и режим формата времени.'
  zh: '时钟更新请求:年、月、日、时、分和时间格式模式。'
  hu: 'Óra frissítési kérés: év, hónap, nap, óra, perc és időformátum mód.'
  pt: 'Pedido de atualização do relógio: ano, mês, dia, hora, minuto e modo de formato de hora.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['trigger']
senders: ['ICSV', 'BTEL', 'OVIP', 'CMB', 'EMF', 'MATT']
receivers: ['BSI']

signals:
  CONFIG_DISPLAY_TIME:
    bits: '1.7'
    comment:
      en: 'Time display format configured by the customer (12h/24h)'
      fr: 'Format d''affichage de l''heure configuré par le client (12h/24h)'
      es: 'Formato de visualización de la hora configurado por el cliente (12h/24h)'
      de: 'Vom Kunden eingestelltes Uhrzeitformat (12/24 Std.)'
      it: 'Formato dell''ora configurato dal cliente (12h/24h)'
      pl: 'Format wyświetlania godziny ustawiony przez klienta (12h/24h)'
      ru: 'Формат отображения времени, настроенный клиентом (12/24 ч)'
      zh: '客户设置的时间显示格式(12小时/24小时)'
      hu: 'Az ügyfél által beállított óraformátum (12/24 óra)'
      pt: 'Formato de visualização da hora configurado pelo cliente (12h/24h)'
    type: 'bool'
    default: 0x01
    values:
      0x00:
        en: 'Time displayed in 12-hour mode'
        fr: 'Heure affichée au format 12 heures'
        es: 'Hora mostrada en formato de 12 horas'
        de: 'Uhrzeit im 12-Stunden-Format angezeigt'
        it: 'Ora visualizzata in formato 12 ore'
        pl: 'Godzina wyświetlana w formacie 12-godzinnym'
        ru: 'Время отображается в 12-часовом формате'
        zh: '时间以12小时制显示'
        hu: 'Idő 12 órás formátumban jelenik meg'
        pt: 'Hora apresentada no formato de 12 horas'
      0x01:
        en: 'Time displayed in 24-hour mode'
        fr: 'Heure affichée au format 24 heures'
        es: 'Hora mostrada en formato de 24 horas'
        de: 'Uhrzeit im 24-Stunden-Format angezeigt'
