id: 0x345
name: 'DASHCAM_ACCIDENT_POPUP'
type: 'can'
length: 8
comment:
  en: 'Dashcam accident recording pop-up: recording date/time, video number and pop-up type shown on the display.'
  fr: 'Pop-up d''enregistrement accident du dashcam : date/heure d''enregistrement, numéro de vidéo et type de pop-up affiché sur l''écran.'
  es: 'Aviso emergente de grabación de accidente del dashcam: fecha/hora de grabación, número de vídeo y tipo de aviso mostrado en la pantalla.'
  de: 'Dashcam-Unfallaufnahme-Popup: Aufnahmedatum/-uhrzeit, Videonummer und auf dem Display angezeigter Popup-Typ.'
  it: 'Popup di registrazione incidente del dashcam: data/ora di registrazione, numero video e tipo di popup mostrato sul display.'
  pl: 'Wyskakujące powiadomienie o nagraniu wypadku z wideorejestratora: data/godzina nagrania, numer wideo i typ powiadomienia na wyświetlaczu.'
  ru: 'Всплывающее уведомление о записи ДТП видеорегистратором: дата/время записи, номер видео и тип всплывающего окна на дисплее.'
  zh: '行车记录仪事故录制弹窗:录制日期/时间、视频编号及显示屏上显示的弹窗类型。'
  hu: 'A fedélzeti kamera balesetfelvétel felugró ablaka: felvétel dátuma/ideje, videószám és a kijelzőn megjelenő felugró ablak típusa.'
  pt: 'Alerta pop-up de gravação de acidente da câmara de bordo: data/hora da gravação, número do vídeo e tipo de pop-up apresentado no ecrã.'
observations:
  en: 'On an external event'
  fr: 'Sur événement extérieur'
  es: 'Ante un evento externo'
  de: 'Bei einem externen Ereignis'
  it: 'Su un evento esterno'
  pl: 'Przy zdarzeniu zewnętrznym'
  ru: 'При внешнем событии'
  zh: '外部事件触发时'
  hu: 'Külső esemény hatására'
  pt: 'Num evento externo'
periodicity: ['trigger']
senders: ['IDVR']
receivers: ['BTEL', 'OVIP']

