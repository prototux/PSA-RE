id: 0x220
name: 'VEHICLE_PERSONALIZATION_STATUS'
type: 'can'
length: 5
comment:
  en: 'Personalization profile information (units, language, welcome animation, ambient lighting): active settings and menu states, defined by the profile message structure.'
  fr: 'Informations de profils de personnalisation (unités, langue, animation d''accueil, éclairage d''ambiance) : réglages actifs et états de menu, définis par la structure du message profils.'
  es: 'Información de perfiles de personalización (unidades, idioma, animación de bienvenida, iluminación ambiental): ajustes activos y estados de menú, definidos por la estructura del mensaje de perfiles.'
  de: 'Personalisierungsprofilinformationen (Einheiten, Sprache, Begrüßungsanimation, Ambientebeleuchtung): aktive Einstellungen und Menüzustände, definiert durch die Struktur der Profilnachricht.'
  it: 'Informazioni sui profili di personalizzazione (unità, lingua, animazione di benvenuto, illuminazione ambiente): impostazioni attive e stati del menu, definite dalla struttura del messaggio profili.'
  pl: 'Informacje profili personalizacji (jednostki, język, animacja powitalna, oświetlenie nastrojowe): aktywne ustawienia i stany menu, zdefiniowane przez strukturę komunikatu profili.'
  ru: 'Информация профилей персонализации (единицы измерения, язык, приветственная анимация, атмосферная подсветка): активные настройки и состояния меню, определяемые структурой сообщения профилей.'
  zh: '个性化配置文件信息（单位、语言、迎宾动画、氛围灯）：激活设置和菜单状态，由配置文件消息结构定义。'
  hu: 'Személyre szabási profilinformációk (mértékegységek, nyelv, üdvözlőanimáció, hangulatvilágítás): aktív beállítások és menüállapotok, a profilüzenet szerkezete határozza meg.'
  pt: 'Informação de perfil de personalização (unidades, idioma, animação de boas-vindas, iluminação ambiente): definições ativas e estados de menu, definida pela estrutura da mensagem de perfil.'
observations:
  en: 'On state change of: POLYCHROME_PACK_ANIMATION_ITEM_STATUS, POLYCHROME_PACK_COLOR1_STATUS'
  fr: 'Sur changement d''état de : POLYCHROME_PACK_ANIMATION_ITEM_STATUS, POLYCHROME_PACK_COLOR1_STATUS'
  es: 'Al cambiar el estado de: POLYCHROME_PACK_ANIMATION_ITEM_STATUS, POLYCHROME_PACK_COLOR1_STATUS'
  de: 'Bei Statusänderung von: POLYCHROME_PACK_ANIMATION_ITEM_STATUS, POLYCHROME_PACK_COLOR1_STATUS'
  it: 'Al cambiamento di stato di: POLYCHROME_PACK_ANIMATION_ITEM_STATUS, POLYCHROME_PACK_COLOR1_STATUS'
  pl: 'Wysyłane przy zmianie stanu: POLYCHROME_PACK_ANIMATION_ITEM_STATUS, POLYCHROME_PACK_COLOR1_STATUS'
  ru: 'При изменении состояния: POLYCHROME_PACK_ANIMATION_ITEM_STATUS, POLYCHROME_PACK_COLOR1_STATUS'
  zh: '当FCT_MENU_ECLI_PPC_ANIM, POLYCHROME_PACK_COLOR1_STATUS, FCT_MENU_ECLI_PPC状态变化时'
  hu: 'A(z) POLYCHROME_PACK_ANIMATION_ITEM_STATUS, POLYCHROME_PACK_COLOR1_STATUS állapotváltozásakor'
  pt: 'Na mudança de estado de: POLYCHROME_PACK_ANIMATION_ITEM_STATUS, POLYCHROME_PACK_COLOR1_STATUS'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['EMF', 'BTEL', 'MATT', 'MDS', 'CMB', 'VTH', 'RAD', 'ICSV', 'BGP', 'FMUX', 'OVIP']

