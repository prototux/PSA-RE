id: 0x268
name: 'ENGINE_DYNAMIC_DATA'
type: 'can'
length: 8
comment:
  en: 'Human-machine interface data: driver/passenger seat massage button presses, intensity, type and vehicle mode configuration.'
  fr: 'Données de l''interface homme-machine : appuis boutons massage sièges conducteur/passager, intensité, type et configuration du mode véhicule.'
  es: 'Datos de la interfaz hombre-máquina: pulsaciones de los botones de masaje de los asientos del conductor/pasajero, intensidad, tipo y configuración del modo del vehículo.'
  de: 'Mensch-Maschine-Schnittstellendaten: Tastendrücke der Sitzmassage Fahrer/Beifahrer, Intensität, Typ und Fahrzeugmoduskonfiguration.'
  it: 'Dati dell''interfaccia uomo-macchina: pressioni dei pulsanti massaggio sedili conducente/passeggero, intensità, tipo e configurazione della modalità veicolo.'
  pl: 'Dane interfejsu człowiek-maszyna: naciśnięcia przycisków masażu fotela kierowcy/pasażera, intensywność, typ i konfiguracja trybu pojazdu.'
  ru: 'Данные человеко-машинного интерфейса: нажатия кнопок массажа сидений водителя/пассажира, интенсивность, тип и конфигурация режима автомобиля.'
  zh: '人机交互数据:驾驶员/乘客座椅按摩按钮按下、强度、类型及车辆模式配置。'
  hu: 'Ember-gép interfész adatok: a vezető/utas ülésmasszázs gombjainak megnyomása, intenzitás, típus és járműmód-konfiguráció.'
  pt: 'Dados da interface homem-máquina: pressões nos botões de massagem dos bancos do condutor/passageiro, intensidade, tipo e configuração do modo do veículo.'
observations:
  en: 'On state change of: ILV_SPEED_TO_DISPLAY, ILV_SIGN_TYPE, ILV_OVERSPEED_FLAG, VEHICLE_POI_DISPLAY_REQUEST, DYNAMIC_MODE_HMI_FEEDBACK, DYNAMIC_MODE_SELECTED_SYNTHESIS, DYNAMIC_SETTING_TYPE, VEHICLE_MODE_SELECTOR_CONFIGURATION, CURRENT_VEHICLE_MODE, VEHICLE_MODE_SELECTOR_COMMAND'
  fr: 'Sur changement d''état de : ILV_SPEED_TO_DISPLAY, ILV_SIGN_TYPE, ILV_OVERSPEED_FLAG, VEHICLE_POI_DISPLAY_REQUEST, DYNAMIC_MODE_HMI_FEEDBACK, DYNAMIC_MODE_SELECTED_SYNTHESIS, DYNAMIC_SETTING_TYPE, VEHICLE_MODE_SELECTOR_CONFIGURATION, CURRENT_VEHICLE_MODE, VEHICLE_MODE_SELECTOR_COMMAND'
  es: 'Al cambiar el estado de: ILV_SPEED_TO_DISPLAY, ILV_SIGN_TYPE, ILV_OVERSPEED_FLAG, VEHICLE_POI_DISPLAY_REQUEST, DYNAMIC_MODE_HMI_FEEDBACK, DYNAMIC_MODE_SELECTED_SYNTHESIS, DYNAMIC_SETTING_TYPE, VEHICLE_MODE_SELECTOR_CONFIGURATION, CURRENT_VEHICLE_MODE, VEHICLE_MODE_SELECTOR_COMMAND'
  de: 'Bei Statusänderung von: ILV_SPEED_TO_DISPLAY, ILV_SIGN_TYPE, ILV_OVERSPEED_FLAG, VEHICLE_POI_DISPLAY_REQUEST, DYNAMIC_MODE_HMI_FEEDBACK, DYNAMIC_MODE_SELECTED_SYNTHESIS, DYNAMIC_SETTING_TYPE, VEHICLE_MODE_SELECTOR_CONFIGURATION, CURRENT_VEHICLE_MODE, VEHICLE_MODE_SELECTOR_COMMAND'
  it: 'Al cambiamento di stato di: ILV_SPEED_TO_DISPLAY, ILV_SIGN_TYPE, ILV_OVERSPEED_FLAG, VEHICLE_POI_DISPLAY_REQUEST, DYNAMIC_MODE_HMI_FEEDBACK, DYNAMIC_MODE_SELECTED_SYNTHESIS, DYNAMIC_SETTING_TYPE, VEHICLE_MODE_SELECTOR_CONFIGURATION, CURRENT_VEHICLE_MODE, VEHICLE_MODE_SELECTOR_COMMAND'
  pl: 'Wysyłane przy zmianie stanu: ILV_SPEED_TO_DISPLAY, ILV_SIGN_TYPE, ILV_OVERSPEED_FLAG, VEHICLE_POI_DISPLAY_REQUEST, DYNAMIC_MODE_HMI_FEEDBACK, DYNAMIC_MODE_SELECTED_SYNTHESIS, DYNAMIC_SETTING_TYPE, VEHICLE_MODE_SELECTOR_CONFIGURATION, CURRENT_VEHICLE_MODE, VEHICLE_MODE_SELECTOR_COMMAND'
  ru: 'При изменении состояния: ILV_SPEED_TO_DISPLAY, ILV_SIGN_TYPE, ILV_OVERSPEED_FLAG, VEHICLE_POI_DISPLAY_REQUEST, DYNAMIC_MODE_HMI_FEEDBACK, DYNAMIC_MODE_SELECTED_SYNTHESIS, DYNAMIC_SETTING_TYPE, VEHICLE_MODE_SELECTOR_CONFIGURATION, CURRENT_VEHICLE_MODE, VEHICLE_MODE_SELECTOR_COMMAND'
  zh: '当VIT_A_AFFICHER_ILV, ILV_SIGN_TYPE, ILV_OVERSPEED_FLAG, VEHICLE_POI_DISPLAY_REQUEST, DYNAMIC_MODE_HMI_FEEDBACK, DYNAMIC_MODE_SELECTED_SYNTHESIS, DYNAMIC_SETTING_TYPE, VEHICLE_MODE_SELECTOR_CONFIGURATION, CURRENT_VEHICLE_MODE, INFO_CMDM_CMD_SELECTEUR状态变化时'
  hu: 'A(z) ILV_SPEED_TO_DISPLAY, ILV_SIGN_TYPE, ILV_OVERSPEED_FLAG, VEHICLE_POI_DISPLAY_REQUEST, DYNAMIC_MODE_HMI_FEEDBACK, DYNAMIC_MODE_SELECTED_SYNTHESIS, DYNAMIC_SETTING_TYPE, VEHICLE_MODE_SELECTOR_CONFIGURATION, CURRENT_VEHICLE_MODE, VEHICLE_MODE_SELECTOR_COMMAND állapotváltozásakor'
  pt: 'Na mudança de estado de: ILV_SPEED_TO_DISPLAY, ILV_SIGN_TYPE, ILV_OVERSPEED_FLAG, VEHICLE_POI_DISPLAY_REQUEST, DYNAMIC_MODE_HMI_FEEDBACK, DYNAMIC_MODE_SELECTED_SYNTHESIS, DYNAMIC_SETTING_TYPE, VEHICLE_MODE_SELECTOR_CONFIGURATION, CURRENT_VEHICLE_MODE, VEHICLE_MODE_SELECTOR_COMMAND'
