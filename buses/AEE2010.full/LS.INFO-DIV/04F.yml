  BLACKLISTING_REQUEST:
    bits: '2.3'
    comment:
      en: 'Request to make devices identified inside the vehicle unavailable (used when locking with devices still inside).'
      fr: 'Demande de mise en indisponibilité des dispositifs identifiés à l''intérieur du véhicule (utilisée lors d''un verrouillage avec dispositifs restés à l''intérieur).'
      es: 'Solicitud de deshabilitación de los dispositivos identificados dentro del vehículo (usada al cerrar con dispositivos aún dentro).'
      de: 'Anforderung zur Sperrung der im Fahrzeuginneren erkannten Geräte (bei Verriegelung mit noch innen befindlichen Geräten).'
      it: 'Richiesta di disabilitazione dei dispositivi identificati all''interno del veicolo (usata quando si chiude con dispositivi ancora all''interno).'
      pl: 'Żądanie unieważnienia urządzeń zidentyfikowanych wewnątrz pojazdu (używane przy zamykaniu z urządzeniami wewnątrz).'
      ru: 'Запрос на деактивацию устройств, обнаруженных внутри автомобиля (используется при запирании с оставшимися внутри устройствами).'
      zh: '请求将车内识别到的设备置为不可用（在设备仍留车内时落锁使用）。'
      hu: 'Kérés a járművön belül azonosított eszközök elérhetetlenné tételére (belül maradt eszközökkel történő záráskor).'
      pt: 'Pedido de indisponibilização dos dispositivos identificados dentro do veículo (utilizado ao bloquear com dispositivos ainda dentro).'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
