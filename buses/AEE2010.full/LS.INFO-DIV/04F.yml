        it: 'Consentito'
        pl: 'Dozwolone'
        ru: 'Разрешено'
        zh: '允许'
        hu: 'Engedélyezve'
        pt: 'Permitido'

  HANDSFREE_POLLING_DEACTIVATION_REQUEST:
    bits: '1.5-1.4'
    comment:
      en: 'Request to stop hands-free access polling.'
      fr: 'Demande d''arrêt du polling d''accès mains-libres.'
      es: 'Solicitud de detención del sondeo de acceso manos libres.'
      de: 'Anforderung zum Stoppen des Handsfree-Zugriffs-Pollings.'
      it: 'Richiesta di arresto del polling di accesso mani libere.'
      pl: 'Żądanie zatrzymania odpytywania dostępu hands-free.'
      ru: 'Запрос на остановку опроса доступа hands-free.'
      zh: '停止免提进入轮询的请求。'
      hu: 'A kihangosított hozzáférési lekérdezés leállítási kérése.'
      pt: 'Pedido para parar a interrogação de acesso mãos-livres.'
    type: 'enum'
