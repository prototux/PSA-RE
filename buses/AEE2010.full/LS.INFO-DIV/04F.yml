  HANDSFREE_ACCESS_DISABLE_REQUEST:
    bits: '1.0'
    comment:
      en: 'Request to disallow all hands-free access features (polling, capacitive sensor, etc.); remote control (RKE) still works.'
      fr: 'Demande d''interdiction de toutes les fonctions d''accès mains-libres (polling, capteur capacitif, etc.) ; la télécommande RKE reste active.'
      es: 'Solicitud para deshabilitar todas las funciones de acceso manos libres (sondeo, sensor capacitivo, etc.); el mando a distancia RKE sigue activo.'
      de: 'Anforderung zur Deaktivierung aller Handsfree-Zugriffsfunktionen (Polling, kapazitiver Sensor usw.); die RKE-Fernbedienung bleibt aktiv.'
      it: 'Richiesta di disabilitazione di tutte le funzioni di accesso mani libere (polling, sensore capacitivo, ecc.); il telecomando RKE resta attivo.'
      pl: 'Żądanie wyłączenia wszystkich funkcji dostępu hands-free (odpytywanie, czujnik pojemnościowy itd.); pilot RKE nadal działa.'
      ru: 'Запрос на отключение всех функций доступа hands-free (опрос, ёмкостный датчик и т.д.); радиобрелок (RKE) продолжает работать.'
      zh: '禁用所有免提进入功能（轮询、电容传感器等）的请求；RKE遥控仍然有效。'
      hu: 'Kérés az összes kihangosított hozzáférési funkció (lekérdezés, kapacitív érzékelő stb.) letiltására; az RKE távirányító továbbra is működik.'
      pt: 'Pedido para desativar todas as funcionalidades de acesso mãos-livres (interrogação, sensor capacitivo, etc.); o comando à distância (RKE) continua a funcionar.'
    type: 'bool'
    default: 0x01
    values:
      0x00:
        en: 'Inactive'
        fr: 'Inactif'
        es: 'Inactivo'
        de: 'Inaktiv'
        it: 'Inattivo'
