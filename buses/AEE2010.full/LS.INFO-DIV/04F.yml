  WAL_UIR_TRANSITION_IGNORE_FLAG:
    bits: '1.3'
    comment:
      en: 'Tells the SDCM that walk-away-locking and unlock-in-run transitions are not taken into account to (un)lock the vehicle.'
      fr: 'Indique au SDCM que les transitions de verrouillage à l''éloignement et de déverrouillage en roulage ne sont pas prises en compte pour (dé)verrouiller le véhicule.'
      es: 'Indica al SDCM que las transiciones de cierre al alejarse y desbloqueo en marcha no se tienen en cuenta para (des)bloquear el vehículo.'
      de: 'Teilt dem SDCM mit, dass Weggeh-Verriegelungs- und Entriegeln-während-der-Fahrt-Übergänge beim (Ent-)Verriegeln nicht berücksichtigt werden.'
      it: 'Indica al SDCM che le transizioni di chiusura all''allontanamento e di sblocco in marcia non sono considerate per (s)bloccare il veicolo.'
      pl: 'Informuje SDCM, że przejścia zamykania przy oddalaniu i odblokowania podczas jazdy nie są uwzględniane przy (od)blokowaniu pojazdu.'
      ru: 'Сообщает модулю SDCM, что переходы автозапирания при удалении и разблокировки в движении не учитываются при (раз)блокировке автомобиля.'
      zh: '告知SDCM在（解）锁车辆时不考虑离车落锁和行驶中解锁的转变。'
      hu: 'Jelzi az SDCM felé, hogy a távozáskor zárás és a menet közbeni kinyitás átmeneteit nem veszi figyelembe a jármű (ki)zárásakor.'
      pt: 'Indica ao SDCM que as transições de trancagem ao afastar-se e de destrancagem em marcha não são tidas em conta para (des)trancar o veículo.'
    type: 'bool'
    default: 0x01
    values:
      0x00:
        en: 'Inactive'
        fr: 'Inactive'
        es: 'Inactivo'
        de: 'Inaktiv'
        it: 'Inattivo'
        pl: 'Nieaktywny'
