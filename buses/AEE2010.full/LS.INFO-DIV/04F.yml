id: 0x04F
name: 'UNCIPHERED_DATA_BSI_TO_SDCM'
type: 'can'
length: 8
comment:
  en: 'Unencrypted configuration and authorisation data sent from the BSI to the SDCM: blacklist requests, hands-free/smart-device activation and vehicle configuration mode'
  fr: 'Données non chiffrées de configuration et d''autorisation envoyées de la BSI au SDCM : requêtes de liste noire, activation mains libres/smartphone et mode de configuration véhicule'
  es: 'Datos sin cifrar de configuración y autorización enviados de la BSI al SDCM: solicitudes de lista negra, activación manos libres/smartphone y modo de configuración del vehículo'
  de: 'Unverschlüsselte Konfigurations- und Freigabedaten, von BSI an SDCM gesendet: Sperrlistenanfragen, Freihand-/Smart-Device-Aktivierung und Fahrzeugkonfigurationsmodus'
  it: 'Dati non cifrati di configurazione e autorizzazione inviati dalla BSI al SDCM: richieste di lista nera, attivazione mani libere/smart device e modalità di configurazione veicolo'
  pl: 'Niezaszyfrowane dane konfiguracji i autoryzacji wysyłane z BSI do SDCM: żądania czarnej listy, aktywacja bezkluczykowa/smart device oraz tryb konfiguracji pojazdu'
  ru: 'Незашифрованные данные конфигурации и авторизации, отправляемые от BSI к SDCM: запросы чёрного списка, активация бесключевого доступа/смарт-устройства и режим конфигурации автомобиля'
  zh: '由BSI发送至SDCM的未加密配置与授权数据:黑名单请求、免钥匙/智能设备激活及车辆配置模式'
  hu: 'A BSI által az SDCM-nek küldött titkosítatlan konfigurációs és jogosultsági adatok: feketelista-kérések, kézközelítéses/okoseszköz-aktiválás és jármű-konfigurációs mód'
  pt: 'Dados de configuração e autorização não encriptados enviados da BSI para o SDCM: pedidos de lista negra, ativação de mãos-livres/dispositivo inteligente e modo de configuração do veículo.'
observations:
  en: 'On state change of: SMART_DEVICE_COMM_DISABLE_REQUEST, SDCM_AUTHORIZATION_REQUEST, HANDSFREE_POLLING_DEACTIVATION_REQUEST, WAL_UIR_TRANSITION_IGNORE_FLAG, MAIN_STATUS, HANDSFREE_ACCESS_DISABLE_REQUEST'
  fr: 'Sur changement d''état de : SMART_DEVICE_COMM_DISABLE_REQUEST, SDCM_AUTHORIZATION_REQUEST, HANDSFREE_POLLING_DEACTIVATION_REQUEST, WAL_UIR_TRANSITION_IGNORE_FLAG, MAIN_STATUS, HANDSFREE_ACCESS_DISABLE_REQUEST'
  es: 'Al cambiar el estado de: SMART_DEVICE_COMM_DISABLE_REQUEST, SDCM_AUTHORIZATION_REQUEST, HANDSFREE_POLLING_DEACTIVATION_REQUEST, WAL_UIR_TRANSITION_IGNORE_FLAG, MAIN_STATUS, HANDSFREE_ACCESS_DISABLE_REQUEST'
  de: 'Bei Statusänderung von: SMART_DEVICE_COMM_DISABLE_REQUEST, SDCM_AUTHORIZATION_REQUEST, HANDSFREE_POLLING_DEACTIVATION_REQUEST, WAL_UIR_TRANSITION_IGNORE_FLAG, MAIN_STATUS, HANDSFREE_ACCESS_DISABLE_REQUEST'
  it: 'Al cambiamento di stato di: SMART_DEVICE_COMM_DISABLE_REQUEST, SDCM_AUTHORIZATION_REQUEST, HANDSFREE_POLLING_DEACTIVATION_REQUEST, WAL_UIR_TRANSITION_IGNORE_FLAG, MAIN_STATUS, HANDSFREE_ACCESS_DISABLE_REQUEST'
  pl: 'Wysyłane przy zmianie stanu: SMART_DEVICE_COMM_DISABLE_REQUEST, SDCM_AUTHORIZATION_REQUEST, HANDSFREE_POLLING_DEACTIVATION_REQUEST, WAL_UIR_TRANSITION_IGNORE_FLAG, MAIN_STATUS, HANDSFREE_ACCESS_DISABLE_REQUEST'
  ru: 'При изменении состояния: SMART_DEVICE_COMM_DISABLE_REQUEST, SDCM_AUTHORIZATION_REQUEST, HANDSFREE_POLLING_DEACTIVATION_REQUEST, WAL_UIR_TRANSITION_IGNORE_FLAG, MAIN_STATUS, HANDSFREE_ACCESS_DISABLE_REQUEST'
  zh: '当SMART_DEVICE_ACTIVATION, SDCM_AUTHORIZATION_REQUEST, HANDSFREE_POLLING_DEACTIVATION_REQUEST, WAL_UIR_TRANSITION_IGNORE_FLAG, MAIN_STATUS, FONCTION_AML_ACTIVE状态变化时'
  hu: 'A(z) SMART_DEVICE_COMM_DISABLE_REQUEST, SDCM_AUTHORIZATION_REQUEST, HANDSFREE_POLLING_DEACTIVATION_REQUEST, WAL_UIR_TRANSITION_IGNORE_FLAG, MAIN_STATUS, HANDSFREE_ACCESS_DISABLE_REQUEST állapotváltozásakor'
  pt: 'Na mudança de estado de: SMART_DEVICE_COMM_DISABLE_REQUEST, SDCM_AUTHORIZATION_REQUEST, HANDSFREE_POLLING_DEACTIVATION_REQUEST, WAL_UIR_TRANSITION_IGNORE_FLAG, MAIN_STATUS, HANDSFREE_ACCESS_DISABLE_REQUEST'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['SDCM']

signals:
  SMART_DEVICE_COMM_DISABLE_REQUEST:
    bits: '1.7'
    comment:
      en: 'Request to disallow communications between the SDCM and any smart device (Bluetooth and NFC); NFC cards and hands-free features still work.'
      fr: 'Demande d''interdiction des communications entre le SDCM et tout smart device (Bluetooth et NFC) ; les cartes NFC et les fonctions mains-libres restent actives.'
      es: 'Solicitud para deshabilitar las comunicaciones entre el SDCM y cualquier smart device (Bluetooth y NFC); las tarjetas NFC y las funciones manos libres siguen activas.'
      de: 'Anforderung zur Deaktivierung der Kommunikation zwischen SDCM und jedem Smart Device (Bluetooth und NFC); NFC-Karten und Handsfree-Funktionen bleiben aktiv.'
      it: 'Richiesta di disabilitazione delle comunicazioni tra SDCM e qualsiasi smart device (Bluetooth e NFC); carte NFC e funzioni mani libere restano attive.'
      pl: 'Żądanie wyłączenia komunikacji między SDCM a dowolnym smart device (Bluetooth i NFC); karty NFC i funkcje hands-free nadal działają.'
      ru: 'Запрос на отключение связи между SDCM и любым смарт-устройством (Bluetooth и NFC); карты NFC и функции hands-free продолжают работать.'
      zh: '禁用SDCM与任何智能设备（蓝牙和NFC）通信的请求；NFC卡和免提功能仍然有效。'
      hu: 'Kérés az SDCM és bármely okoseszköz (Bluetooth és NFC) közötti kommunikáció letiltására; az NFC-kártyák és a kihangosított funkciók továbbra is működnek.'
      pt: 'Pedido para desativar as comunicações entre o SDCM e qualquer smart device (Bluetooth e NFC); os cartões NFC e as funções mãos-livres continuam ativos'
    type: 'bool'
    default: 0x01
    values:
      0x00:
        en: 'Inactive'
        fr: 'Inactive'
        es: 'Inactivo'
        de: 'Inaktiv'
        it: 'Inattivo'
        pl: 'Nieaktywny'
        ru: 'Неактивно'
        zh: '未激活'
        hu: 'Inaktív'
        pt: 'Inativo'
      0x01:
        en: 'Active'
        fr: 'Actif'
        es: 'Activo'
        de: 'Aktiv'
        it: 'Attivo'
        pl: 'Aktywny'
        ru: 'Активно'
        zh: '激活'
        hu: 'Aktív'
        pt: 'Ativo'

  SDCM_AUTHORIZATION_REQUEST:
    bits: '1.6'
    comment:
      en: 'Request to disallow all SDCM (smart device connectivity module) features.'
      fr: 'Demande d''interdiction de toutes les fonctions du module SDCM.'
      es: 'Solicitud para deshabilitar todas las funciones del módulo SDCM.'
      de: 'Anforderung zur Deaktivierung aller Funktionen des SDCM-Moduls.'
      it: 'Richiesta di disabilitazione di tutte le funzioni del modulo SDCM.'
      pl: 'Żądanie wyłączenia wszystkich funkcji modułu SDCM.'
      ru: 'Запрос на отключение всех функций модуля SDCM.'
      zh: '禁用SDCM模块所有功能的请求。'
      hu: 'Az SDCM modul összes funkciójának letiltási kérése.'
      pt: 'Pedido de proibição de todas as funções do módulo SDCM.'
    type: 'bool'
    default: 0x01
    values:
      0x00:
        en: 'Disallowed'
        fr: 'Non autorisé'
        es: 'No permitido'
        de: 'Nicht erlaubt'
        it: 'Non consentito'
        pl: 'Niedozwolone'
        ru: 'Не разрешено'
        zh: '不允许'
        hu: 'Nem engedélyezett'
        pt: 'Não permitido'
      0x01:
        en: 'Allowed'
