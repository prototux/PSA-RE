  UNBLACKLISTING_REQUEST:
    bits: '2.2'
    comment:
      en: 'Request to restore devices previously blacklisted inside the vehicle (used after an identified unlock request).'
      fr: 'Demande de réhabilitation des dispositifs blacklistés identifiés à l''intérieur du véhicule (utilisée après une demande de déverrouillage identifiée).'
      es: 'Solicitud de rehabilitación de los dispositivos en lista negra identificados dentro del vehículo (usada tras una solicitud de desbloqueo identificada).'
      de: 'Anforderung zur Wiederherstellung der zuvor im Fahrzeuginneren gesperrten Geräte (nach einer erkannten Entriegelungsanforderung).'
      it: 'Richiesta di riabilitazione dei dispositivi in blacklist identificati all''interno del veicolo (usata dopo una richiesta di sblocco identificata).'
