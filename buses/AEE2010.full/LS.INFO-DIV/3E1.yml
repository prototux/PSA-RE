id: 0x3E1
name: 'HYBRID_START_STOP_INFO'
type: 'can'
length: 7
comment:
  en: 'Hybrid stop&start information: elapsed stop time, zero-emission request, engine/electric-machine state and recharge status.'
  fr: 'Informations start&stop hybride : temps d''arrêt écoulé, demande zéro émission, état moteur/machine électrique et état de recharge.'
  es: 'Información de arranque y parada híbrido: tiempo de parada transcurrido, solicitud de cero emisiones, estado del motor/máquina eléctrica y estado de recarga.'
  de: 'Hybrid-Start&Stop-Informationen: verstrichene Stoppzeit, Nullemissionsanforderung, Motor-/E-Maschinenstatus und Ladezustand.'
  it: 'Informazioni start&stop ibrido: tempo di arresto trascorso, richiesta zero emissioni, stato motore/macchina elettrica e stato di ricarica.'
  pl: 'Informacje start&stop hybrydy: czas trwania zatrzymania, żądanie zerowej emisji, stan silnika/maszyny elektrycznej i stan ładowania.'
  ru: 'Информация о гибридной системе старт-стоп: истёкшее время остановки, запрос нулевых выбросов, состояние двигателя/электромашины и статус подзарядки.'
  zh: '混合动力启停信息:已停止时间、零排放请求、发动机/电机状态及充电状态。'
  hu: 'Hibrid start&stop információk: eltelt leállási idő, zéró kibocsátás igény, motor/elektromos gép állapota és töltési állapot.'
  pt: 'Informação de start&stop híbrido: tempo de paragem decorrido, pedido de zero emissões, estado do motor/máquina elétrica e estado de recarga.'
observations:
  en: 'On state change of: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE, ACCESSORY_INSTANT_POWER_CONSUMPTION, BATTERY_SOC_RED_ZONE'
  fr: 'Sur changement d''état de : COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE, ACCESSORY_INSTANT_POWER_CONSUMPTION, BATTERY_SOC_RED_ZONE'
  es: 'Al cambiar el estado de: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE, ACCESSORY_INSTANT_POWER_CONSUMPTION, BATTERY_SOC_RED_ZONE'
  de: 'Bei Statusänderung von: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE, ACCESSORY_INSTANT_POWER_CONSUMPTION, BATTERY_SOC_RED_ZONE'
  it: 'Al cambiamento di stato di: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE, ACCESSORY_INSTANT_POWER_CONSUMPTION, BATTERY_SOC_RED_ZONE'
  pl: 'Wysyłane przy zmianie stanu: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE, ACCESSORY_INSTANT_POWER_CONSUMPTION, BATTERY_SOC_RED_ZONE'
  ru: 'При изменении состояния: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE, ACCESSORY_INSTANT_POWER_CONSUMPTION, BATTERY_SOC_RED_ZONE'
  zh: '当ETAT_MTH, ELECTRIC_MOTOR_STATUS, RECHARGE, ACCESSORY_INSTANT_POWER_CONSUMPTION, SOC_BATT_ROUGE状态变化时'
  hu: 'A(z) COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE, ACCESSORY_INSTANT_POWER_CONSUMPTION, BATTERY_SOC_RED_ZONE állapotváltozásakor'
  pt: 'Na mudança de estado de: COMBUSTION_ENGINE_STATUS, ELECTRIC_MOTOR_STATUS, RECHARGE, ACCESSORY_INSTANT_POWER_CONSUMPTION, BATTERY_SOC_RED_ZONE'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['ICSV', 'MATT', 'EMF', 'BTEL', 'CMB', 'OVIP', 'RAD']

