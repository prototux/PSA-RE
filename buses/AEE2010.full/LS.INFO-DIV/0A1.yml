id: 0x0A1
name: 'AUTOMATED_PARKING_STATUS'
type: 'can'
length: 8
comment:
  en: 'Automated parking (ACPK) status: brake pedal, manoeuvre direction/side/state/type, menu, neutral-gear request, overshoot progress, speed-too-high warning and HMI display request.'
  fr: 'État du parking automatisé (ACPK) : pédale de frein, direction/côté/état/type de manœuvre, menu, demande de point mort, progression de dépassement, avertissement vitesse trop élevée et demande d''affichage IHM.'
  es: 'Estado del aparcamiento automatizado (ACPK): pedal de freno, dirección/lado/estado/tipo de maniobra, menú, solicitud de punto muerto, progreso de sobrepaso, aviso de velocidad excesiva y solicitud de visualización IHM.'
  de: 'Status des automatisierten Einparkens (ACPK): Bremspedal, Manöverrichtung/-seite/-status/-typ, Menü, Leerlaufanforderung, Überschreitungsfortschritt, Warnung vor zu hoher Geschwindigkeit und HMI-Anzeigeanforderung.'
  it: 'Stato del parcheggio automatizzato (ACPK): pedale del freno, direzione/lato/stato/tipo di manovra, menu, richiesta di folle, avanzamento del superamento, avviso di velocità eccessiva e richiesta di visualizzazione HMI.'
  pl: 'Stan zautomatyzowanego parkowania (ACPK): pedał hamulca, kierunek/strona/stan/typ manewru, menu, żądanie luzu, postęp przekroczenia, ostrzeżenie o zbyt dużej prędkości i żądanie wyświetlania HMI.'
  ru: 'Статус автоматизированной парковки (ACPK): педаль тормоза, направление/сторона/состояние/тип манёвра, меню, запрос нейтрали, прогресс превышения, предупреждение о слишком высокой скорости и запрос отображения HMI.'
  zh: '自动泊车(ACPK)状态:刹车踏板、操作方向/侧向/状态/类型、菜单、空挡请求、超程进度、车速过快警告和人机界面显示请求。'
  hu: 'Az automatizált parkolás (ACPK) állapota: fékpedál, manőver iránya/oldala/állapota/típusa, menü, üresjárat kérése, túllépés folyamata, túl nagy sebesség figyelmeztetés és HMI megjelenítési kérés.'
  pt: 'Estado do estacionamento automático (ACPK): pedal do travão, direção/lado/estado/tipo da manobra, menu, pedido de ponto morto, progresso de ultrapassagem, aviso de velocidade excessiva e pedido de apresentação na IHM.'
