id: 0x3E2
name: 'AMPLIFIER_STATUS'
type: 'can'
length: 2
comment:
  en: 'Amplifier status: dynamic audio mode.'
  fr: 'État de l''amplificateur : mode audio dynamique.'
  es: 'Estado del amplificador: modo de audio dinámico.'
  de: 'Verstärkerstatus: dynamischer Audiomodus.'
  it: 'Stato dell''amplificatore: modalità audio dinamica.'
  pl: 'Stan wzmacniacza: dynamiczny tryb audio.'
  ru: 'Статус усилителя: динамический аудиорежим.'
  zh: '放大器状态:动态音频模式。'
  hu: 'Erősítő állapota: dinamikus hangmód.'
  pt: 'Estado do amplificador: modo áudio dinâmico.'
periodicity: ['2000ms']
senders: ['AMPLI']
receivers: ['OVIP', 'BSI', 'RAD']

signals:
  AUDIO_DYNAMIC_MODE_STATUS:
    bits: '1.7-1.6'
    comment:
      en: 'Audio state for engine sound enhancement activation'
      fr: 'État audio pour l''activation de la sonorisation moteur'
      es: 'Estado de audio para la activación de la sonorización del motor'
      de: 'Audiostatus für die Aktivierung der Motorklang-Verstärkung'
      it: 'Stato audio per l''attivazione della sonorizzazione del motore'
      pl: 'Stan audio dla aktywacji podkreślenia dźwięku silnika'
      ru: 'Состояние аудио для активации усиления звука двигателя'
      zh: '发动机声浪增强激活的音频状态'
      hu: 'Az audio állapota a motorhang-kiemelés aktiválásához'
      pt: 'Estado de áudio para a ativação da sonorização do motor'
    type: 'enum'
    default: 0x03
    values:
      0x00:
        en: 'Normal mode'
        fr: 'Mode normal'
        es: 'Modo normal'
        de: 'Normalmodus'
        it: 'Modalità normale'
        pl: 'Tryb normalny'
        ru: 'Обычный режим'
        zh: '正常模式'
        hu: 'Normál üzemmód'
        pt: 'Modo normal'
      0x01:
        en: 'Dynamic mode'
        fr: 'Mode dynamique'
        es: 'Modo dinámico'
        de: 'Dynamischer Modus'
        it: 'Modalità dinamica'
        pl: 'Tryb dynamiczny'
        ru: 'Динамический режим'
        zh: '动态模式'
        hu: 'Dinamikus üzemmód'
        pt: 'Modo dinâmico'
      0x02:
        unused: true
      0x03:
        en: 'Invalid'
        fr: 'Invalide'
        es: 'Inválido'
        de: 'Ungültig'
        it: 'Non valido'
        pl: 'Nieprawidłowe'
        ru: 'Недействительно'
        zh: '无效'
        hu: 'Érvénytelen'
        pt: 'Inválido'

  UNUSED_1:
    bits: '1.5-2.0'
    unused: true

alternatives:
  - note:
      en: 'Also observed with a period of 200ms'
      fr: 'Aussi observée avec une période de 200ms'
      es: 'También observada con un periodo de 200ms'
      de: 'Auch mit einer Periode von 200ms beobachtet'
      it: 'Osservata anche con un periodo di 200ms'
      pl: 'Obserwowana także z okresem 200ms'
      ru: 'Также наблюдалась с периодом 200ms'
      zh: '也观察到周期为200ms'
      hu: 'Megfigyelve 200ms periódussal is'
      pt: 'Também observada com um período de 200ms'
    periodicity: ['200ms']
