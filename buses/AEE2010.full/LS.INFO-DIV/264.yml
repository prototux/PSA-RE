        unused: true
      0x06:
        unused: true
      0x07:
        unused: true
      0x08:
        unused: true
      0x09:
        unused: true
      0x0A:
        unused: true
      0x0B:
        unused: true
      0x0C:
        unused: true
      0x0D:
        unused: true
      0x0E:
        unused: true
      0x0F:
        en: 'Invalid'
        fr: 'Invalide'
        es: 'Inválido'
        de: 'Ungültig'
        it: 'Non valido'
        pl: 'Nieprawidłowe'
        ru: 'Недействительно'
        zh: '无效'
        hu: 'Érvénytelen'
        pt: 'Inválido'

  UNUSED_1:
