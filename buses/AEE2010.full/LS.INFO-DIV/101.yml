id: 0x101
name: 'SCR_VERSION'
type: 'can-tp'
comment:
  en: 'Data payload sent by the wireless charger module, carrying navigation export information.'
  fr: 'Charge utile de données émise par le module de charge sans fil, contenant des informations d''export de navigation.'
  es: 'Carga útil de datos enviada por el módulo de carga inalámbrica, con información de exportación de navegación.'
  de: 'Vom Modul für kabelloses Laden gesendete Nutzdaten mit Navigations-Exportinformationen.'
  it: 'Payload di dati inviato dal modulo di ricarica wireless, contenente informazioni di esportazione della navigazione.'
  pl: 'Ładunek danych wysyłany przez moduł ładowarki bezprzewodowej, zawierający informacje eksportu nawigacji.'
  ru: 'Полезные данные, отправляемые модулем беспроводной зарядки, содержащие информацию экспорта навигации.'
  zh: '由无线充电模块发送的数据负载，包含导航导出信息。'
  hu: 'A vezeték nélküli töltő modul által küldött adattartalom, navigációs exportinformációkkal.'
  pt: 'Carga útil de dados enviada pelo módulo de carregador sem fios, transportando informação de exportação de navegação.'
periodicity: ['trigger']
senders: ['WLC']
receivers: ['SDCM']
isotp:
  flow_control_id: 0x3C1

signals:
  PAYLOAD:
    bits: '1.7-n'
    comment:
      en: 'Application data (reassembled)'
      fr: 'Données applicatives (réassemblées)'
      es: 'Datos de aplicación (reensamblados)'
      de: 'Anwendungsdaten (wieder zusammengesetzt)'
      it: 'Dati applicativi (riassemblati)'
      pl: 'Dane aplikacyjne (ponownie złożone)'
      ru: 'Прикладные данные (пересобранные)'
      zh: '应用数据（重组后）'
      hu: 'Alkalmazásadatok (újraösszeállítva)'
      pt: 'Dados de aplicação (reagrupados)'
    type: 'bytes'

alternatives:
  - note:
      en: 'Other layout observed for this frame (other software or car version)'
      fr: 'Autre disposition observée pour cette trame (autre version de logiciel ou de véhicule)'
      es: 'Otra disposición observada para esta trama (otra versión de software o de vehículo)'
      de: 'Andere beobachtete Belegung dieser Botschaft (andere Software- oder Fahrzeugversion)'
      it: 'Altra disposizione osservata per questo frame (altra versione di software o di vettura)'
      pl: 'Inny zaobserwowany układ tej ramki (inna wersja oprogramowania lub samochodu)'
      ru: 'Другая наблюдаемая раскладка этого кадра (другая версия ПО или автомобиля)'
      zh: '此帧观察到的另一种布局（其他软件或车型版本）'
      hu: 'A keret másik megfigyelt elrendezése (más szoftver- vagy autóverzió)'
      pt: 'Outra disposição observada para esta trama (outra versão de software ou de veículo)'
    periodicity: ['trigger']
    senders: ['WLC']
    receivers: ['SDCM']
    signals:
      NFC_TAG_RESPONSE_RAW_DATA:
        bits: '1.7-18.0'
        comment:
          en: 'Raw data of the APDU response from the NFC tag to the smart device module (up to 18 bytes)'
          fr: 'Données brutes de la réponse APDU du tag NFC vers le module smart device (18 octets maximum)'
          es: 'Datos en bruto de la respuesta APDU de la etiqueta NFC al módulo smart device (máximo 18 bytes)'
          de: 'Rohdaten der APDU-Antwort vom NFC-Tag an das Smart-Device-Modul (max. 18 Byte)'
          it: 'Dati grezzi della risposta APDU dal tag NFC al modulo smart device (massimo 18 byte)'
          pl: 'Surowe dane odpowiedzi APDU ze znacznika NFC do modułu smart device (maksymalnie 18 bajtów)'
          ru: 'Необработанные данные ответа APDU от NFC-метки модулю смарт-устройства (максимум 18 байт)'
          zh: 'NFC标签发送给智能设备模块的APDU响应原始数据(最多18字节)'
          hu: 'Az NFC-címke APDU-válaszának nyers adata az okoseszköz-modul felé (legfeljebb 18 bájt)'
          pt: 'Dados em bruto da resposta APDU da etiqueta NFC ao módulo smart device (até 18 bytes)'
        type: 'uint'
        min: 0
        max: 255
