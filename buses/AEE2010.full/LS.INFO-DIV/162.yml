id: 0x162
name: 'CD_CHANGER_STATUS'
type: 'can'
length: 7
comment:
  en: 'CD changer status: access, disk read errors, MP3 support and per-disk availability (CD1-CD6).'
  fr: 'État du changeur CD : accès, erreurs de lecture disque, support MP3 et disponibilité par disque (CD1 à CD6).'
  es: 'Estado del cambiador de CD: acceso, errores de lectura de disco, compatibilidad MP3 y disponibilidad por disco (CD1 a CD6).'
  de: 'Status des CD-Wechslers: Zugriff, Lesefehler, MP3-Unterstützung und Verfügbarkeit je CD (CD1 bis CD6).'
  it: 'Stato del caricatore CD: accesso, errori di lettura disco, supporto MP3 e disponibilità per disco (CD1-CD6).'
  pl: 'Stan zmieniarki CD: dostęp, błędy odczytu płyty, obsługa MP3 i dostępność poszczególnych płyt (CD1-CD6).'
  ru: 'Статус CD-чейнджера: доступ, ошибки чтения диска, поддержка MP3 и доступность по дискам (CD1-CD6).'
  zh: 'CD换碟机状态:存取、读盘错误、MP3支持及各碟片(CD1-CD6)可用性。'
  hu: 'A CD-váltó állapota: hozzáférés, lemezolvasási hibák, MP3-támogatás és lemezenkénti elérhetőség (CD1-CD6).'
  pt: 'Estado do leitor de CD: acesso, erros de leitura de disco, suporte MP3 e disponibilidade por disco (CD1-CD6).'
observations:
  en: 'On state change of: CDC_TEXT_AVAILABLE, CDC_PLAYER_STATE, CDC_ACCESS_TYPE, CDC_CURRENT_DISC_NUMBER, CDC_EJECT_LOAD_BUTTON_PRESSED, CDC_FRONT_PUSH_BUTTON_NUMBER'
  fr: 'Sur changement d''état de : CDC_TEXT_AVAILABLE, CDC_PLAYER_STATE, CDC_ACCESS_TYPE, CDC_CURRENT_DISC_NUMBER, CDC_EJECT_LOAD_BUTTON_PRESSED, CDC_FRONT_PUSH_BUTTON_NUMBER'
  es: 'Al cambiar el estado de: CDC_TEXT_AVAILABLE, CDC_PLAYER_STATE, CDC_ACCESS_TYPE, CDC_CURRENT_DISC_NUMBER, CDC_EJECT_LOAD_BUTTON_PRESSED, CDC_FRONT_PUSH_BUTTON_NUMBER'
  de: 'Bei Statusänderung von: CDC_TEXT_AVAILABLE, CDC_PLAYER_STATE, CDC_ACCESS_TYPE, CDC_CURRENT_DISC_NUMBER, CDC_EJECT_LOAD_BUTTON_PRESSED, CDC_FRONT_PUSH_BUTTON_NUMBER'
  it: 'Al cambiamento di stato di: CDC_TEXT_AVAILABLE, CDC_PLAYER_STATE, CDC_ACCESS_TYPE, CDC_CURRENT_DISC_NUMBER, CDC_EJECT_LOAD_BUTTON_PRESSED, CDC_FRONT_PUSH_BUTTON_NUMBER'
  pl: 'Wysyłane przy zmianie stanu: CDC_TEXT_AVAILABLE, CDC_PLAYER_STATE, CDC_ACCESS_TYPE, CDC_CURRENT_DISC_NUMBER, CDC_EJECT_LOAD_BUTTON_PRESSED, CDC_FRONT_PUSH_BUTTON_NUMBER'
  ru: 'При изменении состояния: CDC_TEXT_AVAILABLE, CDC_PLAYER_STATE, CDC_ACCESS_TYPE, CDC_CURRENT_DISC_NUMBER, CDC_EJECT_LOAD_BUTTON_PRESSED, CDC_FRONT_PUSH_BUTTON_NUMBER'
  zh: '当LISTE_CDC_MP3_CDC, CDC_TEXT_AVAILABLE, CDC_PLAYER_STATE, CDC_ACCESS_TYPE, CDC_CURRENT_DISC_NUMBER, CDC_EJECT_LOAD_BUTTON_PRESSED, PSH_CDC状态变化时'
  hu: 'A(z), CDC_TEXT_AVAILABLE, CDC_PLAYER_STATE, CDC_ACCESS_TYPE, CDC_CURRENT_DISC_NUMBER, CDC_EJECT_LOAD_BUTTON_PRESSED, CDC_FRONT_PUSH_BUTTON_NUMBER állapotváltozásakor'
  pt: 'Na mudança de estado de: CDC_TEXT_AVAILABLE, CDC_PLAYER_STATE, CDC_ACCESS_TYPE, CDC_CURRENT_DISC_NUMBER, CDC_EJECT_LOAD_BUTTON_PRESSED, CDC_FRONT_PUSH_BUTTON_NUMBER'
periodicity: ['100ms', 'trigger']
senders: ['ICSV', 'CDC']
receivers: ['RAD', 'EMF', 'BTEL', 'OVIP', 'BSI']

