id: 0x3C5
name: 'DASHCAM_STATE'
type: 'can'
length: 3
comment:
  en: 'Dashcam operating state: recording in progress, list available, playback state and memory usage.'
  fr: 'État de fonctionnement du dashcam : enregistrement en cours, liste disponible, état de lecture et occupation mémoire.'
  es: 'Estado de funcionamiento del dashcam: grabación en curso, lista disponible, estado de reproducción y uso de memoria.'
  de: 'Betriebszustand der Dashcam: laufende Aufnahme, verfügbare Liste, Wiedergabestatus und Speichernutzung.'
  it: 'Stato operativo del dashcam: registrazione in corso, elenco disponibile, stato di riproduzione e utilizzo memoria.'
  pl: 'Stan pracy wideorejestratora: trwające nagrywanie, dostępna lista, stan odtwarzania i wykorzystanie pamięci.'
  ru: 'Рабочее состояние видеорегистратора: идёт запись, список доступен, состояние воспроизведения и использование памяти.'
  zh: '行车记录仪工作状态:录制中、列表可用、播放状态及内存占用。'
  hu: 'A fedélzeti kamera üzemi állapota: folyamatban lévő felvétel, elérhető lista, lejátszási állapot és memóriahasználat.'
  pt: 'Estado de funcionamento da câmara de bordo: gravação em curso, lista disponível, estado de reprodução e utilização da memória.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['1000ms', 'trigger']
senders: ['IDVR']
receivers: ['BTEL', 'OVIP']

