  fr: 'Accusé de réception d''un message multi-trames d''état téléphone envoyé à l''afficheur.'
  es: 'Acuse de recibo de un mensaje multitrama del estado del teléfono enviado a la pantalla.'
  de: 'Bestätigung einer mehrteiligen Telefonstatusnachricht an das Display.'
  it: 'Conferma di ricezione di un messaggio multi-trama sullo stato del telefono inviato al display.'
  pl: 'Potwierdzenie odbioru wieloramkowego komunikatu o stanie telefonu wysłanego do wyświetlacza.'
  ru: 'Подтверждение многокадрового сообщения о состоянии телефона, отправленного на дисплей.'
  zh: '发送到显示屏的电话状态多帧消息的确认应答。'
  hu: 'A kijelzőnek küldött, a telefon állapotát tartalmazó többkeretes üzenet nyugtázása.'
  pt: 'Confirmação de uma mensagem multi-trama de estado do telefone enviada ao visor.'
observations:
  en: 'Acknowledgement of a session message'
  fr: 'Accusé de réception d''un message de la session'
  es: 'Confirmación de un mensaje de la sesión'
  de: 'Quittierung einer-Sitzungsnachricht'
  it: 'Conferma di un messaggio della sessione'
  pl: 'Potwierdzenie wiadomości sesji'
  ru: 'Подтверждение сообщения сеанса'
