id: 0x369
name: 'TELEMATICS_HMI_AND_CONNECTIVITY_STATUS'
type: 'can'
length: 4
comment:
  en: 'Telematics unit status: HMI pop-up (id, priority, timeout), Wi-Fi security type, location service setting and roaming authorization/state.'
  fr: 'État du boîtier télématique : pop-up IHM (id, priorité, délai), type de sécurité Wi-Fi, réglage du service de localisation et autorisation/état de l''itinérance.'
  es: 'Estado de la unidad telemática: ventana emergente de la IHM (id, prioridad, tiempo de espera), tipo de seguridad Wi-Fi, ajuste del servicio de localización y autorización/estado de itinerancia.'
  de: 'Status der Telematikeinheit: HMI-Pop-up (ID, Priorität, Timeout), Wi-Fi-Sicherheitstyp, Einstellung des Ortungsdienstes und Roaming-Berechtigung/-Status.'
  it: 'Stato dell''unità telematica: pop-up HMI (id, priorità, timeout), tipo di sicurezza Wi-Fi, impostazione del servizio di localizzazione e autorizzazione/stato di roaming.'
  pl: 'Stan jednostki telematycznej: wyskakujące okno HMI (id, priorytet, limit czasu), typ zabezpieczeń Wi-Fi, ustawienie usługi lokalizacji oraz autoryzacja/stan roamingu.'
  ru: 'Статус телематического блока: всплывающее окно HMI (id, приоритет, тайм-аут), тип безопасности Wi-Fi, настройка службы геолокации и авторизация/статус роуминга.'
  zh: '车载通信单元状态:人机界面弹窗(编号、优先级、超时)、Wi-Fi安全类型、位置服务设置及漫游授权/状态。'
  hu: 'A telematikai egység állapota: HMI felugró ablak (azonosító, prioritás, időtúllépés), Wi-Fi biztonsági típus, helymeghatározási szolgáltatás beállítása és barangolási engedély/állapot.'
  pt: 'Estado da unidade telemática: pop-up da IHM (id, prioridade, tempo-limite), tipo de segurança Wi-Fi, definição do serviço de localização e autorização/estado de roaming.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['trigger']
senders: ['MDS']
receivers: ['BTEL', 'EMF', 'OVIP', 'BSI', 'RAD']

