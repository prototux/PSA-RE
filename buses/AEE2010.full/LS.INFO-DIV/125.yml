id: 0x125
name: 'RADIO'
type: 'can-tp'
comment:
  en: 'Family of frames sharing this ID: the content depends on SENT_DIRECTORY_TYPE'
  fr: 'Famille de trames partageant cet identifiant : le contenu dépend de SENT_DIRECTORY_TYPE'
  es: 'Familia de tramas que comparten este identificador: el contenido depende de SENT_DIRECTORY_TYPE'
  de: 'Familie von Botschaften mit dieser ID: der Inhalt hängt von SENT_DIRECTORY_TYPE ab'
  it: 'Famiglia di frame che condividono questo ID: il contenuto dipende da SENT_DIRECTORY_TYPE'
  pl: 'Rodzina ramek o tym samym identyfikatorze: zawartość zależy od SENT_DIRECTORY_TYPE'
  ru: 'Семейство кадров с этим идентификатором: содержимое зависит от SENT_DIRECTORY_TYPE'
  zh: '共用此ID的一组帧：内容取决于SENT_DIRECTORY_TYPE'
  hu: 'Ezt az azonosítót megosztó keretcsalád: a tartalom a(z) SENT_DIRECTORY_TYPE értékétől függ'
  pt: 'Família de tramas que partilham este identificador: o conteúdo depende de SENT_DIRECTORY_TYPE'
periodicity: ['trigger']
senders: ['RAD', 'ICSV']
receivers: ['EMF']
isotp:
  flow_control_id: 0x11F

signals:
  SENT_DIRECTORY_TYPE:
    bits: '1.7-1.4'
    comment:
      en: 'Type of directory sent (tuner list mode, directory mode, station recall, station memory)'
      fr: 'Type de répertoire envoyé (mode liste tuner, mode répertoire, rappel station, mémorisation station)'
      es: 'Tipo de directorio enviado (modo lista de sintonizador, modo directorio, recuperación de emisora, memorización de emisora)'
      de: 'Art des gesendeten Verzeichnisses (Tuner-Listenmodus, Verzeichnismodus, Senderabruf, Senderspeicherung)'
      it: 'Tipo di cartella inviata (modalità elenco sintonizzatore, modalità cartella, richiamo stazione, memorizzazione stazione)'
      pl: 'Rodzaj wysłanego katalogu (tryb listy tunera, tryb katalogu, przywołanie stacji, zapamiętanie stacji)'
      ru: 'Тип отправленного каталога (режим списка тюнера, режим каталога, вызов станции, сохранение станции)'
      zh: '发送的目录类型(调谐器列表模式、目录模式、电台调用、电台存储)'
      hu: 'A küldött könyvtár típusa (tuner listamód, könyvtármód, állomás-visszahívás, állomás-memorizálás)'
      pt: 'Tipo de diretório enviado (modo lista de sintonizador, modo diretório, rechamada de estação, memorização de estação)'
    type: 'enum'
    mux_selector: true
    values:
      0x00:
        en: 'None'
        fr: 'Aucun'
        es: 'Ninguno'
        de: 'Keine'
        it: 'Nessuno'
        pl: 'Brak'
        ru: 'Нет'
        zh: '无'
        hu: 'Nincs'
        pt: 'Nenhum'
      0x01:
        en: 'FM station list'
        fr: 'Liste des stations FM'
        es: 'Lista de emisoras FM'
        de: 'FM-Senderliste'
        it: 'Elenco delle stazioni FM'
        pl: 'Lista stacji FM'
        ru: 'Список станций FM'
        zh: 'FM电台列表'
        hu: 'FM állomáslista'
        pt: 'Lista de estações FM'
      0x03:
        en: 'DAB station list'
        fr: 'Liste des stations DAB'
        es: 'Lista de emisoras DAB'
        de: 'DAB-Senderliste'
        it: 'Elenco delle stazioni DAB'
        pl: 'Lista stacji DAB'
