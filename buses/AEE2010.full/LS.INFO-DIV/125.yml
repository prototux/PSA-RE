  MENU_CLOSE_REQUEST:
    bits: '1.1-1.0'
    comment:
      en: 'Menu closing request (close all, back, list closed, system closed)'
      fr: 'Demande de fermeture du menu (tout fermer, retour, fermeture liste, fermeture système)'
      es: 'Solicitud de cierre del menú (cerrar todo, atrás, cierre de lista, cierre del sistema)'
      de: 'Menü-Schließanforderung (alles schließen, zurück, Liste geschlossen, System geschlossen)'
