        de: 'Alles schließen (langer ESC-Druck)'
        it: 'Chiudi tutto (pressione lunga di ESC)'
        pl: 'Zamknij wszystko (długie naciśnięcie ESC)'
        ru: 'Закрыть всё (долгое нажатие ESC)'
        zh: '关闭全部(长按ESC)'
        hu: 'Minden bezárása (hosszú ESC-nyomás)'
        pt: 'Fechar tudo (pressão longa em ESC)'
      0x01:
