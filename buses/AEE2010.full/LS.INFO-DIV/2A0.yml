id: 0x2A0
name: 'CONFIG_REQUEST'
type: 'can'
length: 1
comment:
  en: 'Configuration request frame: programming, personalisation and profile activation requests'
  fr: 'Trame de requête de configuration : requêtes de programmation, personnalisation et activation de profil'
  es: 'Trama de solicitud de configuración: solicitudes de programación, personalización y activación de perfil'
  de: 'Konfigurationsanfrage-Frame: Anfragen zu Programmierung, Personalisierung und Profilaktivierung'
  it: 'Trama di richiesta di configurazione: richieste di programmazione, personalizzazione e attivazione profilo'
  pl: 'Ramka żądania konfiguracji: żądania programowania, personalizacji i aktywacji profilu'
  ru: 'Кадр запроса конфигурации: запросы программирования, персонализации и активации профиля'
  zh: '配置请求帧:编程、个性化及配置文件激活请求'
  hu: 'Konfigurációkérés keret: programozási, személyre szabási és profilaktiválási kérések'
  pt: 'Trama de pedido de configuração: pedidos de programação, personalização e ativação de perfil.'
observations:
  en: 'On state change of: CONFIGURABLE_KEY_PROGRAMMING_REQUEST, ACTIVE_PROFILE_SCREEN_ACCESS_REQUEST, CUSTOMIZATION_MENU_ACCESS_REQUEST, ALERT_LOG_ACCESS_REQUEST, FUNCTION_STATUS_ACCESS_REQUEST'
  fr: 'Sur changement d''état de : CONFIGURABLE_KEY_PROGRAMMING_REQUEST, ACTIVE_PROFILE_SCREEN_ACCESS_REQUEST, CUSTOMIZATION_MENU_ACCESS_REQUEST, ALERT_LOG_ACCESS_REQUEST, FUNCTION_STATUS_ACCESS_REQUEST'
  es: 'Al cambiar el estado de: CONFIGURABLE_KEY_PROGRAMMING_REQUEST, ACTIVE_PROFILE_SCREEN_ACCESS_REQUEST, CUSTOMIZATION_MENU_ACCESS_REQUEST, ALERT_LOG_ACCESS_REQUEST, FUNCTION_STATUS_ACCESS_REQUEST'
  de: 'Bei Statusänderung von: CONFIGURABLE_KEY_PROGRAMMING_REQUEST, ACTIVE_PROFILE_SCREEN_ACCESS_REQUEST, CUSTOMIZATION_MENU_ACCESS_REQUEST, ALERT_LOG_ACCESS_REQUEST, FUNCTION_STATUS_ACCESS_REQUEST'
  it: 'Al cambiamento di stato di: CONFIGURABLE_KEY_PROGRAMMING_REQUEST, ACTIVE_PROFILE_SCREEN_ACCESS_REQUEST, CUSTOMIZATION_MENU_ACCESS_REQUEST, ALERT_LOG_ACCESS_REQUEST, FUNCTION_STATUS_ACCESS_REQUEST'
  pl: 'Wysyłane przy zmianie stanu: CONFIGURABLE_KEY_PROGRAMMING_REQUEST, ACTIVE_PROFILE_SCREEN_ACCESS_REQUEST, CUSTOMIZATION_MENU_ACCESS_REQUEST, ALERT_LOG_ACCESS_REQUEST, FUNCTION_STATUS_ACCESS_REQUEST'
  ru: 'При изменении состояния: CONFIGURABLE_KEY_PROGRAMMING_REQUEST, ACTIVE_PROFILE_SCREEN_ACCESS_REQUEST, CUSTOMIZATION_MENU_ACCESS_REQUEST, ALERT_LOG_ACCESS_REQUEST, FUNCTION_STATUS_ACCESS_REQUEST'
  zh: '当DMD_PROG_TCFG, ACTIVE_PROFILE_SCREEN_ACCESS_REQUEST, CUSTOMIZATION_MENU_ACCESS_REQUEST, ALERT_LOG_ACCESS_REQUEST, DMD_EDF_TCFG状态变化时'
  hu: 'A(z) CONFIGURABLE_KEY_PROGRAMMING_REQUEST, ACTIVE_PROFILE_SCREEN_ACCESS_REQUEST, CUSTOMIZATION_MENU_ACCESS_REQUEST, ALERT_LOG_ACCESS_REQUEST, FUNCTION_STATUS_ACCESS_REQUEST állapotváltozásakor'
  pt: 'Na mudança de estado de: CONFIGURABLE_KEY_PROGRAMMING_REQUEST, ACTIVE_PROFILE_SCREEN_ACCESS_REQUEST, CUSTOMIZATION_MENU_ACCESS_REQUEST, ALERT_LOG_ACCESS_REQUEST, FUNCTION_STATUS_ACCESS_REQUEST'
periodicity: ['500ms', 'trigger']
senders: ['ICSV', 'BSI']
receivers: ['EMF', 'BTEL', 'MATT', 'OVIP', 'RAD']

signals:
  CONFIGURABLE_KEY_PROGRAMMING_REQUEST:
    bits: '1.7'
    comment:
      en: 'Request for configurable key programming.'
      fr: 'Demande de programmation de la touche configurable.'
      es: 'Solicitud de programación de la tecla configurable.'
      de: 'Anforderung zur Programmierung der konfigurierbaren Taste.'
      it: 'Richiesta di programmazione del tasto configurabile.'
      pl: 'Żądanie zaprogramowania konfigurowalnego przycisku.'
      ru: 'Запрос на программирование настраиваемой кнопки.'
      zh: '可配置按键编程请求。'
      hu: 'A konfigurálható gomb programozási kérése.'
      pt: 'Pedido de programação da tecla configurável.'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
        en: 'Requested'
        fr: 'Demandé'
        es: 'Solicitado'
        de: 'Angefordert'
        it: 'Richiesto'
        pl: 'Żądane'
        ru: 'Запрошено'
        zh: '已请求'
        hu: 'Kérve'
        pt: 'Pedido'

