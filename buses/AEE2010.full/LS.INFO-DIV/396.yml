        fr: 'Disponible'
        es: 'Disponible'
        de: 'Verfügbar'
        it: 'Disponibile'
        pl: 'Dostępne'
        ru: 'Доступно'
        zh: '可用'
        hu: 'Elérhető'
        pt: 'Disponível'
