      es: 'Autorización de telediagnóstico (TLDIAG)'
      de: 'Freigabe der Ferndiagnose (TLDIAG)'
      it: 'Autorizzazione alla telediagnosi (TLDIAG)'
      pl: 'Autoryzacja zdalnej diagnostyki (TLDIAG)'
      ru: 'Разрешение удалённой диагностики (TLDIAG)'
      zh: '远程诊断（TLDIAG）授权'
      hu: 'A távdiagnosztika (TLDIAG) engedélyezése'
      pt: 'Autorização de diagnóstico remoto (TLDIAG)'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'Not available'
        fr: 'Non disponible'
        es: 'No disponible'
        de: 'Nicht verfügbar'
        it: 'Non disponibile'
        pl: 'Niedostępne'
        ru: 'Недоступно'
        zh: '不可用'
        hu: 'Nem érhető el'
