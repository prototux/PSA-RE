id: 0x396
name: 'BSRF_COMMAND_11'
type: 'can'
length: 6
comment:
  en: 'Remote diagnostics authorisation and auxiliary battery state of charge / voltage, sent by the BSI.'
  fr: 'Autorisation de télédiagnostic et état de charge/tension de la batterie auxiliaire, envoyés par la BSI.'
  es: 'Autorización de telediagnóstico y estado de carga/tensión de la batería auxiliar, enviados por la BSI.'
  de: 'Freigabe der Ferndiagnose und Ladezustand/Spannung der Zusatzbatterie, gesendet von der BSI.'
  it: 'Autorizzazione alla telediagnosi e stato di carica/tensione della batteria ausiliaria, inviati dalla BSI.'
  pl: 'Zezwolenie na zdalną diagnostykę oraz stan naładowania/napięcie akumulatora pomocniczego, wysyłane przez BSI.'
  ru: 'Разрешение удалённой диагностики и состояние заряда/напряжение вспомогательной батареи, отправляемые BSI.'
  zh: '由BSI发送的远程诊断授权及辅助电池荷电状态/电压。'
  hu: 'A távdiagnosztika engedélyezése és a segédakkumulátor töltöttségi állapota/feszültsége, a BSI küldi.'
  pt: 'Autorização de diagnóstico remoto e estado de carga/tensão da bateria auxiliar, enviados pela BSI.'
periodicity: ['1000880ms']
senders: ['BSI']
receivers: ['MDS']

signals:
