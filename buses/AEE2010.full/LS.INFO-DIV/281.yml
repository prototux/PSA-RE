id: 0x281
name: 'UID_TABLE_ENCRYPTED_TO_SDCM_FLOW_CONTROL'
type: 'can-tp'
comment:
  en: 'ISO-TP flow control frame for the encrypted identifier table transfer to the SDCM'
  fr: 'Trame de contrôle de flux ISO-TP pour le transfert de la table d''identifiants chiffrée vers le SDCM'
  es: 'Trama de control de flujo ISO-TP para la transferencia de la tabla de identificadores cifrada hacia el SDCM'
  de: 'ISO-TP-Flusssteuerungs-Frame für die Übertragung der verschlüsselten Kennungstabelle an das SDCM'
  it: 'Trama di controllo di flusso ISO-TP per il trasferimento della tabella degli identificatori cifrata verso il SDCM'
  pl: 'Ramka sterowania przepływem ISO-TP dla transferu zaszyfrowanej tabeli identyfikatorów do SDCM'
  ru: 'Кадр управления потоком ISO-TP для передачи зашифрованной таблицы идентификаторов в SDCM'
  zh: '用于向SDCM传输加密识别码表的ISO-TP流控帧'
  hu: 'Az SDCM-nek küldött titkosított azonosítótábla átviteléhez tartozó ISO-TP folyamvezérlő keret'
  pt: 'Trama de controlo de fluxo ISO-TP para a transferência da tabela de identificadores encriptada ao SDCM.'
periodicity: ['trigger']
senders: ['SDCM']
receivers: ['BSI']
isotp:
  addressing: 'normal'

