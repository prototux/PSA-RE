id: 0x0A5
name: 'MULTIPLEXED_BUTTONS_STATUS'
type: 'can'
length: 1
comment:
  en: 'Multiplexed push-button status: parking aid and Stop & Start button inputs.'
  fr: 'État des boutons multiplexés : entrées des boutons aide au stationnement et Stop & Start.'
  es: 'Estado de los botones multiplexados: entradas de los botones de ayuda al aparcamiento y Stop & Start.'
  de: 'Status der multiplexten Tasten: Eingänge der Einparkhilfe- und Stopp-Start-Taste.'
  it: 'Stato dei pulsanti multiplexati: ingressi dei pulsanti assistenza parcheggio e Stop & Start.'
  pl: 'Stan multipleksowanych przycisków: wejścia przycisków czujników parkowania i Stop & Start.'
  ru: 'Статус мультиплексированных кнопок: входы кнопок парковочного ассистента и Stop & Start.'
  zh: '多路复用按钮状态:泊车辅助和启停系统按钮输入。'
  hu: 'A multiplexelt gombok állapota: a parkolássegítő és a Stop & Start gomb bemenetei.'
  pt: 'Estado do multiplexado de botões: entradas do botão de ajuda ao estacionamento e do Stop & Start.'
observations:
  en: 'On state change of: AAS_BUTTON_STATUS, STT_BUTTON_STATUS'
  fr: 'Sur changement d''état de : AAS_BUTTON_STATUS, STT_BUTTON_STATUS'
  es: 'Al cambiar el estado de: AAS_BUTTON_STATUS, STT_BUTTON_STATUS'
  de: 'Bei Statusänderung von: AAS_BUTTON_STATUS, STT_BUTTON_STATUS'
  it: 'Al cambiamento di stato di: AAS_BUTTON_STATUS, STT_BUTTON_STATUS'
  pl: 'Wysyłane przy zmianie stanu: AAS_BUTTON_STATUS, STT_BUTTON_STATUS'
  ru: 'При изменении состояния: AAS_BUTTON_STATUS, STT_BUTTON_STATUS'
  zh: '当ENT_PUSH_AAS, ENT_PUSH_STT状态变化时'
  hu: 'A(z) AAS_BUTTON_STATUS, STT_BUTTON_STATUS állapotváltozásakor'
  pt: 'Na mudança de estado de: AAS_BUTTON_STATUS, STT_BUTTON_STATUS'
periodicity: ['500ms', 'trigger']
senders: ['FMUX']
receivers: ['BSI']

signals:
  AAS_BUTTON_STATUS:
    bits: '1.7'
    comment:
      en: 'Parking sensor (AAS) push-button input'
      fr: 'Entrée de la touche d''aide au stationnement (AAS)'
      es: 'Entrada del botón de ayuda al aparcamiento (AAS)'
      de: 'Eingang der Einparkhilfe-Taste (AAS)'
      it: 'Ingresso del pulsante di assistenza al parcheggio (AAS)'
      pl: 'Wejście przycisku czujników parkowania (AAS)'
      ru: 'Вход кнопки парковочного ассистента (AAS)'
      zh: '泊车辅助(AAS)按钮输入'
      hu: 'A parkolássegítő (AAS) gombjának bemenete'
      pt: 'Entrada do botão de ajuda ao estacionamento (AAS)'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Not activated'
        fr: 'Non activé'
        es: 'No activado'
        de: 'Nicht aktiviert'
        it: 'Non attivato'
        pl: 'Nieaktywowany'
        ru: 'Не активировано'
        zh: '未激活'
        hu: 'Nincs aktiválva'
        pt: 'Não ativado'
      0x01:
        en: 'Activated'
        fr: 'Activée'
        es: 'Activado'
        de: 'Aktiviert'
        it: 'Attivato'
        pl: 'Aktywowany'
        ru: 'Активировано'
        zh: '已激活'
        hu: 'Aktiválva'
        pt: 'Ativado'

  STT_BUTTON_STATUS:
    bits: '1.6'
    comment:
      en: 'Stop & Start push-button input'
      fr: 'Entrée de la touche Stop & Start'
      es: 'Entrada del botón Stop & Start'
      de: 'Eingang der Start-Stopp-Taste'
      it: 'Ingresso del pulsante Stop & Start'
      pl: 'Wejście przycisku Stop & Start'
      ru: 'Вход кнопки Стоп-Старт'
      zh: '启停系统按钮输入'
      hu: 'A Stop & Start gomb bemenete'
      pt: 'Entrada do botão Stop & Start'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Not activated'
        fr: 'Non activé'
        es: 'No activado'
        de: 'Nicht aktiviert'
        it: 'Non attivato'
        pl: 'Nieaktywowany'
        ru: 'Не активировано'
        zh: '未激活'
        hu: 'Nincs aktiválva'
        pt: 'Não ativado'
      0x01:
        en: 'Activated'
        fr: 'Activée'
        es: 'Activado'
        de: 'Aktiviert'
        it: 'Attivato'
        pl: 'Aktywowany'
        ru: 'Активировано'
        zh: '已激活'
        hu: 'Aktiválva'
        pt: 'Ativado'

  UNUSED_1:
    bits: '1.5-1.0'
    unused: true
