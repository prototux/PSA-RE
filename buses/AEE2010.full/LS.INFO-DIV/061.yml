id: 0x061
name: 'PARKING_SLOT_DATA'
type: 'can'
length: 6
comment:
  en: 'Detected parking slot data: depth, length, orientation, position (x/y), side, type and video-overlay status.'
  fr: 'Données de l''emplacement de stationnement détecté : profondeur, longueur, orientation, position (x/y), côté, type et état de l''incrustation vidéo.'
  es: 'Datos de la plaza de aparcamiento detectada: profundidad, longitud, orientación, posición (x/y), lado, tipo y estado de la superposición de vídeo.'
  de: 'Daten des erkannten Parkplatzes: Tiefe, Länge, Ausrichtung, Position (x/y), Seite, Typ und Status der Video-Einblendung.'
  it: 'Dati del posto auto rilevato: profondità, lunghezza, orientamento, posizione (x/y), lato, tipo e stato della sovrapposizione video.'
  pl: 'Dane wykrytego miejsca parkingowego: głębokość, długość, orientacja, pozycja (x/y), strona, typ i stan nakładki wideo.'
  ru: 'Данные обнаруженного парковочного места: глубина, длина, ориентация, положение (x/y), сторона, тип и статус видеоналожения.'
  zh: '检测到的停车位数据:深度、长度、方向、位置(x/y)、侧向、类型和视频叠加状态。'
  hu: 'Az észlelt parkolóhely adatai: mélység, hossz, tájolás, pozíció (x/y), oldal, típus és videó-ráhelyezés állapota.'
  pt: 'Dados da vaga de estacionamento detetada: profundidade, comprimento, orientação, posição (x/y), lado, tipo e estado de sobreposição de vídeo.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['500ms', 'trigger']
senders: ['AAS']
receivers: ['AVP']

signals:
  PARK_SLOT_DEPTH:
    bits: '1.7-1.0'
    comment:
      en: 'Depth of the selected parking spot'
      fr: 'Profondeur de la place de stationnement retenue'
      es: 'Profundidad de la plaza de aparcamiento seleccionada'
      de: 'Tiefe der ausgewählten Parklücke'
      it: 'Profondità del posto di parcheggio selezionato'
      pl: 'Głębokość wybranego miejsca parkingowego'
      ru: 'Глубина выбранного парковочного места'
      zh: '所选车位的深度'
      hu: 'A kiválasztott parkolóhely mélysége'
      pt: 'Profundidade do lugar de estacionamento selecionado'
    type: 'uint'
    factor: 4
    min: 0
    max: 1020
    units: 'cm'
    default: 0x00

  PARK_SLOT_LENGTH:
    bits: '2.7-2.0'
    comment:
      en: 'Length of the selected parking spot'
