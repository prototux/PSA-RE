id: 0x301
name: 'SDCM_TRANSMITTER_DATA'
type: 'can'
length: 8
comment:
  en: 'Badge number and connection/inventory requests of the SDCM transmitter'
  fr: 'Numéro de badge et requêtes de connexion/inventaire de l''émetteur du SDCM'
  es: 'Número de tarjeta y solicitudes de conexión/inventario del transmisor del SDCM'
  de: 'Badge-Nummer sowie Verbindungs-/Inventaranfragen des SDCM-Senders'
  it: 'Numero badge e richieste di connessione/inventario del trasmettitore SDCM'
  pl: 'Numer breloka oraz żądania połączenia/inwentaryzacji nadajnika SDCM'
  ru: 'Номер метки и запросы подключения/инвентаризации передатчика SDCM'
  zh: 'SDCM发射器的钥匙卡编号及连接/清点请求'
  hu: 'Az SDCM adó jelvényszáma, valamint kapcsolódási/leltározási kérései'
  pt: 'Número do cartão e pedidos de ligação/inventário do transmissor do SDCM.'
periodicity: ['trigger']
senders: ['SDCM']
receivers: ['WLC']

signals:
  UNUSED_1:
    bits: '1.7-1.2'
    unused: true

  SDCM_NFC_CONNECT_REQUEST:
    bits: '1.1'
    comment:
      en: 'Connection request to a specific NFC device'
      fr: 'Demande de connexion à un dispositif NFC spécifique'
      es: 'Solicitud de conexión a un dispositivo NFC específico'
      de: 'Verbindungsanforderung zu einem bestimmten NFC-Gerät'
      it: 'Richiesta di connessione a un dispositivo NFC specifico'
      pl: 'Żądanie połączenia z konkretnym urządzeniem NFC'
      ru: 'Запрос подключения к конкретному NFC-устройству'
      zh: '与特定NFC设备的连接请求'
      hu: 'Kapcsolódási kérés egy adott NFC-eszközhöz'
      pt: 'Pedido de ligação a um dispositivo NFC específico'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No connection'
        fr: 'Pas de connexion'
        es: 'Sin conexión'
        de: 'Keine Verbindung'
        it: 'Nessuna connessione'
        pl: 'Brak połączenia'
        ru: 'Нет соединения'
        zh: '无连接'
        hu: 'Nincs kapcsolat'
        pt: 'Sem ligação'
      0x01:
        en: 'BADGE CONNECTION'
        fr: 'BADGE CONNECTION'
        es: 'BADGE CONNECTION'
        de: 'BADGE CONNECTION'
        it: 'BADGE CONNECTION'
        pl: 'BADGE CONNECTION'
        ru: 'BADGE CONNECTION'
        zh: 'BADGE CONNECTION'
        hu: 'BADGE CONNECTION'
        pt: 'LIGAÇÃO DO CARTÃO'

  SDCM_NFC_INVENTORY_REQUEST:
    bits: '1.0'
    comment:
      en: 'Request to collect devices during the NFC anti-collision phase (ISO 14443)'
      fr: 'Demande de collecte des dispositifs lors de la phase d''anticollision NFC (ISO 14443)'
      es: 'Solicitud de recopilación de dispositivos durante la fase antricolisión NFC (ISO 14443)'
      de: 'Anforderung zur Geräteerfassung während der NFC-Antikollisionsphase (ISO 14443)'
      it: 'Richiesta di raccolta dei dispositivi durante la fase anticollisione NFC (ISO 14443)'
      pl: 'Żądanie zebrania urządzeń podczas fazy antykolizyjnej NFC (ISO 14443)'
      ru: 'Запрос сбора устройств на этапе антиколлизии NFC (ISO 14443)'
      zh: 'NFC防碰撞阶段(ISO 14443)设备收集请求'
      hu: 'Eszközök begyűjtésének kérése az NFC ütközésmentesítési fázisban (ISO 14443)'
      pt: 'Pedido de recolha de dispositivos durante a fase anticolisão NFC (ISO 14443)'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No demand'
        fr: 'Aucune demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无需求'
        hu: 'Nincs igény'
        pt: 'Sem pedido'
      0x01:
        en: 'Demand'
        fr: 'Demande'
        es: 'Solicitud'
        de: 'Anforderung'
        it: 'Richiesta'
        pl: 'Żądanie'
        ru: 'Запрос'
        zh: '请求'
        hu: 'Igény'
        pt: 'Pedido'

  SDCM_BADGE_NUMBER:
    bits: '2.7-2.0'
    comment:
      en: 'Badge number detected during the NFC inventory phase'
      fr: 'Numéro de badge détecté lors de la phase d''inventaire NFC'
      es: 'Número de tarjeta detectado durante la fase de inventario NFC'
      de: 'Bei der NFC-Inventurphase erkannte Badge-Nummer'
      it: 'Numero di badge rilevato durante la fase di inventario NFC'
      pl: 'Numer karty wykryty podczas fazy inwentaryzacji NFC'
      ru: 'Номер бейджа, обнаруженный на этапе инвентаризации NFC'
      zh: 'NFC清点阶段检测到的卡片编号'
      hu: 'Az NFC leltározási fázisban észlelt kártyaszám'
      pt: 'Número do cartão detetado durante a fase de inventário NFC'
    type: 'uint'
    min: 0
    max: 255
    default: 0x00

  UNUSED_2:
    bits: '3.7-8.0'
    unused: true
