id: 0x2E9
name: 'GEARBOX_TORQUE_CALIBRATION'
type: 'can'
length: 4
comment:
  en: 'Telematics unit status: display appearance, head-up display height/brightness/fold command, personalization mode.'
  fr: 'État du boîtier télématique : apparence d''affichage, commande hauteur/luminosité/escamotage de l''affichage tête haute, mode personnalisation.'
  es: 'Estado de la unidad telemática: apariencia de la pantalla, mando de altura/brillo/repliegue de la pantalla head-up, modo de personalización.'
  de: 'Status der Telematikeinheit: Anzeigeerscheinungsbild, Höhen-/Helligkeits-/Einklappsteuerung des Head-up-Displays, Personalisierungsmodus.'
  it: 'Stato dell''unità telematica: aspetto del display, comando altezza/luminosità/ripiegamento dell''head-up display, modalità personalizzazione.'
  pl: 'Stan jednostki telematycznej: wygląd wyświetlacza, sterowanie wysokością/jasnością/chowaniem wyświetlacza przezierowego, tryb personalizacji.'
  ru: 'Статус телематического блока: внешний вид дисплея, управление высотой/яркостью/складыванием проекционного дисплея, режим персонализации.'
  zh: '车载通信单元状态:显示外观、平视显示器高度/亮度/收起指令、个性化模式。'
  hu: 'A telematikai egység állapota: kijelző megjelenése, head-up kijelző magasság/fényerő/behúzás vezérlése, személyre szabási mód.'
  pt: 'Estado da unidade telemática: aparência do visor, comando de altura/luminosidade/dobragem do head-up display, modo de personalização.'
observations:
  en: 'On state change of: DISPLAY_PERSONAL_MODE_1_CHOICE, DISPLAY_PERSONAL_MODE_2_CHOICE, DISPLAY_PERSONAL_MODE_ACTIVE, HUD_FOLD_UNFOLD_REQUEST, HUD_BRIGHTNESS_ADJUSTMENT_REQUEST, HUD_HEIGHT_ADJUSTMENT_REQUEST'
  fr: 'Sur changement d''état de : DISPLAY_PERSONAL_MODE_1_CHOICE, DISPLAY_PERSONAL_MODE_2_CHOICE, DISPLAY_PERSONAL_MODE_ACTIVE, HUD_FOLD_UNFOLD_REQUEST, HUD_BRIGHTNESS_ADJUSTMENT_REQUEST, HUD_HEIGHT_ADJUSTMENT_REQUEST'
  es: 'Al cambiar el estado de: DISPLAY_PERSONAL_MODE_1_CHOICE, DISPLAY_PERSONAL_MODE_2_CHOICE, DISPLAY_PERSONAL_MODE_ACTIVE, HUD_FOLD_UNFOLD_REQUEST, HUD_BRIGHTNESS_ADJUSTMENT_REQUEST, HUD_HEIGHT_ADJUSTMENT_REQUEST'
  de: 'Bei Statusänderung von: DISPLAY_PERSONAL_MODE_1_CHOICE, DISPLAY_PERSONAL_MODE_2_CHOICE, DISPLAY_PERSONAL_MODE_ACTIVE, HUD_FOLD_UNFOLD_REQUEST, HUD_BRIGHTNESS_ADJUSTMENT_REQUEST, HUD_HEIGHT_ADJUSTMENT_REQUEST'
  it: 'Al cambiamento di stato di: DISPLAY_PERSONAL_MODE_1_CHOICE, DISPLAY_PERSONAL_MODE_2_CHOICE, DISPLAY_PERSONAL_MODE_ACTIVE, HUD_FOLD_UNFOLD_REQUEST, HUD_BRIGHTNESS_ADJUSTMENT_REQUEST, HUD_HEIGHT_ADJUSTMENT_REQUEST'
  pl: 'Wysyłane przy zmianie stanu: DISPLAY_PERSONAL_MODE_1_CHOICE, DISPLAY_PERSONAL_MODE_2_CHOICE, DISPLAY_PERSONAL_MODE_ACTIVE, HUD_FOLD_UNFOLD_REQUEST, HUD_BRIGHTNESS_ADJUSTMENT_REQUEST, HUD_HEIGHT_ADJUSTMENT_REQUEST'
  ru: 'При изменении состояния: DISPLAY_PERSONAL_MODE_1_CHOICE, DISPLAY_PERSONAL_MODE_2_CHOICE, DISPLAY_PERSONAL_MODE_ACTIVE, HUD_FOLD_UNFOLD_REQUEST, HUD_BRIGHTNESS_ADJUSTMENT_REQUEST, HUD_HEIGHT_ADJUSTMENT_REQUEST'
  zh: '当FIELD_P1_SETUP, DISPLAY_PERSONAL_MODE_2_CHOICE, DISPLAY_PERSONAL_MODE_ACTIVE, HUD_FOLD_UNFOLD_REQUEST, HUD_BRIGHTNESS_ADJUSTMENT_REQUEST, CDE_HAUT_VTH状态变化时'
  hu: 'A(z) DISPLAY_PERSONAL_MODE_1_CHOICE, DISPLAY_PERSONAL_MODE_2_CHOICE, DISPLAY_PERSONAL_MODE_ACTIVE, HUD_FOLD_UNFOLD_REQUEST, HUD_BRIGHTNESS_ADJUSTMENT_REQUEST, HUD_HEIGHT_ADJUSTMENT_REQUEST állapotváltozásakor'
  pt: 'Na mudança de estado de: DISPLAY_PERSONAL_MODE_1_CHOICE, DISPLAY_PERSONAL_MODE_2_CHOICE, DISPLAY_PERSONAL_MODE_ACTIVE, HUD_FOLD_UNFOLD_REQUEST, HUD_BRIGHTNESS_ADJUSTMENT_REQUEST, HUD_HEIGHT_ADJUSTMENT_REQUEST'
periodicity: ['200ms', 'trigger']
senders: ['BTEL', 'OVIP']
receivers: ['ICSV', 'CMB']

