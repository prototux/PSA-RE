id: 0x385
name: 'DASHCAM_COMMAND'
type: 'can'
length: 6
comment:
  en: 'Dashcam playback and recording commands from the telematics/display unit: list navigation, play, accident recording requests.'
  fr: 'Commandes de lecture et d''enregistrement du dashcam issues du boîtier télématique/écran : navigation dans la liste, lecture, demandes d''enregistrement accident.'
  es: 'Órdenes de reproducción y grabación del dashcam desde la unidad telemática/pantalla: navegación por la lista, reproducción, solicitudes de grabación de accidente.'
  de: 'Wiedergabe- und Aufnahmebefehle für die Dashcam von der Telematikeinheit/Display: Listennavigation, Wiedergabe, Unfallaufnahmeanforderungen.'
  it: 'Comandi di riproduzione e registrazione del dashcam dall''unità telematica/display: navigazione nell''elenco, riproduzione, richieste di registrazione incidente.'
  pl: 'Polecenia odtwarzania i nagrywania wideorejestratora z jednostki telematycznej/wyświetlacza: nawigacja po liście, odtwarzanie, żądania nagrania wypadku.'
  ru: 'Команды воспроизведения и записи видеорегистратора от телематического блока/дисплея: навигация по списку, воспроизведение, запросы записи ДТП.'
  zh: '来自车载通信单元/显示屏的行车记录仪播放与录制命令:列表浏览、播放、事故录制请求。'
  hu: 'A telematikai egység/kijelző által küldött lejátszási és felvételi parancsok a fedélzeti kamerának: listanavigáció, lejátszás, balesetfelvétel-kérések.'
  pt: 'Comandos de reprodução e gravação da câmara de bordo provenientes da unidade telemática/ecrã: navegação na lista, reprodução, pedidos de gravação de acidente.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['1000ms', 'trigger']
senders: ['BTEL', 'OVIP']
receivers: ['IDVR']

