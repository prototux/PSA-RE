  pl: 'Nieprzejrzysty bufor danych wbudowanego interfejsu diagnostycznego (ODI) między modułem telematycznym a narzędziem diagnostycznym: dane dynamiczne.'
  ru: 'Непрозрачный буфер данных встроенного диагностического интерфейса (ODI) между телематическим блоком и диагностическим инструментом: динамические данные.'
  zh: '远程信息处理单元与诊断工具之间嵌入式诊断接口(ODI)的不透明数据缓冲区:动态数据。'
  hu: 'A telematikai egység és a diagnosztikai eszköz közötti beágyazott diagnosztikai interfész (ODI) átláthatatlan adatpufferje: dinamikus adatok.'
