      it: 'Posizione del selettore cruise control/adaptive cruise control'
      pl: 'Pozycja przełącznika cruise control/adaptive cruise control'
      ru: 'Положение переключателя cruise control/adaptive cruise control'
      zh: 'cruise control/RVVi选择开关位置'
      hu: 'Az cruise control/adaptive cruise control választókapcsoló állása'
      pt: 'Posição do seletor cruise control/adaptive cruise control'
