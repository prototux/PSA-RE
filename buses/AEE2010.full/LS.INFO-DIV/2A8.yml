id: 0x2A8
name: 'ENGINE_HYBRID_DYNAMIC_DATA_9'
type: 'can'
length: 1
comment:
  en: 'Additional cruise control display status: automatic activation prompt, overspeed warning and toggle switch position.'
  fr: 'État d''affichage complémentaire du régulateur de vitesse : incitation à l''activation automatique, alerte de dépassement de vitesse et position du basculeur.'
  es: 'Estado de visualización adicional del regulador de velocidad: incitación a la activación automática, alerta de exceso de velocidad y posición del selector.'
  de: 'Zusätzlicher Anzeigestatus des Tempomaten: Aufforderung zur automatischen Aktivierung, Geschwindigkeitsüberschreitungswarnung und Wippschalterstellung.'
  it: 'Stato di visualizzazione aggiuntivo del regolatore di velocità: invito all''attivazione automatica, avviso di superamento velocità e posizione del bilanciere.'
  pl: 'Dodatkowy stan wyświetlania tempomatu: zachęta do automatycznej aktywacji, ostrzeżenie o przekroczeniu prędkości i pozycja przełącznika.'
  ru: 'Дополнительное состояние отображения круиз-контроля: предложение автоматической активации, предупреждение о превышении скорости и положение переключателя.'
  zh: '巡航控制的附加显示状态：自动激活提示、超速警告和拨杆位置。'
  hu: 'A sebességtartó kiegészítő kijelzési állapota: automatikus aktiválásra felszólítás, sebességtúllépés-figyelmeztetés és a billenőkapcsoló helyzete.'
  pt: 'Estado adicional de visualização do regulador de velocidade: aviso de ativação automática, aviso de excesso de velocidade e posição do interruptor basculante.'
observations:
  en: 'On state change of: CRUISE_CONTROL_TYPE_SWITCH_POSITION, ADVCNP_OVERSPEED_ALERT'
  fr: 'Sur changement d''état de : CRUISE_CONTROL_TYPE_SWITCH_POSITION, ADVCNP_OVERSPEED_ALERT'
  es: 'Al cambiar el estado de: CRUISE_CONTROL_TYPE_SWITCH_POSITION, ADVCNP_OVERSPEED_ALERT'
  de: 'Bei Statusänderung von: CRUISE_CONTROL_TYPE_SWITCH_POSITION, ADVCNP_OVERSPEED_ALERT'
  it: 'Al cambiamento di stato di: CRUISE_CONTROL_TYPE_SWITCH_POSITION, ADVCNP_OVERSPEED_ALERT'
  pl: 'Wysyłane przy zmianie stanu: CRUISE_CONTROL_TYPE_SWITCH_POSITION, ADVCNP_OVERSPEED_ALERT'
  ru: 'При изменении состояния: CRUISE_CONTROL_TYPE_SWITCH_POSITION, ADVCNP_OVERSPEED_ALERT'
  zh: '当POSITION_BASCULE, ALERTE_DEP_VIT_ADVCNP状态变化时'
  hu: 'A(z) CRUISE_CONTROL_TYPE_SWITCH_POSITION, ADVCNP_OVERSPEED_ALERT állapotváltozásakor'
  pt: 'Na mudança de estado de: CRUISE_CONTROL_TYPE_SWITCH_POSITION, ADVCNP_OVERSPEED_ALERT'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['OVIP', 'BTEL', 'CMB', 'MATT', 'RAD']

