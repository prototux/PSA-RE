  pl: 'Nieprzejrzysty bufor danych wbudowanego interfejsu diagnostycznego (ODI) między modułem telematycznym a narzędziem diagnostycznym: wskazanie.'
  ru: 'Непрозрачный буфер данных встроенного диагностического интерфейса (ODI) между телематическим блоком и диагностическим инструментом: индикация.'
  zh: '远程信息处理单元与诊断工具之间嵌入式诊断接口(ODI)的不透明数据缓冲区:指示。'
  hu: 'A telematikai egység és a diagnosztikai eszköz közötti beágyazott diagnosztikai interfész (ODI) átláthatatlan adatpufferje: jelzés.'
  pt: 'Buffer de dados opaco da interface de diagnóstico embutida (ODI) entre a unidade telemática e a ferramenta de diagnóstico: indicação.'
