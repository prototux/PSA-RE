  fr: 'Tampon de données opaque de l''interface de diagnostic embarquée (ODI) entre le boîtier télématique et l''outil de diagnostic : indication.'
  es: 'Buffer de datos opaco de la interfaz de diagnóstico embebida (ODI) entre la unidad telemática y la herramienta de diagnóstico: indicación.'
  de: 'Undurchsichtiger Datenpuffer der eingebetteten Diagnoseschnittstelle (ODI) zwischen Telematikeinheit und Diagnosetool: Meldung.'
