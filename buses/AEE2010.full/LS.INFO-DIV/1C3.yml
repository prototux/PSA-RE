      de: 'Open-Display-Interface(ODI)-Anzeigepuffer'
      it: 'Buffer di indicazione Open Display Interface (ODI)'
      pl: 'Bufor wskazań Open Display Interface (ODI)'
      ru: 'Буфер индикации Open Display Interface (ODI)'
      zh: 'Open Display Interface(ODI)指示缓冲区'
