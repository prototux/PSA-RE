id: 0x3A1
name: 'NAV_GUIDANCE_COMPASS_DISPLAY'
type: 'can'
length: 7
comment:
  en: 'Turn-by-turn compass rose display data for the navigation guidance arrow: distance, pictogram and angle segments.'
  fr: 'Données d''affichage de la rosace de guidage navigation : distance, pictogramme et segments d''angle.'
  es: 'Datos de visualización de la rosa de navegación: distancia, pictograma y segmentos de ángulo.'
  de: 'Anzeigedaten der Navigations-Richtungsrose: Entfernung, Piktogramm und Winkelsegmente.'
  it: 'Dati di visualizzazione della rosa di navigazione: distanza, pittogramma e segmenti angolari.'
  pl: 'Dane wyświetlania róży kierunkowej nawigacji: odległość, piktogram i segmenty kątowe.'
  ru: 'Данные отображения навигационной розы направлений: расстояние, пиктограмма и угловые сегменты.'
  zh: '导航引导箭头罗盘玫瑰显示数据:距离、图标和角度分段。'
  hu: 'A navigációs iránytű-rózsa megjelenítési adatai: távolság, piktogram és szögszegmensek.'
  pt: 'Dados de apresentação da rosa dos ventos passo a passo para a seta de guiagem da navegação: distância, pictograma e segmentos de ângulo.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['1000ms', 'trigger']
senders: ['ICSV', 'BTEL', 'OVIP']
receivers: ['CMB', 'VTH']

signals:
  UNUSED_1:
    bits: '1.7-1.6'
    unused: true

  SETPOINT_END:
