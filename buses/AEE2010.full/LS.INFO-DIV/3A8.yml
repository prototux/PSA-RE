id: 0x3A8
name: 'ENGINE_ECU_DATA_2'
type: 'can'
length: 8
comment:
  en: 'Elapsed and stopped time, and zero-emission time percentage, for the current trip.'
  fr: 'Temps écoulé et à l''arrêt, et pourcentage de temps en zéro émission, pour le trajet en cours.'
  es: 'Tiempo transcurrido y detenido, y porcentaje de tiempo en cero emisiones, para el trayecto actual.'
  de: 'Verstrichene und Stillstandszeit sowie Prozentsatz der emissionsfreien Zeit für die aktuelle Fahrt.'
  it: 'Tempo trascorso e di sosta, e percentuale di tempo a zero emissioni, per il tragitto in corso.'
  pl: 'Czas trwania i postoju oraz procent czasu w trybie zeroemisyjnym dla bieżącej podróży.'
  ru: 'Прошедшее время и время остановки, а также процент времени в режиме нулевых выбросов для текущей поездки.'
  zh: '当前行程的已用时间、停止时间及零排放时间百分比。'
  hu: 'Az eltelt és megállási idő, valamint a zéró kibocsátású idő százaléka a jelenlegi útra.'
  pt: 'Tempo decorrido e parado, e percentagem de tempo em zero emissões, para o trajeto atual.'
periodicity: ['1000130ms']
senders: ['BSI']
receivers: ['OVIP', 'RAD']

signals:
  TRIP_DURATION_HOURS_CURRENT:
    bits: '1.7-1.2'
    comment:
      en: 'Hours component of the current trip duration'
      fr: 'Composante heures de la durée du trajet en cours'
      es: 'Componente de horas de la duración del trayecto actual'
      de: 'Stundenanteil der Dauer der aktuellen Fahrt'
      it: 'Componente ore della durata del percorso in corso'
      pl: 'Składnik godzin czasu trwania bieżącej trasy'
      ru: 'Часовая составляющая продолжительности текущей поездки'
      zh: '当前行程时长的小时部分'
      hu: 'A jelenlegi út időtartamának óra összetevője'
      pt: 'Componente de horas da duração do trajeto atual'
    type: 'uint'
    factor: 1
    min: 0
    max: 62
    units: 'h'
    invalid: 0x3F
    default: 0x00

  UNUSED_1:
    bits: '1.1-1.0'
    unused: true

  TRIP_DURATION_MINUTES_CURRENT:
    bits: '2.7-2.2'
    comment:
      en: 'Minutes component of the current trip duration'
      fr: 'Composante minutes de la durée du trajet en cours'
      es: 'Componente de minutos de la duración del trayecto actual'
      de: 'Minutenanteil der Dauer der aktuellen Fahrt'
      it: 'Componente minuti della durata del percorso in corso'
      pl: 'Składnik minut czasu trwania bieżącej trasy'
      ru: 'Минутная составляющая продолжительности текущей поездки'
      zh: '当前行程时长的分钟部分'
      hu: 'A jelenlegi út időtartamának perc összetevője'
      pt: 'Componente de minutos da duração do trajeto atual'
    type: 'uint'
    factor: 1
    min: 0
    max: 59
    units: 'min'
    invalid: 0x3F
    default: 0x00

  UNUSED_2:
    bits: '2.1-2.0'
    unused: true

  TRIP_DURATION_SECONDS_CURRENT:
    bits: '3.7-3.2'
    comment:
      en: 'Seconds component of the current trip duration'
      fr: 'Composante secondes de la durée du trajet en cours'
      es: 'Componente de segundos de la duración del trayecto actual'
      de: 'Sekundenanteil der Dauer der aktuellen Fahrt'
      it: 'Componente secondi della durata del percorso in corso'
      pl: 'Składnik sekund czasu trwania bieżącej trasy'
      ru: 'Секундная составляющая продолжительности текущей поездки'
      zh: '当前行程时长的秒部分'
      hu: 'A jelenlegi út időtartamának másodperc összetevője'
      pt: 'Componente de segundos da duração do trajeto atual'
    type: 'uint'
    factor: 1
    min: 0
    max: 59
    units: 's'
    invalid: 0x3F
    default: 0x00

  UNUSED_3:
    bits: '3.1-3.0'
    unused: true

  ZEV_DURATION_HOURS_CURRENT_TRIP:
    bits: '4.7-5.5'
    comment:
      en: 'Hours component of the ZEV (engine-off) duration for the current trip'
      fr: 'Composante heures de la durée en mode ZEV (moteur thermique éteint) du trajet en cours'
      es: 'Componente de horas de la duración en modo ZEV (motor térmico apagado) del trayecto actual'
      de: 'Stundenanteil der ZEV-Dauer (Verbrennungsmotor aus) der aktuellen Fahrt'
      it: 'Componente ore della durata in modalità ZEV (motore termico spento) del percorso in corso'
      pl: 'Składnik godzin czasu w trybie ZEV (silnik spalinowy wyłączony) bieżącej trasy'
      ru: 'Часовая составляющая длительности режима ZEV (двигатель выключен) текущей поездки'
      zh: '当前行程ZEV模式(发动机关闭)时长的小时部分'
      hu: 'A jelenlegi út ZEV (hőmotor kikapcsolva) időtartamának óra összetevője'
      pt: 'Componente de horas da duração em modo ZEV (motor térmico desligado) do trajeto atual'
    type: 'uint'
    factor: 1
    min: 0
    max: 2000
    units: 'h'
    invalid: 0x7FF
    default: 0x00

  ZEV_DURATION_MINUTES_CURRENT_TRIP:
    bits: '5.4-6.7'
    comment:
      en: 'Minutes component of the ZEV (engine-off) duration for the current trip'
      fr: 'Composante minutes de la durée en mode ZEV (moteur thermique éteint) du trajet en cours'
      es: 'Componente de minutos de la duración en modo ZEV (motor térmico apagado) del trayecto actual'
      de: 'Minutenanteil der ZEV-Dauer (Verbrennungsmotor aus) der aktuellen Fahrt'
      it: 'Componente minuti della durata in modalità ZEV (motore termico spento) del percorso in corso'
      pl: 'Składnik minut czasu w trybie ZEV (silnik spalinowy wyłączony) bieżącej trasy'
      ru: 'Минутная составляющая длительности режима ZEV (двигатель выключен) текущей поездки'
      zh: '当前行程ZEV模式(发动机关闭)时长的分钟部分'
      hu: 'A jelenlegi út ZEV (hőmotor kikapcsolva) időtartamának perc összetevője'
      pt: 'Componente de minutos da duração em modo ZEV (motor térmico desligado) do trajeto atual'
    type: 'uint'
    factor: 1
    min: 0
    max: 59
    units: 'min'
    invalid: 0x3F
    default: 0x00

  ZEV_DURATION_SECONDS_CURRENT_TRIP:
    bits: '6.6-6.1'
    comment:
      en: 'Seconds component of the ZEV (engine-off) duration for the current trip'
      fr: 'Composante secondes de la durée en mode ZEV (moteur thermique éteint) du trajet en cours'
      es: 'Componente de segundos de la duración en modo ZEV (motor térmico apagado) del trayecto actual'
      de: 'Sekundenanteil der ZEV-Dauer (Verbrennungsmotor aus) der aktuellen Fahrt'
      it: 'Componente secondi della durata in modalità ZEV (motore termico spento) del percorso in corso'
      pl: 'Składnik sekund czasu w trybie ZEV (silnik spalinowy wyłączony) bieżącej trasy'
      ru: 'Секундная составляющая длительности режима ZEV (двигатель выключен) текущей поездки'
      zh: '当前行程ZEV模式(发动机关闭)时长的秒部分'
      hu: 'A jelenlegi út ZEV (hőmotor kikapcsolva) időtartamának másodperc összetevője'
      pt: 'Componente de segundos da duração em modo ZEV (motor térmico desligado) do trajeto atual'
    type: 'uint'
    factor: 1
    min: 0
    max: 59
    units: 's'
    invalid: 0x3F
    default: 0x00

  UNUSED_4:
    bits: '6.0'
    unused: true

  ZEV_DURATION_PERCENT_CURRENT_TRIP:
    bits: '7.7-7.1'
    comment:
      en: 'Percentage of time spent in ZEV mode relative to total time of the current trip'
      fr: 'Pourcentage du temps passé en mode ZEV par rapport au temps total du trajet en cours'
      es: 'Porcentaje del tiempo en modo ZEV respecto al tiempo total del trayecto actual'
      de: 'Prozentsatz der im ZEV-Modus verbrachten Zeit bezogen auf die Gesamtzeit der aktuellen Fahrt'
      it: 'Percentuale del tempo trascorso in modalità ZEV rispetto al tempo totale del percorso in corso'
      pl: 'Procent czasu spędzonego w trybie ZEV w stosunku do całkowitego czasu bieżącej trasy'
      ru: 'Процент времени в режиме ZEV относительно общего времени текущей поездки'
      zh: 'ZEV模式时间占当前行程总时间的百分比'
      hu: 'A ZEV módban töltött idő százaléka a jelenlegi út teljes idejéhez viszonyítva'
      pt: 'Percentagem do tempo passado em modo ZEV em relação ao tempo total do trajeto atual'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0x7F
    default: 0x00

  UNUSED_5:
    bits: '7.0'
    unused: true

  ZEV_DURATION_PERCENT_CURRENT_TRIP_ADJUSTED:
    bits: '8.7-8.1'
    comment:
      en: 'Adjusted percentage of time spent in ZEV mode for the current trip'
      fr: 'Pourcentage corrigé du temps passé en mode ZEV pour le trajet en cours'
      es: 'Porcentaje corregido del tiempo en modo ZEV para el trayecto actual'
      de: 'Angepasster Prozentsatz der im ZEV-Modus verbrachten Zeit der aktuellen Fahrt'
      it: 'Percentuale corretta del tempo trascorso in modalità ZEV per il percorso in corso'
      pl: 'Skorygowany procent czasu w trybie ZEV dla bieżącej trasy'
      ru: 'Скорректированный процент времени в режиме ZEV для текущей поездки'
      zh: '当前行程ZEV模式时间的修正百分比'
      hu: 'A jelenlegi út ZEV módban töltött idejének korrigált százaléka'
      pt: 'Percentagem corrigida do tempo passado em modo ZEV para o trajeto atual'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0x7F
    default: 0x00

  UNUSED_6:
    bits: '8.0'
    unused: true

