        unused: true
      CD_LIST_SIZE:
        bits: '2.7-2.0'
        comment:
          en: 'Size of the list (total number of programs in the list).'
          fr: 'Taille de la liste (nombre total de programmes dans la liste).'
          es: 'Tamaño de la lista (número total de programas en la lista).'
          de: 'Größe der Liste (Gesamtzahl der Programme in der Liste).'
          it: 'Dimensione dell''elenco (numero totale di programmi nell''elenco).'
          pl: 'Rozmiar listy (całkowita liczba programów na liście).'
          ru: 'Размер списка (общее количество программ в списке).'
          zh: '列表大小（列表中的节目总数）。'
          hu: 'A lista mérete (a listában lévő programok teljes száma).'
          pt: 'Tamanho da lista (número total de programas na lista)'
        type: 'uint'
        min: 0
        max: 254
      CD_LIST_BLOCK_POSITION:
        bits: '3.7-3.0'
        comment:
