id: 0x2A2
name: 'CD_CHANGER_REPLY_PAYLOAD'
type: 'can-tp'
comment:
  en: 'CD changer multi-frame reply payload (track list, MP3 info or ID3 tag, depending on the request).'
  fr: 'Charge utile de la réponse multi-trame du changeur CD (liste de pistes, infos MP3 ou tag ID3 selon la demande).'
  es: 'Carga útil de la respuesta multitrama del cambiador de CD (lista de pistas, info MP3 o etiqueta ID3, según la solicitud).'
  de: 'Nutzdaten der Mehrfachrahmen-Antwort des CD-Wechslers (Titelliste, MP3-Info oder ID3-Tag, je nach Anforderung).'
  it: 'Payload della risposta multi-trama del caricatore CD (elenco tracce, info MP3 o tag ID3, a seconda della richiesta).'
  pl: 'Dane odpowiedzi wieloramkowej zmieniarki CD (lista utworów, informacje MP3 lub tag ID3, zależnie od żądania).'
  ru: 'Полезная нагрузка многокадрового ответа CD-чейнджера (список треков, информация MP3 или тег ID3, в зависимости от запроса).'
  zh: 'CD换碟机多帧应答有效载荷(根据请求提供曲目列表、MP3信息或ID3标签)。'
  hu: 'A CD-váltó többkeretes válaszának hasznos adattartalma (számlista, MP3-infó vagy ID3-tag, a kéréstől függően).'
  pt: 'Payload de resposta multi-trama do leitor de CD (lista de faixas, informação MP3 ou etiqueta ID3, consoante o pedido).'
periodicity: ['trigger']
senders: ['ICSV', 'CDC']
receivers: ['BTEL', 'OVIP', 'EMF', 'RAD']
isotp:
  flow_control_id: 0x271

signals:
  PAYLOAD:
    bits: '1.7-n'
    comment:
      en: 'Application data (reassembled)'
      fr: 'Données applicatives (réassemblées)'
      es: 'Datos de aplicación (reensamblados)'
      de: 'Anwendungsdaten (wieder zusammengesetzt)'
      it: 'Dati applicativi (riassemblati)'
      pl: 'Dane aplikacyjne (ponownie złożone)'
      ru: 'Прикладные данные (пересобранные)'
      zh: '应用数据（重组后）'
      hu: 'Alkalmazásadatok (újraösszeállítva)'
      pt: 'Dados de aplicação (reagrupados)'
    type: 'bytes'

alternatives:
  - note:
      en: 'Other layout observed for this frame (other software or car version)'
      fr: 'Autre disposition observée pour cette trame (autre version de logiciel ou de véhicule)'
      es: 'Otra disposición observada para esta trama (otra versión de software o de vehículo)'
      de: 'Andere beobachtete Belegung dieser Botschaft (andere Software- oder Fahrzeugversion)'
      it: 'Altra disposizione osservata per questo frame (altra versione di software o di vettura)'
      pl: 'Inny zaobserwowany układ tej ramki (inna wersja oprogramowania lub samochodu)'
      ru: 'Другая наблюдаемая раскладка этого кадра (другая версия ПО или автомобиля)'
      zh: '此帧观察到的另一种布局（其他软件或车型版本）'
      hu: 'A keret másik megfigyelt elrendezése (más szoftver- vagy autóverzió)'
      pt: 'Outra disposição observada para esta trama (outra versão de software ou de veículo)'
    periodicity: ['trigger']
    senders: ['ICSV', 'CDC']
    receivers: ['BTEL', 'OVIP', 'EMF', 'RAD']
    signals:
      CD_SENT_DIRECTORY_TYPE:
        bits: '1.7-1.4'
        comment:
          en: 'Type of directory sent.'
          fr: 'Type de répertoire envoyé.'
          es: 'Tipo de directorio enviado.'
          de: 'Typ des gesendeten Verzeichnisses.'
          it: 'Tipo di directory inviata.'
          pl: 'Typ wysłanego katalogu.'
          ru: 'Тип отправленного каталога.'
          zh: '发送的目录类型。'
          hu: 'A küldött könyvtár típusa.'
