            es: 'Modo de lista de CD'
            de: 'CD-Listenmodus'
            it: 'Modalità elenco CD'
            pl: 'Tryb listy CD'
            ru: 'Режим списка CD'
            zh: 'CD列表模式'
            hu: 'CD lista mód'
            pt: 'Modo de lista de CD'
          0x02:
            en: 'MP3 list mode'
            fr: 'Mode liste MP3'
            es: 'Modo de lista MP3'
            de: 'MP3-Listenmodus'
