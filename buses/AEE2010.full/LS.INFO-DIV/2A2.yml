            pl: 'Tekst CD lub tag ID3'
            ru: 'Текст CD или тег ID3'
            zh: 'CD文本或ID3标签'
            hu: 'CD szöveg vagy ID3 tag'
            pt: 'Texto de CD ou etiqueta ID3'
      UNUSED_1:
        bits: '1.3'
        unused: true
      CD_LIST_TEXT_FORMAT:
        bits: '1.2'
        comment:
          en: 'Format of the text information in list mode.'
          fr: 'Format des informations textuelles en mode liste.'
          es: 'Formato de la información textual en modo lista.'
