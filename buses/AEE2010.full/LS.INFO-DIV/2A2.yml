            fr: 'Informations textuelles au format Unicode'
            es: 'Información de texto en formato Unicode'
            de: 'Textinformationen im Unicode-Format'
            it: 'Informazioni testuali in formato Unicode'
            pl: 'Informacje tekstowe w formacie Unicode'
