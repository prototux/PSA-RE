id: 0x19B
name: 'SPEED_LIMITER_PRESETS_STATUS'
type: 'can'
length: 7
comment:
  en: 'Speed limiter preset speeds (6 slots) and availability of cruise/limiter information.'
  fr: 'Vitesses mémorisées du limiteur de vitesse (6 emplacements) et disponibilité des informations régulateur/limiteur.'
  es: 'Velocidades memorizadas del limitador de velocidad (6 posiciones) y disponibilidad de la información del regulador/limitador.'
  de: 'Gespeicherte Geschwindigkeiten des Geschwindigkeitsbegrenzers (6 Plätze) und Verfügbarkeit der Tempomat-/Begrenzer-Information.'
  it: 'Velocità memorizzate del limitatore di velocità (6 posizioni) e disponibilità delle informazioni del regolatore/limitatore.'
  pl: 'Zapamiętane prędkości ogranicznika prędkości (6 miejsc) i dostępność informacji tempomatu/ogranicznika.'
  ru: 'Сохранённые скорости ограничителя скорости (6 ячеек) и доступность информации круиз-контроля/ограничителя.'
  zh: '限速器预设速度(6个位置)及巡航/限速信息可用性。'
  hu: 'A sebességhatároló tárolt sebességei (6 hely) és a tempomat/határoló információ elérhetősége.'
  pt: 'Velocidades predefinidas do limitador de velocidade (6 posições) e disponibilidade de informação do regulador/limitador.'
observations:
  en: 'Depends on the ECU (component-specific behaviour)'
  fr: 'Dépend du calculateur (comportement propre à l''organe)'
  es: 'Depende de la ECU (comportamiento propio del componente)'
  de: 'Abhängig vom Steuergerät (bauteilspezifisches Verhalten)'
  it: 'Dipende dalla centralina (comportamento specifico del componente)'
  pl: 'Zależy od sterownika (zachowanie specyficzne dla podzespołu)'
  ru: 'Зависит от блока управления (поведение конкретного узла)'
  zh: '取决于该ECU的具体行为'
  hu: 'A vezérlőegységtől függ (alkatrész-specifikus viselkedés)'
  pt: 'Depende da unidade de controlo (comportamento específico do componente)'
periodicity: ['trigger']
senders: ['CMB', 'ICSV', 'BTEL', 'OVIP']
receivers: ['BSI']

