      pl: 'Wartość prędkości strefy ograniczenia 1'
      ru: 'Значение скорости зоны ограничения 1'
      zh: '限速区1车速值'
      hu: '1. korlátozási zóna sebesség érték'
      pt: 'Valor de velocidade da zona de limitação 1'
