id: 0x0DF
name: 'EMF_MENU_COMMAND'
type: 'can'
length: 4
comment:
  en: 'Menu command sent by the EMF module to the radio/display: selected item code, list line count and new value.'
  fr: 'Commande de menu envoyée par le module EMF vers l''autoradio/afficheur : code de l''élément sélectionné, nombre de lignes de la liste et nouvelle valeur.'
  es: 'Comando de menú enviado por el módulo EMF a la radio/pantalla: código del elemento seleccionado, número de líneas de la lista y nuevo valor.'
  de: 'Menübefehl vom EMF-Modul an Radio/Display: Code des ausgewählten Elements, Anzahl der Listenzeilen und neuer Wert.'
  it: 'Comando di menu inviato dal modulo EMF all''autoradio/display: codice dell''elemento selezionato, numero di righe dell''elenco e nuovo valore.'
  pl: 'Polecenie menu wysyłane przez moduł EMF do radia/wyświetlacza: kod wybranego elementu, liczba wierszy listy i nowa wartość.'
  ru: 'Команда меню, отправленная модулем EMF на радио/дисплей: код выбранного элемента, количество строк списка и новое значение.'
  zh: '由EMF模块发送给收音机/显示屏的菜单命令:所选项目代码、列表行数和新值。'
  hu: 'Az EMF modul által a rádió/kijelző felé küldött menüparancs: a kiválasztott elem kódja, a lista sorainak száma és az új érték.'
  pt: 'Comando de menu enviado pelo módulo EMF à rádio/visor: código do item selecionado, número de linhas da lista e novo valor.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['500ms', 'trigger']
senders: ['EMF', 'ICSV']
receivers: ['RAD']

