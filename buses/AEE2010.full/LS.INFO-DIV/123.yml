id: 0x123
name: 'KML_CALL_STATUS'
type: 'can-tp'
comment:
  en: 'Family of frames sharing this ID: the content depends on CALL_OPERATOR_PHONE_MODE_2'
  fr: 'Famille de trames partageant cet identifiant : le contenu dépend de CALL_OPERATOR_PHONE_MODE_2'
