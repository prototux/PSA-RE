  de: 'Familie von Botschaften mit dieser ID: der Inhalt hängt von CALL_OPERATOR_PHONE_MODE_2 ab'
  it: 'Famiglia di frame che condividono questo ID: il contenuto dipende da CALL_OPERATOR_PHONE_MODE_2'
  pl: 'Rodzina ramek o tym samym identyfikatorze: zawartość zależy od CALL_OPERATOR_PHONE_MODE_2'
  ru: 'Семейство кадров с этим идентификатором: содержимое зависит от CALL_OPERATOR_PHONE_MODE_2'
  zh: '共用此ID的一组帧：内容取决于CALL_OPERATOR_PHONE_MODE_2'
  hu: 'Ezt az azonosítót megosztó keretcsalád: a tartalom a(z) CALL_OPERATOR_PHONE_MODE_2 értékétől függ'
  pt: 'Família de tramas que partilham este identificador: o conteúdo depende de CALL_OPERATOR_PHONE_MODE_2'
periodicity: ['trigger']
senders: ['RAD', 'ICSV']
receivers: ['EMF', 'CRT', 'FMUX']
