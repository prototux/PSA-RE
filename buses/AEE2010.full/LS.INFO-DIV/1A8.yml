id: 0x1A8
name: 'SPEED_CONTROL'
type: 'can'
length: 8
comment:
  en: 'Cruise control / speed limiter status: function active, engaged, activation attempt and set speed.'
  fr: 'État du régulateur/limiteur de vitesse : fonction active, engagée, tentative d''activation et vitesse consigne.'
  es: 'Estado del regulador/limitador de velocidad: función activa, engranada, intento de activación y velocidad de consigna.'
  de: 'Status der Geschwindigkeitsregelung/-begrenzung: Funktion aktiv, eingekuppelt, Aktivierungsversuch und Sollgeschwindigkeit.'
  it: 'Stato del regolatore/limitatore di velocità: funzione attiva, inserita, tentativo di attivazione e velocità impostata.'
  pl: 'Stan tempomatu/ogranicznika prędkości: funkcja aktywna, włączona, próba aktywacji i prędkość zadana.'
  ru: 'Статус круиз-контроля/ограничителя скорости: функция активна, включена, попытка активации и заданная скорость.'
  zh: '定速巡航/限速器状态:功能激活、已接合、激活尝试及设定车速。'
  hu: 'A tempomat/sebességhatároló állapota: funkció aktív, bekapcsolva, aktiválási kísérlet és beállított sebesség.'
  pt: 'Estado do regulador de velocidade / limitador de velocidade: função ativa, engrenada, tentativa de ativação e velocidade definida.'
observations:
  en: 'On state change of: SPEED_LIMITER_PREPROGRAMMING_STATUS, SPEED_LIMITER_STOP_REACHED, TACHO_COLOR_SELECTION'
  fr: 'Sur changement d''état de : SPEED_LIMITER_PREPROGRAMMING_STATUS, SPEED_LIMITER_STOP_REACHED, TACHO_COLOR_SELECTION'
  es: 'Al cambiar el estado de: SPEED_LIMITER_PREPROGRAMMING_STATUS, SPEED_LIMITER_STOP_REACHED, TACHO_COLOR_SELECTION'
  de: 'Bei Statusänderung von: SPEED_LIMITER_PREPROGRAMMING_STATUS, SPEED_LIMITER_STOP_REACHED, TACHO_COLOR_SELECTION'
  it: 'Al cambiamento di stato di: SPEED_LIMITER_PREPROGRAMMING_STATUS, SPEED_LIMITER_STOP_REACHED, TACHO_COLOR_SELECTION'
  pl: 'Wysyłane przy zmianie stanu: SPEED_LIMITER_PREPROGRAMMING_STATUS, SPEED_LIMITER_STOP_REACHED, TACHO_COLOR_SELECTION'
  ru: 'При изменении состояния: SPEED_LIMITER_PREPROGRAMMING_STATUS, SPEED_LIMITER_STOP_REACHED, TACHO_COLOR_SELECTION'
  zh: '当XVV_PREPROG_ACTIF, SPEED_LIMITER_STOP_REACHED, DMD_COULEUR_TACHY_HY状态变化时'
  hu: 'A(z) SPEED_LIMITER_PREPROGRAMMING_STATUS, SPEED_LIMITER_STOP_REACHED, TACHO_COLOR_SELECTION állapotváltozásakor'
  pt: 'Na mudança de estado de: SPEED_LIMITER_PREPROGRAMMING_STATUS, SPEED_LIMITER_STOP_REACHED, TACHO_COLOR_SELECTION'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['BGP', 'CMB', 'VTH', 'MATT']

signals:
  UNUSED_1:
    bits: '1.7-1.3'
    unused: true

  TACHO_COLOR_SELECTION:
    bits: '1.2'
    comment:
      en: 'Tachometer colour selection'
      fr: 'Choix de la couleur du compte-tours'
      es: 'Selección del color del cuentarrevoluciones'
      de: 'Farbwahl des Drehzahlmessers'
      it: 'Selezione del colore del contagiri'
      pl: 'Wybór koloru obrotomierza'
      ru: 'Выбор цвета тахометра'
      zh: '转速表颜色选择'
      hu: 'Fordulatszámmérő színének kiválasztása'
      pt: 'Seleção da cor do conta-rotações'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
        en: 'Requested'
        fr: 'Demandé'
        es: 'Solicitado'
        de: 'Angefordert'
        it: 'Richiesto'
        pl: 'Żądane'
        ru: 'Запрошено'
        zh: '已请求'
        hu: 'Kérve'
        pt: 'Pedido'

  SPEED_LIMITER_PREPROGRAMMING_STATUS:
    bits: '1.1'
    comment:
      en: 'Status of preprogramming'
      fr: 'État de la préprogrammation'
      es: 'Estado de la preprogramación'
      de: 'Status der Vorprogrammierung'
      it: 'Stato della preprogrammazione'
      pl: 'Stan wstępnego programowania'
      ru: 'Состояние предварительного программирования'
      zh: '预设状态'
      hu: 'Az előre programozás állapota'
      pt: 'Estado da pré-programação'
    type: 'bool'
