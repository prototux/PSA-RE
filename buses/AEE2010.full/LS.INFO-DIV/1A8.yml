  SPEED_LIMITER_LOWER_STOP:
    bits: '2.7-3.0'
    comment:
      en: 'Status of the lower limit'
      fr: 'État de la butée inférieure'
      es: 'Estado del tope inferior'
      de: 'Status des unteren Anschlags'
      it: 'Stato del finecorsa inferiore'
      pl: 'Stan ogranicznika dolnego'
      ru: 'Состояние нижнего упора'
      zh: '下限状态'
