          es: 'También observado con otro escalado (factor 1)'
          de: 'Auch mit anderer Skalierung beobachtet (factor 1)'
          it: 'Osservato anche con un''altra scala (factor 1)'
          pl: 'Obserwowany także z innym skalowaniem (factor 1)'
