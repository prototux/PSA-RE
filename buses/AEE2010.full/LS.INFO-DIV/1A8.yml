      pt: 'Estado do limite inferior'
    type: 'uint'
    factor: 0.01
    min: 0
    max: 254
    units: 'km/h'
    invalid: 0xFFFF
    default: 0xFFFF
    alternatives:
      - note:
          en: 'Also observed with another scaling (factor 1)'
          fr: 'Aussi observé avec une autre mise à l''échelle (factor 1)'
          es: 'También observado con otro escalado (factor 1)'
          de: 'Auch mit anderer Skalierung beobachtet (factor 1)'
          it: 'Osservato anche con un''altra scala (factor 1)'
          pl: 'Obserwowany także z innym skalowaniem (factor 1)'
          ru: 'Также наблюдался с другим масштабом (factor 1)'
          zh: '也观察到使用另一种缩放（factor 1）'
          hu: 'Megfigyelve más skálázással is (factor 1)'
          pt: 'Também observado com outra escala (factor 1)'
        factor: 1

