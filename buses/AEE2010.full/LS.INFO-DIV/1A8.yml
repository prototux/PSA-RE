    values:
      0x00:
        en: 'Inactive'
        fr: 'Inactif'
        es: 'Inactivo'
        de: 'Inaktiv'
        it: 'Inattivo'
        pl: 'Nieaktywny'
        ru: 'Неактивно'
        zh: '未激活'
        hu: 'Inaktív'
        pt: 'Inativo'
      0x01:
        en: 'Active'
        fr: 'Actif'
        es: 'Activo'
        de: 'Aktiv'
        it: 'Attivo'
        pl: 'Aktywny'
        ru: 'Активно'
        zh: '激活'
        hu: 'Aktív'
        pt: 'Ativo'

  SPEED_LIMITER_STOP_REACHED:
    bits: '1.0'
    comment:
      en: 'Status of the setpoint limit reached'
      fr: 'État de la butée atteinte'
      es: 'Estado del tope alcanzado'
      de: 'Status des erreichten Anschlags'
      it: 'Stato del finecorsa raggiunto'
      pl: 'Stan osiągniętego ogranicznika'
      ru: 'Состояние достижения упора'
      zh: '限位到达状态'
      hu: 'Az ütköző elérésének állapota'
      pt: 'Estado de limite do ponto de ajuste alcançado'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'False'
        fr: 'Faux'
        es: 'Falso'
        de: 'Falsch'
        it: 'Falso'
        pl: 'Fałsz'
        ru: 'Ложь'
        zh: '假'
        hu: 'Hamis'
        pt: 'Falso'
      0x01:
