id: 0x321
name: 'COMBINE_ALERTS_INDICATORS_2'
type: 'can'
length: 6
comment:
  en: 'Additional instrument cluster telltale/alert commands: ABS state indicator, driver distraction and drowsiness detection, eco-coaching and animal/pedestrian collision warning.'
  fr: 'Commandes complémentaires de témoins/alertes du combiné : indicateur d''état ABS, détection de distraction et de somnolence du conducteur, éco-conduite et alerte de collision animal/piéton.'
  es: 'Órdenes adicionales de testigos/alertas del cuadro: indicador de estado ABS, detección de distracción y somnolencia del conductor, eco-conducción y alerta de colisión con animal/peatón.'
  de: 'Zusätzliche Kontrollleuchten-/Warnbefehle des Kombiinstruments: ABS-Statusanzeige, Erkennung von Fahrerablenkung und Müdigkeit, Eco-Coaching und Tier-/Fußgänger-Kollisionswarnung.'
  it: 'Comandi aggiuntivi di spie/allarmi del quadro strumenti: indicatore di stato ABS, rilevamento di distrazione e sonnolenza del conducente, eco-guida e avviso di collisione con animale/pedone.'
  pl: 'Dodatkowe polecenia kontrolek/alertów zestawu wskaźników: wskaźnik stanu ABS, wykrywanie rozproszenia uwagi i senności kierowcy, ekojazda i ostrzeżenie o kolizji ze zwierzęciem/pieszym.'
  ru: 'Дополнительные команды индикаторов/предупреждений приборной панели: индикатор состояния ABS, обнаружение отвлечения внимания и сонливости водителя, эко-вождение и предупреждение о столкновении с животным/пешеходом.'
  zh: '仪表组附加指示灯/警报命令：ABS状态指示、驾驶员分心与瞌睡检测、经济驾驶指导及动物/行人碰撞预警。'
  hu: 'A műszerfal kiegészítő jelzőlámpa-/riasztásparancsai: ABS-állapotjelző, vezetői figyelemelterelés és álmosság érzékelése, eco-coaching és állat-/gyalogosütközés-figyelmeztetés.'
  pt: 'Comandos adicionais de avisadores/alertas do quadrante de instrumentos: indicador de estado do ABS, deteção de distração e sonolência do condutor, eco-coaching e aviso de colisão com animais/peões.'
