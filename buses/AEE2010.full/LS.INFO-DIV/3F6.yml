      it: 'Tipo di curva di transizione per l''illuminazione ambientale policromatica (lineare/sinusoidale/logaritmica/esponenziale)'
      pl: 'Typ krzywej przejścia dla oświetlenia nastrojowego wielobarwnego (liniowa/sinusoidalna/logarytmiczna/wykładnicza)'
      ru: 'Тип кривой перехода многоцветной подсветки салона (линейная/синусоидальная/логарифмическая/экспоненциальная)'
      zh: '多彩氛围灯过渡曲线类型(线性/正弦/对数/指数)'
      hu: 'Polikróm hangulatvilágítás átmeneti görbe típusa (lineáris/szinusz/logaritmikus/exponenciális)'
      pt: 'Tipo de curva de transição para a iluminação ambiente policromática (linear/sinusoidal/logarítmica/exponencial)'
    type: 'enum'
