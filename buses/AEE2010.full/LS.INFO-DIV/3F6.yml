    bits: '2.2-2.1'
    comment:
      en: 'Transition curve type for polychrome ambient lighting (linear/sine/log/exponential)'
      fr: 'Type de courbe de transition pour l''éclairage d''ambiance polychromatique (linéaire/sinusoïdale/logarithmique/exponentielle)'
      es: 'Tipo de curva de transición para la iluminación ambiental policromática (lineal/sinusoidal/logarítmica/exponencial)'
