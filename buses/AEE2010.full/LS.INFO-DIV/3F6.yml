id: 0x3F6
name: 'AMBIENT_LIGHTING_COLOR_COMMAND'
type: 'can'
length: 3
comment:
  en: 'Target colour, brightness level and transition time/type for the instrument cluster ambient lighting.'
  fr: 'Couleur cible, niveau de luminosité et durée/type de transition pour l''éclairage d''ambiance du combiné.'
  es: 'Color objetivo, nivel de luminosidad y duración/tipo de transición para la iluminación ambiental del cuadro.'
  de: 'Zielfarbe, Helligkeitsstufe und Übergangsdauer/-typ für die Ambientebeleuchtung des Kombiinstruments.'
  it: 'Colore obiettivo, livello di luminosità e durata/tipo di transizione per l''illuminazione ambiente del quadro strumenti.'
  pl: 'Kolor docelowy, poziom jasności oraz czas/typ przejścia dla oświetlenia nastrojowego zestawu wskaźników.'
  ru: 'Целевой цвет, уровень яркости и время/тип перехода для атмосферной подсветки приборной панели.'
  zh: '仪表组氛围灯的目标颜色、亮度等级及过渡时间/类型。'
  hu: 'A műszerfal hangulatvilágításának célszíne, fényerőszintje és az átmenet ideje/típusa.'
  pt: 'Cor-alvo, nível de luminosidade e tempo/tipo de transição da iluminação ambiente do quadrante de instrumentos.'
observations:
  en: 'On state change of: AMBIENT_LIGHT_TARGET_COLOR, AMBIENT_LIGHT_TARGET_LEVEL, AMBIENT_LIGHT_TRANSITION_TIME, AMBIENT_LIGHT_TRANSITION_TYPE, AMBIENT_LIGHT_TRANSITION_SYNC_BIT'
  fr: 'Sur changement d''état de : AMBIENT_LIGHT_TARGET_COLOR, AMBIENT_LIGHT_TARGET_LEVEL, AMBIENT_LIGHT_TRANSITION_TIME, AMBIENT_LIGHT_TRANSITION_TYPE, AMBIENT_LIGHT_TRANSITION_SYNC_BIT'
  es: 'Al cambiar el estado de: AMBIENT_LIGHT_TARGET_COLOR, AMBIENT_LIGHT_TARGET_LEVEL, AMBIENT_LIGHT_TRANSITION_TIME, AMBIENT_LIGHT_TRANSITION_TYPE, AMBIENT_LIGHT_TRANSITION_SYNC_BIT'
  de: 'Bei Statusänderung von: AMBIENT_LIGHT_TARGET_COLOR, AMBIENT_LIGHT_TARGET_LEVEL, AMBIENT_LIGHT_TRANSITION_TIME, AMBIENT_LIGHT_TRANSITION_TYPE, AMBIENT_LIGHT_TRANSITION_SYNC_BIT'
  it: 'Al cambiamento di stato di: AMBIENT_LIGHT_TARGET_COLOR, AMBIENT_LIGHT_TARGET_LEVEL, AMBIENT_LIGHT_TRANSITION_TIME, AMBIENT_LIGHT_TRANSITION_TYPE, AMBIENT_LIGHT_TRANSITION_SYNC_BIT'
  pl: 'Wysyłane przy zmianie stanu: AMBIENT_LIGHT_TARGET_COLOR, AMBIENT_LIGHT_TARGET_LEVEL, AMBIENT_LIGHT_TRANSITION_TIME, AMBIENT_LIGHT_TRANSITION_TYPE, AMBIENT_LIGHT_TRANSITION_SYNC_BIT'
  ru: 'При изменении состояния: AMBIENT_LIGHT_TARGET_COLOR, AMBIENT_LIGHT_TARGET_LEVEL, AMBIENT_LIGHT_TRANSITION_TIME, AMBIENT_LIGHT_TRANSITION_TYPE, AMBIENT_LIGHT_TRANSITION_SYNC_BIT'
  zh: '当TARGET_COLOR_CMB, AMBIENT_LIGHT_TARGET_LEVEL, AMBIENT_LIGHT_TRANSITION_TIME, AMBIENT_LIGHT_TRANSITION_TYPE, TRANSITION_START状态变化时'
  hu: 'A(z) AMBIENT_LIGHT_TARGET_COLOR, AMBIENT_LIGHT_TARGET_LEVEL, AMBIENT_LIGHT_TRANSITION_TIME, AMBIENT_LIGHT_TRANSITION_TYPE, AMBIENT_LIGHT_TRANSITION_SYNC_BIT állapotváltozásakor'
  pt: 'Na mudança de estado de: AMBIENT_LIGHT_TARGET_COLOR, AMBIENT_LIGHT_TARGET_LEVEL, AMBIENT_LIGHT_TRANSITION_TIME, AMBIENT_LIGHT_TRANSITION_TYPE, AMBIENT_LIGHT_TRANSITION_SYNC_BIT'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['CMB']

signals:
  AMBIENT_LIGHT_TARGET_LEVEL:
    bits: '1.7-1.0'
    comment:
      en: 'Target output level for polychrome ambient lighting'
      fr: 'Niveau de sortie cible pour l''éclairage d''ambiance polychromatique'
      es: 'Nivel de salida objetivo para la iluminación ambiental policromática'
      de: 'Zielausgangsstufe für die polychrome Ambientebeleuchtung'
      it: 'Livello di uscita obiettivo per l''illuminazione ambientale policromatica'
      pl: 'Docelowy poziom wyjściowy oświetlenia nastrojowego wielobarwnego'
      ru: 'Целевой уровень выхода многоцветной подсветки салона'
      zh: '多彩氛围灯目标输出等级'
      hu: 'Polikróm hangulatvilágítás cél kimeneti szint'
      pt: 'Nível de saída alvo para a iluminação ambiente policromática'
    type: 'uint'
    min: 0
    max: 255
    default: 0x00

  AMBIENT_LIGHT_TRANSITION_TIME:
    bits: '2.7-2.3'
    comment:
      en: 'Requested transition duration for polychrome ambient lighting'
      fr: 'Durée de transition demandée pour l''éclairage d''ambiance polychromatique'
      es: 'Duración de transición solicitada para la iluminación ambiental policromática'
      de: 'Angeforderte Übergangsdauer für die polychrome Ambientebeleuchtung'
      it: 'Durata di transizione richiesta per l''illuminazione ambientale policromatica'
      pl: 'Żądany czas przejścia dla oświetlenia nastrojowego wielobarwnego'
      ru: 'Запрошенная длительность перехода многоцветной подсветки салона'
      zh: '多彩氛围灯请求过渡时间'
      hu: 'Polikróm hangulatvilágítás kért átmeneti idő'
      pt: 'Duração de transição pedida para a iluminação ambiente policromática'
    type: 'uint'
    min: 0
    max: 31
    default: 0x00

