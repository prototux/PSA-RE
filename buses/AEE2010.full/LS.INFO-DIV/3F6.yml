      en: 'Ambient lighting transition synchronization bit'
      fr: 'Bit de synchronisation de la transition d''éclairage d''ambiance'
      es: 'Bit de sincronización de la transición de iluminación ambiental'
      de: 'Synchronisationsbit des Ambientebeleuchtungs-Übergangs'
      it: 'Bit di sincronizzazione della transizione dell''illuminazione ambientale'
