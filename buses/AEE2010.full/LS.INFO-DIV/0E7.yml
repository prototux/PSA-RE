id: 0x0E7
name: 'DASHCAM_LED_REQUEST'
type: 'can'
length: 1
comment:
  en: 'Request to light the LEDs of the dashcam recording buttons, sent by the dashcam (IDVR).'
  fr: 'Demande d''allumage des LED des boutons-poussoirs de l''enregistreur vidéo embarqué, envoyée par l''IDVR.'
  es: 'Solicitud de encendido de los LED de los botones del grabador de vídeo a bordo, enviada por el IDVR.'
  de: 'Anforderung zum Einschalten der LEDs der Dashcam-Aufnahmetasten, vom IDVR gesendet.'
  it: 'Richiesta di accensione dei LED dei pulsanti del videoregistratore di bordo, inviata dall''IDVR.'
  pl: 'Żądanie zaświecenia diod LED przycisków rejestratora wideo, wysyłane przez IDVR.'
  ru: 'Запрос на включение светодиодов кнопок видеорегистратора, отправляемый IDVR.'
  zh: '行车记录仪(IDVR)发送的录制按钮LED点亮请求。'
  hu: 'A fedélzeti kamera (IDVR) által küldött kérés a felvételgombok LED-jeinek kigyújtására.'
  pt: 'Pedido de acendimento dos LED dos botões de gravação da câmara de bordo, enviado pela câmara de bordo (IDVR).'
observations:
  en: 'On state change of: ARC_PUSH_LED_REQUEST, STL_PUSH_LED_REQUEST, ABNORMAL_LANE_CROSSING_LEFT, ABNORMAL_LANE_CROSSING_RIGHT, FRONT_COLLISION_WARNING_REQUEST'
  fr: 'Sur changement d''état de : ARC_PUSH_LED_REQUEST, STL_PUSH_LED_REQUEST, ABNORMAL_LANE_CROSSING_LEFT, ABNORMAL_LANE_CROSSING_RIGHT, FRONT_COLLISION_WARNING_REQUEST'
  es: 'Al cambiar el estado de: ARC_PUSH_LED_REQUEST, STL_PUSH_LED_REQUEST, ABNORMAL_LANE_CROSSING_LEFT, ABNORMAL_LANE_CROSSING_RIGHT, FRONT_COLLISION_WARNING_REQUEST'
  de: 'Bei Statusänderung von: ARC_PUSH_LED_REQUEST, STL_PUSH_LED_REQUEST, ABNORMAL_LANE_CROSSING_LEFT, ABNORMAL_LANE_CROSSING_RIGHT, FRONT_COLLISION_WARNING_REQUEST'
  it: 'Al cambiamento di stato di: ARC_PUSH_LED_REQUEST, STL_PUSH_LED_REQUEST, ABNORMAL_LANE_CROSSING_LEFT, ABNORMAL_LANE_CROSSING_RIGHT, FRONT_COLLISION_WARNING_REQUEST'
  pl: 'Wysyłane przy zmianie stanu: ARC_PUSH_LED_REQUEST, STL_PUSH_LED_REQUEST, ABNORMAL_LANE_CROSSING_LEFT, ABNORMAL_LANE_CROSSING_RIGHT, FRONT_COLLISION_WARNING_REQUEST'
  ru: 'При изменении состояния: ARC_PUSH_LED_REQUEST, STL_PUSH_LED_REQUEST, ABNORMAL_LANE_CROSSING_LEFT, ABNORMAL_LANE_CROSSING_RIGHT, FRONT_COLLISION_WARNING_REQUEST'
  zh: '当IDVR_SORTIE_PUSH_ARC, STL_PUSH_LED_REQUEST, ABNORMAL_LANE_CROSSING_LEFT, ABNORMAL_LANE_CROSSING_RIGHT, IDVR_FCW_ON状态变化时'
  hu: 'A(z) ARC_PUSH_LED_REQUEST, STL_PUSH_LED_REQUEST, ABNORMAL_LANE_CROSSING_LEFT, ABNORMAL_LANE_CROSSING_RIGHT, FRONT_COLLISION_WARNING_REQUEST állapotváltozásakor'
  pt: 'Na mudança de estado de: ARC_PUSH_LED_REQUEST, STL_PUSH_LED_REQUEST, ABNORMAL_LANE_CROSSING_LEFT, ABNORMAL_LANE_CROSSING_RIGHT, FRONT_COLLISION_WARNING_REQUEST'
periodicity: ['500ms', 'trigger']
senders: ['IDVR']
receivers: ['ICSV', 'FMUX', 'BTEL', 'CMB', 'OVIP', 'MDS']

signals:
  ARC_PUSH_LED_REQUEST:
    bits: '1.7-1.6'
    comment:
      en: 'Request to light the LED on the front collision warning button'
      fr: 'Demande d''allumage de la LED du bouton d''alerte de collision frontale'
      es: 'Solicitud de encendido del LED del botón de alerta de colisión frontal'
      de: 'Anforderung zum Einschalten der LED der Frontkollisionswarn-Taste'
      it: 'Richiesta di accensione del LED del pulsante di allarme collisione frontale'
      pl: 'Żądanie zapalenia diody LED przycisku ostrzegania o kolizji czołowej'
      ru: 'Запрос включения светодиода кнопки предупреждения о фронтальном столкновении'
      zh: '前方碰撞预警按钮LED点亮请求'
      hu: 'A frontális ütközésfigyelmeztető gomb LED-jének bekapcsolási kérése'
      pt: 'Pedido de acendimento do LED do botão de alerta de colisão frontal'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'Off'
        fr: 'Éteint'
        es: 'Apagado'
        de: 'Aus'
        it: 'Spento'
        pl: 'Wyłączone'
