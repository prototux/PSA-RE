id: 0x0BF
name: 'WINDOW_SUNROOF_REQUEST'
type: 'can'
length: 6
comment:
  en: 'Window, sunroof/blind and door position requests and Bluetooth/card authentication requests, sent by the BSI to the smart door control module.'
  fr: 'Demandes de position des vitres, du toit ouvrant/store et des portes, et demandes d''authentification Bluetooth/carte, envoyées par la BSI au module de commande de porte intelligent.'
  es: 'Solicitudes de posición de las ventanillas, techo solar/persiana y puertas, y solicitudes de autenticación Bluetooth/tarjeta, enviadas por la BSI al módulo de control de puerta inteligente.'
  de: 'Anforderungen zur Fenster-, Schiebedach-/Rollo- und Türposition sowie Bluetooth-/Kartenauthentifizierungsanforderungen, von der BSI an das intelligente Türsteuermodul gesendet.'
  it: 'Richieste di posizione dei finestrini, del tettuccio apribile/tendina e delle porte, e richieste di autenticazione Bluetooth/scheda, inviate dalla BSI al modulo di comando porta intelligente.'
  pl: 'Żądania pozycji szyb, szyberdachu/rolety i drzwi oraz żądania uwierzytelnienia Bluetooth/karty, wysyłane przez BSI do inteligentnego modułu sterowania drzwiami.'
  ru: 'Запросы положения стёкол, люка/шторки и дверей, а также запросы аутентификации Bluetooth/карты, отправляемые BSI в интеллектуальный модуль управления дверью.'
  zh: '由BSI发送给智能车门控制模块的车窗、天窗/遮阳帘和车门位置请求，以及蓝牙/卡片认证请求。'
  hu: 'Az ablakok, a napfénytető/roló és az ajtók pozíciójára vonatkozó kérések, valamint Bluetooth-/kártya-hitelesítési kérések, amelyeket a BSI küld az intelligens ajtóvezérlő modulnak.'
  pt: 'Pedidos de posição de vidro, teto de abrir/estore e porta, e pedidos de autenticação Bluetooth/cartão, enviados pela BSI ao módulo de comando inteligente das portas.'
observations:
  en: 'On state change of: CID_SEARCH_REQUEST, WELCOME_ACCESS_LOCKING_SOUND_REQUEST, HANDS_FREE_ACCESS_DIAGNOSTIC_REQUEST, UIR_BACKWARD_AREA_INCLUSION, CID_AUTHENTICATION_REQUEST, NFC_CARD_AUTHENTICATION_REQUEST, NFC_SMART_DEVICE_AUTHENTICATION_REQUEST, BLUETOOTH_SMART_DEVICE_AUTHENTICATION_REQUEST, HANDS_FREE_ACCESS_ANTICIPATION_REQUEST'
  fr: 'Sur changement d''état de : CID_SEARCH_REQUEST, WELCOME_ACCESS_LOCKING_SOUND_REQUEST, HANDS_FREE_ACCESS_DIAGNOSTIC_REQUEST, UIR_BACKWARD_AREA_INCLUSION, CID_AUTHENTICATION_REQUEST, NFC_CARD_AUTHENTICATION_REQUEST, NFC_SMART_DEVICE_AUTHENTICATION_REQUEST, BLUETOOTH_SMART_DEVICE_AUTHENTICATION_REQUEST, HANDS_FREE_ACCESS_ANTICIPATION_REQUEST'
  es: 'Al cambiar el estado de: CID_SEARCH_REQUEST, WELCOME_ACCESS_LOCKING_SOUND_REQUEST, HANDS_FREE_ACCESS_DIAGNOSTIC_REQUEST, UIR_BACKWARD_AREA_INCLUSION, CID_AUTHENTICATION_REQUEST, NFC_CARD_AUTHENTICATION_REQUEST, NFC_SMART_DEVICE_AUTHENTICATION_REQUEST, BLUETOOTH_SMART_DEVICE_AUTHENTICATION_REQUEST, HANDS_FREE_ACCESS_ANTICIPATION_REQUEST'
  de: 'Bei Statusänderung von: CID_SEARCH_REQUEST, WELCOME_ACCESS_LOCKING_SOUND_REQUEST, HANDS_FREE_ACCESS_DIAGNOSTIC_REQUEST, UIR_BACKWARD_AREA_INCLUSION, CID_AUTHENTICATION_REQUEST, NFC_CARD_AUTHENTICATION_REQUEST, NFC_SMART_DEVICE_AUTHENTICATION_REQUEST, BLUETOOTH_SMART_DEVICE_AUTHENTICATION_REQUEST, HANDS_FREE_ACCESS_ANTICIPATION_REQUEST'
  it: 'Al cambiamento di stato di: CID_SEARCH_REQUEST, WELCOME_ACCESS_LOCKING_SOUND_REQUEST, HANDS_FREE_ACCESS_DIAGNOSTIC_REQUEST, UIR_BACKWARD_AREA_INCLUSION, CID_AUTHENTICATION_REQUEST, NFC_CARD_AUTHENTICATION_REQUEST, NFC_SMART_DEVICE_AUTHENTICATION_REQUEST, BLUETOOTH_SMART_DEVICE_AUTHENTICATION_REQUEST, HANDS_FREE_ACCESS_ANTICIPATION_REQUEST'
  pl: 'Wysyłane przy zmianie stanu: CID_SEARCH_REQUEST, WELCOME_ACCESS_LOCKING_SOUND_REQUEST, HANDS_FREE_ACCESS_DIAGNOSTIC_REQUEST, UIR_BACKWARD_AREA_INCLUSION, CID_AUTHENTICATION_REQUEST, NFC_CARD_AUTHENTICATION_REQUEST, NFC_SMART_DEVICE_AUTHENTICATION_REQUEST, BLUETOOTH_SMART_DEVICE_AUTHENTICATION_REQUEST, HANDS_FREE_ACCESS_ANTICIPATION_REQUEST'
  ru: 'При изменении состояния: CID_SEARCH_REQUEST, WELCOME_ACCESS_LOCKING_SOUND_REQUEST, HANDS_FREE_ACCESS_DIAGNOSTIC_REQUEST, UIR_BACKWARD_AREA_INCLUSION, CID_AUTHENTICATION_REQUEST, NFC_CARD_AUTHENTICATION_REQUEST, NFC_SMART_DEVICE_AUTHENTICATION_REQUEST, BLUETOOTH_SMART_DEVICE_AUTHENTICATION_REQUEST, HANDS_FREE_ACCESS_ANTICIPATION_REQUEST'
  zh: '当RQ_CID_SEARCH, WELCOME_ACCESS_LOCKING_SOUND_REQUEST, HANDS_FREE_ACCESS_DIAGNOSTIC_REQUEST, UIR_BACKWARD_AREA_INCLUSION, CID_AUTHENTICATION_REQUEST, NFC_CARD_AUTHENTICATION_REQUEST, NFC_SMART_DEVICE_AUTHENTICATION_REQUEST, BLUETOOTH_SMART_DEVICE_AUTHENTICATION_REQUEST, RQ_DOWN_MA_SDCM_BSI状态变化时'
  hu: 'A(z) CID_SEARCH_REQUEST, WELCOME_ACCESS_LOCKING_SOUND_REQUEST, HANDS_FREE_ACCESS_DIAGNOSTIC_REQUEST, UIR_BACKWARD_AREA_INCLUSION, CID_AUTHENTICATION_REQUEST, NFC_CARD_AUTHENTICATION_REQUEST, NFC_SMART_DEVICE_AUTHENTICATION_REQUEST, BLUETOOTH_SMART_DEVICE_AUTHENTICATION_REQUEST, HANDS_FREE_ACCESS_ANTICIPATION_REQUEST állapotváltozásakor'
  pt: 'Na mudança de estado de: CID_SEARCH_REQUEST, WELCOME_ACCESS_LOCKING_SOUND_REQUEST, HANDS_FREE_ACCESS_DIAGNOSTIC_REQUEST, UIR_BACKWARD_AREA_INCLUSION, CID_AUTHENTICATION_REQUEST, NFC_CARD_AUTHENTICATION_REQUEST, NFC_SMART_DEVICE_AUTHENTICATION_REQUEST, BLUETOOTH_SMART_DEVICE_AUTHENTICATION_REQUEST, HANDS_FREE_ACCESS_ANTICIPATION_REQUEST'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['SDCM']

