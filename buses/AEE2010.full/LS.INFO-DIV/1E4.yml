id: 0x1E4
name: 'REAR_SEAT_ENTERTAINMENT_REMOTE_STATUS'
type: 'can'
length: 2
comment:
  en: 'Rear seat entertainment remote control status: navigation buttons, mute, power, sound availability and source selection.'
  fr: 'État de la télécommande du système de divertissement arrière : boutons de navigation, coupure son, marche, disponibilité du son et sélection de source.'
  es: 'Estado del mando a distancia del sistema de entretenimiento trasero: botones de navegación, silencio, encendido, disponibilidad de sonido y selección de fuente.'
  de: 'Status der Fernbedienung des Rücksitz-Entertainmentsystems: Navigationstasten, Stummschaltung, Ein/Aus, Tonverfügbarkeit und Quellenauswahl.'
  it: 'Stato del telecomando del sistema di intrattenimento posteriore: pulsanti di navigazione, silenziamento, accensione, disponibilità audio e selezione sorgente.'
  pl: 'Stan pilota systemu rozrywki tylnych siedzeń: przyciski nawigacyjne, wyciszenie, zasilanie, dostępność dźwięku i wybór źródła.'
  ru: 'Статус пульта дистанционного управления системы развлечений для задних сидений: кнопки навигации, отключение звука, питание, доступность звука и выбор источника.'
  zh: '后排娱乐系统遥控器状态:导航按钮、静音、电源、声音可用性及信源选择。'
  hu: 'A hátsó szórakoztató rendszer távirányítójának állapota: navigációs gombok, némítás, be-/kikapcsolás, hangelérhetőség és forrásválasztás.'
  pt: 'Estado do comando remoto de entretenimento dos bancos traseiros: botões de navegação, silêncio, ligar/desligar, disponibilidade de som e seleção de fonte.'
periodicity: ['5000ms']
senders: ['ICSV']
receivers: ['BTEL', 'OVIP']

