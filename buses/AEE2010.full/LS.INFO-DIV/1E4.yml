      pl: 'Przycisk źródła systemu rozrywki tylnych siedzeń (RSE)'
      ru: 'Кнопка источника системы развлечений задних сидений (RSE)'
      zh: '后排娱乐系统(RSE)信号源按钮'
      hu: 'A hátsó szórakoztató rendszer (RSE) forrásgombja'
      pt: 'Botão de fonte do sistema de entretenimento traseiro (RSE)'
    type: 'bool'
    default: 0x00
