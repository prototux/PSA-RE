id: 0x361
name: 'VEHICLE_FEATURE_AVAILABILITY'
type: 'can'
length: 8
comment:
  en: 'Vehicle equipment availability sent by the BSI on change: parking sensors, auto lighting, auto wiping, daytime running lights and active profile number.'
  fr: 'Disponibilité des équipements du véhicule envoyée par la BSI sur changement : aide au stationnement, éclairage automatique, essuyage automatique, feux de jour et numéro de profil actif.'
  es: 'Disponibilidad de los equipos del vehículo enviada por la BSI al cambiar: ayuda al aparcamiento, alumbrado automático, limpiaparabrisas automático, luces diurnas y número de perfil activo.'
  de: 'Von der BSI bei Änderung gesendete Verfügbarkeit der Fahrzeugausstattung: Einparkhilfe, automatisches Licht, automatisches Wischen, Tagfahrlicht und aktive Profilnummer.'
  it: 'Disponibilità degli equipaggiamenti del veicolo inviata dalla BSI al cambio: assistenza al parcheggio, luci automatiche, tergicristalli automatici, luci diurne e numero di profilo attivo.'
  pl: 'Dostępność wyposażenia pojazdu wysyłana przez BSI przy zmianie: czujniki parkowania, automatyczne światła, automatyczne wycieraczki, światła dzienne i numer aktywnego profilu.'
  ru: 'Доступность оборудования автомобиля, отправляемая BSI при изменении: парковочные датчики, автосвет, автодворники, дневные ходовые огни и номер активного профиля.'
  zh: '由BSI在状态变化时发送的车辆配置可用性：泊车传感器、自动大灯、自动雨刷、日间行车灯和当前配置文件编号。'
  hu: 'A BSI által változáskor küldött jármű-felszereltségi elérhetőség: parkolóradar, automatikus világítás, automatikus ablaktörlő, nappali menetfény és az aktív profil száma.'
  pt: 'Disponibilidade de equipamento do veículo enviada pela BSI na mudança: sensores de estacionamento, luzes automáticas, limpeza automática, luzes diurnas e número de perfil ativo.'
periodicity: ['500180ms']
senders: ['BSI']
receivers: ['CMB', 'EMF', 'BTEL', 'MATT', 'OVIP', 'MDS', 'RAD']

