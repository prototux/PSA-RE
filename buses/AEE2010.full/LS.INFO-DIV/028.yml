id: 0x028
name: 'ADDITIVE_PUMP_COMMAND_2'
type: 'can'
length: 3
comment:
  en: 'Allowed levels of driver-vehicle interaction (voice, touch, text, gestures) sent by the BSI to restrict distraction.'
  fr: 'Niveaux d''interaction conducteur-véhicule autorisés (vocal, tactile, texte, gestes), envoyés par la BSI pour limiter la distraction.'
  es: 'Niveles permitidos de interacción conductor-vehículo (voz, táctil, texto, gestos), enviados por la BSI para limitar la distracción.'
  de: 'Von der BSI gesendete zulässige Stufen der Fahrer-Fahrzeug-Interaktion (Sprache, Touch, Text, Gesten) zur Ablenkungsbegrenzung.'
  it: 'Livelli consentiti di interazione conducente-veicolo (voce, tocco, testo, gesti), inviati dalla BSI per limitare la distrazione.'
  pl: 'Dopuszczalne poziomy interakcji kierowcy z pojazdem (głos, dotyk, tekst, gesty), wysyłane przez BSI w celu ograniczenia rozproszenia uwagi.'
  ru: 'Допустимые уровни взаимодействия водителя с автомобилем (голос, сенсор, текст, жесты), отправляемые BSI для ограничения отвлечения внимания.'
  zh: '由BSI发送的允许的驾驶员-车辆交互等级（语音、触摸、文本、手势），用于限制分心。'
  hu: 'A BSI által küldött, engedélyezett vezető-jármű interakciós szintek (hang, érintés, szöveg, gesztusok) a figyelemelterelés korlátozására.'
  pt: 'Níveis permitidos de interação condutor-veículo (voz, toque, texto, gestos) enviados pela BSI para limitar a distração.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['BTEL', 'OVIP', 'RAD']

