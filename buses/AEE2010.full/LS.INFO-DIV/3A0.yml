id: 0x3A0
name: 'VEHICLE_PARAMETER_REQUEST'
type: 'can-tp'
length_min: 1
comment:
  en: 'Vehicle parameter request from the infotainment nodes.'
  fr: 'Demande de paramètre véhicule depuis les modules multimédia.'
  es: 'Solicitud de parámetro del vehículo desde los módulos multimedia.'
  de: 'Fahrzeugparameteranforderung von den Infotainment-Modulen.'
  it: 'Richiesta di parametro veicolo dai moduli multimediali.'
  pl: 'Żądanie parametru pojazdu z modułów multimedialnych.'
  ru: 'Запрос параметра автомобиля от мультимедийных модулей.'
  zh: '来自信息娱乐模块的车辆参数请求。'
  hu: 'Jármű paraméter kérés az infotainment moduloktól.'
  pt: 'Pedido de parâmetros do veículo dos nós de infoentretenimento.'
periodicity: ['trigger']
senders: ['ICSV', 'BTEL', 'OVIP']
receivers: ['BSI']
isotp:
  addressing: 'normal'

signals:
  VEHICLE_PARAMETER_STATUS_DATA:
    bits: '1.7-n'
    comment:
      en: 'Vehicle parameter status data'
      fr: 'Données d''état des paramètres véhicule'
      es: 'Datos de estado de los parámetros del vehículo'
      de: 'Statusdaten der Fahrzeugparameter'
      it: 'Dati di stato dei parametri veicolo'
      pl: 'Dane stanu parametrów pojazdu'
      ru: 'Данные состояния параметров автомобиля'
      zh: '车辆参数状态数据'
      hu: 'Jármű paraméter állapotadatai'
      pt: 'Dados de estado dos parâmetros do veículo'
    type: 'uint'
