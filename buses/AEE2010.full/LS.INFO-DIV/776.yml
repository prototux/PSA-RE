id: 0x776
name: 'FAULT_LOG_ARTIV'
type: 'can'
length: 8
comment:
  en: 'Diagnostic request sent to the BTT module by the body computer or the diagnostic socket interface module (MDS).'
  fr: 'Requête de diagnostic envoyée au module BTT par le BSI ou le module de prise diagnostic (MDS).'
  es: 'Solicitud de diagnóstico enviada al módulo BTT por la BSI o el módulo de la toma de diagnóstico (MDS).'
  de: 'Diagnoseanfrage an das BTT-Modul, gesendet vom BSI oder dem Diagnosesteckdosen-Schnittstellenmodul (MDS).'
  it: 'Richiesta diagnostica inviata al modulo BTT dal BSI o dal modulo interfaccia presa diagnosi (MDS).'
  pl: 'Żądanie diagnostyczne wysyłane do modułu BTT przez BSI lub moduł interfejsu gniazda diagnostycznego (MDS).'
  ru: 'Диагностический запрос, отправляемый модулю BTT блоком BSI или модулем интерфейса диагностического разъёма (MDS).'
  zh: '由车身控制器或诊断插座接口模块(MDS)向BTT模块发送的诊断请求。'
  hu: 'A BSI vagy a diagnosztikai csatlakozó interfészmodul (MDS) által a BTT modulnak küldött diagnosztikai kérés.'
  pt: 'Pedido de diagnóstico enviado ao módulo BTT pela BSI ou pelo módulo da tomada de diagnóstico (MDS).'
periodicity: ['trigger']
senders: ['BSI', 'MDS']
receivers: ['BSG']

signals:
  DIAGNOSTIC_DATA:
    bits: '1.7-8.0'
    comment:
      en: 'Diagnostic data'
      fr: 'Données de diagnostic'
      es: 'Datos de diagnóstico'
      de: 'Diagnosedaten'
      it: 'Dati diagnostici'
      pl: 'Dane diagnostyczne'
      ru: 'Диагностические данные'
      zh: '诊断数据'
      hu: 'Diagnosztikai adatok'
      pt: 'Dados de diagnóstico'
    type: 'uint'
