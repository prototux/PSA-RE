      pl: 'Bufor wielokrotnego żądania danych dynamicznych Open Display Interface (ODI) dla ekranu centralnego'
      ru: 'Буфер множественного запроса динамических данных Open Display Interface (ODI) для центрального дисплея'
      zh: '中控屏Open Display Interface(ODI)动态数据多重请求缓冲区'
      hu: 'Open Display Interface (ODI) dinamikus adat többszörös kérés puffer a középső kijelzőhöz'
