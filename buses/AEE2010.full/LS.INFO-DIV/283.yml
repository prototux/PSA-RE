id: 0x283
name: 'ODI_DYNAMIC_DATA_MULTI_REQUEST_BUFFER'
type: 'can'
length: 8
comment:
  en: 'Opaque data buffer of the embedded diagnostics interface (ODI) between the telematics unit and the diagnostic tool: dynamic-data multiple request.'
  fr: 'Tampon de données opaque de l''interface de diagnostic embarquée (ODI) entre le boîtier télématique et l''outil de diagnostic : requête multiple de données dynamiques.'
  es: 'Buffer de datos opaco de la interfaz de diagnóstico embebida (ODI) entre la unidad telemática y la herramienta de diagnóstico: solicitud multiple de datos dinámicos.'
  de: 'Undurchsichtiger Datenpuffer der eingebetteten Diagnoseschnittstelle (ODI) zwischen Telematikeinheit und Diagnosetool: Mehrfachanfrage dynamischer Daten.'
  it: 'Buffer di dati opaco dell''interfaccia di diagnosi integrata (ODI) tra l''unità telematica e lo strumento di diagnosi: richiesta multipla dati dinamici.'
  pl: 'Nieprzejrzysty bufor danych wbudowanego interfejsu diagnostycznego (ODI) między modułem telematycznym a narzędziem diagnostycznym: wielokrotne zadanie danych dynamicznych.'
  ru: 'Непрозрачный буфер данных встроенного диагностического интерфейса (ODI) между телематическим блоком и диагностическим инструментом: множественный запрос динамических данных.'
  zh: '远程信息处理单元与诊断工具之间嵌入式诊断接口(ODI)的不透明数据缓冲区:动态数据多重请求。'
  hu: 'A telematikai egység és a diagnosztikai eszköz közötti beágyazott diagnosztikai interfész (ODI) átláthatatlan adatpufferje: többszörös dinamikusadat-kérés.'
  pt: 'Buffer de dados opaco da interface de diagnóstico embutida (ODI) entre a unidade telemática e a ferramenta de diagnóstico: pedido múltiplo de dados dinâmicos.'
periodicity: ['trigger']
senders: ['BTEL']
receivers: ['MDS']

