id: 0x758
name: 'BOP_DIAG_REQUEST'
type: 'can'
length: 8
comment:
  en: 'Diagnostic request sent to the BOP node by the diagnostic socket interface module (MDS).'
  fr: 'Requête de diagnostic envoyée au nœud BOP par le module de prise diagnostic (MDS).'
  es: 'Solicitud de diagnóstico enviada al nodo BOP por el módulo de la toma de diagnóstico (MDS).'
  de: 'Diagnoseanfrage an den BOP-Knoten, gesendet vom Diagnosesteckdosen-Schnittstellenmodul (MDS).'
  it: 'Richiesta diagnostica inviata al nodo BOP dal modulo interfaccia presa diagnosi (MDS).'
  pl: 'Żądanie diagnostyczne wysyłane do węzła BOP przez moduł interfejsu gniazda diagnostycznego (MDS).'
  ru: 'Диагностический запрос, отправляемый узлу BOP модулем интерфейса диагностического разъёма (MDS).'
  zh: '诊断插座接口模块(MDS)向BOP节点发送的诊断请求。'
  hu: 'A diagnosztikai csatlakozó interfészmodul (MDS) által a BOP csomópontnak küldött diagnosztikai kérés.'
  pt: 'Pedido de diagnóstico enviado ao nó BOP pelo módulo da tomada de diagnóstico (MDS).'
periodicity: ['trigger']
senders: ['MDS']
receivers: ['BSI']

signals:
  DIAGNOSTIC_DATA:
    bits: '1.7-8.0'
    comment:
      en: 'Diagnostic data'
      fr: 'Données de diagnostic'
      es: 'Datos de diagnóstico'
      de: 'Diagnosedaten'
      it: 'Dati diagnostici'
      pl: 'Dane diagnostyczne'
      ru: 'Диагностические данные'
      zh: '诊断数据'
      hu: 'Diagnosztikai adatok'
      pt: 'Dados de diagnóstico'
    type: 'uint'
