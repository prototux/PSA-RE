id: 0x303
name: 'ODI_ACTION_BUFFER'
type: 'can'
length: 8
comment:
  en: 'Opaque data buffer of the embedded diagnostics interface (ODI) between the telematics unit and the diagnostic tool: generic action data.'
  fr: 'Tampon de données opaque de l''interface de diagnostic embarquée (ODI) entre le boîtier télématique et l''outil de diagnostic : données d''action génériques.'
  es: 'Buffer de datos opaco de la interfaz de diagnóstico embebida (ODI) entre la unidad telemática y la herramienta de diagnóstico: datos de acción genéricos.'
  de: 'Undurchsichtiger Datenpuffer der eingebetteten Diagnoseschnittstelle (ODI) zwischen Telematikeinheit und Diagnosetool: allgemeine Aktionsdaten.'
  it: 'Buffer di dati opaco dell''interfaccia di diagnosi integrata (ODI) tra l''unità telematica e lo strumento di diagnosi: dati di azione generici.'
  pl: 'Nieprzejrzysty bufor danych wbudowanego interfejsu diagnostycznego (ODI) między modułem telematycznym a narzędziem diagnostycznym: ogólne dane akcji.'
  ru: 'Непрозрачный буфер данных встроенного диагностического интерфейса (ODI) между телематическим блоком и диагностическим инструментом: общие данные действия.'
  zh: '远程信息处理单元与诊断工具之间嵌入式诊断接口(ODI)的不透明数据缓冲区:通用动作数据。'
  hu: 'A telematikai egység és a diagnosztikai eszköz közötti beágyazott diagnosztikai interfész (ODI) átláthatatlan adatpufferje: általános műveleti adatok.'
  pt: 'Buffer de dados opaco da interface de diagnóstico embutida (ODI) entre a unidade telemática e a ferramenta de diagnóstico: dados de ação genéricos.'
periodicity: ['trigger']
senders: ['BTEL']
receivers: ['MDS']

