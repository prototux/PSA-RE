      de: 'Open-Display-Interface(ODI)-Aktionspuffer für das zentrale Display'
      it: 'Buffer di azione Open Display Interface (ODI) per il display centrale'
      pl: 'Bufor akcji Open Display Interface (ODI) dla ekranu centralnego'
      ru: 'Буфер действий Open Display Interface (ODI) для центрального дисплея'
      zh: '中控屏Open Display Interface(ODI)动作缓冲区'
      hu: 'Open Display Interface (ODI) művelet-puffer a középső kijelzőhöz'
      pt: 'Buffer de ação Open Display Interface (ODI) para o ecrã central'
