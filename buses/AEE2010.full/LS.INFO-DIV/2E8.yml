id: 0x2E8
name: 'ENGINE_GEARBOX_DYNAMIC_DATA'
type: 'can'
length: 8
comment:
  en: 'Elapsed and stopped time, and zero-emission time percentage, for the second saved trip.'
  fr: 'Temps écoulé et à l''arrêt, et pourcentage de temps en zéro émission, pour le second trajet enregistré.'
  es: 'Tiempo transcurrido y detenido, y porcentaje de tiempo en cero emisiones, para el segundo trayecto guardado.'
  de: 'Verstrichene und Stillstandszeit sowie Prozentsatz der emissionsfreien Zeit für die zweite gespeicherte Fahrt.'
  it: 'Tempo trascorso e di sosta, e percentuale di tempo a zero emissioni, per il secondo tragitto salvato.'
  pl: 'Czas trwania i postoju oraz procent czasu w trybie zeroemisyjnym dla drugiej zapisanej podróży.'
  ru: 'Прошедшее время и время остановки, а также процент времени в режиме нулевых выбросов для второй сохранённой поездки.'
  zh: '第二次保存行程的已用时间、停止时间及零排放时间百分比。'
  hu: 'Az eltelt és megállási idő, valamint a zéró kibocsátású idő százaléka a második elmentett útra.'
  pt: 'Tempo decorrido e parado, e percentagem de tempo em zero emissões, para o segundo trajeto guardado.'
periodicity: ['1000360ms']
senders: ['BSI']
receivers: ['OVIP', 'RAD']

signals:
  TRIP_DURATION_HOURS_TRIP2:
    bits: '1.7-2.5'
    comment:
      en: 'Hours component of the trip 2 duration'
      fr: 'Composante heures de la durée du trajet 2'
      es: 'Componente de horas de la duración del trayecto 2'
      de: 'Stundenanteil der Dauer der Fahrt 2'
      it: 'Componente ore della durata del percorso 2'
      pl: 'Składnik godzin czasu trwania trasy 2'
      ru: 'Часовая составляющая продолжительности поездки 2'
      zh: '行程2时长的小时部分'
      hu: 'A 2. út időtartamának óra összetevője'
      pt: 'Componente de horas da duração do trajeto 2'
    type: 'uint'
    factor: 1
    min: 0
    max: 2000
    units: 'h'
    invalid: 0x7FF
    default: 0x00

  TRIP_DURATION_MINUTES_TRIP2:
    bits: '2.4-3.7'
    comment:
      en: 'Minutes component of the trip 2 duration'
      fr: 'Composante minutes de la durée du trajet 2'
      es: 'Componente de minutos de la duración del trayecto 2'
      de: 'Minutenanteil der Dauer der Fahrt 2'
      it: 'Componente minuti della durata del percorso 2'
      pl: 'Składnik minut czasu trwania trasy 2'
      ru: 'Минутная составляющая продолжительности поездки 2'
      zh: '行程2时长的分钟部分'
      hu: 'A 2. út időtartamának perc összetevője'
      pt: 'Componente de minutos da duração do trajeto 2'
    type: 'uint'
    factor: 1
    min: 0
    max: 59
    units: 'min'
    invalid: 0x3F
    default: 0x00

  TRIP_DURATION_SECONDS_TRIP2:
    bits: '3.6-3.1'
    comment:
      en: 'Seconds component of the trip 2 duration'
      fr: 'Composante secondes de la durée du trajet 2'
      es: 'Componente de segundos de la duración del trayecto 2'
      de: 'Sekundenanteil der Dauer der Fahrt 2'
      it: 'Componente secondi della durata del percorso 2'
      pl: 'Składnik sekund czasu trwania trasy 2'
      ru: 'Секундная составляющая продолжительности поездки 2'
      zh: '行程2时长的秒部分'
      hu: 'A 2. út időtartamának másodperc összetevője'
      pt: 'Componente de segundos da duração do trajeto 2'
    type: 'uint'
    factor: 1
    min: 0
    max: 59
    units: 's'
    invalid: 0x3F
    default: 0x00

  UNUSED_1:
    bits: '3.0'
    unused: true

  ZEV_DURATION_HOURS_TRIP2:
    bits: '4.7-5.5'
    comment:
      en: 'Hours component of the ZEV (engine-off) duration for trip 2'
      fr: 'Composante heures de la durée en mode ZEV (moteur thermique éteint) du trajet 2'
      es: 'Componente de horas de la duración en modo ZEV (motor térmico apagado) del trayecto 2'
      de: 'Stundenanteil der ZEV-Dauer (Verbrennungsmotor aus) der Fahrt 2'
      it: 'Componente ore della durata in modalità ZEV (motore termico spento) del percorso 2'
      pl: 'Składnik godzin czasu w trybie ZEV (silnik spalinowy wyłączony) trasy 2'
      ru: 'Часовая составляющая длительности режима ZEV (двигатель выключен) поездки 2'
      zh: '行程2 ZEV模式(发动机关闭)时长的小时部分'
      hu: 'A 2. út ZEV (hőmotor kikapcsolva) időtartamának óra összetevője'
      pt: 'Componente de horas da duração em modo ZEV (motor térmico desligado) do trajeto 2'
    type: 'uint'
    factor: 1
    min: 0
    max: 2000
    units: 'h'
    invalid: 0x7FF
    default: 0x00

  ZEV_DURATION_MINUTES_TRIP2:
    bits: '5.4-6.7'
    comment:
      en: 'Minutes component of the ZEV (engine-off) duration for trip 2'
      fr: 'Composante minutes de la durée en mode ZEV (moteur thermique éteint) du trajet 2'
      es: 'Componente de minutos de la duración en modo ZEV (motor térmico apagado) del trayecto 2'
      de: 'Minutenanteil der ZEV-Dauer (Verbrennungsmotor aus) der Fahrt 2'
      it: 'Componente minuti della durata in modalità ZEV (motore termico spento) del percorso 2'
      pl: 'Składnik minut czasu w trybie ZEV (silnik spalinowy wyłączony) trasy 2'
      ru: 'Минутная составляющая длительности режима ZEV (двигатель выключен) поездки 2'
      zh: '行程2 ZEV模式(发动机关闭)时长的分钟部分'
      hu: 'A 2. út ZEV (hőmotor kikapcsolva) időtartamának perc összetevője'
      pt: 'Componente de minutos da duração em modo ZEV (motor térmico desligado) do trajeto 2'
    type: 'uint'
    factor: 1
    min: 0
    max: 59
    units: 'min'
    invalid: 0x3F
    default: 0x00

  ZEV_DURATION_SECONDS_TRIP2:
    bits: '6.6-6.1'
    comment:
      en: 'Seconds component of the ZEV (engine-off) duration for trip 2'
      fr: 'Composante secondes de la durée en mode ZEV (moteur thermique éteint) du trajet 2'
      es: 'Componente de segundos de la duración en modo ZEV (motor térmico apagado) del trayecto 2'
      de: 'Sekundenanteil der ZEV-Dauer (Verbrennungsmotor aus) der Fahrt 2'
      it: 'Componente secondi della durata in modalità ZEV (motore termico spento) del percorso 2'
      pl: 'Składnik sekund czasu w trybie ZEV (silnik spalinowy wyłączony) trasy 2'
      ru: 'Секундная составляющая длительности режима ZEV (двигатель выключен) поездки 2'
      zh: '行程2 ZEV模式(发动机关闭)时长的秒部分'
      hu: 'A 2. út ZEV (hőmotor kikapcsolva) időtartamának másodperc összetevője'
      pt: 'Componente de segundos da duração em modo ZEV (motor térmico desligado) do trajeto 2'
    type: 'uint'
    factor: 1
    min: 0
    max: 59
    units: 's'
    invalid: 0x3F
    default: 0x00

  UNUSED_2:
    bits: '6.0'
    unused: true

  ZEV_DURATION_PERCENT_TRIP2:
    bits: '7.7-7.1'
    comment:
      en: 'Percentage of time spent in ZEV mode relative to total time of trip 2'
      fr: 'Pourcentage du temps passé en mode ZEV par rapport au temps total du trajet 2'
      es: 'Porcentaje del tiempo en modo ZEV respecto al tiempo total del trayecto 2'
      de: 'Prozentsatz der im ZEV-Modus verbrachten Zeit bezogen auf die Gesamtzeit der Fahrt 2'
      it: 'Percentuale del tempo trascorso in modalità ZEV rispetto al tempo totale del percorso 2'
      pl: 'Procent czasu spędzonego w trybie ZEV w stosunku do całkowitego czasu trasy 2'
      ru: 'Процент времени в режиме ZEV относительно общего времени поездки 2'
      zh: 'ZEV模式时间占行程2总时间的百分比'
      hu: 'A ZEV módban töltött idő százaléka a 2. út teljes idejéhez viszonyítva'
      pt: 'Percentagem do tempo passado em modo ZEV em relação ao tempo total do trajeto 2'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0x7F
    default: 0x00

  UNUSED_3:
    bits: '7.0'
    unused: true

  ZEV_DURATION_PERCENT_TRIP2_ADJUSTED:
    bits: '8.7-8.1'
    comment:
      en: 'Adjusted percentage of time spent in ZEV mode for trip 2'
      fr: 'Pourcentage corrigé du temps passé en mode ZEV pour le trajet 2'
      es: 'Porcentaje corregido del tiempo en modo ZEV para el trayecto 2'
      de: 'Angepasster Prozentsatz der im ZEV-Modus verbrachten Zeit der Fahrt 2'
      it: 'Percentuale corretta del tempo trascorso in modalità ZEV per il percorso 2'
