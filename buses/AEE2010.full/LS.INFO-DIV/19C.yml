id: 0x19C
name: 'ECO_DRIVING_ADVICE'
type: 'can'
length: 8
comment:
  en: 'Eco-driving coach advice messages: distance/time until the next free-wheeling opportunity and active advice text flags.'
  fr: 'Messages de conseil du coach éco-conduite : distance/temps jusqu''à la prochaine roue libre et indicateurs de conseils actifs.'
  es: 'Mensajes de consejo del coach de conducción eficiente: distancia/tiempo hasta la próxima rueda libre e indicadores de consejos activos.'
  de: 'Eco-Fahrcoach-Ratschläge: Entfernung/Zeit bis zum nächsten Freilaufen und aktive Ratschlagstext-Flags.'
  it: 'Messaggi di consiglio del coach di eco-guida: distanza/tempo alla prossima ruota libera e flag di consigli attivi.'
  pl: 'Komunikaty porad trenera ekojazdy: dystans/czas do następnej okazji jazdy na wybiegu oraz flagi aktywnych porad.'
  ru: 'Советы эко-тренера вождения: расстояние/время до следующей возможности движения накатом и флаги активных советов.'
  zh: '经济驾驶建议消息:距下次滑行机会的距离/时间及激活建议文本标志。'
  hu: 'Az ökovezetési edző tanácsüzenetei: távolság/idő a következő szabadonfutási lehetőségig és az aktív tanácsszövegek jelzői.'
  pt: 'Mensagens de conselho do coach de condução económica: distância/tempo até à próxima oportunidade de marcha em roda livre e indicadores de conselhos ativos.'
periodicity: ['1000330ms']
senders: ['BSI']
receivers: ['BTEL', 'OVIP', 'CMB', 'MATT']

signals:
  ECOCOACH_FREEWHEEL_DISTANCE:
    bits: '1.7-2.2'
    comment:
      en: 'Distance covered in freewheeling during the Eco Coaching trip'
      fr: 'Distance parcourue en roue libre pendant le trajet Eco Coaching'
      es: 'Distancia recorrida en rueda libre durante el trayecto Eco Coaching'
      de: 'Im Freilauf zurückgelegte Strecke während der Eco-Coaching-Fahrt'
      it: 'Distanza percorsa in folle durante il percorso Eco Coaching'
      pl: 'Dystans przejechany na wybiegu podczas trasy Eco Coaching'
      ru: 'Расстояние, пройденное накатом во время поездки Eco Coaching'
      zh: 'Eco Coaching行程中滑行(空挡)行驶的距离'
      hu: 'Az Eco Coaching út során kifutásban (szabadonfutásban) megtett távolság'
      pt: 'Distância percorrida em roda livre durante o trajeto Eco Coaching'
    type: 'uint'
    factor: 1
    min: 0
    max: 10000
    units: 'km'
    invalid: 0x3FFF
    default: 0x00

  UNUSED_1:
    bits: '2.1-2.0'
    unused: true

  ECOCOACH_FREEWHEEL_TIME:
    bits: '3.7-4.1'
    comment:
      en: 'Time spent freewheeling during the Eco Coaching trip'
      fr: 'Temps passé en roue libre pendant le trajet Eco Coaching'
      es: 'Tiempo en rueda libre durante el trayecto Eco Coaching'
      de: 'Im Freilauf verbrachte Zeit während der Eco-Coaching-Fahrt'
      it: 'Tempo trascorso in folle durante il percorso Eco Coaching'
      pl: 'Czas spędzony na wybiegu podczas trasy Eco Coaching'
      ru: 'Время, проведённое накатом во время поездки Eco Coaching'
      zh: 'Eco Coaching行程中滑行(空挡)时间'
      hu: 'Az Eco Coaching út során kifutásban töltött idő'
      pt: 'Tempo passado em roda livre durante o trajeto Eco Coaching'
    type: 'uint'
    factor: 1
    min: 0
    max: 32765
    units: 'min'
    invalid: 0x7FFF
