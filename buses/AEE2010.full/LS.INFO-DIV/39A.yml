id: 0x39A
name: 'ZEV_TRIP_INFO_2'
type: 'can'
length: 8
comment:
  en: 'Average electric-mode consumption history (six periods) and estimated charge rate.'
  fr: 'Historique de consommation moyenne en mode électrique (six périodes) et vitesse de charge estimée.'
  es: 'Historial de consumo medio en modo eléctrico (seis periodos) y velocidad de carga estimada.'
  de: 'Verlauf des durchschnittlichen Elektromodus-Verbrauchs (sechs Zeiträume) und geschätzte Laderate.'
  it: 'Cronologia del consumo medio in modalità elettrica (sei periodi) e velocità di ricarica stimata.'
  pl: 'Historia średniego zużycia w trybie elektrycznym (sześć okresów) i szacowana szybkość ładowania.'
  ru: 'История среднего расхода в электрорежиме (шесть периодов) и оценочная скорость зарядки.'
  zh: '电动模式平均能耗历史(六个周期)及估算充电速率。'
  hu: 'Az elektromos üzemmód átlagos fogyasztási előzményei (hat időszak) és a becsült töltési sebesség.'
  pt: 'Histórico de consumo médio em modo elétrico (seis períodos) e velocidade de carga estimada.'
periodicity: ['1000390ms']
senders: ['BSI']
receivers: ['CMB', 'OVIP']

signals:
  ZEV_AVERAGE_CONSUMPTION_PERIOD_1:
    bits: '1.7-1.2'
    comment:
      en: 'Average electric power consumption for time period 1'
      fr: 'Consommation électrique moyenne pour la période 1'
      es: 'Consumo eléctrico medio para el período 1'
      de: 'Durchschnittlicher Stromverbrauch für Zeitraum 1'
      it: 'Consumo elettrico medio per il periodo 1'
      pl: 'Średnie zużycie energii elektrycznej w okresie 1'
      ru: 'Среднее потребление электроэнергии за период 1'
      zh: '第1时段的平均耗电量'
      hu: 'Átlagos elektromos fogyasztás a(z) 1. időszakban'
      pt: 'Consumo elétrico médio para o período 1'
    type: 'uint'
    factor: 1
    min: 0
    max: 50
    units: 'kWh/100km'
    invalid: 0x3F
    default: 0x3F

