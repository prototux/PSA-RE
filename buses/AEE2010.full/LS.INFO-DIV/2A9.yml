id: 0x2A9
name: 'PHONE_STATUS_EXPORT'
type: 'can'
length: 3
comment:
  en: 'Mobile phone status relayed to the display: battery level, signal strength and network type.'
  fr: 'État du téléphone mobile relayé vers l''écran : niveau de batterie, force du signal et type de réseau.'
  es: 'Estado del teléfono móvil retransmitido a la pantalla: nivel de batería, intensidad de señal y tipo de red.'
  de: 'An das Display weitergeleiteter Mobiltelefonstatus: Akkustand, Signalstärke und Netzwerktyp.'
  it: 'Stato del telefono cellulare inoltrato al display: livello batteria, intensità del segnale e tipo di rete.'
  pl: 'Stan telefonu komórkowego przekazywany do wyświetlacza: poziom baterii, siła sygnału i typ sieci.'
  ru: 'Состояние мобильного телефона, передаваемое на дисплей: уровень заряда, сила сигнала и тип сети.'
  zh: '转发给显示屏的手机状态:电池电量、信号强度和网络类型。'
  hu: 'A kijelzőnek továbbított mobiltelefon-állapot: akkumulátorszint, jelerősség és hálózattípus.'
  pt: 'Estado do telemóvel retransmitido ao visor: nível de bateria, intensidade de sinal e tipo de rede.'
periodicity: ['1000525ms']
senders: ['ICSV', 'BTEL', 'OVIP']
receivers: ['CMB']

signals:
  UNUSED_1:
    bits: '1.7'
    unused: true

  PHONE_BATTERY_LEVEL:
    bits: '1.6-1.0'
    comment:
      en: 'Phone battery level'
      fr: 'Niveau de la batterie du téléphone'
      es: 'Nivel de batería del teléfono'
      de: 'Akkustand des Telefons'
      it: 'Livello della batteria del telefono'
      pl: 'Poziom baterii telefonu'
      ru: 'Уровень заряда батареи телефона'
      zh: '手机电池电量'
      hu: 'A telefon akkumulátorszintje'
      pt: 'Nível de bateria do telefone'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0x7F
    default: 0x7F

  UNUSED_2:
    bits: '2.7'
    unused: true

