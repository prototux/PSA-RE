id: 0x325
name: 'RADIO_MEDIA_STATUS'
type: 'can'
length: 4
comment:
  en: 'Radio media status: Bluetooth/CD/USB access, unreadable disk, and communication/file/USB/Bluetooth error flags.'
  fr: 'État média de l''autoradio : accès Bluetooth/CD/USB, disque illisible, et indicateurs d''erreur communication/fichier/USB/Bluetooth.'
  es: 'Estado multimedia de la radio: acceso Bluetooth/CD/USB, disco ilegible, e indicadores de error de comunicación/archivo/USB/Bluetooth.'
  de: 'Medienstatus des Radios: Bluetooth-/CD-/USB-Zugriff, unlesbare CD, sowie Kommunikations-/Datei-/USB-/Bluetooth-Fehlerkennzeichen.'
  it: 'Stato media della radio: accesso Bluetooth/CD/USB, disco illeggibile, e indicatori di errore comunicazione/file/USB/Bluetooth.'
  pl: 'Stan mediów radia: dostęp Bluetooth/CD/USB, nieczytelna płyta oraz flagi błędów komunikacji/pliku/USB/Bluetooth.'
  ru: 'Статус медиа радио: доступ Bluetooth/CD/USB, нечитаемый диск, флаги ошибок связи/файла/USB/Bluetooth.'
  zh: '收音机媒体状态:蓝牙/CD/USB存取、无法读取的光盘,以及通信/文件/USB/蓝牙错误标志。'
  hu: 'A rádió médiaállapota: Bluetooth/CD/USB hozzáférés, olvashatatlan lemez, valamint kommunikációs/fájl/USB/Bluetooth hibajelzők.'
  pt: 'Estado dos suportes da rádio: acesso Bluetooth/CD/USB, disco ilegível, e indicadores de erro de comunicação/ficheiro/USB/Bluetooth.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['500ms', 'trigger']
senders: ['RAD', 'ICSV']
receivers: ['CRT', 'FMUX', 'EMF']

