id: 0x3F1
name: 'CD_CHANGER_STATUS_ACK'
type: 'can'
length: 1
comment:
  en: 'Acknowledgement of a multi-frame CD changer status message.'
  fr: 'Accusé de réception d''un message multi-trames d''état du changeur de CD.'
  es: 'Acuse de recibo de un mensaje multitrama del estado del cambiador de CD.'
  de: 'Bestätigung einer mehrteiligen Statusnachricht des CD-Wechslers.'
  it: 'Conferma di ricezione di un messaggio multi-trama sullo stato del cambia CD.'
  pl: 'Potwierdzenie odbioru wieloramkowego komunikatu o stanie zmieniarki CD.'
  ru: 'Подтверждение многокадрового сообщения о состоянии CD-чейнджера.'
  zh: 'CD换碟机状态多帧消息的确认应答。'
  hu: 'A CD-váltó állapotát tartalmazó többkeretes üzenet nyugtázása.'
  pt: 'Confirmação de uma mensagem multi-trama de estado do leitor de CDs.'
periodicity: ['trigger']
senders: ['ICSV', 'BTEL', 'OVIP']
receivers: ['CDC']

signals:
  SEGMENTATION_ACK_STREAM:
    bits: '1.7-1.0'
    comment:
      en: 'Segmentation acknowledgment stream'
      fr: 'Flux d''accusé de réception de segmentation'
      es: 'Flujo de confirmación de segmentación'
      de: 'Segmentierungs-Quittungsstrom'
      it: 'Flusso di conferma della segmentazione'
      pl: 'Strumień potwierdzeń segmentacji'
      ru: 'Поток подтверждений сегментации'
      zh: '分段确认数据流'
      hu: 'Szegmentálási nyugtafolyam'
      pt: 'Fluxo de confirmação de segmentação'
    type: 'uint'
    min: 0
    max: 255
