  fr: 'Charge utile de paramètre véhicule (contenu dépendant du paramètre demandé).'
  es: 'Carga útil de parámetro del vehículo (contenido dependiente del parámetro solicitado).'
  de: 'Nutzdaten für Fahrzeugparameter (Inhalt abhängig vom angeforderten Parameter).'
  it: 'Payload del parametro veicolo (contenuto dipendente dal parametro richiesto).'
  pl: 'Dane parametru pojazdu (zawartość zależna od żądanego parametru).'
  ru: 'Полезная нагрузка параметра автомобиля (содержимое зависит от запрошенного параметра).'
  zh: '车辆参数数据有效载荷(内容取决于所请求的参数)。'
  hu: 'Járműparaméter-adat (a tartalom a kért paramétertől függ).'
