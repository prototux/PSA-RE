id: 0x131
name: 'AUDIO_SOURCE_COMMAND'
type: 'can'
length: 8
comment:
  en: 'CD player / audio source commands sent for network monitoring purposes: play/stop, disc and track number, playback mode and random seek.'
  fr: 'Commandes du lecteur CD / source audio envoyées à des fins de surveillance réseau : lecture/arrêt, numéro de disque et de piste, mode de lecture et recherche aléatoire.'
  es: 'Órdenes del lector de CD / fuente de audio enviadas con fines de supervisión de red: reproducción/parada, número de disco y de pista, modo de reproducción y búsqueda aleatoria.'
  de: 'CD-Player-/Audioquellenbefehle, zu Netzwerküberwachungszwecken gesendet: Wiedergabe/Stopp, Disc- und Titelnummer, Wiedergabemodus und Zufallssuche.'
  it: 'Comandi del lettore CD / sorgente audio inviati a scopo di sorveglianza della rete: riproduzione/arresto, numero di disco e traccia, modalità di riproduzione e ricerca casuale.'
  pl: 'Polecenia odtwarzacza CD / źródła audio wysyłane w celach nadzoru sieci: odtwarzanie/zatrzymanie, numer płyty i ścieżki, tryb odtwarzania i losowe wyszukiwanie.'
  ru: 'Команды CD-проигрывателя / аудиоисточника, отправляемые в целях сетевого контроля: воспроизведение/остановка, номер диска и трека, режим воспроизведения и случайный поиск.'
  zh: '出于网络监控目的发送的CD播放器/音频源命令：播放/停止、碟片及曲目编号、播放模式及随机搜索。'
  hu: 'A CD-lejátszó/audioforrás parancsai, hálózatfelügyeleti célból küldve: lejátszás/leállítás, lemez- és számsorszám, lejátszási mód és véletlenszerű keresés.'
  pt: 'Comandos do leitor de CD / fonte áudio enviados para fins de monitorização da rede: reprodução/paragem, número de disco e faixa, modo de reprodução e procura aleatória.'
observations:
  en: 'On state change of: RANDOM_TABLE_SEEK, RANDOM_TRACK_RESTART_REQUEST, CD_CHANGER_COMMAND, CD_CHANGER_COMMAND_SERIES, DISC_NUMBER_COMMAND, TRACK_NUMBER_SELECT, CD_CHANGER_LIST_MODE, VALIDATED_ITEM_NUMBER, CD_CHANGER_KNOB_STEP_COUNTER, LIST_JUMP_REQUEST'
  fr: 'Sur changement d''état de : RANDOM_TABLE_SEEK, RANDOM_TRACK_RESTART_REQUEST, CD_CHANGER_COMMAND, CD_CHANGER_COMMAND_SERIES, DISC_NUMBER_COMMAND, TRACK_NUMBER_SELECT, CD_CHANGER_LIST_MODE, VALIDATED_ITEM_NUMBER, CD_CHANGER_KNOB_STEP_COUNTER, LIST_JUMP_REQUEST'
  es: 'Al cambiar el estado de: RANDOM_TABLE_SEEK, RANDOM_TRACK_RESTART_REQUEST, CD_CHANGER_COMMAND, CD_CHANGER_COMMAND_SERIES, DISC_NUMBER_COMMAND, TRACK_NUMBER_SELECT, CD_CHANGER_LIST_MODE, VALIDATED_ITEM_NUMBER, CD_CHANGER_KNOB_STEP_COUNTER, LIST_JUMP_REQUEST'
  de: 'Bei Statusänderung von: RANDOM_TABLE_SEEK, RANDOM_TRACK_RESTART_REQUEST, CD_CHANGER_COMMAND, CD_CHANGER_COMMAND_SERIES, DISC_NUMBER_COMMAND, TRACK_NUMBER_SELECT, CD_CHANGER_LIST_MODE, VALIDATED_ITEM_NUMBER, CD_CHANGER_KNOB_STEP_COUNTER, LIST_JUMP_REQUEST'
  it: 'Al cambiamento di stato di: RANDOM_TABLE_SEEK, RANDOM_TRACK_RESTART_REQUEST, CD_CHANGER_COMMAND, CD_CHANGER_COMMAND_SERIES, DISC_NUMBER_COMMAND, TRACK_NUMBER_SELECT, CD_CHANGER_LIST_MODE, VALIDATED_ITEM_NUMBER, CD_CHANGER_KNOB_STEP_COUNTER, LIST_JUMP_REQUEST'
  pl: 'Wysyłane przy zmianie stanu: RANDOM_TABLE_SEEK, RANDOM_TRACK_RESTART_REQUEST, CD_CHANGER_COMMAND, CD_CHANGER_COMMAND_SERIES, DISC_NUMBER_COMMAND, TRACK_NUMBER_SELECT, CD_CHANGER_LIST_MODE, VALIDATED_ITEM_NUMBER, CD_CHANGER_KNOB_STEP_COUNTER, LIST_JUMP_REQUEST'
  ru: 'При изменении состояния: RANDOM_TABLE_SEEK, RANDOM_TRACK_RESTART_REQUEST, CD_CHANGER_COMMAND, CD_CHANGER_COMMAND_SERIES, DISC_NUMBER_COMMAND, TRACK_NUMBER_SELECT, CD_CHANGER_LIST_MODE, VALIDATED_ITEM_NUMBER, CD_CHANGER_KNOB_STEP_COUNTER, LIST_JUMP_REQUEST'
  zh: '当SEEK_RANDOM_CDC, RANDOM_TRACK_RESTART_REQUEST, CD_CHANGER_COMMAND, CD_CHANGER_COMMAND_SERIES, DISC_NUMBER_COMMAND, TRACK_NUMBER_SELECT, CD_CHANGER_LIST_MODE, VALIDATED_ITEM_NUMBER, CD_CHANGER_KNOB_STEP_COUNTER, DMD_SAUT_LISTE状态变化时'
  hu: 'A(z) RANDOM_TABLE_SEEK, RANDOM_TRACK_RESTART_REQUEST, CD_CHANGER_COMMAND, CD_CHANGER_COMMAND_SERIES, DISC_NUMBER_COMMAND, TRACK_NUMBER_SELECT, CD_CHANGER_LIST_MODE, VALIDATED_ITEM_NUMBER, CD_CHANGER_KNOB_STEP_COUNTER, LIST_JUMP_REQUEST állapotváltozásakor'
  pt: 'Na mudança de estado de: RANDOM_TABLE_SEEK, RANDOM_TRACK_RESTART_REQUEST, CD_CHANGER_COMMAND, CD_CHANGER_COMMAND_SERIES, DISC_NUMBER_COMMAND, TRACK_NUMBER_SELECT, CD_CHANGER_LIST_MODE, VALIDATED_ITEM_NUMBER, CD_CHANGER_KNOB_STEP_COUNTER, LIST_JUMP_REQUEST'
periodicity: ['100ms', 'trigger']
senders: ['ICSV', 'BTEL', 'RAD', 'OVIP']
receivers: ['CDC']

