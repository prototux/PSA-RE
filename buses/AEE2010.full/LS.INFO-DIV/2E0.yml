id: 0x2E0
name: 'CLIMATE_PRECONDITIONING_SCHEDULE'
type: 'can'
length: 7
comment:
  en: 'Preconditioning (cabin climate scheduling) profile information, defined by the profile message structure.'
  fr: 'Informations de profil de préconditionnement (programmation climatique), définies par la structure du message profils.'
  es: 'Información de perfil de preacondicionamiento (programación climática), definida por la estructura del mensaje de perfiles.'
  de: 'Profilinformationen zur Vorklimatisierung (Klimaprogrammierung), definiert durch die Struktur der Profilnachricht.'
  it: 'Informazioni di profilo di precondizionamento (programmazione climatica), definite dalla struttura del messaggio profili.'
  pl: 'Informacje profilu wstępnej klimatyzacji (harmonogram klimatyzacji), zdefiniowane przez strukturę komunikatu profili.'
  ru: 'Информация профиля предварительного кондиционирования (расписание климата), определяемая структурой сообщения профилей.'
  zh: '预调节（座舱空调排程）配置文件信息，由配置文件消息结构定义。'
  hu: 'Az előkondicionálás (klímaütemezés) profiladatai, a profilüzenet szerkezete határozza meg.'
  pt: 'Informação de perfil de pré-condicionamento (programação da climatização do habitáculo), definida pela estrutura da mensagem de perfil.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['MDS', 'BTEL', 'OVIP']

