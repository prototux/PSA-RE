      de: 'Verfügbarkeit der Statusinformation des Klimavorkonditionierungsprogramms'
      it: 'Disponibilità dell''informazione di stato del programma di preclimatizzazione'
      pl: 'Dostępność informacji o stanie programu klimatyzacji wstępnej'
      ru: 'Доступность информации о состоянии программы предварительного кондиционирования'
      zh: '空调预处理程序状态信息的可用性'
      hu: 'A klíma-előkondicionálási program állapotinformációjának elérhetősége'
      pt: 'Disponibilidade da informação de estado do programa de pré-condicionamento climático'
