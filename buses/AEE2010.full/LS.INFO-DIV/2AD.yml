id: 0x2AD
name: 'CLIMATE_HMI_COMMAND'
type: 'can'
length: 8
comment:
  en: 'Commands sent by the BSI to the climate control: cabin air purifier level and state, filter/cabin cleaning states, ionizer command, air intake, blower and central temperature setpoints.'
  fr: 'Commandes envoyées par la BSI à la climatisation : niveau et état du purificateur d''air habitacle, états de nettoyage du filtre/habitacle, commande ioniseur, consignes d''entrée d''air, de pulseur et de température centrale.'
  es: 'Órdenes enviadas por la BSI a la climatización: nivel y estado del purificador de aire del habitáculo, estados de limpieza del filtro/habitáculo, orden del ionizador, consignas de entrada de aire, ventilador y temperatura central.'
  de: 'Von der BSI an die Klimaanlage gesendete Befehle: Innenraumluftreiniger-Stufe und -Zustand, Filter-/Innenraumreinigungszustände, Ionisatorbefehl, Sollwerte für Lufteinlass, Gebläse und Zentraltemperatur.'
  it: 'Comandi inviati dalla BSI al climatizzatore: livello e stato del purificatore d''aria dell''abitacolo, stati di pulizia del filtro/abitacolo, comando dello ionizzatore, setpoint di presa d''aria, ventola e temperatura centrale.'
  pl: 'Polecenia wysyłane przez BSI do klimatyzacji: poziom i stan oczyszczacza powietrza w kabinie, stany czyszczenia filtra/kabiny, polecenie jonizatora, zadany wlot powietrza, dmuchawa i temperatura centralna.'
  ru: 'Команды, отправляемые BSI на климат-контроль: уровень и состояние очистителя воздуха салона, состояния очистки фильтра/салона, команда ионизатора, заданные значения забора воздуха, вентилятора и центральной температуры.'
  zh: '由BSI发送给空调系统的命令：座舱空气净化器等级与状态、滤芯/座舱清洁状态、离子发生器命令、进气、鼓风机及中央温度设定值。'
  hu: 'A BSI klímavezérlő parancsai: a beltéri légtisztító szintje és állapota, a szűrő/utastér tisztítási állapotai, ionizátorparancs, valamint a levegőbeömlés, a fúvóka és a központi hőmérséklet alapjelei.'
  pt: 'Comandos enviados pela BSI ao climatizador: nível e estado do purificador de ar do habitáculo, estados de filtro/limpeza do habitáculo, comando do ionizador, entrada de ar, ventilador e pontos de ajuste de temperatura central.'
observations:
  en: 'On state change of: FRONT_BLOWER_MINUS_STATE, FRONT_BLOWER_PLUS_SWITCH_STATE, REAR_LEFT_BLOWER_MINUS_STATE, REAR_BLOWER_PLUS_SWITCH_STATE, AIR_INLET_SETPOINT, FRONT_BLOWER_MOTOR_SETPOINT, LUCH_WARNING_LAMP, IONIZER_STATE, CABIN_AIR_FILTER_STATE, CABIN_AIR_PURIFIER_STATE, CABIN_AIR_PURIFICATION_STATE'
  fr: 'Sur changement d''état de : FRONT_BLOWER_MINUS_STATE, FRONT_BLOWER_PLUS_SWITCH_STATE, REAR_LEFT_BLOWER_MINUS_STATE, REAR_BLOWER_PLUS_SWITCH_STATE, AIR_INLET_SETPOINT, FRONT_BLOWER_MOTOR_SETPOINT, LUCH_WARNING_LAMP, IONIZER_STATE, CABIN_AIR_FILTER_STATE, CABIN_AIR_PURIFIER_STATE, CABIN_AIR_PURIFICATION_STATE'
  es: 'Al cambiar el estado de: FRONT_BLOWER_MINUS_STATE, FRONT_BLOWER_PLUS_SWITCH_STATE, REAR_LEFT_BLOWER_MINUS_STATE, REAR_BLOWER_PLUS_SWITCH_STATE, AIR_INLET_SETPOINT, FRONT_BLOWER_MOTOR_SETPOINT, LUCH_WARNING_LAMP, IONIZER_STATE, CABIN_AIR_FILTER_STATE, CABIN_AIR_PURIFIER_STATE, CABIN_AIR_PURIFICATION_STATE'
  de: 'Bei Statusänderung von: FRONT_BLOWER_MINUS_STATE, FRONT_BLOWER_PLUS_SWITCH_STATE, REAR_LEFT_BLOWER_MINUS_STATE, REAR_BLOWER_PLUS_SWITCH_STATE, AIR_INLET_SETPOINT, FRONT_BLOWER_MOTOR_SETPOINT, LUCH_WARNING_LAMP, IONIZER_STATE, CABIN_AIR_FILTER_STATE, CABIN_AIR_PURIFIER_STATE, CABIN_AIR_PURIFICATION_STATE'
  it: 'Al cambiamento di stato di: FRONT_BLOWER_MINUS_STATE, FRONT_BLOWER_PLUS_SWITCH_STATE, REAR_LEFT_BLOWER_MINUS_STATE, REAR_BLOWER_PLUS_SWITCH_STATE, AIR_INLET_SETPOINT, FRONT_BLOWER_MOTOR_SETPOINT, LUCH_WARNING_LAMP, IONIZER_STATE, CABIN_AIR_FILTER_STATE, CABIN_AIR_PURIFIER_STATE, CABIN_AIR_PURIFICATION_STATE'
  pl: 'Wysyłane przy zmianie stanu: FRONT_BLOWER_MINUS_STATE, FRONT_BLOWER_PLUS_SWITCH_STATE, REAR_LEFT_BLOWER_MINUS_STATE, REAR_BLOWER_PLUS_SWITCH_STATE, AIR_INLET_SETPOINT, FRONT_BLOWER_MOTOR_SETPOINT, LUCH_WARNING_LAMP, IONIZER_STATE, CABIN_AIR_FILTER_STATE, CABIN_AIR_PURIFIER_STATE, CABIN_AIR_PURIFICATION_STATE'
  ru: 'При изменении состояния: FRONT_BLOWER_MINUS_STATE, FRONT_BLOWER_PLUS_SWITCH_STATE, REAR_LEFT_BLOWER_MINUS_STATE, REAR_BLOWER_PLUS_SWITCH_STATE, AIR_INLET_SETPOINT, FRONT_BLOWER_MOTOR_SETPOINT, LUCH_WARNING_LAMP, IONIZER_STATE, CABIN_AIR_FILTER_STATE, CABIN_AIR_PURIFIER_STATE, CABIN_AIR_PURIFICATION_STATE'
  zh: '当PULS_AV_MOINS, FRONT_BLOWER_PLUS_SWITCH_STATE, REAR_LEFT_BLOWER_MINUS_STATE, REAR_BLOWER_PLUS_SWITCH_STATE, AIR_INLET_SETPOINT, FRONT_BLOWER_MOTOR_SETPOINT, LUCH_WARNING_LAMP, IONIZER_STATE, CABIN_AIR_FILTER_STATE, CABIN_AIR_PURIFIER_STATE, CLEAN_CABIN_STATE状态变化时'
  hu: 'A(z) FRONT_BLOWER_MINUS_STATE, FRONT_BLOWER_PLUS_SWITCH_STATE, REAR_LEFT_BLOWER_MINUS_STATE, REAR_BLOWER_PLUS_SWITCH_STATE, AIR_INLET_SETPOINT, FRONT_BLOWER_MOTOR_SETPOINT, LUCH_WARNING_LAMP, IONIZER_STATE, CABIN_AIR_FILTER_STATE, CABIN_AIR_PURIFIER_STATE, CABIN_AIR_PURIFICATION_STATE állapotváltozásakor'
  pt: 'Na mudança de estado de: FRONT_BLOWER_MINUS_STATE, FRONT_BLOWER_PLUS_SWITCH_STATE, REAR_LEFT_BLOWER_MINUS_STATE, REAR_BLOWER_PLUS_SWITCH_STATE, AIR_INLET_SETPOINT, FRONT_BLOWER_MOTOR_SETPOINT, LUCH_WARNING_LAMP, IONIZER_STATE, CABIN_AIR_FILTER_STATE, CABIN_AIR_PURIFIER_STATE, CABIN_AIR_PURIFICATION_STATE'
periodicity: ['500ms', 'trigger']
