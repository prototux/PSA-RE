id: 0x35A
name: 'NAV_SPEED_SECTION_COMMAND'
type: 'can'
length: 8
comment:
  en: 'Navigation speed-limit section data sent to the powertrain ECU: activation, remaining distance and time, and distance to up to five upcoming speed sections.'
  fr: 'Données des tronçons de limitation de vitesse de la navigation envoyées au calculateur de motorisation : activation, distance et temps restants, et distance jusqu''à cinq tronçons de vitesse à venir.'
  es: 'Datos de los tramos de límite de velocidad de la navegación enviados a la centralita de motorización: activación, distancia y tiempo restantes, y distancia hasta cinco tramos de velocidad próximos.'
  de: 'Von der Navigation gesendete Geschwindigkeitsbegrenzungsabschnittsdaten an das Antriebssteuergerät: Aktivierung, verbleibende Distanz und Zeit sowie Distanz zu bis zu fünf kommenden Geschwindigkeitsabschnitten.'
  it: 'Dati dei tratti di limite di velocità della navigazione inviati alla centralina della motorizzazione: attivazione, distanza e tempo restanti, e distanza fino a cinque tratti di velocità futuri.'
  pl: 'Dane odcinków ograniczenia prędkości z nawigacji wysyłane do sterownika napędu: aktywacja, pozostały dystans i czas oraz odległość do maksymalnie pięciu nadchodzących odcinków prędkości.'
  ru: 'Данные участков ограничения скорости от навигации, отправляемые в ЭБУ силовой установки: активация, оставшееся расстояние и время, а также расстояние до пяти предстоящих участков скорости.'
  zh: '由导航发送给动力总成ECU的限速路段数据：激活状态、剩余距离和时间，以及最多五个即将到来的限速路段的距离。'
  hu: 'A navigáció sebességkorlátozási szakaszadatai, amelyeket a hajtáslánc-vezérlőegységnek küldenek: aktiválás, hátralévő táv és idő, valamint a táv legfeljebb öt közelgő sebességszakaszig.'
  pt: 'Dados de secções de limite de velocidade da navegação enviados à unidade de controlo do grupo motopropulsor: ativação, distância e tempo restantes, e distância até cinco secções de velocidade seguintes.'
periodicity: ['1000585ms']
senders: ['BTEL', 'OVIP']
receivers: ['BSI']

