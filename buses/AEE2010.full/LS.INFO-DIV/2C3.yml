id: 0x2C3
name: 'ODI_BUFFER_TO_TELEMATICS'
type: 'can'
length: 8
comment:
  en: 'Opaque data buffer of the embedded diagnostics interface (ODI) between the telematics unit and the diagnostic tool: data sent to the telematics unit.'
  fr: 'Tampon de données opaque de l''interface de diagnostic embarquée (ODI) entre le boîtier télématique et l''outil de diagnostic : données envoyées vers le boîtier télématique.'
  es: 'Buffer de datos opaco de la interfaz de diagnóstico embebida (ODI) entre la unidad telemática y la herramienta de diagnóstico: datos enviados a la unidad telemática.'
  de: 'Undurchsichtiger Datenpuffer der eingebetteten Diagnoseschnittstelle (ODI) zwischen Telematikeinheit und Diagnosetool: an die Telematikeinheit gesendete Daten.'
  it: 'Buffer di dati opaco dell''interfaccia di diagnosi integrata (ODI) tra l''unità telematica e lo strumento di diagnosi: dati inviati all''unità telematica.'
  pl: 'Nieprzejrzysty bufor danych wbudowanego interfejsu diagnostycznego (ODI) między modułem telematycznym a narzędziem diagnostycznym: dane wysyłane do modulu telematycznego.'
  ru: 'Непрозрачный буфер данных встроенного диагностического интерфейса (ODI) между телематическим блоком и диагностическим инструментом: данные, отправляемые телематическому блоку.'
  zh: '远程信息处理单元与诊断工具之间嵌入式诊断接口(ODI)的不透明数据缓冲区:发送给远程信息处理单元的数据。'
  hu: 'A telematikai egység és a diagnosztikai eszköz közötti beágyazott diagnosztikai interfész (ODI) átláthatatlan adatpufferje: a telematikai egységnek küldött adatok.'
  pt: 'Buffer de dados opaco da interface de diagnóstico embutida (ODI) entre a unidade telemática e a ferramenta de diagnóstico: dados enviados para a unidade telemática.'
periodicity: ['trigger']
senders: ['BTEL']
receivers: ['MDS']

signals:
  ODI_CENTERSTACK_TO_TELEMATICS_BUFFER:
    bits: '1.7-8.0'
    comment:
      en: 'Open Display Interface (ODI) buffer, center stack display to telematics unit'
      fr: 'Tampon Open Display Interface (ODI), de l''écran central vers le module télématique'
      es: 'Búfer Open Display Interface (ODI), de la pantalla central a la unidad telemática'
      de: 'Open-Display-Interface(ODI)-Puffer, zentrales Display zur Telematikeinheit'
      it: 'Buffer Open Display Interface (ODI), dal display centrale all''unità telematica'
      pl: 'Bufor Open Display Interface (ODI), z ekranu centralnego do modułu telematycznego'
      ru: 'Буфер Open Display Interface (ODI), от центрального дисплея к телематическому блоку'
      zh: 'Open Display Interface(ODI)缓冲区,从中控屏到远程信息处理单元'
      hu: 'Open Display Interface (ODI) puffer, a középső kijelzőtől a telematikai egységig'
      pt: 'Buffer Open Display Interface (ODI), do ecrã central para a unidade telemática'
    type: 'uint'
