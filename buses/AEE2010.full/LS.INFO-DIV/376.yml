id: 0x376
name: 'WIFI_INFO_REPLY_FLOW_CONTROL'
type: 'can-tp'
comment:
  en: 'ISO-TP flow control frame for the Wi-Fi info reply multi-frame reply (block size, flow status, separation time).'
  fr: 'Trame de contrôle de flux ISO-TP pour la réponse multi-trame Wi-Fi info reply (taille de bloc, état de flux, temps de séparation).'
  es: 'Trama de control de flujo ISO-TP para la respuesta multitrama Wi-Fi info reply (tamaño de bloque, estado de flujo, tiempo de separación).'
  de: 'ISO-TP-Flusssteuerungsrahmen für die Mehrfachrahmen-Antwort Wi-Fi info reply (Blockgröße, Flussstatus, Trennzeit).'
  it: 'Trama di controllo di flusso ISO-TP per la risposta multi-trama Wi-Fi info reply (dimensione blocco, stato di flusso, tempo di separazione).'
  pl: 'Ramka kontroli przepływu ISO-TP dla wieloramkowej odpowiedzi Wi-Fi info reply (rozmiar bloku, stan przepływu, czas separacji).'
  ru: 'Кадр управления потоком ISO-TP для многокадрового ответа Wi-Fi info reply (размер блока, статус потока, время разделения).'
  zh: '用于Wi-Fi info reply多帧应答的ISO-TP流控制帧(块大小、流状态、间隔时间)。'
  hu: 'ISO-TP folyamvezérlő keret a Wi-Fi info reply többkeretes válaszhoz (blokkméret, folyamallapot, elválasztási idő).'
  pt: 'Trama de controlo de fluxo ISO-TP para a resposta multi-trama de informação Wi-Fi (tamanho de bloco, estado de fluxo, tempo de separação).'
periodicity: ['trigger']
senders: ['BTEL', 'EMF', 'OVIP']
receivers: ['MDS']
isotp:
  addressing: 'normal'

signals:
  NPCI_HEADER:
    bits: '1.7-1.4'
    comment:
      en: 'NPCI header (per the OSEK-COM segmentation standard)'
      fr: 'En-tête NPCI (selon la norme de segmentation OSEK-COM)'
      es: 'Cabecera NPCI (según la norma de segmentación OSEK-COM)'
      de: 'NPCI-Header (gemäß dem OSEK-COM-Segmentierungsstandard)'
      it: 'Intestazione NPCI (secondo lo standard di segmentazione OSEK-COM)'
      pl: 'Nagłówek NPCI (zgodnie ze standardem segmentacji OSEK-COM)'
      ru: 'Заголовок NPCI (согласно стандарту сегментации OSEK-COM)'
      zh: 'NPCI 报头(依据 OSEK-COM 分段标准)'
      hu: 'NPCI fejléc (az OSEK-COM szegmentálási szabvány szerint)'
      pt: 'Cabeçalho NPCI (segundo a norma de segmentação OSEK-COM)'
    type: 'enum'
    mux_selector: true
    values:
      0x00:
        en: 'Single frame (SF)'
        fr: 'Single frame (SF)'
        es: 'Single frame (SF)'
        de: 'Single frame (SF)'
        it: 'Single frame (SF)'
        pl: 'Single frame (SF)'
        ru: 'Single frame (SF)'
        zh: 'Single frame (SF)'
        hu: 'Single frame (SF)'
        pt: 'Single frame (SF)'
      0x01:
        en: 'First frame (FF)'
        fr: 'First frame (FF)'
        es: 'First frame (FF)'
        de: 'First frame (FF)'
        it: 'First frame (FF)'
        pl: 'First frame (FF)'
        ru: 'First frame (FF)'
        zh: 'First frame (FF)'
        hu: 'First frame (FF)'
        pt: 'First frame (FF)'
      0x02:
        en: 'Consecutive frame (CF)'
        fr: 'Consecutive frame (CF)'
        es: 'Consecutive frame (CF)'
        de: 'Consecutive frame (CF)'
        it: 'Consecutive frame (CF)'
        pl: 'Consecutive frame (CF)'
        ru: 'Consecutive frame (CF)'
        zh: 'Consecutive frame (CF)'
        hu: 'Consecutive frame (CF)'
        pt: 'Consecutive frame (CF)'
      0x03:
        en: 'Flow control (FC)'
        fr: 'Flow control (FC)'
        es: 'Flow control (FC)'
        de: 'Flow control (FC)'
        it: 'Flow control (FC)'
        pl: 'Flow control (FC)'
        ru: 'Flow control (FC)'
        zh: 'Flow control (FC)'
        hu: 'Flow control (FC)'
        pt: 'Flow control (FC)'

  FLOW_STATUS:
    bits: '1.3-1.0'
    comment:
      en: 'Flow status (per the OSEK-COM segmentation standard)'
      fr: 'Flow Status (cf. norme de segmentation OSEK-COM)'
      es: 'Estado de flujo (según el estándar de segmentación OSEK-COM)'
      de: 'Flusssteuerungsstatus (gemäß dem OSEK-COM-Segmentierungsstandard)'
      it: 'Stato di flusso (secondo lo standard di segmentazione OSEK-COM)'
      pl: 'Stan przepływu (zgodnie ze standardem segmentacji OSEK-COM)'
      ru: 'Статус потока (согласно стандарту сегментации OSEK-COM)'
      zh: '流控制状态（依据 OSEK-COM 分段标准）'
      hu: 'Folyamvezérlési állapot (az OSEK-COM szegmentálási szabvány szerint)'
      pt: 'Estado de fluxo (segundo a norma de segmentação OSEK-COM)'
    type: 'enum'
    mux:
      selector: 'NPCI_HEADER'
      values: [0x03]
    values:
      0x00:
        en: 'Clear to send'
        fr: 'Prêt à émettre'
        es: 'Listo para enviar'
        de: 'Sendebereit'
        it: 'Pronto per la trasmissione'
        pl: 'Gotowość do wysyłania'
        ru: 'Готов к передаче'
        zh: '允许发送'
        hu: 'Küldésre kész'
        pt: 'Pronto a emitir'
      0x01:
        en: 'Wait'
        fr: 'Attendre'
        es: 'Esperar'
        de: 'Warten'
        it: 'Attendere'
        pl: 'Czekaj'
        ru: 'Подождите'
        zh: '等待'
        hu: 'Várakozás'
        pt: 'Aguardar'

  BLOCK_SIZE:
    bits: '2.7-2.0'
    comment:
      en: 'Block size (per the OSEK-COM segmentation standard)'
      fr: 'Bloc Size (cf. norme de segmentation OSEK-COM)'
      es: 'Tamaño de bloque (según el estándar de segmentación OSEK-COM)'
      de: 'Blockgröße (gemäß dem OSEK-COM-Segmentierungsstandard)'
      it: 'Dimensione del blocco (secondo lo standard di segmentazione OSEK-COM)'
      pl: 'Rozmiar bloku (zgodnie ze standardem segmentacji OSEK-COM)'
      ru: 'Размер блока (согласно стандарту сегментации OSEK-COM)'
      zh: '块大小（依据 OSEK-COM 分段标准）'
      hu: 'Blokkméret (az OSEK-COM szegmentálási szabvány szerint)'
      pt: 'Tamanho de bloco (conforme a norma de segmentação OSEK-COM)'
    type: 'uint'
    mux:
      selector: 'NPCI_HEADER'
      values: [0x03]

  MIN_SEPARATION_TIME:
    bits: '3.7-3.0'
    comment:
      en: 'Minimum separation time (per the OSEK-COM segmentation standard)'
      fr: 'Minimum Separation Time (cf. norme de segmentation OSEK-COM)'
      es: 'Tiempo mínimo de separación (según el estándar de segmentación OSEK-COM)'
      de: 'Mindesttrennzeit (gemäß dem OSEK-COM-Segmentierungsstandard)'
      it: 'Tempo minimo di separazione (secondo lo standard di segmentazione OSEK-COM)'
      pl: 'Minimalny czas separacji (zgodnie ze standardem segmentacji OSEK-COM)'
      ru: 'Минимальный интервал разделения (согласно стандарту сегментации OSEK-COM)'
      zh: '最小帧间隔时间（依据 OSEK-COM 分段标准）'
      hu: 'Minimális elválasztási idő (az OSEK-COM szegmentálási szabvány szerint)'
      pt: 'Tempo mínimo de separação (segundo a norma de segmentação OSEK-COM)'
    type: 'uint'
    mux:
      selector: 'NPCI_HEADER'
      values: [0x03]
