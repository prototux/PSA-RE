id: 0x3E8
name: 'ENGINE_ADIN_CONTROL_3'
type: 'can'
length: 8
comment:
  en: 'Cumulative distance driven in zero-emission (electric-only) mode for the current and previous two trips.'
  fr: 'Distance cumulée parcourue en mode zéro émission (tout électrique) pour le trajet en cours et les deux précédents.'
  es: 'Distancia acumulada recorrida en modo cero emisiones (todo eléctrico) para el trayecto actual y los dos anteriores.'
  de: 'Kumulierte im emissionsfreien (reinen Elektro-)Modus gefahrene Strecke für die aktuelle und die letzten zwei Fahrten.'
  it: 'Distanza cumulata percorsa in modalità a zero emissioni (tutta elettrica) per il tragitto in corso e i due precedenti.'
  pl: 'Skumulowany dystans przejechany w trybie zeroemisyjnym (czysto elektrycznym) dla bieżącej i dwóch poprzednich podróży.'
  ru: 'Накопленное расстояние, пройденное в режиме нулевых выбросов (только на электротяге) для текущей и двух предыдущих поездок.'
  zh: '当前及前两次行程中零排放(纯电动)模式下的累计行驶距离。'
  hu: 'A jelenlegi és az előző két útra vonatkozó, zéró kibocsátású (tisztán elektromos) üzemmódban megtett kumulált távolság.'
  pt: 'Distância acumulada percorrida em modo zero emissões (totalmente elétrico) para o trajeto atual e os dois anteriores.'
periodicity: ['1000730ms']
senders: ['BSI']
receivers: ['BTEL', 'OVIP', 'RAD']

signals:
  TRIP_DISTANCE_CURRENT:
    bits: '1.7-2.0'
    comment:
      en: 'Total distance of the current trip'
      fr: 'Distance totale du trajet en cours'
      es: 'Distancia total del trayecto actual'
      de: 'Gesamtstrecke der aktuellen Fahrt'
      it: 'Distanza totale del percorso in corso'
      pl: 'Całkowity dystans bieżącej trasy'
      ru: 'Общее расстояние текущей поездки'
      zh: '当前行程总距离'
      hu: 'A jelenlegi út teljes távolsága'
      pt: 'Distância total do trajeto atual'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 5000
    units: 'km'
    invalid: 0xFFFF
    default: 0x00

  ZEV_DISTANCE_CURRENT_TRIP:
    bits: '3.7-4.0'
    comment:
      en: 'Total distance of the current trip covered in ZEV mode'
      fr: 'Distance totale du trajet en cours parcourue en mode ZEV'
      es: 'Distancia total del trayecto actual recorrida en modo ZEV'
      de: 'Gesamtstrecke der aktuellen Fahrt im ZEV-Modus'
      it: 'Distanza totale del percorso in corso percorsa in modalità ZEV'
      pl: 'Całkowity dystans bieżącej trasy przejechany w trybie ZEV'
      ru: 'Общее расстояние текущей поездки, пройденное в режиме ZEV'
      zh: '当前行程中以ZEV模式行驶的总距离'
      hu: 'A jelenlegi út ZEV módban megtett teljes távolsága'
      pt: 'Distância total do trajeto atual percorrida em modo ZEV'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 5000
    units: 'km'
    invalid: 0xFFFF
    default: 0xFFFF

  ZEV_DISTANCE_TRIP1:
    bits: '5.7-6.0'
    comment:
      en: 'Total distance of trip 1 covered in ZEV mode'
      fr: 'Distance totale du trajet 1 parcourue en mode ZEV'
      es: 'Distancia total del trayecto 1 recorrida en modo ZEV'
      de: 'Gesamtstrecke der Fahrt 1 im ZEV-Modus'
      it: 'Distanza totale del percorso 1 percorsa in modalità ZEV'
      pl: 'Całkowity dystans trasy 1 przejechany w trybie ZEV'
      ru: 'Общее расстояние поездки 1, пройденное в режиме ZEV'
      zh: '行程1中以ZEV模式行驶的总距离'
      hu: 'Az 1. út ZEV módban megtett teljes távolsága'
      pt: 'Distância total do trajeto 1 percorrida em modo ZEV'
    type: 'uint'
    factor: 1
    min: 0
    max: 50000
    units: 'km'
    invalid: 0xFFFF
    default: 0xFFFF

  ZEV_DISTANCE_TRIP2:
    bits: '7.7-8.0'
    comment:
      en: 'Total distance of trip 2 covered in ZEV mode'
      fr: 'Distance totale du trajet 2 parcourue en mode ZEV'
      es: 'Distancia total del trayecto 2 recorrida en modo ZEV'
      de: 'Gesamtstrecke der Fahrt 2 im ZEV-Modus'
      it: 'Distanza totale del percorso 2 percorsa in modalità ZEV'
      pl: 'Całkowity dystans trasy 2 przejechany w trybie ZEV'
      ru: 'Общее расстояние поездки 2, пройденное в режиме ZEV'
      zh: '行程2中以ZEV模式行驶的总距离'
      hu: 'A 2. út ZEV módban megtett teljes távolsága'
      pt: 'Distância total do trajeto 2 percorrida em modo ZEV'
    type: 'uint'
    factor: 1
    min: 0
    max: 50000
    units: 'km'
    invalid: 0xFFFF
    default: 0xFFFF

alternatives:
  - note:
      en: 'Also observed with a period of 1000ms'
      fr: 'Aussi observée avec une période de 1000ms'
      es: 'También observada con un periodo de 1000ms'
      de: 'Auch mit einer Periode von 1000ms beobachtet'
      it: 'Osservata anche con un periodo di 1000ms'
      pl: 'Obserwowana także z okresem 1000ms'
      ru: 'Также наблюдалась с периодом 1000ms'
      zh: '也观察到周期为1000ms'
      hu: 'Megfigyelve 1000ms periódussal is'
      pt: 'Também observada com um período de 1000ms'
    periodicity: ['1000ms']
