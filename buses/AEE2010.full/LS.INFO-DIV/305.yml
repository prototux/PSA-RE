id: 0x305
name: 'STEERING_WHEEL_ANGLE'
type: 'can-tp'
comment:
  en: 'Multi-frame payload carrying the dashcam''s recorded video list to the display.'
  fr: 'Charge utile multi-trame transportant la liste des vidéos enregistrées par le dashcam vers l''écran.'
  es: 'Carga útil multitrama que transporta la lista de vídeos grabados por el dashcam hacia la pantalla.'
  de: 'Mehrrahmen-Nutzlast mit der Liste der von der Dashcam aufgezeichneten Videos für das Display.'
  it: 'Payload multi-trama che trasporta l''elenco dei video registrati dal dashcam verso il display.'
  pl: 'Wieloramkowy ładunek listy nagranych filmów wideorejestratora przesyłany do wyświetlacza.'
  ru: 'Многокадровые данные списка записанных видеорегистратором роликов, передаваемые на дисплей.'
  zh: '承载行车记录仪录像列表发送给显示屏的多帧载荷。'
  hu: 'Több keretből álló hasznos adat, amely a fedélzeti kamera felvett videóinak listáját viszi a kijelzőnek.'
  pt: 'Carga útil multitrama que transporta a lista de vídeos gravados pela câmara de bordo para o ecrã.'
periodicity: ['trigger']
senders: ['IDVR']
receivers: ['BTEL', 'OVIP']
isotp:
  flow_control_id: 0x2C5

signals:
  PAYLOAD:
    bits: '1.7-n'
    comment:
      en: 'Application data (reassembled)'
      fr: 'Données applicatives (réassemblées)'
      es: 'Datos de aplicación (reensamblados)'
      de: 'Anwendungsdaten (wieder zusammengesetzt)'
      it: 'Dati applicativi (riassemblati)'
      pl: 'Dane aplikacyjne (ponownie złożone)'
      ru: 'Прикладные данные (пересобранные)'
      zh: '应用数据（重组后）'
      hu: 'Alkalmazásadatok (újraösszeállítva)'
      pt: 'Dados de aplicação (reagrupados)'
    type: 'bytes'

alternatives:
  - note:
      en: 'Other layout observed for this frame (other software or car version)'
      fr: 'Autre disposition observée pour cette trame (autre version de logiciel ou de véhicule)'
      es: 'Otra disposición observada para esta trama (otra versión de software o de vehículo)'
      de: 'Andere beobachtete Belegung dieser Botschaft (andere Software- oder Fahrzeugversion)'
      it: 'Altra disposizione osservata per questo frame (altra versione di software o di vettura)'
      pl: 'Inny zaobserwowany układ tej ramki (inna wersja oprogramowania lub samochodu)'
      ru: 'Другая наблюдаемая раскладка этого кадра (другая версия ПО или автомобиля)'
      zh: '此帧观察到的另一种布局（其他软件或车型版本）'
      hu: 'A keret másik megfigyelt elrendezése (más szoftver- vagy autóverzió)'
      pt: 'Outra disposição observada para esta trama (outra versão de software ou de veículo)'
    periodicity: ['trigger']
    senders: ['IDVR']
    receivers: ['BTEL', 'OVIP']
    signals:
      IDVR_DIRECTORY_TYPE:
        bits: '1.7-1.4'
        comment:
          en: 'Type of directory sent (dashcam dating list mode)'
          fr: 'Type de répertoire envoyé (mode liste de datation de la caméra embarquée)'
          es: 'Tipo de directorio enviado (modo lista de fechas de la cámara de a bordo)'
          de: 'Art des gesendeten Verzeichnisses (Dashcam-Datumslistenmodus)'
          it: 'Tipo di cartella inviata (modalità elenco datazione dashcam)'
          pl: 'Rodzaj wysłanego katalogu (tryb listy dat kamery samochodowej)'
          ru: 'Тип отправленного каталога (режим списка дат видеорегистратора)'
          zh: '发送的目录类型(行车记录仪日期列表模式)'
          hu: 'A küldött könyvtár típusa (fedélzeti kamera dátumlista módja)'
