id: 0x01C
name: 'MOTION_SENSOR_COMMAND_RIGHT'
type: 'can'
length: 8
comment:
  en: 'Preconditioning and cruise control menu commands: button presses, cruise info availability, preconditioning activation and type request.'
  fr: 'Commandes du menu préconditionnement et régulateur de vitesse : appuis boutons, disponibilité info régulateur, activation et type de demande de préconditionnement.'
  es: 'Órdenes del menú de preacondicionamiento y regulador de velocidad: pulsaciones de botones, disponibilidad de información del regulador, activación y tipo de solicitud de preacondicionamiento.'
  de: 'Befehle des Vorklimatisierungs- und Tempomatmenüs: Tastendrücke, Verfügbarkeit der Tempomatinfo, Vorklimatisierungsaktivierung und -typanforderung.'
  it: 'Comandi del menu precondizionamento e regolatore di velocità: pressioni pulsanti, disponibilità informazioni regolatore, attivazione e tipo di richiesta di precondizionamento.'
  pl: 'Polecenia menu wstępnej klimatyzacji i tempomatu: naciśnięcia przycisków, dostępność informacji tempomatu, aktywacja i typ żądania wstępnej klimatyzacji.'
  ru: 'Команды меню предварительного кондиционирования и круиз-контроля: нажатия кнопок, доступность информации круиз-контроля, активация и тип запроса предварительного кондиционирования.'
  zh: '预调节与巡航控制菜单命令：按键操作、巡航信息可用性、预调节激活及请求类型。'
  hu: 'Az előkondicionálási és sebességtartó menü parancsai: gombnyomások, a sebességtartó-információ elérhetősége, az előkondicionálás aktiválása és kérés típusa.'
  pt: 'Comandos do menu de pré-condicionamento e do regulador de velocidade: pressões de botões, disponibilidade de informação do regulador, ativação do pré-condicionamento e pedido de tipo.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['trigger']
senders: ['ICSV', 'BTEL', 'MATT', 'EMF', 'OVIP', 'CMB']
receivers: ['BSI']

