id: 0x25C
name: 'ECO_DRIVING_HISTORY'
type: 'can'
length: 8
comment:
  en: 'Eco-driving coach trip consumption/distance and weekly history scores (Monday to Sunday).'
  fr: 'Consommation/distance du trajet et historique hebdomadaire des notes éco-conduite (lundi à dimanche).'
  es: 'Consumo/distancia del trayecto e historial semanal de puntuaciones de conducción eficiente (lunes a domingo).'
  de: 'Verbrauch/Strecke der Fahrt und wöchentliche Verlaufsnoten der Eco-Fahrweise (Montag bis Sonntag).'
  it: 'Consumo/distanza del tragitto e cronologia settimanale dei punteggi eco-guida (lunedì-domenica).'
  pl: 'Zużycie/dystans podróży oraz tygodniowa historia ocen ekojazdy (poniedziałek-niedziela).'
  ru: 'Расход/дистанция поездки и недельная история оценок эко-вождения (с понедельника по воскресенье).'
  zh: '本次行程的油耗/里程及每周经济驾驶历史评分(周一至周日)。'
  hu: 'Az út fogyasztása/távolsága és az ökovezetés heti előzmény-pontszámai (hétfőtől vasárnapig).'
  pt: 'Consumo/distância do trajeto e histórico semanal das notas de condução económica (segunda a domingo).'
periodicity: ['100040ms']
senders: ['BSI']
receivers: ['OVIP', 'BTEL']

