      es: 'Puntuación diaria de Eco Coaching del lunes'
      de: 'Tägliche Eco-Coaching-Bewertung für Montag'
      it: 'Punteggio giornaliero Eco Coaching di lunedì'
      pl: 'Dzienna ocena Eco Coaching za poniedziałek'
      ru: 'Ежедневная оценка Eco Coaching за понедельник'
      zh: '周一Eco Coaching每日评分'
      hu: 'Hétfői napi Eco Coaching pontszám'
      pt: 'Pontuação diária de Eco Coaching de segunda-feira'
    type: 'uint'
    min: 0
    max: 10
