id: 0x1E9
name: 'NAV_TRAFFIC_INFO'
type: 'can'
length: 6
comment:
  en: 'Navigation traffic information: advised/limit speed, radar warning pictograms and traffic alert distance/duration.'
  fr: 'Informations trafic navigation : vitesse conseillée/limite, pictogrammes d''alerte radar et distance/durée d''alerte trafic.'
  es: 'Información de tráfico de la navegación: velocidad aconsejada/límite, pictogramas de alerta de radar y distancia/duración de la alerta de tráfico.'
  de: 'Navigations-Verkehrsinformationen: empfohlene/Höchstgeschwindigkeit, Radarwarn-Piktogramme und Verkehrswarnungsdistanz/-dauer.'
  it: 'Informazioni sul traffico della navigazione: velocità consigliata/limite, pittogrammi di allerta autovelox e distanza/durata dell''allerta traffico.'
  pl: 'Informacje o ruchu drogowym z nawigacji: prędkość zalecana/ograniczenie, piktogramy ostrzeżeń radarowych oraz odległość/czas trwania alertu ruchu.'
  ru: 'Информация о трафике от навигации: рекомендуемая/предельная скорость, пиктограммы предупреждения о радарах и расстояние/длительность предупреждения о трафике.'
  zh: '导航交通信息:建议/限制车速、测速摄像头警示图标及交通警报距离/时长。'
  hu: 'Navigációs forgalmi információk: ajánlott/megengedett sebesség, radarfigyelmeztető piktogramok és a forgalmi riasztás távolsága/időtartama.'
  pt: 'Informação de trânsito da navegação: velocidade aconselhada/limite, pictogramas de alerta de radar e distância/duração do alerta de trânsito.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['500ms', 'trigger']
senders: ['ICSV', 'BTEL', 'OVIP']
receivers: ['CMB', 'MATT', 'BSI']

