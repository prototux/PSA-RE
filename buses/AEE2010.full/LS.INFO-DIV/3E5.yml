id: 0x3E5
name: 'RADIO_STATUS_PANEL'
type: 'can'
length: 3
comment:
  en: 'Remote control panel status: navigation buttons (up/down/left/right/escape/main), scroll wheel and audio/climate access.'
  fr: 'État du panneau de commande déportée : boutons de navigation (haut/bas/gauche/droite/échap/principal), molette et accès audio/climatisation.'
  es: 'Estado del panel de mando remoto: botones de navegación (arriba/abajo/izquierda/derecha/escape/principal), rueda de desplazamiento y acceso audio/clima.'
  de: 'Status des Fernbedienpanels: Navigationstasten (auf/ab/links/rechts/Esc/Haupt), Scrollrad und Zugriff auf Audio/Klima.'
  it: 'Stato del pannello di comando remoto: pulsanti di navigazione (su/giù/sinistra/destra/esc/principale), rotella e accesso audio/clima.'
  pl: 'Stan zdalnego panelu sterowania: przyciski nawigacyjne (góra/dół/lewo/prawo/escape/główny), pokrętło i dostęp do audio/klimatyzacji.'
  ru: 'Статус выносной панели управления: кнопки навигации (вверх/вниз/влево/вправо/escape/главная), колесо прокрутки и доступ к аудио/климату.'
  zh: '遥控面板状态:导航按钮(上/下/左/右/退出/主页)、滚轮及音频/空调访问。'
  hu: 'A távvezérlő panel állapota: navigációs gombok (fel/le/balra/jobbra/kilépés/fő), görgő és audio/klíma elérés.'
  pt: 'Estado do painel de comando remoto: botões de navegação (cima/baixo/esquerda/direita/escape/principal), roda de deslocamento e acesso a áudio/climatização.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['500ms', 'trigger']
senders: ['ICSV', 'RAD']
receivers: ['EMF']

