id: 0x341
name: 'WIRELESS_CHARGER_STATUS'
type: 'can'
length: 8
comment:
  en: 'Wireless charger connection status: connected device, device number and fault status.'
  fr: 'État de connexion du chargeur sans fil : appareil connecté, numéro d''appareil et état de défaut.'
  es: 'Estado de conexión del cargador inalámbrico: dispositivo conectado, número de dispositivo y estado de fallo.'
  de: 'Verbindungsstatus des kabellosen Ladegeräts: angeschlossenes Gerät, Gerätenummer und Fehlerstatus.'
  it: 'Stato di connessione del caricatore wireless: dispositivo collegato, numero dispositivo e stato di guasto.'
  pl: 'Stan połączenia ładowarki bezprzewodowej: podłączone urządzenie, numer urządzenia i stan usterki.'
  ru: 'Состояние подключения беспроводного зарядного устройства: подключённое устройство, номер устройства и статус неисправности.'
  zh: '无线充电器连接状态：已连接设备、设备编号和故障状态。'
  hu: 'A vezeték nélküli töltő csatlakozási állapota: csatlakoztatott eszköz, eszközszám és hibaállapot.'
  pt: 'Estado de ligação do carregador sem fios: dispositivo ligado, número do dispositivo e estado de avaria.'
periodicity: ['trigger']
senders: ['WLC']
receivers: ['SDCM']

signals:
  WLC_NFC_DEVICE_COUNT:
    bits: '1.7-1.0'
    comment:
      en: 'Number of NFC devices detected during the inventory scan, wireless charger'
      fr: 'Nombre de dispositifs NFC détectés pendant la phase d''inventaire, chargeur sans fil'
      es: 'Número de dispositivos NFC detectados durante la fase de inventario, cargador inalámbrico'
      de: 'Anzahl der während der Inventurphase erkannten NFC-Geräte, Induktivladegerät'
      it: 'Numero di dispositivi NFC rilevati durante la fase di inventario, caricatore wireless'
      pl: 'Liczba urządzeń NFC wykrytych podczas fazy inwentaryzacji, ładowarka bezprzewodowa'
      ru: 'Количество NFC-устройств, обнаруженных во время инвентаризации, беспроводное зарядное устройство'
      zh: '库存扫描阶段检测到的NFC设备数量,无线充电器'
      hu: 'A leltározási fázisban észlelt NFC eszközök száma, vezeték nélküli töltő'
      pt: 'Número de dispositivos NFC detetados durante a fase de inventário, carregador sem fios'
    type: 'uint'
    min: 0
    max: 255
    default: 0x00

  WLC_CONNECTED_DEVICE_ID:
    bits: '2.7-2.0'
    comment:
      en: 'Badge/device number currently connected (0 = no device connected), wireless charger'
      fr: 'Numéro du badge/appareil actuellement connecté (0 = aucun appareil connecté), chargeur sans fil'
      es: 'Número de tarjeta/dispositivo actualmente conectado (0 = ningún dispositivo conectado), cargador inalámbrico'
      de: 'Nummer des aktuell verbundenen Badges/Geräts (0 = kein Gerät verbunden), Induktivladegerät'
      it: 'Numero del badge/dispositivo attualmente connesso (0 = nessun dispositivo connesso), caricatore wireless'
      pl: 'Numer aktualnie podłączonego identyfikatora/urządzenia (0 = brak podłączonego urządzenia), ładowarka bezprzewodowa'
      ru: 'Номер подключённого в данный момент бейджа/устройства (0 = устройство не подключено), беспроводное зарядное устройство'
      zh: '当前连接的徽章/设备编号(0=无设备连接),无线充电器'
      hu: 'Az aktuálisan csatlakoztatott jelvény/eszköz száma (0 = nincs csatlakoztatott eszköz), vezeték nélküli töltő'
      pt: 'Número do cartão/dispositivo atualmente ligado (0 = nenhum dispositivo ligado), carregador sem fios'
    type: 'uint'
    min: 0
    max: 255

  WLC_DIAGNOSTIC_STATUS:
    bits: '3.7-3.0'
    comment:
      en: 'Malfunction status, for diagnostics (wireless charger)'
      fr: 'État de dysfonctionnement, pour diagnostic (chargeur sans fil)'
      es: 'Estado de mal funcionamiento, para diagnóstico (cargador inalámbrico)'
      de: 'Störungsstatus, für Diagnose (Induktivladegerät)'
      it: 'Stato di malfunzionamento, per diagnosi (caricatore wireless)'
      pl: 'Stan nieprawidłowego działania, do diagnostyki (ładowarka bezprzewodowa)'
      ru: 'Статус неисправности, для диагностики (беспроводное зарядное устройство)'
      zh: '故障状态,用于诊断(无线充电器)'
      hu: 'Hibaállapot diagnosztikai célra (vezeték nélküli töltő)'
      pt: 'Estado de mau funcionamento, para diagnóstico (carregador sem fios)'
    type: 'uint'

  UNUSED_1:
    bits: '4.7-8.0'
    unused: true
