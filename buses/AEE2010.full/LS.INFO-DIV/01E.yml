id: 0x01E
name: 'WAKEUP_SIR'
type: 'can'
length: 1
comment:
  en: 'Handshake frame sent by the body computer (BSI) to the steering column lock module (SDCM) during the pairing sequence.'
  fr: 'Trame de handshake envoyée par le BSI vers le module de blocage de colonne de direction (SDCM) lors de l''appairage.'
  es: 'Trama de enlace (handshake) enviada por la BSI al módulo de bloqueo de la columna de dirección (SDCM) durante el emparejamiento.'
  de: 'Handshake-Rahmen vom BSI an das Lenksäulenverriegelungsmodul (SDCM) während der Kopplungssequenz.'
  it: 'Trama di handshake inviata dal BSI al modulo di bloccaggio piantone sterzo (SDCM) durante l''accoppiamento.'
  pl: 'Ramka uzgadniania (handshake) wysyłana przez BSI do modułu blokady kolumny kierownicy (SDCM) podczas parowania.'
  ru: 'Кадр рукопожатия, отправляемый BSI модулю блокировки рулевой колонки (SDCM) во время сопряжения.'
  zh: '车身控制器(BSI)在配对过程中发送给转向柱锁止模块(SDCM)的握手帧。'
  hu: 'Kézfogás (handshake) keret, amelyet a BSI küld a kormányoszlop-zár modulnak (SDCM) a párosítás során.'
  pt: 'Trama de acordo enviada pelo computador de servidão (BSI) ao módulo de bloqueio da coluna de direção (SDCM) durante a sequência de emparelhamento.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['SDCM']

signals:
  HANDSHAKE_BSI_TO_SDCM:
    bits: '1.7'
    comment:
      en: 'Handshake for the communication frame sent by the BSI to the SDCM'
      fr: 'Prise de contact pour la trame de communication envoyée de la BSI au SDCM'
      es: 'Protocolo de enlace para la trama de comunicación enviada de la BSI al SDCM'
      de: 'Handshake für den von BSI an SDCM gesendeten Kommunikations-Frame'
      it: 'Handshake per la trama di comunicazione inviata dalla BSI al SDCM'
      pl: 'Uzgadnianie (handshake) dla ramki komunikacyjnej wysyłanej z BSI do SDCM'
      ru: 'Согласование (handshake) для кадра связи, отправляемого от BSI к SDCM'
      zh: '由BSI发送至SDCM的通信帧握手'
      hu: 'A BSI által az SDCM-nek küldött kommunikációs kerethez tartozó kézfogás (handshake)'
      pt: 'Handshake da trama de comunicação enviada pela BSI ao SDCM'
    type: 'bool'
    values:
      0x00:
        en: 'NACK'
        fr: 'NACK'
        es: 'NACK'
        de: 'NACK'
        it: 'NACK'
        pl: 'NACK'
        ru: 'NACK'
        zh: 'NACK'
        hu: 'NACK'
        pt: 'NACK'
      0x01:
        en: 'ACK'
        fr: 'ACK'
        es: 'ACK'
        de: 'ACK'
        it: 'ACK'
        pl: 'ACK'
        ru: 'ACK (подтверждение)'
        zh: 'ACK(确认)'
        hu: 'ACK'
        pt: 'ACK'

  UNUSED_1:
    bits: '1.6-1.0'
    unused: true
