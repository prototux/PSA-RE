id: 0x112
name: 'BSI_VERSION'
type: 'can'
length: 4
comment:
  en: 'Alert sound requests sent by the BSI to the telematics unit: sound harmonisation, localisation, level, noise reduction and priority.'
  fr: 'Demandes de son d''alerte envoyées par la BSI à l''unité télématique : harmonisation, localisation, niveau, réduction de bruit et priorité du son.'
  es: 'Solicitudes de sonido de alerta enviadas por la BSI a la unidad telemática: armonización, localización, nivel, reducción de ruido y prioridad del sonido.'
  de: 'Von der BSI an die Telematikeinheit gesendete Warntonanforderungen: Klangharmonisierung, Ortung, Pegel, Geräuschunterdrückung und Priorität.'
  it: 'Richieste di suono di allarme inviate dalla BSI all''unità telematica: armonizzazione, localizzazione, livello, riduzione del rumore e priorità del suono.'
  pl: 'Żądania dźwięku alarmowego wysyłane przez BSI do jednostki telematycznej: harmonizacja, lokalizacja, poziom, redukcja szumów i priorytet dźwięku.'
  ru: 'Запросы предупреждающего звука, отправляемые BSI в телематический блок: гармонизация звука, локализация, уровень, шумоподавление и приоритет.'
  zh: '由BSI发送给远程信息处理单元的警示音请求：音效协调、定位、音量、降噪及优先级。'
  hu: 'A BSI figyelmeztetőhang-kérései a telematikai egység felé: hangharmonizálás, lokalizáció, hangerő, zajcsökkentés és prioritás.'
  pt: 'Pedidos de som de alerta enviados pela BSI à unidade telemática: harmonização sonora, localização, nível, redução de ruído e prioridade.'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['BTEL']

