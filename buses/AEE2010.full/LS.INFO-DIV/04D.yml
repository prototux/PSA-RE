  HANDSFREE_CID_NUMBER:
    bits: '4.5-4.3'
    comment:
      en: 'Hands-free key (CID) number used for the hands-free access command (1-5); 0 if none is associated.'
      fr: 'Numéro de la clé mains-libres (CID) utilisée pour la commande d''accès mains-libres (1-5) ; 0 si aucune n''est associée.'
      es: 'Número de la llave manos libres (CID) usada para el comando de acceso manos libres (1-5); 0 si no hay ninguna asociada.'
      de: 'Nummer des für den Handsfree-Zugriffsbefehl verwendeten Schlüssels (CID) (1-5); 0, wenn keiner zugeordnet ist.'
      it: 'Numero della chiave mani libere (CID) usata per il comando di accesso mani libere (1-5); 0 se nessuna è associata.'
      pl: 'Numer kluczyka hands-free (CID) użytego do polecenia dostępu hands-free (1-5); 0, jeśli żaden nie jest powiązany.'
