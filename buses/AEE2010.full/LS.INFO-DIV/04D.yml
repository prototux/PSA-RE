      zh: '用于免提进入命令的免提钥匙(CID)编号(1-5)；0表示未关联。'
      hu: 'A kihangosított hozzáférési parancshoz használt kulcs (CID) száma (1-5); 0, ha nincs hozzárendelve.'
      pt: 'Número da chave mãos-livres (CID) utilizada para o comando de acesso mãos-livres (1-5); 0 se nenhuma estiver associada.'
    type: 'uint'
    min: 0
    max: 7

  SMART_DEVICE_NUMBER:
    bits: '4.2-4.0'
    comment:
      en: 'Smart device number used for a remote command (Bluetooth or NFC), 1-5; 0 if none is associated.'
