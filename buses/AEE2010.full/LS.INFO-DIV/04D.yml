  CID_FOUND_INSIDE:
    bits: '2.5-2.4'
    comment:
      en: 'Indicates whether a hands-free key (CID) was found inside the vehicle, updated at the end of an inside search.'
      fr: 'Indique si une clé mains-libres (CID) a été trouvée à l''intérieur du véhicule, mis à jour en fin de recherche intérieure.'
      es: 'Indica si se encontró una llave manos libres (CID) dentro del vehículo, actualizado al final de la búsqueda interior.'
      de: 'Zeigt an, ob ein Handsfree-Schlüssel (CID) im Fahrzeuginneren gefunden wurde, aktualisiert am Ende der Innensuche.'
      it: 'Indica se una chiave mani libere (CID) è stata trovata all''interno del veicolo, aggiornato a fine ricerca interna.'
      pl: 'Wskazuje, czy w pojeździe znaleziono kluczyk hands-free (CID), aktualizowane po zakończeniu wyszukiwania wewnętrznego.'
      ru: 'Указывает, был ли найден ключ hands-free (CID) внутри автомобиля, обновляется по окончании внутреннего поиска.'
      zh: '指示是否在车内发现免提钥匙(CID)，在内部搜索结束时更新。'
      hu: 'Jelzi, hogy találtak-e kihangosított kulcsot (CID) a jármű belsejében, a belső keresés végén frissítve.'
      pt: 'Indica se foi encontrada uma chave mãos-livres (CID) dentro do veículo, atualizado no final da pesquisa interior'
