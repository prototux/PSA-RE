      zh: '已认证设备编号：1-5为CID钥匙，6-10为NFC卡，11-15为智能设备。'
      hu: 'A hitelesített eszköz száma: 1-5 CID kulcsoknál, 6-10 NFC kártyáknál, 11-15 okoseszközöknél.'
      pt: 'Número do dispositivo autenticado: 1-5 para chaves CID, 6-10 para cartões NFC, 11-15 para dispositivos inteligentes.'
