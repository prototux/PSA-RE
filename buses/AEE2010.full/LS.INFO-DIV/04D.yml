id: 0x04D
name: 'UNCIPHERED_DATA_SDCM_TO_BSI'
type: 'can'
length: 8
comment:
  en: 'Unencrypted hands-free key search and blacklist data sent from the SDCM to the BSI'
  fr: 'Données non chiffrées de recherche et de liste noire des clés mains libres, envoyées du SDCM à la BSI'
  es: 'Datos sin cifrar de búsqueda y lista negra de llaves manos libres, enviados del SDCM a la BSI'
  de: 'Unverschlüsselte Such- und Sperrlistendaten der Freihandschlüssel, von SDCM an BSI gesendet'
  it: 'Dati non cifrati di ricerca e lista nera delle chiavi mani libere, inviati dal SDCM alla BSI'
  pl: 'Niezaszyfrowane dane wyszukiwania i czarnej listy kluczy bezkluczykowych, wysyłane z SDCM do BSI'
  ru: 'Незашифрованные данные поиска и чёрного списка ключей бесключевого доступа, отправляемые от SDCM к BSI'
  zh: '由SDCM发送至BSI的免钥匙钥匙搜索及黑名单未加密数据'
  hu: 'Az SDCM által a BSI-nek küldött, titkosítatlan kulcskeresési és feketelista-adatok a kézközelítéses kulcsokhoz'
  pt: 'Dados não encriptados de procura de chave mãos-livres e lista negra enviados do SDCM para a BSI.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['trigger']
senders: ['SDCM']
receivers: ['BSI']

signals:
  HANDSFREE_AREA_TRANSITION:
    bits: '1.7-1.4'
    comment:
      en: 'Movement of a paired hands-free key (CID) between detection areas (welcome, unlock, walk-away locking, etc.).'
      fr: 'Mouvement d''une clé mains-libres (CID) appairée entre les zones de détection (accueil, déverrouillage, verrouillage à l''éloignement, etc.).'
      es: 'Movimiento de una llave manos libres (CID) emparejada entre las zonas de detección (bienvenida, desbloqueo, cierre al alejarse, etc.).'
      de: 'Bewegung eines gekoppelten Handsfree-Schlüssels (CID) zwischen den Erkennungszonen (Willkommen, Entriegeln, Weggeh-Verriegelung usw.).'
      it: 'Movimento di una chiave mani libere (CID) associata tra le zone di rilevamento (benvenuto, sblocco, chiusura all''allontanamento, ecc.).'
      pl: 'Ruch sparowanego kluczyka hands-free (CID) między strefami wykrywania (powitanie, odblokowanie, zamykanie przy oddalaniu itd.).'
      ru: 'Перемещение сопряжённого ключа hands-free (CID) между зонами обнаружения (приветствие, разблокировка, автозапирание при удалении и т.д.).'
      zh: '配对的免提钥匙(CID)在检测区域之间的移动（迎宾、解锁、离车落锁等）。'
      hu: 'Egy párosított kihangosított kulcs (CID) mozgása az érzékelési zónák között (üdvözlés, kinyitás, távozáskor zárás stb.).'
      pt: 'Movimento de uma chave mãos-livres emparelhada (CID) entre zonas de deteção (boas-vindas, desbloqueio, bloqueio ao afastar-se, etc.).'
