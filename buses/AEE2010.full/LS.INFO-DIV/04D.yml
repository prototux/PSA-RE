  HANDSFREE_CLOSURE_BUTTON:
    bits: '1.3-1.2'
    comment:
      en: 'Indicates which hands-free access button was pressed (none if no action detected).'
      fr: 'Indique quel bouton d''accès mains-libres a été actionné (aucun si pas d''action détectée).'
      es: 'Indica qué botón de acceso manos libres se pulsó (ninguno si no se detectó ninguna acción).'
      de: 'Zeigt an, welche Handsfree-Zugriffstaste betätigt wurde (keine, wenn keine Aktion erkannt wurde).'
      it: 'Indica quale pulsante di accesso mani libere è stato premuto (nessuno se non è stata rilevata alcuna azione).'
      pl: 'Wskazuje, który przycisk dostępu hands-free został naciśnięty (brak, jeśli nie wykryto działania).'
      ru: 'Указывает, какая кнопка доступа hands-free была нажата (нет, если действие не обнаружено).'
      zh: '指示按下的是哪个免提进入按钮（未检测到操作则为无）。'
      hu: 'Jelzi, melyik kihangosított hozzáférési gombot nyomták meg (nincs, ha nem észleltek műveletet).'
      pt: 'Indica qual o botão de acesso mãos-livres pressionado (nenhum se não for detetada ação).'
