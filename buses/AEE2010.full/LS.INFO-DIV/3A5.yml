id: 0x3A5
name: 'RADIO_TRACK_STATUS'
type: 'can'
length: 8
comment:
  en: 'Radio current track status: shuffle and repeat modes, text data availability, elapsed time, track number/total, change origin and source.'
  fr: 'État de la piste courante de l''autoradio : modes aléatoire et répétition, disponibilité des données texte, temps écoulé, numéro de piste/total, origine du changement et source.'
  es: 'Estado de la pista actual de la radio: modos aleatorio y repetición, disponibilidad de datos de texto, tiempo transcurrido, número de pista/total, origen del cambio y fuente.'
  de: 'Status des aktuellen Radiotitels: Zufalls- und Wiederholmodi, Verfügbarkeit von Textdaten, verstrichene Zeit, Titelnummer/-gesamtzahl, Änderungsursprung und Quelle.'
  it: 'Stato della traccia corrente della radio: modalità casuale e ripetizione, disponibilità dati testo, tempo trascorso, numero di traccia/totale, origine del cambio e sorgente.'
  pl: 'Stan bieżącego utworu radia: tryby losowy i powtarzania, dostępność danych tekstowych, czas, który upłynął, numer utworu/łączna liczba, źródło zmiany i źródło.'
  ru: 'Статус текущего трека радио: режимы перемешивания и повтора, доступность текстовых данных, прошедшее время, номер трека/всего, источник смены и источник.'
  zh: '收音机当前曲目状态:随机和重复模式、文本数据可用性、已用时间、曲目编号/总数、更改来源及信源。'
  hu: 'A rádió aktuális számának állapota: véletlen és ismétlés módok, szövegadat elérhetősége, eltelt idő, számsorszám/összes, a váltás forrása és a forrás.'
  pt: 'Estado da faixa atual da rádio: modos aleatório e repetição, disponibilidade de dados de texto, tempo decorrido, número de faixa/total, origem da mudança e fonte.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['500ms', 'trigger']
senders: ['RAD', 'ICSV']
receivers: ['CRT', 'FMUX', 'EMF']

signals:
