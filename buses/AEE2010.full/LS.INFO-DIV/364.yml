id: 0x364
name: 'TOUCH_CLIMATE_PANEL_STATUS'
type: 'can'
length: 6
comment:
  en: 'Touch-sensitive climate panel button requests: slider level, blower and temperature level changes, max A/C, air-quality sensor, automatic mode intensity (light/normal/strong).'
  fr: 'Demandes du panneau tactile de climatisation : niveau du curseur, changements de niveau de pulseur et de température, climatisation max, capteur qualité d''air, intensité du mode auto (léger/normal/fort).'
  es: 'Solicitudes del panel táctil de climatización: nivel del deslizador, cambios de nivel de ventilador y temperatura, A/C máximo, sensor de calidad del aire, intensidad del modo automático (ligero/normal/fuerte).'
  de: 'Anforderungen des Touch-Klimabedienfelds: Schiebereglerstufe, Gebläse- und Temperaturstufenänderungen, Klimaanlage max, Luftqualitätssensor, Intensität des Automatikmodus (leicht/normal/stark).'
  it: 'Richieste del pannello touch climatizzazione: livello del cursore, cambi di livello ventola e temperatura, A/C max, sensore qualità dell''aria, intensità della modalità automatica (leggera/normale/forte).'
  pl: 'Żądania dotykowego panelu klimatyzacji: poziom suwaka, zmiany poziomu dmuchawy i temperatury, maks. klimatyzacja, czujnik jakości powietrza, intensywność trybu automatycznego (łagodny/normalny/mocny).'
  ru: 'Запросы сенсорной панели климат-контроля: уровень ползунка, изменения уровня вентилятора и температуры, максимальный кондиционер, датчик качества воздуха, интенсивность автоматического режима (слабый/нормальный/сильный).'
  zh: '触控空调面板按钮请求:滑块级别、风扇和温度级别变化、最大空调、空气质量传感器、自动模式强度(弱/正常/强)。'
  hu: 'Az érintőképernyős klímapanel gombkérései: csúszka szintje, ventilátor- és hőmérsékletszint-változtatás, maximális klíma, levegőminőség-érzékelő, automata mód intenzitása (gyenge/normál/erős).'
  pt: 'Pedidos dos botões do painel tátil de climatização: nível do cursor, mudanças de nível do ventilador e da temperatura, ar condicionado máximo, sensor de qualidade do ar, intensidade do modo automático (fraco/normal/forte).'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['1000ms', 'trigger']
senders: ['BTEL', 'OVIP']
receivers: ['ICSV', 'CMB', 'FMUX', 'BSI']

