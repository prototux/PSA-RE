        zh: '允许发送'
        hu: 'Küldésre kész'
        pt: 'Pronto a emitir'
      0x01:
        en: 'Wait'
        fr: 'Attendre'
        es: 'Esperar'
        de: 'Warten'
        it: 'Attendere'
        pl: 'Czekaj'
        ru: 'Подождите'
        zh: '等待'
