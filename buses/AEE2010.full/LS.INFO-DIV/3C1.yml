id: 0x3C1
name: 'WIRELESS_CHARGER_RX_FLOW_CONTROL'
type: 'can-tp'
comment:
  en: 'ISO-TP flow control frame for the wireless charger''s multi-frame transfer.'
  fr: 'Trame de contrôle de flux ISO-TP pour le transfert multi-trames du module de charge sans fil.'
  es: 'Trama de control de flujo ISO-TP para la transferencia multitrama del módulo de carga inalámbrica.'
  de: 'ISO-TP-Flusskontroll-Botschaft für die Mehrfachrahmen-Übertragung des Moduls für kabelloses Laden.'
  it: 'Messaggio di controllo di flusso ISO-TP per il trasferimento multi-frame del modulo di ricarica wireless.'
  pl: 'Ramka kontroli przepływu ISO-TP dla transmisji wieloramkowej modułu ładowarki bezprzewodowej.'
  ru: 'Кадр управления потоком ISO-TP для многокадровой передачи модуля беспроводной зарядки.'
  zh: '无线充电模块多帧传输的 ISO-TP 流控帧。'
  hu: 'ISO-TP folyamvezérlő üzenet a vezeték nélküli töltő többkeretes adatátviteléhez.'
  pt: 'Trama de controlo de fluxo ISO-TP para a transferência multitrama do carregador sem fios.'
periodicity: ['trigger']
senders: ['SDCM']
receivers: ['WLC']
isotp:
  addressing: 'normal'

signals:
  NPCI_HEADER:
    bits: '1.7-1.4'
    comment:
      en: 'NPCI header (per the OSEK-COM segmentation standard)'
      fr: 'En-tête NPCI (selon la norme de segmentation OSEK-COM)'
      es: 'Cabecera NPCI (según la norma de segmentación OSEK-COM)'
      de: 'NPCI-Header (gemäß dem OSEK-COM-Segmentierungsstandard)'
      it: 'Intestazione NPCI (secondo lo standard di segmentazione OSEK-COM)'
      pl: 'Nagłówek NPCI (zgodnie ze standardem segmentacji OSEK-COM)'
      ru: 'Заголовок NPCI (согласно стандарту сегментации OSEK-COM)'
      zh: 'NPCI 报头(依据 OSEK-COM 分段标准)'
      hu: 'NPCI fejléc (az OSEK-COM szegmentálási szabvány szerint)'
      pt: 'Cabeçalho NPCI (segundo a norma de segmentação OSEK-COM)'
    type: 'enum'
    mux_selector: true
    values:
      0x00:
        en: 'Single frame (SF)'
        fr: 'Single frame (SF)'
        es: 'Single frame (SF)'
        de: 'Single frame (SF)'
        it: 'Single frame (SF)'
        pl: 'Single frame (SF)'
        ru: 'Single frame (SF)'
        zh: 'Single frame (SF)'
        hu: 'Single frame (SF)'
        pt: 'Single frame (SF)'
      0x01:
        en: 'First frame (FF)'
        fr: 'First frame (FF)'
        es: 'First frame (FF)'
        de: 'First frame (FF)'
        it: 'First frame (FF)'
        pl: 'First frame (FF)'
        ru: 'First frame (FF)'
        zh: 'First frame (FF)'
        hu: 'First frame (FF)'
        pt: 'First frame (FF)'
      0x02:
        en: 'Consecutive frame (CF)'
        fr: 'Consecutive frame (CF)'
        es: 'Consecutive frame (CF)'
        de: 'Consecutive frame (CF)'
        it: 'Consecutive frame (CF)'
        pl: 'Consecutive frame (CF)'
        ru: 'Consecutive frame (CF)'
        zh: 'Consecutive frame (CF)'
        hu: 'Consecutive frame (CF)'
        pt: 'Consecutive frame (CF)'
      0x03:
        en: 'Flow control (FC)'
        fr: 'Flow control (FC)'
        es: 'Flow control (FC)'
        de: 'Flow control (FC)'
        it: 'Flow control (FC)'
        pl: 'Flow control (FC)'
        ru: 'Flow control (FC)'
        zh: 'Flow control (FC)'
        hu: 'Flow control (FC)'
        pt: 'Flow control (FC)'

  FLOW_STATUS:
    bits: '1.3-1.0'
    comment:
      en: 'Flow status (per the OSEK-COM segmentation standard)'
      fr: 'Flow Status (cf. norme de segmentation OSEK-COM)'
      es: 'Estado de flujo (según el estándar de segmentación OSEK-COM)'
      de: 'Flusssteuerungsstatus (gemäß dem OSEK-COM-Segmentierungsstandard)'
      it: 'Stato di flusso (secondo lo standard di segmentazione OSEK-COM)'
      pl: 'Stan przepływu (zgodnie ze standardem segmentacji OSEK-COM)'
      ru: 'Статус потока (согласно стандарту сегментации OSEK-COM)'
      zh: '流控制状态（依据 OSEK-COM 分段标准）'
      hu: 'Folyamvezérlési állapot (az OSEK-COM szegmentálási szabvány szerint)'
      pt: 'Estado de fluxo (segundo a norma de segmentação OSEK-COM)'
    type: 'enum'
