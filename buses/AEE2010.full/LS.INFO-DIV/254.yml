id: 0x254
name: 'REMOTE_ACTION_REQUEST'
type: 'can-tp'
comment:
  en: 'Remote-control request: horn, lights, lock/unlock or immobiliser.'
  fr: 'Requête de commande à distance : klaxon, feux, verrouillage/déverrouillage ou antidémarrage.'
  es: 'Solicitud de mando a distancia: claxon, luces, bloqueo/desbloqueo o inmovilizador.'
  de: 'Fernbedienungsanforderung: Hupe, Licht, Ver-/Entriegelung oder Wegfahrsperre.'
  it: 'Richiesta di comando remoto: clacson, luci, blocco/sblocco o immobilizzatore.'
  pl: 'Zadanie zdalnego sterowania: klakson, swiatla, blokowanie/odblokowanie lub immobilizer.'
  ru: 'Запрос дистанционного управления: сигнал, свет, блокировка/разблокировка или иммобилайзер.'
  zh: '远程控制请求:喇叭、车灯、上锁/解锁或防盗锁定。'
  hu: 'Távvezérlési kérés: duda, világítás, zárás/nyitás vagy indításgátló.'
  pt: 'Pedido de comando à distância: buzina, luzes, bloqueio/desbloqueio ou imobilizador.'
observations:
  en: 'On remote action request'
  fr: 'Sur requête d''action à distance'
  es: 'Ante solicitud de acción remota'
  de: 'Bei Anforderung einer Fernaktion'
  it: 'Su richiesta di azione remota'
  pl: 'Na żądanie akcji zdalnej'
  ru: 'По запросу удалённого действия'
  zh: '远程动作请求时'
  hu: 'Távműködtetési kérésre'
  pt: 'No pedido de ação remota'
periodicity: ['trigger']
senders: ['MDS']
receivers: ['BSI']
isotp:
  addressing: 'normal'

signals:
  REMOTE_IMMOBILIZE_PASSWORD:
    bits: '1.7-7.0'
    comment:
      en: 'Password for the remote engine immobilization request'
      fr: 'Mot de passe de la demande d''immobilisation moteur à distance'
      es: 'Contraseña de la solicitud de inmovilización remota del motor'
      de: 'Passwort für die Fernanforderung der Motorwegfahrsperre'
      it: 'Password della richiesta di immobilizzazione motore da remoto'
      pl: 'Hasło żądania zdalnej immobilizacji silnika'
      ru: 'Пароль для запроса дистанционной блокировки двигателя'
      zh: '远程发动机防盗锁定请求密码'
      hu: 'A távoli motorimmobilizálási kérés jelszava'
      pt: 'Palavra-passe do pedido de imobilização remota do motor'
    type: 'str'
    default: 0x00

  REMOTE_IMMOBILIZE_REQUEST:
    bits: '8.7'
    comment:
      en: 'Remote request to immobilize the engine'
      fr: 'Demande à distance d''immobilisation du moteur'
