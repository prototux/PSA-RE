id: 0x069
name: 'TELEMATICS_UNIT_STATUS'
type: 'can'
length: 2
comment:
  en: 'Telematics unit HMI status: audio switch and pop-up acknowledgements, user action, Wi-Fi settings update, main menu selection.'
  fr: 'État de l''IHM du boîtier télématique : accusés de réception commutation audio et pop-up, action utilisateur, mise à jour Wi-Fi, sélection menu principal.'
  es: 'Estado de la IHM de la unidad telemática: confirmaciones de conmutación de audio y ventana emergente, acción del usuario, actualización de ajustes Wi-Fi, selección del menú principal.'
  de: 'HMI-Status der Telematikeinheit: Bestätigungen für Audioumschaltung und Pop-up, Benutzeraktion, Wi-Fi-Einstellungsaktualisierung, Hauptmenüauswahl.'
  it: 'Stato HMI dell''unità telematica: conferme di commutazione audio e pop-up, azione utente, aggiornamento impostazioni Wi-Fi, selezione menu principale.'
  pl: 'Stan interfejsu HMI jednostki telematycznej: potwierdzenia przełączenia audio i wyskakującego okna, akcja użytkownika, aktualizacja ustawień Wi-Fi, wybór menu głównego.'
  ru: 'Статус HMI телематического блока: подтверждения переключения аудио и всплывающего окна, действие пользователя, обновление настроек Wi-Fi, выбор главного меню.'
  zh: '车载通信单元人机界面状态:音频切换和弹窗确认、用户操作、Wi-Fi设置更新、主菜单选择。'
  hu: 'A telematikai egység HMI állapota: audioátkapcsolás és felugró ablak nyugtázása, felhasználói művelet, Wi-Fi beállítás frissítése, főmenü kiválasztása.'
  pt: 'Estado da IHM da unidade telemática: confirmações de comutação áudio e de pop-up, ação do utilizador, atualização das definições Wi-Fi, seleção do menu principal.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['1000ms', 'trigger']
senders: ['RAD', 'BTEL', 'OVIP', 'EMF']
receivers: ['MDS']

