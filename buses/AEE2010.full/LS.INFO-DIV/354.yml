id: 0x354
name: 'REMOTE_TELEMATICS_RESPONSE'
type: 'can'
length: 8
comment:
  en: 'Response to a remote command, with packet counter and reference number.'
  fr: 'Réponse à une commande à distance, avec compteur de paquet et numéro de référence.'
  es: 'Respuesta a un comando remoto, con contador de paquete y número de referencia.'
  de: 'Antwort auf einen Fernbefehl, mit Paketzähler und Referenznummer.'
  it: 'Risposta a un comando remoto, con contatore pacchetti e numero di riferimento.'
  pl: 'Odpowiedź na polecenie zdalne, z licznikiem pakietów i numerem referencyjnym.'
  ru: 'Ответ на удалённую команду, со счётчиком пакетов и номером ссылки.'
  zh: '对远程命令的响应,含数据包计数及参考编号。'
  hu: 'Válasz egy távoli parancsra, csomagszámlálóval és referenciaszámmal.'
  pt: 'Resposta a um comando à distância, com contador de pacotes e número de referência.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['MDS']

signals:
  REMOTE_RESPONSE_PACKAGE_COUNTER:
    bits: '1.7-1.4'
    comment:
      en: 'Counter for remote action responses'
      fr: 'Compteur des réponses aux demandes d''actions à distance'
      es: 'Contador de las respuestas a las solicitudes de acciones remotas'
      de: 'Zähler der Antworten auf Fernaktionsanforderungen'
      it: 'Contatore delle risposte alle richieste di azioni remote'
      pl: 'Licznik odpowiedzi na żądania działań zdalnych'
      ru: 'Счётчик ответов на запросы удалённых действий'
      zh: '远程操作响应计数器'
      hu: 'A távoli műveletkérésekre adott válaszok számlálója'
      pt: 'Contador das respostas aos pedidos de ações remotas'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00

  REMOTE_RESPONSE_SEGMENT_NUMBER:
    bits: '1.3-1.0'
    comment:
      en: 'Segment number for remote action responses'
      fr: 'Numéro de segment des réponses aux demandes d''actions à distance'
      es: 'Número de segmento de las respuestas a las solicitudes de acciones remotas'
      de: 'Segmentnummer der Antworten auf Fernaktionsanforderungen'
      it: 'Numero di segmento delle risposte alle richieste di azioni remote'
      pl: 'Numer segmentu odpowiedzi na żądania działań zdalnych'
      ru: 'Номер сегмента ответов на запросы удалённых действий'
      zh: '远程操作响应分段编号'
      hu: 'A távoli műveletkérésekre adott válaszok szegmensszáma'
      pt: 'Número de segmento das respostas aos pedidos de ações remotas'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00

  REMOTE_RESPONSE_PAYLOAD:
    bits: '2.7-8.0'
    comment:
      en: 'Payload data of the remote action responses'
      fr: 'Données utiles des réponses aux demandes d''actions à distance'
      es: 'Datos útiles de las respuestas a las solicitudes de acciones remotas'
      de: 'Nutzdaten der Antworten auf Fernaktionsanforderungen'
      it: 'Dati utili delle risposte alle richieste di azioni remote'
      pl: 'Dane użyteczne odpowiedzi na żądania działań zdalnych'
      ru: 'Полезные данные ответов на запросы удалённых действий'
      zh: '远程操作响应的有效负载数据'
      hu: 'A távoli műveletkérésekre adott válaszok hasznos adatai'
      pt: 'Dados úteis das respostas aos pedidos de ações remotas'
    type: 'uint'
    default: 0x00
