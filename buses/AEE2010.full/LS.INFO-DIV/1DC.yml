      de: 'Angezeigte Eco-Coaching-Bewertung für das Kriterium Beschleunigung'
      it: 'Punteggio Eco Coaching visualizzato per la voce accelerazione'
      pl: 'Wyświetlana ocena Eco Coaching dla kryterium przyspieszenia'
      ru: 'Отображаемая оценка Eco Coaching по параметру разгона'
      zh: '显示的加速项Eco Coaching评分'
      hu: 'A gyorsítás tételre megjelenített Eco Coaching pontszám'
