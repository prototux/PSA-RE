id: 0x1DC
name: 'ECO_DRIVING_SCORE'
type: 'can'
length: 8
comment:
  en: 'Eco-driving coach scores for the current trip: overall grade and per-category grades (acceleration, braking, air conditioning use, engine warm-up, gearshift, speed).'
  fr: 'Notes du coach éco-conduite pour le trajet en cours : note globale et notes par catégorie (accélération, freinage, usage climatisation, chauffe moteur, boîte, vitesse).'
  es: 'Puntuaciones del coach de conducción eficiente para el trayecto actual: nota global y notas por categoría (aceleración, frenado, uso del climatizador, calentamiento del motor, cambio de marchas, velocidad).'
  de: 'Eco-Fahrcoach-Bewertungen für die aktuelle Fahrt: Gesamtnote und Einzelnoten (Beschleunigung, Bremsen, Klimanutzung, Motorwarmlauf, Schalten, Geschwindigkeit).'
  it: 'Punteggi del coach di eco-guida per il tragitto in corso: voto complessivo e voti per categoria (accelerazione, frenata, uso del climatizzatore, riscaldamento motore, cambio, velocità).'
  pl: 'Oceny trenera ekojazdy dla bieżącej podróży: ocena ogólna i oceny cząstkowe (przyspieszanie, hamowanie, użycie klimatyzacji, rozgrzewanie silnika, zmiana biegów, prędkość).'
  ru: 'Оценки эко-тренера вождения для текущей поездки: общая оценка и оценки по категориям (ускорение, торможение, использование кондиционера, прогрев двигателя, переключение передач, скорость).'
  zh: '本次行程的经济驾驶评分:总评分及各分项评分(加速、制动、空调使用、发动机暖机、换挡、车速)。'
  hu: 'Az ökovezetési edző pontszámai az aktuális útra: összesített értékelés és kategóriánkénti értékelések (gyorsítás, fékezés, klímahasználat, motormelegítés, váltás, sebesség).'
  pt: 'Notas do coach de condução económica para o trajeto atual: nota global e notas por categoria (aceleração, travagem, utilização do climatizador, aquecimento do motor, caixa de velocidades, velocidade).'
periodicity: ['1000990ms']
senders: ['BSI']
receivers: ['OVIP', 'BTEL']

