id: 0x3A3
name: 'HMI_DRIVE_MODE_INFO'
type: 'can'
length: 7
comment:
  en: 'Human-machine interface data: availability of the selectable driving modes (AWD, comfort, eco, sport, hybrid, ZEV).'
  fr: 'Données de l''interface homme-machine : disponibilité des modes de conduite sélectionnables (AWD, confort, éco, sport, hybride, ZEV).'
  es: 'Datos de la interfaz hombre-máquina: disponibilidad de los modos de conducción seleccionables (AWD, confort, eco, deportivo, híbrido, ZEV).'
  de: 'Mensch-Maschine-Schnittstellendaten: Verfügbarkeit der wählbaren Fahrmodi (AWD, Komfort, Eco, Sport, Hybrid, ZEV).'
  it: 'Dati dell''interfaccia uomo-macchina: disponibilità delle modalità di guida selezionabili (AWD, comfort, eco, sport, ibrida, ZEV).'
  pl: 'Dane interfejsu człowiek-maszyna: dostępność wybieralnych trybów jazdy (AWD, komfort, eco, sport, hybryda, ZEV).'
  ru: 'Данные человеко-машинного интерфейса: доступность выбираемых режимов вождения (AWD, комфорт, эко, спорт, гибрид, ZEV).'
  zh: '人机交互数据:可选驾驶模式的可用性(四驱、舒适、经济、运动、混动、零排放)。'
  hu: 'Ember-gép interfész adatok: a választható vezetési módok elérhetősége (AWD, komfort, eco, sport, hibrid, ZEV).'
  pt: 'Dados da interface homem-máquina: disponibilidade dos modos de condução selecionáveis (AWD, conforto, eco, desportivo, híbrido, ZEV).'
observations:
  en: 'On state change of: ILV_RIGHT_SLOT_NO_SPEED_PANEL, ILV_LEFT_SLOT_NO_SPEED_PANEL, ZEV_MODE_CAPABILITY, ZEV_ECO_MODE_CAPABILITY, HYBRID_ECO_MODE_CAPABILITY, AWD_MODE_CAPABILITY, SPORT_MODE_CAPABILITY, COMFORT_MODE_CAPABILITY, ECO_MODE_CAPABILITY, ECO_PLUS_MODE_CAPABILITY, NORMAL_MODE_CAPABILITY'
  fr: 'Sur changement d''état de : ILV_RIGHT_SLOT_NO_SPEED_PANEL, ILV_LEFT_SLOT_NO_SPEED_PANEL, ZEV_MODE_CAPABILITY, ZEV_ECO_MODE_CAPABILITY, HYBRID_ECO_MODE_CAPABILITY, AWD_MODE_CAPABILITY, SPORT_MODE_CAPABILITY, COMFORT_MODE_CAPABILITY, ECO_MODE_CAPABILITY, ECO_PLUS_MODE_CAPABILITY, NORMAL_MODE_CAPABILITY'
  es: 'Al cambiar el estado de: ILV_RIGHT_SLOT_NO_SPEED_PANEL, ILV_LEFT_SLOT_NO_SPEED_PANEL, ZEV_MODE_CAPABILITY, ZEV_ECO_MODE_CAPABILITY, HYBRID_ECO_MODE_CAPABILITY, AWD_MODE_CAPABILITY, SPORT_MODE_CAPABILITY, COMFORT_MODE_CAPABILITY, ECO_MODE_CAPABILITY, ECO_PLUS_MODE_CAPABILITY, NORMAL_MODE_CAPABILITY'
  de: 'Bei Statusänderung von: ILV_RIGHT_SLOT_NO_SPEED_PANEL, ILV_LEFT_SLOT_NO_SPEED_PANEL, ZEV_MODE_CAPABILITY, ZEV_ECO_MODE_CAPABILITY, HYBRID_ECO_MODE_CAPABILITY, AWD_MODE_CAPABILITY, SPORT_MODE_CAPABILITY, COMFORT_MODE_CAPABILITY, ECO_MODE_CAPABILITY, ECO_PLUS_MODE_CAPABILITY, NORMAL_MODE_CAPABILITY'
  it: 'Al cambiamento di stato di: ILV_RIGHT_SLOT_NO_SPEED_PANEL, ILV_LEFT_SLOT_NO_SPEED_PANEL, ZEV_MODE_CAPABILITY, ZEV_ECO_MODE_CAPABILITY, HYBRID_ECO_MODE_CAPABILITY, AWD_MODE_CAPABILITY, SPORT_MODE_CAPABILITY, COMFORT_MODE_CAPABILITY, ECO_MODE_CAPABILITY, ECO_PLUS_MODE_CAPABILITY, NORMAL_MODE_CAPABILITY'
  pl: 'Wysyłane przy zmianie stanu: ILV_RIGHT_SLOT_NO_SPEED_PANEL, ILV_LEFT_SLOT_NO_SPEED_PANEL, ZEV_MODE_CAPABILITY, ZEV_ECO_MODE_CAPABILITY, HYBRID_ECO_MODE_CAPABILITY, AWD_MODE_CAPABILITY, SPORT_MODE_CAPABILITY, COMFORT_MODE_CAPABILITY, ECO_MODE_CAPABILITY, ECO_PLUS_MODE_CAPABILITY, NORMAL_MODE_CAPABILITY'
  ru: 'При изменении состояния: ILV_RIGHT_SLOT_NO_SPEED_PANEL, ILV_LEFT_SLOT_NO_SPEED_PANEL, ZEV_MODE_CAPABILITY, ZEV_ECO_MODE_CAPABILITY, HYBRID_ECO_MODE_CAPABILITY, AWD_MODE_CAPABILITY, SPORT_MODE_CAPABILITY, COMFORT_MODE_CAPABILITY, ECO_MODE_CAPABILITY, ECO_PLUS_MODE_CAPABILITY, NORMAL_MODE_CAPABILITY'
  zh: '当INFO_ILV_SLOT1, ILV_LEFT_SLOT_NO_SPEED_PANEL, ZEV_MODE_CAPABILITY, ZEV_ECO_MODE_CAPABILITY, HYBRID_ECO_MODE_CAPABILITY, AWD_MODE_CAPABILITY, SPORT_MODE_CAPABILITY, COMFORT_MODE_CAPABILITY, ECO_MODE_CAPABILITY, ECO_PLUS_MODE_CAPABILITY, APTITUDE_SEL_MODE_NORMAL状态变化时'
  hu: 'A(z) ILV_RIGHT_SLOT_NO_SPEED_PANEL, ILV_LEFT_SLOT_NO_SPEED_PANEL, ZEV_MODE_CAPABILITY, ZEV_ECO_MODE_CAPABILITY, HYBRID_ECO_MODE_CAPABILITY, AWD_MODE_CAPABILITY, SPORT_MODE_CAPABILITY, COMFORT_MODE_CAPABILITY, ECO_MODE_CAPABILITY, ECO_PLUS_MODE_CAPABILITY, NORMAL_MODE_CAPABILITY állapotváltozásakor'
  pt: 'Na mudança de estado de: ILV_RIGHT_SLOT_NO_SPEED_PANEL, ILV_LEFT_SLOT_NO_SPEED_PANEL, ZEV_MODE_CAPABILITY, ZEV_ECO_MODE_CAPABILITY, HYBRID_ECO_MODE_CAPABILITY, AWD_MODE_CAPABILITY, SPORT_MODE_CAPABILITY, COMFORT_MODE_CAPABILITY, ECO_MODE_CAPABILITY, ECO_PLUS_MODE_CAPABILITY, NORMAL_MODE_CAPABILITY'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['BTEL', 'CMB', 'MATT', 'VTH', 'OVIP']

signals:
  ILV_RIGHT_SLOT_NO_SPEED_PANEL:
    bits: '1.7-1.0'
    comment:
      en: 'Indicates a non-speed sign in the right-hand display slot'
      fr: 'Indique un panneau autre que limitation de vitesse dans l''afficheur de droite'
      es: 'Indica una señal distinta al límite de velocidad en la ranura derecha'
      de: 'Zeigt ein Nicht-Geschwindigkeitsschild im rechten Anzeigefeld an'
      it: 'Indica un cartello diverso dal limite di velocità nello slot destro'
      pl: 'Wskazuje znak inny niż ograniczenie prędkości w prawym polu wyświetlacza'
      ru: 'Указывает на знак, отличный от ограничения скорости, в правом слоте дисплея'
      zh: '右侧显示槽中显示非限速标志'
      hu: 'Nem sebességkorlátozó táblát jelez a jobb oldali kijelzőmezőben'
      pt: 'Indica um sinal que não é de velocidade no slot de visualização direito'
    type: 'uint'
    min: 0
    max: 254
    invalid: 0xFF

