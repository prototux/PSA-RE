id: 0x3DA
name: 'ZEV_TRIP_INFO_3'
type: 'can'
length: 4
comment:
  en: 'Trip distance and duration for zero-emission driving, plus extended remaining charge time.'
  fr: 'Distance et durée du trajet en conduite zéro émission, ainsi que le temps de charge restant étendu.'
  es: 'Distancia y duración del trayecto en conducción de cero emisiones, más el tiempo de carga restante ampliado.'
  de: 'Fahrtstrecke und -dauer im emissionsfreien Fahrbetrieb sowie erweiterte verbleibende Ladezeit.'
  it: 'Distanza e durata del tragitto in guida a zero emissioni, più il tempo di ricarica residuo esteso.'
  pl: 'Dystans i czas podróży w jeździe zeroemisyjnej oraz rozszerzony pozostały czas ładowania.'
  ru: 'Расстояние и продолжительность поездки при движении с нулевыми выбросами, а также расширенное оставшееся время зарядки.'
  zh: '零排放行驶的行程距离及时长,以及扩展的剩余充电时间。'
  hu: 'A zéró kibocsátású vezetés útjának távolsága és időtartama, valamint a kibővített hátralévő töltési idő.'
  pt: 'Distância e duração do trajeto em condução zero emissões, bem como o tempo de carga restante alargado.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BTEL', 'CMB', 'MDS', 'OVIP']

signals:
  TRIP_TIME_COUNTER:
    bits: '1.7-2.0'
    comment:
      en: 'Time counter of the trip'
      fr: 'Compteur de temps du trajet'
      es: 'Contador de tiempo del trayecto'
      de: 'Zeitzähler der Fahrt'
      it: 'Contatore del tempo del tragitto'
      pl: 'Licznik czasu trasy'
      ru: 'Счётчик времени поездки'
      zh: '行程时间计数器'
      hu: 'Az útvonal időszámlálója'
      pt: 'Contador de tempo do trajeto'
    type: 'uint'
    factor: 1
    min: 0
    max: 65535
    units: 's'

  TRIP_DISTANCE_COUNTER:
    bits: '3.7-4.3'
    comment:
      en: 'Distance counter for the trip'
      fr: 'Compteur de distance du trajet'
      es: 'Contador de distancia del trayecto'
      de: 'Distanzzähler der Fahrt'
      it: 'Contatore di distanza del tragitto'
      pl: 'Licznik przebytej odległości trasy'
      ru: 'Счётчик пройденного расстояния поездки'
      zh: '行程距离计数器'
      hu: 'Az útvonal távolságszámlálója'
      pt: 'Contador de distância do trajeto'
    type: 'uint'
    factor: 1
    min: 0
    max: 5000
    units: 'km'
    invalid: 0x1FFF
