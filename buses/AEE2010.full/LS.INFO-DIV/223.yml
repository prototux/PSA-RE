      es: 'Horas de la primera llamada (no duración total)'
      de: 'Stunden des ersten Anrufs (nicht Gesamtdauer)'
      it: 'Ore della prima chiamata (non durata totale)'
      pl: 'Liczba godzin pierwszego połączenia (nie łączny czas)'
      ru: 'Часы первого вызова (не общая длительность)'
      zh: '第一次通话的小时数(非总时长)'
      hu: 'Az első hívás órái (nem a teljes időtartam)'
      pt: 'Hora da primeira chamada (não a duração total)'
    type: 'uint'
