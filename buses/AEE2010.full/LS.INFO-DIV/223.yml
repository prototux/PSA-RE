id: 0x223
name: 'HANDSFREE_KIT_CALL_DURATION'
type: 'can'
length: 8
comment:
  en: 'Hands-free kit call duration timers (hours, minutes, seconds) for two calls.'
  fr: 'Durées d''appel du kit mains libres (heures, minutes, secondes) pour deux appels.'
  es: 'Temporizadores de duración de llamada del kit manos libres (horas, minutos, segundos) para dos llamadas.'
  de: 'Anrufdauer-Timer der Freisprecheinrichtung (Stunden, Minuten, Sekunden) für zwei Anrufe.'
  it: 'Timer di durata chiamata del kit vivavoce (ore, minuti, secondi) per due chiamate.'
  pl: 'Liczniki czasu trwania połączenia zestawu głośnomówiącego (godziny, minuty, sekundy) dla dwóch połączeń.'
  ru: 'Таймеры длительности вызова громкой связи (часы, минуты, секунды) для двух вызовов.'
  zh: '免提套件通话时长计时器(时、分、秒),适用于两路通话。'
  hu: 'A kihangosító hívásidőzítői (óra, perc, másodperc) két híváshoz.'
  pt: 'Temporizadores de duração de chamada do kit mãos-livres (horas, minutos, segundos) para duas chamadas.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['trigger']
senders: ['RAD', 'ICSV']
receivers: ['EMF']

