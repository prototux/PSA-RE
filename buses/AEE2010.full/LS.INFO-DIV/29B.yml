  it: 'Richieste della schermata di programmazione settimanale del precondizionamento climatico (parte 2).'
  pl: 'Żądania z ekranu tygodniowego programowania klimatyzacji wstępnej (część 2).'
  ru: 'Запросы экрана еженедельного программирования предварительного кондиционирования (часть 2).'
  zh: '空调预调节每周编程屏幕的请求(第2部分)。'
  hu: 'A klíma-előkondicionálás heti programozási képernyőjének kérései (2. rész).'
  pt: 'Pedidos do ecrã de programação semanal do pré-condicionamento da climatização (parte 2).'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['trigger']
senders: ['BTEL', 'MDS', 'OVIP']
receivers: ['BSI']

