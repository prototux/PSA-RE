id: 0x336
name: 'CAMERA_STEERING_BRAKE_DATA'
type: 'can'
length: 3
comment:
  en: 'VIN = Vehicle Identification Number. WMI = World Manufacturer Identifier, VIN field identifying the manufacturer worldwide.'
  fr: 'VIN = Vehicle Identification Number, numéro d''identification du véhicule. WMI = World Manufacturer Identifier, champ du VIN identifiant le constructeur au niveau mondial.'
  es: 'VIN = Vehicle Identification Number, número de identificación del vehículo. WMI = World Manufacturer Identifier, campo del VIN que identifica al fabricante a nivel mundial.'
  de: 'VIN = Vehicle Identification Number, Fahrzeug-Identifizierungsnummer. WMI = World Manufacturer Identifier, VIN-Feld zur weltweiten Herstelleridentifikation.'
  it: 'VIN = Vehicle Identification Number, numero di identificazione del veicolo. WMI = World Manufacturer Identifier, campo del VIN che identifica il costruttore a livello mondiale.'
  pl: 'VIN = Vehicle Identification Number, numer identyfikacyjny pojazdu. WMI = World Manufacturer Identifier, pole VIN identyfikujące producenta na świecie.'
  ru: 'VIN = Vehicle Identification Number, идентификационный номер автомобиля. WMI = World Manufacturer Identifier, поле VIN, идентифицирующее производителя во всём мире.'
  zh: 'VIN = 车辆识别代号。WMI = 世界制造商识别码（World Manufacturer Identifier），VIN 中全球识别制造商的部分。'
  hu: 'VIN = Vehicle Identification Number. WMI = World Manufacturer Identifier, a VIN azon mezője, amely világszerte azonosítja a gyártót.'
  pt: 'VIN = Vehicle Identification Number (número de identificação do veículo). WMI = World Manufacturer Identifier, campo do VIN que identifica o fabricante a nível mundial.'
periodicity: ['1000780ms']
senders: ['BSI', 'ICSV']
receivers: ['BTEL', 'CMB', 'EMF', 'CDC', 'RAD', 'MDS', 'MATT', 'BGP', 'OVIP']

