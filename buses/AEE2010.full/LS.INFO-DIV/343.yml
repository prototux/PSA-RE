id: 0x343
name: 'ODI_DYNAMIC_DATA_LIST_REQUEST_BUFFER'
type: 'can'
length: 8
comment:
  en: 'Opaque data buffer of the embedded diagnostics interface (ODI) between the telematics unit and the diagnostic tool: dynamic-data list request.'
  fr: 'Tampon de données opaque de l''interface de diagnostic embarquée (ODI) entre le boîtier télématique et l''outil de diagnostic : requête de liste de données dynamiques.'
  es: 'Buffer de datos opaco de la interfaz de diagnóstico embebida (ODI) entre la unidad telemática y la herramienta de diagnóstico: solicitud de lista de datos dinámicos.'
  de: 'Undurchsichtiger Datenpuffer der eingebetteten Diagnoseschnittstelle (ODI) zwischen Telematikeinheit und Diagnosetool: Listenanfrage dynamischer Daten.'
  it: 'Buffer di dati opaco dell''interfaccia di diagnosi integrata (ODI) tra l''unità telematica e lo strumento di diagnosi: richiesta elenco dati dinamici.'
  pl: 'Nieprzejrzysty bufor danych wbudowanego interfejsu diagnostycznego (ODI) między modułem telematycznym a narzędziem diagnostycznym: zadanie listy danych dynamicznych.'
  ru: 'Непрозрачный буфер данных встроенного диагностического интерфейса (ODI) между телематическим блоком и диагностическим инструментом: запрос списка динамических данных.'
  zh: '远程信息处理单元与诊断工具之间嵌入式诊断接口(ODI)的不透明数据缓冲区:动态数据列表请求。'
  hu: 'A telematikai egység és a diagnosztikai eszköz közötti beágyazott diagnosztikai interfész (ODI) átláthatatlan adatpufferje: dinamikus adatlista-kérés.'
  pt: 'Buffer de dados opaco da interface de diagnóstico embutida (ODI) entre a unidade telemática e a ferramenta de diagnóstico: pedido de lista de dados dinâmicos.'
periodicity: ['trigger']
senders: ['BTEL']
receivers: ['MDS']

