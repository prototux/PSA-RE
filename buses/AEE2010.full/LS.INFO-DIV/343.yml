      de: 'Open-Display-Interface(ODI)-Puffer für Anforderungen dynamischer Datenlisten des zentralen Displays'
      it: 'Buffer di richiesta elenco dati dinamici Open Display Interface (ODI) per il display centrale'
      pl: 'Bufor żądania listy danych dynamicznych Open Display Interface (ODI) dla ekranu centralnego'
      ru: 'Буфер запроса списка динамических данных Open Display Interface (ODI) для центрального дисплея'
      zh: '中控屏Open Display Interface(ODI)动态数据列表请求缓冲区'
      hu: 'Open Display Interface (ODI) dinamikus adatlista-kérés puffer a középső kijelzőhöz'
