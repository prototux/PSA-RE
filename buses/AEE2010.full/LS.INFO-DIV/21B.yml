id: 0x21B
name: 'PROFILE_SETTINGS_SCREEN_2'
type: 'can'
length: 5
comment:
  en: 'Driver profile and settings screen requests (part 2): ambient lighting animation and colour, privacy mode.'
  fr: 'Demandes de l''écran de profil et réglages conducteur (partie 2) : animation et couleur de l''éclairage d''ambiance, mode privé.'
  es: 'Solicitudes de la pantalla de perfil y ajustes del conductor (parte 2): animación y color de la iluminación ambiental, modo privado.'
  de: 'Anforderungen des Bildschirms für Fahrerprofil und Einstellungen (Teil 2): Animation und Farbe der Ambientebeleuchtung, Privatmodus.'
  it: 'Richieste della schermata di profilo e impostazioni conducente (parte 2): animazione e colore dell''illuminazione ambientale, modalità privacy.'
  pl: 'Żądania z ekranu profilu i ustawień kierowcy (część 2): animacja i kolor oświetlenia nastrojowego, tryb prywatności.'
  ru: 'Запросы экрана профиля и настроек водителя (часть 2): анимация и цвет атмосферной подсветки, режим приватности.'
  zh: '驾驶员配置文件和设置屏幕请求(第2部分):氛围灯动画和颜色、隐私模式。'
  hu: 'A vezetői profil és beállítások képernyőjének kérései (2. rész): hangulatvilágítás animációja és színe, adatvédelmi mód.'
  pt: 'Pedidos do ecrã de perfil e definições do condutor (parte 2): animação e cor da iluminação ambiente, modo de privacidade.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['trigger']
senders: ['RAD', 'MATT', 'BTEL', 'CMB', 'ICSV', 'OVIP', 'EMF']
receivers: ['BSI']

signals:
  UNUSED_1:
    bits: '1.7-1.0'
    unused: true

