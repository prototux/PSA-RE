id: 0x276
name: 'VSM_SLOW_DATA'
type: 'can'
length: 8
comment:
  en: 'Clock display, year, AdBlue range and display request, electrical architecture identifier, and seat/boot/rear-opening condition and selectivity status.'
  fr: 'Affichage de l''horloge, année, autonomie AdBlue et demande d''affichage, identifiant d''architecture électrique/électronique, et état condamnation siège/coffre/ouverture arrière et sélectivité.'
  es: 'Visualización del reloj, año, autonomía AdBlue y solicitud de visualización, identificador de arquitectura eléctrica/electrónica, y estado de bloqueo de asiento/maletero/apertura trasera y selectividad.'
  de: 'Uhranzeige, Jahr, AdBlue-Reichweite und Anzeigeanforderung, Kennung der Elektrik-/Elektronikarchitektur, sowie Sitz-/Kofferraum-/Heckklappen-Verriegelungsstatus und Selektivität.'
  it: 'Visualizzazione orologio, anno, autonomia AdBlue e richiesta di visualizzazione, identificatore architettura elettrica/elettronica, e stato blocco sedile/baule/apertura posteriore e selettività.'
  pl: 'Wyświetlanie zegara, rok, zasięg AdBlue i żądanie wyświetlania, identyfikator architektury elektrycznej/elektronicznej, oraz stan zablokowania fotela/bagażnika/otwarcia tylnego i selektywności.'
  ru: 'Отображение часов, год, запас хода AdBlue и запрос отображения, идентификатор электрической/электронной архитектуры, а также статус блокировки сиденья/багажника/заднего проёма и селективности.'
  zh: '时钟显示、年份、AdBlue续航里程和显示请求、电气架构标识符,以及座椅/后备箱/后开口锁定状态和选择性状态。'
  hu: 'Óra kijelzése, év, AdBlue hatótáv és megjelenítési kérés, elektromos/elektronikai architektúra azonosító, valamint az ülés/csomagtartó/hátsó nyílás zárolási állapota és szelektivitás.'
  pt: 'Apresentação do relógio, ano, autonomia de AdBlue e pedido de apresentação, identificador da arquitetura elétrica, e estado de condição e seletividade dos bancos/bagageira/aberturas traseiras.'
observations:
  en: 'Depends on the ECU (component-specific behaviour)'
  fr: 'Dépend du calculateur (comportement propre à l''organe)'
  es: 'Depende de la ECU (comportamiento propio del componente)'
  de: 'Abhängig vom Steuergerät (bauteilspezifisches Verhalten)'
  it: 'Dipende dalla centralina (comportamento specifico del componente)'
  pl: 'Zależy od sterownika (zachowanie specyficzne dla podzespołu)'
  ru: 'Зависит от блока управления (поведение конкретного узла)'
  zh: '取决于该ECU的具体行为'
  hu: 'A vezérlőegységtől függ (alkatrész-specifikus viselkedés)'
  pt: 'Depende da unidade de controlo (comportamento específico do componente)'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['SDCM', 'MDS', 'ICSV', 'CMB', 'EMF', 'MATT', 'BTEL', 'OVIP', 'IDVR', 'RAD']

signals:
