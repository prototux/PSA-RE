id: 0x320
name: 'HYBRID_CONSUMPTION_GAIN'
type: 'can'
length: 6
comment:
  en: 'Fuel consumption savings achieved by the hybrid system over the last six periods.'
  fr: 'Gains de consommation réalisés par le système hybride sur les six dernières périodes.'
  es: 'Ahorros de consumo obtenidos por el sistema híbrido en los últimos seis periodos.'
  de: 'Kraftstoffverbrauchseinsparungen des Hybridsystems über die letzten sechs Zeiträume.'
  it: 'Risparmi di consumo ottenuti dal sistema ibrido negli ultimi sei periodi.'
  pl: 'Oszczędności zużycia paliwa uzyskane przez system hybrydowy w ostatnich sześciu okresach.'
  ru: 'Экономия расхода топлива, достигнутая гибридной системой за последние шесть периодов.'
  zh: '混合动力系统在过去六个周期内实现的油耗节省量。'
  hu: 'A hibrid rendszer által elért fogyasztásmegtakarítás az utolsó hat időszakban.'
  pt: 'Poupanças de consumo de combustível obtidas pelo sistema híbrido nos últimos seis períodos.'
periodicity: ['1000530ms']
senders: ['BSI']
receivers: ['OVIP', 'RAD']

signals:
  CONSUMPTION_HISTORY_MEDALS_1:
    bits: '1.7-1.3'
    comment:
      en: 'Number of medals shown on consumption history bar 1'
      fr: 'Nombre de médailles affiché sur la barre 1 de l''historique de consommation'
      es: 'Número de medallas mostradas en la barra 1 del historial de consumo'
      de: 'Anzahl der Medaillen auf Balken 1 des Verbrauchsverlaufs'
      it: 'Numero di medaglie visualizzate sulla barra 1 della cronologia dei consumi'
      pl: 'Liczba medali wyświetlanych na pasku 1 historii zużycia'
      ru: 'Количество медалей на полосе 1 истории расхода'
      zh: '油耗历史第1栏显示的奖牌数量'
      hu: 'A fogyasztási előzmények 1. sávján megjelenő érmek száma'
      pt: 'Número de medalhas apresentadas na barra 1 do histórico de consumo'
    type: 'uint'
    factor: 1
    min: 0
    max: 20
    units: 'kWh/100km'
    default: 0x00

