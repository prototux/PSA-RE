id: 0x1CE
name: 'SDCM_PROGRAMMING'
type: 'can'
length: 8
comment:
  en: 'Programming code and reference number for the SDCM steering-control module.'
  fr: 'Code de programmation et numéro de référence pour le module de commande au volant SDCM.'
  es: 'Código de programación y número de referencia del módulo de mando al volante SDCM.'
  de: 'Programmiercode und Referenznummer des Lenkrad-Bedienmoduls SDCM.'
  it: 'Codice di programmazione e numero di riferimento del modulo comandi al volante SDCM.'
  pl: 'Kod programowania i numer referencyjny modulu sterowania kierownicy SDCM.'
  ru: 'Код программирования и номер модуля управления на руле SDCM.'
  zh: '方向盘控制模块SDCM的编程代码及参考编号。'
  hu: 'A kormánykerekes kezelőmodul (SDCM) programozási kódja és referenciaszáma.'
  pt: 'Código de programação e número de referência do módulo de comando ao volante SDCM.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['SDCM']

signals:
