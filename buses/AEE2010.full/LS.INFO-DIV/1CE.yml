      zh: '定义SDCM代码编号的标识符'
      hu: 'Az SDCM kódszámát meghatározó azonosító'
      pt: 'Identificador que define o número de código do módulo smart device (SDCM)'
    type: 'uint'
    min: 0
    max: 15

