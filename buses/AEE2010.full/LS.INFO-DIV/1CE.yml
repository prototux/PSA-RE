      ru: 'Программирование RSK, кода IN, кода HF, кода IDE и номера ключа для модуля смарт-устройства (SDCM)'
      zh: '智能设备控制模块(SDCM)的RSK、IN码、HF码、IDE码及钥匙编号编程'
