    comment:
      en: 'Counter marking the set of learning frames belonging to the same code'
      fr: 'Compteur marquant l''ensemble des trames d''apprentissage appartenant à un même code'
      es: 'Contador que marca el conjunto de tramas de aprendizaje pertenecientes al mismo código'
      de: 'Zähler zur Kennzeichnung der zu einem gemeinsamen Code gehörenden Lernrahmen'
      it: 'Contatore che contrassegna l''insieme dei frame di apprendimento appartenenti allo stesso codice'
      pl: 'Licznik oznaczający zestaw ramek uczenia należących do tego samego kodu'
      ru: 'Счётчик, отмечающий набор кадров обучения, относящихся к одному коду'
      zh: '标记属于同一代码的一组学习帧的计数器'
      hu: 'Az azonos kódhoz tartozó betanító keretek csoportját jelölő számláló'
      pt: 'Contador que marca o conjunto de tramas de aprendizagem pertencentes ao mesmo código'
    type: 'uint'
    min: 0
    max: 15

