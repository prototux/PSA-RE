id: 0x224
name: 'RADIO_STATUS_AUDIO_SURROUND'
type: 'can'
length: 3
comment:
  en: 'Audio surround settings: mid, subwoofer, surround and centre-channel levels, and auxiliary level adjustment (AAS).'
  fr: 'Réglages audio surround : niveaux médium, caisson de basses, surround et voie centrale, et réglage de niveau auxiliaire (AAS).'
  es: 'Ajustes de audio surround: niveles de medios, subwoofer, surround y canal central, y ajuste de nivel auxiliar (AAS).'
  de: 'Surround-Audioeinstellungen: Pegel für Mitten, Subwoofer, Surround und Center-Kanal, sowie Hilfspegeleinstellung (AAS).'
  it: 'Impostazioni audio surround: livelli medi, subwoofer, surround e canale centrale, e regolazione del livello ausiliario (AAS).'
  pl: 'Ustawienia audio surround: poziomy średnich tonów, subwoofera, surround i kanału centralnego oraz regulacja poziomu pomocniczego (AAS).'
  ru: 'Настройки объёмного звука: уровни средних частот, сабвуфера, surround и центрального канала, а также регулировка вспомогательного уровня (AAS).'
  zh: '环绕声音频设置:中音、低音炮、环绕声和中置声道电平,以及辅助电平调整(AAS)。'
  hu: 'Térhangzás beállítások: közép, mélynyomó, surround és középcsatorna szintek, valamint kiegészítő szintbeállítás (AAS).'
  pt: 'Definições de som surround: níveis de médios, subwoofer, surround e canal central, e ajuste do nível auxiliar (AAS).'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['500ms', 'trigger']
senders: ['BTEL', 'OVIP']
receivers: ['ICSV', 'AMPLI']

signals:
  MIDRANGE_VALUE:
    bits: '1.7-1.4'
    comment:
      en: 'Current level of midrange setpoint'
      fr: 'Niveau courant de la consigne des médiums'
      es: 'Nivel actual de la consigna de medios'
      de: 'Aktueller Sollwert der Mitten'
      it: 'Livello attuale del setpoint dei medi'
      pl: 'Bieżący poziom nastawy tonów średnich'
      ru: 'Текущий уровень заданного значения СЧ'
      zh: '中音设定当前值'
      hu: 'A középhang aktuális beállított értéke'
      pt: 'Nível atual da consigna de médios'
    type: 'uint'
    factor: 1
    offset: -7
    min: -7
    max: 7
    default: 0x07

  SUBWOOFER_LEVEL:
    bits: '1.3-1.0'
    comment:
      en: 'Flow determining the regulation level of the Subwoofer'
      fr: 'Flux déterminant le niveau de réglage du CAISSON DE BASSE'
      es: 'Flujo que determina el nivel de ajuste del subwoofer'
      de: 'Signal zur Bestimmung des Einstellpegels des Subwoofers'
      it: 'Flusso che determina il livello di regolazione del subwoofer'
      pl: 'Sygnał określający poziom regulacji subwoofera'
      ru: 'Поток, определяющий уровень регулировки сабвуфера'
      zh: '决定低音炮调节电平的信号'
      hu: 'A mélynyomó szabályozási szintjét meghatározó jel'
      pt: 'Fluxo que determina o nível de ajuste do subwoofer'
    type: 'uint'
    factor: 1
    offset: -7
    min: -7
    max: 7
    default: 0x07

  CENTER_CHANNEL_LEVEL:
    bits: '2.7-2.4'
    comment:
      en: 'Flow determining the regulation level of the Central Way'
      fr: 'Flux déterminant le niveau de réglage de la VOIE CENTRALE'
      es: 'Flujo que determina el nivel de ajuste del canal central'
      de: 'Signal zur Bestimmung des Einstellpegels des Center-Kanals'
      it: 'Flusso che determina il livello di regolazione del canale centrale'
      pl: 'Sygnał określający poziom regulacji kanału centralnego'
      ru: 'Поток, определяющий уровень регулировки центрального канала'
      zh: '决定中置声道调节电平的信号'
      hu: 'A középső csatorna szabályozási szintjét meghatározó jel'
      pt: 'Fluxo que determina o nível de ajuste do canal central'
    type: 'uint'
    factor: 1
    offset: -7
    min: -7
    max: 7
    default: 0x07

  SURROUND_LEVEL:
    bits: '2.3-2.2'
    comment:
      en: 'Flow determining the efficiency level of the SURROUND'
      fr: 'Flux déterminant le niveau d''efficacité du SURROUND'
      es: 'Flujo que determina el nivel de eficacia del sonido envolvente'
      de: 'Signal zur Bestimmung des Wirkungsgrads des Surround-Systems'
      it: 'Flusso che determina il livello di efficacia del surround'
      pl: 'Sygnał określający poziom skuteczności dźwięku surround'
      ru: 'Поток, определяющий уровень эффективности объёмного звука'
      zh: '决定环绕声效果等级的信号'
      hu: 'A térhatású hangzás hatékonysági szintjét meghatározó jel'
      pt: 'Fluxo que determina o nível de eficácia do som envolvente'
    type: 'uint'
    min: 0
    max: 3
    default: 0x00

  UNUSED_1:
    bits: '2.1-2.0'
    unused: true

  AAS_BEEP_LEVEL_ADJUSTMENT:
    bits: '3.7-3.5'
    comment:
      en: 'Adjustment of the level of beep AAS'
      fr: 'Ajustement du niveau de beep AAS'
      es: 'Ajuste del nivel del pitido AAS'
      de: 'Einstellung der Lautstärke des AAS-Signaltons'
      it: 'Regolazione del livello del segnale acustico AAS'
      pl: 'Regulacja poziomu sygnału dźwiękowego AAS'
      ru: 'Регулировка уровня звукового сигнала AAS'
      zh: 'AAS 提示音音量调节'
      hu: 'Az AAS hangjelzés szintjének beállítása'
      pt: 'Ajuste do nível do sinal sonoro AAS'
    type: 'uint'
    factor: 4
    offset: -16
    min: -8
    max: 8
    units: 'dB(A)'
    invalid: 0x00
    default: 0x00

  UNUSED_2:
    bits: '3.4-3.0'
    unused: true
