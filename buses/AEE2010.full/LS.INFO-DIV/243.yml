id: 0x243
name: 'ODI_BUFFER_FROM_TELEMATICS'
type: 'can'
length: 8
comment:
  en: 'Opaque data buffer of the embedded diagnostics interface (ODI) between the telematics unit and the diagnostic tool: data sent from the telematics unit.'
  fr: 'Tampon de données opaque de l''interface de diagnostic embarquée (ODI) entre le boîtier télématique et l''outil de diagnostic : données envoyées depuis le boîtier télématique.'
  es: 'Buffer de datos opaco de la interfaz de diagnóstico embebida (ODI) entre la unidad telemática y la herramienta de diagnóstico: datos enviados desde la unidad telemática.'
  de: 'Undurchsichtiger Datenpuffer der eingebetteten Diagnoseschnittstelle (ODI) zwischen Telematikeinheit und Diagnosetool: von der Telematikeinheit gesendete Daten.'
  it: 'Buffer di dati opaco dell''interfaccia di diagnosi integrata (ODI) tra l''unità telematica e lo strumento di diagnosi: dati inviati dall''unità telematica.'
  pl: 'Nieprzejrzysty bufor danych wbudowanego interfejsu diagnostycznego (ODI) między modułem telematycznym a narzędziem diagnostycznym: dane wysyłane z modulu telematycznego.'
  ru: 'Непрозрачный буфер данных встроенного диагностического интерфейса (ODI) между телематическим блоком и диагностическим инструментом: данные, отправляемые телематическим блоком.'
  zh: '远程信息处理单元与诊断工具之间嵌入式诊断接口(ODI)的不透明数据缓冲区:由远程信息处理单元发送的数据。'
  hu: 'A telematikai egység és a diagnosztikai eszköz közötti beágyazott diagnosztikai interfész (ODI) átláthatatlan adatpufferje: a telematikai egység által küldött adatok.'
  pt: 'Buffer de dados opaco da interface de diagnóstico embutida (ODI) entre a unidade telemática e a ferramenta de diagnóstico: dados enviados a partir da unidade telemática.'
periodicity: ['trigger']
senders: ['MDS']
receivers: ['BTEL']

signals:
  ODI_TELEMATICS_TO_CENTERSTACK_BUFFER:
    bits: '1.7-8.0'
    comment:
      en: 'Open Display Interface (ODI) buffer, telematics unit to center stack display'
      fr: 'Tampon Open Display Interface (ODI), du module télématique vers l''écran central'
      es: 'Búfer Open Display Interface (ODI), de la unidad telemática a la pantalla central'
      de: 'Open-Display-Interface(ODI)-Puffer, Telematikeinheit zum zentralen Display'
      it: 'Buffer Open Display Interface (ODI), dall''unità telematica al display centrale'
      pl: 'Bufor Open Display Interface (ODI), z modułu telematycznego do ekranu centralnego'
      ru: 'Буфер Open Display Interface (ODI), от телематического блока к центральному дисплею'
      zh: 'Open Display Interface(ODI)缓冲区,从远程信息处理单元到中控屏'
      hu: 'Open Display Interface (ODI) puffer, a telematikai egységtől a középső kijelzőig'
      pt: 'Buffer Open Display Interface (ODI), da unidade telemática para o ecrã central'
    type: 'uint'
