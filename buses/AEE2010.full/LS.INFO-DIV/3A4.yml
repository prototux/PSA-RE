id: 0x3A4
name: 'DASHCAM_BUTTON_REQUESTS'
type: 'can'
length: 1
comment:
  en: 'Dashcam recording button press events, relayed by the telematics unit.'
  fr: 'Événements d''appui sur les boutons d''enregistrement du dashcam, relayés par le boîtier télématique.'
  es: 'Eventos de pulsación de los botones de grabación del dashcam, retransmitidos por la unidad telemática.'
  de: 'Tastendruckereignisse der Dashcam-Aufnahmetasten, weitergeleitet von der Telematikeinheit.'
  it: 'Eventi di pressione dei pulsanti di registrazione del dashcam, inoltrati dall''unità telematica.'
  pl: 'Zdarzenia naciśnięcia przycisków nagrywania wideorejestratora, przekazywane przez jednostkę telematyczną.'
  ru: 'События нажатия кнопок записи видеорегистратора, ретранслируемые телематическим блоком.'
  zh: '由车载通信单元转发的行车记录仪录制按钮按下事件。'
  hu: 'A fedélzeti kamera felvételgombjainak megnyomási eseményei, amelyeket a telematikai egység továbbít.'
  pt: 'Eventos de pressão dos botões de gravação da câmara de bordo, retransmitidos pela unidade telemática.'
observations:
  en: 'On state change of: SIDE_TRAJECTORY_BUTTON_STATUS, ARC_PUSH_INPUT'
  fr: 'Sur changement d''état de : SIDE_TRAJECTORY_BUTTON_STATUS, ARC_PUSH_INPUT'
  es: 'Al cambiar el estado de: SIDE_TRAJECTORY_BUTTON_STATUS, ARC_PUSH_INPUT'
  de: 'Bei Statusänderung von: SIDE_TRAJECTORY_BUTTON_STATUS, ARC_PUSH_INPUT'
  it: 'Al cambiamento di stato di: SIDE_TRAJECTORY_BUTTON_STATUS, ARC_PUSH_INPUT'
  pl: 'Wysyłane przy zmianie stanu: SIDE_TRAJECTORY_BUTTON_STATUS, ARC_PUSH_INPUT'
  ru: 'При изменении состояния: SIDE_TRAJECTORY_BUTTON_STATUS, ARC_PUSH_INPUT'
  zh: '当ENT_PUSH_STL, ENT_PUSH_ARC状态变化时'
  hu: 'A(z) SIDE_TRAJECTORY_BUTTON_STATUS, ARC_PUSH_INPUT állapotváltozásakor'
  pt: 'Na mudança de estado de: SIDE_TRAJECTORY_BUTTON_STATUS, ARC_PUSH_INPUT'
periodicity: ['200ms', 'trigger']
senders: ['BTEL', 'OVIP']
receivers: ['IDVR']

signals:
  SIDE_TRAJECTORY_BUTTON_STATUS:
    bits: '1.7'
    comment:
      en: 'Lane departure warning push-button input'
      fr: 'Entrée de la touche de suivi de trajectoire latérale (avertisseur de franchissement de ligne)'
      es: 'Entrada del botón de seguimiento de trayectoria lateral (aviso de cambio de carril)'
      de: 'Eingang der Taste für Spurhalteüberwachung'
      it: 'Ingresso del pulsante di monitoraggio della traiettoria laterale'
      pl: 'Wejście przycisku monitorowania toru bocznego (ostrzeżenie o zjeździe z pasa)'
      ru: 'Вход кнопки контроля бокового отклонения (предупреждение о выходе из полосы)'
      zh: '车道偏离警告按钮输入'
      hu: 'A sávtartás-figyelmeztetés gombjának bemenete'
      pt: 'Entrada do botão de seguimento de trajetória lateral (aviso de saída de faixa)'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Not activated'
        fr: 'Non activé'
        es: 'No activado'
        de: 'Nicht aktiviert'
        it: 'Non attivato'
        pl: 'Nieaktywowany'
        ru: 'Не активировано'
        zh: '未激活'
        hu: 'Nincs aktiválva'
        pt: 'Não ativado'
      0x01:
        en: 'Activated'
        fr: 'Activée'
        es: 'Activado'
        de: 'Aktiviert'
        it: 'Attivato'
        pl: 'Aktywowany'
        ru: 'Активировано'
        zh: '已激活'
        hu: 'Aktiválva'
        pt: 'Ativado'

  ARC_PUSH_INPUT:
    bits: '1.6'
    comment:
      en: 'Front collision warning button input'
      fr: 'Entrée du bouton d''alerte de collision frontale (ARC)'
      es: 'Entrada del botón de alerta de colisión frontal (ARC)'
      de: 'Eingang der Frontkollisionswarn-Taste (ARC)'
      it: 'Ingresso del pulsante di allarme collisione frontale (ARC)'
      pl: 'Wejście przycisku ostrzegania o kolizji czołowej (ARC)'
      ru: 'Вход кнопки предупреждения о фронтальном столкновении (ARC)'
      zh: '前方碰撞预警按钮(ARC)输入'
      hu: 'A frontális ütközésfigyelmeztető (ARC) gomb bemenete'
      pt: 'Entrada do botão de alerta de colisão frontal (ARC)'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Inactive'
        fr: 'Non activé'
        es: 'Inactivo'
        de: 'Inaktiv'
        it: 'Inattivo'
        pl: 'Nieaktywny'
        ru: 'Неактивно'
        zh: '未激活'
        hu: 'Inaktív'
        pt: 'Inativo'
      0x01:
        en: 'Active'
        fr: 'Actif'
        es: 'Activo'
        de: 'Aktiv'
        it: 'Attivo'
        pl: 'Aktywny'
        ru: 'Активно'
        zh: '激活'
        hu: 'Aktív'
        pt: 'Ativo'

  UNUSED_1:
    bits: '1.5-1.0'
    unused: true
