id: 0x127
name: 'ADAPTIVE_CRUISE_STATUS'
type: 'can'
length: 7
comment:
  en: 'Adaptive cruise control status relayed by the body computer: detected target, collision risk, inter-vehicle distance and time gap.'
  fr: 'État du régulateur de vitesse adaptatif relayé par le BSI : cible détectée, risque de collision, distance et temps inter-véhicule.'
  es: 'Estado del regulador de velocidad adaptativo retransmitido por la BSI: objetivo detectado, riesgo de colisión, distancia y tiempo entre vehículos.'
  de: 'Status des adaptiven Tempomats, weitergeleitet vom BSI: erkanntes Ziel, Kollisionsrisiko, Fahrzeugabstand und Zeitlücke.'
  it: 'Stato del cruise control adattivo inoltrato dal BSI: bersaglio rilevato, rischio di collisione, distanza e tempo tra veicoli.'
  pl: 'Stan adaptacyjnego tempomatu przekazywany przez BSI: wykryty cel, ryzyko kolizji, odległość i odstęp czasowy między pojazdami.'
  ru: 'Статус адаптивного круиз-контроля, ретранслируемый BSI: обнаруженная цель, риск столкновения, дистанция и временной интервал между автомобилями.'
  zh: '由车身控制器转发的自适应巡航状态:检测到的目标、碰撞风险、车间距离及车间时间。'
  hu: 'Az adaptív tempomat állapota, amelyet a BSI továbbít: észlelt célobjektum, ütközési kockázat, jármű közötti távolság és időrés.'
  pt: 'Estado do regulador de velocidade adaptativo retransmitido pela BSI: alvo detetado, risco de colisão, distância e intervalo de tempo entre veículos.'
periodicity: ['200ms']
senders: ['BSI']
receivers: ['MATT', 'VTH']

