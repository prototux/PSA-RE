id: 0x0A9
name: 'IMMOBILIZER_SEED_GEARBOX_BSI'
type: 'can-tp'
comment:
  en: 'Multi-frame payload carrying a second set of navigation export data to the display.'
  fr: 'Charge utile multi-trame transportant un second jeu de données d''export navigation vers l''écran.'
  es: 'Carga útil multitrama que transporta un segundo conjunto de datos de exportación de navegación hacia la pantalla.'
  de: 'Mehrrahmen-Nutzlast mit einem zweiten Satz Navigations-Exportdaten für das Display.'
  it: 'Payload multi-trama che trasporta un secondo insieme di dati di esportazione della navigazione verso il display.'
  pl: 'Wieloramkowy ładunek drugiego zestawu danych eksportu nawigacji przesyłany do wyświetlacza.'
  ru: 'Многокадровые данные второго набора экспорта навигации, передаваемые на дисплей.'
  zh: '承载第二组导航导出数据发送给显示屏的多帧载荷。'
  hu: 'Több keretből álló hasznos adat, amely a navigáció exportadatainak második csoportját viszi a kijelzőnek.'
  pt: 'Payload multi-trama que transporta um segundo conjunto de dados de exportação da navegação para o visor.'
periodicity: ['trigger']
senders: ['BTEL', 'OVIP']
receivers: ['ICSV', 'CMB']
isotp:
  flow_control_id: 0x0E9

signals:
  PAYLOAD:
    bits: '1.7-n'
    comment:
      en: 'Application data (reassembled)'
      fr: 'Données applicatives (réassemblées)'
      es: 'Datos de aplicación (reensamblados)'
      de: 'Anwendungsdaten (wieder zusammengesetzt)'
      it: 'Dati applicativi (riassemblati)'
      pl: 'Dane aplikacyjne (ponownie złożone)'
      ru: 'Прикладные данные (пересобранные)'
      zh: '应用数据（重组后）'
      hu: 'Alkalmazásadatok (újraösszeállítva)'
      pt: 'Dados de aplicação (reagrupados)'
    type: 'bytes'

alternatives:
  - note:
      en: 'Other layout observed for this frame (other software or car version)'
      fr: 'Autre disposition observée pour cette trame (autre version de logiciel ou de véhicule)'
      es: 'Otra disposición observada para esta trama (otra versión de software o de vehículo)'
      de: 'Andere beobachtete Belegung dieser Botschaft (andere Software- oder Fahrzeugversion)'
      it: 'Altra disposizione osservata per questo frame (altra versione di software o di vettura)'
      pl: 'Inny zaobserwowany układ tej ramki (inna wersja oprogramowania lub samochodu)'
      ru: 'Другая наблюдаемая раскладка этого кадра (другая версия ПО или автомобиля)'
      zh: '此帧观察到的另一种布局（其他软件或车型版本）'
      hu: 'A keret másik megfigyelt elrendezése (más szoftver- vagy autóverzió)'
      pt: 'Outra disposição observada para esta trama (outra versão de software ou de veículo)'
    periodicity: ['trigger']
    senders: ['ICSV', 'BTEL', 'OVIP']
    receivers: ['CMB']
    signals:
      NAV2_INFO_TYPE:
        bits: '1.7-1.4'
        comment:
          en: 'Type of information transmitted by the telematics unit (BTEL) (none, street name rosette export, current street name, junction view / lane guidance)'
          fr: 'Type d''information transmise par le module télématique (BTEL) (aucun, export rosace de rue, nom de rue en cours, vue de jonction / guidage de voie)'
          es: 'Tipo de información transmitida por la unidad telemática (BTEL) (ninguna, exportación de la rosa de calles, nombre de calle actual, vista de intersección / guía de carril)'
          de: 'Vom Telematikmodul (BTEL) übermittelte Informationsart (keine, Straßenrosette-Export, aktueller Straßenname, Kreuzungsansicht / Spurführung)'
          it: 'Tipo di informazione trasmessa dall''unità telematica (BTEL) (nessuna, esportazione rosa delle vie, nome via corrente, vista incrocio / guida corsia)'
          pl: 'Rodzaj informacji przesyłanej przez moduł telematyczny (BTEL) (brak, eksport róży ulic, aktualna nazwa ulicy, widok skrzyżowania / prowadzenie po pasach)'
          ru: 'Тип информации, передаваемой телематическим модулем (BTEL) (нет, экспорт розы улиц, текущее название улицы, вид развязки / указание полосы)'
          zh: '远程信息处理单元(BTEL)发送的信息类型(无、街道罗盘导出、当前街道名称、路口视图/车道引导)'
          hu: 'A telematikai egység (BTEL) által küldött információ típusa (nincs, utcarózsa export, aktuális utcanév, csomópontnézet / sávvezetés)'
          pt: 'Tipo de informação transmitida pelo módulo telemático (BTEL) (nenhuma, exportação da rosácea de ruas, nome da rua atual, vista de cruzamento / guia de faixa)'
