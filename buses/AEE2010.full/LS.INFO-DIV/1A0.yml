id: 0x1A0
name: 'CD_CHANGER_CONFIG_STATUS'
type: 'can'
length: 2
comment:
  en: 'CD changer configuration and status: scan, random track and repertoire settings.'
  fr: 'Configuration et état du changeur CD : balayage, lecture aléatoire et répertoire.'
  es: 'Configuración y estado del cambiador de CD: escaneo, reproducción aleatoria y repertorio.'
  de: 'Konfiguration und Status des CD-Wechslers: Scan, Zufallswiedergabe und Verzeichnis.'
  it: 'Configurazione e stato del cambia CD: scansione, riproduzione casuale e repertorio.'
  pl: 'Konfiguracja i stan zmieniarki CD: skanowanie, odtwarzanie losowe i repertuar.'
  ru: 'Конфигурация и статус CD-чейнджера: сканирование, случайное воспроизведение и репертуар.'
  zh: 'CD换碟机的配置和状态:扫描、随机播放和曲目列表。'
  hu: 'A CD-váltó konfigurációja és állapota: pásztázás, véletlen lejátszás és tartalomjegyzék.'
  pt: 'Configuração e estado do leitor de CD: varrimento, faixa aleatória e definições de repertório.'
observations:
  en: 'On parameter change'
  fr: 'Sur modification d''un paramètre'
  es: 'Al modificar un parámetro'
  de: 'Bei Parameteränderung'
  it: 'Alla modifica di un parametro'
  pl: 'Przy zmianie wartości parametru'
  ru: 'При изменении параметра'
  zh: '参数被修改时'
  hu: 'Paraméter módosításakor'
  pt: 'Na mudança de parâmetro'
periodicity: ['500ms', 'trigger']
senders: ['ICSV', 'CDC']
receivers: ['EMF', 'BTEL', 'RAD', 'OVIP']

