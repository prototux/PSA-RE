        es: 'Opción no activable'
        de: 'Option nicht aktivierbar'
        it: 'Opzione non attivabile'
        pl: 'Opcji nie można aktywować'
        ru: 'Опцию невозможно активировать'
        zh: '选项无法激活'
        hu: 'Az opció nem aktiválható'
        pt: 'Opção não ativável'
      0x02:
        en: 'Option can be activated'
        fr: 'Option activable'
        es: 'Opción activable'
        de: 'Option aktivierbar'
        it: 'Opzione attivabile'
        pl: 'Opcja możliwa do aktywacji'
