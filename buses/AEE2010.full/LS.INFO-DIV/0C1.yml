id: 0x0C1
name: 'SDCM_APDU_TRANSMIT'
type: 'can-tp'
comment:
  en: 'Navigation data export payload transmitted by the SDCM'
  fr: 'Charge utile de données de navigation exportées, transmise par le SDCM'
  es: 'Carga útil de datos de navegación exportados, transmitida por el SDCM'
  de: 'Von der SDCM übertragene Nutzdaten des exportierten Navigationsdatensatzes'
  it: 'Payload dei dati di navigazione esportati, trasmesso dal SDCM'
  pl: 'Ładunek danych eksportu nawigacji przesyłany przez SDCM'
  ru: 'Полезная нагрузка экспортируемых навигационных данных, передаваемая SDCM'
  zh: '由SDCM发送的导航数据导出负载'
