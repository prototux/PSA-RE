        bits: '1.7-44.0'
        comment:
          en: 'Raw data of the APDU command sent to the NFC tag (up to 44 bytes)'
          fr: 'Données brutes de la commande APDU envoyée au tag NFC (44 octets maximum)'
          es: 'Datos en bruto del comando APDU enviado a la etiqueta NFC (máximo 44 bytes)'
          de: 'Rohdaten des an das NFC-Tag gesendeten APDU-Befehls (max. 44 Byte)'
          it: 'Dati grezzi del comando APDU inviato al tag NFC (massimo 44 byte)'
          pl: 'Surowe dane polecenia APDU wysłanego do znacznika NFC (maksymalnie 44 bajty)'
          ru: 'Необработанные данные команды APDU, отправляемой NFC-метке (максимум 44 байта)'
          zh: '发送给NFC标签的APDU命令原始数据(最多44字节)'
          hu: 'Az NFC-címkének küldött APDU-parancs nyers adata (legfeljebb 44 bájt)'
          pt: 'Dados brutos do comando APDU enviado à etiqueta NFC (máximo 44 bytes)'
        type: 'uint'
        min: 0
        max: 255
