id: 0x3AF
name: 'BSRF_COMMAND_12'
type: 'can'
length: 8
comment:
  en: 'AdBlue low level alert, engine-stopping-in-progress flag, gearbox fault, and climate physical button requests (auto mode, defrost, air intake, front blower level, temperature), sent by the BSI to the telematics gateway.'
  fr: 'Alerte niveau bas d''AdBlue, indicateur d''arrêt moteur en cours, défaut boîte de vitesses, et demandes des boutons physiques de climatisation (mode auto, dégivrage, entrée d''air, niveau pulseur avant, température), envoyés par la BSI à la passerelle télématique.'
  es: 'Alerta de nivel bajo de AdBlue, indicador de parada del motor en curso, fallo de la caja de cambios, y solicitudes de los botones físicos de climatización (modo automático, desempañado, entrada de aire, nivel del ventilador delantero, temperatura), enviados por la BSI a la pasarela telemática.'
  de: 'Warnung bei niedrigem AdBlue-Stand, Flag für laufenden Motorstopp, Getriebefehler und Anforderungen der physischen Klimatasten (Automodus, Enteisung, Lufteinlass, Gebläsestufe vorn, Temperatur), von der BSI an das Telematik-Gateway gesendet.'
  it: 'Allarme livello basso AdBlue, indicatore di arresto motore in corso, guasto cambio, e richieste dei pulsanti fisici del climatizzatore (modalità auto, sbrinamento, presa d''aria, livello ventola anteriore, temperatura), inviati dalla BSI al gateway telematico.'
  pl: 'Alarm niskiego poziomu AdBlue, flaga trwającego zatrzymania silnika, usterka skrzyni biegów, oraz żądania fizycznych przycisków klimatyzacji (tryb automatyczny, odszranianie, wlot powietrza, poziom dmuchawy przedniej, temperatura), wysyłane przez BSI do bramki telematycznej.'
  ru: 'Предупреждение о низком уровне AdBlue, флаг идущей остановки двигателя, неисправность коробки передач, и запросы физических кнопок климат-контроля (автоматический режим, размораживание, забор воздуха, уровень переднего вентилятора, температура), отправляемые BSI в телематический шлюз.'
  zh: 'AdBlue液位过低警报、发动机正在停机标志、变速箱故障，以及空调物理按键请求（自动模式、除霜、进气、前鼓风机挡位、温度），由BSI发送给远程信息处理网关。'
  hu: 'Alacsony AdBlue-szint riasztás, folyamatban lévő motorleállás jelző, váltóhiba, valamint a klíma fizikai gombjainak kérései (automata mód, párátlanítás, levegőbeömlés, első fúvóka-fokozat, hőmérséklet), a BSI küldi a telematikai átjárónak.'
  pt: 'Alerta de nível baixo de AdBlue, indicador de paragem do motor em curso, avaria da caixa de velocidades, e pedidos dos botões físicos de climatização (modo automático, desembaciamento, entrada de ar, nível do ventilador dianteiro, temperatura), enviados pela BSI ao gateway telemático.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BSRF', 'BTEL']

