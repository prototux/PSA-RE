id: 0x03B
name: 'FLUSH_HANDLE_STATUS_RR'
type: 'can'
length: 4
comment:
  en: 'Flush door handle status, rear right: motor and sensor faults, flush action and position'
  fr: 'État de la poignée de porte affleurante, arrière droite : défauts moteur et capteur, action et position d''affleurement'
  es: 'Estado de la manija de puerta enrasada, trasera derecha: fallos de motor y sensor, acción y posición de enrasado'
  de: 'Status des bündigen Türgriffs, hinten rechts: Motor- und Sensorfehler, Ausfahrvorgang und Position'
  it: 'Stato della maniglia a scomparsa della portiera, posteriore destra: guasti motore e sensore, azione e posizione di apertura'
  pl: 'Stan chowanego uchwytu drzwi, tył prawy: usterki silnika i czujnika, akcja i pozycja wysuwania'
  ru: 'Состояние выдвижной дверной ручки, задняя правая: неисправности мотора и датчика, действие и положение выдвижения'
  zh: '车门隐藏式门把手状态,右后:电机与传感器故障、弹出动作及位置'
  hu: 'A süllyesztett ajtókilincs állapota, jobb hátsó: motor- és érzékelőhibák, kiemelési művelet és pozíció'
  pt: 'Estado da maçaneta rasante, traseira direita: avarias de motor e sensor, ação de recolha e posição.'
periodicity: ['1000ms', 'trigger']
senders: ['PFHM']
receivers: ['BSI']

signals:
  FRAME_CHECKSUM:
    bits: '1.7-1.4'
    comment:
      en: 'Frame checksum.'
      fr: 'Somme de contrôle de la trame.'
      es: 'Suma de comprobación de la trama.'
      de: 'Prüfsumme des Rahmens.'
      it: 'Checksum del frame.'
      pl: 'Suma kontrolna ramki.'
      ru: 'Контрольная сумма кадра.'
      zh: '帧校验和。'
      hu: 'A keret ellenőrző összege.'
      pt: 'Soma de verificação da trama.'
    type: 'uint'

  PROCESS_COUNTER_4BIT:
    bits: '1.3-1.0'
    comment:
      en: '4-bit rolling process counter.'
      fr: 'Compteur de process tournant sur 4 bits.'
      es: 'Contador de proceso rotativo de 4 bits.'
      de: '4-Bit-Umlaufzähler des Prozesses.'
      it: 'Contatore di processo a rotazione a 4 bit.'
      pl: '4-bitowy licznik przebiegu procesu.'
      ru: '4-битный циклический счётчик процесса.'
      zh: '4位循环处理计数器。'
      hu: '4 bites körforgó folyamatszámláló.'
      pt: 'Contador de processo rotativo de 4 bits'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00

  UNUSED_1:
    bits: '2.7'
    unused: true

