id: 0x3BE
name: 'BSRF_COMMAND_13'
type: 'can'
length: 8
comment:
  en: 'Seatbelt buckle states for all seating positions, DC/DC converter state and driver seat auto-cooling request, sent by the BSI to the telematics gateway.'
  fr: 'États de bouclage des ceintures pour toutes les places, état du convertisseur DC/DC et demande de refroidissement automatique du siège conducteur, envoyés par la BSI à la passerelle télématique.'
  es: 'Estados de cierre de los cinturones para todas las plazas, estado del convertidor DC/DC y solicitud de enfriamiento automático del asiento del conductor, enviados por la BSI a la pasarela telemática.'
  de: 'Gurtschlosszustände für alle Sitzplätze, DC/DC-Wandlerzustand und Anforderung der automatischen Fahrersitzkühlung, von der BSI an das Telematik-Gateway gesendet.'
  it: 'Stati di chiusura delle cinture per tutti i posti, stato del convertitore DC/DC e richiesta di raffreddamento automatico del sedile conducente, inviati dalla BSI al gateway telematico.'
  pl: 'Stany zapięcia pasów dla wszystkich miejsc, stan przetwornicy DC/DC i żądanie automatycznego chłodzenia fotela kierowcy, wysyłane przez BSI do bramki telematycznej.'
  ru: 'Состояния пряжек ремней для всех мест, состояние DC/DC преобразователя и запрос автоматического охлаждения сиденья водителя, отправляемые BSI в телематический шлюз.'
  zh: '所有座位的安全带锁扣状态、DC/DC变换器状态及驾驶员座椅自动制冷请求，由BSI发送给远程信息处理网关。'
  hu: 'Az összes üléshely biztonságiöv-csat állapota, a DC/DC átalakító állapota és a vezetőülés automatikus hűtési kérése, a BSI küldi a telematikai átjárónak.'
  pt: 'Estados do fecho do cinto de segurança para todas as posições de banco, estado do conversor DC/DC e pedido de arrefecimento automático do banco do condutor, enviados pela BSI ao gateway telemático.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BSRF']

