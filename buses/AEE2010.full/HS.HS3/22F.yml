        fr: 'Non valide (ligne de verrouillage indéfinie)'
        es: 'No válido (línea de enclavamiento indefinida)'
        de: 'Ungültig (Verriegelungsleitung undefiniert)'
        it: 'Non valido (linea di interblocco indefinita)'
