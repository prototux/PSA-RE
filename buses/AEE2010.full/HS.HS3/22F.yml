id: 0x22F
name: 'HV_BATTERY_INSULATION_STATUS'
type: 'can'
length: 8
comment:
  en: 'High-voltage battery insulation and voltage-fault status, relayed by the body computer (BSI).'
  fr: 'État de l''isolement et des défauts de tension de la batterie haute tension, relayé par le BSI.'
  es: 'Estado del aislamiento y de los fallos de tensión de la batería de alta tensión, retransmitido por la BSI.'
  de: 'Isolations- und Spannungsfehlerstatus der Hochvoltbatterie, weitergeleitet vom BSI.'
  it: 'Stato dell''isolamento e dei guasti di tensione della batteria ad alta tensione, inoltrato dal BSI.'
  pl: 'Stan izolacji i usterek napięcia akumulatora wysokiego napięcia, przekazywany przez BSI.'
  ru: 'Состояние изоляции и неисправностей напряжения высоковольтной батареи, ретранслируемое BSI.'
  zh: '由车身控制器(BSI)转发的高压电池绝缘及电压故障状态。'
  hu: 'A nagyfeszültségű akkumulátor szigetelési és feszültséghiba-állapota, amelyet a BSI továbbít.'
  pt: 'Estado de isolamento e de avaria de tensão da bateria de alta tensão, retransmitido pelo computador de servidão (BSI).'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BSRF']

signals:
  HV_BATTERY_ACTUAL_VOLTAGE:
    bits: '1.7-2.5'
    comment:
      en: 'HV battery actual voltage (V)'
      fr: 'Tension réelle de la batterie haute tension (V)'
      es: 'Tensión real de la batería de alta tensión (V)'
      de: 'Tatsächliche Spannung der Hochvoltbatterie (V)'
      it: 'Tensione reale della batteria ad alta tensione (V)'
      pl: 'Rzeczywiste napięcie akumulatora wysokiego napięcia (V)'
      ru: 'Фактическое напряжение высоковольтной батареи (В)'
      zh: '高压电池实际电压(V)'
      hu: 'A nagyfeszültségű akkumulátor tényleges feszültsége (V)'
      pt: 'Tensão real da bateria de alta tensão (V)'
    type: 'uint'
    factor: 0.25
    min: 0
    max: 500
    units: 'V'
    invalid: 0x7FF

  HV_BATTERY_SOC_2:
    bits: '3.1-4.0'
    comment:
      en: 'HV battery state of charge (%)'
      fr: 'État de charge (SOC) de la batterie haute tension (%)'
      es: 'Estado de carga (SOC) de la batería de alta tensión (%)'
      de: 'Ladezustand (SOC) der Hochvoltbatterie (%)'
      it: 'Stato di carica (SOC) della batteria ad alta tensione (%)'
      pl: 'Stan naładowania (SOC) akumulatora wysokiego napięcia (%)'
      ru: 'Уровень заряда (SOC) высоковольтной батареи (%)'
      zh: '高压电池荷电状态(SOC)(%)'
      hu: 'A nagyfeszültségű akkumulátor töltöttségi állapota (SOC) (%)'
      pt: 'Estado de carga da bateria de alta tensão (%)'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 100
    units: '%'
    invalid: 0x3FF

  REM_OVERTEMPERATURE_FAULT:
