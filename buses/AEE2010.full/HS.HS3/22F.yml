        ru: 'Недействительно (линия блокировки не определена)'
        zh: '无效(互锁线路未定义)'
        hu: 'Érvénytelen (reteszelő vonal nincs meghatározva)'
        pt: 'Inválido (linha de intertravamento indefinida)'
      0x03:
        unused: true

