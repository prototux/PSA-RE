      zh: '由用户操作隐藏式门把手触发的唤醒'
      hu: 'A felhasználó süllyesztett ajtókilincsen végzett művelete által kiváltott ébresztés'
      pt: 'Despertar provocado por uma ação do utilizador na maçaneta de porta rasante'
