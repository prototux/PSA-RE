id: 0x37A
name: 'WAKEUP_PFHM_RL'
type: 'can'
length: 2
comment:
  en: 'Sent by a node waking up the network; indicates the cause of the wake-up'
  fr: 'Émise par un organe qui réveille le réseau ; indique la cause du réveil'
  es: 'Enviada por un nodo que activa la red; indica la causa de la activación'
  de: 'Von einem Steuergerät gesendet, das das Netzwerk weckt; gibt die Weckursache an'
  it: 'Inviata da un nodo che risveglia la rete; indica la causa del risveglio'
  pl: 'Wysyłana przez węzeł budzący sieć; wskazuje przyczynę wybudzenia'
  ru: 'Отправляется узлом, пробуждающим сеть; указывает причину пробуждения'
  zh: '由唤醒网络的节点发送,指示唤醒原因'
  hu: 'A hálózatot ébresztő csomópont küldi; jelzi az ébresztés okát'
  pt: 'Enviada por um nó que desperta a rede; indica a causa do despertar.'
observations:
  en: 'On local wake-up of the ECU'
  fr: 'Sur réveil local de l''organe'
  es: 'Al despertar localmente la ECU'
  de: 'Beim lokalen Aufwachen des Steuergeräts'
  it: 'Al risveglio locale della centralina'
  pl: 'Wysyłane przy lokalnym wybudzeniu sterownika'
  ru: 'При локальном пробуждении блока управления'
  zh: '该ECU本地唤醒时'
  hu: 'A vezérlőegység helyi felébredésekor'
  pt: 'Na ativação local da unidade de controlo'
periodicity: ['trigger']
senders: ['PFHM']
receivers: ['BSI']

signals:
  PSD_NETWORK_WAKEUP_PADDING:
    bits: '1.7-1.0'
    comment:
      en: '8 zero bits used to wake up the network'
      fr: '8 bits à zéro utilisés pour le réveil du réseau'
      es: '8 bits a cero utilizados para la activación de la red'
      de: '8 Nullbits zum Aufwecken des Netzwerks'
      it: '8 bit a zero utilizzati per il risveglio della rete'
      pl: '8 zerowych bitów wykorzystywanych do wybudzenia sieci'
      ru: '8 нулевых бит, используемых для пробуждения сети'
      zh: '用于唤醒网络的8个零位'
      hu: '8 nullás bit a hálózat ébresztéséhez'
      pt: '8 bits a zero utilizados para a ativação da rede'
    type: 'uint'

  FLUSH_DOOR_HANDLE_POSITION_CHANGE:
    bits: '2.7'
    comment:
      en: 'Wake-up caused by a flush door handle position change'
      fr: 'Réveil provoqué par un changement de position de la poignée de porte affleurante'
      es: 'Activación provocada por un cambio de posición de la manija de puerta enrasada'
      de: 'Aufwachen durch eine Positionsänderung des bündigen Türgriffs'
      it: 'Risveglio causato da un cambio di posizione della maniglia a scomparsa'
      pl: 'Wybudzenie spowodowane zmianą pozycji chowanej klamki drzwi'
      ru: 'Пробуждение, вызванное изменением положения скрытой дверной ручки'
      zh: '由隐藏式门把手位置变化触发的唤醒'
      hu: 'A süllyesztett ajtókilincs helyzetváltozása által kiváltott ébresztés'
      pt: 'Despertar causado por uma mudança de posição da maçaneta rasante'
    type: 'bool'
    values:
      0x00:
        en: 'Cause that did not trigger wake-up'
        fr: 'Cause n''ayant pas provoqué le réveil'
        es: 'Causa que no provocó la activación'
        de: 'Ursache, die kein Aufwecken ausgelöst hat'
        it: 'Causa che non ha provocato il risveglio'
        pl: 'Przyczyna, która nie spowodowała wybudzenia'
        ru: 'Причина, не вызвавшая пробуждение'
        zh: '未触发唤醒的原因'
        hu: 'Az ébresztést ki nem váltó ok'
        pt: 'Causa que não desencadeou a ativação'
      0x01:
        en: 'Wake-up cause'
        fr: 'Cause du réveil'
        es: 'Causa del despertar'
        de: 'Weckursache'
        it: 'Causa del risveglio'
        pl: 'Przyczyna wybudzenia'
        ru: 'Причина пробуждения'
        zh: '唤醒原因'
        hu: 'Ébresztés oka'
        pt: 'Causa do despertar'

