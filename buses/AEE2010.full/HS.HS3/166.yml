id: 0x166
name: 'PARKING_CAMERA_STATUS'
type: 'can'
length: 8
comment:
  en: 'Parking camera status: view display mode, activation state, wheel reference counters and detected parking slot data.'
  fr: 'État de la caméra de recul : mode d''affichage de la vue, activation, compteurs de référence roue et données de la place détectée.'
  es: 'Estado de la cámara de aparcamiento: modo de visualización, activación, contadores de referencia de rueda y datos de la plaza detectada.'
  de: 'Status der Einparkkamera: Ansichtsmodus, Aktivierung, Radreferenzzähler und Daten des erkannten Parkplatzes.'
  it: 'Stato della telecamera di parcheggio: modalità di visualizzazione, attivazione, contatori di riferimento ruota e dati del posto auto rilevato.'
  pl: 'Stan kamery parkowania: tryb wyświetlania widoku, aktywacja, liczniki referencyjne koła i dane wykrytego miejsca parkingowego.'
  ru: 'Статус парковочной камеры: режим отображения, активация, счётчики опорных импульсов колеса и данные обнаруженного места парковки.'
  zh: '泊车摄像头状态:视图显示模式、激活状态、车轮参考计数器及检测到的车位数据。'
  hu: 'A tolatókamera állapota: nézet megjelenítési módja, aktiválás, kerék referenciaszámlálók és a felismert parkolóhely adatai.'
  pt: 'Estado da câmara de estacionamento: modo de apresentação da vista, estado de ativação, contadores de referência das rodas e dados da vaga de estacionamento detetada.'
periodicity: ['200ms', 'trigger']
senders: ['AVP']
receivers: ['BSI']

