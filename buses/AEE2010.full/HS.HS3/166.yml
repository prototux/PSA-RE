      ru: 'Статус активации переднего парковочного ассистента (AVP)'
      zh: '前泊车辅助(AVP)激活状态'
      hu: 'Az elülső parkolássegítő (AVP) aktiválási állapota'
      pt: 'Estado de ativação do assistente de estacionamento dianteiro (AVP)'
