id: 0x02A
name: 'FLUSH_DOOR_HANDLE_COMMAND'
type: 'can'
length: 2
comment:
  en: 'Commands sent by the BSI to the flush door handle module: extension authorisation, delayed retraction and position requests for each door.'
  fr: 'Commandes envoyées par la BSI au module de poignées de porte affleurantes : autorisation de sortie, rétraction différée et demandes de position pour chaque porte.'
  es: 'Órdenes enviadas por la BSI al módulo de manijas de puerta enrasadas: autorización de extensión, retracción diferida y solicitudes de posición para cada puerta.'
  de: 'Von der BSI an das Modul der bündigen Türgriffe gesendete Befehle: Ausfahrfreigabe, verzögertes Einfahren und Positionsanforderungen für jede Tür.'
  it: 'Comandi inviati dalla BSI al modulo delle maniglie a scomparsa: autorizzazione all''estensione, ritrazione ritardata e richieste di posizione per ciascuna porta.'
  pl: 'Polecenia wysyłane przez BSI do modułu chowanych klamek drzwi: zezwolenie na wysunięcie, opóźnione chowanie i żądania pozycji dla każdych drzwi.'
  ru: 'Команды, отправляемые BSI в модуль убирающихся дверных ручек: разрешение выдвижения, отложенное втягивание и запросы положения для каждой двери.'
  zh: '由BSI发送给隐藏式门把手模块的命令：伸出授权、延迟收回及各车门位置请求。'
  hu: 'A BSI parancsai a süllyeszthető ajtókilincs-modul felé: kinyúlás engedélyezése, késleltetett visszahúzás és pozíciókérések minden ajtóhoz.'
  pt: 'Comandos enviados pela BSI ao módulo dos puxadores de porta rasantes: autorização de extensão, retração diferida e pedidos de posição para cada porta.'
observations:
  en: 'On state change of: FLUSH_HANDLE_REQUEST_FRONT_LEFT, FLUSH_HANDLE_REQUEST_FRONT_RIGHT, FLUSH_HANDLE_REQUEST_REAR_LEFT, FLUSH_HANDLE_REQUEST_REAR_RIGHT, FLUSH_HANDLE_AUTHORIZATION'
  fr: 'Sur changement d''état de : FLUSH_HANDLE_REQUEST_FRONT_LEFT, FLUSH_HANDLE_REQUEST_FRONT_RIGHT, FLUSH_HANDLE_REQUEST_REAR_LEFT, FLUSH_HANDLE_REQUEST_REAR_RIGHT, FLUSH_HANDLE_AUTHORIZATION'
  es: 'Al cambiar el estado de: FLUSH_HANDLE_REQUEST_FRONT_LEFT, FLUSH_HANDLE_REQUEST_FRONT_RIGHT, FLUSH_HANDLE_REQUEST_REAR_LEFT, FLUSH_HANDLE_REQUEST_REAR_RIGHT, FLUSH_HANDLE_AUTHORIZATION'
  de: 'Bei Statusänderung von: FLUSH_HANDLE_REQUEST_FRONT_LEFT, FLUSH_HANDLE_REQUEST_FRONT_RIGHT, FLUSH_HANDLE_REQUEST_REAR_LEFT, FLUSH_HANDLE_REQUEST_REAR_RIGHT, FLUSH_HANDLE_AUTHORIZATION'
  it: 'Al cambiamento di stato di: FLUSH_HANDLE_REQUEST_FRONT_LEFT, FLUSH_HANDLE_REQUEST_FRONT_RIGHT, FLUSH_HANDLE_REQUEST_REAR_LEFT, FLUSH_HANDLE_REQUEST_REAR_RIGHT, FLUSH_HANDLE_AUTHORIZATION'
  pl: 'Wysyłane przy zmianie stanu: FLUSH_HANDLE_REQUEST_FRONT_LEFT, FLUSH_HANDLE_REQUEST_FRONT_RIGHT, FLUSH_HANDLE_REQUEST_REAR_LEFT, FLUSH_HANDLE_REQUEST_REAR_RIGHT, FLUSH_HANDLE_AUTHORIZATION'
  ru: 'При изменении состояния: FLUSH_HANDLE_REQUEST_FRONT_LEFT, FLUSH_HANDLE_REQUEST_FRONT_RIGHT, FLUSH_HANDLE_REQUEST_REAR_LEFT, FLUSH_HANDLE_REQUEST_REAR_RIGHT, FLUSH_HANDLE_AUTHORIZATION'
  zh: '当FLUSH_POSITION_RQST_FL, FLUSH_HANDLE_REQUEST_FRONT_RIGHT, FLUSH_HANDLE_REQUEST_REAR_LEFT, FLUSH_HANDLE_REQUEST_REAR_RIGHT, FLUSH_AUTORIZATION状态变化时'
  hu: 'A(z) FLUSH_HANDLE_REQUEST_FRONT_LEFT, FLUSH_HANDLE_REQUEST_FRONT_RIGHT, FLUSH_HANDLE_REQUEST_REAR_LEFT, FLUSH_HANDLE_REQUEST_REAR_RIGHT, FLUSH_HANDLE_AUTHORIZATION állapotváltozásakor'
  pt: 'Na mudança de estado de: FLUSH_HANDLE_REQUEST_FRONT_LEFT, FLUSH_HANDLE_REQUEST_FRONT_RIGHT, FLUSH_HANDLE_REQUEST_REAR_LEFT, FLUSH_HANDLE_REQUEST_REAR_RIGHT, FLUSH_HANDLE_AUTHORIZATION'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['PFHM']

signals:
  FLUSH_HANDLE_REQUEST_FRONT_LEFT:
    bits: '1.7-1.6'
    comment:
      en: 'Request to electrically extract or retract the front left flush door handle'
      fr: 'Demande d''extraction ou de rétraction électrique de la poignée de porte affleurante avant gauche'
      es: 'Solicitud de extensión o retracción eléctrica de la manilla de puerta enrasada delantera izquierda'
      de: 'Anforderung zum elektrischen Ausfahren oder Einziehen des vorderen linken bündigen Türgriffs'
      it: 'Richiesta di estensione o ritiro elettrico della maniglia a scomparsa anteriore sinistra'
      pl: 'Żądanie elektrycznego wysunięcia lub schowania przedniej lewej chowanej klamki drzwi'
      ru: 'Запрос электрического выдвижения или втягивания передней левой выдвижной дверной ручки'
      zh: '请求电动伸出或缩回左前隐藏式门把手'
      hu: 'Az elülső bal süllyeszthető ajtókilincs elektromos kinyitásának vagy behúzásának kérése'
      pt: 'Pedido para extrair ou recolher eletricamente a maçaneta rasante dianteira esquerda'
    type: 'enum'
    default: 0x00
