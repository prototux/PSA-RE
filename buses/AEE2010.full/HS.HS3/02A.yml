  FLUSH_HANDLE_AUTHORIZATION:
    bits: '2.7'
    comment:
      en: 'Authorization for the powered flush door handle modules to extract/retract electrically or react to a mechanical request'
      fr: 'Autorisation pour les modules de poignée de porte affleurante motorisée de s''ouvrir/se rétracter électriquement ou de réagir à une demande mécanique'
      es: 'Autorización para que los módulos de manilla de puerta enrasada motorizada se extiendan/retraigan eléctricamente o respondan a una solicitud mecánica'
      de: 'Freigabe für die motorisierten Griffe der bündigen Türgriffe, sich elektrisch auszufahren/einzuziehen oder auf eine mechanische Anforderung zu reagieren'
      it: 'Autorizzazione per i moduli delle maniglie a scomparsa motorizzate a estendersi/ritrarsi elettricamente o a reagire a una richiesta meccanica'
      pl: 'Zezwolenie dla modułów zelektryfikowanych, chowanych klamek drzwi na elektryczne wysunięcie/schowanie lub reakcję na żądanie mechaniczne'
      ru: 'Разрешение для модулей выдвижных электроприводных дверных ручек на электрическое выдвижение/втягивание или реакцию на механический запрос'
      zh: '允许电动隐藏式门把手模块进行电动伸出/缩回或响应机械请求'
      hu: 'Engedély a motoros, süllyeszthető ajtókilincs-modulok számára az elektromos kinyílásra/behúzásra vagy a mechanikus kérésre való reagálásra'
      pt: 'Autorização para os módulos das maçanetas rasantes motorizadas extraírem/recolherem eletricamente ou reagirem a um pedido mecânico'
