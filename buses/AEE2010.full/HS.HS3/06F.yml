id: 0x06F
name: 'HV_BATTERY_ALERTS'
type: 'can'
length: 7
comment:
  en: 'High-voltage battery alert flags (overvoltage, undervoltage, high/low state of charge, cell imbalance), relayed by the body computer (BSI).'
  fr: 'Indicateurs d''alerte de la batterie haute tension (surtension, sous-tension, charge haute/basse, déséquilibre des cellules), relayés par le BSI.'
  es: 'Indicadores de alerta de la batería de alta tensión (sobretensión, subtensión, carga alta/baja, desequilibrio de celdas), retransmitidos por la BSI.'
  de: 'Warnmeldungen der Hochvoltbatterie (Über-/Unterspannung, hoher/niedriger Ladezustand, Zellungleichgewicht), weitergeleitet vom BSI.'
  it: 'Indicatori di allerta della batteria ad alta tensione (sovratensione, sottotensione, carica alta/bassa, squilibrio celle), inoltrati dal BSI.'
  pl: 'Flagi alarmowe akumulatora wysokiego napięcia (przepięcie, zbyt niskie napięcie, wysoki/niski stan naładowania, niezrównoważenie ogniw), przekazywane przez BSI.'
  ru: 'Флаги предупреждений высоковольтной батареи (перенапряжение, пониженное напряжение, высокий/низкий заряд, дисбаланс ячеек), ретранслируемые BSI.'
  zh: '由车身控制器(BSI)转发的高压电池告警标志(过压、欠压、荷电状态过高/过低、电芯不均衡)。'
  hu: 'A nagyfeszültségű akkumulátor riasztási jelzői (túlfeszültség, alacsony feszültség, magas/alacsony töltöttség, cellák egyenetlensége), amelyeket a BSI továbbít.'
  pt: 'Indicadores de alerta da bateria de alta tensão (sobretensão, subtensão, estado de carga alto/baixo, desequilíbrio de células), retransmitidos pelo computador de servidão (BSI).'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BSRF']

signals:
  HV_BATTERY_PROBE_NUMBER_TEMP_MAX:
    bits: '1.7-1.0'
    comment:
      en: 'Number of the temperature probe reading the maximum temperature'
      fr: 'Numéro de la sonde de température relevant la température maximale'
      es: 'Número de la sonda de temperatura que registra la temperatura máxima'
      de: 'Nummer des Temperaturfühlers mit der maximalen Temperatur'
      it: 'Numero della sonda di temperatura che rileva la temperatura massima'
      pl: 'Numer czujnika temperatury wskazującego temperaturę maksymalną'
      ru: 'Номер датчика температуры с максимальной температурой'
      zh: '读取最高温度的温度探头编号'
      hu: 'A legmagasabb hőmérsékletet mérő hőmérséklet-érzékelő száma'
      pt: 'Número da sonda de temperatura que regista a temperatura máxima'
    type: 'uint'
    factor: 11
    min: 1
    max: 250
    invalid: 0xFF

