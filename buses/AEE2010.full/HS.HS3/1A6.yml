id: 0x1A6
name: 'PARKING_VIEW_SYSTEM_COMMAND'
type: 'can'
length: 3
comment:
  en: 'Commands sent by the BSI to the parking view system: activation state, overlay and view type selection, brightness and contrast.'
  fr: 'Commandes envoyées par la BSI au système de vue de stationnement : état d''activation, sélection du calque et du type de vue, luminosité et contraste.'
  es: 'Órdenes enviadas por la BSI al sistema de vista de aparcamiento: estado de activación, selección de superposición y tipo de vista, brillo y contraste.'
  de: 'Von der BSI an das Park-View-System gesendete Befehle: Aktivierungszustand, Overlay- und Ansichtstypauswahl, Helligkeit und Kontrast.'
  it: 'Comandi inviati dalla BSI al sistema di visione parcheggio: stato di attivazione, selezione overlay e tipo di vista, luminosità e contrasto.'
  pl: 'Polecenia wysyłane przez BSI do systemu widoku parkowania: stan aktywacji, wybór nakładki i typu widoku, jasność i kontrast.'
  ru: 'Команды, отправляемые BSI в систему обзора парковки: состояние активации, выбор наложения и типа обзора, яркость и контраст.'
  zh: '由BSI发送给泊车影像系统的命令：激活状态、叠加层及视图类型选择、亮度和对比度。'
  hu: 'A BSI parancsai a parkolóképrendszer felé: aktiválási állapot, réteg- és nézettípus-választás, fényerő és kontraszt.'
  pt: 'Comandos enviados pela BSI ao sistema de visão de estacionamento: estado de ativação, seleção de sobreposição e tipo de vista, luminosidade e contraste.'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['AVP']

signals:
  PARKING_VIEW_CONTRAST:
    bits: '1.7-1.4'
    comment:
