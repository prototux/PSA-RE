      es: 'Ajuste de contraste de la vista de la cámara de estacionamiento'
      de: 'Kontrasteinstellung der Parkkamera-Ansicht'
      it: 'Regolazione del contrasto della vista della telecamera di parcheggio'
      pl: 'Regulacja kontrastu widoku kamery parkowania'
      ru: 'Настройка контрастности вида камеры парковки'
      zh: '泊车摄像头视图对比度设置'
      hu: 'Parkolókamera nézet kontraszt beállítás'
      pt: 'Ajuste do contraste da vista da câmara de estacionamento'
    type: 'uint'
    factor: 1
    offset: -5
    min: -5
    max: 5

