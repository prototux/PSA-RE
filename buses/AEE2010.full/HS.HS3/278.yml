id: 0x278
name: 'ENGINE_HYBRID_DYNAMIC_DATA_6'
type: 'can'
length: 3
comment:
  en: 'Parking camera view data: activation, obstacle presence, overlay, view type/selection, brightness and contrast.'
  fr: 'Données de vue de la caméra de stationnement : activation, présence d''obstacle, incrustation, type/sélection de vue, luminosité et contraste.'
  es: 'Datos de vista de la cámara de estacionamiento: activación, presencia de obstáculo, superposición, tipo/selección de vista, brillo y contraste.'
  de: 'Ansichtsdaten der Einparkkamera: Aktivierung, Hinderniserkennung, Einblendung, Ansichtstyp/-auswahl, Helligkeit und Kontrast.'
  it: 'Dati della vista della telecamera di parcheggio: attivazione, presenza ostacolo, sovrapposizione, tipo/selezione vista, luminosità e contrasto.'
  pl: 'Dane widoku kamery parkowania: aktywacja, obecność przeszkody, nakładka, typ/wybór widoku, jasność i kontrast.'
  ru: 'Данные изображения парковочной камеры: активация, наличие препятствия, наложение, тип/выбор вида, яркость и контрастность.'
  zh: '泊车摄像头画面数据:激活、障碍物存在、叠加层、视图类型/选择、亮度和对比度。'
  hu: 'A tolatókamera nézet adatai: aktiválás, akadály jelenléte, ráhelyezett kép, nézettípus/-választás, fényerő és kontraszt.'
  pt: 'Dados da vista da câmara de estacionamento: ativação, presença de obstáculo, sobreposição, tipo/seleção de vista, luminosidade e contraste.'
periodicity: ['1000ms', 'trigger']
senders: ['AVP']
receivers: ['BSI']

