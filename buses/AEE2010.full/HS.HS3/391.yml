id: 0x391
name: 'TELEMATICS_OTA_STATUS'
type: 'can'
length: 8
comment:
  en: 'Over-the-air update requests and progress for the telematics gateway and infotainment system.'
  fr: 'Demandes et avancement de mise à jour à distance (OTA) de la passerelle télématique et du système multimédia.'
  es: 'Solicitudes y progreso de actualización por aire (OTA) de la pasarela telemática y del sistema multimedia.'
  de: 'Anforderungen und Fortschritt der Over-the-Air-Aktualisierung des Telematik-Gateways und des Infotainmentsystems.'
  it: 'Richieste e avanzamento dell''aggiornamento over-the-air (OTA) del gateway telematico e del sistema multimediale.'
  pl: 'Żądania i postęp aktualizacji bezprzewodowej (OTA) bramki telematycznej i systemu multimedialnego.'
  ru: 'Запросы и ход обновления по воздуху (OTA) телематического шлюза и мультимедийной системы.'
  zh: '远程信息处理网关和信息娱乐系统的空中升级(OTA)请求与进度。'
  hu: 'A telematikai átjáró és az infotainment rendszer légi (OTA) frissítési kérései és állapota.'
  pt: 'Pedidos e progresso da atualização over-the-air do gateway telemático e do sistema de infoentretenimento.'
periodicity: ['1000ms', 'trigger']
senders: ['BSRF']
receivers: ['BSI']

signals:
  RADIO_MODULE_UPDATE_REQUEST:
    bits: '2.7'
    comment:
      en: 'Request to update the radio and telematics module (BSRF)'
      fr: 'Demande de mise à jour du module radio et télématique (BSRF)'
      es: 'Solicitud de actualización del módulo de radio y telemática (BSRF)'
      de: 'Anforderung zur Aktualisierung des Radio-/Telematikmoduls (BSRF)'
      it: 'Richiesta di aggiornamento del modulo radio e telematico (BSRF)'
      pl: 'Żądanie aktualizacji modułu radiowo-telematycznego (BSRF)'
      ru: 'Запрос на обновление радио-телематического модуля (BSRF)'
      zh: '请求更新无线电及远程信息模块（BSRF）'
      hu: 'A rádió- és telematikai modul (BSRF) frissítésének kérése'
      pt: 'Pedido de atualização do módulo de rádio e telemática (BSRF)'
    type: 'bool'
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
