id: 0x10B
name: 'STEERING_WHEEL_ANGLE_RELAY'
type: 'can'
length: 7
comment:
  en: 'Steering wheel angle data relayed to the inter-system bus by the body computer (BSI) gateway.'
  fr: 'Données d''angle volant relayées sur le bus inter-système par la passerelle BSI.'
  es: 'Datos del ángulo del volante retransmitidos al bus intersistema por la pasarela BSI.'
  de: 'Lenkradwinkeldaten, vom BSI-Gateway an den Inter-System-Bus weitergeleitet.'
  it: 'Dati dell''angolo dello sterzo inoltrati al bus inter-sistema dal gateway BSI.'
  pl: 'Dane kąta koła kierownicy przekazywane do magistrali międzysystemowej przez bramkę BSI.'
  ru: 'Данные угла поворота руля, ретранслируемые в межсистемную шину шлюзом BSI.'
  zh: '由车身控制器(BSI)网关转发到系统间总线的方向盘转角数据。'
  hu: 'A kormánykerék-szög adatai, amelyeket a BSI átjáró továbbít a rendszerközi buszra.'
  pt: 'Dados de ângulo do volante retransmitidos para o barramento intersistema pelo gateway do computador de servidão (BSI).'
periodicity: ['100ms']
senders: ['BSI']
receivers: ['AVP']

signals:
  STEERING_WHEEL_ANGLE:
    bits: '1.7-2.0'
    comment:
      en: 'Steering wheel angle'
      fr: 'Angle du volant'
      es: 'Ángulo del volante'
      de: 'Lenkradwinkel'
      it: 'Angolo del volante'
      pl: 'Kąt skrętu kierownicy'
      ru: 'Угол поворота рулевого колеса'
      zh: '方向盘转角'
      hu: 'A kormánykerék szöge'
      pt: 'Ângulo do volante'
    type: 'sint'
    factor: 0.1
    min: -780
    max: 780
    invalid: 0x7FFF

  STEERING_WHEEL_ROTATION_SPEED:
    bits: '3.7-3.0'
    comment:
      en: 'Steering wheel rotation speed'
      fr: 'Vitesse de rotation du volant'
      es: 'Velocidad de rotación del volante'
      de: 'Lenkraddrehgeschwindigkeit'
      it: 'Velocità di rotazione del volante'
