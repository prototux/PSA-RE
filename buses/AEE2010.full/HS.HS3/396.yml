id: 0x396
name: 'BSRF_COMMAND_11'
type: 'can'
length: 8
comment:
  en: 'Vehicle data sent by the BSI to the telematics gateway: electric machine number, climate preconditioning menu state, consumption info, charging HMI state and fault lamp requests.'
  fr: 'Données véhicule envoyées par la BSI à la passerelle télématique : numéro de machine électrique, état du menu préconditionnement climatique, infos de consommation, état IHM de recharge et demandes de voyants défaut.'
  es: 'Datos del vehículo enviados por la BSI a la pasarela telemática: número de máquina eléctrica, estado del menú de preacondicionamiento climático, información de consumo, estado de IHM de recarga y solicitudes de testigos de fallo.'
  de: 'Von der BSI an das Telematik-Gateway gesendete Fahrzeugdaten: Elektromaschinennummer, Zustand des Vorklimatisierungsmenüs, Verbrauchsinfos, Ladebedienzustand und Fehlerlampenanforderungen.'
  it: 'Dati veicolo inviati dalla BSI al gateway telematico: numero macchina elettrica, stato del menu precondizionamento climatico, informazioni sui consumi, stato HMI di ricarica e richieste spie guasto.'
  pl: 'Dane pojazdu wysyłane przez BSI do bramki telematycznej: numer maszyny elektrycznej, stan menu wstępnej klimatyzacji, informacje o zużyciu, stan HMI ładowania i żądania lampek usterek.'
  ru: 'Данные автомобиля, отправляемые BSI в телематический шлюз: номер электромашины, состояние меню предварительного кондиционирования, информация о расходе, состояние интерфейса зарядки и запросы ламп неисправностей.'
  zh: '由BSI发送给远程信息处理网关的车辆数据：电机编号、空调预调节菜单状态、能耗信息、充电人机界面状态及故障灯请求。'
  hu: 'A BSI által a telematikai átjárónak küldött járműadatok: elektromos gép száma, klíma-előkondicionálási menü állapota, fogyasztási adatok, töltési kezelőfelület állapota és hibalámpa-kérések.'
  pt: 'Dados do veículo enviados pela BSI ao gateway telemático: número da máquina elétrica, estado do menu de pré-condicionamento da climatização, informação de consumo, estado da IHM de carregamento e pedidos de luzes avisadoras de avaria.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BSRF']

