id: 0x3F8
name: 'ENGINE_ECU_DATA_3'
type: 'can'
length: 8
comment:
  en: 'Software and calibration identification of the ECU, sent once at start-up.'
  fr: 'Identification logicielle et de calibration du calculateur, émise une fois au démarrage.'
  es: 'Identificación de software y calibración de la ECU, enviada una vez al arrancar.'
  de: 'Software- und Kalibrierungskennung des Steuergeräts, einmal beim Start gesendet.'
  it: 'Identificazione software e calibrazione della centralina, inviata una volta all''avvio.'
  pl: 'Identyfikacja oprogramowania i kalibracji sterownika, wysyłana raz przy uruchomieniu.'
  ru: 'Идентификация программного обеспечения и калибровки блока управления, отправляется один раз при запуске.'
  zh: '该ECU的软件和标定版本信息，启动时发送一次。'
  hu: 'A vezérlőegység szoftver- és kalibrációs azonosítója, indításkor egyszer elküldve.'
  pt: 'Identificação de software e calibração da ECU, enviada uma vez no arranque.'
observations:
  en: 'Sent when the network state transitions from WAKEUP to NORMAL'
  fr: 'Émise lors de la transition de l''état réseau de RÉVEIL à NORMAL'
  es: 'Enviada cuando el estado de la red pasa de ACTIVACIÓN a NORMAL'
  de: 'Gesendet beim Übergang des Netzwerkzustands von AUFWACHEN zu NORMAL'
  it: 'Inviata al passaggio dello stato di rete da RISVEGLIO a NORMALE'
  pl: 'Wysyłane przy przejściu stanu sieci z WYBUDZENIA do NORMALNEGO'
  ru: 'Отправляется при переходе состояния сети из ПРОБУЖДЕНИЯ в НОРМАЛЬНОЕ'
  zh: '网络状态从唤醒切换到正常时发送'
  hu: 'Küldve, amikor a hálózat állapota ÉBRESZTÉS-ből NORMÁL-ba vált'
  pt: 'Enviada quando o estado da rede transita de WAKEUP para NORMAL'
periodicity: ['trigger']
senders: ['PFHM']

signals:
  ECU_NUMBER:
    bits: '1.7-1.0'
    comment:
      en: 'ECU number.'
      fr: 'Numéro d''UCE (calculateur).'
      es: 'Número de unidad de control.'
      de: 'Steuergerätenummer.'
      it: 'Numero di centralina.'
      pl: 'Numer sterownika.'
      ru: 'Номер блока управления.'
      zh: '控制单元编号。'
      hu: 'Vezérlőegység száma.'
      pt: 'Número de UCE (centralina).'
    type: 'uint'
    min: 0
    max: 254
    invalid: 0xFF

  SOFTWARE_VERSION_DAY:
    bits: '2.7-2.0'
    comment:
      en: 'Software version, day.'
      fr: 'Version du logiciel, jour.'
      es: 'Versión del software, día.'
      de: 'Softwareversion, Tag.'
      it: 'Versione del software, giorno.'
      pl: 'Wersja oprogramowania, dzień.'
      ru: 'Версия программного обеспечения, день.'
      zh: '软件版本，日。'
      hu: 'Szoftververzió, nap.'
      pt: 'Versão do software, dia'
    type: 'uint'
    factor: 1
    min: 1
    max: 31
    units: 'day'

  SOFTWARE_VERSION_MONTH:
    bits: '3.7-3.0'
    comment:
      en: 'Software version, month.'
      fr: 'Version du logiciel, mois.'
      es: 'Versión del software, mes.'
      de: 'Softwareversion, Monat.'
      it: 'Versione del software, mese.'
      pl: 'Wersja oprogramowania, miesiąc.'
      ru: 'Версия программного обеспечения, месяц.'
      zh: '软件版本，月。'
      hu: 'Szoftververzió, hónap.'
      pt: 'Versão do software, mês'
    type: 'uint'
    factor: 1
    min: 1
    max: 12
    units: 'month'

  SOFTWARE_VERSION_YEAR:
    bits: '4.7-4.0'
    comment:
      en: 'Software version, year.'
      fr: 'Version du logiciel, année.'
      es: 'Versión del software, año.'
      de: 'Softwareversion, Jahr.'
      it: 'Versione del software, anno.'
      pl: 'Wersja oprogramowania, rok.'
      ru: 'Версия программного обеспечения, год.'
      zh: '软件版本，年。'
      hu: 'Szoftververzió, év.'
      pt: 'Versão do software, ano'
    type: 'uint'
    factor: 1
    offset: 2000
    min: 2000
    max: 2200

  SOFTWARE_IDENTIFICATION:
    bits: '5.7-6.0'
    comment:
      en: 'Characterizes the software identification.'
      fr: 'Caractérise l''identification du logiciel.'
      es: 'Caracteriza la identificación del software.'
      de: 'Kennzeichnet die Software-Identifikation.'
      it: 'Caratterizza l''identificazione del software.'
      pl: 'Określa identyfikację oprogramowania.'
      ru: 'Характеризует идентификацию программного обеспечения.'
      zh: '表征软件标识。'
      hu: 'A szoftverazonosítást jellemzi.'
      pt: 'Carateriza a identificação do software.'
    type: 'uint'
    min: 0
    max: 65534
    invalid: 0xFFFF

  GENERATION_NUMBER_DIGIT_1:
    bits: '7.7-7.4'
    comment:
      en: 'Generation number (1st digit).'
      fr: 'Numéro de génération (1er chiffre).'
      es: 'Número de generación (1er dígito).'
      de: 'Generationsnummer (1. Ziffer).'
      it: 'Numero di generazione (1° cifra).'
      pl: 'Numer generacji (1. cyfra).'
      ru: 'Номер поколения (1-я цифра).'
      zh: '代数编号（第1位数字）。'
      hu: 'Generációszám (1. számjegy).'
      pt: 'Número de geração (1.º dígito).'
    type: 'uint'
    min: 0
    max: 15

  GENERATION_NUMBER_DIGIT_2:
    bits: '7.3-7.0'
    comment:
      en: 'Generation number (2nd digit).'
      fr: 'Numéro de génération (2ème chiffre).'
      es: 'Número de generación (2º dígito).'
      de: 'Generationsnummer (2. Ziffer).'
      it: 'Numero di generazione (2° cifra).'
      pl: 'Numer generacji (2. cyfra).'
      ru: 'Номер поколения (2-я цифра).'
      zh: '代数编号（第2位数字）。'
      hu: 'Generációszám (2. számjegy).'
      pt: 'Número de geração (2.º dígito).'
    type: 'enum'
    values:
      0x0F:
        en: 'Forced value'
        fr: 'Valeur forcée'
        es: 'Valor forzado'
        de: 'Erzwungener Wert'
        it: 'Valore forzato'
        pl: 'Wartość wymuszona'
        ru: 'Принудительное значение'
        zh: '强制值'
        hu: 'Kényszerített érték'
        pt: 'Valor forçado'

  EDITION_NUMBER:
    bits: '8.7-8.0'
    comment:
      en: 'Edition number.'
      fr: 'Numéro de l''édition.'
      es: 'Número de edición.'
      de: 'Ausgabenummer.'
      it: 'Numero di edizione.'
      pl: 'Numer edycji.'
      ru: 'Номер редакции.'
      zh: '版本编号。'
      hu: 'Kiadásszám.'
      pt: 'Número da edição.'
    type: 'uint'
    min: 0
    max: 254
    invalid: 0xFF
