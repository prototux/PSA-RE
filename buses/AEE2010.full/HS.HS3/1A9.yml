id: 0x1A9
name: 'IVI_BUTTON_REQUESTS'
type: 'can'
length: 8
comment:
  en: 'Steering-wheel/dashboard button requests to the infotainment system: push detected, emergency call, cruise setpoint program/adjust, parking-aid and front-camera activation buttons.'
  fr: 'Demandes de boutons volant/tableau de bord vers le système multimédia : appui détecté, appel d''urgence, programmation/réglage de consigne régulateur, boutons d''activation aide au stationnement et caméra avant.'
  es: 'Solicitudes de botones de volante/salpicadero al sistema multimedia: pulsación detectada, llamada de emergencia, programación/ajuste de consigna del regulador, botones de activación de ayuda al estacionamiento y cámara delantera.'
  de: 'Tasten-Anforderungen von Lenkrad/Armaturenbrett an das Infotainmentsystem: Tastendruck erkannt, Notruf, Tempomat-Sollwertprogrammierung/-anpassung, Aktivierungstasten für Einparkhilfe und Frontkamera.'
  it: 'Richieste dei pulsanti volante/cruscotto al sistema multimediale: pressione rilevata, chiamata di emergenza, programmazione/regolazione del setpoint del regolatore, pulsanti di attivazione assistenza al parcheggio e telecamera anteriore.'
  pl: 'Żądania przycisków kierownicy/deski rozdzielczej do systemu multimedialnego: wykryto naciśnięcie, wezwanie awaryjne, programowanie/regulacja nastawy tempomatu, przyciski aktywacji czujników parkowania i kamery przedniej.'
  ru: 'Запросы кнопок руля/панели приборов к мультимедийной системе: обнаружено нажатие, экстренный вызов, программирование/регулировка уставки круиз-контроля, кнопки активации парковочного ассистента и передней камеры.'
  zh: '方向盘/仪表板按钮发往车载娱乐系统的请求:检测到按压、紧急呼叫、巡航设定值编程/调整、驻车辅助和前置摄像头激活按钮。'
  hu: 'A kormánykerék/műszerfal gombjainak kérései az infotainment rendszer felé: gombnyomás észlelve, segélyhívás, tempomat alapjel programozása/állítása, parkolássegítő és elülső kamera aktiváló gombok.'
  pt: 'Pedidos dos botões do volante/tablier para o sistema de infoentretenimento: pressão detetada, chamada de emergência, programação/ajuste do ponto de ajuste do regulador, botões de ativação da ajuda ao estacionamento e da câmara dianteira.'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['AVP']

