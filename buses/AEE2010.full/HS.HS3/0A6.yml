id: 0x0A6
name: 'WHEEL_PULSE_COUNTERS'
type: 'can'
length: 7
comment:
  en: 'Wheel speed pulse counters and their fault status for all four wheels, relayed by the body computer (BSI).'
  fr: 'Compteurs d''impulsions de vitesse roue et leur état de défaut pour les quatre roues, relayés par le BSI.'
  es: 'Contadores de impulsos de velocidad de rueda y su estado de fallo para las cuatro ruedas, retransmitidos por la BSI.'
  de: 'Radgeschwindigkeits-Impulszähler und deren Fehlerstatus für alle vier Räder, weitergeleitet vom BSI.'
  it: 'Contatori di impulsi di velocità ruota e il loro stato di guasto per le quattro ruote, inoltrati dal BSI.'
  pl: 'Liczniki impulsów prędkości kół i ich stan usterki dla wszystkich czterech kół, przekazywane przez BSI.'
  ru: 'Счётчики импульсов скорости колёс и их состояние неисправности для всех четырёх колёс, ретранслируемые BSI.'
  zh: '由车身控制器(BSI)转发的四个车轮转速脉冲计数及其故障状态。'
  hu: 'A négy kerék sebességimpulzus-számlálói és azok hibaállapota, amelyeket a BSI továbbít.'
  pt: 'Contadores de impulsos de velocidade das rodas e o seu estado de avaria para as quatro rodas, retransmitidos pelo computador de servidão (BSI).'
periodicity: ['80ms']
senders: ['BSI']
receivers: ['AVP']

signals:
  PROCESS_COUNTER:
    bits: '1.3-1.0'
    comment:
      en: '4-bit process counter'
      fr: 'Compteur de process sur 4 bits'
      es: 'Contador de proceso de 4 bits'
      de: '4-Bit-Prozesszähler'
      it: 'Contatore di processo a 4 bit'
      pl: '4-bitowy licznik procesu'
      ru: '4-битный счётчик процесса'
      zh: '4位处理计数器'
      hu: '4 bites folyamatszámláló'
      pt: 'Contador de processo de 4 bits'
    type: 'uint'
    min: 0
    max: 15

  FRONT_LEFT_WHEEL_PULSE_COUNTER_FAULT:
    bits: '2.7'
    comment:
      en: 'Front left wheel pulse counter fault'
      fr: 'Défaut du compteur de tops de la roue avant gauche'
      es: 'Fallo del contador de impulsos de la rueda delantera izquierda'
      de: 'Fehler des Impulszählers des linken Vorderrads'
      it: 'Guasto del contatore di impulsi della ruota anteriore sinistra'
      pl: 'Usterka licznika impulsów przedniego lewego koła'
      ru: 'Неисправность счётчика импульсов переднего левого колеса'
      zh: '左前轮脉冲计数器故障'
      hu: 'A bal első kerék impulzusszámlálójának hibája'
      pt: 'Avaria do contador de impulsos da roda dianteira esquerda'
    type: 'bool'
    values:
      0x00:
        en: 'No fault on the FRL pulse counter'
        fr: 'Pas de défaut sur le compteur de tops avant gauche'
        es: 'Sin fallo en el contador de impulsos delantero izquierdo'
        de: 'Kein Fehler am Impulszähler vorne links'
        it: 'Nessun guasto sul contatore di impulsi anteriore sinistro'
        pl: 'Brak usterki licznika impulsów przedniego lewego koła'
        ru: 'Нет неисправности счётчика импульсов переднего левого колеса'
        zh: '左前脉冲计数器无故障'
        hu: 'Nincs hiba a bal első impulzusszámlálón'
        pt: 'Sem falha no contador de impulsos dianteiro esquerdo'
      0x01:
        en: 'Front left pulse counter fault'
        fr: 'Défaut du compteur de tops avant gauche'
        es: 'Fallo del contador de impulsos delantero izquierdo'
        de: 'Fehler des Impulszählers vorne links'
        it: 'Guasto del contatore di impulsi anteriore sinistro'
        pl: 'Usterka licznika impulsów przedniego lewego'
        ru: 'Неисправность счётчика импульсов переднего левого'
        zh: '左前脉冲计数器故障'
        hu: 'A bal első impulzusszámláló hibája'
        pt: 'Falha do contador de impulsos dianteiro esquerdo'

  FRONT_LEFT_WHEEL_PULSE_COUNTER:
