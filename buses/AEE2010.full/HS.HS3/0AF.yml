id: 0x0AF
name: 'BATTERY_CELL_VOLTAGES'
type: 'can'
length: 8
comment:
  en: 'Individual high-voltage battery cell voltages, relayed by the body computer (BSI).'
  fr: 'Tensions individuelles des cellules de la batterie haute tension, relayées par le BSI.'
  es: 'Tensiones individuales de las celdas de la batería de alta tensión, retransmitidas por la BSI.'
  de: 'Einzelne Zellenspannungen der Hochvoltbatterie, weitergeleitet vom BSI.'
  it: 'Tensioni individuali delle celle della batteria ad alta tensione, inoltrate dal BSI.'
  pl: 'Indywidualne napięcia ogniw akumulatora wysokiego napięcia, przekazywane przez BSI.'
  ru: 'Индивидуальные напряжения ячеек высоковольтной батареи, ретранслируемые BSI.'
  zh: '由车身控制器(BSI)转发的高压电池单体电压。'
  hu: 'A nagyfeszültségű akkumulátor egyes celláinak feszültsége, amelyet a BSI továbbít.'
  pt: 'Tensões individuais das células da bateria de alta tensão, retransmitidas pelo computador de servidão (BSI).'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['BSRF']

