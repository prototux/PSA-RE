id: 0x02F
name: 'BSRF_COMMAND'
type: 'can'
length: 8
comment:
  en: 'Electric/hybrid powertrain data sent by the BSI to the telematics gateway: DC/DC converter state, maximum HV battery temperature, inverter working state, charge in progress and charging plug state.'
  fr: 'Données de la chaîne de traction électrique/hybride envoyées par la BSI à la passerelle télématique : état du convertisseur DC/DC, température maximale de la batterie HT, état de fonctionnement de l''onduleur, recharge en cours et état de la prise de recharge.'
  es: 'Datos de la cadena de tracción eléctrica/híbrida enviados por la BSI a la pasarela telemática: estado del convertidor DC/DC, temperatura máxima de la batería de alta tensión, estado de funcionamiento del inversor, recarga en curso y estado de la toma de recarga.'
  de: 'Von der BSI an das Telematik-Gateway gesendete Daten des Elektro-/Hybridantriebs: DC/DC-Wandlerzustand, maximale HV-Batterietemperatur, Wechselrichter-Betriebszustand, laufender Ladevorgang und Ladesteckerzustand.'
  it: 'Dati della catena di trazione elettrica/ibrida inviati dalla BSI al gateway telematico: stato del convertitore DC/DC, temperatura massima della batteria AT, stato di funzionamento dell''inverter, ricarica in corso e stato della presa di ricarica.'
  pl: 'Dane układu napędowego elektrycznego/hybrydowego wysyłane przez BSI do bramki telematycznej: stan przetwornicy DC/DC, maksymalna temperatura akumulatora WN, stan pracy falownika, trwające ładowanie i stan wtyczki ładowania.'
  ru: 'Данные электрической/гибридной силовой установки, отправляемые BSI в телематический шлюз: состояние DC/DC преобразователя, максимальная температура высоковольтной батареи, рабочее состояние инвертора, идёт зарядка и состояние зарядного разъёма.'
  zh: '由BSI发送给远程信息处理网关的电动/混合动力传动系统数据：DC/DC变换器状态、高压电池最高温度、逆变器工作状态、正在充电及充电插头状态。'
  hu: 'A BSI által a telematikai átjárónak küldött elektromos/hibrid hajtáslánc-adatok: DC/DC átalakító állapota, a nagyfeszültségű akkumulátor legmagasabb hőmérséklete, inverter üzemállapota, folyamatban lévő töltés és a töltőcsatlakozó állapota.'
  pt: 'Dados do grupo motopropulsor elétrico/híbrido enviados pela BSI ao gateway telemático: estado do conversor DC/DC, temperatura máxima da bateria de alta tensão, estado de funcionamento do inversor, carregamento em curso e estado da ficha de carregamento.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BSRF']

signals:
  HV_BATTERY_MAX_TEMPERATURE:
    bits: '1.7-1.1'
    comment:
      en: 'Maximum temperature among the high-voltage battery probes'
      fr: 'Température maximale parmi les sondes de la batterie haute tension'
      es: 'Temperatura máxima entre las sondas de la batería de alta tensión'
      de: 'Maximaltemperatur der Hochvoltbatterie-Sensoren'
      it: 'Temperatura massima tra le sonde della batteria ad alta tensione'
      pl: 'Maksymalna temperatura spośród czujników akumulatora wysokiego napięcia'
      ru: 'Максимальная температура среди датчиков высоковольтной батареи'
      zh: '高压电池探头中的最高温度'
      hu: 'A nagyfeszültségű akkumulátor érzékelői közül a legmagasabb hőmérséklet'
      pt: 'Temperatura máxima entre as sondas da bateria de alta tensão'
    type: 'uint'
    factor: 1
    offset: -40
    min: -40
    max: 85
    units: '°C'
    invalid: 0x7F

