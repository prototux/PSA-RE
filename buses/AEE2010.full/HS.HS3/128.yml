id: 0x128
name: 'CLUSTER_SIGNAL_COMMAND'
type: 'can'
length: 8
comment:
  en: 'Signalling commands sent by the BSI to the instrument cluster: indicators, hazard warning, engine fault display and cluster colour/personalisation.'
  fr: 'Commandes de signalisation envoyées par la BSI au combiné d''instruments : clignotants, feux de détresse, affichage défaut moteur et couleur/personnalisation du combiné.'
  es: 'Órdenes de señalización enviadas por la BSI al cuadro de instrumentos: intermitentes, luces de emergencia, visualización de fallo del motor y color/personalización del cuadro.'
  de: 'Von der BSI an das Kombiinstrument gesendete Signalisierungsbefehle: Blinker, Warnblinkanlage, Motorfehleranzeige und Kombiinstrumentfarbe/-personalisierung.'
  it: 'Comandi di segnalazione inviati dalla BSI al quadro strumenti: indicatori di direzione, luci di emergenza, visualizzazione guasto motore e colore/personalizzazione del quadro.'
  pl: 'Polecenia sygnalizacyjne wysyłane przez BSI do zestawu wskaźników: kierunkowskazy, światła awaryjne, wyświetlanie usterki silnika i kolor/personalizacja zestawu wskaźników.'
  ru: 'Сигнальные команды, отправляемые BSI на приборную панель: указатели поворота, аварийная сигнализация, отображение неисправности двигателя и цвет/персонализация панели.'
  zh: '由BSI发送给仪表组的信号命令：转向灯、危险警示灯、发动机故障显示及仪表组颜色/个性化设置。'
  hu: 'A BSI jelzésparancsai a műszerfal felé: index, vészvillogó, motorhiba-kijelzés és a műszerfal színe/személyre szabása.'
  pt: 'Comandos de sinalização enviados pela BSI ao quadrante de instrumentos: piscas, luzes de emergência, apresentação de avaria do motor e cor/personalização do quadrante.'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['AVP']

