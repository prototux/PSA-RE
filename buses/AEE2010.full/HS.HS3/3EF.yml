id: 0x3EF
name: 'BSRF_COMMAND_14'
type: 'can'
length: 8
comment:
  en: 'Vehicle data sent by the BSI to the telematics gateway: indicators, engine fault, trip distance, AC request, slope estimation and gearbox freewheel/lane-detection states.'
  fr: 'Données véhicule envoyées par la BSI à la passerelle télématique : clignotants, défaut moteur, distance parcourue, demande de climatisation, estimation de pente et états roue libre boîte/détection de voie.'
  es: 'Datos del vehículo enviados por la BSI a la pasarela telemática: intermitentes, fallo del motor, distancia recorrida, solicitud de climatización, estimación de pendiente y estados de rueda libre de la caja/detección de carril.'
  de: 'Von der BSI an das Telematik-Gateway gesendete Fahrzeugdaten: Blinker, Motorfehler, zurückgelegte Strecke, Klimaanforderung, Steigungsschätzung und Freilaufgetriebe-/Spurerkennungszustände.'
  it: 'Dati veicolo inviati dalla BSI al gateway telematico: indicatori di direzione, guasto motore, distanza percorsa, richiesta climatizzazione, stima pendenza e stati ruota libera cambio/rilevamento corsia.'
  pl: 'Dane pojazdu wysyłane przez BSI do bramki telematycznej: kierunkowskazy, usterka silnika, przejechany dystans, żądanie klimatyzacji, szacowanie nachylenia i stany wybiegu skrzyni biegów/wykrywania pasa.'
  ru: 'Данные автомобиля, отправляемые BSI в телематический шлюз: указатели поворота, неисправность двигателя, пройденное расстояние, запрос кондиционера, оценка уклона и состояния свободного хода коробки/обнаружения полосы.'
  zh: '由BSI发送给远程信息处理网关的车辆数据：转向灯、发动机故障、行驶距离、空调请求、坡度估算及变速箱空转/车道检测状态。'
  hu: 'A BSI által a telematikai átjárónak küldött járműadatok: index, motorhiba, megtett táv, klímakérés, lejtésbecslés, valamint a váltó szabadonfutási és a sávérzékelési állapotok.'
  pt: 'Dados do veículo enviados pela BSI ao gateway telemático: piscas, avaria do motor, distância percorrida, pedido de ar condicionado, estimativa de inclinação e estados de roda livre da caixa de velocidades/deteção de faixa.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BSRF']

