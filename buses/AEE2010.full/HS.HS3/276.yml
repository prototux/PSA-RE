id: 0x276
name: 'VSM_SLOW_DATA'
type: 'can'
length: 8
comment:
  en: 'Vehicle status module slow data 3: clock display, year, AdBlue range and display request, seat/boot/rear-opening condition, and selectivity status including driver.'
  fr: 'Données lentes 3 du module d''état véhicule : affichage horloge, année, autonomie AdBlue et demande d''affichage, état condamnation siège/coffre/ouverture arrière, et sélectivité incluant le conducteur.'
  es: 'Datos lentos 3 del módulo de estado del vehículo: visualización del reloj, año, autonomía AdBlue y solicitud de visualización, estado de bloqueo de asiento/maletero/apertura trasera, y selectividad incluyendo al conductor.'
  de: 'Langsame Daten 3 des Fahrzeugstatusmoduls: Uhranzeige, Jahr, AdBlue-Reichweite und Anzeigeanforderung, Sitz-/Kofferraum-/Heckklappen-Verriegelungsstatus, und Selektivität einschließlich Fahrer.'
  it: 'Dati lenti 3 del modulo di stato veicolo: visualizzazione orologio, anno, autonomia AdBlue e richiesta di visualizzazione, stato blocco sedile/baule/apertura posteriore, e selettività incluso il guidatore.'
  pl: 'Wolne dane 3 modułu stanu pojazdu: wyświetlanie zegara, rok, zasięg AdBlue i żądanie wyświetlania, stan zablokowania fotela/bagażnika/otwarcia tylnego, oraz selektywność uwzględniająca kierowcę.'
  ru: 'Медленные данные 3 модуля состояния автомобиля: отображение часов, год, запас хода AdBlue и запрос отображения, статус блокировки сиденья/багажника/заднего проёма, а также селективность, включая водителя.'
  zh: '车辆状态模块慢速数据3:时钟显示、年份、AdBlue续航里程和显示请求、座椅/后备箱/后开口锁定状态,以及包含驾驶员的选择性状态。'
  hu: 'A jármű állapotmodul lassú adatai 3: óra kijelzése, év, AdBlue hatótáv és megjelenítési kérés, ülés/csomagtartó/hátsó nyílás zárolási állapota, valamint a vezetőt is magában foglaló szelektivitás.'
  pt: 'Dados lentos 3 do módulo de estado do veículo: apresentação do relógio, ano, autonomia de AdBlue e pedido de apresentação, condição dos bancos/bagageira/aberturas traseiras, e estado de seletividade incluindo o condutor.'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']

