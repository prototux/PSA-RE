id: 0x0EF
name: 'BRAKE_BOOSTER_VERSION'
type: 'can'
length: 8
comment:
  en: 'Highest and lowest high-voltage battery cell voltages and insulation resistance, relayed by the body computer (BSI).'
  fr: 'Tensions de cellule maximale et minimale et résistance d''isolement de la batterie haute tension, relayées par le BSI.'
  es: 'Tensiones de celda máxima y mínima y resistencia de aislamiento de la batería de alta tensión, retransmitidas por la BSI.'
  de: 'Höchste und niedrigste Zellenspannung sowie Isolationswiderstand der Hochvoltbatterie, weitergeleitet vom BSI.'
  it: 'Tensioni di cella massima e minima e resistenza di isolamento della batteria ad alta tensione, inoltrate dal BSI.'
  pl: 'Najwyższe i najniższe napięcie ogniwa oraz rezystancja izolacji akumulatora wysokiego napięcia, przekazywane przez BSI.'
  ru: 'Максимальное и минимальное напряжение ячеек и сопротивление изоляции высоковольтной батареи, ретранслируемые BSI.'
  zh: '由车身控制器(BSI)转发的高压电池最高/最低单体电压及绝缘电阻。'
  hu: 'A nagyfeszültségű akkumulátor legmagasabb és legalacsonyabb cellafeszültsége, valamint szigetelési ellenállása, amelyet a BSI továbbít.'
  pt: 'Tensões mais alta e mais baixa das células da bateria de alta tensão e resistência de isolamento, retransmitidas pelo computador de servidão (BSI).'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BSRF']

signals:
  HV_BATTERY_INSULATION_RESISTANCE:
    bits: '1.7-2.0'
    comment:
      en: 'HV battery insulation resistance (kOhm)'
      fr: 'Résistance d''isolement de la batterie haute tension (kOhm)'
      es: 'Resistencia de aislamiento de la batería de alta tensión (kOhm)'
      de: 'Isolationswiderstand der Hochvoltbatterie (kOhm)'
      it: 'Resistenza di isolamento della batteria ad alta tensione (kOhm)'
      pl: 'Rezystancja izolacji akumulatora wysokiego napięcia (kOhm)'
      ru: 'Сопротивление изоляции высоковольтной батареи (кОм)'
      zh: '高压电池绝缘电阻(kOhm)'
      hu: 'A nagyfeszültségű akkumulátor szigetelési ellenállása (kOhm)'
      pt: 'Resistência de isolamento da bateria de alta tensão (kOhm)'
    type: 'uint'
    factor: 1
    min: 0
    max: 60000
    units: 'kOhm'
    invalid: 0xFFFF

  HV_BATTERY_CELL_NUMBER_VOLT_MAX:
    bits: '3.7-3.0'
    comment:
      en: 'Number of the cell with the maximum voltage'
      fr: 'Numéro de la cellule ayant la tension maximale'
      es: 'Número de la celda con la tensión máxima'
      de: 'Nummer der Zelle mit der maximalen Spannung'
      it: 'Numero della cella con la tensione massima'
      pl: 'Numer ogniwa o maksymalnym napięciu'
      ru: 'Номер элемента с максимальным напряжением'
      zh: '电压最高单体的编号'
      hu: 'A legnagyobb feszültségű cella száma'
      pt: 'Número da célula com a tensão máxima'
    type: 'uint'
    factor: 11
    min: 1
    max: 250
    invalid: 0xFF

  HV_BATTERY_CELL_VOLTAGE_MAX:
    bits: '4.7-5.2'
    comment:
      en: 'Maximum cell voltage of the HV battery (V)'
      fr: 'Tension maximale de cellule de la batterie haute tension (V)'
      es: 'Tensión máxima de celda de la batería de alta tensión (V)'
