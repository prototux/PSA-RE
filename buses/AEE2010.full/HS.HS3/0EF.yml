      pl: 'Maksymalne napięcie ogniwa akumulatora wysokiego napięcia (V)'
      ru: 'Максимальное напряжение элемента высоковольтной батареи (В)'
      zh: '高压电池最大单体电压(V)'
      hu: 'A nagyfeszültségű akkumulátor legnagyobb cellafeszültsége (V)'
      pt: 'Tensão máxima de célula da bateria de alta tensão (V)'
    type: 'uint'
    factor: 0.001
    min: 0
    max: 15
    units: 'V'
    invalid: 0x3FFF

  HV_BATTERY_CELL_NUMBER_VOLT_MIN:
