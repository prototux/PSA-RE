  HV_BATTERY_CELL_VOLTAGE_MIN:
    bits: '7.7-8.2'
    comment:
      en: 'Minimum cell voltage of the HV battery (V)'
      fr: 'Tension minimale de cellule de la batterie haute tension (V)'
      es: 'Tensión mínima de celda de la batería de alta tensión (V)'
      de: 'Minimale Zellspannung der Hochvoltbatterie (V)'
