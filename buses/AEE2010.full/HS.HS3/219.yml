id: 0x219
name: 'AUTO_GEARBOX_SWITCH_REQUEST'
type: 'can'
length: 4
comment:
  en: 'LED lighting and mode requests sent by the BSI to the automatic gearbox selector switch.'
  fr: 'Demandes d''éclairage LED et de mode envoyées par la BSI au sélecteur de boîte automatique.'
  es: 'Solicitudes de iluminación LED y de modo enviadas por la BSI al selector de la caja de cambios automática.'
  de: 'LED-Beleuchtungs- und Modusanforderungen, die von der BSI an den Automatikgetriebewählschalter gesendet werden.'
  it: 'Richieste di illuminazione LED e di modalità inviate dalla BSI al selettore del cambio automatico.'
  pl: 'Żądania podświetlenia LED i trybu wysyłane przez BSI do przełącznika wyboru biegów skrzyni automatycznej.'
  ru: 'Запросы подсветки светодиодов и режима, отправляемые BSI на переключатель селектора автоматической коробки передач.'
  zh: '由BSI发送给自动变速箱换挡开关的LED照明与模式请求。'
  hu: 'A BSI által az automata váltó választókapcsolójának küldött LED-világítási és üzemmód-kérések.'
  pt: 'Pedidos de iluminação LED e de modo enviados pela BSI ao seletor da caixa de velocidades automática.'
periodicity: ['100ms', 'trigger']
senders: ['BSI']
receivers: ['AUTO_GEARBOX_SWITCH']

signals:
  PROCESS_COUNTER_4BIT_219:
    bits: '1.3-1.0'
    comment:
      en: '4-bit process counter (219)'
      fr: 'Compteur de process 4 bits (219)'
      es: 'Contador de proceso de 4 bits (219)'
      de: '4-Bit-Prozesszähler (219)'
      it: 'Contatore di processo a 4 bit (219)'
      pl: '4-bitowy licznik procesu (219)'
      ru: '4-битный счётчик процесса (219)'
      zh: '4位过程计数器(219)'
      hu: '4 bites folyamatszámláló (219)'
      pt: 'Contador de processo de 4 bits (219)'
    type: 'uint'
    min: 0
    max: 15

  TOGGLE_LED_BRIGHTNESS_REQUEST:
    bits: '2.7-2.4'
    comment:
      en: 'Brightness level to apply to the gear toggle LEDs'
      fr: 'Niveau de luminosité à appliquer aux LEDs du sélecteur à bascule'
      es: 'Nivel de brillo a aplicar en los LED del selector basculante'
      de: 'Anzuwendender Helligkeitswert für die Wippschalter-LEDs'
      it: 'Livello di luminosità da applicare ai LED del selettore a bilico'
      pl: 'Poziom jasności do zastosowania dla diod przełącznika wybieraka'
      ru: 'Уровень яркости для светодиодов переключателя передач'
      zh: '换挡拨杆LED的亮度等级设定'
      hu: 'A váltókapcsoló LED-jeire alkalmazandó fényerő szintje'
      pt: 'Nível de brilho a aplicar aos LED do seletor basculante'
    type: 'uint'
    min: 0
    max: 15

  TOGGLE_LED_P_STATE_REQUEST:
    bits: '2.3-2.1'
    comment:
      en: 'Requested state of the P (Park) LED on the gear toggle'
