id: 0x38B
name: 'BSI_OTA_STATUS'
type: 'can'
length: 8
comment:
  en: 'Over-the-air update state for the BSI: update type, user interaction request, installation activation and vehicle update status.'
  fr: 'État de mise à jour à distance (OTA) de la BSI : type de mise à jour, demande d''interaction utilisateur, activation de l''installation et état de mise à jour du véhicule.'
  es: 'Estado de actualización por aire (OTA) de la BSI: tipo de actualización, solicitud de interacción del usuario, activación de la instalación y estado de actualización del vehículo.'
  de: 'Over-the-Air-Update-Status der BSI: Update-Typ, Aufforderung zur Benutzerinteraktion, Installationsaktivierung und Fahrzeug-Update-Status.'
  it: 'Stato di aggiornamento over-the-air (OTA) della BSI: tipo di aggiornamento, richiesta di interazione utente, attivazione dell''installazione e stato di aggiornamento del veicolo.'
  pl: 'Stan aktualizacji bezprzewodowej (OTA) BSI: typ aktualizacji, żądanie interakcji użytkownika, aktywacja instalacji i stan aktualizacji pojazdu.'
  ru: 'Состояние обновления по воздуху (OTA) BSI: тип обновления, запрос взаимодействия с пользователем, активация установки и статус обновления автомобиля.'
  zh: 'BSI的空中升级(OTA)状态：升级类型、用户交互请求、安装激活及车辆升级状态。'
  hu: 'A BSI légi (OTA) frissítési állapota: frissítés típusa, felhasználói interakció kérése, telepítés aktiválása és a jármű frissítési állapota.'
  pt: 'Estado da atualização over-the-air da BSI: tipo de atualização, pedido de interação do utilizador, ativação da instalação e estado de atualização do veículo.'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['BSRF']

