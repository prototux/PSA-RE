id: 0x259
name: 'AUTO_GEARBOX_SWITCH_STATUS'
type: 'can'
length: 3
comment:
  en: 'Status of the automatic gearbox selector switch: LED states, failure state and toggle position, sent by the switch.'
  fr: 'État du sélecteur de boîte automatique : états des LED, état de défaillance et position du basculeur, envoyé par le sélecteur.'
  es: 'Estado del selector de la caja de cambios automática: estados de los LED, estado de fallo y posición del selector, enviado por el selector.'
  de: 'Status des Automatikgetriebewählschalters: LED-Zustände, Fehlerzustand und Wippschalterstellung, gesendet vom Wählschalter.'
  it: 'Stato del selettore del cambio automatico: stati dei LED, stato di guasto e posizione del bilanciere, inviato dal selettore.'
  pl: 'Stan przełącznika wyboru biegów skrzyni automatycznej: stany LED, stan awarii i pozycja przełącznika, wysyłany przez przełącznik.'
  ru: 'Состояние переключателя селектора автоматической коробки передач: состояния светодиодов, состояние неисправности и положение переключателя, отправляется самим переключателем.'
  zh: '自动变速箱换挡开关状态：LED状态、故障状态和拨杆位置，由开关本身发送。'
  hu: 'Az automata váltó választókapcsolójának állapota: LED-állapotok, hibaállapot és a billenőkapcsoló helyzete, a kapcsoló küldi.'
  pt: 'Estado do seletor da caixa de velocidades automática: estados dos LED, estado de avaria e posição do basculante, enviado pelo seletor.'
periodicity: ['100ms', 'trigger']
senders: ['AUTO_GEARBOX_SWITCH']
receivers: ['BSI']

signals:
  PROCESS_COUNTER_4BIT_259:
    bits: '1.3-1.0'
    comment:
      en: '4-bit process counter (259)'
      fr: 'Compteur de process 4 bits (259)'
      es: 'Contador de proceso de 4 bits (259)'
      de: '4-Bit-Prozesszähler (259)'
      it: 'Contatore di processo a 4 bit (259)'
      pl: '4-bitowy licznik procesu (259)'
      ru: '4-битный счётчик процесса (259)'
      zh: '4位过程计数器(259)'
      hu: '4 bites folyamatszámláló (259)'
      pt: 'Contador de processo de 4 bits (259)'
    type: 'uint'
    min: 0
    max: 15

