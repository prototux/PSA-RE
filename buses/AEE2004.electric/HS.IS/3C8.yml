id: 0x3C8
name: 'PIU_BATTERY_DATA'
type: 'can'
length: 3
comment:
  en: 'Power interface unit data: battery level, low-battery/EV/power-down warnings and EV power state.'
  fr: 'Données de l''unité d''interface de puissance (PIU) : niveau de batterie, alertes batterie faible/VE/extinction et état de puissance VE.'
  es: 'Datos de la unidad de interfaz de potencia (PIU): nivel de batería, avisos de batería baja/VE/apagado y estado de potencia VE.'
  de: 'Daten der Leistungsschnittstelleneinheit (PIU): Batteriestand, Warnungen bei niedrigem Batteriestand/EV/Abschaltung sowie EV-Leistungszustand.'
  it: 'Dati dell''unità di interfaccia di potenza (PIU): livello batteria, avvisi batteria bassa/EV/spegnimento e stato di potenza EV.'
  pl: 'Dane jednostki interfejsu mocy (PIU): poziom baterii, ostrzeżenia o niskim poziomie baterii/EV/wyłączeniu oraz stan mocy EV.'
  ru: 'Данные силового интерфейсного блока (PIU): уровень заряда батареи, предупреждения о низком заряде/EV/отключении питания и статус мощности EV.'
  zh: '电源接口单元(PIU)数据:电池电量、低电量/电动车/断电警告及电动车电源状态。'
  hu: 'A teljesítmény-interfész egység (PIU) adatai: akkumulátorszint, alacsony akkumulátorszint-/EV-/lekapcsolási figyelmeztetések, valamint az EV teljesítményállapota.'
  pt: 'Dados da unidade de interface de potência: nível da bateria, avisos de bateria fraca/EV/desligamento e estado de potência do EV.'
periodicity: ['50ms']
senders: ['PIU']
receivers: ['BSI']

