      ru: 'Ток, потребляемый электрическим PTC-нагревателем'
      zh: 'PTC电加热器消耗电流'
      hu: 'A CTP elektromos fűtés áramfelvétele'
      pt: 'Consumo de corrente do aquecedor de ar PTC'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 50
    units: 'A'
    invalid: 0x1FF
    default: 0x00

  ELECTRIC_COMPRESSOR_POWER_LIMIT_REACHED:
    bits: '4.4'
    comment:
      en: 'Electric compressor power limitation reached'
      fr: 'Indication que la puissance du compresseur électrique est limitée'
      es: 'Indicación de que se ha alcanzado la limitación de potencia del compresor eléctrico'
      de: 'Anzeige, dass die Leistungsbegrenzung des elektrischen Kompressors erreicht ist'
      it: 'Indicazione che è stata raggiunta la limitazione di potenza del compressore elettrico'
      pl: 'Wskazanie osiągnięcia ograniczenia mocy sprężarki elektrycznej'
      ru: 'Индикация достижения ограничения мощности электрического компрессора'
      zh: '表示电动压缩机功率限制已达到'
      hu: 'Jelzés, hogy az elektromos kompresszor teljesítménykorlátozása elérte a határt'
      pt: 'Limitação de potência do compressor elétrico atingida'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No limitation'
        fr: 'Pas de limitation'
        es: 'Sin limitación'
        de: 'Keine Einschränkung'
        it: 'Nessuna limitazione'
        pl: 'Brak ograniczenia'
        ru: 'Ограничение отсутствует'
        zh: '无限制'
        hu: 'Nincs korlátozás'
        pt: 'Sem limitação'
      0x01:
        en: 'Power limitation reached'
        fr: 'Limitation de puissance atteinte'
        es: 'Limitación de potencia alcanzada'
        de: 'Leistungsbegrenzung erreicht'
        it: 'Limitazione di potenza raggiunta'
        pl: 'Osiągnięto ograniczenie mocy'
        ru: 'Достигнуто ограничение мощности'
        zh: '已达到功率限制'
        hu: 'A teljesítménykorlátozás elérve'
        pt: 'Limitação de potência atingida'

