        fr: 'Alerte mineure'
        es: 'Advertencia menor'
        de: 'Geringfügige Warnung'
        it: 'Allerta minore'
        pl: 'Drobne ostrzeżenie'
        ru: 'Незначительное предупреждение'
        zh: '轻微警报'
        hu: 'Kisebb figyelmeztetés'
        pt: 'Aviso menor'
      0x02:
        en: 'Major warning'
        fr: 'Alerte majeure'
        es: 'Aviso mayor'
        de: 'Schwerwiegende Warnung'
        it: 'Avviso grave'
        pl: 'Poważne ostrzeżenie'
        ru: 'Серьёзное предупреждение'
        zh: '重大警告'
        hu: 'Súlyos figyelmeztetés'
        pt: 'Aviso importante'
      0x03:
        unused: true

  CRUISING_RANGE_WO_AC:
    bits: '7.7-8.6'
    comment:
      en: 'Zero-emission range excluding auxiliaries'
      fr: 'Autonomie zéro émission hors auxiliaires'
      es: 'Autonomía de emisión cero sin auxiliares'
      de: 'Nullemissions-Reichweite ohne Nebenverbraucher'
      it: 'Autonomia a zero emissioni esclusi gli ausiliari'
      pl: 'Zasięg bezemisyjny bez uwzględnienia odbiorników pomocniczych'
      ru: 'Запас хода без выбросов без учёта вспомогательных потребителей'
      zh: '不含辅助系统的零排放续航里程'
      hu: 'Nulla kibocsátású hatótávolság a kiegészítő fogyasztók nélkül'
      pt: 'Autonomia de emissão zero sem auxiliares'
    type: 'uint'
    min: 0
    max: 1022
    invalid: 0x3FF
    default: 0x00

  UNUSED_2:
    bits: '8.5-8.2'
    unused: true

