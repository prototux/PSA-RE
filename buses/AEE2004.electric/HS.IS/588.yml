id: 0x588
name: 'PIU_DATA_2'
type: 'can'
length: 8
comment:
  en: 'Power interface unit data 2: low-voltage supply cut fault indicator.'
  fr: 'Données 2 de l''unité d''interface de puissance : indicateur de défaut de coupure basse tension.'
  es: 'Datos 2 de la unidad de interfaz de potencia: indicador de fallo de corte de baja tensión.'
  de: 'Daten 2 der Leistungsschnittstelleneinheit: Fehleranzeige für Niederspannungsunterbrechung.'
  it: 'Dati 2 dell''unità di interfaccia di potenza: indicatore di guasto di interruzione bassa tensione.'
  pl: 'Dane 2 jednostki interfejsu mocy: wskaźnik usterki przerwania zasilania niskiego napięcia.'
  ru: 'Данные 2 силового интерфейсного блока: индикатор неисправности обрыва низковольтного питания.'
  zh: '功率接口单元数据2:低压供电中断故障指示。'
  hu: 'A teljesítmény-interfész egység 2. adatai: kisfeszültségű tápellátás-megszakadás hibajelző.'
  pt: 'Dados 2 da unidade de interface de potência: indicador de avaria de corte da alimentação de baixa tensão.'
periodicity: ['100ms']
senders: ['PIU']
receivers: ['BSI']

signals:
  BATTERY_CURRENT:
    bits: '1.7-2.0'
    comment:
      en: 'Battery current'
      fr: 'Courant de la batterie'
      es: 'Corriente de la batería'
      de: 'Batteriestrom'
      it: 'Corrente della batteria'
      pl: 'Prąd akumulatora'
      ru: 'Ток батареи'
      zh: '电池电流'
      hu: 'Akkumulátor árama'
      pt: 'Corrente da bateria'
    type: 'uint'
    factor: 0.01
    offset: -327
    min: -327
    max: 327
    units: 'A'
    invalid: 0xFFFF
    default: 0x00

  BATTERY_VOLTAGE:
    bits: '3.7-4.0'
    comment:
      en: 'Battery voltage'
      fr: 'Tension de la batterie'
      es: 'Tensión de la batería'
      de: 'Batteriespannung'
      it: 'Tensione della batteria'
      pl: 'Napięcie akumulatora'
      ru: 'Напряжение батареи'
      zh: '电池电压'
      hu: 'Akkumulátor feszültsége'
      pt: 'Tensão da bateria'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 670
    units: 'V'
    invalid: 0xFFFF
    default: 0x00

  UNUSED_1:
    bits: '5.7-6.7'
    unused: true

  ATMOSPHERIC_PRESSURE:
    bits: '6.6-6.2'
    comment:
      en: 'Atmospheric pressure (hPa)'
      fr: 'Pression atmosphérique (hPa)'
      es: 'Presión atmosférica (hPa)'
      de: 'Atmosphärendruck (hPa)'
      it: 'Pressione atmosferica (hPa)'
      pl: 'Ciśnienie atmosferyczne (hPa)'
      ru: 'Атмосферное давление (гПа)'
      zh: '大气压力(hPa)'
      hu: 'Légköri nyomás (hPa)'
      pt: 'Pressão atmosférica (hPa)'
    type: 'uint'
    factor: 15
    offset: 685
    min: 685
    max: 1120
    units: 'hPa'
    invalid: 0x1F
    default: 0x1E

  HV_CUTOFF_FAULT_DISPLAY_REQUEST:
    bits: '6.1-6.0'
    comment:
      en: 'HMI display request for a fault in the high-voltage battery cutoff command in case of a crash'
      fr: 'Demande d''affichage IHM en cas de défaut de la commande de coupure de la batterie HT en cas de choc'
      es: 'Solicitud de visualización IHM en caso de fallo del comando de corte de la batería de alta tensión en caso de choque'
      de: 'HMI-Anzeigeanforderung bei einem Fehler des Hochvolt-Batterieabschaltbefehls im Falle eines Crashs'
      it: 'Richiesta di visualizzazione HMI in caso di guasto del comando di interruzione della batteria AT in caso di urto'
      pl: 'Żądanie wyświetlenia HMI w przypadku usterki polecenia odcięcia akumulatora wysokiego napięcia w razie kolizji'
      ru: 'Запрос индикации HMI при неисправности команды отключения высоковольтной батареи в случае столкновения'
      zh: '碰撞时高压电池切断指令故障的人机界面显示请求'
      hu: 'HMI megjelenítési kérés a nagyfeszültségű akkumulátor lekapcsolási parancsának hibája esetén ütközéskor'
      pt: 'Pedido de visualização na IHM de uma avaria no comando de corte da bateria de alta tensão em caso de colisão'
    type: 'enum'
    default: 0x00
