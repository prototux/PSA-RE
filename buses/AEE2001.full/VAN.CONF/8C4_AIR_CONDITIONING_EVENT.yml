id: 0x8C4
name: 'AIR_CONDITIONING_EVENT'
type: 'van'
length: 3
comment:
  en: 'Event notification from the climate control unit to the display, telling it to read the climate status frame.'
  fr: 'Notification d''événement de la climatisation vers l''écran, l''invitant à lire la trame d''état climatisation.'
  es: 'Notificación de evento del climatizador hacia la pantalla, indicándole que lea la trama de estado del climatizador.'
  de: 'Ereignisbenachrichtigung der Klimaanlage an das Display, das zum Lesen des Klimastatusrahmens auffordert.'
  it: 'Notifica di evento del climatizzatore verso il display, che lo invita a leggere la trama di stato del climatizzatore.'
  pl: 'Powiadomienie o zdarzeniu klimatyzacji do wyświetlacza, informujące o konieczności odczytu ramki stanu klimatyzacji.'
  ru: 'Уведомление о событии кондиционера для дисплея, предписывающее считать кадр состояния кондиционера.'
  zh: '空调向显示屏发送的事件通知,提示读取空调状态帧。'
  hu: 'A klíma esemény-értesítése a kijelző felé, amely a klímaállapot-keret beolvasására utasít.'
  pt: 'Notificação de evento da unidade de climatização para o visor, indicando-lhe para ler a trama de estado da climatização.'
periodicity: ['trigger']
senders: ['CLIM_AV']
receivers: ['EMF']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

