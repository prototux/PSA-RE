id: 0x6F4
name: 'TELEPHONE_STATUS_GENERAL_HANDSFREE_KIT'
type: 'van'
length: 8
comment:
  en: 'Telephone general status (power, access control, network, call phase, hands-free) - hands-free kit with interconnection box variant (sub-address INTERCONNECTION_BOX_ON=1).'
  fr: 'État général du téléphone (alimentation, contrôle d''accès, réseau, phase d''appel, mains libres) - variante kit mains libres avec boîtier d''interconnexion (sous-adressage INTERCONNECTION_BOX_ON=1).'
  es: 'Estado general del teléfono (alimentación, control de acceso, red, fase de llamada, manos libres) - variante kit manos libres con caja de interconexión (subdirección INTERCONNECTION_BOX_ON=1).'
  de: 'Allgemeiner Telefonstatus (Stromversorgung, Zugriffskontrolle, Netz, Anrufphase, Freisprechen) - Variante Freisprecheinrichtung mit Verbindungsbox (Unteradresse INTERCONNECTION_BOX_ON=1).'
  it: 'Stato generale del telefono (alimentazione, controllo accesso, rete, fase di chiamata, vivavoce) - variante kit vivavoce con scatola di interconnessione (sottoindirizzo INTERCONNECTION_BOX_ON=1).'
  pl: 'Ogólny stan telefonu (zasilanie, kontrola dostępu, sieć, faza połączenia, zestaw głośnomówiący) - wariant zestawu głośnomówiącego ze skrzynką połączeniową (podadres INTERCONNECTION_BOX_ON=1).'
  ru: 'Общий статус телефона (питание, контроль доступа, сеть, фаза вызова, громкая связь) - вариант громкой связи с блоком сопряжения (субадрес INTERCONNECTION_BOX_ON=1).'
  zh: '电话总体状态(供电、访问控制、网络、通话阶段、免提)——带互连盒的免提套件变体(子地址ON_STATUS_BIC_RTEL=1)。'
  hu: 'Általános telefonállapot (tápellátás, hozzáférés-vezérlés, hálózat, hívásfázis, kihangosítás) - összekötődobozos kihangosító készlet változat (INTERCONNECTION_BOX_ON=1 alcím).'
  pt: 'Estado geral do telefone (alimentação, controlo de acesso, rede, fase de chamada, mãos-livres) - variante do kit mãos-livres com caixa de interligação (sub-endereço INTERCONNECTION_BOX_ON=1).'
periodicity: ['1000ms', 'trigger']
senders: ['BTEL']
receivers: ['EMF']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['EMF']

signals:
  HEADER:
    bits: '1.7-1.0'
    comment:
      en: 'Start-of-frame marker byte of the in-frame reply (usage defined by the VAN network rules)'
      fr: 'Marqueur de début de trame'
      es: 'Byte marcador de inicio de trama de la respuesta en trama'
      de: 'Kennzeichnungsbyte für den Rahmenanfang der In-Frame-Antwort'
      it: 'Byte marcatore di inizio frame della risposta in-frame'
      pl: 'Bajt znacznika początku ramki odpowiedzi w ramce'
      ru: 'Байт-маркер начала кадра ответа в кадре'
      zh: '帧内应答起始标记字节'
      hu: 'Az üzeneten belüli válasz kezdő jelölőbájtja'
      pt: 'Byte marcador de início de trama da resposta em trama'
