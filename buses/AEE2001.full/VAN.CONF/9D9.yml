id: 0x9D9
name: 'AC_IO16_COMMAND'
type: 'van'
length: 6
comment:
  en: 'Initialisation and output commands sent by the BSI to the climate-control I/O16 extension module.'
  fr: 'Commandes d''initialisation et de sorties envoyées par la BSI au module d''extension climatisation I/O16.'
  es: 'Comandos de inicialización y salida enviados por la BSI al módulo de extensión de climatización I/O16.'
  de: 'Initialisierungs- und Ausgabebefehle des BSI an das Klima-Erweiterungsmodul I/O16.'
  it: 'Comandi di inizializzazione e uscita inviati dalla BSI al modulo di estensione climatizzazione I/O16.'
  pl: 'Polecenia inicjalizacji i wyjść wysyłane przez BSI do modułu rozszerzenia klimatyzacji I/O16.'
  ru: 'Команды инициализации и вывода, отправляемые BSI на модуль расширения климат-контроля I/O16.'
  zh: 'BSI发送给空调I/O16扩展模块的初始化和输出命令。'
  hu: 'A BSI által a klíma I/O16 bővítőmodulnak küldött inicializálási és kimeneti parancsok.'
  pt: 'Comandos de inicialização e de saída enviados pela BSI ao módulo de extensão I/O16 da climatização.'
periodicity: ['50ms']
senders: ['BSI']
receivers: ['CLIM_AV']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  AC_TELLTALE:
    bits: '1.7'
    comment:
      en: 'A/C telltale on the control panel'
      fr: 'Témoin AC sur le panneau de commande'
      es: 'Testigo AC en el panel de mando'
      de: 'Klimaanlagen-Kontrollleuchte am Bedienfeld'
      it: 'Spia AC sul pannello di comando'
      pl: 'Kontrolka AC na panelu sterowania'
      ru: 'Индикатор кондиционера (A/C) на панели управления'
      zh: '控制面板上的空调(AC)指示灯'
      hu: 'AC jelzőlámpa a kezelőpanelen'
      pt: 'Testemunho AC no painel de comando'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Off'
        fr: 'Éteint'
        es: 'Apagado'
        de: 'Aus'
        it: 'Spento'
        pl: 'Wyłączone'
        ru: 'Выключено'
        zh: '关闭'
        hu: 'Kikapcsolva'
        pt: 'Desligado'
      0x01:
        en: 'On'
        fr: 'Allumé'
        es: 'Encendido'
        de: 'Ein'
        it: 'Acceso'
        pl: 'Włączony'
        ru: 'Включено'
        zh: '开'
        hu: 'Bekapcsolva'
        pt: 'Ligado'

