id: 0x768
name: 'PARK_ASSIST_BEEP'
type: 'van'
length: 4
comment:
  en: 'Parking assistance beep request and system state, sent to the BSI.'
  fr: 'Demande de bip d''aide au stationnement et état du système, envoyées à la BSI.'
  es: 'Solicitud de pitido de ayuda al aparcamiento y estado del sistema, enviadas a la BSI.'
  de: 'Anforderung des Einparkhilfe-Signaltons und Systemzustand, gesendet an die BSI.'
  it: 'Richiesta di segnale acustico per l''assistenza al parcheggio e stato del sistema, inviate alla BSI.'
  pl: 'Żądanie sygnału dźwiękowego czujników parkowania i stan systemu, wysyłane do BSI.'
  ru: 'Запрос звукового сигнала парковочного ассистента и состояние системы, отправляемые в BSI.'
  zh: '发送给BSI的泊车辅助提示音请求及系统状态。'
  hu: 'A parkolássegítő hangjelzés-kérése és a rendszer állapota, a BSI-nek küldve.'
  pt: 'Pedido de sinal sonoro da ajuda ao estacionamento e estado do sistema, enviados à BSI.'
periodicity: ['trigger']
senders: ['AAS']
receivers: ['BSI']
van:
  access: 'write'
  rtr: false
  reply: 'none'

signals:
  BEEP_FUNCTION:
    bits: '1.7'
    comment:
      en: 'Parking assistance beep function'
      fr: 'Fonction bip d''assistance au stationnement'
      es: 'Función de pitido de la asistencia de estacionamiento'
      de: 'Piepton-Funktion der Einparkhilfe'
      it: 'Funzione segnale acustico dell''assistenza al parcheggio'
      pl: 'Funkcja sygnału dźwiękowego asystenta parkowania'
      ru: 'Функция звукового сигнала помощи при парковке'
      zh: '泊车辅助蜂鸣功能'
      hu: 'Parkolássegítő hangjelző funkciója'
      pt: 'Função de sinal sonoro da assistência de estacionamento'
    type: 'bool'

  OBSTACLE_DETECTED:
    bits: '1.6'
    comment:
      en: 'Obstacle detected'
      fr: 'Obstacle détecté'
      es: 'Obstáculo detectado'
      de: 'Hindernis erkannt'
      it: 'Ostacolo rilevato'
      pl: 'Wykryto przeszkodę'
      ru: 'Обнаружено препятствие'
      zh: '检测到障碍物'
      hu: 'Akadály érzékelve'
