id: 0x4FC
name: 'ODOMETER_COMMANDS'
type: 'van'
length: 14
comment:
  en: 'Body controller to instrument cluster: cluster on/off, telltales, service distance, gearbox position, lamp telltales, oil temperature/level, fuel and LPG levels, body height.'
  fr: 'De la BSI vers le combiné : marche/arrêt de l''affichage, témoins, distance avant entretien, position boîte de vitesses, témoins lampes, température/niveau d''huile, niveaux carburant et GPL, hauteur de caisse.'
  es: 'De la BSI al cuadro de instrumentos: encendido/apagado, testigos, distancia de mantenimiento, posición de la caja de cambios, testigos de lámparas, temperatura/nivel de aceite, niveles de combustible y GLP, altura de carrocería.'
  de: 'Vom BSI zum Kombiinstrument: Ein/Aus, Kontrollleuchten, Wartungsdistanz, Getriebeposition, Lampenkontrolle, Öltemperatur/-stand, Kraftstoff- und Autogasstand, Karosseriehöhe.'
  it: 'Dalla BSI al quadro strumenti: accensione/spegnimento, spie, distanza al tagliando, posizione cambio, spie lampade, temperatura/livello olio, livelli carburante e GPL, altezza scocca.'
  pl: 'Od BSI do zestawu wskaźników: włączenie/wyłączenie, kontrolki, dystans do przeglądu, położenie skrzyni biegów, kontrolki żarówek, temperatura/poziom oleju, poziomy paliwa i LPG, wysokość nadwozia.'
  ru: 'От BSI к комбинации приборов: вкл/выкл, индикаторы, пробег до обслуживания, положение коробки передач, индикаторы ламп, температура/уровень масла, уровни топлива и ГБО, высота кузова.'
  zh: '车身控制器发送给仪表组的信息:开关状态、指示灯、保养里程、变速箱挡位、灯泡指示灯、机油温度/油位、燃油和液化气油位、车身高度。'
  hu: 'A BSI-től a műszeregységnek: be/kikapcsolás, jelzőlámpák, szervizig hátralévő táv, váltó állása, izzófigyelés, olajhőmérséklet/-szint, üzemanyag- és LPG-szint, karosszéria magasság.'
  pt: 'Do computador de servidão para o quadrante de instrumentos: ligar/desligar o quadrante, avisadores, distância até à revisão, posição da caixa de velocidades, avisadores de luzes, temperatura/nível de óleo, níveis de combustível e GPL, altura da carroçaria.'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['CMB']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  ODOMETER_STATUS:
    bits: '1.7'
    comment:
      en: 'Instrument cluster on/off (held active while the cluster must operate)'
      fr: 'Marche/arrêt du combiné (maintenu actif tant que le combiné doit fonctionner)'
      es: 'Encendido/apagado del cuadro de instrumentos (mantenido activo mientras debe funcionar)'
      de: 'Kombiinstrument ein/aus (aktiv gehalten, solange das Kombiinstrument arbeiten soll)'
      it: 'Accensione/spegnimento del quadro strumenti (mantenuto attivo finché deve funzionare)'
      pl: 'Włączenie/wyłączenie zestawu wskaźników (utrzymywane aktywne, gdy zestaw ma działać)'
      ru: 'Включение/выключение приборной панели (удерживается активным, пока панель должна работать)'
      zh: '仪表盘开/关(仪表盘需工作时保持激活)'
      hu: 'A műszerfal be/ki állapota (aktívan tartva, amíg a műszerfalnak működnie kell)'
      pt: 'Ligar/desligar o quadrante (mantido ativo enquanto o quadrante deve funcionar)'
    type: 'bool'
    default: 0x01
    values:
      0x00:
        en: 'Cluster not active'
        fr: 'Combiné non actif'
        es: 'Cuadro de instrumentos no activo'
        de: 'Kombiinstrument nicht aktiv'
        it: 'Quadro strumenti non attivo'
        pl: 'Zestaw wskaźników nieaktywny'
