        pt: 'Pedido'

  RADIO_READY:
    bits: '3.0'
    comment:
      en: 'Radio ready: self-test and source test done, ON and ACTIVE received; standby when the network is active while the radio is off, or when unusable'
      fr: 'Mode autoradio Ready/Standby, prêt une fois l''auto-test et le test des sources terminés'
      es: 'Radio lista: autodiagnóstico y prueba de fuentes completados, recibido ON y ACTIVE; en espera cuando la red está activa con la radio apagada, o si no es utilizable'
      de: 'Radio bereit: Selbsttest und Quellentest abgeschlossen, ON und ACTIVE empfangen; Standby, wenn das Netzwerk aktiv ist während das Radio aus ist, oder bei Unbrauchbarkeit'
      it: 'Radio pronta: autotest e test delle sorgenti completati, ricevuti ON e ACTIVE; standby quando la rete è attiva a radio spenta, o se inutilizzabile'
      pl: 'Radio gotowe: zakończony autotest i test źródeł, odebrano ON i ACTIVE; stan czuwania, gdy sieć jest aktywna przy wyłączonym radiu lub gdy jest bezużyteczne'
      ru: 'Магнитола готова: самотестирование и проверка источников завершены, получены ON и ACTIVE; ожидание, когда сеть активна при выключенной магнитоле, или при неработоспособности'
      zh: '收音机就绪:自检与信号源测试完成,已收到ON和ACTIVE;收音机关闭但总线激活时或不可用时进入待机'
      hu: 'A rádió készen áll: az önteszt és a forrásteszt befejeződött, ON és ACTIVE fogadva; készenlét, ha a hálózat aktív, miközben a rádió ki van kapcsolva, vagy ha használhatatlan'
      pt: 'Rádio pronto: autoteste e teste de fontes concluídos, ON e ACTIVE recebidos; em espera quando a rede está ativa com o rádio desligado, ou quando não utilizável'
    type: 'bool'
    default: 0x00
    values:
      0x00:
