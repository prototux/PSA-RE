  RADIO_ON_REQUEST:
    bits: '3.1'
    comment:
      en: 'User requests radio on (front panel); reset on reception of the associated command, followed by a network wake-up if the bus is asleep'
      fr: 'Demande d''activation de l''autoradio via la façade, remise à zéro sur réception de la commande associée'
      es: 'El usuario solicita encender la radio (panel frontal); se restablece al recibir el comando asociado, seguido de un despertar de la red si el bus está inactivo'
      de: 'Nutzer fordert Radio ein an (Frontplatte); wird bei Empfang des zugehörigen Befehls zurückgesetzt, gefolgt von einem Netzwerk-Aufwachen, falls der Bus ruht'
      it: 'L''utente richiede l''accensione della radio (pannello frontale); azzerato alla ricezione del comando associato, seguito da un risveglio della rete se il bus è inattivo'
      pl: 'Użytkownik żąda włączenia radia (panel przedni); kasowane po odebraniu powiązanego polecenia, następnie wybudzenie sieci, jeśli magistrala śpi'
      ru: 'Пользователь запрашивает включение радио (передняя панель); сбрасывается при получении соответствующей команды, за этим следует пробуждение сети, если шина спит'
      zh: '用户请求打开收音机(前面板);收到相应命令后复位,若总线休眠则随后唤醒网络'
      hu: 'A felhasználó bekapcsolást kér a rádiótól (előlap); a kapcsolódó parancs vételekor törlődik, ezt hálózatébresztés követi, ha a busz alszik'
      pt: 'O utilizador pede para ligar a rádio (painel frontal); repõe-se ao receber o comando associado, seguido de um despertar de rede se o barramento estiver inativo'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
