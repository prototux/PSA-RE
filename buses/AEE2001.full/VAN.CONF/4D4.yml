  SPEAKER_CONFIGURATION:
    bits: '2.3'
    comment:
      en: 'Number of audio channels: 2 speakers (front only, fader inactive) or 4 speakers (fader active)'
      fr: 'Nombre de voies audio (2 ou 4 haut-parleurs)'
      es: 'Número de canales de audio: 2 altavoces (solo delanteros, fader inactivo) o 4 altavoces (fader activo)'
      de: 'Anzahl der Audiokanäle: 2 Lautsprecher (nur vorne, Fader inaktiv) oder 4 Lautsprecher (Fader aktiv)'
      it: 'Numero di canali audio: 2 altoparlanti (solo anteriori, fader inattivo) o 4 altoparlanti (fader attivo)'
      pl: 'Liczba kanałów audio: 2 głośniki (tylko przednie, fader nieaktywny) lub 4 głośniki (fader aktywny)'
      ru: 'Число аудиоканалов: 2 динамика (только передние, фейдер неактивен) или 4 динамика (фейдер активен)'
      zh: '音频声道数:2扬声器(仅前置,前后音场无效)或4扬声器(前后音场有效)'
      hu: 'Az audiocsatornák száma: 2 hangszóró (csak elöl, fader inaktív) vagy 4 hangszóró (fader aktív)'
      pt: 'Número de canais de áudio: 2 altifalantes (apenas dianteiros, fader inativo) ou 4 altifalantes (fader ativo)'
    type: 'bool'
