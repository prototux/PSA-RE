  PHONE_ACTIVATION_REQUEST:
    bits: '3.5'
    comment:
      en: 'Phone activation request: an external phone drives the mute pin of the radio ISO connector'
      fr: 'Demande d''activation fonctionnelle du radiotéléphone via la broche mute du connecteur ISO de l''autoradio'
      es: 'Solicitud de activación del teléfono: un teléfono externo controla el pin de silencio del conector ISO de la radio'
      de: 'Telefonaktivierungsanforderung: Ein externes Telefon steuert den Mute-Pin des ISO-Steckers des Radios'
      it: 'Richiesta di attivazione del telefono: un telefono esterno pilota il pin mute del connettore ISO dell''autoradio'
      pl: 'Żądanie aktywacji telefonu: zewnętrzny telefon steruje pinem mute złącza ISO radia'
      ru: 'Запрос активации телефона: внешний телефон управляет контактом mute разъёма ISO магнитолы'
      zh: '电话激活请求:外部电话通过收音机ISO接口的静音引脚触发'
      hu: 'Telefonaktiválási kérés: egy külső telefon vezérli a rádió ISO csatlakozójának mute lábát'
      pt: 'Pedido de ativação do telefone: um telefone externo controla o pino de silêncio do conector ISO da rádio'
    type: 'bool'
