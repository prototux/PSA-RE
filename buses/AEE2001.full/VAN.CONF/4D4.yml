        ru: 'Запрошено'
        zh: '已请求'
        hu: 'Kérve'
        pt: 'Pedido'

  CD_ACTIVATION_REQUEST:
    bits: '3.4'
    comment:
      en: 'CD inserted while the radio is off (activation request); reset on reception of the associated command'
      fr: 'Demande d''activation de l''autoradio suite à l''insertion d''un CD alors qu''il est à l''arrêt'
      es: 'CD insertado con la radio apagada (solicitud de activación); se restablece al recibir el comando asociado'
      de: 'CD eingelegt bei ausgeschaltetem Radio (Aktivierungsanforderung); wird bei Empfang des zugehörigen Befehls zurückgesetzt'
      it: 'CD inserito a radio spenta (richiesta di attivazione); azzerato alla ricezione del comando associato'
      pl: 'Włożono CD przy wyłączonym radiu (żądanie aktywacji); kasowane po odebraniu powiązanego polecenia'
      ru: 'CD вставлен при выключенной магнитоле (запрос активации); сбрасывается при получении соответствующей команды'
      zh: '收音机关闭时插入CD(激活请求);收到相应命令后复位'
      hu: 'CD behelyezve kikapcsolt rádió mellett (aktiválási kérés); a kapcsolódó parancs vételekor törlődik'
      pt: 'CD inserido com a rádio desligada (pedido de ativação); repõe-se ao receber o comando associado'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
