        fr: 'Demandé'
        es: 'Solicitado'
        de: 'Angefordert'
        it: 'Richiesto'
        pl: 'Żądane'
        ru: 'Запрошено'
        zh: '已请求'
        hu: 'Kérve'
        pt: 'Pedido'

  CASSETTE_ACTIVATION_REQUEST:
    bits: '3.3'
    comment:
      en: 'Cassette inserted while the radio is off (activation request); followed by a network wake-up if the bus is asleep'
      fr: 'Demande d''activation de l''autoradio suite à l''insertion d''une cassette alors qu''il est à l''arrêt'
      es: 'Cinta insertada con la radio apagada (solicitud de activación); seguida de un despertar de la red si el bus está inactivo'
      de: 'Kassette eingelegt bei ausgeschaltetem Radio (Aktivierungsanforderung); gefolgt von einem Netzwerk-Aufwachen, falls der Bus ruht'
      it: 'Cassetta inserita a radio spenta (richiesta di attivazione); seguita da un risveglio della rete se il bus è inattivo'
      pl: 'Włożono kasetę przy wyłączonym radiu (żądanie aktywacji); następnie wybudzenie sieci, jeśli magistrala śpi'
      ru: 'Кассета вставлена при выключенной магнитоле (запрос активации); за этим следует пробуждение сети, если шина спит'
      zh: '收音机关闭时插入磁带(激活请求);若总线休眠则随后唤醒网络'
      hu: 'Kazetta behelyezve kikapcsolt rádió mellett (aktiválási kérés); ezt hálózatébresztés követi, ha a busz alszik'
      pt: 'Cassete inserida com a rádio desligada (pedido de ativação); seguida de um despertar de rede se o barramento estiver inativo'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
        en: 'Requested'
        fr: 'Demandé'
        es: 'Solicitado'
        de: 'Angefordert'
        it: 'Richiesto'
        pl: 'Żądane'
        ru: 'Запрошено'
        zh: '已请求'
        hu: 'Kérve'
        pt: 'Pedido'

  RADIO_OFF_REQUEST:
    bits: '3.2'
    comment:
      en: 'User requests radio off (the display decides depending on context)'
      fr: 'Demande de l''utilisateur d''arrêt de l''autoradio, l''écran décide selon le contexte'
      es: 'El usuario solicita apagar la radio (la pantalla decide según el contexto)'
      de: 'Nutzer fordert Radio aus an (das Display entscheidet je nach Kontext)'
      it: 'L''utente richiede lo spegnimento della radio (il display decide in base al contesto)'
      pl: 'Użytkownik żąda wyłączenia radia (wyświetlacz decyduje w zależności od kontekstu)'
      ru: 'Пользователь запрашивает выключение радио (дисплей решает в зависимости от контекста)'
      zh: '用户请求关闭收音机(由显示屏根据情境决定)'
      hu: 'A felhasználó kikapcsolást kér a rádiótól (a kijelző dönt a kontextus alapján)'
      pt: 'O utilizador pede para desligar a rádio (o ecrã decide consoante o contexto)'
