    comment:
      en: 'Mute requested through the wired mute input (e.g. aftermarket phone)'
      fr: 'Mute demandé via l''entrée filaire dédiée (ex. téléphone non intégré)'
      es: 'Silencio solicitado a través de la entrada de silencio por cable (p. ej. teléfono no integrado)'
      de: 'Stummschaltung über den verdrahteten Mute-Eingang angefordert (z. B. Nachrüsttelefon)'
      it: 'Silenziamento richiesto tramite l''ingresso mute cablato (es. telefono non integrato)'
      pl: 'Wyciszenie żądane przez przewodowe wejście mute (np. telefon niezintegrowany)'
      ru: 'Запрос отключения звука через проводной вход mute (например, неинтегрированный телефон)'
      zh: '通过有线静音输入请求静音(如非原装电话)'
      hu: 'Némítás kérése a vezetékes mute bemeneten keresztül (pl. utólag szerelt telefon)'
      pt: 'Silêncio pedido através da entrada de silêncio por fio (ex.: telefone não integrado)'
