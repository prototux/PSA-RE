        pl: 'Zażądane'
        ru: 'Запрошено'
        zh: '已请求'
        hu: 'Kérve'
        pt: 'Solicitado'

  MUTE_STATE:
    bits: '2.0'
    comment:
      en: 'Radio is muted; stays 1 until ON + ACTIVE and a source have been received'
      fr: 'Mute activé / non activé'
      es: 'La radio está silenciada; permanece en 1 hasta recibir ON + ACTIVE y una fuente'
      de: 'Radio ist stummgeschaltet; bleibt 1 bis ON + ACTIVE und eine Quelle empfangen wurden'
      it: 'La radio è silenziata; resta a 1 finché non vengono ricevuti ON + ACTIVE e una sorgente'
      pl: 'Radio jest wyciszone; pozostaje 1, dopóki nie odebrano ON + ACTIVE i źródła'
      ru: 'Магнитола заглушена; остаётся 1, пока не получены ON + ACTIVE и источник'
      zh: '收音机静音;直到收到ON+ACTIVE及信号源前保持为1'
      hu: 'A rádió némítva van; 1 marad, amíg ON + ACTIVE és egy forrás nem érkezik'
      pt: 'A rádio está silenciada; permanece em 1 até serem recebidos ON + ACTIVE e uma fonte'
    type: 'bool'
