id: 0x4D4
name: 'RADIO_GENERAL_STATUS'
type: 'van'
length: 11
comment:
  en: 'Radio general status: on/ready state, user on/off requests, loudness, auto volume, mute, speaker configuration, power consumption, available/selected source, volume and audio settings.'
  fr: 'État général de l''autoradio : état marche/prêt, demandes marche/arrêt utilisateur, loudness, volume automatique, coupure son, configuration des haut-parleurs, consommation, source disponible/sélectionnée, volume et réglages audio.'
  es: 'Estado general de la radio: estado encendido/listo, solicitudes de encendido/apagado del usuario, loudness, volumen automático, silencio, configuración de altavoces, consumo, fuente disponible/seleccionada, volumen y ajustes de audio.'
  de: 'Allgemeiner Radiostatus: Ein/Bereit-Zustand, Benutzeranforderungen Ein/Aus, Loudness, automatische Lautstärke, Stummschaltung, Lautsprecherkonfiguration, Stromverbrauch, verfügbare/ausgewählte Quelle, Lautstärke und Audioeinstellungen.'
  it: 'Stato generale della radio: stato acceso/pronto, richieste di accensione/spegnimento dell''utente, loudness, volume automatico, silenziamento, configurazione altoparlanti, consumo, sorgente disponibile/selezionata, volume e impostazioni audio.'
  pl: 'Ogólny stan radia: stan włączenia/gotowości, żądania włączenia/wyłączenia przez użytkownika, loudness, automatyczna głośność, wyciszenie, konfiguracja głośników, pobór mocy, dostępne/wybrane źródło, głośność i ustawienia audio.'
  ru: 'Общий статус радио: состояние включения/готовности, запросы включения/выключения пользователем, громкость (loudness), автоматическая регулировка громкости, отключение звука, конфигурация динамиков, энергопотребление, доступный/выбранный источник, громкость и аудионастройки.'
  zh: '收音机总体状态:开机/就绪状态、用户开关请求、响度、自动音量、静音、扬声器配置、功耗、可用/已选信源、音量及音频设置。'
  hu: 'Az autórádió általános állapota: be/kész állapot, felhasználói be-/kikapcsolási kérések, hangosság (loudness), automatikus hangerő, némítás, hangszóró-konfiguráció, fogyasztás, elérhető/kiválasztott forrás, hangerő és audiobeállítások.'
  pt: 'Estado geral da rádio: estado ligado/pronto, pedidos de ligar/desligar do utilizador, loudness, volume automático, silêncio, configuração de altifalantes, consumo de potência, fonte disponível/selecionada, volume e definições áudio.'
periodicity: ['trigger', 'request']
senders: ['RAD']
receivers: ['EMF']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['EMF']

