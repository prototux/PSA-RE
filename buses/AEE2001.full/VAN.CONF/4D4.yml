        es: 'Código VIN no memorizado o no coincidente'
        de: 'VIN-Code nicht gespeichert oder nicht übereinstimmend'
        it: 'Codice VIN non memorizzato o non corrispondente'
        pl: 'Kod VIN niezapisany lub niezgodny'
        ru: 'Код VIN не сохранён или не совпадает'
        zh: 'VIN代码未存储或不匹配'
        hu: 'VIN-kód nincs eltárolva vagy nem egyezik'
        pt: 'Código VIN não memorizado ou não correspondente'
