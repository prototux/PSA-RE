id: 0x464
name: 'AIR_CONDITIONING_REQUESTS'
type: 'van'
length: 5
comment:
  en: 'Requests from the climate control unit to the body controller: load-shedding capability, A/C (compressor) request, recirculation, heated screens, luminosity measurements, electrical power drawn.'
  fr: 'Demandes de la climatisation vers la BSI : capacité de délestage, demande de compresseur clim, recyclage, vitres chauffantes, mesures de luminosité, puissance électrique consommée.'
  es: 'Solicitudes de la climatización a la BSI: capacidad de reducción de carga, solicitud de compresor de A/C, recirculación, lunas calefactadas, mediciones de luminosidad, potencia eléctrica consumida.'
  de: 'Anforderungen der Klimaanlage an den BSI: Lastabwurffähigkeit, Klimakompressoranforderung, Umluft, beheizte Scheiben, Helligkeitsmessungen, aufgenommene elektrische Leistung.'
  it: 'Richieste del climatizzatore alla BSI: capacità di riduzione carico, richiesta compressore A/C, ricircolo, vetri riscaldati, misure di luminosità, potenza elettrica assorbita.'
  pl: 'Żądania klimatyzacji do BSI: zdolność zrzutu obciążenia, żądanie sprężarki A/C, recyrkulacja, ogrzewane szyby, pomiary jasności, pobierana moc elektryczna.'
  ru: 'Запросы от климатической установки к BSI: возможность сброса нагрузки, запрос компрессора кондиционера, рециркуляция, обогреваемые стёкла, измерения освещённости, потребляемая электрическая мощность.'
  zh: '空调发往BSI的请求:减载能力、空调压缩机请求、内循环、加热玻璃、亮度测量、消耗的电功率。'
  hu: 'A klímaberendezés kérései a BSI felé: terheléscsökkentési képesség, klímakompresszor kérése, recirkuláció, fűthető üvegek, fényerő mérések, felvett elektromos teljesítmény.'
  pt: 'Pedidos da unidade de climatização para o computador de servidão: capacidade de corte de carga, pedido de ar condicionado (compressor), recirculação, vidros aquecidos, medições de luminosidade, potência elétrica consumida.'
periodicity: ['100ms', 'trigger']
senders: ['CLIM_AV']
receivers: ['BSI']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

