id: 0x554
name: 'RADIO'
type: 'van'
length: 22
comment:
  en: 'Family of frames sharing this ID: the content depends on RADIO_STATUS_ID'
  fr: 'Famille de trames partageant cet identifiant : le contenu dépend de RADIO_STATUS_ID'
  es: 'Familia de tramas que comparten este identificador: el contenido depende de RADIO_STATUS_ID'
  de: 'Familie von Botschaften mit dieser ID: der Inhalt hängt von RADIO_STATUS_ID ab'
  it: 'Famiglia di frame che condividono questo ID: il contenuto dipende da RADIO_STATUS_ID'
  pl: 'Rodzina ramek o tym samym identyfikatorze: zawartość zależy od RADIO_STATUS_ID'
  ru: 'Семейство кадров с этим идентификатором: содержимое зависит от RADIO_STATUS_ID'
  zh: '共用此ID的一组帧：内容取决于RADIO_STATUS_ID'
  hu: 'Ezt az azonosítót megosztó keretcsalád: a tartalom a(z) RADIO_STATUS_ID értékétől függ'
  pt: 'Família de tramas que partilham este identificador: o conteúdo depende de RADIO_STATUS_ID'
periodicity: ['trigger', 'request']
senders: ['RAD']
receivers: ['EMF']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['EMF']

signals:
  RADIO_STATUS_ID:
    bits: '2.7-2.0'
    comment:
      en: 'Identifies the status layout carried by the radio status frame (sub-addressing)'
      fr: 'Identification de la donnée de la trame ETAT_RADIO (sous-adressage)'
      es: 'Identifica el diseño de estado transportado por la trama de estado de la radio (subdireccionamiento)'
      de: 'Kennzeichnet das Statuslayout des Radio-Statusrahmens (Unteradressierung)'
      it: 'Identifica il layout di stato trasportato dalla trama di stato della radio (sotto-indirizzamento)'
      pl: 'Identyfikuje układ stanu przenoszony przez ramkę stanu radia (podadresowanie)'
      ru: 'Определяет формат состояния, передаваемый кадром состояния радио (субадресация)'
      zh: '标识收音机状态帧携带的状态布局(子寻址)'
      hu: 'Azonosítja a rádió állapotkeretében szereplő állapotelrendezést (alcímzés)'
      pt: 'Identifica o formato de estado transportado pela trama de estado do rádio (subendereçamento)'
    type: 'enum'
    default: 0x00
    mux_selector: true
    values:
      0xD1:
        en: 'Tuner status'
        fr: 'État du tuner'
        es: 'Estado del sintonizador'
        de: 'Tuner-Status'
        it: 'Stato del sintonizzatore'
