id: 0x644
name: 'MANUAL_EMERGENCY_CALL'
type: 'van'
length: 2
comment:
  en: 'Manual emergency call sequence in progress, sent by the telematic unit when an emergency call is triggered; the BSI then switches the hazard lights on until the hazard switch is pressed'
  fr: 'Séquence d''appel d''urgence manuel en cours, envoyée par le boîtier télématique lorsqu''un appel d''urgence est déclenché ; la BSI allume alors les feux de détresse jusqu''à l''appui sur le bouton de détresse'
  es: 'Secuencia de llamada de emergencia manual en curso, enviada por la unidad telemática al activarse una llamada de emergencia; la BSI enciende entonces las luces de emergencia hasta que se pulsa el interruptor de emergencia'
  de: 'Laufende manuelle Notrufsequenz, gesendet vom Telematiksteuergerät bei Auslösung eines Notrufs; das BSI schaltet daraufhin die Warnblinkanlage ein, bis der Warnblinkschalter gedrückt wird'
  it: 'Sequenza di chiamata di emergenza manuale in corso, inviata dall''unità telematica quando viene attivata una chiamata di emergenza; la BSI accende quindi le luci di emergenza fino alla pressione dell''interruttore delle quattro frecce'
  pl: 'Trwająca sekwencja ręcznego wezwania alarmowego, wysyłana przez jednostkę telematyczną po uruchomieniu wezwania alarmowego; BSI włącza wówczas światła awaryjne aż do naciśnięcia przełącznika świateł awaryjnych'
  ru: 'Выполняется последовательность ручного экстренного вызова, отправляемая телематическим блоком при активации экстренного вызова; BSI затем включает аварийную сигнализацию до нажатия кнопки аварийной сигнализации'
  zh: '手动紧急呼叫序列进行中,由远程信息处理单元在触发紧急呼叫时发送;随后BSI会点亮危险警示灯,直至按下危险警示灯开关'
  hu: 'Folyamatban lévő kézi vészhívás-szekvencia, amelyet a telematikai egység küld vészhívás kiváltásakor; ekkor a BSI bekapcsolja a vészvillogót, amíg meg nem nyomják a vészvillogó kapcsolóját'
  pt: 'Sequência de chamada de emergência manual em curso, enviada pela unidade telemática quando uma chamada de emergência é acionada; a BSI liga então os piscas de emergência até o interruptor de emergência ser pressionado.'
periodicity: ['trigger']
senders: ['BTEL']
receivers: ['BSI']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  MANUAL_EMERGENCY_CALL_ACTIVE:
    bits: '1.7'
    comment:
      en: 'Manual emergency call sequence in progress.'
      fr: 'Séquence d''appel d''urgence manuel en cours.'
      es: 'Secuencia de llamada de emergencia manual en curso.'
      de: 'Manuelle Notrufsequenz läuft.'
      it: 'Sequenza di chiamata di emergenza manuale in corso.'
      pl: 'Trwa sekwencja ręcznego wezwania alarmowego.'
      ru: 'Выполняется последовательность ручного экстренного вызова.'
      zh: '手动紧急呼叫序列进行中。'
      hu: 'Kézi segélyhívási szekvencia folyamatban.'
      pt: 'Sequência de chamada de emergência manual em curso'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No call in progress'
        fr: 'Pas d''appel en cours'
        es: 'Sin llamada en curso'
        de: 'Kein laufender Anruf'
        it: 'Nessuna chiamata in corso'
        pl: 'Brak trwającego połączenia'
        ru: 'Нет активного вызова'
        zh: '无进行中的通话'
        hu: 'Nincs folyamatban lévő hívás'
        pt: 'Sem chamada em curso'
      0x01:
        en: 'Call in progress'
        fr: 'Appel en cours'
        es: 'Llamada en curso'
        de: 'Anruf läuft'
        it: 'Chiamata in corso'
        pl: 'Trwa połączenie'
        ru: 'Идёт вызов'
        zh: '通话进行中'
        hu: 'Hívás folyamatban'
        pt: 'Chamada em curso'

  UNUSED_1:
    bits: '1.6-2.0'
    unused: true
