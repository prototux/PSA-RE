      ru: 'Значение счётчика вызовов, одна цифра ASCII на байт (единица задаётся CALL_COUNTER_UNIT; формат длительности ЧЧч ММм ССс, обнуляется по достижении максимума)'
      zh: '通话计数值，每字节一个 ASCII 数字（单位由 CALL_COUNTER_UNIT 决定；时长格式为 HH时MM分SS秒，达到上限后归零）'
      hu: 'A hívásszámláló értéke, bájtonként egy ASCII számjegy (az egységet a CALL_COUNTER_UNIT határozza meg; az időtartam formátuma óó:pp:mm, majd nullára ugrik vissza)'
      pt: 'Valor do contador de chamadas, um dígito ASCII por byte (unidade definida por CALL_COUNTER_UNIT; formato de duração HHh MMm SSs, volta a zero no final)'
    type: 'str'
    default: 0xFF
    mux:
      selector: 'STATUS_PART_ID'
      values: [0x01]

