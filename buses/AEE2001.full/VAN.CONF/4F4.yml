  CALL_COUNTER_DIGIT_1:
    bits: '4.7-4.0'
    comment:
      en: 'Call counter value, one ASCII digit per byte (counter unit set by CALL_COUNTER_UNIT; call duration format HHh MMm SSs, wraps to zero)'
      fr: 'Valeur du compteur de communication, un chiffre ASCII par octet (unité définie par CALL_COUNTER_UNIT ; format HHh MMm SSs, revient à zéro en fin de course).'
      es: 'Valor del contador de llamadas, un dígito ASCII por byte (unidad definida por CALL_COUNTER_UNIT; formato de duración HHh MMm SSs, vuelve a cero al final)'
      de: 'Wert des Anrufzählers, ein ASCII-Ziffer pro Byte (Einheit durch CALL_COUNTER_UNIT festgelegt; Format der Gesprächsdauer HHh MMm SSs, springt auf null zurück)'
      it: 'Valore del contatore di chiamate, una cifra ASCII per byte (unità definita da CALL_COUNTER_UNIT; formato durata HHh MMm SSs, torna a zero al termine)'
