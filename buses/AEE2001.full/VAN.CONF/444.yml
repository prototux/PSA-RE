id: 0x444
name: 'AIRBAG_DEPLOYMENT'
type: 'van'
length: 3
comment:
  en: 'Airbag pyrotechnic deployment information relayed by the BSI; event transmission on change of the crash information received from the airbag unit. Handled with priority by the BSI.'
  fr: 'Information sur le déclenchement des éléments pyrotechniques de l''airbag, relayée par la BSI ; envoi événementiel sur changement d''état de la trame reçue de l''airbag. Traitée en priorité par la BSI.'
  es: 'Información sobre el disparo de los elementos pirotécnicos del airbag, retransmitida por la BSI; envío por evento al cambiar el estado de la trama recibida del airbag. Tratada con prioridad por la BSI.'
  de: 'Information über die Auslösung der pyrotechnischen Airbag-Elemente, von der BSI weitergeleitet; ereignisgesteuerte Übertragung bei Zustandsänderung des vom Airbag-Steuergerät empfangenen Rahmens. Von der BSI vorrangig behandelt.'
  it: 'Informazioni sull''attivazione degli elementi pirotecnici dell''airbag, inoltrate dalla BSI; trasmissione a evento al cambio di stato della trama ricevuta dall''airbag. Gestita con priorità dalla BSI.'
  pl: 'Informacje o zadziałaniu elementów pirotechnicznych poduszki powietrznej, przekazywane przez BSI; wysyłanie zdarzeniowe przy zmianie stanu ramki otrzymanej od poduszki powietrznej. Obsługiwane priorytetowo przez BSI.'
  ru: 'Информация о срабатывании пиротехнических элементов подушки безопасности, ретранслируемая BSI; событийная передача при изменении состояния кадра, полученного от блока подушек безопасности. Обрабатывается BSI в приоритетном порядке.'
  zh: '由BSI转发的安全气囊烟火元件触发信息；在收到安全气囊单元帧状态变化时事件触发发送，由BSI优先处理。'
  hu: 'A légzsák pirotechnikai elemeinek kioldására vonatkozó információ, a BSI továbbítja; eseményalapú küldés a légzsákegységtől kapott keret állapotváltozásakor. A BSI kiemelt prioritással kezeli.'
  pt: 'Informação de disparo pirotécnico do airbag retransmitida pela BSI; transmissão por evento na mudança da informação de colisão recebida da unidade do airbag. Tratada com prioridade pela BSI.'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['BTEL']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  PASSENGER_AIRBAG_INHIBIT_STATUS:
    bits: '1.7'
    comment:
