      de: 'Tatsächlicher Deaktivierungszustand des Beifahrerairbags'
      it: 'Stato effettivo di inibizione dell''airbag passeggero'
      pl: 'Rzeczywisty stan wyłączenia poduszki pasażera'
      ru: 'Фактическое состояние отключения подушки безопасности пассажира'
      zh: '乘客安全气囊实际抑制状态'
      hu: 'Az utasoldali légzsák tényleges letiltási állapota'
      pt: 'Estado real de inibição do airbag do passageiro'
    type: 'bool'
