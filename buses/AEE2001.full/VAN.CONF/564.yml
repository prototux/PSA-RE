id: 0x564
name: 'MESSAGE_FOR_DISPLAY'
type: 'van'
length: 27
comment:
  en: 'Complementary display data from the BSI: bulb faults, body height, lamps commanded, cruise/unlock/load-shedding messages, doors/openings state, LPG range and trip computer data.'
  fr: 'Données complémentaires d''affichage de la BSI : défauts d''ampoules, hauteur de caisse, commande des lampes, messages régulateur/déverrouillage/délestage, état des ouvrants, autonomie GPL et données ordinateur de bord.'
  es: 'Datos complementarios de visualización de la BSI: fallos de bombillas, altura de carrocería, mando de lámparas, mensajes de regulador/desbloqueo/reducción de carga, estado de las puertas, autonomía GLP y datos del ordenador de a bordo.'
  de: 'Ergänzende Anzeigedaten des BSI: Lampenfehler, Karosseriehöhe, Lampenansteuerung, Tempomat-/Entriegelungs-/Lastabwurfmeldungen, Zustand der Öffnungen, Autogas-Reichweite und Bordcomputerdaten.'
  it: 'Dati di visualizzazione complementari della BSI: guasti lampadine, altezza scocca, comando lampade, messaggi regolatore/sblocco/riduzione carico, stato delle aperture, autonomia GPL e dati computer di bordo.'
  pl: 'Dodatkowe dane wyświetlacza z BSI: usterki żarówek, wysokość nadwozia, sterowanie lampami, komunikaty tempomatu/odblokowania/zrzutu obciążenia, stan otwarć, zasięg LPG i dane komputera pokładowego.'
  ru: 'Дополнительные данные дисплея от BSI: неисправности ламп, высота кузова, управление лампами, сообщения круиз-контроля/разблокировки/сброса нагрузки, состояние проёмов, запас хода на ГБО и данные бортового компьютера.'
  zh: 'BSI发出的补充显示数据:灯泡故障、车身高度、灯光命令、巡航/解锁/减载消息、门窗状态、液化气续航里程和行车电脑数据。'
  hu: 'A BSI kiegészítő kijelzési adatai: izzóhibák, karosszéria magasság, lámpavezérlés, tempomat/kioldás/terheléscsökkentés üzenetek, nyílászárók állapota, LPG hatótáv és fedélzeti számítógép adatai.'
  pt: 'Dados complementares de visualização da BSI: avarias de lâmpadas, altura da carroçaria, luzes comandadas, mensagens de regulador de velocidade/destrancagem/corte de carga, estado das portas/aberturas, autonomia de GPL e dados do computador de bordo.'
periodicity: ['trigger', 'request']
senders: ['BSI']
receivers: ['BTEL', 'EMF']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['BTEL']

