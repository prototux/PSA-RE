id: 0x9D4
name: 'TELEMATICS_REMOTE_CONTROL_STATUS'
type: 'van'
length: 5
comment:
  en: 'Buttons and scroll-wheel state of the telematics remote control unit, polled by the telematics unit (in-frame reply).'
  fr: 'État des boutons et de la molette de la commande déportée télématique, interrogé par le boîtier télématique (réponse dans la trame).'
  es: 'Estado de los botones y de la rueda de desplazamiento del mando a distancia telemático, consultado por la unidad telemática (respuesta en la trama).'
  de: 'Tasten- und Scrollrad-Status der telematischen Fernbedienung, von der Telematikeinheit abgefragt (Antwort im selben Rahmen).'
  it: 'Stato dei pulsanti e della rotella di scorrimento del telecomando telematico, interrogato dall''unità telematica (risposta nella trama).'
  pl: 'Stan przycisków i pokrętła zdalnego sterowania telematycznego, odpytywany przez jednostkę telematyczną (odpowiedź w tej samej ramce).'
  ru: 'Состояние кнопок и колеса прокрутки телематического пульта дистанционного управления, опрашиваемого телематическим блоком (ответ в том же кадре).'
  zh: '车载通信单元轮询的远程遥控器按钮及滚轮状态(同帧应答)。'
  hu: 'A telematikai távvezérlő gombjainak és görgőjének állapota, amelyet a telematikai egység kérdez le (válasz ugyanabban a keretben).'
  pt: 'Estado dos botões e da roda de deslocamento do comando à distância telemático, interrogado pela unidade telemática (resposta na trama).'
periodicity: ['50ms']
senders: ['CRT']
receivers: ['BTEL']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['BTEL']

signals:
  HEADER:
    bits: '1.7-1.0'
    comment:
      en: 'Start-of-frame marker byte of the in-frame reply (usage defined by the VAN network rules)'
      fr: 'Marqueur de début de trame'
      es: 'Byte marcador de inicio de trama de la respuesta en trama'
      de: 'Kennzeichnungsbyte für den Rahmenanfang der In-Frame-Antwort'
      it: 'Byte marcatore di inizio frame della risposta in-frame'
      pl: 'Bajt znacznika początku ramki odpowiedzi w ramce'
      ru: 'Байт-маркер начала кадра ответа в кадре'
      zh: '帧内应答起始标记字节'
      hu: 'Az üzeneten belüli válasz kezdő jelölőbájtja'
      pt: 'Byte marcador de início de trama da resposta em trama'
