  SCAN_WHEEL_OVERFLOW_UP:
    bits: '3.6'
    comment:
      en: 'Scan-wheel counter positive overflow, toggles each time the counter wraps from 255 to 128; cleared at network power-up and on entering local mode'
      fr: 'Débordement positif du compteur de la molette, change d''état à chaque passage de 255 à 128 ; remis à 0 à la mise sous tension du réseau et à l''entrée en mode local'
      es: 'Desbordamiento positivo del contador de la rueda, cambia de estado cada vez que pasa de 255 a 128; se reinicia al encender la red y al entrar en modo local'
      de: 'Positiver Überlauf des Radzählers, wechselt bei jedem Übergang von 255 auf 128; wird beim Einschalten des Netzwerks und beim Wechsel in den lokalen Modus zurückgesetzt'
      it: 'Overflow positivo del contatore della rotellina, cambia stato a ogni passaggio da 255 a 128; azzerato all''accensione della rete e all''ingresso in modalità locale'
      pl: 'Dodatnie przepełnienie licznika pokrętła, zmienia stan przy każdym przejściu z 255 na 128; zerowany przy załączeniu sieci i wejściu w tryb lokalny'
      ru: 'Положительное переполнение счётчика колёсика, меняет состояние при каждом переходе с 255 на 128; сбрасывается при включении сети и переходе в локальный режим'
      zh: '滚轮计数器正向溢出,每次计数从255跳变到128时状态翻转;网络上电及进入本地模式时清零'
      hu: 'A görgőszámláló pozitív túlcsordulása, állapotot vált minden 255-ről 128-ra váltáskor; a hálózat bekapcsolásakor és helyi módba lépéskor törlődik'
      pt: 'Estouro positivo do contador do botão rotativo, muda de estado sempre que o contador passa de 255 para 128; reposto a 0 ao ligar a rede e ao entrar em modo local'
    type: 'bool'
    default: 0x00
    values:
      0x01:
        en: 'Positive counter overflow'
        fr: 'Débordement positif du compteur'
        es: 'Desbordamiento positivo del contador'
        de: 'Positiver Zählerüberlauf'
        it: 'Overflow positivo del contatore'
        pl: 'Dodatnie przepełnienie licznika'
        ru: 'Положительное переполнение счётчика'
        zh: '计数器正向溢出'
        hu: 'Pozitív számlálótúlcsordulás'
        pt: 'Estouro positivo do contador'

  SCAN_WHEEL_OVERFLOW_DOWN:
    bits: '3.5'
    comment:
      en: 'Scan-wheel counter negative overflow, toggles each time the counter wraps from 0 to 128'
      fr: 'Débordement négatif du compteur de la molette, change d''état à chaque passage de 0 à 128'
      es: 'Desbordamiento negativo del contador de la rueda, cambia de estado cada vez que pasa de 0 a 128'
      de: 'Negativer Überlauf des Radzählers, wechselt bei jedem Übergang von 0 auf 128'
      it: 'Overflow negativo del contatore della rotellina, cambia stato a ogni passaggio da 0 a 128'
      pl: 'Ujemne przepełnienie licznika pokrętła, zmienia stan przy każdym przejściu z 0 na 128'
      ru: 'Отрицательное переполнение счётчика колёсика, меняет состояние при каждом переходе с 0 на 128'
      zh: '滚轮计数器负向溢出,每次计数从0跳变到128时状态翻转'
      hu: 'A görgőszámláló negatív túlcsordulása, állapotot vált minden 0-ról 128-ra váltáskor'
      pt: 'Estouro negativo do contador do botão rotativo, muda de estado sempre que o contador passa de 0 para 128'
    type: 'bool'
    default: 0x00
    values:
      0x01:
        en: 'Counter negative overflow'
        fr: 'Débordement négatif du compteur'
        es: 'Desbordamiento negativo del contador'
        de: 'Negativer Zählerüberlauf'
        it: 'Overflow negativo del contatore'
        pl: 'Ujemne przepełnienie licznika'
        ru: 'Отрицательное переполнение счётчика'
        zh: '计数器负向溢出'
        hu: 'Számláló negatív túlcsordulása'
        pt: 'Saturação negativa do contador'

