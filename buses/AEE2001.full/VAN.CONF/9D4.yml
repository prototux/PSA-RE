  SCAN_WHEEL_COUNTER:
    bits: '4.7-4.0'
    comment:
      en: 'Scroll-wheel step counter (0-255); reset to 0x80 at network power-up and on entering local mode, then incremented/decremented by wheel steps'
      fr: 'Compteur de pas de la molette (0-255) ; réinitialisé à 0x80 à la mise sous tension du réseau et à l''entrée en mode local, puis incrémenté/décrémenté par pas de molette'
      es: 'Contador de pasos de la rueda (0-255); reiniciado a 0x80 al encender la red y al entrar en modo local, luego incrementado/decrementado por pasos de la rueda'
      de: 'Schrittzähler des Scrollrads (0-255); wird beim Einschalten des Netzwerks und beim Wechsel in den lokalen Modus auf 0x80 zurückgesetzt, danach je nach Raddrehung erhöht/verringert'
      it: 'Contatore dei passi della rotellina (0-255); reimpostato a 0x80 all''accensione della rete e all''ingresso in modalità locale, poi incrementato/decrementato in base ai passi della rotellina'
      pl: 'Licznik kroków pokrętła (0-255); resetowany do 0x80 przy załączeniu sieci i wejściu w tryb lokalny, następnie zwiększany/zmniejszany wraz z krokami pokrętła'
      ru: 'Счётчик шагов колёсика прокрутки (0-255); сбрасывается на 0x80 при включении сети и переходе в локальный режим, затем увеличивается/уменьшается по шагам колёсика'
      zh: '滚轮步进计数器(0-255);网络上电及进入本地模式时复位为0x80,随后随滚轮转动递增/递减'
      hu: 'Görgő lépésszámláló (0-255); a hálózat bekapcsolásakor és helyi módba lépéskor 0x80-ra áll vissza, majd a görgő elforgatásával nő/csökken'
      pt: 'Contador de passos da roda (0-255); reiniciado para 0x80 ao ligar a rede e ao entrar em modo local, depois incrementado/decrementado por passos da roda'
    type: 'uint'
    min: 0
    max: 255
    default: 0x80

  FOOTER:
