  PARKING_AID_ACTIVE:
    bits: '2.0'
    comment:
      en: 'Parking aid system active (physically operating); the display may use it to switch on or mute the radio, though the radio itself does not use this bit'
      fr: 'Système d''aide au stationnement actif (en fonctionnement physique) ; l''écran peut l''utiliser pour allumer ou couper le son de la radio, mais la radio elle-même n''utilise pas ce bit'
      es: 'Sistema de ayuda al aparcamiento activo (funcionando físicamente); la pantalla puede usarlo para encender o silenciar la radio, aunque la propia radio no usa este bit'
      de: 'Einparkhilfe aktiv (physisch in Betrieb); das Display kann dies nutzen, um das Radio einzuschalten oder stummzuschalten, das Radio selbst verwendet dieses Bit jedoch nicht'
      it: 'Sistema di assistenza al parcheggio attivo (fisicamente in funzione); il display può usarlo per accendere o silenziare la radio, anche se la radio stessa non usa questo bit'
      pl: 'System wspomagania parkowania aktywny (fizycznie działający); wyświetlacz może go użyć do włączenia lub wyciszenia radia, choć samo radio nie korzysta z tego bitu'
      ru: 'Система парковочной помощи активна (физически работает); дисплей может использовать это для включения или отключения звука радио, хотя само радио этот бит не использует'
      zh: '泊车辅助系统激活(物理运行中);显示屏可利用该位打开或静音收音机,但收音机本身不使用该位'
      hu: 'A parkolássegítő rendszer aktív (fizikailag működik); a kijelző ezzel kapcsolhatja be vagy némíthatja el a rádiót, de maga a rádió nem használja ezt a bitet'
      pt: 'Sistema de ajuda ao estacionamento ativo (a funcionar fisicamente); o ecrã pode usá-lo para ligar ou silenciar o rádio, embora o próprio rádio não use este bit'
    type: 'bool'
