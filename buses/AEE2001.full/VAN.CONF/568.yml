id: 0x568
name: 'PARKING_AID_STATUS'
type: 'van'
length: 12
comment:
  en: 'Parking assistance status read by the display with in-frame reply: beep request/pattern, obstacle side, inhibition, and direct distance to obstacle for each of the 8 sensors (4 rear, 4 front).'
  fr: 'État de l''aide au stationnement, lu par l''afficheur avec réponse dans la trame : demande/motif de bip, côté de l''obstacle, inhibition, et distance directe à l''obstacle pour chacun des 8 capteurs (4 arrière, 4 avant).'
  es: 'Estado de la ayuda al aparcamiento, leído por la pantalla con respuesta en la trama: solicitud/patrón de pitido, lado del obstáculo, inhibición, y distancia directa al obstáculo para cada uno de los 8 sensores (4 traseros, 4 delanteros).'
  de: 'Status der Einparkhilfe, vom Display mit Antwort im Rahmen (In-Frame-Response) gelesen: Signaltonanforderung/-muster, Hindernisseite, Deaktivierung und direkter Abstand zum Hindernis für jeden der 8 Sensoren (4 hinten, 4 vorne).'
  it: 'Stato dell''assistenza al parcheggio, letto dal display con risposta nella trama: richiesta/schema del segnale acustico, lato dell''ostacolo, inibizione e distanza diretta dall''ostacolo per ciascuno degli 8 sensori (4 posteriori, 4 anteriori).'
  pl: 'Stan czujników parkowania, odczytywany przez wyświetlacz z odpowiedzią w ramce: żądanie/wzór sygnału dźwiękowego, strona przeszkody, wyłączenie oraz bezpośrednia odległość do przeszkody dla każdego z 8 czujników (4 tylne, 4 przednie).'
  ru: 'Статус парковочного ассистента, считываемый дисплеем с ответом в кадре: запрос/шаблон звукового сигнала, сторона препятствия, отключение и прямое расстояние до препятствия для каждого из 8 датчиков (4 задних, 4 передних).'
  zh: '由显示屏读取的泊车辅助状态(帧内应答):蜂鸣请求/模式、障碍物方向、抑制功能,以及8个传感器(4个后置、4个前置)各自到障碍物的直线距离。'
  hu: 'A kijelző által keretválasszal olvasott parkolássegítő állapota: hangjelzés kérés/mintázat, az akadály oldala, letiltás, és a 8 érzékelő (4 hátsó, 4 első) mindegyikének közvetlen távolsága az akadálytól.'
  pt: 'Estado da ajuda ao estacionamento lido pelo visor com resposta na trama: pedido/padrão de sinal sonoro, lado do obstáculo, inibição, e distância direta ao obstáculo para cada um dos 8 sensores (4 traseiros, 4 dianteiros).'
periodicity: ['trigger', 'request']
senders: ['AAS']
receivers: ['EMF']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['EMF']

signals:
  HEADER:
    bits: '1.7-1.0'
    comment:
      en: 'Start-of-frame marker byte of the in-frame reply (usage defined by the VAN network rules)'
      fr: 'Marqueur de début de trame'
      es: 'Byte marcador de inicio de trama de la respuesta en trama'
      de: 'Kennzeichnungsbyte für den Rahmenanfang der In-Frame-Antwort'
      it: 'Byte marcatore di inizio frame della risposta in-frame'
      pl: 'Bajt znacznika początku ramki odpowiedzi w ramce'
      ru: 'Байт-маркер начала кадра ответа в кадре'
      zh: '帧内应答起始标记字节'
      hu: 'Az üzeneten belüli válasz kezdő jelölőbájtja'
      pt: 'Byte marcador de início de trama da resposta em trama'
    type: 'uint'

  ACTIVATION_BEEP:
    bits: '2.7'
    comment:
      en: 'Switch-on beep request: set when the ACTIVE bit goes from 0 to 1, cleared once the display acknowledges this frame, and stays 0 while active remains 1'
      fr: 'Demande de bip de mise en service : activée quand le bit ACTIF passe de 0 à 1, désactivée dès l''acquittement de cette trame par l''écran, et reste à 0 tant que le bit actif vaut 1'
      es: 'Solicitud de pitido de puesta en marcha: se activa cuando el bit ACTIVO pasa de 0 a 1, se desactiva en cuanto la pantalla confirma esta trama, y permanece a 0 mientras el bit activo valga 1'
      de: 'Anforderung des Einschaltpiepstons: wird gesetzt, wenn das AKTIV-Bit von 0 auf 1 wechselt, gelöscht sobald das Display diesen Rahmen bestätigt, und bleibt 0, solange das Aktiv-Bit 1 ist'
      it: 'Richiesta di beep di accensione: impostata quando il bit ATTIVO passa da 0 a 1, azzerata non appena il display conferma questo frame, e resta a 0 finché il bit attivo vale 1'
      pl: 'Żądanie sygnału dźwiękowego włączenia: ustawiane, gdy bit AKTYWNY zmienia się z 0 na 1, kasowane po potwierdzeniu tej ramki przez wyświetlacz, pozostaje 0, dopóki bit aktywności wynosi 1'
      ru: 'Запрос звукового сигнала включения: устанавливается при переходе бита АКТИВНО из 0 в 1, сбрасывается после подтверждения этого кадра дисплеем и остаётся 0, пока бит активности равен 1'
      zh: '开机提示音请求:当ACTIVE位由0变为1时置位,显示屏确认该帧后清零,ACTIVE位保持为1期间保持为0'
      hu: 'Bekapcsolási hangjelzés kérése: az AKTÍV bit 0-ról 1-re váltásakor áll be, a kijelző e keret nyugtázásakor törlődik, és 0 marad, amíg az aktív bit 1'
      pt: 'Pedido de sinal sonoro de entrada em serviço: ativado quando o bit ATIVO passa de 0 para 1, desativado assim que o ecrã confirma esta trama, e permanece a 0 enquanto o bit ativo valer 1'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No beep'
        fr: 'Pas de bip'
        es: 'Sin pitido'
        de: 'Kein Piepton'
        it: 'Nessun bip'
        pl: 'Brak sygnału dźwiękowego'
        ru: 'Нет звукового сигнала'
        zh: '无提示音'
        hu: 'Nincs hangjelzés'
        pt: 'Sem sinal sonoro'
      0x01:
        en: 'Beep requested'
        fr: 'Bip demandé'
        es: 'Pitido solicitado'
        de: 'Piepton angefordert'
        it: 'Bip richiesto'
        pl: 'Żądany sygnał dźwiękowy'
        ru: 'Запрошен звуковой сигнал'
        zh: '请求提示音'
        hu: 'Hangjelzés kérve'
        pt: 'Sinal sonoro solicitado'

