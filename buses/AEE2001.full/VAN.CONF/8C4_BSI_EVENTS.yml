id: 0x8C4
name: 'BSI_EVENTS'
alt_names: ['EVENEMENT_BSI']
type: 'van'
length: 2
comment:
  en: 'EMF BSI requests'
  fr: 'DEMANDES EMF BSI'
  es: 'SOLICITUDES EMF BSI'
  de: 'EMF-BSI-ANFORDERUNGEN'
  it: 'RICHIESTE EMF BSI'
  pl: 'ŻĄDANIA EMF BSI'
  ru: 'ЗАПРОСЫ EMF BSI'
  zh: 'EMF BSI请求'
  hu: 'EMF BSI KÉRÉSEK'
  pt: 'PEDIDOS EMF BSI'
observations:
  en: 'The BSI sends this frame to the EMF/RT3 which on reception will transmit a read message according to the event type. For example on the trip button push event the EMF sends an 0x564 message to read the current status of the trip data. Or when a radio button pressed the EMF sends a 0x4D4 to read the status of the radio'
  fr: 'La BSI envoie cette trame à l''EMF/RT3 qui, à la réception, transmet un message de lecture selon le type d''événement. Par exemple, lors de l''appui sur le bouton trajet, l''EMF envoie un message 0x564 pour lire l''état actuel des données de trajet. Ou lors d''un appui sur un bouton radio, l''EMF envoie un 0x4D4 pour lire l''état de la radio'
  es: 'La BSI envía esta trama al EMF/RT3, que al recibirla transmite un mensaje de lectura según el tipo de evento. Por ejemplo, al pulsar el botón de trayecto, el EMF envía un mensaje 0x564 para leer el estado actual de los datos de trayecto. O al pulsar un botón de radio, el EMF envía un 0x4D4 para leer el estado de la radio'
  de: 'Das BSI sendet diesen Rahmen an das EMF/RT3, das beim Empfang je nach Ereignistyp eine Lesenachricht sendet. Beispielsweise sendet das EMF beim Drücken der Fahrtentaste eine 0x564-Nachricht, um den aktuellen Status der Fahrtdaten zu lesen. Oder beim Drücken einer Radiotaste sendet das EMF eine 0x4D4-Nachricht, um den Radiostatus zu lesen'
  it: 'La BSI invia questo frame all''EMF/RT3 che, alla ricezione, trasmette un messaggio di lettura in base al tipo di evento. Ad esempio, alla pressione del pulsante viaggio, l''EMF invia un messaggio 0x564 per leggere lo stato attuale dei dati di viaggio. Oppure alla pressione di un pulsante radio, l''EMF invia uno 0x4D4 per leggere lo stato della radio'
  pl: 'BSI wysyła tę ramkę do EMF/RT3, który po odebraniu przesyła komunikat odczytu zależnie od typu zdarzenia. Na przykład po naciśnięciu przycisku trasy EMF wysyła komunikat 0x564, aby odczytać bieżący stan danych trasy. Albo po naciśnięciu przycisku radia EMF wysyła 0x4D4, aby odczytać stan radia'
  ru: 'BSI отправляет этот кадр в EMF/RT3, который при получении передаёт сообщение чтения в зависимости от типа события. Например, при нажатии кнопки маршрута EMF отправляет сообщение 0x564 для чтения текущего состояния данных маршрута. Или при нажатии кнопки радио EMF отправляет 0x4D4 для чтения состояния радио'
  zh: 'BSI将此帧发送给EMF/RT3，后者接收后根据事件类型发送读取消息。例如，按下行程按钮时，EMF发送0x564消息以读取当前行程数据状态；按下收音机按钮时，EMF发送0x4D4以读取收音机状态'
  hu: 'A BSI elküldi ezt a keretet az EMF/RT3-nak, amely vételkor az eseménytípusnak megfelelő olvasási üzenetet küld. Például az útgomb megnyomásakor az EMF egy 0x564 üzenetet küld az útadatok aktuális állapotának olvasásához. Vagy egy rádiógomb megnyomásakor az EMF egy 0x4D4 üzenetet küld a rádió állapotának olvasásához'
  pt: 'O BSI envia esta trama ao EMF/RT3 que, ao recebê-la, transmite uma mensagem de leitura consoante o tipo de evento. Por exemplo, ao premir o botão de trajeto, o EMF envia uma mensagem 0x564 para ler o estado atual dos dados de trajeto. Ou ao premir um botão de rádio, o EMF envia um 0x4D4 para ler o estado do rádio'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['EMF', 'BTEL']
van:
  access: 'write'
  ack: true

