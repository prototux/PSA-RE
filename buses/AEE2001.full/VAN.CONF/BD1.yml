      0x05:
        en: 'Forced on RXD1'
        fr: 'Forcé sur RXD1'
        es: 'Forzado en RXD1'
        de: 'Erzwungen auf RXD1'
        it: 'Forzato su RXD1'
        pl: 'Wymuszone na RXD1'
        ru: 'Принудительно на RXD1'
        zh: '强制于RXD1'
        hu: 'Kényszerítve RXD1-re'
        pt: 'Forçado em RXD1'
      0x06:
        en: 'Forced on RXD2'
        fr: 'Forcé sur RXD2'
        es: 'Forzado en RXD2'
        de: 'Erzwungen auf RXD2'
        it: 'Forzato su RXD2'
        pl: 'Wymuszone na RXD2'
        ru: 'Принудительно на RXD2'
        zh: '强制在RXD2上'
        hu: 'RXD2-re kényszerítve'
        pt: 'Forçado em RXD2'
      0x07:
        en: 'Forced on RXD0 = RXD1 = RXD2'
        fr: 'Forcé sur RXD0 = RXD1 = RXD2'
        es: 'Forzado en RXD0 = RXD1 = RXD2'
        de: 'Erzwungen auf RXD0 = RXD1 = RXD2'
