id: 0xBD1
name: 'AC_IO16_CONFIGURATION_2'
type: 'van'
length: 1
comment:
  en: 'Configuration byte sent by the BSI to the climate-control I/O16 extension module.'
  fr: 'Octet de configuration envoyé par la BSI au module d''extension climatisation I/O16.'
  es: 'Byte de configuración enviado por la BSI al módulo de extensión de climatización I/O16.'
  de: 'Konfigurationsbyte, das der BSI an das Klima-Erweiterungsmodul I/O16 sendet.'
  it: 'Byte di configurazione inviato dalla BSI al modulo di estensione climatizzazione I/O16.'
  pl: 'Bajt konfiguracji wysyłany przez BSI do modułu rozszerzenia klimatyzacji I/O16.'
  ru: 'Байт конфигурации, отправляемый BSI на модуль расширения климат-контроля I/O16.'
  zh: 'BSI发送给空调I/O16扩展模块的配置字节。'
  hu: 'A BSI által a klíma I/O16 bővítőmodulnak küldött konfigurációs bájt.'
  pt: 'Byte de configuração enviado pela BSI ao módulo de extensão I/O16 da climatização.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['CLIM_AV']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  RESOURCE_BUSY:
    bits: '1.7'
    comment:
      en: 'Resource busy/free state'
      fr: 'État de la ressource, occupée ou libre'
      es: 'Estado del recurso, ocupado o libre'
      de: 'Ressourcenstatus, belegt oder frei'
      it: 'Stato della risorsa, occupata o libera'
      pl: 'Stan zasobu, zajęty lub wolny'
      ru: 'Состояние ресурса, занят или свободен'
      zh: '资源占用/空闲状态'
      hu: 'Erőforrás foglalt/szabad állapota'
      pt: 'Estado do recurso, ocupado ou livre'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Resource free'
        fr: 'Ressource libre'
        es: 'Recurso libre'
        de: 'Ressource frei'
        it: 'Risorsa libera'
        pl: 'Zasób wolny'
        ru: 'Ресурс свободен'
        zh: '资源空闲'
        hu: 'Erőforrás szabad'
        pt: 'Recurso livre'
      0x01:
        en: 'Resource busy'
        fr: 'Ressource occupée'
        es: 'Recurso ocupado'
        de: 'Ressource belegt'
        it: 'Risorsa occupata'
        pl: 'Zasób zajęty'
        ru: 'Ресурс занят'
        zh: '资源占用'
        hu: 'Erőforrás foglalt'
        pt: 'Recurso ocupado'

  USER_MODULE_NUMBER:
    bits: '1.6-1.4'
    comment:
      en: 'User module number'
      fr: 'Numéro du module utilisateur'
      es: 'Número del módulo de usuario'
      de: 'Benutzermodulnummer'
      it: 'Numero del modulo utente'
      pl: 'Numer modułu użytkownika'
      ru: 'Номер пользовательского модуля'
      zh: '用户模块编号'
      hu: 'Felhasználói modul száma'
      pt: 'Número do módulo de utilizador'
    type: 'uint'
    default: 0x00

  ACTIVE_MONITORING_INHIBIT:
    bits: '1.3'
    comment:
      en: 'Active supervision enable/inhibit'
      fr: 'Autorisation ou inhibition de la surveillance active'
      es: 'Habilitación o inhibición de la supervisión activa'
      de: 'Freigabe oder Sperrung der aktiven Überwachung'
      it: 'Abilitazione o inibizione della supervisione attiva'
      pl: 'Zezwolenie lub zablokowanie nadzoru aktywnego'
      ru: 'Разрешение или блокировка активного контроля'
      zh: '主动监控使能/禁止'
      hu: 'Aktív felügyelet engedélyezése vagy tiltása'
      pt: 'Ativação ou inibição da supervisão ativa'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Monitoring active'
        fr: 'Surveillance active'
        es: 'Vigilancia activa'
        de: 'Überwachung aktiv'
        it: 'Monitoraggio attivo'
        pl: 'Nadzór aktywny'
        ru: 'Мониторинг активен'
        zh: '监控激活'
        hu: 'Felügyelet aktív'
        pt: 'Vigilância ativa'
      0x01:
        en: 'Monitoring inhibited'
        fr: 'Surveillance inhibée'
        es: 'Supervisión inhibida'
        de: 'Überwachung gesperrt'
        it: 'Monitoraggio inibito'
        pl: 'Nadzór zablokowany'
        ru: 'Мониторинг заблокирован'
        zh: '监控被禁用'
        hu: 'A felügyelet letiltva'
        pt: 'Supervisão inibida'

  VAN_INPUT_MODE:
    bits: '1.2-1.0'
    comment:
      en: 'VAN input line selection and usage mode'
      fr: 'Sélection de la voie d''entrée VAN et de son mode d''utilisation'
      es: 'Selección de la vía de entrada VAN y su modo de uso'
      de: 'Auswahl der VAN-Eingangsleitung und ihres Nutzungsmodus'
      it: 'Selezione della linea di ingresso VAN e della sua modalità d''uso'
      pl: 'Wybór linii wejściowej VAN i jej trybu użytkowania'
      ru: 'Выбор входной линии VAN и режима её использования'
      zh: 'VAN输入线路选择及使用模式'
      hu: 'VAN bemeneti vonal kiválasztása és használati módja'
      pt: 'Seleção da via de entrada VAN e do seu modo de utilização'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'Automatic, init = RXD0'
        fr: 'Automatique, initialisation = RXD0'
        es: 'Automático, inicialización = RXD0'
        de: 'Automatisch, Initialisierung = RXD0'
        it: 'Automatico, inizializzazione = RXD0'
        pl: 'Automatyczne, inicjalizacja = RXD0'
        ru: 'Автоматически, инициализация = RXD0'
        zh: '自动,初始化=RXD0'
        hu: 'Automatikus, inicializálás = RXD0'
        pt: 'Automático, inicialização = RXD0'
      0x01:
        en: 'Automatic, init on RXD1'
        fr: 'Automatique, initialisation sur RXD1'
        es: 'Automático, inicialización en RXD1'
        de: 'Automatisch, Initialisierung auf RXD1'
        it: 'Automatico, inizializzazione su RXD1'
        pl: 'Automatyczny, inicjalizacja na RXD1'
        ru: 'Автоматически, инициализация на RXD1'
        zh: '自动,RXD1初始化'
        hu: 'Automatikus, inicializálás RXD1-en'
        pt: 'Automático, inicialização em RXD1'
      0x02:
        en: 'Automatic, init on RXD2'
        fr: 'Automatique, initialisation sur RXD2'
        es: 'Automático, inicialización en RXD2'
        de: 'Automatisch, Initialisierung auf RXD2'
        it: 'Automatico, inizializzazione su RXD2'
        pl: 'Automatyczne, inicjalizacja na RXD2'
        ru: 'Автоматически, инициализация на RXD2'
        zh: '自动,在RXD2上初始化'
        hu: 'Automatikus, inicializálás RXD2-n'
        pt: 'Automático, inicialização em RXD2'
      0x03:
        en: 'Transparent mode'
        fr: 'Mode transparent'
        es: 'Modo transparente'
        de: 'Transparenter Modus'
        it: 'Modalità trasparente'
        pl: 'Tryb przezroczysty'
        ru: 'Прозрачный режим'
        zh: '透明模式'
        hu: 'Átlátszó üzemmód'
        pt: 'Modo transparente'
      0x04:
