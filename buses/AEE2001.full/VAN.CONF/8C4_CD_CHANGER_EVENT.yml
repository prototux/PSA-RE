id: 0x8C4
name: 'CD_CHANGER_EVENT'
type: 'van'
length: 2
comment:
  en: 'CD changer event notification, sent each time an internal CD changer parameter changes. Sub-message selected by EVENT_SOURCE = 0x16 (bits 1.4-1.0).'
  fr: 'Notification d''événement du changeur CD, émise à chaque changement d''un paramètre interne du changeur. Sous-message sélectionné par EVENT_SOURCE = 0x16 (bits 1.4-1.0).'
  es: 'Notificación de evento del cambiador de CD, enviada cada vez que cambia un parámetro interno del cambiador. Submensaje seleccionado por EVENT_SOURCE = 0x16 (bits 1.4-1.0).'
  de: 'Ereignisbenachrichtigung des CD-Wechslers, gesendet bei jeder Änderung eines internen CD-Wechsler-Parameters. Untermeldung ausgewählt durch EVENT_SOURCE = 0x16 (Bits 1.4-1.0).'
  it: 'Notifica di evento del caricatore CD, inviata ogni volta che cambia un parametro interno del caricatore. Sottomessaggio selezionato da EVENT_SOURCE = 0x16 (bit 1.4-1.0).'
  pl: 'Powiadomienie o zdarzeniu zmieniarki CD, wysyłane przy każdej zmianie wewnętrznego parametru zmieniarki. Podwiadomość wybierana przez EVENT_SOURCE = 0x16 (bity 1.4-1.0).'
  ru: 'Уведомление о событии CD-чейнджера, отправляемое при каждом изменении внутреннего параметра чейнджера. Подсообщение выбирается EVENT_SOURCE = 0x16 (биты 1.4-1.0).'
  zh: 'CD换碟机事件通知,每当换碟机内部参数变化时发送。子消息由SRC_EVENT = 0x16(位1.4-1.0)选择。'
  hu: 'CD-váltó eseményértesítés, amely a váltó belső paraméterének minden változásakor elküldésre kerül. Az alüzenetet az EVENT_SOURCE = 0x16 (1.4-1.0 bitek) választja ki.'
  pt: 'Notificação de evento do leitor de CD, enviada sempre que um parâmetro interno do leitor de CD muda. Submensagem selecionada por EVENT_SOURCE = 0x16 (bits 1.4-1.0).'
periodicity: ['trigger']
senders: ['CDC', 'AAS']
receivers: ['BTEL', 'EMF']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

