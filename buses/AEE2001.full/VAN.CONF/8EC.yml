    type: 'bcd'
    default: 0x01
    mux:
      selector: 'CDC_COMMAND_ID'
      values: [0x41]
    values:
      0x00:
        unused: true
      0xFE:
        en: 'Previous disc'
        fr: 'Disque précédent'
        es: 'Disco anterior'
        de: 'Vorheriger Datenträger'
        it: 'Disco precedente'
        pl: 'Poprzednia płyta'
        ru: 'Предыдущий диск'
        zh: '上一张碟片'
        hu: 'Előző lemez'
        pt: 'Disco anterior'
      0xFF:
