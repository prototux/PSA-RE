id: 0x8EC
name: 'CD_CHANGER_COMMAND'
type: 'van'
length: 3
comment:
  en: 'Family of frames sharing this ID: the content depends on CDC_COMMAND_ID'
  fr: 'Famille de trames partageant cet identifiant : le contenu dépend de CDC_COMMAND_ID'
  es: 'Familia de tramas que comparten este identificador: el contenido depende de CDC_COMMAND_ID'
  de: 'Familie von Botschaften mit dieser ID: der Inhalt hängt von CDC_COMMAND_ID ab'
  it: 'Famiglia di frame che condividono questo ID: il contenuto dipende da CDC_COMMAND_ID'
  pl: 'Rodzina ramek o tym samym identyfikatorze: zawartość zależy od CDC_COMMAND_ID'
  ru: 'Семейство кадров с этим идентификатором: содержимое зависит от CDC_COMMAND_ID'
  zh: '共用此ID的一组帧：内容取决于CDC_COMMAND_ID'
  hu: 'Ezt az azonosítót megosztó keretcsalád: a tartalom a(z) CDC_COMMAND_ID értékétől függ'
  pt: 'Família de tramas que partilham este identificador: o conteúdo depende de CDC_COMMAND_ID'
periodicity: ['trigger']
senders: ['BTEL', 'EMF']
receivers: ['CDC']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  CDC_COMMAND_ID:
    bits: '1.7-1.0'
    comment:
      en: 'CD changer command identifier (sub-address)'
      fr: 'Identifiant de commande du chargeur CD (sous-adresse)'
      es: 'Identificador de comando del cambiador de CD (subdirección)'
      de: 'Befehlskennung des CD-Wechslers (Unteradresse)'
      it: 'Identificatore di comando del cambia CD (sotto-indirizzo)'
      pl: 'Identyfikator polecenia zmieniarki CD (podadres)'
      ru: 'Идентификатор команды CD-чейнджера (субадрес)'
      zh: 'CD换碟机指令标识符(子地址)'
      hu: 'A CD-váltó parancsazonosítója (alcím)'
      pt: 'Identificador do comando do carregador de CD (subendereço)'
    type: 'enum'
    default: 0x00
    mux_selector: true
    values:
      0x00:
        unused: true
      0x11:
        en: 'Command (play/stop)'
        fr: 'CDE'
        es: 'COMANDO'
        de: 'BEFEHL'
        it: 'COMANDO'
        pl: 'POLECENIE'
        ru: 'КОМАНДА'
        zh: '命令'
        hu: 'PARANCS'
        pt: 'Comando (reproduzir/parar)'
      0x21:
