        fr: 'Mode de lecture'
        es: 'Modo de reproducción'
        de: 'Wiedergabemodus'
        it: 'Modalità di riproduzione'
        pl: 'Tryb odtwarzania'
        ru: 'Режим воспроизведения'
        zh: '播放模式'
        hu: 'Lejátszási mód'
        pt: 'Modo de reprodução'
      0x31:
        en: 'Track selection'
        fr: 'Sélection de plage'
        es: 'Selección de pista'
        de: 'Titelauswahl'
        it: 'Selezione traccia'
        pl: 'Wybór ścieżki'
        ru: 'Выбор дорожки'
        zh: '曲目选择'
        hu: 'Szám kiválasztása'
        pt: 'Seleção de faixa'
      0x41:
        en: 'Disc selection'
        fr: 'Sélection de disque'
        es: 'Selección de disco'
        de: 'Disc-Auswahl'
        it: 'Selezione disco'
        pl: 'Wybór płyty'
        ru: 'Выбор диска'
        zh: '光盘选择'
        hu: 'Lemezválasztás'
        pt: 'Seleção de disco'

  CD_CHANGER_DISC_REQUEST:
    bits: '2.7-2.0'
    comment:
      en: 'Disc number to play (BCD coded 1..16); previous/next disc special codes'
      fr: 'Numéro de disque à écouter (codé BCD 1 à 16) ; codes spéciaux disque précédent/suivant'
      es: 'Número de disco a reproducir (codificado BCD 1 a 16); códigos especiales disco anterior/siguiente'
      de: 'Abzuspielende Disc-Nummer (BCD-codiert 1..16); Sondercodes für vorherige/nächste Disc'
      it: 'Numero del disco da riprodurre (codificato BCD 1..16); codici speciali disco precedente/successivo'
      pl: 'Numer płyty do odtworzenia (kod BCD 1..16); specjalne kody poprzedniej/następnej płyty'
      ru: 'Номер диска для воспроизведения (BCD-код 1..16); специальные коды предыдущего/следующего диска'
      zh: '要播放的碟片编号(BCD编码1..16);上一张/下一张碟片的特殊代码'
