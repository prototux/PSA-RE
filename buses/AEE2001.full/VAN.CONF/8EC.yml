        fr: 'Disque suivant'
        es: 'Disco siguiente'
        de: 'Nächste Disc'
        it: 'Disco successivo'
        pl: 'Następna płyta'
        ru: 'Следующий диск'
        zh: '下一张碟片'
        hu: 'Következő lemez'
        pt: 'Disco seguinte'

  UNUSED_1:
    bits: '2.7-2.4'
