id: 0xBDB
name: 'CLIMATE_IO_MODULE_STATUS'
type: 'van'
length: 2
comment:
  en: 'Input states of the climate I/O module (switch positions of the climate control panel: blower speed, heated rear window, temperature mix, A/C, recirculation, defrost). Also used by the body controller to supervise the module.'
  fr: 'États d''entrée du module I/O climatisation (positions des commandes du panneau de climatisation : vitesse de pulseur, lunette chauffante, mélange de température, climatisation, recyclage, désembuage). Utilisée aussi par la BSI pour superviser le module.'
  es: 'Estados de entrada del módulo I/O de climatización (posiciones de los mandos del panel de climatización: velocidad de ventilador, luneta térmica, mezcla de temperatura, A/C, recirculación, desempañado). Usada también por la BSI para supervisar el módulo.'
  de: 'Eingangszustände des Klima-I/O-Moduls (Schalterstellungen des Klimabedienfelds: Gebläsedrehzahl, Heckscheibenheizung, Temperaturmischung, Klimaanlage, Umluft, Entfrosten). Wird auch von der BSI zur Modulüberwachung genutzt.'
  it: 'Stati di ingresso del modulo I/O climatizzazione (posizioni dei comandi del pannello climatizzatore: velocità ventola, lunotto termico, miscelazione temperatura, A/C, ricircolo, sbrinamento). Usata anche dalla BSI per supervisionare il modulo.'
  pl: 'Stany wejściowe modułu I/O klimatyzacji (pozycje przełączników panelu klimatyzacji: prędkość dmuchawy, ogrzewana szyba tylna, mieszanie temperatury, A/C, recyrkulacja, odszranianie). Używana także przez BSI do nadzoru modułu.'
  ru: 'Входные состояния модуля ввода-вывода климат-контроля (положения переключателей панели климат-контроля: скорость вентилятора, обогрев заднего стекла, смешение температуры, кондиционер, рециркуляция, обдув). Также используется BSI для контроля модуля.'
  zh: '空调I/O模块输入状态(空调面板开关位置:风扇速度、后窗加热、温度混合、空调、内循环、除雾)。也被车身控制器用于监控该模块。'
  hu: 'A klíma I/O modul bemeneti állapotai (a klímapanel kapcsolóállásai: ventilátorsebesség, hátsó ablakfűtés, hőmérséklet-keverés, klíma, recirkuláció, párátlanítás). A BSI is használja a modul felügyeletére.'
  pt: 'Estados de entrada do módulo de E/S da climatização (posições dos comutadores do painel de climatização: velocidade do ventilador, vidro traseiro aquecido, mistura de temperatura, ar condicionado, recirculação, desembaciamento). Também utilizado pelo computador de servidão para supervisionar o módulo.'
periodicity: ['50ms']
senders: ['CLIM_AV']
receivers: ['BSI']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['BSI']

