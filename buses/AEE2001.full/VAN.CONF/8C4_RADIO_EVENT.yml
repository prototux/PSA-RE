id: 0x8C4
name: 'RADIO_EVENT'
alt_names: ['RADIO_KEYBOARD_EVENTS']
type: 'van'
length: 3
comment:
  en: 'Radio event notification to the display: tells it which status frame to read next (no keypad data).'
  fr: 'Notification d''événement radio à destination de l''écran : indique la trame d''état à lire ensuite (sans donnée clavier).'
  es: 'Notificación de evento de la radio a la pantalla: indica qué trama de estado leer a continuación (sin datos de teclado).'
  de: 'Ereignisbenachrichtigung des Radios an das Display: gibt an, welcher Statusrahmen als Nächstes zu lesen ist (ohne Tastaturdaten).'
  it: 'Notifica di evento radio verso il display: indica quale trama di stato leggere successivamente (senza dati tastiera).'
  pl: 'Powiadomienie o zdarzeniu radia do wyświetlacza: wskazuje, którą ramkę stanu odczytać dalej (bez danych klawiatury).'
  ru: 'Уведомление о событии радио для дисплея: указывает, какой кадр состояния читать далее (без данных клавиатуры).'
  zh: '收音机向显示屏发送的事件通知:告知接下来要读取哪个状态帧(不含按键数据)。'
  hu: 'Rádióesemény-értesítés a kijelző felé: megadja, melyik állapotkeretet kell ezután beolvasni (billentyűadat nélkül).'
  pt: 'Notificação de evento da rádio para o visor: indica qual a trama de estado a ler a seguir (sem dados do teclado).'
periodicity: ['trigger']
senders: ['RAD']
receivers: ['EMF']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

