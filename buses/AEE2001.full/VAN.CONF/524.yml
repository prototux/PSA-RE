id: 0x524
name: 'DISPLAY_DATA'
type: 'van'
length: 16
comment:
  en: 'Body controller broadcast of alerts, faults, signalling messages and modes to be displayed by the screen / cluster.'
  fr: 'Diffusion par la BSI des alertes, défauts, messages de signalisation et modes à afficher sur l''écran / combiné.'
  es: 'Difusión por la BSI de alertas, fallos, mensajes de señalización y modos a mostrar en la pantalla / cuadro de instrumentos.'
  de: 'Von der BSI gesendete Alarme, Fehler, Signalisierungsmeldungen und Modi zur Anzeige auf Bildschirm / Kombiinstrument.'
  it: 'Trasmissione da parte della BSI di allarmi, guasti, messaggi di segnalazione e modalità da visualizzare su schermo / quadro strumenti.'
  pl: 'Rozgłaszane przez BSI alerty, usterki, komunikaty sygnalizacyjne i tryby do wyświetlenia na ekranie / zestawie wskaźników.'
  ru: 'Рассылаемые BSI предупреждения, неисправности, сигнальные сообщения и режимы для отображения на экране / панели приборов.'
  zh: '由车身控制器广播的警报、故障、信号消息和模式，供屏幕/仪表组显示。'
  hu: 'A BSI által sugárzott riasztások, hibák, jelzőüzenetek és módok, amelyeket a kijelzőn / műszerfalon kell megjeleníteni.'
  pt: 'Difusão pelo computador de servidão de alertas, avarias, mensagens de sinalização e modos a apresentar no ecrã / quadrante.'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['EMF', 'CMB', 'BCD', 'BTEL']
van:
  access: 'write'
  ack: false
  rtr: false
  reply: 'none'

signals:
  COOLANT_TEMPERATURE_ALERT_STATUS:
    bits: '1.7'
