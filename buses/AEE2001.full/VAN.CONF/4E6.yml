id: 0x4E6
name: 'TRIP_COMPUTER_UNIT_STATUS'
type: 'van'
length: 4
comment:
  en: 'Keypad and settings state of the optional trip-computer keypad/display unit, polled by the instrument cluster.'
  fr: 'État du clavier et des réglages du boîtier optionnel ordinateur de bord/écran, interrogé par le combiné.'
  es: 'Estado del teclado y de los ajustes de la unidad opcional de teclado/pantalla del ordenador de a bordo, consultada por el cuadro de instrumentos.'
  de: 'Tastatur- und Einstellungsstatus der optionalen Bordcomputer-Tastatur-/Anzeigeeinheit, vom Kombiinstrument abgefragt.'
  it: 'Stato della tastiera e delle impostazioni dell''unità opzionale tastiera/display del computer di bordo, interrogata dal quadro strumenti.'
  pl: 'Stan klawiatury i ustawień opcjonalnej jednostki klawiatury/wyświetlacza komputera pokładowego, odpytywanej przez zestaw wskaźników.'
  ru: 'Состояние клавиатуры и настроек опционального блока клавиатуры/дисплея бортового компьютера, опрашиваемого комбинацией приборов.'
  zh: '可选行车电脑按键/显示单元的按键及设置状态,由仪表组轮询。'
  hu: 'Az opcionális fedélzeti számítógép billentyűzet/kijelző egységének billentyű- és beállításállapota, amelyet a műszeregység lekérdez.'
  pt: 'Estado do teclado e das definições da unidade opcional de teclado/ecrã do computador de bordo, interrogada pelo quadrante.'
periodicity: ['50ms']
senders: ['BCD']
receivers: ['CMB']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['CMB']

signals:
  HEADER:
    bits: '1.7-1.0'
    comment:
      en: 'Start-of-frame marker byte of the in-frame reply (usage defined by the VAN network rules)'
      fr: 'Marqueur de début de trame'
      es: 'Byte marcador de inicio de trama de la respuesta en trama'
      de: 'Kennzeichnungsbyte für den Rahmenanfang der In-Frame-Antwort'
      it: 'Byte marcatore di inizio frame della risposta in-frame'
      pl: 'Bajt znacznika początku ramki odpowiedzi w ramce'
      ru: 'Байт-маркер начала кадра ответа в кадре'
      zh: '帧内应答起始标记字节'
      hu: 'Az üzeneten belüli válasz kezdő jelölőbájtja'
      pt: 'Byte marcador de início de trama da resposta em trama'
    type: 'uint'

  UNUSED_1:
