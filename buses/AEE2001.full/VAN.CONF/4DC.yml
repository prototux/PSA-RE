      en: 'Retractable roof open: used to ignore the cabin temperature sensor, which would otherwise be disturbed by the airflow'
      fr: 'Toit escamotable ouvert : utilisé pour ignorer le capteur de température habitacle, qui serait sinon perturbé par le flux d''air'
      es: 'Techo retráctil abierto: se utiliza para ignorar el sensor de temperatura del habitáculo, que de otro modo se vería perturbado por el flujo de aire'
