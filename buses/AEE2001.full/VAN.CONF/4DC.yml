id: 0x4DC
name: 'AC_INFORMATION'
type: 'van'
length: 7
comment:
  en: 'Information and authorisations from the body computer to the air conditioning unit: authorisation, compressor state, load shedding, auxiliary heaters, refrigerant pressure, evaporator temperature and sunshine sensors.'
  fr: 'Informations et autorisations du BSI vers la climatisation : autorisation, état compresseur, délestage, chauffages additionnels, pression réfrigérant, température évaporateur et capteurs d''ensoleillement.'
  es: 'Información y autorizaciones de la BSI al climatizador: autorización, estado del compresor, deslastre, calefacciones auxiliares, presión del refrigerante, temperatura del evaporador y sensores de sol.'
  de: 'Informationen und Freigaben vom BSI an die Klimaanlage: Freigabe, Kompressorstatus, Lastabwurf, Zuheizer, Kältemitteldruck, Verdampfertemperatur und Sonnensensoren.'
  it: 'Informazioni e autorizzazioni dal BSI al climatizzatore: autorizzazione, stato compressore, distacco carico, riscaldatori ausiliari, pressione refrigerante, temperatura evaporatore e sensori di soleggiamento.'
  pl: 'Informacje i zezwolenia z BSI do klimatyzacji: zezwolenie, stan sprężarki, redukcja obciążenia, nagrzewnice dodatkowe, ciśnienie czynnika, temperatura parownika i czujniki nasłonecznienia.'
  ru: 'Информация и разрешения от BSI кондиционеру: разрешение, состояние компрессора, сброс нагрузки, дополнительные обогреватели, давление хладагента, температура испарителя и датчики солнца.'
  zh: '由车身控制器发送给空调单元的信息与授权:授权、压缩机状态、负载脱扣、辅助加热器、制冷剂压力、蒸发器温度及日照传感器。'
  hu: 'A BSI által a klímának küldött információk és engedélyek: engedély, kompresszor állapota, terheléscsökkentés, kiegészítő fűtések, hűtőközeg-nyomás, párologtató hőmérséklete és napsugárzás-érzékelők.'
  pt: 'Informações e autorizações da BSI para o climatizador: autorização, estado do compressor, corte de carga, aquecedores auxiliares, pressão do refrigerante, temperatura do evaporador e sensores de luminosidade.'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['CLIM_AV']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

