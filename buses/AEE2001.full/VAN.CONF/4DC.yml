  HEATING_STATUS:
    bits: '2.7-2.5'
    comment:
      en: 'Additional (electric) heater state; also informs the climate unit to start the blower when the burner runs, and lets the body controller disable the volumetric alarm for a programmable burner'
      fr: 'État du chauffage additionnel (électrique) ; informe également la climatisation pour démarrer le pulseur lorsque le brûleur fonctionne, et permet à la BSI de désactiver l''alarme volumétrique pour un brûleur programmable'
      es: 'Estado de la calefacción adicional (eléctrica); también informa a la climatización para arrancar el ventilador cuando funciona el quemador, y permite a la BSI desactivar la alarma volumétrica en caso de quemador programable'
      de: 'Status der elektrischen Zusatzheizung; informiert auch die Klimaanlage, das Gebläse beim Brennerbetrieb zu starten, und ermöglicht dem BSI, den volumetrischen Alarm bei einem programmierbaren Brenner zu deaktivieren'
      it: 'Stato del riscaldatore ausiliario (elettrico); informa anche il climatizzatore di avviare il ventilatore quando il bruciatore è in funzione, e consente alla BSI di disattivare l''allarme volumetrico per un bruciatore programmabile'
      pl: 'Stan dodatkowego ogrzewania (elektrycznego); informuje również klimatyzację o uruchomieniu dmuchawy podczas pracy palnika oraz umożliwia BSI wyłączenie alarmu wolumetrycznego dla programowalnego palnika'
      ru: 'Состояние дополнительного (электрического) отопителя; также информирует климат-контроль о запуске вентилятора при работе горелки и позволяет BSI отключать объёмную сигнализацию для программируемой горелки'
      zh: '辅助(电加热)状态;还会通知空调系统在燃烧器运行时启动鼓风机,并允许BSI在可编程燃烧器情况下禁用空间报警'
      hu: 'A kiegészítő (elektromos) fűtés állapota; a klímaegységet is tájékoztatja az égő működésekor a fűtőventilátor indításáról, és lehetővé teszi a BSI számára a térfogati riasztás letiltását programozható égő esetén'
      pt: 'Estado do aquecimento adicional (elétrico); também informa a climatização para arrancar o ventilador quando o queimador funciona, e permite à BSI desativar o alarme volumétrico no caso de um queimador programável'
