id: 0x744
name: 'VEHICLE_POSITION'
type: 'van'
length: 12
comment:
  en: 'Rear wheel speeds, rear wheel pulse counters and steering wheel angle/rate, gatewayed by the BSI from the inter-system CAN network, used by the telematic unit for dead-reckoning navigation.'
  fr: 'Vitesses roues arrière, compteurs d''impulsions roues arrière et angle/vitesse de volant, relayés par la BSI depuis le réseau CAN Intersystème, utilisés par le boîtier télématique pour la navigation à l''estime.'
  es: 'Velocidades de las ruedas traseras, contadores de pulsos de las ruedas traseras y ángulo/velocidad del volante, retransmitidos por la BSI desde la red CAN Intersistema, utilizados por la unidad telemática para la navegación por estima.'
  de: 'Hinterradgeschwindigkeiten, Hinterrad-Impulszähler und Lenkradwinkel/-rate, vom BSI aus dem Intersystem-CAN-Netzwerk weitergeleitet, vom Telematikgerät für die Koppelnavigation genutzt.'
  it: 'Velocità delle ruote posteriori, contatori di impulsi delle ruote posteriori e angolo/velocità del volante, inoltrati dalla BSI dalla rete CAN Intersistema, utilizzati dall''unità telematica per la navigazione stimata.'
  pl: 'Prędkości kół tylnych, liczniki impulsów kół tylnych oraz kąt/prędkość kierownicy, przekazywane przez BSI z sieci CAN Intersystem, wykorzystywane przez jednostkę telematyczną do nawigacji zliczeniowej.'
  ru: 'Скорости задних колёс, счётчики импульсов задних колёс и угол/скорость поворота руля, передаваемые BSI из сети CAN Intersystem, используемые телематическим блоком для навигации счислением пути.'
  zh: '后轮速度、后轮脉冲计数器和方向盘转角/转速,由BSI从系统间CAN网络转发,供车载通信单元用于航位推算导航。'
  hu: 'Hátsó kerék sebességek, hátsó kerék impulzusszámlálók és kormánykerék szög/sebesség, a BSI által az Intersystem CAN hálózatról továbbítva, a telematikai egység holtszámítási navigációhoz használja.'
  pt: 'Velocidades das rodas traseiras, contadores de impulsos das rodas traseiras e ângulo/velocidade do volante, encaminhados pela BSI a partir da rede CAN intersistema, utilizados pela unidade telemática para navegação por estima.'
periodicity: ['50ms']
senders: ['BSI']
receivers: ['BTEL']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  REAR_RIGHT_WHEEL_SPEED:
    bits: '1.7-2.0'
    comment:
      en: 'Rear right wheel speed'
      fr: 'Vitesse de la roue arrière droite'
      es: 'Velocidad de la rueda trasera derecha'
      de: 'Geschwindigkeit des hinteren rechten Rads'
      it: 'Velocità della ruota posteriore destra'
      pl: 'Prędkość tylnego prawego koła'
      ru: 'Скорость заднего правого колеса'
      zh: '右后轮速度'
      hu: 'Hátsó jobb kerék sebessége'
      pt: 'Velocidade da roda traseira direita'
    type: 'uint'
    factor: 0.01
    min: 0
    max: 655.34
    units: 'km/h'
    invalid: 0xFFFF
    default: 0xFFFF

  REAR_LEFT_WHEEL_SPEED:
    bits: '3.7-4.0'
    comment:
      en: 'Rear left wheel speed'
      fr: 'Vitesse de la roue arrière gauche'
      es: 'Velocidad de la rueda trasera izquierda'
      de: 'Geschwindigkeit des hinteren linken Rads'
      it: 'Velocità della ruota posteriore sinistra'
      pl: 'Prędkość tylnego lewego koła'
      ru: 'Скорость заднего левого колеса'
      zh: '左后轮速度'
      hu: 'Hátsó bal kerék sebessége'
      pt: 'Velocidade da roda traseira esquerda'
    type: 'uint'
    factor: 0.01
    min: 0
    max: 655.34
    units: 'km/h'
    invalid: 0xFFFF
    default: 0xFFFF

  REAR_RIGHT_ABS_ERROR_STATUS:
    bits: '5.7'
    comment:
      en: 'Rear right ABS wheel pulse sensor error; on error this bit and the following 15 counter bits are all set to 1'
      fr: 'Erreur du capteur de tops ABS de la roue arrière droite ; en cas d''erreur, ce bit et les 15 bits de compteur suivants sont tous mis à 1'
      es: 'Error del sensor de pulsos ABS de la rueda trasera derecha; en caso de error, este bit y los 15 bits de contador siguientes se ponen a 1'
      de: 'Fehler des ABS-Impulssensors am hinteren rechten Rad; bei Fehler werden dieses Bit und die folgenden 15 Zählerbits auf 1 gesetzt'
      it: 'Errore del sensore di impulsi ABS della ruota posteriore destra; in caso di errore, questo bit e i 15 bit di contatore seguenti sono impostati a 1'
      pl: 'Błąd czujnika impulsów ABS tylnego prawego koła; w przypadku błędu ten bit i kolejnych 15 bitów licznika są ustawiane na 1'
      ru: 'Ошибка датчика импульсов ABS заднего правого колеса; при ошибке этот бит и следующие 15 бит счётчика устанавливаются в 1'
      zh: '右后 ABS 轮速脉冲传感器错误;出错时该位及随后 15 个计数位全部置 1'
      hu: 'Hátsó jobb ABS keréksebesség-érzékelő hibája; hiba esetén ez a bit és a következő 15 számlálóbit mind 1-re áll'
      pt: 'Erro do sensor de impulsos ABS da roda traseira direita; em caso de erro, este bit e os 15 bits de contador seguintes ficam todos a 1'
    type: 'bool'
    default: 0x01
    values:
      0x00:
        en: 'No error'
        fr: 'Pas d''erreur'
        es: 'Sin error'
        de: 'Kein Fehler'
        it: 'Nessun errore'
        pl: 'Brak błędu'
        ru: 'Нет ошибки'
        zh: '无错误'
        hu: 'Nincs hiba'
        pt: 'Sem erro'
      0x01:
        en: 'Error'
        fr: 'Erreur'
        es: 'Error'
        de: 'Fehler'
        it: 'Errore'
        pl: 'Błąd'
        ru: 'Ошибка'
        zh: '错误'
        hu: 'Hiba'
        pt: 'Erro'

  REAR_RIGHT_WHEEL_COUNTER:
    bits: '5.6-6.0'
    comment:
      en: 'Rear right wheel pulse counter, free-running (1 pulse per bit), not reset while ignition is on except on overflow'
      fr: 'Compteur de tops de la roue arrière droite, libre (1 top par bit), non remis à zéro tant que le contact est mis (hors dépassement)'
      es: 'Contador de pulsos de la rueda trasera derecha, libre (1 pulso por bit), no se reinicia mientras el contacto está puesto (salvo desbordamiento)'
      de: 'Impulszähler des hinteren rechten Rads, freilaufend (1 Impuls pro Bit), kein Reset bei eingeschalteter Zündung außer bei Überlauf'
      it: 'Contatore di impulsi della ruota posteriore destra, libero (1 impulso per bit), non azzerato con contatto inserito salvo overflow'
      pl: 'Licznik impulsów tylnego prawego koła, swobodny (1 impuls na bit), nieresetowany przy włączonym zapłonie poza przepełnieniem'
      ru: 'Счётчик импульсов заднего правого колеса, свободный (1 импульс на бит), не сбрасывается при включённом зажигании, кроме переполнения'
      zh: '右后轮脉冲计数器,自由计数(每位 1 个脉冲),点火开启期间不复位(溢出除外)'
      hu: 'Hátsó jobb kerék impulzusszámlálója, szabadon futó (1 impulzus/bit), gyújtás bekapcsolva nem nullázódik, kivéve túlcsordulásnál'
      pt: 'Contador de impulsos da roda traseira direita, livre (1 impulso por bit), não reiniciado enquanto o contacto estiver ligado (exceto em transbordo)'
    type: 'uint'
    min: 0
    max: 32767
    default: 0x7FFF

