id: 0x55C
name: 'AIR_CONDITIONING_STATUS'
type: 'van'
length: 8
comment:
  en: 'Climate control display status words (auto modes, active heaters, temperature set-points, air distribution, blower speed) for the multifunction display.'
  fr: 'Mots d''état d''affichage de la climatisation (modes auto, chauffages actifs, consignes de température, distribution d''air, vitesse de pulseur) pour l''affichage multifonction.'
  es: 'Palabras de estado de visualización de la climatización (modos automáticos, calefactores activos, consignas de temperatura, distribución de aire, velocidad de ventilador) para la pantalla multifunción.'
  de: 'Statuswörter der Klimaanzeige (Automatikmodi, aktive Heizungen, Temperatursollwerte, Luftverteilung, Gebläsedrehzahl) für das Multifunktionsdisplay.'
  it: 'Parole di stato di visualizzazione del climatizzatore (modalità automatiche, riscaldatori attivi, setpoint di temperatura, distribuzione dell''aria, velocità ventola) per il display multifunzione.'
  pl: 'Słowa stanu wyświetlania klimatyzacji (tryby automatyczne, aktywne grzałki, zadane temperatury, dystrybucja powietrza, prędkość dmuchawy) dla wyświetlacza wielofunkcyjnego.'
  ru: 'Слова состояния дисплея климат-контроля (автоматические режимы, активные нагреватели, заданные температуры, распределение воздуха, скорость вентилятора) для многофункционального дисплея.'
  zh: '多功能显示屏的空调显示状态字(自动模式、活动加热器、温度设定值、气流分配、风扇速度)。'
  hu: 'A klímavezérlés kijelzési állapotszavai (automata módok, aktív fűtések, hőmérséklet-alapértékek, légelosztás, ventilátorsebesség) a többfunkciós kijelzőhöz.'
  pt: 'Palavras de estado de apresentação da climatização (modos automáticos, aquecedores ativos, pontos de ajuste de temperatura, distribuição de ar, velocidade do ventilador) para o visor multifunções.'
periodicity: ['trigger']
senders: ['CLIM_AV']
receivers: ['EMF']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['EMF']

signals:
  HEADER:
    bits: '1.7-1.0'
    comment:
      en: 'Start-of-frame marker byte of the in-frame reply (usage defined by the VAN network rules)'
