      en: 'Request to keep the comfort VAN network power supply on'
      fr: 'Demande de maintien de l''alimentation du réseau VAN confort'
      es: 'Solicitud de mantenimiento de la alimentación de la red VAN confort'
      de: 'Anforderung zur Aufrechterhaltung der Versorgung des Komfort-VAN-Netzwerks'
      it: 'Richiesta di mantenimento dell''alimentazione della rete VAN comfort'
      pl: 'Żądanie utrzymania zasilania sieci VAN komfortu'
      ru: 'Запрос на поддержание питания комфортной сети VAN'
      zh: '请求保持舒适性VAN网络供电'
