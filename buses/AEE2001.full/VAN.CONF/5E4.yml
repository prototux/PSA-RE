  ELECTRICAL_POWER_BUDGET:
    bits: '2.7-2.0'
    alt_names: ['OVERSPEED_ALERT_VALUE', 'SEUIL_SURVIT']
    comment:
      en: 'Electric power consumed by comfort network devices (excluding instrument cluster and air conditioning)'
      fr: 'Puissance électrique consommée par les équipements du réseau confort (hors combiné et climatisation)'
      es: 'Potencia eléctrica consumida por los equipos de la red confort (excluyendo el cuadro de instrumentos y el aire acondicionado)'
      de: 'Elektrische Leistungsaufnahme der Komfortnetz-Geräte (ohne Kombiinstrument und Klimaanlage)'
      it: 'Potenza elettrica assorbita dai dispositivi della rete comfort (esclusi quadro strumenti e climatizzatore)'
      pl: 'Moc elektryczna pobierana przez urządzenia sieci komfortu (z wyłączeniem zestawu wskaźników i klimatyzacji)'
      ru: 'Электрическая мощность, потребляемая устройствами комфортной сети (без приборной панели и кондиционера)'
      zh: '舒适性网络设备消耗的电功率(不含仪表组和空调)'
      hu: 'A komfort hálózat eszközeinek elektromos teljesítményfelvétele (a műszerfal és a klíma kivételével)'
      pt: 'Potência elétrica consumida pelos equipamentos da rede de conforto (exceto quadro de instrumentos e ar condicionado)'
    type: 'uint'
