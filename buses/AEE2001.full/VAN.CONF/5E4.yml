id: 0x5E4
name: 'EMF_BSI_REQUESTS'
type: 'van'
length: 2
comment:
  en: 'Requests from the display/telematic unit to the BSI: trip computer resets, keep network awake, overspeed alert, and electrical power budget.'
  fr: 'Demandes de l''écran/boîtier télématique vers la BSI : remises à zéro de l''ordinateur de bord, maintien du réseau éveillé, alerte de survitesse, et bilan de puissance électrique.'
  es: 'Solicitudes de la pantalla/unidad telemática a la BSI: reinicios del ordenador de a bordo, mantenimiento de la red despierta, alerta de exceso de velocidad, y balance de potencia eléctrica.'
  de: 'Anforderungen von Display/Telematikgerät an den BSI: Rücksetzen des Bordcomputers, Netzwerk wachhalten, Übergeschwindigkeitswarnung, und elektrische Leistungsbilanz.'
  it: 'Richieste dal display/unità telematica alla BSI: reset del computer di bordo, mantenimento della rete sveglia, allarme di sovravelocità, e bilancio di potenza elettrica.'
  pl: 'Żądania z ekranu/jednostki telematycznej do BSI: resety komputera pokładowego, utrzymanie sieci w stanie czuwania, alarm przekroczenia prędkości, i bilans mocy elektrycznej.'
  ru: 'Запросы от дисплея/телематического блока к BSI: сброс бортового компьютера, поддержание сети в активном состоянии, предупреждение о превышении скорости, и баланс электрической мощности.'
  zh: '显示屏/车载通信单元发往BSI的请求:行车电脑复位、保持网络唤醒、超速警报,以及电功率预算。'
  hu: 'A kijelző/telematikai egység kérései a BSI felé: fedélzeti számítógép visszaállítások, hálózat ébren tartása, túlsebesség-riasztás, és elektromos teljesítménymérleg.'
  pt: 'Pedidos do visor/unidade telemática para a BSI: reposições do computador de bordo, manter a rede ativa, alerta de excesso de velocidade e orçamento de potência elétrica.'
periodicity: ['500ms', 'trigger']
senders: ['BTEL', 'EMF']
receivers: ['BSI']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  RESET_TRIP_COMPUTER_TOTAL:
    bits: '1.7'
    comment:
      en: 'Reset request for the trip computer total accumulators'
      fr: 'Demande de réinitialisation des cumuls totaux de l''ordinateur de bord'
      es: 'Solicitud de reinicio de los totales acumulados del ordenador de a bordo'
      de: 'Anforderung zum Zurücksetzen der Gesamtsummen des Bordcomputers'
      it: 'Richiesta di azzeramento dei totali cumulativi del computer di bordo'
      pl: 'Żądanie zresetowania sum całkowitych komputera pokładowego'
      ru: 'Запрос сброса общих накопленных итогов бортового компьютера'
      zh: '请求重置行车电脑的总累计数据'
      hu: 'A fedélzeti számítógép összesített adatainak visszaállítási kérése'
      pt: 'Pedido de reinicialização dos totais acumulados do computador de bordo'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
        en: 'Requested'
        fr: 'Demandé'
        es: 'Solicitado'
        de: 'Angefordert'
        it: 'Richiesto'
        pl: 'Żądane'
        ru: 'Запрошено'
        zh: '已请求'
        hu: 'Kérve'
        pt: 'Pedido'

  RESET_TRIP_COMPUTER_CUMULATIVE:
