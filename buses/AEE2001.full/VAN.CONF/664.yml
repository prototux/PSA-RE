id: 0x664
name: 'ODOMETER_STATUS'
type: 'van'
length: 11
comment:
  en: 'Instrument cluster status to the body controller: hard-wired inputs acquired by the cluster (warnings, push-buttons, brake, fuel flap), fuel levels, lamp states, icon display, oil temperature, LPG state.'
  fr: 'État fonctionnel du combiné vers le boîtier de servitude : entrées filaires acquises par le combiné (alertes, boutons poussoirs, frein, trappe à carburant), niveaux de carburant, état des voyants, affichage d''icônes, température huile, état GPL.'
  es: 'Estado del cuadro de instrumentos hacia la centralita de carrocería: entradas cableadas adquiridas por el cuadro (alertas, pulsadores, freno, trampilla de combustible), niveles de combustible, estado de testigos, visualización de iconos, temperatura de aceite, estado GLP.'
  de: 'Status des Kombiinstruments zur Karosseriesteuerung: fest verdrahtete Eingänge des Kombiinstruments (Warnungen, Taster, Bremse, Tankklappe), Kraftstoffstände, Kontrollleuchtenstatus, Symbolanzeige, Öltemperatur, LPG-Status.'
  it: 'Stato del quadro strumenti verso la centralina carrozzeria: ingressi cablati acquisiti dal quadro (allarmi, pulsanti, freno, sportello carburante), livelli carburante, stato spie, visualizzazione icone, temperatura olio, stato GPL.'
  pl: 'Stan zestawu wskaźników przekazywany do sterownika nadwozia: wejścia przewodowe zbierane przez zestaw wskaźników (alerty, przyciski, hamulec, klapka wlewu paliwa), poziomy paliwa, stan kontrolek, wyświetlanie ikon, temperatura oleju, stan LPG.'
  ru: 'Статус приборной панели для блока управления кузовом: проводные входы, считываемые приборной панелью (предупреждения, кнопки, тормоз, лючок бака), уровни топлива, состояние индикаторов, отображение значков, температура масла, состояние ГБО.'
  zh: '仪表组传给车身控制器的状态:仪表组采集的硬线输入(警告、按钮、刹车、油箱盖)、燃油液位、指示灯状态、图标显示、机油温度、液化石油气状态。'
  hu: 'A műszeregység állapota a karosszéria-vezérlő felé: a műszeregység által fogadott vezetékes bemenetek (figyelmeztetések, nyomógombok, fék, üzemanyagtöltő fedél), üzemanyagszintek, jelzőlámpa-állapotok, ikonkijelzés, olajhőmérséklet, LPG-állapot.'
  pt: 'Estado do quadrante de instrumentos para o computador de servidão: entradas com fios diretos adquiridas pelo quadrante (avisos, botões, travão, tampa do depósito), níveis de combustível, estados das luzes, apresentação de ícones, temperatura do óleo, estado do GPL.'
periodicity: ['200ms', 'trigger']
senders: ['CMB']
receivers: ['BSI']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

