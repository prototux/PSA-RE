      fr: 'Compteur de pas de la molette SCAN (0 à 255), réinitialisé à 0x80 à la mise sous tension'
      es: 'Contador de pasos de la rueda SCAN (0 a 255), reiniciado a 0x80 al encender'
      de: 'Schrittzähler des SCAN-Rädchens (0 bis 255), bei Einschalten auf 0x80 zurückgesetzt'
      it: 'Contatore dei passi della manopola SCAN (da 0 a 255), reimpostato a 0x80 all''accensione'
      pl: 'Licznik kroków pokrętła SCAN (0-255), resetowany do 0x80 przy włączeniu zasilania'
      ru: 'Счётчик шагов колеса SCAN (0-255), сбрасывается на 0x80 при включении питания'
      zh: 'SCAN旋钮步进计数器(0–255),上电时复位为0x80'
      hu: 'A SCAN forgatógomb lépésszámlálója (0-255), bekapcsoláskor 0x80 értékre áll vissza'
      pt: 'Contador de passos da roda SCAN (0 a 255), reiniciado para 0x80 ao ligar'
