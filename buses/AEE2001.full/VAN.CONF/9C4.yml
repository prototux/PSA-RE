      it: 'Overflow negativo del contatore della manopola SCAN (commuta a ogni passaggio da 0 a 128)'
      pl: 'Ujemne przepełnienie licznika pokrętła SCAN (przełącza się przy każdym przejściu z 0 na 128)'
      ru: 'Отрицательное переполнение счётчика колеса SCAN (переключается при каждом переходе с 0 на 128)'
      zh: 'SCAN旋钮计数器负向溢出(每次从0跳变到128时切换)'
      hu: 'A SCAN forgatógomb számlálójának negatív túlcsordulása (0-ról 128-ra váltáskor billen)'
      pt: 'Estouro negativo do contador do botão SCAN (comuta a cada passagem de 0 para 128)'
