      hu: 'Rádióparancs: lefelé keresés'
      pt: 'Comando de rádio: busca descendente'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Command not active'
        fr: 'Commande non active'
        es: 'Mando no activo'
        de: 'Befehl nicht aktiv'
        it: 'Comando non attivo'
