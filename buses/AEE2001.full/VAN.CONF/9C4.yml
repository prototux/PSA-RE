        de: 'Überlauf'
        it: 'Overflow'
        pl: 'Przepełnienie'
        ru: 'Переполнение'
        zh: '溢出'
        hu: 'Túlcsordulás'
        pt: 'Saturação'

  OVERFLOW_NEGATIVE:
