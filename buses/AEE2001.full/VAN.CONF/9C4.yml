        es: 'Orden activa'
        de: 'Befehl aktiv'
        it: 'Comando attivo'
        pl: 'Polecenie aktywne'
        ru: 'Команда активна'
        zh: '指令激活'
        hu: 'Parancs aktív'
        pt: 'Comando ativo'

  OVERFLOW_POSITIVE:
    bits: '1.5'
    comment:
      en: 'Scan wheel counter positive overflow (toggles on each wrap from 255 to 128, reset at power-up)'
      fr: 'Débordement positif du compteur de la molette SCAN (bascule à chaque passage de 255 à 128, réinitialisé à la mise sous tension)'
      es: 'Desbordamiento positivo del contador de la rueda SCAN (cambia en cada paso de 255 a 128, reiniciado al encender)'
      de: 'Positiver Überlauf des SCAN-Rädchenzählers (schaltet bei jedem Übergang von 255 auf 128 um, Reset beim Einschalten)'
      it: 'Overflow positivo del contatore della manopola SCAN (commuta a ogni passaggio da 255 a 128, reimpostato all''accensione)'
      pl: 'Dodatnie przepełnienie licznika pokrętła SCAN (przełącza się przy każdym przejściu z 255 na 128, resetowane przy włączeniu)'
      ru: 'Положительное переполнение счётчика колеса SCAN (переключается при каждом переходе с 255 на 128, сбрасывается при включении)'
      zh: 'SCAN旋钮计数器正向溢出(每次从255跳变到128时切换,上电时复位)'
      hu: 'A SCAN forgatógomb számlálójának pozitív túlcsordulása (255-ről 128-ra váltáskor billen, bekapcsoláskor visszaáll)'
      pt: 'Estouro positivo do contador do botão SCAN (comuta a cada passagem de 255 para 128, reiniciado ao ligar)'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Normal'
        fr: 'Normal'
        es: 'Normal'
        de: 'Normal'
        it: 'Normale'
        pl: 'Normalny'
        ru: 'Нормальный'
        zh: '正常'
        hu: 'Normál'
        pt: 'Normal'
      0x01:
