id: 0xE24
name: 'VIN_NUMBER'
type: 'van'
length: 17
comment:
  en: 'Vehicle identification number, broadcast every 1000 ms; used by the telematic unit for its anti-theft function and to configure vehicle-dependent settings.'
  fr: 'Numéro d''identification du véhicule, diffusé toutes les 1000 ms ; utilisé par le boîtier télématique pour sa fonction antivol et pour configurer les réglages dépendant du véhicule.'
  es: 'Número de identificación del vehículo, difundido cada 1000 ms; utilizado por la unidad telemática para su función antirrobo y para configurar los ajustes dependientes del vehículo.'
  de: 'Fahrzeug-Identifikationsnummer, alle 1000 ms gesendet; wird vom Telematikgerät für die Diebstahlschutzfunktion und zur Konfiguration fahrzeugabhängiger Einstellungen genutzt.'
  it: 'Numero di identificazione del veicolo, trasmesso ogni 1000 ms; utilizzato dall''unità telematica per la funzione antifurto e per configurare le impostazioni dipendenti dal veicolo.'
  pl: 'Numer identyfikacyjny pojazdu, nadawany co 1000 ms; wykorzystywany przez jednostkę telematyczną do funkcji antykradzieżowej i konfiguracji ustawień zależnych od pojazdu.'
  ru: 'Идентификационный номер автомобиля, передаваемый каждые 1000 мс; используется телематическим блоком для функции защиты от угона и настройки параметров, зависящих от автомобиля.'
  zh: '车辆识别码,每1000毫秒广播一次;由车载通信单元用于防盗功能并配置与车辆相关的设置。'
  hu: 'Alvázszám, 1000 ms-onként sugározva; a telematikai egység a lopásgátló funkcióhoz és a jármű-specifikus beállítások konfigurálásához használja.'
  pt: 'Número de identificação do veículo, difundido a cada 1000 ms; utilizado pela unidade telemática para a sua função antirroubo e para configurar definições dependentes do veículo.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['RAD', 'BTEL', 'AAS', 'BCD']
van:
  access: 'write'
  ack: false
  rtr: false
  reply: 'none'

signals:
  VIN:
    bits: '1.7-17.0'
    comment:
      en: 'Vehicle identification number, 17 ASCII characters'
      fr: 'Numéro d''identification du véhicule, 17 caractères ASCII'
      es: 'Número de identificación del vehículo, 17 caracteres ASCII'
      de: 'Fahrzeug-Identifikationsnummer, 17 ASCII-Zeichen'
      it: 'Numero di identificazione del veicolo, 17 caratteri ASCII'
      pl: 'Numer identyfikacyjny pojazdu, 17 znaków ASCII'
      ru: 'Идентификационный номер автомобиля, 17 символов ASCII'
      zh: '车辆识别码,17个ASCII字符'
      hu: 'Jármű alvázszáma, 17 ASCII karakter'
      pt: 'Número de identificação do veículo, 17 caracteres ASCII'
    type: 'str'
