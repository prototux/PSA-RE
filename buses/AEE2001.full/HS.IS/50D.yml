id: 0x50D
name: 'BRAKES_DATA'
type: 'can'
length: 1
comment:
  en: 'ABS/ESP status and warning-lamp requests: ABR fault/active regulation, brake-fluid level alert, wheel-slip alert, warning-lamp requests, pad wear.'
  fr: 'État ABS/ESP et demandes de voyant : défaut/régulation active ABR, alerte niveau liquide de frein, alerte patinage, demandes de voyant, usure plaquettes.'
  es: 'Estado ABS/ESP y solicitudes de testigo: fallo/regulación activa ABR, alerta de nivel de líquido de frenos, alerta de patinaje, solicitudes de testigo, desgaste de pastillas.'
  de: 'ABS/ESP-Status und Kontrollleuchtenanforderungen: ABR-Fehler/aktive Regelung, Bremsflüssigkeitsstandwarnung, Schlupfwarnung, Kontrollleuchtenanforderungen, Belagverschleiß.'
  it: 'Stato ABS/ESP e richieste spia: guasto/regolazione attiva ABR, allarme livello liquido freni, allarme slittamento, richieste spia, usura pastiglie.'
  pl: 'Stan ABS/ESP i żądania kontrolki: usterka/aktywna regulacja ABR, alarm poziomu płynu hamulcowego, alarm poślizgu, żądania kontrolki, zużycie klocków.'
  ru: 'Статус ABS/ESP и запросы индикатора: неисправность/активное регулирование ABR, предупреждение об уровне тормозной жидкости, предупреждение о пробуксовке, запросы индикатора, износ колодок.'
  zh: 'ABS/ESP状态和警示灯请求:ABR故障/主动调节、刹车液液位警报、打滑警报、警示灯请求、刹车片磨损。'
  hu: 'ABS/ESP állapot és jelzőlámpa-kérések: ABR hiba/aktív szabályozás, fékfolyadékszint riasztás, kipörgés riasztás, jelzőlámpa-kérések, fékbetét kopás.'
  pt: 'Estado do ABS/ESP e pedidos da luz avisadora: avaria/regulação ativa do ABR, alerta de nível de líquido de travões, alerta de deslizamento das rodas, pedidos da luz avisadora, desgaste das pastilhas.'
periodicity: ['100ms']
senders: ['ABS']
receivers: ['BSI']

signals:
  EBD_FAULT_LAMP_REQUEST:
    bits: '1.7'
    comment:
      en: 'Electronic brake force distribution (EBD) fault lamp request'
      fr: 'Demande d''allumage du témoin de défaut du répartiteur électronique de freinage (REF)'
      es: 'Solicitud de encendido del testigo de fallo del repartidor electrónico de frenada (EBD)'
      de: 'Anforderung der Fehlerleuchte der elektronischen Bremskraftverteilung (EBV)'
      it: 'Richiesta di accensione della spia guasto del ripartitore elettronico di frenata (EBD)'
      pl: 'Żądanie zaświecenia kontrolki usterki elektronicznego rozdziału siły hamowania (EBD)'
      ru: 'Запрос включения индикатора неисправности электронного распределителя тормозных усилий (EBD)'
      zh: '电子制动力分配 (EBD) 故障灯请求'
      hu: 'Elektronikus fékerő-elosztó (EBD) hibajelző lámpájának kérése'
      pt: 'Pedido de acendimento da luz avisadora de falha do repartidor eletrónico de travagem (EBD)'
    type: 'bool'

  ABS_FAULT:
    bits: '1.6'
    comment:
      en: 'ABS/ESP unit faulty'
      fr: 'Unité ABR (ABS/ESP) en défaut'
      es: 'Unidad ABR (ABS/ESP) con fallo'
      de: 'ABR-Einheit (ABS/ESP) fehlerhaft'
      it: 'Unità ABR (ABS/ESP) guasta'
      pl: 'Usterka jednostki ABR (ABS/ESP)'
      ru: 'Неисправность блока ABR (ABS/ESP)'
      zh: 'ABR(ABS/ESP)单元故障'
      hu: 'ABR (ABS/ESP) egység hibás'
      pt: 'Unidade ABR (ABS/ESP) com falha'
    type: 'bool'

  ABS_REGULATING:
    bits: '1.5'
    comment:
      en: 'ABS/ESP regulating'
      fr: 'ABR (ABS/ESP) en régulation'
      es: 'ABR (ABS/ESP) regulando'
      de: 'ABR (ABS/ESP) regelt'
      it: 'ABR (ABS/ESP) in regolazione'
      pl: 'ABR (ABS/ESP) w trakcie regulacji'
      ru: 'ABR (ABS/ESP) в режиме регулирования'
      zh: 'ABR(ABS/ESP)正在调节'
      hu: 'ABR (ABS/ESP) szabályoz'
      pt: 'ABR (ABS/ESP) em regulação'
    type: 'bool'

  WHEEL_SLIP_WARNING:
    bits: '1.4-1.3'
    comment:
      en: 'Wheel slip warning'
      fr: 'Alerte patinage'
      es: 'Alerta de deslizamiento de rueda'
      de: 'Warnung Radschlupf'
      it: 'Avviso slittamento ruota'
      pl: 'Ostrzeżenie o poślizgu koła'
      ru: 'Предупреждение о проскальзывании колеса'
      zh: '车轮打滑警告'
      hu: 'Kerékcsúszás-figyelmeztetés'
      pt: 'Aviso de derrapagem da roda'
    type: 'uint'

  BRAKE_PAD_WEAR:
    bits: '1.2'
    comment:
      en: 'Brake pad wear'
      fr: 'Usure des plaquettes de frein'
      es: 'Desgaste de las pastillas de freno'
      de: 'Bremsbelagverschleiß'
      it: 'Usura delle pastiglie dei freni'
      pl: 'Zużycie klocków hamulcowych'
      ru: 'Износ тормозных колодок'
      zh: '刹车片磨损'
      hu: 'Fékbetét kopása'
      pt: 'Desgaste das pastilhas de travão'
    type: 'bool'

  BRAKE_FLUID_LEVEL_WARNING:
    bits: '1.1'
    comment:
      en: 'Brake fluid level warning'
      fr: 'Alerte niveau du liquide de frein'
      es: 'Alerta de nivel del líquido de frenos'
      de: 'Warnung Bremsflüssigkeitsstand'
      it: 'Avviso livello del liquido dei freni'
      pl: 'Ostrzeżenie o poziomie płynu hamulcowego'
      ru: 'Предупреждение об уровне тормозной жидкости'
      zh: '制动液液位警告'
      hu: 'Fékfolyadékszint-figyelmeztetés'
      pt: 'Aviso de nível do líquido de travões'
    type: 'bool'

  ABS_FAULT_LAMP_REQUEST:
    bits: '1.0'
    comment:
      en: 'ABS fault lamp request'
      fr: 'Demande d''allumage du témoin de défaut ABR'
      es: 'Solicitud de encendido del testigo de fallo ABR'
      de: 'Anforderung der ABR-Fehlerleuchte'
      it: 'Richiesta di accensione della spia guasto ABR'
      pl: 'Żądanie zaświecenia kontrolki usterki ABR'
      ru: 'Запрос включения индикатора неисправности ABR'
      zh: 'ABR 故障灯请求'
      hu: 'ABR hibajelző lámpa kérése'
      pt: 'Pedido de acendimento da luz avisadora de falha ABR'
    type: 'bool'
