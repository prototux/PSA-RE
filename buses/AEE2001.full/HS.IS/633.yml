id: 0x633
name: 'EOBD_REQUEST'
type: 'can'
length: 8
comment:
  en: 'EOBD request relayed by the engine ECU to other powertrain ECUs after a request received on its diagnostic K/L line.'
  fr: 'Requête EOBD relayée par le calculateur moteur vers les autres calculateurs de la chaîne de traction, suite à une requête reçue sur sa ligne de diagnostic K/L.'
  es: 'Solicitud EOBD retransmitida por la unidad del motor a otras unidades de la cadena cinemática, tras una solicitud recibida en su línea de diagnóstico K/L.'
  de: 'EOBD-Anfrage, vom Motorsteuergerät an weitere Antriebssteuergeräte weitergeleitet, nach einer auf seiner Diagnoseleitung K/L empfangenen Anfrage.'
  it: 'Richiesta EOBD inoltrata dalla centralina motore alle altre centraline della trasmissione, a seguito di una richiesta ricevuta sulla sua linea di diagnosi K/L.'
  pl: 'Zadanie EOBD przekazywane przez sterownik silnika do innych sterownikow ukladu napedowego po odebraniu zadania na linii diagnostycznej K/L.'
  ru: 'Запрос EOBD, ретранслируемый блоком управления двигателем другим блокам силового агрегата после запроса, полученного по диагностической линии K/L.'
  zh: '发动机控制单元在其K/L诊断线上收到请求后,转发给其他动力总成控制单元的EOBD请求。'
  hu: 'A motorvezerlő által a hajtáslánc többi vezerlőegysegenek továbbított EOBD-kérés, a K/L diagnosztikai vonalon érkezett kérés után.'
  pt: 'Pedido EOBD retransmitido pela ECU do motor às outras ECU da cadeia cinemática, na sequência de um pedido recebido na sua linha de diagnóstico K/L.'
periodicity: ['trigger']
senders: ['CMM']
receivers: ['BVA']

signals:
  EOBD_REQUEST_COUNTER:
    bits: '1.7-1.0'
    comment:
      en: 'EOBD request counter'
      fr: 'Compteur de requêtes E_OBD'
      es: 'Contador de solicitudes E_OBD'
      de: 'Zähler der E_OBD-Anfragen'
      it: 'Contatore delle richieste E_OBD'
      pl: 'Licznik żądań E_OBD'
      ru: 'Счётчик запросов E_OBD'
      zh: 'E_OBD请求计数器'
      hu: 'Az E_OBD kérések számlálója'
      pt: 'Contador de pedidos E_OBD'
    type: 'uint'

  EOBD_REQUEST_CODE:
    bits: '2.7-2.0'
    comment:
      en: 'EOBD request code'
      fr: 'Code de la requête E_OBD'
      es: 'Código de la solicitud E_OBD'
      de: 'Code der E_OBD-Anfrage'
      it: 'Codice della richiesta E_OBD'
      pl: 'Kod żądania E_OBD'
      ru: 'Код запроса E_OBD'
      zh: 'E_OBD请求代码'
      hu: 'Az E_OBD kérés kódja'
      pt: 'Código do pedido E_OBD'
    type: 'uint'

  UNUSED_1:
    bits: '3.7-8.0'
    unused: true
