id: 0x788
name: 'ENGINE_ECU_SUPERVISION'
type: 'can'
length: 6
comment:
  en: 'Network supervision: transmission quality counters and fault presence of the sending ECU'
  fr: 'Supervision réseau : compteurs de qualité de transmission et présence de défaut du calculateur émetteur'
  es: 'Supervisión de red: contadores de calidad de transmisión y presencia de fallos de la centralita emisora'
  de: 'Netzwerküberwachung: Übertragungsqualitätszähler und Fehlerstatus des sendenden Steuergeräts'
  it: 'Supervisione rete: contatori di qualità di trasmissione e presenza di guasti della centralina mittente'
  pl: 'Nadzór sieci: liczniki jakości transmisji i obecność usterki sterownika nadawcy'
  ru: 'Супервизия сети: счётчики качества передачи и наличие неисправности передающего блока'
  zh: '网络监控:传输质量计数器及发送方ECU的故障状态'
  hu: 'Hálózatfelügyelet: átviteli minőség számlálók és az adó vezérlőegység hibaállapota'
  pt: 'Supervisão de rede: contadores de qualidade de transmissão e presença de avaria da ECU emissora.'
periodicity: ['1000ms']
senders: ['CMM']

signals:
  SUPERVISION_FAULT_CODES:
    bits: '1.7-1.0'
    comment:
      en: 'Network supervision fault codes.'
      fr: 'Codes défaut de supervision réseau.'
      es: 'Códigos de fallo de supervisión de red.'
      de: 'Fehlercodes der Netzwerküberwachung.'
      it: 'Codici di guasto della supervisione di rete.'
      pl: 'Kody usterek nadzoru sieci.'
      ru: 'Коды неисправностей сетевого контроля.'
      zh: '网络监控故障代码。'
      hu: 'Hálózatfelügyeleti hibakódok.'
      pt: 'Códigos de falha de supervisão de rede'
    type: 'uint'

  ECU_CONFIRMED_ABSENT_FLAGS:
    bits: '2.7-3.0'
    comment:
      en: 'Per-ECU "confirmed absent" status flags (16 bits).'
      fr: 'Indicateurs de statut "confirmé absent" par calculateur (16 bits).'
      es: 'Indicadores de estado "confirmado ausente" por unidad de control (16 bits).'
      de: 'Statusflags "bestätigt fehlend" pro Steuergerät (16 Bit).'
      it: 'Flag di stato "confermato assente" per centralina (16 bit).'
      pl: 'Flagi statusu "potwierdzona nieobecność" dla każdego sterownika (16 bitów).'
      ru: 'Флаги статуса "подтверждено отсутствие" для каждого блока управления (16 бит).'
      zh: '各控制单元"确认缺失"状态标志位（16位）。'
      hu: 'Vezérlőegységenkénti "megerősítve hiányzik" állapotjelzők (16 bit).'
      pt: 'Indicadores de estado "ausência confirmada" por ECU (16 bits).'
    type: 'uint'

  BUS_OFF_COUNT:
    bits: '5.7-5.0'
    comment:
      en: 'Number of bus-off events.'
      fr: 'Nombre d''événements bus-off.'
      es: 'Número de eventos bus-off.'
      de: 'Anzahl der Bus-off-Ereignisse.'
      it: 'Numero di eventi bus-off.'
      pl: 'Liczba zdarzeń bus-off.'
      ru: 'Количество событий bus-off.'
      zh: '总线关闭(bus-off)事件次数。'
      hu: 'A bus-off események száma.'
      pt: 'Número de eventos bus-off.'
    type: 'uint'

  MISSED_MESSAGES_COUNT:
    bits: '6.7-6.0'
    comment:
      en: 'Number of messages not received.'
      fr: 'Nombre de messages non reçus.'
      es: 'Número de mensajes no recibidos.'
      de: 'Anzahl der nicht empfangenen Nachrichten.'
      it: 'Numero di messaggi non ricevuti.'
      pl: 'Liczba nieodebranych wiadomości.'
      ru: 'Количество неполученных сообщений.'
      zh: '未接收到的消息数量。'
      hu: 'A nem fogadott üzenetek száma.'
      pt: 'Número de mensagens não recebidas.'
    type: 'uint'
