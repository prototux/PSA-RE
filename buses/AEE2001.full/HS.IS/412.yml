id: 0x412
name: 'CABIN_DATA'
type: 'can'
length: 8
comment:
  en: 'Body controller data for powertrain/chassis ECUs: brake pedal, key position, cruise control buttons, gearbox/suspension switches, fuel level, doors.'
  fr: 'Données de la BSI pour les calculateurs groupe motopropulseur/châssis : pédale de frein, position clé, boutons régulateur de vitesse, contacteurs boîte de vitesses/suspension, niveau carburant, portes.'
  es: 'Datos de la BSI para las centralitas de grupo motopropulsor/chasis: pedal de freno, posición de llave, botones del regulador de velocidad, interruptores de caja de cambios/suspensión, nivel de combustible, puertas.'
  de: 'BSI-Daten für Antriebsstrang-/Fahrwerksteuergeräte: Bremspedal, Schlüsselposition, Tempomattasten, Getriebe-/Fahrwerksschalter, Kraftstoffstand, Türen.'
  it: 'Dati della BSI per le centraline gruppo propulsore/telaio: pedale del freno, posizione chiave, pulsanti del regolatore di velocità, interruttori cambio/sospensione, livello carburante, porte.'
  pl: 'Dane BSI dla sterowników układu napędowego/podwozia: pedał hamulca, pozycja kluczyka, przyciski tempomatu, przełączniki skrzyni biegów/zawieszenia, poziom paliwa, drzwi.'
  ru: 'Данные BSI для ЭБУ силового агрегата/шасси: педаль тормоза, положение ключа, кнопки круиз-контроля, переключатели коробки передач/подвески, уровень топлива, двери.'
  zh: '供动力总成/底盘ECU使用的BSI数据:刹车踏板、钥匙位置、巡航控制按钮、变速箱/悬挂开关、燃油液位、车门。'
  hu: 'A BSI adatai a hajtáslánc/alváz vezérlőknek: fékpedál, kulcshelyzet, tempomat gombok, váltó/felfüggesztés kapcsolók, üzemanyagszint, ajtók.'
  pt: 'Dados do computador de servidão para as unidades de controlo do grupo motopropulsor/chassis: pedal do travão, posição da chave, botões do regulador de velocidade, comutadores da caixa de velocidades/suspensão, nível de combustível, portas.'
periodicity: ['50ms', 'trigger']
senders: ['BSI']
receivers: ['CMM', 'BVA', 'BHI', 'ABS']

