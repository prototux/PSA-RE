id: 0x072
name: 'IMMOBILIZER_UNLOCK_REQUEST'
type: 'can'
length: 5
comment:
  en: 'Immobilizer challenge from the engine ECU to the body controller (random number).'
  fr: 'Défi antidémarrage envoyé par le calculateur moteur vers la BSI (nombre aléatoire).'
  es: 'Desafío del inmovilizador enviado por la unidad del motor a la unidad de carrocería (número aleatorio).'
  de: 'Wegfahrsperren-Challenge vom Motorsteuergerät an das Karosseriesteuergerät (Zufallszahl).'
  it: 'Sfida dell''immobilizzatore inviata dalla centralina motore alla centralina carrozzeria (numero casuale).'
  pl: 'Wyzwanie immobilizera wysyłane ze sterownika silnika do sterownika nadwozia (liczba losowa).'
  ru: 'Вызов иммобилайзера от блока управления двигателем к блоку кузовной электроники (случайное число).'
  zh: '发动机控制单元发送给车身控制器的防盗锁定挑战值(随机数)。'
  hu: 'Az indításgátló kihívása a motorvezerlőtől a karosszériavezérlő felé (véletlen szám).'
  pt: 'Desafio do imobilizador enviado pela ECU do motor à BSI (número aleatório).'
periodicity: ['trigger']
senders: ['CMM']
receivers: ['BSI']

signals:
  IMMOBILIZER_SERVICE_TYPE:
    bits: '1.7-1.0'
    comment:
      en: 'Immobilizer service type'
      fr: 'Type de service de l''antidémarrage codé'
      es: 'Tipo de servicio del antiarranque codificado'
      de: 'Diensttyp der codierten Wegfahrsperre'
      it: 'Tipo di servizio dell''antiavviamento codificato'
      pl: 'Typ usługi immobilizera kodowanego'
      ru: 'Тип сервиса иммобилайзера'
      zh: '编码防盗系统服务类型'
      hu: 'A kódolt indításgátló szolgáltatástípusa'
      pt: 'Tipo de serviço do imobilizador codificado'
    type: 'uint'

  IMMOBILIZER_CHALLENGE:
    bits: '2.7-5.0'
    comment:
      en: 'Immobilizer challenge (32-bit random number)'
      fr: 'Défi de l''antidémarrage codé (nombre aléatoire 32 bits)'
      es: 'Desafío del antiarranque codificado (número aleatorio de 32 bits)'
      de: 'Challenge der codierten Wegfahrsperre (32-Bit-Zufallszahl)'
      it: 'Challenge dell''antiavviamento codificato (numero casuale a 32 bit)'
      pl: 'Wyzwanie immobilizera kodowanego (32-bitowa liczba losowa)'
      ru: 'Запрос иммобилайзера (32-битное случайное число)'
      zh: '编码防盗系统的挑战值(32位随机数)'
      hu: 'A kódolt indításgátló kihívása (32 bites véletlenszám)'
      pt: 'Desafio do imobilizador codificado (número aleatório de 32 bits)'
    type: 'bytes'
