      hu: 'Alapjárat-szabályozás alapjele'
      pt: 'Consigna de regulação do ralenti'
    type: 'uint'

  HEAVY_MISFIRE:
    bits: '4.7'
    comment:
      en: 'Heavy combustion misfire'
      fr: 'Ratés de combustion importants'
      es: 'Fallos de combustión importantes'
      de: 'Starke Verbrennungsaussetzer'
