id: 0x488
name: 'ENGINE_DATA'
type: 'can'
length: 8
comment:
  en: 'Engine data: coolant temperature, fuel consumption, warning-lamp requests, A/C management, oil temperature.'
  fr: 'Données moteur : température liquide de refroidissement, consommation carburant, demandes de voyant, gestion clim, température d''huile.'
  es: 'Datos del motor: temperatura del refrigerante, consumo de combustible, solicitudes de testigo, gestión del A/C, temperatura del aceite.'
  de: 'Motordaten: Kühlmitteltemperatur, Kraftstoffverbrauch, Kontrollleuchtenanforderungen, Klimasteuerung, Öltemperatur.'
  it: 'Dati motore: temperatura del liquido di raffreddamento, consumo carburante, richieste spia, gestione A/C, temperatura olio.'
  pl: 'Dane silnika: temperatura płynu chłodzącego, zużycie paliwa, żądania kontrolki, zarządzanie klimatyzacją, temperatura oleju.'
  ru: 'Данные двигателя: температура охлаждающей жидкости, расход топлива, запросы индикатора, управление кондиционером, температура масла.'
  zh: '发动机数据:冷却液温度、燃油消耗、警示灯请求、空调管理、机油温度。'
  hu: 'Motoradatok: hűtőfolyadék hőmérséklet, üzemanyag-fogyasztás, jelzőlámpa-kérések, klímakezelés, olajhőmérséklet.'
  pt: 'Dados do motor: temperatura do líquido de arrefecimento, consumo de combustível, pedidos da luz avisadora, gestão do ar condicionado, temperatura do óleo.'
periodicity: ['100ms']
senders: ['CMM']
receivers: ['BSI', 'BVA', 'BHI']

signals:
  COOLANT_TEMPERATURE:
    bits: '1.7-1.0'
    comment:
      en: 'Engine coolant temperature'
      fr: 'Température d''eau moteur'
      es: 'Temperatura del refrigerante del motor'
      de: 'Motorkühlmitteltemperatur'
      it: 'Temperatura del liquido di raffreddamento motore'
      pl: 'Temperatura płynu chłodzącego silnika'
      ru: 'Температура охлаждающей жидкости двигателя'
      zh: '发动机冷却液温度'
      hu: 'Motor hűtőfolyadék-hőmérséklete'
      pt: 'Temperatura do líquido de refrigeração do motor'
    type: 'uint'

  FUEL_CONSUMPTION:
    bits: '2.7-2.0'
    comment:
      en: 'Fuel consumption'
      fr: 'Consommation de carburant'
      es: 'Consumo de combustible'
      de: 'Kraftstoffverbrauch'
      it: 'Consumo di carburante'
      pl: 'Zużycie paliwa'
      ru: 'Расход топлива'
      zh: '燃油消耗'
      hu: 'Üzemanyag-fogyasztás'
      pt: 'Consumo de combustível'
    type: 'uint'

  IDLE_SPEED_SETPOINT:
    bits: '3.7-3.0'
    comment:
      en: 'Idle speed regulation setpoint'
      fr: 'Consigne de régulation du ralenti'
      es: 'Consigna de regulación del ralentí'
      de: 'Sollwert der Leerlaufregelung'
      it: 'Consegna di regolazione del minimo'
      pl: 'Nastawa regulacji biegu jałowego'
      ru: 'Уставка регулирования холостого хода'
