id: 0x38D
name: 'VEHICLE_DYNAMICS_BRAKES'
type: 'can'
length: 5
comment:
  en: 'Vehicle speed, distance and longitudinal acceleration from the ABS/ESP unit.'
  fr: 'Vitesse véhicule, distance et accélération longitudinale depuis le calculateur ABS/ESP.'
  es: 'Velocidad del vehículo, distancia y aceleración longitudinal desde la unidad ABS/ESP.'
  de: 'Fahrzeuggeschwindigkeit, Strecke und Längsbeschleunigung vom ABS/ESP-Steuergerät.'
  it: 'Velocità veicolo, distanza e accelerazione longitudinale dall''unità ABS/ESP.'
  pl: 'Prędkość pojazdu, dystans i przyspieszenie wzdłużne ze sterownika ABS/ESP.'
  ru: 'Скорость автомобиля, расстояние и продольное ускорение от блока ABS/ESP.'
  zh: '来自ABS/ESP单元的车速、距离和纵向加速度。'
  hu: 'Jármű sebessége, táv és hosszirányú gyorsulás az ABS/ESP egységtől.'
  pt: 'Velocidade do veículo, distância e aceleração longitudinal da unidade ABS/ESP.'
periodicity: ['40ms']
senders: ['ABS']
receivers: ['BHI', 'BSI', 'CMM']

signals:
  VEHICLE_SPEED:
    bits: '1.7-2.0'
    comment:
      en: 'Vehicle speed (16-bit)'
      fr: 'Vitesse du véhicule (16 bits)'
      es: 'Velocidad del vehículo (16 bits)'
      de: 'Fahrzeuggeschwindigkeit (16 Bit)'
      it: 'Velocità del veicolo (16 bit)'
      pl: 'Prędkość pojazdu (16 bitów)'
      ru: 'Скорость автомобиля (16 бит)'
      zh: '车速(16位)'
      hu: 'Járműsebesség (16 bites)'
      pt: 'Velocidade do veículo (16 bits)'
    type: 'uint'

  DISTANCE_COUNTER:
    bits: '3.7-4.0'
    comment:
      en: 'Travelled distance counter (16-bit)'
      fr: 'Compteur de distance parcourue (16 bits)'
      es: 'Contador de distancia recorrida (16 bits)'
      de: 'Zähler der zurückgelegten Strecke (16 Bit)'
      it: 'Contatore di distanza percorsa (16 bit)'
      pl: 'Licznik przebytego dystansu (16 bitów)'
      ru: 'Счётчик пройденного расстояния (16 бит)'
      zh: '行驶距离计数器(16位)'
      hu: 'Megtett út számlálója (16 bites)'
      pt: 'Contador de distância percorrida (16 bits)'
    type: 'uint'

  LONGITUDINAL_ACCELERATION:
    bits: '5.7-5.0'
    comment:
      en: 'Longitudinal acceleration (8-bit)'
      fr: 'Accélération longitudinale (8 bits)'
      es: 'Aceleración longitudinal (8 bits)'
      de: 'Längsbeschleunigung (8 Bit)'
      it: 'Accelerazione longitudinale (8 bit)'
      pl: 'Przyspieszenie wzdłużne (8 bitów)'
      ru: 'Продольное ускорение (8 бит)'
      zh: '纵向加速度(8位)'
      hu: 'Hosszirányú gyorsulás (8 bites)'
      pt: 'Aceleração longitudinal (8 bits)'
    type: 'uint'
