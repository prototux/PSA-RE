id: 0x112
name: 'BODY_CONTROLLER_VERSION'
type: 'can'
length: 8
comment:
  en: 'Software/calibration identification of the sending ECU, sent once as the first frame after ECU start-up'
  fr: 'Identification logicielle/de calibration du calculateur émetteur, envoyée une seule fois comme première trame après le démarrage du calculateur.'
  es: 'Identificación de software/calibración de la ECU emisora, enviada una sola vez como primera trama tras el arranque de la ECU.'
  de: 'Software-/Kalibrierungskennung des sendenden Steuergeräts, einmalig als erste Botschaft nach dem Start des Steuergeräts gesendet.'
  it: 'Identificazione software/di calibrazione della centralina mittente, inviata una sola volta come primo messaggio dopo l''avvio della centralina.'
  pl: 'Identyfikacja oprogramowania/kalibracji sterownika nadającego, wysyłana jednorazowo jako pierwsza ramka po uruchomieniu sterownika.'
  ru: 'Идентификация программного обеспечения/калибровки передающего блока управления, отправляется один раз как первый кадр после запуска блока управления.'
  zh: '发送方ECU的软件/标定标识，作为ECU启动后的第一帧仅发送一次。'
  hu: 'A küldő vezérlőegység szoftver-/kalibrációs azonosítója, egyszer, az első üzenetként küldve a vezérlőegység indítása után.'
  pt: 'Identificação de software/calibração da ECU emissora, enviada uma vez como primeira trama após o arranque da ECU.'
periodicity: ['trigger']
senders: ['BSI']

