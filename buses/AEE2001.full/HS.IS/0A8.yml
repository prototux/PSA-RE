id: 0x0A8
name: 'IMMOBILIZER_UNLOCK_CONFIRMATION'
type: 'can'
length: 5
comment:
  en: 'Immobiliser unlock confirmation sent by the body controller to the engine ECU.'
  fr: 'Confirmation de déverrouillage de l''antidémarrage envoyée par la BSI au calculateur moteur.'
  es: 'Confirmación de desbloqueo del inmovilizador enviada por la BSI a la centralita del motor.'
  de: 'Bestätigung der Wegfahrsperren-Entriegelung, vom BSI an das Motorsteuergerät gesendet.'
  it: 'Conferma di sblocco dell''immobilizzatore inviata dalla BSI alla centralina motore.'
  pl: 'Potwierdzenie odblokowania immobilizera wysyłane przez BSI do sterownika silnika.'
  ru: 'Подтверждение разблокировки иммобилайзера, отправляемое BSI на ЭБУ двигателя.'
  zh: '车身控制器发送给发动机ECU的防盗解锁确认。'
  hu: 'Az indításgátló feloldásának visszaigazolása, a BSI küldi a motorvezérlőnek.'
  pt: 'Confirmação de destrancagem do imobilizador enviada pelo computador de servidão à unidade de controlo do motor.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['CMM']

signals:
  IMMOBILIZER_SERVICE_TYPE:
    bits: '1.7-1.0'
    comment:
      en: 'Immobilizer service type'
      fr: 'Type de service de l''antidémarrage codé'
      es: 'Tipo de servicio del antiarranque codificado'
      de: 'Diensttyp der codierten Wegfahrsperre'
      it: 'Tipo di servizio dell''antiavviamento codificato'
      pl: 'Typ usługi immobilizera kodowanego'
      ru: 'Тип сервиса иммобилайзера'
      zh: '编码防盗系统服务类型'
      hu: 'A kódolt indításgátló szolgáltatástípusa'
      pt: 'Tipo de serviço do imobilizador codificado'
    type: 'uint'

  IMMOBILIZER_KEY:
    bits: '2.7-5.0'
    comment:
      en: 'Coded immobilizer key'
      fr: 'Clé antidémarrage codée'
      es: 'Llave codificada del inmovilizador'
      de: 'Codierter Wegfahrsperren-Schlüssel'
      it: 'Chiave codificata dell''immobilizzatore'
      pl: 'Zakodowany klucz immobilizera'
      ru: 'Кодированный ключ иммобилайзера'
