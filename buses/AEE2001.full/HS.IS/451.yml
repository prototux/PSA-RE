id: 0x451
name: 'SUSPENSION_DYNAMICS'
type: 'can'
length: 4
comment:
  en: 'Hydractive suspension status, warning lamp requests and body heights.'
  fr: 'État de la suspension Hydractive, demandes de voyant et hauteurs de caisse.'
  es: 'Estado de la suspensión Hydractive, solicitudes de testigo y alturas de carrocería.'
  de: 'Status der Hydractive-Federung, Kontrollleuchtenanforderungen und Karosseriehöhen.'
  it: 'Stato della sospensione Hydractive, richieste spia e altezze scocca.'
  pl: 'Stan zawieszenia Hydractive, żądania kontrolki i wysokości nadwozia.'
  ru: 'Статус подвески Hydractive, запросы индикатора и высоты кузова.'
  zh: 'Hydractive悬挂状态、警示灯请求和车身高度。'
  hu: 'A Hydractive felfüggesztés állapota, jelzőlámpa-kérések és karosszéria magasságok.'
  pt: 'Estado da suspensão Hydractive, pedidos da luz avisadora e alturas da carroçaria.'
periodicity: ['20ms']
senders: ['BHI']
receivers: ['BSI', 'CMM']

signals:
  HEIGHT_CORRECTION_FAULT_LAMP_REQUEST:
    bits: '1.7'
    comment:
      en: 'Height correction fault warning lamp request'
      fr: 'Demande d''allumage du témoin de défaut de correction de hauteur'
      es: 'Solicitud de encendido del testigo de fallo de corrección de altura'
      de: 'Anforderung der Warnleuchte für Niveaukorrektur-Fehler'
      it: 'Richiesta di accensione della spia di guasto correzione altezza'
      pl: 'Żądanie zapalenia kontrolki usterki korekcji wysokości'
      ru: 'Запрос включения лампы неисправности коррекции высоты'
      zh: '车高校正故障警示灯请求'
      hu: 'Magasságkorrekció-hiba jelzőlámpájának kérése'
      pt: 'Pedido de acendimento da luz avisadora de falha de correção de altura'
    type: 'bool'

  VARIABLE_POWER_STEERING_FAULT_LAMP_REQUEST:
    bits: '1.6'
    comment:
      en: 'Variable power steering (DAV) fault warning lamp request'
      fr: 'Demande d''allumage du témoin de défaut de direction assistée variable (DAV)'
      es: 'Solicitud de encendido del testigo de fallo de dirección asistida variable (DAV)'
      de: 'Anforderung der Warnleuchte für Fehler der variablen Servolenkung (DAV)'
      it: 'Richiesta di accensione della spia di guasto dello sterzo assistito variabile (DAV)'
      pl: 'Żądanie zapalenia kontrolki usterki zmiennego wspomagania kierownicy (DAV)'
      ru: 'Запрос включения лампы неисправности переменного усилителя руля (DAV)'
      zh: '可变助力转向(DAV)故障警示灯请求'
      hu: 'Változtatható szervokormány (DAV) hiba jelzőlámpájának kérése'
      pt: 'Pedido de acendimento da luz avisadora de falha da direção assistida variável (DAV)'
    type: 'bool'

  SUSPENSION_STATUS:
    bits: '1.5'
    comment:
      en: 'Suspension status'
      fr: 'État de la suspension'
      es: 'Estado de la suspensión'
      de: 'Fahrwerksstatus'
      it: 'Stato delle sospensioni'
      pl: 'Stan zawieszenia'
      ru: 'Статус подвески'
      zh: '悬架状态'
      hu: 'Futómű állapota'
      pt: 'Estado da suspensão'
    type: 'bool'

  SUSPENSION_PUMP_MOTOR_STATUS:
    bits: '1.4'
    comment:
      en: 'Suspension hydraulic pump (GEP) motor status'
      fr: 'État du moteur de la pompe hydraulique de suspension (GEP)'
      es: 'Estado del motor de la bomba hidráulica de suspensión (GEP)'
      de: 'Status des Hydraulikpumpenmotors der Federung (GEP)'
      it: 'Stato del motore della pompa idraulica delle sospensioni (GEP)'
      pl: 'Stan silnika pompy hydraulicznej zawieszenia (GEP)'
      ru: 'Статус двигателя гидронасоса подвески (GEP)'
      zh: '悬架液压泵电机(GEP)状态'
      hu: 'A futómű hidraulikaszivattyú-motorjának (GEP) állapota'
      pt: 'Estado do motor da bomba hidráulica de suspensão (GEP)'
    type: 'bool'

  ROAD_STATE:
    bits: '1.3-1.2'
    comment:
      en: 'Road surface condition'
      fr: 'État de la route'
      es: 'Estado de la carretera'
      de: 'Fahrbahnzustand'
      it: 'Stato del fondo stradale'
      pl: 'Stan nawierzchni drogi'
      ru: 'Состояние дорожного покрытия'
      zh: '路面状况'
      hu: 'Útfelület állapota'
      pt: 'Estado do piso da estrada'
    type: 'uint'

  SUSPENSION_FAULT_LAMP_REQUEST:
    bits: '1.1'
    comment:
      en: 'Suspension fault warning lamp request'
      fr: 'Demande d''allumage du témoin de défaut de suspension'
      es: 'Solicitud de encendido del testigo de fallo de suspensión'
      de: 'Anforderung der Warnleuchte für Fahrwerksfehler'
      it: 'Richiesta di accensione della spia di guasto sospensioni'
      pl: 'Żądanie zapalenia kontrolki usterki zawieszenia'
      ru: 'Запрос включения лампы неисправности подвески'
      zh: '悬架故障警示灯请求'
      hu: 'Futómű-hiba jelzőlámpájának kérése'
      pt: 'Pedido de acendimento da luz avisadora de falha da suspensão'
    type: 'bool'

  SUSPENSION_FUNCTION_LAMP_REQUEST:
    bits: '1.0'
    comment:
      en: 'Suspension function (mode) indicator lamp request'
      fr: 'Demande d''allumage du témoin de fonction (mode) de suspension'
      es: 'Solicitud de encendido del testigo de función (modo) de suspensión'
      de: 'Anforderung der Anzeigeleuchte für Fahrwerksfunktion (Modus)'
      it: 'Richiesta di accensione della spia di funzione (modalità) sospensioni'
      pl: 'Żądanie zapalenia kontrolki funkcji (trybu) zawieszenia'
      ru: 'Запрос включения индикатора режима подвески'
      zh: '悬架功能(模式)指示灯请求'
      hu: 'Futómű-funkció (mód) jelzőlámpájának kérése'
      pt: 'Pedido de acendimento da luz avisadora de função (modo) da suspensão'
    type: 'bool'

  SUSPENSION_POSITION:
    bits: '2.7-2.6'
    comment:
      en: 'Suspension height position (high/normal/low...)'
      fr: 'Position de hauteur de suspension (haute/normale/basse...)'
      es: 'Posición de altura de suspensión (alta/normal/baja...)'
      de: 'Fahrwerks-Höhenposition (hoch/normal/niedrig...)'
      it: 'Posizione di altezza sospensioni (alta/normale/bassa...)'
      pl: 'Pozycja wysokości zawieszenia (wysoka/normalna/niska...)'
      ru: 'Положение подвески по высоте (высокое/нормальное/низкое...)'
      zh: '悬架高度位置(高/正常/低...)'
      hu: 'Futómű magassági helyzete (magas/normál/alacsony...)'
      pt: 'Posição de altura da suspensão (alta/normal/baixa...)'
    type: 'uint'

  SUSPENSION_POSITION_LEFT:
    bits: '2.5-2.4'
    comment:
      en: 'Suspension height position just left'
      fr: 'Position de hauteur de suspension venant d''être quittée'
      es: 'Posición de altura de suspensión recién abandonada'
      de: 'Zuletzt verlassene Fahrwerks-Höhenposition'
      it: 'Posizione di altezza sospensioni appena lasciata'
      pl: 'Pozycja wysokości zawieszenia właśnie opuszczona'
      ru: 'Только что покинутое положение подвески по высоте'
      zh: '刚离开的悬架高度位置'
      hu: 'Az imént elhagyott futómű-magassági helyzet'
      pt: 'Posição de altura da suspensão acabada de abandonar'
    type: 'uint'

  SUSPENSION_POSITION_REFUSED:
    bits: '2.3-2.2'
    comment:
      en: 'Suspension height position request refused'
      fr: 'Position de hauteur de suspension demandée refusée'
      es: 'Posición de altura de suspensión solicitada rechazada'
      de: 'Angeforderte Fahrwerks-Höhenposition abgelehnt'
      it: 'Posizione di altezza sospensioni richiesta rifiutata'
      pl: 'Żądana pozycja wysokości zawieszenia odrzucona'
      ru: 'Запрошенное положение подвески по высоте отклонено'
      zh: '请求的悬架高度位置被拒绝'
      hu: 'A kért futómű-magassági helyzet elutasítva'
      pt: 'Posição de altura da suspensão solicitada recusada'
    type: 'uint'

  FRONT_BODY_HEIGHT:
    bits: '3.7-3.0'
    comment:
      en: 'Front body height'
      fr: 'Hauteur de caisse avant'
      es: 'Altura de carrocería delantera'
      de: 'Karosseriehöhe vorne'
      it: 'Altezza scocca anteriore'
      pl: 'Wysokość nadwozia z przodu'
      ru: 'Высота кузова спереди'
      zh: '车身前部高度'
      hu: 'Elülső karosszériamagasság'
      pt: 'Altura da carroçaria dianteira'
    type: 'uint'

  REAR_BODY_HEIGHT:
    bits: '4.7-4.0'
    comment:
      en: 'Rear body height'
      fr: 'Hauteur de caisse arrière'
      es: 'Altura de carrocería trasera'
      de: 'Karosseriehöhe hinten'
      it: 'Altezza scocca posteriore'
      pl: 'Wysokość nadwozia z tyłu'
      ru: 'Высота кузова сзади'
      zh: '车身后部高度'
      hu: 'Hátsó karosszériamagasság'
      pt: 'Altura da carroçaria traseira'
    type: 'uint'
