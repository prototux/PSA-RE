id: 0x44D
name: 'WHEEL_SPEEDS'
type: 'can'
length: 8
comment:
  en: 'Wheel speeds, sent by the ABS/ESP unit every 40 ms.'
  fr: 'Vitesses des roues, émises par le calculateur ABS/ESP toutes les 40 ms.'
  es: 'Velocidades de las ruedas, enviadas por la unidad ABS/ESP cada 40 ms.'
  de: 'Raddrehzahlen, gesendet vom ABS/ESP-Steuergerät alle 40 ms.'
  it: 'Velocità delle ruote, inviate dalla centralina ABS/ESP ogni 40 ms.'
  pl: 'Prędkości kół, wysyłane przez sterownik ABS/ESP co 40 ms.'
  ru: 'Скорости колёс, отправляются блоком ABS/ESP каждые 40 мс.'
  zh: '车轮速度，由 ABS/ESP 控制单元每 40 毫秒发送一次。'
  hu: 'Keréksebességek, az ABS/ESP vezérlőegység küldi 40 ms-onként.'
  pt: 'Velocidades das rodas, enviadas pela unidade ABS/ESP a cada 40 ms.'
periodicity: ['40ms']
senders: ['ABS']
receivers: ['BVA']

signals:
  FRONT_WHEELS_AVERAGE_SPEED:
    bits: '1.7-2.0'
    comment:
      en: 'Average front wheel speed.'
      fr: 'Vitesse moyenne des roues avant.'
      es: 'Velocidad media de las ruedas delanteras.'
      de: 'Durchschnittliche Geschwindigkeit der Vorderräder.'
      it: 'Velocità media delle ruote anteriori.'
      pl: 'Średnia prędkość kół przednich.'
      ru: 'Средняя скорость передних колёс.'
      zh: '前轮平均车速。'
      hu: 'Az első kerekek átlagsebessége.'
      pt: 'Velocidade média das rodas dianteiras'
    type: 'uint'

  REAR_LEFT_WHEEL_SPEED:
    bits: '3.7-4.0'
    comment:
      en: 'Rear left wheel speed.'
      fr: 'Vitesse de la roue arrière gauche.'
      es: 'Velocidad de la rueda trasera izquierda.'
      de: 'Geschwindigkeit des linken Hinterrads.'
      it: 'Velocità della ruota posteriore sinistra.'
      pl: 'Prędkość lewego tylnego koła.'
      ru: 'Скорость заднего левого колеса.'
      zh: '左后轮车速。'
      hu: 'A bal hátsó kerék sebessége.'
      pt: 'Velocidade da roda traseira esquerda'
    type: 'uint'

  REAR_RIGHT_WHEEL_SPEED:
    bits: '5.7-6.0'
    comment:
      en: 'Rear right wheel speed.'
      fr: 'Vitesse de la roue arrière droite.'
      es: 'Velocidad de la rueda trasera derecha.'
      de: 'Geschwindigkeit des rechten Hinterrads.'
      it: 'Velocità della ruota posteriore destra.'
      pl: 'Prędkość prawego tylnego koła.'
      ru: 'Скорость заднего правого колеса.'
      zh: '右后轮车速。'
      hu: 'A jobb hátsó kerék sebessége.'
      pt: 'Velocidade da roda traseira direita'
    type: 'uint'

  UNUSED_1:
    bits: '7.7-8.0'
    unused: true
