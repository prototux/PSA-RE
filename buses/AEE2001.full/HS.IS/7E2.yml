id: 0x7E2
name: 'CONTEXT_1_DISTANCE'
type: 'can'
length: 6
comment:
  en: 'Context data for the engine ECU, formatted like a diagnostic-on-CAN response; cycles between odometer, injected additive quantity and outside air temperature.'
  fr: 'Données de contexte pour le calculateur moteur, formatées comme une réponse de diagnostic sur CAN ; alterne entre kilométrage, quantité d''additif injecté et température extérieure.'
  es: 'Datos de contexto para la centralita del motor, con formato de respuesta de diagnóstico sobre CAN; alterna entre kilometraje, cantidad de aditivo inyectado y temperatura exterior.'
  de: 'Kontextdaten für das Motorsteuergerät im Format einer Diagnose-über-CAN-Antwort; wechselt zwischen Kilometerstand, eingespritzter Additivmenge und Außentemperatur.'
  it: 'Dati di contesto per la centralina motore, in formato risposta diagnostica su CAN; alterna chilometraggio, quantità di additivo iniettato e temperatura esterna.'
  pl: 'Dane kontekstowe dla sterownika silnika, w formacie odpowiedzi diagnostycznej CAN; naprzemiennie przebieg, ilość wtryśniętego dodatku i temperatura zewnętrzna.'
  ru: 'Контекстные данные для ЭБУ двигателя в формате диагностического ответа по CAN; чередует пробег, количество впрыснутой присадки и температуру наружного воздуха.'
  zh: '发动机ECU的上下文数据,格式类似CAN诊断响应;在里程表、注入添加剂量和车外温度之间轮流发送。'
  hu: 'A motorvezérlő kontextus adatai, CAN diagnosztikai válasz formátumban; váltakozva km-óraállás, befecskendezett adalékmennyiség és külső hőmérséklet.'
  pt: 'Dados de contexto para a unidade de controlo do motor, formatados como uma resposta de diagnóstico sobre CAN; alterna entre o conta-quilómetros, a quantidade de aditivo injetado e a temperatura do ar exterior.'
periodicity: ['5000ms']
senders: ['BSI']
receivers: ['CMM']

signals:
  PCI:
    bits: '1.7-1.0'
    comment:
      en: 'Protocol control information (PCI/USDT) for the CAN diagnostic response frame'
      fr: 'Information de contrôle de protocole (PCI/USDT) pour la trame de réponse diagnostic sur CAN'
      es: 'Información de control de protocolo (PCI/USDT) para la trama de respuesta de diagnóstico por CAN'
      de: 'Protokollsteuerinformation (PCI/USDT) für den CAN-Diagnoseantwortrahmen'
      it: 'Informazione di controllo protocollo (PCI/USDT) per il frame di risposta diagnostica su CAN'
      pl: 'Informacja sterująca protokołem (PCI/USDT) dla ramki odpowiedzi diagnostycznej CAN'
      ru: 'Информация управления протоколом (PCI/USDT) для диагностического ответного кадра CAN'
      zh: 'CAN诊断响应帧的协议控制信息(PCI/USDT)'
      hu: 'Protokollvezérlő információ (PCI/USDT) a CAN diagnosztikai válaszkerethez'
      pt: 'Informação de controlo de protocolo (PCI/USDT) para a trama de resposta de diagnóstico via CAN'
    type: 'uint'

  SERVICE_CODE:
    bits: '2.7-2.0'
    comment:
      en: 'Code/data for the "diagnostic on CAN" frame'
      fr: 'Code/donnée pour la trame « diagnostic on CAN »'
      es: 'Código/dato para la trama «diagnostic on CAN»'
      de: 'Code/Daten für den Frame „diagnostic on CAN“'
      it: 'Codice/dato per il frame «diagnostic on CAN»'
      pl: 'Kod/dane dla ramki „diagnostic on CAN”'
      ru: 'Код/данные для кадра «diagnostic on CAN»'
      zh: '"CAN诊断"帧的代码/数据'
      hu: 'A „diagnostic on CAN” keret kódja/adata'
      pt: 'Código/dado para a trama «diagnostic on CAN»'
    type: 'uint'

  DATA_IDENTIFIER:
    bits: '3.7-3.0'
    comment:
      en: 'Code/data for the "diagnostic on CAN" frame'
      fr: 'Code/donnée pour la trame « diagnostic on CAN »'
      es: 'Código/dato para la trama «diagnostic on CAN»'
      de: 'Code/Daten für den Frame „diagnostic on CAN“'
      it: 'Codice/dato per il frame «diagnostic on CAN»'
      pl: 'Kod/dane dla ramki „diagnostic on CAN”'
      ru: 'Код/данные для кадра «diagnostic on CAN»'
      zh: '"CAN诊断"帧的代码/数据'
