  CONTEXT_DATA:
    bits: '4.7-6.0'
    comment:
      en: 'Diagnostic data (absolute mileage bytes 4-6 / additive quantity bytes 4-5 + additive state byte 6)'
      fr: 'Donnée diagnostic (kilométrage absolu octets 4-6 / quantité d''additif octets 4-5 + état additif octet 6)'
      es: 'Dato de diagnóstico (kilometraje absoluto bytes 4-6 / cantidad de aditivo bytes 4-5 + estado del aditivo byte 6)'
      de: 'Diagnosedaten (absoluter Kilometerstand Byte 4-6 / Additivmenge Byte 4-5 + Additivstatus Byte 6)'
      it: 'Dato diagnostico (chilometraggio assoluto byte 4-6 / quantità additivo byte 4-5 + stato additivo byte 6)'
      pl: 'Dane diagnostyczne (przebieg bezwzględny bajty 4-6 / ilość dodatku bajty 4-5 + stan dodatku bajt 6)'
      ru: 'Диагностические данные (общий пробег байты 4-6 / количество присадки байты 4-5 + состояние присадки байт 6)'
      zh: '诊断数据(绝对里程字节4-6/添加剂量字节4-5+添加剂状态字节6)'
      hu: 'Diagnosztikai adat (összes futásteljesítmény 4-6. bájt / adalékmennyiség 4-5. bájt + adalékállapot 6. bájt)'
      pt: 'Dado de diagnóstico (quilometragem absoluta bytes 4-6 / quantidade de aditivo bytes 4-5 + estado do aditivo byte 6)'
    type: 'bytes'
