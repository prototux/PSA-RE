id: 0x5F0
name: 'RETRACTABLE_ROOF_FAST_STATUS'
type: 'van'
length: 7
comment:
  en: 'Retractable hard-top fast status, read by BSI with in-frame reply: display message and chime requests, window movement requests.'
  fr: 'État rapide du toit escamotable, lu par la BSI avec réponse dans la trame : demandes d''affichage de message et de bruiteur, demandes de mouvement de vitre.'
  es: 'Estado rápido del techo retráctil, leído por la BSI con respuesta en la trama: solicitudes de mensaje en pantalla y de zumbador, solicitudes de movimiento de cristal.'
  de: 'Schnellstatus des versenkbaren Hardtops, von der BSI mit Antwort im Rahmen gelesen: Anzeigemeldungs- und Summeranforderungen, Fensterbewegungsanforderungen.'
  it: 'Stato rapido del tettuccio rigido retrattile, letto dalla BSI con risposta nella trama: richieste di messaggio a display e cicalino, richieste di movimento cristallo.'
  pl: 'Szybki stan chowanego twardego dachu, odczytywany przez BSI z odpowiedzią w ramce: żądania komunikatu wyświetlacza i brzęczyka, żądania ruchu szyby.'
  ru: 'Быстрый статус складной жёсткой крыши, считываемый BSI с ответом в кадре: запросы сообщения на дисплее и зуммера, запросы движения стекла.'
  zh: '硬顶敞篷车顶快速状态,由BSI帧内应答读取:显示消息和提示音请求、车窗移动请求。'
  hu: 'A behúzható kemény tető gyors állapota, a BSI által keretválasszal olvasva: kijelzőüzenet- és hangjelzés-kérések, ablakmozgás-kérések.'
  pt: 'Estado rápido do teto rígido retrátil, lido pela BSI com resposta na trama: mensagem de apresentação e pedidos de sinal sonoro, pedidos de movimento do vidro.'
periodicity: ['50ms']
senders: ['BTE']
receivers: ['BSI']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['BSI']

signals:
  HEADER:
    bits: '1.7-1.0'
    comment:
      en: 'Start-of-frame marker byte of the in-frame reply (usage defined by the VAN network rules)'
      fr: 'Marqueur de début de trame'
      es: 'Byte marcador de inicio de trama de la respuesta en trama'
      de: 'Kennzeichnungsbyte für den Rahmenanfang der In-Frame-Antwort'
      it: 'Byte marcatore di inizio frame della risposta in-frame'
      pl: 'Bajt znacznika początku ramki odpowiedzi w ramce'
      ru: 'Байт-маркер начала кадра ответа в кадре'
      zh: '帧内应答起始标记字节'
      hu: 'Az üzeneten belüli válasz kezdő jelölőbájtja'
      pt: 'Byte marcador de início de trama da resposta em trama'
