id: 0x3C8
name: 'PROCESS_COUNTER'
type: 'van'
length: 3
comment:
  en: 'Process counter returned by the airbag/rollover ECU for the secured rollover link.'
  fr: 'Compteur de processus renvoyé par le calculateur airbag/retournement pour la liaison sécurisée de retournement.'
  es: 'Contador de proceso devuelto por la centralita de airbag/vuelco para el enlace seguro de vuelco.'
  de: 'Prozesszähler, vom Airbag-/Überschlagsteuergerät für die gesicherte Überschlagverbindung zurückgegeben.'
  it: 'Contatore di processo restituito dalla centralina airbag/ribaltamento per il collegamento sicuro di ribaltamento.'
  pl: 'Licznik procesu zwracany przez sterownik poduszek powietrznych/przewrócenia dla zabezpieczonego łącza przewrócenia.'
  ru: 'Счётчик процесса, возвращаемый ЭБУ подушек безопасности/переворачивания для защищённой связи переворачивания.'
  zh: '由气囊/侧翻ECU返回的、用于侧翻安全链路的进程计数器。'
  hu: 'A légzsák-/borulásérzékelő vezérlőegység által visszaadott folyamatszámláló a biztonságos borulási kapcsolathoz.'
  pt: 'Contador de processo devolvido pela unidade de controlo do airbag/capotamento para a ligação segura de capotamento.'
periodicity: ['50ms']
senders: ['RBG']
receivers: ['BSI']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['BSI']

signals:
  PROCESS_COUNTER:
    bits: '1.7-1.0'
    comment:
      en: 'Process counter value, incremented by the airbag ECU on each acknowledged exchange, reset on error/initialisation'
      fr: 'Valeur du compteur de process, incrémentée par le calculateur airbag à chaque échange acquitté, remise à zéro sur erreur/initialisation'
      es: 'Valor del contador de proceso, incrementado por la ECU del airbag en cada intercambio confirmado, reiniciado en caso de error/inicialización'
      de: 'Prozesszählerwert, vom Airbag-Steuergerät bei jedem bestätigten Austausch erhöht, bei Fehler/Initialisierung zurückgesetzt'
      it: 'Valore del contatore di processo, incrementato dalla centralina airbag a ogni scambio confermato, azzerato in caso di errore/inizializzazione'
      pl: 'Wartość licznika procesu, zwiększana przez sterownik poduszek powietrznych przy każdej potwierdzonej wymianie, zerowana przy błędzie/inicjalizacji'
      ru: 'Значение счётчика процесса, увеличивается блоком управления подушками безопасности при каждом подтверждённом обмене, сбрасывается при ошибке/инициализации'
      zh: '处理计数器值,安全气囊ECU在每次确认交换时递增,出错/初始化时复位'
      hu: 'Folyamatszámláló értéke, amelyet a légzsák-vezérlő minden nyugtázott adatcserénél növel, hiba/inicializálás esetén nullázódik'
      pt: 'Valor do contador de processo, incrementado pela unidade de controlo do airbag a cada troca confirmada, reiniciado em caso de erro/inicialização'
    type: 'uint'
    default: 0x00

  UNUSED_1:
    bits: '2.7-2.0'
    unused: true

  UNUSED_2:
    bits: '3.7-3.0'
    unused: true
