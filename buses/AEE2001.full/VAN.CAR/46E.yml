id: 0x46E
name: 'MEMORY_SEAT_STATUS'
type: 'van'
length: 5
comment:
  en: 'Driver memory seat module status, polled by BSI with in-frame reply: memory keypad, chime requests and mirror switch commands. Also used by BSI as the presence-supervision frame.'
  fr: 'État du boîtier de mémorisation, interrogé par la BSI avec réponse dans la trame : clavier mémoire, demandes de bruiteur et commandes du contacteur rétroviseur. Utilisée aussi par la BSI comme trame de supervision de présence.'
  es: 'Estado del módulo de memoria del asiento del conductor, consultado por la BSI con respuesta en la trama: teclado de memoria, solicitudes de zumbador y mandos del interruptor de retrovisor. Usada también por la BSI como trama de supervisión de presencia.'
  de: 'Status des Fahrersitz-Memory-Moduls, von der BSI mit Antwort im Rahmen abgefragt: Memory-Tastenfeld, Summeranforderungen und Spiegelschalterbefehle. Wird auch von der BSI als Präsenzüberwachungsrahmen genutzt.'
  it: 'Stato del modulo memoria sedile conducente, interrogato dalla BSI con risposta nella trama: tastiera memoria, richieste di cicalino e comandi dell''interruttore specchietto. Usata anche dalla BSI come trama di supervisione della presenza.'
  pl: 'Stan modułu pamięci fotela kierowcy, odpytywany przez BSI z odpowiedzią w ramce: klawiatura pamięci, żądania brzęczyka i polecenia przełącznika lusterka. Używana także przez BSI jako ramka nadzoru obecności.'
  ru: 'Статус модуля памяти сиденья водителя, опрашиваемого BSI с ответом в кадре: клавиатура памяти, запросы зуммера и команды переключателя зеркал. Также используется BSI как кадр контроля присутствия.'
  zh: '驾驶员座椅记忆模块状态,由BSI轮询并帧内应答:记忆键盘、提示音请求及后视镜开关指令。BSI也将其用作存在监控帧。'
  hu: 'A vezetőoldali memóriaülés-modul állapota, a BSI által keretválasszal lekérdezve: memóriabillentyűzet, hangjelzés-kérések és tükörkapcsoló parancsok. A BSI jelenlét-felügyeleti keretként is használja.'
  pt: 'Estado do módulo de memória do banco do condutor, interrogado pela BSI com resposta na trama: teclado de memória, pedidos de sinal sonoro e comandos do comutador dos espelhos. Também utilizada pela BSI como trama de supervisão de presença.'
periodicity: ['50ms']
senders: ['BDM_C']
receivers: ['BSI']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['BSI']

signals:
  HEADER:
    bits: '1.7-1.0'
    comment:
      en: 'Start-of-frame marker byte of the in-frame reply (usage defined by the VAN network rules)'
      fr: 'Marqueur de début de trame'
      es: 'Byte marcador de inicio de trama de la respuesta en trama'
      de: 'Kennzeichnungsbyte für den Rahmenanfang der In-Frame-Antwort'
      it: 'Byte marcatore di inizio frame della risposta in-frame'
      pl: 'Bajt znacznika początku ramki odpowiedzi w ramce'
      ru: 'Байт-маркер начала кадра ответа в кадре'
      zh: '帧内应答起始标记字节'
      hu: 'Az üzeneten belüli válasz kezdő jelölőbájtja'
      pt: 'Byte marcador de início de trama da resposta em trama'
    type: 'uint'

  UNUSED_1:
    bits: '2.7-2.6'
    unused: true

  MEMORY_RECALL_IN_PROGRESS:
    bits: '2.5'
    comment:
      en: 'Memory recall in progress'
      fr: 'Rappel mémoire en cours'
      es: 'Recuperación de memoria en curso'
      de: 'Speicherabruf läuft'
      it: 'Richiamo memoria in corso'
      pl: 'Trwa przywoływanie pozycji z pamięci'
      ru: 'Выполняется вызов из памяти'
      zh: '记忆位置调用中'
      hu: 'Memóriapozíció-visszahívás folyamatban'
      pt: 'Recuperação de memória em curso'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No memory recall'
        fr: 'Non-rappel mémoire'
        es: 'Sin recuperación de memoria'
        de: 'Kein Speicherabruf'
        it: 'Nessun richiamo memoria'
        pl: 'Brak przywołania pamięci'
        ru: 'Нет вызова из памяти'
        zh: '无记忆调用'
        hu: 'Nincs memória-visszahívás'
        pt: 'Sem recuperação de memória'
      0x01:
        en: 'Memory recall in progress'
        fr: 'Rappel mémoire en cours'
        es: 'Recuperación de memoria en curso'
        de: 'Speicherabruf läuft'
        it: 'Richiamo memoria in corso'
        pl: 'Trwa przywoływanie pamięci'
        ru: 'Идёт вызов памяти'
        zh: '记忆召回进行中'
        hu: 'Memóriafelidézés folyamatban'
