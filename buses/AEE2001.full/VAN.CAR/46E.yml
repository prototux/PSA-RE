  CURRENT_POSITION_SAVED:
    bits: '2.4'
    comment:
      en: '0 = current position being saved, BSI keeps VAN power on; 1 = BSI may cut VAN power (also assumed if the module does not answer)'
      fr: '0 = enregistrement de la position en cours, la BSI maintient l''alimentation VAN ; 1 = la BSI peut couper l''alimentation VAN (supposé aussi en l''absence de réponse du module)'
      es: '0 = guardando la posición actual, la BSI mantiene la alimentación VAN; 1 = la BSI puede cortar la alimentación VAN (también se asume si el módulo no responde)'
      de: '0 = aktuelle Position wird gespeichert, BSI hält die VAN-Versorgung aufrecht; 1 = BSI darf die VAN-Versorgung abschalten (auch angenommen, wenn das Modul nicht antwortet)'
      it: '0 = posizione corrente in fase di salvataggio, la BSI mantiene l''alimentazione VAN; 1 = la BSI può interrompere l''alimentazione VAN (ipotizzato anche se il modulo non risponde)'
      pl: '0 = trwa zapisywanie bieżącej pozycji, BSI podtrzymuje zasilanie VAN; 1 = BSI może odciąć zasilanie VAN (przyjmowane też przy braku odpowiedzi modułu)'
      ru: '0 = идёт сохранение текущего положения, BSI поддерживает питание VAN; 1 = BSI может отключить питание VAN (также при отсутствии ответа модуля)'
      zh: '0=正在保存当前位置，BSI保持VAN供电；1=BSI可切断VAN供电（模块无应答时也视为此状态）'
      hu: '0 = az aktuális pozíció mentése folyamatban, a BSI fenntartja a VAN-tápot; 1 = a BSI megszakíthatja a VAN-tápot (a modul válaszhiánya esetén is ezt feltételezik)'
      pt: '0 = a guardar a posição atual, a BSI mantém a alimentação VAN; 1 = a BSI pode cortar a alimentação VAN (também assumido se o módulo não responder)'
    type: 'bool'
    default: 0x01
    values:
      0x00:
        en: 'Current position being saved, or seat moved manually'
        fr: 'Position actuelle en cours d''enregistrement, ou siège déplacé manuellement'
        es: 'Posición actual guardándose, o asiento movido manualmente'
        de: 'Aktuelle Position wird gespeichert oder Sitz manuell bewegt'
        it: 'Posizione attuale in salvataggio o sedile spostato manualmente'
        pl: 'Zapisywanie bieżącej pozycji lub fotel przesunięty ręcznie'
        ru: 'Сохранение текущего положения или сиденье перемещено вручную'
        zh: '正在保存当前位置,或座椅被手动移动'
        hu: 'Az aktuális pozíció mentése folyamatban, vagy az ülést kézzel mozgatták'
        pt: 'Posição atual a ser guardada, ou banco deslocado manualmente'
      0x01:
        en: 'Body computer allowed to cut VAN supply'
        fr: 'Autorisation de coupure +VAN par le BSI'
        es: 'La BSI está autorizada a cortar la alimentación VAN'
        de: 'BSI darf die VAN-Versorgung abschalten'
        it: 'Il BSI è autorizzato a interrompere l''alimentazione VAN'
        pl: 'BSI ma zezwolenie na odcięcie zasilania VAN'
        ru: 'BSI разрешено отключать питание VAN'
        zh: 'BSI被授权切断VAN供电'
        hu: 'A BSI jogosult a VAN tápellátás megszakítására'
        pt: 'Computador de servidão autorizado a cortar a alimentação VAN'

