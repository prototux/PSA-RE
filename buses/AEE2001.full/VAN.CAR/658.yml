id: 0x658
name: 'RAIN_LIGHT_SENSOR_CONFIG'
type: 'van'
length: 4
comment:
  en: 'Configuration data for the rain/light sensor: outside temperature, auto-lamp and auto-wipe sensitivities and windscreen type reference (stored in the body computer as after-sales parameters).'
  fr: 'Données de configuration du capteur de pluie/luminosité : température extérieure, sensibilités des fonctions AAF et essuyage auto, et référence de pare-brise (mémorisées dans la BSI comme paramètres après-vente).'
  es: 'Datos de configuración del sensor de lluvia/luminosidad: temperatura exterior, sensibilidades de las funciones AAF y limpiaparabrisas automático, y referencia del parabrisas (memorizadas en la BSI como parámetros de posventa).'
  de: 'Konfigurationsdaten des Regen-/Lichtsensors: Außentemperatur, Empfindlichkeiten für automatisches Licht und Wischen sowie Windschutzscheibentyp-Referenz (in der BSI als Kundendienstparameter gespeichert).'
  it: 'Dati di configurazione del sensore pioggia/luce: temperatura esterna, sensibilità delle funzioni luci e tergicristalli automatici, e riferimento del tipo di parabrezza (memorizzati nella BSI come parametri post-vendita).'
  pl: 'Dane konfiguracyjne czujnika deszczu/światła: temperatura zewnętrzna, czułości funkcji automatycznych świateł i wycieraczek oraz odniesienie typu szyby przedniej (zapisane w BSI jako parametry posprzedażowe).'
  ru: 'Данные конфигурации датчика дождя/света: наружная температура, чувствительность функций автосвета и автодворников, а также ссылка на тип лобового стекла (хранятся в BSI как послепродажные параметры).'
  zh: '雨量/光线传感器的配置数据：室外温度、自动大灯与自动雨刷灵敏度及挡风玻璃类型参考（作为售后参数存储在BSI中）。'
  hu: 'Az eső-/fényérzékelő konfigurációs adatai: külső hőmérséklet, az automatikus fény és törlés érzékenysége, valamint a szélvédőtípus-referencia (a BSI-ben értékesítés utáni paraméterként tárolva).'
  pt: 'Dados de configuração do sensor de chuva/luz: temperatura exterior, sensibilidades das luzes automáticas e da limpeza automática e referência do tipo de para-brisas (memorizados no computador de servidão como parâmetros de pós-venda).'
periodicity: ['60000ms']
senders: ['BSI']
receivers: ['CDPL']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  OUTSIDE_TEMPERATURE:
    bits: '1.7-1.0'
    comment:
      en: 'Outside air temperature'
      fr: 'Température extérieure'
      es: 'Temperatura exterior'
      de: 'Außentemperatur'
      it: 'Temperatura esterna'
      pl: 'Temperatura zewnętrzna'
      ru: 'Наружная температура воздуха'
      zh: '车外温度'
      hu: 'Külső hőmérséklet'
      pt: 'Temperatura exterior'
    type: 'uint'
    factor: 0.5
    offset: -40
    min: -40
    max: 87
    units: '°C'
    invalid: 0xFF
    default: 0x00

  AUTO_LAMPS_SENSITIVITY:
