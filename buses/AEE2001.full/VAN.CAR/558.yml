id: 0x558
name: 'RAIN_LIGHT_SENSOR_VEHICLE_STATE'
type: 'van'
length: 6
comment:
  en: 'Vehicle state for the rain/light sensor: wiping system state, auto-lamp and climate function state, sensor mode, engine running, ignition key position and vehicle speed.'
  fr: 'État véhicule pour le capteur de pluie/luminosité : état du système d''essuyage, état des fonctions éclairage auto et climatisation, mode du capteur, moteur tournant, position clé de contact et vitesse véhicule.'
  es: 'Estado del vehículo para el sensor de lluvia/luminosidad: estado del sistema de limpiaparabrisas, estado de las funciones de alumbrado automático y climatización, modo del sensor, motor en marcha, posición de la llave de contacto y velocidad del vehículo.'
  de: 'Fahrzeugzustand für den Regen-/Lichtsensor: Zustand des Wischsystems, Zustand der Funktionen Automatiklicht und Klimaanlage, Sensormodus, Motor läuft, Zündschlüsselposition und Fahrzeuggeschwindigkeit.'
  it: 'Stato del veicolo per il sensore pioggia/luce: stato del sistema di tergicristalli, stato delle funzioni luci automatiche e climatizzazione, modalità del sensore, motore in moto, posizione della chiave di accensione e velocità del veicolo.'
  pl: 'Stan pojazdu dla czujnika deszczu/światła: stan układu wycieraczek, stan funkcji automatycznych świateł i klimatyzacji, tryb czujnika, praca silnika, pozycja kluczyka zapłonu i prędkość pojazdu.'
  ru: 'Состояние автомобиля для датчика дождя/света: состояние системы стеклоочистителей, состояние функций автосвета и климата, режим датчика, работающий двигатель, положение ключа зажигания и скорость автомобиля.'
  zh: '雨量/光线传感器的车辆状态：雨刷系统状态、自动大灯及空调功能状态、传感器模式、发动机运转、点火钥匙位置及车速。'
  hu: 'Az eső-/fényérzékelő járműállapota: a törlőrendszer állapota, az automatikus fény és klíma funkció állapota, érzékelő üzemmódja, motor jár, gyújtáskulcs helyzete és jármű sebessége.'
  pt: 'Estado do veículo para o sensor de chuva/luz: estado do sistema de limpeza, estado das funções automáticas de luz e climatização, modo do sensor, motor em funcionamento, posição da chave de ignição e velocidade do veículo.'
periodicity: ['50ms']
senders: ['BSI']
receivers: ['CDPL']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  UNUSED_1:
    bits: '1.7-1.4'
    unused: true

  MANUAL_WIPE_REQUEST:
    bits: '1.3'
    comment:
      en: 'Manual front wipe requested by the driver (held for the whole wipe cycle)'
      fr: 'Essuyage avant manuel demandé par le conducteur (maintenu pendant tout le cycle d''essuyage)'
      es: 'Limpieza delantera manual solicitada por el conductor (mantenida durante todo el ciclo)'
      de: 'Manuelles Frontscheibenwischen vom Fahrer angefordert (für den gesamten Wischzyklus gehalten)'
      it: 'Tergitura anteriore manuale richiesta dal conducente (mantenuta per tutto il ciclo)'
      pl: 'Ręczne wycieranie przedniej szyby zażądane przez kierowcę (utrzymywane przez cały cykl)'
      ru: 'Ручной запрос протирки лобового стекла водителем (удерживается весь цикл протирки)'
      zh: '驾驶员请求手动前刮水(保持整个刮水周期)'
      hu: 'A vezető által kért kézi első ablaktörlés (a teljes törlési ciklus alatt fennáll)'
      pt: 'Limpeza dianteira manual pedida pelo condutor (mantida durante todo o ciclo de limpeza)'
