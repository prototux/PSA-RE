    comment:
      en: 'Right sliding door fault'
      fr: 'Défaut de la porte coulissante droite'
      es: 'Fallo de la puerta corredera derecha'
      de: 'Fehler der rechten Schiebetür'
      it: 'Guasto della porta scorrevole destra'
      pl: 'Usterka prawych drzwi przesuwnych'
      ru: 'Неисправность правой раздвижной двери'
      zh: '右侧滑门故障'
      hu: 'A jobb oldali tolóajtó hibája'
      pt: 'Falha da porta corrediça direita'
    type: 'bool'
    default: 0x01
    values:
      0x00:
        en: 'No fault'
        fr: 'Pas de défaut'
        es: 'Sin fallo'
        de: 'Kein Fehler'
        it: 'Nessun guasto'
        pl: 'Brak usterki'
        ru: 'Нет неисправности'
        zh: '无故障'
        hu: 'Nincs hiba'
        pt: 'Sem avaria'
      0x01:
        en: 'Fault'
        fr: 'Défaut'
        es: 'Fallo'
        de: 'Fehler'
        it: 'Guasto'
        pl: 'Usterka'
        ru: 'Неисправность'
        zh: '故障'
        hu: 'Hiba'
        pt: 'Falha'

  FOOTER:
    bits: '4.7-4.0'
    comment:
      en: 'End-of-frame marker byte of the in-frame reply (usage defined by the VAN network rules)'
      fr: 'Marqueur de fin de trame'
      es: 'Byte marcador de fin de trama de la respuesta en trama'
      de: 'Kennzeichnungsbyte für das Rahmenende der In-Frame-Antwort'
      it: 'Byte marcatore di fine frame della risposta in-frame'
      pl: 'Bajt znacznika końca ramki odpowiedzi w ramce'
      ru: 'Байт-маркер конца кадра ответа в кадре'
      zh: '帧内应答结束标记字节'
      hu: 'Az üzeneten belüli válasz záró jelölőbájtja'
      pt: 'Byte marcador de fim de trama da resposta em trama'
    type: 'uint'
