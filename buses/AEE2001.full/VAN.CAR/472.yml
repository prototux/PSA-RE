id: 0x472
name: 'SLIDING_DOORS_STATUS'
type: 'van'
length: 4
comment:
  en: 'Power sliding doors status polled by the body computer with in-frame reply: movement, position, obstacle detection and fault for each door, unlock request. Also used as the presence-supervision frame.'
  fr: 'État des portes latérales coulissantes interrogé par le BSI avec réponse dans la trame : mouvement, position, détection d''obstacle et défaut par porte, demande de déverrouillage. Utilisée aussi comme trame de surveillance de présence.'
  es: 'Estado de las puertas correderas eléctricas consultado por la BSI con respuesta en la trama: movimiento, posición, detección de obstáculo y fallo por puerta, solicitud de desbloqueo. También utilizada como trama de supervisión de presencia.'
  de: 'Status der elektrischen Schiebetüren, vom BSI mit Antwort im selben Rahmen abgefragt: Bewegung, Position, Hinderniserkennung und Fehler je Tür, Entriegelungsanforderung. Auch als Anwesenheitsüberwachungsrahmen genutzt.'
  it: 'Stato delle porte scorrevoli elettriche interrogato dal BSI con risposta nella trama: movimento, posizione, rilevamento ostacolo e guasto per ogni porta, richiesta di sblocco. Usata anche come trama di supervisione della presenza.'
  pl: 'Stan elektrycznych drzwi przesuwnych odpytywany przez BSI z odpowiedzią w tej samej ramce: ruch, pozycja, wykrywanie przeszkody i usterka dla każdych drzwi, żądanie odblokowania. Używana też jako ramka nadzoru obecności.'
  ru: 'Статус электрических сдвижных дверей, опрашиваемый BSI с ответом в том же кадре: движение, положение, обнаружение препятствия и неисправность для каждой двери, запрос разблокировки. Также используется как кадр контроля присутствия.'
  zh: '车身控制器(BSI)轮询的电动滑门状态(同帧应答):各车门的运动、位置、障碍物检测及故障、解锁请求。同时也用作存在监控帧。'
  hu: 'A BSI által lekérdezett elektromos tolóajtók állapota, válasz ugyanabban a keretben: mozgás, pozíció, akadályérzékelés és hiba ajtónként, kioldási kérés. Jelenlét-felügyeleti keretként is szolgál.'
  pt: 'Estado das portas corrediças elétricas interrogado pela BSI com resposta na trama: movimento, posição, deteção de obstáculo e avaria por porta, pedido de desbloqueio. Também utilizada como trama de supervisão de presença.'
periodicity: ['100ms']
senders: ['MDPLC']
receivers: ['BSI']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['BSI']

