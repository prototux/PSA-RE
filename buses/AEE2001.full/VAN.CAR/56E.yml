id: 0x56E
name: 'MEMORY_SEAT_COMMAND'
type: 'van'
length: 2
comment:
  en: 'BSI to driver memory seat module: recall/manual adjustment authorisations, steering column retraction, keypad lighting, economy mode and imminent sleep.'
  fr: 'BSI vers le module de mémorisation du siège conducteur : autorisations de rappel/réglage manuel, dégagement de la colonne de direction, éclairage du clavier, mode économie et veille imminente.'
  es: 'BSI al módulo de memoria del asiento del conductor: autorizaciones de recuperación/ajuste manual, retracción de la columna de dirección, iluminación del teclado, modo económico y reposo inminente.'
  de: 'BSI an das Fahrersitz-Memory-Modul: Freigaben für Speicherabruf/manuelle Verstellung, Lenksäulenrückzug, Tastaturbeleuchtung, Sparmodus und bevorstehender Ruhezustand.'
  it: 'BSI al modulo memoria del sedile conducente: autorizzazioni di richiamo/regolazione manuale, arretramento della colonna di sterzo, illuminazione della tastiera, modalità economica e stand-by imminente.'
  pl: 'BSI do modułu pamięci fotela kierowcy: zezwolenia na przywołanie/regulację ręczną, cofnięcie kolumny kierownicy, podświetlenie klawiatury, tryb oszczędny i zbliżający się tryb uśpienia.'
  ru: 'BSI в модуль памяти сиденья водителя: разрешения вызова из памяти/ручной регулировки, отвод рулевой колонки, подсветка клавиатуры, экономичный режим и скорый переход в спящий режим.'
  zh: 'BSI发送给驾驶员记忆座椅模块的信息：记忆调用/手动调节授权、转向柱回缩、键盘照明、节能模式及即将进入休眠。'
  hu: 'A BSI a vezetőülés-memória modul felé: memória-visszahívási/kézi állítási engedélyek, kormányoszlop visszahúzása, billentyűzet-világítás, takarékos üzemmód és a közelgő alvó állapot.'
  pt: 'Da BSI para o módulo de memória do banco do condutor: autorizações de recuperação/ajuste manual, retração da coluna de direção, iluminação do teclado, modo económico e adormecimento iminente.'
periodicity: ['50ms']
senders: ['BSI']
receivers: ['BDM_C']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  AUTO_MEMORY_RECALL_ALLOWED:
    bits: '1.7'
    comment:
      en: 'Memory recall by single button press allowed (engine not running)'
      fr: 'Rappel mémoire par appui impulsionnel autorisé (moteur non tournant)'
      es: 'Recuperación de memoria por pulsación única permitida (motor apagado)'
      de: 'Speicherabruf durch kurzen Tastendruck erlaubt (Motor aus)'
      it: 'Richiamo memoria con pressione singola consentito (motore spento)'
      pl: 'Przywołanie pamięci pojedynczym naciśnięciem dozwolone (silnik nie pracuje)'
      ru: 'Разрешён вызов из памяти одним нажатием (двигатель не работает)'
      zh: '允许单击按键召回记忆(发动机未运转)'
      hu: 'Memória-előhívás egyszeri gombnyomással engedélyezett (motor nem jár)'
      pt: 'Recuperação de memória por pressão única permitida (motor desligado)'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Not allowed'
        fr: 'Non autorisé'
        es: 'No permitido'
        de: 'Nicht erlaubt'
        it: 'Non consentito'
        pl: 'Niedozwolone'
        ru: 'Не разрешено'
        zh: '不允许'
        hu: 'Nem engedélyezett'
        pt: 'Não permitido'
      0x01:
        en: 'Allowed (set when ''engine not running'' appears)'
        fr: 'Autorisé (mis à 1 à l''apparition de l''information « moteur non tournant »)'
        es: 'Permitido (se activa cuando aparece «motor no en marcha»)'
        de: 'Zulässig (gesetzt bei Auftreten von „Motor läuft nicht“)'
        it: 'Consentito (impostato alla comparsa di «motore non in funzione»)'
        pl: 'Dozwolone (ustawiane przy pojawieniu się „silnik niepracujący”)'
        ru: 'Разрешено (устанавливается при появлении «двигатель не работает»)'
        zh: '允许("发动机未运转"信息出现时置位)'
        hu: 'Engedélyezve (a „motor nem jár” megjelenésekor beállítva)'
        pt: 'Permitido (definido quando surge ''motor parado'')'

