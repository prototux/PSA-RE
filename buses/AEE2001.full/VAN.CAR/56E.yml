      de: 'Lenksäulen-Ausstiegshilfe: fährt beim Abziehen des Schlüssels ein, kehrt bei Zuschalten der Zubehörspannung zurück'
      it: 'Facilitazione di uscita del piantone: si ritrae alla rimozione della chiave, ritorna in posizione all''attivazione di +ACC'
      pl: 'Ułatwienie wysiadania kolumny kierownicy: chowa się po wyjęciu kluczyka, wraca na pozycję po włączeniu +ACC'
      ru: 'Облегчение выхода рулевой колонки: втягивается при извлечении ключа, возвращается в положение при включении +ACC'
      zh: '转向柱便捷出入功能:拔出钥匙时收回,+ACC通电时恢复位置'
      hu: 'A kormányoszlop kiszállást könnyítő funkciója: a kulcs eltávolításakor behúzódik, a +ACC bekapcsolásakor visszatér'
