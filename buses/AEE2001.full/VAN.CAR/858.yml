id: 0x858
name: 'WIPER_PARK_EXIT_EVENT'
type: 'van'
length: 1
comment:
  en: 'Sent when the front wiper motor leaves its park position; carries the delay between the event and the frame transmission.'
  fr: 'Envoyée quand le moteur d''essuie-glace avant quitte sa position de repos ; porte le délai entre l''événement et l''envoi de la trame.'
  es: 'Enviada cuando el motor del limpiaparabrisas delantero abandona su posición de reposo; contiene el retardo entre el evento y el envío de la trama.'
  de: 'Gesendet, wenn der Frontwischermotor seine Ruhestellung verlässt; enthält die Verzögerung zwischen Ereignis und Rahmenübertragung.'
  it: 'Inviata quando il motore del tergicristallo anteriore lascia la posizione di riposo; contiene il ritardo tra l''evento e l''invio della trama.'
  pl: 'Wysyłana, gdy silnik wycieraczki przedniej opuszcza pozycję spoczynkową; zawiera opóźnienie między zdarzeniem a wysłaniem ramki.'
  ru: 'Отправляется, когда мотор переднего стеклоочистителя покидает парковочное положение; содержит задержку между событием и передачей кадра.'
  zh: '当前雨刷电机离开停靠位置时发送；携带事件与帧发送之间的延迟。'
  hu: 'Akkor kerül elküldésre, amikor az első ablaktörlő motorja elhagyja a nyugalmi helyzetét; tartalmazza az esemény és a keret küldése közötti késleltetést.'
  pt: 'Enviada quando o motor do limpa-para-brisas dianteiro sai da posição de repouso; transporta o atraso entre o evento e a transmissão da trama.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['CDPL']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  PARK_EXIT_DELAY:
    bits: '1.7-1.0'
    comment:
      en: 'Time elapsed between the wiper leaving the park position and this frame being sent'
      fr: 'Temps écoulé entre la sortie de l''essuie-glace de sa position d''arrêt fixe et l''envoi de cette trame'
      es: 'Tiempo transcurrido entre la salida del limpiaparabrisas de su posición de reposo y el envío de esta trama'
      de: 'Verstrichene Zeit zwischen dem Verlassen der Parkposition des Wischers und dem Senden dieses Frames'
      it: 'Tempo trascorso tra l''uscita del tergicristallo dalla posizione di riposo e l''invio di questo frame'
      pl: 'Czas, jaki upłynął od opuszczenia pozycji spoczynkowej wycieraczki do wysłania tej ramki'
      ru: 'Время, прошедшее с момента выхода дворника из парковочного положения до отправки этого кадра'
      zh: '雨刷离开停放位置到发送该帧之间经过的时间'
      hu: 'A törlőlapát nyugalmi helyzetének elhagyása és e keret elküldése közötti eltelt idő'
      pt: 'Tempo decorrido entre a saída do limpa-para-brisas da sua posição de repouso fixa e o envio desta trama'
    type: 'uint'
    factor: 1
    min: 0
    max: 254
    units: 'ms'
    invalid: 0xFF
    default: 0x00
