id: 0x446
name: 'ROLLOVER_UNIT_COMMAND'
type: 'van'
length: 4
comment:
  en: 'Body computer to rollover detection unit: sleep announcement, engine running, ignition key position, vehicle speed and rollover warning lamp state on the instrument cluster.'
  fr: 'BSI vers le boîtier de détection de retournement : annonce de mise en veille, moteur tournant, position de la clé de contact, vitesse véhicule et état du témoin de retournement au combiné.'
  es: 'BSI a la unidad de detección de vuelco: anuncio de puesta en reposo, motor en marcha, posición de la llave de contacto, velocidad del vehículo y estado del testigo de vuelco en el cuadro.'
  de: 'BSI an die Überschlagerkennungseinheit: Ruhezustandsankündigung, Motor läuft, Zündschlüsselposition, Fahrzeuggeschwindigkeit und Überschlagwarnleuchtenzustand am Kombiinstrument.'
  it: 'BSI alla centralina di rilevamento ribaltamento: annuncio di messa in stand-by, motore in moto, posizione della chiave di accensione, velocità del veicolo e stato della spia di ribaltamento sul quadro strumenti.'
  pl: 'BSI do jednostki wykrywania przewrócenia: zapowiedź uśpienia, praca silnika, pozycja kluczyka zapłonu, prędkość pojazdu i stan lampki przewrócenia na zestawie wskaźników.'
  ru: 'BSI в блок обнаружения переворачивания: объявление перехода в спящий режим, работающий двигатель, положение ключа зажигания, скорость автомобиля и состояние лампы переворачивания на приборной панели.'
  zh: 'BSI发送给侧翻检测单元的信息：休眠通知、发动机运转、点火钥匙位置、车速及仪表组侧翻警告灯状态。'
  hu: 'A BSI a borulásérzékelő egység felé: alvó állapot bejelentése, motor jár, gyújtáskulcs helyzete, jármű sebessége és a borulásjelző lámpa állapota a műszerfalon.'
  pt: 'Do computador de servidão para a unidade de deteção de capotamento: anúncio de adormecimento, motor em funcionamento, posição da chave de ignição, velocidade do veículo e estado da luz avisadora de capotamento no quadrante de instrumentos.'
periodicity: ['50ms']
senders: ['BSI']
receivers: ['ROLLOVER']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  UNUSED_1:
    bits: '1.7-1.6'
    unused: true

  UNUSED_2:
    bits: '1.5'
    unused: true

  UNUSED_3:
    bits: '1.4'
    unused: true

  SLEEP_ANNOUNCE:
    bits: '1.3'
    comment:
      en: 'Announces upcoming sleep mode and loss of the VAN supply'
      fr: 'Annonce de la mise en veille imminente et de la disparition du +VAN'
      es: 'Anuncio de la próxima puesta en reposo y pérdida de la alimentación +VAN'
      de: 'Ankündigung des bevorstehenden Ruhezustands und Wegfalls der VAN-Versorgung'
      it: 'Annuncio dell''imminente stand-by e della perdita dell''alimentazione +VAN'
      pl: 'Zapowiedź nadchodzącego trybu uśpienia i zaniku zasilania +VAN'
      ru: 'Оповещение о переходе в спящий режим и отключении питания +VAN'
      zh: '提前通知即将进入休眠模式和+VAN供电中断'
      hu: 'A közelgő alvó üzemmód és a +VAN tápellátás megszűnésének előjelzése'
      pt: 'Anúncio da colocação em repouso iminente e da perda da alimentação +VAN'
    type: 'bool'
    default: 0x00
