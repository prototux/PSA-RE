  KEY_PRESENCE_REQUEST:
    bits: '1.5'
    comment:
      en: 'Key presence request'
      fr: 'Demande de présence de la clé'
      es: 'Solicitud de presencia de la llave'
      de: 'Anforderung zur Schlüsselanwesenheit'
      it: 'Richiesta di presenza della chiave'
      pl: 'Żądanie obecności kluczyka'
