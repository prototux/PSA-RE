id: 0x650
name: 'TRANSPONDER_COMMAND'
type: 'van'
length: 12
comment:
  en: 'Immobiliser transponder command to the steering column module: identification, authentication, key presence and remote-control identification requests, random challenge, encrypted user-page read command and encrypted password.'
  fr: 'Commande transpondeur d''immobilisation vers le module de colonne de direction : demandes d''identification, d''authentification, de présence de clé et d''identification télécommande, défi aléatoire, commande de lecture cryptée de la page utilisateur et mot de passe crypté.'
  es: 'Comando de transpondedor del inmovilizador al módulo de columna de dirección: solicitudes de identificación, autenticación, presencia de llave e identificación del mando a distancia, desafío aleatorio, comando de lectura cifrada de la página de usuario y contraseña cifrada.'
  de: 'Transponder-Wegfahrsperrenbefehl an das Lenksäulenmodul: Identifikations-, Authentifizierungs-, Schlüsselanwesenheits- und Fernbedienungsidentifikationsanfragen, Zufalls-Challenge, verschlüsselter Lesebefehl der Benutzerseite und verschlüsseltes Passwort.'
  it: 'Comando transponder dell''immobilizzatore al modulo del piantone dello sterzo: richieste di identificazione, autenticazione, presenza chiave e identificazione del telecomando, challenge casuale, comando di lettura cifrata della pagina utente e password cifrata.'
  pl: 'Polecenie transpondera immobilizera do modułu kolumny kierownicy: żądania identyfikacji, uwierzytelnienia, obecności kluczyka i identyfikacji pilota, losowe wyzwanie, szyfrowane polecenie odczytu strony użytkownika i szyfrowane hasło.'
  ru: 'Команда транспондера иммобилайзера модулю рулевой колонки: запросы идентификации, аутентификации, присутствия ключа и идентификации пульта, случайный вызов, зашифрованная команда чтения пользовательской страницы и зашифрованный пароль.'
  zh: '发往转向柱模块的防盗发射应答器命令:身份识别、认证、钥匙存在和遥控识别请求、随机挑战码、加密用户页读取命令和加密密码。'
  hu: 'Indításgátló transzponder parancs a kormányoszlop modulnak: azonosítási, hitelesítési, kulcsjelenlét- és távirányító-azonosítási kérések, véletlen kihívás, titkosított felhasználói lapolvasási parancs és titkosított jelszó.'
  pt: 'Comando do transponder do imobilizador para o módulo da coluna de direção: identificação, autenticação, pedidos de presença da chave e de identificação do comando à distância, desafio aleatório, comando de leitura encriptado da página do utilizador e palavra-passe encriptada.'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['HDC']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  TRANSPONDER_IDENT_REQUEST:
    bits: '1.7'
    comment:
      en: 'Transponder identification request'
      fr: 'Demande d''identification du transpondeur'
      es: 'Solicitud de identificación del transpondedor'
      de: 'Anforderung zur Transponder-Identifikation'
      it: 'Richiesta di identificazione del transponder'
      pl: 'Żądanie identyfikacji transpondera'
      ru: 'Запрос идентификации транспондера'
      zh: '应答器识别请求'
      hu: 'Transzponder azonosításának kérése'
      pt: 'Pedido de identificação do transponder'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande d''identification'
        es: 'Sin solicitud de identificación'
        de: 'Keine Identifikationsanforderung'
        it: 'Nessuna richiesta di identificazione'
        pl: 'Brak żądania identyfikacji'
        ru: 'Нет запроса идентификации'
        zh: '无识别请求'
        hu: 'Nincs azonosítási kérés'
        pt: 'Sem pedido de identificação'
      0x01:
        en: 'Identification requested'
        fr: 'Demande d''identification'
        es: 'Solicitud de identificación'
        de: 'Identifikation angefordert'
        it: 'Identificazione richiesta'
        pl: 'Żądanie identyfikacji'
        ru: 'Запрошена идентификация'
        zh: '请求识别'
        hu: 'Azonosítás kérve'
        pt: 'Pedido de identificação'

  TRANSPONDER_AUTH_REQUEST:
