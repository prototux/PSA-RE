      pt: 'Pedido de autenticação do transponder'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No authentication request'
        fr: 'Pas de demande d''authentification'
        es: 'Sin solicitud de autenticación'
        de: 'Keine Authentifizierungsanforderung'
        it: 'Nessuna richiesta di autenticazione'
        pl: 'Brak żądania uwierzytelnienia'
        ru: 'Нет запроса аутентификации'
        zh: '无认证请求'
        hu: 'Nincs hitelesítési kérés'
        pt: 'Sem pedido de autenticação'
      0x01:
        en: 'Authentication requested'
        fr: 'Demande d''authentification'
        es: 'Autenticación solicitada'
        de: 'Authentifizierung angefordert'
        it: 'Autenticazione richiesta'
        pl: 'Żądanie uwierzytelnienia'
        ru: 'Запрошена аутентификация'
        zh: '已请求身份验证'
