id: 0x5F6
name: 'DRIVER_DOOR_MODULE_COMMAND'
type: 'van'
length: 7
comment:
  en: 'Function commands from the body controller to the driver door module: mirror memory positions, mirror fold/defrost, window partial opening, lock state change and door lighting.'
  fr: 'Commandes de fonctions de la BSI vers le module de porte conducteur : positions mémoire rétroviseur, rabattement/dégivrage rétroviseur, ouverture partielle de vitre, changement d''état de condamnation et éclairage de porte.'
  es: 'Órdenes de función de la BSI al módulo de puerta del conductor: posiciones de memoria del espejo, plegado/desempañado del espejo, apertura parcial de ventanilla, cambio de estado de bloqueo e iluminación de puerta.'
  de: 'Funktionsbefehle der BSI an das Fahrertürmodul: Spiegel-Memory-Positionen, Spiegelklapp-/Enteisungsfunktion, teilweises Fensteröffnen, Verriegelungszustandsänderung und Türbeleuchtung.'
  it: 'Comandi di funzione dalla BSI al modulo porta conducente: posizioni memoria specchietto, ripiegamento/sbrinamento specchietto, apertura parziale finestrino, cambio di stato di chiusura e illuminazione porta.'
  pl: 'Polecenia funkcyjne z BSI do modułu drzwi kierowcy: pozycje pamięci lusterka, składanie/odszranianie lusterka, częściowe otwarcie szyby, zmiana stanu zamknięcia i oświetlenie drzwi.'
  ru: 'Функциональные команды от BSI к модулю двери водителя: позиции памяти зеркала, складывание/обогрев зеркала, частичное открытие стекла, изменение состояния блокировки и освещение двери.'
  zh: '由BSI发送给驾驶员车门模块的功能命令：后视镜记忆位置、后视镜折叠/除霜、车窗部分开启、锁止状态变化及车门照明。'
  hu: 'A BSI funkcióparancsai a vezetőoldali ajtómodul felé: tükörmemória-pozíciók, tükörbehajtás/-fűtés, ablak részleges nyitása, záróállapot-változás és ajtóvilágítás.'
  pt: 'Comandos de função do computador de servidão para o módulo da porta do condutor: posições de memória dos espelhos, dobragem/descongelamento dos espelhos, abertura parcial do vidro, mudança de estado de trancagem e iluminação da porta.'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['EDP_C']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

