id: 0x476
name: 'DRIVER_DOOR_MODULE_FAST_STATUS'
type: 'van'
length: 8
comment:
  en: 'Functional status of the driver door: mirror and window switch requests, window movement/position, lock and door contacts, memory keypad.'
  fr: 'État fonctionnel de la porte conducteur : demandes des contacteurs rétroviseur et lève-vitre, mouvement/position de vitre, contacts de serrure et de porte, clavier mémoire.'
  es: 'Estado funcional de la puerta del conductor: solicitudes de los interruptores de retrovisor y elevalunas, movimiento/posición del cristal, contactos de cerradura y puerta, teclado de memoria.'
  de: 'Funktionsstatus der Fahrertür: Anforderungen der Spiegel- und Fensterschalter, Fensterbewegung/-position, Schloss- und Türkontakte, Memory-Tastenfeld.'
  it: 'Stato funzionale della portiera conducente: richieste degli interruttori specchietto e alzacristallo, movimento/posizione cristallo, contatti serratura e portiera, tastiera memoria.'
  pl: 'Stan funkcjonalny drzwi kierowcy: żądania przełączników lusterka i szyby, ruch/pozycja szyby, styki zamka i drzwi, klawiatura pamięci.'
  ru: 'Функциональный статус двери водителя: запросы переключателей зеркала и стеклоподъёмника, движение/положение стекла, контакты замка и двери, клавиатура памяти.'
  zh: '驾驶员车门功能状态:后视镜和车窗开关请求、车窗运动/位置、门锁和车门触点、记忆键盘。'
  hu: 'A vezetőoldali ajtó funkcionális állapota: tükör- és ablakkapcsoló kérések, ablakmozgás/-helyzet, zár- és ajtóérintkezők, memóriabillentyűzet.'
  pt: 'Estado funcional da porta do condutor: pedidos dos comutadores do espelho e do vidro, movimento/posição do vidro, contactos de trancagem e da porta, teclado de memória.'
periodicity: ['50ms']
senders: ['EDP_C']
receivers: ['BSI']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['BSI']

signals:
  HEADER:
    bits: '1.7-1.0'
    comment:
      en: 'Start-of-frame marker byte of the in-frame reply (usage defined by the VAN network rules)'
      fr: 'Marqueur de début de trame'
      es: 'Byte marcador de inicio de trama de la respuesta en trama'
      de: 'Kennzeichnungsbyte für den Rahmenanfang der In-Frame-Antwort'
      it: 'Byte marcatore di inizio frame della risposta in-frame'
      pl: 'Bajt znacznika początku ramki odpowiedzi w ramce'
