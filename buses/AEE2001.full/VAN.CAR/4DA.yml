id: 0x4DA
name: 'ALARM_EVENT'
type: 'van'
length: 5
comment:
  en: 'Alarm module events: interior intrusion, bonnet opening, siren link fault, volumetric inhibition push-button and hazard-lamp flashing request on intrusion.'
  fr: 'Événements du module alarme : intrusion intérieure, ouverture capot, défaut de liaison sirène, bouton d''inhibition de la surveillance volumétrique et demande de clignotement des feux de détresse sur intrusion.'
  es: 'Eventos del módulo de alarma: intrusión interior, apertura del capó, fallo de enlace de la sirena, pulsador de inhibición volumétrica y solicitud de parpadeo de las luces de emergencia ante intrusión.'
  de: 'Ereignisse des Alarmmoduls: Innenraumeinbruch, Motorhaubenöffnung, Sirenenverbindungsfehler, Taster zur Deaktivierung der Innenraumüberwachung und Warnblinkeranforderung bei Einbruch.'
  it: 'Eventi del modulo allarme: intrusione interna, apertura del cofano, guasto del collegamento sirena, pulsante di inibizione volumetrica e richiesta di lampeggio delle luci di emergenza in caso di intrusione.'
  pl: 'Zdarzenia modułu alarmowego: włamanie do wnętrza, otwarcie maski, usterka łącza syreny, przycisk wyłączenia czujnika ruchu i żądanie migania świateł awaryjnych przy włamaniu.'
  ru: 'События модуля сигнализации: проникновение в салон, открытие капота, неисправность связи с сиреной, кнопка отключения объёмного датчика и запрос мигания аварийной сигнализации при проникновении.'
  zh: '报警模块事件:车内入侵、引擎盖开启、报警器连接故障、体积感应抑制按钮及入侵时危险警示灯闪烁请求。'
  hu: 'A riasztómodul eseményei: belső térbe való behatolás, motorháztető nyitása, szirénakapcsolat-hiba, térfigyelés letiltó gomb és vészvillogó villogtatási kérése behatoláskor.'
  pt: 'Eventos do módulo de alarme: intrusão interior, abertura do capot, avaria da ligação da sirene, botão de inibição volumétrica e pedido de piscar das luzes de emergência em caso de intrusão.'
periodicity: ['200ms', 'trigger']
senders: ['ALARM']
receivers: ['BSI']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['BSI']

signals:
  HEADER:
    bits: '1.7-1.0'
    comment:
      en: 'Start-of-frame marker byte of the in-frame reply (usage defined by the VAN network rules)'
      fr: 'Marqueur de début de trame'
      es: 'Byte marcador de inicio de trama de la respuesta en trama'
      de: 'Kennzeichnungsbyte für den Rahmenanfang der In-Frame-Antwort'
      it: 'Byte marcatore di inizio frame della risposta in-frame'
      pl: 'Bajt znacznika początku ramki odpowiedzi w ramce'
      ru: 'Байт-маркер начала кадра ответа в кадре'
      zh: '帧内应答起始标记字节'
      hu: 'Az üzeneten belüli válasz kezdő jelölőbájtja'
      pt: 'Byte marcador de início de trama da resposta em trama'
    type: 'uint'

  INTRUSION_DETECTED:
    bits: '2.7'
    comment:
      en: 'Presence detected in the vehicle (volumetric)'
      fr: 'Présence détectée dans le véhicule (volumétrique)'
      es: 'Presencia detectada en el vehículo (volumétrica)'
      de: 'Anwesenheit im Fahrzeug erkannt (volumetrisch)'
      it: 'Presenza rilevata nel veicolo (volumetrica)'
      pl: 'Wykryto obecność w pojeździe (wolumetrycznie)'
      ru: 'Обнаружено присутствие в автомобиле (объёмный датчик)'
      zh: '检测到车内有人(空间探测)'
      hu: 'Jelenlét érzékelve a járműben (térfogati)'
      pt: 'Presença detetada no veículo (volumétrica)'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No intrusion'
        fr: 'Pas d''intrusion'
        es: 'Sin intrusión'
        de: 'Kein Eindringen'
        it: 'Nessuna intrusione'
        pl: 'Brak włamania'
        ru: 'Нет проникновения'
        zh: '无入侵'
        hu: 'Nincs behatolás'
        pt: 'Sem intrusão'
      0x01:
        en: 'Vehicle intrusion'
        fr: 'Intrusion véhicule'
        es: 'Intrusión en el vehículo'
        de: 'Fahrzeugeinbruch'
        it: 'Intrusione nel veicolo'
        pl: 'Włamanie do pojazdu'
        ru: 'Проникновение в автомобиль'
        zh: '车辆入侵'
        hu: 'Behatolás a járműbe'
        pt: 'Intrusão no veículo'

  BONNET_OPEN:
    bits: '2.6'
    comment:
      en: 'Bonnet opening'
      fr: 'Ouverture du capot'
      es: 'Apertura del capó'
      de: 'Öffnen der Motorhaube'
      it: 'Apertura del cofano'
      pl: 'Otwarcie maski silnika'
      ru: 'Открытие капота'
      zh: '发动机盖打开'
      hu: 'Motorháztető nyitása'
      pt: 'Abertura do capô'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Bonnet closed'
        fr: 'Capot moteur fermé'
        es: 'Capó cerrado'
        de: 'Motorhaube geschlossen'
        it: 'Cofano motore chiuso'
        pl: 'Maska silnika zamknięta'
        ru: 'Капот закрыт'
        zh: '引擎盖关闭'
        hu: 'Motorháztető zárva'
        pt: 'Capot fechado'
      0x01:
        en: 'Bonnet open'
        fr: 'Capot moteur ouvert'
        es: 'Capó abierto'
        de: 'Motorhaube offen'
        it: 'Cofano motore aperto'
        pl: 'Maska silnika otwarta'
        ru: 'Капот открыт'
        zh: '发动机罩打开'
        hu: 'Motorháztető nyitva'
        pt: 'Capô aberto'

  SIREN_LINK_FAULT:
    bits: '2.5'
    comment:
      en: 'Siren link fault'
      fr: 'Défaut de la liaison sirène'
      es: 'Fallo del enlace de la sirena'
      de: 'Fehler der Sirenenverbindung'
      it: 'Guasto del collegamento della sirena'
      pl: 'Usterka łącza syreny'
      ru: 'Неисправность связи с сиреной'
      zh: '报警器连接故障'
      hu: 'A sziréna kapcsolatának hibája'
      pt: 'Falha da ligação da sirene'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No fault'
        fr: 'Pas de défaut'
        es: 'Sin fallo'
        de: 'Kein Fehler'
        it: 'Nessun guasto'
        pl: 'Brak usterki'
        ru: 'Нет неисправности'
        zh: '无故障'
        hu: 'Nincs hiba'
        pt: 'Sem avaria'
      0x01:
        en: 'Fault present'
        fr: 'Défaut présent'
        es: 'Fallo presente'
        de: 'Fehler vorhanden'
        it: 'Guasto presente'
        pl: 'Obecna usterka'
        ru: 'Неисправность присутствует'
        zh: '存在故障'
        hu: 'Hiba jelen van'
        pt: 'Falha presente'

  UNUSED_1:
    bits: '2.4-2.0'
    unused: true

  VOLUMETRIC_INHIBIT_BUTTON:
    bits: '3.7'
    comment:
      en: 'Volumetric protection inhibition (button pressed > 1 s)'
      fr: 'Inhibition de la protection volumétrique (appui > 1 seconde)'
      es: 'Inhibición de la protección volumétrica (pulsación > 1 segundo)'
      de: 'Deaktivierung der volumetrischen Überwachung (Tastendruck > 1 Sekunde)'
      it: 'Inibizione della protezione volumetrica (pressione > 1 secondo)'
      pl: 'Wyłączenie ochrony wolumetrycznej (naciśnięcie > 1 sekunda)'
      ru: 'Отключение объёмной защиты (нажатие > 1 секунды)'
      zh: '空间保护抑制(按下超过1秒)'
      hu: 'Térfogati védelem letiltása (gombnyomás > 1 másodperc)'
      pt: 'Inibição da proteção volumétrica (botão pressionado > 1 s)'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No inhibition'
        fr: 'Pas d''inhibition'
        es: 'Sin inhibición'
        de: 'Keine Sperrung'
        it: 'Nessuna inibizione'
        pl: 'Brak blokady'
        ru: 'Нет блокировки'
        zh: '无禁止'
        hu: 'Nincs tiltás'
        pt: 'Sem inibição'
      0x01:
        en: 'Volumetric detection inhibited'
        fr: 'Inhibition de la détection volumétrique'
        es: 'Inhibición de la detección volumétrica'
        de: 'Volumetrische Erkennung gesperrt'
        it: 'Inibizione del rilevamento volumetrico'
        pl: 'Zablokowana detekcja wolumetryczna'
        ru: 'Объёмное обнаружение заблокировано'
        zh: '容积探测已禁用'
        hu: 'A térfogati érzékelés letiltva'
        pt: 'Inibição da deteção volumétrica'

  UNUSED_2:
    bits: '3.6-3.0'
    unused: true

  HAZARD_LAMPS_REQUEST:
    bits: '4.7'
    comment:
      en: 'Break-in detected: request to flash the hazard lamps (visual indication only)'
      fr: 'Détection d''effraction : demande d''allumage des feux de détresse (indication visuelle uniquement)'
      es: 'Detección de intrusión: solicitud de encendido de las luces de emergencia (indicación visual únicamente)'
      de: 'Einbruch erkannt: Anforderung zum Blinken der Warnblinkanlage (nur visuelle Anzeige)'
      it: 'Intrusione rilevata: richiesta di accensione delle luci di emergenza (solo indicazione visiva)'
      pl: 'Wykryto włamanie: żądanie włączenia świateł awaryjnych (tylko wskazanie wizualne)'
      ru: 'Обнаружено вторжение: запрос на включение аварийной сигнализации (только визуальная индикация)'
      zh: '检测到非法闯入:请求闪烁危险警示灯(仅作视觉提示)'
      hu: 'Betörés észlelve: a vészvillogó felkérése (csak vizuális jelzés)'
      pt: 'Deteção de intrusão: pedido de acendimento dos piscas de emergência (indicação visual apenas)'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
        en: 'Hazard lamps requested'
        fr: 'Demande warning'
        es: 'Solicitud de luces de emergencia'
        de: 'Anforderung Warnblinker'
        it: 'Richiesta luci di emergenza'
        pl: 'Żądanie świateł awaryjnych'
        ru: 'Запрос аварийной сигнализации'
        zh: '危险报警灯请求'
        hu: 'Vészvillogó kérve'
        pt: 'Pedido de luzes de emergência'

  UNUSED_3:
    bits: '4.6-4.0'
    unused: true

  FOOTER:
    bits: '5.7-5.0'
    comment:
      en: 'End-of-frame marker byte of the in-frame reply (usage defined by the VAN network rules)'
      fr: 'Marqueur de fin de trame'
      es: 'Byte marcador de fin de trama de la respuesta en trama'
      de: 'Kennzeichnungsbyte für das Rahmenende der In-Frame-Antwort'
      it: 'Byte marcatore di fine frame della risposta in-frame'
      pl: 'Bajt znacznika końca ramki odpowiedzi w ramce'
      ru: 'Байт-маркер конца кадра ответа в кадре'
      zh: '帧内应答结束标记字节'
      hu: 'Az üzeneten belüli válasz záró jelölőbájtja'
      pt: 'Byte marcador de fim de trama da resposta em trama'
    type: 'uint'
