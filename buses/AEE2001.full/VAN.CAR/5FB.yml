id: 0x5FB
name: 'FRONT_LIGHTING_STATUS'
type: 'van'
length: 2
comment:
  en: 'Front lighting unit bulb diagnostic status (read-back of each bulb output).'
  fr: 'État des ampoules de feux de position, de croisement, de route et antibrouillard avant.'
  es: 'Estado de diagnóstico de las bombillas de la unidad de iluminación delantera (lectura de cada salida de bombilla).'
  de: 'Diagnosestatus der Lampen der vorderen Beleuchtungseinheit (Rücklesung jedes Lampenausgangs).'
  it: 'Stato diagnostico delle lampadine dell''unità di illuminazione anteriore (rilettura di ciascuna uscita lampadina).'
  pl: 'Stan diagnostyczny żarówek przedniego modułu oświetlenia (odczyt zwrotny każdego wyjścia żarówki).'
  ru: 'Диагностический статус ламп переднего светового модуля (обратное считывание каждого выхода лампы).'
  zh: '前照明单元灯泡诊断状态(每个灯泡输出的回读)。'
  hu: 'Az elülső világítóegység izzóinak diagnosztikai állapota (minden izzókimenet visszaolvasása).'
  pt: 'Estado de diagnóstico das lâmpadas do bloco ótico dianteiro (releitura de cada saída de lâmpada).'
periodicity: ['50ms']
senders: ['BOP']
receivers: ['BSI']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['BSI']

signals:
  UNUSED_1:
    bits: '1.7-1.0'
    unused: true

  RIGHT_LOW_BEAM_STATUS:
    bits: '2.7'
    comment:
      en: 'Right low beam bulb status (0 = fault, 1 = OK; polarity differs from the other bulbs)'
      fr: 'État de l''ampoule du feu de croisement droit (0 = défaut, 1 = normal ; polarité différente des autres ampoules)'
      es: 'Estado de la bombilla de la luz de cruce derecha (0 = fallo, 1 = normal; polaridad diferente de las demás bombillas)'
      de: 'Status der rechten Abblendlichtlampe (0 = Fehler, 1 = normal; Polarität abweichend von den anderen Lampen)'
      it: 'Stato della lampadina dell''anabbagliante destro (0 = guasto, 1 = normale; polarità diversa dalle altre lampadine)'
      pl: 'Stan żarówki prawego światła mijania (0 = usterka, 1 = normalny; biegunowość inna niż pozostałych żarówek)'
      ru: 'Состояние правой лампы ближнего света (0 = неисправность, 1 = норма; полярность отличается от других ламп)'
      zh: '右近光灯灯泡状态(0=故障,1=正常;极性与其他灯泡不同)'
      hu: 'A jobb tompított fényszóró izzójának állapota (0 = hiba, 1 = normál; a polaritás eltér a többi izzóétól)'
      pt: 'Estado da lâmpada da luz de cruzamento direita (0 = falha, 1 = normal; polaridade diferente das outras lâmpadas)'
    type: 'bool'
    default: 0x01
    values:
      0x00:
        en: 'Fault'
        fr: 'Défaut'
        es: 'Fallo'
        de: 'Fehler'
        it: 'Guasto'
        pl: 'Usterka'
        ru: 'Неисправность'
        zh: '故障'
        hu: 'Hiba'
        pt: 'Falha'
      0x01:
        en: 'Normal'
        fr: 'Normal'
        es: 'Normal'
        de: 'Normal'
        it: 'Normale'
        pl: 'Normalny'
        ru: 'Нормальный'
        zh: '正常'
        hu: 'Normál'
        pt: 'Normal'

