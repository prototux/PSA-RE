  ADDITIVE_INJECTED_TOTAL:
    bits: '3.7-4.0'
    comment:
      en: 'Cumulated additive quantity injected since the particulate filter was new, 16-bit MSB first split across two bytes (raw > 65530 invalid)'
      fr: 'Quantité cumulée d''additif injecté depuis que le filtre à particules est neuf, sur 16 bits MSB en premier répartis sur deux octets (brut > 65530 invalide)'
      es: 'Cantidad acumulada de aditivo inyectado desde que el filtro de partículas era nuevo, 16 bits con el MSB primero repartidos en dos bytes (bruto > 65530 inválido)'
      de: 'Kumulierte eingespritzte Additivmenge seit Neuzustand des Partikelfilters, 16 Bit, MSB zuerst, auf zwei Byte verteilt (Rohwert > 65530 ungültig)'
      it: 'Quantità cumulata di additivo iniettato da quando il filtro antiparticolato era nuovo, 16 bit con MSB per primo su due byte (grezzo > 65530 non valido)'
      pl: 'Skumulowana ilość dodatku wtryśniętego od nowości filtra cząstek stałych, 16 bitów, MSB jako pierwszy, w dwóch bajtach (surowa wartość > 65530 nieprawidłowa)'
      ru: 'Суммарное количество присадки, впрыснутой с момента установки нового сажевого фильтра, 16 бит, старший байт первым, в двух байтах (сырое значение > 65530 недопустимо)'
      zh: '自颗粒过滤器全新以来累计喷射的添加剂量,16位,高字节在前,分两个字节存储(原始值大于65530无效)'
      hu: 'A részecskeszűrő új állapota óta befecskendezett adalék összesített mennyisége, 16 bit, MSB elöl, két bájtra osztva (65530 feletti nyers érték érvénytelen)'
      pt: 'Quantidade acumulada de aditivo injetado desde que o filtro de partículas era novo, em 16 bits com o MSB primeiro repartidos em dois bytes (bruto > 65530 inválido)'
    type: 'uint'
    factor: 50
    min: 0
    max: 3276500
    units: 'mg'
    invalid: 0xFFFF
    default: 0xFFFF

