id: 0x4E0
name: 'BCD_STATUS'
type: 'van'
length: 7
comment:
  en: 'Status of the particulate filter additive injection ECU: operational flag and fault flags, cumulated injected additive, fuel cap sensor, additive level and particulate filter downstream temperature.'
  fr: 'État du système d''injection d''additif : indicateur de fonctionnement et défauts, quantité d''additif injecté cumulée, capteur de bouchon de réservoir, niveau d''additif et température en aval du filtre à particules.'
  es: 'Estado de la centralita de inyección de aditivo del filtro de partículas: indicador de funcionamiento y de fallo, cantidad acumulada de aditivo inyectado, sensor del tapón de depósito, nivel de aditivo y temperatura aguas abajo del filtro de partículas.'
  de: 'Status des Steuergeräts für die Additiv-Einspritzung des Partikelfilters: Betriebs- und Fehlerkennung, kumulierte eingespritzte Additivmenge, Tankdeckelsensor, Additivstand und Temperatur stromabwärts des Partikelfilters.'
  it: 'Stato della centralina di iniezione additivo del filtro antiparticolato: indicatore di funzionamento e guasto, quantità cumulata di additivo iniettato, sensore tappo serbatoio, livello additivo e temperatura a valle del filtro antiparticolato.'
  pl: 'Stan sterownika wtrysku dodatku do filtra cząstek stałych: flaga pracy i usterek, skumulowana ilość wtryśniętego dodatku, czujnik korka wlewu, poziom dodatku i temperatura za filtrem cząstek stałych.'
  ru: 'Статус блока управления впрыском присадки сажевого фильтра: флаги работы и неисправности, накопленное количество впрыснутой присадки, датчик крышки бака, уровень присадки и температура за сажевым фильтром.'
  zh: '颗粒物过滤器添加剂喷射控制单元状态:运行和故障标志、累计喷射添加剂量、油箱盖传感器、添加剂液位及颗粒物过滤器下游温度。'
  hu: 'A részecskeszűrő adalékbefecskendező vezérlőegységének állapota: üzemi és hibajelző, összesített befecskendezett adalékmennyiség, tanksapka-érzékelő, adalékszint és a részecskeszűrő utáni hőmérséklet.'
  pt: 'Estado da unidade de controlo de injeção de aditivo do filtro de partículas: indicador operacional e indicadores de avaria, aditivo injetado acumulado, sensor da tampa do depósito, nível de aditivo e temperatura a jusante do filtro de partículas.'
periodicity: ['1000ms']
senders: ['ADDGO']
receivers: ['BSI']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['BSI']

signals:
  HEADER:
    bits: '1.7-1.0'
    comment:
      en: 'Start-of-frame marker byte of the in-frame reply (usage defined by the VAN network rules)'
      fr: 'Marqueur de début de trame'
      es: 'Byte marcador de inicio de trama de la respuesta en trama'
      de: 'Kennzeichnungsbyte für den Rahmenanfang der In-Frame-Antwort'
      it: 'Byte marcatore di inizio frame della risposta in-frame'
      pl: 'Bajt znacznika początku ramki odpowiedzi w ramce'
      ru: 'Байт-маркер начала кадра ответа в кадре'
      zh: '帧内应答起始标记字节'
      hu: 'Az üzeneten belüli válasz kezdő jelölőbájtja'
      pt: 'Byte marcador de início de trama da resposta em trama'
    type: 'uint'

  ADDITIVE_SYSTEM_OPERATIONAL:
    bits: '2.7'
    comment:
      en: 'Additive ECU able to dose additive (system state combining pump, injector, sensor and gauge faults)'
      fr: 'Le calculateur d''additivation peut doser l''additif (état combinant les défauts pompe, injecteur, capteur et jauge)'
      es: 'La centralita de aditivo puede dosificar el aditivo (estado que combina los fallos de bomba, inyector, sensor y sonda)'
      de: 'Additiv-Steuergerät kann Additiv dosieren (Zustand aus Pumpen-, Injektor-, Sensor- und Anzeigefehlern)'
      it: 'La centralina additivo è in grado di dosare l''additivo (stato che combina i guasti di pompa, iniettore, sensore e indicatore)'
      pl: 'Sterownik dodatku jest w stanie dozować dodatek (stan łączący usterki pompy, wtryskiwacza, czujnika i wskaźnika)'
      ru: 'Блок управления присадкой способен дозировать присадку (состояние, объединяющее неисправности насоса, форсунки, датчика и указателя)'
      zh: '添加剂控制单元能够计量添加剂(综合泵、喷油器、传感器和液位故障的状态)'
      hu: 'Az adalékadagoló vezérlőegység képes adagolni az adalékot (a szivattyú, injektor, érzékelő és jelző hibáit összesítő állapot)'
      pt: 'A centralina de aditivo consegue doseá-lo (estado que combina falhas da bomba, injetor, sensor e sonda)'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Unable to dose additive'
        fr: 'Incapable d''additiver'
        es: 'Incapaz de dosificar el aditivo'
        de: 'Additivdosierung nicht möglich'
        it: 'Impossibile dosare l''additivo'
        pl: 'Nie można dozować dodatku'
        ru: 'Невозможно дозировать присадку'
        zh: '无法加注添加剂'
        hu: 'Az adalék adagolása nem lehetséges'
        pt: 'Incapaz de dosear o aditivo'
      0x01:
        en: 'Able to dose additive'
        fr: 'Capable d''additiver'
        es: 'Capaz de dosificar aditivo'
        de: 'Fähig zur Additivdosierung'
        it: 'In grado di dosare l''additivo'
        pl: 'Zdolny do dozowania dodatku'
        ru: 'Способен дозировать присадку'
        zh: '能够添加添加剂'
        hu: 'Adalékanyag adagolására képes'
        pt: 'Capaz de dosear aditivo'

