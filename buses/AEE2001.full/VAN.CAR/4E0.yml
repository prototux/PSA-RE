      pl: 'Ostrzeżenie o minimalnym poziomie zbiornika dodatku (osiągane, gdy pozostały dodatek wystarcza na ok. 3000 km)'
      ru: 'Предупреждение о минимальном уровне бака присадки (срабатывает, когда оставшейся присадки хватает примерно на 3000 км)'
      zh: '添加剂箱最低液位警告(剩余添加剂可支持约3000公里时触发)'
      hu: 'Az adaléktartály minimális szintjének figyelmeztetése (akkor jelez, ha a maradék adalék kb. 3000 km-re elegendő)'
      pt: 'Alerta de nível mínimo do depósito de aditivo (atingida quando o aditivo restante cobre cerca de 3000 km)'
