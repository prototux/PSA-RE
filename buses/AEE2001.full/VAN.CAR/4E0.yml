      en: 'Particulate filter outlet temperature sensor fault (always 0 on engines without this sensor)'
      fr: 'Défaut du capteur de température en sortie du filtre à particules (toujours à 0 sur les moteurs sans ce capteur)'
      es: 'Fallo del sensor de temperatura de salida del filtro de partículas (siempre a 0 en motores sin este sensor)'
