      it: 'Guasto del sensore di temperatura a valle del filtro antiparticolato (sempre 0 sui motori privi di questo sensore)'
      pl: 'Usterka czujnika temperatury za filtrem cząstek stałych (zawsze 0 w silnikach bez tego czujnika)'
      ru: 'Неисправность датчика температуры на выходе сажевого фильтра (всегда 0 на двигателях без этого датчика)'
      zh: '颗粒过滤器出口温度传感器故障(无此传感器的发动机始终为0)'
      hu: 'A részecskeszűrő kimeneti hőmérséklet-érzékelőjének hibája (az érzékelő nélküli motoroknál mindig 0)'
      pt: 'Falha do sensor de temperatura à saída do filtro de partículas (sempre a 0 em motores sem este sensor)'
