      fr: 'Alerte de niveau minimum du réservoir d''additif (atteinte quand l''additif restant permet environ 3000 km)'
      es: 'Alerta de nivel mínimo del depósito de aditivo (alcanzada cuando el aditivo restante cubre unos 3000 km)'
