id: 0x452
name: 'DRIVING_SCHOOL_MODULE_STATUS'
type: 'van'
length: 8
comment:
  en: 'Driving-school module push-button states (instructor lighting, indicator, fog, horn controls and dual-pedal activation), debounced.'
  fr: 'États débruités des boutons poussoirs du module auto-école (commandes éclairage, clignotant, antibrouillard, avertisseur moniteur et activation double pédale).'
  es: 'Estados filtrados de los pulsadores del módulo de autoescuela (mandos de iluminación, intermitente, antiniebla, claxon del instructor y activación de doble pedal).'
  de: 'Entprellte Tasterzustände des Fahrschulmoduls (Licht-, Blinker-, Nebelschlussleuchten- und Hupensteuerung des Fahrlehrers sowie Doppelpedalaktivierung).'
  it: 'Stati filtrati dei pulsanti del modulo autoscuola (comandi luci, indicatori, fendinebbia, clacson istruttore e attivazione doppio pedale).'
  pl: 'Odfiltrowane stany przycisków modułu nauki jazdy (sterowanie światłami, kierunkowskazem, światłami przeciwmgielnymi, klaksonem instruktora i aktywacją podwójnego pedału).'
  ru: 'Отфильтрованные состояния кнопок модуля автошколы (управление светом, указателями поворота, противотуманными фарами, звуковым сигналом инструктора и активацией сдвоенной педали).'
  zh: '驾校模块按钮状态(经消抖处理):教练灯光、转向灯、雾灯、喇叭控制及双踏板激活。'
  hu: 'Az autósiskola-modul nyomógombjainak (zajszűrt) állapotai: oktatói világítás-, index-, ködlámpa- és kürtvezérlés, valamint duplapedál-aktiválás.'
  pt: 'Estados dos botões do módulo de duplo comando (auto-escola) (iluminação do instrutor, comandos de pisca, nevoeiro, buzina e ativação do pedal duplo), com filtragem antirrebentos.'
periodicity: ['50ms']
senders: ['MAE']
receivers: ['BSI']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['BSI']

