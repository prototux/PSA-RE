id: 0x4D2
name: 'DRIVING_SCHOOL_MODULE_COMMAND'
type: 'van'
length: 4
comment:
  en: 'Commands to the driving-school (dual-control) module: instructor-side lighting tell-tales and push-button indicator lamps.'
  fr: 'Commandes vers le module auto-école (double commande) : témoins d''éclairage et voyants des boutons-poussoirs côté moniteur.'
  es: 'Comandos al módulo de autoescuela (doble mando): testigos de iluminación y pilotos de los pulsadores del instructor.'
  de: 'Befehle an das Fahrschulmodul (Doppelsteuerung): Beleuchtungskontrollleuchten und Tasten-Kontrollleuchten auf der Fahrlehrerseite.'
  it: 'Comandi al modulo scuola guida (doppio comando): spie di illuminazione e spie dei pulsanti lato istruttore.'
  pl: 'Polecenia do modułu nauki jazdy (podwójne sterowanie): kontrolki oświetlenia i lampki przycisków po stronie instruktora.'
  ru: 'Команды для модуля автошколы (двойное управление): индикаторы освещения и кнопочные индикаторы со стороны инструктора.'
  zh: '发送给驾校(双控)模块的命令:教练侧照明指示灯和按钮指示灯。'
  hu: 'Az autósiskola (kettős vezérlésű) modulnak küldött parancsok: oktatói oldali világítás- és nyomógomb-jelzőfények.'
  pt: 'Comandos para o módulo de duplo comando (auto-escola): avisadores de iluminação do lado do instrutor e luzes indicadoras dos botões.'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['MAE']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  SIDE_LAMPS_TELLTALE:
    bits: '1.7'
    comment:
      en: 'Side lamps telltale (instructor panel)'
      fr: 'Témoin de feux de position (tableau moniteur)'
      es: 'Testigo de luces de posición (panel del instructor)'
      de: 'Kontrollleuchte Standlicht (Fahrlehrer-Bedienfeld)'
      it: 'Spia delle luci di posizione (pannello istruttore)'
      pl: 'Kontrolka świateł postojowych (panel instruktora)'
      ru: 'Индикатор габаритных огней (панель инструктора)'
      zh: '示宽灯指示灯(教练面板)'
      hu: 'A helyzetjelző lámpa jelzőlámpája (oktatói panel)'
      pt: 'Testemunho das luzes de presença (painel do instrutor)'
    type: 'bool'
