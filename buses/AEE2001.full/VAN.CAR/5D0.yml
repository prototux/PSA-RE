id: 0x5D0
name: 'TRANSPONDER_RESPONSE'
type: 'van'
length: 13
comment:
  en: 'Immobiliser transponder reading from the steering column module: response flags, key presence, attempt number, base-station state machine flags, transponder identifier and encrypted response.'
  fr: 'Lecture du transpondeur d''antidémarrage par le module de colonne de direction : indicateurs de réponse, présence de clé, numéro d''essai, état de la base station, identifiant transpondeur et réponse chiffrée.'
  es: 'Lectura del transpondedor del inmovilizador por el módulo de la columna de dirección: indicadores de respuesta, presencia de llave, número de intento, estado de la base station, identificador del transpondedor y respuesta cifrada.'
  de: 'Wegfahrsperren-Transponderauslesung durch das Lenksäulenmodul: Antwortflags, Schlüsselanwesenheit, Versuchsnummer, Statusflags der Basisstation, Transponderkennung und verschlüsselte Antwort.'
  it: 'Lettura del transponder dell''immobilizer da parte del modulo del piantone: flag di risposta, presenza chiave, numero di tentativo, flag di stato della base station, identificativo transponder e risposta cifrata.'
  pl: 'Odczyt transpondera immobilisera przez moduł kolumny kierownicy: flagi odpowiedzi, obecność kluczyka, numer próby, flagi stanu stacji bazowej, identyfikator transpondera i zaszyfrowana odpowiedź.'
  ru: 'Считывание транспондера иммобилайзера модулем рулевой колонки: флаги ответа, наличие ключа, номер попытки, флаги состояния базовой станции, идентификатор транспондера и зашифрованный ответ.'
  zh: '转向柱模块读取的防盗锁止应答器信息:响应标志、钥匙存在、尝试次数、基站状态机标志、应答器标识及加密响应。'
  hu: 'Az indításgátló transzponderének leolvasása a kormányoszlop-modul által: válaszjelzők, kulcs jelenléte, próbaszám, bázisállomás állapotgép-jelzői, transzponderazonosító és titkosított válasz.'
  pt: 'Leitura do transponder do imobilizador pelo módulo da coluna de direção: indicadores de resposta, presença da chave, número da tentativa, indicadores da máquina de estados da base station, identificador do transponder e resposta encriptada.'
periodicity: ['1000ms', 'trigger']
senders: ['HDC']
receivers: ['BSI']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['BSI']

