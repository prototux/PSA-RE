id: 0x448
name: 'AIRBAG_LAMPS_STATUS'
type: 'van'
length: 5
comment:
  en: 'Airbag system warning lamp requests: passenger airbag off lamp, rollover lamp and general airbag lamp (on/off and steady/flashing).'
  fr: 'Demandes des voyants du système airbag : voyant airbag passager désactivé, voyant retournement et voyant général airbag (marche/arrêt et fixe/clignotant).'
  es: 'Solicitudes de los testigos del sistema de airbag: testigo de airbag del pasajero desactivado, testigo de vuelco y testigo general de airbag (encendido/apagado y fijo/parpadeante).'
  de: 'Anforderungen der Airbag-Kontrollleuchten: Beifahrer-Airbag-Aus-Leuchte, Überschlag-Kontrollleuchte und allgemeine Airbag-Kontrollleuchte (ein/aus und dauerhaft/blinkend).'
  it: 'Richieste delle spie del sistema airbag: spia airbag passeggero disattivato, spia ribaltamento e spia generale airbag (acceso/spento e fisso/lampeggiante).'
  pl: 'Żądania kontrolek systemu poduszek powietrznych: kontrolka wyłączenia poduszki pasażera, kontrolka przewrócenia i ogólna kontrolka poduszek powietrznych (włącz/wyłącz i ciągłe/migające).'
  ru: 'Запросы индикаторов системы подушек безопасности: индикатор отключения подушки пассажира, индикатор опрокидывания и общий индикатор подушек безопасности (вкл/выкл и постоянный/мигающий).'
  zh: '安全气囊系统警示灯请求:乘客安全气囊关闭指示灯、翻车指示灯及安全气囊总指示灯(开/关及常亮/闪烁)。'
  hu: 'A légzsákrendszer jelzőlámpáinak kérései: utas légzsák kikapcsolva lámpa, borulásjelző lámpa és általános légzsák jelzőlámpa (be/ki és folyamatos/villogó).'
  pt: 'Pedidos das luzes avisadoras do sistema de airbags: luz de airbag do passageiro desligado, luz de capotamento e luz geral do airbag (ligada/desligada e fixa/intermitente).'
periodicity: ['500ms']
senders: ['RBG']
receivers: ['BSI']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['BSI']

signals:
  HEADER:
    bits: '1.7-1.0'
    comment:
      en: 'Start-of-frame marker byte of the in-frame reply (usage defined by the VAN network rules)'
      fr: 'Marqueur de début de trame'
      es: 'Byte marcador de inicio de trama de la respuesta en trama'
      de: 'Kennzeichnungsbyte für den Rahmenanfang der In-Frame-Antwort'
      it: 'Byte marcatore di inizio frame della risposta in-frame'
      pl: 'Bajt znacznika początku ramki odpowiedzi w ramce'
      ru: 'Байт-маркер начала кадра ответа в кадре'
      zh: '帧内应答起始标记字节'
      hu: 'Az üzeneten belüli válasz kezdő jelölőbájtja'
      pt: 'Byte marcador de início de trama da resposta em trama'
    type: 'uint'

  UNUSED_1:
    bits: '2.7-2.2'
    unused: true

  PASSENGER_AIRBAG_OFF_LAMP_MODE:
    bits: '2.1'
    comment:
      en: 'Passenger airbag off lamp steady or flashing'
      fr: 'Fréquence d''allumage du voyant sac passager'
      es: 'Testigo de airbag de pasajero desactivado fijo o parpadeante'
      de: 'Kontrollleuchte Beifahrerairbag aus dauerhaft oder blinkend'
      it: 'Spia airbag passeggero disattivato fissa o lampeggiante'
      pl: 'Kontrolka wyłączonej poduszki pasażera świeci ciągle lub miga'
      ru: 'Индикатор отключённой подушки пассажира горит постоянно или мигает'
      zh: '副驾驶安全气囊关闭指示灯常亮或闪烁'
      hu: 'Az utasoldali légzsák kikapcsolva lámpa folyamatosan világít vagy villog'
      pt: 'Indicador de airbag do passageiro desligado fixo ou intermitente'
    type: 'bool'
    default: 0x01
    values:
      0x00:
        en: 'Flashing'
        fr: 'Clignotant'
        es: 'Intermitente'
        de: 'Blinkend'
        it: 'Lampeggiante'
        pl: 'Migający'
        ru: 'Мигающий'
        zh: '闪烁'
        hu: 'Villogó'
        pt: 'Intermitente'
      0x01:
