id: 0x5D8
name: 'RAIN_LIGHT_SENSOR_STATUS'
type: 'van'
length: 7
comment:
  en: 'Rain/light sensor requests: automatic headlamp on/off and trigger type, automatic wiper state and intermittent delay, stabilisation flags and data validity bits.'
  fr: 'Demandes du capteur de pluie et de luminosité : allumage/extinction automatique des feux et type de déclenchement, état d''essuyage automatique et délai intermittent, indicateurs de stabilisation et bits de validité des données.'
  es: 'Solicitudes del sensor de lluvia y luz: encendido/apagado automático de faros y tipo de activación, estado del limpiaparabrisas automático y retardo intermitente, indicadores de estabilización y bits de validez de datos.'
  de: 'Anforderungen des Regen-/Lichtsensors: automatisches Ein-/Ausschalten der Scheinwerfer und Auslösetyp, Status des Intervallwischers und Intervallverzögerung, Stabilisierungskennzeichen und Datengültigkeitsbits.'
  it: 'Richieste del sensore pioggia/luce: accensione/spegnimento automatico dei fari e tipo di attivazione, stato del tergicristallo automatico e ritardo intermittente, flag di stabilizzazione e bit di validità dei dati.'
  pl: 'Żądania czujnika deszczu/światła: automatyczne włączanie/wyłączanie świateł i typ wyzwolenia, stan wycieraczek automatycznych i opóźnienie pracy przerywanej, flagi stabilizacji i bity ważności danych.'
  ru: 'Запросы датчика дождя/света: автоматическое включение/выключение фар и тип срабатывания, состояние автоматических дворников и задержка прерывистого режима, флаги стабилизации и биты достоверности данных.'
  zh: '雨光传感器请求:大灯自动开关及触发类型、自动雨刷状态及间歇延时、稳定标志和数据有效位。'
  hu: 'Az eső-/fényérzékelő kérései: fényszóró automatikus be-/kikapcsolása és kiváltás típusa, automatikus ablaktörlő állapota és szakaszos késleltetés, stabilizációs jelzők és adatérvényességi bitek.'
  pt: 'Pedidos do sensor de chuva/luz: ligar/desligar automático dos faróis e tipo de acionamento, estado do limpa-para-brisas automático e atraso intermitente, indicadores de estabilização e bits de validade de dados.'
periodicity: ['50ms']
senders: ['CDPL']
receivers: ['BSI']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['BSI']

signals:
  HEADER:
    bits: '1.7-1.0'
    comment:
      en: 'Start-of-frame marker byte of the in-frame reply (usage defined by the VAN network rules)'
      fr: 'Marqueur de début de trame'
