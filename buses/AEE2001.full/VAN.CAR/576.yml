id: 0x576
name: 'DRIVER_DOOR_MOVEMENT_COMMAND'
type: 'van'
length: 2
comment:
  en: 'Window and mirror movement commands from the body controller to the driver door module, plus vehicle moving / roof / door state.'
  fr: 'Commandes de mouvement de vitre et de rétroviseur de la BSI vers le module de porte conducteur, ainsi qu''état de roulage véhicule / toit / porte.'
  es: 'Órdenes de movimiento de ventanilla y de espejo de la BSI al módulo de puerta del conductor, además del estado de marcha del vehículo / techo / puerta.'
  de: 'Fenster- und Spiegelbewegungsbefehle der BSI an das Fahrertürmodul, sowie Fahrzeugbewegungs-/Dach-/Türzustand.'
  it: 'Comandi di movimento del finestrino e dello specchietto dalla BSI al modulo porta conducente, oltre allo stato di marcia veicolo / tettuccio / porta.'
  pl: 'Polecenia ruchu szyby i lusterka z BSI do modułu drzwi kierowcy, a także stan jazdy pojazdu / dachu / drzwi.'
  ru: 'Команды движения стекла и зеркала от BSI к модулю двери водителя, а также состояние движения автомобиля / крыши / двери.'
  zh: '由BSI发送给驾驶员车门模块的车窗及后视镜运动命令，以及车辆行驶/天窗/车门状态。'
  hu: 'Az ablak- és tükörmozgás-parancsok a BSI-től a vezetőoldali ajtómodul felé, valamint a jármű haladási / tető- / ajtóállapota.'
  pt: 'Comandos de movimento do vidro e do espelho do computador de servidão para o módulo da porta do condutor, além do estado de veículo em movimento / teto / porta.'
periodicity: ['50ms']
senders: ['BSI']
receivers: ['EDP_C']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  VEHICLE_MOVING:
    bits: '1.7'
    comment:
      en: 'Vehicle moving'
      fr: 'Véhicule roulant'
      es: 'Vehículo en movimiento'
      de: 'Fahrzeug in Bewegung'
      it: 'Veicolo in movimento'
      pl: 'Pojazd w ruchu'
      ru: 'Автомобиль в движении'
      zh: '车辆行驶中'
      hu: 'Jármű mozgásban'
      pt: 'Veículo em movimento'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Vehicle not moving'
        fr: 'Véhicule non roulant'
        es: 'Vehículo sin circular'
        de: 'Fahrzeug bewegt sich nicht'
        it: 'Veicolo non in movimento'
        pl: 'Pojazd nie porusza się'
        ru: 'Автомобиль неподвижен'
