id: 0x570
name: 'RETRACTABLE_ROOF_COMMAND'
type: 'van'
length: 5
comment:
  en: 'BSI to retractable hard-top controller: switch illumination data and door/window state used by the roof sequence.'
  fr: 'De la BSI vers le calculateur du toit escamotable : éclairage du contacteur et état porte/vitre utilisé par la séquence de toit.'
  es: 'De la BSI a la centralita del techo retráctil: iluminación del interruptor y estado de puerta/ventanilla usados en la secuencia del techo.'
  de: 'Vom BSI zum Steuergerät des versenkbaren Hardtops: Schalterbeleuchtung und Tür-/Fensterstatus für die Dachsequenz.'
  it: 'Dalla BSI alla centralina del tettuccio rigido retrattile: illuminazione dell''interruttore e stato porta/vetro usati nella sequenza del tetto.'
  pl: 'Od BSI do sterownika chowanego dachu twardego: podświetlenie przełącznika i stan drzwi/szyby używane w sekwencji dachu.'
  ru: 'От BSI к блоку управления складной жёсткой крышей: подсветка выключателя и состояние двери/стекла, используемые в последовательности крыши.'
  zh: '从BSI到可收藏硬顶控制器:开关照明数据以及车顶动作序列所用的车门/车窗状态。'
  hu: 'A BSI-től a behúzható kemény tető vezérlőjéhez: kapcsolóvilágítás és az ajtó/ablak állapota a tetőszekvenciához.'
  pt: 'Da BSI para o controlador do teto rígido retrátil: dados de iluminação dos comutadores e estado das portas/vidros utilizados na sequência do teto.'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['BTE']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

