  FUEL_PUMP_CUTOFF_COMMAND:
    bits: '4.5'
    comment:
      en: 'Fuel pump cut-off (on crash); outside crash situations the pump relay is hard-wired to the engine ECU'
      fr: 'Coupure de la pompe à carburant (sur choc) ; hors situation de choc, le relais est câblé directement au calculateur moteur'
      es: 'Corte de la bomba de combustible (en caso de impacto); fuera de situaciones de choque, el relé está cableado directamente a la ECU del motor'
      de: 'Kraftstoffpumpenabschaltung (bei Crash); außerhalb von Crashsituationen ist das Relais fest mit dem Motorsteuergerät verdrahtet'
      it: 'Interruzione della pompa carburante (in caso di urto); al di fuori di situazioni di urto il relè è cablato direttamente alla centralina motore'
      pl: 'Odcięcie pompy paliwa (przy zderzeniu); poza sytuacją zderzenia przekaźnik jest bezpośrednio okablowany do sterownika silnika'
      ru: 'Отключение топливного насоса (при аварии); вне аварийных ситуаций реле напрямую соединено с блоком управления двигателем'
      zh: '燃油泵切断(碰撞时);非碰撞情况下继电器直接硬接线至发动机ECU'
      hu: 'Az üzemanyag-szivattyú lekapcsolása (ütközéskor); ütközésen kívül a relé közvetlenül a motorvezérlő egységhez van vezetékezve'
      pt: 'Corte da bomba de combustível (em caso de impacto); fora de situações de choque, o relé está cablado diretamente à unidade de controlo do motor'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No cut-off'
        fr: 'Pas de coupure'
        es: 'Sin corte'
        de: 'Keine Abschaltung'
        it: 'Nessun taglio'
