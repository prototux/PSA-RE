      pl: 'Przekaźnik przednich świateł przeciwmgielnych; w niektórych pojazdach z lampami wyładowczymi (ksenon) to wyjście dostarcza zasilanie +APC'
      ru: 'Реле передних противотуманных фар; на некоторых автомобилях с газоразрядными (ксеноновыми) лампами этот выход подаёт питание +APC'
