  WHEEL1_MESSAGE_TOGGLE:
    bits: '2.2'
    comment:
      en: 'Toggles on each valid message received from wheel 1 transmitter (0 at wake-up)'
      fr: 'Inversion à chaque réception d''un message valide du transmetteur de la roue 1 (0 au réveil)'
      es: 'Se invierte con cada mensaje válido recibido del transmisor de la rueda 1 (0 al despertar)'
      de: 'Wird bei jeder gültigen empfangenen Nachricht des Sendemoduls von Rad 1 invertiert (0 beim Aufwachen)'
      it: 'Si inverte a ogni messaggio valido ricevuto dal trasmettitore della ruota 1 (0 al risveglio)'
      pl: 'Zmienia się przy każdej poprawnej wiadomości odebranej od nadajnika koła 1 (0 po wybudzeniu)'
      ru: 'Инвертируется при каждом достоверном сообщении, принятом от передатчика колеса 1 (0 при пробуждении)'
      zh: '每次收到车轮 1 发射器的有效消息时翻转（唤醒时为 0）'
      hu: 'A(z) 1. kerék adójától érkező minden érvényes üzenetnél invertálódik (ébredéskor 0)'
      pt: 'Inverte a cada receção de uma mensagem válida do transmissor da roda 1 (0 no despertar)'
    type: 'bool'
