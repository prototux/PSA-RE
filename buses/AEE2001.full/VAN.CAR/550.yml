id: 0x550
name: 'TYRE_PRESSURE_STATUS'
type: 'van'
length: 17
comment:
  en: 'Tyre under-inflation detection data received by the steering column module for up to 5 wheels: transmitter mode, message toggle, pressure and message counter.'
  fr: 'Détection de sous-gonflage des roues, reçue par le module de colonne de direction pour jusqu''à 5 roues : mode de l''émetteur, bascule de message, pression et compteur de message.'
  es: 'Datos de detección de baja presión de neumáticos recibidos por el módulo de columna de dirección para hasta 5 ruedas: modo del transmisor, conmutación de mensaje, presión y contador de mensajes.'
  de: 'Vom Lenksäulenmodul empfangene Reifendruck-Unterdruckerkennungsdaten für bis zu 5 Räder: Sendermodus, Nachrichten-Umschaltung, Druck und Nachrichtenzähler.'
  it: 'Dati di rilevamento della sottopressione degli pneumatici ricevuti dal modulo piantone per un massimo di 5 ruote: modalità del trasmettitore, commutazione del messaggio, pressione e contatore dei messaggi.'
  pl: 'Dane wykrywania niedociśnienia opon odbierane przez moduł kolumny kierowniczej dla maks. 5 kół: tryb nadajnika, przełączanie komunikatu, ciśnienie i licznik komunikatów.'
  ru: 'Данные обнаружения недостаточного давления шин, получаемые модулем рулевой колонки для до 5 колёс: режим передатчика, переключение сообщения, давление и счётчик сообщений.'
  zh: '转向柱模块接收的最多5个车轮的轮胎欠压检测数据:发射器模式、消息切换、压力及消息计数器。'
  hu: 'A kormányoszlop-modul által fogadott, legfeljebb 5 kerékre vonatkozó gumiabroncs-alulnyomás érzékelési adatok: adó módja, üzenetváltás, nyomás és üzenetszámláló.'
  pt: 'Dados de deteção de subinsuflação dos pneus recebidos pelo módulo da coluna de direção para até 5 rodas: modo do transmissor, alternância de mensagem, pressão e contador de mensagens.'
periodicity: ['1000ms', 'trigger']
senders: ['HDC']
receivers: ['BSI']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['BSI']

signals:
  HEADER:
    bits: '1.7-1.0'
    comment:
      en: 'Start-of-frame marker byte of the in-frame reply (usage defined by the VAN network rules)'
      fr: 'Marqueur de début de trame'
      es: 'Byte marcador de inicio de trama de la respuesta en trama'
      de: 'Kennzeichnungsbyte für den Rahmenanfang der In-Frame-Antwort'
      it: 'Byte marcatore di inizio frame della risposta in-frame'
      pl: 'Bajt znacznika początku ramki odpowiedzi w ramce'
      ru: 'Байт-маркер начала кадра ответа в кадре'
      zh: '帧内应答起始标记字节'
      hu: 'Az üzeneten belüli válasz kezdő jelölőbájtja'
      pt: 'Byte marcador de início de trama da resposta em trama'
    type: 'uint'

