  BEAM_TOGGLE:
    bits: '2.4'
    comment:
      en: 'Low/high beam toggle (stalk pulled past the flash position sets the flash bit first, then this bit)'
      fr: 'Inversion feux de croisement/feux de route (tirer le commodo au-delà de l''appel de phares active d''abord le bit d''appel, puis ce bit)'
      es: 'Cambio entre luces de cruce y de carretera (tirar de la palanca más allá de la ráfaga activa primero el bit de ráfaga y luego este bit)'
      de: 'Umschalten Abblendlicht/Fernlicht (Ziehen des Hebels über die Lichthupenstellung hinaus setzt zuerst das Lichthupen-Bit, dann dieses Bit)'
      it: 'Inversione anabbaglianti/abbaglianti (tirando la leva oltre la posizione di lampeggio si attiva prima il bit di lampeggio, poi questo bit)'
      pl: 'Przełączenie świateł mijania/drogowych (pociągnięcie dźwigni za pozycję mignięcia najpierw ustawia bit mignięcia, potem ten bit)'
      ru: 'Переключение ближнего/дальнего света (при вытягивании рычага за положение мигания сначала устанавливается бит мигания, затем этот бит)'
      zh: '近光/远光切换（拨杆拉过闪灯位置时先置位闪灯位，再置位此位）'
      hu: 'Tompított/távolsági fény átkapcsolás (a kar villantási állás mögé húzásakor előbb a villantás bit áll be, majd ez a bit)'
      pt: 'Comutação médios/máximos (ao puxar a manete além da posição de piscar, ativa primeiro o bit de piscar e depois este bit)'
