id: 0x4EE
name: 'MEMORY_SEAT_MIRROR_MEMORY_STATUS'
type: 'van'
length: 15
comment:
  en: 'Mirror memory status from the driver memory seat module, polled by BSI with in-frame reply: recalled memory number with the mirror target positions, indexing deltas and approach modes.'
  fr: 'État mémoire des rétroviseurs du boîtier de mémorisation, interrogé par la BSI avec réponse dans la trame : numéro de mémoire rappelée, positions cibles des rétroviseurs, écarts d''indexation et modes de ralliement.'
  es: 'Estado de memoria de los retrovisores del módulo de memoria, consultado por la BSI con respuesta en la trama: número de memoria recuperada, posiciones objetivo de los retrovisores, desviaciones de indexación y modos de aproximación.'
  de: 'Spiegel-Memory-Status des Sitz-Memory-Moduls, von der BSI mit Antwort im Rahmen abgefragt: abgerufene Memory-Nummer mit Spiegel-Zielpositionen, Indexierungsabweichungen und Anfahrmodi.'
  it: 'Stato memoria specchietti del modulo memoria sedile, interrogato dalla BSI con risposta nella trama: numero di memoria richiamata con le posizioni target degli specchietti, scostamenti di indicizzazione e modalità di avvicinamento.'
  pl: 'Stan pamięci lusterek modułu pamięci fotela, odpytywany przez BSI z odpowiedzią w ramce: numer przywołanej pamięci z docelowymi pozycjami lusterek, odchylenia indeksowania i tryby podejścia.'
  ru: 'Статус памяти зеркал модуля памяти сиденья, опрашиваемого BSI с ответом в кадре: номер вызванной памяти с целевыми положениями зеркал, отклонения индексации и режимы подъезда.'
  zh: '座椅记忆模块后视镜记忆状态,由BSI轮询并帧内应答:调用的记忆编号及后视镜目标位置、索引偏差和进近模式。'
  hu: 'Az ülésmemória-modul tükörmemória-állapota, a BSI által keretválasszal lekérdezve: a visszahívott memóriaszám a tükör célpozícióival, indexelési eltérésekkel és megközelítési módokkal.'
  pt: 'Estado da memória dos espelhos do módulo de memória do banco do condutor, interrogado pela BSI com resposta na trama: número de memória recuperado com as posições-alvo dos espelhos, deltas de indexação e modos de aproximação.'
periodicity: ['1000ms']
senders: ['BDM_C']
receivers: ['BSI']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['BSI']

signals:
  HEADER:
    bits: '1.7-1.0'
    comment:
      en: 'Start-of-frame marker byte of the in-frame reply (usage defined by the VAN network rules)'
      fr: 'Marqueur de début de trame'
      es: 'Byte marcador de inicio de trama de la respuesta en trama'
      de: 'Kennzeichnungsbyte für den Rahmenanfang der In-Frame-Antwort'
      it: 'Byte marcatore di inizio frame della risposta in-frame'
      pl: 'Bajt znacznika początku ramki odpowiedzi w ramce'
      ru: 'Байт-маркер начала кадра ответа в кадре'
      zh: '帧内应答起始标记字节'
      hu: 'Az üzeneten belüli válasz kezdő jelölőbájtja'
      pt: 'Byte marcador de início de trama da resposta em trama'
    type: 'uint'

  UNUSED_1:
    bits: '2.7-2.4'
    unused: true

  RECALLED_MEMORY_NUMBER:
    bits: '2.3-2.0'
    comment:
      en: 'Recalled mirror memory number: set for 2 s on a recall, then invalid until the next request'
      fr: 'Numéro de la mémoire rappelée : positionné pendant 2 s lors d''un rappel, puis invalide'
      es: 'Número de memoria recuperada: fijado durante 2 s en una recuperación, luego inválido'
