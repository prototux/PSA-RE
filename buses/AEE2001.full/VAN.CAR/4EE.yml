      ru: 'Номер вызванной памяти зеркала: устанавливается на 2 с при вызове, затем недействителен'
      zh: '召回的后视镜记忆编号:召回时保持2秒有效,之后失效'
      hu: 'A felidézett tükörmemória száma: felidézéskor 2 másodpercig érvényes, utána érvénytelen'
      pt: 'Número da memória recuperada: definido durante 2 s numa recuperação, depois inválido até ao próximo pedido'
