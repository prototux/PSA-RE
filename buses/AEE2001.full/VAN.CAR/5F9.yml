      fr: 'Commande de l''ampoule de code droit'
      es: 'Comando de la bombilla de la luz de cruce derecha'
      de: 'Ansteuerung der rechten Abblendlichtlampe'
      it: 'Comando della lampadina anabbagliante destra'
      pl: 'Sterowanie żarówką prawego światła mijania'
      ru: 'Управление лампой правого ближнего света'
      zh: '右近光灯灯泡控制'
      hu: 'A jobb tompított fényszóró izzójának vezérlése'
      pt: 'Comando da lâmpada da luz de cruzamento direita'
    type: 'bool'
