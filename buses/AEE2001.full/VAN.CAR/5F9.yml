id: 0x5F9
name: 'FRONT_LIGHTING_COMMAND'
type: 'van'
length: 6
comment:
  en: 'Front lighting unit bulb commands (side lamps, low/high beams, front fogs, left and right) plus I/O expander port configuration.'
  fr: 'Commandes des ampoules de l''unité d''éclairage avant (lanternes, feux de croisement/route, antibrouillards avant, gauche et droite) et configuration des ports de l''extenseur d''E/S.'
  es: 'Órdenes de las bombillas de la unidad de alumbrado delantero (luces de posición, cruce/carretera, antiniebla delanteros, izquierda y derecha) y configuración de los puertos del expansor de E/S.'
  de: 'Lampenbefehle der vorderen Beleuchtungseinheit (Standlicht, Abblend-/Fernlicht, Frontnebelscheinwerfer, links und rechts) sowie Portkonfiguration des E/A-Erweiterungsmoduls.'
  it: 'Comandi delle lampadine dell''unità di illuminazione anteriore (luci di posizione, anabbaglianti/abbaglianti, fendinebbia anteriori, sinistra e destra) e configurazione delle porte dell''espansore I/O.'
  pl: 'Polecenia żarówek przedniego modułu oświetlenia (światła pozycyjne, mijania/drogowe, przednie przeciwmgielne, lewe i prawe) oraz konfiguracja portów ekspandera we/wy.'
  ru: 'Команды ламп передних осветительных приборов (габариты, ближний/дальний свет, передние противотуманные фары, левая и правая сторона) и конфигурация портов расширителя ввода-вывода.'
  zh: '前照明单元灯泡指令（示宽灯、近光/远光灯、前雾灯，左右两侧）及I/O扩展端口配置。'
  hu: 'Az elülső világítóegység izzóinak parancsai (helyzetjelző, tompított/távolsági fény, elülső ködfényszóró, bal és jobb oldal) és az I/O bővítő portjainak konfigurációja.'
  pt: 'Comandos das lâmpadas do bloco ótico dianteiro (luzes de presença, médios/máximos, nevoeiro dianteiro, esquerdo e direito) e configuração das portas do expansor de E/S.'
periodicity: ['50ms']
senders: ['BSI']
receivers: ['BOP']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

