id: 0xAD8
name: 'RAIN_LIGHT_SENSOR_FAULTS'
type: 'van'
length: 6
comment:
  en: 'Rain/light sensor fault report (formatted as a KWP2000 ''read data by local identifier'' positive response): sensor fault flags and their validity, used by the body computer to enter degraded mode.'
  fr: 'Rapport de défaut du capteur pluie/luminosité (format réponse positive KWP2000 « lecture de donnée par identifiant local ») : indicateurs de défaut capteur et leur validité, utilisés par la BSI pour passer en mode dégradé.'
  es: 'Informe de fallo del sensor de lluvia/luz (formato de respuesta positiva KWP2000 «lectura de dato por identificador local»): indicadores de fallo del sensor y su validez, utilizados por la BSI para pasar a modo degradado.'
  de: 'Fehlerbericht des Regen-/Lichtsensors (formatiert als positive KWP2000-Antwort „Datenlesen nach lokaler Kennung“): Sensorfehlerkennzeichen und deren Gültigkeit, vom BSI zum Wechsel in den degradierten Modus verwendet.'
  it: 'Rapporto di guasto del sensore pioggia/luce (formattato come risposta positiva KWP2000 ''lettura dati per identificatore locale''): indicatori di guasto del sensore e relativa validità, utilizzati dalla BSI per passare alla modalità degradata.'
  pl: 'Raport usterki czujnika deszczu/światła (w formacie pozytywnej odpowiedzi KWP2000 „odczyt danych według identyfikatora lokalnego”): flagi usterki czujnika i ich ważność, wykorzystywane przez BSI do przejścia w tryb awaryjny.'
  ru: 'Отчёт о неисправности датчика дождя/света (в формате положительного ответа KWP2000 «чтение данных по локальному идентификатору»): флаги неисправности датчика и их достоверность, используемые BSI для перехода в аварийный режим.'
  zh: '雨量/光线传感器故障报告(格式为KWP2000“按本地标识符读取数据”的肯定响应):传感器故障标志及其有效性,供车身电脑用于进入降级模式。'
  hu: 'Eső-/fényérzékelő hibajelentés (KWP2000 „adat olvasása helyi azonosító szerint” pozitív válasz formátumában): érzékelőhiba-jelzők és azok érvényessége, a BSI a csökkentett üzemmódba lépéshez használja.'
  pt: 'Relatório de avarias do sensor de chuva/luz (formatado como resposta positiva KWP2000 ''read data by local identifier''): indicadores de avaria do sensor e a sua validade, utilizados pelo computador de servidão para entrar em modo degradado.'
periodicity: ['500ms']
senders: ['CDPL']
receivers: ['BSI']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['BSI']

