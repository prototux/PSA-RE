id: 0x5F1
name: 'FRONT_LIGHTING_CONFIG'
type: 'van'
length: 1
comment:
  en: 'Configuration (command register) byte of the front lighting unit VAN I/O expander: active supervision (watchdog) on or off.'
  fr: 'Octet de configuration (registre de commande) de l''extenseur VAN I/O du boîtier optique avant : supervision active (chien de garde) activée ou non.'
  es: 'Byte de configuración (registro de comando) del expansor VAN I/O de la unidad de iluminación delantera: supervisión activa (watchdog) activada o no.'
  de: 'Konfigurationsbyte (Befehlsregister) des VAN-I/O-Erweiterungsbausteins der Frontleuchteneinheit: aktive Überwachung (Watchdog) ein oder aus.'
  it: 'Byte di configurazione (registro di comando) dell''espansore VAN I/O dell''unità luci anteriori: supervisione attiva (watchdog) attivata o meno.'
  pl: 'Bajt konfiguracji (rejestr poleceń) ekspandera VAN I/O przedniego zespołu oświetlenia: aktywny nadzór (watchdog) włączony lub nie.'
  ru: 'Байт конфигурации (регистр команд) расширителя VAN I/O переднего светового блока: активный контроль (watchdog) включён или нет.'
  zh: '前照明单元VAN I/O扩展器的配置(命令寄存器)字节:主动监控(看门狗)开启或关闭。'
  hu: 'Az első világítási egység VAN I/O bővítőjének konfigurációs (parancsregiszter) bájtja: aktív felügyelet (watchdog) be- vagy kikapcsolva.'
  pt: 'Byte de configuração (registo de comando) do expansor de E/S VAN do bloco ótico dianteiro: supervisão ativa (watchdog) ligada ou desligada.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BOP']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  IO_EXPANDER_CONFIG:
    bits: '1.7-1.0'
    comment:
      en: 'VAN IO16 configuration'
      fr: 'Configuration du VAN IO 16'
      es: 'Configuración del VAN IO 16'
      de: 'Konfiguration des VAN IO 16'
      it: 'Configurazione del VAN IO 16'
      pl: 'Konfiguracja VAN IO 16'
      ru: 'Конфигурация VAN IO 16'
      zh: 'VAN IO16配置'
      hu: 'VAN IO16 konfiguráció'
      pt: 'Configuração do VAN IO 16'
    type: 'enum'
    default: 0x00
    values:
      0x83:
        en: 'Active supervision (watchdog) mode on, normal operation'
        fr: 'Mode de surveillance active (watchdog) activé, fonctionnement normal'
        es: 'Modo de supervisión activa (watchdog) activado, funcionamiento normal'
        de: 'Aktiver Überwachungsmodus (Watchdog) aktiv, Normalbetrieb'
        it: 'Modalità di supervisione attiva (watchdog) attiva, funzionamento normale'
        pl: 'Tryb aktywnego nadzoru (watchdog) włączony, praca normalna'
        ru: 'Активный режим наблюдения (watchdog) включён, нормальная работа'
        zh: '主动监控(看门狗)模式开启,正常运行'
        hu: 'Aktív felügyeleti (watchdog) üzemmód bekapcsolva, normál működés'
        pt: 'Modo de supervisão ativa (watchdog) ativado, funcionamento normal'
      0x8B:
