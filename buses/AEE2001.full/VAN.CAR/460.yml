  - note:
      en: 'Also observed with a period of 1000ms'
      fr: 'Aussi observée avec une période de 1000ms'
      es: 'También observada con un periodo de 1000ms'
      de: 'Auch mit einer Periode von 1000ms beobachtet'
      it: 'Osservata anche con un periodo di 1000ms'
      pl: 'Obserwowana także z okresem 1000ms'
