        es: 'En marcha'
        de: 'Läuft'
        it: 'In funzione'
        pl: 'Pracuje'
        ru: 'Работает'
        zh: '运转中'
        hu: 'Jár'
        pt: 'Em funcionamento'
      0x02:
        en: 'Invalid'
        fr: 'Invalide'
        es: 'Inválido'
        de: 'Ungültig'
        it: 'Non valido'
        pl: 'Nieprawidłowe'
        ru: 'Недействительно'
        zh: '无效'
        hu: 'Érvénytelen'
        pt: 'Inválido'
      0x03:
        en: 'Invalid'
        fr: 'Invalide'
        es: 'Inválido'
        de: 'Ungültig'
        it: 'Non valido'
        pl: 'Nieprawidłowe'
        ru: 'Недействительно'
        zh: '无效'
        hu: 'Érvénytelen'
        pt: 'Inválido'

  IGNITION_KEY_POSITION:
    bits: '5.2-5.0'
    comment:
      en: 'Ignition key position'
      fr: 'Position de la clé de contact'
      es: 'Posición de la llave de contacto'
      de: 'Position des Zündschlüssels'
      it: 'Posizione della chiave di accensione'
      pl: 'Pozycja kluczyka zapłonu'
      ru: 'Положение ключа зажигания'
      zh: '点火钥匙位置'
      hu: 'Gyújtáskulcs helyzete'
      pt: 'Posição da chave de ignição'
    type: 'enum'
    default: 0x03
    values:
      0x00:
        en: 'Off'
        fr: 'Arrêt'
