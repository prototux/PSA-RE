        zh: '附件'
        hu: 'Tartozékok'
        pt: 'Acessórios'
      0x02:
        en: 'Cranking'
        fr: 'Démarreur en action'
        es: 'Motor de arranque en marcha'
        de: 'Anlasser dreht'
        it: 'Motorino di avviamento in azione'
        pl: 'Rozrusznik pracuje'
        ru: 'Стартер вращает двигатель'
        zh: '起动机运转中'
        hu: 'Indítómotor forog'
        pt: 'A rodar (arranque)'
      0x03:
