id: 0x4F2
name: 'SLIDING_DOORS_COMMAND'
type: 'van'
length: 5
comment:
  en: 'BSI to power sliding side doors module: power/ignition state, vehicle speed, per-door authorisation, locking state, remote control commands and crash information.'
  fr: 'BSI vers le module de portes latérales coulissantes motorisées : état d''alimentation/allumage, vitesse véhicule, autorisation par porte, état de condamnation, commandes télécommande et information de choc.'
  es: 'BSI al módulo de puertas laterales correderas motorizadas: estado de alimentación/encendido, velocidad del vehículo, autorización por puerta, estado de bloqueo, órdenes de mando a distancia e información de choque.'
  de: 'BSI an das Modul der motorisierten Schiebetüren: Versorgungs-/Zündzustand, Fahrzeuggeschwindigkeit, Freigabe je Tür, Verriegelungszustand, Fernbedienungsbefehle und Stoßinformation.'
  it: 'BSI al modulo delle porte laterali scorrevoli motorizzate: stato di alimentazione/accensione, velocità del veicolo, autorizzazione per porta, stato di chiusura, comandi telecomando e informazioni sull''urto.'
  pl: 'BSI do modułu elektrycznych drzwi bocznych przesuwnych: stan zasilania/zapłonu, prędkość pojazdu, zezwolenie dla każdych drzwi, stan zamknięcia, polecenia pilota i informacje o uderzeniu.'
  ru: 'BSI в модуль моторизованных раздвижных боковых дверей: состояние питания/зажигания, скорость автомобиля, разрешение по каждой двери, состояние блокировки, команды пульта и информация об ударе.'
  zh: 'BSI发送给电动滑动侧门模块的信息：电源/点火状态、车速、每扇门的授权、锁止状态、遥控命令及碰撞信息。'
  hu: 'A BSI a motoros tolóajtó-modul felé: tápellátás-/gyújtásállapot, jármű sebessége, ajtónkénti engedélyezés, záróállapot, távirányító-parancsok és ütközési információ.'
  pt: 'Da BSI para o módulo das portas laterais corrediças elétricas: estado de alimentação/ignição, velocidade do veículo, autorização por porta, estado de trancagem, comandos do comando à distância e informação de colisão.'
periodicity: ['100ms', 'trigger']
senders: ['BSI']
receivers: ['MDPLC']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

