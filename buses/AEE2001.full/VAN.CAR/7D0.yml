id: 0x7D0
name: 'RF_RECEIVER_CONFIG'
type: 'van'
length: 18
comment:
  en: 'RF receiver configuration sent to the steering column module: enables remote-control and tyre-pressure receivers and provides the learnt wheel-sensor and remote-control identifiers'
  fr: 'Configuration des récepteurs HF envoyée au module de colonne de direction : activation des récepteurs de télécommande et de pression des pneus, et identifiants appris des capteurs de roue et des télécommandes'
  es: 'Configuración de los receptores RF enviada al módulo de la columna de dirección: activa los receptores de mando a distancia y de presión de neumáticos, y proporciona los identificadores aprendidos de los sensores de rueda y de los mandos'
  de: 'RF-Empfängerkonfiguration an das Lenksäulenmodul: aktiviert die Fernbedienungs- und Reifendruckempfänger und liefert die angelernten Kennungen der Radsensoren und Fernbedienungen'
  it: 'Configurazione dei ricevitori RF inviata al modulo del piantone dello sterzo: abilita i ricevitori del telecomando e della pressione pneumatici e fornisce gli identificatori appresi dei sensori ruota e dei telecomandi'
  pl: 'Konfiguracja odbiorników RF wysyłana do modułu kolumny kierownicy: aktywuje odbiorniki pilota i ciśnienia opon oraz podaje wyuczone identyfikatory czujników kół i pilotów'
  ru: 'Конфигурация РЧ-приёмников, отправляемая модулю рулевой колонки: включает приёмники пульта ДУ и давления в шинах, а также передаёт заученные идентификаторы датчиков колёс и пультов'
  zh: '发送至转向柱模块的射频接收器配置:启用遥控器和胎压接收器,并提供已学习的车轮传感器及遥控器识别码'
  hu: 'A kormányoszlop-modulnak küldött RF-vevő konfiguráció: engedélyezi a távirányító- és gumiabroncsnyomás-vevőket, és megadja a betanított kerékérzékelő- és távirányító-azonosítókat'
  pt: 'Configuração do recetor RF enviada ao módulo da coluna de direção: ativa os recetores de comando à distância e de pressão dos pneus, e fornece os identificadores aprendidos dos sensores de roda e do comando à distância.'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['HDC']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  REMOTE_RECEIVER_ENABLE:
    bits: '1.7'
    comment:
      en: 'Remote control RF receiver function active.'
      fr: 'Fonction récepteur RF de télécommande active.'
      es: 'Función del receptor RF del mando a distancia activa.'
      de: 'RF-Empfängerfunktion der Fernbedienung aktiv.'
      it: 'Funzione del ricevitore RF del telecomando attiva.'
      pl: 'Aktywna funkcja odbiornika RF pilota.'
      ru: 'Активна функция RF-приёмника радиобрелока.'
      zh: '遥控器射频接收功能激活。'
      hu: 'A távirányító RF-vevő funkciója aktív.'
      pt: 'Função do recetor RF do comando à distância ativa.'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Inactive'
        fr: 'Inactif'
        es: 'Inactivo'
        de: 'Inaktiv'
        it: 'Inattivo'
        pl: 'Nieaktywny'
        ru: 'Неактивно'
        zh: '未激活'
        hu: 'Inaktív'
        pt: 'Inativo'
      0x01:
        en: 'Function active'
        fr: 'Fonction active'
        es: 'Función activa'
        de: 'Funktion aktiv'
        it: 'Funzione attiva'
        pl: 'Funkcja aktywna'
        ru: 'Функция активна'
        zh: '功能激活'
        hu: 'Funkció aktív'
        pt: 'Função ativa'

  TPMS_RECEIVER_ENABLE:
    bits: '1.6'
    comment:
      en: 'Tyre under-inflation RF receiver function active.'
      fr: 'Fonction récepteur RF de sous-gonflage active.'
      es: 'Función del receptor RF de baja presión de neumáticos activa.'
      de: 'RF-Empfängerfunktion für Reifenunterdruck aktiv.'
      it: 'Funzione del ricevitore RF di sottogonfiaggio attiva.'
      pl: 'Aktywna funkcja odbiornika RF niskiego ciśnienia w oponach.'
      ru: 'Активна функция RF-приёмника контроля недокачки шин.'
      zh: '胎压不足射频接收功能激活。'
      hu: 'A gumiabroncs-nyomáscsökkenést jelző RF-vevő funkció aktív.'
      pt: 'Função do recetor RF de baixa pressão dos pneus ativa.'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Inactive'
        fr: 'Inactif'
        es: 'Inactivo'
        de: 'Inaktiv'
        it: 'Inattivo'
        pl: 'Nieaktywny'
        ru: 'Неактивно'
        zh: '未激活'
        hu: 'Inaktív'
        pt: 'Inativo'
      0x01:
        en: 'Function active'
        fr: 'Fonction active'
        es: 'Función activa'
        de: 'Funktion aktiv'
        it: 'Funzione attiva'
        pl: 'Funkcja aktywna'
        ru: 'Функция активна'
        zh: '功能激活'
        hu: 'Funkció aktív'
        pt: 'Função ativa'

  RESERVED_COUNTER:
    bits: '1.5-1.0'
    comment:
      en: 'Counter reserved as a workaround for a VAN controller bug.'
      fr: 'Compteur réservé pour contourner un bug du contrôleur VAN.'
      es: 'Contador reservado para evitar un fallo del controlador VAN.'
      de: 'Zähler, reserviert zur Umgehung eines VAN-Controller-Fehlers.'
      it: 'Contatore riservato per aggirare un bug del controller VAN.'
      pl: 'Licznik zarezerwowany jako obejście błędu sterownika VAN.'
      ru: 'Счётчик, зарезервированный для обхода ошибки контроллера VAN.'
      zh: '为规避VAN控制器缺陷而保留的计数器。'
      hu: 'Egy VAN-vezérlő hibájának megkerülésére fenntartott számláló.'
      pt: 'Contador reservado para contornar uma falha do controlador VAN.'
    type: 'uint'
    default: 0x00

  WHEEL1_SENSOR_ID:
    bits: '2.7-4.0'
    comment:
      en: '24-bit identifier of the wheel 1 tyre-pressure transmitter (bit order as received on the bus).'
      fr: 'Identifiant sur 24 bits de l''émetteur de pression du pneu de la roue 1 (ordre des bits tel que reçu sur le bus).'
      es: 'Identificador de 24 bits del transmisor de presión del neumático de la rueda 1 (orden de bits tal como se recibe en el bus).'
      de: '24-Bit-Kennung des Reifendrucksensors von Rad 1 (Bitfolge wie am Bus empfangen).'
      it: 'Identificativo a 24 bit del trasmettitore di pressione pneumatico della ruota 1 (ordine dei bit come ricevuto sul bus).'
      pl: '24-bitowy identyfikator nadajnika ciśnienia w oponie koła 1 (kolejność bitów jak odebrana z magistrali).'
      ru: '24-битный идентификатор передатчика давления в шине колеса 1 (порядок битов как принято на шине).'
      zh: '1号车轮胎压发射器的24位标识符（按总线接收的位顺序）。'
      hu: 'A(z) 1. kerék gumiabroncsnyomás-adójának 24 bites azonosítója (a buszon vett bitsorrend szerint).'
      pt: 'Identificador de 24 bits do transmissor de pressão do pneu da roda 1 (ordem de bits tal como recebida no barramento).'
    type: 'bytes'
    default: 0x00

