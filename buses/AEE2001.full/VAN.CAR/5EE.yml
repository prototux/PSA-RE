id: 0x5EE
name: 'MEMORY_SEAT_MEMORY_REQUEST'
type: 'van'
length: 13
comment:
  en: 'BSI to driver memory seat module: memory store/recall command with the mirror positions, reverse-gear indexing deltas and mirror approach modes.'
  fr: 'De la BSI vers le module mémoire du siège conducteur : commande de mémorisation/rappel avec les positions des rétroviseurs, écarts d''indexation en marche arrière et modes de ralliement des rétroviseurs.'
  es: 'De la BSI al módulo de memoria del asiento del conductor: comando de memorización/recuperación con las posiciones de los retrovisores, desviaciones de indexación en marcha atrás y modos de aproximación de los retrovisores.'
  de: 'Vom BSI zum Fahrersitz-Memory-Modul: Speicher-/Abrufbefehl mit Spiegelpositionen, Rückwärtsgang-Indexierungsabweichungen und Spiegelanfahrmodi.'
  it: 'Dalla BSI al modulo memoria del sedile guidatore: comando di memorizzazione/richiamo con le posizioni degli specchietti, scostamenti di indicizzazione in retromarcia e modalità di avvicinamento degli specchietti.'
  pl: 'Od BSI do modułu pamięci fotela kierowcy: polecenie zapisu/przywołania z pozycjami lusterek, odchyleniami indeksowania biegu wstecznego i trybami podjazdu lusterek.'
  ru: 'От BSI к модулю памяти сиденья водителя: команда сохранения/вызова с положениями зеркал, отклонениями индексации заднего хода и режимами подъезда зеркал.'
  zh: '从BSI到驾驶员座椅记忆模块:记忆存储/调用命令,包含后视镜位置、倒挡索引偏差和后视镜接近模式。'
  hu: 'A BSI-től a vezetőülés memóriamoduljához: memória mentés/előhívás parancs a tükörpozíciókkal, hátrameneti indexelési eltérésekkel és tükör-megközelítési módokkal.'
  pt: 'Da BSI para o módulo de memória do banco do condutor: comando de memorização/recuperação com as posições dos espelhos, deltas de indexação da marcha-atrás e modos de aproximação dos espelhos.'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['BDM_C']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  UNUSED_1:
    bits: '1.7'
    unused: true

  MEMORY_KEYPAD_LAMP:
