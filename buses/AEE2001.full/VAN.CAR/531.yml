      pt: 'Seleção da linha de entrada VAN e do seu modo de utilização'
    type: 'enum'
    default: 0x03
    values:
      0x00:
        en: 'Automatic differential mode (used at initialisation, 0x80)'
        fr: 'Mode différentiel automatique (utilisé à l''initialisation, 0x80)'
        es: 'Modo diferencial automático (usado en la inicialización, 0x80)'
        de: 'Automatischer Differentialmodus (bei Initialisierung, 0x80)'
        it: 'Modalità differenziale automatica (usata all''inizializzazione, 0x80)'
        pl: 'Tryb różnicowy automatyczny (używany przy inicjalizacji, 0x80)'
        ru: 'Автоматический дифференциальный режим (при инициализации, 0x80)'
        zh: '自动差分模式(初始化时使用,0x80)'
        hu: 'Automatikus differenciál mód (inicializáláskor, 0x80)'
        pt: 'Modo diferencial automático (utilizado na inicialização, 0x80)'
      0x03:
        en: 'Default input line (transparent line diagnostic mode)'
        fr: 'Voie d''entrée par défaut (mode diagnostic de ligne transparent)'
        es: 'Línea de entrada por defecto (modo de diagnóstico de línea transparente)'
        de: 'Standard-Eingangsleitung (transparenter Leitungsdiagnosemodus)'
        it: 'Linea di ingresso predefinita (modalità diagnosi linea trasparente)'
        pl: 'Domyślna linia wejściowa (tryb diagnostyki linii przezroczystej)'
        ru: 'Входная линия по умолчанию (прозрачный режим диагностики линии)'
        zh: '默认输入线路(透明线路诊断模式)'
