id: 0x531
name: 'ENGINE_BAY_BOX_CONFIG'
type: 'van'
length: 1
comment:
  en: 'Configuration (command register) byte of the engine-bay box VAN I/O expander.'
  fr: 'Octet de configuration (registre de commande) de l''extenseur VAN I/O du boîtier compartiment moteur.'
  es: 'Byte de configuración (registro de comando) del expansor VAN I/O de la caja del compartimento motor.'
  de: 'Konfigurationsbyte (Befehlsregister) des VAN-I/O-Erweiterungsbausteins der Motorraumbox.'
  it: 'Byte di configurazione (registro di comando) dell''espansore VAN I/O della centralina vano motore.'
  pl: 'Bajt konfiguracji (rejestr poleceń) ekspandera VAN I/O modułu komory silnika.'
  ru: 'Байт конфигурации (регистр команд) расширителя VAN I/O блока моторного отсека.'
  zh: '发动机舱盒VAN I/O扩展器的配置(命令寄存器)字节。'
  hu: 'A motortéri doboz VAN I/O bővítőjének konfigurációs (parancsregiszter) bájtja.'
  pt: 'Byte de configuração (registo de comando) do expansor de E/S VAN da caixa do compartimento do motor.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['BSM']
van:
  access: 'write'
  ack: true
  rtr: false
  reply: 'none'

signals:
  RESOURCE_PROTECT:
    bits: '1.7'
    comment:
      en: 'Resource busy/free state'
      fr: 'État de la ressource, occupée ou libre'
      es: 'Estado del recurso, ocupado o libre'
      de: 'Ressourcenstatus, belegt oder frei'
      it: 'Stato della risorsa, occupata o libera'
      pl: 'Stan zasobu, zajęty lub wolny'
      ru: 'Состояние ресурса, занят или свободен'
      zh: '资源占用/空闲状态'
      hu: 'Erőforrás foglalt/szabad állapota'
      pt: 'Estado do recurso, ocupado ou livre'
    type: 'bool'
    default: 0x01

  USER_MODULE_NUMBER:
    bits: '1.6-1.4'
    comment:
      en: 'User module number'
      fr: 'Numéro du module utilisateur'
      es: 'Número del módulo de usuario'
      de: 'Benutzermodulnummer'
      it: 'Numero del modulo utente'
      pl: 'Numer modułu użytkownika'
      ru: 'Номер пользовательского модуля'
      zh: '用户模块编号'
      hu: 'Felhasználói modul száma'
      pt: 'Número do módulo utilizador'
    type: 'uint'
    default: 0x00

  ACTIVE_SUPERVISION_ENABLE:
    bits: '1.3'
    comment:
      en: 'Active supervision enable/inhibit'
      fr: 'Autorisation ou inhibition de la surveillance active'
      es: 'Habilitación o inhibición de la supervisión activa'
      de: 'Freigabe oder Sperrung der aktiven Überwachung'
      it: 'Abilitazione o inibizione della supervisione attiva'
      pl: 'Zezwolenie lub zablokowanie nadzoru aktywnego'
      ru: 'Разрешение или блокировка активного контроля'
      zh: '主动监控使能/禁止'
      hu: 'Aktív felügyelet engedélyezése vagy tiltása'
      pt: 'Autorização ou inibição da supervisão ativa'
    type: 'bool'
    default: 0x00

  INPUT_LINE_MODE:
