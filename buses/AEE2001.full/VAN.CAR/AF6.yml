id: 0xAF6
name: 'DRIVER_DOOR_MODULE_FAULTS'
type: 'van'
length: 18
comment:
  en: 'Fault list of the driver door module, read by the body controller for fault recording.'
  fr: 'Liste des défauts du module de porte conducteur, lue par la BSI pour l''enregistrement des défauts.'
  es: 'Lista de fallos del módulo de puerta del conductor, leída por la BSI para el registro de fallos.'
  de: 'Fehlerliste des Fahrertürmoduls, vom BSI zur Fehleraufzeichnung ausgelesen.'
  it: 'Elenco dei guasti del modulo porta guidatore, letto dalla BSI per la registrazione dei guasti.'
  pl: 'Lista usterek modułu drzwi kierowcy, odczytywana przez BSI w celu rejestracji usterek.'
  ru: 'Список неисправностей модуля двери водителя, считываемый BSI для регистрации неисправностей.'
  zh: '驾驶员车门模块的故障列表,由车身控制器读取以记录故障。'
  hu: 'A vezetőoldali ajtómodul hibalistája, amelyet a BSI olvas ki a hibák rögzítéséhez.'
  pt: 'Lista de avarias do módulo da porta do condutor, lida pelo computador de servidão para registo de avarias.'
periodicity: ['500ms']
senders: ['EDP_C']
receivers: ['BSI']
van:
  access: 'read'
  ack: true
  rtr: true
  reply: 'in-frame'
  requested_by: ['BSI']

