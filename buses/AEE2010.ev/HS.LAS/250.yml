      de: 'Ladezustand der Batterie'
      it: 'Stato di carica della batteria'
      pl: 'Stan naładowania akumulatora'
      ru: 'Уровень заряда батареи'
      zh: '电池荷电状态'
      hu: 'Az akkumulátor töltöttségi állapota'
      pt: 'Estado de carga da bateria'
