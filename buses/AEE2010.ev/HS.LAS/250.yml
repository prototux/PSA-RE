id: 0x250
name: 'BSI_DATA'
type: 'can'
length: 8
comment:
  en: 'Body controller data 6: battery current gauge, front wiper hill-descent command, radar detection request, stop-start change request, battery charge and wiping state, and AC blower/pump requests.'
  fr: 'Données BSI 6 : calibre du courant batterie, commande essuie-glace avant en descente, demande de détection radar, demande de changement d''état stop-start, état de charge batterie et d''essuyage, et demandes de débit/pompe climatisation.'
  es: 'Datos de la BSI 6: calibre de corriente de batería, comando de limpiaparabrisas delantero en bajada, solicitud de detección de radar, solicitud de cambio de estado stop-start, estado de carga de batería y de limpieza, y solicitudes de caudal/bomba de climatización.'
  de: 'BSI-Daten 6: Batteriestrom-Messbereich, Frontwischerbefehl bei Bergabfahrt, Radar-Erkennungsanforderung, Stopp-Start-Zustandsänderungsanforderung, Batterieladezustand und Wischzustand, sowie Klima-Gebläse-/Pumpenanforderungen.'
  it: 'Dati BSI 6: portata corrente batteria, comando tergicristallo anteriore in discesa, richiesta di rilevamento radar, richiesta di cambio stato stop-start, stato di carica batteria e di pulizia, e richieste di portata/pompa climatizzazione.'
  pl: 'Dane BSI 6: zakres prądu akumulatora, polecenie wycieraczki przedniej przy zjeździe, żądanie wykrycia radaru, żądanie zmiany stanu stop-start, stan naładowania akumulatora i wycierania oraz żądania przepływu/pompy klimatyzacji.'
  ru: 'Данные BSI 6: диапазон тока батареи, команда переднего стеклоочистителя при спуске, запрос обнаружения радаром, запрос смены состояния старт-стоп, состояние заряда батареи и очистки, а также запросы расхода/насоса кондиционера.'
  zh: 'BSI数据6:电池电流量程、下坡时前雨刮命令、雷达探测请求、启停状态变更请求、电池充电和雨刮状态,以及空调风量/泵请求。'
  hu: 'BSI adatok 6: akkumulátoráram mérési tartomány, első ablaktörlő parancs lejtőn, radar-észlelési kérés, stop-start állapotváltási kérés, akkumulátor töltési és törlési állapot, valamint klíma légáram-/szivattyú kérések.'
  pt: 'Dados 6 do computador de servidão: indicador de corrente da bateria, comando do limpa-para-brisas dianteiro em descida, pedido de deteção do radar, pedido de mudança do stop-start, carga da bateria e estado de limpeza, e pedidos do ventilador/bomba do ar condicionado.'
periodicity: ['100ms']
senders: ['BSI', 'BSM']
receivers: ['ACC', 'ARTIV', 'CVM', 'HCU2']

signals:
  BATTERY_STATE_OF_CHARGE:
    bits: '1.7-1.0'
