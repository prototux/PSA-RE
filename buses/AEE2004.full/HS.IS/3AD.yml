id: 0x3AD
name: 'EASY_MOVE_DYNAMIC_DATA'
type: 'can'
length: 8
comment:
  en: 'Easy Move function data from the brake control unit: pedal/switch press requests, parking-brake state and fault status.'
  fr: 'Données de la fonction Easy Move du calculateur de frein : demandes d''appui pédale/bouton, état du frein de stationnement et état de défaut.'
  es: 'Datos de la función Easy Move de la centralita de frenos: solicitudes de pulsación de pedal/botón, estado del freno de estacionamiento y estado de fallo.'
  de: 'Daten der Easy-Move-Funktion des Bremssteuergeräts: Pedal-/Tastenbetätigungsanfragen, Zustand der Feststellbremse und Fehlerstatus.'
  it: 'Dati della funzione Easy Move della centralina freni: richieste di pressione pedale/pulsante, stato del freno di stazionamento e stato di guasto.'
  pl: 'Dane funkcji Easy Move ze sterownika hamulców: żądania naciśnięcia pedału/przycisku, stan hamulca postojowego i stan usterki.'
  ru: 'Данные функции Easy Move от блока управления тормозами: запросы нажатия педали/кнопки, состояние стояночного тормоза и статус неисправности.'
  zh: '来自制动控制单元的Easy Move功能数据:踏板/按钮按压请求、驻车制动状态及故障状态。'
  hu: 'Az Easy Move funkció adatai a fékvezérlő egységtől: pedál-/gombnyomási kérések, rögzítőfék állapota és hibaállapot.'
  pt: 'Dados da função Easy Move da unidade de controlo de travagem: pedidos de pressão do pedal/comutador, estado do travão de estacionamento e estado de avaria.'
periodicity: ['20ms']
senders: ['ABS']
receivers:
  - 'CMM'
  - 'FSE'
  - 'CAAR'
  - 'BVA'
  - 'BSI'
  - 'HCU1'
  - 'ACC'
  - 'AMVAR'
  - 'AR2S'
  - 'ACCEL_SENSOR'
  - 'CAV'
  - 'CGPL'
  - 'CMEL'
  - 'CSS'
  - 'DSG'
  - 'DIAG_TOOL'
  - 'BCP'
  - 'SBW'
  - 'SCDT'
  - 'BHI'
  - 'TBMU'
  - 'DAE'

