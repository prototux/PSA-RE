id: 0x0AD
name: 'IMMO_RESPONSE_ESP'
type: 'can'
length: 5
comment:
  en: 'Unlocking confirmation frame sent by the ABS/ESP ECU to the engine ECU.'
  fr: 'Trame de confirmation de déverrouillage envoyée par le calculateur ABS/ESP au calculateur moteur.'
  es: 'Trama de confirmación de desbloqueo enviada por la centralita ABS/ESP a la centralita del motor.'
  de: 'Entriegelungsbestätigungsrahmen, vom ABS/ESP-Steuergerät an das Motorsteuergerät gesendet.'
  it: 'Trama di conferma di sblocco inviata dalla centralina ABS/ESP alla centralina motore.'
  pl: 'Ramka potwierdzenia odblokowania wysyłana przez sterownik ABS/ESP do sterownika silnika.'
  ru: 'Кадр подтверждения разблокировки, отправляемый ЭБУ ABS/ESP в ЭБУ двигателя.'
  zh: '由ABS/ESP控制单元发送给发动机ECU的解锁确认帧。'
  hu: 'Az ABS/ESP vezérlőegység feloldási megerősítő kerete, a motorvezérlő egységnek küldve.'
  pt: 'Trama de confirmação de destrancagem enviada pela unidade de controlo ABS/ESP à unidade de controlo do motor.'
observations:
  en: 'Event defined by the ADC MUX protocol'
  fr: 'Événement défini par le protocole ADC MUX'
  es: 'Evento definido por el protocolo ADC MUX'
  de: 'Durch das ADC-MUX-Protokoll definiertes Ereignis'
  it: 'Evento definito dal protocollo ADC MUX'
  pl: 'Zdarzenie zdefiniowane przez protokół ADC MUX'
  ru: 'Событие определяется протоколом ADC MUX'
  zh: '由ADC MUX协议定义的事件'
  hu: 'Az ADC MUX protokoll által meghatározott esemény'
  pt: 'Evento definido pelo protocolo ADC MUX'
periodicity: ['trigger']
senders: ['ABS']
receivers: ['CMM']

signals:
  BSI_UNLOCK_KEY_AUTHORIZATION:
    bits: '1.7-1.0'
    comment:
      en: 'Unlocking authorization (BSI key emission)'
      fr: 'Autorisation de déverrouillage (émission de la clé BSI)'
      es: 'Autorización de desbloqueo (emisión de la llave BSI)'
      de: 'Entriegelungsfreigabe (Aussenden des BSI-Schlüssels)'
      it: 'Autorizzazione allo sblocco (emissione della chiave BSI)'
      pl: 'Autoryzacja odblokowania (wysłanie klucza BSI)'
      ru: 'Разрешение на разблокировку (передача ключа BSI)'
      zh: '解锁授权(BSI密钥发送)'
      hu: 'Kioldási engedély (BSI kulcs kibocsátása)'
      pt: 'Autorização de desbloqueio (emissão da chave BSI)'
    type: 'uint'

