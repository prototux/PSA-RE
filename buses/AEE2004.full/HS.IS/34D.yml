id: 0x34D
name: 'BREAKING_SYSTEMS_SYNCHRONISATIONS'
length: 8
type: 'can'
periodicity: 20
comment:
  en: 'Generic information about the different traction systems. Byte 1 is also used by the PSA Grip Control switch (98052503ZD, node 7758) to determine which LED to illuminate — the switch reads the aggregate byte 1 value against fixed thresholds, not individual bits. See GRIP_CONTROL_MODE signal.'
  fr: 'Informations générales sur les différents systèmes de traction. L''octet 1 est également utilisé par le sélecteur Grip Control PSA (98052503ZD, nœud 7758) pour déterminer quelle LED allumer — le sélecteur lit la valeur globale de l''octet 1 par rapport à des seuils fixes.'
  de: 'Generelle Information über die verschiedenen Traktionssysteme. Byte 1 wird auch vom PSA Grip Control Schalter (98052503ZD, Knoten 7758) verwendet, um die LED-Anzeige zu bestimmen — der Schalter liest den Gesamtwert von Byte 1 anhand fester Schwellenwerte.'
senders:
  - 'ABS'
receivers:
  - 'BSI'
  - 'CMM' # CMM is probably also listening — if there is no direct way between ABS and CMM and only over BSI it probably would not meet timing requirements
  - 'GRIP_CONTROL' # Node 7758 (98052503ZD) — listens passively to derive LED state from byte 1 threshold

signals:
  ESP_DISABLED_BY_DRIVER:
    bits: '1.7'
    comment:
      en: 'Part of byte 1 threshold used by Grip Control switch for LED selection. When set, contributes to byte 1 values 0x80–0xFF (Sand / ESP OFF LED range).'
    values:
      0x00:
        en: 'ESP is enabled'
        fr: 'ESP est activé'
        de: 'ESP ist aktiv'
      0x01:
        en: 'ESP was disabled by driver'
        fr: 'ESP a été désactivé par le conducteur'
        de: 'ESP wurde durch den Fahrer deaktiviert'

  ESP_CURRENTLY_REGULATING:
    bits: '1.6'
    comment:
      en: 'Part of byte 1 threshold used by Grip Control switch for LED selection. When set, contributes to byte 1 values 0x40–0x7F (Snow / Mud LED range).'
    values:
      0x00:
        en: 'ESP is not in regulation'
        fr: "ESP n'est pas en régulation"
        de: 'ESP greift gerade nicht ein.'
      0x01:
        en: 'ESP is currently in regulation'
        fr: 'ESP est actuellement en réglementation'
        de: 'ESP greift gerade ein.'

  UNKNOWN_1:
    bits: '1.5'
    comment:
      en: 'Part of byte 1 threshold used by Grip Control switch for LED selection. When set, contributes to byte 1 values 0x20–0x3F (Normal/Pavement LED range — green LED).'

  ILLUMINATE_FAULT_LIGHT:
    bits: '1.4'
    values:
      0x00:
        en: 'Do not illuminate'
        fr: 'Ne pas éclairer'
        de: 'Lampe nicht erleuchten'
      0x01:
        en: 'Illuminate'
        fr: 'Éclairer'
        de: 'Erleuchte die Lampe'

  UNKNOWN_2:
    bits: '1.3'

  TORQUE_REACTION_TYPE:
    bits: '1.2-1.0'
    values:
      0x00:
        en: 'No torque change needed.'
        fr: "Aucun changement de couple n'est nécessaire."
        de: 'Keine Drehmomentveränderung angefordert.'
      0x05:
        en: 'Less torque needed.'
        fr: 'Moins de couple nécessaire.'
        de: 'Weniger Drehmoment benötigt.'
      0x06:
        en: 'More torque needed.'
        fr: 'Plus de couple nécessaire.'
        de: 'Mehr Drehmoment benötigt.'

  GRIP_CONTROL_MODE:
    bits: '1.7-1.0' # Full byte 1 — read as uint8 threshold by node 7758
    comment:
      en: |
        Grip Control switch (node 7758, part 98052503ZD) reads byte 1 as a uint8 threshold
        value to select which LED to illuminate. The switch ignores individual bit semantics
        and uses fixed 32-step thresholds. Bench-confirmed.

        Threshold map (any value within range produces the same LED):
          0x00–0x1F  →  ESP OFF (orange)
          0x20–0x3F  →  Normal / Pavement (GREEN)
          0x40–0x5F  →  Snow (orange)
          0x60–0x7F  →  Mud / All-terrain (orange)
          0x80–0x9F  →  Sand (orange)
          0xA0–0xDF  →  No LEDs (fault / blank)
          0xE0–0xFF  →  ESP OFF driver-commanded (orange)

      fr: |
        Le sélecteur Grip Control (nœud 7758, pièce 98052503ZD) lit l'octet 1 comme une
        valeur de seuil uint8 pour sélectionner la LED à allumer.
    values:
      0x00:
        en: 'ESP OFF — uninitialised / power-on default (orange LED)'
        fr: 'ESP OFF — non initialisé / défaut démarrage (LED orange)'
        de: 'ESP AUS — nicht initialisiert / Einschalt-Standard (orange LED)'
      0x20:
        en: 'Normal / Pavement mode (GREEN LED)'
        fr: 'Mode Normal / Route (LED VERTE)'
        de: 'Normal / Asphalt-Modus (GRÜNE LED)'
      0x40:
        en: 'Snow mode (orange LED)'
        fr: 'Mode Neige (LED orange)'
        de: 'Schneemodus (orange LED)'
      0x60:
        en: 'Mud / All-terrain mode (orange LED)'
        fr: 'Mode Boue / Tout-terrain (LED orange)'
        de: 'Schlamm / Geländemodus (orange LED)'
      0x80:
        en: 'Sand mode (orange LED)'
        fr: 'Mode Sable (LED orange)'
        de: 'Sandmodus (orange LED)'
      0xE0:
        en: 'ESP OFF — driver commanded (orange LED)'
        fr: 'ESP OFF — désactivé par le conducteur (LED orange)'
        de: 'ESP AUS — vom Fahrer deaktiviert (orange LED)'

  UNKNOWN_3:
    bits: '2.7-2.0'

  TARGET_TORQUE_REDUCTION:
    bits: '3.7-3.0'
    type: 'int'
    comment:
      en: 'Torque the motor should target to gain wheel traction.'
      fr: 'Couple que le moteur doit viser pour obtenir une traction sur la roue.'
      de: 'Drehmoment des Motors welcher er erreichen sollte um Traktion der Räder zu verbessern.'
    factor: 2
    min: -100
    offset: -100
    max: 410 # 0xFF * 2 - 100
    units: "Nm"

  TORQUE_REDUCTION_TARGET: # Flipped name — also a TARGET_TORQUE_REDUCTION but YAML does not allow duplicate keys
    bits: '4.7-4.0'
    type: 'int'
    comment:
      en: 'Torque the motor should target to gain wheel traction.'
      fr: 'Couple que le moteur doit viser pour obtenir une traction sur la roue.'
      de: 'Drehmoment des Motors welcher er erreichen sollte um Traktion der Räder zu verbessern.'
    factor: 2
    min: -100
    offset: -100
    max: 410 # 0xFF * 2 - 100
    units: "Nm"

  TORQUE_INCREASE_TARGET: # Fixed typo: TORQUE_INCRESE_TARGET → TORQUE_INCREASE_TARGET
    bits: '5.7-5.0'
    type: 'int'
    comment:
      en: 'Torque the motor should target to gain wheel traction.'
      fr: 'Couple que le moteur doit viser pour obtenir une traction sur la roue.'
      de: 'Drehmoment des Motors welcher er erreichen sollte um Traktion der Räder zu verbessern.'
    factor: 2
    min: -100
    offset: -100
    max: 410 # 0xFF * 2 - 100
    units: "Nm"

  UNKNOWN_4:
    bits: '6.7-6.0'

  REGULATION_SYSTEMS:
    bits: '7.7-7.1'
    comment:
      en: 'If any of these bits are 1 a system is active, depending on the bit you can tell which system is active. Exact bit-to-system mapping unconfirmed.'
      fr: "Si l'un de ces bits est égal à 1, un système est actif. En fonction du bit, vous pouvez déterminer quel système est actif. La correspondance exacte bit-système n'est pas confirmée."
      de: 'Wenn einer dieser Bits auf 1 springt ist ein Traktionssystem aktiv, je nachdem welcher Bit auf 1 springt weiß man welches System aktiv ist. Genaue Bit-zu-System-Zuordnung unbestätigt.'

  UNKNOWN_5:
    bits: '7.0'

  UNKNOWN_6:
    bits: '8.7-8.0'
