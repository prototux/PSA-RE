id: 0x40D
name: 'WHEEL_SPEED_RAW_2'
alt_names: ['ABS_WHEEL_INCREMENTOR']
type: 'can'
length: 8
comment:
  en: 'Unfiltered wheel speeds, front and rear, left and right.'
  fr: 'Vitesses roues non filtrées, avant et arrière, gauche et droite.'
  es: 'Velocidades de rueda sin filtrar, delantera y trasera, izquierda y derecha.'
  de: 'Ungefilterte Raddrehzahlen, vorne und hinten, links und rechts.'
  it: 'Velocità ruota non filtrate, anteriore e posteriore, sinistra e destra.'
  pl: 'Niefiltrowane prędkości kół, przód i tył, lewe i prawe.'
  ru: 'Нефильтрованные скорости колёс, спереди и сзади, слева и справа.'
  zh: '未经滤波的车轮速度,前后左右。'
  hu: 'Szűretlen kerék sebességek, elöl és hátul, bal és jobb oldalon.'
  pt: 'Velocidades das rodas não filtradas, dianteiras e traseiras, esquerda e direita.'
periodicity: ['20ms']
senders: ['ABS']
receivers:
  - 'ARTIV'
  - 'SBW'
  - 'CAAR'
  - 'DSG'
  - 'HCU1'
  - 'ACC'
  - 'AMVAR'
  - 'AR2S'
  - 'BSI'
  - 'BVA'
  - 'ACCEL_SENSOR'
  - 'CAV'
  - 'CGPL'
  - 'CMEL'
  - 'CMM'
  - 'CSS'
  - 'FSE'
  - 'DIAG_TOOL'
  - 'BCP'
  - 'SCDT'
  - 'BHI'
  - 'TBMU'
  - 'DAE'

