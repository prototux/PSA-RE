      fr: 'Vitesse de la roue avant gauche non filtrée'
      es: 'Velocidad de la rueda delantera izquierda sin filtrar'
      de: 'Ungefilterte Raddrehzahl vorne links'
      it: 'Velocità ruota anteriore sinistra non filtrata'
