id: 0x4C8
name: 'CRASH_STATUS'
type: 'can'
length: 3
comment:
  en: 'Crash detection status, repeated every 50 ms once a crash is detected, until ignition is switched off.'
  fr: 'État de détection de choc, répété toutes les 50 ms une fois un choc détecté, jusqu''à la coupure du contact.'
  es: 'Estado de detección de impacto, repetido cada 50 ms una vez detectado un impacto, hasta el corte del contacto.'
  de: 'Crash-Erkennungsstatus, wiederholt alle 50 ms nach Erkennung eines Aufpralls, bis zum Abschalten der Zündung.'
  it: 'Stato di rilevamento urto, ripetuto ogni 50 ms una volta rilevato un urto, fino allo spegnimento del contatto.'
  pl: 'Stan wykrywania zderzenia, powtarzany co 50 ms po wykryciu zderzenia, aż do wyłączenia zapłonu.'
  ru: 'Статус обнаружения столкновения, повторяется каждые 50 мс после обнаружения удара, до выключения зажигания.'
  zh: '碰撞检测状态,一旦检测到碰撞,每50毫秒重复发送一次,直至点火开关关闭。'
  hu: 'Ütközésérzékelési állapot, ütközés észlelése után 50 ms-enként ismételve a gyújtás kikapcsolásáig.'
  pt: 'Estado de deteção de colisão, repetido a cada 50 ms assim que uma colisão é detetada, até a ignição ser desligada.'
observations:
  en: 'Sent to trigger passive safety devices in the event of a crash or rollover. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Émise pour déclencher les éléments de sécurité passive en cas de choc ou de retournement. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Enviada para activar los elementos de seguridad pasiva en caso de choque o vuelco. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Gesendet zur Auslösung der passiven Sicherheitselemente bei einem Aufprall oder Überschlag. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Inviata per attivare gli elementi di sicurezza passiva in caso di urto o ribaltamento. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane w celu uruchomienia elementów bezpieczeństwa biernego w razie zderzenia lub dachowania. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'Отправляется для срабатывания элементов пассивной безопасности при столкновении или опрокидывании. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '在发生碰撞或翻车时发送,以触发被动安全装置. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'Küldve a passzív biztonsági elemek működésbe hozatalához ütközés vagy borulás esetén. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Enviada para acionar os dispositivos de segurança passiva em caso de colisão ou capotamento. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['trigger']
senders: ['BSI']
receivers:
  - 'PIU'
  - 'CMM'
  - 'HCU1'
  - 'ACC'
  - 'AMVAR'
  - 'AR2S'
  - 'BVA'
  - 'CAAR'
  - 'ACCEL_SENSOR'
  - 'CAV'
  - 'CGPL'
  - 'CMEL'
  - 'CSS'
  - 'DSG'
  - 'FSE'
  - 'DIAG_TOOL'
  - 'BCP'
  - 'SBW'
  - 'SCDT'
  - 'BHI'
  - 'TBMU'
  - 'DAE'
  - 'ABS'

signals:
  UNUSED_1:
    bits: '1.7-1.0'
    unused: true

  UNUSED_2:
    bits: '2.1'
    unused: true

  CRASH_DETECTED_SINCE_LAST_POWER_UP:
    bits: '2.0'
    comment:
      en: 'Crash detected since the last power-up'
      fr: 'Choc détecté depuis la dernière mise sous tension'
      es: 'Choque detectado desde el último encendido'
      de: 'Crash seit dem letzten Einschalten erkannt'
      it: 'Urto rilevato dall''ultima accensione'
      pl: 'Wykryto zderzenie od ostatniego włączenia'
      ru: 'Авария обнаружена с момента последнего включения питания'
      zh: '自上次上电以来检测到碰撞'
      hu: 'Ütközés érzékelve a legutóbbi bekapcsolás óta'
      pt: 'Colisão detetada desde a última ativação'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No crash since +APC'
        fr: 'Pas de choc depuis + APC'
        es: 'Sin choque desde +APC'
        de: 'Kein Crash seit +APC'
        it: 'Nessun urto dall''accensione (+APC)'
        pl: 'Brak zderzenia od włączenia zapłonu (+APC)'
        ru: 'Нет столкновения с момента +APC'
        zh: '自+APC以来无碰撞'
        hu: 'Nincs ütközés a +APC óta'
        pt: 'Sem colisão desde +APC'
      0x01:
        en: 'Crash detected since last +APC'
        fr: 'Choc détecté depuis la dernière mise du +APC'
        es: 'Impacto detectado desde el último +APC'
        de: 'Aufprall seit dem letzten +APC erkannt'
        it: 'Urto rilevato dall''ultima attivazione di +APC'
        pl: 'Wykryto uderzenie od ostatniego +APC'
        ru: 'Обнаружен удар с момента последнего +APC'
        zh: '自上次+APC以来检测到碰撞'
        hu: 'Ütközés érzékelve az utolsó +APC óta'
        pt: 'Colisão detetada desde o último +APC'

  UNUSED_3:
    bits: '3.7-3.0'
    unused: true
