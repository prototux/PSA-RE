id: 0x2EB
name: 'AUTOMATED_PARKING_STEERING_DATA'
type: 'can'
length: 4
comment:
  en: 'Automated parking steering data: driving-direction request, steering-column control request, angle setpoint, function request and relax request.'
  fr: 'Données de direction pour le parking automatisé : demande de sens de conduite, demande de contrôle de la colonne de direction, consigne d''angle, demande de fonction et demande de relâchement.'
  es: 'Datos de dirección para el aparcamiento automatizado: solicitud de sentido de marcha, solicitud de control de la columna de dirección, consigna de ángulo, solicitud de función y solicitud de relajación.'
  de: 'Lenkdaten für das automatisierte Einparken: Fahrtrichtungsanforderung, Lenksäulen-Kontrollanforderung, Winkelsollwert, Funktionsanforderung und Entspannungsanforderung.'
  it: 'Dati di sterzata per il parcheggio automatizzato: richiesta di direzione di marcia, richiesta di controllo del piantone dello sterzo, setpoint dell''angolo, richiesta di funzione e richiesta di rilascio.'
  pl: 'Dane sterowania dla zautomatyzowanego parkowania: żądanie kierunku jazdy, żądanie kontroli kolumny kierownicy, nastawa kąta, żądanie funkcji i żądanie zwolnienia.'
  ru: 'Данные рулевого управления для автоматизированной парковки: запрос направления движения, запрос управления рулевой колонкой, уставка угла, запрос функции и запрос расслабления.'
  zh: '自动泊车转向数据:行驶方向请求、转向柱控制请求、角度设定值、功能请求和放松请求。'
  hu: 'Automatizált parkolási kormányzási adatok: menetirány kérés, kormányoszlop-vezérlési kérés, szögalapjel, funkciókérés és kioldási kérés.'
  pt: 'Dados de direção do estacionamento automático: pedido de sentido de marcha, pedido de comando da coluna de direção, ponto de ajuste de ângulo, pedido de função e pedido de relaxamento.'
periodicity: ['20ms']
senders: ['AAS']

signals:
  CITYPARK_ANGLE_SETPOINT:
    bits: '1.7-2.0'
    comment:
      en: 'Citypark steering angle setpoint'
      fr: 'Consigne d''angle de braquage Citypark'
      es: 'Consigna de ángulo de dirección Citypark'
      de: 'Lenkwinkel-Sollwert für Citypark'
      it: 'Valore di riferimento dell''angolo di sterzata Citypark'
      pl: 'Wartość zadana kąta skrętu Citypark'
      ru: 'Заданное значение угла поворота руля Citypark'
      zh: 'Citypark转向角设定值'
      hu: 'A Citypark kormányzási szögének alapjele'
      pt: 'Consigna de ângulo de direção Citypark'
    type: 'uint'

  CITYPARK_FUNCTION_REQUEST:
    bits: '3.7-3.6'
    comment:
      en: 'Citypark parking assist function request'
      fr: 'Demande d''activation de la fonction Citypark'
      es: 'Solicitud de activación de la función Citypark'
      de: 'Aktivierungsanforderung der Citypark-Funktion'
      it: 'Richiesta di attivazione della funzione Citypark'
      pl: 'Żądanie aktywacji funkcji Citypark'
      ru: 'Запрос активации функции Citypark'
      zh: 'Citypark功能激活请求'
      hu: 'A Citypark funkció aktiválási kérése'
      pt: 'Pedido de ativação da função Citypark'
    type: 'uint'

  CITYPARK_REGULATION_REQUEST:
    bits: '3.5-3.4'
    comment:
      en: 'Citypark parking assist regulation request'
      fr: 'Demande de régulation de l''assistant de stationnement Citypark'
      es: 'Solicitud de regulación del asistente de aparcamiento Citypark'
      de: 'Regelungsanforderung des Einparkassistenten Citypark'
      it: 'Richiesta di regolazione dell''assistente al parcheggio Citypark'
      pl: 'Żądanie regulacji asystenta parkowania Citypark'
      ru: 'Запрос регулирования системы парковки Citypark'
      zh: 'Citypark泊车辅助调节请求'
      hu: 'A Citypark parkolássegítő szabályozási kérése'
      pt: 'Pedido de regulação do assistente de estacionamento Citypark'
    type: 'uint'

  CITYPARK_ECU_CHECKSUM:
    bits: '4.7-4.4'
    comment:
      en: 'Checksum of the Citypark control unit'
      fr: 'Somme de contrôle du calculateur Citypark'
      es: 'Checksum de la unidad de control Citypark'
      de: 'Prüfsumme des Citypark-Steuergeräts'
      it: 'Checksum della centralina Citypark'
      pl: 'Suma kontrolna sterownika Citypark'
      ru: 'Контрольная сумма блока управления Citypark'
      zh: 'Citypark控制单元校验和'
      hu: 'A Citypark vezérlőegység ellenőrző összege'
      pt: 'Soma de verificação da unidade de controlo Citypark'
    type: 'uint'

  CITYPARK_ALIVE_COUNTER:
    bits: '4.3-4.0'
    comment:
      en: '4-bit rolling counter of the Citypark control unit'
      fr: 'Compteur cyclique 4 bits du calculateur Citypark'
      es: 'Contador cíclico de 4 bits de la unidad de control Citypark'
      de: '4-Bit-Lebenszeichenzähler des Citypark-Steuergeräts'
      it: 'Contatore ciclico a 4 bit della centralina Citypark'
      pl: '4-bitowy licznik cykliczny sterownika Citypark'
      ru: '4-битный циклический счётчик блока управления Citypark'
      zh: 'Citypark控制单元的4位循环计数器'
      hu: 'A Citypark vezérlőegység 4 bites körforgó számlálója'
      pt: 'Contador cíclico de 4 bits da unidade de controlo Citypark'
    type: 'uint'
