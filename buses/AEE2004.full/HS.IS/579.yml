id: 0x579
name: 'ACCEL_SENSOR_DATA'
type: 'can'
length: 8
comment:
  en: 'Tri-sensor (accelerometer) data 2: characterisation bytes and internal pointer/offset.'
  fr: 'Données tricapteur (accéléromètre) 2 : octets de caractérisation et pointeur/offset interne.'
  es: 'Datos del tricaptador (acelerómetro) 2: bytes de caracterización y puntero/offset interno.'
  de: 'Trisensor-(Beschleunigungssensor-)Daten 2: Charakterisierungsbytes und interner Zeiger/Offset.'
  it: 'Dati del tricaptatore (accelerometro) 2: byte di caratterizzazione e puntatore/offset interno.'
  pl: 'Dane triczujnika (akcelerometru) 2: bajty charakteryzujące oraz wewnętrzny wskaźnik/offset.'
  ru: 'Данные трёхдатчика (акселерометра) 2: байты характеризации и внутренний указатель/смещение.'
  zh: '三传感器(加速度计)数据2:特征字节和内部指针/偏移量。'
  hu: 'Háromtengelyes érzékelő (gyorsulásmérő) 2. adatai: karakterizációs bájtok és belső mutató/eltolás.'
  pt: 'Dados 2 do tri-sensor (acelerómetro): bytes de caracterização e ponteiro/offset interno.'
observations:
  en: 'Sent in response to the ESP'
  fr: 'Trame émise pour répondre à l''ESP'
  es: 'Enviada en respuesta al ESP'
  de: 'Gesendet als Antwort an das ESP'
  it: 'Inviata in risposta all''ESP'
  pl: 'Wysyłane w odpowiedzi dla ESP'
  ru: 'Отправляется в ответ на запрос ESP'
  zh: '响应ESP时发送'
  hu: 'Az ESP-nek adott válaszként küldve'
  pt: 'Enviada em resposta ao ESP'
periodicity: ['trigger']
senders: ['ACCEL_SENSOR']
receivers:
  - 'ABS'
  - 'ACC'
  - 'AMVAR'
  - 'AR2S'
  - 'BSI'
  - 'BVA'
  - 'CAAR'
  - 'CAV'
