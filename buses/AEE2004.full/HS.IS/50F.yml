id: 0x50F
name: 'TPMS_WHEEL_STATE'
alt_names: ['DSG_STATUS']
type: 'can'
length: 6
comment:
  en: 'Tyre pressure monitoring system state: system status and individual wheel status (front/rear, left/right).'
  fr: 'État du système de surveillance de pression des pneus : état système et état de chaque roue (avant/arrière, gauche/droite).'
  es: 'Estado del sistema de control de presión de neumáticos: estado del sistema y estado de cada rueda (delantera/trasera, izquierda/derecha).'
  de: 'Status des Reifendruckkontrollsystems: Systemstatus und Status jedes Rads (vorne/hinten, links/rechts).'
  it: 'Stato del sistema di controllo della pressione dei pneumatici: stato del sistema e stato di ogni ruota (anteriore/posteriore, sinistra/destra).'
  pl: 'Stan systemu monitorowania ciśnienia w oponach: stan systemu i stan każdego koła (przód/tył, lewe/prawe).'
  ru: 'Статус системы контроля давления в шинах: статус системы и статус каждого колеса (переднее/заднее, левое/правое).'
  zh: '胎压监测系统状态:系统状态和每个车轮的状态(前/后,左/右)。'
  hu: 'Az abroncsnyomás-ellenőrző rendszer állapota: rendszerállapot és az egyes kerekek állapota (első/hátsó, bal/jobb).'
  pt: 'Estado do sistema de monitorização da pressão dos pneus: estado do sistema e estado individual de cada roda (dianteira/traseira, esquerda/direita).'
periodicity: ['300ms']
senders: ['DSG']
receivers:
  - 'BSI'
  - 'HCU1'
  - 'ACC'
  - 'AMVAR'
  - 'AR2S'
  - 'BVA'
  - 'CAAR'
  - 'ACCEL_SENSOR'
  - 'CAV'
  - 'CGPL'
  - 'CMEL'
  - 'CMM'
  - 'CSS'
  - 'FSE'
  - 'DIAG_TOOL'
  - 'BCP'
  - 'SBW'
  - 'SCDT'
  - 'BHI'
  - 'TBMU'
  - 'DAE'
  - 'ABS'

signals:
  FRONT_LEFT_WHEEL_STATUS:
    bits: '1.4-1.0'
