      it: 'Stato di pressione del pneumatico anteriore sinistro'
      pl: 'Stan ciśnienia opony przedniej lewej'
      ru: 'Статус давления в шине переднего левого колеса'
      zh: '左前轮胎压状态'
      hu: 'Az első bal kerék gumiabroncsnyomás-állapota'
      pt: 'Estado da pressão do pneu da roda dianteira esquerda'
    type: 'enum'
