id: 0x0E0
name: 'IMMO_RESPONSE_CLIENT'
type: 'can'
length: 5
comment:
  en: 'Unlocking confirmation frame sent by the immobilizer client unit to the engine ECU.'
  fr: 'Trame de confirmation de déverrouillage envoyée par le calculateur client antidémarrage au calculateur moteur.'
  es: 'Trama de confirmación de desbloqueo enviada por la centralita cliente del inmovilizador a la centralita del motor.'
  de: 'Entriegelungsbestätigungsrahmen, vom Wegfahrsperren-Client-Steuergerät an das Motorsteuergerät gesendet.'
  it: 'Trama di conferma di sblocco inviata dalla centralina client immobilizzatore alla centralina motore.'
  pl: 'Ramka potwierdzenia odblokowania wysyłana przez sterownik klienta immobilizera do sterownika silnika.'
  ru: 'Кадр подтверждения разблокировки, отправляемый клиентским блоком иммобилайзера в ЭБУ двигателя.'
  zh: '由防盗客户端单元发送给发动机ECU的解锁确认帧。'
  hu: 'Az indításgátló kliens vezérlőegység feloldási megerősítő kerete, a motorvezérlő egységnek küldve.'
  pt: 'Trama de confirmação de destrancagem enviada pela unidade cliente do imobilizador à unidade de controlo do motor.'
observations:
  en: 'Event defined by the ADC MUX protocol'
  fr: 'Événement défini par le protocole ADC MUX'
  es: 'Evento definido por el protocolo ADC MUX'
  de: 'Durch das ADC-MUX-Protokoll definiertes Ereignis'
  it: 'Evento definito dal protocollo ADC MUX'
  pl: 'Zdarzenie zdefiniowane przez protokół ADC MUX'
  ru: 'Событие определяется протоколом ADC MUX'
  zh: '由ADC MUX协议定义的事件'
  hu: 'Az ADC MUX protokoll által meghatározott esemény'
  pt: 'Evento definido pelo protocolo ADC MUX'
periodicity: ['trigger']
senders: []  # TODO: find the sender(s)
receivers: ['CMM']

signals:
  BSI_UNLOCK_KEY_AUTHORIZATION:
    bits: '1.7-1.0'
    comment:
      en: 'Unlocking authorization (BSI key emission)'
      fr: 'Autorisation de déverrouillage (émission de la clé BSI)'
      es: 'Autorización de desbloqueo (emisión de la llave BSI)'
      de: 'Entriegelungsfreigabe (Aussenden des BSI-Schlüssels)'
      it: 'Autorizzazione allo sblocco (emissione della chiave BSI)'
      pl: 'Autoryzacja odblokowania (wysłanie klucza BSI)'
      ru: 'Разрешение на разблокировку (передача ключа BSI)'
      zh: '解锁授权(BSI密钥发送)'
      hu: 'Kioldási engedély (BSI kulcs kibocsátása)'
      pt: 'Autorização de desbloqueio (emissão da chave BSI)'
    type: 'uint'

  UCC_KEY_HIGHEST_BYTE:
