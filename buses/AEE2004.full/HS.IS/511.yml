id: 0x511
name: 'ADAPTIVE_DAMPER_STATUS_2'
type: 'can'
length: 1
comment:
  en: 'Adaptive damper (AMVAR) status: fault, current state, sport mode state and suspension warning-lamp request.'
  fr: 'État des amortisseurs pilotés (AMVAR) : défaut, état courant, état mode sport et demande de voyant suspension.'
  es: 'Estado de los amortiguadores pilotados (AMVAR): fallo, estado actual, estado de modo deportivo y solicitud de testigo de suspensión.'
  de: 'Status der adaptiven Dämpfer (AMVAR): Fehler, aktueller Zustand, Sportmodus-Zustand und Anforderung der Fahrwerks-Kontrollleuchte.'
  it: 'Stato degli ammortizzatori pilotati (AMVAR): guasto, stato corrente, stato modalità sport e richiesta spia sospensioni.'
  pl: 'Stan amortyzatorów sterowanych (AMVAR): usterka, aktualny stan, stan trybu sportowego i żądanie kontrolki zawieszenia.'
  ru: 'Статус адаптивных амортизаторов (AMVAR): неисправность, текущее состояние, состояние спортивного режима и запрос индикатора подвески.'
  zh: '自适应减震器(AMVAR)状态:故障、当前状态、运动模式状态和悬挂警示灯请求。'
  hu: 'Az adaptív lengéscsillapítók (AMVAR) állapota: hiba, aktuális állapot, sport üzemmód állapota és felfüggesztés jelzőlámpa-kérés.'
  pt: 'Estado dos amortecedores adaptativos (AMVAR): avaria, estado atual, estado do modo desportivo e pedido da luz avisadora da suspensão.'
periodicity: ['100ms']
senders: ['BHI']
receivers: ['CMM']

signals:
  SUSPENSION_FAULT_LAMP_REQUEST:
    bits: '1.4'
    comment:
      en: 'Request to light the suspension fault warning lamp'
      fr: 'Demande d''allumage du témoin de défaut de suspension'
      es: 'Solicitud de encendido del testigo de fallo de suspensión'
      de: 'Anforderung zum Einschalten der Fahrwerks-Fehlerkontrollleuchte'
      it: 'Richiesta di accensione della spia di guasto sospensione'
      pl: 'Żądanie zapalenia kontrolki usterki zawieszenia'
      ru: 'Запрос на включение лампы неисправности подвески'
      zh: '请求点亮悬架故障警告灯'
      hu: 'A futómű-hiba jelzőlámpájának bekapcsolási kérése'
      pt: 'Pedido de acendimento do testemunho de falha de suspensão'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No request to light the lamp'
        fr: 'Pas de demande d''allumage de la lampe'
        es: 'Sin solicitud de encendido de la lámpara'
        de: 'Keine Anforderung zum Einschalten der Lampe'
        it: 'Nessuna richiesta di accensione della lampada'
        pl: 'Brak żądania zaświecenia lampki'
        ru: 'Нет запроса включения лампы'
        zh: '无点亮指示灯请求'
        hu: 'Nincs lámpa-bekapcsolási kérés'
        pt: 'Sem pedido de acendimento da lâmpada'
      0x01:
        en: 'Lamp lighting request'
        fr: 'Demande d''allumage de la lampe'
        es: 'Solicitud de encendido de la lámpara'
        de: 'Anforderung zum Einschalten der Lampe'
        it: 'Richiesta di accensione della lampada'
        pl: 'Żądanie zapalenia lampki'
        ru: 'Запрос на включение лампы'
        zh: '请求点亮灯'
        hu: 'A lámpa bekapcsolási kérése'
        pt: 'Pedido de acendimento da lâmpada'

  AMVAR_LEGACY_FAULT:
    bits: '1.3'
    comment:
      en: 'AMVAR variable damping system fault'
      fr: 'Défaut du système d''amortissement variable AMVAR'
      es: 'Fallo del sistema de amortiguación variable AMVAR'
      de: 'Störung des variablen Dämpfungssystems AMVAR'
      it: 'Guasto del sistema di ammortizzazione variabile AMVAR'
      pl: 'Usterka systemu zmiennego tłumienia AMVAR'
      ru: 'Неисправность системы изменяемого демпфирования AMVAR'
      zh: 'AMVAR 可变阻尼系统故障'
      hu: 'Az AMVAR változtatható csillapítású rendszer hibája'
      pt: 'Falha do sistema de amortecimento variável AMVAR'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No fault'
        fr: 'Pas de défaut'
        es: 'Sin fallo'
        de: 'Kein Fehler'
        it: 'Nessun guasto'
        pl: 'Brak usterki'
