        pl: 'Usterka AMVAR'
        ru: 'Неисправность AMVAR'
        zh: 'AMVAR故障'
        hu: 'AMVAR hibás'
        pt: 'AMVAR com falha'

  VARIABLE_DAMPER_SPORT_STATE:
