      zh: '添加剂系统状态,供发动机ECU用于应急策略'
      hu: 'Adalékrendszer állapota, amelyet a motorvezérlő tartalék stratégiákhoz használ'
      pt: 'Estado do sistema de aditivo, utilizado pela unidade de controlo do motor para as estratégias de emergência'
    type: 'uint'
    default: 0x00

  EOBD_INFO_STATUS_BSI:
    bits: '7.7-7.0'
    comment:
      en: 'EOBD information status as seen by the BSI'
      fr: 'État des informations EOBD vu par la BSI'
      es: 'Estado de la información EOBD visto por la BSI'
      de: 'Status der EOBD-Informationen aus Sicht des BSI'
