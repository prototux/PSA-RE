    default: 0xFC

  ADDITIVE_SYSTEM_STATUS:
    bits: '6.7-6.0'
    comment:
      en: 'Additive (FAP) system status, used by the engine ECU for fallback strategies'
      fr: 'État du système d''additivation, utilisé par le calculateur moteur pour les stratégies de secours'
      es: 'Estado del sistema de aditivo, utilizado por la centralita del motor para las estrategias de emergencia'
