id: 0x588
name: 'ENGINE_DATA_2'
type: 'can'
length: 8
comment:
  en: 'Engine data 2: oil pressure alert, additive pump control, warning LED commands, software fault, water pump status, stop-start state, eco-driving indicator and oil level.'
  fr: 'Données moteur 2 : alerte pression d''huile, commande pompe additif, commandes LED d''avertissement, défaut logiciel, état pompe à eau, état stop-start, indicateur éco-conduite et niveau d''huile.'
  es: 'Datos del motor 2: alerta de presión de aceite, control de bomba de aditivo, comandos de LED de advertencia, fallo de software, estado de la bomba de agua, estado stop-start, indicador de conducción económica y nivel de aceite.'
  de: 'Motordaten 2: Öldruckwarnung, Additivpumpensteuerung, Warn-LED-Befehle, Softwarefehler, Wasserpumpenstatus, Stopp-Start-Zustand, Eco-Fahranzeige und Ölstand.'
  it: 'Dati motore 2: allarme pressione olio, comando pompa additivo, comandi LED di avviso, guasto software, stato pompa acqua, stato stop-start, indicatore guida ecologica e livello olio.'
  pl: 'Dane silnika 2: alarm ciśnienia oleju, sterowanie pompą dodatku, polecenia diod ostrzegawczych, usterka oprogramowania, stan pompy wody, stan stop-start, wskaźnik eko-jazdy i poziom oleju.'
  ru: 'Данные двигателя 2: сигнал давления масла, управление насосом присадки, команды предупреждающих светодиодов, программный сбой, статус водяного насоса, состояние старт-стоп, индикатор экономичного вождения и уровень масла.'
  zh: '发动机数据2:机油压力警报、添加剂泵控制、警示LED命令、软件故障、水泵状态、启停状态、经济驾驶指示和机油油位。'
  hu: 'Motoradatok 2: olajnyomás riasztás, adalékszivattyú vezérlés, figyelmeztető LED parancsok, szoftverhiba, vízszivattyú állapot, stop-start állapot, eco-vezetés jelző és olajszint.'
  pt: 'Dados 2 do motor: alerta de pressão de óleo, comando da bomba de aditivo, comandos do LED avisador, avaria de software, estado da bomba de água, estado do stop-start, indicador de condução económica e nível de óleo.'
periodicity: ['100ms']
senders: ['CMM']
receivers:
  - 'BVA'
  - 'BSI'
  - 'ABS'
  - 'HCU1'
  - 'DSG'
  - 'ACC'
  - 'AMVAR'
  - 'AR2S'
  - 'CAAR'
  - 'ACCEL_SENSOR'
  - 'CAV'
  - 'CGPL'
  - 'CMEL'
  - 'CSS'
  - 'FSE'
  - 'DIAG_TOOL'
  - 'BCP'
  - 'SBW'
  - 'SCDT'
  - 'BHI'
  - 'TBMU'
  - 'DAE'

signals:
  ENGINE_OIL_LEVEL:
    bits: '1.7-1.0'
    comment:
      en: 'Engine oil level (sensor voltage)'
      fr: 'Niveau d''huile moteur (tension du capteur)'
      es: 'Nivel de aceite del motor (tensión del sensor)'
      de: 'Motorölstand (Sensorspannung)'
      it: 'Livello dell''olio motore (tensione del sensore)'
      pl: 'Poziom oleju silnikowego (napięcie czujnika)'
      ru: 'Уровень моторного масла (напряжение датчика)'
      zh: '发动机机油液位(传感器电压)'
      hu: 'Motorolajszint (érzékelő feszültsége)'
      pt: 'Nível de óleo do motor (tensão do sensor)'
    type: 'uint'
    factor: 3
    min: 0
    max: 750
    units: 'mV'
    invalid: 0xFF
    default: 0xFE

  ADDITIVE_VOLUME_TO_ADD:
    bits: '2.7-2.0'
