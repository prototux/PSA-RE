id: 0x36D
name: 'CHASSIS_CONTROL_EHB_DATA'
type: 'can'
length: 8
comment:
  en: 'Chassis control (CGC) dynamic data from the electro-hydraulic brake: yaw correction moment, measured brake pressure per wheel and target brake distribution.'
  fr: 'Données dynamiques de contrôle châssis (CGC) du frein électro-hydraulique : moment de correction de lacet, pression de frein mesurée par roue et répartition de freinage cible.'
  es: 'Datos dinámicos de control de chasis (CGC) del freno electrohidráulico: momento de corrección de guiñada, presión de freno medida por rueda y reparto de frenado objetivo.'
  de: 'Fahrwerksregelungs-(CGC-)Dynamikdaten der elektrohydraulischen Bremse: Gierkorrekturmoment, gemessener Bremsdruck je Rad und Ziel-Bremskraftverteilung.'
  it: 'Dati dinamici di controllo telaio (CGC) del freno elettroidraulico: momento di correzione imbardata, pressione freno misurata per ruota e ripartizione frenata obiettivo.'
  pl: 'Dane dynamiczne sterowania podwoziem (CGC) hamulca elektrohydraulicznego: moment korekcji odchylenia, zmierzone ciśnienie hamulca na koło i docelowy rozdział hamowania.'
  ru: 'Динамические данные управления шасси (CGC) электрогидравлического тормоза: момент коррекции рыскания, измеренное давление тормоза по колёсам и целевое распределение торможения.'
  zh: '电液制动的底盘控制(CGC)动态数据:横摆修正力矩、每个车轮的测量制动压力和目标制动分配。'
  hu: 'Az elektrohidraulikus fék alvázvezérlési (CGC) dinamikus adatai: legyezés-korrekciós nyomaték, mért fékrenyomás keronként és célzott fékerő-elosztás.'
  pt: 'Dados dinâmicos de controlo de chassis (CGC) do travão eletro-hidráulico: momento de correção de guinada, pressão de travagem medida por roda e distribuição-alvo de travagem.'
periodicity: ['10ms']
senders: ['ABS']

signals:
  FRONT_LEFT_BRAKE_PRESSURE:
    bits: '1.7-1.0'
    comment:
      en: 'Measured brake pressure at the front left wheel'
      fr: 'Pression de freinage mesurée à la roue avant gauche'
      es: 'Presión de frenado medida en la rueda delantera izquierda'
      de: 'Gemessener Bremsdruck am Rad vorne links'
      it: 'Pressione frenante misurata alla ruota anteriore sinistra'
      pl: 'Zmierzone ciśnienie hamowania na kole przednim lewym'
      ru: 'Измеренное тормозное давление на переднем левом колесе'
      zh: '左前轮实测制动压力'
      hu: 'Az elülső bal keréknél mért féknyomás'
      pt: 'Pressão de travagem medida na roda dianteira esquerda'
    type: 'uint'
    factor: 1
    offset: -55
    min: -55
    max: 199
    units: 'bar'
    invalid: 0xFF
    default: 0x00

  FRONT_RIGHT_BRAKE_PRESSURE:
    bits: '2.7-2.0'
    comment:
      en: 'Measured brake pressure at the front right wheel'
      fr: 'Pression de freinage mesurée à la roue avant droite'
      es: 'Presión de frenado medida en la rueda delantera derecha'
      de: 'Gemessener Bremsdruck am Rad vorne rechts'
      it: 'Pressione frenante misurata alla ruota anteriore destra'
      pl: 'Zmierzone ciśnienie hamowania na kole przednim prawym'
      ru: 'Измеренное тормозное давление на переднем правом колесе'
      zh: '右前轮实测制动压力'
      hu: 'Az elülső jobb keréknél mért féknyomás'
      pt: 'Pressão de travagem medida na roda dianteira direita'
    type: 'uint'
    factor: 1
    offset: -55
    min: -55
    max: 199
    units: 'bar'
    invalid: 0xFF
    default: 0x00

  REAR_LEFT_BRAKE_PRESSURE:
    bits: '3.7-3.0'
    comment:
      en: 'Measured brake pressure at the rear left wheel'
      fr: 'Pression de freinage mesurée à la roue arrière gauche'
      es: 'Presión de frenado medida en la rueda trasera izquierda'
      de: 'Gemessener Bremsdruck am Rad hinten links'
      it: 'Pressione frenante misurata alla ruota posteriore sinistra'
      pl: 'Zmierzone ciśnienie hamowania na kole tylnym lewym'
      ru: 'Измеренное тормозное давление на заднем левом колесе'
      zh: '左后轮实测制动压力'
      hu: 'A hátsó bal keréknél mért féknyomás'
      pt: 'Pressão de travagem medida na roda traseira esquerda'
    type: 'uint'
    factor: 1
    offset: -55
    min: -55
    max: 199
    units: 'bar'
    invalid: 0xFF
    default: 0x00

  REAR_RIGHT_BRAKE_PRESSURE:
    bits: '4.7-4.0'
    comment:
      en: 'Measured brake pressure at the rear right wheel'
      fr: 'Pression de freinage mesurée à la roue arrière droite'
      es: 'Presión de frenado medida en la rueda trasera derecha'
      de: 'Gemessener Bremsdruck am Rad hinten rechts'
      it: 'Pressione frenante misurata alla ruota posteriore destra'
      pl: 'Zmierzone ciśnienie hamowania na kole tylnym prawym'
      ru: 'Измеренное тормозное давление на заднем правом колесе'
      zh: '右后轮实测制动压力'
      hu: 'A hátsó jobb keréknél mért féknyomás'
      pt: 'Pressão de travagem medida na roda traseira direita'
    type: 'uint'
    factor: 1
    offset: -55
    min: -55
    max: 199
    units: 'bar'
    invalid: 0xFF
    default: 0x00

  YAW_CORRECTION_TORQUE:
    bits: '5.7-5.0'
    comment:
      en: 'Yaw correction torque'
      fr: 'Moment correcteur de lacet'
      es: 'Momento corrector de guiñada'
      de: 'Gierkorrekturmoment'
      it: 'Momento correttivo di imbardata'
      pl: 'Moment korygujący odchylanie (yaw)'
      ru: 'Корректирующий момент рыскания'
      zh: '横摆修正力矩'
      hu: 'Legyezés-korrekciós nyomaték'
      pt: 'Binário corretor de guinada'
    type: 'sint'
    factor: 25
    min: -3000
    max: 3000
    units: 'Nm'
    invalid: 0x7F
    default: 0x00

  FRONT_BRAKE_FORCE_DISTRIBUTION_TARGET:
    bits: '6.7-6.0'
    comment:
      en: 'Target front braking force distribution rate'
      fr: 'Taux cible de répartition de l''effort de freinage sur l''avant'
      es: 'Tasa objetivo de reparto de la fuerza de frenado en el eje delantero'
      de: 'Ziel-Verteilungsrate der Bremskraft auf die Vorderachse'
      it: 'Tasso obiettivo di ripartizione della forza frenante sull''avantreno'
      pl: 'Docelowy wskaźnik rozdziału siły hamowania na oś przednią'
      ru: 'Целевая доля распределения тормозного усилия на переднюю ось'
      zh: '前轴制动力目标分配比例'
      hu: 'Az első tengelyre eső fékerő-elosztás célaránya'
      pt: 'Taxa-alvo de repartição da força de travagem no eixo dianteiro'
    type: 'uint'
    factor: 0.5
    min: 0
    max: 100
    units: '%'
    invalid: 0xFF
    default: 0x3C
