id: 0x390
name: 'ADAPTIVE_DAMPER_STATUS'
type: 'can'
length: 3
comment:
  en: 'Adaptive damper status: measured ride height, fault, state and suspension warning-lamp request.'
  fr: 'État des amortisseurs pilotés : assiette véhicule mesurée, défaut, état et demande de voyant suspension.'
  es: 'Estado de los amortiguadores pilotados: altura de marcha medida, fallo, estado y solicitud de testigo de suspensión.'
  de: 'Status der adaptiven Dämpfer: gemessene Fahrhöhe, Fehler, Zustand und Anforderung der Fahrwerks-Kontrollleuchte.'
  it: 'Stato degli ammortizzatori pilotati: assetto veicolo misurato, guasto, stato e richiesta spia sospensioni.'
  pl: 'Stan amortyzatorów sterowanych: zmierzona wysokość jazdy, usterka, stan i żądanie kontrolki zawieszenia.'
  ru: 'Статус адаптивных амортизаторов: измеренная высота движения, неисправность, состояние и запрос индикатора подвески.'
  zh: '自适应减震器状态:测得的行驶高度、故障、状态和悬挂警示灯请求。'
  hu: 'Az adaptív lengéscsillapítók állapota: mért menetmagasság, hiba, állapot és felfüggesztés jelzőlámpa-kérés.'
  pt: 'Estado dos amortecedores adaptativos: altura medida, avaria, estado e pedido da luz avisadora da suspensão.'
periodicity: ['40ms']
senders: ['CSS']

signals:
  AMVAR_TRIM_ANGLE:
    bits: '1.7-2.6'
    comment:
      en: 'Vehicle trim angle measured by AMVAR+'
      fr: 'Angle d''assiette du véhicule mesuré par l''AMVAR+'
      es: 'Ángulo de asiento del vehículo medido por AMVAR+'
      de: 'Fahrzeugneigungswinkel, gemessen vom AMVAR+'
      it: 'Angolo di assetto del veicolo misurato dall''AMVAR+'
      pl: 'Kąt pochylenia nadwozia pojazdu mierzony przez AMVAR+'
      ru: 'Угол наклона кузова автомобиля, измеряемый системой AMVAR+'
      zh: '由AMVAR+测得的车辆姿态角'
      hu: 'A jármű dőlésszöge az AMVAR+ mérése szerint'
      pt: 'Ângulo de assento do veículo medido pelo AMVAR+'
    type: 'uint'

  AMVAR_FAULT_LAMP_REQUEST:
    bits: '3.7'
    comment:
      en: 'Request to light the AMVAR+ warning lamp'
      fr: 'Demande d''allumage du témoin de défaut AMVAR+'
      es: 'Solicitud de encendido del testigo de fallo AMVAR+'
      de: 'Anforderung zum Einschalten der AMVAR+-Warnleuchte'
      it: 'Richiesta di accensione della spia di guasto AMVAR+'
      pl: 'Żądanie zapalenia lampki usterki AMVAR+'
      ru: 'Запрос включения индикатора неисправности AMVAR+'
      zh: '点亮AMVAR+故障灯请求'
      hu: 'Az AMVAR+ hibajelző lámpa bekapcsolási kérése'
      pt: 'Pedido de acendimento da luz avisadora de falha AMVAR+'
    type: 'bool'

  AMVAR_STATUS:
    bits: '3.6-3.5'
    comment:
      en: 'AMVAR+ system status'
      fr: 'État du système AMVAR+'
      es: 'Estado del sistema AMVAR+'
      de: 'Status des AMVAR+-Systems'
      it: 'Stato del sistema AMVAR+'
      pl: 'Stan systemu AMVAR+'
      ru: 'Состояние системы AMVAR+'
      zh: 'AMVAR+系统状态'
      hu: 'Az AMVAR+ rendszer állapota'
      pt: 'Estado do sistema AMVAR+'
    type: 'uint'

  AMVAR_FAULT:
    bits: '3.4'
    comment:
      en: 'AMVAR+ system fault'
      fr: 'Défaut du système AMVAR+'
      es: 'Fallo del sistema AMVAR+'
      de: 'Fehler des AMVAR+-Systems'
      it: 'Guasto del sistema AMVAR+'
      pl: 'Usterka systemu AMVAR+'
      ru: 'Неисправность системы AMVAR+'
      zh: 'AMVAR+系统故障'
      hu: 'Az AMVAR+ rendszer hibája'
      pt: 'Falha do sistema AMVAR+'
    type: 'bool'
