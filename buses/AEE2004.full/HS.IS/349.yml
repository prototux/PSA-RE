id: 0x349
name: 'AMT_SYNCHRONISATION_DATA'
type: 'can'
length: 8
comment:
  en: 'Automated manual gearbox synchronisation data: start authorisation, gear-change in progress, torque and RPM-regulation setpoints, maximum admissible clutch torque, EOBD faults, converter and drag state.'
  fr: 'Données de synchronisation de la boîte pilotée : autorisation de démarrage, changement de rapport en cours, consignes de couple et de régulation de régime, couple d''embrayage admissible max, défauts EOBD, état convertisseur et état de traînée.'
  es: 'Datos de sincronización de la caja pilotada: autorización de arranque, cambio de marcha en curso, consignas de par y de regulación de régimen, par de embrague máximo admisible, fallos EOBD, estado del convertidor y estado de arrastre.'
  de: 'Synchronisationsdaten des automatisierten Schaltgetriebes: Startfreigabe, laufender Gangwechsel, Drehmoment- und Drehzahlregelungssollwerte, maximal zulässiges Kupplungsmoment, EOBD-Fehler, Wandler- und Schleppzustand.'
  it: 'Dati di sincronizzazione del cambio robotizzato: autorizzazione di avviamento, cambio marcia in corso, setpoint di coppia e regolazione regime, coppia frizione massima ammissibile, guasti EOBD, stato convertitore e stato di trascinamento.'
  pl: 'Dane synchronizacji skrzyni zautomatyzowanej: autoryzacja rozruchu, trwająca zmiana biegu, nastawy momentu i regulacji obrotów, maksymalny dopuszczalny moment sprzęgła, usterki EOBD, stan przetwornika i stan wleczenia.'
  ru: 'Данные синхронизации роботизированной коробки: разрешение запуска, выполняемое переключение передачи, уставки момента и регулирования оборотов, максимально допустимый момент сцепления, неисправности EOBD, состояние преобразователя и состояние волочения.'
  zh: '自动手动变速箱同步数据:启动授权、换挡进行中、扭矩和转速调节设定值、最大允许离合器扭矩、EOBD故障、变矩器和拖曳状态。'
  hu: 'Az automatizált manuális váltó szinkronizációs adatai: indítás engedélyezése, folyamatban lévő fokozatváltás, nyomaték- és fordulatszám-szabályozási alapjelek, maximálisan megengedett kuplungnyomaték, EOBD hibák, átalakító és vonszolási állapot.'
  pt: 'Dados de sincronização da caixa de velocidades pilotada: autorização de arranque, mudança em curso, pontos de ajuste de binário e de regulação de rotações, binário máximo admissível na embraiagem, avarias EOBD, estado do conversor e de arrasto.'
periodicity: ['10ms']
senders: ['BVA']
receivers:
  - 'ABS'
  - 'SCDT'
  - 'BCP'
  - 'FSE'
  - 'CMM'
  - 'AR2S'
  - 'ACC'
  - 'AMVAR'
  - 'BSI'
  - 'CAAR'
  - 'ACCEL_SENSOR'
  - 'CAV'
  - 'CGPL'
  - 'CMEL'
  - 'CSS'
  - 'DSG'
  - 'DIAG_TOOL'
  - 'SBW'
  - 'BHI'
  - 'TBMU'
  - 'DAE'

signals:
  GEARBOX_EOBD_FAULTS:
    bits: '1.7-1.4'
    comment:
      en: 'Gearbox EOBD (emission-related on-board diagnosis) faults.'
      fr: 'Défauts EOBD (diagnostic embarqué antipollution) de la boîte de vitesses.'
      es: 'Fallos EOBD (diagnóstico a bordo de emisiones) de la caja de cambios.'
      de: 'EOBD-Fehler (emissionsbezogene On-Board-Diagnose) des Getriebes.'
      it: 'Guasti EOBD (diagnosi di bordo emissioni) del cambio.'
      pl: 'Usterki EOBD (pokładowej diagnostyki emisji) skrzyni biegów.'
      ru: 'Неисправности EOBD (бортовая диагностика по выбросам) коробки передач.'
      zh: '变速箱EOBD（车载排放诊断）故障。'
      hu: 'A váltó EOBD (fedélzeti kibocsátás-diagnosztikai) hibái.'
      pt: 'Falhas EOBD (diagnóstico a bordo antipoluição) da caixa de velocidades'
