    comment:
      en: 'Hill assist stop authorization for Stop & Start'
      fr: 'Autorisation d''arrêt de l''assistance au démarrage en côte, pour le Stop & Start'
      es: 'Autorización de parada de la asistencia de arranque en pendiente, para el Stop & Start'
      de: 'Freigabe zum Stoppen der Berganfahrhilfe für Stop & Start'
      it: 'Autorizzazione di arresto dell''Hill Assist, per lo Stop & Start'
      pl: 'Zezwolenie na zatrzymanie asystenta ruszania pod górę dla funkcji Stop & Start'
      ru: 'Разрешение остановки ассистента старта на подъёме для системы Стоп-Старт'
      zh: '坡道辅助停止授权,用于启停功能'
