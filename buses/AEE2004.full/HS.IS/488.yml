      fr: 'Température d''eau moteur (°C)'
      es: 'Temperatura del líquido refrigerante del motor (°C)'
      de: 'Motorkühlmitteltemperatur (°C)'
      it: 'Temperatura del liquido di raffreddamento motore (°C)'
      pl: 'Temperatura płynu chłodzącego silnika (°C)'
      ru: 'Температура охлаждающей жидкости двигателя (°C)'
      zh: '发动机冷却液温度(°C)'
      hu: 'Motorhűtőfolyadék-hőmérséklet (°C)'
      pt: 'Temperatura do líquido de refrigeração do motor (°C)'
