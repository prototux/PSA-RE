id: 0x482
name: 'STOP_START_SUPERVISOR_DATA'
type: 'can'
length: 6
comment:
  en: 'Stop-start supervisor data: system fault, button pressed, low-voltage battery state of charge and inhibition status.'
  fr: 'Données du superviseur stop-start : défaut système, bouton appuyé, état de charge batterie basse tension et état d''inhibition.'
  es: 'Datos del supervisor stop-start: fallo del sistema, botón pulsado, estado de carga de la batería de baja tensión y estado de inhibición.'
  de: 'Daten des Stopp-Start-Supervisors: Systemfehler, Taster gedrückt, Ladezustand der Niederspannungsbatterie und Sperrstatus.'
  it: 'Dati del supervisore stop-start: guasto sistema, pulsante premuto, stato di carica della batteria a bassa tensione e stato di inibizione.'
  pl: 'Dane nadzorcy stop-start: usterka systemu, wciśnięty przycisk, stan naładowania akumulatora niskiego napięcia i stan blokady.'
  ru: 'Данные супервизора старт-стоп: неисправность системы, нажатие кнопки, уровень заряда низковольтной батареи и статус блокировки.'
  zh: '启停监控数据:系统故障、按钮按下、低压电池充电状态和抑制状态。'
  hu: 'Stop-start felügyeleti adatok: rendszerhiba, gomb megnyomva, kisfeszültségű akkumulátor töltöttségi állapota és letiltási állapot.'
  pt: 'Dados do supervisor do stop-start: avaria do sistema, botão premido, estado de carga da bateria de baixa tensão e estado de inibição.'
observations:
  en: 'On change of the powertrain operating status. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement de l''état de fonctionnement du GMP. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de funcionamiento del grupo motopropulsor. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Änderung des Betriebszustands des Antriebsstrangs. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento dello stato di funzionamento del gruppo motopropulsore. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Przy zmianie stanu pracy układu napędowego. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении рабочего состояния силового агрегата. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '动力总成运行状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A hajtáslánc üzemállapotának változásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança do estado de funcionamento do grupo motopropulsor. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['100ms', 'trigger']
senders: ['SCDT', 'AR2S']
receivers: ['BSI', 'BVA']

