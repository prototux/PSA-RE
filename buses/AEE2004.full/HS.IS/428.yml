id: 0x428
name: 'ENGINE_GAS_DATA_2'
type: 'can'
length: 2
comment:
  en: 'Sent by the engine ECU when it handles LPG operation: low gas level alert, gas level info and petrol/gas operating mode.'
  fr: 'Envoyée par le calculateur moteur lorsqu''il gère le fonctionnement GPL : alerte niveau de gaz bas, info niveau de gaz et mode de fonctionnement essence/gaz.'
  es: 'Enviada por la centralita del motor cuando gestiona el funcionamiento con GLP: alerta de nivel bajo de gas, información de nivel de gas y modo de funcionamiento gasolina/gas.'
  de: 'Wird vom Motorsteuergerät gesendet, wenn es den Autogasbetrieb verwaltet: Warnung bei niedrigem Gasstand, Gasstandinfo und Benzin-/Gas-Betriebsmodus.'
  it: 'Inviata dalla centralina motore quando gestisce il funzionamento a GPL: allarme livello gas basso, info livello gas e modalità di funzionamento benzina/gas.'
  pl: 'Wysyłana przez sterownik silnika, gdy obsługuje on pracę na LPG: alarm niskiego poziomu gazu, informacja o poziomie gazu i tryb pracy benzyna/gaz.'
  ru: 'Отправляется ЭБУ двигателя, когда он управляет работой на ГБО: предупреждение о низком уровне газа, информация об уровне газа и режим работы бензин/газ.'
  zh: '当发动机ECU管理液化气运行时发送:低气量警报、气量信息以及汽油/燃气运行模式。'
  hu: 'A motorvezérlő küldi, amikor az kezeli az LPG üzemet: alacsony gázszint riasztás, gázszint infó és benzin/gáz üzemmód.'
  pt: 'Enviada pela unidade de controlo do motor quando esta gere o funcionamento a GPL: alerta de nível baixo de gás, informação do nível de gás e modo de funcionamento gasolina/gás.'
periodicity: ['50ms']
senders: ['CMM']
receivers: ['CGPL']

signals:
  GAS_LEVEL:
    bits: '1.7-1.0'
    comment:
      en: 'LPG gas level'
      fr: 'Niveau de gaz GPL'
      es: 'Nivel de gas GLP'
      de: 'Autogas-Füllstand'
      it: 'Livello del gas GPL'
      pl: 'Poziom gazu LPG'
      ru: 'Уровень газа (ГБО)'
      zh: '液化石油气液位'
      hu: 'LPG gázszint'
      pt: 'Nível de gás GPL'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0xFF

  MIN_GAS_LEVEL_ALERT:
    bits: '2.7'
    comment:
      en: 'Alert to the driver to refill the LPG gas additive'
      fr: 'Alerte au conducteur pour faire le plein de gaz/additif'
      es: 'Alerta al conductor para repostar gas/aditivo'
      de: 'Warnung an den Fahrer, Gas/Additiv nachzufüllen'
      it: 'Avviso al conducente di fare rifornimento di gas/additivo'
      pl: 'Ostrzeżenie dla kierowcy o konieczności uzupełnienia gazu/dodatku'
      ru: 'Предупреждение водителю о необходимости дозаправки газом/присадкой'
      zh: '提醒驾驶员为燃气/添加剂加注的警告'
      hu: 'Figyelmeztetés a vezetőnek a gáz/adalék utántöltésére'
      pt: 'Aviso ao condutor para reabastecer gás/aditivo'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No display requested'
        fr: 'Aucune commande d''affichage du mini gaz'
        es: 'Sin comando de visualización del minindicador de combustible'
        de: 'Kein Anzeigebefehl für die Mini-Kraftstoffanzeige'
        it: 'Nessun comando di visualizzazione del mini indicatore carburante'
        pl: 'Brak polecenia wyświetlania mini wskaźnika paliwa'
        ru: 'Нет команды отображения мини-указателя топлива'
        zh: '无迷你油量表显示指令'
        hu: 'Nincs kijelzési parancs a mini üzemanyagmérőhöz'
        pt: 'Sem comando de visualização do mini-indicador de combustível'
      0x01:
        en: 'Minimum fuel level display request'
        fr: 'Commande d''affichage du niveau minimum de carburant'
        es: 'Solicitud de visualización del nivel mínimo de combustible'
        de: 'Anforderung zur Anzeige des Mindestkraftstoffstands'
        it: 'Richiesta di visualizzazione del livello minimo di carburante'
        pl: 'Żądanie wyświetlenia minimalnego poziomu paliwa'
        ru: 'Запрос отображения минимального уровня топлива'
        zh: '最低燃油液位显示请求'
