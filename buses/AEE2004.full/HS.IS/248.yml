id: 0x248
name: 'CMM_DYNAMIC_DATA_UH'
type: 'can'
length: 5
comment:
  en: 'Dynamic data sent by the CMM.'
  fr: 'Données dynamiques émises par le CMM.'
  es: 'Datos dinámicos emitidos por el CMM'
  de: 'Dynamische Daten des CMM'
  it: 'Dati dinamici inviati dal CMM'
  pl: 'Dane dynamiczne wysyłane przez CMM'
  ru: 'Динамические данные, отправляемые CMM'
  zh: 'CMM 发送的动态数据'
  hu: 'A CMM által küldött dinamikus adatok'
  pt: 'Dados dinâmicos enviados pela CMM.'
periodicity: ['10ms']
senders: ['CMM']

signals:
  MAX_TORQUE_DYNAMICS:
    bits: '1.7-1.0'
    comment:
      en: 'Maximum torque dynamics'
      fr: 'Dynamique du couple maximal'
      es: 'Dinámica del par máximo'
      de: 'Dynamik des maximalen Drehmoments'
      it: 'Dinamica della coppia massima'
      pl: 'Dynamika maksymalnego momentu obrotowego'
      ru: 'Динамика максимального крутящего момента'
      zh: '最大扭矩动态'
      hu: 'A maximális nyomaték dinamikája'
      pt: 'Dinâmica do binário máximo'
    type: 'uint'

  BOOST_REQUEST:
    bits: '3.7-3.6'
    comment:
      en: 'Torque boost request'
      fr: 'Demande de surcouple (boost)'
      es: 'Solicitud de sobrepar (boost)'
      de: 'Anforderung des Drehmoment-Boosts'
      it: 'Richiesta di boost di coppia'
      pl: 'Żądanie doładowania momentu obrotowego (boost)'
      ru: 'Запрос увеличения крутящего момента (буст)'
      zh: '扭矩增压请求'
      hu: 'Nyomatéknövelési (boost) kérés'
      pt: 'Pedido de sobrebinário (boost)'
    type: 'uint'

  REAR_LOAD_SHEDDING_REQUEST:
    bits: '3.5-3.4'
    comment:
      en: 'Rear electrical load shedding request'
      fr: 'Demande de délestage électrique arrière'
      es: 'Solicitud de deslastre eléctrico trasero'
      de: 'Anforderung zum Abschalten elektrischer Verbraucher hinten'
      it: 'Richiesta di distacco carichi elettrici posteriori'
      pl: 'Żądanie odciążenia elektrycznego z tyłu'
      ru: 'Запрос отключения задних электрических потребителей'
      zh: '后部电气负载卸载请求'
      hu: 'A hátsó elektromos fogyasztók leterhelésének kérése'
      pt: 'Pedido de redução de carga elétrica traseira'
    type: 'uint'

  FREEZE_REQUEST:
    bits: '3.3-3.2'
    comment:
      en: 'Data freeze request'
      fr: 'Demande de figeage des données'
      es: 'Solicitud de congelación de datos'
      de: 'Anforderung zum Einfrieren der Daten'
      it: 'Richiesta di congelamento dei dati'
      pl: 'Żądanie zamrożenia danych'
      ru: 'Запрос заморозки данных'
      zh: '数据冻结请求'
      hu: 'Adatrögzítési (fagyasztási) kérés'
      pt: 'Pedido de congelação dos dados'
    type: 'uint'

  INJECTION_STATUS:
    bits: '3.1-3.0'
    comment:
      en: 'Fuel injection status'
      fr: 'État de l''injection'
      es: 'Estado de la inyección'
      de: 'Einspritzstatus'
      it: 'Stato dell''iniezione'
      pl: 'Stan wtrysku paliwa'
      ru: 'Состояние впрыска топлива'
      zh: '喷油状态'
      hu: 'Befecskendezés állapota'
      pt: 'Estado da injeção'
    type: 'uint'

  ENGINE_LOAD_SHEDDING_FORBIDDEN:
    bits: '4.7-4.6'
    comment:
      en: 'Engine load shedding forbidden'
      fr: 'Interdiction de délestage moteur'
      es: 'Prohibición de deslastre del motor'
      de: 'Motorlastabwurf gesperrt'
      it: 'Distacco carico motore vietato'
      pl: 'Zakaz odciążenia silnika'
      ru: 'Запрет отключения нагрузки двигателя'
      zh: '禁止发动机负载卸载'
      hu: 'A motor terhelésének leterhelése tiltva'
      pt: 'Proibição de redução de carga do motor'
    type: 'uint'

  ENERGY_RECOVERY_FORBIDDEN:
    bits: '4.5-4.4'
    comment:
      en: 'Energy recovery (regenerative braking) forbidden'
      fr: 'Interdiction de la récupération d''énergie'
      es: 'Prohibición de la recuperación de energía'
      de: 'Energierückgewinnung gesperrt'
      it: 'Recupero di energia vietato'
      pl: 'Zakaz odzysku energii'
      ru: 'Запрет рекуперации энергии'
      zh: '禁止能量回收'
      hu: 'Energia-visszanyerés tiltva'
      pt: 'Proibição da recuperação de energia'
    type: 'uint'

  ANTI_STALL_LOAD_SHEDDING:
    bits: '4.3'
    comment:
      en: 'Load shedding for anti-stall protection'
      fr: 'Délestage pour la protection anticalage'
      es: 'Deslastre para la protección antipérdida de régimen'
      de: 'Lastabwurf zum Schutz vor Motorabwürgen'
      it: 'Distacco carico per la protezione antistallo'
      pl: 'Odciążenie w celu ochrony przed zgaśnięciem silnika'
      ru: 'Отключение нагрузки для защиты от остановки двигателя'
      zh: '防熄火负载卸载'
      hu: 'Leterhelés a lefulladás elleni védelem érdekében'
      pt: 'Redução de carga para a proteção antical'
    type: 'bool'

  CMM_ALIVE_COUNTER:
    bits: '5.7-5.4'
    comment:
      en: '4-bit rolling counter of the engine control unit (CMM)'
      fr: 'Compteur cyclique 4 bits du calculateur moteur (CMM)'
      es: 'Contador cíclico de 4 bits de la centralita del motor (CMM)'
      de: '4-Bit-Lebenszeichenzähler des Motorsteuergeräts (CMM)'
      it: 'Contatore ciclico a 4 bit della centralina motore (CMM)'
      pl: '4-bitowy licznik cykliczny sterownika silnika (CMM)'
      ru: '4-битный циклический счётчик блока управления двигателем (CMM)'
      zh: '发动机控制单元(CMM)的4位循环计数器'
      hu: 'A motorvezérlő (CMM) 4 bites körforgó számlálója'
      pt: 'Contador cíclico de 4 bits da unidade de controlo do motor (CMM)'
    type: 'uint'

  CMM_UH_CHECKSUM:
    bits: '5.3-5.0'
    comment:
      en: 'Checksum of the CMM UH dynamic engine frame'
      fr: 'Somme de contrôle de la trame dynamique moteur CMM UH'
      es: 'Checksum de la trama dinámica del motor CMM UH'
      de: 'Prüfsumme der dynamischen Motor-Botschaft CMM UH'
      it: 'Checksum del messaggio dinamico motore CMM UH'
      pl: 'Suma kontrolna ramki dynamicznej silnika CMM UH'
      ru: 'Контрольная сумма динамического кадра двигателя CMM UH'
      zh: 'CMM UH发动机动态帧校验和'
      hu: 'A CMM UH motor dinamikus üzenetének ellenőrző összege'
      pt: 'Soma de verificação da trama dinâmica do motor CMM UH'
    type: 'uint'
