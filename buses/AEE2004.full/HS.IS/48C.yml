id: 0x48C
name: 'LPG_SYSTEM_DATA'
type: 'can'
length: 8
comment:
  en: 'LPG system data: injector flow, minor/major/severe faults, client request status, fault-code read status, LPG warning-lamp request, level gauge, pressure and system-ready state.'
  fr: 'Données système GPL : débit injecteurs, défauts mineurs/majeurs/graves, état de la demande client, état de lecture des codes, demande de voyant GPL, jauge, pression et état système prêt.'
  es: 'Datos del sistema GLP: caudal de inyectores, fallos menores/mayores/graves, estado de la solicitud del cliente, estado de lectura de códigos, solicitud de testigo GLP, indicador de nivel, presión y estado del sistema listo.'
  de: 'LPG-Systemdaten: Einspritzdurchfluss, geringfügige/größere/schwere Fehler, Status der Kundenanforderung, Status des Fehlercode-Lesens, Anforderung der Autogas-Kontrollleuchte, Füllstandsanzeige, Druck und Systembereitschaft.'
  it: 'Dati del sistema GPL: portata iniettori, guasti minori/maggiori/gravi, stato della richiesta cliente, stato di lettura codici, richiesta spia GPL, indicatore di livello, pressione e stato sistema pronto.'
  pl: 'Dane systemu LPG: przepływ wtryskiwaczy, usterki drobne/poważne/krytyczne, stan żądania klienta, stan odczytu kodów, żądanie kontrolki LPG, wskaźnik poziomu, ciśnienie i stan gotowości systemu.'
  ru: 'Данные системы ГБО: расход форсунок, незначительные/значительные/серьёзные неисправности, статус запроса клиента, статус чтения кодов, запрос индикатора ГБО, указатель уровня, давление и готовность системы.'
  zh: '液化气系统数据:喷油器流量、轻微/主要/严重故障、客户请求状态、故障码读取状态、液化气警示灯请求、油量表、压力和系统就绪状态。'
  hu: 'LPG rendszer adatok: befecskendező áramlás, kisebb/nagyobb/súlyos hibák, ügyfélkérés állapota, hibakód-olvasási állapot, LPG jelzőlámpa-kérés, szintjelző, nyomás és rendszerkészenlét.'
  pt: 'Dados do sistema GPL: caudal do injetor, avarias menores/maiores/graves, estado do pedido do cliente, estado de leitura de códigos de avaria, pedido da luz avisadora de GPL, indicador de nível, pressão e estado de sistema pronto.'
periodicity: ['100ms']
senders: ['CGPL']
receivers: ['CMM', 'BSI']

