id: 0x208
name: 'ENGINE_HYBRID_DYNAMIC_DATA'
alt_names: ['GENERIC_ENGINE_DATA']
type: 'can'
length: 8
comment:
  en: 'Engine dynamic data for hybrid variants: hybrid motor torque, resistant torque, pre-processed driver torque request, engine-restart and particulate-filter regeneration requests, raw powertrain state.'
  fr: 'Données dynamiques moteur pour variantes hybrides : couple moteur hybride, couple résistant, demande de couple conducteur avant traitement, demandes de redémarrage moteur et de régénération FAP, état brut du groupe motopropulseur.'
  es: 'Datos dinámicos del motor para variantes híbridas: par del motor híbrido, par resistente, solicitud de par del conductor antes de procesar, solicitudes de reinicio del motor y de regeneración del filtro de partículas, estado bruto del grupo motopropulsor.'
  de: 'Motor-Dynamikdaten für Hybridvarianten: Hybridmotor-Drehmoment, Widerstandsmoment, unverarbeitete Fahrer-Drehmomentanforderung, Motorneustart- und Partikelfilter-Regenerationsanforderungen, roher Antriebsstrangzustand.'
  it: 'Dati dinamici motore per varianti ibride: coppia motore ibrido, coppia resistente, richiesta di coppia guidatore prima dell''elaborazione, richieste di riavvio motore e rigenerazione FAP, stato grezzo del gruppo propulsore.'
  pl: 'Dane dynamiczne silnika dla wariantów hybrydowych: moment silnika hybrydowego, moment oporowy, nieprzetworzone żądanie momentu kierowcy, żądania ponownego uruchomienia silnika i regeneracji filtra cząstek stałych, surowy stan układu napędowego.'
  ru: 'Динамические данные двигателя для гибридных вариантов: крутящий момент гибридного двигателя, момент сопротивления, необработанный запрос крутящего момента водителя, запросы перезапуска двигателя и регенерации сажевого фильтра, необработанное состояние силового агрегата.'
  zh: '混合动力变体的发动机动态数据:混动电机扭矩、阻力扭矩、处理前的驾驶员扭矩请求、发动机重启和颗粒过滤器再生请求、动力总成原始状态。'
  hu: 'Motor dinamikus adatok hibrid változatokhoz: hibrid motornyomaték, ellenálló nyomaték, feldolgozás előtti vezetői nyomatékkérés, motor-újraindítási és részecskeszűrő-regenerálási kérések, a hajtáslánc nyers állapota.'
  pt: 'Dados dinâmicos do motor para variantes híbridas: binário do motor elétrico híbrido, binário resistente, pedido de binário do condutor pré-processado, pedidos de reinício do motor e de regeneração do filtro de partículas, estado em bruto do grupo motopropulsor.'
observations:
  en: 'On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['10ms']
senders: ['CMM', 'PIU']
receivers:
  - 'BEBA'
  - 'ABS'
  - 'DAE'
  - 'SCDT'
  - 'SBW'
  - 'BCP'
  - 'FSE'
  - 'CSS'
  - 'CAV'
  - 'CAAR'
  - 'BVA'
  - 'AR2S'
  - 'DSG'
  - 'BSI'
  - 'ARTIV'
  - 'BHI'
  - 'AMVAR'
  - 'ACC'
  - 'ACCEL_SENSOR'
  - 'CGPL'
  - 'CMEL'
  - 'DIAG_TOOL'
  - 'TBMU'

signals:
  ENGINE_SPEED:
    bits: '1.7-2.0'
    alt_names: ['ENGINE_RPM']
    comment:
      en: 'Engine speed (16-bit)'
      fr: 'Régime moteur (16 bits)'
      es: 'Régimen del motor (16 bits)'
      de: 'Motordrehzahl (16 Bit)'
      it: 'Regime motore (16 bit)'
      pl: 'Obroty silnika (16 bitów)'
      ru: 'Обороты двигателя (16 бит)'
      zh: '发动机转速(16位)'
      hu: 'Motorfordulatszám (16 bites)'
      pt: 'Regime do motor (16 bits)'
    type: 'uint'
    factor: 0.125
    min: 0
    max: 8191.75
    units: 'rpm'
    invalid: 0xFFFF
    default: 0xFFFF

  ACTUAL_TORQUE:
    bits: '3.7-3.0'
    comment:
      en: 'Actual engine torque'
      fr: 'Couple moteur réel'
      es: 'Par de motor real'
      de: 'Tatsächliches Motordrehmoment'
      it: 'Coppia motore reale'
      pl: 'Rzeczywisty moment obrotowy silnika'
      ru: 'Фактический крутящий момент двигателя'
      zh: '实际发动机扭矩'
      hu: 'Tényleges motornyomaték'
      pt: 'Binário real do motor'
    type: 'uint'
    factor: 2
    offset: -100
    min: -100
    max: 408
    units: 'Nm'
    invalid: 0xFF
    default: 0x32

  DRIVER_DEMAND_PERCENT:
    bits: '4.7-4.0'
    alt_names: ['THROTTLE_PERCENTAGE']
    comment:
      en: 'Driver demand'
      fr: 'Volonté du conducteur'
      es: 'Demanda del conductor'
      de: 'Fahrerwunsch'
      it: 'Richiesta del conducente'
      pl: 'Żądanie kierowcy'
      ru: 'Запрос водителя'
      zh: '驾驶员需求'
      hu: 'Vezetői igény'
      pt: 'Pedido do condutor'
    type: 'uint'
    factor: 0.5
    min: 0
    max: 100
    units: '%'
    invalid: 0xFF
    default: 0x00

  ENGINE_LOAD_REQUEST:
    bits: '5.7'
    comment:
      en: 'Engine load request to assist filter regeneration (processed by the BSI)'
      fr: 'Demande de charge moteur pour faciliter la régénération du filtre (traitée par la BSI)'
      es: 'Solicitud de carga del motor para facilitar la regeneración del filtro (procesada por la BSI)'
      de: 'Anforderung der Motorlast zur Unterstützung der Filterregeneration (von der BSI verarbeitet)'
      it: 'Richiesta di carico motore per facilitare la rigenerazione del filtro (elaborata dalla BSI)'
      pl: 'Żądanie obciążenia silnika wspomagające regenerację filtra (przetwarzane przez BSI)'
      ru: 'Запрос нагрузки двигателя для содействия регенерации фильтра (обрабатывается BSI)'
      zh: '为辅助滤芯再生而提出的发动机负载请求(由BSI处理)'
      hu: 'Motorterhelési kérés a szűrőregenerálás elősegítésére (a BSI dolgozza fel)'
      pt: 'Pedido de carga do motor para facilitar a regeneração do filtro (processado pela BSI)'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No active request'
        fr: 'Aucune requête active'
        es: 'Sin solicitud activa'
        de: 'Keine aktive Anforderung'
        it: 'Nessuna richiesta attiva'
        pl: 'Brak aktywnego żądania'
        ru: 'Нет активного запроса'
        zh: '无活动请求'
        hu: 'Nincs aktív kérés'
        pt: 'Sem pedido ativo'
      0x01:
        en: 'Request active'
        fr: 'Requête active'
        es: 'Solicitud activa'
        de: 'Anforderung aktiv'
        it: 'Richiesta attiva'
        pl: 'Żądanie aktywne'
        ru: 'Запрос активен'
        zh: '请求已激活'
        hu: 'Kérés aktív'
        pt: 'Pedido ativo'

  DIAG_STATUS:
    bits: '5.6'
    comment:
      en: 'Multiplexed communication diagnostic status'
