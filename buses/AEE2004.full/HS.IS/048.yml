id: 0x048
name: 'ENGINE_AR2S_SYNCHRONISATION'
type: 'can'
length: 2
comment:
  en: 'Engine synchronisation frame used to keep the engine turning and avoid stalling on cylinder compression (AR2S)'
  fr: 'Trame de synchronisation moteur utilisée pour maintenir la rotation du moteur et éviter le calage sur la compression d''un cylindre (AR2S)'
  es: 'Trama de sincronización del motor utilizada para mantener la rotación del motor y evitar el calado en la compresión de un cilindro (AR2S)'
  de: 'Motor-Synchronisationsframe, um den Motor weiterlaufen zu lassen und ein Abwürgen bei der Zylinderkompression zu vermeiden (AR2S)'
  it: 'Trama di sincronizzazione motore utilizzata per mantenere la rotazione del motore ed evitare lo spegnimento sulla compressione di un cilindro (AR2S)'
  pl: 'Ramka synchronizacji silnika stosowana do utrzymania obrotów silnika i uniknięcia zgaśnięcia na kompresji cylindra (AR2S)'
  ru: 'Кадр синхронизации двигателя, используемый для поддержания вращения двигателя и предотвращения остановки на такте сжатия цилиндра (AR2S)'
  zh: '用于保持发动机转动、避免在气缸压缩行程熄火的发动机同步帧(AR2S)'
  hu: 'Motor-szinkronizációs keret, amely a motor forgásban tartására szolgál, elkerülve a leállást egy henger kompressziójakor (AR2S)'
  pt: 'Trama de sincronização do motor utilizada para manter o motor a rodar e evitar o calagem na compressão do cilindro (AR2S).'
observations:
  en: 'Sent by the CMM to keep the engine turning and avoid a stall on cylinder compression'
  fr: 'Émise par le CMM pour maintenir la rotation du moteur thermique et éviter un calage sur la compression d''un cylindre'
  es: 'Enviada por el CMM para mantener el giro del motor térmico y evitar una calada en la compresión de un cilindro'
  de: 'Gesendet vom CMM, um die Verbrennungsmotordrehung aufrechtzuerhalten und ein Abwürgen bei der Zylinderkompression zu vermeiden'
  it: 'Inviata dal CMM per mantenere la rotazione del motore termico ed evitare uno stallo sulla compressione di un cilindro'
  pl: 'Wysyłane przez CMM w celu podtrzymania obrotów silnika spalinowego i uniknięcia zgaśnięcia przy kompresji cylindra'
  ru: 'Отправляется CMM для поддержания вращения двигателя внутреннего сгорания и предотвращения остановки на такте сжатия цилиндра'
  zh: '由CMM发送,以维持内燃机转动,避免在气缸压缩行程时熄火'
  hu: 'A CMM küldi a hőmotor forgásának fenntartásához, hogy elkerülje a leállást egy henger kompressziójánál'
  pt: 'Enviada pela CMM para manter o motor a rodar e evitar o calado na compressão do cilindro'
periodicity: ['trigger']
senders: ['CMM']
receivers: ['SCDT', 'AR2S']

signals:
  ENGINE_REPOSITION_REQUEST:
    bits: '1.7'
    comment:
      en: 'Engine reposition request.'
      fr: 'Demande de repositionnement moteur.'
      es: 'Solicitud de reposicionamiento del motor.'
      de: 'Anforderung zur Neupositionierung des Motors.'
      it: 'Richiesta di riposizionamento motore.'
      pl: 'Żądanie zmiany pozycji silnika.'
      ru: 'Запрос на перепозиционирование двигателя.'
      zh: '发动机重新定位请求。'
      hu: 'Motor-újrapozicionálási kérés.'
      pt: 'Pedido de reposicionamento do motor.'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No engine repositioning requested'
        fr: 'Pas de repositionnement moteur demandé'
        es: 'Sin reposicionamiento del motor solicitado'
        de: 'Keine Motor-Neupositionierung angefordert'
        it: 'Nessun riposizionamento del motore richiesto'
        pl: 'Brak żądania repozycjonowania silnika'
        ru: 'Перепозиционирование двигателя не запрошено'
        zh: '未请求发动机重新定位'
        hu: 'Nincs kérve motor-repozicionálás'
        pt: 'Sem reposicionamento do motor pedido'
      0x01:
        en: 'Engine reposition request'
        fr: 'Demande de repositionnement moteur'
        es: 'Solicitud de reposicionamiento del motor'
        de: 'Anforderung zur Neupositionierung des Motors'
        it: 'Richiesta di riposizionamento motore'
        pl: 'Żądanie zmiany pozycji silnika'
        ru: 'Запрос на перепозиционирование двигателя'
        zh: '发动机重新定位请求'
        hu: 'Motor-újrapozicionálási kérés'
        pt: 'Pedido de reposicionamento do motor'

  UNUSED_1:
