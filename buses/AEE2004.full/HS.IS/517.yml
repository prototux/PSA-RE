id: 0x517
name: 'HEADLIGHT_BEAM_STATE'
type: 'can'
length: 3
comment:
  en: 'Headlight beam state: cornering, motorway, automatic levelling, country road, town, dynamic and static bend lighting, and beam masking.'
  fr: 'État des faisceaux de phares : éclairage d''angle, autoroute, correction automatique, campagne, ville, virage dynamique et statique, et occultation.'
  es: 'Estado de los haces de los faros: iluminación de curva, autopista, corrección automática, carretera secundaria, ciudad, curva dinámica y estática, y ocultación.'
  de: 'Status der Scheinwerferlichtkegel: Kurvenlicht, Autobahnlicht, automatische Niveauregulierung, Landstraßenlicht, Stadtlicht, dynamisches und statisches Kurvenlicht sowie Abblendung.'
  it: 'Stato dei fasci dei fari: illuminazione in curva, autostrada, correzione automatica, extraurbano, città, curva dinamica e statica, e oscuramento.'
  pl: 'Stan wiązek reflektorów: oświetlenie skrętu, autostradowe, automatyczna korekcja, wiejskie, miejskie, dynamiczne i statyczne doświetlanie zakrętów oraz maskowanie.'
  ru: 'Состояние световых пучков фар: поворотное освещение, автомагистральное, автоматическая коррекция, загородное, городское, динамическое и статическое поворотное освещение, а также маскирование луча.'
  zh: '大灯光束状态:转弯照明、高速公路、自动调平、乡村道路、市区、动态和静态弯道照明,以及光束遮蔽。'
  hu: 'A fényszóró fénykúpjának állapota: kanyarfény, autópálya-fény, automatikus szintszabályozás, országúti fény, városi fény, dinamikus és statikus kanyarfény, valamint elfedés.'
  pt: 'Estado do feixe dos faróis: iluminação de curva, autoestrada, nivelamento automático, estrada nacional, cidade, iluminação de curva dinâmica e estática, e mascaramento do feixe.'
periodicity: ['100ms']
senders: ['BCP']
receivers:
  - 'BSI'
  - 'ACC'
  - 'AMVAR'
  - 'AR2S'
  - 'BVA'
  - 'CAAR'
  - 'ACCEL_SENSOR'
  - 'CAV'
  - 'CGPL'
  - 'CMEL'
  - 'CMM'
