      0x01:
        en: 'Available torque'
        fr: 'Couple disponible'
        es: 'Par disponible'
        de: 'Verfügbares Drehmoment'
        it: 'Coppia disponibile'
        pl: 'Dostępny moment obrotowy'
        ru: 'Доступный крутящий момент'
        zh: '可用扭矩'
        hu: 'Rendelkezésre álló nyomaték'
