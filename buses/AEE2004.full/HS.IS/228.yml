id: 0x228
name: 'ENGINE_EASY_MOVE_DATA'
type: 'can'
length: 8
comment:
  en: 'Sent for the Easy Move function: checksum, uncertain Easy Move torque, process counter, accelerator pedal derivative and Easy Move torque info.'
  fr: 'Émise pour la fonction Easy Move : somme de contrôle, couple Easy Move incertain, compteur de process, dérivée pédale d''accélérateur et info couple Easy Move.'
  es: 'Enviada para la función Easy Move: suma de comprobación, par Easy Move incierto, contador de proceso, derivada del pedal acelerador e información de par Easy Move.'
  de: 'Für die Easy-Move-Funktion gesendet: Prüfsumme, unsicheres Easy-Move-Drehmoment, Prozesszähler, Gaspedal-Ableitung und Easy-Move-Momentinfo.'
  it: 'Inviata per la funzione Easy Move: checksum, coppia Easy Move incerta, contatore di processo, derivata del pedale acceleratore e info coppia Easy Move.'
  pl: 'Wysyłana dla funkcji Easy Move: suma kontrolna, niepewny moment Easy Move, licznik procesu, pochodna pedału przyspieszenia i informacja o momencie Easy Move.'
  ru: 'Отправляется для функции Easy Move: контрольная сумма, неопределённый момент Easy Move, счётчик процесса, производная педали акселератора и информация о моменте Easy Move.'
  zh: '为Easy Move功能发送:校验和、不确定的Easy Move扭矩、处理计数器、加速踏板导数和Easy Move扭矩信息。'
  hu: 'Az Easy Move funkcióhoz küldve: ellenőrzőösszeg, bizonytalan Easy Move nyomaték, folyamatszámláló, gázpedál deriváltja és Easy Move nyomaték infó.'
  pt: 'Enviada para a função Easy Move: soma de verificação, binário incerto do Easy Move, contador de processo, derivada do pedal do acelerador e informação de binário do Easy Move.'
observations:
  en: 'On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['10ms']
senders: ['CMM']
receivers:
  - 'HCU1'
  - 'ABS'
  - 'BVA'
  - 'ACC'
  - 'AMVAR'
  - 'AR2S'
  - 'BSI'
  - 'CAAR'
  - 'ACCEL_SENSOR'
  - 'CAV'
  - 'CGPL'
  - 'CMEL'
  - 'CSS'
  - 'DSG'
  - 'FSE'
  - 'DIAG_TOOL'
  - 'BCP'
  - 'SBW'
  - 'SCDT'
  - 'BHI'
  - 'TBMU'
  - 'DAE'

signals:
  EASY_MOVE_TORQUE:
    bits: '1.7-1.0'
    comment:
      en: 'Easy Move torque information'
      fr: 'Information de couple Easy Move'
      es: 'Información de par de Easy Move'
      de: 'Easy-Move-Drehmomentinformation'
      it: 'Informazione di coppia Easy Move'
      pl: 'Informacja o momencie obrotowym Easy Move'
      ru: 'Информация о крутящем моменте Easy Move'
      zh: 'Easy Move 扭矩信息'
      hu: 'Easy Move nyomatékinformáció'
      pt: 'Informação de binário Easy Move'
    type: 'uint'
    factor: 2
    offset: -100
    min: -100
    max: 408
    units: 'Nm'
    invalid: 0xFF
    default: 0x32

  EASY_MOVE_TORQUE_UNCERTAIN:
    bits: '2.7-2.6'
    comment:
      en: 'Estimated Easy Move torque uncertain'
      fr: 'Couple Easy Move estimé incertain'
      es: 'Par estimado de Easy Move incierto'
      de: 'Geschätztes Easy-Move-Drehmoment unsicher'
      it: 'Coppia stimata Easy Move incerta'
      pl: 'Niepewny szacowany moment Easy Move'
      ru: 'Ненадёжный расчётный момент Easy Move'
      zh: 'Easy Move 估算扭矩不确定'
      hu: 'Bizonytalan becsült Easy Move nyomaték'
      pt: 'Binário estimado de Easy Move incerto'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'Easy Move torque information guaranteed with the required accuracy'
        fr: 'Information de couple Easy Move garantie avec la précision requise'
        es: 'Información de par Easy Move garantizada con la precisión requerida'
        de: 'Easy-Move-Drehmomentinformation mit der geforderten Genauigkeit gewährleistet'
        it: 'Informazione di coppia Easy Move garantita con la precisione richiesta'
        pl: 'Informacja o momencie Easy Move zagwarantowana z wymaganą dokładnością'
        ru: 'Информация о моменте Easy Move гарантирована с требуемой точностью'
        zh: 'Easy Move扭矩信息达到所需精度保证'
        hu: 'Easy Move nyomatékinformáció a megkövetelt pontossággal garantálva'
        pt: 'Informação de binário Easy Move garantida com a precisão exigida'
      0x01:
        en: 'Easy Move torque information not guaranteed to required accuracy'
        fr: 'Information de couple Easy Move non garantie à la précision requise'
        es: 'Información de par Easy Move no garantizada con la precisión requerida'
        de: 'Easy-Move-Drehmomentinformation nicht mit erforderlicher Genauigkeit gewährleistet'
        it: 'Informazione di coppia Easy Move non garantita con la precisione richiesta'
        pl: 'Informacja o momencie Easy Move niegwarantowana z wymaganą dokładnością'
        ru: 'Информация о моменте Easy Move не гарантирована с требуемой точностью'
        zh: 'Easy Move扭矩信息未保证达到所需精度'
        hu: 'Az Easy Move nyomatékinformáció nem garantált a szükséges pontossággal'
        pt: 'Informação de binário Easy Move não garantida com a precisão exigida'
      0x02:
        unused: true
      0x03:
        unused: true

  HILL_ASSIST_TORQUE_PRECISE:
    bits: '2.5'
    comment:
      en: 'Engine torque precision sufficient for Hill Assist'
      fr: 'Précision du couple moteur suffisante pour l''assistance au démarrage en côte'
      es: 'Precisión del par de motor suficiente para la asistencia de arranque en pendiente'
      de: 'Motordrehmoment-Genauigkeit ausreichend für die Berganfahrhilfe'
      it: 'Precisione della coppia motore sufficiente per l''Hill Assist'
      pl: 'Dokładność momentu silnika wystarczająca dla asystenta ruszania pod górę'
      ru: 'Точность крутящего момента двигателя достаточна для ассистента старта на подъёме'
