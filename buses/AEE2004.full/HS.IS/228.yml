      hu: 'A motornyomaték pontossága elegendő a hegyi indítássegítőhöz'
      pt: 'Precisão do binário do motor suficiente para a assistência de arranque em subida'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Imprecise torque'
        fr: 'Couple imprécis'
        es: 'Par impreciso'
        de: 'Ungenaues Drehmoment'
        it: 'Coppia imprecisa'
        pl: 'Niedokładny moment obrotowy'
        ru: 'Неточный момент'
        zh: '扭矩不精确'
        hu: 'Pontatlan nyomaték'
