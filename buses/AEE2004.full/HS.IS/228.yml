      0x01:
        en: 'Precise torque'
        fr: 'Couple précis'
        es: 'Par preciso'
        de: 'Präzises Drehmoment'
        it: 'Coppia precisa'
        pl: 'Precyzyjny moment obrotowy'
        ru: 'Точный крутящий момент'
        zh: '精确扭矩'
        hu: 'Pontos nyomaték'
        pt: 'Binário preciso'

  HILL_ASSIST_AVAILABLE_TORQUE:
    bits: '2.4'
    comment:
      en: 'Engine torque available for Hill Assist'
      fr: 'Couple moteur disponible pour l''assistance au démarrage en côte'
      es: 'Par de motor disponible para la asistencia de arranque en pendiente'
      de: 'Verfügbares Motordrehmoment für die Berganfahrhilfe'
      it: 'Coppia motore disponibile per l''Hill Assist'
