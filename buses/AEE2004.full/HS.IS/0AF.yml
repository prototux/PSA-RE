      it: 'Calibrazione attiva del sensore di accelerazione laterale'
      pl: 'Aktywna kalibracja czujnika przyspieszenia poprzecznego'
      ru: 'Активна калибровка датчика поперечного ускорения'
      zh: '横向加速度传感器校准激活'
      hu: 'A keresztirányú gyorsulásérzékelő kalibrálása aktív'
      pt: 'Calibração do sensor de aceleração lateral ativa'
    type: 'bool'
    default: 0x01
    values:
      0x00:
        en: 'Calibration in progress'
        fr: 'Calibrage en cours'
        es: 'Calibración en curso'
        de: 'Kalibrierung läuft'
        it: 'Calibrazione in corso'
