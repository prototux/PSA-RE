id: 0x0AF
name: 'YAW_LATERAL_ACCEL_SENSOR'
type: 'can'
length: 8
comment:
  en: 'Yaw rate and lateral acceleration sensor data, raw and calibrated.'
  fr: 'Données du capteur de vitesse de lacet et d''accélération latérale, brutes et calibrées.'
  es: 'Datos del sensor de velocidad de guiñada y aceleración lateral, en bruto y calibrados.'
  de: 'Daten des Gierraten- und Querbeschleunigungssensors, roh und kalibriert.'
  it: 'Dati del sensore di velocità di imbardata e accelerazione laterale, grezzi e calibrati.'
  pl: 'Dane czujnika prędkości odchylania i przyspieszenia bocznego, surowe i skalibrowane.'
  ru: 'Данные датчика скорости рыскания и бокового ускорения, необработанные и калиброванные.'
  zh: '横摆角速度和横向加速度传感器数据，含原始值和标定值。'
  hu: 'Legyezési szögsebesség és oldalirányú gyorsulás érzékelő adatai, nyers és kalibrált értékek.'
  pt: 'Dados do sensor de velocidade de guinada e aceleração lateral, brutos e calibrados.'
periodicity: ['10ms']
senders: ['ACCEL_SENSOR']

signals:
  YAW_SENSOR_FAULT_STATE:
    bits: '1.7-1.4'
    comment:
      en: 'Yaw/acceleration dual sensor fault state'
      fr: 'État de défaut du bi-capteur lacet/accélération'
      es: 'Estado de fallo del bisensor de guiñada/aceleración'
      de: 'Fehlerstatus des Gier-/Beschleunigungs-Doppelsensors'
      it: 'Stato di guasto del bi-sensore imbardata/accelerazione'
      pl: 'Stan usterki podwójnego czujnika odchylania/przyspieszenia'
      ru: 'Статус неисправности сдвоенного датчика рыскания/ускорения'
      zh: '横摆/加速度双传感器故障状态'
      hu: 'A legyezés/gyorsulás kettős érzékelő hibaállapota'
      pt: 'Estado de avaria do sensor duplo de guinada/aceleração'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'No fault'
        fr: 'Pas de défaut'
        es: 'Sin fallo'
        de: 'Kein Fehler'
        it: 'Nessun guasto'
        pl: 'Brak usterki'
        ru: 'Нет неисправности'
        zh: '无故障'
