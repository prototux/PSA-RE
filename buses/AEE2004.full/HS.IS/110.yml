id: 0x110
name: 'CSS_VERSION'
type: 'can'
length: 8
comment:
  en: 'Software and calibration identification of the ECU, sent once at start-up.'
  fr: 'Identification logicielle et de calibration du calculateur, émise une fois au démarrage.'
  es: 'Identificación de software y calibración de la ECU, enviada una vez al arrancar.'
  de: 'Software- und Kalibrierungskennung des Steuergeräts, einmal beim Start gesendet.'
  it: 'Identificazione software e calibrazione della centralina, inviata una volta all''avvio.'
  pl: 'Identyfikacja oprogramowania i kalibracji sterownika, wysyłana raz przy uruchomieniu.'
  ru: 'Идентификация программного обеспечения и калибровки блока управления, отправляется один раз при запуске.'
  zh: '该ECU的软件和标定版本信息，启动时发送一次。'
  hu: 'A vezérlőegység szoftver- és kalibrációs azonosítója, indításkor egyszer elküldve.'
  pt: 'Identificação de software e calibração da ECU, enviada uma vez no arranque.'
observations:
  en: 'Sent once, when the ECU starts'
  fr: 'Émise une seule fois au démarrage du calculateur'
  es: 'Enviada una sola vez al arrancar la ECU'
  de: 'Einmalig beim Start des Steuergeräts gesendet'
  it: 'Inviata una sola volta all''avvio della centralina'
  pl: 'Wysyłane jednorazowo przy starcie sterownika'
  ru: 'Отправляется один раз при запуске блока управления'
  zh: '该ECU启动时仅发送一次'
  hu: 'Egyszer küldve a vezérlőegység indulásakor'
  pt: 'Enviada uma vez, quando a unidade de controlo arranca'
periodicity: ['trigger']
senders: ['CSS']
receivers:
  - 'ACC'
  - 'AMVAR'
  - 'AR2S'
  - 'BSI'
  - 'BVA'
  - 'CAAR'
  - 'ACCEL_SENSOR'
  - 'CAV'
  - 'CGPL'
  - 'CMEL'
  - 'CMM'
  - 'DSG'
  - 'FSE'
  - 'DIAG_TOOL'
  - 'BCP'
  - 'SBW'
  - 'SCDT'
  - 'BHI'
  - 'TBMU'
  - 'DAE'
  - 'ABS'

signals:
  SYSTEM_VERSION:
    bits: '1.7-1.0'
    comment:
      en: 'System version.'
      fr: 'Version du système.'
      es: 'Versión del sistema.'
      de: 'Systemversion.'
      it: 'Versione del sistema.'
      pl: 'Wersja systemu.'
      ru: 'Версия системы.'
      zh: '系统版本。'
      hu: 'Rendszerverzió.'
      pt: 'Versão do sistema'
    type: 'uint'
    min: 0
    max: 255

  SOFTWARE_VERSION_DATE_DAY:
    bits: '2.7-2.0'
    comment:
      en: 'Software version date, day (FFh if unknown).'
      fr: 'Date de la version logicielle, jour (FFh si inconnu).'
      es: 'Fecha de la versión del software, día (FFh si desconocido).'
      de: 'Datum der Softwareversion, Tag (FFh falls unbekannt).'
      it: 'Data della versione software, giorno (FFh se sconosciuto).'
      pl: 'Data wersji oprogramowania, dzień (FFh jeśli nieznany).'
      ru: 'Дата версии программного обеспечения, день (FFh, если неизвестно).'
      zh: '软件版本日期，日（未知为FFh）。'
      hu: 'A szoftververzió dátuma, nap (FFh, ha ismeretlen).'
      pt: 'Data da versão do software, dia (FFh se desconhecido)'
    type: 'uint'
    min: 0
    max: 31

  SOFTWARE_VERSION_DATE_MONTH:
    bits: '3.7-3.0'
    comment:
      en: 'Software version date, month (FFh if unknown).'
      fr: 'Date de la version logicielle, mois (FFh si inconnu).'
      es: 'Fecha de la versión del software, mes (FFh si desconocido).'
      de: 'Datum der Softwareversion, Monat (FFh falls unbekannt).'
      it: 'Data della versione software, mese (FFh se sconosciuto).'
      pl: 'Data wersji oprogramowania, miesiąc (FFh jeśli nieznany).'
      ru: 'Дата версии программного обеспечения, месяц (FFh, если неизвестно).'
      zh: '软件版本日期，月（未知为FFh）。'
      hu: 'A szoftververzió dátuma, hónap (FFh, ha ismeretlen).'
      pt: 'Data da versão do software, mês (FFh se desconhecido)'
    type: 'uint'
    min: 0
    max: 12

  SOFTWARE_VERSION_DATE_YEAR:
    bits: '4.7-4.0'
    comment:
      en: 'Software version date, year (00-99; FFh if unknown).'
      fr: 'Date de la version logicielle, année (00-99 ; FFh si inconnue).'
      es: 'Fecha de la versión del software, año (00-99; FFh si desconocido).'
      de: 'Datum der Softwareversion, Jahr (00-99; FFh falls unbekannt).'
      it: 'Data della versione software, anno (00-99; FFh se sconosciuto).'
      pl: 'Data wersji oprogramowania, rok (00-99; FFh jeśli nieznany).'
      ru: 'Дата версии программного обеспечения, год (00-99; FFh, если неизвестно).'
      zh: '软件版本日期，年（00-99；未知为FFh）。'
      hu: 'A szoftververzió dátuma, év (00-99; FFh, ha ismeretlen).'
      pt: 'Data da versão do software, ano (00-99; FFh se desconhecido)'
    type: 'uint'
    min: 0
    max: 99

  APPLICATION_TYPE:
    bits: '5.7-5.0'
    comment:
      en: 'Application type, linked to a specific hardware version; set by the supplier (FFh if none).'
      fr: 'Type d''application, lié à une version matérielle spécifique ; défini par le fournisseur (FFh si aucun).'
      es: 'Tipo de aplicación, ligado a una versión de hardware específica; definido por el proveedor (FFh si no hay ninguno).'
      de: 'Anwendungstyp, verknüpft mit einer bestimmten Hardwareversion; vom Lieferanten festgelegt (FFh, falls keiner).'
      it: 'Tipo di applicazione, legato a una versione hardware specifica; definito dal fornitore (FFh se assente).'
      pl: 'Typ aplikacji powiązany z określoną wersją sprzętową; ustalany przez dostawcę (FFh, jeśli brak).'
      ru: 'Тип приложения, связанный с определённой версией аппаратного обеспечения; задаётся поставщиком (FFh, если нет).'
      zh: '应用类型，与特定硬件版本相关；由供应商设定（无则为FFh）。'
      hu: 'Az alkalmazás típusa, egy adott hardververzióhoz kötve; a beszállító állítja be (FFh, ha nincs).'
      pt: 'Tipo de aplicação, associado a uma versão de hardware específica; definido pelo fornecedor (FFh se nenhum)'
    type: 'uint'
    min: 0
    max: 255

  SOFTWARE_VERSION_ID:
    bits: '6.7-6.0'
    comment:
      en: 'Software version identifier.'
      fr: 'Identifiant de la version du logiciel.'
      es: 'Identificador de la versión del software.'
      de: 'Softwareversions-Kennung.'
      it: 'Identificativo della versione del software.'
      pl: 'Identyfikator wersji oprogramowania.'
      ru: 'Идентификатор версии программного обеспечения.'
      zh: '软件版本标识符。'
      hu: 'Szoftververzió-azonosító.'
      pt: 'Identificador da versão do software'
    type: 'uint'
    min: 0
    max: 255

  SOFTWARE_VERSION_EVOLUTION:
    bits: '7.7-7.0'
    comment:
      en: 'Software version evolution identifier.'
      fr: 'Identifiant d''évolution de la version logicielle.'
      es: 'Identificador de evolución de la versión de software.'
      de: 'Kennung der Softwareversionsänderung.'
      it: 'Identificativo di evoluzione della versione software.'
      pl: 'Identyfikator zmiany wersji oprogramowania.'
      ru: 'Идентификатор изменения версии программного обеспечения.'
      zh: '软件版本演进标识符。'
      hu: 'A szoftververzió változásának azonosítója.'
      pt: 'Identificador de evolução da versão de software.'
    type: 'uint'
    min: 0
    max: 255

  TUNING_EDITION:
    bits: '8.7-8.0'
    comment:
      en: 'Tuning evolution identifier (0 if no tuning-specific parameter).'
      fr: 'Identifiant d''évolution de calibrage (0 s''il n''y a pas de paramètre de calibrage spécifique).'
      es: 'Identificador de evolución del calibrado (0 si no hay parámetro de calibrado específico).'
      de: 'Kennung der Abstimmungsänderung (0, wenn kein spezifischer Abstimmungsparameter vorliegt).'
      it: 'Identificativo di evoluzione della taratura (0 se non c''è un parametro di taratura specifico).'
      pl: 'Identyfikator zmiany strojenia (0, jeśli brak specyficznego parametru strojenia).'
      ru: 'Идентификатор изменения калибровки (0, если нет специфического параметра калибровки).'
      zh: '调校版本标识符（无特定调校参数时为0）。'
      hu: 'Hangolási módosítás azonosítója (0, ha nincs speciális hangolási paraméter).'
      pt: 'Identificador de evolução da calibração (0 se não houver parâmetro de calibração específico).'
    type: 'uint'
    min: 0
    max: 255
