id: 0x458
name: 'REAR_SELF_LEVELING_STATUS'
type: 'can'
length: 3
comment:
  en: 'Rear self-levelling suspension status: target ride height not reached, height correction in progress, ground-clearance alert request, fault and manual wake-up.'
  fr: 'État de la suspension auto-nivelante arrière : hauteur de roulage cible non atteinte, correction de hauteur en cours, demande d''alerte garde au sol, défaut et réveil manuel.'
  es: 'Estado de la suspensión autonivelante trasera: altura de marcha objetivo no alcanzada, corrección de altura en curso, solicitud de alerta de altura libre al suelo, fallo y activación manual.'
  de: 'Status der selbstnivellierenden Hinterachsfederung: Ziel-Fahrhöhe nicht erreicht, laufende Höhenkorrektur, Anforderung Bodenfreiheitswarnung, Fehler und manuelle Weckung.'
  it: 'Stato della sospensione autolivellante posteriore: altezza di marcia obiettivo non raggiunta, correzione altezza in corso, richiesta allarme altezza da terra, guasto e risveglio manuale.'
  pl: 'Stan tylnego zawieszenia samopoziomującego: docelowa wysokość jazdy nieosiągnięta, trwająca korekta wysokości, żądanie alarmu prześwitu, usterka i ręczne wybudzenie.'
  ru: 'Статус задней самовыравнивающейся подвески: целевая высота движения не достигнута, выполняется коррекция высоты, запрос предупреждения о дорожном просвете, неисправность и ручное пробуждение.'
  zh: '后自动调平悬挂状态:未达到目标行驶高度、高度校正进行中、离地间隙警报请求、故障和手动唤醒。'
  hu: 'A hátsó önszintező felfüggesztés állapota: a célmagasság nincs elérve, folyamatban lévő magasságkorrekció, talajtávolság-riasztási kérés, hiba és kézi ébresztés.'
  pt: 'Estado da suspensão autonivelante traseira: altura-alvo não alcançada, correção de altura em curso, pedido de alerta de distância ao solo, avaria e ativação manual.'
periodicity: ['50ms']
senders: ['CAAR']
receivers: ['ABS', 'CMM', 'BSI']

