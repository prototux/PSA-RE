        es: 'Sensor no ajustado'
        de: 'Sensor nicht abgeglichen'
        it: 'Sensore non regolato'
        pl: 'Czujnik nieskalibrowany'
        ru: 'Датчик не откалиброван'
        zh: '传感器未调校'
        hu: 'Az érzékelő nincs beállítva'
        pt: 'Sensor não ajustado'
      0x01:
        en: 'Adjusted'
        fr: 'Capteur ajusté'
        es: 'Sensor ajustado'
        de: 'Sensor abgeglichen'
        it: 'Sensore regolato'
        pl: 'Czujnik wyregulowany'
        ru: 'Датчик отрегулирован'
        zh: '传感器已调整'
        hu: 'Az érzékelő beállítva'
        pt: 'Sensor ajustado'

  STEERING_WHEEL_ANGLE_SENSOR_CALIBRATION:
    bits: '4.1'
    comment:
      en: 'Steering wheel angle sensor calibration status'
      fr: 'Etat de calibration du capteur d''angle volant'
      es: 'Estado de calibración del sensor de ángulo del volante'
      de: 'Kalibrierstatus des Lenkradwinkelsensors'
      it: 'Stato di calibrazione del sensore dell''angolo del volante'
      pl: 'Stan kalibracji czujnika kąta skrętu kierownicy'
      ru: 'Состояние калибровки датчика угла поворота руля'
      zh: '方向盘角度传感器标定状态'
      hu: 'A kormánykerékszög-érzékelő kalibrálási állapota'
