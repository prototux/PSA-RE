      fr: 'Somme de contrôle du signal d''angle volant'
      es: 'Suma de comprobación de la señal de ángulo del volante'
      de: 'Prüfsumme des Lenkradwinkelsignals'
      it: 'Checksum del segnale dell''angolo del volante'
