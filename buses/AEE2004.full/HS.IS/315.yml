id: 0x315
name: 'STEERING_WHEEL_ANGLE_EPS'
type: 'can'
length: 5
comment:
  en: 'Steering wheel angle data from the electric power steering ECU (DAE).'
  fr: 'Données d''angle volant issues du calculateur de direction assistée électrique (DAE).'
  es: 'Datos del ángulo del volante de la ECU de dirección asistida eléctrica (DAE).'
  de: 'Lenkradwinkeldaten vom Steuergerät der elektrischen Servolenkung (DAE).'
  it: 'Dati dell''angolo dello sterzo dalla centralina dello sterzo assistito elettrico (DAE).'
  pl: 'Dane kąta koła kierownicy ze sterownika elektrycznego wspomagania kierownicy (DAE).'
  ru: 'Данные угла поворота руля от блока управления электроусилителем руля (DAE).'
  zh: '来自电动助力转向控制单元(DAE)的方向盘转角数据。'
  hu: 'A kormánykerék-szög adatai az elektromos szervokormány vezérlőegységétől (DAE).'
  pt: 'Dados do ângulo do volante da ECU de direção assistida elétrica (DAE).'
periodicity: ['10ms']
senders: ['DAE']

signals:
  STEERING_WHEEL_ANGLE:
    bits: '1.7-2.0'
    comment:
      en: 'Steering wheel angle'
      fr: 'Angle du volant'
      es: 'Ángulo del volante'
      de: 'Lenkradwinkel'
      it: 'Angolo del volante'
      pl: 'Kąt skrętu kierownicy'
      ru: 'Угол поворота рулевого колеса'
      zh: '方向盘转角'
      hu: 'A kormánykerék szöge'
      pt: 'Ângulo do volante'
    type: 'sint'
    factor: 0.1
    min: -780
    max: 780
    units: '°'
    invalid: 0x7FFF
    default: 0x00

  STEERING_WHEEL_ROTATION_SPEED:
    bits: '3.7-3.0'
    comment:
      en: 'Steering wheel rotation speed'
      fr: 'Vitesse de rotation du volant'
      es: 'Velocidad de rotación del volante'
      de: 'Lenkraddrehgeschwindigkeit'
      it: 'Velocità di rotazione del volante'
      pl: 'Prędkość obrotu kierownicy'
      ru: 'Скорость вращения рулевого колеса'
      zh: '方向盘转动速度'
      hu: 'A kormánykerék forgási sebessége'
      pt: 'Velocidade de rotação do volante'
    type: 'uint'
    factor: 4
    min: 0
    max: 1016
    units: '°/s'
    invalid: 0xFF
    default: 0x00

  STEERING_WHEEL_ROTATION_DIRECTION:
    bits: '4.7'
    comment:
      en: 'Steering wheel angle sensor rotation direction'
      fr: 'Sens de rotation du capteur d''angle volant'
      es: 'Sentido de rotación del sensor de ángulo del volante'
      de: 'Drehrichtung des Lenkradwinkelsensors'
      it: 'Senso di rotazione del sensore dell''angolo del volante'
      pl: 'Kierunek obrotu czujnika kąta skrętu kierownicy'
      ru: 'Направление вращения датчика угла поворота руля'
      zh: '方向盘角度传感器旋转方向'
      hu: 'A kormánykerékszög-érzékelő forgásiránya'
      pt: 'Sentido de rotação do sensor de ângulo do volante'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Positive angle direction, wheel angle increasing (counter-clockwise)'
        fr: 'Direction des angles positifs, incrémentation de l''angle volant (sens trigonométrique)'
        es: 'Dirección de ángulos positivos, incremento del ángulo del volante (sentido antihorario)'
        de: 'Positive Winkelrichtung, Lenkwinkel steigt (Gegenuhrzeigersinn)'
        it: 'Direzione angoli positivi, incremento angolo volante (senso antiorario)'
        pl: 'Kierunek kątów dodatnich, wzrost kąta kierownicy (przeciwnie do ruchu wskazówek zegara)'
        ru: 'Направление положительных углов, увеличение угла руля (против часовой стрелки)'
        zh: '正角度方向，方向盘角度增大（逆时针）'
        hu: 'Pozitív szögirány, a kormányszög növekszik (óramutató járásával ellentétes)'
        pt: 'Direção de ângulos positivos, incremento do ângulo do volante (sentido anti-horário)'
      0x01:
        en: 'Negative angle direction, steering wheel angle decreasing: clockwise'
        fr: 'Direction des angles négatifs, décrémentation de l''angle volant : sens horaire'
        es: 'Dirección de ángulos negativos, decremento del ángulo del volante: sentido horario'
        de: 'Negative Winkelrichtung, abnehmender Lenkradwinkel: im Uhrzeigersinn'
        it: 'Direzione degli angoli negativi, decremento dell''angolo volante: senso orario'
        pl: 'Kierunek kątów ujemnych, zmniejszanie kąta kierownicy: zgodnie z ruchem wskazówek zegara'
        ru: 'Направление отрицательных углов, уменьшение угла руля: по часовой стрелке'
        zh: '负角度方向，方向盘转角递减：顺时针'
        hu: 'Negatív szögirány, a kormányszög csökken: az óramutató járásával megegyezően'
        pt: 'Direção de ângulos negativos, decremento do ângulo do volante: sentido horário'

  STEERING_WHEEL_ANGLE_SENSOR_FAULT_CODE:
    bits: '4.6-4.3'
    comment:
      en: 'Steering wheel angle sensor fault code'
      fr: 'Code défaut du capteur d''angle volant'
      es: 'Código de fallo del sensor de ángulo del volante'
      de: 'Fehlercode des Lenkradwinkelsensors'
      it: 'Codice di guasto del sensore dell''angolo del volante'
      pl: 'Kod usterki czujnika kąta skrętu kierownicy'
      ru: 'Код неисправности датчика угла поворота руля'
      zh: '方向盘角度传感器故障代码'
      hu: 'A kormánykerékszög-érzékelő hibakódja'
      pt: 'Código de falha do sensor de ângulo do volante'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'No fault, or no longer any fault'
        fr: 'Pas ou plus de défaut'
        es: 'Sin fallo, o ya no hay fallo'
        de: 'Kein oder kein Fehler mehr'
        it: 'Nessun guasto, o non più presente'
        pl: 'Brak lub już brak usterki'
        ru: 'Неисправность отсутствует или устранена'
        zh: '无故障或故障已消失'
        hu: 'Nincs, vagy már nincs hiba'
        pt: 'Sem avaria, ou já sem avaria'
      0x01:
        en: 'Inconsistency detected by ESP on steering wheel rotation speed (if Etat_capt_vol and Calibration_vol = ...)'
        fr: 'Incohérence détectée par l''ESP sur la vitesse de rotation du volant (si État_capt_vol et Calibration_vol = ...)'
        es: 'Incoherencia detectada por el ESP en la velocidad de rotación del volante (si Etat_capt_vol y Calibration_vol = ...)'
        de: 'Von ESP erkannte Unstimmigkeit bei der Lenkraddrehgeschwindigkeit (wenn Etat_capt_vol und Calibration_vol = ...)'
        it: 'Incoerenza rilevata dall''ESP sulla velocità di rotazione del volante (se Etat_capt_vol e Calibration_vol = ...)'
        pl: 'Niespójność wykryta przez ESP w prędkości obrotowej koła kierownicy (jeśli Etat_capt_vol i Calibration_vol = ...)'
        ru: 'Несоответствие, обнаруженное ESP по скорости вращения руля (если Etat_capt_vol и Calibration_vol = ...)'
        zh: 'ESP检测到方向盘转速不一致(若Etat_capt_vol和Calibration_vol=...)'
        hu: 'Az ESP által észlelt eltérés a kormány forgási sebességében (ha Etat_capt_vol és Calibration_vol = ...)'
        pt: 'Inconsistência detetada pelo ESP na velocidade de rotação do volante (se Etat_capt_vol e Calibration_vol = ...)'
      0x02:
        en: 'Inconsistency detected by ESP on steering wheel angle (if sensor state and calibration = 1)'
        fr: 'Incohérence détectée par l''ESP sur l''angle volant (si état capteur et calibration = 1)'
        es: 'Incoherencia detectada por el ESP en el ángulo del volante (si estado del sensor y calibración = 1)'
        de: 'Vom ESP erkannte Unstimmigkeit beim Lenkradwinkel (wenn Sensorstatus und Kalibrierung = 1)'
        it: 'Incoerenza rilevata dall''ESP sull''angolo volante (se stato sensore e calibrazione = 1)'
        pl: 'Niespójność wykryta przez ESP w kącie skrętu kierownicy (jeśli stan czujnika i kalibracja = 1)'
        ru: 'Несоответствие, обнаруженное ESP по углу поворота руля (если состояние датчика и калибровка = 1)'
        zh: 'ESP检测到方向盘转角不一致(若传感器状态和标定=1)'
        hu: 'Az ESP által észlelt inkonzisztencia a kormányszögben (ha az érzékelőállapot és kalibráció = 1)'
        pt: 'Incoerência detetada pelo ESP no ângulo do volante (se estado do sensor e calibração = 1)'
      0x03:
        en: 'Inconsistency detected by ESP on steering wheel speed/angle info (if sensor state and calibration OK)'
        fr: 'Incohérence détectée par l''ESP sur l''info vitesse et angle volant (si état capteur et calibration OK)'
        es: 'Incoherencia detectada por el ESP en la información de velocidad y ángulo del volante (si el estado del sensor y la calibración son correctos)'
        de: 'Von ESP erkannte Unstimmigkeit bei Lenkradgeschwindigkeits-/Winkelinfo (bei OK-Sensorstatus und -kalibrierung)'
        it: 'Incoerenza rilevata dall''ESP sulle informazioni di velocità e angolo del volante (se stato sensore e calibrazione OK)'
        pl: 'Niespójność wykryta przez ESP w informacji o prędkości i kącie kierownicy (jeśli stan czujnika i kalibracja są OK)'
        ru: 'Несоответствие, обнаруженное ESP по данным скорости/угла руля (если состояние датчика и калибровка в норме)'
        zh: 'ESP检测到方向盘转速/转角信息不一致(若传感器状态与标定正常)'
        hu: 'Az ESP inkonzisztenciát észlelt a kormánykerék-sebesség/szög adatokban (ha az érzékelő állapota és kalibrációja rendben van)'
        pt: 'Inconsistência detetada pelo ESP na informação de velocidade/ângulo do volante (se estado do sensor e calibração OK)'

  STEERING_WHEEL_ANGLE_SENSOR_ADJUSTMENT_STATUS:
