      fr: 'Indication du réglage usine fournisseur du capteur d''angle volant'
      es: 'Indicación del ajuste de fábrica del proveedor del sensor de ángulo del volante'
      de: 'Angabe der werkseitigen Lieferantenjustierung des Lenkradwinkelsensors'
      it: 'Indicazione della regolazione di fabbrica del fornitore del sensore dell''angolo del volante'
      pl: 'Wskazanie fabrycznej regulacji dostawcy czujnika kąta skrętu kierownicy'
      ru: 'Указание заводской настройки поставщика датчика угла поворота руля'
      zh: '方向盘角度传感器供应商出厂调整指示'
      hu: 'A kormánykerékszög-érzékelő gyári beszállítói beállításának jelzése'
      pt: 'Indicação do ajuste de fábrica do fornecedor do sensor de ângulo do volante'
    type: 'bool'
    default: 0x01
