id: 0x1E8
name: 'ENGINE_MEAP_STATUS'
type: 'can'
length: 8
comment:
  en: 'Engine ECU data 3: MEAP command, redemption counter, MEAP actuator software position and rear preparation in progress.'
  fr: 'Données calculateur moteur 3 : commande MEAP, compteur de rachats, position logicielle de l''actionneur MEAP et préparation arrière en cours.'
  es: 'Datos de la centralita del motor 3: comando MEAP, contador de canjes, posición software del actuador MEAP y preparación trasera en curso.'
  de: 'Motorsteuergerät-Daten 3: MEAP-Befehl, Einlösezähler, Software-Position des MEAP-Aktuators und laufende Heckvorbereitung.'
  it: 'Dati della centralina motore 3: comando MEAP, contatore riscatti, posizione software dell''attuatore MEAP e preparazione posteriore in corso.'
  pl: 'Dane sterownika silnika 3: polecenie MEAP, licznik wykupów, pozycja programowa siłownika MEAP i trwające przygotowanie tylne.'
  ru: 'Данные ЭБУ двигателя 3: команда MEAP, счётчик погашений, программная позиция привода MEAP и выполняемая задняя подготовка.'
  zh: '发动机ECU数据3:MEAP命令、兑换计数器、MEAP执行器软件位置和后部准备进行中。'
  hu: 'Motorvezérlő adatok 3: MEAP parancs, beváltásszámláló, a MEAP aktuátor szoftveres pozíciója és folyamatban lévő hátsó előkészítés.'
  pt: 'Dados 3 da unidade de controlo do motor: comando MEAP, contador de resgate, posição de software do atuador MEAP e preparação traseira em curso.'
observations:
  en: 'On state change of: STOP_START_PREPARATION_STATUS. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : STOP_START_PREPARATION_STATUS. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: STOP_START_PREPARATION_STATUS. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: STOP_START_PREPARATION_STATUS. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: STOP_START_PREPARATION_STATUS. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: STOP_START_PREPARATION_STATUS. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: STOP_START_PREPARATION_STATUS. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当PREPA_AR_EN_COURS状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z) STOP_START_PREPARATION_STATUS állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: STOP_START_PREPARATION_STATUS. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['1000ms', 'trigger']
senders: ['CMM']
receivers: ['BSI', 'ABS', 'BVA', 'HCU1']

signals:
  STOP_START_PREPARATION_STATUS:
    bits: '1.7-1.6'
    comment:
      en: 'Stop-start restart preparation status'
      fr: 'État de préparation du redémarrage (stop & start)'
      es: 'Estado de preparación del reinicio (stop & start)'
      de: 'Status der Neustartvorbereitung (Stop & Start)'
      it: 'Stato di preparazione al riavvio (stop & start)'
      pl: 'Stan przygotowania do ponownego rozruchu (stop & start)'
      ru: 'Статус подготовки к перезапуску (стоп-старт)'
      zh: '停止启动(Stop-Start)重启准备状态'
      hu: 'Az újraindítás előkészítésének állapota (stop-start)'
      pt: 'Estado de preparação do reinício (stop & start)'
    type: 'enum'
    default: 0x01
    values:
      0x00:
        unused: true
      0x01:
        en: 'No restart preparation in progress'
        fr: 'Pas de préparation de redémarrage en cours'
        es: 'Sin preparación de reinicio en curso'
        de: 'Keine Neustartvorbereitung im Gange'
        it: 'Nessuna preparazione al riavvio in corso'
        pl: 'Brak trwającego przygotowania do ponownego uruchomienia'
        ru: 'Подготовка к перезапуску не выполняется'
        zh: '未进行重启准备'
        hu: 'Nincs folyamatban újraindítási előkészület'
        pt: 'Sem preparação de reinício em curso'
      0x02:
        en: 'Restart preparation in progress'
        fr: 'Préparation au redémarrage en cours'
        es: 'Preparación para el reinicio en curso'
        de: 'Neustartvorbereitung läuft'
        it: 'Preparazione al riavvio in corso'
        pl: 'Trwa przygotowanie do ponownego uruchomienia'
        ru: 'Идёт подготовка к перезапуску'
        zh: '重启准备中'
        hu: 'Újraindítás előkészítése folyamatban'
        pt: 'Preparação para reinício em curso'
      0x03:
        unused: true

