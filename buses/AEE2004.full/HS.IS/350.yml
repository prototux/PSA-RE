      en: 'Vehicle trim angle (CSS)'
      fr: 'Assiette du véhicule (CSS)'
      es: 'Ángulo de asiento del vehículo (CSS)'
      de: 'Fahrzeugneigungswinkel (CSS)'
      it: 'Angolo di assetto del veicolo (CSS)'
      pl: 'Kąt pochylenia nadwozia pojazdu (CSS)'
      ru: 'Угол наклона кузова автомобиля (CSS)'
      zh: '车辆姿态角(CSS)'
      hu: 'A jármű dőlésszöge (CSS)'
      pt: 'Ângulo de assento do veículo (CSS)'
    type: 'sint'
