id: 0x350
name: 'SUSPENSION_DYNAMIC_DATA'
type: 'can'
length: 8
comment:
  en: 'Suspension data: vehicle ride height and wheel-travel (damper stroke) at each corner.'
  fr: 'Données de suspension : hauteur de caisse et débattement de roue (course d''amortisseur) à chaque coin.'
  es: 'Datos de suspensión: altura de la carrocería y recorrido de rueda (carrera del amortiguador) en cada esquina.'
  de: 'Fahrwerksdaten: Fahrzeughöhe und Radhub (Dämpferweg) an jeder Ecke.'
  it: 'Dati delle sospensioni: altezza da terra e escursione ruota (corsa dell''ammortizzatore) su ciascun angolo.'
  pl: 'Dane zawieszenia: wysokość nadwozia i skok koła (skok amortyzatora) w każdym narożniku.'
  ru: 'Данные подвески: клиренс кузова и ход колеса (ход амортизатора) на каждом углу.'
  zh: '悬架数据:车身高度及各车轮的行程(减震器行程)。'
  hu: 'Futómű adatok: a karosszéria magassága és a kerékmozgás (lengéscsillapító-löket) minden saroknál.'
  pt: 'Dados da suspensão: altura ao solo do veículo e curso da roda (percurso do amortecedor) em cada canto.'
periodicity: ['10ms']
senders: ['CSS']
receivers:
  - 'BCP'
  - 'BHI'
  - 'AMVAR'
  - 'ACC'
  - 'AR2S'
  - 'BSI'
  - 'BVA'
  - 'CAAR'
  - 'ACCEL_SENSOR'
  - 'CAV'
  - 'CGPL'
  - 'CMEL'
  - 'CMM'
  - 'DSG'
  - 'FSE'
  - 'DIAG_TOOL'
  - 'SBW'
  - 'SCDT'
  - 'TBMU'
  - 'DAE'
  - 'ABS'

signals:
  FRONT_LEFT_WHEEL_DEFLECTION:
    bits: '1.5-2.4'
    comment:
      en: 'Front left wheel deflection'
      fr: 'Débattement de la roue avant gauche'
      es: 'Recorrido de la rueda delantera izquierda'
      de: 'Federweg des linken Vorderrads'
      it: 'Escursione della ruota anteriore sinistra'
      pl: 'Skok przedniego lewego koła'
      ru: 'Ход переднего левого колеса'
      zh: '左前轮位移量'
      hu: 'A bal első kerék löketútja'
      pt: 'Curso da roda dianteira esquerda'
    type: 'sint'
    factor: 0.25
    min: -127
    max: 127
    units: 'mm'
    invalid: 0x1FF
    default: 0x00

  FRONT_RIGHT_WHEEL_DEFLECTION:
    bits: '2.1-3.0'
    comment:
      en: 'Front right wheel deflection'
      fr: 'Débattement de la roue avant droite'
      es: 'Recorrido de la rueda delantera derecha'
      de: 'Federweg des rechten Vorderrads'
      it: 'Escursione della ruota anteriore destra'
      pl: 'Skok przedniego prawego koła'
      ru: 'Ход переднего правого колеса'
      zh: '右前轮位移量'
      hu: 'A jobb első kerék löketútja'
      pt: 'Curso da roda dianteira direita'
    type: 'sint'
    factor: 0.25
    min: -127
    max: 127
    units: 'mm'
    invalid: 0x1FF
    default: 0x00

  REAR_LEFT_WHEEL_DEFLECTION:
    bits: '4.5-5.4'
    comment:
      en: 'Rear left wheel deflection'
      fr: 'Débattement de la roue arrière gauche'
      es: 'Recorrido de la rueda trasera izquierda'
      de: 'Federweg des linken Hinterrads'
      it: 'Escursione della ruota posteriore sinistra'
      pl: 'Skok tylnego lewego koła'
      ru: 'Ход заднего левого колеса'
      zh: '左后轮位移量'
      hu: 'A bal hátsó kerék löketútja'
