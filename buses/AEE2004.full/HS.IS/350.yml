  REAR_RIGHT_WHEEL_DEFLECTION:
    bits: '5.1-6.0'
    comment:
      en: 'Rear right wheel deflection'
      fr: 'Débattement de la roue arrière droite'
      es: 'Recorrido de la rueda trasera derecha'
      de: 'Federweg des rechten Hinterrads'
      it: 'Escursione della ruota posteriore destra'
      pl: 'Skok tylnego prawego koła'
      ru: 'Ход заднего правого колеса'
      zh: '右后轮位移量'
      hu: 'A jobb hátsó kerék löketútja'
