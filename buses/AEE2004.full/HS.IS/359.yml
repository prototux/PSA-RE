id: 0x359
name: 'LONGITUDINAL_ACCEL_SENSOR_DATA'
type: 'can'
length: 3
comment:
  en: 'Longitudinal acceleration sensor data: raw/calibrated and unfiltered value, validity and fault status.'
  fr: 'Données du capteur d''accélération longitudinale : valeur brute/calibrée et non filtrée, validité et état de défaut.'
  es: 'Datos del sensor de aceleración longitudinal: valor bruto/calibrado y sin filtrar, validez y estado de fallo.'
  de: 'Daten des Längsbeschleunigungssensors: Roh-/kalibrierter und ungefilterter Wert, Gültigkeit und Fehlerstatus.'
  it: 'Dati del sensore di accelerazione longitudinale: valore grezzo/calibrato e non filtrato, validità e stato di guasto.'
  pl: 'Dane czujnika przyspieszenia wzdłużnego: wartość surowa/skalibrowana i niefiltrowana, ważność i stan usterki.'
  ru: 'Данные датчика продольного ускорения: сырое/калиброванное и нефильтрованное значение, достоверность и статус неисправности.'
  zh: '纵向加速度传感器数据:原始/校准和未滤波值、有效性和故障状态。'
  hu: 'A hosszirányú gyorsulásérzékelő adatai: nyers/kalibrált és szűretlen érték, érvényesség és hibaállapot.'
  pt: 'Dados do sensor de aceleração longitudinal: valor em bruto/calibrado e não filtrado, validade e estado de avaria.'
periodicity: ['10ms']
senders: ['ACCEL_SENSOR']
receivers: ['ABS']

signals:
  LONGITUDINAL_ACCELERATION_SENSOR_FAULT_STATUS:
    bits: '1.7-1.4'
    comment:
      en: 'Longitudinal acceleration sensor fault status'
      fr: 'État de défaut du capteur d''accélération longitudinale'
      es: 'Estado de fallo del sensor de aceleración longitudinal'
      de: 'Fehlerstatus des Längsbeschleunigungssensors'
      it: 'Stato di guasto del sensore di accelerazione longitudinale'
      pl: 'Stan usterki czujnika przyspieszenia wzdłużnego'
      ru: 'Статус неисправности датчика продольного ускорения'
      zh: '纵向加速度传感器故障状态'
      hu: 'A hosszirányú gyorsulásérzékelő hibaállapota'
      pt: 'Estado de avaria do sensor de aceleração longitudinal'
    type: 'enum'
    values:
      0x00:
        en: 'No fault'
        fr: 'Pas de défaut'
        es: 'Sin fallo'
        de: 'Kein Fehler'
        it: 'Nessun guasto'
        pl: 'Brak usterki'
        ru: 'Нет неисправности'
        zh: '无故障'
        hu: 'Nincs hiba'
        pt: 'Sem avaria'

  LONGITUDINAL_ACCELERATION_SENSOR_CALIBRATION_ACTIVE:
    bits: '1.3'
    comment:
      en: 'Longitudinal acceleration sensor calibration active'
      fr: 'Calibrage du capteur d''accélération longitudinale actif'
      es: 'Calibración del sensor de aceleración longitudinal activa'
      de: 'Kalibrierung des Längsbeschleunigungssensors aktiv'
      it: 'Calibrazione del sensore di accelerazione longitudinale attiva'
      pl: 'Aktywna kalibracja czujnika przyspieszenia wzdłużnego'
      ru: 'Активна калибровка датчика продольного ускорения'
      zh: '纵向加速度传感器校准激活'
      hu: 'A hosszirányú gyorsulásérzékelő kalibrálása aktív'
      pt: 'Calibração do sensor de aceleração longitudinal ativa'
    type: 'bool'
    default: 0x01
    values:
      0x00:
        en: 'Calibration in progress'
        fr: 'Calibrage en cours'
        es: 'Calibración en curso'
        de: 'Kalibrierung läuft'
        it: 'Calibrazione in corso'
        pl: 'Trwa kalibracja'
        ru: 'Выполняется калибровка'
        zh: '校准进行中'
        hu: 'Kalibrálás folyamatban'
        pt: 'Calibração em curso'
      0x01:
        en: 'Invalid'
        fr: 'Non valide'
        es: 'No válido'
        de: 'Ungültig'
        it: 'Non valido'
        pl: 'Nieprawidłowe'
        ru: 'Недействительно'
        zh: '无效'
        hu: 'Érvénytelen'
        pt: 'Inválido'

  LONGITUDINAL_ACCELERATION_VALID:
    bits: '1.2'
    comment:
      en: 'Longitudinal acceleration data validity'
      fr: 'Validité des données d''accélération longitudinale'
      es: 'Validez de los datos de aceleración longitudinal'
      de: 'Gültigkeit der Längsbeschleunigungsdaten'
      it: 'Validità dei dati di accelerazione longitudinale'
      pl: 'Ważność danych przyspieszenia wzdłużnego'
      ru: 'Достоверность данных продольного ускорения'
      zh: '纵向加速度数据有效性'
      hu: 'A hosszirányú gyorsulás adatainak érvényessége'
      pt: 'Validade dos dados de aceleração longitudinal'
    type: 'bool'
    factor: 0.015625
    offset: -32
    values:
      0x00:
        en: 'Valid'
        fr: 'Valide'
        es: 'Válido'
        de: 'Gültig'
        it: 'Valido'
        pl: 'Ważne'
        ru: 'Действительно'
        zh: '有效'
        hu: 'Érvényes'
        pt: 'Válido'
      0x01:
        en: 'Invalid'
        fr: 'Invalide'
        es: 'Inválido'
        de: 'Ungültig'
        it: 'Non valido'
        pl: 'Nieprawidłowe'
        ru: 'Недействительно'
        zh: '无效'
        hu: 'Érvénytelen'
        pt: 'Inválido'

  UNUSED_1:
    bits: '1.1'
    unused: true

  UNUSED_2:
    bits: '1.0'
    unused: true

  LONGITUDINAL_ACCELERATION_UNFILTERED:
    bits: '2.7-3.4'
    comment:
      en: 'Unfiltered longitudinal acceleration'
      fr: 'Accélération longitudinale non filtrée'
      es: 'Aceleración longitudinal sin filtrar'
      de: 'Ungefilterte Längsbeschleunigung'
      it: 'Accelerazione longitudinale non filtrata'
      pl: 'Niefiltrowane przyspieszenie wzdłużne'
      ru: 'Нефильтрованное продольное ускорение'
      zh: '未经滤波的纵向加速度'
      hu: 'Szűretlen hosszirányú gyorsulás'
      pt: 'Aceleração longitudinal não filtrada'
    type: 'uint'
    factor: 0.015625
    offset: -32
    min: -32
    max: 31.984
    units: 'm/s2'

  PROCESS_COUNTER_4BIT:
    bits: '3.3-3.0'
    comment:
      en: '4-bit process counter'
      fr: 'Compteur de process 4 bits'
      es: 'Contador de proceso de 4 bits'
      de: '4-Bit-Prozesszähler'
      it: 'Contatore di processo a 4 bit'
      pl: '4-bitowy licznik procesu'
      ru: '4-битный счётчик процесса'
      zh: '4 位处理计数器'
      hu: '4 bites folyamatszámláló'
      pt: 'Contador de processo de 4 bits'
    type: 'uint'
    min: 0
    max: 15
    default: 0x00
