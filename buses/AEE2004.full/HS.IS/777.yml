id: 0x777
name: 'FAULT_LOG_PROJ_RAW'
type: 'can'
length: 8
comment:
  en: 'Raw fault log data frame for the PROJ node.'
  fr: 'Trame brute du journal des défauts du calculateur PROJ.'
  es: 'Trama de datos en bruto del registro de fallos del nodo PROJ.'
  de: 'Rohdaten-Rahmen des Fehlerspeichers des Steuergeräts PROJ.'
  it: 'Trama dati grezzi del registro guasti del nodo PROJ.'
  pl: 'Ramka surowych danych dziennika usterek węzła PROJ.'
  ru: 'Кадр необработанных данных журнала неисправностей узла PROJ.'
  zh: 'PROJ节点故障日志原始数据帧。'
  hu: 'A PROJ csomópont hibanapló nyers adatkerete.'
  pt: 'Trama de dados em bruto do registo de avarias do nó PROJ.'
observations:
  en: 'May be sent event-triggered as 3 groups of 3 frames, 100 ms apart, with different lengths, to the BSI'
  fr: 'Peut être émise de façon événementielle sous forme de 3 fois 3 trames, espacées de 100 ms, de longueur différente, vers la BSI'
  es: 'Puede enviarse de forma basada en eventos como 3 series de 3 tramas, separadas 100 ms, de longitud diferente, hacia la BSI'
  de: 'Kann ereignisgesteuert als 3-mal 3 Frames unterschiedlicher Länge, 100 ms auseinander, an die BSI gesendet werden'
  it: 'Può essere inviata in modo event-driven come 3 serie di 3 frame, distanziati di 100 ms, di lunghezza diversa, verso la BSI'
  pl: 'Może być wysyłana zdarzeniowo jako 3 razy po 3 ramki, w odstępie 100 ms, o różnej długości, do BSI'
  ru: 'Может отправляться по событию в виде 3 групп по 3 кадра с интервалом 100 мс и разной длиной, в адрес BSI'
  zh: '可事件触发地以3组共3帧的形式发送给BSI,间隔100毫秒,长度各不相同'
  hu: 'Eseményvezérelten küldhető 3-szor 3 keretként, 100 ms-os időközzel, eltérő hosszúsággal, a BSI felé'
  pt: 'Pode ser enviada de forma baseada em eventos como 3 grupos de 3 tramas, com 100 ms de intervalo, com comprimentos diferentes, para a BSI'
periodicity: ['trigger']
senders: ['BCP']
receivers:
  - 'BSI'
  - 'ACC'
  - 'AMVAR'
  - 'AR2S'
  - 'BVA'
  - 'CAAR'
  - 'ACCEL_SENSOR'
  - 'CAV'
  - 'CGPL'
  - 'CMEL'
  - 'CMM'
  - 'CSS'
  - 'DSG'
  - 'FSE'
  - 'DIAG_TOOL'
  - 'SBW'
  - 'SCDT'
  - 'BHI'
  - 'TBMU'
  - 'DAE'
  - 'ABS'

signals:
  FAULT_LOG_REQUEST_DATA:
    bits: '1.7-8.0'
    comment:
      en: 'Data of the fault log request'
      fr: 'Données de la demande du journal de défauts'
      es: 'Datos de la solicitud del registro de fallos'
      de: 'Daten der Fehlerprotokoll-Anfrage'
      it: 'Dati della richiesta del registro guasti'
      pl: 'Dane żądania dziennika usterek'
      ru: 'Данные запроса журнала неисправностей'
      zh: '故障日志请求数据'
      hu: 'A hibanapló kérés adatai'
      pt: 'Dados do pedido do registo de falhas'
    type: 'uint'

alternatives:
  - note:
      en: 'Other layout observed for this frame (other software or car version)'
      fr: 'Autre disposition observée pour cette trame (autre version de logiciel ou de véhicule)'
      es: 'Otra disposición observada para esta trama (otra versión de software o de vehículo)'
      de: 'Andere beobachtete Belegung dieser Botschaft (andere Software- oder Fahrzeugversion)'
      it: 'Altra disposizione osservata per questo frame (altra versione di software o di vettura)'
      pl: 'Inny zaobserwowany układ tej ramki (inna wersja oprogramowania lub samochodu)'
      ru: 'Другая наблюдаемая раскладка этого кадра (другая версия ПО или автомобиля)'
      zh: '此帧观察到的另一种布局（其他软件或车型版本）'
      hu: 'A keret másik megfigyelt elrendezése (más szoftver- vagy autóverzió)'
      pt: 'Outra disposição observada para esta trama (outra versão de software ou de veículo)'
    periodicity: ['trigger']
    senders: ['BCP']
    signals:
      FRAME_COUNT:
        bits: '1.7-1.6'
        comment:
          en: 'Number of frames'
          fr: 'Nombre de trames'
          es: 'Número de tramas'
          de: 'Anzahl der Botschaften'
          it: 'Numero di messaggi'
          pl: 'Liczba ramek'
          ru: 'Количество кадров'
          zh: '帧数量'
          hu: 'Az üzenetek száma'
          pt: 'Número de tramas'
        type: 'uint'
      FRAME_NUMBER:
        bits: '1.5-1.4'
        comment:
          en: 'Frame sequence number'
          fr: 'Numéro de la trame'
          es: 'Número de trama'
          de: 'Rahmennummer'
          it: 'Numero del messaggio'
          pl: 'Numer ramki'
          ru: 'Номер кадра'
          zh: '帧序号'
          hu: 'Az üzenet sorszáma'
          pt: 'Número da trama'
        type: 'uint'
      FAULT_STATUS:
        bits: '1.3'
        comment:
          en: 'Fault status'
          fr: 'État du défaut'
          es: 'Estado del fallo'
          de: 'Fehlerstatus'
          it: 'Stato del guasto'
          pl: 'Stan usterki'
          ru: 'Состояние неисправности'
          zh: '故障状态'
          hu: 'A hiba állapota'
          pt: 'Estado da falha'
        type: 'bool'
      UNUSED_1:
        bits: '1.2'
        unused: true
      MESSAGE_TYPE:
        bits: '1.1-1.0'
        comment:
          en: 'Message type'
          fr: 'Type de message'
          es: 'Tipo de mensaje'
          de: 'Nachrichtentyp'
          it: 'Tipo di messaggio'
          pl: 'Typ komunikatu'
          ru: 'Тип сообщения'
          zh: '消息类型'
          hu: 'Üzenettípus'
          pt: 'Tipo de mensagem'
        type: 'uint'
      FAULT_CODES:
        bits: '2.7-4.0'
        comment:
          en: 'Fault codes'
          fr: 'Codes défaut'
          es: 'Códigos de fallo'
          de: 'Fehlercodes'
          it: 'Codici guasto'
          pl: 'Kody usterek'
          ru: 'Коды неисправностей'
          zh: '故障代码'
          hu: 'Hibakódok'
          pt: 'Códigos de falha'
        type: 'uint'
      VEHICLE_TIME_COUNTER:
        bits: '5.7-8.0'
        comment:
          en: 'Vehicle operating time counter'
          fr: 'Compteur du temps de fonctionnement du véhicule'
          es: 'Contador del tiempo de funcionamiento del vehículo'
          de: 'Betriebszeitzähler des Fahrzeugs'
          it: 'Contatore del tempo di funzionamento del veicolo'
          pl: 'Licznik czasu pracy pojazdu'
          ru: 'Счётчик времени работы автомобиля'
          zh: '车辆运行时间计数器'
          hu: 'A jármű üzemidő-számlálója'
          pt: 'Contador do tempo de funcionamento do veículo'
        type: 'uint'
