        de: 'Verringerte Sicht'
        it: 'Visibilità ridotta'
        pl: 'Ograniczona widoczność'
        ru: 'Пониженная видимость'
        zh: '能见度降低'
        hu: 'Csökkent látótávolság'
        pt: 'Visibilidade reduzida'
      0x04:
        en: 'Simulation'
        fr: 'Simulation'
        es: 'Simulación'
