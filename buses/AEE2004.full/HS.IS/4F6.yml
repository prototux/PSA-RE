id: 0x4F6
name: 'ACC_RADAR_DATA'
type: 'can'
length: 4
comment:
  en: 'Adaptive cruise control radar data: target detected, distance, sensor state, time gap and relative speed.'
  fr: 'Données radar du régulateur de vitesse adaptatif : cible détectée, distance, état capteur, intervalle temporel et vitesse relative.'
  es: 'Datos del radar del control de crucero adaptativo: objetivo detectado, distancia, estado del sensor, intervalo de tiempo y velocidad relativa.'
  de: 'Radardaten des adaptiven Tempomaten: erkanntes Ziel, Abstand, Sensorstatus, Zeitlücke und Relativgeschwindigkeit.'
  it: 'Dati radar del cruise control adattivo: bersaglio rilevato, distanza, stato sensore, intervallo temporale e velocità relativa.'
  pl: 'Dane radaru aktywnego tempomatu: wykryty cel, odległość, stan czujnika, odstęp czasowy i prędkość względna.'
  ru: 'Данные радара адаптивного круиз-контроля: обнаруженная цель, расстояние, состояние датчика, временной интервал и относительная скорость.'
  zh: '自适应巡航控制雷达数据:检测到的目标、距离、传感器状态、时间间隔和相对速度。'
  hu: 'Az adaptív tempomat radaradatai: észlelt célpont, távolság, érzékelő állapota, időrés és relatív sebesség.'
  pt: 'Dados do radar do regulador de velocidade adaptativo: alvo detetado, distância, estado do sensor, intervalo de tempo e velocidade relativa.'
periodicity: ['100ms']
senders: ['ARTIV']
receivers: ['BSI']

signals:
  ARTIV_TIME_GAP:
    bits: '1.7-1.0'
    comment:
      en: 'Time gap to the vehicle ahead (ARTIV radar)'
      fr: 'Intervalle de temps avec le véhicule qui précède (radar ARTIV)'
      es: 'Intervalo de tiempo con el vehículo precedente (radar ARTIV)'
      de: 'Zeitabstand zum vorausfahrenden Fahrzeug (ARTIV-Radar)'
      it: 'Intervallo di tempo dal veicolo che precede (radar ARTIV)'
      pl: 'Odstęp czasowy od poprzedzającego pojazdu (radar ARTIV)'
      ru: 'Временной интервал до впереди идущего автомобиля (радар ARTIV)'
      zh: '与前车的时间间隔(ARTIV雷达)'
      hu: 'Az előttük haladó járműtől mért időrés (ARTIV radar)'
      pt: 'Intervalo de tempo com o veículo precedente (radar ARTIV)'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 25.4
    units: 's'
    invalid: 0xFF
    default: 0xFF

  ARTIV_DISTANCE:
    bits: '2.7-2.0'
    comment:
      en: 'Distance to the vehicle ahead (ARTIV radar)'
      fr: 'Distance au véhicule qui précède (radar ARTIV)'
      es: 'Distancia al vehículo precedente (radar ARTIV)'
      de: 'Abstand zum vorausfahrenden Fahrzeug (ARTIV-Radar)'
      it: 'Distanza dal veicolo che precede (radar ARTIV)'
      pl: 'Odległość do poprzedzającego pojazdu (radar ARTIV)'
      ru: 'Дистанция до впереди идущего автомобиля (радар ARTIV)'
      zh: '与前车的距离(ARTIV雷达)'
      hu: 'Az előttük haladó járműtől mért távolság (ARTIV radar)'
      pt: 'Distância ao veículo da frente (radar ARTIV)'
    type: 'uint'
    factor: 1
    min: 0
    max: 253
    units: 'm'
    invalid: 0xFF
    default: 0xFF

  ARTIV_RELATIVE_SPEED:
    bits: '3.7-3.0'
    comment:
      en: 'Relative speed to the vehicle ahead (ARTIV radar)'
      fr: 'Vitesse relative par rapport au véhicule qui précède (radar ARTIV)'
      es: 'Velocidad relativa respecto al vehículo precedente (radar ARTIV)'
      de: 'Relativgeschwindigkeit zum vorausfahrenden Fahrzeug (ARTIV-Radar)'
      it: 'Velocità relativa rispetto al veicolo che precede (radar ARTIV)'
      pl: 'Prędkość względna do poprzedzającego pojazdu (radar ARTIV)'
      ru: 'Относительная скорость до впереди идущего автомобиля (радар ARTIV)'
      zh: '相对前车的相对速度(ARTIV雷达)'
      hu: 'Relatív sebesség az előttük haladó járműhöz képest (ARTIV radar)'
      pt: 'Velocidade relativa em relação ao veículo precedente (radar ARTIV)'
    type: 'uint'
    factor: 1
    offset: -100
    min: -100
    max: 154
    units: 'km/h'
    invalid: 0xFF
    default: 0xFF

  ARTIV_SENSOR_STATE:
    bits: '4.3-4.1'
    comment:
      en: 'ARTIV (distance radar) sensor state'
      fr: 'État du capteur du radar ARTIV'
