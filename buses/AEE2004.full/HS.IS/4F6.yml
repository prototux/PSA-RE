        pl: 'Symulacja'
        ru: 'Симуляция'
        zh: '仿真'
        hu: 'Szimuláció'
        pt: 'Simulação'
      0x05:
        en: 'Learning'
        fr: 'Apprentissage'
        es: 'Aprendizaje'
        de: 'Anlernen'
        it: 'Apprendimento'
        pl: 'Uczenie'
        ru: 'Обучение'
        zh: '学习'
        hu: 'Tanulás'
        pt: 'Aprendizagem'
      0x06:
        unused: true
      0x07:
        en: 'Fault'
        fr: 'Défaut'
        es: 'Fallo'
        de: 'Fehler'
