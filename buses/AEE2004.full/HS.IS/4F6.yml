        fr: 'Inactif'
        es: 'Inactivo'
        de: 'Inaktiv'
        it: 'Inattivo'
        pl: 'Nieaktywny'
        ru: 'Неактивно'
        zh: '未激活'
        hu: 'Inaktív'
        pt: 'Inativo'
      0x02:
