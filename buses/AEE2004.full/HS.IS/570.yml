id: 0x570
name: 'CSS_DAV_FAULT'
type: 'can'
length: 1
comment:
  en: 'DAV function fault status, sent by the CSS node when that function is allocated to it.'
  fr: 'État de défaut de la fonction DAV, envoyé par le module CSS lorsque cette fonction lui est allouée.'
  es: 'Estado de fallo de la función DAV, enviado por el módulo CSS cuando dicha función le está asignada.'
  de: 'Fehlerstatus der DAV-Funktion, gesendet vom CSS-Modul, wenn ihm diese Funktion zugewiesen ist.'
  it: 'Stato di guasto della funzione DAV, inviato dal modulo CSS quando tale funzione gli è assegnata.'
  pl: 'Stan usterki funkcji DAV, wysyłany przez moduł CSS, gdy funkcja ta jest mu przypisana.'
  ru: 'Статус неисправности функции DAV, отправляемый модулем CSS, когда эта функция назначена ему.'
  zh: 'DAV功能故障状态,当该功能分配给CSS模块时由其发送。'
  hu: 'A DAV funkció hibaállapota, a CSS modul küldi, amikor ez a funkció hozzá van rendelve.'
  pt: 'Estado de avaria da função DAV, enviado pelo nó CSS quando essa função lhe está atribuída.'
periodicity: ['100ms']
senders: ['CSS']
receivers:
  - 'BSI'
  - 'ACC'
  - 'AMVAR'
  - 'AR2S'
  - 'BVA'
  - 'CAAR'
  - 'ACCEL_SENSOR'
  - 'CAV'
  - 'CGPL'
  - 'CMEL'
  - 'CMM'
  - 'DSG'
  - 'FSE'
  - 'DIAG_TOOL'
  - 'BCP'
  - 'SBW'
  - 'SCDT'
  - 'BHI'
  - 'TBMU'
  - 'DAE'
  - 'ABS'

