      fr: 'Défaut DAV'
      es: 'Fallo DAV'
      de: 'DAV-Fehler'
      it: 'Guasto DAV'
      pl: 'Usterka DAV'
      ru: 'Неисправность DAV'
      zh: 'DAV故障'
      hu: 'DAV hiba'
      pt: 'Falha DAV'
    type: 'enum'
    default: 0x00
