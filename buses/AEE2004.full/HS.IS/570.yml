        it: 'Guasto DA, gravità 4'
        pl: 'Usterka DA, poziom 4'
        ru: 'Неисправность DA, степень тяжести 4'
        zh: 'DA 故障,严重程度4'
        hu: 'DA hiba, 4. súlyossági szint'
