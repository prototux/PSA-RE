id: 0x60F
name: 'TPMS_WHEEL_PRESSURE'
alt_names: ['DSG_PRESSURE']
type: 'can'
length: 8
comment:
  en: 'Tyre pressure monitoring system: measured pressure and pressure deviation for each wheel (front/rear, left/right).'
  fr: 'Système de surveillance de pression des pneus : pression mesurée et écart de pression pour chaque roue (avant/arrière, gauche/droite).'
  es: 'Sistema de control de presión de neumáticos: presión medida y desviación de presión de cada rueda (delantera/trasera, izquierda/derecha).'
  de: 'Reifendruckkontrollsystem: gemessener Druck und Druckabweichung für jedes Rad (vorne/hinten, links/rechts).'
  it: 'Sistema di controllo della pressione dei pneumatici: pressione misurata e scostamento di pressione per ogni ruota (anteriore/posteriore, sinistra/destra).'
  pl: 'System monitorowania ciśnienia w oponach: zmierzone ciśnienie i odchylenie ciśnienia dla każdego koła (przód/tył, lewe/prawe).'
  ru: 'Система контроля давления в шинах: измеренное давление и отклонение давления для каждого колеса (переднее/заднее, левое/правое).'
  zh: '胎压监测系统:每个车轮(前/后,左/右)的测量压力和压力偏差。'
  hu: 'Abroncsnyomás-ellenőrző rendszer: mért nyomás és nyomáseltérés minden keréknél (első/hátsó, bal/jobb).'
  pt: 'Sistema de monitorização da pressão dos pneus: pressão medida e desvio de pressão de cada roda (dianteira/traseira, esquerda/direita).'
periodicity: ['300ms']
senders: ['DSG']
receivers:
  - 'BSI'
  - 'ACC'
  - 'AMVAR'
  - 'AR2S'
  - 'BVA'
  - 'CAAR'
  - 'ACCEL_SENSOR'
  - 'CAV'
  - 'CGPL'
  - 'CMEL'
  - 'CMM'
  - 'CSS'
  - 'FSE'
  - 'DIAG_TOOL'
  - 'BCP'
  - 'SBW'
  - 'SCDT'
  - 'BHI'
  - 'TBMU'
  - 'DAE'
  - 'ABS'

signals:
  FRONT_LEFT_WHEEL_PRESSURE:
    bits: '1.5-1.0'
    alt_names: ['PRESSURE_FRONT_LEFT']
    comment:
      en: 'Front left wheel tyre pressure'
      fr: 'Pression du pneu avant gauche'
      es: 'Presión del neumático delantero izquierdo'
      de: 'Reifendruck des linken Vorderrads'
      it: 'Pressione del pneumatico anteriore sinistro'
      pl: 'Ciśnienie opony przedniej lewej'
      ru: 'Давление в шине переднего левого колеса'
      zh: '左前轮胎压'
      hu: 'Az első bal kerék gumiabroncsnyomása'
      pt: 'Pressão do pneu dianteiro esquerdo'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 6.2
    units: 'bar'
    invalid: 0x3F
    default: 0x00

  FRONT_RIGHT_WHEEL_PRESSURE:
    bits: '2.7-2.2'
