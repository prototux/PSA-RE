id: 0x0C8
name: 'IMMO_REQUEST_TO_ESP'
type: 'can'
length: 5
comment:
  en: 'Immobiliser unlock request sent by the engine ECU to the ESP/brake ECU'
  fr: 'Requête de déverrouillage antidémarrage envoyée par le calculateur moteur au calculateur de freinage (ESP)'
  es: 'Solicitud de desbloqueo del inmovilizador enviada por la centralita del motor a la centralita de frenos (ESP)'
  de: 'Wegfahrsperren-Entriegelungsanfrage vom Motorsteuergerät an das Bremsen-/ESP-Steuergerät'
  it: 'Richiesta di sblocco dell''immobilizzatore inviata dalla centralina motore alla centralina freni (ESP)'
  pl: 'Żądanie odblokowania immobilizera wysyłane przez sterownik silnika do sterownika hamulców (ESP)'
  ru: 'Запрос разблокировки иммобилайзера, отправляемый блоком управления двигателем блоку ESP/тормозов'
  zh: '由发动机ECU发送至制动/ESP ECU的防盗锁止解锁请求'
  hu: 'A motorvezérlő egység által a fék-/ESP vezérlőegységnek küldött indításgátló-feloldási kérés'
  pt: 'Pedido de desbloqueio do imobilizador enviado pela ECU do motor à ECU ESP/travões.'
observations:
  en: 'Event defined by the ADC MUX protocol, then periodically every 10 ms until the brake ECU responds (CFD frame)'
  fr: 'Événement défini par le protocole ADC MUX, puis périodiquement toutes les 10 ms jusqu''à la réponse de le calculateur de freinage (trame CFD)'
  es: 'Evento definido por el protocolo ADC MUX, luego periódicamente cada 10 ms hasta la respuesta de la ECU de frenos (trama CFD)'
  de: 'Durch das ADC-MUX-Protokoll definiertes Ereignis, danach periodisch alle 10 ms bis zur Antwort von das Bremssteuergerät (CFD-Frame)'
  it: 'Evento definito dal protocollo ADC MUX, poi periodicamente ogni 10 ms fino alla risposta di la centralina freni (frame CFD)'
  pl: 'Zdarzenie zdefiniowane przez protokół ADC MUX, następnie okresowo co 10 ms do odpowiedzi sterownik hamulców (ramka CFD)'
  ru: 'Событие определяется протоколом ADC MUX, затем периодически каждые 10 мс до получения ответа от блок управления тормозами (кадр CFD)'
  zh: '由ADC MUX协议定义的事件,此后每10毫秒周期发送,直到制动ECU响应(CFD帧)为止'
  hu: 'Az ADC MUX protokoll által meghatározott esemény, majd 10 ms-onként periodikusan a(z) a fékrendszer vezérlőegysége válaszáig (CFD keret)'
  pt: 'Evento definido pelo protocolo ADC MUX, depois periodicamente a cada 10 ms até a unidade de controlo de travagem responder (trama CFD)'
periodicity: ['trigger']
senders: ['CMM']
receivers: ['ABS']

signals:
  HCU_UNLOCK_REQUEST:
    bits: '1.7-1.0'
    comment:
      en: 'Unlocking request sent from the hybrid control unit (HCU) to the BSI'
      fr: 'Demande de déverrouillage envoyée du calculateur hybride (HCU) vers la BSI'
      es: 'Solicitud de desbloqueo enviada del calculador híbrido (HCU) a la BSI'
      de: 'Entriegelungsanforderung vom Hybridsteuergerät (HCU) an die BSI'
      it: 'Richiesta di sblocco inviata dalla centralina ibrida (HCU) alla BSI'
      pl: 'Żądanie odblokowania wysyłane ze sterownika hybrydowego (HCU) do BSI'
      ru: 'Запрос разблокировки, отправляемый от гибридного блока управления (HCU) к BSI'
      zh: '从混合动力控制单元(HCU)发送到BSI的解锁请求'
      hu: 'A hibrid vezérlőegység (HCU) által a BSI-nek küldött nyitási kérés'
      pt: 'Pedido de desbloqueio enviado da unidade de controlo híbrida (HCU) ao BSI'
    type: 'uint'

