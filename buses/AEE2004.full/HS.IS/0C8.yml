      de: 'Seed-Wert des Sicherheitszugriffs, höchstwertiges Byte'
      it: 'Valore seed di accesso sicuro, byte più significativo in assoluto'
      pl: 'Wartość ziarna (seed) dostępu zabezpieczonego, bajt najstarszy'
      ru: 'Значение seed безопасного доступа, самый старший байт'
      zh: '安全访问种子值,最高字节'
      hu: 'A biztonsági hozzáférés seed-értéke, legmagasabb bájt'
      pt: 'Valor da semente (seed) de acesso seguro, byte de maior peso absoluto'
