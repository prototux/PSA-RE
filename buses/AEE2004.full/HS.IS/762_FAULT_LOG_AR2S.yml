  FRAME_COUNT:
    bits: '1.7-1.6'
    comment:
      en: 'Number of frames'
      fr: 'Nombre de trames'
      es: 'Número de tramas'
      de: 'Anzahl der Botschaften'
      it: 'Numero di messaggi'
      pl: 'Liczba ramek'
      ru: 'Количество кадров'
      zh: '帧数量'
