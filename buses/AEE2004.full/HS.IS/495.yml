      pl: 'Żądanie ponownego uruchomienia silnika z podsystemu wspomagania kierownicy'
      ru: 'Запрос повторного пуска двигателя от подсистемы усилителя руля'
      zh: '电动助力转向子系统的发动机重启请求'
      hu: 'Motor-újraindítási kérés a szervokormány alrendszertől'
      pt: 'Pedido de reinício do motor pelo subsistema de direção assistida'
    type: 'bool'
