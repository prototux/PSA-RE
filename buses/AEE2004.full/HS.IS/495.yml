        es: 'Sin inhibición de reinicio'
        de: 'Keine Neustartsperre'
        it: 'Nessuna inibizione del riavvio'
        pl: 'Brak zablokowania ponownego uruchomienia'
        ru: 'Нет блокировки перезапуска'
        zh: '无重启禁止'
