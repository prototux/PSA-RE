        ru: 'Нет необходимости перезапуска'
        zh: '无需重新启动'
        hu: 'Nincs szükség újraindításra'
        pt: 'Sem necessidade de reinício'
      0x01:
        en: 'Restart needed'
        fr: 'Demande de redémarrage'
        es: 'Necesidad de reinicio'
        de: 'Neustart erforderlich'
        it: 'Necessità di riavvio'
        pl: 'Wymagany ponowny rozruch'
        ru: 'Требуется перезапуск'
        zh: '需要重启'
        hu: 'Újraindítás szükséges'
        pt: 'Necessidade de reinício'

