id: 0x319
name: 'LATERAL_ACCEL_YAW_SENSOR_DATA'
type: 'can'
length: 8
comment:
  en: 'Lateral acceleration and yaw rate sensor data: raw/calibrated and unfiltered values, validity and fault status, sensor serial number and oscillator frequency deviation.'
  fr: 'Données du capteur d''accélération latérale et de vitesse de lacet : valeurs brutes/calibrées et non filtrées, validité et état de défaut, numéro de série du capteur et écart de fréquence d''oscillation.'
  es: 'Datos del sensor de aceleración lateral y velocidad de guiñada: valores brutos/calibrados y sin filtrar, validez y estado de fallo, número de serie del sensor y desviación de frecuencia de oscilación.'
  de: 'Daten des Querbeschleunigungs- und Gierratensensors: Roh-/kalibrierte und ungefilterte Werte, Gültigkeit und Fehlerstatus, Seriennummer des Sensors und Oszillatorfrequenzabweichung.'
  it: 'Dati del sensore di accelerazione laterale e velocità di imbardata: valori grezzi/calibrati e non filtrati, validità e stato di guasto, numero di serie del sensore e scostamento di frequenza dell''oscillatore.'
  pl: 'Dane czujnika przyspieszenia bocznego i prędkości odchylenia: wartości surowe/skalibrowane i niefiltrowane, ważność i stan usterki, numer seryjny czujnika i odchylenie częstotliwości oscylatora.'
  ru: 'Данные датчика бокового ускорения и скорости рыскания: сырые/калиброванные и нефильтрованные значения, достоверность и статус неисправности, серийный номер датчика и отклонение частоты осциллятора.'
  zh: '横向加速度和横摆角速度传感器数据:原始/校准和未滤波值、有效性和故障状态、传感器序列号和振荡器频率偏差。'
  hu: 'Az oldalirányú gyorsulás- és legyezőszög-érzékelő adatai: nyers/kalibrált és szűretlen értékek, érvényesség és hibaállapot, érzékelő sorozatszáma és oszcillátor frekvenciaeltérése.'
  pt: 'Dados do sensor de aceleração lateral e velocidade de guinada: valores em bruto/calibrados e não filtrados, validade e estado de avaria, número de série do sensor e desvio da frequência do oscilador.'
periodicity: ['10ms']
senders: ['ACCEL_SENSOR']
receivers: ['ABS']

