id: 0x451
name: 'SUSPENSION_DYNAMIC_DATA_2'
type: 'can'
length: 7
comment:
  en: 'Suspension data: vehicle ride height, Hydractive sport mode, target/current ride-height position and fault-lamp requests.'
  fr: 'Données de suspension : hauteur de caisse, mode sport Hydractive, position de hauteur cible/actuelle et demandes de témoin de défaut.'
  es: 'Datos de suspensión: altura de la carrocería, modo deportivo Hydractive, posición de altura objetivo/actual y solicitudes de testigo de fallo.'
  de: 'Fahrwerksdaten: Fahrzeughöhe, Hydractive-Sportmodus, Soll-/Ist-Höhenposition und Anforderungen der Fehlerleuchte.'
  it: 'Dati delle sospensioni: altezza da terra, modalità sport Hydractive, posizione di altezza target/attuale e richieste della spia di guasto.'
  pl: 'Dane zawieszenia: wysokość nadwozia, tryb sportowy Hydractive, docelowa/bieżąca pozycja wysokości oraz żądania lampki usterki.'
  ru: 'Данные подвески: клиренс кузова, спортивный режим Hydractive, целевое/текущее положение по высоте и запросы лампы неисправности.'
  zh: '悬架数据:车身高度、Hydractive运动模式、目标/当前高度位置以及故障灯请求。'
  hu: 'Futómű adatok: a karosszéria magassága, Hydractive sport üzemmód, cél-/aktuális magasságpozíció, valamint a hibajelző lámpa kérései.'
  pt: 'Dados da suspensão: altura ao solo do veículo, modo desportivo Hydractive, posição de altura ao solo alvo/atual e pedidos da luz avisadora de avaria.'
periodicity: ['20ms']
senders: ['BHI']
receivers:
  - 'ABS'
  - 'BCP'
  - 'CSS'
  - 'CMM'
  - 'BSI'
  - 'ACC'
  - 'AMVAR'
  - 'AR2S'
  - 'BVA'
  - 'CAAR'
  - 'ACCEL_SENSOR'
  - 'CAV'
  - 'CGPL'
  - 'CMEL'
  - 'DSG'
  - 'FSE'
  - 'DIAG_TOOL'
  - 'SBW'
  - 'SCDT'
  - 'TBMU'
  - 'DAE'

