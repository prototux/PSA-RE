id: 0x7A0
name: 'PARK_ASSIST_BUTTON_ACQ'
type: 'can'
length: 1
comment:
  en: 'Test acquisition frame for the parking-assist height adjustment push-buttons, sent by the body computer (BSI) on the inter-system bus.'
  fr: 'Trame d''acquisition test des boutons-poussoirs de réglage de hauteur de l''aide au stationnement, envoyée par le BSI sur le bus inter-système.'
  es: 'Trama de adquisición de prueba de los botones de ajuste de altura de la ayuda al aparcamiento, enviada por la BSI en el bus intersistema.'
  de: 'Testerfassungsrahmen der Höhenverstelltasten der Einparkhilfe, vom BSI auf dem Inter-System-Bus gesendet.'
  it: 'Trama di acquisizione test dei pulsanti di regolazione altezza dell''assistenza al parcheggio, inviata dal BSI sul bus inter-sistema.'
  pl: 'Testowa ramka akwizycji przycisków regulacji wysokości wspomagania parkowania, wysyłana przez BSI na magistrali międzysystemowej.'
  ru: 'Тестовый кадр опроса кнопок регулировки высоты парковочного ассистента, отправляемый BSI по межсистемной шине.'
  zh: '车身控制器(BSI)在系统间总线上发送的泊车辅助高度调节按钮测试采集帧。'
  hu: 'A parkolássegítő magasságállító nyomógombjainak tesztadat-gyűjtő kerete, amelyet a BSI küld a rendszerközi buszon.'
  pt: 'Trama de aquisição de teste dos botões de ajuste de altura da ajuda ao estacionamento, enviada pela BSI no barramento intersistema.'
periodicity: ['100ms']
senders: ['BSI']

signals:
  HEIGHT_DECREASE_BUTTON_STATUS:
    bits: '1.1'
    comment:
      en: 'Height ''-'' button information'
      fr: 'Information du bouton hauteur « - »'
      es: 'Información del botón de altura «-»'
      de: 'Information der Höhentaste „-“'
      it: 'Informazione del pulsante altezza «-»'
      pl: 'Informacja przycisku wysokości „-”'
      ru: 'Информация о кнопке высоты «-»'
      zh: '高度"-"按钮信息'
      hu: 'A magasság „-” gomb információja'
      pt: 'Informação do botão de altura «-»'
    type: 'bool'
    factor: 0.5
    default: 0x00
    values:
      0x00:
        en: 'Height "-" request inactive'
        fr: 'Demande de hauteur "-" inactive'
        es: 'Solicitud de altura "-" inactiva'
        de: 'Anforderung Höhe "-" inaktiv'
        it: 'Richiesta altezza "-" inattiva'
        pl: 'Żądanie wysokości "-" nieaktywne'
        ru: 'Запрос высоты "-" неактивен'
        zh: '高度"-"请求未激活'
        hu: 'Magasság "-" kérés inaktív'
        pt: 'Pedido de altura "-" inativo'
      0x01:
        en: 'Height "-" information available'
        fr: 'Information hauteur « - » active'
        es: 'Información de altura «-» activa'
        de: 'Höheninformation „-“ aktiv'
        it: 'Informazione altezza «-» attiva'
        pl: 'Informacja o wysokości «-» aktywna'
        ru: 'Информация о высоте «-» активна'
        zh: '高度“-”信息可用'
        hu: 'Magasság „-” információ aktív'
        pt: 'Informação de altura «-» ativa'

  HEIGHT_INCREASE_BUTTON_STATUS:
    bits: '1.0'
    comment:
      en: 'Height ''+'' button information'
      fr: 'Information du bouton hauteur « + »'
      es: 'Información del botón de altura «+»'
      de: 'Information der Höhentaste „+“'
      it: 'Informazione del pulsante altezza «+»'
      pl: 'Informacja przycisku wysokości „+”'
      ru: 'Информация о кнопке высоты «+»'
      zh: '高度"+"按钮信息'
      hu: 'A magasság „+” gomb információja'
      pt: 'Informação do botão de altura «+»'
    type: 'bool'
    factor: 0.5
    default: 0x00
    values:
      0x00:
        en: 'Height “+” information not available'
        fr: 'Information hauteur « + » indisponible'
        es: 'Información de altura «+» no disponible'
        de: 'Information Höhe „+“ nicht verfügbar'
        it: 'Informazione altezza «+» non disponibile'
        pl: 'Informacja o wysokości „+” niedostępna'
        ru: 'Информация высоты «+» недоступна'
        zh: '高度“+”信息不可用'
        hu: 'A magasság „+” információja nem elérhető'
        pt: 'Informação de altura “+” não disponível'
      0x01:
        en: 'Height "+" push information not available'
        fr: 'Information poussoir hauteur « + » non disponible'
        es: 'Información del pulsador de altura "+" no disponible'
        de: 'Höhentaste „+“ Information nicht verfügbar'
        it: 'Informazione pulsante altezza "+" non disponibile'
        pl: 'Informacja przycisku wysokości „+” niedostępna'
        ru: 'Информация кнопки высоты «+» недоступна'
        zh: '高度“+”按键信息不可用'
        hu: 'A magasság „+” gomb információja nem elérhető'
        pt: 'Informação do pulsador de altura "+" não disponível'
