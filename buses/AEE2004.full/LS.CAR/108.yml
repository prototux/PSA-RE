id: 0x108
name: 'CMM_VERSION'
type: 'can'
length: 1
comment:
  en: 'Shutter button press, locking state and boot locking state, sent on any parameter change.'
  fr: 'Appui sur le bouton du volet, état de condamnation et état de condamnation du coffre, envoyés sur tout changement de paramètre.'
  es: 'Pulsación del botón de la persiana, estado de bloqueo y estado de bloqueo del maletero, enviados ante cualquier cambio de parámetro.'
  de: 'Betätigung der Abdeckungstaste, Verriegelungszustand und Kofferraumverriegelungszustand, gesendet bei jeder Parameteränderung.'
  it: 'Pressione del pulsante della copertura, stato di chiusura e stato di chiusura del bagagliaio, inviati a ogni cambio di parametro.'
  pl: 'Naciśnięcie przycisku osłony, stan zamknięcia i stan zamknięcia bagażnika, wysyłane przy każdej zmianie parametru.'
  ru: 'Нажатие кнопки шторки, состояние блокировки и состояние блокировки багажника, отправляемые при любом изменении параметра.'
  zh: '遮帘按钮按下、锁止状态及后备箱锁止状态，在任何参数变化时发送。'
  hu: 'A redőnygomb megnyomása, a záróállapot és a csomagtér záróállapota, bármely paraméter változásakor küldve.'
  pt: 'Pressão do botão do estore, estado de trancagem e estado de trancagem da bagageira, enviados em qualquer mudança de parâmetro.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['BCM']

