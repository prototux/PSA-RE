id: 0x213
name: 'KEY_ID_CODE'
type: 'can'
length: 8
comment:
  en: 'Key identification codes, sent on change of at least one of the two values.'
  fr: 'Codes d''identification de clé, envoyés sur changement d''au moins une des deux valeurs.'
  es: 'Códigos de identificación de la llave, enviados al cambiar al menos uno de los dos valores.'
  de: 'Schlüsselidentifikationscodes, gesendet bei Änderung mindestens eines der beiden Werte.'
  it: 'Codici di identificazione della chiave, inviati al cambio di almeno uno dei due valori.'
  pl: 'Kody identyfikacyjne kluczyka, wysyłane przy zmianie co najmniej jednej z dwóch wartości.'
  ru: 'Коды идентификации ключа, отправляемые при изменении хотя бы одного из двух значений.'
  zh: '钥匙识别代码，在两个值中至少一个发生变化时发送。'
  hu: 'Kulcsazonosító kódok, a két érték közül legalább az egyik változásakor küldve.'
  pt: 'Códigos de identificação da chave, enviados na mudança de pelo menos um dos dois valores.'
periodicity: ['trigger']
senders: []  # TODO: find the sender(s)

signals:
  VEHICLE_ID_CODE_C:
    bits: '1.7-4.0'
    comment:
      en: 'Vehicle identification code, part C'
      fr: 'Code d''identification du véhicule, partie C'
      es: 'Código de identificación del vehículo, parte C'
      de: 'Fahrzeugidentifikationscode, Teil C'
      it: 'Codice di identificazione del veicolo, parte C'
      pl: 'Kod identyfikacyjny pojazdu, część C'
      ru: 'Идентификационный код автомобиля, часть C'
      zh: '车辆识别代码,C部分'
      hu: 'Jármű-azonosító kód, C rész'
      pt: 'Código de identificação do veículo, parte C'
    type: 'uint'

alternatives:
  - note:
      en: 'The content of this frame changes (multiplexed, selector not identified): other layout seen'
      fr: 'Le contenu de cette trame varie (multiplexée, sélecteur non identifié) : autre disposition observée'
      es: 'El contenido de esta trama varía (multiplexada, selector no identificado): otra disposición observada'
      de: 'Der Inhalt dieser Botschaft variiert (gemultiplext, Selektor nicht ermittelt): weitere beobachtete Belegung'
      it: 'Il contenuto di questo frame varia (multiplexato, selettore non identificato): altra disposizione osservata'
      pl: 'Zawartość tej ramki się zmienia (multipleksowana, selektor nieznany): inny zaobserwowany układ'
      ru: 'Содержимое этого кадра меняется (мультиплексирование, селектор не определён): другая наблюдаемая раскладка'
      zh: '此帧内容会变化（多路复用，未识别选择器）：观察到的另一种布局'
      hu: 'A keret tartalma változik (multiplexelt, a választó nem azonosított): másik megfigyelt elrendezés'
      pt: 'O conteúdo desta trama varia (multiplexada, seletor não identificado): outra disposição observada'
    signals:
      VEHICLE_ID_CODE_P:
        bits: '4.7-7.0'
        comment:
          en: 'Vehicle identification code, part P'
          fr: 'Code d''identification du véhicule, partie P'
          es: 'Código de identificación del vehículo, parte P'
          de: 'Fahrzeugidentifikationscode, Teil P'
          it: 'Codice di identificazione del veicolo, parte P'
          pl: 'Kod identyfikacyjny pojazdu, część P'
          ru: 'Идентификационный код автомобиля, часть P'
          zh: '车辆识别代码,P部分'
          hu: 'Jármű-azonosító kód, P rész'
          pt: 'Código de identificação do veículo, parte P'
        type: 'uint'
