id: 0x099
name: 'ENGINE_BAY_BOX_STATUS'
type: 'can'
length: 8
comment:
  en: 'Engine-bay box inputs: fuel pump/injection power relay feedback, air pump relay feedback, water-in-diesel and oil pressure warnings.'
  fr: 'État des paramètres moteur : pression d''huile, présence d''eau dans le gazole, relais de pompe à air et relais de puissance.'
  es: 'Entradas de la caja del compartimento motor: retorno del relé de potencia de la bomba de combustible/inyección, retorno del relé de la bomba de aire, avisos de agua en el gasóleo y de presión de aceite.'
  de: 'Eingänge der Motorraumbox: Rückmeldung des Kraftstoffpumpen-/Einspritz-Leistungsrelais, Rückmeldung des Luftpumpenrelais, Warnungen für Wasser im Diesel und Öldruck.'
  it: 'Ingressi della centralina vano motore: riscontro relè di potenza pompa carburante/iniezione, riscontro relè pompa aria, avvisi acqua nel gasolio e pressione olio.'
  pl: 'Wejścia modułu komory silnika: sprzężenie zwrotne przekaźnika mocy pompy paliwa/wtrysku, sprzężenie zwrotne przekaźnika pompy powietrza, ostrzeżenia o wodzie w oleju napędowym i ciśnieniu oleju.'
  ru: 'Входы блока моторного отсека: обратная связь силового реле топливного насоса/впрыска, обратная связь реле воздушного насоса, предупреждения о воде в дизельном топливе и давлении масла.'
  zh: '发动机舱盒输入:燃油泵/喷油功率继电器反馈、气泵继电器反馈、柴油含水及机油压力警告。'
  hu: 'A motortéri doboz bemenetei: üzemanyagszivattyú/befecskendezés teljesítményrelé visszajelzése, légszivattyú relé visszajelzése, gázolajban lévő víz és olajnyomás figyelmeztetések.'
  pt: 'Entradas da caixa do compartimento do motor: retorno do relé de potência da bomba de combustível/injeção, retorno do relé da bomba de ar, avisos de água no gasóleo e de pressão de óleo.'
observations:
  en: 'On state change of: FIXED_STOP_POSITION_STATE, NEUTRAL_GEAR_STATE, AUTO_GEARBOX_LEVER_POSITION, REVERSE_GEAR_STATE. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : FIXED_STOP_POSITION_STATE, NEUTRAL_GEAR_STATE, AUTO_GEARBOX_LEVER_POSITION, REVERSE_GEAR_STATE. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: FIXED_STOP_POSITION_STATE, NEUTRAL_GEAR_STATE, AUTO_GEARBOX_LEVER_POSITION, REVERSE_GEAR_STATE. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: FIXED_STOP_POSITION_STATE, NEUTRAL_GEAR_STATE, AUTO_GEARBOX_LEVER_POSITION, REVERSE_GEAR_STATE. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: FIXED_STOP_POSITION_STATE, NEUTRAL_GEAR_STATE, AUTO_GEARBOX_LEVER_POSITION, REVERSE_GEAR_STATE. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: FIXED_STOP_POSITION_STATE, NEUTRAL_GEAR_STATE, AUTO_GEARBOX_LEVER_POSITION, REVERSE_GEAR_STATE. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: FIXED_STOP_POSITION_STATE, NEUTRAL_GEAR_STATE, AUTO_GEARBOX_LEVER_POSITION, REVERSE_GEAR_STATE. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当E_POS_AF, NEUTRAL_GEAR_STATE, AUTO_GEARBOX_LEVER_POSITION, E_MARCHE_ARR状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z) FIXED_STOP_POSITION_STATE, NEUTRAL_GEAR_STATE, AUTO_GEARBOX_LEVER_POSITION, REVERSE_GEAR_STATE állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: FIXED_STOP_POSITION_STATE, NEUTRAL_GEAR_STATE, AUTO_GEARBOX_LEVER_POSITION, REVERSE_GEAR_STATE. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['100ms', 'trigger']
senders: ['BSM', 'BSI']
receivers: ['CDPL']

