id: 0x048
name: 'ENGINE_AR2S_SYNCHRONISATION'
type: 'can'
length: 3
comment:
  en: 'Commands sent by the BSI to the rear body computer: rear cigarette lighter, boot lighting, sunroof activation, rear dome light, boot opening, rear window opening, fuel flap opening and sun blind.'
  fr: 'Commandes envoyées par la BSI au calculateur de servitude arrière : allume-cigare arrière, éclairage du coffre, activation du toit ouvrant, plafonnier arrière, ouverture du coffre, ouverture de lunette arrière, ouverture de trappe à carburant et store.'
  es: 'Órdenes enviadas por la BSI a la centralita de servidumbre trasera: encendedor trasero, iluminación del maletero, activación del techo solar, luz interior trasera, apertura del maletero, apertura de la luneta trasera, apertura de la trampilla de combustible y estor.'
  de: 'Von der BSI an das hintere Bordnetzsteuergerät gesendete Befehle: hinterer Zigarettenanzünder, Kofferraumbeleuchtung, Schiebedachaktivierung, hintere Innenleuchte, Kofferraumöffnung, Heckscheibenöffnung, Tankklappenöffnung und Sonnenrollo.'
  it: 'Comandi inviati dalla BSI alla centralina servizi posteriore: accendisigari posteriore, illuminazione bagagliaio, attivazione tettuccio apribile, luce di cortesia posteriore, apertura bagagliaio, apertura lunotto, apertura sportello carburante e tendina.'
  pl: 'Polecenia wysyłane przez BSI do tylnego sterownika obsługowego: tylna zapalniczka, oświetlenie bagażnika, aktywacja szyberdachu, tylne oświetlenie wnętrza, otwarcie bagażnika, otwarcie tylnej szyby, otwarcie klapki wlewu paliwa i roleta.'
  ru: 'Команды, отправляемые BSI в задний сервисный блок кузова: задний прикуриватель, освещение багажника, активация люка, задний плафон, открытие багажника, открытие заднего стекла, открытие лючка бака и шторка.'
  zh: '由BSI发送给后车身服务ECU的命令：后点烟器、后备箱照明、天窗激活、后顶灯、后备箱开启、后窗开启、燃油盖开启及遮阳帘。'
  hu: 'A BSI parancsai a hátsó karosszéria-vezérlőegység felé: hátsó szivargyújtó, csomagtérvilágítás, napfénytető aktiválása, hátsó belső lámpa, csomagtérnyitás, hátsó ablak nyitása, üzemanyagtöltő-fedél nyitása és napellenző.'
  pt: 'Comandos enviados pela BSI ao computador de servidão traseiro: isqueiro traseiro, iluminação da bagageira, ativação do teto de abrir, luz de teto traseira, abertura da bagageira, abertura do vidro traseiro, abertura da tampa do depósito e estore.'
periodicity: ['100ms']
senders: ['BSI']
receivers: ['BSC', 'BSR']

