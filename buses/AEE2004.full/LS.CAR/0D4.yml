id: 0x0D4
name: 'RF_KEY_CODE_MESSAGE_RHF'
type: 'can'
length: 8
comment:
  en: 'Rolling-code fragments from the remote control (RF key fob), reassembled in reception order.'
  fr: 'Fragments de code tournant de la télécommande (clé mains-libres), réassemblés dans l''ordre de réception.'
  es: 'Fragmentos de código variable del mando a distancia (llave manos libres), reensamblados en el orden de recepción.'
  de: 'Rollcode-Fragmente der Fernbedienung (Funkschlüssel), in Empfangsreihenfolge zusammengesetzt.'
  it: 'Frammenti di codice variabile del telecomando (chiave mani libere), riassemblati nell''ordine di ricezione.'
  pl: 'Fragmenty kodu zmiennego pilota (klucza zbliżeniowego), składane w kolejności odbioru.'
  ru: 'Фрагменты плавающего кода пульта (ключа-брелока), собираемые в порядке приёма.'
  zh: '遥控器(免钥匙进入钥匙)滚动码分段,按接收顺序重组。'
  hu: 'A tavvezerlő (kihangosító kulcs) gördülő kódjának töredékei, vételi sorrendben összeállítva.'
  pt: 'Fragmentos de código variável do comando à distância (chave mãos-livres), remontados pela ordem de receção.'
observations:
  en: 'Reception of a remote-control RF message. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Réception d''un message RF de télécommande. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Recepción de un mensaje de RF del mando a distancia. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Empfang einer Funkfernbedienungs-Nachricht. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Ricezione di un messaggio RF del telecomando. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Odebranie wiadomości RF z pilota. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'Получение радиосообщения от пульта дистанционного управления. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '接收到遥控器射频消息时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'Távirányító RF üzenetének fogadásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Receção de uma mensagem RF do comando à distância. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['trigger']
senders: ['BRHF']
receivers: ['BSI', 'BCM']

