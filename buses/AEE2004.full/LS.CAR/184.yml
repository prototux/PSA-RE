id: 0x184
name: 'PEDESTRIAN_IMPACT_SENSOR_STATUS'
type: 'can'
length: 1
comment:
  en: 'Pedestrian impact detection and fault status.'
  fr: 'État de détection de choc piéton et de défaut du capteur.'
  es: 'Estado de detección de impacto de peatón y de fallo del sensor.'
  de: 'Status der Fußgänger-Aufprallerkennung und Sensorfehler.'
  it: 'Stato di rilevamento dell''urto pedone e guasto del sensore.'
  pl: 'Stan wykrywania uderzenia pieszego i usterki czujnika.'
  ru: 'Статус обнаружения наезда на пешехода и неисправности датчика.'
  zh: '行人碰撞检测及传感器故障状态。'
  hu: 'Gyalogosütközés-érzékelés és az érzékelő hibaállapota.'
  pt: 'Estado de deteção de impacto de peão e de avaria.'
observations:
  en: 'On state change of: PEDESTRIAN_IMPACT_DETECTED, BDCP_FAULT_PRESENCE'
  fr: 'Sur changement d''état de : PEDESTRIAN_IMPACT_DETECTED, BDCP_FAULT_PRESENCE'
  es: 'Al cambiar el estado de: PEDESTRIAN_IMPACT_DETECTED, BDCP_FAULT_PRESENCE'
  de: 'Bei Statusänderung von: PEDESTRIAN_IMPACT_DETECTED, BDCP_FAULT_PRESENCE'
  it: 'Al cambiamento di stato di: PEDESTRIAN_IMPACT_DETECTED, BDCP_FAULT_PRESENCE'
  pl: 'Wysyłane przy zmianie stanu: PEDESTRIAN_IMPACT_DETECTED, BDCP_FAULT_PRESENCE'
  ru: 'При изменении состояния: PEDESTRIAN_IMPACT_DETECTED, BDCP_FAULT_PRESENCE'
  zh: '当CHOC_PIETON, ETAT_DEF_BDCP状态变化时'
  hu: 'A(z) PEDESTRIAN_IMPACT_DETECTED, BDCP_FAULT_PRESENCE állapotváltozásakor'
  pt: 'Na mudança de estado de: PEDESTRIAN_IMPACT_DETECTED, BDCP_FAULT_PRESENCE'
periodicity: ['200ms', 'trigger']
senders: ['BDCP']
receivers: ['BSI', 'RBG']

signals:
  UNUSED_1:
    bits: '1.7-1.5'
    unused: true

  PEDESTRIAN_IMPACT_DETECTED:
    bits: '1.4'
    comment:
      en: 'Pedestrian impact detected since the last ignition-on'
      fr: 'Choc piéton détecté depuis la dernière mise sous contact'
      es: 'Impacto con peatón detectado desde el último encendido del contacto'
      de: 'Fußgängeraufprall seit dem letzten Zündungseinschalten erkannt'
      it: 'Urto con pedone rilevato dall''ultima accensione del contatto'
      pl: 'Wykryto uderzenie pieszego od ostatniego włączenia zapłonu'
      ru: 'Обнаружен наезд на пешехода с момента последнего включения зажигания'
      zh: '自上次点火以来检测到行人碰撞'
      hu: 'Gyalogosütközés észlelve a legutóbbi gyújtáskapcsolás óta'
      pt: 'Impacto com peão detetado desde a última ligação do contacto'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No pedestrian impact detected'
        fr: 'Pas de choc piéton détecté'
        es: 'Sin impacto con peatón detectado'
        de: 'Kein Fußgängeraufprall erkannt'
        it: 'Nessun urto con pedone rilevato'
        pl: 'Nie wykryto uderzenia pieszego'
        ru: 'Наезд на пешехода не обнаружен'
        zh: '未检测到行人碰撞'
        hu: 'Nincs gyalogosütközés észlelve'
        pt: 'Sem impacto com peão detetado'
      0x01:
        en: 'Pedestrian impact detected'
        fr: 'Choc piéton détecté'
        es: 'Impacto de peatón detectado'
        de: 'Fußgängeraufprall erkannt'
        it: 'Urto pedone rilevato'
        pl: 'Wykryto uderzenie pieszego'
        ru: 'Обнаружен наезд на пешехода'
        zh: '检测到行人碰撞'
        hu: 'Gyalogosütközés észlelve'
        pt: 'Impacto de peão detetado'

  UNUSED_2:
    bits: '1.3-1.1'
    unused: true

  BDCP_FAULT_PRESENCE:
    bits: '1.0'
    comment:
      en: 'Presence of at least one fault on the BDCP'
      fr: 'Présence d''au moins un défaut sur le BDCP'
      es: 'Presencia de al menos un fallo en el BDCP'
      de: 'Vorhandensein mindestens eines Fehlers am BDCP'
      it: 'Presenza di almeno un guasto sul BDCP'
      pl: 'Obecność co najmniej jednej usterki BDCP'
      ru: 'Наличие хотя бы одной неисправности BDCP'
      zh: 'BDCP至少存在一个故障'
      hu: 'Legalább egy hiba jelenléte a BDCP-n'
      pt: 'Presença de pelo menos uma falha no BDCP'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No BDCP fault'
        fr: 'Pas de défaut BDCP'
        es: 'Sin fallo BDCP'
        de: 'Kein BDCP-Fehler'
        it: 'Nessun guasto BDCP'
        pl: 'Brak usterki BDCP'
        ru: 'Нет неисправности BDCP'
        zh: '无BDCP故障'
        hu: 'Nincs BDCP hiba'
        pt: 'Sem falha BDCP'
      0x01:
        en: 'At least one BDCP fault'
        fr: 'Au moins un défaut BDCP'
        es: 'Al menos un fallo BDCP'
        de: 'Mindestens ein BDCP-Fehler'
        it: 'Almeno un guasto BDCP'
        pl: 'Co najmniej jedna usterka BDCP'
        ru: 'Не менее одной неисправности BDCP'
        zh: '至少一个BDCP故障'
        hu: 'Legalább egy BDCP hiba'
        pt: 'Pelo menos uma avaria BDCP'
