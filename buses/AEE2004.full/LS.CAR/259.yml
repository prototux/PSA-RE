id: 0x259
name: 'LIN_EQUIPMENT_DATA_EVAV'
type: 'can'
length: 4
comment:
  en: 'Raw LIN equipment data (4 bytes) from the electric valve actuator (EVAV), forwarded onto CAN when the immediate-transmission-request bit is set on the LIN frame.'
  fr: 'Données brutes d''équipement LIN (4 octets) de l''actionneur de vanne électrique (EVAV), relayées sur le CAN lorsque le bit de demande d''émission immédiate est positionné sur la trame LIN.'
  es: 'Datos en bruto de equipo LIN (4 bytes) del actuador de válvula eléctrica (EVAV), retransmitidos al CAN cuando se activa el bit de solicitud de transmisión inmediata en la trama LIN.'
  de: 'Rohdaten des LIN-Geräts (4 Byte) des elektrischen Ventilstellglieds (EVAV), auf CAN weitergeleitet, wenn das Bit für die Anforderung der Sofortübertragung im LIN-Rahmen gesetzt ist.'
  it: 'Dati grezzi del dispositivo LIN (4 byte) dell''attuatore della valvola elettrica (EVAV), inoltrati sul CAN quando il bit di richiesta di trasmissione immediata è impostato sulla trama LIN.'
  pl: 'Surowe dane urządzenia LIN (4 bajty) siłownika zaworu elektrycznego (EVAV), przekazywane do CAN po ustawieniu bitu żądania natychmiastowej transmisji w ramce LIN.'
  ru: 'Необработанные данные устройства LIN (4 байта) электрического клапанного привода (EVAV), передаваемые в CAN при установке бита запроса немедленной передачи в кадре LIN.'
  zh: '电动阀执行器(EVAV)的LIN设备原始数据(4字节),当LIN帧上的立即发送请求位被置位时转发至CAN。'
  hu: 'Az elektromos szelepaktuátor (EVAV) nyers LIN eszközadatai (4 bájt), CAN-ra továbbítva, amikor a LIN keret azonnali küldési kérés bitje be van állítva.'
  pt: 'Dados brutos do equipamento LIN (4 bytes) do atuador da válvula elétrica (EVAV), encaminhados para CAN quando o bit de pedido de transmissão imediata está ativo na trama LIN.'
observations:
  en: 'Sent when the ''immediate transmission request'' bit (LSB of the 1st byte) is set to 1 in the corresponding LIN frame'
  fr: 'Émise quand le bit "Demande d''émission immédiate" (bit de poids le plus faible du 1er octet) est positionné à 1 dans la trame correspondante sur le LIN'
  es: 'Enviada cuando el bit "Solicitud de emisión inmediata" (bit menos significativo del 1er byte) se pone a 1 en la trama correspondiente en el LIN'
  de: 'Gesendet, wenn das Bit "Sofortige Sendeanforderung" (niederwertigstes Bit des 1. Bytes) im entsprechenden LIN-Frame auf 1 gesetzt ist'
  it: 'Inviata quando il bit "Richiesta di trasmissione immediata" (bit meno significativo del 1° byte) è impostato a 1 nel frame corrispondente sul LIN'
  pl: 'Wysyłane, gdy bit "żądanie natychmiastowej transmisji" (najmłodszy bit 1. bajtu) zostanie ustawiony na 1 w odpowiedniej ramce LIN'
  ru: 'Отправляется, когда бит «запрос немедленной передачи» (младший бит 1-го байта) установлен в 1 в соответствующем кадре LIN'
  zh: '当LIN对应帧中"立即发送请求"位(第1字节最低位)被置1时发送'
  hu: 'Küldve, amikor az "azonnali küldési kérés" bit (az 1. bájt legkisebb helyértékű bitje) 1-re van állítva a megfelelő LIN keretben'
  pt: 'Enviada quando o bit ''pedido de transmissão imediata'' (LSB do 1.º byte) é colocado a 1 na trama LIN correspondente'
periodicity: ['500ms', 'trigger']
senders: ['BSM', 'BSI']
receivers: ['CDPL']

signals:
  LIN_GATEWAY_DATA_BSM_4:
    bits: '1.7-4.0'
    comment:
      en: 'LIN gateway data relayed by the BSM'
      fr: 'Données de la passerelle LIN relayées par le BSM'
      es: 'Datos de la pasarela LIN retransmitidos por el BSM'
      de: 'Vom BSM weitergeleitete LIN-Gateway-Daten'
      it: 'Dati del gateway LIN inoltrati dal BSM'
      pl: 'Dane bramy LIN przekazywane przez BSM'
      ru: 'Данные шлюза LIN, ретранслируемые модулем BSM'
      zh: '由BSM转发的LIN网关数据'
      hu: 'A BSM által továbbított LIN átjáró adatok'
      pt: 'Dados da gateway LIN retransmitidos pelo BSM'
    type: 'uint'
