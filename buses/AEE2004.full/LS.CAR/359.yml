id: 0x359
name: 'LONGITUDINAL_ACCEL_SENSOR_DATA'
type: 'can'
length: 6
comment:
  en: 'BSM diagnostics for the climate-control option, event-driven on any parameter change: front fog lights, indicators, AC compressor, low-beam, high-beam and headlights, left and right.'
  fr: 'Diagnostics du BSM pour l''option climatisation, envoyés sur événement à tout changement de paramètre : antibrouillards avant, clignotants, compresseur clim, feux de croisement, feux de route et phares, gauche et droite.'
  es: 'Diagnósticos del BSM para la opción de climatización, enviados por evento ante cualquier cambio de parámetro: antinieblas delanteros, intermitentes, compresor de A/C, luces de cruce, luces de carretera y faros, izquierda y derecha.'
  de: 'BSM-Diagnose für die Klimaanlagen-Option, ereignisgesteuert bei jeder Parameteränderung: Nebelscheinwerfer vorne, Blinker, Klimakompressor, Abblendlicht, Fernlicht und Scheinwerfer, links und rechts.'
  it: 'Diagnostica del BSM per l''opzione climatizzazione, inviata su evento a ogni cambiamento di parametro: fendinebbia anteriori, indicatori di direzione, compressore A/C, anabbaglianti, abbaglianti e fari, sinistra e destra.'
  pl: 'Diagnostyka BSM dla opcji klimatyzacji, wysyłana zdarzeniowo przy każdej zmianie parametru: przednie światła przeciwmgielne, kierunkowskazy, sprężarka klimatyzacji, światła mijania, drogowe i reflektory, lewe i prawe.'
  ru: 'Диагностика BSM для опции климат-контроля, отправляемая по событию при любом изменении параметра: передние противотуманные фары, поворотники, компрессор кондиционера, ближний свет, дальний свет и фары, слева и справа.'
  zh: '带空调选装件的BSM诊断,任何参数变化时按事件发送:前雾灯、转向灯、空调压缩机、近光灯、远光灯和前照灯,左右两侧。'
  hu: 'A BSM klíma opcióra vonatkozó diagnosztikája, bármely paraméter változásakor eseményalapon küldve: első ködfényszórók, index, klímakompresszor, tompított fény, távolsági fény és fényszórók, bal és jobb oldalon.'
  pt: 'Diagnóstico do BSM para a opção de climatização, baseado em eventos em qualquer mudança de parâmetro: nevoeiro dianteiro, piscas, compressor de ar condicionado, médios, máximos e faróis, esquerda e direita.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['500ms', 'trigger']
senders: ['BSM']
receivers: ['BSI']

