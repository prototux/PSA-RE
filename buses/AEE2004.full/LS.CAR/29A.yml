        fr: 'Défaillant'
        es: 'Fallido'
        de: 'Ausgefallen'
        it: 'Guasto'
        pl: 'Uszkodzony'
        ru: 'Отказ'
        zh: '故障'
        hu: 'Meghibásodott'
        pt: 'Falhado'
      0x02:
