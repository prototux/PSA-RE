      0x03:
        en: 'Function not implemented'
        fr: 'Fonction non supportée'
        es: 'Función no implementada'
        de: 'Funktion nicht implementiert'
        it: 'Funzione non implementata'
        pl: 'Funkcja niezaimplementowana'
        ru: 'Функция не реализована'
