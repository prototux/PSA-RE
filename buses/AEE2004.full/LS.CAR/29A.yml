id: 0x29A
name: 'RAIN_LIGHT_SENSOR_SLOW_DATA'
type: 'can'
length: 4
comment:
  en: 'Rain/light sensor slow-rate data: ambient and left/right sun-load sensor light levels.'
  fr: 'Données lentes du capteur de pluie et de luminosité : niveaux de luminosité ambiante et capteurs d''ensoleillement gauche/droit.'
  es: 'Datos de baja frecuencia del sensor de lluvia y luz: niveles de luz ambiental y de los sensores de sol izquierdo/derecho.'
  de: 'Langsame Daten des Regen-/Lichtsensors: Umgebungslicht und linker/rechter Sonnenlichtsensor.'
  it: 'Dati a bassa frequenza del sensore pioggia/luce: livelli di luce ambientale e dei sensori sole sinistro/destro.'
  pl: 'Wolne dane czujnika deszczu/światła: poziomy światła otoczenia oraz lewego/prawego czujnika nasłonecznienia.'
  ru: 'Медленные данные датчика дождя/света: уровень окружающего освещения и левого/правого датчика солнечной нагрузки.'
  zh: '雨光传感器低速数据:环境光水平及左/右阳光传感器读数。'
  hu: 'Az eső-/fényérzékelő lassú adatai: környezeti fényszint és a bal/jobb napfényérzékelő szintje.'
  pt: 'Dados a baixa cadência do sensor de chuva/luz: níveis de luz ambiente e dos sensores de carga solar esquerdo/direito.'
periodicity: ['1000ms']
senders: ['CDPL']
receivers: ['BSI']

signals:
  UNUSED_1:
    bits: '1.7-1.5'
    unused: true

  LEFT_SUN_SENSOR_FAULT:
    bits: '1.4-1.3'
    comment:
      en: 'Left sunshine sensor failing'
      fr: 'Capteur d''ensoleillement gauche défaillant'
      es: 'Sensor de luz solar izquierdo defectuoso'
      de: 'Linker Sonnenlichtsensor gestört'
      it: 'Sensore di soleggiamento sinistro guasto'
      pl: 'Awaria lewego czujnika nasłonecznienia'
      ru: 'Неисправность левого датчика солнечного света'
      zh: '左侧日照传感器故障'
      hu: 'A bal oldali napfényérzékelő meghibásodott'
      pt: 'Sensor de luz solar esquerdo com falha'
    type: 'enum'
    default: 0x03
    values:
      0x00:
        en: 'Normal'
        fr: 'Normal'
        es: 'Normal'
        de: 'Normal'
        it: 'Normale'
        pl: 'Normalny'
        ru: 'Нормальный'
        zh: '正常'
        hu: 'Normál'
        pt: 'Normal'
      0x01:
