      0x00:
        en: 'Invalid'
        fr: 'Invalide'
        es: 'Inválido'
        de: 'Ungültig'
        it: 'Non valido'
        pl: 'Nieprawidłowe'
        ru: 'Недействительно'
        zh: '无效'
        hu: 'Érvénytelen'
        pt: 'Inválido'
      0x01:
        en: 'Cap absent'
        fr: 'Bouchon absent'
        es: 'Tapón ausente'
        de: 'Verschluss fehlt'
        it: 'Tappo assente'
        pl: 'Brak korka'
        ru: 'Крышка отсутствует'
        zh: '无盖'
        hu: 'Sapka hiányzik'
        pt: 'Tampão ausente'
      0x02:
        en: 'Plug present'
        fr: 'Bouchon présent'
        es: 'Tapón presente'
        de: 'Stopfen vorhanden'
        it: 'Tappo presente'
        pl: 'Obecna zaślepka'
        ru: 'Заглушка присутствует'
        zh: '插塞存在'
        hu: 'Dugó jelen van'
        pt: 'Ficha presente'
      0x03:
        en: 'Invalid'
        fr: 'Invalide'
        es: 'Inválido'
        de: 'Ungültig'
        it: 'Non valido'
        pl: 'Nieprawidłowe'
        ru: 'Недействительно'
        zh: '无效'
        hu: 'Érvénytelen'
        pt: 'Inválido'

  UNUSED_2:
    bits: '5.4-5.0'
