      it: 'Presenza del tappo del serbatoio del carburante'
      pl: 'Obecność korka wlewu paliwa'
      ru: 'Наличие крышки топливного бака'
      zh: '油箱盖存在状态'
      hu: 'Az üzemanyag-betöltő nyílás fedelének jelenléte'
      pt: 'Presença da tampa do depósito de combustível'
    type: 'enum'
