id: 0x1C4
name: 'AIRBAG_VEHICLE_STATE_COMMAND'
type: 'can'
length: 6
comment:
  en: 'Body computer to airbag ECU: airbag warning lamp states, passenger airbag inhibition command, supply/ignition state, front seat belt buckle states and vehicle speed.'
  fr: 'BSI vers le calculateur airbag : états des voyants airbag, commande d''inhibition du sac passager, état d''alimentation/allumage, états de bouclage des ceintures avant et vitesse véhicule.'
  es: 'BSI a la centralita del airbag: estados de los testigos del airbag, orden de inhibición del airbag del pasajero, estado de alimentación/encendido, estados de cierre de los cinturones delanteros y velocidad del vehículo.'
  de: 'BSI an das Airbag-Steuergerät: Airbag-Kontrollleuchtenzustände, Beifahrerairbag-Deaktivierungsbefehl, Versorgungs-/Zündzustand, Zustände der vorderen Gurtschlösser und Fahrzeuggeschwindigkeit.'
  it: 'BSI alla centralina airbag: stati delle spie airbag, comando di inibizione dell''airbag passeggero, stato di alimentazione/accensione, stati di chiusura delle cinture anteriori e velocità del veicolo.'
  pl: 'BSI do sterownika poduszek powietrznych: stany kontrolek poduszek, polecenie wyłączenia poduszki pasażera, stan zasilania/zapłonu, stany zapięcia przednich pasów i prędkość pojazdu.'
  ru: 'BSI в ЭБУ подушек безопасности: состояния ламп подушек безопасности, команда отключения подушки пассажира, состояние питания/зажигания, состояния передних пряжек ремней и скорость автомобиля.'
  zh: 'BSI发送给安全气囊ECU的信息：气囊警告灯状态、乘客气囊禁用命令、供电/点火状态、前排安全带锁扣状态及车速。'
  hu: 'A BSI a légzsák-vezérlőegység felé: légzsák-jelzőlámpák állapota, utaslégzsák-tiltási parancs, tápellátás-/gyújtásállapot, első biztonságiöv-csatok állapota és jármű sebessége.'
  pt: 'Do computador de servidão para a unidade de controlo do airbag: estados da luz avisadora do airbag, comando de inibição do airbag do passageiro, estado de alimentação/ignição, estados do fecho do cinto de segurança dianteiro e velocidade do veículo.'
periodicity: ['100ms']
senders: ['BSI']
receivers: ['RBG']

