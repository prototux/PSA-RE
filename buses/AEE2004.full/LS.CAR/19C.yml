id: 0x19C
name: 'BSR_FAULT_DIAGNOSTICS'
type: 'can'
length: 8
comment:
  en: 'Fault diagnostics from the BSR node (rear body controller): general short/open-circuit fault flags for rear fog lights and indicators, plus climate-active, ignition-contact, load-shedding, hazard-light and generator-operation status; used both for remote diagnosis by the BSI and for degraded-mode operation.'
  fr: 'Diagnostics de défaut du module BSR (calculateur arrière) : indicateurs de défaut général court-circuit/circuit ouvert pour antibrouillard arrière et clignotants, ainsi que l''état climatisation active, contact, délestage, feux de détresse et fonctionnement du générateur ; utilisés pour le diagnostic déporté par la BSI et pour le mode dégradé.'
  es: 'Diagnósticos de fallo del módulo BSR (controlador trasero): indicadores de fallo general de cortocircuito/circuito abierto para antiniebla trasero e intermitentes, además del estado de climatización activa, contacto, reducción de carga, luces de emergencia y funcionamiento del generador; usados para el diagnóstico remoto por la BSI y para el modo degradado.'
  de: 'Fehlerdiagnose des BSR-Moduls (hinteres Steuergerät): allgemeine Kurzschluss-/Unterbrechungs-Fehlerkennzeichen für Nebelschlussleuchte und Blinker, sowie Status von Klimaanlage aktiv, Zündkontakt, Lastabwurf, Warnblinker und Generatorbetrieb; dienen sowohl der Ferndiagnose im BSI als auch dem degradierten Betrieb.'
  it: 'Diagnostica dei guasti del modulo BSR (centralina posteriore): indicatori di guasto generale corto circuito/circuito aperto per fendinebbia posteriore e indicatori di direzione, oltre allo stato di climatizzazione attiva, contatto, riduzione carico, luci di emergenza e funzionamento del generatore; utilizzati per la diagnosi remota dalla BSI e per il funzionamento in modalità degradata.'
  pl: 'Diagnostyka usterek modułu BSR (sterownik tylny): ogólne flagi zwarcia/przerwy obwodu dla tylnego światła przeciwmgielnego i kierunkowskazów, a także stan aktywnej klimatyzacji, stykowy zapłonu, zrzutu obciążenia, świateł awaryjnych i pracy generatora; wykorzystywane do zdalnej diagnostyki przez BSI oraz do trybu awaryjnego.'
  ru: 'Диагностика неисправностей модуля BSR (задний контроллер): флаги общей неисправности короткого замыкания/обрыва для заднего противотуманного фонаря и поворотников, а также статус активного кондиционера, зажигания, сброса нагрузки, аварийной сигнализации и работы генератора; используются для удалённой диагностики в BSI, а также для работы в аварийном режиме.'
  zh: 'BSR模块(后部控制器)的故障诊断:后雾灯和转向灯的通用短路/断路故障标志,以及空调激活、点火触点、减载、危险警示灯和发电机运行状态;用于BSI的远程诊断以及降级模式运行。'
  hu: 'A BSR modul (hátsó vezérlő) hibadiagnosztikája: általános rövidzár/szakadás hibajelzők a hátsó ködlámpához és indexekhez, valamint a klíma aktív, gyújtáskontaktus, terheléscsökkentés, vészvillogó és generátorműködés állapota; a BSI távdiagnosztikájához és a csökkentett üzemmódhoz egyaránt használva.'
  pt: 'Diagnóstico de avarias do nó BSR (computador de servidão traseiro): indicadores gerais de avaria de curto-circuito/circuito aberto do nevoeiro traseiro e dos piscas, além do estado de climatização ativa, contacto de ignição, corte de carga, luzes de emergência e funcionamento do gerador; utilizado tanto para diagnóstico remoto pela BSI como para funcionamento em modo degradado.'
observations:
  en: 'On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['100ms']
senders: ['BSR']
receivers: ['BSI']

