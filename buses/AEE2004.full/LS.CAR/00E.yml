      fr: 'Entier aléatoire initialisant le séquenceur'
      es: 'Entero aleatorio que inicializa el secuenciador'
      de: 'Zufällige Ganzzahl zur Initialisierung des Sequenzers'
      it: 'Intero casuale che inizializza il sequenziatore'
      pl: 'Losowa liczba całkowita inicjująca sekwencer'
      ru: 'Случайное целое число для инициализации секвенсора'
