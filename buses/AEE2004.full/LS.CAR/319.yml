id: 0x319
name: 'LATERAL_ACCEL_YAW_SENSOR_DATA'
type: 'can'
length: 8
comment:
  en: 'Raw LIN equipment data (8 bytes), forwarded onto CAN when the immediate-transmission-request bit is set on the LIN frame.'
  fr: 'Données brutes d''équipement LIN (8 octets), relayées sur le CAN lorsque le bit de demande d''émission immédiate est positionné sur la trame LIN.'
  es: 'Datos en bruto de equipo LIN (8 bytes), retransmitidos al CAN cuando se activa el bit de solicitud de transmisión inmediata en la trama LIN.'
  de: 'Rohdaten des LIN-Geräts (8 Byte), auf CAN weitergeleitet, wenn das Bit für die Anforderung der Sofortübertragung im LIN-Rahmen gesetzt ist.'
  it: 'Dati grezzi del dispositivo LIN (8 byte), inoltrati sul CAN quando il bit di richiesta di trasmissione immediata è impostato sulla trama LIN.'
  pl: 'Surowe dane urządzenia LIN (8 bajtów), przekazywane do CAN po ustawieniu bitu żądania natychmiastowej transmisji w ramce LIN.'
  ru: 'Необработанные данные устройства LIN (8 байт), передаваемые в CAN при установке бита запроса немедленной передачи в кадре LIN.'
  zh: 'LIN设备原始数据(8字节),当LIN帧上的立即发送请求位被置位时转发至CAN。'
  hu: 'Nyers LIN eszközadatok (8 bájt), CAN-ra továbbítva, amikor a LIN keret azonnali küldési kérés bitje be van állítva.'
  pt: 'Dados brutos do equipamento LIN (8 bytes), encaminhados para CAN quando o bit de pedido de transmissão imediata está ativo na trama LIN.'
observations:
  en: 'Sent when the ''immediate transmission request'' bit (LSB of the 1st byte) is set to 1 in the corresponding LIN frame'
  fr: 'Émise quand le bit "Demande d''émission immédiate" (bit de poids le plus faible du 1er octet) est positionné à 1 dans la trame correspondante sur le LIN'
  es: 'Enviada cuando el bit "Solicitud de emisión inmediata" (bit menos significativo del 1er byte) se pone a 1 en la trama correspondiente en el LIN'
  de: 'Gesendet, wenn das Bit "Sofortige Sendeanforderung" (niederwertigstes Bit des 1. Bytes) im entsprechenden LIN-Frame auf 1 gesetzt ist'
  it: 'Inviata quando il bit "Richiesta di trasmissione immediata" (bit meno significativo del 1° byte) è impostato a 1 nel frame corrispondente sul LIN'
  pl: 'Wysyłane, gdy bit "żądanie natychmiastowej transmisji" (najmłodszy bit 1. bajtu) zostanie ustawiony na 1 w odpowiedniej ramce LIN'
  ru: 'Отправляется, когда бит «запрос немедленной передачи» (младший бит 1-го байта) установлен в 1 в соответствующем кадре LIN'
  zh: '当LIN对应帧中"立即发送请求"位(第1字节最低位)被置1时发送'
  hu: 'Küldve, amikor az "azonnali küldési kérés" bit (az 1. bájt legkisebb helyértékű bitje) 1-re van állítva a megfelelő LIN keretben'
  pt: 'Enviada quando o bit ''pedido de transmissão imediata'' (LSB do 1.º byte) é colocado a 1 na trama LIN correspondente'
periodicity: ['500ms', 'trigger']
senders: ['BSM']
receivers: ['BSI']

signals:
  BSM_LIN_GATEWAY_DATA:
    bits: '1.7-8.0'
    comment:
      en: 'LIN gateway function data from the engine-bay junction box (BSM)'
      fr: 'Fonction passerelle LIN du BSM'
      es: 'Datos de la función de pasarela LIN de la caja de servicios del motor (BSM)'
      de: 'LIN-Gateway-Funktionsdaten des Motorraum-Verteilerkastens (BSM)'
      it: 'Dati della funzione gateway LIN della scatola servizi motore (BSM)'
      pl: 'Dane funkcji bramki LIN skrzynki rozdzielczej silnika (BSM)'
      ru: 'Данные функции шлюза LIN блока моторного отсека (BSM)'
      zh: '发动机舱配电盒(BSM)的LIN网关功能数据'
      hu: 'A motortéri elosztódoboz (BSM) LIN átjáró funkciójának adatai'
      pt: 'Dados da função gateway LIN do BSM'
    type: 'uint'
