id: 0x42B
name: 'WAKEUP_CATVM'
type: 'can'
length: 2
comment:
  en: 'Sent by a node waking up the network; indicates the cause of the wake-up'
  fr: 'Émise par un organe qui réveille le réseau ; indique la cause du réveil'
  es: 'Enviada por un nodo que activa la red; indica la causa de la activación'
  de: 'Von einem Steuergerät gesendet, das das Netzwerk weckt; gibt die Weckursache an'
  it: 'Inviata da un nodo che risveglia la rete; indica la causa del risveglio'
  pl: 'Wysyłana przez węzeł budzący sieć; wskazuje przyczynę wybudzenia'
  ru: 'Отправляется узлом, пробуждающим сеть; указывает причину пробуждения'
  zh: '由唤醒网络的节点发送,指示唤醒原因'
  hu: 'A hálózatot ébresztő csomópont küldi; jelzi az ébresztés okát'
  pt: 'Enviada por um nó que desperta a rede; indica a causa do despertar.'
periodicity: ['trigger']
senders: ['BCM']
receivers: ['BSI']

signals:
  PSD_NETWORK_WAKEUP_PADDING:
    bits: '1.7-1.0'
    comment:
      en: '8 zero bits used to wake up the network'
      fr: '8 bits à zéro utilisés pour le réveil du réseau'
      es: '8 bits a cero utilizados para la activación de la red'
      de: '8 Nullbits zum Aufwecken des Netzwerks'
      it: '8 bit a zero utilizzati per il risveglio della rete'
      pl: '8 zerowych bitów wykorzystywanych do wybudzenia sieci'
      ru: '8 нулевых бит, используемых для пробуждения сети'
      zh: '用于唤醒网络的8个零位'
      hu: '8 nullás bit a hálózat ébresztéséhez'
      pt: '8 bits a zero utilizados para a ativação da rede'
    type: 'uint'
    default: 0x00

  WAKEUP_CAUSE_FLAP_CLOSE_REQUEST:
    bits: '2.7'
    comment:
      en: 'Wake-up caused by a closing request while the flap is open and in standby'
      fr: 'Réveil provoqué par une demande de fermeture alors que le volet est ouvert et en veille'
      es: 'Activación provocada por una solicitud de cierre mientras la trampilla está abierta y en reposo'
      de: 'Aufwachen durch eine Schließanforderung, während die Klappe offen und im Ruhezustand ist'
      it: 'Risveglio causato da una richiesta di chiusura mentre la serranda è aperta e in attesa'
      pl: 'Wybudzenie spowodowane żądaniem zamknięcia, gdy klapa jest otwarta i w trybie czuwania'
      ru: 'Пробуждение, вызванное запросом закрытия при открытой и находящейся в режиме ожидания заслонке'
      zh: '当风门处于打开并待机状态时收到关闭请求触发的唤醒'
      hu: 'Zárási kérés által kiváltott ébresztés, amíg a terelőlap nyitva és készenléti állapotban van'
      pt: 'Despertar causado por um pedido de fecho enquanto o obturador está aberto e em espera'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Cause that did not trigger the wake-up'
        fr: 'Cause n''ayant pas provoqué le réveil'
        es: 'Causa que no provocó el despertar'
        de: 'Ursache, die das Wecken nicht ausgelöst hat'
        it: 'Causa che non ha provocato il risveglio'
        pl: 'Przyczyna, która nie wywołała wybudzenia'
        ru: 'Причина, не вызвавшая пробуждение'
        zh: '未触发唤醒的原因'
        hu: 'Az ébresztést nem kiváltó ok'
        pt: 'Causa que não provocou a ativação'
      0x01:
        en: 'Wake-up cause'
        fr: 'Cause du réveil'
        es: 'Causa de la activación'
        de: 'Weckursache'
        it: 'Causa del risveglio'
        pl: 'Przyczyna wybudzenia'
        ru: 'Причина пробуждения'
        zh: '唤醒原因'
        hu: 'Ébresztés oka'
        pt: 'Causa da ativação'

  WAKEUP_CAUSE_FLAP_MANUAL_RESTART:
    bits: '2.6'
    comment:
      en: 'Wake-up caused by manually restarting the flap when it has been stopped in an intermediate position for less than 30 minutes after BSI standby'
      fr: 'Réveil provoqué par la reprise manuelle du volet lorsqu''il est arrêté en position intermédiaire depuis moins de 30 minutes après la mise en veille de la BSI'
      es: 'Activación provocada por el reinicio manual de la trampilla cuando ha estado detenida en posición intermedia durante menos de 30 minutos tras el reposo de la BSI'
      de: 'Aufwachen durch manuellen Neustart der Klappe, wenn sie seit weniger als 30 Minuten nach dem BSI-Ruhezustand in Zwischenposition angehalten ist'
      it: 'Risveglio causato dal riavvio manuale della serranda quando è ferma in posizione intermedia da meno di 30 minuti dopo la messa in stand-by della BSI'
      pl: 'Wybudzenie spowodowane ręcznym wznowieniem klapy, gdy jest zatrzymana w pozycji pośredniej krócej niż 30 minut po przejściu BSI w stan czuwania'
      ru: 'Пробуждение, вызванное ручным возобновлением работы заслонки, если она остановлена в промежуточном положении менее 30 минут после перехода BSI в режим ожидания'
      zh: 'BSI待机后风门停在中间位置不到30分钟时手动重启触发的唤醒'
      hu: 'A terelőlap kézi újraindítása által kiváltott ébresztés, ha a BSI készenléti állapota óta kevesebb mint 30 perce köztes helyzetben áll'
      pt: 'Despertar causado pelo reinício manual do obturador quando este ficou parado numa posição intermédia há menos de 30 minutos após a BSI entrar em repouso'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Cause that did not trigger the wake-up'
        fr: 'Cause n''ayant pas provoqué le réveil'
        es: 'Causa que no provocó el despertar'
        de: 'Ursache, die das Wecken nicht ausgelöst hat'
        it: 'Causa che non ha provocato il risveglio'
        pl: 'Przyczyna, która nie wywołała wybudzenia'
        ru: 'Причина, не вызвавшая пробуждение'
        zh: '未触发唤醒的原因'
        hu: 'Az ébresztést nem kiváltó ok'
        pt: 'Causa que não provocou a ativação'
      0x01:
        en: 'Wake-up cause'
        fr: 'Cause du réveil'
        es: 'Causa de la activación'
        de: 'Weckursache'
        it: 'Causa del risveglio'
        pl: 'Przyczyna wybudzenia'
        ru: 'Причина пробуждения'
        zh: '唤醒原因'
        hu: 'Ébresztés oka'
        pt: 'Causa da ativação'

