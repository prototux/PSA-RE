id: 0x153
name: 'STEERING_LOCK_STATUS'
type: 'can'
length: 6
comment:
  en: 'Electric steering column lock status: anti-scanning, rolling code, motor power/command state, column state, unlock handshake.'
  fr: 'État de l''antivol électrique de colonne de direction : anti-scanning, code tournant, alimentation et commande moteur, état colonne, déverrouillage.'
  es: 'Estado del antirrobo eléctrico de la columna de dirección: antiescaneo, código variable, alimentación y mando del motor, estado de la columna, protocolo de desbloqueo.'
  de: 'Status der elektrischen Lenksäulenverriegelung: Anti-Scanning, Rollcode, Motorversorgung/-ansteuerung, Säulenstatus, Entriegelungs-Handshake.'
  it: 'Stato del bloccasterzo elettrico: anti-scanning, codice variabile, alimentazione e comando motore, stato del piantone, handshake di sblocco.'
  pl: 'Stan elektrycznej blokady kolumny kierowniczej: ochrona przed skanowaniem, kod zmienny, zasilanie i sterowanie silnikiem, stan kolumny, uzgadnianie odblokowania.'
  ru: 'Статус электрического замка рулевой колонки: защита от сканирования, плавающий код, питание и управление двигателем, состояние колонки, квитирование разблокировки.'
  zh: '电动转向柱锁状态:防扫描、滚动码、电机供电/指令状态、转向柱状态、解锁握手。'
  hu: 'Az elektromos kormányoszlop-zár állapota: letapogatás elleni védelem, kódvándorlás, motor tápellátás/vezérlés állapota, oszlop állapota, kioldási kézfogás.'
  pt: 'Estado do bloqueio elétrico da coluna de direção: anti-varrimento, código rolante, estado de alimentação/comando do motor, estado da coluna, acordo de destrancagem.'
periodicity: ['200ms', 'trigger']
senders: ['AVE']
receivers: ['BSI']

