      it: 'Stato dell''alimentazione di potenza del motore'
      pl: 'Stan zasilania mocy silnika'
      ru: 'Состояние силового питания двигателя'
      zh: '电机动力供电状态'
      hu: 'A motor teljesítményellátásának állapota'
      pt: 'Estado da alimentação de potência do motor'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Absent'
        fr: 'Absente'
        es: 'Ausente'
        de: 'Nicht vorhanden'
        it: 'Assente'
        pl: 'Brak'
