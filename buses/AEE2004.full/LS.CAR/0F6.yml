id: 0x0F6
name: 'BSI_SLOW_DATA'
type: 'can'
length: 8
comment:
  en: 'Vehicle state broadcast by the body controller: lighting/dimming, power supply state and key position, coolant temperature, odometer, outside temperature.'
  fr: 'État du véhicule diffusé par la BSI : éclairage/atténuation, état d''alimentation et position de la clé, température liquide de refroidissement, kilométrage, température extérieure.'
  es: 'Estado del vehículo difundido por la BSI: iluminación/atenuación, estado de alimentación y posición de la llave, temperatura del refrigerante, kilometraje, temperatura exterior.'
  de: 'Vom BSI gesendeter Fahrzeugstatus: Beleuchtung/Dimmung, Versorgungsstatus und Schlüsselposition, Kühlmitteltemperatur, Kilometerstand, Außentemperatur.'
  it: 'Stato del veicolo trasmesso dalla BSI: illuminazione/attenuazione, stato di alimentazione e posizione chiave, temperatura del liquido di raffreddamento, chilometraggio, temperatura esterna.'
  pl: 'Stan pojazdu nadawany przez BSI: oświetlenie/przyciemnianie, stan zasilania i pozycja kluczyka, temperatura płynu chłodzącego, przebieg, temperatura zewnętrzna.'
  ru: 'Статус автомобиля, транслируемый BSI: освещение/затемнение, состояние питания и положение ключа, температура охлаждающей жидкости, пробег, температура наружного воздуха.'
  zh: '由BSI广播的车辆状态:照明/调光、供电状态和钥匙位置、冷却液温度、里程、车外温度。'
  hu: 'A BSI által sugárzott jármű állapot: világítás/fényerő-szabályozás, tápellátás állapota és kulcshelyzet, hűtőfolyadék hőmérséklet, km-óraállás, külső hőmérséklet.'
  pt: 'Estado do veículo difundido pelo computador de servidão: iluminação/regulação, estado de alimentação e posição da chave, temperatura do líquido de arrefecimento, conta-quilómetros, temperatura exterior.'
observations:
  en: 'On state change of: GEN_STATUS, POWERTRAIN_STATUS, REVERSE_STATUS, BLINKERS_STATUS, CONFIG_MODE, CLUSTER_INDICATORS_TEST. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : GEN_STATUS, POWERTRAIN_STATUS, REVERSE_STATUS, BLINKERS_STATUS, CONFIG_MODE, CLUSTER_INDICATORS_TEST. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: GEN_STATUS, POWERTRAIN_STATUS, REVERSE_STATUS, BLINKERS_STATUS, CONFIG_MODE, CLUSTER_INDICATORS_TEST. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: GEN_STATUS, POWERTRAIN_STATUS, REVERSE_STATUS, BLINKERS_STATUS, CONFIG_MODE, CLUSTER_INDICATORS_TEST. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: GEN_STATUS, POWERTRAIN_STATUS, REVERSE_STATUS, BLINKERS_STATUS, CONFIG_MODE, CLUSTER_INDICATORS_TEST. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: GEN_STATUS, POWERTRAIN_STATUS, REVERSE_STATUS, BLINKERS_STATUS, CONFIG_MODE, CLUSTER_INDICATORS_TEST. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: GEN_STATUS, POWERTRAIN_STATUS, REVERSE_STATUS, BLINKERS_STATUS, CONFIG_MODE, CLUSTER_INDICATORS_TEST. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当ETAT_PRINCIPAL_SEV, GEN_STATUS, POWERTRAIN_STATUS, REVERSE_STATUS, BLINKERS_STATUS, CONFIG_MODE, TEST_VOY_CMB状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z), GEN_STATUS, POWERTRAIN_STATUS, REVERSE_STATUS, BLINKERS_STATUS, CONFIG_MODE, CLUSTER_INDICATORS_TEST állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: GEN_STATUS, POWERTRAIN_STATUS, REVERSE_STATUS, BLINKERS_STATUS, CONFIG_MODE, CLUSTER_INDICATORS_TEST. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['RBG', 'CDPL', 'BSM', 'ADDGO', 'BSC', 'BSR', 'BDCP', 'BCM', 'MDPLC']

