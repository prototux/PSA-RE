id: 0x000
name: 'SLIDING_DOOR_FAULT_EVENT'
type: 'can'
length: 8
comment:
  en: 'Sliding side door module: fault event, logged in the BSI fault log.'
  fr: 'Module de porte latérale coulissante : événement défaut, enregistré dans le journal des défauts du BSI.'
  es: 'Módulo de la puerta corredera lateral: evento de fallo, registrado en el registro de fallos de la BSI.'
  de: 'Steuermodul Schiebetür – Fehlerereignis, im Fehlerspeicher (Fehlerprotokoll) des BSI vermerkt.'
  it: 'Modulo porta scorrevole laterale: evento di guasto, registrato nel registro guasti della BSI.'
  pl: 'Moduł drzwi przesuwnych – zdarzenie usterki, zapisywane w dzienniku usterek BSI.'
  ru: 'Модуль сдвижной боковой двери — событие неисправности, регистрируется в журнале неисправностей BSI.'
  zh: '侧滑门模块——故障事件,记录在BSI故障日志中。'
  hu: 'Tolóajtó modul – hibaesemény, amelyet a BSI hibanaplójába rögzítenek.'
  pt: 'Módulo da porta lateral corrediça: evento de avaria, registado no registo de avarias da BSI.'
periodicity: ['trigger']
senders: ['MDPLC']
receivers: ['BSI']

