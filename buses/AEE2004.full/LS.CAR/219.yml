id: 0x219
name: 'BSM_VERSION_3'
type: 'can'
length: 8
comment:
  en: 'Calibration and diagnostic-frame revision indexes, number of fault parameters and application type of the BSM ECU.'
  fr: 'Indices d''évolution calibration et trame diagnostic, nombre de paramètres défaut et type d''application du calculateur BSM.'
  es: 'Índices de revisión de calibración y trama de diagnóstico, número de parámetros de fallo y tipo de aplicación de la centralita BSM.'
  de: 'Revisionsindizes für Kalibrierung und Diagnoserahmen, Anzahl der Fehlerparameter und Anwendungstyp des Steuergeräts BSM.'
  it: 'Indici di revisione calibrazione e trama diagnostica, numero di parametri guasto e tipo di applicazione della centralina BSM.'
  pl: 'Indeksy wersji kalibracji i ramki diagnostycznej, liczba parametrów usterek i typ aplikacji sterownika BSM.'
  ru: 'Индексы версий калибровки и диагностического кадра, число параметров неисправностей и тип приложения блока управления BSM.'
  zh: 'BSM控制单元的标定和诊断帧版本索引、故障参数数量及应用类型。'
  hu: 'A BSM vezérlőegység kalibrációs és diagnosztikai keret revíziós indexei, hibaparaméterek száma és alkalmazástípusa.'
  pt: 'Índices de revisão de calibração e de trama de diagnóstico, número de parâmetros de avaria e tipo de aplicação da unidade de controlo BSM.'
periodicity: ['trigger']
senders: ['BSM']
receivers: ['BSI']

signals:
  CALIBRATION_REVISION_INDEX:
    bits: '1.7-2.0'
    comment:
      en: 'Calibration revision index'
      fr: 'Indice d''évolution de la calibration'
      es: 'Índice de revisión de la calibración'
      de: 'Kalibrierungs-Revisionsindex'
      it: 'Indice di revisione della calibrazione'
      pl: 'Wskaźnik wersji kalibracji'
      ru: 'Индекс версии калибровки'
      zh: '标定版本索引'
      hu: 'Kalibrációs revíziós index'
      pt: 'Índice de revisão da calibração'
    type: 'uint'

  DIAG_FRAME_REVISION_INDEX:
    bits: '3.7-3.0'
    comment:
      en: 'Diagnostic frame revision index'
      fr: 'Indice d''évolution de la trame de diagnostic'
      es: 'Índice de revisión de la trama de diagnóstico'
      de: 'Revisionsindex des Diagnose-Frames'
      it: 'Indice di revisione della trama diagnostica'
      pl: 'Wskaźnik wersji ramki diagnostycznej'
      ru: 'Индекс версии диагностического кадра'
      zh: '诊断帧版本索引'
      hu: 'Diagnosztikai keret revíziós indexe'
      pt: 'Índice de revisão da trama de diagnóstico'
    type: 'uint'

  FAULT_PARAM_COUNT:
    bits: '4.7-4.0'
    comment:
      en: 'Number of parameters associated with faults'
      fr: 'Nombre de paramètres associés aux défauts'
      es: 'Número de parámetros asociados a los fallos'
      de: 'Anzahl der mit Fehlern verknüpften Parameter'
      it: 'Numero di parametri associati ai guasti'
      pl: 'Liczba parametrów powiązanych z usterkami'
      ru: 'Количество параметров, связанных с неисправностями'
      zh: '与故障关联的参数数量'
      hu: 'A hibákhoz társított paraméterek száma'
      pt: 'Número de parâmetros associados às falhas'
    type: 'uint'

  APPLICATION_TYPE:
    bits: '5.7-8.0'
    comment:
      en: 'Application type'
      fr: 'Type d''application'
      es: 'Tipo de aplicación'
      de: 'Anwendungstyp'
      it: 'Tipo di applicazione'
      pl: 'Typ aplikacji'
      ru: 'Тип приложения'
      zh: '应用类型'
      hu: 'Alkalmazástípus'
      pt: 'Tipo de aplicação'
    type: 'uint'
