      pl: 'Polecenie przywołania zapisanej pozycji fotela kierowcy'
      ru: 'Команда вызова из памяти положения сиденья водителя'
      zh: '驾驶员座椅位置记忆召回命令'
      hu: 'A vezetőülés helyzetének memóriából történő előhívási parancsa'
      pt: 'Comando de recuperação de memória da posição do banco do condutor'
    type: 'bool'
