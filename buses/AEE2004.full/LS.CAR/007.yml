id: 0x007
name: 'ENGINE_BAY_BOX_COMMAND'
type: 'can'
length: 8
comment:
  en: 'Relay output commands for the engine-bay fuse/relay box (ports A and B of its VAN I/O expander), plus port direction/option configuration bytes.'
  fr: 'Commandes des sorties relayées du boîtier fusibles/relais moteur (ports A et B de son extenseur VAN I/O), et octets de configuration de direction/option des ports.'
  es: 'Órdenes de las salidas de relé de la caja de fusibles/relés del motor (puertos A y B de su expansor VAN I/O) y bytes de configuración de dirección/opción de los puertos.'
  de: 'Relaisausgangsbefehle des Motorraum-Sicherungs-/Relaiskastens (Ports A und B seines VAN-E/A-Erweiterungsmoduls) sowie Port-Richtungs-/Options-Konfigurationsbytes.'
  it: 'Comandi delle uscite relè della centralina fusibili/relè vano motore (porte A e B del suo espansore VAN I/O), e byte di configurazione di direzione/opzione delle porte.'
  pl: 'Polecenia wyjść przekaźnikowych skrzynki bezpieczników/przekaźników silnika (porty A i B jej ekspandera VAN we/wy) oraz bajty konfiguracji kierunku/opcji portów.'
  ru: 'Команды релейных выходов блока предохранителей/реле моторного отсека (порты A и B его расширителя VAN ввода-вывода), а также байты конфигурации направления/опций портов.'
  zh: '发动机舱保险丝/继电器盒的继电器输出命令（其VAN I/O扩展器的A、B端口），以及端口方向/选项配置字节。'
  hu: 'A motortéri biztosíték-/reledoboz relékimeneti parancsai (a VAN I/O bővítőjének A és B portja), valamint a portok irány-/opciókonfigurációs bájtjai.'
  pt: 'Comandos de saída de relé para a caixa de fusíveis/relés do compartimento do motor (portas A e B do seu expansor de E/S VAN), além dos bytes de configuração de direção/opção das portas.'
observations:
  en: 'On state change of: HORN_STATUS, ENGINE_BAY_ACC_POWER_COMMAND, FUEL_PUMP_CUTOFF_COMMAND, ENGINE_RUNNING_OUTPUT, FRONT_WINDSCREEN_DEFROST_COMMAND'
  fr: 'Sur changement d''état de : HORN_STATUS, ENGINE_BAY_ACC_POWER_COMMAND, FUEL_PUMP_CUTOFF_COMMAND, ENGINE_RUNNING_OUTPUT, FRONT_WINDSCREEN_DEFROST_COMMAND'
  es: 'Al cambiar el estado de: HORN_STATUS, ENGINE_BAY_ACC_POWER_COMMAND, FUEL_PUMP_CUTOFF_COMMAND, ENGINE_RUNNING_OUTPUT, FRONT_WINDSCREEN_DEFROST_COMMAND'
  de: 'Bei Statusänderung von: HORN_STATUS, ENGINE_BAY_ACC_POWER_COMMAND, FUEL_PUMP_CUTOFF_COMMAND, ENGINE_RUNNING_OUTPUT, FRONT_WINDSCREEN_DEFROST_COMMAND'
  it: 'Al cambiamento di stato di: HORN_STATUS, ENGINE_BAY_ACC_POWER_COMMAND, FUEL_PUMP_CUTOFF_COMMAND, ENGINE_RUNNING_OUTPUT, FRONT_WINDSCREEN_DEFROST_COMMAND'
  pl: 'Wysyłane przy zmianie stanu: HORN_STATUS, ENGINE_BAY_ACC_POWER_COMMAND, FUEL_PUMP_CUTOFF_COMMAND, ENGINE_RUNNING_OUTPUT, FRONT_WINDSCREEN_DEFROST_COMMAND'
  ru: 'При изменении состояния: HORN_STATUS, ENGINE_BAY_ACC_POWER_COMMAND, FUEL_PUMP_CUTOFF_COMMAND, ENGINE_RUNNING_OUTPUT, FRONT_WINDSCREEN_DEFROST_COMMAND'
  zh: '当S_AVERTISSEUR, ENGINE_BAY_ACC_POWER_COMMAND, FUEL_PUMP_CUTOFF_COMMAND, ENGINE_RUNNING_OUTPUT, DEGI_PB_AV状态变化时'
  hu: 'A(z) HORN_STATUS, ENGINE_BAY_ACC_POWER_COMMAND, FUEL_PUMP_CUTOFF_COMMAND, ENGINE_RUNNING_OUTPUT, FRONT_WINDSCREEN_DEFROST_COMMAND állapotváltozásakor'
  pt: 'Na mudança de estado de: HORN_STATUS, ENGINE_BAY_ACC_POWER_COMMAND, FUEL_PUMP_CUTOFF_COMMAND, ENGINE_RUNNING_OUTPUT, FRONT_WINDSCREEN_DEFROST_COMMAND'
periodicity: ['100ms', 'trigger']
senders: ['BSI']
receivers: ['BSM', 'BSR']

