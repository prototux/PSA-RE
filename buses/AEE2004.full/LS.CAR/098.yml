id: 0x098
name: 'BCD_STATUS_2'
type: 'can'
length: 8
comment:
  en: 'Status of the particulate filter additive injection ECU: operational flag and fault flags, cumulated injected additive, fuel cap sensor, additive level and particulate filter downstream temperature.'
  fr: 'État du système d''injection d''additif : indicateur de fonctionnement et défauts, quantité d''additif injecté cumulée, capteur de bouchon de réservoir, niveau d''additif et température en aval du filtre à particules.'
  es: 'Estado de la centralita de inyección de aditivo del filtro de partículas: indicador de funcionamiento y de fallo, cantidad acumulada de aditivo inyectado, sensor del tapón de depósito, nivel de aditivo y temperatura aguas abajo del filtro de partículas.'
  de: 'Status des Steuergeräts für die Additiv-Einspritzung des Partikelfilters: Betriebs- und Fehlerkennung, kumulierte eingespritzte Additivmenge, Tankdeckelsensor, Additivstand und Temperatur stromabwärts des Partikelfilters.'
  it: 'Stato della centralina di iniezione additivo del filtro antiparticolato: indicatore di funzionamento e guasto, quantità cumulata di additivo iniettato, sensore tappo serbatoio, livello additivo e temperatura a valle del filtro antiparticolato.'
  pl: 'Stan sterownika wtrysku dodatku do filtra cząstek stałych: flaga pracy i usterek, skumulowana ilość wtryśniętego dodatku, czujnik korka wlewu, poziom dodatku i temperatura za filtrem cząstek stałych.'
  ru: 'Статус блока управления впрыском присадки сажевого фильтра: флаги работы и неисправности, накопленное количество впрыснутой присадки, датчик крышки бака, уровень присадки и температура за сажевым фильтром.'
  zh: '颗粒物过滤器添加剂喷射控制单元状态:运行和故障标志、累计喷射添加剂量、油箱盖传感器、添加剂液位及颗粒物过滤器下游温度。'
  hu: 'A részecskeszűrő adalékbefecskendező vezérlőegységének állapota: üzemi és hibajelző, összesített befecskendezett adalékmennyiség, tanksapka-érzékelő, adalékszint és a részecskeszűrő utáni hőmérséklet.'
  pt: 'Estado da unidade de controlo de injeção de aditivo do filtro de partículas: indicador operacional e indicadores de avaria, aditivo injetado acumulado, sensor da tampa do depósito, nível de aditivo e temperatura a jusante do filtro de partículas.'
periodicity: ['200ms']
senders: ['ADDGO']
receivers: ['BSI']

