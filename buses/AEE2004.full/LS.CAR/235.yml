id: 0x235
name: 'ADDITIVE_SYSTEM_VEHICLE_INFO_2'
type: 'can'
length: 4
comment:
  en: 'Vehicle information sent to the diesel additive injection ECU: fuel level, vehicle speed, filler cap and ignition key position.'
  fr: 'Informations véhicule envoyées au calculateur d''injection de l''additif gasoil : niveau de carburant, vitesse véhicule, trappe à carburant et position de la clé de contact.'
  es: 'Información del vehículo enviada a la ECU de inyección del aditivo diésel: nivel de combustible, velocidad del vehículo, tapa del depósito y posición de la llave de contacto.'
  de: 'An das Diesel-Additiv-Einspritzsteuergerät gesendete Fahrzeuginformationen: Kraftstoffstand, Fahrzeuggeschwindigkeit, Tankklappe und Zündschlüsselstellung.'
  it: 'Informazioni del veicolo inviate alla centralina di iniezione dell''additivo diesel: livello carburante, velocità veicolo, sportello del serbatoio e posizione della chiave di accensione.'
  pl: 'Informacje o pojeździe wysyłane do sterownika wtrysku dodatku do oleju napędowego: poziom paliwa, prędkość pojazdu, klapka wlewu paliwa i pozycja kluczyka zapłonu.'
  ru: 'Информация об автомобиле, отправляемая блоку управления впрыском дизельной присадки: уровень топлива, скорость автомобиля, лючок бака и положение ключа зажигания.'
  zh: '发送给柴油添加剂喷射控制单元的车辆信息:油位、车速、加油口盖及点火钥匙位置。'
  hu: 'A dízeladalék-befecskendező vezérlőnek küldött járműinformációk: üzemanyagszint, járműsebesség, tanksapka és gyújtáskulcs helyzete.'
  pt: 'Informação do veículo enviada à ECU de injeção do aditivo de gasóleo: nível de combustível, velocidade do veículo, tampa do depósito e posição da chave de ignição.'
periodicity: ['1000ms']
senders: ['BSI']
receivers: ['ADDGO']

signals:
  FUEL_LEVEL_RAW_2:
    bits: '1.7-1.0'
    comment:
      en: 'Raw fuel level'
      fr: 'Niveau de carburant brut'
      es: 'Nivel de combustible bruto'
      de: 'Roher Kraftstoffstand'
      it: 'Livello carburante grezzo'
      pl: 'Surowy poziom paliwa'
      ru: 'Необработанный уровень топлива'
      zh: '原始燃油液位'
      hu: 'Nyers üzemanyagszint'
      pt: 'Nível de combustível bruto'
    type: 'uint'
    factor: 0.5
    min: 0
    max: 126
    units: 'L'
    invalid: 0xFF
    default: 0xFF

  FUEL_LEVEL_FILTERED_DISPLAYED:
    bits: '2.7-2.0'
    comment:
      en: 'Displayed filtered fuel level'
      fr: 'Niveau de carburant filtré affiché'
      es: 'Nivel de combustible filtrado mostrado'
      de: 'Angezeigter gefilterter Kraftstoffstand'
      it: 'Livello carburante filtrato visualizzato'
      pl: 'Wyświetlany filtrowany poziom paliwa'
      ru: 'Отображаемый отфильтрованный уровень топлива'
      zh: '显示的滤波燃油液位'
      hu: 'Kijelzett szűrt üzemanyagszint'
      pt: 'Nível de combustível filtrado mostrado'
    type: 'uint'
    factor: 0.5
    min: 0
    max: 126
    units: 'L'
    invalid: 0xFF
    default: 0xFF

  UNUSED_1:
    bits: '3.7-4.0'
    unused: true
