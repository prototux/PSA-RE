id: 0x058
name: 'AIRBAG_STATUS'
type: 'can'
length: 3
comment:
  en: 'Airbag computer status: bonnet switch active, general airbag state, centre and passenger airbag inhibition.'
  fr: 'État du calculateur airbag : contacteur capot actif, état général airbag, inhibition airbag central et passager.'
  es: 'Estado de la centralita de airbag: interruptor de capó activo, estado general del airbag, inhibición de airbag central y del pasajero.'
  de: 'Status des Airbag-Steuergeräts: Motorhaubenschalter aktiv, allgemeiner Airbag-Zustand, Deaktivierung Mittel- und Beifahrer-Airbag.'
  it: 'Stato della centralina airbag: interruttore cofano attivo, stato generale airbag, inibizione airbag centrale e passeggero.'
  pl: 'Stan sterownika poduszek powietrznych: aktywny wyłącznik maski, ogólny stan poduszek powietrznych, wyłączenie poduszki centralnej i pasażera.'
  ru: 'Статус блока управления подушками безопасности: активен выключатель капота, общее состояние подушек, отключение центральной и пассажирской подушки.'
  zh: '安全气囊控制单元状态:引擎盖开关激活、安全气囊总体状态、中央和乘客安全气囊禁用。'
  hu: 'A légzsák-vezérlőegység állapota: motorháztető-kapcsoló aktív, általános légzsákállapot, közép- és utaslégzsák letiltása.'
  pt: 'Estado do computador do airbag: comutador do capot ativo, estado geral do airbag, inibição do airbag central e do passageiro.'
observations:
  en: 'On state change of: ACTIVE_HOOD_STATUS, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, PASSENGER_PRESENCE_BELT_STATUS. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : ACTIVE_HOOD_STATUS, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, PASSENGER_PRESENCE_BELT_STATUS. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: ACTIVE_HOOD_STATUS, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, PASSENGER_PRESENCE_BELT_STATUS. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: ACTIVE_HOOD_STATUS, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, PASSENGER_PRESENCE_BELT_STATUS. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: ACTIVE_HOOD_STATUS, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, PASSENGER_PRESENCE_BELT_STATUS. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: ACTIVE_HOOD_STATUS, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, PASSENGER_PRESENCE_BELT_STATUS. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: ACTIVE_HOOD_STATUS, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, PASSENGER_PRESENCE_BELT_STATUS. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当ET_CAPOT_ACTIF, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, ET_PRES_BOUCL_PASS状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z) ACTIVE_HOOD_STATUS, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, PASSENGER_PRESENCE_BELT_STATUS állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: ACTIVE_HOOD_STATUS, RBG_GENERAL_STATUS, PASSENGER_AIRBAG_INHIBIT_CONTACT, MIDDLE_AIRBAG_INHIBIT_CONTACT, DRIVER_SEATBELT_BUCKLED_STATE, PASSENGER_PRESENCE_BELT_STATUS. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['500ms', 'trigger']
senders: ['RBG']
receivers: ['BSI']

