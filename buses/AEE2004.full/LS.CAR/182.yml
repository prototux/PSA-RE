      fr: 'Récepteur de télécommande HF'
      es: 'Receptor del mando a distancia HF'
      de: 'HF-Fernbedienungsempfänger'
      it: 'Ricevitore del telecomando HF'
      pl: 'Odbiornik pilota RF'
      ru: 'Приёмник пульта ДУ РЧ'
      zh: '射频遥控接收器'
      hu: 'RF távirányító-vevő'
      pt: 'Recetor do comando à distância HF'
    type: 'bool'
