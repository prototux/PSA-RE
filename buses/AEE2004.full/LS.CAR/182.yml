id: 0x182
name: 'HF_RECEIVER_STATUS'
type: 'can'
length: 3
comment:
  en: 'Keyless entry HF receiver status: last received key identifier and reception quality.'
  fr: 'État du récepteur HF d''accès mains libres : identifiant de la dernière clé reçue et qualité de réception.'
  es: 'Estado del receptor HF de acceso manos libres: identificador de la última llave recibida y calidad de recepción.'
  de: 'Status des HF-Empfängers für den Keyless-Zugang: Kennung des zuletzt empfangenen Schlüssels und Empfangsqualität.'
  it: 'Stato del ricevitore HF di accesso keyless: identificativo dell''ultima chiave ricevuta e qualità di ricezione.'
  pl: 'Stan odbiornika HF dostępu bezkluczykowego: identyfikator ostatnio odebranego kluczyka i jakość odbioru.'
  ru: 'Статус HF-приёмника бесключевого доступа: идентификатор последнего принятого ключа и качество приёма.'
  zh: '无钥匙进入HF接收器状态:最近接收到的钥匙标识及接收质量。'
  hu: 'A kulcs nélküli beléptető HF-vevő állapota: a legutóbb fogadott kulcs azonosítója és a vétel minősége.'
  pt: 'Estado do recetor HF de acesso mãos-livres: identificador da última chave recebida e qualidade de receção.'
observations:
  en: 'On state change of: HF_REMOTE_RECEIVER. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : HF_REMOTE_RECEIVER. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: HF_REMOTE_RECEIVER. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: HF_REMOTE_RECEIVER. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: HF_REMOTE_RECEIVER. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: HF_REMOTE_RECEIVER. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: HF_REMOTE_RECEIVER. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当REC_TC_HF_ET_RHF状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z) HF_REMOTE_RECEIVER állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: HF_REMOTE_RECEIVER. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['HDC', 'BRHF']

signals:
