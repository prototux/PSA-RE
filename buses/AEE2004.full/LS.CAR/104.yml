id: 0x104
name: 'DRIVER_OCCUPANT_CLASSIFICATION'
type: 'can'
length: 6
comment:
  en: 'Driver seat occupant classification: system fault, seat slide position, estimated mass and position with uncertainty, calibration memory and processing state.'
  fr: 'Classification d''occupant du siège conducteur : défaut système, position du glissement du siège, masse et position estimées avec incertitude, mémoire d''étalonnage et état de traitement.'
  es: 'Clasificación de ocupante del asiento del conductor: fallo del sistema, posición de deslizamiento del asiento, masa y posición estimadas con incertidumbre, memoria de calibración y estado de procesamiento.'
  de: 'Insassenklassifizierung Fahrersitz: Systemfehler, Sitzschienenposition, geschätzte Masse und Position mit Unsicherheit, Kalibrierspeicher und Verarbeitungsstatus.'
  it: 'Classificazione occupante sedile conducente: guasto di sistema, posizione di scorrimento del sedile, massa e posizione stimate con incertezza, memoria di calibrazione e stato di elaborazione.'
  pl: 'Klasyfikacja pasażera fotela kierowcy: usterka systemu, pozycja przesuwu fotela, szacowana masa i pozycja z niepewnością, pamięć kalibracji i stan przetwarzania.'
  ru: 'Классификация пассажира на сиденье водителя: неисправность системы, положение продольного хода сиденья, расчётная масса и положение с погрешностью, память калибровки и состояние обработки.'
  zh: '驾驶员座椅乘员分类:系统故障、座椅滑轨位置、估计质量和位置(含不确定度)、校准记忆及处理状态。'
  hu: 'A vezetőülés utasosztályozása: rendszerhiba, ülés csúszkapozíciója, becsült tömeg és pozíció bizonytalansággal, kalibrációs memória és feldolgozási állapot.'
  pt: 'Classificação do ocupante do banco do condutor: avaria do sistema, posição de deslizamento do banco, massa e posição estimadas com incerteza, memória de calibração e estado de processamento.'
periodicity: ['trigger']
senders: []  # TODO: find the sender(s)

signals:
  DRIVER_SEAT_CHECKSUM:
    bits: '4.7-4.0'
    comment:
      en: 'Checksum intended to strengthen data integrity independently of the BSI gateway.'
      fr: 'Somme de contrôle destinée à renforcer la probabilité d''intégrité des données, indépendamment de la passerelle BSI.'
      es: 'Suma de comprobación destinada a reforzar la probabilidad de integridad de los datos, independientemente de la pasarela BSI'
      de: 'Prüfsumme zur Erhöhung der Wahrscheinlichkeit der Datenintegrität, unabhängig vom BSI-Gateway'
      it: 'Checksum destinato a rafforzare la probabilità di integrità dei dati, indipendentemente dal gateway BSI'
      pl: 'Suma kontrolna mająca zwiększyć prawdopodobieństwo integralności danych, niezależnie od bramki BSI'
      ru: 'Контрольная сумма для повышения вероятности целостности данных независимо от шлюза BSI'
      zh: '用于提高数据完整性概率的校验和，独立于 BSI 网关'
      hu: 'Ellenőrzőösszeg, amely a BSI átjárótól függetlenül növeli az adatintegritás valószínűségét'
      pt: 'Soma de verificação destinada a reforçar a probabilidade de integridade dos dados, independentemente da gateway do BSI'
    type: 'uint'

  UNUSED_1:
