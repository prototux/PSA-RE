id: 0x10A
name: 'SHIFT_BY_WIRE_VERSION'
type: 'can'
length: 2
comment:
  en: 'Command frame from the BSI: AAF, automatic and manual mode requests, climate control and washer commands, and AF position status.'
  fr: 'Trame de commande de la BSI : demandes AAF, mode automatique et manuel, climatisation, lave-glace, et état de la position AF.'
  es: 'Trama de comando de la BSI: solicitudes AAF, modo automático y manual, climatización, lavaparabrisas y estado de posición AF.'
  de: 'Befehlstelegramm des BSI: AAF-, Automatik- und Handbetriebsanforderungen, Klimaanlagen- und Waschanlagenbefehle sowie AF-Positionsstatus.'
  it: 'Trama di comando della BSI: richieste AAF, modalità automatica e manuale, climatizzazione, lavavetro e stato posizione AF.'
  pl: 'Ramka poleceń BSI: żądania AAF, tryb automatyczny i ręczny, sterowanie klimatyzacją i spryskiwaczem oraz stan pozycji AF.'
  ru: 'Кадр команд от BSI: запросы AAF, автоматический и ручной режим, управление климатом и омывателем, состояние позиции AF.'
  zh: 'BSI发出的命令帧:AAF、自动/手动模式请求、空调和洗涤器命令,以及AF位置状态。'
  hu: 'BSI parancskeret: AAF-, automata és manuális mód kérések, klíma- és mosóvezérlés, valamint AF pozíció állapota.'
  pt: 'Trama de comando da BSI: AAF, pedidos de modo automático e manual, comandos de climatização e de lava-para-brisas, e estado de posição do AF.'
observations:
  en: 'On state change of: AUTO_LAMPS_FUNCTION, AUTO_WIPE_MODE, WIPER_PARKED'
  fr: 'Sur changement d''état de : AUTO_LAMPS_FUNCTION, AUTO_WIPE_MODE, WIPER_PARKED'
  es: 'Al cambiar el estado de: AUTO_LAMPS_FUNCTION, AUTO_WIPE_MODE, WIPER_PARKED'
  de: 'Bei Statusänderung von: AUTO_LAMPS_FUNCTION, AUTO_WIPE_MODE, WIPER_PARKED'
  it: 'Al cambiamento di stato di: AUTO_LAMPS_FUNCTION, AUTO_WIPE_MODE, WIPER_PARKED'
  pl: 'Wysyłane przy zmianie stanu: AUTO_LAMPS_FUNCTION, AUTO_WIPE_MODE, WIPER_PARKED'
  ru: 'При изменении состояния: AUTO_LAMPS_FUNCTION, AUTO_WIPE_MODE, WIPER_PARKED'
  zh: '当CDE_AAF, AUTO_WIPE_MODE, POS_AF状态变化时'
  hu: 'A(z) AUTO_LAMPS_FUNCTION, AUTO_WIPE_MODE, WIPER_PARKED állapotváltozásakor'
  pt: 'Na mudança de estado de: AUTO_LAMPS_FUNCTION, AUTO_WIPE_MODE, WIPER_PARKED'
periodicity: ['100ms', 'trigger']
senders: ['BSI']
receivers: ['CDPL']

signals:
  UNUSED_1:
    bits: '1.7-1.4'
    unused: true

  MANUAL_WIPE_REQUEST:
    bits: '1.3'
    comment:
      en: 'Manual wiping request'
      fr: 'Demande d''essuyage manuel'
      es: 'Solicitud de limpiado manual'
      de: 'Manuelle Wischanforderung'
      it: 'Richiesta di tergitura manuale'
      pl: 'Żądanie ręcznego wycierania'
      ru: 'Запрос ручного протирания'
      zh: '手动刮水请求'
      hu: 'Kézi törlési kérés'
      pt: 'Pedido de limpeza manual'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
