id: 0x119
name: 'ACCELERATION_SENSOR_VERSION'
type: 'can'
length: 8
comment:
  en: 'Complementary BSM diagnostics, event-driven on any parameter change: horn, ignition-on/starter commands, key detected, headlights, neutral position, air pump, fuel pump and power-latch relay.'
  fr: 'Diagnostics complémentaires du BSM, envoyés sur événement à tout changement de paramètre : avertisseur, commandes contact/démarreur, clé détectée, phares, position point mort, pompe à air, pompe carburant et relais de maintien d''alimentation.'
  es: 'Diagnósticos complementarios del BSM, enviados por evento ante cualquier cambio de parámetro: claxon, comandos de contacto/arranque, llave detectada, faros, posición punto muerto, bomba de aire, bomba de combustible y relé de retención de alimentación.'
  de: 'Ergänzende BSM-Diagnose, ereignisgesteuert bei jeder Parameteränderung: Hupe, Zündungs-Ein-/Anlasserbefehle, Schlüssel erkannt, Scheinwerfer, Leerlaufstellung, Luftpumpe, Kraftstoffpumpe und Power-Latch-Relais.'
  it: 'Diagnostica complementare del BSM, inviata su evento a ogni cambiamento di parametro: clacson, comandi accensione/avviamento, chiave rilevata, fari, posizione folle, pompa aria, pompa carburante e relè di mantenimento alimentazione.'
  pl: 'Uzupełniająca diagnostyka BSM, wysyłana zdarzeniowo przy każdej zmianie parametru: klakson, polecenia zapłonu/rozrusznika, wykryty kluczyk, reflektory, pozycja luzu, pompa powietrza, pompa paliwa i przekaźnik podtrzymania zasilania.'
  ru: 'Дополнительная диагностика BSM, отправляемая по событию при любом изменении параметра: звуковой сигнал, команды зажигания/стартера, обнаружение ключа, фары, нейтральное положение, воздушный насос, топливный насос и реле удержания питания.'
  zh: 'BSM的补充诊断,任何参数变化时按事件发送:喇叭、点火/启动命令、检测到钥匙、前照灯、空挡位置、气泵、燃油泵和电源保持继电器。'
  hu: 'Kiegészítő BSM diagnosztika, bármely paraméter változásakor eseményalapon küldve: kürt, gyújtás/indítómotor parancsok, kulcs érzékelve, fényszórók, üresjárati fokozat, légszivattyú, üzemanyag-szivattyú és tápellátás-tartó relé.'
  pt: 'Diagnóstico complementar do BSM, baseado em eventos em qualquer mudança de parâmetro: buzina, comandos de ignição ligada/motor de arranque, chave detetada, faróis, posição de ponto morto, bomba de ar, bomba de combustível e relé de retenção de alimentação.'
observations:
  en: 'On state change of any parameter of the frame. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de cualquier parámetro de la trama. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния любого параметра кадра. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '该帧任意参数状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A keret bármely paraméterének állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['500ms', 'trigger']
senders: ['BSM']
receivers: ['BSI']

