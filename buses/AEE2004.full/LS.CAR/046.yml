id: 0x046
name: 'LIGHTING_OPTION_COMMAND'
type: 'can'
length: 8
comment:
  en: 'Reliability-checked lighting parameters sent by the BSI: front/rear lamps, low/high beam, indicators, occultation, rear fog and trailer fog states, with checksum.'
  fr: 'Paramètres d''éclairage fiabilisés envoyés par la BSI : lanternes avant/arrière, feux de croisement/route, clignotants, occultation, feux antibrouillard arrière et remorque, avec somme de contrôle.'
  es: 'Parámetros de alumbrado verificados enviados por la BSI: luces delanteras/traseras, luces de cruce/carretera, intermitentes, ocultación, antiniebla trasero y de remolque, con suma de comprobación.'
  de: 'Von der BSI gesendete, auf Zuverlässigkeit geprüfte Beleuchtungsparameter: vordere/hintere Leuchten, Abblend-/Fernlicht, Blinker, Verdunkelung, Heck- und Anhängernebelschlussleuchtenzustände, mit Prüfsumme.'
  it: 'Parametri di illuminazione verificati inviati dalla BSI: luci anteriori/posteriori, anabbaglianti/abbaglianti, indicatori di direzione, oscuramento, fendinebbia posteriore e rimorchio, con checksum.'
  pl: 'Zweryfikowane parametry oświetlenia wysyłane przez BSI: światła przednie/tylne, mijania/drogowe, kierunkowskazy, zaciemnienie, tylne światło przeciwmgielne i przyczepy, z sumą kontrolną.'
  ru: 'Проверенные на надёжность параметры освещения, отправляемые BSI: передние/задние фонари, ближний/дальний свет, указатели поворота, затемнение, задние противотуманные фонари и прицепа, с контрольной суммой.'
  zh: '由BSI发送的经可靠性校验的灯光参数：前后灯、近光/远光灯、转向灯、遮蔽、后雾灯及拖车雾灯状态，附带校验和。'
  hu: 'A BSI által küldött, megbízhatóság szempontjából ellenőrzött világítási paraméterek: elülső/hátsó lámpák, tompított/távolsági fény, index, elsötétítés, hátsó és utánfutó-ködlámpa állapotok, ellenőrző összeggel.'
  pt: 'Parâmetros de iluminação com verificação de fiabilidade enviados pela BSI: estados das luzes dianteiras/traseiras, médios/máximos, piscas, ocultação, nevoeiro traseiro e nevoeiro do reboque, com soma de verificação.'
observations:
  en: 'On state change of: FRONT_POSITION_LIGHT_CONTROL, LOW_BEAM_CONTROL, HIGH_BEAM_CONTROL, RIGHT_INDICATOR_CONTROL, LEFT_INDICATOR_CONTROL, OCCULTANT, BRAKE_LIGHT_CONTROL, REVERSING_LIGHT_CONTROL'
  fr: 'Sur changement d''état de : FRONT_POSITION_LIGHT_CONTROL, LOW_BEAM_CONTROL, HIGH_BEAM_CONTROL, RIGHT_INDICATOR_CONTROL, LEFT_INDICATOR_CONTROL, OCCULTANT, BRAKE_LIGHT_CONTROL, REVERSING_LIGHT_CONTROL'
  es: 'Al cambiar el estado de: FRONT_POSITION_LIGHT_CONTROL, LOW_BEAM_CONTROL, HIGH_BEAM_CONTROL, RIGHT_INDICATOR_CONTROL, LEFT_INDICATOR_CONTROL, OCCULTANT, BRAKE_LIGHT_CONTROL, REVERSING_LIGHT_CONTROL'
  de: 'Bei Statusänderung von: FRONT_POSITION_LIGHT_CONTROL, LOW_BEAM_CONTROL, HIGH_BEAM_CONTROL, RIGHT_INDICATOR_CONTROL, LEFT_INDICATOR_CONTROL, OCCULTANT, BRAKE_LIGHT_CONTROL, REVERSING_LIGHT_CONTROL'
  it: 'Al cambiamento di stato di: FRONT_POSITION_LIGHT_CONTROL, LOW_BEAM_CONTROL, HIGH_BEAM_CONTROL, RIGHT_INDICATOR_CONTROL, LEFT_INDICATOR_CONTROL, OCCULTANT, BRAKE_LIGHT_CONTROL, REVERSING_LIGHT_CONTROL'
  pl: 'Wysyłane przy zmianie stanu: FRONT_POSITION_LIGHT_CONTROL, LOW_BEAM_CONTROL, HIGH_BEAM_CONTROL, RIGHT_INDICATOR_CONTROL, LEFT_INDICATOR_CONTROL, OCCULTANT, BRAKE_LIGHT_CONTROL, REVERSING_LIGHT_CONTROL'
  ru: 'При изменении состояния: FRONT_POSITION_LIGHT_CONTROL, LOW_BEAM_CONTROL, HIGH_BEAM_CONTROL, RIGHT_INDICATOR_CONTROL, LEFT_INDICATOR_CONTROL, OCCULTANT, BRAKE_LIGHT_CONTROL, REVERSING_LIGHT_CONTROL'
  zh: '当S_LANT_AV, LOW_BEAM_CONTROL, HIGH_BEAM_CONTROL, RIGHT_INDICATOR_CONTROL, LEFT_INDICATOR_CONTROL, OCCULTANT, BRAKE_LIGHT_CONTROL, S_RECUL状态变化时'
  hu: 'A(z) FRONT_POSITION_LIGHT_CONTROL, LOW_BEAM_CONTROL, HIGH_BEAM_CONTROL, RIGHT_INDICATOR_CONTROL, LEFT_INDICATOR_CONTROL, OCCULTANT, BRAKE_LIGHT_CONTROL, REVERSING_LIGHT_CONTROL állapotváltozásakor'
  pt: 'Na mudança de estado de: FRONT_POSITION_LIGHT_CONTROL, LOW_BEAM_CONTROL, HIGH_BEAM_CONTROL, RIGHT_INDICATOR_CONTROL, LEFT_INDICATOR_CONTROL, OCCULTANT, BRAKE_LIGHT_CONTROL, REVERSING_LIGHT_CONTROL'
periodicity: ['100ms', 'trigger']
senders: ['BSI']
receivers: ['BSC', 'BSM', 'BSR']

