id: 0x053
name: 'AVE_ENCRYPTION_SEED'
type: 'can'
length: 4
comment:
  en: 'Random seed bytes sent by the AVE node for the encryption/authentication challenge.'
  fr: 'Octets de graine aléatoire envoyés par le module AVE pour le défi de chiffrement/authentification.'
  es: 'Bytes de semilla aleatoria enviados por el módulo AVE para el desafío de cifrado/autenticación.'
  de: 'Zufalls-Seed-Bytes, die vom AVE-Modul für die Verschlüsselungs-/Authentifizierungs-Challenge gesendet werden.'
  it: 'Byte di seme casuale inviati dal modulo AVE per la challenge di cifratura/autenticazione.'
  pl: 'Bajty losowego ziarna wysyłane przez moduł AVE dla wyzwania szyfrowania/uwierzytelniania.'
  ru: 'Байты случайного зерна, отправляемые модулем AVE для запроса шифрования/аутентификации.'
  zh: 'AVE模块发送的用于加密/认证挑战的随机种子字节。'
  hu: 'Az AVE modul által küldött véletlen seed bájtok a titkosítási/hitelesítési kihíváshoz.'
  pt: 'Bytes de semente aleatória enviados pelo nó AVE para o desafio de encriptação/autenticação.'
periodicity: ['trigger']
senders: ['AVE']
receivers: ['BSI']

