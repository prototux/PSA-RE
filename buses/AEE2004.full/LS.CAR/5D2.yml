id: 0x5D2
name: 'BSI_VERSION_2'
type: 'can'
length: 8
comment:
  en: 'Software and calibration version identification of the sending ECU'
  fr: 'Identification de la version logicielle et de la calibration du calculateur émetteur'
  es: 'Identificación de la versión de software y calibración de la centralita emisora'
  de: 'Software- und Kalibrierversionskennung des sendenden Steuergeräts'
  it: 'Identificazione della versione software e della calibrazione della centralina mittente'
  pl: 'Identyfikacja wersji oprogramowania i kalibracji sterownika nadawcy'
  ru: 'Идентификация версии программного обеспечения и калибровки передающего блока'
  zh: '发送方ECU的软件与标定版本标识'
  hu: 'Az adó vezérlőegység szoftver- és kalibrációs verzióazonosítója'
  pt: 'Identificação da versão de software e calibração da ECU emissora.'
observations:
  en: 'On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['trigger']
senders: ['BSI']

signals:
  ECU_NUMBER:
    bits: '1.7-1.0'
    comment:
      en: 'ECU number.'
      fr: 'Numéro d''UCE (calculateur).'
      es: 'Número de unidad de control.'
      de: 'Steuergerätenummer.'
      it: 'Numero di centralina.'
      pl: 'Numer sterownika.'
      ru: 'Номер блока управления.'
      zh: '控制单元编号。'
      hu: 'Vezérlőegység száma.'
      pt: 'Número de UCE (centralina).'
    type: 'uint'
    min: 0
    max: 254
    invalid: 0xFF
    default: 0x00

  SOFTWARE_VERSION_DAY:
    bits: '2.7-2.0'
    comment:
      en: 'Software version, day.'
      fr: 'Version du logiciel, jour.'
      es: 'Versión del software, día.'
      de: 'Softwareversion, Tag.'
      it: 'Versione del software, giorno.'
      pl: 'Wersja oprogramowania, dzień.'
      ru: 'Версия программного обеспечения, день.'
      zh: '软件版本，日。'
      hu: 'Szoftververzió, nap.'
      pt: 'Versão do software, dia'
    type: 'uint'
    factor: 1
    min: 1
    max: 31
    units: 'day'
    invalid: 0xFF
    default: 0x00

  SOFTWARE_VERSION_MONTH:
    bits: '3.7-3.0'
    comment:
      en: 'Software version, month.'
      fr: 'Version du logiciel, mois.'
      es: 'Versión del software, mes.'
      de: 'Softwareversion, Monat.'
      it: 'Versione del software, mese.'
      pl: 'Wersja oprogramowania, miesiąc.'
      ru: 'Версия программного обеспечения, месяц.'
      zh: '软件版本，月。'
      hu: 'Szoftververzió, hónap.'
      pt: 'Versão do software, mês'
    type: 'uint'
    factor: 1
    min: 1
    max: 12
    units: 'month'
    invalid: 0xFF
    default: 0x00

  SOFTWARE_VERSION_YEAR:
    bits: '4.7-4.0'
    comment:
      en: 'Software version, year.'
      fr: 'Version du logiciel, année.'
      es: 'Versión del software, año.'
      de: 'Softwareversion, Jahr.'
      it: 'Versione del software, anno.'
      pl: 'Wersja oprogramowania, rok.'
      ru: 'Версия программного обеспечения, год.'
      zh: '软件版本，年。'
      hu: 'Szoftververzió, év.'
      pt: 'Versão do software, ano'
    type: 'uint'
    factor: 1
    offset: 2000
    min: 2000
    max: 2200
    units: 'year'
    invalid: 0xFF
    default: 0x00

  UNUSED_1:
    bits: '5.7-6.0'
    unused: true

  UNUSED_2:
    bits: '7.7-7.4'
    unused: true

  UNUSED_3:
    bits: '7.3-7.0'
    unused: true

  EDITION_NUMBER:
    bits: '8.7-8.0'
    comment:
      en: 'Edition number.'
      fr: 'Numéro de l''édition.'
      es: 'Número de edición.'
      de: 'Ausgabenummer.'
      it: 'Numero di edizione.'
      pl: 'Numer edycji.'
      ru: 'Номер редакции.'
      zh: '版本编号。'
      hu: 'Kiadásszám.'
      pt: 'Número da edição.'
    type: 'uint'
    min: 0
    max: 254
    invalid: 0xFF
    default: 0x00
