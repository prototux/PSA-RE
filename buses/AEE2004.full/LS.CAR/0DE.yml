id: 0x0DE
name: 'ALARM_EVENT'
type: 'can'
length: 3
comment:
  en: 'Alarm module events: interior intrusion, bonnet opening, siren link fault, volumetric inhibition push-button and hazard-lamp flashing request on intrusion.'
  fr: 'Événements du module alarme : intrusion intérieure, ouverture capot, défaut de liaison sirène, bouton d''inhibition de la surveillance volumétrique et demande de clignotement des feux de détresse sur intrusion.'
  es: 'Eventos del módulo de alarma: intrusión interior, apertura del capó, fallo de enlace de la sirena, pulsador de inhibición volumétrica y solicitud de parpadeo de las luces de emergencia ante intrusión.'
  de: 'Ereignisse des Alarmmoduls: Innenraumeinbruch, Motorhaubenöffnung, Sirenenverbindungsfehler, Taster zur Deaktivierung der Innenraumüberwachung und Warnblinkeranforderung bei Einbruch.'
  it: 'Eventi del modulo allarme: intrusione interna, apertura del cofano, guasto del collegamento sirena, pulsante di inibizione volumetrica e richiesta di lampeggio delle luci di emergenza in caso di intrusione.'
  pl: 'Zdarzenia modułu alarmowego: włamanie do wnętrza, otwarcie maski, usterka łącza syreny, przycisk wyłączenia czujnika ruchu i żądanie migania świateł awaryjnych przy włamaniu.'
  ru: 'События модуля сигнализации: проникновение в салон, открытие капота, неисправность связи с сиреной, кнопка отключения объёмного датчика и запрос мигания аварийной сигнализации при проникновении.'
  zh: '报警模块事件:车内入侵、引擎盖开启、报警器连接故障、体积感应抑制按钮及入侵时危险警示灯闪烁请求。'
  hu: 'A riasztómodul eseményei: belső térbe való behatolás, motorháztető nyitása, szirénakapcsolat-hiba, térfigyelés letiltó gomb és vészvillogó villogtatási kérése behatoláskor.'
  pt: 'Eventos do módulo de alarme: intrusão interior, abertura do capot, avaria da ligação da sirene, botão de inibição volumétrica e pedido de piscar das luzes de emergência em caso de intrusão.'
periodicity: ['trigger']
senders: []  # TODO: find the sender(s)

