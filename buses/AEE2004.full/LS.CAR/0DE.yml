        fr: 'Infraction du véhicule'
        es: 'Infracción del vehículo'
        de: 'Fahrzeugverstoß'
        it: 'Infrazione del veicolo'
        pl: 'Wykroczenie pojazdu'
        ru: 'Нарушение ПДД автомобилем'
