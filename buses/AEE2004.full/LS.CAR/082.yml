id: 0x082
name: 'STEERING_COLUMN_SIGNAL_COMMAND'
type: 'can'
length: 3
comment:
  en: 'Lighting and indicator states sent to the steering column buzzer module on change: position, low/high beam and front/rear fog lights, indicators and cluster sound.'
  fr: 'États d''éclairage et de clignotants envoyés au module buzzer de colonne de direction sur changement : feux de position, de croisement/route et antibrouillard avant/arrière, clignotants et son du combiné.'
  es: 'Estados de alumbrado e intermitentes enviados al módulo zumbador de la columna de dirección al cambiar: luces de posición, de cruce/carretera y antiniebla delantero/trasero, intermitentes y sonido del cuadro.'
  de: 'Bei Änderung an das Lenksäulen-Summermodul gesendete Licht- und Blinkerzustände: Standlicht, Abblend-/Fernlicht und Front-/Nebelscheinwerfer, Blinker und Kombiinstrument-Ton.'
  it: 'Stati di illuminazione e indicatori inviati al modulo cicalino della colonna di sterzo al cambio: luci di posizione, anabbaglianti/abbaglianti e fendinebbia anteriore/posteriore, indicatori di direzione e suono del quadro.'
  pl: 'Stany oświetlenia i kierunkowskazów wysyłane do modułu brzęczyka kolumny kierownicy przy zmianie: światła pozycyjne, mijania/drogowe i przeciwmgielne przód/tył, kierunkowskazy i dźwięk zestawu wskaźników.'
  ru: 'Состояния освещения и указателей поворота, отправляемые в модуль зуммера рулевой колонки при изменении: габариты, ближний/дальний свет и передние/задние противотуманные фары, поворотники и звук приборной панели.'
  zh: '状态变化时发送给转向柱蜂鸣器模块的灯光及转向灯状态：示宽灯、近光/远光灯及前后雾灯、转向灯及仪表组提示音。'
  hu: 'A kormányoszlop-berregő modulnak változáskor küldött világítási és index-állapotok: helyzetjelző, tompított/távolsági fény és elülső/hátsó ködlámpa, index és a műszerfal hangja.'
  pt: 'Estados de iluminação e piscas enviados ao módulo do besouro da coluna de direção na mudança: presença, médios/máximos e nevoeiro dianteiro/traseiro, piscas e som do quadrante.'
observations:
  en: 'On state change of: SIDELIGHTS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, REAR_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN'
  fr: 'Sur changement d''état de : SIDELIGHTS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, REAR_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN'
  es: 'Al cambiar el estado de: SIDELIGHTS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, REAR_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN'
  de: 'Bei Statusänderung von: SIDELIGHTS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, REAR_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN'
  it: 'Al cambiamento di stato di: SIDELIGHTS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, REAR_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN'
  pl: 'Wysyłane przy zmianie stanu: SIDELIGHTS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, REAR_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN'
  ru: 'При изменении состояния: SIDELIGHTS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, REAR_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN'
  zh: '当FEUX_POS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, REAR_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN, EM_SON_CMB_BRT状态变化时'
  hu: 'A(z) SIDELIGHTS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, REAR_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN állapotváltozásakor'
  pt: 'Na mudança de estado de: SIDELIGHTS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, REAR_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['HDC']

