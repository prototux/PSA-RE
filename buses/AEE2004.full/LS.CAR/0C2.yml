id: 0x0C2
name: 'TRANSPONDER_AUTH_COMMAND'
type: 'can'
length: 8
comment:
  en: 'Encrypted authentication command and code sent by the BSI to the key transponder.'
  fr: 'Commande et code d''authentification chiffrés envoyés par la BSI au transpondeur de clé.'
  es: 'Orden y código de autenticación cifrados enviados por la BSI al transpondedor de la llave.'
  de: 'Verschlüsselter Authentifizierungsbefehl und -code, von der BSI an den Schlüsseltransponder gesendet.'
  it: 'Comando e codice di autenticazione cifrati inviati dalla BSI al transponder della chiave.'
  pl: 'Zaszyfrowane polecenie i kod uwierzytelnienia wysyłane przez BSI do transpondera kluczyka.'
  ru: 'Зашифрованная команда и код аутентификации, отправляемые BSI в транспондер ключа.'
  zh: '由BSI发送给钥匙应答器的加密认证命令及代码。'
  hu: 'Titkosított hitelesítési parancs és kód, amelyet a BSI küld a kulcstranszpondernek.'
  pt: 'Comando e código de autenticação encriptados, enviados pela BSI ao transponder da chave.'
observations:
  en: 'Depends on the ECU (component-specific behaviour)'
  fr: 'Dépend du calculateur (comportement propre à l''organe)'
  es: 'Depende de la ECU (comportamiento propio del componente)'
  de: 'Abhängig vom Steuergerät (bauteilspezifisches Verhalten)'
  it: 'Dipende dalla centralina (comportamento specifico del componente)'
  pl: 'Zależy od sterownika (zachowanie specyficzne dla podzespołu)'
  ru: 'Зависит от блока управления (поведение конкретного узла)'
  zh: '取决于该ECU的具体行为'
  hu: 'A vezérlőegységtől függ (alkatrész-specifikus viselkedés)'
  pt: 'Depende da unidade de controlo (comportamento específico do componente)'
periodicity: ['trigger']
senders: ['BSI']
receivers: ['HDC']

signals:
  TRANSPONDER_RANDOM_CHALLENGE:
    bits: '1.7-4.0'
    comment:
      en: 'Random challenge code'
      fr: 'Code aléatoire'
      es: 'Código aleatorio'
      de: 'Zufallscode (Challenge)'
      it: 'Codice casuale'
      pl: 'Losowy kod'
      ru: 'Случайный код запроса'
      zh: '随机挑战码'
      hu: 'Véletlen kihívási kód'
      pt: 'Código aleatório de desafio'
    type: 'uint'
    default: 0x00

  TRANSPONDER_ENCRYPTED_PASSWORD:
    bits: '5.7-8.0'
    comment:
      en: 'Transponder encrypted password'
      fr: 'Mot de passe crypté du transpondeur'
      es: 'Contraseña cifrada del transpondedor'
      de: 'Verschlüsseltes Transponder-Passwort'
      it: 'Password cifrata del transponder'
      pl: 'Zaszyfrowane hasło transpondera'
      ru: 'Зашифрованный пароль транспондера'
      zh: '应答器加密密码'
      hu: 'Transzponder titkosított jelszava'
      pt: 'Palavra-passe encriptada do transponder'
    type: 'uint'
    default: 0x00
