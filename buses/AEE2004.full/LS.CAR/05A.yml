id: 0x05A
name: 'RAIN_LIGHT_SENSOR_FAST_DATA'
type: 'can'
length: 2
comment:
  en: 'Rain/light sensor fast-rate data: lighting command, automatic lighting and rain faults, wiper state, degraded modes and sweep speed.'
  fr: 'Données rapides du capteur de pluie et de luminosité : commande d''éclairage, défauts éclairage automatique et pluie, état d''essuyage, modes dégradés et vitesse de balayage.'
  es: 'Datos de alta frecuencia del sensor de lluvia y luz: mando de iluminación, fallos de iluminación automática y de lluvia, estado del limpiaparabrisas, modos degradados y velocidad de barrido.'
  de: 'Schnelle Daten des Regen-/Lichtsensors: Lichtsteuerung, Fehler bei automatischer Beleuchtung und Regenerkennung, Wischerstatus, degradierte Modi und Wischgeschwindigkeit.'
  it: 'Dati ad alta frequenza del sensore pioggia/luce: comando luci, guasti illuminazione automatica e pioggia, stato tergicristalli, modalità degradate e velocità di spazzata.'
  pl: 'Szybkie dane czujnika deszczu/światła: sterowanie oświetleniem, usterki automatycznego oświetlenia i deszczu, stan wycieraczek, tryby awaryjne i prędkość pracy.'
  ru: 'Быстрые данные датчика дождя/света: команда освещения, неисправности автоматического освещения и дождя, состояние дворников, деградированные режимы и скорость хода.'
  zh: '雨光传感器高速数据:照明指令、自动照明与雨量故障、雨刷状态、降级模式及刮扫速度。'
  hu: 'Az eső-/fényérzékelő gyors adatai: világításvezérlés, automatikus világítás és esőérzékelés hibái, ablaktörlő állapota, korlátozott üzemmódok és törlési sebesség.'
  pt: 'Dados a alta cadência do sensor de chuva/luz: comando de iluminação, avarias de iluminação automática e de chuva, estado do limpa-para-brisas, modos degradados e velocidade de varrimento.'
observations:
  en: 'On state change of: AUTO_HEADLAMP_FUNCTION_FAULT, AUTO_LAMPS_REQUEST, AUTO_WIPE_FUNCTION_FAULT, WIPER_SWEEP_SPEED, RAIN_SENSOR_WIPER_STATE'
  fr: 'Sur changement d''état de : AUTO_HEADLAMP_FUNCTION_FAULT, AUTO_LAMPS_REQUEST, AUTO_WIPE_FUNCTION_FAULT, WIPER_SWEEP_SPEED, RAIN_SENSOR_WIPER_STATE'
  es: 'Al cambiar el estado de: AUTO_HEADLAMP_FUNCTION_FAULT, AUTO_LAMPS_REQUEST, AUTO_WIPE_FUNCTION_FAULT, WIPER_SWEEP_SPEED, RAIN_SENSOR_WIPER_STATE'
  de: 'Bei Statusänderung von: AUTO_HEADLAMP_FUNCTION_FAULT, AUTO_LAMPS_REQUEST, AUTO_WIPE_FUNCTION_FAULT, WIPER_SWEEP_SPEED, RAIN_SENSOR_WIPER_STATE'
  it: 'Al cambiamento di stato di: AUTO_HEADLAMP_FUNCTION_FAULT, AUTO_LAMPS_REQUEST, AUTO_WIPE_FUNCTION_FAULT, WIPER_SWEEP_SPEED, RAIN_SENSOR_WIPER_STATE'
  pl: 'Wysyłane przy zmianie stanu: AUTO_HEADLAMP_FUNCTION_FAULT, AUTO_LAMPS_REQUEST, AUTO_WIPE_FUNCTION_FAULT, WIPER_SWEEP_SPEED, RAIN_SENSOR_WIPER_STATE'
  ru: 'При изменении состояния: AUTO_HEADLAMP_FUNCTION_FAULT, AUTO_LAMPS_REQUEST, AUTO_WIPE_FUNCTION_FAULT, WIPER_SWEEP_SPEED, RAIN_SENSOR_WIPER_STATE'
  zh: '当DEFAUT_AAF, AUTO_LAMPS_REQUEST, AUTO_WIPE_FUNCTION_FAULT, WIPER_SWEEP_SPEED, ETAT_ESSUYAGE状态变化时'
  hu: 'A(z) AUTO_HEADLAMP_FUNCTION_FAULT, AUTO_LAMPS_REQUEST, AUTO_WIPE_FUNCTION_FAULT, WIPER_SWEEP_SPEED, RAIN_SENSOR_WIPER_STATE állapotváltozásakor'
  pt: 'Na mudança de estado de: AUTO_HEADLAMP_FUNCTION_FAULT, AUTO_LAMPS_REQUEST, AUTO_WIPE_FUNCTION_FAULT, WIPER_SWEEP_SPEED, RAIN_SENSOR_WIPER_STATE'
periodicity: ['100ms', 'trigger']
senders: ['CDPL']
receivers: ['BSI', 'BSM']

