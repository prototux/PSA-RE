id: 0x036
name: 'RADIO_COMMANDS'
type: 'can'
length: 8
comment:
  en: 'Audio remote control commands from the steering column switch unit (under-wheel radio controls, excluding stalk end pushes), relayed by the BSI.'
  fr: 'Commandes de télécommande audio du commodo de colonne de direction (commandes radio sous volant, hors pushs en bout de commodo), relayées par la BSI.'
  es: 'Órdenes del mando a distancia de audio del mando bajo el volante (controles de radio bajo el volante, excluyendo los pulsadores en el extremo del mando), retransmitidas por la BSI.'
  de: 'Audio-Fernbedienungsbefehle des Lenksäulenschalters (Radiobedienung unter dem Lenkrad, ohne Lenkstockhebel-Endtaster), von der BSI weitergeleitet.'
  it: 'Comandi del telecomando audio della leva sotto il volante (comandi radio sotto il volante, esclusi i pulsanti all''estremità della leva), inoltrati dalla BSI.'
  pl: 'Polecenia zdalnego sterowania audio z dźwigienki kolumny kierownicy (sterowanie radiem pod kierownicą, z wyłączeniem przycisków na końcu dźwigienki), przekazywane przez BSI.'
  ru: 'Команды аудио-пульта подрулевого переключателя (управление радио под рулём, кроме кнопок на конце подрулевого рычага), ретранслируемые BSI.'
  zh: '来自转向柱组合开关的音频遥控命令（方向盘下方收音机控制，不含组合开关末端按键），由BSI转发。'
  hu: 'A kormányoszlop-kapcsoló egység audio-távvezérlő parancsai (kormány alatti rádiókezelés, a kar végi nyomógombok kivételével), a BSI továbbítja.'
  pt: 'Comandos remotos de áudio da unidade de comutadores da coluna de direção (comandos de rádio sob o volante, excluindo as pressões nas extremidades dos comutadores), retransmitidos pela BSI.'
observations:
  en: 'On state change of: DRIVER_MEMORY, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, ECO_MODE, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, HYBRID_STATUS_UPDATED. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : DRIVER_MEMORY, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, ECO_MODE, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, HYBRID_STATUS_UPDATED. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: DRIVER_MEMORY, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, ECO_MODE, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, HYBRID_STATUS_UPDATED. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: DRIVER_MEMORY, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, ECO_MODE, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, HYBRID_STATUS_UPDATED. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: DRIVER_MEMORY, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, ECO_MODE, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, HYBRID_STATUS_UPDATED. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: DRIVER_MEMORY, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, ECO_MODE, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, HYBRID_STATUS_UPDATED. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: DRIVER_MEMORY, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, ECO_MODE, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, HYBRID_STATUS_UPDATED. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当RAPP_MEM_C, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, ECO_MODE, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, UB_ETAT_GMP_HY状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z) DRIVER_MEMORY, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, ECO_MODE, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, HYBRID_STATUS_UPDATED állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: DRIVER_MEMORY, DRIVER_MEMORY_SAVE, PASSENGER_MEMORY, PASSENGER_MEMORY_SAVE, DAYNIGHT_STATUS, DARK_MODE, POWER_MANAGEMENT, ECO_MODE, HYBRID_MODE, HYBRID_MODE_UPDATED, HYBRID_STATUS, HYBRID_STATUS_UPDATED. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['100ms', 'trigger']
