id: 0x000
name: 'VEHICLE_ALERT_LOG_2'
type: 'can'
length: 8
comment:
  en: 'Vehicle alert log access frame, sent by the body computer (BSI) when the alert log is accessed.'
  fr: 'Trame d''accès au journal des alertes véhicule, émise par le BSI lors de l''accès au journal.'
  es: 'Trama de acceso al registro de alertas del vehículo, emitida por la BSI al acceder al registro.'
  de: 'Rahmen für den Zugriff auf das Fahrzeugwarnprotokoll, vom BSI beim Zugriff auf das Protokoll gesendet.'
  it: 'Trama di accesso al registro allarmi del veicolo, emessa dal BSI all''accesso al registro.'
  pl: 'Ramka dostępu do dziennika alertów pojazdu, wysyłana przez BSI przy dostępie do dziennika.'
  ru: 'Кадр доступа к журналу предупреждений автомобиля, отправляемый BSI при обращении к журналу.'
  zh: '车身控制器(BSI)在访问车辆警报日志时发送的日志访问帧。'
  hu: 'A jármű riasztásnaplójához való hozzáférés kerete, amelyet a BSI küld a napló elérésekor.'
  pt: 'Trama de acesso ao registo de alertas do veículo, emitida pela BSI ao aceder ao registo.'
periodicity: ['trigger']
senders: []  # TODO: find the sender(s)

