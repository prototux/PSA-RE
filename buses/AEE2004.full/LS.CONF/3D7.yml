id: 0x3D7
name: 'CLUSTER_DATE_COUNTER'
type: 'can'
length: 6
comment:
  en: 'Relative date/time counter sent by the instrument cluster: years, days and seconds.'
  fr: 'Compteur de date/heure relatif envoyé par le combiné : années, jours et secondes.'
  es: 'Contador de fecha/hora relativo enviado por el cuadro de instrumentos: años, días y segundos.'
  de: 'Relativer Datums-/Zeitzähler des Kombiinstruments: Jahre, Tage und Sekunden.'
  it: 'Contatore data/ora relativo inviato dal quadro strumenti: anni, giorni e secondi.'
  pl: 'Względny licznik daty/czasu wysyłany przez zestaw wskaźników: lata, dni i sekundy.'
  ru: 'Относительный счётчик даты/времени, отправляемый комбинацией приборов: годы, дни и секунды.'
  zh: '由仪表组发送的相对日期/时间计数器:年、日和秒。'
  hu: 'A műszeregység által küldött relatív dátum-/időszámláló: évek, napok és másodpercek.'
  pt: 'Contador relativo de data/hora enviado pelo quadrante de instrumentos: anos, dias e segundos.'
periodicity: ['1000ms']
senders: ['CMB']
receivers: ['BSI', 'BGP']

signals:
  CMB_SECOND_COUNT:
    bits: '1.7-3.4'
    comment:
      en: 'Second counter since the CMB permanent supply was last connected'
      fr: 'Compteur de secondes depuis la dernière mise sous tension permanente du CMB'
      es: 'Contador de segundos desde la última conexión permanente del CMB'
      de: 'Sekundenzähler seit dem letzten Anschluss der Dauerversorgung des CMB'
      it: 'Contatore di secondi dall''ultimo collegamento dell''alimentazione permanente del CMB'
      pl: 'Licznik sekund od ostatniego podłączenia zasilania stałego CMB'
      ru: 'Счётчик секунд с момента последнего подключения постоянного питания CMB'
      zh: '自CMB常电最近一次接通以来的秒计数'
      hu: 'A CMB állandó tápellátásának utolsó bekapcsolása óta eltelt másodpercek száma'
      pt: 'Contador de segundos desde a última ligação permanente do CMB'
    type: 'uint'
    factor: 1
    min: 0
    max: 86399
    units: 's'
    invalid: 0xFFFFF
    default: 0x00

  CMB_DAY_COUNT:
    bits: '3.3-4.0'
    comment:
      en: 'Day counter since the CMB permanent supply was last connected'
      fr: 'Compteur de jours depuis la dernière mise sous tension permanente du CMB'
      es: 'Contador de días desde la última conexión permanente del CMB'
      de: 'Tageszähler seit dem letzten Anschluss der Dauerversorgung des CMB'
      it: 'Contatore di giorni dall''ultimo collegamento dell''alimentazione permanente del CMB'
      pl: 'Licznik dni od ostatniego podłączenia zasilania stałego CMB'
      ru: 'Счётчик дней с момента последнего подключения постоянного питания CMB'
      zh: '自CMB常电最近一次接通以来的天计数'
      hu: 'A CMB állandó tápellátásának utolsó bekapcsolása óta eltelt napok száma'
      pt: 'Contador de dias desde a última ligação da alimentação permanente do CMB'
    type: 'uint'
    factor: 1
    min: 0
    max: 364
    units: 'day'
    invalid: 0xFFF
    default: 0x00

  CMB_YEAR_COUNT:
    bits: '5.7-5.0'
    comment:
      en: 'Year counter since the CMB permanent supply was last connected'
      fr: 'Compteur d''années depuis la dernière mise sous tension permanente du CMB'
      es: 'Contador de años desde la última conexión permanente del CMB'
      de: 'Jahreszähler seit dem letzten Anschluss der Dauerversorgung des CMB'
      it: 'Contatore di anni dall''ultimo collegamento dell''alimentazione permanente del CMB'
      pl: 'Licznik lat od ostatniego podłączenia zasilania stałego CMB'
      ru: 'Счётчик лет с момента последнего подключения постоянного питания CMB'
      zh: '自CMB常电最近一次接通以来的年计数'
      hu: 'A CMB állandó tápellátásának utolsó bekapcsolása óta eltelt évek száma'
      pt: 'Contador de anos desde a última ligação permanente do quadro de instrumentos (CMB)'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: 'year'
    invalid: 0xFF
    default: 0x00

  UNUSED_1:
    bits: '6.7-6.0'
    unused: true
