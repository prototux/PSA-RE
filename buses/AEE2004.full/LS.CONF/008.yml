id: 0x008
name: 'RADIO_REPLY_FLOW_CONTROL'
type: 'can'
length: 3
comment:
  en: 'ISO-TP flow control frame for the radio reply multi-frame reply (block size, flow status, separation time).'
  fr: 'Trame de contrôle de flux ISO-TP pour la réponse multi-trame radio reply (taille de bloc, état de flux, temps de séparation).'
  es: 'Trama de control de flujo ISO-TP para la respuesta multitrama radio reply (tamaño de bloque, estado de flujo, tiempo de separación).'
  de: 'ISO-TP-Flusssteuerungsrahmen für die Mehrfachrahmen-Antwort radio reply (Blockgröße, Flussstatus, Trennzeit).'
  it: 'Trama di controllo di flusso ISO-TP per la risposta multi-trama radio reply (dimensione blocco, stato di flusso, tempo di separazione).'
  pl: 'Ramka kontroli przepływu ISO-TP dla wieloramkowej odpowiedzi radio reply (rozmiar bloku, stan przepływu, czas separacji).'
  ru: 'Кадр управления потоком ISO-TP для многокадрового ответа radio reply (размер блока, статус потока, время разделения).'
  zh: '用于radio reply多帧应答的ISO-TP流控制帧(块大小、流状态、间隔时间)。'
  hu: 'ISO-TP folyamvezérlő keret a radio reply többkeretes válaszhoz (blokkméret, folyamallapot, elválasztási idő).'
  pt: 'Trama de controlo de fluxo ISO-TP para a resposta multi-trama da rádio (tamanho de bloco, estado de fluxo, tempo de separação).'
periodicity: ['100ms']
senders: ['EMF']

signals:
  NPCI_HEADER:
    bits: '1.7-1.4'
    comment:
      en: 'NPCI header (per the OSEK-COM segmentation standard)'
      fr: 'En-tête NPCI (selon la norme de segmentation OSEK-COM)'
      es: 'Cabecera NPCI (según la norma de segmentación OSEK-COM)'
      de: 'NPCI-Header (gemäß dem OSEK-COM-Segmentierungsstandard)'
      it: 'Intestazione NPCI (secondo lo standard di segmentazione OSEK-COM)'
      pl: 'Nagłówek NPCI (zgodnie ze standardem segmentacji OSEK-COM)'
      ru: 'Заголовок NPCI (согласно стандарту сегментации OSEK-COM)'
      zh: 'NPCI 报头(依据 OSEK-COM 分段标准)'
      hu: 'NPCI fejléc (az OSEK-COM szegmentálási szabvány szerint)'
      pt: 'Cabeçalho NPCI (segundo a norma de segmentação OSEK-COM)'
    type: 'uint'

  FLOW_STATUS:
    bits: '1.3-1.0'
    comment:
      en: 'Flow status (per the OSEK-COM segmentation standard)'
      fr: 'Flow Status (cf. norme de segmentation OSEK-COM)'
      es: 'Estado de flujo (según el estándar de segmentación OSEK-COM)'
      de: 'Flusssteuerungsstatus (gemäß dem OSEK-COM-Segmentierungsstandard)'
      it: 'Stato di flusso (secondo lo standard di segmentazione OSEK-COM)'
      pl: 'Stan przepływu (zgodnie ze standardem segmentacji OSEK-COM)'
      ru: 'Статус потока (согласно стандарту сегментации OSEK-COM)'
      zh: '流控制状态（依据 OSEK-COM 分段标准）'
      hu: 'Folyamvezérlési állapot (az OSEK-COM szegmentálási szabvány szerint)'
      pt: 'Estado de fluxo (segundo a norma de segmentação OSEK-COM)'
    type: 'uint'

  BLOCK_SIZE:
    bits: '2.7-2.0'
    comment:
      en: 'Block size (per the OSEK-COM segmentation standard)'
      fr: 'Bloc Size (cf. norme de segmentation OSEK-COM)'
      es: 'Tamaño de bloque (según el estándar de segmentación OSEK-COM)'
      de: 'Blockgröße (gemäß dem OSEK-COM-Segmentierungsstandard)'
      it: 'Dimensione del blocco (secondo lo standard di segmentazione OSEK-COM)'
      pl: 'Rozmiar bloku (zgodnie ze standardem segmentacji OSEK-COM)'
      ru: 'Размер блока (согласно стандарту сегментации OSEK-COM)'
      zh: '块大小（依据 OSEK-COM 分段标准）'
      hu: 'Blokkméret (az OSEK-COM szegmentálási szabvány szerint)'
      pt: 'Tamanho de bloco (conforme a norma de segmentação OSEK-COM)'
    type: 'uint'

  MIN_SEPARATION_TIME:
    bits: '3.7-3.0'
    comment:
      en: 'Minimum separation time (per the OSEK-COM segmentation standard)'
      fr: 'Minimum Separation Time (cf. norme de segmentation OSEK-COM)'
      es: 'Tiempo mínimo de separación (según el estándar de segmentación OSEK-COM)'
