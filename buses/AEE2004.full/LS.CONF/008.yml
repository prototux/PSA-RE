      it: 'Tempo minimo di separazione (secondo lo standard di segmentazione OSEK-COM)'
      pl: 'Minimalny czas separacji (zgodnie ze standardem segmentacji OSEK-COM)'
      ru: 'Минимальный интервал разделения (согласно стандарту сегментации OSEK-COM)'
