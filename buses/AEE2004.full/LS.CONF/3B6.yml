id: 0x3B6
name: 'VIN_VDS'
alt_names: ['VIN_VDS']
type: 'can'
length: 6
comment:
  en: 'VIN = Vehicle Identification Number. VDS = Vehicle Description Section, VIN field describing the general characteristics of the vehicle.'
  fr: 'VIN = Vehicle Identification Number, numéro d''identification du véhicule. VDS = Vehicle Description Section, champ du VIN décrivant les caractéristiques générales du véhicule.'
  es: 'VIN = Vehicle Identification Number, número de identificación del vehículo. VDS = Vehicle Description Section, campo del VIN que describe las características generales del vehículo.'
  de: 'VIN = Vehicle Identification Number, Fahrzeug-Identifizierungsnummer. VDS = Vehicle Description Section, VIN-Feld mit den allgemeinen Fahrzeugmerkmalen.'
  it: 'VIN = Vehicle Identification Number, numero di identificazione del veicolo. VDS = Vehicle Description Section, campo del VIN che descrive le caratteristiche generali del veicolo.'
  pl: 'VIN = Vehicle Identification Number, numer identyfikacyjny pojazdu. VDS = Vehicle Description Section, pole VIN opisujące ogólne cechy pojazdu.'
  ru: 'VIN = Vehicle Identification Number, идентификационный номер автомобиля. VDS = Vehicle Description Section, поле VIN с общими характеристиками автомобиля.'
  zh: 'VIN = 车辆识别代号（Vehicle Identification Number）。VDS = 车辆描述段（Vehicle Description Section），VIN 中描述车辆一般特征的部分。'
  hu: 'VIN = Vehicle Identification Number, a jármű azonosító száma. VDS = Vehicle Description Section, a VIN azon mezője, amely a jármű általános jellemzőit írja le.'
  pt: 'VIN = Vehicle Identification Number (número de identificação do veículo). VDS = Vehicle Description Section, campo do VIN que descreve as características gerais do veículo.'
periodicity: ['1000ms']
senders: ['BSI', 'ICSV']
receivers: ['EMF', 'CDC', 'RAD', 'KML', 'MDS', 'BGP', 'ICSV']

