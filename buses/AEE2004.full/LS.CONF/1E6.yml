        pt: 'Não premido'
      0x01:
        en: 'Pressed'
        fr: 'Appuyé'
        es: 'Pulsado'
        de: 'Gedrückt'
        it: 'Premuto'
        pl: 'Wciśnięty'
        ru: 'Нажато'
        zh: '已按下'
        hu: 'Megnyomva'
        pt: 'Premido'

