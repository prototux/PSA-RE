id: 0x1E6
name: 'SAM_MODULE_COMMAND'
type: 'can'
length: 2
comment:
  en: 'Command frame for the SAM module: push-button, ambient light level, degradation status and forced-info request.'
  fr: 'Trame de commande du module SAM : bouton-poussoir, niveau de luminosité ambiante, état de dégradation et demande de forçage d''info.'
  es: 'Trama de comando del módulo SAM: pulsador, nivel de luz ambiente, estado de degradación y solicitud de forzado de información.'
  de: 'Befehlstelegramm für das SAM-Modul: Taster, Umgebungslichtstärke, Degradationsstatus und Anforderung zur Informationserzwingung.'
  it: 'Trama di comando del modulo SAM: pulsante, livello di luce ambientale, stato di degradazione e richiesta di forzatura informazioni.'
  pl: 'Ramka poleceń modułu SAM: przycisk, poziom oświetlenia otoczenia, stan degradacji i żądanie wymuszenia informacji.'
  ru: 'Кадр команд для модуля SAM: кнопка, уровень освещённости, статус деградации и запрос принудительной информации.'
  zh: 'SAM模块的命令帧:按钮、环境光水平、降级状态和强制信息请求。'
  hu: 'A SAM modul parancskerete: nyomógomb, környezeti fényszint, degradációs állapot és kényszerített infó kérése.'
  pt: 'Trama de comando para o módulo SAM: botão, nível de luz ambiente, estado de degradação e pedido de informação forçada.'
observations:
  en: 'On state change of: SAM_INFO_LEVEL_FORCE_REQUEST'
  fr: 'Sur changement d''état de : SAM_INFO_LEVEL_FORCE_REQUEST'
  es: 'Al cambiar el estado de: SAM_INFO_LEVEL_FORCE_REQUEST'
  de: 'Bei Statusänderung von: SAM_INFO_LEVEL_FORCE_REQUEST'
  it: 'Al cambiamento di stato di: SAM_INFO_LEVEL_FORCE_REQUEST'
  pl: 'Wysyłane przy zmianie stanu: SAM_INFO_LEVEL_FORCE_REQUEST'
  ru: 'При изменении состояния: SAM_INFO_LEVEL_FORCE_REQUEST'
  zh: '当DMD_FORCAGE_INFO_SAM状态变化时'
  hu: 'A(z) SAM_INFO_LEVEL_FORCE_REQUEST állapotváltozásakor'
  pt: 'Na mudança de estado de: SAM_INFO_LEVEL_FORCE_REQUEST'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['SAM']

signals:
  SAM_INFO_LEVEL_FORCE_REQUEST:
    bits: '1.7'
    comment:
      en: 'Information level forcing request'
      fr: 'Demande de forçage du niveau d''information'
      es: 'Solicitud de forzado del nivel de información'
      de: 'Anforderung zur Zwangssteuerung der Informationsebene'
      it: 'Richiesta di forzatura del livello di informazione'
      pl: 'Żądanie wymuszenia poziomu informacji'
      ru: 'Запрос принудительного уровня информации'
      zh: '信息等级强制请求'
      hu: 'Információs szint kényszerítésének kérése'
      pt: 'Pedido de forçagem do nível de informação'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
        en: 'Requested'
        fr: 'Demandé'
        es: 'Solicitado'
        de: 'Angefordert'
        it: 'Richiesto'
        pl: 'Żądane'
        ru: 'Запрошено'
        zh: '已请求'
        hu: 'Kérve'
        pt: 'Pedido'

  SAM_PUSH_BUTTON_STATE:
    bits: '1.6'
    comment:
      en: 'SAM push button pressed state'
      fr: 'État d''appui de la touche Push du SAM'
      es: 'Estado de pulsación del botón Push del SAM'
      de: 'Betätigungszustand der SAM-Push-Taste'
      it: 'Stato di pressione del pulsante Push del SAM'
      pl: 'Stan naciśnięcia przycisku Push modułu SAM'
      ru: 'Состояние нажатия кнопки Push модуля SAM'
      zh: 'SAM按压按钮状态'
      hu: 'SAM nyomógomb lenyomott állapota'
      pt: 'Estado de pressão da tecla Push do SAM'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Not pressed'
        fr: 'Pas d''appui'
        es: 'Sin pulsación'
        de: 'Nicht gedrückt'
        it: 'Non premuto'
        pl: 'Brak naciśnięcia'
        ru: 'Не нажато'
        zh: '未按下'
