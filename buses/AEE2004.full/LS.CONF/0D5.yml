id: 0x0D5
name: 'DRIVER_DOOR_LOCK_STATUS'
type: 'can'
length: 2
comment:
  en: 'Driver door lock status: external push-button request, lock/unlock conditions, internal/external switch contacts, central locking state, handle pull detection.'
  fr: 'État de la serrure de porte conducteur : demande par bouton poussoir extérieur, conditions de verrouillage/déverrouillage, contacts des contacteurs interne/externe, état de la condamnation centralisée, détection de tirage de poignée.'
  es: 'Estado de la cerradura de la puerta del conductor: solicitud por pulsador exterior, condiciones de bloqueo/desbloqueo, contactos de los interruptores interno/externo, estado del cierre centralizado, detección de tirón de la manija.'
  de: 'Status des Status des Fahrertürschlosses: Anforderung über Außentaster, Verriegelungs-/Entriegelungsbedingungen, Innen-/Außenschalterkontakte, Zentralverriegelungsstatus, Türgrifferkennung.'
  it: 'Stato della serratura della portiera conducente: richiesta tramite pulsante esterno, condizioni di blocco/sblocco, contatti degli interruttori interno/esterno, stato della chiusura centralizzata, rilevamento di trazione della maniglia.'
  pl: 'Stan zamka drzwi kierowcy: żądanie przyciskiem zewnętrznym, warunki blokady/odblokowania, styki przełączników wewnętrznego/zewnętrznego, stan centralnego zamka, wykrycie pociągnięcia klamki.'
  ru: 'Статус замка двери водителя: запрос внешней кнопкой, условия блокировки/разблокировки, контакты внутреннего/наружного выключателя, состояние центрального замка, обнаружение потягивания ручки.'
  zh: '驾驶员车门锁状态:外部按钮请求、锁止/解锁条件、内/外开关触点、中控锁状态、拉动门把手检测。'
  hu: 'A vezetőoldali ajtózár állapota: külső nyomógombos kérés, zárási/nyitási feltételek, belső/külső kapcsolóérintkezők, központi zár állapota, kilincshúzás érzékelése.'
  pt: 'Estado do fecho da porta do condutor: pedido do botão exterior, condições de trancagem/destrancagem, contactos dos comutadores interno/externo, estado da trancagem centralizada, deteção de puxar o puxador.'
periodicity: ['1000ms', 'trigger']
senders: ['EDP_C']
receivers: ['BSI']

