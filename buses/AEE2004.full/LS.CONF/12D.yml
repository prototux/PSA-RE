id: 0x12D
name: 'FRONT_CLIMATE_MOTOR_COMMAND'
type: 'can'
length: 8
comment:
  en: 'Control of the front climate-control module motors: blower, air-distribution and mix flaps, recirculation.'
  fr: 'Commande des moteurs du module de climatisation avant : pulseur, volets de distribution et de mélange, recyclage.'
  es: 'Control de los motores del módulo de climatización delantero: motor de ventilación, compuertas de distribución y mezcla, recirculación.'
  de: 'Ansteuerung der Motoren des vorderen Klimamoduls: Gebläse, Verteil- und Mischklappen, Umluft.'
  it: 'Controllo dei motori del modulo di climatizzazione anteriore: ventola, serrande di distribuzione e miscelazione, ricircolo.'
  pl: 'Sterowanie silnikami przedniego modułu klimatyzacji: dmuchawa, klapy rozdziału i mieszania, recyrkulacja.'
  ru: 'Управление моторами переднего модуля климат-контроля: вентилятор, заслонки распределения и смешивания, рециркуляция.'
  zh: '前排空调模块电机控制:鼓风机、风门分配及混合挡板、内循环。'
  hu: 'Az elülső klímamodul motorjainak vezérlése: fűtőventilátor, elosztó- és keverőlapok, recirkuláció.'
  pt: 'Comando dos motores do módulo de climatização dianteira: ventilador, comportas de distribuição de ar e de mistura, recirculação.'
observations:
  en: 'On state change of: LUCH_WARNING_LAMP. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : LUCH_WARNING_LAMP. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: LUCH_WARNING_LAMP. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: LUCH_WARNING_LAMP. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: LUCH_WARNING_LAMP. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: LUCH_WARNING_LAMP. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: LUCH_WARNING_LAMP. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当VOY_LUCH状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z) LUCH_WARNING_LAMP állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: LUCH_WARNING_LAMP. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['CLIM_AV']

