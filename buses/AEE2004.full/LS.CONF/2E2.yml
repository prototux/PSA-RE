name: 'CD_CHANGER_TEXT_DISPLAY_SEGMENT'
type: 'can'
length: 8
comment:
  en: 'ISO-TP segmented-transfer header for the CD changer text display (sequence number and frame length fields).'
  fr: 'En-tête de transfert segmenté ISO-TP pour CD changer text display (numéro de séquence et champs de longueur de trame).'
  es: 'Cabecera de transferencia segmentada ISO-TP para CD changer text display (número de secuencia y campos de longitud de trama).'
  de: 'ISO-TP-Segmentierungs-Header für CD changer text display (Sequenznummer und Rahmenlängenfelder).'
  it: 'Intestazione di trasferimento segmentato ISO-TP per CD changer text display (numero di sequenza e campi di lunghezza trama).'
  pl: 'Nagłówek transferu segmentowanego ISO-TP dla CD changer text display (numer sekwencyjny i pola długości ramki).'
  ru: 'Заголовок сегментированной передачи ISO-TP для CD changer text display (номер последовательности и поля длины кадра).'
  zh: '用于CD changer text display的ISO-TP分段传输报头(序列号和帧长度字段)。'
  hu: 'ISO-TP szegmentált átviteli fejléc a CD changer text display számára (sorszám és keret hosszmezők).'
  pt: 'Cabeçalho de transferência segmentada ISO-TP para a apresentação de texto do leitor de CD (campos de número de sequência e comprimento de trama).'
periodicity: ['trigger']
senders: []  # TODO: find the sender(s)

