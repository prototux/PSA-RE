id: 0x128
name: 'COMBINE_SIGNALS_INDICATORS'
type: 'can'
length: 8
comment:
  en: 'Instrument cluster indicator and signalling commands sent on change: pre-heat, door-opening alerts, ESP, suspension, parking aid, lights, indicators, gearbox mode, colour/personalisation and passenger seat fault.'
  fr: 'Commandes de signalisation et voyants du combiné envoyées sur changement : préchauffage, alertes ouverture de porte, ESP, suspension, aide au stationnement, feux, clignotants, mode boîte, couleur/personnalisation et défaut siège passager.'
  es: 'Órdenes de señalización y testigos del cuadro enviadas al cambiar: precalentamiento, alertas de apertura de puerta, ESP, suspensión, ayuda al aparcamiento, luces, intermitentes, modo de caja, color/personalización y fallo del asiento del pasajero.'
  de: 'Signalisierungs- und Kontrollleuchtenbefehle des Kombiinstruments, gesendet bei Änderung: Vorglühen, Türöffnungswarnungen, ESP, Federung, Einparkhilfe, Licht, Blinker, Getriebemodus, Farbe/Personalisierung und Beifahrersitzfehler.'
  it: 'Comandi di segnalazione e spie del quadro strumenti inviati al cambio: preriscaldo, allarmi apertura porta, ESP, sospensione, assistenza al parcheggio, luci, indicatori di direzione, modalità cambio, colore/personalizzazione e guasto sedile passeggero.'
  pl: 'Polecenia sygnalizacyjne i kontrolek zestawu wskaźników wysyłane przy zmianie: podgrzewanie wstępne, alerty otwarcia drzwi, ESP, zawieszenie, wspomaganie parkowania, światła, kierunkowskazy, tryb skrzyni biegów, kolor/personalizacja i usterka fotela pasażera.'
  ru: 'Сигнальные команды и индикаторы приборной панели, отправляемые при изменении: предпрогрев, предупреждения об открытии двери, ESP, подвеска, парковочный ассистент, свет, указатели поворота, режим коробки передач, цвет/персонализация и неисправность пассажирского сиденья.'
  zh: '仪表组信号与指示灯命令，状态变化时发送：预热、车门打开警报、ESP、悬挂、泊车辅助、灯光、转向灯、变速箱模式、颜色/个性化及乘客座椅故障。'
  hu: 'A műszerfal jelző- és figyelmeztetőlámpa-parancsai, változáskor küldve: előfűtés, ajtónyitási riasztások, ESP, futómű, parkolássegítő, világítás, index, váltó üzemmód, szín/személyre szabás és utasülés-hiba.'
  pt: 'Comandos de avisadores e sinalização do quadrante de instrumentos enviados na mudança: pré-aquecimento, alertas de abertura de porta, ESP, suspensão, ajuda ao estacionamento, luzes, piscas, modo da caixa de velocidades, cor/personalização e avaria do banco do passageiro.'
observations:
  en: 'On state change of: ABPI, PREHEAT, DOORS_1, DOORS_2, CHILD_SAFETY, ESPI, ESPACT, SUSP, AUTOPARK, MPD, SIDELIGHTS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN, ODOMETER_STATUS, LUCH, GEARBOX_MODE, COLOR_CHANGE, CUSTOMIZATION, FRPK, SAFETY_FAULT, OUCC, OUCP, DAYLIGHTS. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : ABPI, PREHEAT, DOORS_1, DOORS_2, CHILD_SAFETY, ESPI, ESPACT, SUSP, AUTOPARK, MPD, SIDELIGHTS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN, ODOMETER_STATUS, LUCH, GEARBOX_MODE, COLOR_CHANGE, CUSTOMIZATION, FRPK, SAFETY_FAULT, OUCC, OUCP, DAYLIGHTS. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: ABPI, PREHEAT, DOORS_1, DOORS_2, CHILD_SAFETY, ESPI, ESPACT, SUSP, AUTOPARK, MPD, SIDELIGHTS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN, ODOMETER_STATUS, LUCH, GEARBOX_MODE, COLOR_CHANGE, CUSTOMIZATION, FRPK, SAFETY_FAULT, OUCC, OUCP, DAYLIGHTS. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: ABPI, PREHEAT, DOORS_1, DOORS_2, CHILD_SAFETY, ESPI, ESPACT, SUSP, AUTOPARK, MPD, SIDELIGHTS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN, ODOMETER_STATUS, LUCH, GEARBOX_MODE, COLOR_CHANGE, CUSTOMIZATION, FRPK, SAFETY_FAULT, OUCC, OUCP, DAYLIGHTS. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: ABPI, PREHEAT, DOORS_1, DOORS_2, CHILD_SAFETY, ESPI, ESPACT, SUSP, AUTOPARK, MPD, SIDELIGHTS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN, ODOMETER_STATUS, LUCH, GEARBOX_MODE, COLOR_CHANGE, CUSTOMIZATION, FRPK, SAFETY_FAULT, OUCC, OUCP, DAYLIGHTS. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: ABPI, PREHEAT, DOORS_1, DOORS_2, CHILD_SAFETY, ESPI, ESPACT, SUSP, AUTOPARK, MPD, SIDELIGHTS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN, ODOMETER_STATUS, LUCH, GEARBOX_MODE, COLOR_CHANGE, CUSTOMIZATION, FRPK, SAFETY_FAULT, OUCC, OUCP, DAYLIGHTS. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: ABPI, PREHEAT, DOORS_1, DOORS_2, CHILD_SAFETY, ESPI, ESPACT, SUSP, AUTOPARK, MPD, SIDELIGHTS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN, ODOMETER_STATUS, LUCH, GEARBOX_MODE, COLOR_CHANGE, CUSTOMIZATION, FRPK, SAFETY_FAULT, OUCC, OUCP, DAYLIGHTS. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当ABPI, PREHEAT, DOORS_1, DOORS_2, CHILD_SAFETY, ESPI, ESPACT, SUSP, AUTOPARK, MPD, SIDELIGHTS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN, ODOMETER_STATUS, LUCH, GEARBOX_MODE, COLOR_CHANGE, CUSTOMIZATION, FRPK, SAFETY_FAULT, OUCC, OUCP, DAYLIGHTS, STOP_DISPONIBLE状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z) ABPI, PREHEAT, DOORS_1, DOORS_2, CHILD_SAFETY, ESPI, ESPACT, SUSP, AUTOPARK, MPD, SIDELIGHTS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN, ODOMETER_STATUS, LUCH, GEARBOX_MODE, COLOR_CHANGE, CUSTOMIZATION, FRPK, SAFETY_FAULT, OUCC, OUCP, DAYLIGHTS állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: ABPI, PREHEAT, DOORS_1, DOORS_2, CHILD_SAFETY, ESPI, ESPACT, SUSP, AUTOPARK, MPD, SIDELIGHTS, LOW_BEAM, FULL_BEAM, FRONT_FOG_LIGHTS, RIGHT_TURN, LEFT_TURN, ODOMETER_STATUS, LUCH, GEARBOX_MODE, COLOR_CHANGE, CUSTOMIZATION, FRPK, SAFETY_FAULT, OUCC, OUCP, DAYLIGHTS. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
