id: 0x290
name: 'REAR_AIR_CONDITIONING_STATUS'
type: 'can'
length: 3
comment:
  en: 'Rear air conditioning display status: fault, air distribution, off mode and blower speed.'
  fr: 'État d''affichage de la climatisation arrière : défaut, distribution d''air, mode arrêt et vitesse de pulseur.'
  es: 'Estado de visualización de la climatización trasera: fallo, distribución de aire, modo apagado y velocidad de ventilador.'
  de: 'Anzeigestatus der hinteren Klimaanlage: Fehler, Luftverteilung, Aus-Modus und Gebläsedrehzahl.'
  it: 'Stato di visualizzazione del climatizzatore posteriore: guasto, distribuzione dell''aria, modalità off e velocità ventola.'
  pl: 'Stan wyświetlania klimatyzacji tylnej: usterka, dystrybucja powietrza, tryb wyłączenia i prędkość dmuchawy.'
  ru: 'Статус дисплея заднего климат-контроля: неисправность, распределение воздуха, режим выключения и скорость вентилятора.'
  zh: '后排空调显示状态:故障、气流分配、关闭模式及风扇速度。'
  hu: 'A hátsó klíma kijelzési állapota: hiba, légelosztás, kikapcsolt mód és ventilátorsebesség.'
  pt: 'Estado de apresentação da climatização traseira: avaria, distribuição de ar, modo desligado e velocidade do ventilador.'
observations:
  en: 'On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['200ms', 'trigger']
senders: ['CLIM_AR']
receivers: ['BSI']

