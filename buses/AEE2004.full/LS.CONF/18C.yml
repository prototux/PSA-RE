id: 0x18C
name: 'SEATBELT_REMINDER_SEQUENCE_STATE'
type: 'can'
length: 2
comment:
  en: 'End-of-sequence states for the driver, passenger and rear seatbelt reminder.'
  fr: 'États de fin de séquence du rappel de ceinture conducteur, passager et arrière.'
  es: 'Estados de fin de secuencia del recordatorio de cinturón del conductor, pasajero y trasero.'
  de: 'Sequenzende-Zustände der Gurtwarnung für Fahrer, Beifahrer und Fond.'
  it: 'Stati di fine sequenza del promemoria cintura conducente, passeggero e posteriore.'
  pl: 'Stany zakończenia sekwencji przypomnienia o pasach kierowcy, pasażera i tylnych.'
  ru: 'Состояния завершения последовательности напоминания о ремне для водителя, пассажира и заднего ряда.'
  zh: '驾驶员、乘客及后排安全带提醒的序列结束状态。'
  hu: 'A vezető, az utas és a hátsó övemlékeztető szekvenciavégi állapotai.'
  pt: 'Estados de fim de sequência do aviso de cinto de segurança do condutor, passageiro e traseiro.'
periodicity: ['100ms', 'trigger']
senders: ['BSI']
receivers: ['EDP_C', 'MDPLC']

