id: 0x28C
name: 'MIRROR_COMMAND_LEFT'
type: 'can'
length: 5
comment:
  en: 'Left mirror commands sent by the BSI: auto-return, electric adjustment control, memory index and fold/defrost/movement states.'
  fr: 'Commandes du rétroviseur gauche envoyées par la BSI : rappel automatique, commande de réglage électrique, index mémoire et états de rabattement/dégivrage/mouvement.'
  es: 'Órdenes del espejo izquierdo enviadas por la BSI: retorno automático, orden de ajuste eléctrico, índice de memoria y estados de plegado/desempañado/movimiento.'
  de: 'Linke Spiegelbefehle, von der BSI gesendet: automatische Rückstellung, elektrische Verstellsteuerung, Speicherindex und Klapp-/Enteisungs-/Bewegungszustände.'
  it: 'Comandi dello specchietto sinistro inviati dalla BSI: ritorno automatico, comando di regolazione elettrica, indice memoria e stati di ripiegamento/sbrinamento/movimento.'
  pl: 'Polecenia lewego lusterka wysyłane przez BSI: automatyczny powrót, sterowanie regulacją elektryczną, indeks pamięci i stany składania/odszraniania/ruchu.'
  ru: 'Команды левого зеркала, отправляемые BSI: автоматический возврат, управление электрорегулировкой, индекс памяти и состояния складывания/обогрева/движения.'
  zh: '由BSI发送的左侧后视镜命令：自动回位、电动调节控制、记忆索引及折叠/除霜/运动状态。'
  hu: 'A bal tükör parancsai, a BSI küldi: automatikus visszaállítás, elektromos állítás vezérlése, memóriaindex és behajtási/fűtési/mozgási állapotok.'
  pt: 'Comandos do espelho esquerdo enviados pela BSI: retorno automático, comando de ajuste elétrico, índice de memória e estados de dobragem/descongelamento/movimento.'
periodicity: ['100ms', 'trigger']
senders: ['BSI']
receivers: ['EDP_C']

