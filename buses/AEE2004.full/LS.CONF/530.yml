id: 0x530
name: 'VTH_SUPERVISION'
type: 'can'
length: 8
comment:
  en: 'Network supervision: diagnostic session, network management state and communication fault counters'
  fr: 'Supervision réseau : session de diagnostic, état de gestion réseau et compteurs de défauts de communication'
  es: 'Supervisión de red: sesión de diagnóstico, estado de gestión de red y contadores de fallos de comunicación'
  de: 'Netzwerküberwachung: Diagnosesitzung, Netzwerkmanagement-Status und Kommunikationsfehlerzähler'
  it: 'Supervisione rete: sessione diagnostica, stato di gestione rete e contatori di errori di comunicazione'
  pl: 'Nadzór sieci: sesja diagnostyczna, stan zarządzania siecią i liczniki błędów komunikacji'
  ru: 'Супервизия сети: диагностическая сессия, состояние сетевого управления и счётчики ошибок связи'
  zh: '网络监控:诊断会话、网络管理状态及通信故障计数器'
  hu: 'Hálózatfelügyelet: diagnosztikai munkamenet, hálózatkezelési állapot és kommunikációs hibaszámlálók'
  pt: 'Supervisão de rede: sessão de diagnóstico, estado da gestão de rede e contadores de avarias de comunicação.'
periodicity: ['1000ms']
senders: ['VTH']

signals:
  UNUSED_1:
    bits: '1.7-1.6'
    unused: true

  COM_LOSS_FAULT:
    bits: '1.5'
    comment:
      en: 'Communication loss fault.'
      fr: 'Défaut de perte de communication.'
      es: 'Fallo de pérdida de comunicación.'
      de: 'Kommunikationsverlustfehler.'
      it: 'Guasto di perdita di comunicazione.'
      pl: 'Usterka utraty komunikacji.'
      ru: 'Неисправность потери связи.'
      zh: '通信丢失故障。'
      hu: 'Kommunikációvesztési hiba.'
      pt: 'Falha de perda de comunicação.'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No fault'
        fr: 'Pas de défaut'
        es: 'Sin fallo'
        de: 'Kein Fehler'
        it: 'Nessun guasto'
        pl: 'Brak usterki'
        ru: 'Нет неисправности'
        zh: '无故障'
        hu: 'Nincs hiba'
        pt: 'Sem avaria'
      0x01:
        en: 'Fault present'
        fr: 'Défaut présent'
        es: 'Fallo presente'
        de: 'Fehler vorhanden'
        it: 'Guasto presente'
        pl: 'Obecna usterka'
        ru: 'Неисправность присутствует'
        zh: '存在故障'
        hu: 'Hiba jelen van'
        pt: 'Falha presente'

  NERR_BIT_STATUS:
    bits: '1.4'
    comment:
      en: 'NERR (network error) bit status.'
      fr: 'État du bit NERR (défaut réseau).'
      es: 'Estado del bit NERR (error de red).'
      de: 'Status des NERR-Bits (Netzwerkfehler).'
      it: 'Stato del bit NERR (errore di rete).'
      pl: 'Stan bitu NERR (błąd sieci).'
      ru: 'Состояние бита NERR (сетевая ошибка).'
      zh: 'NERR（网络错误）位状态。'
      hu: 'A NERR (hálózati hiba) bit állapota.'
      pt: 'Estado do bit NERR (falha de rede).'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No fault'
        fr: 'Pas de défaut'
        es: 'Sin fallo'
        de: 'Kein Fehler'
        it: 'Nessun guasto'
        pl: 'Brak usterki'
        ru: 'Нет неисправности'
        zh: '无故障'
        hu: 'Nincs hiba'
        pt: 'Sem avaria'
      0x01:
        en: 'Fault present'
        fr: 'Défaut présent'
        es: 'Fallo presente'
        de: 'Fehler vorhanden'
        it: 'Guasto presente'
        pl: 'Obecna usterka'
        ru: 'Неисправность присутствует'
        zh: '存在故障'
        hu: 'Hiba jelen van'
        pt: 'Falha presente'

  SUPERVISION_TASK_STATE:
    bits: '1.3'
    comment:
      en: 'Network supervision task state.'
      fr: 'État de la tâche de supervision réseau.'
      es: 'Estado de la tarea de supervisión de red.'
      de: 'Status der Netzwerküberwachungsaufgabe.'
      it: 'Stato dell''attività di supervisione di rete.'
      pl: 'Stan zadania nadzoru sieci.'
      ru: 'Состояние задачи сетевого контроля.'
      zh: '网络监控任务状态。'
      hu: 'A hálózatfelügyeleti feladat állapota.'
      pt: 'Estado da tarefa de supervisão de rede.'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'NM disabled'
        fr: 'NM inactive'
        es: 'NM desactivado'
        de: 'NM deaktiviert'
        it: 'NM disattivato'
        pl: 'NM dezaktywowany'
        ru: 'NM отключён'
        zh: 'NM已停用'
        hu: 'NM kikapcsolva'
        pt: 'NM desativado'
      0x01:
        en: 'NM enabled'
        fr: 'NM activé'
        es: 'NM activado'
        de: 'NM aktiviert'
        it: 'NM attivo'
        pl: 'NM aktywne'
        ru: 'NM активен'
        zh: 'NM已启用'
        hu: 'NM aktiválva'
        pt: 'NM ativado'

  FUNCTIONAL_DEGRADED_MODE:
    bits: '1.2'
    comment:
      en: 'System operating in functional degraded mode.'
      fr: 'Organe en mode dégradé fonctionnel.'
      es: 'Unidad en modo degradado funcional.'
      de: 'Steuergerät im funktionalen Notlaufmodus.'
      it: 'Unità in modalità degradata funzionale.'
      pl: 'Jednostka w trybie ograniczonym funkcjonalnie.'
      ru: 'Блок работает в функциональном деградированном режиме.'
      zh: '系统处于功能降级模式。'
      hu: 'Az egység funkcionális korlátozott üzemmódban van.'
      pt: 'Unidade em modo degradado funcional'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Normal mode'
        fr: 'Mode normal'
        es: 'Modo normal'
        de: 'Normalmodus'
        it: 'Modalità normale'
        pl: 'Tryb normalny'
        ru: 'Обычный режим'
        zh: '正常模式'
        hu: 'Normál üzemmód'
        pt: 'Modo normal'
      0x01:
        en: 'Degraded mode'
        fr: 'Mode dégradé'
        es: 'Modo degradado'
        de: 'Notlaufmodus'
        it: 'Modalità degradata'
        pl: 'Tryb awaryjny'
        ru: 'Аварийный режим'
        zh: '降级模式'
        hu: 'Korlátozott üzemmód'
        pt: 'Modo degradado'

  UNDER_DIAGNOSIS_SESSION:
    bits: '1.1'
    comment:
      en: 'System currently under a diagnostic session.'
      fr: 'Organe sous session de diagnostic.'
      es: 'Unidad en sesión de diagnóstico.'
      de: 'Steuergerät befindet sich in einer Diagnosesitzung.'
      it: 'Unità sotto sessione di diagnosi.'
      pl: 'Jednostka w trakcie sesji diagnostycznej.'
      ru: 'Блок находится в диагностической сессии.'
      zh: '系统处于诊断会话中。'
      hu: 'Az egység diagnosztikai munkamenetben van.'
      pt: 'Unidade em sessão de diagnóstico'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Outside diagnosis'
        fr: 'Hors diagnostic'
        es: 'Fuera de diagnóstico'
        de: 'Außerhalb der Diagnose'
        it: 'Fuori diagnosi'
        pl: 'Poza diagnostyką'
        ru: 'Вне диагностики'
        zh: '诊断之外'
        hu: 'Diagnosztikán kívül'
        pt: 'Fora do diagnóstico'
      0x01:
        en: 'Under diagnosis'
        fr: 'En sous-diagnostic'
        es: 'En subdiagnóstico'
        de: 'In Diagnose'
        it: 'In sottodiagnosi'
        pl: 'W trybie diagnostyki'
        ru: 'В диагностике'
        zh: '诊断中'
        hu: 'Diagnosztika alatt'
        pt: 'Em diagnóstico'

  DIAGNOSTIC_SESSION_ACTIVE:
    bits: '1.0'
    comment:
      en: 'System currently performing a diagnostic activity.'
      fr: 'Organe en cours d''activité de diagnostic.'
      es: 'Unidad en actividad de diagnóstico.'
      de: 'Steuergerät führt gerade eine Diagnoseaktivität aus.'
      it: 'Unità attualmente in attività di diagnosi.'
      pl: 'Jednostka aktualnie wykonuje czynność diagnostyczną.'
      ru: 'Блок в данный момент выполняет диагностическую операцию.'
      zh: '系统正在执行诊断活动。'
      hu: 'Az egység diagnosztikai tevékenységet végez.'
      pt: 'Unidade em atividade de diagnóstico.'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Diagnostics not active'
        fr: 'Hors activité de diagnostic'
        es: 'Diagnóstico no activo'
        de: 'Diagnose nicht aktiv'
        it: 'Diagnosi non attiva'
        pl: 'Diagnostyka nieaktywna'
        ru: 'Диагностика неактивна'
        zh: '诊断未激活'
        hu: 'Diagnosztika nem aktív'
        pt: 'Fora de atividade de diagnóstico'
      0x01:
        en: 'Diagnosis in progress'
        fr: 'En activité diagnostic'
        es: 'Diagnóstico en curso'
        de: 'Diagnose läuft'
        it: 'Diagnosi in corso'
        pl: 'Trwa diagnostyka'
        ru: 'Идёт диагностика'
        zh: '诊断进行中'
        hu: 'Diagnosztika folyamatban'
        pt: 'Em atividade de diagnóstico'

  HDC_NERR_FAULT_COUNTER_VALUE:
    bits: '2.7-2.0'
    comment:
      en: 'Value of the NERR fault counter according to the line diagnosis.'
      fr: 'Valeur du compteur de défauts NERR selon le diagnostic de ligne.'
      es: 'Valor del contador de fallos NERR según el diagnóstico de línea.'
      de: 'Wert des Fehlerzählers NERR gemäß der Leitungsdiagnose.'
      it: 'Valore del contatore di guasti NERR secondo la diagnosi di linea.'
      pl: 'Wartość licznika usterek NERR zgodnie z diagnostyką linii.'
      ru: 'Значение счётчика неисправностей NERR по результатам диагностики линии.'
      zh: '根据线路诊断得出的C_DEF_NERR故障计数器值。'
      hu: 'A NERR hibaszámláló értéke a vonaldiagnosztika szerint.'
      pt: 'Valor do contador de falhas NERR de acordo com o diagnóstico de linha.'
    type: 'uint'
    min: 0
    max: 255

  HDC_N_AS_COUNTER:
    bits: '3.7-3.0'
    comment:
      en: 'Rolling counter incremented by 1 at each "message not sent" detection, after 1 attempt on the N_As timeout; reset to 0 at initialization.'
      fr: 'Compteur tournant incrémenté de 1 à chaque détection "message non émis" après 1 tentative sur timeout N_As, initialisé à 0.'
      es: 'Contador rotativo incrementado en 1 en cada detección de "mensaje no emitido" tras 1 intento con tiempo de espera N_As, inicializado a 0.'
      de: 'Umlaufzähler, der bei jeder Erkennung von "Nachricht nicht gesendet" nach 1 Versuch beim N_As-Timeout um 1 erhöht wird, bei Initialisierung auf 0 gesetzt.'
      it: 'Contatore a rotazione incrementato di 1 a ogni rilevamento di "messaggio non inviato" dopo 1 tentativo sul timeout N_As, inizializzato a 0.'
      pl: 'Licznik cykliczny zwiększany o 1 przy każdym wykryciu "niewysłanej wiadomości" po 1 próbie w czasie oczekiwania N_As, zerowany przy inicjalizacji.'
      ru: 'Циклический счётчик, увеличивающийся на 1 при каждом обнаружении "неотправленного сообщения" после 1 попытки по тайм-ауту N_As, обнуляется при инициализации.'
      zh: '每次检测到"消息未发送"（N_As超时尝试1次后）时递增1的循环计数器，初始化时清零。'
      hu: 'Minden "nem küldött üzenet" észlelésnél 1-gyel növekvő körforgó számláló (N_As időtúllépés 1 kísérlet után), inicializáláskor 0-ra áll.'
      pt: 'Contador rotativo incrementado em 1 a cada deteção de "mensagem não emitida" após 1 tentativa com tempo de espera N_As esgotado, reiniciado a 0 na inicialização'
    type: 'uint'
    min: 0
    max: 255
    default: 0x00

  HDC_BUS_OFF_COUNTER:
    bits: '4.7-4.0'
    comment:
      en: 'Rolling counter incremented by 1 at each "bus-off" fault, reset to 0 at initialization.'
      fr: 'Compteur tournant incrémenté de 1 à chaque défaut "bus-off", initialisé à 0.'
      es: 'Contador rotativo incrementado en 1 en cada fallo "bus-off", inicializado a 0.'
      de: 'Umlaufzähler, der bei jedem "Bus-off"-Fehler um 1 erhöht wird, bei Initialisierung auf 0 gesetzt.'
      it: 'Contatore a rotazione incrementato di 1 a ogni guasto "bus-off", inizializzato a 0.'
      pl: 'Licznik cykliczny zwiększany o 1 przy każdym błędzie "bus-off", zerowany przy inicjalizacji.'
      ru: 'Циклический счётчик, увеличивающийся на 1 при каждой ошибке "bus-off", обнуляется при инициализации.'
      zh: '每次发生"总线关闭"故障时递增1的循环计数器，初始化时清零。'
      hu: 'Minden "bus-off" hibánál 1-gyel növekvő körforgó számláló, inicializáláskor 0-ra áll.'
      pt: 'Contador rotativo incrementado em 1 a cada falha "bus-off", reiniciado a 0 na inicialização'
    type: 'uint'
    min: 0
    max: 255
    default: 0x00

  HDC_COM_LOSS_COUNTER:
    bits: '5.7-5.0'
    comment:
      en: 'Rolling counter incremented by 1 at each "communication loss" transition, reset to 0 at initialization.'
      fr: 'Compteur tournant incrémenté de 1 à chaque transition "perte de communication", initialisé à 0.'
      es: 'Contador rotativo incrementado en 1 en cada transición de "pérdida de comunicación", inicializado a 0.'
      de: 'Umlaufzähler, der bei jedem Übergang "Kommunikationsverlust" um 1 erhöht wird, bei Initialisierung auf 0 gesetzt.'
      it: 'Contatore a rotazione incrementato di 1 a ogni transizione di "perdita di comunicazione", inizializzato a 0.'
      pl: 'Licznik cykliczny zwiększany o 1 przy każdej zmianie stanu "utraty komunikacji", zerowany przy inicjalizacji.'
      ru: 'Циклический счётчик, увеличивающийся на 1 при каждом переходе "потеря связи", обнуляется при инициализации.'
      zh: '每次"通信丢失"状态转变时递增1的循环计数器，初始化时清零。'
      hu: 'Minden "kommunikációvesztés" átmenetnél 1-gyel növekvő körforgó számláló, inicializáláskor 0-ra áll.'
      pt: 'Contador rotativo incrementado em 1 a cada transição de "perda de comunicação", reiniciado a 0 na inicialização'
    type: 'uint'
    min: 0
    max: 255
    default: 0x00

  ABSENT_VTH:
    bits: '6.7-6.2'
    comment:
      en: 'Absent computer(s) supervised by HUD.'
      fr: 'Calculateur(s) supervisé(s) absent(s) détecté(s) par HUD.'
      es: 'Ordenador(es) supervisado(s) ausente(s) detectado(s) por HUD.'
      de: 'Von HUD als fehlend erkannte(s) überwachte(s) Steuergerät(e).'
      it: 'Centralina/e supervisionata/e rilevata/e assente/i da HUD.'
      pl: 'Sterownik(i) nadzorowany(e) wykryty(e) jako nieobecny(e) przez HUD.'
      ru: 'Контролируемый(е) блок(и) управления, отсутствие которых обнаружено модулем HUD.'
      zh: '由VTH监测到缺失的受监控控制单元。'
      hu: 'A(z) HUD által hiányzóként észlelt felügyelt vezérlőegység(ek).'
      pt: 'Unidade(s) de controlo supervisionada(s) ausente(s), detetada(s) por HUD'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'No control unit absent'
        fr: 'Pas de calculateur absent'
        es: 'Ninguna centralita ausente'
        de: 'Kein Steuergerät fehlt'
        it: 'Nessuna centralina assente'
        pl: 'Brak nieobecnego sterownika'
        ru: 'Отсутствующих блоков управления нет'
        zh: '无缺失的控制单元'
        hu: 'Nincs hiányzó vezérlőegység'
        pt: 'Nenhuma centralina ausente'
      0x12:
        en: 'Body computer absent'
        fr: 'BSI absent'
        es: 'BSI ausente'
        de: 'BSI nicht vorhanden'
        it: 'BSI assente'
        pl: 'Brak BSI'
        ru: 'BSI отсутствует'
        zh: '车身控制器缺失'
        hu: 'A BSI hiányzik'
        pt: 'Computador de servidão ausente'

  UNUSED_2:
    bits: '6.1-7.4'
    unused: true

  UNUSED_3:
    bits: '7.3-8.6'
    unused: true

  UNUSED_4:
    bits: '8.5-8.0'
    unused: true
