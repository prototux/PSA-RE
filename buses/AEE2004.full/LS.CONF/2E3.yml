    mux_selector: true
    values:
      0x00:
        en: 'None'
        fr: 'Aucun'
        es: 'Ninguno'
        de: 'Keine'
        it: 'Nessuno'
        pl: 'Brak'
        ru: 'Нет'
        zh: '无'
        hu: 'Nincs'
