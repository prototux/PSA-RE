id: 0x2E3
name: 'USB_ARTIST_LIST'
type: 'can-tp'
comment:
  en: 'Family of frames sharing this ID: the content depends on USB_LIST_TYPE'
  fr: 'Famille de trames partageant cet identifiant : le contenu dépend de USB_LIST_TYPE'
  es: 'Familia de tramas que comparten este identificador: el contenido depende de USB_LIST_TYPE'
  de: 'Familie von Botschaften mit dieser ID: der Inhalt hängt von USB_LIST_TYPE ab'
  it: 'Famiglia di frame che condividono questo ID: il contenuto dipende da USB_LIST_TYPE'
  pl: 'Rodzina ramek o tym samym identyfikatorze: zawartość zależy od USB_LIST_TYPE'
  ru: 'Семейство кадров с этим идентификатором: содержимое зависит от USB_LIST_TYPE'
  zh: '共用此ID的一组帧：内容取决于USB_LIST_TYPE'
  hu: 'Ezt az azonosítót megosztó keretcsalád: a tartalom a(z) USB_LIST_TYPE értékétől függ'
  pt: 'Família de tramas que partilham este identificador: o conteúdo depende de USB_LIST_TYPE'
periodicity: ['trigger']
senders: ['RAD', 'KML', 'ICSV']
receivers: ['CMB', 'EMF']
isotp:
  flow_control_id: 0x15F

signals:
  USB_LIST_TYPE:
    bits: '1.7-1.4'
    comment:
      en: 'Type of list to display (directory, artist, genre, playlist)'
      fr: 'Type de liste à afficher (répertoire, artiste, genre, playlist)'
      es: 'Tipo de lista a mostrar (directorio, artista, género, lista de reproducción)'
      de: 'Anzuzeigender Listentyp (Verzeichnis, Künstler, Genre, Playlist)'
      it: 'Tipo di elenco da visualizzare (cartella, artista, genere, playlist)'
      pl: 'Rodzaj listy do wyświetlenia (katalog, wykonawca, gatunek, playlista)'
      ru: 'Тип отображаемого списка (каталог, исполнитель, жанр, плейлист)'
      zh: '待显示的列表类型(目录、艺术家、流派、播放列表)'
      hu: 'A megjelenítendő lista típusa (könyvtár, előadó, műfaj, lejátszási lista)'
      pt: 'Tipo de lista a mostrar (diretório, artista, género, lista de reprodução)'
