id: 0x1A5
name: 'RADIO_STATUS_VOLUME'
type: 'can'
length: 1
comment:
  en: 'Radio volume level and its origin (source that set it).'
  fr: 'Niveau de volume de l''autoradio et son origine (source l''ayant réglé).'
  es: 'Nivel de volumen de la radio y su origen (fuente que lo ajustó).'
  de: 'Lautstärkepegel des Radios und dessen Ursprung (Quelle, die ihn eingestellt hat).'
  it: 'Livello del volume della radio e la sua origine (sorgente che lo ha impostato).'
  pl: 'Poziom głośności radia i jego źródło (źródło, które go ustawiło).'
  ru: 'Уровень громкости радио и его источник (источник, установивший его).'
  zh: '收音机音量级别及其来源(设置该音量的信源)。'
  hu: 'A rádió hangerőszintje és annak eredete (a beállító forrás).'
  pt: 'Nível de volume da rádio e a sua origem (fonte que o definiu).'
periodicity: ['500ms', 'trigger']
senders: ['RAD', 'BTEL', 'ICSV']
receivers: ['EMF', 'AMPLI', 'CMB', 'ICSV']

