id: 0x26D
name: 'STEERING_BRAKE_COUPLING_DATA'
type: 'can'
length: 5
comment:
  en: 'Rear climate mixing and blower motor setpoints, sent by the BSI.'
  fr: 'Consignes des moteurs de mixage et de pulseur de la climatisation arrière, envoyées par la BSI.'
  es: 'Consignas de los motores de mezcla y de ventilador de la climatización trasera, enviadas por la BSI.'
  de: 'Sollwerte der Mischer- und Gebläsemotoren der Fondklimatisierung, von der BSI gesendet.'
  it: 'Setpoint dei motori di miscelazione e ventola della climatizzazione posteriore, inviati dalla BSI.'
  pl: 'Zadane wartości silników mieszania i dmuchawy tylnej klimatyzacji, wysyłane przez BSI.'
  ru: 'Заданные значения моторов смешения и вентилятора задней климатической установки, отправляемые BSI.'
  zh: '由BSI发送的后排空调混风电机及鼓风机设定值。'
  hu: 'A hátsó klíma keverő- és fúvómotorjainak alapjelei, a BSI küldi.'
  pt: 'Pontos de ajuste do motor de mistura e do ventilador da climatização traseira, enviados pela BSI.'
observations:
  en: 'On state change of: REAR_LEFT_BLOWER_SETPOINT, REAR_RIGHT_BLOWER_SETPOINT. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : REAR_LEFT_BLOWER_SETPOINT, REAR_RIGHT_BLOWER_SETPOINT. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: REAR_LEFT_BLOWER_SETPOINT, REAR_RIGHT_BLOWER_SETPOINT. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: REAR_LEFT_BLOWER_SETPOINT, REAR_RIGHT_BLOWER_SETPOINT. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: REAR_LEFT_BLOWER_SETPOINT, REAR_RIGHT_BLOWER_SETPOINT. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: REAR_LEFT_BLOWER_SETPOINT, REAR_RIGHT_BLOWER_SETPOINT. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: REAR_LEFT_BLOWER_SETPOINT, REAR_RIGHT_BLOWER_SETPOINT. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当CONS_PULSEUR_ARG, CONS_PULSEUR_ARD状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z) REAR_LEFT_BLOWER_SETPOINT, REAR_RIGHT_BLOWER_SETPOINT állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: REAR_LEFT_BLOWER_SETPOINT, REAR_RIGHT_BLOWER_SETPOINT. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['CLIM_AV']

signals:
  REAR_LEFT_BLOWER_SETPOINT:
    bits: '1.7-1.0'
    comment:
      en: 'Rear left blower setpoint'
      fr: 'Consigne du pulseur arrière gauche'
      es: 'Consigna del ventilador trasero izquierdo'
      de: 'Sollwert des Gebläses hinten links'
      it: 'Valore di riferimento del ventilatore posteriore sinistro'
      pl: 'Wartość zadana dmuchawy tylnej lewej'
      ru: 'Заданное значение вентилятора сзади слева'
      zh: '左后鼓风机设定值'
      hu: 'Hátsó bal fűtőventilátor alapérték'
      pt: 'Consigna do ventilador traseiro esquerdo'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0xFF
    default: 0xFF

  REAR_RIGHT_BLOWER_SETPOINT:
    bits: '2.7-2.0'
    comment:
      en: 'Rear right blower setpoint'
      fr: 'Consigne du pulseur arrière droit'
