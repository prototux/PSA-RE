id: 0x16D
name: 'CLIMATE_COMPRESSOR_STATUS'
type: 'can'
length: 8
comment:
  en: 'Air conditioning compressor and heater state, sent by the BSI on change.'
  fr: 'État du compresseur de climatisation et du chauffage, envoyé par la BSI sur changement.'
  es: 'Estado del compresor de climatización y de la calefacción, enviado por la BSI al cambiar.'
  de: 'Zustand des Klimakompressors und der Heizung, von der BSI bei Änderung gesendet.'
  it: 'Stato del compressore del climatizzatore e del riscaldamento, inviato dalla BSI al cambio.'
  pl: 'Stan sprężarki klimatyzacji i ogrzewania, wysyłany przez BSI przy zmianie.'
  ru: 'Состояние компрессора кондиционера и отопителя, отправляемое BSI при изменении.'
  zh: '空调压缩机及暖风状态，由BSI在状态变化时发送。'
  hu: 'A klímakompresszor és a fűtés állapota, a BSI küldi változáskor.'
  pt: 'Estado do compressor de ar condicionado e do aquecedor, enviado pela BSI na mudança.'
observations:
  en: 'On state change of: AC_ENABLED_STATUS, COMPRESSOR_STATUS, AC_LAMP_STATUS, AIR_INLET_LAMP_STATUS, AIR_INTAKE_MOTOR_COMMAND'
  fr: 'Sur changement d''état de : AC_ENABLED_STATUS, COMPRESSOR_STATUS, AC_LAMP_STATUS, AIR_INLET_LAMP_STATUS, AIR_INTAKE_MOTOR_COMMAND'
  es: 'Al cambiar el estado de: AC_ENABLED_STATUS, COMPRESSOR_STATUS, AC_LAMP_STATUS, AIR_INLET_LAMP_STATUS, AIR_INTAKE_MOTOR_COMMAND'
  de: 'Bei Statusänderung von: AC_ENABLED_STATUS, COMPRESSOR_STATUS, AC_LAMP_STATUS, AIR_INLET_LAMP_STATUS, AIR_INTAKE_MOTOR_COMMAND'
  it: 'Al cambiamento di stato di: AC_ENABLED_STATUS, COMPRESSOR_STATUS, AC_LAMP_STATUS, AIR_INLET_LAMP_STATUS, AIR_INTAKE_MOTOR_COMMAND'
  pl: 'Wysyłane przy zmianie stanu: AC_ENABLED_STATUS, COMPRESSOR_STATUS, AC_LAMP_STATUS, AIR_INLET_LAMP_STATUS, AIR_INTAKE_MOTOR_COMMAND'
  ru: 'При изменении состояния: AC_ENABLED_STATUS, COMPRESSOR_STATUS, AC_LAMP_STATUS, AIR_INLET_LAMP_STATUS, AIR_INTAKE_MOTOR_COMMAND'
  zh: '当ETAT_CMPR_INF_CLIM, COMPRESSOR_STATUS, AC_LAMP_STATUS, AIR_INLET_LAMP_STATUS, CDE_MOT_EA状态变化时'
  hu: 'A(z) AC_ENABLED_STATUS, COMPRESSOR_STATUS, AC_LAMP_STATUS, AIR_INLET_LAMP_STATUS, AIR_INTAKE_MOTOR_COMMAND állapotváltozásakor'
  pt: 'Na mudança de estado de: AC_ENABLED_STATUS, COMPRESSOR_STATUS, AC_LAMP_STATUS, AIR_INLET_LAMP_STATUS, AIR_INTAKE_MOTOR_COMMAND'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['CLIM_AV']

