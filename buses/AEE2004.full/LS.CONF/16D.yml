  RETRACTABLE_ROOF_STATUS:
    bits: '2.1'
    comment:
      en: 'Retractable roof open: used to ignore the cabin temperature sensor, which would otherwise be disturbed by the airflow'
      fr: 'Toit escamotable ouvert : utilisé pour ignorer le capteur de température habitacle, qui serait sinon perturbé par le flux d''air'
      es: 'Techo retráctil abierto: se utiliza para ignorar el sensor de temperatura del habitáculo, que de otro modo se vería perturbado por el flujo de aire'
      de: 'Versenkbares Dach offen: dient dazu, den Innenraumtemperatursensor zu ignorieren, der sonst durch den Luftstrom gestört würde'
      it: 'Tetto retrattile aperto: utilizzato per ignorare il sensore di temperatura dell''abitacolo, che altrimenti sarebbe disturbato dal flusso d''aria'
      pl: 'Otwarty chowany dach: służy do ignorowania czujnika temperatury w kabinie, który w przeciwnym razie byłby zakłócany przez przepływ powietrza'
      ru: 'Складная крыша открыта: используется для игнорирования датчика температуры салона, который иначе был бы нарушен потоком воздуха'
      zh: '可收放车顶开启:用于忽略座舱温度传感器,否则该传感器会受到气流干扰'
      hu: 'A behúzható tető nyitva: a utastér-hőmérséklet-érzékelő figyelmen kívül hagyására szolgál, amelyet egyébként a légáramlás zavarna'
      pt: 'Teto retrátil aberto: utilizado para ignorar o sensor de temperatura do habitáculo, que de outra forma seria perturbado pelo fluxo de ar'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Retractable roof closed'
        fr: 'Toit escamotable fermé'
        es: 'Techo retráctil cerrado'
        de: 'Versenkbares Verdeck geschlossen'
        it: 'Tetto retrattile chiuso'
        pl: 'Składany dach zamknięty'
