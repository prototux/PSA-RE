id: 0x236
name: 'VEHICLE_PERSONALIZATION_MENU_CONFIG'
type: 'can'
length: 6
comment:
  en: 'Personalization menu configuration: parking sensors, hazard auto-activation, cornering lights, auto wiping, welcome lighting, remote control and password.'
  fr: 'Configuration du menu de personnalisation : aide au stationnement, activation automatique des feux de détresse, feux directionnels, essuyage automatique, éclairage d''accueil, télécommande et mot de passe.'
  es: 'Configuración del menú de personalización: ayuda al aparcamiento, activación automática de las luces de emergencia, luces direccionales, limpiaparabrisas automático, iluminación de bienvenida, mando a distancia y contraseña.'
  de: 'Konfiguration des Personalisierungsmenüs: Einparkhilfe, automatische Warnblinkaktivierung, Kurvenlicht, automatisches Wischen, Komfortbeleuchtung, Fernbedienung und Passwort.'
  it: 'Configurazione del menu di personalizzazione: assistenza al parcheggio, attivazione automatica delle luci di emergenza, luci di svolta, tergicristalli automatici, illuminazione di cortesia, telecomando e password.'
  pl: 'Konfiguracja menu personalizacji: czujniki parkowania, automatyczne włączanie świateł awaryjnych, światła skrętne, automatyczne wycieraczki, oświetlenie powitalne, pilot i hasło.'
  ru: 'Конфигурация меню персонализации: парковочные датчики, автоматическое включение аварийной сигнализации, поворотные фары, автодворники, приветственное освещение, пульт и пароль.'
  zh: '个性化菜单配置：泊车传感器、危险警示灯自动激活、转向辅助灯、自动雨刷、迎宾照明、遥控器和密码。'
  hu: 'A személyre szabási menü konfigurációja: parkolóradar, vészvillogó automatikus aktiválása, kanyarfény, automatikus ablaktörlő, üdvözlő világítás, távirányító és jelszó.'
  pt: 'Configuração do menu de personalização: sensores de estacionamento, ativação automática dos piscas de emergência, luzes de curva, limpeza automática, iluminação de boas-vindas, comando à distância e palavra-passe.'
periodicity: ['trigger']
senders: []  # TODO: find the sender(s)

