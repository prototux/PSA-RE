id: 0x265
name: 'RADIO_RDS_STATUS'
alt_names: ['RADIO_STATUS_FM_CURRENT']
type: 'can'
length: 4
comment:
  en: 'Radio RDS status: alternative frequency list validity, programme type, regional flag, traffic announcement state.'
  fr: 'État RDS de l''autoradio : validité de la liste des fréquences alternatives, type de programme, indicateur régional, état des annonces trafic.'
  es: 'Estado RDS de la radio: validez de la lista de frecuencias alternativas, tipo de programa, indicador regional, estado de anuncios de tráfico.'
  de: 'RDS-Status des Radios: Gültigkeit der Alternativfrequenzliste, Programmtyp, Regionalkennzeichen, Verkehrsdurchsagenstatus.'
  it: 'Stato RDS della radio: validità dell''elenco delle frequenze alternative, tipo di programma, indicatore regionale, stato degli annunci sul traffico.'
  pl: 'Stan RDS radia: ważność listy częstotliwości alternatywnych, typ programu, flaga regionalna, stan komunikatów drogowych.'
  ru: 'Статус RDS радио: достоверность списка альтернативных частот, тип программы, региональный флаг, состояние дорожных сообщений.'
  zh: '收音机RDS状态:备用频率列表有效性、节目类型、区域标志、交通广播状态。'
  hu: 'A rádió RDS állapota: az alternatív frekvencialista érvényessége, programtípus, regionális jelző, forgalmi hírek állapota.'
  pt: 'Estado RDS da rádio: validade da lista de frequências alternativas, tipo de programa, indicador regional, estado do anúncio de trânsito.'
periodicity: ['500ms', 'trigger']
senders: ['RAD', 'ICSV']
receivers: ['MATT', 'EMF', 'CMB', 'CDC', 'AMPLI']

