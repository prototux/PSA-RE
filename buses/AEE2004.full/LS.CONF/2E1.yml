id: 0x2E1
name: 'VEHICLE_FUNCTION_CONFIG'
type: 'can'
length: 8
comment:
  en: 'Status of vehicle functions.'
  fr: 'État des fonctions du véhicule.'
  es: 'Estado de las funciones del vehículo.'
  de: 'Status der Fahrzeugfunktionen.'
  it: 'Stato delle funzioni del veicolo.'
  pl: 'Stan funkcji pojazdu.'
  ru: 'Статус функций автомобиля.'
  zh: '车辆功能状态。'
  hu: 'A jármű funkcióinak állapota.'
  pt: 'Estado das funções do veículo.'
observations:
  en: 'On state change of: TRUNK_AND_CONVERTIBLE_ROOF_STATUS. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : TRUNK_AND_CONVERTIBLE_ROOF_STATUS. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: TRUNK_AND_CONVERTIBLE_ROOF_STATUS. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: TRUNK_AND_CONVERTIBLE_ROOF_STATUS. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: TRUNK_AND_CONVERTIBLE_ROOF_STATUS. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: TRUNK_AND_CONVERTIBLE_ROOF_STATUS. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: TRUNK_AND_CONVERTIBLE_ROOF_STATUS. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当POS_COF_ET_TE状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z) TRUNK_AND_CONVERTIBLE_ROOF_STATUS állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: TRUNK_AND_CONVERTIBLE_ROOF_STATUS. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['BTEL', 'EMF', 'CMB']

