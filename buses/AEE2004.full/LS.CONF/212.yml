      es: 'Asiento del conductor en movimiento para acceso a plazas traseras'
      de: 'Fahrersitz bewegt sich für Fondzugang'
      it: 'Sedile conducente in movimento per l''accesso ai sedili posteriori'
      pl: 'Fotel kierowcy w ruchu w celu umożliwienia dostępu do tylnych siedzeń'
      ru: 'Сиденье водителя движется для доступа к задним сиденьям'
      zh: '驾驶员座椅正在移动以便进入后排'
      hu: 'A vezetőülés mozog a hátsó ülésekhez való hozzáférés érdekében'
      pt: 'Banco do condutor em movimento para acesso aos lugares traseiros'
    type: 'bool'
    default: 0x00
