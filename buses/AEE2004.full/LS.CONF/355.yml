id: 0x355
name: 'PASSENGER_WINDOW_STATUS'
type: 'can'
length: 2
comment:
  en: 'Passenger window regulator status: switch state, not-initialised flag, movement and position.'
  fr: 'État du lève-vitre passager : état du contacteur, indicateur de non-initialisation, mouvement et position.'
  es: 'Estado del elevalunas del pasajero: estado del interruptor, indicador de no inicializado, movimiento y posición.'
  de: 'Status des Fensterhebers Beifahrerseite: Schalterstatus, Nicht-initialisiert-Kennzeichen, Bewegung und Position.'
  it: 'Stato dell''alzacristallo lato passeggero: stato dell''interruttore, indicatore di non inizializzato, movimento e posizione.'
  pl: 'Stan podnośnika szyby pasażera: stan przełącznika, flaga braku inicjalizacji, ruch i pozycja.'
  ru: 'Статус стеклоподъёмника пассажира: состояние переключателя, флаг отсутствия инициализации, движение и положение.'
  zh: '乘客车窗升降器状态:开关状态、未初始化标志、运动和位置。'
  hu: 'Az utasoldali ablakemelő állapota: kapcsolóállapot, inicializálatlansági jelző, mozgás és helyzet.'
  pt: 'Estado do elevador do vidro do passageiro: estado do comutador, indicador de não inicializado, movimento e posição.'
periodicity: ['100ms', 'trigger']
senders: ['EDP_C']
receivers: ['BSI', 'BTE']

