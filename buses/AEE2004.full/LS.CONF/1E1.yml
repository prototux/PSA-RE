id: 0x1E1
name: 'TPMS_STATUS'
type: 'can'
length: 8
comment:
  en: 'Values of pressures returned by the wheel sensors: overall TPMS state and status of each wheel including the spare.'
  fr: 'Valeurs des pressions retournées par les capteurs de roue : état général du système et état de chaque roue, y compris la roue de secours.'
  es: 'Valores de presión devueltos por los sensores de rueda: estado general del sistema y estado de cada rueda, incluida la de repuesto.'
  de: 'Von den Radsensoren gemeldete Druckwerte: allgemeiner Systemstatus und Status jedes Rads, einschließlich Reserverad.'
  it: 'Valori di pressione restituiti dai sensori delle ruote: stato generale del sistema e stato di ogni ruota, compresa la ruota di scorta.'
  pl: 'Wartości ciśnienia zwracane przez czujniki kół: ogólny stan systemu i stan każdego koła, w tym koła zapasowego.'
  ru: 'Значения давления, возвращаемые датчиками колёс: общий статус системы и статус каждого колеса, включая запасное.'
  zh: '车轮传感器返回的压力值:整体TPMS状态以及包括备胎在内的每个车轮的状态。'
  hu: 'A kerékérzékelők által visszaküldött nyomásértékek: az abroncsnyomás-ellenőrző rendszer általános állapota és minden egyes kerék (a pótkerekét is beleértve) állapota.'
  pt: 'Valores de pressão devolvidos pelos sensores das rodas: estado geral do TPMS e estado de cada roda, incluindo o sobresselente.'
observations:
  en: 'On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['500ms']
senders: ['BSI']
receivers: ['EMF', 'CMB', 'BTEL', 'MATT', 'BGP', 'BCD']

