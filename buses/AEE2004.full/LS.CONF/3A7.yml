id: 0x3A7
name: 'MAINTENANCE_STATUS'
type: 'can'
length: 8
comment:
  en: 'Service reminder status: display request, remaining days, mileage sign and pictogram for the next scheduled maintenance.'
  fr: 'État du rappel d''entretien : demande d''affichage, jours restants, signe de kilométrage et pictogramme de la prochaine échéance.'
  es: 'Estado del recordatorio de mantenimiento: solicitud de visualización, días restantes, signo del kilometraje y pictograma del próximo vencimiento.'
  de: 'Status der Wartungserinnerung: Anzeigeanforderung, verbleibende Tage, Kilometerstandsvorzeichen und Piktogramm des nächsten Wartungstermins.'
  it: 'Stato del promemoria di manutenzione: richiesta di visualizzazione, giorni residui, segno del chilometraggio e pittogramma della prossima scadenza.'
  pl: 'Stan przypomnienia o przeglądzie: żądanie wyświetlenia, pozostałe dni, znak przebiegu i piktogram najbliższego terminu.'
  ru: 'Статус напоминания о техобслуживании: запрос отображения, оставшиеся дни, знак пробега и пиктограмма ближайшего срока обслуживания.'
  zh: '保养提醒状态:显示请求、剩余天数、里程符号及下次保养图标。'
  hu: 'A szervizemlékeztető állapota: megjelenítési kérés, hátralévő napok, kilométerjel és a következő esedékesség piktogramja.'
  pt: 'Estado do aviso de manutenção: pedido de visualização, dias restantes, sinal da quilometragem e pictograma da próxima manutenção programada.'
periodicity: ['500ms']
senders: ['BSI']
receivers: ['CMB', 'BTEL', 'BCD', 'MDS', 'MATT', 'BGP', 'VTH']

