      de: 'NPCI-Header (gemäß dem OSEK-COM-Segmentierungsstandard)'
      it: 'Intestazione NPCI (secondo lo standard di segmentazione OSEK-COM)'
      pl: 'Nagłówek NPCI (zgodnie ze standardem segmentacji OSEK-COM)'
      ru: 'Заголовок NPCI (согласно стандарту сегментации OSEK-COM)'
      zh: 'NPCI 报头(依据 OSEK-COM 分段标准)'
      hu: 'NPCI fejléc (az OSEK-COM szegmentálási szabvány szerint)'
      pt: 'Cabeçalho NPCI (segundo a norma de segmentação OSEK-COM)'
