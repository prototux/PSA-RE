id: 0x11F
name: 'RADIO_REPLY_FLOW_CONTROL_2'
type: 'can-tp'
comment:
  en: 'ISO-TP flow control frame for the radio reply multi-frame reply (block size, flow status, separation time).'
  fr: 'Trame de contrôle de flux ISO-TP pour la réponse multi-trame radio reply (taille de bloc, état de flux, temps de séparation).'
  es: 'Trama de control de flujo ISO-TP para la respuesta multitrama radio reply (tamaño de bloque, estado de flujo, tiempo de separación).'
  de: 'ISO-TP-Flusssteuerungsrahmen für die Mehrfachrahmen-Antwort radio reply (Blockgröße, Flussstatus, Trennzeit).'
  it: 'Trama di controllo di flusso ISO-TP per la risposta multi-trama radio reply (dimensione blocco, stato di flusso, tempo di separazione).'
  pl: 'Ramka kontroli przepływu ISO-TP dla wieloramkowej odpowiedzi radio reply (rozmiar bloku, stan przepływu, czas separacji).'
  ru: 'Кадр управления потоком ISO-TP для многокадрового ответа radio reply (размер блока, статус потока, время разделения).'
  zh: '用于radio reply多帧应答的ISO-TP流控制帧(块大小、流状态、间隔时间)。'
  hu: 'ISO-TP folyamvezérlő keret a radio reply többkeretes válaszhoz (blokkméret, folyamallapot, elválasztási idő).'
  pt: 'Trama de controlo de fluxo ISO-TP para a resposta multi-trama da rádio (tamanho de bloco, estado de fluxo, tempo de separação).'
periodicity: ['trigger']
senders: ['EMF', 'CMB', 'ICSV']
receivers: ['RAD', 'CDC']
isotp:
  addressing: 'normal'

