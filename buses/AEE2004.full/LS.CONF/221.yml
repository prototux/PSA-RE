id: 0x221
name: 'TRIP_GENERAL_INFOS'
type: 'can'
length: 7
comment:
  en: 'General trip-computer information: instant and trip consumption, remaining range and reset button presses.'
  fr: 'Informations générales de l''ordinateur de bord : consommation instantanée et de trajet, autonomie restante et appuis sur le bouton de remise à zéro.'
  es: 'Información general del ordenador de a bordo: consumo instantáneo y del trayecto, autonomía restante y pulsaciones del botón de reinicio.'
  de: 'Allgemeine Bordcomputer-Informationen: Momentan- und Fahrtverbrauch, Restreichweite und Tastendrücke der Rückstelltaste.'
  it: 'Informazioni generali del computer di bordo: consumo istantaneo e di viaggio, autonomia residua e pressioni del pulsante di azzeramento.'
  pl: 'Ogólne informacje komputera pokładowego: zużycie chwilowe i na trasie, pozostały zasięg oraz naciśnięcia przycisku kasowania.'
  ru: 'Общая информация бортового компьютера: мгновенный и путевой расход, остаток запаса хода и нажатия кнопки сброса.'
  zh: '行车电脑通用信息:瞬时及行程油耗、剩余续航里程及复位按钮按下次数。'
  hu: 'A fedélzeti számítógép általános információi: pillanatnyi és úti fogyasztás, hátralévő hatótávolság és a nullázó gomb megnyomásai.'
  pt: 'Informação geral do computador de bordo: consumo instantâneo e do trajeto, autonomia restante e pressões no botão de reinício.'
observations:
  en: 'On state change of: CHECK_CONSUMPTION, CHECK_AUTONOMY, TRIP_PUSH_BUTTON, NAVIGATION_PUSH_BUTTON'
  fr: 'Sur changement d''état de : CHECK_CONSUMPTION, CHECK_AUTONOMY, TRIP_PUSH_BUTTON, NAVIGATION_PUSH_BUTTON'
  es: 'Al cambiar el estado de: CHECK_CONSUMPTION, CHECK_AUTONOMY, TRIP_PUSH_BUTTON, NAVIGATION_PUSH_BUTTON'
  de: 'Bei Statusänderung von: CHECK_CONSUMPTION, CHECK_AUTONOMY, TRIP_PUSH_BUTTON, NAVIGATION_PUSH_BUTTON'
  it: 'Al cambiamento di stato di: CHECK_CONSUMPTION, CHECK_AUTONOMY, TRIP_PUSH_BUTTON, NAVIGATION_PUSH_BUTTON'
  pl: 'Wysyłane przy zmianie stanu: CHECK_CONSUMPTION, CHECK_AUTONOMY, TRIP_PUSH_BUTTON, NAVIGATION_PUSH_BUTTON'
  ru: 'При изменении состояния: CHECK_CONSUMPTION, CHECK_AUTONOMY, TRIP_PUSH_BUTTON, NAVIGATION_PUSH_BUTTON'
  zh: '当CONSO_ODB, CHECK_AUTONOMY, TRIP_PUSH_BUTTON, POUSSOIR_NAV状态变化时'
  hu: 'A(z) CHECK_CONSUMPTION, CHECK_AUTONOMY, TRIP_PUSH_BUTTON, NAVIGATION_PUSH_BUTTON állapotváltozásakor'
  pt: 'Na mudança de estado de: CHECK_CONSUMPTION, CHECK_AUTONOMY, TRIP_PUSH_BUTTON, NAVIGATION_PUSH_BUTTON'
periodicity: ['1000ms', 'trigger']
senders: ['BSI', 'ICSV']
receivers: ['RAD', 'CMB', 'MDS', 'BTEL', 'MATT', 'EMF', 'BCD', 'KML', 'BGP', 'ICSV']

signals:
  CHECK_CONSUMPTION:
    bits: '1.7'
    comment:
      en: 'Invalid consumption'
      fr: 'Consommation invalide'
      es: 'Consumo no válido'
      de: 'Ungültiger Verbrauch'
      it: 'Consumo non valido'
      pl: 'Nieprawidłowe zużycie'
      ru: 'Недействительный расход'
      zh: '油耗无效'
      hu: 'Érvénytelen fogyasztás'
      pt: 'Consumo inválido'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Valid'
        fr: 'Valide'
        es: 'Válido'
        de: 'Gültig'
        it: 'Valido'
        pl: 'Ważne'
        ru: 'Действительно'
        zh: '有效'
        hu: 'Érvényes'
        pt: 'Válido'
      0x01:
        en: 'Invalid'
        fr: 'Invalide'
        es: 'Inválido'
        de: 'Ungültig'
        it: 'Non valido'
        pl: 'Nieprawidłowe'
        ru: 'Недействительно'
        zh: '无效'
        hu: 'Érvénytelen'
        pt: 'Inválido'

  CHECK_AUTONOMY:
    bits: '1.6'
    comment:
      en: 'Invalid range'
      fr: 'Autonomie invalide'
      es: 'Autonomía no válida'
      de: 'Ungültige Reichweite'
      it: 'Autonomia non valida'
      pl: 'Nieprawidłowy zasięg'
      ru: 'Недействительный запас хода'
      zh: '续航里程无效'
      hu: 'Érvénytelen hatótávolság'
      pt: 'Autonomia inválida'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Valid'
        fr: 'Valide'
        es: 'Válido'
        de: 'Gültig'
        it: 'Valido'
        pl: 'Ważne'
        ru: 'Действительно'
        zh: '有效'
        hu: 'Érvényes'
        pt: 'Válido'
      0x01:
        en: 'Invalid'
        fr: 'Invalide'
        es: 'Inválido'
        de: 'Ungültig'
        it: 'Non valido'
        pl: 'Nieprawidłowe'
        ru: 'Недействительно'
        zh: '无效'
        hu: 'Érvénytelen'
        pt: 'Inválido'

  UNUSED_1:
    bits: '1.5-1.4'
    unused: true

  TRIP_PUSH_BUTTON:
    bits: '1.3'
    comment:
      en: 'State of the trip computer scrolling push-button'
      fr: 'État du bouton de défilement de l''ordinateur de bord'
      es: 'Estado del botón de desplazamiento del ordenador de a bordo'
      de: 'Status der Bordcomputer-Scrolltaste'
      it: 'Stato del pulsante di scorrimento del computer di bordo'
      pl: 'Stan przycisku przewijania komputera pokładowego'
      ru: 'Состояние кнопки прокрутки бортового компьютера'
      zh: '车载电脑翻页按钮状态'
      hu: 'A fedélzeti számítógép lapozógombjának állapota'
      pt: 'Estado do botão de deslocamento do computador de bordo'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Released'
        fr: 'Relâché'
        es: 'Soltado'
        de: 'Losgelassen'
        it: 'Rilasciato'
        pl: 'Zwolniony'
        ru: 'Отпущено'
        zh: '已释放'
        hu: 'Elengedve'
        pt: 'Solto'
      0x01:
        en: 'Pressed'
        fr: 'Enfoncé'
        es: 'Pulsado'
        de: 'Gedrückt'
        it: 'Premuto'
        pl: 'Wciśnięty'
        ru: 'Нажато'
        zh: '已按下'
        hu: 'Megnyomva'
        pt: 'Premido'

  UNUSED_2:
    bits: '1.2-1.1'
    unused: true

  NAVIGATION_PUSH_BUTTON:
    bits: '1.0'
    comment:
      en: 'State of the navigation/voice recognition message reminder push-button'
      fr: 'État du bouton de rappel de message navigation / reconnaissance vocale'
      es: 'Estado del botón de recordatorio de mensaje de navegación / reconocimiento de voz'
      de: 'Status der Erinnerungstaste für Navigations-/Spracherkennungsmeldung'
      it: 'Stato del pulsante di richiamo del messaggio di navigazione / riconoscimento vocale'
      pl: 'Stan przycisku przypomnienia komunikatu nawigacji / rozpoznawania mowy'
      ru: 'Состояние кнопки напоминания сообщения навигации / распознавания голоса'
      zh: '导航/语音识别消息提醒按钮状态'
      hu: 'A navigációs/hangfelismerési üzenet-emlékeztető gomb állapota'
      pt: 'Estado do botão de lembrete de mensagem de navegação/reconhecimento de voz'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Released'
        fr: 'Relâché'
        es: 'Soltado'
        de: 'Losgelassen'
        it: 'Rilasciato'
        pl: 'Zwolniony'
        ru: 'Отпущено'
        zh: '已释放'
        hu: 'Elengedve'
        pt: 'Solto'
      0x01:
        en: 'Pressed'
        fr: 'Enfoncé'
        es: 'Pulsado'
        de: 'Gedrückt'
        it: 'Premuto'
        pl: 'Wciśnięty'
        ru: 'Нажато'
        zh: '已按下'
        hu: 'Megnyomva'
        pt: 'Premido'

  TRIP_INSTANT_FUEL_CONSUMPTION:
    bits: '2.7-3.0'
    alt_names: ['INSTANT_CONSUMPTION', 'CONSO_INSTANTANEE']
    comment:
      en: 'Instantaneous fuel consumption'
      fr: 'Consommation instantanée de carburant'
      es: 'Consumo instantáneo de combustible'
      de: 'Momentaner Kraftstoffverbrauch'
      it: 'Consumo istantaneo di carburante'
      pl: 'Chwilowe zużycie paliwa'
      ru: 'Мгновенный расход топлива'
      zh: '瞬时油耗'
      hu: 'Pillanatnyi üzemanyag-fogyasztás'
      pt: 'Consumo instantâneo de combustível'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 30
    units: 'L/100km'
    invalid: 0xFFFF
    default: 0xFFFF

  AUTONOMY:
    bits: '4.7-5.0'
    comment:
      en: 'Residual range'
      fr: 'Autonomie résiduelle'
      es: 'Autonomía residual'
      de: 'Restreichweite'
      it: 'Autonomia residua'
      pl: 'Pozostały zasięg'
      ru: 'Остаточный запас хода'
      zh: '剩余续航里程'
      hu: 'Fennmaradó hatótávolság'
      pt: 'Autonomia residual'
    type: 'uint'
    factor: 1
    min: 0
    max: 2000
    units: 'km'
    invalid: 0xFFFF
    default: 0xFFFF

  TRIP_DIST_LEFT:
    bits: '6.7-7.0'
    comment:
      en: 'Distance remaining on the current course'
      fr: 'Distance restante sur le parcours en cours'
      es: 'Distancia restante en el trayecto actual'
      de: 'Verbleibende Strecke der aktuellen Route'
      it: 'Distanza rimanente sul percorso in corso'
      pl: 'Pozostały dystans na bieżącej trasie'
      ru: 'Оставшееся расстояние текущего маршрута'
      zh: '当前路线剩余距离'
      hu: 'A jelenlegi útvonalon hátralévő távolság'
      pt: 'Distância restante no trajeto atual'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 6000
    units: 'km'
    invalid: 0xFFFF
    default: 0xFFFF
    alternatives:
      - note:
          en: 'Also observed with another scaling (factor 1, offset 16)'
          fr: 'Aussi observé avec une autre mise à l''échelle (factor 1, offset 16)'
          es: 'También observado con otro escalado (factor 1, offset 16)'
          de: 'Auch mit anderer Skalierung beobachtet (factor 1, offset 16)'
          it: 'Osservato anche con un''altra scala (factor 1, offset 16)'
          pl: 'Obserwowany także z innym skalowaniem (factor 1, offset 16)'
          ru: 'Также наблюдался с другим масштабом (factor 1, offset 16)'
          zh: '也观察到使用另一种缩放（factor 1, offset 16）'
          hu: 'Megfigyelve más skálázással is (factor 1, offset 16)'
          pt: 'Também observado com outra escala (factor 1, offset 16)'
        factor: 1
        offset: 16

alternatives:
  - note:
      en: 'Also observed with a period of 100ms'
      fr: 'Aussi observée avec une période de 100ms'
      es: 'También observada con un periodo de 100ms'
      de: 'Auch mit einer Periode von 100ms beobachtet'
      it: 'Osservata anche con un periodo di 100ms'
      pl: 'Obserwowana także z okresem 100ms'
      ru: 'Также наблюдалась с периодом 100ms'
      zh: '也观察到周期为100ms'
      hu: 'Megfigyelve 100ms periódussal is'
      pt: 'Também observada com um período de 100ms'
    periodicity: ['100ms']
