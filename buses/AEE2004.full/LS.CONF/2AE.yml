id: 0x2AE
name: 'MEMORY_SEAT_WELCOME_STATUS_ARC'
type: 'can'
length: 1
comment:
  en: 'Driver seat welcome/memory recall status (front and rear occupancy, welcome flags, manual command, memory), sent on change.'
  fr: 'État de l''accueil/rappel mémoire du siège conducteur (occupation avant et arrière, indicateurs d''accueil, commande manuelle, mémoire), envoyé sur changement.'
  es: 'Estado de bienvenida/recuperación de memoria del asiento del conductor (ocupación delantera y trasera, indicadores de bienvenida, mando manual, memoria), enviado al cambiar.'
  de: 'Status der Komfort-/Memory-Rückstellung des Fahrersitzes (Vorder- und Rückbelegung, Begrüßungsflags, manueller Befehl, Speicher), gesendet bei Änderung.'
  it: 'Stato di accoglienza/richiamo memoria del sedile conducente (occupazione anteriore e posteriore, indicatori di accoglienza, comando manuale, memoria), inviato al cambio.'
  pl: 'Stan powitania/przywołania pamięci fotela kierowcy (obecność z przodu i z tyłu, flagi powitania, polecenie ręczne, pamięć), wysyłany przy zmianie.'
  ru: 'Состояние приветствия/вызова памяти сиденья водителя (переднее и заднее присутствие, флаги приветствия, ручная команда, память), отправляется при изменении.'
  zh: '驾驶员座椅迎宾/记忆恢复状态（前后占用、迎宾标志、手动命令、记忆），状态变化时发送。'
  hu: 'A vezetőülés üdvözlő/memória-visszaállítási állapota (első és hátsó jelenlét, üdvözlő jelzők, kézi parancs, memória), változáskor küldve.'
  pt: 'Estado de boas-vindas/memória do banco do condutor (ocupação dianteira e traseira, indicadores de boas-vindas, comando manual, memória), enviado na mudança.'
periodicity: ['200ms', 'trigger']
senders: ['BDM_A']
receivers: ['BDM_C', 'BSI']

signals:
  BUSINESS_SEAT_MOVE_FRONT_REQUEST:
    bits: '1.7'
    comment:
      en: 'Business (welcome) function movement request, forward'
      fr: 'Demande de mouvement vers l''avant de la fonction Business (accueil)'
      es: 'Solicitud de movimiento hacia adelante de la función Business (bienvenida)'
      de: 'Bewegungsanforderung nach vorne der Business-(Begrüßungs-)Funktion'
      it: 'Richiesta di movimento in avanti della funzione Business (accoglienza)'
      pl: 'Żądanie ruchu do przodu funkcji Business (powitalnej)'
      ru: 'Запрос движения вперёд функции Business (приветствие)'
      zh: '商务(迎宾)功能向前移动请求'
      hu: 'A Business (üdvözlő) funkció előrefelé mozgatási kérése'
      pt: 'Pedido de movimento para a frente da função Business (boas-vindas)'
    type: 'bool'
    default: 0x00
    values:
