id: 0x2A3
name: 'USB_CONFIG_STATUS'
type: 'can'
length: 2
comment:
  en: 'USB source configuration and status: scan, read-all and read-file settings, directory repertoire.'
  fr: 'Configuration et état de la source USB : balayage, lecture globale et lecture de fichier, répertoire de dossiers.'
  es: 'Configuración y estado de la fuente USB: escaneo, lectura completa y lectura de archivo, repertorio de directorios.'
  de: 'Konfiguration und Status der USB-Quelle: Scan, Gesamtwiedergabe und Dateiwiedergabe, Verzeichnisliste.'
  it: 'Configurazione e stato della sorgente USB: scansione, lettura completa e lettura file, elenco cartelle.'
  pl: 'Konfiguracja i stan źródła USB: skanowanie, odczyt wszystkiego i odczyt pliku, lista katalogów.'
  ru: 'Конфигурация и статус USB-источника: сканирование, чтение всех файлов и чтение файла, список каталогов.'
  zh: 'USB音源的配置和状态:扫描、全部读取和文件读取设置,目录列表。'
  hu: 'Az USB forrás konfigurációja és állapota: pásztázás, teljes és fájlonkénti olvasás, könyvtárlista.'
  pt: 'Configuração e estado da fonte USB: definições de varrimento, leitura total e leitura de ficheiro, repertório de diretório.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['1000ms', 'trigger']
senders: ['KML', 'ICSV']
receivers: ['RAD']

