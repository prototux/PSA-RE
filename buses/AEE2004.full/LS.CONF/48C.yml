id: 0x48C
name: 'LPG_SYSTEM_DATA'
type: 'can'
length: 8
comment:
  en: 'Passenger''s power window motor: fault event, logged in the BSI fault log.'
  fr: 'Lève-vitre électrique passager : événement défaut, enregistré dans le journal des défauts du BSI.'
  es: 'Motor del elevalunas del pasajero: evento de fallo, registrado en el registro de fallos de la BSI.'
  de: 'Fensterheber Beifahrerseite – Fehlerereignis, im Fehlerspeicher (Fehlerprotokoll) des BSI vermerkt.'
  it: 'Motorino alzacristallo lato passeggero: evento di guasto, registrato nel registro guasti della BSI.'
  pl: 'Silnik szyby pasażera – zdarzenie usterki, zapisywane w dzienniku usterek BSI.'
  ru: 'Электростеклоподъёмник со стороны пассажира — событие неисправности, регистрируется в журнале неисправностей BSI.'
  zh: '乘客车窗升降电机——故障事件,记录在BSI故障日志中。'
  hu: 'Utasoldali ablakemelő motor – hibaesemény, amelyet a BSI hibanaplójába rögzítenek.'
  pt: 'Motor do vidro elétrico do passageiro: evento de avaria, registado no registo de avarias da BSI.'
periodicity: ['trigger']
senders: ['EDP_C']
receivers: ['BSI']

signals:
  HEADER_BITS_1:
    bits: '1.7-1.4'
    comment:
      en: 'First 4 header bits'
      fr: '4 premiers bits de l''en-tête'
      es: '4 primeros bits de la cabecera'
      de: 'Erste 4 Header-Bits'
      it: 'Primi 4 bit dell''intestazione'
      pl: 'Pierwsze 4 bity nagłówka'
      ru: 'Первые 4 бита заголовка'
      zh: '帧头前4位'
      hu: 'A fejléc első 4 bitje'
      pt: '4 primeiros bits do cabeçalho'
    type: 'uint'
    default: 0x05

  EVENT_TYPE:
