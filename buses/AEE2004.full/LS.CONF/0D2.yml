id: 0x0D2
name: 'TYRE_PRESSURE_TRANSMITTER_STATUS'
type: 'can'
length: 5
comment:
  en: 'Tyre pressure transmitter status: front-left transmitter and battery state, front wheel states.'
  fr: 'État de l''émetteur de pression des pneus : état de l''émetteur et de la pile avant gauche, états des roues avant.'
  es: 'Estado del transmisor de presión de neumáticos: estado del transmisor y de la pila delantera izquierda, estados de las ruedas delanteras.'
  de: 'Status des Reifendruck-Senders: Zustand des Senders und der Batterie vorne links, Zustände der Vorderräder.'
  it: 'Stato del trasmettitore di pressione pneumatici: stato del trasmettitore e della batteria anteriore sinistra, stati delle ruote anteriori.'
  pl: 'Stan nadajnika ciśnienia opon: stan nadajnika i baterii przedniej lewej, stany kół przednich.'
  ru: 'Статус передатчика давления шин: состояние переднего левого передатчика и батареи, состояния передних колёс.'
  zh: '胎压发射器状态:左前发射器及电池状态、前轮状态。'
  hu: 'A gumiabroncs-nyomás adó állapota: a bal első adó és elem állapota, az első kerekek állapotai.'
  pt: 'Estado do transmissor de pressão dos pneus: transmissor dianteiro esquerdo e estado da bateria, estados das rodas dianteiras.'
periodicity: ['100ms']
senders: []  # TODO: find the sender(s)
receivers: ['BSI']

