id: 0x152
name: 'DRIVER_MEMORY_KEYPAD_STATUS'
type: 'can'
length: 1
comment:
  en: 'Driver memory keypad button presses (memory 1-7 and M).'
  fr: 'Appuis sur le clavier mémoire conducteur (mémoires 1 à 7 et M).'
  es: 'Pulsaciones del teclado de memoria del conductor (memorias 1 a 7 y M).'
  de: 'Tastendrücke des Fahrer-Memory-Tastenfelds (Memory 1-7 und M).'
  it: 'Pressioni sulla tastiera memoria conducente (memorie 1-7 e M).'
  pl: 'Naciśnięcia klawiatury pamięci kierowcy (pamięci 1-7 i M).'
  ru: 'Нажатия клавиатуры памяти водителя (память 1-7 и M).'
  zh: '驾驶员记忆键盘按键(记忆1-7及M)。'
  hu: 'A vezetőoldali memóriabillentyűzet gombnyomásai (1-7. memória és M).'
  pt: 'Pressões dos botões do teclado de memória do condutor (memória 1-7 e M).'
observations:
  en: 'On button press'
  fr: 'Sur appui d''une touche'
  es: 'Al pulsar un botón'
  de: 'Beim Tastendruck'
  it: 'Alla pressione di un pulsante'
  pl: 'Przy naciśnięciu przycisku'
  ru: 'При нажатии кнопки'
  zh: '按键按下时'
  hu: 'Gombnyomáskor'
  pt: 'Na pressão de um botão'
periodicity: ['200ms', 'trigger']
senders: ['PDS_C', 'EDP_C', 'CMB', 'BDM_C']
receivers: ['BSI']

signals:
  MEMORY_KEY_PRESSED:
    bits: '1.7'
    comment:
      en: 'Save/memory key pressed'
      fr: 'Touche mémorisation appuyée'
      es: 'Tecla de memorización pulsada'
      de: 'Speichertaste gedrückt'
      it: 'Tasto di memorizzazione premuto'
      pl: 'Naciśnięto przycisk zapisu do pamięci'
      ru: 'Нажата клавиша сохранения в память'
      zh: '记忆按键被按下'
      hu: 'Memóriagomb megnyomva'
      pt: 'Tecla de memorização pressionada'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Button released'
        fr: 'Touche relâchée'
        es: 'Botón liberado'
        de: 'Taste losgelassen'
        it: 'Tasto rilasciato'
        pl: 'Przycisk zwolniony'
        ru: 'Кнопка отпущена'
        zh: '按键已释放'
        hu: 'Gomb elengedve'
        pt: 'Tecla libertada'
      0x01:
        en: 'Key pressed'
        fr: 'Touche appuyée'
        es: 'Tecla presionada'
        de: 'Taste gedrückt'
        it: 'Tasto premuto'
        pl: 'Przycisk naciśnięty'
        ru: 'Кнопка нажата'
        zh: '按键已按下'
        hu: 'Gomb megnyomva'
        pt: 'Tecla premida'

