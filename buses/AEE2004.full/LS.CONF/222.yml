id: 0x222
name: 'CRT_REMOTE_STATUS'
type: 'can'
length: 8
comment:
  en: 'Remote-control key status report: key press codes returned to the BSI.'
  fr: 'Remontée d''état de la commande déportée : codes des touches renvoyés à la BSI.'
  es: 'Informe de estado del mando a distancia: códigos de teclas enviados a la BSI.'
  de: 'Statusmeldung der Fernbedienung: Tastencodes, die an den BSI zurückgemeldet werden.'
  it: 'Rapporto di stato del telecomando: codici dei tasti restituiti alla BSI.'
  pl: 'Raport stanu pilota zdalnego sterowania: kody przycisków przesyłane do BSI.'
  ru: 'Отчёт о состоянии пульта дистанционного управления: коды нажатых кнопок, передаваемые в BSI.'
  zh: '遥控器状态报告:返回给BSI的按键代码。'
  hu: 'A távirányító állapotjelentése: a BSI-nek visszaküldött gombkódok.'
  pt: 'Relatório de estado da chave do comando à distância: códigos de pressão de teclas devolvidos à BSI.'
