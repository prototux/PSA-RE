id: 0x1E7
name: 'ARTIV_AND_HYBRID_STATUS'
type: 'can'
length: 5
comment:
  en: 'Adaptive cruise control (target detection and gap) and hybrid system status: alert, detected target, display mode, gap setpoint.'
  fr: 'État du régulateur de distance adaptatif (détection de cible, écart) et du système hybride : alerte, cible détectée, mode d''affichage, consigne d''écart.'
  es: 'Estado del regulador de distancia adaptativo (detección de objetivo, separación) y del sistema híbrido: alerta, objetivo detectado, modo de visualización, consigna de separación.'
  de: 'Status des adaptiven Abstandsreglers (Zielobjekterkennung, Abstand) und des Hybridsystems: Warnung, erkanntes Ziel, Anzeigemodus, Abstandssollwert.'
  it: 'Stato del regolatore di distanza adattivo (rilevamento target, distanza) e del sistema ibrido: allarme, target rilevato, modalità di visualizzazione, setpoint di distanza.'
  pl: 'Stan adaptacyjnego regulatora odległości (wykrywanie celu, odstęp) i układu hybrydowego: alarm, wykryty cel, tryb wyświetlania, zadany odstęp.'
  ru: 'Статус адаптивного круиз-контроля (обнаружение цели, дистанция) и гибридной системы: сигнал тревоги, обнаруженная цель, режим отображения, заданная дистанция.'
  zh: '自适应巡航(目标探测、车距)及混合动力系统状态:告警、探测到的目标、显示模式、车距设定值。'
  hu: 'Az adaptív követési távolságszabályzó (célfelismerés, távolság) és a hibrid rendszer állapota: riasztás, felismert cél, kijelzési mód, távolság-alapérték.'
  pt: 'Estado do regulador de velocidade adaptativo (deteção de alvo e intervalo) e do sistema híbrido: alerta, alvo detetado, modo de apresentação, ponto de ajuste de intervalo.'
observations:
  en: 'On state change of: ARTIV_SELECTION_STATUS, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_TARGET. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : ARTIV_SELECTION_STATUS, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_TARGET. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: ARTIV_SELECTION_STATUS, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_TARGET. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: ARTIV_SELECTION_STATUS, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_TARGET. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: ARTIV_SELECTION_STATUS, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_TARGET. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: ARTIV_SELECTION_STATUS, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_TARGET. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: ARTIV_SELECTION_STATUS, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_TARGET. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当ETAT_SELEC_ARTIV, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_CIBLE状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z) ARTIV_SELECTION_STATUS, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_TARGET állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: ARTIV_SELECTION_STATUS, IHM_ARTIV_STATUS, ARTIV_ALERT, ARTIV_ALERT_ADJUSTMENT, ARTIV_TARGET_DETECTED, TIV_SETPOINT, TIV_TARGET. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['CMB', 'VTH', 'MATT', 'BTEL']

