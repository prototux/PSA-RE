  fr: 'État du lève-vitre conducteur : indicateur de non-initialisation, mouvement et position.'
  es: 'Estado del elevalunas del conductor: indicador de no inicializado, movimiento y posición.'
  de: 'Status des Fensterhebers Fahrerseite: Nicht-initialisiert-Kennzeichen, Bewegung und Position.'
  it: 'Stato dell''alzacristallo lato conducente: indicatore di non inizializzato, movimento e posizione.'
  pl: 'Stan podnośnika szyby kierowcy: flaga braku inicjalizacji, ruch i pozycja.'
