  hu: 'A vezetőoldali ablakemelő állapota: inicializálatlansági jelző, mozgás és helyzet.'
  pt: 'Estado do elevador do vidro do condutor: indicador de não inicializado, movimento e posição.'
periodicity: ['100ms', 'trigger']
senders: ['EDP_C']
receivers: ['BSI', 'BTE']

