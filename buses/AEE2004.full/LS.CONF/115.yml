id: 0x115
name: 'STEERING_ASSIST_VERSION'
type: 'can'
length: 4
comment:
  en: 'Driver door switch panel status: rear window inhibit, four window switch requests, mirror adjustment movement and selection, electric child-lock switch.'
  fr: 'État du panneau de commande de la porte conducteur : inhibition lève-vitres arrière, demandes des quatre lève-vitres, mouvement et sélection de réglage rétroviseur, commande de sécurité enfant électrique.'
  es: 'Estado del panel de mando de la puerta del conductor: inhibición de elevalunas traseros, solicitudes de los cuatro elevalunas, movimiento y selección de ajuste de retrovisor, mando de seguro para niños eléctrico.'
  de: 'Status des Fahrertür-Bedienfelds: Sperre der hinteren Fensterheber, Anforderungen der vier Fensterheber, Spiegelverstellbewegung und -auswahl, elektrischer Kindersicherungsschalter.'
  it: 'Stato del pannello di comando della portiera conducente: inibizione alzacristalli posteriori, richieste dei quattro alzacristalli, movimento e selezione di regolazione specchietto, interruttore sicura bambini elettrica.'
  pl: 'Stan panelu sterowania drzwi kierowcy: blokada tylnych podnośników szyb, żądania czterech podnośników szyb, ruch i wybór regulacji lusterka, elektryczny przełącznik blokady dziecięcej.'
  ru: 'Статус панели управления дверью водителя: блокировка задних стеклоподъёмников, запросы четырёх стеклоподъёмников, движение и выбор регулировки зеркала, электрический переключатель блокировки от детей.'
  zh: '驾驶员车门开关面板状态:后车窗抑制、四个车窗开关请求、后视镜调节移动及选择、电动儿童锁开关。'
  hu: 'A vezetőoldali ajtó kezelőpaneljének állapota: hátsó ablakemelők letiltása, a négy ablakemelő kérései, tükörállítás mozgása és kiválasztása, elektromos gyerekzár kapcsoló.'
  pt: 'Estado do painel de comutadores da porta do condutor: inibição do vidro traseiro, quatro pedidos de comutador de vidro, movimento e seleção do ajuste dos espelhos, comutador elétrico do bloqueio para crianças.'
periodicity: ['100ms', 'trigger']
senders: ['EDP_C']
receivers: ['BSI']

