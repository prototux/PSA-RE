id: 0x2CC
name: 'SLIDING_DOOR_COMMAND_2'
type: 'can'
length: 7
comment:
  en: 'Commands and status inputs for the powered sliding side door(s): lock/unlock, crash/breakdown info, child safety, fuel flap.'
  fr: 'Commandes et entrées d''état de la ou des portes latérales coulissantes motorisées : verrouillage/déverrouillage, infos choc/panne, sécurité enfants, trappe à carburant.'
  es: 'Comandos y entradas de estado de la(s) puerta(s) lateral(es) correderas motorizadas: bloqueo/desbloqueo, info de choque/avería, seguro para niños, tapa de combustible.'
  de: 'Befehle und Statuseingänge für die elektrische(n) Schiebetür(en): Ver-/Entriegeln, Crash-/Panneninfo, Kindersicherung, Tankklappe.'
  it: 'Comandi e ingressi di stato della/e porta/e scorrevole/i laterale/i motorizzata/e: blocco/sblocco, info urto/guasto, sicurezza bambini, sportello carburante.'
  pl: 'Polecenia i sygnały stanu elektrycznych drzwi przesuwnych: blokowanie/odblokowanie, info o zderzeniu/awarii, blokada dla dzieci, klapka wlewu paliwa.'
  ru: 'Команды и входные сигналы состояния электрической(их) сдвижной(ых) двери(ей): блокировка/разблокировка, информация об ударе/неисправности, защита от детей, лючок топливного бака.'
  zh: '电动侧滑门的命令与状态输入:上锁/解锁、碰撞/故障信息、儿童安全锁、油箱盖。'
  hu: 'Az elektromos oldalsó tolóajtó(k) parancsai és állapotjelei: zárás/nyitás, ütközés-/meghibásodás-információ, gyerekzár, üzemanyag-betoltő nyílás.'
  pt: 'Comandos e entradas de estado da(s) porta(s) lateral(is) corrediça(s) motorizada(s): bloqueio/desbloqueio, informação de choque/avaria, segurança para crianças, tampa do depósito de combustível.'
observations:
  en: 'On state change of: RIGHT_PSD_REMOTE_BUTTON_PRESS, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, BELT_STARTER_RESTART_STATE. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : RIGHT_PSD_REMOTE_BUTTON_PRESS, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, BELT_STARTER_RESTART_STATE. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: RIGHT_PSD_REMOTE_BUTTON_PRESS, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, BELT_STARTER_RESTART_STATE. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: RIGHT_PSD_REMOTE_BUTTON_PRESS, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, BELT_STARTER_RESTART_STATE. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: RIGHT_PSD_REMOTE_BUTTON_PRESS, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, BELT_STARTER_RESTART_STATE. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: RIGHT_PSD_REMOTE_BUTTON_PRESS, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, BELT_STARTER_RESTART_STATE. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: RIGHT_PSD_REMOTE_BUTTON_PRESS, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, BELT_STARTER_RESTART_STATE. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当APPUI_CDE_PLCD, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, ETAT_REDEM_AR2S状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z) RIGHT_PSD_REMOTE_BUTTON_PRESS, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, BELT_STARTER_RESTART_STATE állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: RIGHT_PSD_REMOTE_BUTTON_PRESS, LEFT_PSD_REMOTE_BUTTON_PRESS, RIGHT_PSD_CHILD_LOCK_REQUEST, LEFT_PSD_CHILD_LOCK_REQUEST, FUEL_CAP_PRESENCE_SENSOR, FUEL_FLAP_STATE, VEHICLE_LOCKING_STATE, BELT_STARTER_RESTART_STATE. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['MDPLC']

