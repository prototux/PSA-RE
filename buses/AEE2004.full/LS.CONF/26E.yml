id: 0x26E
name: 'MEMORY_SEAT_WELCOME_STATUS'
type: 'can'
length: 2
comment:
  en: 'Driver seat welcome/memory recall status, combining the ARC/ARM/ARP functions (occupancy, welcome flags, manual commands, memory), sent on change.'
  fr: 'État de l''accueil/rappel mémoire du siège conducteur, regroupant les fonctions ARC/ARM/ARP (occupation, indicateurs d''accueil, commandes manuelles, mémoire), envoyé sur changement.'
  es: 'Estado de bienvenida/recuperación de memoria del asiento del conductor, agrupando las funciones ARC/ARM/ARP (ocupación, indicadores de bienvenida, mandos manuales, memoria), enviado al cambiar.'
  de: 'Status der Komfort-/Memory-Rückstellung des Fahrersitzes, kombiniert für die Funktionen ARC/ARM/ARP (Belegung, Begrüßungsflags, manuelle Befehle, Speicher), gesendet bei Änderung.'
  it: 'Stato di accoglienza/richiamo memoria del sedile conducente, che raggruppa le funzioni ARC/ARM/ARP (occupazione, indicatori di accoglienza, comandi manuali, memoria), inviato al cambio.'
  pl: 'Stan powitania/przywołania pamięci fotela kierowcy, łączący funkcje ARC/ARM/ARP (obecność, flagi powitania, polecenia ręczne, pamięć), wysyłany przy zmianie.'
  ru: 'Состояние приветствия/вызова памяти сиденья водителя, объединяющее функции ARC/ARM/ARP (присутствие, флаги приветствия, ручные команды, память), отправляется при изменении.'
  zh: '驾驶员座椅迎宾/记忆恢复状态，汇总ARC/ARM/ARP功能（占用、迎宾标志、手动命令、记忆），状态变化时发送。'
  hu: 'A vezetőülés üdvözlő/memória-visszaállítási állapota, az ARC/ARM/ARP funkciókat összesítve (jelenlét, üdvözlő jelzők, kézi parancsok, memória), változáskor küldve.'
  pt: 'Estado de boas-vindas/memória do banco do condutor, combinando as funções ARC/ARM/ARP (ocupação, indicadores de boas-vindas, comandos manuais, memória), enviado na mudança.'
observations:
  en: 'On state change of: BUSINESS_SEAT_MOVE_FRONT_REQUEST, BUSINESS_SEAT_MOVE_REAR_REQUEST, SEAT_EASY_ENTRY_CLEARANCE_IN_PROGRESS, SEAT_EASY_ENTRY_RESTORE_IN_PROGRESS, REAR_DRIVER_SEAT_MANUAL_COMMAND, REAR_MIDDLE_SEAT_MANUAL_COMMAND, REAR_PASSENGER_SEAT_MANUAL_COMMAND, REAR_DRIVER_SEAT_POSITION_MEMORY_STATUS, REAR_MIDDLE_SEAT_POSITION_MEMORY_STATUS, REAR_PASSENGER_SEAT_POSITION_MEMORY_STATUS. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : BUSINESS_SEAT_MOVE_FRONT_REQUEST, BUSINESS_SEAT_MOVE_REAR_REQUEST, SEAT_EASY_ENTRY_CLEARANCE_IN_PROGRESS, SEAT_EASY_ENTRY_RESTORE_IN_PROGRESS, REAR_DRIVER_SEAT_MANUAL_COMMAND, REAR_MIDDLE_SEAT_MANUAL_COMMAND, REAR_PASSENGER_SEAT_MANUAL_COMMAND, REAR_DRIVER_SEAT_POSITION_MEMORY_STATUS, REAR_MIDDLE_SEAT_POSITION_MEMORY_STATUS, REAR_PASSENGER_SEAT_POSITION_MEMORY_STATUS. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: BUSINESS_SEAT_MOVE_FRONT_REQUEST, BUSINESS_SEAT_MOVE_REAR_REQUEST, SEAT_EASY_ENTRY_CLEARANCE_IN_PROGRESS, SEAT_EASY_ENTRY_RESTORE_IN_PROGRESS, REAR_DRIVER_SEAT_MANUAL_COMMAND, REAR_MIDDLE_SEAT_MANUAL_COMMAND, REAR_PASSENGER_SEAT_MANUAL_COMMAND, REAR_DRIVER_SEAT_POSITION_MEMORY_STATUS, REAR_MIDDLE_SEAT_POSITION_MEMORY_STATUS, REAR_PASSENGER_SEAT_POSITION_MEMORY_STATUS. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: BUSINESS_SEAT_MOVE_FRONT_REQUEST, BUSINESS_SEAT_MOVE_REAR_REQUEST, SEAT_EASY_ENTRY_CLEARANCE_IN_PROGRESS, SEAT_EASY_ENTRY_RESTORE_IN_PROGRESS, REAR_DRIVER_SEAT_MANUAL_COMMAND, REAR_MIDDLE_SEAT_MANUAL_COMMAND, REAR_PASSENGER_SEAT_MANUAL_COMMAND, REAR_DRIVER_SEAT_POSITION_MEMORY_STATUS, REAR_MIDDLE_SEAT_POSITION_MEMORY_STATUS, REAR_PASSENGER_SEAT_POSITION_MEMORY_STATUS. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: BUSINESS_SEAT_MOVE_FRONT_REQUEST, BUSINESS_SEAT_MOVE_REAR_REQUEST, SEAT_EASY_ENTRY_CLEARANCE_IN_PROGRESS, SEAT_EASY_ENTRY_RESTORE_IN_PROGRESS, REAR_DRIVER_SEAT_MANUAL_COMMAND, REAR_MIDDLE_SEAT_MANUAL_COMMAND, REAR_PASSENGER_SEAT_MANUAL_COMMAND, REAR_DRIVER_SEAT_POSITION_MEMORY_STATUS, REAR_MIDDLE_SEAT_POSITION_MEMORY_STATUS, REAR_PASSENGER_SEAT_POSITION_MEMORY_STATUS. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: BUSINESS_SEAT_MOVE_FRONT_REQUEST, BUSINESS_SEAT_MOVE_REAR_REQUEST, SEAT_EASY_ENTRY_CLEARANCE_IN_PROGRESS, SEAT_EASY_ENTRY_RESTORE_IN_PROGRESS, REAR_DRIVER_SEAT_MANUAL_COMMAND, REAR_MIDDLE_SEAT_MANUAL_COMMAND, REAR_PASSENGER_SEAT_MANUAL_COMMAND, REAR_DRIVER_SEAT_POSITION_MEMORY_STATUS, REAR_MIDDLE_SEAT_POSITION_MEMORY_STATUS, REAR_PASSENGER_SEAT_POSITION_MEMORY_STATUS. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: BUSINESS_SEAT_MOVE_FRONT_REQUEST, BUSINESS_SEAT_MOVE_REAR_REQUEST, SEAT_EASY_ENTRY_CLEARANCE_IN_PROGRESS, SEAT_EASY_ENTRY_RESTORE_IN_PROGRESS, REAR_DRIVER_SEAT_MANUAL_COMMAND, REAR_MIDDLE_SEAT_MANUAL_COMMAND, REAR_PASSENGER_SEAT_MANUAL_COMMAND, REAR_DRIVER_SEAT_POSITION_MEMORY_STATUS, REAR_MIDDLE_SEAT_POSITION_MEMORY_STATUS, REAR_PASSENGER_SEAT_POSITION_MEMORY_STATUS. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当BUSI_AV, BUSINESS_SEAT_MOVE_REAR_REQUEST, SEAT_EASY_ENTRY_CLEARANCE_IN_PROGRESS, SEAT_EASY_ENTRY_RESTORE_IN_PROGRESS, REAR_DRIVER_SEAT_MANUAL_COMMAND, REAR_MIDDLE_SEAT_MANUAL_COMMAND, REAR_PASSENGER_SEAT_MANUAL_COMMAND, REAR_DRIVER_SEAT_POSITION_MEMORY_STATUS, REAR_MIDDLE_SEAT_POSITION_MEMORY_STATUS, MEM_BDM_ARP状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z) BUSINESS_SEAT_MOVE_FRONT_REQUEST, BUSINESS_SEAT_MOVE_REAR_REQUEST, SEAT_EASY_ENTRY_CLEARANCE_IN_PROGRESS, SEAT_EASY_ENTRY_RESTORE_IN_PROGRESS, REAR_DRIVER_SEAT_MANUAL_COMMAND, REAR_MIDDLE_SEAT_MANUAL_COMMAND, REAR_PASSENGER_SEAT_MANUAL_COMMAND, REAR_DRIVER_SEAT_POSITION_MEMORY_STATUS, REAR_MIDDLE_SEAT_POSITION_MEMORY_STATUS, REAR_PASSENGER_SEAT_POSITION_MEMORY_STATUS állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: BUSINESS_SEAT_MOVE_FRONT_REQUEST, BUSINESS_SEAT_MOVE_REAR_REQUEST, SEAT_EASY_ENTRY_CLEARANCE_IN_PROGRESS, SEAT_EASY_ENTRY_RESTORE_IN_PROGRESS, REAR_DRIVER_SEAT_MANUAL_COMMAND, REAR_MIDDLE_SEAT_MANUAL_COMMAND, REAR_PASSENGER_SEAT_MANUAL_COMMAND, REAR_DRIVER_SEAT_POSITION_MEMORY_STATUS, REAR_MIDDLE_SEAT_POSITION_MEMORY_STATUS, REAR_PASSENGER_SEAT_POSITION_MEMORY_STATUS. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['200ms', 'trigger']
senders: ['BDM_A']
receivers: ['BSI', 'BDM_C']

