id: 0x0E8
name: 'RAPID_ALERTS'
type: 'can'
length: 7
comment:
  en: 'Rapid (high-priority) alert block sent on change of state: door opening at speed, tyre pressure, ESP, suspension movement, auto lighting/wiping, fuel level, child lock, parking measurement, etc.'
  fr: 'Bloc d''alertes rapides envoyé sur changement d''état : ouverture de porte en roulant, pression des pneus, ESP, mouvement de suspension, éclairage/essuyage automatique, niveau de carburant, sécurité enfant, mesure de stationnement, etc.'
  es: 'Bloque de alertas rápidas enviado al cambiar de estado: apertura de puerta en marcha, presión de neumáticos, ESP, movimiento de suspensión, alumbrado/limpiaparabrisas automático, nivel de combustible, seguro para niños, medición de aparcamiento, etc.'
  de: 'Block schneller (hochprioriter) Warnungen, gesendet bei Zustandsänderung: Türöffnung während der Fahrt, Reifendruck, ESP, Federungsbewegung, automatisches Licht/Wischen, Kraftstoffstand, Kindersicherung, Einparkmessung usw.'
  it: 'Blocco di allarmi rapidi inviato al cambio di stato: apertura porta in marcia, pressione pneumatici, ESP, movimento sospensione, luci/tergicristalli automatici, livello carburante, sicurezza bambini, misurazione di parcheggio, ecc.'
  pl: 'Blok szybkich alertów wysyłany przy zmianie stanu: otwarcie drzwi podczas jazdy, ciśnienie w oponach, ESP, ruch zawieszenia, automatyczne światła/wycieraczki, poziom paliwa, blokada dla dzieci, pomiar miejsca parkingowego itp.'
  ru: 'Блок быстрых (высокоприоритетных) предупреждений, отправляемый при изменении состояния: открытие двери в движении, давление в шинах, ESP, движение подвески, автосвет/автодворники, уровень топлива, блокировка от детей, измерение парковочного места и т. д.'
  zh: '状态变化时发送的高优先级（快速）警报块：行驶中车门打开、胎压、ESP、悬挂运动、自动大灯/雨刷、燃油液位、儿童锁、停车测量等。'
  hu: 'Állapotváltozáskor küldött gyors (magas prioritású) riasztásblokk: ajtónyitás menet közben, gumiabroncsnyomás, ESP, futómű mozgása, automatikus világítás/ablaktörlő, üzemanyagszint, gyerekzár, parkolóhely-mérés stb.'
  pt: 'Bloco de alertas rápidos (alta prioridade) enviado na mudança de estado: abertura de porta em andamento, pressão dos pneus, ESP, movimento da suspensão, iluminação/limpeza automática, nível de combustível, bloqueio para crianças, medição de estacionamento, etc.'
