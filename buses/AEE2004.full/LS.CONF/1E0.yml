id: 0x1E0
name: 'RADIO_CONFIG_STATUS'
alt_names: ['RADIO_STATUS_CONFIG']
type: 'can'
length: 5
comment:
  en: 'Radio configuration and status: ambience selection, CD-text, scan, random track, PTY and RDS settings.'
  fr: 'Configuration et état de l''autoradio : sélection d''ambiance, CD-text, balayage, lecture aléatoire, PTY et réglages RDS.'
  es: 'Configuración y estado de la radio: selección de ambiente, CD-text, escaneo, reproducción aleatoria, PTY y ajustes RDS.'
  de: 'Konfiguration und Status des Radios: Ambiente-Auswahl, CD-Text, Scan, Zufallswiedergabe, PTY und RDS-Einstellungen.'
  it: 'Configurazione e stato dell''autoradio: selezione ambiente, CD-text, scansione, riproduzione casuale, PTY e impostazioni RDS.'
  pl: 'Konfiguracja i stan radia: wybór klimatu dźwięku, CD-text, skanowanie, odtwarzanie losowe, PTY i ustawienia RDS.'
  ru: 'Конфигурация и статус радио: выбор эквалайзера, CD-текст, сканирование, случайное воспроизведение, PTY и настройки RDS.'
  zh: '收音机的配置和状态:音效选择、CD文本、扫描、随机播放、PTY和RDS设置。'
  hu: 'A rádió konfigurációja és állapota: hangzás kiválasztása, CD-szöveg, pásztázás, véletlen lejátszás, PTY és RDS beállítások.'
  pt: 'Configuração e estado da rádio: seleção de ambiente, CD-text, varrimento, faixa aleatória, definições PTY e RDS.'
observations:
  en: 'On parameter change. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur modification d''un paramètre. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al modificar un parámetro. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Parameteränderung. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Alla modifica di un parametro. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Przy zmianie wartości parametru. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении параметра. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '参数被修改时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'Paraméter módosításakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de parâmetro. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['500ms', 'trigger']
senders: ['RAD', 'ICSV']
receivers: ['EMF', 'CMB', 'ICSV']

