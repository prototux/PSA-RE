id: 0x14C
name: 'CENTRAL_LOCKING_WINDOW_COMMAND'
type: 'can'
length: 5
comment:
  en: 'Central locking and window state sent on change: general auto window function, boot state, door states and window movement.'
  fr: 'État de la fermeture centralisée et des vitres envoyé sur changement : fonction générale de vitre automatique, état du coffre, états des portes et mouvement des vitres.'
  es: 'Estado del cierre centralizado y de las ventanillas enviado al cambiar: función general de ventanilla automática, estado del maletero, estados de las puertas y movimiento de las ventanillas.'
  de: 'Zustand der Zentralverriegelung und der Fenster, gesendet bei Änderung: allgemeine Fensterautomatikfunktion, Kofferraumzustand, Türzustände und Fensterbewegung.'
  it: 'Stato della chiusura centralizzata e dei finestrini inviato al cambio: funzione generale finestrino automatico, stato bagagliaio, stati porte e movimento finestrini.'
  pl: 'Stan centralnego zamka i szyb wysyłany przy zmianie: ogólna funkcja automatycznej szyby, stan bagażnika, stany drzwi i ruch szyb.'
  ru: 'Состояние центрального замка и стёкол, отправляемое при изменении: общая функция автоматического стекла, состояние багажника, состояния дверей и движение стёкол.'
  zh: '状态变化时发送的中控锁及车窗状态：车窗自动化通用功能、后备箱状态、车门状态及车窗运动。'
  hu: 'A központi zár és az ablakok állapota, változáskor küldve: általános automatikus ablakfunkció, csomagtér-állapot, ajtóállapotok és ablakmozgás.'
  pt: 'Estado da trancagem centralizada e dos vidros enviado na mudança: função geral automática dos vidros, estado da bagageira, estados das portas e movimento dos vidros.'
observations:
  en: 'On state change of: FRONT_LEFT_WINDOW_COMMAND, FRONT_RIGHT_WINDOW_COMMAND, WINDOW_POSITION_COMMAND, REAR_LEFT_WINDOW_COMMAND, REAR_RIGHT_WINDOW_COMMAND. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : FRONT_LEFT_WINDOW_COMMAND, FRONT_RIGHT_WINDOW_COMMAND, WINDOW_POSITION_COMMAND, REAR_LEFT_WINDOW_COMMAND, REAR_RIGHT_WINDOW_COMMAND. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: FRONT_LEFT_WINDOW_COMMAND, FRONT_RIGHT_WINDOW_COMMAND, WINDOW_POSITION_COMMAND, REAR_LEFT_WINDOW_COMMAND, REAR_RIGHT_WINDOW_COMMAND. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: FRONT_LEFT_WINDOW_COMMAND, FRONT_RIGHT_WINDOW_COMMAND, WINDOW_POSITION_COMMAND, REAR_LEFT_WINDOW_COMMAND, REAR_RIGHT_WINDOW_COMMAND. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: FRONT_LEFT_WINDOW_COMMAND, FRONT_RIGHT_WINDOW_COMMAND, WINDOW_POSITION_COMMAND, REAR_LEFT_WINDOW_COMMAND, REAR_RIGHT_WINDOW_COMMAND. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: FRONT_LEFT_WINDOW_COMMAND, FRONT_RIGHT_WINDOW_COMMAND, WINDOW_POSITION_COMMAND, REAR_LEFT_WINDOW_COMMAND, REAR_RIGHT_WINDOW_COMMAND. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: FRONT_LEFT_WINDOW_COMMAND, FRONT_RIGHT_WINDOW_COMMAND, WINDOW_POSITION_COMMAND, REAR_LEFT_WINDOW_COMMAND, REAR_RIGHT_WINDOW_COMMAND. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当LVE_MVT_AVG, FRONT_RIGHT_WINDOW_COMMAND, WINDOW_POSITION_COMMAND, REAR_LEFT_WINDOW_COMMAND, LVE_MVT_ARD状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z) FRONT_LEFT_WINDOW_COMMAND, FRONT_RIGHT_WINDOW_COMMAND, WINDOW_POSITION_COMMAND, REAR_LEFT_WINDOW_COMMAND, REAR_RIGHT_WINDOW_COMMAND állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: FRONT_LEFT_WINDOW_COMMAND, FRONT_RIGHT_WINDOW_COMMAND, WINDOW_POSITION_COMMAND, REAR_LEFT_WINDOW_COMMAND, REAR_RIGHT_WINDOW_COMMAND. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['100ms', 'trigger']
senders: ['BSI']
receivers: ['EDP_C', 'BTE', 'BDM_A']

