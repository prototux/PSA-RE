id: 0x168
name: 'COMBINE_ALERTS_INDICATORS'
type: 'can'
length: 8
comment:
  en: 'Instrument cluster telltale lamp commands sent on change: ABS, ASR, steering assist, parking brake and service/system faults.'
  fr: 'Commandes des témoins du combiné envoyées sur changement : ABS, ASR, assistance de direction, frein de parking et défauts service/système.'
  es: 'Órdenes de los testigos del cuadro enviadas al cambiar: ABS, ASR, asistencia de dirección, freno de estacionamiento y fallos de servicio/sistema.'
  de: 'Kontrollleuchtenbefehle des Kombiinstruments, gesendet bei Änderung: ABS, ASR, Lenkhilfe, Feststellbremse und Service-/Systemfehler.'
  it: 'Comandi delle spie del quadro strumenti inviati al cambio: ABS, ASR, servosterzo, freno di stazionamento e guasti servizio/sistema.'
  pl: 'Polecenia kontrolek zestawu wskaźników wysyłane przy zmianie: ABS, ASR, wspomaganie kierownicy, hamulec postojowy i usterki serwisowe/systemowe.'
  ru: 'Команды контрольных ламп приборной панели, отправляемые при изменении: ABS, ASR, усилитель руля, стояночный тормоз и неисправности обслуживания/системы.'
  zh: '仪表组指示灯命令，状态变化时发送：ABS、ASR、转向助力、驻车制动及维修/系统故障。'
  hu: 'A műszerfal jelzőlámpa-parancsai, változáskor küldve: ABS, ASR, kormányszervó, rögzítőfék és szerviz-/rendszerhibák.'
  pt: 'Comandos das luzes avisadoras do quadrante de instrumentos enviados na mudança: ABS, ASR, assistência de direção, travão de estacionamento e avarias de serviço/sistema.'
observations:
  en: 'On state change of: PARKING_BRAKE_TIGHT_FAULT, PARKING_BRAKE_FAULT, STT_INDICATOR. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : PARKING_BRAKE_TIGHT_FAULT, PARKING_BRAKE_FAULT, STT_INDICATOR. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: PARKING_BRAKE_TIGHT_FAULT, PARKING_BRAKE_FAULT, STT_INDICATOR. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: PARKING_BRAKE_TIGHT_FAULT, PARKING_BRAKE_FAULT, STT_INDICATOR. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: PARKING_BRAKE_TIGHT_FAULT, PARKING_BRAKE_FAULT, STT_INDICATOR. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: PARKING_BRAKE_TIGHT_FAULT, PARKING_BRAKE_FAULT, STT_INDICATOR. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: PARKING_BRAKE_TIGHT_FAULT, PARKING_BRAKE_FAULT, STT_INDICATOR. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当FSE_SER_DEF, PARKING_BRAKE_FAULT, DMD_ALLUM_STT状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z) PARKING_BRAKE_TIGHT_FAULT, PARKING_BRAKE_FAULT, STT_INDICATOR állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: PARKING_BRAKE_TIGHT_FAULT, PARKING_BRAKE_FAULT, STT_INDICATOR. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['CMB', 'VTH', 'BCD', 'MATT', 'BGP']

