id: 0x150
name: 'AC_EXTERNAL_SENSOR_INFO'
type: 'can'
length: 4
comment:
  en: 'Air conditioning carbon monoxide and NOx sensor levels (alternate frame).'
  fr: 'Niveaux des capteurs de monoxyde de carbone et NOx de la climatisation (trame alternative).'
  es: 'Niveles de los sensores de monóxido de carbono y NOx del climatizador (trama alternativa).'
  de: 'Kohlenmonoxid- und NOx-Sensorwerte der Klimaanlage (alternativer Rahmen).'
  it: 'Livelli dei sensori di monossido di carbonio e NOx del climatizzatore (trama alternativa).'
  pl: 'Poziomy czujników tlenku węgla i NOx klimatyzacji (ramka alternatywna).'
  ru: 'Уровни датчиков угарного газа и NOx кондиционера (альтернативный кадр).'
  zh: '空调一氧化碳及NOx传感器水平(备用帧)。'
  hu: 'A klíma szén-monoxid- és NOx-érzékelő szintjei (alternatív keret).'
  pt: 'Níveis dos sensores de monóxido de carbono e NOx da climatização (trama alternativa).'
periodicity: ['100ms']
senders: ['CLIM_AV']
receivers: ['BSI']

signals:
  CO_POLLUTANT_LEVEL_NEW:
    bits: '1.7-1.0'
    comment:
      en: 'CO pollutant level (new technology)'
      fr: 'Niveau de polluant CO (nouvelle technologie)'
      es: 'Nivel de contaminante CO (nueva tecnología)'
      de: 'CO-Schadstoffgehalt (neue Technologie)'
      it: 'Livello di inquinante CO (nuova tecnologia)'
      pl: 'Poziom zanieczyszczenia CO (nowa technologia)'
      ru: 'Уровень загрязнения CO (новая технология)'
      zh: 'CO污染物水平(新技术)'
      hu: 'CO szennyezőanyag szintje (új technológia)'
      pt: 'Nível do poluente CO (nova tecnologia)'
    type: 'uint'
    factor: 0.4
    min: 0
    max: 100
    units: '%'
    invalid: 0xFF
    default: 0xFA

  NOX_POLLUTANT_LEVEL_NEW:
    bits: '2.7-2.0'
    comment:
      en: 'NOx pollutant level (new technology)'
      fr: 'Niveau de polluant NOx (nouvelle technologie)'
      es: 'Nivel de contaminante NOx (nueva tecnología)'
      de: 'NOx-Schadstoffgehalt (neue Technologie)'
      it: 'Livello di inquinante NOx (nuova tecnologia)'
      pl: 'Poziom zanieczyszczenia NOx (nowa technologia)'
      ru: 'Уровень загрязнения NOx (новая технология)'
      zh: 'NOx污染物水平(新技术)'
      hu: 'NOx szennyezőanyag szintje (új technológia)'
      pt: 'Nível do poluente NOx (nova tecnologia)'
    type: 'uint'
    factor: 0.4
    min: 0
    max: 100
    units: '%'
    invalid: 0xFF
    default: 0xFA

  UNUSED_1:
    bits: '3.7-4.0'
    unused: true
