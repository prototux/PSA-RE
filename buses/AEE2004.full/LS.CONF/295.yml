      de: 'Bewegung der rechten Tür (Schließen, Öffnen, keine)'
      it: 'Movimento della porta destra (chiusura, apertura, nessuno)'
      pl: 'Ruch prawych drzwi (zamykanie, otwieranie, brak)'
      ru: 'Движение правой двери (закрытие, открытие, отсутствует)'
      zh: '右车门运动(关闭、打开、无)'
      hu: 'A jobb oldali ajtó mozgása (zárás, nyitás, nincs)'
      pt: 'Movimento da porta direita (fecho, abertura, nenhum)'
    type: 'enum'
