id: 0x295
name: 'SLIDING_DOOR_RIGHT_STATUS'
type: 'can'
length: 3
comment:
  en: 'Status of the right powered sliding door: fault, obstacle detection, movement and position.'
  fr: 'État de la porte latérale coulissante droite : défaut, détection d''obstacle, mouvement et position.'
  es: 'Estado de la puerta corredera lateral derecha: fallo, deteccion de obstáculo, movimiento y posición.'
  de: 'Status der rechten elektrischen Schiebetür: Fehler, Hinderniserkennung, Bewegung und Position.'
  it: 'Stato della porta scorrevole laterale destra: guasto, rilevamento ostacolo, movimento e posizione.'
  pl: 'Stan prawych drzwi przesuwnych: usterka, wykrywanie przeszkody, ruch i pozycja.'
  ru: 'Статус правой сдвижной двери: неисправность, обнаружение препятствия, движение и положение.'
  zh: '右侧滑门状态:故障、障碍物检测、运动及位置。'
  hu: 'A jobb oldali tolóajtó állapota: hiba, akadályérzékelés, mozgás és pozíció.'
  pt: 'Estado da porta corrediça lateral direita: avaria, deteção de obstáculo, movimento e posição.'
periodicity: ['200ms', 'trigger']
senders: ['MDPLC']
receivers: ['BSI']

signals:
  UNUSED_1:
    bits: '1.7-1.6'
    unused: true

