id: 0x00000860
name: 'AC_EXTERNAL_SENSOR_INFO_MCC'
type: 'can'
extended: true
length: 5
comment:
  en: 'Air conditioning control module data from external sensors: carbon monoxide and NOx levels.'
  fr: 'Données du module de contrôle climatisation issues de capteurs extérieurs : niveaux de monoxyde de carbone et de NOx.'
  es: 'Datos del módulo de control del climatizador de sensores exteriores: niveles de monóxido de carbono y NOx.'
  de: 'Daten des Klimasteuermoduls von externen Sensoren: Kohlenmonoxid- und NOx-Werte.'
  it: 'Dati del modulo di controllo del climatizzatore dai sensori esterni: livelli di monossido di carbonio e NOx.'
  pl: 'Dane modułu sterowania klimatyzacją z czujników zewnętrznych: poziomy tlenku węgla i NOx.'
  ru: 'Данные модуля управления кондиционером от внешних датчиков: уровни угарного газа и NOx.'
  zh: '空调控制模块外部传感器数据:一氧化碳及NOx水平。'
  hu: 'A klíma vezérlőmodul külső érzékelőktől származó adatai: szén-monoxid- és NOx-szint.'
  pt: 'Dados do módulo de controlo da climatização provenientes de sensores exteriores: níveis de monóxido de carbono e de NOx.'
periodicity: ['trigger']
senders: []  # TODO: find the sender(s)
receivers: ['BSI']

signals:
  CO_POLLUTANT_LEVEL:
    bits: '1.7-2.0'
    comment:
      en: 'CO pollutant level'
      fr: 'Niveau de polluant CO'
      es: 'Nivel de contaminante CO'
      de: 'CO-Schadstoffgehalt'
      it: 'Livello di inquinante CO'
      pl: 'Poziom zanieczyszczenia CO'
      ru: 'Уровень загрязнения CO'
      zh: 'CO污染物水平'
      hu: 'CO szennyezőanyag szintje'
      pt: 'Nível do poluente CO'
    type: 'uint'
    factor: 1
    min: 20
    max: 10000
    units: 'Hz'
    invalid: 0xFFFF
    default: 0xFFFF

  NOX_POLLUTANT_LEVEL:
    bits: '3.7-4.0'
    comment:
      en: 'NOx pollutant level'
      fr: 'Niveau de polluant NOx'
      es: 'Nivel de contaminante NOx'
      de: 'NOx-Schadstoffgehalt'
      it: 'Livello di inquinante NOx'
      pl: 'Poziom zanieczyszczenia NOx'
      ru: 'Уровень загрязнения NOx'
      zh: 'NOx污染物水平'
      hu: 'NOx szennyezőanyag szintje'
      pt: 'Nível do poluente NOx'
    type: 'uint'
    factor: 1
    min: 20
    max: 10000
    units: 'Hz'
    invalid: 0xFFFF
    default: 0xFFFF

  UNUSED_1:
    bits: '5.7-5.0'
    unused: true
