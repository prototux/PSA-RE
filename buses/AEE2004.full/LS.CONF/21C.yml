id: 0x21C
name: 'STL_STATUS'
type: 'can'
length: 2
comment:
  en: 'Steering lock status: fault, state, abnormal/normal engagement (left/right) and restart'
  fr: 'État du verrouillage de colonne de direction : défaut, état, enclenchement anormal/normal (droite/gauche) et relance'
  es: 'Estado del bloqueo de la columna de dirección: fallo, estado, enclavamiento anormal/normal (izquierda/derecha) y reinicio'
  de: 'Status der Lenksäulensperre: Fehler, Zustand, anormales/normales Einrasten (links/rechts) und Neustart'
  it: 'Stato del bloccasterzo: guasto, stato, innesto anomalo/normale (sinistra/destra) e riavvio'
  pl: 'Stan blokady kolumny kierownicy: usterka, stan, nienormalne/normalne zazębienie (lewe/prawe) i ponowne uruchomienie'
  ru: 'Состояние блокировки рулевой колонки: неисправность, состояние, аномальное/нормальное зацепление (влево/вправо) и перезапуск'
  zh: '转向锁状态:故障、状态、左右异常/正常啮合及重新启动'
  hu: 'A kormányzár állapota: hiba, állapot, rendellenes/normál bekapcsolódás (bal/jobb) és újraindítás'
  pt: 'Estado do bloqueio de direção: avaria, estado, engate anómalo/normal (esquerda/direita) e reinício.'
observations:
  en: 'On state change of any parameter of the frame. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de cualquier parámetro de la trama. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния любого параметра кадра. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '该帧任意参数状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A keret bármely paraméterének állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['200ms', 'trigger']
senders: ['BSTL']
receivers: ['BSI']

signals:
  STL_FAULT_PRESENT:
    bits: '1.7'
    comment:
      en: 'Fault present in the lane departure warning system (STL).'
      fr: 'Défaut présent sur le système d''avertissement de franchissement de ligne (STL).'
      es: 'Fallo presente en el sistema de aviso de cambio de carril (STL).'
      de: 'Fehler im Spurverlassenswarnsystem (STL) vorhanden.'
      it: 'Guasto presente nel sistema di avviso di superamento linea (STL).'
      pl: 'Obecna usterka systemu ostrzegania o zjeździe z pasa (STL).'
      ru: 'Наличие неисправности в системе предупреждения о пересечении полосы (STL).'
      zh: '车道偏离预警系统(STL)存在故障。'
      hu: 'Hiba van jelen a sávelhagyás-jelző rendszerben (STL).'
      pt: 'Falha presente no sistema de aviso de mudança de faixa involuntária (STL)'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No fault'
        fr: 'Pas de défaut'
        es: 'Sin fallo'
        de: 'Kein Fehler'
        it: 'Nessun guasto'
        pl: 'Brak usterki'
        ru: 'Нет неисправности'
        zh: '无故障'
