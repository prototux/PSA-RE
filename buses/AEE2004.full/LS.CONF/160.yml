id: 0x160
name: 'CD_PLAYER_CONFIG_STATUS'
type: 'can'
length: 2
comment:
  en: 'CD player configuration and status: CD-text, scan, random track and repertoire settings.'
  fr: 'Configuration et état du lecteur CD : CD-text, balayage, lecture aléatoire et répertoire.'
  es: 'Configuración y estado del reproductor de CD: CD-text, escaneo, reproducción aleatoria y repertorio.'
  de: 'Konfiguration und Status des CD-Spielers: CD-Text, Scan, Zufallswiedergabe und Verzeichnis.'
  it: 'Configurazione e stato del lettore CD: CD-text, scansione, riproduzione casuale e repertorio.'
  pl: 'Konfiguracja i stan odtwarzacza CD: CD-text, skanowanie, odtwarzanie losowe i repertuar.'
  ru: 'Конфигурация и статус CD-плеера: CD-текст, сканирование, случайное воспроизведение и репертуар.'
  zh: 'CD播放器的配置和状态:CD文本、扫描、随机播放和曲目列表。'
  hu: 'A CD-lejátszó konfigurációja és állapota: CD-szöveg, pásztázás, véletlen lejátszás és tartalomjegyzék.'
  pt: 'Configuração e estado do leitor de CD: CD-text, varrimento, faixa aleatória e definições de repertório.'
periodicity: ['trigger']
senders: []  # TODO: find the sender(s)

signals:
  TRACK_INTRO_OPTION:
    bits: '1.7-1.6'
    comment:
      en: 'Track intro-scan mode option'
      fr: 'Option du mode de lecture intro-scan'
      es: 'Opción del modo de reproducción intro-scan'
      de: 'Option des Intro-Scan-Modus'
      it: 'Opzione della modalità intro-scan'
      pl: 'Opcja trybu odtwarzania intro-scan'
      ru: 'Опция режима интро-сканирования треков'
      zh: '曲目片段扫描模式选项'
      hu: 'Bevezető-pásztázás mód beállítása'
      pt: 'Opção do modo de pré-audição de faixas (intro-scan)'
    type: 'uint'

  TRACK_INTRO_ENABLED:
    bits: '1.5'
    comment:
      en: 'Track intro-scan mode activation status'
      fr: 'État d''activation du mode de lecture intro-scan'
      es: 'Estado de activación del modo de reproducción intro-scan'
      de: 'Aktivierungsstatus des Intro-Scan-Modus'
      it: 'Stato di attivazione della modalità intro-scan'
      pl: 'Stan aktywacji trybu odtwarzania intro-scan'
      ru: 'Статус активации режима интро-сканирования'
      zh: '曲目片段扫描模式激活状态'
      hu: 'Bevezető-pásztázás mód aktiválási állapota'
      pt: 'Estado de ativação do modo de pré-audição de faixas'
    type: 'bool'

  RANDOM_OPTION:
    bits: '1.4-1.3'
    comment:
      en: 'Track shuffle mode option'
      fr: 'Option du mode de lecture aléatoire des plages'
      es: 'Opción del modo de reproducción aleatoria de pistas'
      de: 'Option des Zufallswiedergabemodus für Titel'
      it: 'Opzione della modalità di riproduzione casuale delle tracce'
      pl: 'Opcja trybu losowego odtwarzania utworów'
      ru: 'Опция режима случайного воспроизведения треков'
      zh: '曲目随机播放模式选项'
      hu: 'Számok véletlenszerű lejátszásának beállítása'
      pt: 'Opção do modo de reprodução aleatória das faixas'
    type: 'uint'

  RANDOM_ENABLED:
    bits: '1.2'
    comment:
      en: 'Track/file shuffle mode activation status'
      fr: 'État d''activation du mode de lecture aléatoire des plages/fichiers'
      es: 'Estado de activación del modo de reproducción aleatoria de pistas/archivos'
      de: 'Aktivierungsstatus des Zufallswiedergabemodus für Titel/Dateien'
      it: 'Stato di attivazione della modalità di riproduzione casuale di tracce/file'
      pl: 'Stan aktywacji trybu losowego odtwarzania utworów/plików'
      ru: 'Статус активации режима случайного воспроизведения треков/файлов'
      zh: '曲目/文件随机播放模式激活状态'
      hu: 'Szám/fájl véletlenszerű lejátszásának aktiválási állapota'
      pt: 'Estado de ativação do modo de reprodução aleatória de faixas/ficheiros'
    type: 'bool'

  REPEAT_OPTION:
    bits: '1.1-1.0'
    comment:
      en: 'Disc repeat mode option'
      fr: 'Option du mode de répétition disque'
      es: 'Opción del modo de repetición de disco'
      de: 'Option des Disc-Wiederholungsmodus'
      it: 'Opzione della modalità di ripetizione del disco'
      pl: 'Opcja trybu powtarzania płyty'
      ru: 'Опция режима повтора диска'
      zh: '光盘重复播放模式选项'
      hu: 'Lemezismétlési mód beállítása'
      pt: 'Opção do modo de repetição de disco'
    type: 'uint'

  REPEAT_ENABLED:
    bits: '2.7'
    comment:
      en: 'Disc/directory repeat mode activation status'
      fr: 'État d''activation du mode de répétition disque/répertoire'
      es: 'Estado de activación del modo de repetición de disco/directorio'
      de: 'Aktivierungsstatus des Wiederholungsmodus für Disc/Verzeichnis'
      it: 'Stato di attivazione della modalità di ripetizione disco/cartella'
      pl: 'Stan aktywacji trybu powtarzania płyty/katalogu'
      ru: 'Статус активации режима повтора диска/каталога'
      zh: '光盘/目录重复播放模式激活状态'
      hu: 'Lemez/könyvtár ismétlési mód aktiválási állapota'
      pt: 'Estado de ativação do modo de repetição de disco/diretório'
    type: 'bool'

  CD_TEXT_CFG:
    bits: '2.6-2.5'
    comment:
      en: 'CD-Text mode option'
      fr: 'Option du mode CD Texte'
      es: 'Opción del modo CD Texto'
      de: 'Option des CD-Text-Modus'
      it: 'Opzione della modalità CD Text'
      pl: 'Opcja trybu CD Text'
      ru: 'Опция режима CD-Text'
      zh: 'CD文本模式选项'
      hu: 'CD-szöveg mód beállítása'
      pt: 'Opção do modo CD Texto'
    type: 'uint'

  CD_TEXT_STAT:
    bits: '2.4'
    comment:
      en: 'CD-Text mode activation status'
      fr: 'État d''activation du mode CD Texte'
      es: 'Estado de activación del modo CD Texto'
      de: 'Aktivierungsstatus des CD-Text-Modus'
      it: 'Stato di attivazione della modalità CD Text'
      pl: 'Stan aktywacji trybu CD Text'
      ru: 'Статус активации режима CD-Text'
      zh: 'CD文本模式激活状态'
      hu: 'CD-szöveg mód aktiválási állapota'
      pt: 'Estado de ativação do modo CD Texto'
    type: 'bool'
