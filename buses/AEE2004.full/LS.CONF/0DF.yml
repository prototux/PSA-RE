id: 0x0DF
name: 'EMF_MENU_COMMAND'
type: 'can'
length: 3
comment:
  en: 'Menu command sent by the EMF module to the radio/display: selected item code, list line count and new value.'
  fr: 'Commande de menu envoyée par le module EMF vers l''autoradio/afficheur : code de l''élément sélectionné, nombre de lignes de la liste et nouvelle valeur.'
  es: 'Comando de menú enviado por el módulo EMF a la radio/pantalla: código del elemento seleccionado, número de líneas de la lista y nuevo valor.'
  de: 'Menübefehl vom EMF-Modul an Radio/Display: Code des ausgewählten Elements, Anzahl der Listenzeilen und neuer Wert.'
  it: 'Comando di menu inviato dal modulo EMF all''autoradio/display: codice dell''elemento selezionato, numero di righe dell''elenco e nuovo valore.'
  pl: 'Polecenie menu wysyłane przez moduł EMF do radia/wyświetlacza: kod wybranego elementu, liczba wierszy listy i nowa wartość.'
  ru: 'Команда меню, отправленная модулем EMF на радио/дисплей: код выбранного элемента, количество строк списка и новое значение.'
  zh: '由EMF模块发送给收音机/显示屏的菜单命令:所选项目代码、列表行数和新值。'
  hu: 'Az EMF modul által a rádió/kijelző felé küldött menüparancs: a kiválasztott elem kódja, a lista sorainak száma és az új érték.'
  pt: 'Comando de menu enviado pelo módulo EMF à rádio/visor: código do item selecionado, número de linhas da lista e novo valor.'
observations:
  en: 'On menu item value change. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur modification d''une valeur d''item de menu. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el valor de un elemento de menú. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Änderung eines Menüpunktwerts. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Alla modifica del valore di una voce di menu. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Przy zmianie wartości pozycji menu. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении значения пункта меню. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '菜单项数值变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'Menüelem értékének módosításakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de valor de um item de menu. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['500ms', 'trigger']
senders: ['EMF', 'CMB', 'ICSV']
receivers: ['RAD', 'KML', 'CDC']

