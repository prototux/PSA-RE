id: 0x052
name: 'TYRE_PRESSURE_REAR_STATUS'
type: 'can'
length: 6
comment:
  en: 'Rear tyre pressure monitoring: rear-left/right and spare wheel state and pressure.'
  fr: 'Surveillance de pression des pneus arrière : état et pression des roues arrière gauche/droite et de secours.'
  es: 'Supervisión de presión de neumáticos traseros: estado y presión de las ruedas trasera izquierda/derecha y de repuesto.'
  de: 'Überwachung des hinteren Reifendrucks: Zustand und Druck der Räder hinten links/rechts sowie des Ersatzrads.'
  it: 'Monitoraggio della pressione degli pneumatici posteriori: stato e pressione delle ruote posteriore sinistra/destra e di scorta.'
  pl: 'Monitorowanie ciśnienia tylnych opon: stan i ciśnienie kół tylnych lewego/prawego oraz zapasowego.'
  ru: 'Контроль давления задних шин: состояние и давление заднего левого/правого колеса и запасного.'
  zh: '后轮胎压监测:左后/右后车轮及备胎的状态和压力。'
  hu: 'A hátsó gumiabroncsok nyomásfigyelése: a hátsó bal/jobb kerék és a pótkerék állapota és nyomása.'
  pt: 'Monitorização da pressão dos pneus traseiros: estado e pressão das rodas traseiras esquerda/direita e do sobresselente.'
periodicity: ['1000ms']
senders: []  # TODO: find the sender(s)
receivers: ['BSI']

signals:
  REAR_LEFT_TYRE_PRESSURE:
    bits: '1.7-1.2'
    comment:
      en: 'Pressure in the rear left tyre'
      fr: 'Pression dans la roue arrière gauche'
      es: 'Presión de la rueda trasera izquierda'
      de: 'Reifendruck hinten links'
      it: 'Pressione della ruota posteriore sinistro'
      pl: 'Ciśnienie w kole tylnej lewej'
      ru: 'Давление в заднего левого колесе'
      zh: '左后轮胎压力'
      hu: 'A hátsó bal kerék nyomása'
      pt: 'Pressão do pneu traseiro esquerdo'
    type: 'enum'
    factor: 0.1
    units: 'bar'
    invalid: 0x3F
    default: 0x00
    values:
      0x00:
        en: 'Zero bar'
        fr: 'Zéro bar'
        es: 'Cero bares'
        de: 'Null bar'
        it: 'Zero bar'
        pl: 'Zero barów'
        ru: 'Ноль бар'
        zh: '零巴'
        hu: 'Nulla bar'
        pt: 'Zero bar'
      0x01:
