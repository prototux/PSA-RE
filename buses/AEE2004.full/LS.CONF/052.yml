        es: 'Cero, 1 bar'
        de: 'Null, 1 bar'
        it: 'Zero, 1 bar'
        pl: 'Zero, 1 bar'
        ru: 'Ноль, 1 бар'
        zh: '零，1巴'
        hu: 'Nulla, 1 bar'
        pt: 'Zero, 1 bar'
