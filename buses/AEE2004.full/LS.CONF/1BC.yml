id: 0x1BC
name: 'SEATBELT_REMINDER_BUZZER'
type: 'can'
length: 2
comment:
  en: 'Seatbelt reminder buzzer authorisation and control, sent by the BSI.'
  fr: 'Autorisation et commande du buzzer de rappel de bouclage de ceinture, envoyées par la BSI.'
  es: 'Autorización y mando del avisador sonoro de recordatorio del cinturón, enviados por la BSI.'
  de: 'Freigabe und Ansteuerung des Sicherheitsgurt-Erinnerungssummers, gesendet von der BSI.'
  it: 'Autorizzazione e comando del cicalino di promemoria cintura, inviati dalla BSI.'
  pl: 'Zezwolenie i sterowanie brzęczykiem przypomnienia o zapięciu pasów, wysyłane przez BSI.'
  ru: 'Разрешение и управление зуммером напоминания о ремне безопасности, отправляемые BSI.'
  zh: '由BSI发送的安全带提醒蜂鸣器授权与控制。'
  hu: 'A biztonságiöv-emlékeztető berregő engedélyezése és vezérlése, a BSI küldi.'
  pt: 'Autorização e comando do besouro do aviso de cinto de segurança, enviados pela BSI.'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['TNB']

signals:
  BNB_UNIT_AUTHORIZATION:
    bits: '1.7'
    comment:
      en: 'BNB unit authorization'
      fr: 'Autorisation du boîtier BNB'
      es: 'Autorización de la unidad BNB'
      de: 'Freigabe des BNB-Steuergeräts'
      it: 'Autorizzazione dell''unità BNB'
      pl: 'Zezwolenie na jednostkę BNB'
      ru: 'Разрешение блока BNB'
      zh: 'BNB单元授权'
      hu: 'A BNB egység engedélyezése'
      pt: 'Autorização da unidade BNB'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'BNB not authorised'
        fr: 'BNB non autorisé'
        es: 'BNB no autorizado'
        de: 'BNB nicht zugelassen'
        it: 'BNB non autorizzato'
        pl: 'BNB niedozwolone'
        ru: 'BNB не разрешён'
        zh: 'BNB未授权'
        hu: 'BNB nem engedélyezett'
        pt: 'BNB não autorizado'
      0x01:
        en: 'BNB authorised'
        fr: 'BNB autorisé'
        es: 'BNB autorizado'
        de: 'BNB freigegeben'
        it: 'BNB autorizzato'
        pl: 'BNB dozwolony'
        ru: 'BNB разрешён'
        zh: 'BNB已授权'
        hu: 'BNB engedélyezve'
        pt: 'BNB autorizado'

  UNUSED_1:
    bits: '1.6-1.0'
    unused: true

  BUZZER_CONTROL:
    bits: '2.7-2.0'
    comment:
      en: 'Buzzer control'
      fr: 'Pilotage du buzzer'
      es: 'Control del zumbador'
      de: 'Summer-Ansteuerung'
      it: 'Comando del cicalino'
      pl: 'Sterowanie brzęczykiem'
      ru: 'Управление зуммером'
      zh: '蜂鸣器控制'
      hu: 'Berregő vezérlése'
      pt: 'Controlo do besouro'
    type: 'enum'
    factor: 0.5
    units: 'dB(A)'
    invalid: 0xFF
    default: 0xFF
    values:
      0x00:
        en: 'No action'
        fr: 'Pas de pilotage'
        es: 'Sin acción'
        de: 'Keine Ansteuerung'
        it: 'Nessuna azione'
        pl: 'Brak sterowania'
        ru: 'Нет управления'
        zh: '无操作'
        hu: 'Nincs vezérlés'
        pt: 'Sem controlo'
