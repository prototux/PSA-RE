id: 0x390
name: 'ADAPTIVE_DAMPER_STATUS'
type: 'can'
length: 4
comment:
  en: 'Rear air conditioning blown-air and evaporator temperatures.'
  fr: 'Températures d''air soufflé et d''évaporateur de la climatisation arrière.'
  es: 'Temperaturas de aire soplado y del evaporador del climatizador trasero.'
  de: 'Ausblastemperatur und Verdampfertemperatur der hinteren Klimaanlage.'
  it: 'Temperature dell''aria soffiata e dell''evaporatore del climatizzatore posteriore.'
  pl: 'Temperatury nadmuchu powietrza i parownika tylnej klimatyzacji.'
  ru: 'Температура выдуваемого воздуха и испарителя заднего кондиционера.'
  zh: '后部空调出风温度及蒸发器温度。'
  hu: 'A hátsó klíma befúvási és párologtató hőmérséklete.'
  pt: 'Temperaturas do ar soprado e do evaporador da climatização traseira.'
periodicity: ['500ms']
senders: ['CLIM_AR']
receivers: ['BSI']

signals:
  REAR_EVAPORATOR_PROBE_TEMPERATURE:
    bits: '1.7-2.0'
    comment:
      en: 'Rear evaporator probe temperature'
      fr: 'Température de la sonde évaporateur arrière'
      es: 'Temperatura de la sonda del evaporador trasero'
      de: 'Hintere Verdampfersondentemperatur'
      it: 'Temperatura della sonda evaporatore posteriore'
      pl: 'Temperatura czujnika parownika tylnego'
      ru: 'Температура датчика заднего испарителя'
      zh: '后蒸发器探头温度'
      hu: 'A hátsó elpárologtató érzékelő hőmérséklete'
      pt: 'Temperatura da sonda do evaporador traseiro'
    type: 'uint'
    factor: 0.1
    offset: -40
    min: -40
    max: 120
    units: '°C'
    invalid: 0xFFFF
    default: 0xFFFF

  REAR_BLOWN_AIR_TEMPERATURE:
    bits: '3.7-4.0'
    comment:
      en: 'Rear blown air temperature'
      fr: 'Température de l''air soufflé arrière'
      es: 'Temperatura del aire impulsado trasero'
      de: 'Temperatur der hinteren Ausblasluft'
      it: 'Temperatura dell''aria soffiata posteriore'
      pl: 'Temperatura powietrza nawiewanego z tyłu'
      ru: 'Температура воздуха обдува сзади'
      zh: '后排送风温度'
      hu: 'A hátsó befúvott levegő hőmérséklete'
      pt: 'Temperatura do ar insuflado traseiro'
    type: 'uint'
    factor: 0.1
    offset: -40
    min: -40
    max: 120
    units: '°C'
    invalid: 0xFFFF
    default: 0xFFFF
