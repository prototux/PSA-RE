id: 0x315
name: 'STEERING_WHEEL_ANGLE_EPS'
type: 'can'
length: 5
comment:
  en: 'Front-right mirror status: housing declutch/state, memory number and recall, horizontal/vertical position, outside temperature.'
  fr: 'État du rétroviseur avant droit : débrayage/état du boîtier, numéro et rappel mémoire, position horizontale/verticale, température extérieure.'
  es: 'Estado del retrovisor delantero derecho: desembrague/estado de la carcasa, número y recuperación de memoria, posición horizontal/vertical, temperatura exterior.'
  de: 'Status des vorderen rechten Außenspiegels: Gehäuseentkupplung/-zustand, Memory-Nummer und -Abruf, horizontale/vertikale Position, Außentemperatur.'
  it: 'Stato dello specchietto anteriore destro: disinnesto/stato dell''alloggiamento, numero e richiamo memoria, posizione orizzontale/verticale, temperatura esterna.'
  pl: 'Stan przedniego prawego lusterka: rozłączenie/stan obudowy, numer i przywołanie pamięci, pozycja pozioma/pionowa, temperatura zewnętrzna.'
  ru: 'Статус переднего правого зеркала: расцепление/состояние корпуса, номер и вызов памяти, горизонтальное/вертикальное положение, наружная температура.'
  zh: '右前后视镜状态:壳体脱离/状态、记忆编号及调用、水平/垂直位置、车外温度。'
  hu: 'A jobb első tükör állapota: burkolat kikapcsolása/állapota, memóriaszám és -visszahívás, vízszintes/függőleges helyzet, külső hőmérséklet.'
  pt: 'Estado do espelho dianteiro direito: desengate/estado da carcaça, número de memória e recuperação, posição horizontal/vertical, temperatura exterior.'
observations:
  en: 'On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['1000ms', 'trigger']
senders: ['EDP_C']
receivers: ['BSI']

