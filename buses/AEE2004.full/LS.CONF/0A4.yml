id: 0x0A4
name: 'RADIO_TEXT_REPLY_PAYLOAD'
type: 'can-tp'
comment:
  en: 'Multi-frame reply payload with text to display (radio or CD source), 2 to 8 bytes.'
  fr: 'Charge utile de la réponse multi-trame avec le texte à afficher (source radio ou CD), 2 à 8 octets.'
  es: 'Carga útil de la respuesta multitrama con el texto a mostrar (fuente radio o CD), de 2 a 8 bytes.'
  de: 'Nutzdaten der Mehrfachrahmen-Antwort mit dem anzuzeigenden Text (Quelle Radio oder CD), 2 bis 8 Byte.'
  it: 'Payload della risposta multi-trama con il testo da visualizzare (sorgente radio o CD), da 2 a 8 byte.'
  pl: 'Dane odpowiedzi wieloramkowej z tekstem do wyświetlenia (źródło radio lub CD), od 2 do 8 bajtów.'
  ru: 'Полезная нагрузка многокадрового ответа с текстом для отображения (источник радио или CD), от 2 до 8 байт.'
  zh: '包含待显示文本的多帧应答有效载荷(收音机或CD信源),2至8字节。'
  hu: 'A megjelenítendő szöveget tartalmazó többkeretes válasz hasznos adattartalma (rádió vagy CD forrás), 2-8 bájt.'
  pt: 'Payload de resposta multi-trama com texto a apresentar (fonte rádio ou CD), 2 a 8 bytes.'
periodicity: ['trigger']
senders: ['RAD', 'ICSV']
receivers: ['EMF', 'CMB']
isotp:
  flow_control_id: 0x09F

signals:
  PAYLOAD:
    bits: '1.7-n'
    comment:
      en: 'Application data (reassembled)'
      fr: 'Données applicatives (réassemblées)'
      es: 'Datos de aplicación (reensamblados)'
      de: 'Anwendungsdaten (wieder zusammengesetzt)'
      it: 'Dati applicativi (riassemblati)'
      pl: 'Dane aplikacyjne (ponownie złożone)'
      ru: 'Прикладные данные (пересобранные)'
      zh: '应用数据（重组后）'
      hu: 'Alkalmazásadatok (újraösszeállítva)'
      pt: 'Dados de aplicação (reagrupados)'
    type: 'bytes'
