id: 0x0ED
name: 'AC_RECIRCULATION_COMMAND'
type: 'can'
length: 2
comment:
  en: 'Air recirculation command for the air conditioning system, relayed through the BSI gateway.'
  fr: 'Commande de recyclage d''air pour le système de climatisation, relayée par la passerelle BSI.'
  es: 'Orden de recirculación de aire para el sistema de climatización, retransmitida a través de la pasarela BSI.'
  de: 'Luftumluftbefehl für die Klimaanlage, weitergeleitet über das BSI-Gateway.'
  it: 'Comando di ricircolo aria per il sistema di climatizzazione, inoltrato attraverso il gateway BSI.'
  pl: 'Polecenie recyrkulacji powietrza dla układu klimatyzacji, przekazywane przez bramkę BSI.'
  ru: 'Команда рециркуляции воздуха для системы кондиционирования, ретранслируемая через шлюз BSI.'
  zh: '空调系统的内循环命令，经BSI网关转发。'
  hu: 'A klímaberendezés levegő-recirkulációs parancsa, a BSI átjárón keresztül továbbítva.'
  pt: 'Comando de recirculação de ar do sistema de ar condicionado, retransmitido através do gateway da BSI.'
observations:
  en: 'On state change of: RECYCL_AIR_ET_VMF'
  fr: 'Sur changement d''état de : RECYCL_AIR_ET_VMF'
  es: 'Al cambiar el estado de: RECYCL_AIR_ET_VMF'
  de: 'Bei Statusänderung von: RECYCL_AIR_ET_VMF'
  it: 'Al cambiamento di stato di: RECYCL_AIR_ET_VMF'
  pl: 'Wysyłane przy zmianie stanu: RECYCL_AIR_ET_VMF'
  ru: 'При изменении состояния: RECYCL_AIR_ET_VMF'
  zh: '当RECYCL_AIR_ET_VMF状态变化时'
  hu: 'A(z) RECYCL_AIR_ET_VMF állapotváltozásakor'
  pt: 'Na mudança de estado de: RECYCL_AIR_ET_VMF'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['CLIM_AV']

signals:
  RECYCL_AIR_ET_VMF:
    bits: '1.7'
    comment:
      en: 'Air conditioning air recycling flap command'
      fr: 'Commande du volet de recyclage d''air de la climatisation'
      es: 'Comando de la trampilla de recirculación de aire del aire acondicionado'
      de: 'Ansteuerung der Umluftklappe der Klimaanlage'
      it: 'Comando della valvola di ricircolo dell''aria del climatizzatore'
      pl: 'Sterowanie klapą recyrkulacji powietrza klimatyzacji'
      ru: 'Управление заслонкой рециркуляции воздуха кондиционера'
      zh: '空调空气循环风门控制'
      hu: 'A klíma légkeringtető légterelőjének vezérlése'
      pt: 'Comando da comporta de recirculação de ar do ar condicionado'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Command not activated'
        fr: 'Commande non activée'
        es: 'Comando no activado'
        de: 'Befehl nicht aktiviert'
        it: 'Comando non attivato'
        pl: 'Polecenie nieaktywowane'
        ru: 'Команда не активирована'
        zh: '指令未激活'
        hu: 'Parancs nincs aktiválva'
        pt: 'Comando não ativado'
      0x01:
        en: 'Command active'
        fr: 'Commande activée'
        es: 'Orden activada'
        de: 'Befehl aktiv'
        it: 'Comando attivo'
        pl: 'Polecenie aktywne'
        ru: 'Команда активна'
        zh: '指令激活'
        hu: 'Parancs aktív'
        pt: 'Comando ativo'

  UNUSED_1:
    bits: '1.6-1.0'
    unused: true

  UNUSED_2:
    bits: '2.7-2.0'
    unused: true
