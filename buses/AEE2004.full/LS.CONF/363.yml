id: 0x363
name: 'USB_LIST_READ_STATUS'
type: 'can'
length: 8
comment:
  en: 'USB media list browsing status: list index, total entries, selected list, elapsed time and track-change origin.'
  fr: 'État de navigation dans la liste USB : index de liste, nombre total d''entrées, liste sélectionnée, temps écoulé et origine du changement de piste.'
  es: 'Estado de navegación de la lista USB: índice de lista, número total de entradas, lista seleccionada, tiempo transcurrido y origen del cambio de pista.'
  de: 'Status der USB-Listen-Navigation: Listenindex, Gesamtanzahl der Einträge, ausgewählte Liste, verstrichene Zeit und Ursprung des Titelwechsels.'
  it: 'Stato di navigazione dell''elenco USB: indice elenco, numero totale di voci, elenco selezionato, tempo trascorso e origine del cambio traccia.'
  pl: 'Stan przeglądania listy USB: indeks listy, łączna liczba pozycji, wybrana lista, czas, który upłynął i źródło zmiany utworu.'
  ru: 'Статус просмотра списка USB: индекс списка, общее количество записей, выбранный список, прошедшее время и источник смены трека.'
  zh: 'USB媒体列表浏览状态:列表索引、条目总数、所选列表、已用时间及曲目更改来源。'
  hu: 'Az USB médialista böngészésének állapota: listaindex, összes bejegyzés száma, kiválasztott lista, eltelt idő és a számváltás forrása.'
  pt: 'Estado de navegação na lista de suportes USB: índice da lista, total de entradas, lista selecionada, tempo decorrido e origem da mudança de faixa.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['1000ms', 'trigger']
senders: ['RAD', 'KML', 'ICSV']
receivers: ['CMB', 'EMF', 'MATT']

signals:
  PLAYLIST_TRACK_INDEX:
    bits: '1.7-2.0'
    comment:
      en: 'Index of the music track being played in the selected list'
      fr: 'Indice du morceau en cours de lecture dans la liste sélectionnée'
      es: 'Índice de la pista en reproducción en la lista seleccionada'
      de: 'Index des abgespielten Musiktitels in der ausgewählten Liste'
      it: 'Indice del brano in riproduzione nell''elenco selezionato'
      pl: 'Indeks odtwarzanego utworu na wybranej liście'
      ru: 'Индекс воспроизводимого трека в выбранном списке'
      zh: '所选列表中正在播放曲目的索引'
      hu: 'A kiválasztott listában lejátszott szám indexe'
      pt: 'Índice da faixa de música em reprodução na lista selecionada'
    type: 'uint'
    min: 0
    max: 65533
    invalid: 0xFFFF
    default: 0xFFFE
    alternatives:
      - note:
          en: 'Also observed at bits 1.7-2.6'
          fr: 'Aussi observé aux bits 1.7-2.6'
          es: 'También observado en los bits 1.7-2.6'
          de: 'Auch an den Bits 1.7-2.6 beobachtet'
          it: 'Osservato anche ai bit 1.7-2.6'
          pl: 'Obserwowany także na bitach 1.7-2.6'
          ru: 'Также наблюдался в битах 1.7-2.6'
          zh: '也观察到位于位1.7-2.6'
          hu: 'Megfigyelve a(z) 1.7-2.6 biteken is'
          pt: 'Também observado nos bits 1.7-2.6'
        bits: '1.7-2.6'

