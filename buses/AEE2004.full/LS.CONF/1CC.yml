id: 0x1CC
name: 'LIGHTING_COMMAND'
type: 'can'
length: 2
comment:
  en: 'Lighting commands sent by the BSI: ambient lighting, licence plate lighting memory and front/rear left/right threshold (courtesy) lighting.'
  fr: 'Commandes d''éclairage envoyées par la BSI : éclairage d''ambiance, mémoire d''éclairage de plaque et éclairage de seuil avant/arrière gauche/droit.'
  es: 'Órdenes de iluminación enviadas por la BSI: iluminación ambiental, memoria de iluminación de matrícula e iluminación de umbral delantero/trasero izquierdo/derecho.'
  de: 'Von der BSI gesendete Beleuchtungsbefehle: Ambientebeleuchtung, Kennzeichenbeleuchtungsspeicher und vordere/hintere linke/rechte Einstiegsbeleuchtung.'
  it: 'Comandi di illuminazione inviati dalla BSI: illuminazione ambiente, memoria illuminazione targa e illuminazione soglia anteriore/posteriore sinistra/destra.'
  pl: 'Polecenia oświetlenia wysyłane przez BSI: oświetlenie nastrojowe, pamięć oświetlenia tablicy rejestracyjnej i oświetlenie progu przód/tył lewy/prawy.'
  ru: 'Команды освещения, отправляемые BSI: атмосферная подсветка, память освещения номерного знака и подсветка порога спереди/сзади слева/справа.'
  zh: '由BSI发送的灯光命令：氛围灯、车牌照明记忆及前/后左/右迎宾踏板灯。'
  hu: 'A BSI világítási parancsai: hangulatvilágítás, rendszámtábla-világítás memória, valamint elülső/hátsó bal/jobb küszöbvilágítás.'
  pt: 'Comandos de iluminação enviados pela BSI: iluminação ambiente, memória da iluminação da matrícula e iluminação de cortesia dianteira/traseira esquerda/direita.'
observations:
  en: 'On state change of: FRONT_LEFT_SILL_LIGHTING, FRONT_RIGHT_SILL_LIGHTING, MEMORY_KEYPAD_LIGHTING'
  fr: 'Sur changement d''état de : FRONT_LEFT_SILL_LIGHTING, FRONT_RIGHT_SILL_LIGHTING, MEMORY_KEYPAD_LIGHTING'
  es: 'Al cambiar el estado de: FRONT_LEFT_SILL_LIGHTING, FRONT_RIGHT_SILL_LIGHTING, MEMORY_KEYPAD_LIGHTING'
  de: 'Bei Statusänderung von: FRONT_LEFT_SILL_LIGHTING, FRONT_RIGHT_SILL_LIGHTING, MEMORY_KEYPAD_LIGHTING'
  it: 'Al cambiamento di stato di: FRONT_LEFT_SILL_LIGHTING, FRONT_RIGHT_SILL_LIGHTING, MEMORY_KEYPAD_LIGHTING'
  pl: 'Wysyłane przy zmianie stanu: FRONT_LEFT_SILL_LIGHTING, FRONT_RIGHT_SILL_LIGHTING, MEMORY_KEYPAD_LIGHTING'
  ru: 'При изменении состояния: FRONT_LEFT_SILL_LIGHTING, FRONT_RIGHT_SILL_LIGHTING, MEMORY_KEYPAD_LIGHTING'
  zh: '当ECL_SEUIL_AVG, FRONT_RIGHT_SILL_LIGHTING, ECL_CLV_MEM状态变化时'
  hu: 'A(z) FRONT_LEFT_SILL_LIGHTING, FRONT_RIGHT_SILL_LIGHTING, MEMORY_KEYPAD_LIGHTING állapotváltozásakor'
  pt: 'Na mudança de estado de: FRONT_LEFT_SILL_LIGHTING, FRONT_RIGHT_SILL_LIGHTING, MEMORY_KEYPAD_LIGHTING'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['EDP_C']

signals:
  FRONT_LEFT_SILL_LIGHTING:
    bits: '1.7'
    comment:
      en: 'Front left door sill lighting'
      fr: 'Éclairage de seuil de porte avant gauche'
      es: 'Iluminación del umbral de la puerta delantera izquierda'
      de: 'Beleuchtung der Einstiegsleiste vorne links'
      it: 'Illuminazione della soglia della portiera anteriore sinistra'
      pl: 'Oświetlenie progu drzwi przednich lewych'
      ru: 'Подсветка порога передней левой двери'
      zh: '左前车门踏板照明'
      hu: 'Első bal ajtóküszöb világítás'
      pt: 'Iluminação da soleira da porta dianteira esquerda'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Light off'
        fr: 'Éclaireur éteint'
        es: 'Luz apagada'
        de: 'Beleuchtung aus'
        it: 'Luce spenta'
        pl: 'Oświetlenie wyłączone'
        ru: 'Освещение выключено'
        zh: '照明灯熄灭'
        hu: 'Világítás kikapcsolva'
        pt: 'Luz desligada'
      0x01:
        en: 'Light on'
        fr: 'Éclaireur allumé'
        es: 'Luz encendida'
        de: 'Licht ein'
        it: 'Luce accesa'
        pl: 'Światło włączone'
        ru: 'Свет включён'
        zh: '灯已点亮'
        hu: 'Lámpa bekapcsolva'
        pt: 'Luz ligada'

