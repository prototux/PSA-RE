    bits: '1.7-3.0'
    comment:
      en: 'Third byte of the transport protocol header (N_PCI).'
      fr: 'Troisième octet de l''en-tête du protocole de transport (N_PCI).'
      es: 'Tercer byte de la cabecera del protocolo de transporte (N_PCI)'
      de: 'Drittes Byte des Transportprotokoll-Headers (N_PCI)'
      it: 'Terzo byte dell''intestazione del protocollo di trasporto (N_PCI)'
      pl: 'Trzeci bajt nagłówka protokołu transportowego (N_PCI)'
      ru: 'Третий байт заголовка транспортного протокола (N_PCI)'
      zh: '传输协议报头（N_PCI）的第三个字节'
      hu: 'A szállítási protokoll fejlécének (N_PCI) harmadik bájtja'
      pt: 'Terceiro byte do cabeçalho do protocolo de transporte (N_PCI).'
    type: 'uint'
