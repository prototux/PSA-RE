id: 0x321
name: 'HYDRACTIVE_SUSPENSION_DISPLAY'
type: 'can'
length: 4
comment:
  en: 'Hydractive suspension telltale states, sent on change.'
  fr: 'États des témoins de la suspension Hydractive, envoyés sur changement d''état.'
  es: 'Estados de los testigos de la suspensión Hydractive, enviados al cambiar de estado.'
  de: 'Zustände der Kontrollleuchten der Hydractive-Federung, gesendet bei Zustandsänderung.'
  it: 'Stati delle spie della sospensione Hydractive, inviati al cambio di stato.'
  pl: 'Stany kontrolek zawieszenia Hydractive, wysyłane przy zmianie stanu.'
  ru: 'Состояния индикаторов подвески Hydractive, отправляемые при изменении состояния.'
  zh: 'Hydractive悬挂指示灯状态，状态变化时发送。'
  hu: 'A Hydractive futómű jelzőlámpáinak állapota, állapotváltozáskor küldve.'
  pt: 'Estados dos avisadores da suspensão Hydractive, enviados na mudança.'
observations:
  en: 'On state change of: TREBLE_INDICATOR_LAMP_REQUEST, TRACK_INDICATOR_LAMP_REQUEST, NORMAL_INDICATOR_LAMP_REQUEST, BASS_INDICATOR_LAMP_REQUEST'
  fr: 'Sur changement d''état de : TREBLE_INDICATOR_LAMP_REQUEST, TRACK_INDICATOR_LAMP_REQUEST, NORMAL_INDICATOR_LAMP_REQUEST, BASS_INDICATOR_LAMP_REQUEST'
  es: 'Al cambiar el estado de: TREBLE_INDICATOR_LAMP_REQUEST, TRACK_INDICATOR_LAMP_REQUEST, NORMAL_INDICATOR_LAMP_REQUEST, BASS_INDICATOR_LAMP_REQUEST'
  de: 'Bei Statusänderung von: TREBLE_INDICATOR_LAMP_REQUEST, TRACK_INDICATOR_LAMP_REQUEST, NORMAL_INDICATOR_LAMP_REQUEST, BASS_INDICATOR_LAMP_REQUEST'
  it: 'Al cambiamento di stato di: TREBLE_INDICATOR_LAMP_REQUEST, TRACK_INDICATOR_LAMP_REQUEST, NORMAL_INDICATOR_LAMP_REQUEST, BASS_INDICATOR_LAMP_REQUEST'
  pl: 'Wysyłane przy zmianie stanu: TREBLE_INDICATOR_LAMP_REQUEST, TRACK_INDICATOR_LAMP_REQUEST, NORMAL_INDICATOR_LAMP_REQUEST, BASS_INDICATOR_LAMP_REQUEST'
  ru: 'При изменении состояния: TREBLE_INDICATOR_LAMP_REQUEST, TRACK_INDICATOR_LAMP_REQUEST, NORMAL_INDICATOR_LAMP_REQUEST, BASS_INDICATOR_LAMP_REQUEST'
  zh: '当TEMOIN_H, TRACK_INDICATOR_LAMP_REQUEST, NORMAL_INDICATOR_LAMP_REQUEST, TEMOIN_B状态变化时'
  hu: 'A(z) TREBLE_INDICATOR_LAMP_REQUEST, TRACK_INDICATOR_LAMP_REQUEST, NORMAL_INDICATOR_LAMP_REQUEST, BASS_INDICATOR_LAMP_REQUEST állapotváltozásakor'
  pt: 'Na mudança de estado de: TREBLE_INDICATOR_LAMP_REQUEST, TRACK_INDICATOR_LAMP_REQUEST, NORMAL_INDICATOR_LAMP_REQUEST, BASS_INDICATOR_LAMP_REQUEST'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['CMB', 'VTH', 'EMF', 'BCD']

