id: 0x163
name: 'KML_REPLY_PAYLOAD'
type: 'can-tp'
comment:
  en: 'Multi-frame reply payload from the hands-free kit (mixed data, vCard, call log, connection, consultation, pairing, deletion, Bluetooth scan or service list).'
  fr: 'Charge utile de la réponse multi-trame du kit mains libres (données mixtes, vCard, journal d''appels, connexion, consultation, jumelage, suppression, scan Bluetooth ou liste de services).'
  es: 'Carga útil de la respuesta multitrama del kit manos libres (datos mixtos, vCard, registro de llamadas, conexión, consulta, emparejamiento, eliminación, escaneo Bluetooth o lista de servicios).'
  de: 'Nutzdaten der Mehrfachrahmen-Antwort der Freisprecheinrichtung (gemischte Daten, vCard, Anrufliste, Verbindung, Abfrage, Kopplung, Löschung, Bluetooth-Scan oder Dienstliste).'
  it: 'Payload della risposta multi-trama del kit vivavoce (dati misti, vCard, registro chiamate, connessione, consultazione, associazione, eliminazione, scansione Bluetooth o elenco servizi).'
  pl: 'Dane odpowiedzi wieloramkowej zestawu głośnomówiącego (dane mieszane, vCard, rejestr połączeń, połączenie, przeglądanie, parowanie, usuwanie, skanowanie Bluetooth lub lista usług).'
  ru: 'Полезная нагрузка многокадрового ответа громкой связи (смешанные данные, vCard, журнал вызовов, соединение, просмотр, сопряжение, удаление, сканирование Bluetooth или список служб).'
  zh: '免提套件的多帧应答有效载荷(混合数据、vCard、通话记录、连接、查询、配对、删除、蓝牙扫描或服务列表)。'
  hu: 'A kihangosító többkeretes válaszának hasznos adattartalma (vegyes adatok, vCard, hívásnapló, kapcsolat, lekérdezés, párosítás, törlés, Bluetooth-keresés vagy szolgáltatáslista).'
  pt: 'Payload de resposta multi-trama do kit mãos-livres (dados mistos, vCard, registo de chamadas, ligação, consulta, emparelhamento, eliminação, procura Bluetooth ou lista de serviços).'
periodicity: ['trigger']
senders: ['RAD', 'KML', 'ICSV']
receivers: ['EMF', 'CMB']
isotp:
  flow_control_id: 0x25F

signals:
  PAYLOAD:
    bits: '1.7-n'
    comment:
      en: 'Application data (reassembled)'
      fr: 'Données applicatives (réassemblées)'
      es: 'Datos de aplicación (reensamblados)'
      de: 'Anwendungsdaten (wieder zusammengesetzt)'
      it: 'Dati applicativi (riassemblati)'
      pl: 'Dane aplikacyjne (ponownie złożone)'
      ru: 'Прикладные данные (пересобранные)'
      zh: '应用数据（重组后）'
      hu: 'Alkalmazásadatok (újraösszeállítva)'
      pt: 'Dados de aplicação (reagrupados)'
    type: 'bytes'

