  - note:
      en: 'Other layout observed for this frame (other software or car version)'
      fr: 'Autre disposition observée pour cette trame (autre version de logiciel ou de véhicule)'
      es: 'Otra disposición observada para esta trama (otra versión de software o de vehículo)'
      de: 'Andere beobachtete Belegung dieser Botschaft (andere Software- oder Fahrzeugversion)'
      it: 'Altra disposizione osservata per questo frame (altra versione di software o di vettura)'
      pl: 'Inny zaobserwowany układ tej ramki (inna wersja oprogramowania lub samochodu)'
      ru: 'Другая наблюдаемая раскладка этого кадра (другая версия ПО или автомобиля)'
      zh: '此帧观察到的另一种布局（其他软件或车型版本）'
      hu: 'A keret másik megfigyelt elrendezése (más szoftver- vagy autóverzió)'
      pt: 'Outra disposição observada para esta trama (outra versão de software ou de veículo)'
    length: 8
    periodicity: ['trigger']
    signals:
      NPCI_HEADER_BYTE_2:
        bits: '8.7-8.4'
        comment:
          en: 'Second byte of the transport protocol header (N_PCI).'
          fr: 'Deuxième octet de l''en-tête du protocole de transport (N_PCI).'
          es: 'Segundo byte de la cabecera del protocolo de transporte (N_PCI)'
          de: 'Zweites Byte des Transportprotokoll-Headers (N_PCI)'
          it: 'Secondo byte dell''intestazione del protocollo di trasporto (N_PCI)'
          pl: 'Drugi bajt nagłówka protokołu transportowego (N_PCI)'
          ru: 'Второй байт заголовка транспортного протокола (N_PCI)'
          zh: '传输协议报头（N_PCI）的第二个字节'
          hu: 'A szállítási protokoll fejlécének (N_PCI) második bájtja'
          pt: 'Segundo byte do cabeçalho do protocolo de transporte (N_PCI).'
        type: 'uint'
      SEQUENCE_NUMBER:
        bits: '8.3-8.0'
        comment:
          en: 'Sequence number of a multi-frame transport message.'
          fr: 'Numéro de séquence d''un message de transport multi-trames.'
          es: 'Número de secuencia de un mensaje de transporte multitrama'
          de: 'Sequenznummer einer Mehrfachrahmen-Transportnachricht'
          it: 'Numero di sequenza di un messaggio di trasporto multi-frame'
          pl: 'Numer sekwencyjny komunikatu transportowego wieloramkowego'
          ru: 'Порядковый номер многокадрового транспортного сообщения'
          zh: '多帧传输消息的序列号'
          hu: 'Többkeretes szállítási üzenet sorszáma'
          pt: 'Número de sequência de uma mensagem de transporte multitrama'
        type: 'uint'
