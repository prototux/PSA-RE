id: 0x1A3
name: 'HANDSFREE_KIT_GENERAL_INFO'
alt_names: ['KML_STATUS']
type: 'can'
length: 7
comment:
  en: 'Hands-free (Bluetooth) kit general status: phone connected, call in progress, battery charging and streaming state.'
  fr: 'État général du kit mains libres (Bluetooth) : téléphone connecté, appel en cours, charge batterie et état du streaming.'
  es: 'Estado general del kit manos libres (Bluetooth): teléfono conectado, llamada en curso, carga de batería y estado del streaming.'
  de: 'Allgemeiner Status der Freisprecheinrichtung (Bluetooth): Telefon verbunden, laufender Anruf, Akkuladung und Streaming-Status.'
  it: 'Stato generale del kit vivavoce (Bluetooth): telefono connesso, chiamata in corso, ricarica batteria e stato dello streaming.'
  pl: 'Ogólny stan zestawu głośnomówiącego (Bluetooth): połączony telefon, trwające połączenie, ładowanie baterii i stan strumieniowania.'
  ru: 'Общий статус комплекта громкой связи (Bluetooth): телефон подключён, идёт вызов, зарядка батареи и статус потоковой передачи.'
  zh: '免提(蓝牙)套件的总体状态:电话已连接、通话中、电池充电及流媒体状态。'
  hu: 'A kihangosító (Bluetooth) készlet általános állapota: telefon csatlakoztatva, folyamatban lévő hívás, akkumulátortöltés és streamelési állapot.'
  pt: 'Estado geral do kit mãos-livres (Bluetooth): telefone ligado, chamada em curso, carregamento da bateria e estado do streaming.'
observations:
  en: 'On state change of: CONNECT, CONNECTING, SECRET_MODE, MUTED, SWITCHING_SRC, LIST_TYPE'
  fr: 'Sur changement d''état de : CONNECT, CONNECTING, SECRET_MODE, MUTED, SWITCHING_SRC, LIST_TYPE'
  es: 'Al cambiar el estado de: CONNECT, CONNECTING, SECRET_MODE, MUTED, SWITCHING_SRC, LIST_TYPE'
  de: 'Bei Statusänderung von: CONNECT, CONNECTING, SECRET_MODE, MUTED, SWITCHING_SRC, LIST_TYPE'
  it: 'Al cambiamento di stato di: CONNECT, CONNECTING, SECRET_MODE, MUTED, SWITCHING_SRC, LIST_TYPE'
  pl: 'Wysyłane przy zmianie stanu: CONNECT, CONNECTING, SECRET_MODE, MUTED, SWITCHING_SRC, LIST_TYPE'
  ru: 'При изменении состояния: CONNECT, CONNECTING, SECRET_MODE, MUTED, SWITCHING_SRC, LIST_TYPE'
  zh: '当CONNECT, CONNECTING, SECRET_MODE, MUTED, SWITCHING_SRC, TYPE_LISTE_CONSTRUCTION状态变化时'
  hu: 'A(z) CONNECT, CONNECTING, SECRET_MODE, MUTED, SWITCHING_SRC, LIST_TYPE állapotváltozásakor'
  pt: 'Na mudança de estado de: CONNECT, CONNECTING, SECRET_MODE, MUTED, SWITCHING_SRC, LIST_TYPE'
periodicity: ['200ms', 'trigger']
senders: ['RAD', 'KML', 'ICSV']
receivers: ['EMF', 'CMB', 'BTT', 'BSI', 'DIAG_TOOL', 'RAD', 'ICSV']

