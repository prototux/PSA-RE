      de: 'Bewegungsanforderung nach vorne der Business-(Begrüßungs-)Funktion'
      it: 'Richiesta di movimento in avanti della funzione Business (accoglienza)'
      pl: 'Żądanie ruchu do przodu funkcji Business (powitalnej)'
      ru: 'Запрос движения вперёд функции Business (приветствие)'
      zh: '商务(迎宾)功能向前移动请求'
      hu: 'A Business (üdvözlő) funkció előrefelé mozgatási kérése'
      pt: 'Pedido de movimento para a frente da função Business (boas-vindas)'
