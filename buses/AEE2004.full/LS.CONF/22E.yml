id: 0x22E
name: 'MEMORY_SEAT_WELCOME_STATUS_ARM'
type: 'can'
length: 1
comment:
  en: 'Driver seat welcome/memory recall status for the ARM function (front and rear occupancy, welcome flags, manual command, memory), sent on change.'
  fr: 'État de l''accueil/rappel mémoire du siège conducteur pour la fonction ARM (occupation avant et arrière, indicateurs d''accueil, commande manuelle, mémoire), envoyé sur changement.'
  es: 'Estado de bienvenida/recuperación de memoria del asiento del conductor para la función ARM (ocupación delantera y trasera, indicadores de bienvenida, mando manual, memoria), enviado al cambiar.'
  de: 'Status der Komfort-/Memory-Rückstellung des Fahrersitzes für die Funktion ARM (Vorder- und Rückbelegung, Begrüßungsflags, manueller Befehl, Speicher), gesendet bei Änderung.'
  it: 'Stato di accoglienza/richiamo memoria del sedile conducente per la funzione ARM (occupazione anteriore e posteriore, indicatori di accoglienza, comando manuale, memoria), inviato al cambio.'
  pl: 'Stan powitania/przywołania pamięci fotela kierowcy dla funkcji ARM (obecność z przodu i z tyłu, flagi powitania, polecenie ręczne, pamięć), wysyłany przy zmianie.'
  ru: 'Состояние приветствия/вызова памяти сиденья водителя для функции ARM (переднее и заднее присутствие, флаги приветствия, ручная команда, память), отправляется при изменении.'
  zh: '驾驶员座椅迎宾/记忆恢复状态（ARM功能，前后占用、迎宾标志、手动命令、记忆），状态变化时发送。'
  hu: 'A vezetőülés üdvözlő/memória-visszaállítási állapota az ARM funkcióhoz (első és hátsó jelenlét, üdvözlő jelzők, kézi parancs, memória), változáskor küldve.'
  pt: 'Estado de boas-vindas/memória do banco do condutor para a função ARM (ocupação dianteira e traseira, indicadores de boas-vindas, comando manual, memória), enviado na mudança.'
periodicity: ['200ms', 'trigger']
senders: ['BDM_A']
receivers: ['BDM_C', 'BSI']

