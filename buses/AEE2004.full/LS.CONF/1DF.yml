id: 0x1DF
name: 'BLUETOOTH_PARING'
type: 'can'
length: 4
comment:
  en: 'Bluetooth pairing and call management requests from the display: accept pairing, phonebook access, pairing list request, secret mode, scan, overwrite pairing, incoming call answer.'
  fr: 'Demandes d''appairage Bluetooth et de gestion d''appel depuis l''écran : acceptation d''appairage, accès au répertoire, demande de liste d''appairage, mode secret, scan, écrasement d''appairage, réponse à un appel entrant.'
  es: 'Solicitudes de emparejamiento Bluetooth y gestión de llamadas desde la pantalla: aceptación de emparejamiento, acceso a la agenda, solicitud de lista de emparejamiento, modo secreto, escaneo, sobrescritura de emparejamiento, respuesta a llamada entrante.'
  de: 'Bluetooth-Kopplungs- und Anrufverwaltungsanforderungen vom Display: Kopplung akzeptieren, Telefonbuchzugriff, Kopplungslistenanforderung, geheimer Modus, Scan, Kopplung überschreiben, Antwort auf eingehenden Anruf.'
  it: 'Richieste di abbinamento Bluetooth e gestione chiamate dal display: accettazione abbinamento, accesso rubrica, richiesta elenco abbinamenti, modalità segreta, scansione, sovrascrittura abbinamento, risposta a chiamata in arrivo.'
  pl: 'Żądania parowania Bluetooth i zarządzania połączeniami z ekranu: akceptacja parowania, dostęp do książki telefonicznej, żądanie listy parowań, tryb tajny, skanowanie, nadpisanie parowania, odbiór połączenia przychodzącego.'
  ru: 'Запросы сопряжения Bluetooth и управления вызовами от дисплея: принятие сопряжения, доступ к телефонной книге, запрос списка сопряжений, скрытый режим, сканирование, перезапись сопряжения, ответ на входящий вызов.'
  zh: '来自显示屏的蓝牙配对和通话管理请求:接受配对、通讯录访问、配对列表请求、隐身模式、扫描、覆盖配对、接听来电。'
  hu: 'A kijelzőtől érkező Bluetooth-párosítási és híváskezelési kérések: párosítás elfogadása, telefonkönyv elérése, párosítási lista kérése, titkos mód, keresés, párosítás felülírása, bejövő hívás fogadása.'
  pt: 'Pedidos de emparelhamento Bluetooth e gestão de chamadas do visor: aceitar emparelhamento, acesso à lista telefónica, pedido de lista de emparelhamentos, modo secreto, procura, substituição de emparelhamento, atender chamada recebida.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['200ms', 'trigger']
senders: ['EMF', 'CMB', 'ICSV']
receivers: ['RAD', 'KML', 'ICSV']

