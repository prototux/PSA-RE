id: 0x1ED
name: 'CLIMATE_CUSTOMER_REQUESTS'
type: 'can'
length: 1
comment:
  en: 'Customer-triggered requests from the display to the climate control unit: A/C on/off and dual-zone mode.'
  fr: 'Demandes déclenchées par le client, de l''écran vers la climatisation : marche/arrêt clim et mode bi-zone.'
  es: 'Solicitudes activadas por el cliente, de la pantalla a la climatización: encendido/apagado del A/C y modo bizona.'
  de: 'Vom Kunden ausgelöste Anforderungen vom Display an die Klimaanlage: Klimaanlage ein/aus und Zweizonenmodus.'
  it: 'Richieste attivate dal cliente, dallo schermo al climatizzatore: accensione/spegnimento A/C e modalità bizona.'
  pl: 'Żądania wywołane przez klienta, z ekranu do klimatyzacji: włączenie/wyłączenie A/C i tryb dwustrefowy.'
  ru: 'Запросы, инициируемые клиентом, от дисплея к климатической установке: вкл/выкл кондиционера и двухзонный режим.'
  zh: '由客户触发、从显示屏发往空调的请求:空调开关和双区模式。'
  hu: 'Az ügyfél által kezdeményezett kérések a kijelzőtől a klímaberendezés felé: klíma be/ki és kétzónás mód.'
  pt: 'Pedidos acionados pelo cliente, do visor para a unidade de climatização: ligar/desligar o ar condicionado e modo bizona.'
periodicity: ['500ms', 'trigger']
senders: ['EMF', 'BTEL', 'CMB']
receivers: ['CLIM_AV']

signals:
  UNUSED_1:
    bits: '1.7-1.6'
    unused: true

  UNUSED_2:
    bits: '1.5'
    unused: true

  AC_DUAL_MODE_REQUEST:
    bits: '1.4'
    comment:
      en: 'Dual-zone climate mode request'
      fr: 'Demande de mode climatisation dual (bi-zone)'
      es: 'Solicitud de modo de climatización dual (bizona)'
      de: 'Anforderung des Dual-Zonen-Klimamodus'
      it: 'Richiesta di modalità climatizzazione dual (bizona)'
      pl: 'Żądanie dwustrefowego trybu klimatyzacji'
      ru: 'Запрос двухзонного режима климат-контроля'
      zh: '双温区空调模式请求'
      hu: 'A kétzónás klímamód kérése'
      pt: 'Pedido de modo de climatização dual (biozona)'
    type: 'bool'
    default: 0x01
    values:
      0x00:
        en: 'Dual not requested'
        fr: 'Dual non demandé'
        es: 'Dual no solicitado'
        de: 'Dual nicht angefordert'
        it: 'Dual non richiesto'
        pl: 'Dual nie żądany'
        ru: 'Dual не запрошено'
        zh: '未请求双区'
        hu: 'Dual nincs kérve'
        pt: 'Dual não solicitado'
      0x01:
        en: 'Dual requested'
        fr: 'Dual demandé'
        es: 'Dual solicitado'
        de: 'Dual angefordert'
        it: 'Dual richiesto'
        pl: 'Żądany tryb Dual'
        ru: 'Запрошен режим Dual'
        zh: '请求双通道模式'
        hu: 'Dual mód kérve'
        pt: 'Dual solicitado'

  AC_COMPRESSOR_CUTOFF_REQUEST:
    bits: '1.3'
    comment:
      en: 'AC compressor cutoff request'
      fr: 'Demande de coupure du compresseur de climatisation'
      es: 'Solicitud de corte del compresor del aire acondicionado'
      de: 'Anforderung zum Abschalten des Klimakompressors'
      it: 'Richiesta di disattivazione del compressore del climatizzatore'
      pl: 'Żądanie wyłączenia sprężarki klimatyzacji'
      ru: 'Запрос отключения компрессора кондиционера'
      zh: '空调压缩机切断请求'
      hu: 'A klímakompresszor lekapcsolási kérése'
      pt: 'Pedido de corte do compressor de ar condicionado'
    type: 'bool'
    default: 0x01
    values:
      0x00:
        en: 'No request'
        fr: 'Pas de demande'
        es: 'Sin solicitud'
        de: 'Keine Anforderung'
        it: 'Nessuna richiesta'
        pl: 'Brak żądania'
        ru: 'Нет запроса'
        zh: '无请求'
        hu: 'Nincs kérés'
        pt: 'Sem pedido'
      0x01:
        en: 'Requested'
        fr: 'Demandé'
        es: 'Solicitado'
        de: 'Angefordert'
        it: 'Richiesto'
        pl: 'Żądane'
        ru: 'Запрошено'
        zh: '已请求'
        hu: 'Kérve'
        pt: 'Pedido'

  UNUSED_3:
    bits: '1.2-1.0'
    unused: true
