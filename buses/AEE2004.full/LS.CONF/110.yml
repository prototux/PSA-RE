id: 0x110
name: 'CSS_VERSION'
type: 'can'
length: 8
comment:
  en: 'Air conditioning control module data from external sensors: carbon monoxide and NOx levels, blown-air temperatures.'
  fr: 'Données du module de contrôle climatisation issues de capteurs extérieurs : niveaux de monoxyde de carbone et de NOx, températures d''air soufflé.'
  es: 'Datos del módulo de control del climatizador de sensores exteriores: niveles de monóxido de carbono y NOx, temperaturas de aire soplado.'
  de: 'Daten des Klimasteuermoduls von externen Sensoren: Kohlenmonoxid- und NOx-Werte, Ausblastemperaturen.'
  it: 'Dati del modulo di controllo del climatizzatore dai sensori esterni: livelli di monossido di carbonio e NOx, temperature dell''aria soffiata.'
  pl: 'Dane modułu sterowania klimatyzacją z czujników zewnętrznych: poziomy tlenku węgla i NOx, temperatury nadmuchu powietrza.'
  ru: 'Данные модуля управления кондиционером от внешних датчиков: уровни угарного газа и NOx, температура выдуваемого воздуха.'
  zh: '空调控制模块外部传感器数据:一氧化碳及NOx水平、出风温度。'
  hu: 'A klíma vezérlőmodul külső érzékelőktől származó adatai: szén-monoxid- és NOx-szint, befúvási hőmérséklet.'
  pt: 'Dados do módulo de controlo da climatização provenientes de sensores exteriores: níveis de monóxido de carbono e de NOx, temperaturas do ar soprado.'
periodicity: ['100ms']
senders: ['CLIM_AV']
receivers: ['BSI']

signals:
  CO_POLLUTANT_LEVEL:
    bits: '1.7-2.0'
    comment:
      en: 'CO pollutant level'
      fr: 'Niveau de polluant CO'
      es: 'Nivel de contaminante CO'
      de: 'CO-Schadstoffgehalt'
      it: 'Livello di inquinante CO'
      pl: 'Poziom zanieczyszczenia CO'
      ru: 'Уровень загрязнения CO'
      zh: 'CO污染物水平'
      hu: 'CO szennyezőanyag szintje'
      pt: 'Nível do poluente CO'
    type: 'uint'
    factor: 1
    min: 20
    max: 10000
    units: 'Hz'
    invalid: 0xFFFF
    default: 0xFFFF

  NOX_POLLUTANT_LEVEL:
    bits: '3.7-4.0'
    comment:
      en: 'NOx pollutant level'
      fr: 'Niveau de polluant NOx'
      es: 'Nivel de contaminante NOx'
      de: 'NOx-Schadstoffgehalt'
      it: 'Livello di inquinante NOx'
      pl: 'Poziom zanieczyszczenia NOx'
      ru: 'Уровень загрязнения NOx'
      zh: 'NOx污染物水平'
      hu: 'NOx szennyezőanyag szintje'
      pt: 'Nível do poluente NOx'
    type: 'uint'
    factor: 1
    min: 20
    max: 10000
    units: 'Hz'
    invalid: 0xFFFF
    default: 0xFFFF

  BLOWN_AIR_TEMPERATURE_1:
    bits: '5.7-6.0'
    comment:
      en: 'Blown air temperature no. 1'
      fr: 'Température de l''air soufflé n° 1'
      es: 'Temperatura del aire impulsado n.º 1'
      de: 'Ausblasluft-Temperatur Nr. 1'
      it: 'Temperatura dell''aria soffiata n. 1'
      pl: 'Temperatura powietrza nawiewanego nr 1'
      ru: 'Температура обдуваемого воздуха №1'
      zh: '送风温度1号'
      hu: '1. sz. befúvott levegő hőmérséklete'
      pt: 'Temperatura do ar insuflado n.º 1'
    type: 'uint'
    factor: 0.1
    offset: -40
    min: -40
    max: 120
    units: '°C'
    invalid: 0xFFFF
    default: 0xFFFF

  BLOWN_AIR_TEMPERATURE_2:
    bits: '7.7-8.0'
    comment:
      en: 'Blown air temperature no. 2'
      fr: 'Température de l''air soufflé n° 2'
      es: 'Temperatura del aire impulsado n.º 2'
      de: 'Ausblasluft-Temperatur Nr. 2'
      it: 'Temperatura dell''aria soffiata n. 2'
      pl: 'Temperatura powietrza nawiewanego nr 2'
      ru: 'Температура обдуваемого воздуха №2'
      zh: '送风温度2号'
      hu: '2. sz. befúvott levegő hőmérséklete'
      pt: 'Temperatura do ar insuflado n.º 2'
    type: 'uint'
    factor: 0.1
    offset: -40
    min: -40
    max: 120
    units: '°C'
    invalid: 0xFFFF
    default: 0xFFFF
