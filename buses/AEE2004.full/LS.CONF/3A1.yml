id: 0x3A1
name: 'TPMS_PRESSURE_DATA_LS'
type: 'can'
length: 8
comment:
  en: 'Tyre pressure monitoring: measured pressure and pressure deviation for each wheel (front/rear, left/right) plus the spare.'
  fr: 'Surveillance de pression des pneus : pression mesurée et écart de pression pour chaque roue (avant/arrière, gauche/droite) plus la roue de secours.'
  es: 'Control de presión de neumáticos: presión medida y desviación de presión de cada rueda (delantera/trasera, izquierda/derecha) más la de repuesto.'
  de: 'Reifendrucküberwachung: gemessener Druck und Druckabweichung für jedes Rad (vorne/hinten, links/rechts) sowie das Reserverad.'
  it: 'Controllo pressione pneumatici: pressione misurata e scostamento di pressione per ogni ruota (anteriore/posteriore, sinistra/destra) più la ruota di scorta.'
  pl: 'Monitorowanie ciśnienia w oponach: zmierzone ciśnienie i odchylenie ciśnienia dla każdego koła (przód/tył, lewe/prawe) oraz koła zapasowego.'
  ru: 'Контроль давления в шинах: измеренное давление и отклонение давления для каждого колеса (переднее/заднее, левое/правое), а также запасного.'
  zh: '胎压监测:每个车轮(前/后,左/右)及备胎的测量压力和压力偏差。'
  hu: 'Abroncsnyomás-ellenőrzés: mért nyomás és nyomáseltérés minden keréknél (első/hátsó, bal/jobb), valamint a pótkeréknél.'
  pt: 'Monitorização da pressão dos pneus: pressão medida e desvio de pressão de cada roda (dianteira/traseira, esquerda/direita) além do sobresselente.'
periodicity: ['500ms']
senders: []  # TODO: find the sender(s)
receivers: ['BCD', 'BTEL', 'CMB', 'EMF']

signals:
  UNUSED_1:
    bits: '1.7-1.6'
    unused: true

  FRONT_LEFT_TYRE_PRESSURE:
    bits: '1.5-1.0'
    comment:
      en: 'Front left tyre pressure (bar)'
      fr: 'Pression du pneu avant gauche (bar)'
      es: 'Presión del neumático delantero izquierdo (bar)'
      de: 'Reifendruck vorne links (bar)'
      it: 'Pressione del pneumatico anteriore sinistro (bar)'
      pl: 'Ciśnienie w oponie przedniej lewej (bar)'
      ru: 'Давление в переднем левом колесе (бар)'
      zh: '左前轮胎压力(bar)'
      hu: 'Az első bal gumiabroncs nyomása (bar)'
      pt: 'Pressão do pneu dianteiro esquerdo (bar)'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 6.2
    units: 'bar'
    invalid: 0x3F
    default: 0x00

  FRONT_RIGHT_TYRE_PRESSURE:
    bits: '2.7-2.2'
    comment:
      en: 'Front right tyre pressure (bar)'
      fr: 'Pression du pneu avant droit (bar)'
      es: 'Presión del neumático delantero derecho (bar)'
      de: 'Reifendruck vorne rechts (bar)'
      it: 'Pressione del pneumatico anteriore destro (bar)'
      pl: 'Ciśnienie w oponie przedniej prawej (bar)'
