id: 0x257
name: 'CMB_ODOMETER'
type: 'can'
length: 6
comment:
  en: 'Odometer value saved by the instrument cluster, transmitted three times in a row to protect the vehicle mileage integrity.'
  fr: 'Valeur de kilométrage sauvegardée par le combiné, transmise trois fois de suite pour garantir l''intégrité du kilométrage véhicule.'
  es: 'Valor del cuentakilómetros guardado por el cuadro de instrumentos, transmitido tres veces seguidas para proteger la integridad del kilometraje del vehículo.'
  de: 'Vom Kombiinstrument gespeicherter Kilometerstand, dreimal hintereinander übertragen, um die Integrität des Fahrzeugkilometerstands zu schützen.'
  it: 'Valore del contachilometri salvato dal quadro strumenti, trasmesso tre volte di seguito per proteggere l''integrità del chilometraggio del veicolo.'
  pl: 'Wartość przebiegu zapisana przez zestaw wskaźników, przesyłana trzykrotnie z rzędu w celu ochrony integralności przebiegu pojazdu.'
  ru: 'Значение одометра, сохранённое комбинацией приборов, передаётся три раза подряд для защиты целостности пробега автомобиля.'
  zh: '由仪表组保存的里程值,连续发送三次以保证车辆里程数据的完整性。'
  hu: 'A műszeregység által mentett kilométeróra-érték, háromszor egymás után elküldve a jármű futásteljesítménye integritásának védelmére.'
  pt: 'Valor da quilometragem guardado pelo quadrante, transmitido três vezes seguidas para garantir a integridade da quilometragem do veículo.'
periodicity: ['trigger']
senders: ['CMB']
receivers: ['BSI']

signals:
  REAR_RIGHT_WHEEL_SPEED:
    bits: '1.7-3.0'
    alt_names: ['CMB_ODOMETER', 'KM_SAUV']
    comment:
      en: 'Odometer value saved in the instrument cluster, saved at least every 10 km (km)'
      fr: 'Kilométrage sauvegardé dans le combiné, enregistré au moins tous les 10 km (km)'
      es: 'Kilometraje guardado en el cuadro de instrumentos, guardado al menos cada 10 km (km)'
      de: 'Im Kombiinstrument gespeicherter Kilometerstand, mindestens alle 10 km gespeichert (km)'
      it: 'Chilometraggio salvato nel quadro strumenti, salvato almeno ogni 10 km (km)'
      pl: 'Przebieg zapisany w zestawie wskaźników, zapisywany co najmniej co 10 km (km)'
      ru: 'Пробег, сохранённый в комбинации приборов, сохраняется не реже чем через каждые 10 км (км)'
      zh: '保存在仪表组中的里程值,至少每10公里保存一次(km)'
      hu: 'A műszeregységben tárolt kilométeróra-érték, legalább 10 km-enként mentve (km)'
      pt: 'Valor do conta-quilómetros guardado no quadrante, guardado pelo menos a cada 10 km (km)'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 1677721.4
    units: 'km'
    invalid: 0xFFFFFF
    default: 0x00

  SECURE:
    bits: '4.7-6.0'
    comment:
      en: 'Security field protecting bytes 1 to 3'
      fr: 'Sécurisation des informations des octets 1 à 3'
      es: 'Campo de seguridad que protege los bytes 1 a 3'
      de: 'Sicherungsfeld für die Bytes 1 bis 3'
      it: 'Campo di sicurezza per i byte da 1 a 3'
      pl: 'Pole zabezpieczające bajty od 1 do 3'
      ru: 'Поле защиты байтов с 1 по 3'
      zh: '保护字节1至3的安全字段'
      hu: 'Az 1–3. bájtokat védő biztonsági mező'
      pt: 'Campo de segurança que protege os bytes 1 a 3'
    type: 'uint'
    default: 0x00
