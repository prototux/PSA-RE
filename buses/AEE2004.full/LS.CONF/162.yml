id: 0x162
name: 'CD_CHANGER_STATUS'
type: 'can'
length: 7
comment:
  en: 'CD changer status: access, disk read errors, MP3 support and per-disk availability (CD1-CD6).'
  fr: 'État du changeur CD : accès, erreurs de lecture disque, support MP3 et disponibilité par disque (CD1 à CD6).'
  es: 'Estado del cambiador de CD: acceso, errores de lectura de disco, compatibilidad MP3 y disponibilidad por disco (CD1 a CD6).'
  de: 'Status des CD-Wechslers: Zugriff, Lesefehler, MP3-Unterstützung und Verfügbarkeit je CD (CD1 bis CD6).'
  it: 'Stato del caricatore CD: accesso, errori di lettura disco, supporto MP3 e disponibilità per disco (CD1-CD6).'
  pl: 'Stan zmieniarki CD: dostęp, błędy odczytu płyty, obsługa MP3 i dostępność poszczególnych płyt (CD1-CD6).'
  ru: 'Статус CD-чейнджера: доступ, ошибки чтения диска, поддержка MP3 и доступность по дискам (CD1-CD6).'
  zh: 'CD换碟机状态:存取、读盘错误、MP3支持及各碟片(CD1-CD6)可用性。'
  hu: 'A CD-váltó állapota: hozzáférés, lemezolvasási hibák, MP3-támogatás és lemezenkénti elérhetőség (CD1-CD6).'
  pt: 'Estado do leitor de CD: acesso, erros de leitura de disco, suporte MP3 e disponibilidade por disco (CD1-CD6).'
observations:
  en: 'On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['100ms', 'trigger']
senders: ['CDC', 'ICSV']
receivers: ['EMF', 'RAD', 'BTEL', 'CMB', 'MATT', 'BSI']

