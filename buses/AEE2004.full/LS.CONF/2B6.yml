comment:
  en: 'VIN = Vehicle Identification Number. VIS = Vehicle Indicator Section, VIN field that distinguishes one vehicle from another.'
  fr: 'VIN = Vehicle Identification Number, numéro d''identification du véhicule. VIS = Vehicle Indicator Section, champ du VIN qui distingue un véhicule d''un autre.'
  es: 'VIN = Vehicle Identification Number, número de identificación del vehículo. VIS = Vehicle Indicator Section, campo del VIN que distingue un vehículo de otro.'
  de: 'VIN = Vehicle Identification Number, Fahrzeug-Identifizierungsnummer. VIS = Vehicle Indicator Section, VIN-Feld zur Unterscheidung einzelner Fahrzeuge.'
  it: 'VIN = Vehicle Identification Number, numero di identificazione del veicolo. VIS = Vehicle Indicator Section, campo del VIN che distingue un veicolo dall''altro.'
  pl: 'VIN = Vehicle Identification Number, numer identyfikacyjny pojazdu. VIS = Vehicle Indicator Section, pole VIN odróżniające jeden pojazd od drugiego.'
  ru: 'VIN = Vehicle Identification Number, идентификационный номер автомобиля. VIS = Vehicle Indicator Section, поле VIN, отличающее один автомобиль от другого.'
  zh: 'VIN = 车辆识别代号。VIS = 车辆指示段（Vehicle Indicator Section），VIN 中区分不同车辆的部分。'
  hu: 'VIN = Vehicle Identification Number. VIS = Vehicle Indicator Section, a VIN azon mezője, amely megkülönbözteti az egyes járműveket.'
  pt: 'VIN = Vehicle Identification Number (número de identificação do veículo). VIS = Vehicle Indicator Section, campo do VIN que distingue um veículo de outro.'
