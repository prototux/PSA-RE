id: 0x317
name: 'CMB_CONFIG'
type: 'can'
length: 8
comment:
  en: 'Instrument cluster telltale lamp configuration: which fault/status indicators are fitted (ABS, ASR, steering assist, parking radar, battery, seatbelt, etc.).'
  fr: 'Configuration des témoins du combiné : indicateurs de défaut/état présents (ABS, ASR, assistance de direction, radar de stationnement, batterie, ceinture, etc.).'
  es: 'Configuración de los testigos del cuadro: indicadores de fallo/estado presentes (ABS, ASR, asistencia de dirección, radar de aparcamiento, batería, cinturón, etc.).'
  de: 'Konfiguration der Kombiinstrument-Kontrollleuchten: vorhandene Fehler-/Statusanzeigen (ABS, ASR, Lenkhilfe, Einparkradar, Batterie, Gurt usw.).'
  it: 'Configurazione delle spie del quadro strumenti: indicatori di guasto/stato presenti (ABS, ASR, servosterzo, radar di parcheggio, batteria, cintura, ecc.).'
  pl: 'Konfiguracja kontrolek zestawu wskaźników: obecne wskaźniki usterek/stanu (ABS, ASR, wspomaganie kierownicy, radar parkowania, akumulator, pas itd.).'
  ru: 'Конфигурация контрольных ламп приборной панели: установленные индикаторы неисправности/состояния (ABS, ASR, усилитель руля, парковочный радар, батарея, ремень и т. д.).'
  zh: '仪表组指示灯配置：已安装的故障/状态指示器（ABS、ASR、转向助力、泊车雷达、电池、安全带等）。'
  hu: 'A műszerfal jelzőlámpáinak konfigurációja: a beépített hiba-/állapotjelzők (ABS, ASR, kormányszervó, parkolóradar, akkumulátor, biztonsági öv stb.).'
  pt: 'Configuração das luzes avisadoras do quadrante de instrumentos: quais os indicadores de avaria/estado instalados (ABS, ASR, assistência de direção, radar de estacionamento, bateria, cinto de segurança, etc.).'
observations:
  en: 'On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['1000ms']
senders: ['CMB', 'BCD']
receivers: ['BSI']

