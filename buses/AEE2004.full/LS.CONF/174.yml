id: 0x174
name: 'DEFLECTOR_COMMAND'
type: 'can'
length: 2
comment:
  en: 'Deflector (spoiler) commands sent by the BSI: automatic function state, movement command, emergency brake and pilot mode.'
  fr: 'Commandes du déflecteur envoyées par la BSI : état de la fonction automatique, commande de mouvement, freinage d''urgence et mode pilotage.'
  es: 'Órdenes del deflector enviadas por la BSI: estado de la función automática, orden de movimiento, frenado de emergencia y modo de pilotaje.'
  de: 'Von der BSI gesendete Deflektorbefehle (Spoiler): Zustand der Automatikfunktion, Bewegungsbefehl, Notbremsung und Pilotiermodus.'
  it: 'Comandi del deflettore inviati dalla BSI: stato della funzione automatica, comando di movimento, frenata di emergenza e modalità di pilotaggio.'
  pl: 'Polecenia deflektora (spojlera) wysyłane przez BSI: stan funkcji automatycznej, polecenie ruchu, hamowanie awaryjne i tryb sterowania.'
  ru: 'Команды дефлектора (спойлера), отправляемые BSI: состояние автоматической функции, команда движения, экстренное торможение и режим управления.'
  zh: '由BSI发送的导流板（扰流板）命令：自动功能状态、运动命令、紧急制动及驾驶模式。'
  hu: 'A BSI deflektor- (spoiler-) parancsai: az automatikus funkció állapota, mozgásparancs, vészfékezés és vezérlési mód.'
  pt: 'Comandos do defletor (spoiler) enviados pela BSI: estado da função automática, comando de movimento, travão de emergência e modo piloto.'
observations:
  en: 'On state change of: WIND_DEFLECTOR_OPERATION_AUTHORIZATION. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : WIND_DEFLECTOR_OPERATION_AUTHORIZATION. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: WIND_DEFLECTOR_OPERATION_AUTHORIZATION. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: WIND_DEFLECTOR_OPERATION_AUTHORIZATION. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: WIND_DEFLECTOR_OPERATION_AUTHORIZATION. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: WIND_DEFLECTOR_OPERATION_AUTHORIZATION. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: WIND_DEFLECTOR_OPERATION_AUTHORIZATION. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当AUTO_FONCT_DEF状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z) WIND_DEFLECTOR_OPERATION_AUTHORIZATION állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: WIND_DEFLECTOR_OPERATION_AUTHORIZATION. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['DEF']

