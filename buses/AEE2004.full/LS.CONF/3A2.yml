id: 0x3A2
name: 'CURRENT_CONSUMPTION_AUTH_COMMAND'
type: 'can'
length: 1
comment:
  en: 'Current (electrical) consumption authorisation command, sent by the BSI.'
  fr: 'Commande d''autorisation de consommation de courant, envoyée par la BSI.'
  es: 'Orden de autorización de consumo de corriente, enviada por la BSI.'
  de: 'Freigabebefehl für den Stromverbrauch, von der BSI gesendet.'
  it: 'Comando di autorizzazione del consumo di corrente, inviato dalla BSI.'
  pl: 'Polecenie autoryzacji poboru prądu, wysyłane przez BSI.'
  ru: 'Команда разрешения потребления тока, отправляемая BSI.'
  zh: '由BSI发送的电流消耗授权命令。'
  hu: 'Az áramfogyasztás engedélyezési parancsa, a BSI küldi.'
  pt: 'Comando de autorização de consumo (elétrico) de corrente, enviado pela BSI.'
periodicity: ['5000ms']
senders: ['BSI']
receivers: ['BTT']

signals:
