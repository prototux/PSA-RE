    bits: '1.7'
    comment:
      en: 'Current consumption authorization command'
      fr: 'Commande d''autorisation de consommation de courant'
      es: 'Mando de autorización de consumo de corriente'
      de: 'Freigabebefehl für Stromverbrauch'
      it: 'Comando di autorizzazione al consumo di corrente'
      pl: 'Polecenie autoryzacji poboru prądu'
      ru: 'Команда разрешения потребления тока'
      zh: '电流消耗授权指令'
      hu: 'Az áramfelvétel engedélyezési parancsa'
      pt: 'Comando de autorização de consumo de corrente'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'not authorization'
        fr: 'pas d''autorisation'
        es: 'sin autorización'
        de: 'keine Genehmigung'
        it: 'nessuna autorizzazione'
        pl: 'brak autoryzacji'
        ru: 'нет разрешения'
        zh: '无授权'
        hu: 'nincs engedélyezve'
        pt: 'sem autorização'
      0x01:
        en: 'Authorization'
        fr: 'Autorisation'
        es: 'Autorización'
        de: 'Freigabe'
        it: 'Autorizzazione'
        pl: 'Zezwolenie'
        ru: 'Разрешение'
        zh: '授权'
        hu: 'Engedély'
        pt: 'Autorização'

  UNUSED_1:
