id: 0x3F6
name: 'CONFIG_DISPLAY'
type: 'can'
length: 7
comment:
  en: 'Display language and unit configuration: date, time format, preferred units for consumption, distance, pressure and temperature.'
  fr: 'Configuration de langue et d''unités de l''afficheur : date, format de l''heure, unités préférées pour la consommation, la distance, la pression et la température.'
  es: 'Configuración de idioma y unidades de la pantalla: fecha, formato de hora, unidades preferidas para consumo, distancia, presión y temperatura.'
  de: 'Sprach- und Einheitenkonfiguration des Displays: Datum, Uhrzeitformat, bevorzugte Einheiten für Verbrauch, Strecke, Druck und Temperatur.'
  it: 'Configurazione di lingua e unità del display: data, formato ora, unità preferite per consumo, distanza, pressione e temperatura.'
  pl: 'Konfiguracja języka i jednostek wyświetlacza: data, format godziny, preferowane jednostki zużycia, dystansu, ciśnienia i temperatury.'
  ru: 'Настройка языка и единиц измерения дисплея: дата, формат времени, предпочитаемые единицы расхода, расстояния, давления и температуры.'
  zh: '显示屏语言和单位配置:日期、时间格式、油耗、距离、压力和温度的首选单位。'
  hu: 'A kijelző nyelvi és mértékegység-beállítása: dátum, óraformátum, a fogyasztás, távolság, nyomás és hőmérséklet preferált mértékegységei.'
  pt: 'Configuração de idioma e unidades do visor: data, formato de hora, unidades preferidas de consumo, distância, pressão e temperatura.'
observations:
  en: 'On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['1000ms', 'trigger']
senders: ['EMF', 'BTEL', 'CMB']
receivers: ['BSI', 'VTH', 'KML', 'MDS', 'MATT', 'CDC', 'BGP', 'BCD', 'CMB']

signals:
  TIMESTAMP_SECS:
    bits: '1.7-3.4'
    comment:
      en: 'Number of seconds elapsed since the last power-on of the display unit''s permanent supply.'
      fr: 'Nombre de secondes écoulées depuis la dernière mise sous tension permanente de l''afficheur.'
      es: 'Número de segundos transcurridos desde la última puesta bajo tensión permanente de la pantalla.'
      de: 'Anzahl der Sekunden seit der letzten Daueranschaltung des Displays.'
      it: 'Numero di secondi trascorsi dall''ultima messa sotto tensione permanente del display.'
      pl: 'Liczba sekund, które upłynęły od ostatniego stałego zasilenia wyświetlacza.'
      ru: 'Количество секунд, прошедших с последнего включения постоянного питания дисплея.'
      zh: '自显示单元常电最后一次上电以来经过的秒数。'
      hu: 'A kijelző állandó tápellátásának legutóbbi bekapcsolása óta eltelt másodpercek száma.'
      pt: 'Número de segundos decorridos desde a última colocação sob tensão permanente do visor.'
    type: 'uint'
    factor: 1
    min: 0
    max: 86399
    units: 's'
    invalid: 0xFFFFF
    default: 0x00

  TIMESTAMP_DAYS:
    bits: '3.3-4.0'
    comment:
      en: 'Day value counted since the last power-on of the display unit''s permanent supply.'
      fr: 'Valeur du jour comptée depuis la dernière mise sous tension permanente de l''afficheur.'
      es: 'Valor del día contado desde la última puesta bajo tensión permanente de la pantalla.'
      de: 'Tageswert, gezählt seit der letzten Daueranschaltung des Displays.'
      it: 'Valore del giorno contato dall''ultima messa sotto tensione permanente del display.'
      pl: 'Wartość dnia liczona od ostatniego stałego zasilenia wyświetlacza.'
      ru: 'Значение дня, отсчитываемое с последнего включения постоянного питания дисплея.'
      zh: '自显示单元常电最后一次上电以来计数的天数值。'
      hu: 'A nap értéke, a kijelző állandó tápellátásának legutóbbi bekapcsolása óta számolva.'
      pt: 'Valor do dia contado desde a última ativação da alimentação permanente da unidade de visualização.'
    type: 'uint'
    factor: 1
    min: 0
    max: 364
    units: 'day'
    invalid: 0xFFF
    default: 0x00
    alternatives:
      - note:
          en: 'Also observed at bits 1.7-2.0'
          fr: 'Aussi observé aux bits 1.7-2.0'
          es: 'También observado en los bits 1.7-2.0'
          de: 'Auch an den Bits 1.7-2.0 beobachtet'
          it: 'Osservato anche ai bit 1.7-2.0'
          pl: 'Obserwowany także na bitach 1.7-2.0'
          ru: 'Также наблюдался в битах 1.7-2.0'
          zh: '也观察到位于位1.7-2.0'
          hu: 'Megfigyelve a(z) 1.7-2.0 biteken is'
          pt: 'Também observado nos bits 1.7-2.0'
        bits: '1.7-2.0'

  TIMESTAMP_YEARS:
    bits: '5.7-5.0'
    comment:
      en: 'Year value counted since the last power-on of the display unit''s permanent supply.'
      fr: 'Valeur de l''année comptée depuis la dernière mise sous tension permanente de l''afficheur.'
      es: 'Valor del año contado desde la última puesta bajo tensión permanente de la pantalla.'
      de: 'Jahreswert, gezählt seit der letzten Daueranschaltung des Displays.'
      it: 'Valore dell''anno contato dall''ultima messa sotto tensione permanente del display.'
      pl: 'Wartość roku liczona od ostatniego stałego zasilenia wyświetlacza.'
      ru: 'Значение года, отсчитываемое с последнего включения постоянного питания дисплея.'
      zh: '自显示单元常电最后一次上电以来计数的年份值。'
      hu: 'Az év értéke, a kijelző állandó tápellátásának legutóbbi bekapcsolása óta számolva.'
      pt: 'Valor do ano contado desde a última ligação permanente do ecrã.'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: 'year'
    invalid: 0xFF
    default: 0x00
    alternatives:
      - note:
          en: 'Also observed at bits 3.7-3.0'
          fr: 'Aussi observé aux bits 3.7-3.0'
          es: 'También observado en los bits 3.7-3.0'
          de: 'Auch an den Bits 3.7-3.0 beobachtet'
          it: 'Osservato anche ai bit 3.7-3.0'
          pl: 'Obserwowany także na bitach 3.7-3.0'
          ru: 'Также наблюдался в битах 3.7-3.0'
          zh: '也观察到位于位3.7-3.0'
          hu: 'Megfigyelve a(z) 3.7-3.0 biteken is'
          pt: 'Também observado nos bits 3.7-3.0'
