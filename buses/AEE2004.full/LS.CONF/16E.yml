id: 0x16E
name: 'PASSENGER_SEAT_CONTROL_PANEL_STATUS'
type: 'can'
length: 6
comment:
  en: 'Passenger seat control panel switch states: seat position, backrest and cushion buttons, heating/ventilation and memory keypad.'
  fr: 'États des boutons du panneau de commande du siège passager : position du siège, dossier et assise, chauffage/ventilation et clavier mémoire.'
  es: 'Estados de los botones del panel de mando del asiento del pasajero: posición del asiento, respaldo y asiento, calefacción/ventilación y teclado de memoria.'
  de: 'Schalterstatus des Beifahrersitz-Bedienfelds: Sitzposition, Rückenlehne und Sitzfläche, Heizung/Belüftung und Memory-Tastenfeld.'
  it: 'Stati dei pulsanti del pannello di comando del sedile passeggero: posizione sedile, schienale e seduta, riscaldamento/ventilazione e tastiera memoria.'
  pl: 'Stany przycisków panelu sterowania fotela pasażera: pozycja fotela, oparcie i siedzisko, ogrzewanie/wentylacja i klawiatura pamięci.'
  ru: 'Состояния кнопок панели управления сиденьем пассажира: положение сиденья, спинка и подушка, подогрев/вентиляция и клавиатура памяти.'
  zh: '乘客座椅控制面板按钮状态:座椅位置、靠背和坐垫、加热/通风及记忆键盘。'
  hu: 'Az utasoldali ülés kezelőpaneljének gombállapotai: ülés helyzete, háttámla és ülőpárna, fűtés/szellőztetés és memóriabillentyűzet.'
  pt: 'Estados dos comutadores do painel de comando do banco do passageiro: posição do banco, botões do encosto e do assento, teclado de aquecimento/ventilação e memória.'
periodicity: ['200ms', 'trigger']
senders: ['PDS_C']
receivers: ['BDM_C', 'BSI']

signals:
  PASSENGER_SEAT_HEIGHT_UP_REQUEST:
    bits: '1.7'
    comment:
      en: 'Request to move the seat height upward'
      fr: 'Demande de mouvement du site de siège vers le haut'
      es: 'Solicitud de movimiento de la altura del asiento hacia arriba'
      de: 'Anforderung zur Aufwärtsbewegung der Sitzhöhe'
      it: 'Richiesta di movimento dell''altezza del sedile verso l''alto'
      pl: 'Żądanie podniesienia wysokości fotela'
      ru: 'Запрос перемещения высоты сиденья вверх'
      zh: '座椅高度向上移动请求'
      hu: 'Az ülésmagasság növelésének kérése'
      pt: 'Pedido de movimento da altura do banco para cima'
    type: 'bool'
    default: 0x00
