id: 0x123
name: 'KML_TELEPHONE_REPLY_PAYLOAD'
type: 'can-tp'
comment:
  en: 'Multi-frame reply payload from the hands-free kit for telephone data (call, options, connection, pairing, deletion, voice number, streaming).'
  fr: 'Charge utile de la réponse multi-trame du kit mains libres pour les données téléphone (appel, options, connexion, jumelage, suppression, numéro vocal, streaming).'
  es: 'Carga útil de la respuesta multitrama del kit manos libres para datos de teléfono (llamada, opciones, conexión, emparejamiento, eliminación, número de voz, streaming).'
  de: 'Nutzdaten der Mehrfachrahmen-Antwort der Freisprecheinrichtung für Telefondaten (Anruf, Optionen, Verbindung, Kopplung, Löschung, Sprachnummer, Streaming).'
  it: 'Payload della risposta multi-trama del kit vivavoce per i dati telefono (chiamata, opzioni, connessione, associazione, eliminazione, numero vocale, streaming).'
  pl: 'Dane odpowiedzi wieloramkowej zestawu głośnomówiącego dla danych telefonu (połączenie, opcje, połączenie sieciowe, parowanie, usuwanie, numer głosowy, strumieniowanie).'
  ru: 'Полезная нагрузка многокадрового ответа громкой связи для телефонных данных (вызов, опции, соединение, сопряжение, удаление, голосовой номер, потоковая передача).'
  zh: '免提套件用于电话数据的多帧应答有效载荷(通话、选项、连接、配对、删除、语音号码、流媒体)。'
  hu: 'A kihangosító többkeretes válaszának hasznos adattartalma telefonadatokhoz (hívás, beállítások, kapcsolat, párosítás, törlés, hangalapú szám, streamelés).'
  pt: 'Payload de resposta multi-trama do kit mãos-livres para dados de telefone (chamada, opções, ligação, emparelhamento, eliminação, número por voz, streaming).'
periodicity: ['trigger']
senders: ['RAD', 'KML', 'ICSV']
receivers: ['EMF', 'CMB']
isotp:
  flow_control_id: 0x29F

signals:
  PAYLOAD:
    bits: '1.7-n'
    comment:
      en: 'Application data (reassembled)'
      fr: 'Données applicatives (réassemblées)'
      es: 'Datos de aplicación (reensamblados)'
      de: 'Anwendungsdaten (wieder zusammengesetzt)'
      it: 'Dati applicativi (riassemblati)'
      pl: 'Dane aplikacyjne (ponownie złożone)'
      ru: 'Прикладные данные (пересобранные)'
      zh: '应用数据（重组后）'
      hu: 'Alkalmazásadatok (újraösszeállítva)'
      pt: 'Dados de aplicação (reagrupados)'
    type: 'bytes'

alternatives:
  - note:
      en: 'Other layout observed for this frame (other software or car version)'
      fr: 'Autre disposition observée pour cette trame (autre version de logiciel ou de véhicule)'
      es: 'Otra disposición observada para esta trama (otra versión de software o de vehículo)'
      de: 'Andere beobachtete Belegung dieser Botschaft (andere Software- oder Fahrzeugversion)'
      it: 'Altra disposizione osservata per questo frame (altra versione di software o di vettura)'
      pl: 'Inny zaobserwowany układ tej ramki (inna wersja oprogramowania lub samochodu)'
      ru: 'Другая наблюдаемая раскладка этого кадра (другая версия ПО или автомобиля)'
      zh: '此帧观察到的另一种布局（其他软件或车型版本）'
      hu: 'A keret másik megfigyelt elrendezése (más szoftver- vagy autóverzió)'
      pt: 'Outra disposição observada para esta trama (outra versão de software ou de veículo)'
