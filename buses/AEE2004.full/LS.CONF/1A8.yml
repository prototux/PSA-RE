id: 0x1A8
name: 'SPEED_CONTROL'
type: 'can'
length: 8
comment:
  en: 'Cruise control / speed limiter status: function active, engaged, activation attempt and set speed.'
  fr: 'État du régulateur/limiteur de vitesse : fonction active, engagée, tentative d''activation et vitesse consigne.'
  es: 'Estado del regulador/limitador de velocidad: función activa, engranada, intento de activación y velocidad de consigna.'
  de: 'Status der Geschwindigkeitsregelung/-begrenzung: Funktion aktiv, eingekuppelt, Aktivierungsversuch und Sollgeschwindigkeit.'
  it: 'Stato del regolatore/limitatore di velocità: funzione attiva, inserita, tentativo di attivazione e velocità impostata.'
  pl: 'Stan tempomatu/ogranicznika prędkości: funkcja aktywna, włączona, próba aktywacji i prędkość zadana.'
  ru: 'Статус круиз-контроля/ограничителя скорости: функция активна, включена, попытка активации и заданная скорость.'
  zh: '定速巡航/限速器状态:功能激活、已接合、激活尝试及设定车速。'
  hu: 'A tempomat/sebességhatároló állapota: funkció aktív, bekapcsolva, aktiválási kísérlet és beállított sebesség.'
  pt: 'Estado do regulador de velocidade / limitador de velocidade: função ativa, engrenada, tentativa de ativação e velocidade definida.'
observations:
  en: 'On state change of: FONCT_ACT_LVV_RVV, ETAT_FONCT_LVV_RVV, TENT_ACT_LVV_RVV, CRUISE_CONTROL_SPEED. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : FONCT_ACT_LVV_RVV, ETAT_FONCT_LVV_RVV, TENT_ACT_LVV_RVV, CRUISE_CONTROL_SPEED. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: FONCT_ACT_LVV_RVV, ETAT_FONCT_LVV_RVV, TENT_ACT_LVV_RVV, CRUISE_CONTROL_SPEED. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: FONCT_ACT_LVV_RVV, ETAT_FONCT_LVV_RVV, TENT_ACT_LVV_RVV, CRUISE_CONTROL_SPEED. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: FONCT_ACT_LVV_RVV, ETAT_FONCT_LVV_RVV, TENT_ACT_LVV_RVV, CRUISE_CONTROL_SPEED. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: FONCT_ACT_LVV_RVV, ETAT_FONCT_LVV_RVV, TENT_ACT_LVV_RVV, CRUISE_CONTROL_SPEED. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: FONCT_ACT_LVV_RVV, ETAT_FONCT_LVV_RVV, TENT_ACT_LVV_RVV, CRUISE_CONTROL_SPEED. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当FONCT_ACT_LVV_RVV, ETAT_FONCT_LVV_RVV, TENT_ACT_LVV_RVV, VIT_CONS_LVV_RVV状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z) FONCT_ACT_LVV_RVV, ETAT_FONCT_LVV_RVV, TENT_ACT_LVV_RVV, CRUISE_CONTROL_SPEED állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: FONCT_ACT_LVV_RVV, ETAT_FONCT_LVV_RVV, TENT_ACT_LVV_RVV, CRUISE_CONTROL_SPEED. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['200ms', 'trigger']
senders: ['BSI']
receivers: ['CMB', 'VTH', 'BCD', 'MATT', 'BGP']

