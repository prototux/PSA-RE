id: 0x0E1
name: 'AAS_DATA'
type: 'can'
length: 7
comment:
  en: 'Parking aid status: display request, measured side, beep delay/duration, and distances at front and rear (left, right, centre).'
  fr: 'État de l''aide au stationnement : demande d''affichage, côté mesuré, délai/durée de bip, et distances avant et arrière (gauche, droite, centre).'
  es: 'Estado de la ayuda al estacionamiento: solicitud de visualización, lado medido, retardo/duración del pitido, y distancias delanteras y traseras (izquierda, derecha, centro).'
  de: 'Status der Einparkhilfe: Anzeigeanforderung, gemessene Seite, Signaltonverzögerung/-dauer, sowie Abstände vorne und hinten (links, rechts, mittig).'
  it: 'Stato dell''assistenza al parcheggio: richiesta di visualizzazione, lato misurato, ritardo/durata del segnale acustico, e distanze anteriori e posteriori (sinistra, destra, centro).'
  pl: 'Stan czujników parkowania: żądanie wyświetlania, mierzona strona, opóźnienie/czas trwania sygnału dźwiękowego, oraz odległości z przodu i z tyłu (lewa, prawa, środkowa).'
  ru: 'Статус парковочного ассистента: запрос отображения, измеряемая сторона, задержка/длительность звукового сигнала, а также расстояния спереди и сзади (слева, справа, по центру).'
  zh: '驻车辅助状态:显示请求、测量侧、蜂鸣延迟/持续时间,以及前后(左、右、中)距离。'
  hu: 'A parkolássegítő állapota: megjelenítési kérés, mért oldal, hangjelzés késleltetése/időtartama, valamint elülső és hátsó távolságok (bal, jobb, középső).'
  pt: 'Estado da ajuda ao estacionamento: pedido de apresentação, lado medido, atraso/duração do sinal sonoro, e distâncias à frente e atrás (esquerda, direita, centro).'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['100ms', 'trigger']
senders: ['AAS', 'ICSV']
receivers: ['BTEL', 'BSI', 'AMPLI', 'CMB', 'EMF', 'RAD', 'BCD']

