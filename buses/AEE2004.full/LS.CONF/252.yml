id: 0x252
name: 'PASSENGER_MEMORY_SEAT_STATUS'
type: 'can'
length: 1
comment:
  en: 'Passenger memory seat module status: seat movement and memory recall.'
  fr: 'État du boîtier de mémorisation passager : mouvement siège et rappel mémoire.'
  es: 'Estado del módulo de memoria del asiento del pasajero: movimiento del asiento y recuperación de memoria.'
  de: 'Status des Beifahrersitz-Memory-Moduls: Sitzbewegung und Memory-Abruf.'
  it: 'Stato del modulo memoria sedile passeggero: movimento sedile e richiamo memoria.'
  pl: 'Stan modułu pamięci fotela pasażera: ruch fotela i przywołanie pamięci.'
  ru: 'Статус модуля памяти сиденья пассажира: перемещение сиденья и вызов памяти.'
  zh: '乘客座椅记忆模块状态:座椅移动和记忆调用。'
  hu: 'Az utasoldali memóriaülés-modul állapota: ülésmozgás és memória-visszahívás.'
  pt: 'Estado do módulo de memória do banco do passageiro: movimento do banco e recuperação de memória.'
periodicity: ['100ms']
senders: ['BDM_C']
receivers: ['BSI']

signals:
  PASSENGER_SEAT_REAR_ACCESS_MOTION:
    bits: '1.7'
    comment:
      en: 'Passenger seat in motion for rear seats access'
      fr: 'Siège passager en mouvement pour accès aux places arrière'
      es: 'Asiento del pasajero en movimiento para acceso a plazas traseras'
      de: 'Beifahrersitz bewegt sich für Fondzugang'
      it: 'Sedile passeggero in movimento per l''accesso ai sedili posteriori'
      pl: 'Fotel pasażera w ruchu w celu umożliwienia dostępu do tylnych siedzeń'
      ru: 'Сиденье пассажира движется для доступа к задним сиденьям'
      zh: '乘客座椅正在移动以便进入后排'
      hu: 'Az utasülés mozog a hátsó ülésekhez való hozzáférés érdekében'
      pt: 'Banco do passageiro em movimento para acesso aos lugares traseiros'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Not moving'
        fr: 'À l''arrêt (pas en mouvement)'
        es: 'Sin movimiento'
        de: 'Nicht in Bewegung'
        it: 'Non in movimento'
        pl: 'Nie w ruchu'
        ru: 'Не в движении'
        zh: '未移动'
        hu: 'Nem mozog'
        pt: 'Sem movimento'
      0x01:
