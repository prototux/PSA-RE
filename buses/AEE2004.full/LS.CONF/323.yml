id: 0x323
name: 'USB_DRIVE_STATUS'
type: 'can'
length: 7
comment:
  en: 'USB drive status: Bluetooth/USB access, USB power consumption, on/off state, Bluetooth/USB error flags, artist list availability (Bluetooth/USB).'
  fr: 'État du disque USB : accès Bluetooth/USB, consommation USB, état marche/arrêt, indicateurs d''erreur Bluetooth/USB, disponibilité de la liste d''artistes (Bluetooth/USB).'
  es: 'Estado de la unidad USB: acceso Bluetooth/USB, consumo USB, estado encendido/apagado, indicadores de error Bluetooth/USB, disponibilidad de la lista de artistas (Bluetooth/USB).'
  de: 'Status des USB-Laufwerks: Bluetooth-/USB-Zugriff, USB-Stromverbrauch, Ein/Aus-Status, Bluetooth-/USB-Fehlerkennzeichen, Verfügbarkeit der Interpretenliste (Bluetooth/USB).'
  it: 'Stato dell''unità USB: accesso Bluetooth/USB, consumo USB, stato acceso/spento, indicatori di errore Bluetooth/USB, disponibilità dell''elenco artisti (Bluetooth/USB).'
  pl: 'Stan napędu USB: dostęp Bluetooth/USB, pobór mocy USB, stan włączenia/wyłączenia, flagi błędów Bluetooth/USB, dostępność listy wykonawców (Bluetooth/USB).'
  ru: 'Статус USB-накопителя: доступ Bluetooth/USB, энергопотребление USB, состояние вкл/выкл, флаги ошибок Bluetooth/USB, доступность списка исполнителей (Bluetooth/USB).'
  zh: 'USB驱动器状态:蓝牙/USB存取、USB功耗、开关状态、蓝牙/USB错误标志、艺术家列表可用性(蓝牙/USB)。'
  hu: 'Az USB meghajtó állapota: Bluetooth/USB hozzáférés, USB energiafogyasztás, be/ki állapot, Bluetooth/USB hibajelzők, előadólista elérhetősége (Bluetooth/USB).'
  pt: 'Estado da unidade USB: acesso Bluetooth/USB, consumo de potência USB, estado ligado/desligado, indicadores de erro Bluetooth/USB, disponibilidade da lista de artistas (Bluetooth/USB).'
observations:
