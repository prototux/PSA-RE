id: 0x220
name: 'DOOR_STATUS'
alt_names: ['DOORS_STATUS']
type: 'can'
length: 2
comment:
  en: 'Openings status, sent on change: front/rear doors, boot, bonnet, rear window, fuel filler cap and roof, plus vehicle type.'
  fr: 'État des ouvrants, envoyé sur changement : portes avant/arrière, coffre, capot, lunette arrière, trappe à carburant et toit, ainsi que le type de véhicule.'
  es: 'Estado de las aperturas, enviado en cambio: puertas delanteras/traseras, maletero, capó, luneta trasera, tapa de combustible y techo, además del tipo de vehículo.'
  de: 'Status der Öffnungen, bei Änderung gesendet: Vorder-/Hintertüren, Kofferraum, Motorhaube, Heckscheibe, Tankklappe und Dach, sowie der Fahrzeugtyp.'
  it: 'Stato delle aperture, inviato al cambiamento: porte anteriori/posteriori, baule, cofano, lunotto, sportello carburante e tetto, oltre al tipo di veicolo.'
  pl: 'Stan otwarć, wysyłany przy zmianie: drzwi przednie/tylne, bagażnik, maska, tylna szyba, klapka wlewu paliwa i dach, oraz typ pojazdu.'
  ru: 'Статус проёмов, отправляемый при изменении: передние/задние двери, багажник, капот, заднее стекло, лючок бензобака и крыша, а также тип автомобиля.'
  zh: '开口状态,状态变化时发送:前后车门、后备箱、发动机盖、后窗、油箱盖和车顶,以及车辆类型。'
  hu: 'A nyílászárók állapota, változáskor küldve: első/hátsó ajtók, csomagtartó, motorháztető, hátsó ablak, üzemanyagtöltő fedél és tető, valamint a járműtípus.'
  pt: 'Estado das aberturas, enviado na mudança: portas dianteiras/traseiras, bagageira, capot, vidro traseiro, tampa do depósito e teto, além do tipo de veículo.'
observations:
  en: 'On state change of: FRONT_LEFT_DOOR_STATUS, FRONT_RIGHT_DOOR_STATUS, REAR_LEFT_DOOR_STATUS, TRUNK_STATUS_USER, BONNET_STATUS, REAR_WINDOW_STATUS, SPARE_WHEEL_ARM_STATUS'
  fr: 'Sur changement d''état de : FRONT_LEFT_DOOR_STATUS, FRONT_RIGHT_DOOR_STATUS, REAR_LEFT_DOOR_STATUS, TRUNK_STATUS_USER, BONNET_STATUS, REAR_WINDOW_STATUS, SPARE_WHEEL_ARM_STATUS'
  es: 'Al cambiar el estado de: FRONT_LEFT_DOOR_STATUS, FRONT_RIGHT_DOOR_STATUS, REAR_LEFT_DOOR_STATUS, TRUNK_STATUS_USER, BONNET_STATUS, REAR_WINDOW_STATUS, SPARE_WHEEL_ARM_STATUS'
  de: 'Bei Statusänderung von: FRONT_LEFT_DOOR_STATUS, FRONT_RIGHT_DOOR_STATUS, REAR_LEFT_DOOR_STATUS, TRUNK_STATUS_USER, BONNET_STATUS, REAR_WINDOW_STATUS, SPARE_WHEEL_ARM_STATUS'
  it: 'Al cambiamento di stato di: FRONT_LEFT_DOOR_STATUS, FRONT_RIGHT_DOOR_STATUS, REAR_LEFT_DOOR_STATUS, TRUNK_STATUS_USER, BONNET_STATUS, REAR_WINDOW_STATUS, SPARE_WHEEL_ARM_STATUS'
  pl: 'Wysyłane przy zmianie stanu: FRONT_LEFT_DOOR_STATUS, FRONT_RIGHT_DOOR_STATUS, REAR_LEFT_DOOR_STATUS, TRUNK_STATUS_USER, BONNET_STATUS, REAR_WINDOW_STATUS, SPARE_WHEEL_ARM_STATUS'
  ru: 'При изменении состояния: FRONT_LEFT_DOOR_STATUS, FRONT_RIGHT_DOOR_STATUS, REAR_LEFT_DOOR_STATUS, TRUNK_STATUS_USER, BONNET_STATUS, REAR_WINDOW_STATUS, SPARE_WHEEL_ARM_STATUS'
  zh: '当ETAT_PORTE_AVG, FRONT_RIGHT_DOOR_STATUS, REAR_LEFT_DOOR_STATUS, TRUNK_STATUS_USER, BONNET_STATUS, REAR_WINDOW_STATUS, ETAT_BRDS状态变化时'
  hu: 'A(z) FRONT_LEFT_DOOR_STATUS, FRONT_RIGHT_DOOR_STATUS, REAR_LEFT_DOOR_STATUS, TRUNK_STATUS_USER, BONNET_STATUS, REAR_WINDOW_STATUS, SPARE_WHEEL_ARM_STATUS állapotváltozásakor'
  pt: 'Na mudança de estado de: FRONT_LEFT_DOOR_STATUS, FRONT_RIGHT_DOOR_STATUS, REAR_LEFT_DOOR_STATUS, TRUNK_STATUS_USER, BONNET_STATUS, REAR_WINDOW_STATUS, SPARE_WHEEL_ARM_STATUS'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['CMB', 'EMF']

