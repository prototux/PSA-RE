id: 0x292
name: 'SEATBELT_REMINDER_CONFIG'
type: 'can'
length: 8
comment:
  en: 'Seat count and seatbelt reminder configuration per seating position, sent by the seatbelt reminder module.'
  fr: 'Nombre de sièges et configuration du rappel de bouclage de ceinture par place, envoyés par le module de rappel de ceinture.'
  es: 'Número de asientos y configuración del recordatorio del cinturón por plaza, enviados por el módulo de recordatorio del cinturón.'
  de: 'Sitzanzahl und Konfiguration der Gurtwarnung je Sitzplatz, gesendet vom Gurtwarnungsmodul.'
  it: 'Numero di posti e configurazione del promemoria cintura per posizione, inviati dal modulo di promemoria cintura.'
  pl: 'Liczba miejsc i konfiguracja przypomnienia o pasach dla każdego miejsca, wysyłane przez moduł przypomnienia o pasach.'
  ru: 'Количество сидений и конфигурация напоминания о ремне для каждого места, отправляемые модулем напоминания о ремне.'
  zh: '每个座位的座椅数量及安全带提醒配置，由安全带提醒模块发送。'
  hu: 'Az ülések száma és az övemlékeztető konfigurációja üléshelyenként, az övemlékeztető modul küldi.'
  pt: 'Número de bancos e configuração do aviso de cinto de segurança por posição de banco, enviados pelo módulo de aviso de cinto.'
periodicity: ['200ms', 'trigger']
senders: ['TNB']
receivers: ['BSI']

