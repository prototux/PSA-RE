id: 0x12E
name: 'SLIDING_DOOR_AUTHORIZATION'
type: 'can'
length: 2
comment:
  en: 'Sliding door authorisation commands from the BSI, driver and passenger side.'
  fr: 'Commandes d''autorisation des portes coulissantes de la BSI, côtés conducteur et passager.'
  es: 'Comandos de autorización de las puertas correderas de la BSI, lados conductor y pasajero.'
  de: 'Freigabebefehle für die Schiebetüren des BSI, Fahrer- und Beifahrerseite.'
  it: 'Comandi di autorizzazione delle porte scorrevoli della BSI, lato guidatore e passeggero.'
  pl: 'Polecenia autoryzacji drzwi przesuwnych z BSI, strona kierowcy i pasażera.'
  ru: 'Команды разрешения на сдвижные двери от BSI, со стороны водителя и пассажира.'
  zh: 'BSI发出的滑动门授权命令,驾驶员侧和乘客侧。'
  hu: 'A BSI tolóajtó-engedélyezési parancsai, vezetői és utasoldali.'
  pt: 'Comandos de autorização das portas corrediças da BSI, lado do condutor e do passageiro.'
observations:
  en: 'On state change of: DRIVER_PDS_ENABLED, PASSENGER_PDS_ENABLED'
  fr: 'Sur changement d''état de : DRIVER_PDS_ENABLED, PASSENGER_PDS_ENABLED'
  es: 'Al cambiar el estado de: DRIVER_PDS_ENABLED, PASSENGER_PDS_ENABLED'
  de: 'Bei Statusänderung von: DRIVER_PDS_ENABLED, PASSENGER_PDS_ENABLED'
  it: 'Al cambiamento di stato di: DRIVER_PDS_ENABLED, PASSENGER_PDS_ENABLED'
  pl: 'Wysyłane przy zmianie stanu: DRIVER_PDS_ENABLED, PASSENGER_PDS_ENABLED'
  ru: 'При изменении состояния: DRIVER_PDS_ENABLED, PASSENGER_PDS_ENABLED'
  zh: '当AUTOR_PDS_C, AUTOR_PDS_P状态变化时'
  hu: 'A(z) DRIVER_PDS_ENABLED, PASSENGER_PDS_ENABLED állapotváltozásakor'
  pt: 'Na mudança de estado de: DRIVER_PDS_ENABLED, PASSENGER_PDS_ENABLED'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['PDS_C']

signals:
  DRIVER_PDS_ENABLED:
    bits: '1.7'
    comment:
      en: 'Driver-side PDS function enabled'
      fr: 'Autorisation de fonctionnement du PDS conducteur'
      es: 'Función PDS del conductor habilitada'
      de: 'Freigabe der PDS-Funktion Fahrerseite'
      it: 'Abilitazione della funzione PDS lato guidatore'
      pl: 'Zezwolenie na działanie funkcji PDS kierowcy'
      ru: 'Разрешение работы функции PDS со стороны водителя'
      zh: '驾驶侧PDS功能启用'
      hu: 'Vezetőoldali PDS funkció engedélyezve'
      pt: 'Função PDS do condutor habilitada'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'not authorization'
        fr: 'pas d''autorisation'
        es: 'sin autorización'
        de: 'keine Genehmigung'
        it: 'nessuna autorizzazione'
        pl: 'brak autoryzacji'
        ru: 'нет разрешения'
        zh: '无授权'
        hu: 'nincs engedélyezve'
        pt: 'sem autorização'
      0x01:
        en: 'Authorization'
        fr: 'Autorisation'
        es: 'Autorización'
        de: 'Freigabe'
        it: 'Autorizzazione'
        pl: 'Zezwolenie'
        ru: 'Разрешение'
        zh: '授权'
        hu: 'Engedély'
        pt: 'Autorização'

  UNUSED_1:
    bits: '1.6-1.0'
    unused: true

  PASSENGER_PDS_ENABLED:
    bits: '2.7'
    comment:
      en: 'Passenger-side PDS function enabled'
      fr: 'Autorisation de fonctionnement du PDS passager'
      es: 'Función PDS del pasajero habilitada'
      de: 'Freigabe der PDS-Funktion Beifahrerseite'
      it: 'Abilitazione della funzione PDS lato passeggero'
      pl: 'Zezwolenie na działanie funkcji PDS pasażera'
      ru: 'Разрешение работы функции PDS со стороны пассажира'
      zh: '乘客侧PDS功能启用'
      hu: 'Utasoldali PDS funkció engedélyezve'
      pt: 'Função PDS do passageiro habilitada'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'not authorization'
        fr: 'pas d''autorisation'
        es: 'sin autorización'
        de: 'keine Genehmigung'
        it: 'nessuna autorizzazione'
        pl: 'brak autoryzacji'
        ru: 'нет разрешения'
        zh: '无授权'
        hu: 'nincs engedélyezve'
        pt: 'sem autorização'
      0x01:
        en: 'Authorization'
        fr: 'Autorisation'
        es: 'Autorización'
        de: 'Freigabe'
        it: 'Autorizzazione'
        pl: 'Zezwolenie'
        ru: 'Разрешение'
        zh: '授权'
        hu: 'Engedély'
        pt: 'Autorização'

  UNUSED_2:
    bits: '2.6-2.0'
    unused: true
