id: 0x2D0
name: 'REAR_AIR_CONDITIONING_SETPOINTS'
type: 'can'
length: 4
comment:
  en: 'Rear air conditioning setpoints from the BSI: rear left/right blower speed and temperature setpoints.'
  fr: 'Consignes de climatisation arrière transmises par la BSI : consignes de vitesse de pulseur et de température arrière gauche/droite.'
  es: 'Consignas de climatización trasera transmitidas por la BSI: consignas de velocidad de ventilador y temperatura trasera izquierda/derecha.'
  de: 'Sollwerte der hinteren Klimaanlage von der BSI: Gebläsedrehzahl- und Temperatursollwerte hinten links/rechts.'
  it: 'Setpoint di climatizzazione posteriore trasmessi dalla BSI: setpoint di velocità ventola e temperatura posteriore sinistra/destra.'
  pl: 'Wartości zadane klimatyzacji tylnej przesyłane przez BSI: zadana prędkość dmuchawy i temperatura tylna lewa/prawa.'
  ru: 'Заданные значения заднего климат-контроля от BSI: заданная скорость вентилятора и температура сзади слева/справа.'
  zh: '由BSI传输的后排空调设定值:左/右后排风扇速度及温度设定值。'
  hu: 'A hátsó klíma alapértékei a BSI-től: hátsó bal/jobb ventilátorsebesség és hőmérséklet-alapértékek.'
  pt: 'Pontos de ajuste da climatização traseira da BSI: pontos de ajuste de velocidade do ventilador e de temperatura, esquerdo/direito traseiros.'
periodicity: ['500ms', 'trigger']
senders: ['CLIM_AV']
receivers: ['BSI']

