  TRUNK_HANDSFREE_UNLOCK_COMMAND:
    bits: '2.3'
    comment:
      en: 'Multiplexed unlocking command for the trunk (hands-free access only)'
      fr: 'Commande multiplexée de décondamnation du coffre (accès mains libres uniquement)'
      es: 'Comando multiplexado de desbloqueo del maletero (solo acceso manos libres)'
      de: 'Multiplexierter Entriegelungsbefehl für den Kofferraum (nur Freihandzugang)'
      it: 'Comando multiplato di sblocco del bagagliaio (solo accesso mani libere)'
      pl: 'Zmultipleksowane polecenie odblokowania bagażnika (tylko dostęp bezdotykowy)'
      ru: 'Мультиплексная команда разблокировки багажника (только доступ без помощи рук)'
      zh: '行李箱多路复用解锁指令(仅限免提进入)'
      hu: 'A csomagtartó multiplexelt nyitási parancsa (csak kihands-free hozzáférésnél)'
      pt: 'Comando multiplexado de desbloqueio da mala (apenas acesso mãos-livres)'
    type: 'bool'
    default: 0x00

  REAR_WINDOW_HANDSFREE_UNLOCK_COMMAND:
    bits: '2.2'
    comment:
      en: 'Multiplexed unlocking command for the rear window (hands-free access only)'
      fr: 'Commande multiplexée de décondamnation de la lunette arrière (accès mains libres uniquement)'
      es: 'Comando multiplexado de desbloqueo de la luneta trasera (solo acceso manos libres)'
      de: 'Multiplexierter Entriegelungsbefehl für die Heckscheibe (nur Freihandzugang)'
      it: 'Comando multiplato di sblocco del lunotto posteriore (solo accesso mani libere)'
      pl: 'Zmultipleksowane polecenie odblokowania tylnej szyby (tylko dostęp bezdotykowy)'
      ru: 'Мультиплексная команда разблокировки заднего стекла (только доступ без помощи рук)'
      zh: '后窗多路复用解锁指令(仅限免提进入)'
      hu: 'A hátsó ablak multiplexelt nyitási parancsa (csak kihands-free hozzáférésnél)'
      pt: 'Comando multiplexado de desbloqueio do vidro traseiro (apenas acesso mãos-livres)'
    type: 'bool'
    default: 0x00

  UNLOCKING_PERFORMED:
    bits: '2.1'
    comment:
      en: 'Status indicating that an unlocking command was carried out'
      fr: 'État indiquant qu''une commande de décondamnation a été réalisée'
      es: 'Estado que indica que se ha realizado un comando de desbloqueo'
      de: 'Status, der anzeigt, dass ein Entriegelungsbefehl ausgeführt wurde'
      it: 'Stato che indica che è stato eseguito un comando di sblocco'
      pl: 'Stan wskazujący, że wykonano polecenie odblokowania'
      ru: 'Статус, указывающий, что команда разблокировки была выполнена'
      zh: '表示解锁指令已执行的状态'
      hu: 'Állapot, amely jelzi, hogy nyitási parancs végrehajtása megtörtént'
      pt: 'Estado que indica que um comando de desbloqueio foi executado'
    type: 'bool'
    default: 0x00
    values:
      0x01:
        en: 'If a wired unlocking command was sent to the locks'
        fr: 'Si une commande de décondamnation filaire a été générée vers les serrures'
        es: 'Si se generó un comando de desbloqueo por cable hacia las cerraduras'
        de: 'Wenn ein kabelgebundener Entriegelungsbefehl an die Schlösser gesendet wurde'
        it: 'Se è stato generato un comando di sblocco via cavo verso le serrature'
        pl: 'Jeśli do zamków wysłano przewodowe polecenie odblokowania'
        ru: 'Если на замки была отправлена проводная команда разблокировки'
        zh: '如果已向门锁发送有线解锁命令'
        hu: 'Ha vezetékes kioldási parancsot küldtek a zárak felé'
        pt: 'Se foi enviado um comando de desbloqueio por cabo para as fechaduras'

  HANDS_FREE_LOCKING_REQUEST:
    bits: '2.0'
    comment:
      en: 'Hands-free locking request'
      fr: 'Demande de condamnation mains libres'
      es: 'Solicitud de bloqueo manos libres'
      de: 'Freihand-Verriegelungsanforderung'
      it: 'Richiesta di bloccaggio mani libere'
      pl: 'Żądanie zamknięcia bezdotykowego'
      ru: 'Запрос блокировки без помощи рук'
      zh: '免提锁止请求'
      hu: 'Kihands-free zárási kérés'
      pt: 'Pedido de bloqueio mãos-livres'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'If the hands-free locking push button was not pressed'
        fr: 'Si aucun appui sur le bouton de condamnation mains libres n''est généré'
        es: 'Si no se genera ninguna pulsación del botón de bloqueo manos libres'
        de: 'Wenn kein Tastendruck auf den Freisprech-Verriegelungstaster erfolgt ist'
