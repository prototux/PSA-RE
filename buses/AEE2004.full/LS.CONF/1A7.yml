id: 0x1A7
name: 'RESTART_ALERTS'
type: 'can'
length: 4
comment:
  en: 'Retransmitted whenever any of its status parameters changes: alarm lock beep, and door/ESP/lights/speed limiter/pollution/cruise control/rain sensor/theft-alert faults.'
  fr: 'Retransmise à chaque changement d''état de l''un de ses paramètres : bip de verrouillage alarme, et défauts porte/ESP/feux/limiteur de vitesse/pollution/regulateur/capteur de pluie/alerte antivol.'
  es: 'Retransmitida cada vez que cambia uno de sus parámetros de estado: bip de bloqueo de alarma y fallos de puerta/ESP/luces/limitador de velocidad/contaminación/control de crucero/sensor de lluvia/alerta antirrobo.'
  de: 'Wird bei jeder Zustandsänderung eines ihrer Parameter erneut gesendet: Alarm-Verriegelungston sowie Fehler bei Tür/ESP/Licht/Tempolimiter/Abgas/Tempomat/Regensensor/Diebstahlwarnung.'
  it: 'Ritrasmessa ad ogni cambiamento di stato di uno dei suoi parametri: bip di chiusura allarme e guasti porta/ESP/luci/limitatore di velocità/inquinamento/cruise control/sensore pioggia/allarme antifurto.'
  pl: 'Retransmitowana przy każdej zmianie stanu któregokolwiek z parametrów: sygnał blokady alarmu oraz usterki drzwi/ESP/świateł/ogranicznika prędkości/emisji/tempomatu/czujnika deszczu/alarmu antywłamaniowego.'
  ru: 'Повторно передаётся при каждом изменении любого из параметров состояния: звуковой сигнал блокировки сигнализации, а также неисправности дверей/ESP/света/ограничителя скорости/выбросов/круиз-контроля/датчика дождя/сигнализации.'
  zh: '任一状态参数发生变化时重新发送:报警上锁提示音,以及车门/ESP/车灯/限速器/排放/巡航控制/雨量传感器/防盗报警故障。'
  hu: 'Bármely állapotparaméterének változásakor újra elküldve: riasztózárás hangjelzés, valamint ajtó-/ESP-/világítás-/sebességkorlátozó-/kibocsátás-/tempomat-/esoerzekelő-/lopásriasztás-hibák.'
  pt: 'Retransmitida sempre que um dos seus parâmetros de estado muda: sinal sonoro de bloqueio do alarme, e avarias de porta/ESP/luzes/limitador de velocidade/poluição/regulador de velocidade/sensor de chuva/alerta antirroubo.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['1000ms', 'trigger']
senders: ['BSI']
receivers: ['CMB']

