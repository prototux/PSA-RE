id: 0x21F
name: 'RADIO_COMMANDS_3'
alt_names: ['RADIO_COMMANDS']
type: 'can'
length: 3
comment:
  en: 'Used by the BSI as a monitoring frame for equipment functionally linked to it on the body network; carries steering column radio control commands from the top-of-column module.'
  fr: 'Utilisée par la BSI comme trame de surveillance des équipements qui lui sont fonctionnellement liés sur le réseau carrosserie ; porte les commandes radio de la colonne de direction, issues du module haut de colonne.'
  es: 'Utilizada por la BSI como trama de vigilancia de los equipos funcionalmente vinculados a ella en la red de carrocería; transporta las órdenes de radio de la columna de dirección, procedentes del módulo superior de columna.'
  de: 'Von der BSI als Überwachungsrahmen für funktional verbundene Geräte im Karosserienetzwerk verwendet; trägt Radiobefehle der Lenksäule vom oberen Lenksäulenmodul.'
  it: 'Utilizzata dalla BSI come trama di sorveglianza per le apparecchiature a essa funzionalmente collegate sulla rete carrozzeria; trasporta i comandi radio della colonna di sterzo dal modulo superiore della colonna.'
  pl: 'Wykorzystywana przez BSI jako ramka nadzoru urządzeń funkcjonalnie z nią powiązanych w sieci nadwozia; przenosi polecenia radia z kolumny kierownicy, z modułu górnej części kolumny.'
  ru: 'Используется BSI как контрольный кадр для функционально связанных устройств в кузовной сети; содержит радиокоманды рулевой колонки от модуля верхней части колонки.'
  zh: 'BSI用作监控车身网络上与其功能相关设备的监控帧；携带来自转向柱上部模块的收音机控制命令。'
  hu: 'A BSI a hozzá funkcionálisan kapcsolódó, karosszériahálózati eszközök felügyeleti kereteként használja; a kormányoszlop felső moduljából származó rádióvezérlő parancsokat hordozza.'
  pt: 'Utilizada pela BSI como trama de monitorização de equipamento funcionalmente ligado a ela na rede de servidão; transporta os comandos de rádio da coluna de direção provenientes do módulo do topo de coluna.'
observations:
  en: 'On state change of: SEEK_UP, SEEK_DOWN, OVERFLOW_SCROLL_UP, OVERFLOW_SCROLL_DOWN, VOL_UP, VOL_DOWN, SRC, SCROLL. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : SEEK_UP, SEEK_DOWN, OVERFLOW_SCROLL_UP, OVERFLOW_SCROLL_DOWN, VOL_UP, VOL_DOWN, SRC, SCROLL. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: SEEK_UP, SEEK_DOWN, OVERFLOW_SCROLL_UP, OVERFLOW_SCROLL_DOWN, VOL_UP, VOL_DOWN, SRC, SCROLL. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: SEEK_UP, SEEK_DOWN, OVERFLOW_SCROLL_UP, OVERFLOW_SCROLL_DOWN, VOL_UP, VOL_DOWN, SRC, SCROLL. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: SEEK_UP, SEEK_DOWN, OVERFLOW_SCROLL_UP, OVERFLOW_SCROLL_DOWN, VOL_UP, VOL_DOWN, SRC, SCROLL. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: SEEK_UP, SEEK_DOWN, OVERFLOW_SCROLL_UP, OVERFLOW_SCROLL_DOWN, VOL_UP, VOL_DOWN, SRC, SCROLL. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: SEEK_UP, SEEK_DOWN, OVERFLOW_SCROLL_UP, OVERFLOW_SCROLL_DOWN, VOL_UP, VOL_DOWN, SRC, SCROLL. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当SEEK_UP_ET_HDC, SEEK_DOWN, OVERFLOW_SCROLL_UP, OVERFLOW_SCROLL_DOWN, VOL_UP, VOL_DOWN, SRC, CMPT_MOL_ET_HDC状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z) SEEK_UP, SEEK_DOWN, OVERFLOW_SCROLL_UP, OVERFLOW_SCROLL_DOWN, VOL_UP, VOL_DOWN, SRC, SCROLL állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: SEEK_UP, SEEK_DOWN, OVERFLOW_SCROLL_UP, OVERFLOW_SCROLL_DOWN, VOL_UP, VOL_DOWN, SRC, SCROLL. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['100ms', 'trigger']
senders: ['BSI', 'ICSV']
receivers: ['BTEL', 'RAD', 'KML', 'EMF', 'MDS', 'BTT', 'DIAG_TOOL', 'ICSV']

