id: 0x1D5
name: 'REAR_RIGHT_DOOR_LOCK_STATUS'
type: 'can'
length: 2
comment:
  en: 'Rear-right door lock status: lock position, internal/external switch contacts and handle pull detection.'
  fr: 'État de la serrure de porte arrière droite : position de verrouillage, contacts des contacteurs interne/externe et détection de tirage de poignée.'
  es: 'Estado de la cerradura de la puerta trasera derecha: posición de bloqueo, contactos de los interruptores interno/externo y detección de tirón de la manija.'
  de: 'Status des hinteren rechten Türschlosses: Verriegelungsposition, Innen-/Außenschalterkontakte und Türgrifferkennung.'
  it: 'Stato della serratura della portiera posteriore destra: posizione di blocco, contatti degli interruttori interno/esterno e rilevamento di trazione della maniglia.'
  pl: 'Stan zamka tylnych prawych drzwi: pozycja blokady, styki przełączników wewnętrznego/zewnętrznego i wykrycie pociągnięcia klamki.'
  ru: 'Статус замка задней правой двери: положение блокировки, контакты внутреннего/наружного выключателя и обнаружение потягивания ручки.'
  zh: '右后车门锁状态:锁止位置、内/外开关触点及拉动门把手检测。'
  hu: 'A hátsó jobb ajtózár állapota: zárási helyzet, belső/külső kapcsolóérintkezők és kilincshúzás érzékelése.'
  pt: 'Estado do fecho da porta traseira direita: posição do fecho, contactos dos comutadores interno/externo e deteção de puxar o puxador.'
periodicity: ['1000ms', 'trigger']
senders: []  # TODO: find the sender(s)
receivers: ['BSI']

