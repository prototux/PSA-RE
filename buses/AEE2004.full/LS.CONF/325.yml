id: 0x325
name: 'RADIO_STATUS_CD_GEN'
type: 'can'
length: 3
comment:
  en: 'CD player general status: access, unreadable disk, error flags, playback state, MP3 list, folder and current disk.'
  fr: 'État général du lecteur CD : accès, disque illisible, indicateurs d''erreur, état de lecture, liste MP3, dossier et disque courant.'
  es: 'Estado general del reproductor de CD: acceso, disco ilegible, indicadores de error, estado de reproducción, lista MP3, carpeta y disco actual.'
  de: 'Allgemeiner Status des CD-Players: Zugriff, unlesbare CD, Fehlerkennzeichen, Wiedergabestatus, MP3-Liste, Ordner und aktuelle CD.'
  it: 'Stato generale del lettore CD: accesso, disco illeggibile, indicatori di errore, stato di riproduzione, elenco MP3, cartella e disco corrente.'
  pl: 'Ogólny stan odtwarzacza CD: dostęp, nieczytelna płyta, flagi błędów, stan odtwarzania, lista MP3, folder i bieżąca płyta.'
  ru: 'Общий статус CD-проигрывателя: доступ, нечитаемый диск, флаги ошибок, состояние воспроизведения, список MP3, папка и текущий диск.'
  zh: 'CD播放器总体状态:存取、无法读取的光盘、错误标志、播放状态、MP3列表、文件夹及当前光盘。'
  hu: 'A CD-lejátszó általános állapota: hozzáférés, olvashatatlan lemez, hibajelzők, lejátszási állapot, MP3-lista, mappa és aktuális lemez.'
  pt: 'Estado geral do leitor de CD: acesso, disco ilegível, indicadores de erro, estado de reprodução, lista MP3, pasta e disco atual.'
periodicity: ['500ms', 'trigger']
senders: ['RAD', 'ICSV']
receivers: ['EMF', 'CMB', 'MATT', 'ICSV']

