id: 0x0A9
name: 'NAV_RECALL_TRANSPORT_HEADER'
type: 'can'
length: 8
comment:
  en: 'Transport-layer header for multi-frame navigation prompt data sent to the instrument cluster.'
  fr: 'En-tête de couche transport pour les données multi-trames de rappel de navigation envoyées au combiné d''instruments.'
  es: 'Cabecera de capa de transporte para los datos multi-trama de aviso de navegación enviados al cuadro de instrumentos.'
  de: 'Transportschicht-Header für mehrteilige Navigationshinweis-Daten an das Kombiinstrument.'
  it: 'Intestazione del livello di trasporto per i dati multi-trama di richiamo di navigazione inviati al quadro strumenti.'
  pl: 'Nagłówek warstwy transportowej dla wieloramkowych danych przypomnień nawigacji wysyłanych do zestawu wskaźników.'
  ru: 'Заголовок транспортного уровня для многокадровых данных навигационных подсказок, отправляемых на приборную панель.'
  zh: '发送给仪表组的多帧导航提示数据的传输层帧头。'
  hu: 'A műszerfalnak küldött többkeretes navigációs emlékeztető adatok szállítási rétegbeli fejléce.'
  pt: 'Cabeçalho da camada de transporte para os dados multitrama de aviso de navegação enviados para o quadrante.'
observations:
  en: 'On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['10ms']
senders: ['BSI']
receivers: ['CMB']

