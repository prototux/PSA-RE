id: 0x0D6
name: 'ROOF_STATUS'
alt_names: ['STATUS_BTE']
type: 'can'
length: 6
comment:
  en: 'Electric roof status: boot open, roof locked, system fault and window movement requests linked to the roof'
  fr: 'État du toit électrique : coffre ouvert, toit verrouillé, défaut système et demandes de mouvement des vitres liées au toit'
  es: 'Estado del techo eléctrico: maletero abierto, techo bloqueado, fallo del sistema y solicitudes de movimiento de ventanillas ligadas al techo'
  de: 'Status des elektrischen Dachs: Kofferraum offen, Dach verriegelt, Systemfehler und mit dem Dach verbundene Fensteranforderungen'
  it: 'Stato del tetto elettrico: bagagliaio aperto, tetto bloccato, guasto di sistema e richieste di movimento dei finestrini legate al tetto'
  pl: 'Stan dachu elektrycznego: otwarty bagażnik, zablokowany dach, usterka systemu i żądania ruchu szyb powiązane z dachem'
  ru: 'Состояние электрической крыши: багажник открыт, крыша заблокирована, неисправность системы и запросы движения стёкол, связанные с крышей'
  zh: '电动车顶状态:行李厢开启、车顶锁定、系统故障及与车顶联动的车窗动作请求'
  hu: 'Az elektromos tető állapota: csomagtér nyitva, tető zárolva, rendszerhiba és a tetőhöz kapcsolódó ablakmozgatási kérések'
  pt: 'Estado do teto elétrico: mala aberta, teto bloqueado, avaria do sistema e pedidos de movimento dos vidros associados ao teto.'
observations:
  en: 'On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['200ms', 'trigger']
senders: ['BTE']
receivers: ['BSI', 'EDP_C', 'AMPLI']

