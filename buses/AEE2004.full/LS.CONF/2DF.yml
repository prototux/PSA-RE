            fr: 'oui'
            es: 'sí'
            de: 'ja'
            it: 'sì'
            pl: 'tak'
            ru: 'да'
            zh: '是'
            hu: 'igen'
            pt: 'Sim'
      PEERING_CODE:
        bits: '2.7-18.0'
        comment:
          en: 'Peering code.'
          fr: 'Code d''appairage.'
          es: 'Código de emparejamiento.'
          de: 'Kopplungscode.'
          it: 'Codice di associazione.'
          pl: 'Kod parowania.'
          ru: 'Код сопряжения.'
          zh: '配对代码。'
