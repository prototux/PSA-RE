        fr: 'Mode accueil et ambiance inactif'
        es: 'Modo bienvenida y ambiente inactivo'
        de: 'Begrüßungs- und Ambientemodus inaktiv'
        it: 'Modalità accoglienza e atmosfera inattiva'
        pl: 'Tryb powitania i nastroju nieaktywny'
