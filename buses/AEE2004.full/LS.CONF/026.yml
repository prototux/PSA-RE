id: 0x026
name: 'NAV_RECALL_TRANSPORT_FLOW_CONTROL'
type: 'can'
length: 3
comment:
  en: 'Flow-control frame (block size, frame type, separation time) for the multi-frame navigation prompt transfer to the instrument cluster.'
  fr: 'Trame de contrôle de flux (taille de bloc, type de trame, temps de séparation) pour le transfert multi-trames de rappel de navigation vers le combiné.'
  es: 'Trama de control de flujo (tamaño de bloque, tipo de trama, tiempo de separacion) para la transferencia multi-trama de aviso de navegación al cuadro de instrumentos.'
  de: 'Flusskontrollrahmen (Blockgröße, Rahmentyp, Trennzeit) für die mehrteilige Navigationshinweis-Übertragung an das Kombiinstrument.'
  it: 'Trama di controllo di flusso (dimensione blocco, tipo trama, tempo di separazione) per il trasferimento multi-trama di richiamo di navigazione al quadro strumenti.'
  pl: 'Ramka kontroli przepływu (rozmiar bloku, typ ramki, czas separacji) dla wieloramkowego transferu przypomnień nawigacji do zestawu wskaźników.'
  ru: 'Кадр управления потоком (размер блока, тип кадра, время разделения) для многокадровой передачи навигационных подсказок на приборную панель.'
  zh: '发送给仪表组的多帧导航提示传输的流控帧(块大小、帧类型、分隔时间)。'
  hu: 'A műszerfal felé tortenő többkeretes navigációs emlékeztető-átvitel folyamvezerlő kerete (blokkméret, kerettípus, elválasztási idő).'
  pt: 'Trama de controlo de fluxo (tamanho do bloco, tipo de trama, tempo de separação) para a transferência multitrama de aviso de navegação para o quadrante.'
periodicity: ['10ms']
senders: ['CMB']
receivers: ['BTEL']

signals:
  FLOW_STATUS:
    bits: '1.3-1.0'
    comment:
      en: 'Flow status (per the OSEK-COM segmentation standard)'
      fr: 'Flow Status (cf. norme de segmentation OSEK-COM)'
      es: 'Estado de flujo (según el estándar de segmentación OSEK-COM)'
      de: 'Flusssteuerungsstatus (gemäß dem OSEK-COM-Segmentierungsstandard)'
      it: 'Stato di flusso (secondo lo standard di segmentazione OSEK-COM)'
      pl: 'Stan przepływu (zgodnie ze standardem segmentacji OSEK-COM)'
      ru: 'Статус потока (согласно стандарту сегментации OSEK-COM)'
      zh: '流控制状态（依据 OSEK-COM 分段标准）'
      hu: 'Folyamvezérlési állapot (az OSEK-COM szegmentálási szabvány szerint)'
      pt: 'Estado de fluxo (segundo a norma de segmentação OSEK-COM)'
    type: 'enum'
    values:
      0x00:
        en: 'Clear to send'
        fr: 'Prêt à envoyer'
        es: 'Listo para enviar'
        de: 'Sendebereit'
        it: 'Pronto per l''invio'
        pl: 'Gotowe do wysłania'
        ru: 'Готов к отправке'
        zh: '准备发送'
        hu: 'Küldésre kész'
        pt: 'Pronto para enviar'
      0x01:
        en: 'Wait'
        fr: 'Attendre'
        es: 'Esperar'
        de: 'Warten'
        it: 'Attendere'
        pl: 'Czekaj'
        ru: 'Подождите'
        zh: '等待'
        hu: 'Várakozás'
