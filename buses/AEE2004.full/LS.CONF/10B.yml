    factor: 4
    offset: 0
    min: 0
    max: 1016
    units: '°/s'
    invalid: 0xFF

  STEERING_WHEEL_ROTATION_DIRECTION:
    bits: '4.7'
    alt_names: ['SENS_ROT_VOL']
