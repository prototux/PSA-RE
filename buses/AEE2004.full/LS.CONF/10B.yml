id: 0x10B
name: 'STEERING_WHEEL_ANGLE_LS'
alt_names: ['STEERING_WHEEL_ANGLE', 'IS_DYN_VOL']
type: 'can'
length: 7
periodicity: ['100ms']
senders: ['BSI']
receivers: ['DEF', 'SAM', 'AAS']

signals:
  STEERING_WHEEL_ANGLE:
    bits: '1.7-2.0'
    alt_names: ['ANGLE_VOLANT']
    comment:
