      zh: '方向盘转角'
      hu: 'Kormányszög'
      pt: 'Ângulo do volante'
    type: 'uint'
    factor: 0.1
    offset: 0
    min: -780
    max: 780
    units: '°'
    invalid: 0x7FFF

  STEERING_WHEEL_ROTATION_SPEED:
    bits: '3.7-3.0'
    alt_names: ['VITESSE_ROT_VOL']
