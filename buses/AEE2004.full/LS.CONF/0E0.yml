      es: 'Estado de la ayuda al aparcamiento trasera'
      de: 'Status der hinteren Einparkhilfe'
      it: 'Stato del sensore di parcheggio posteriore'
      pl: 'Stan tylnego czujnika parkowania'
      ru: 'Статус заднего парковочного ассистента'
      zh: '后泊车辅助状态'
      hu: 'Hátsó parkolássegítő állapota'
      pt: 'Estado da ajuda ao estacionamento traseira'
    type: 'uint'

