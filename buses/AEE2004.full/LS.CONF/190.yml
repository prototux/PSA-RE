      de: 'Sonnenlichtmessung Beifahrerseite'
      it: 'Misurazione dell''irraggiamento solare lato passeggero'
      pl: 'Pomiar nasłonecznienia po stronie pasażera'
      ru: 'Измерение солнечного освещения со стороны пассажира'
