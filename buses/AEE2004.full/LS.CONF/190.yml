      de: 'Innenraum-Lufttemperatur'
      it: 'Temperatura dell''aria dell''abitacolo'
      pl: 'Temperatura powietrza w kabinie'
      ru: 'Температура воздуха в салоне'
      zh: '车内空气温度'
      hu: 'Az utastér levegőhőmérséklete'
      pt: 'Temperatura do ar do habitáculo'
    type: 'uint'
    factor: 0.1
    offset: -40
    min: -40
    max: 120
    units: '°C'
    default: 0xFFFF

  CABIN_HUMIDITY:
    bits: '5.7-5.0'
    comment:
      en: 'Cabin humidity'
      fr: 'Humidité de l''habitacle'
      es: 'Humedad del habitáculo'
      de: 'Innenraumfeuchtigkeit'
      it: 'Umidità dell''abitacolo'
      pl: 'Wilgotność kabiny'
      ru: 'Влажность салона'
