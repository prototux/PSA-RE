id: 0x190
name: 'AC_INTERNAL_SENSOR_INFO'
type: 'can'
length: 8
comment:
  en: 'Air conditioning control module data from passenger-compartment sensors: cabin humidity, sunshine sensors, cabin and evaporator temperature.'
  fr: 'Données du module de contrôle climatisation issues de capteurs habitacle : humidité habitacle, capteurs d''ensoleillement, température habitacle et évaporateur.'
  es: 'Datos del módulo de control del climatizador de sensores del habitáculo: humedad del habitáculo, sensores de sol, temperatura del habitáculo y del evaporador.'
  de: 'Daten des Klimasteuermoduls von Innenraumsensoren: Innenraumfeuchtigkeit, Sonnensensoren, Innenraum- und Verdampfertemperatur.'
  it: 'Dati del modulo di controllo del climatizzatore dai sensori dell''abitacolo: umidità dell''abitacolo, sensori di soleggiamento, temperatura dell''abitacolo e dell''evaporatore.'
  pl: 'Dane modułu sterowania klimatyzacją z czujników wnętrza: wilgotność wnętrza, czujniki nasłonecznienia, temperatura wnętrza i parownika.'
  ru: 'Данные модуля управления кондиционером от датчиков салона: влажность салона, датчики солнца, температура салона и испарителя.'
  zh: '空调控制模块车内传感器数据:车内湿度、日照传感器、车内及蒸发器温度。'
  hu: 'A klíma vezérlőmodul utastér-érzékelőktől származó adatai: utastér páratartalma, napsugárzás-érzékelők, utastér és párologtató hőmérséklete.'
  pt: 'Dados do módulo de controlo da climatização provenientes de sensores do habitáculo: humidade do habitáculo, sensores de luminosidade, temperatura do habitáculo e do evaporador.'
observations:
  en: 'On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['200ms']
senders: ['CLIM_AV']
receivers: ['BSI']

signals:
  EVAPORATOR_PROBE_TEMPERATURE:
    bits: '1.7-2.0'
    comment:
      en: 'Evaporator probe temperature'
      fr: 'Température de la sonde évaporateur'
      es: 'Temperatura de la sonda del evaporador'
      de: 'Verdampfersondentemperatur'
      it: 'Temperatura della sonda evaporatore'
      pl: 'Temperatura czujnika parownika'
      ru: 'Температура датчика испарителя'
      zh: '蒸发器探头温度'
      hu: 'Az elpárologtató érzékelő hőmérséklete'
      pt: 'Temperatura da sonda do evaporador'
    type: 'uint'
    factor: 0.1
    offset: -40
    min: -40
    max: 120
    units: '°C'
    invalid: 0xFFFF
    default: 0xFFFF

  CABIN_AIR_TEMPERATURE:
    bits: '3.7-4.0'
    comment:
      en: 'Cabin air temperature'
      fr: 'Température de l''air de l''habitacle'
