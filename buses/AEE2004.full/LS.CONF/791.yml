id: 0x791
name: 'SUSPENSION_SUPERVISION_HS'
type: 'can'
length: 8
comment:
  en: 'Multi-frame reply payload from the USB source (empty reply, list, artist, genre, playlist, file or ID3 tag, depending on the request).'
  fr: 'Charge utile de la réponse multi-trame de la source USB (réponse vide, liste, artiste, genre, playlist, fichier ou tag ID3 selon la demande).'
  es: 'Carga útil de la respuesta multitrama de la fuente USB (respuesta vacía, lista, artista, género, lista de reproducción, archivo o etiqueta ID3, según la solicitud).'
  de: 'Nutzdaten der Mehrfachrahmen-Antwort der USB-Quelle (leere Antwort, Liste, Interpret, Genre, Playlist, Datei oder ID3-Tag, je nach Anforderung).'
  it: 'Payload della risposta multi-trama della sorgente USB (risposta vuota, elenco, artista, genere, playlist, file o tag ID3, a seconda della richiesta).'
  pl: 'Dane odpowiedzi wieloramkowej ze źródła USB (pusta odpowiedź, lista, wykonawca, gatunek, playlista, plik lub tag ID3, zależnie od żądania).'
  ru: 'Полезная нагрузка многокадрового ответа от источника USB (пустой ответ, список, исполнитель, жанр, плейлист, файл или тег ID3, в зависимости от запроса).'
  zh: '来自USB信源的多帧应答有效载荷(根据请求提供空应答、列表、艺术家、流派、播放列表、文件或ID3标签)。'
  hu: 'Az USB forrás többkeretes válaszának hasznos adattartalma (üres válasz, lista, előadó, műfaj, lejátszási lista, fájl vagy ID3-tag, a kéréstől függően).'
  pt: 'Payload de resposta multi-trama da fonte USB (resposta vazia, lista, artista, género, lista de reprodução, ficheiro ou etiqueta ID3, consoante o pedido).'
periodicity: ['100ms']
senders: ['KML']

signals:
  NPCI_HEADER:
    bits: '1.7-1.4'
    comment:
      en: 'NPCI header (per the OSEK-COM segmentation standard)'
      fr: 'En-tête NPCI (selon la norme de segmentation OSEK-COM)'
      es: 'Cabecera NPCI (según la norma de segmentación OSEK-COM)'
      de: 'NPCI-Header (gemäß dem OSEK-COM-Segmentierungsstandard)'
      it: 'Intestazione NPCI (secondo lo standard di segmentazione OSEK-COM)'
      pl: 'Nagłówek NPCI (zgodnie ze standardem segmentacji OSEK-COM)'
      ru: 'Заголовок NPCI (согласно стандарту сегментации OSEK-COM)'
      zh: 'NPCI 报头(依据 OSEK-COM 分段标准)'
      hu: 'NPCI fejléc (az OSEK-COM szegmentálási szabvány szerint)'
      pt: 'Cabeçalho NPCI (segundo a norma de segmentação OSEK-COM)'
    type: 'uint'
