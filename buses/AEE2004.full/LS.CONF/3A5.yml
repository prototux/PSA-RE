        en: 'During search phases, or if playback is not possible'
        fr: 'Pendant les phases de recherche, ou si la lecture est impossible'
        es: 'Durante las fases de búsqueda, o si la reproducción no es posible'
        de: 'Während der Suchphasen oder wenn die Wiedergabe nicht möglich ist'
        it: 'Durante le fasi di ricerca, o se la riproduzione non è possibile'
