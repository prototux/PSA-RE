id: 0x3A5
name: 'RADIO_STATUS_CD_TRACK'
type: 'can'
length: 6
comment:
  en: 'CD player current track status: track number, origin of change, and elapsed/track time (minutes/seconds).'
  fr: 'État de la piste courante du lecteur CD : numéro de piste, origine du changement et temps écoulé/piste (minutes/secondes).'
  es: 'Estado de la pista actual del reproductor de CD: número de pista, origen del cambio y tiempo transcurrido/de pista (minutos/segundos).'
  de: 'Status des aktuellen Titels im CD-Player: Titelnummer, Änderungsursprung und verstrichene Zeit/Titeldauer (Minuten/Sekunden).'
  it: 'Stato della traccia corrente del lettore CD: numero di traccia, origine del cambio e tempo trascorso/di traccia (minuti/secondi).'
  pl: 'Stan bieżącego utworu odtwarzacza CD: numer utworu, źródło zmiany oraz czas, który upłynął/czas utworu (minuty/sekundy).'
  ru: 'Статус текущего трека CD-плеера: номер трека, источник смены и прошедшее время/время трека (минуты/секунды).'
  zh: 'CD播放器当前曲目状态:曲目编号、更改来源及已用/曲目时间(分/秒)。'
  hu: 'A CD-lejátszó aktuális számának állapota: számsorszám, a váltás forrása és az eltelt/szám idő (perc/másodperc).'
  pt: 'Estado da faixa atual do leitor de CD: número de faixa, origem da mudança, e tempo decorrido/da faixa (minutos/segundos).'
periodicity: ['500ms', 'trigger']
senders: ['RAD', 'ICSV']
receivers: ['EMF', 'CMB', 'MATT', 'ICSV']

signals:
  TRACK_NUMBER:
    bits: '1.7-1.0'
    comment:
      en: 'Current track number'
      fr: 'Numéro de la plage en cours de lecture'
      es: 'Número de la pista en reproducción'
      de: 'Nummer des aktuellen Titels'
      it: 'Numero della traccia in riproduzione'
      pl: 'Numer odtwarzanej ścieżki'
      ru: 'Номер текущей дорожки'
      zh: '当前曲目编号'
      hu: 'Az aktuális szám száma'
      pt: 'Número da faixa em reprodução'
    type: 'enum'
    default: 0xFF
    values:
      0xFF:
        en: 'During search phases, or if playback is not possible'
        fr: 'Pendant les phases de recherche, ou si la lecture est impossible'
        es: 'Durante las fases de búsqueda, o si la reproducción no es posible'
        de: 'Während der Suchphasen oder wenn die Wiedergabe nicht möglich ist'
        it: 'Durante le fasi di ricerca, o se la riproduzione non è possibile'
        pl: 'Podczas faz wyszukiwania lub gdy odtwarzanie nie jest możliwe'
        ru: 'Во время фаз поиска или если воспроизведение невозможно'
        zh: '在搜索阶段期间,或播放不可行时'
        hu: 'Keresési fázisok alatt, vagy ha a lejátszás nem lehetséges'
        pt: 'Durante as fases de procura, ou se a reprodução não for possível'

  DURATION_MINUTES:
    bits: '2.7-2.0'
    comment:
      en: 'Total duration of the track, minutes'
      fr: 'Durée totale de la plage, en minutes'
      es: 'Duración total de la pista, en minutos'
      de: 'Gesamtdauer des Titels, in Minuten'
      it: 'Durata totale della traccia, in minuti'
      pl: 'Całkowity czas trwania ścieżki, w minutach'
      ru: 'Общая продолжительность дорожки, в минутах'
      zh: '曲目总时长(分钟)'
      hu: 'A szám teljes időtartama percben'
      pt: 'Duração total da faixa, em minutos'
    type: 'enum'
