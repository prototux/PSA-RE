id: 0x2D7
name: 'CLUSTER_SETTINGS_STATUS'
type: 'can'
length: 5
comment:
  en: 'Instrument cluster settings: sound command, preconditioning time, language and display units (consumption, distance, temperature, volume).'
  fr: 'Réglages du combiné : commande sonore, heure de préconditionnement, langue et unités d''affichage (consommation, distance, température, volume).'
  es: 'Ajustes del cuadro de instrumentos: mando de sonido, hora de preacondicionamiento, idioma y unidades de visualización (consumo, distancia, temperatura, volumen).'
  de: 'Einstellungen des Kombiinstruments: Tonsteuerung, Vorkonditionierungszeit, Sprache und Anzeigeeinheiten (Verbrauch, Distanz, Temperatur, Lautstärke).'
  it: 'Impostazioni del quadro strumenti: comando sonoro, orario di precondizionamento, lingua e unità di visualizzazione (consumo, distanza, temperatura, volume).'
  pl: 'Ustawienia zestawu wskaźników: sterowanie dźwiękiem, godzina klimatyzacji wstępnej, język i jednostki wyświetlania (zużycie, dystans, temperatura, głośność).'
  ru: 'Настройки приборной панели: управление звуком, время предварительного кондиционирования, язык и единицы измерения на дисплее (расход, расстояние, температура, громкость).'
  zh: '仪表组设置:声音指令、预调节时间、语言及显示单位(油耗、距离、温度、音量)。'
  hu: 'A műszeregység beállításai: hangvezérlés, előkondicionálási idő, nyelv és megjelenítési mértékegységek (fogyasztás, távolság, hőmérséklet, hangerő).'
  pt: 'Definições do quadrante de instrumentos: comando sonoro, tempo de pré-condicionamento, idioma e unidades de apresentação (consumo, distância, temperatura, volume).'
observations:
  en: 'On state change of any parameter of the frame. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de cualquier parámetro de la trama. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния любого параметра кадра. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '该帧任意参数状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A keret bármely paraméterének állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['1000ms', 'trigger']
senders: ['CMB', 'MATT']
receivers: ['BTEL', 'BSI', 'EMF', 'MDS']

