id: 0x225
name: 'RADIO_STATUS_TUNER'
type: 'can'
length: 5
comment:
  en: 'Tuner status: bank/preset number, search direction, frequency, PTY list validity/content, manual tuning and search state.'
  fr: 'État du tuner : numéro de banque/préréglage, sens de recherche, fréquence, validité/contenu de la liste PTY, syntonisation manuelle et état de recherche.'
  es: 'Estado del sintonizador: número de banco/preajuste, sentido de búsqueda, frecuencia, validez/contenido de la lista PTY, sintonización manual y estado de búsqueda.'
  de: 'Tuner-Status: Bank-/Presetnummer, Suchrichtung, Frequenz, Gültigkeit/Inhalt der PTY-Liste, manuelle Abstimmung und Suchstatus.'
  it: 'Stato del sintonizzatore: numero di banco/preset, direzione di ricerca, frequenza, validità/contenuto dell''elenco PTY, sintonizzazione manuale e stato di ricerca.'
  pl: 'Stan tunera: numer banku/ustawienia zaprogramowanego, kierunek wyszukiwania, częstotliwość, ważność/zawartość listy PTY, strojenie ręczne i stan wyszukiwania.'
  ru: 'Статус тюнера: номер банка/предустановки, направление поиска, частота, достоверность/содержимое списка PTY, ручная настройка и статус поиска.'
  zh: '调谐器状态:波段/预设编号、搜索方向、频率、PTY列表有效性/内容、手动调谐及搜索状态。'
  hu: 'A tuner állapota: bank/előre beállított szám, keresési irány, frekvencia, PTY-lista érvényessége/tartalma, manuális hangolás és keresési állapot.'
  pt: 'Estado do sintonizador: banco/número de predefinição, sentido de procura, frequência, validade/conteúdo da lista PTY, sintonização manual e estado de procura.'
periodicity: ['500ms', 'trigger']
senders: ['RAD', 'ICSV']
receivers: ['EMF', 'CMB', 'MATT', 'ICSV']

