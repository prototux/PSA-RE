id: 0x227
name: 'PUSH_BUTTON_LED_CONTROL'
type: 'can'
length: 5
comment:
  en: 'Lighting requests for the push button LEDs (parking aid, climate, ESP, parking brake, gear-lock, driving mode, child lock).'
  fr: 'Demandes d''allumage des LED des boutons poussoirs (aide au stationnement, climatisation, ESP, frein de parking, verrouillage boîte, mode de conduite, sécurité enfant).'
  es: 'Solicitudes de encendido de los LED de los botones pulsadores (ayuda al aparcamiento, climatización, ESP, freno de estacionamiento, bloqueo de caja, modo de conducción, seguro para niños).'
  de: 'Beleuchtungsanforderungen für die Taster-LEDs (Einparkhilfe, Klimaanlage, ESP, Feststellbremse, Getriebeverriegelung, Fahrmodus, Kindersicherung).'
  it: 'Richieste di accensione dei LED dei pulsanti (assistenza al parcheggio, climatizzatore, ESP, freno di stazionamento, blocco cambio, modalità di guida, sicurezza bambini).'
  pl: 'Żądania podświetlenia LED przycisków (wspomaganie parkowania, klimatyzacja, ESP, hamulec postojowy, blokada skrzyni biegów, tryb jazdy, blokada dla dzieci).'
  ru: 'Запросы подсветки светодиодов кнопок (парковочный ассистент, кондиционер, ESP, стояночный тормоз, блокировка коробки передач, режим движения, блокировка от детей).'
  zh: '按键LED的点亮请求（泊车辅助、空调、ESP、驻车制动、变速箱锁止、驾驶模式、儿童锁）。'
  hu: 'A nyomógombok LED-jeinek bekapcsolási kérései (parkolássegítő, klíma, ESP, rögzítőfék, váltózár, vezetési mód, gyerekzár).'
  pt: 'Pedidos de iluminação dos LED dos botões (ajuda ao estacionamento, climatização, ESP, travão de estacionamento, bloqueio de caixa, modo de condução, bloqueio para crianças).'
observations:
  en: 'On state change of: PARKING_AID_PUSH_LED_CONTROL, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, ARTIV_PUSH_LED_CONTROL. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : PARKING_AID_PUSH_LED_CONTROL, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, ARTIV_PUSH_LED_CONTROL. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: PARKING_AID_PUSH_LED_CONTROL, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, ARTIV_PUSH_LED_CONTROL. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: PARKING_AID_PUSH_LED_CONTROL, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, ARTIV_PUSH_LED_CONTROL. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: PARKING_AID_PUSH_LED_CONTROL, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, ARTIV_PUSH_LED_CONTROL. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: PARKING_AID_PUSH_LED_CONTROL, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, ARTIV_PUSH_LED_CONTROL. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: PARKING_AID_PUSH_LED_CONTROL, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, ARTIV_PUSH_LED_CONTROL. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当SORTIE_PUSH_AAS, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, SORTIE_PUSH_ARTIV状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z) PARKING_AID_PUSH_LED_CONTROL, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, ARTIV_PUSH_LED_CONTROL állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: PARKING_AID_PUSH_LED_CONTROL, ESP_PUSH_LED_CONTROL, CHILD_LOCK_PUSH_LED_CONTROL, SPORT_AMVAR_PUSH_LED_CONTROL, AUXILIARY_ELECTRIC_BRAKE_PUSH_LED_CONTROL, SIDE_TRAJECTORY_MONITORING_PUSH_LED_CONTROL, REAR_WINDOW_HEATING_PUSH_LED_CONTROL, AC_PUSH_LED_CONTROL, STOP_AND_START_PUSH_LED_CONTROL, RECYCL_AIR_ET_VMF, ARTIV_PUSH_LED_CONTROL. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['CMB', 'VTH', 'BCD']

