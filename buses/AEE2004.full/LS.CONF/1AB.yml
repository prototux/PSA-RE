id: 0x1AB
name: 'SUNROOF3_COMMAND'
type: 'can'
length: 2
comment:
  en: 'Third sunroof commands and vehicle state: panel lighting, power supply and mode, ignition, vehicle speed, movement command, switch inhibition, front door contacts, panic and close-on-lock, wiper state.'
  fr: 'Commandes et état véhicule du troisième toit ouvrant : éclairage du panneau, alimentation et mode, contact, vitesse véhicule, commande de mouvement, inhibition du contacteur, contacts portes avant, anti-pincement et fermeture au verrouillage, état essuie-glace.'
  es: 'Comandos y estado del vehículo del tercer techo solar: iluminación del panel, alimentación y modo, contacto, velocidad del vehículo, comando de movimiento, inhibición del interruptor, contactos de puertas delanteras, antipinzamiento y cierre al bloqueo, estado del limpiaparabrisas.'
  de: 'Befehle und Fahrzeugstatus des dritten Schiebedachs: Paneelbeleuchtung, Versorgung und Modus, Zündung, Fahrzeuggeschwindigkeit, Bewegungsbefehl, Schalterunterdrückung, Vordertürkontakte, Einklemmschutz und Schließen beim Verriegeln, Wischerstatus.'
  it: 'Comandi e stato veicolo del terzo tettuccio apribile: illuminazione pannello, alimentazione e modalità, accensione, velocità veicolo, comando di movimento, inibizione interruttore, contatti porte anteriori, anti-pizzicamento e chiusura al blocco, stato tergicristallo.'
  pl: 'Polecenia i stan pojazdu trzeciego szyberdachu: oświetlenie panelu, zasilanie i tryb, zapłon, prędkość pojazdu, polecenie ruchu, blokada przełącznika, styki drzwi przednich, funkcja przeciwzgnieceniowa i zamykanie przy zamku, stan wycieraczek.'
  ru: 'Команды и состояние автомобиля для третьего люка: подсветка панели, питание и режим, зажигание, скорость автомобиля, команда движения, блокировка выключателя, контакты передних дверей, защита от защемления и закрытие при блокировке, состояние стеклоочистителя.'
  zh: '第三个天窗的命令和车辆状态:面板照明、供电和模式、点火、车速、动作命令、开关抑制、前门触点、防夹和上锁自动关闭、雨刮状态。'
  hu: 'A harmadik tolótető parancsai és a jármű állapota: panelvilágítás, tápellátás és üzemmód, gyújtás, sebesség, mozgásparancs, kapcsoló letiltása, első ajtó érintkezők, becsípődésvédelem és záráskor zárás, ablaktörlő állapota.'
  pt: 'Comandos e estado do veículo do terceiro teto de abrir: iluminação do painel, alimentação e modo, ignição, velocidade do veículo, comando de movimento, inibição dos comutadores, contactos das portas dianteiras, pânico e fecho ao trancar, estado do limpa-para-brisas.'
observations:
  en: 'On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['500ms', 'trigger']
senders: ['BSI']
receivers: ['TO1']

