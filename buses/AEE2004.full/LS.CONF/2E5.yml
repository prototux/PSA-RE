id: 0x2E5
name: 'USB_STREAMING_COMMAND'
type: 'can'
length: 4
comment:
  en: 'USB and audio streaming commands: source selection, transport control, repeat/random mode and seek.'
  fr: 'Commandes USB et de diffusion audio en continu : sélection de source, contrôle de lecture, mode répétition/aléatoire et recherche.'
  es: 'Órdenes de USB y de transmisión de audio en continuo: selección de fuente, control de reproducción, modo repetición/aleatorio y búsqueda.'
  de: 'USB- und Audio-Streaming-Befehle: Quellenauswahl, Wiedergabesteuerung, Wiederholungs-/Zufallsmodus und Suche.'
  it: 'Comandi USB e di streaming audio: selezione della sorgente, controllo di riproduzione, modalità ripetizione/casuale e ricerca.'
  pl: 'Polecenia USB i strumieniowania audio: wybór źródła, sterowanie odtwarzaniem, tryb powtarzania/losowy i wyszukiwanie.'
  ru: 'Команды USB и потоковой передачи аудио: выбор источника, управление воспроизведением, режим повтора/случайного воспроизведения и поиск.'
  zh: 'USB及音频流命令：信源选择、播放控制、重复/随机模式及搜索。'
  hu: 'USB- és audio-streaming-parancsok: forrásválasztás, lejátszásvezérlés, ismétlési/véletlenszerű mód és keresés.'
  pt: 'Comandos USB e de streaming áudio: seleção de fonte, controlo de reprodução, modo repetição/aleatório e procura.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['1000ms', 'trigger']
senders: ['RAD', 'ICSV']
receivers: ['KML']

