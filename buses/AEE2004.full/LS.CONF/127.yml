id: 0x127
name: 'VTH_CONTROL'
alt_names: ['COMMANDE_VTH']
type: 'can'
length: 2
comment:
  en: 'Authorisation and ambient light level for the HUD function, sent on change of state.'
  fr: 'Autorisation et niveau de luminosité ambiante de la fonction HUD, envoyés sur changement d''état.'
  es: 'Autorización y nivel de luz ambiente de la función HUD, enviados en cambio de estado.'
  de: 'Freigabe und Umgebungslichtstärke der HUD-Funktion, gesendet bei Zustandsänderung.'
  it: 'Autorizzazione e livello di luce ambientale della funzione HUD, inviati al cambio di stato.'
  pl: 'Autoryzacja i poziom oświetlenia otoczenia funkcji HUD, wysyłane przy zmianie stanu.'
  ru: 'Разрешение и уровень освещённости функции HUD, отправляемые при изменении состояния.'
  zh: 'VTH功能的授权和环境光水平,在状态变化时发送。'
  hu: 'A HUD funkció engedélyezése és környezeti fényszintje, állapotváltozáskor küldve.'
  pt: 'Autorização e nível de luz ambiente da função HUD, enviados na mudança de estado.'
observations:
  en: 'On state change of: HUD_ENABLED, HUD_SHOWROOM_MODE. On cars built from about 2007 (AEE2004 evolution) this frame carries more data, see AEE2004.ev'
  fr: 'Sur changement d''état de : HUD_ENABLED, HUD_SHOWROOM_MODE. Sur les voitures produites à partir de 2007 environ (évolution AEE2004), cette trame contient plus de données, voir AEE2004.ev'
  es: 'Al cambiar el estado de: HUD_ENABLED, HUD_SHOWROOM_MODE. En los coches fabricados desde aproximadamente 2007 (evolución AEE2004) esta trama lleva más datos, ver AEE2004.ev'
  de: 'Bei Statusänderung von: HUD_ENABLED, HUD_SHOWROOM_MODE. Bei Fahrzeugen ab etwa 2007 (AEE2004-Evolution) enthält diese Botschaft mehr Daten, siehe AEE2004.ev'
  it: 'Al cambiamento di stato di: HUD_ENABLED, HUD_SHOWROOM_MODE. Sulle auto prodotte da circa il 2007 (evoluzione AEE2004) questo frame contiene più dati, vedi AEE2004.ev'
  pl: 'Wysyłane przy zmianie stanu: HUD_ENABLED, HUD_SHOWROOM_MODE. W autach produkowanych od około 2007 (ewolucja AEE2004) ta ramka zawiera więcej danych, patrz AEE2004.ev'
  ru: 'При изменении состояния: HUD_ENABLED, HUD_SHOWROOM_MODE. На автомобилях примерно с 2007 года (эволюция AEE2004) этот кадр содержит больше данных, см. AEE2004.ev'
  zh: '当AUTOR_VTH, SHOWROOM_VTH状态变化时. 在约2007年起生产的车型（AEE2004演进版）上，此帧包含更多数据，见AEE2004.ev'
  hu: 'A(z) HUD_ENABLED, HUD_SHOWROOM_MODE állapotváltozásakor. A kb. 2007-től gyártott autókon (AEE2004 evolúció) ez a keret több adatot tartalmaz, lásd AEE2004.ev'
  pt: 'Na mudança de estado de: HUD_ENABLED, HUD_SHOWROOM_MODE. Nos carros fabricados a partir de cerca de 2007 (evolução AEE2004) esta trama contém mais dados, ver AEE2004.ev'
periodicity: ['100ms', 'trigger']
senders: ['BSI']
receivers: ['VTH']

signals:
  HUD_ENABLED:
    bits: '1.7'
    comment:
      en: 'Head-up display operation enabled'
      fr: 'Autorisation de fonctionnement de l''affichage tête haute'
      es: 'Funcionamiento de la pantalla frontal (HUD) habilitado'
      de: 'Freigabe des Head-up-Displays'
      it: 'Abilitazione del funzionamento del display head-up'
      pl: 'Zezwolenie na działanie wyświetlacza przezierowego HUD'
      ru: 'Разрешение работы проекционного дисплея (HUD)'
      zh: '抬头显示器操作启用'
      hu: 'Head-up kijelző működésének engedélyezése'
      pt: 'Funcionamento do ecrã head-up (HUD) habilitado'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Not allowed'
        fr: 'Non autorisé'
        es: 'No permitido'
        de: 'Nicht erlaubt'
        it: 'Non consentito'
        pl: 'Niedozwolone'
        ru: 'Не разрешено'
        zh: '不允许'
        hu: 'Nem engedélyezett'
        pt: 'Não permitido'
      0x01:
        en: 'Allowed'
        fr: 'Autorisé'
        es: 'Permitido'
        de: 'Erlaubt'
        it: 'Consentito'
        pl: 'Dozwolone'
        ru: 'Разрешено'
        zh: '允许'
        hu: 'Engedélyezve'
        pt: 'Permitido'

  UNUSED_1:
    bits: '1.6'
    unused: true
    alt_names: ['HUD_SHOWROOM_MODE']

  UNUSED_2:
    bits: '1.5-1.0'
    unused: true

  AMBIENT_LIGHT_LEVEL:
    bits: '2.7-2.0'
    comment:
      en: 'Ambient brightness level'
      fr: 'Niveau de luminosité ambiante'
      es: 'Nivel de luminosidad ambiente'
      de: 'Umgebungshelligkeit'
      it: 'Livello di luminosità ambientale'
      pl: 'Poziom jasności otoczenia'
      ru: 'Уровень внешней освещённости'
      zh: '环境亮度等级'
      hu: 'Környezeti fényerőszint'
      pt: 'Nível de luminosidade ambiente'
    type: 'uint'
    factor: 1
    min: 0
    max: 255
    units: 'lux'
    invalid: 0xFF
    default: 0xFF
