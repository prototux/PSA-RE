id: 0x562
name: 'VCU_DRIVE_MODE_CAPABILITIES_4'
type: 'can'
length: 4
comment:
  en: 'Vehicle control unit data: available driving modes (normal, sport, eco, snow...), energy modes (hybrid, zero-emission, fuel) and drive-axle modes (auto, front, rear), plus cooling wake-up requests.'
  fr: 'Données de l''unité de contrôle du véhicule : modes de conduite disponibles (normal, sport, éco, neige...), modes d''énergie (hybride, zéro émission, carburant) et modes d''essieu moteur (auto, avant, arrière), ainsi que les demandes de réveil pour le refroidissement.'
  es: 'Datos de la unidad de control del vehículo: modos de conducción disponibles (normal, deportivo, eco, nieve...), modos de energía (híbrido, cero emisiones, combustible) y modos de eje motriz (automático, delantero, trasero), además de las solicitudes de activación para refrigeración.'
  de: 'Daten der Fahrzeugsteuereinheit: verfügbare Fahrmodi (normal, sport, eco, schnee...), Energiemodi (hybrid, emissionsfrei, Kraftstoff) und Antriebsachsenmodi (auto, vorne, hinten), sowie Kühlungs-Weckanforderungen.'
  it: 'Dati dell''unità di controllo veicolo: modalità di guida disponibili (normale, sport, eco, neve...), modalità energia (ibrida, zero emissioni, carburante) e modalità asse motore (auto, anteriore, posteriore), oltre alle richieste di risveglio per il raffreddamento.'
  pl: 'Dane jednostki sterującej pojazdem: dostępne tryby jazdy (normalny, sportowy, eco, śnieg...), tryby energii (hybrydowy, zero emisji, paliwo) i tryby osi napędowej (auto, przednia, tylna), a także żądania wybudzenia do chłodzenia.'
  ru: 'Данные блока управления автомобилем: доступные режимы движения (обычный, спорт, эко, снег...), энергетические режимы (гибрид, нулевые выбросы, топливо) и режимы ведущего моста (авто, передний, задний), а также запросы пробуждения для охлаждения.'
  zh: '车辆控制单元数据:可用驾驶模式(普通、运动、经济、雪地……)、能量模式(混动、零排放、燃油)和驱动桥模式(自动、前、后),以及冷却唤醒请求。'
  hu: 'A jármű vezérlőegység adatai: elérhető vezetési módok (normál, sport, eco, hó...), energiamódok (hibrid, nulla emissziós, üzemanyag) és hajtott tengely módok (automata, első, hátsó), valamint hűtési ébresztési kérések.'
  pt: 'Dados da unidade de controlo do veículo: modos de condução disponíveis (normal, desportivo, eco, neve...), modos de energia (híbrido, emissões zero, combustível) e modos de eixo motor (automático, dianteiro, traseiro), além de pedidos de ativação do arrefecimento.'
observations:
  en: 'On state change of: CHARGING_PLUG_STATE'
  fr: 'Sur changement d''état de : CHARGING_PLUG_STATE'
  es: 'Al cambiar el estado de: CHARGING_PLUG_STATE'
  de: 'Bei Statusänderung von: CHARGING_PLUG_STATE'
  it: 'Al cambiamento di stato di: CHARGING_PLUG_STATE'
  pl: 'Wysyłane przy zmianie stanu: CHARGING_PLUG_STATE'
  ru: 'При изменении состояния: CHARGING_PLUG_STATE'
  zh: '当OBC_PLUG_STATE, OBC_PLUG_VOLT_DIRECTION状态变化时'
  hu: 'A(z) CHARGING_PLUG_STATE állapotváltozásakor'
  pt: 'Na mudança de estado de: CHARGING_PLUG_STATE'
periodicity: ['100ms', 'trigger']
senders: ['VCU', 'E_VCU']
receivers: ['BSI', 'LVNSD']

signals:
  HV_BATTERY_COOLANT_FLOW_RATE:
    bits: '1.7-1.1'
    comment:
      en: 'HV battery coolant flow rate'
      fr: 'Débit d''eau de refroidissement de la batterie haute tension'
      es: 'Caudal de refrigerante de la batería de alta tensión'
      de: 'Kühlmitteldurchflussrate der Hochvoltbatterie'
      it: 'Portata del liquido di raffreddamento della batteria ad alta tensione'
      pl: 'Natężenie przepływu chłodziwa akumulatora wysokiego napięcia'
      ru: 'Расход охлаждающей жидкости высоковольтной батареи'
      zh: '高压电池冷却液流量'
      hu: 'A nagyfeszültségű akkumulátor hűtőfolyadék-áramlási sebessége'
      pt: 'Caudal do líquido de refrigeração da bateria de alta tensão'
    type: 'uint'
    factor: 1
    min: 0
    max: 100
    units: '%'
    invalid: 0x7F
    default: 0x00

