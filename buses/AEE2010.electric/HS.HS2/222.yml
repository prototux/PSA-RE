        zh: '停用请求'
        hu: 'Kikapcsolási kérés'
        pt: 'Pedido de desativação'

  BRAKE_MODE_CONFIGURATION:
    bits: '5.5'
    comment:
      en: 'Brake mode configuration'
      fr: 'Configuration du mode frein'
