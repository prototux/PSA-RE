    comment:
      en: 'Powertrain start authorization status'
      fr: 'Etat de l''autorisation de démarrage du groupe motopropulseur'
      es: 'Estado de la autorización de arranque del grupo motopropulsor'
      de: 'Status der Startfreigabe des Antriebsstrangs'
      it: 'Stato dell''autorizzazione all''avviamento del gruppo propulsore'
