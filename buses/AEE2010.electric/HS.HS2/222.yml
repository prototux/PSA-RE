      pt: 'Estado de funcionamento da cadeia cinemática híbrida'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'Powertrain inactive'
        fr: 'Groupe motopropulseur inactif'
        es: 'Grupo motopropulsor inactivo'
        de: 'Antriebsstrang inaktiv'
        it: 'Gruppo propulsore inattivo'
        pl: 'Zespół napędowy nieaktywny'
        ru: 'Силовой агрегат неактивен'
        zh: '动力总成未激活'
        hu: 'Erőátviteli rendszer inaktív'
        pt: 'Grupo motopropulsor inativo'
      0x01:
        unused: true
      0x02:
        unused: true
      0x03:
        unused: true
      0x04:
        en: 'Powertrain activation'
        fr: 'Activation du groupe motopropulseur'
        es: 'Activación del grupo motopropulsor'
        de: 'Aktivierung des Antriebsstrangs'
        it: 'Attivazione del gruppo propulsore'
        pl: 'Aktywacja układu napędowego'
        ru: 'Активация силового агрегата'
        zh: '动力总成激活'
        hu: 'Hajtáslánc aktiválása'
        pt: 'Ativação do grupo motopropulsor'
      0x05:
        unused: true
      0x06:
        unused: true
      0x07:
        unused: true
      0x08:
        en: 'Powertrain active'
        fr: 'Groupe motopropulseur actif'
        es: 'Grupo motopropulsor activo'
        de: 'Antriebsstrang aktiv'
        it: 'Gruppo propulsore attivo'
        pl: 'Zespół napędowy aktywny'
        ru: 'Силовой агрегат активен'
        zh: '动力总成激活'
        hu: 'Hajtáslánc aktív'
        pt: 'Grupo motopropulsor ativo'
      0x09:
        unused: true
      0x0A:
        en: 'Powertrain deactivation'
        fr: 'désactivation_GMP'
        es: 'Desactivación del GMP'
        de: 'Deaktivierung des Antriebsstrangs'
        it: 'Disattivazione del GMP'
        pl: 'Dezaktywacja układu napędowego'
        ru: 'Деактивация силового агрегата'
        zh: '动力总成停用'
        hu: 'Hajtáslánc kikapcsolása'
        pt: 'Desativação do GMP'
      0x0B:
        unused: true
      0x0C:
        en: 'Powertrain held after deactivation'
        fr: 'Maintien du groupe motopropulseur après désactivation'
        es: 'Retención del grupo motopropulsor tras la desactivación'
        de: 'Antriebsstrang gehalten nach Deaktivierung'
        it: 'Gruppo propulsore mantenuto dopo la disattivazione'
        pl: 'Podtrzymanie układu napędowego po dezaktywacji'
        ru: 'Удержание силового агрегата после деактивации'
        zh: '动力总成停用后保持'
        hu: 'Hajtáslánc tartva kikapcsolás után'
        pt: 'Manutenção do grupo motopropulsor após desativação'
      0x0D:
        unused: true
      0x0E:
        en: 'Powertrain at rest'
        fr: 'Groupe motopropulseur au repos'
        es: 'Grupo motopropulsor en reposo'
        de: 'Antriebsstrang im Ruhezustand'
        it: 'Gruppo propulsore a riposo'
        pl: 'Zespół napędowy w spoczynku'
        ru: 'Силовой агрегат в состоянии покоя'
        zh: '动力总成静止'
        hu: 'Hajtáslánc nyugalmi állapotban'
        pt: 'Grupo motopropulsor em repouso'
      0x0F:
        unused: true

  DRIVER_TORQUE_DEMAND_REDUCED_RANGE:
    bits: '4.7-5.7'
    comment:
      en: 'Driver torque demand information (reduced value range)'
      fr: 'Information de volonté du conducteur (plage de valeurs réduite)'
      es: 'Información de la demanda de par del conductor (rango de valores reducido)'
      de: 'Information zum Fahrerwunsch-Drehmoment (reduzierter Wertebereich)'
      it: 'Informazione sulla richiesta di coppia del conducente (intervallo di valori ridotto)'
      pl: 'Informacja o żądaniu momentu obrotowego przez kierowcę (zawężony zakres wartości)'
      ru: 'Информация о запрошенном водителем моменте (суженный диапазон значений)'
      zh: '驾驶员扭矩需求信息(缩减取值范围)'
