id: 0x571
name: 'AVAS_STATUS'
type: 'can'
length: 1
comment:
  en: 'Acoustic Vehicle Alerting System (AVAS) diagnostics, availability and status.'
  fr: 'Diagnostic, disponibilité et état du système d''avertissement sonore du véhicule (AVAS).'
  es: 'Diagnóstico, disponibilidad y estado del sistema de aviso acústico del vehículo (AVAS).'
  de: 'Diagnose, Verfügbarkeit und Status des akustischen Fahrzeugwarnsystems (AVAS).'
  it: 'Diagnosi, disponibilità e stato del sistema di avviso acustico del veicolo (AVAS).'
  pl: 'Diagnostyka, dostępność i stan akustycznego systemu ostrzegawczego pojazdu (AVAS).'
  ru: 'Диагностика, доступность и состояние акустической системы предупреждения (AVAS).'
  zh: '车辆声学警示系统（AVAS）的诊断、可用性和状态。'
  hu: 'A jármű akusztikus figyelmeztető rendszerének (AVAS) diagnosztikája, elérhetősége és állapota.'
  pt: 'Diagnóstico, disponibilidade e estado do sistema de aviso sonoro do veículo (AVAS).'
observations:
  en: 'On state change of: AVAS_DIAGNOSTIC_STATUS, AVAS_INHIBITED_STATUS'
  fr: 'Sur changement d''état de : AVAS_DIAGNOSTIC_STATUS, AVAS_INHIBITED_STATUS'
  es: 'Al cambiar el estado de: AVAS_DIAGNOSTIC_STATUS, AVAS_INHIBITED_STATUS'
  de: 'Bei Statusänderung von: AVAS_DIAGNOSTIC_STATUS, AVAS_INHIBITED_STATUS'
  it: 'Al cambiamento di stato di: AVAS_DIAGNOSTIC_STATUS, AVAS_INHIBITED_STATUS'
  pl: 'Wysyłane przy zmianie stanu: AVAS_DIAGNOSTIC_STATUS, AVAS_INHIBITED_STATUS'
  ru: 'При изменении состояния: AVAS_DIAGNOSTIC_STATUS, AVAS_INHIBITED_STATUS'
  zh: '当DIAG_AVERT_SON_VEH_SIL, ETAT_AVERT_SON_VEH_SIL状态变化时'
  hu: 'A(z) AVAS_DIAGNOSTIC_STATUS, AVAS_INHIBITED_STATUS állapotváltozásakor'
  pt: 'Na mudança de estado de: AVAS_DIAGNOSTIC_STATUS, AVAS_INHIBITED_STATUS'
periodicity: ['100ms', 'trigger']
senders: ['AVAS']
receivers: ['BSI']

signals:
  AVAS_INHIBITED_STATUS:
    bits: '1.7'
    comment:
      en: 'Acoustic Vehicle Alerting System (AVAS) inhibited state'
      fr: 'État d''inhibition de l''avertisseur sonore de véhicule silencieux (AVAS)'
      es: 'Estado de inhibición del sistema de alerta acústica del vehículo (AVAS)'
      de: 'Deaktivierungszustand des akustischen Fahrzeugwarnsystems (AVAS)'
      it: 'Stato di inibizione del sistema di avviso acustico del veicolo (AVAS)'
      pl: 'Stan wyłączenia systemu dźwiękowego ostrzegania pojazdu (AVAS)'
      ru: 'Состояние отключения системы звукового оповещения пешеходов (AVAS)'
      zh: 'AVAS系统抑制状态'
      hu: 'Az AVAS hangjelző rendszer letiltási állapota'
      pt: 'Estado de inibição do sistema de aviso acústico de veículo silencioso (AVAS)'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'Not inhibited'
        fr: 'Non inhibé'
        es: 'No inhibido'
        de: 'Nicht deaktiviert'
        it: 'Non inibito'
        pl: 'Nie wyłączone'
        ru: 'Не отключено'
        zh: '未抑制'
        hu: 'Nincs letiltva'
        pt: 'Não inibido'
      0x01:
        en: 'Inhibited'
        fr: 'Inhibé'
        es: 'Inhibido'
        de: 'Gesperrt'
        it: 'Inibito'
        pl: 'Zablokowany'
        ru: 'Заблокировано'
        zh: '已抑制'
        hu: 'Letiltva'
        pt: 'Inibido'

