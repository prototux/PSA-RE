id: 0x5D1
name: 'AVAS_SUPERVISION'
type: 'can'
length: 8
comment:
  en: 'Network supervision: transmission quality counters and fault presence of the sending ECU'
  fr: 'Supervision réseau : compteurs de qualité de transmission et présence de défaut du calculateur émetteur'
  es: 'Supervisión de red: contadores de calidad de transmisión y presencia de fallos de la centralita emisora'
  de: 'Netzwerküberwachung: Übertragungsqualitätszähler und Fehlerstatus des sendenden Steuergeräts'
  it: 'Supervisione rete: contatori di qualità di trasmissione e presenza di guasti della centralina mittente'
  pl: 'Nadzór sieci: liczniki jakości transmisji i obecność usterki sterownika nadawcy'
  ru: 'Супервизия сети: счётчики качества передачи и наличие неисправности передающего блока'
  zh: '网络监控:传输质量计数器及发送方ECU的故障状态'
  hu: 'Hálózatfelügyelet: átviteli minőség számlálók és az adó vezérlőegység hibaállapota'
  pt: 'Supervisão de rede: contadores de qualidade de transmissão e presença de avaria da ECU emissora.'
observations:
  en: 'On state change of any parameter of the frame'
  fr: 'Sur changement d''état de n''importe quel paramètre de la trame'
  es: 'Al cambiar el estado de cualquier parámetro de la trama'
  de: 'Bei Statusänderung eines beliebigen Parameters des Frames'
  it: 'Al cambiamento di stato di qualsiasi parametro del frame'
  pl: 'Wysyłane przy zmianie stanu dowolnego parametru ramki'
  ru: 'При изменении состояния любого параметра кадра'
  zh: '该帧任意参数状态变化时'
  hu: 'A keret bármely paraméterének állapotváltozásakor'
  pt: 'Na mudança de estado de qualquer parâmetro da trama.'
periodicity: ['1000ms', 'trigger']
senders: ['AVAS']

signals:
  DIAGNOSTIC_MEMORY_STATE:
    bits: '1.7-1.0'
    comment:
      en: 'State of the system''s diagnostic memory.'
      fr: 'État de la mémoire diagnostic du système.'
      es: 'Estado de la memoria de diagnóstico del sistema.'
      de: 'Status des Diagnosespeichers des Systems.'
      it: 'Stato della memoria diagnostica del sistema.'
      pl: 'Stan pamięci diagnostycznej systemu.'
      ru: 'Состояние диагностической памяти системы.'
      zh: '系统诊断存储器状态。'
      hu: 'A rendszer diagnosztikai memóriájának állapota.'
      pt: 'Estado da memória de diagnóstico do sistema'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'No fault present'
        fr: 'Aucun défaut présent'
        es: 'Ningún fallo presente'
        de: 'Kein Fehler vorhanden'
        it: 'Nessun guasto presente'
        pl: 'Brak aktualnej usterki'
        ru: 'Неисправностей нет'
        zh: '无当前故障'
        hu: 'Nincs jelen lévő hiba'
        pt: 'Sem avaria presente'
      0x01:
        en: 'One or more faults present; each bit gives a fault code'
        fr: 'Un ou plusieurs défauts présents ; chaque bit donne un code défaut'
        es: 'Uno o varios fallos presentes; cada bit indica un código de fallo'
        de: 'Ein oder mehrere Fehler vorhanden; jedes Bit ergibt einen Fehlercode'
        it: 'Uno o più guasti presenti; ogni bit fornisce un codice di guasto'
        pl: 'Występuje jedna lub więcej usterek; każdy bit oznacza kod usterki'
        ru: 'Присутствует одна или несколько неисправностей; каждый бит соответствует коду неисправности'
        zh: '存在一个或多个故障;每个比特位对应一个故障代码'
        hu: 'Egy vagy több hiba van jelen; minden bit egy hibakódot ad'
        pt: 'Uma ou mais falhas presentes; cada bit indica um código de falha'

  ECU_CONFIRMED_ABSENT_STATUS:
    bits: '2.7-5.0'
    comment:
      en: '"Confirmed absent" status flags of the supervised ECUs: 0 if present, 1 if confirmed absent (0 by default for unsupervised ECUs).'
      fr: 'Indicateurs de statut "confirmé absent" des calculateurs supervisés : 0 si présent, 1 si confirmé absent (0 par défaut si non supervisé).'
      es: 'Indicadores de estado "confirmado ausente" de las unidades de control supervisadas: 0 si está presente, 1 si está confirmado ausente (0 por defecto si no se supervisa).'
      de: 'Statusflags "bestätigt fehlend" der überwachten Steuergeräte: 0 wenn vorhanden, 1 wenn bestätigt fehlend (Standard 0, wenn nicht überwacht).'
      it: 'Flag di stato "confermato assente" delle centraline supervisionate: 0 se presente, 1 se confermato assente (0 di default se non supervisionata).'
      pl: 'Flagi statusu "potwierdzona nieobecność" nadzorowanych sterowników: 0 jeśli obecny, 1 jeśli potwierdzona nieobecność (domyślnie 0, jeśli nienadzorowany).'
      ru: 'Флаги статуса "подтверждено отсутствие" контролируемых блоков управления: 0, если присутствует, 1, если подтверждено отсутствие (по умолчанию 0, если не контролируется).'
      zh: '受监控控制单元的"确认缺失"状态标志：存在为0，确认缺失为1（未监控时默认为0）。'
      hu: 'A felügyelt vezérlőegységek "megerősítve hiányzik" állapotjelzői: 0, ha jelen van, 1, ha megerősítve hiányzik (alapértelmezetten 0, ha nem felügyelt).'
      pt: 'Indicadores de estado "confirmado ausente" das unidades de controlo supervisionadas: 0 se presente, 1 se confirmado ausente (0 por defeito se não supervisionada)'
    type: 'uint'
    default: 0x00

  ECU_ELECTRICAL_STATE_APC:
    bits: '6.7-6.5'
    comment:
      en: 'ECU electrical state for an APC-type wake-up.'
      fr: 'État électrique de l''UCE pour un réveil de type APC.'
      es: 'Estado eléctrico de la unidad de control para una activación de tipo APC.'
      de: 'Elektrischer Zustand des Steuergeräts bei einem Wecken vom Typ APC.'
      it: 'Stato elettrico della centralina per un risveglio di tipo APC.'
      pl: 'Stan elektryczny sterownika dla wybudzenia typu APC.'
      ru: 'Электрическое состояние блока управления при пробуждении типа APC.'
      zh: 'APC类型唤醒时控制单元的电气状态。'
      hu: 'A vezérlőegység elektromos állapota APC típusú ébresztésnél.'
      pt: 'Estado elétrico da unidade de controlo para uma ativação do tipo APC.'
    type: 'enum'
    default: 0x03
    values:
      0x00:
        unused: true
      0x01:
        en: 'Internal wake-up (transmitted only in special cases)'
        fr: 'Réveil interne (transmis seulement dans des cas particuliers)'
        es: 'Activación interna (transmitida solo en casos particulares)'
        de: 'Interne Aufwachanforderung (nur in Sonderfällen übertragen)'
        it: 'Riattivazione interna (trasmessa solo in casi particolari)'
        pl: 'Wewnętrzne wybudzenie (przesyłane tylko w szczególnych przypadkach)'
        ru: 'Внутреннее пробуждение (передаётся только в особых случаях)'
        zh: '内部唤醒（仅在特殊情况下发送）'
        hu: 'Belső ébresztés (csak különleges esetekben továbbítva)'
        pt: 'Despertar interno (transmitido apenas em casos especiais)'
      0x02:
        en: 'Comlatch'
        fr: 'Comlatch'
        es: 'Comlatch'
        de: 'Comlatch'
        it: 'Comlatch'
        pl: 'Comlatch'
        ru: 'Comlatch'
        zh: 'Comlatch'
        hu: 'Comlatch'
        pt: 'Comlatch'
      0x03:
        en: 'Main wake-up'
        fr: 'Réveil principal'
        es: 'Activación principal'
        de: 'Hauptaufwachen'
        it: 'Risveglio principale'
        pl: 'Główne wybudzenie'
        ru: 'Основное пробуждение'
        zh: '主唤醒'
        hu: 'Fő ébresztés'
        pt: 'Ativação principal'
      0x04:
        unused: true
      0x05:
        en: 'Sleep preparation (transmitted only in special cases)'
        fr: 'Préparation à l''endormissement (transmission seulement dans des cas particuliers)'
        es: 'Preparación para el modo reposo (transmisión solo en casos especiales)'
        de: 'Vorbereitung auf den Ruhezustand (Übertragung nur in Sonderfällen)'
        it: 'Preparazione alla sospensione (trasmissione solo in casi particolari)'
        pl: 'Przygotowanie do uśpienia (transmisja tylko w szczególnych przypadkach)'
        ru: 'Подготовка к переходу в спящий режим (передаётся только в особых случаях)'
        zh: '休眠准备(仅在特殊情况下发送)'
        hu: 'Alvó módra való felkészülés (csak különleges esetekben továbbítva)'
        pt: 'Preparação para o adormecimento (transmissão apenas em casos especiais)'
      0x06:
        unused: true
      0x07:
        unused: true

  UNUSED_1:
    bits: '6.4'
    unused: true

