id: 0x4C2
name: 'EV_CHARGE_STATUS_2'
type: 'can'
length: 4
comment:
  en: 'Electric vehicle charge status: charging station stop-charge request and charge-in-progress mode.'
  fr: 'État de charge du véhicule électrique : demande d''arrêt de charge de la borne et mode charge en cours.'
  es: 'Estado de carga del vehículo eléctrico: solicitud de parada de carga del punto de carga y modo de carga en curso.'
  de: 'Ladestatus des Elektrofahrzeugs: Ladestopp-Anforderung der Ladestation und Modus „Ladevorgang läuft“.'
  it: 'Stato di ricarica del veicolo elettrico: richiesta di arresto ricarica dalla colonnina e modalità ricarica in corso.'
  pl: 'Stan ładowania pojazdu elektrycznego: żądanie zatrzymania ładowania ze stacji ładowania i tryb trwającego ładowania.'
  ru: 'Статус зарядки электромобиля: запрос остановки зарядки от зарядной станции и режим выполняющейся зарядки.'
  zh: '电动车充电状态:充电桩停止充电请求和充电进行中模式。'
  hu: 'Az elektromos jármű töltési állapota: a töltőállomás töltésleállítási kérése és a folyamatban lévő töltés módja.'
  pt: 'Estado de carga do veículo elétrico: pedido de paragem de carga do posto de carregamento e modo de carregamento em curso.'
periodicity: ['50ms']
senders: ['E_VCU']
receivers: ['BSI']

signals:
  ZEV_RANGE_DISPLAY:
    bits: '1.7-2.7'
    comment:
      en: 'Zero-emission (ZEV) driving range to display (km)'
      fr: 'Autonomie en mode tout électrique (ZEV) à afficher (km)'
      es: 'Autonomía en modo totalmente eléctrico (ZEV) a mostrar (km)'
      de: 'Anzuzeigende Reichweite im Nullemissionsmodus (ZEV) (km)'
      it: 'Autonomia in modalità a zero emissioni (ZEV) da visualizzare (km)'
      pl: 'Zasięg w trybie bezemisyjnym (ZEV) do wyświetlenia (km)'
      ru: 'Отображаемый запас хода в электрическом (ZEV) режиме (км)'
      zh: '待显示的纯电动(ZEV)续航里程(km)'
      hu: 'A megjelenítendő ZEV (tisztán elektromos) hatótávolság (km)'
      pt: 'Autonomia em modo totalmente elétrico (ZEV) a mostrar (km)'
    type: 'uint'
    factor: 2
    min: 0
    max: 1000
    units: 'km'
    invalid: 0x1FF

  COOLING_PARTIAL_WAKEUP:
    bits: '2.6'
    comment:
      en: 'Partial network wake-up used for cooling needs'
      fr: 'Réveil partiel du réseau utilisé pour les besoins de refroidissement'
      es: 'Activación parcial de la red utilizada para las necesidades de refrigeración'
      de: 'Teilweises Netzwerk-Aufwachen für den Kühlungsbedarf'
      it: 'Risveglio parziale della rete utilizzato per le esigenze di raffreddamento'
      pl: 'Częściowe wybudzenie sieci wykorzystywane na potrzeby chłodzenia'
      ru: 'Частичное пробуждение сети, используемое для нужд охлаждения'
      zh: '用于冷却需求的部分网络唤醒'
      hu: 'A hűtési igényekhez használt részleges hálózati ébresztés'
      pt: 'Ativação parcial da rede utilizada para as necessidades de refrigeração'
    type: 'bool'
    values:
      0x00:
        en: 'No wakeup'
        fr: 'Pas de réveil'
        es: 'Sin activación'
        de: 'Kein Aufwecken'
        it: 'Nessun risveglio'
        pl: 'Brak wybudzenia'
        ru: 'Нет пробуждения'
        zh: '无唤醒'
        hu: 'Nincs ébresztés'
        pt: 'Sem ativação'
      0x01:
        en: 'Clock'
        fr: 'Réveil'
        es: 'Reloj despertador'
        de: 'Wecker'
        it: 'Sveglia'
        pl: 'Budzik'
        ru: 'Будильник'
        zh: '闹钟'
        hu: 'Ébresztőóra'
        pt: 'Relógio'

  LV_PTC_HEATER_CUTOFF_REQUEST:
    bits: '2.5'
