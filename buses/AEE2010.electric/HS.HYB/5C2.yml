        fr: 'Déverrouillé'
        es: 'Desbloqueado'
        de: 'Entriegelt'
        it: 'Sbloccato'
        pl: 'Odblokowane'
        ru: 'Разблокировано'
        zh: '已解锁'
        hu: 'Kioldva'
        pt: 'Desbloqueado'
      0x01:
        en: 'Locked'
        fr: 'Verrouillé'
        es: 'Bloqueado'
        de: 'Verriegelt'
        it: 'Bloccato'
        pl: 'Zablokowane'
        ru: 'Заблокировано'
        zh: '已锁定'
        hu: 'Zárolva'
        pt: 'Bloqueado'
      0x02:
        en: 'Super-locked'
        fr: 'Super verrouillé'
        es: 'Super bloqueado'
