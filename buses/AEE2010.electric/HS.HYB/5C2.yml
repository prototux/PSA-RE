    comment:
      en: 'Electricity meter saturation'
      fr: 'Saturation des compteurs d''électricité'
      es: 'Saturación de los contadores de electricidad'
      de: 'Sättigung der Stromzähler'
      it: 'Saturazione dei contatori elettrici'
      pl: 'Nasycenie liczników energii elektrycznej'
      ru: 'Насыщение счётчиков электроэнергии'
