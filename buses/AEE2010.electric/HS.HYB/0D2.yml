id: 0x0D2
name: 'IMMO_RESPONSE_HCU1'
type: 'can'
length: 5
comment:
  en: 'Immobiliser key response sent by the body computer (BSI) to the electric drive unit (ERAD), part of the challenge/response authentication exchange.'
  fr: 'Réponse de clé d''antidémarrage envoyée par le BSI au groupe motopropulseur électrique (ERAD), dans le cadre de l''échange d''authentification défi/réponse.'
  es: 'Respuesta de clave del inmovilizador enviada por la BSI a la unidad de tracción eléctrica (ERAD), parte del intercambio de autenticación de desafío/respuesta.'
  de: 'Wegfahrsperren-Schlüsselantwort vom BSI an die elektrische Antriebseinheit (ERAD), Teil des Challenge-Response-Authentifizierungsaustauschs.'
  it: 'Risposta chiave dell''immobilizer inviata dal BSI all''unità di trazione elettrica (ERAD), parte dello scambio di autenticazione challenge/response.'
  pl: 'Odpowiedź kluczowa immobilisera wysyłana przez BSI do elektrycznego zespołu napędowego (ERAD), część wymiany uwierzytelniania challenge/response.'
  ru: 'Ответ ключа иммобилайзера, отправляемый BSI электроприводу (ERAD), часть обмена аутентификацией challenge/response.'
  zh: '车身控制器(BSI)发送给电驱动单元(ERAD)的防盗锁止密钥响应,属于挑战/响应认证交换的一部分。'
  hu: 'A BSI által az elektromos hajtásegységnek (ERAD) küldött indításgátló-kulcsválasz, a challenge/response hitelesítési csere része.'
  pt: 'Resposta de chave do imobilizador enviada pela BSI à unidade de tração elétrica (ERAD), parte da troca de autenticação desafio/resposta.'
observations:
  en: 'Reception of an unlock request from ERAD'
  fr: 'Réception d''une demande de déverrouillage du ERAD'
  es: 'Recepción de una solicitud de desbloqueo del ERAD'
  de: 'Empfang einer Entriegelungsanforderung von ERAD'
  it: 'Ricezione di una richiesta di sblocco da ERAD'
  pl: 'Odebranie żądania odblokowania od ERAD'
  ru: 'Получение запроса на разблокировку от ERAD'
  zh: '接收到来自ERAD的解锁请求'
  hu: 'Zárnyitási kérés fogadása a(z) ERAD részéről'
  pt: 'Receção de um pedido de destrancagem da ERAD'
periodicity: ['trigger']
senders: ['VCU']
receivers: ['ERAD']

