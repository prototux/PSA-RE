id: 0x502
name: 'HDC_SUPERVISION'
type: 'can'
length: 6
comment:
  en: 'VCU OBD fault status and in-use performance ratio (IUPR) counters'
  fr: 'État des défauts OBD du VCU et compteurs de ratio de performance en service (IUPR)'
  es: 'Estado de fallos OBD del VCU y contadores de ratio de rendimiento en uso (IUPR)'
  de: 'OBD-Fehlerstatus des VCU und In-Use-Performance-Ratio-Zähler (IUPR)'
  it: 'Stato dei guasti OBD del VCU e contatori del rapporto di prestazione in uso (IUPR)'
  pl: 'Stan usterek OBD sterownika VCU oraz liczniki współczynnika wykorzystania (IUPR)'
  ru: 'Состояние неисправностей OBD блока VCU и счётчики коэффициента эксплуатационной готовности (IUPR)'
  zh: 'VCU OBD故障状态及使用中性能比率(IUPR)计数器'
  hu: 'A VCU OBD hibaállapota és a használati teljesítményarány (IUPR) számlálói'
  pt: 'Estado de avaria OBD da VCU e contadores da relação de desempenho em uso (IUPR).'
periodicity: ['100ms']
senders: ['VCU']
receivers: ['OBC']

signals:
  VCU_OBD_FAULT_STATUS_1:
    bits: '1.7-1.6'
    comment:
      en: 'OBD fault status of the VCU, combining the diagnostic result and fault presence.'
      fr: 'État du défaut OBD du VCU, combinant le résultat du diagnostic et la présence du défaut.'
      es: 'Estado del fallo OBD del VCU, que combina el resultado del diagnóstico y la presencia del fallo.'
      de: 'OBD-Fehlerstatus des VCU, kombiniert aus Diagnoseergebnis und Fehlervorhandensein.'
      it: 'Stato del guasto OBD del VCU, che combina il risultato della diagnosi e la presenza del guasto.'
      pl: 'Stan usterki OBD sterownika VCU, łączący wynik diagnostyki i obecność usterki.'
      ru: 'Статус неисправности OBD блока VCU, объединяющий результат диагностики и наличие неисправности.'
      zh: 'VCU的OBD故障状态，综合了诊断结果与故障存在情况。'
      hu: 'A VCU OBD hibaállapota, a diagnosztikai eredmény és a hiba jelenlétének kombinációja.'
      pt: 'Estado da falha OBD do VCU, combinando o resultado do diagnóstico e a presença da falha'
    type: 'enum'
    default: 0x00
    values:
      0x00:
        en: 'Diagnostic not concluded'
        fr: 'Diagnostic non statué'
        es: 'Diagnóstico no concluido'
        de: 'Diagnose nicht abgeschlossen'
        it: 'Diagnosi non conclusa'
        pl: 'Diagnostyka niezakończona'
        ru: 'Диагностика не завершена'
        zh: '诊断未完成'
        hu: 'A diagnosztika nem zárult le'
        pt: 'Diagnóstico não concluído'
      0x01:
        en: 'Diagnosis completed, no fault'
        fr: 'Diagnostic statué, absence de défaut'
        es: 'Diagnóstico realizado, sin fallo'
        de: 'Diagnose abgeschlossen, kein Fehler'
        it: 'Diagnosi conclusa, nessun guasto'
        pl: 'Diagnostyka zakończona, brak usterki'
        ru: 'Диагностика завершена, неисправностей нет'
        zh: '诊断完成,无故障'
        hu: 'Diagnosztika lezárva, nincs hiba'
        pt: 'Diagnóstico concluído, sem avaria'
      0x02:
        en: 'Diagnostic ruled fault'
        fr: 'Diagnostic ayant statué un défaut'
        es: 'Diagnóstico que dictaminó un fallo'
        de: 'Diagnose mit festgestelltem Fehler'
        it: 'Diagnosi che ha rilevato un guasto'
        pl: 'Diagnostyka stwierdzająca usterkę'
        ru: 'Диагностика зафиксировала неисправность'
        zh: '诊断判定为故障'
        hu: 'A diagnosztika hibát állapított meg'
        pt: 'Diagnóstico que apurou uma falha'
      0x03:
        en: 'Diagnosis not concluded, IUPR denominator frozen'
        fr: 'Diagnostic non statué, dénominateur IUPR figé'
        es: 'Diagnóstico no concluido, denominador IUPR congelado'
        de: 'Diagnose nicht abgeschlossen, IUPR-Nenner eingefroren'
        it: 'Diagnosi non conclusa, denominatore IUPR congelato'
        pl: 'Diagnostyka nierozstrzygnięta, mianownik IUPR zamrożony'
        ru: 'Диагностика не завершена, знаменатель IUPR заморожен'
        zh: '诊断未定，IUPR分母冻结'
        hu: 'A diagnosztika nincs lezárva, az IUPR nevező befagyasztva'
        pt: 'Diagnóstico não concluído, denominador IUPR congelado'

