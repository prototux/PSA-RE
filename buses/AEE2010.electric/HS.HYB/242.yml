        fr: 'Maintien du groupe motopropulseur après désactivation'
        es: 'Retención del grupo motopropulsor tras la desactivación'
        de: 'Antriebsstrang gehalten nach Deaktivierung'
        it: 'Gruppo propulsore mantenuto dopo la disattivazione'
        pl: 'Podtrzymanie układu napędowego po dezaktywacji'
        ru: 'Удержание силового агрегата после деактивации'
        zh: '动力总成停用后保持'
        hu: 'Hajtáslánc tartva kikapcsolás után'
