      es: 'Grupo de identificación OBD que transmite el VCU (qué bloque de caracteres CALID/nombre de la unidad se envía).'
      de: 'Vom VCU gesendete OBD-Identifikationsgruppe (welcher CALID-/ECU-Namensblock übertragen wird).'
      it: 'Gruppo di identificazione OBD trasmesso dal VCU (quale blocco di caratteri CALID/nome centralina viene inviato).'
      pl: 'Grupa identyfikacyjna OBD przesyłana przez VCU (który blok znaków CALID/nazwy sterownika jest wysyłany).'
