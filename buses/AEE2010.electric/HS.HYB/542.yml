id: 0x542
name: 'VCU_OBD_CALIBRATION_ID'
type: 'can'
length: 8
comment:
  en: 'OBD calibration identifier (CALID) of the VCU'
  fr: 'Identifiant de calibration OBD (CALID) du VCU'
  es: 'Identificador de calibración OBD (CALID) del VCU'
  de: 'OBD-Kalibrierkennung (CALID) des VCU'
  it: 'Identificativo di calibrazione OBD (CALID) del VCU'
  pl: 'Identyfikator kalibracji OBD (CALID) sterownika VCU'
  ru: 'Идентификатор калибровки OBD (CALID) блока VCU'
  zh: 'VCU的OBD标定标识符(CALID)'
  hu: 'A VCU OBD kalibrációs azonosítója (CALID)'
  pt: 'Identificador de calibração OBD (CALID) da VCU.'
observations:
  en: 'Sent as 6 frames (one per LID value), 100 ms apart, once the ECU is in main or degraded main wake-up and CVN computation is complete'
  fr: 'Émise sous forme de 6 trames (une par valeur de LID), espacées de 100 ms, dès que le calculateur est en réveil principal ou réveil principal dégradé et que le calcul du CVN est terminé'
  es: 'Enviada como 6 tramas (una por valor de LID), separadas 100 ms, en cuanto la ECU está en activación principal o principal degradada y el cálculo del CVN ha finalizado'
  de: 'Gesendet als 6 Frames (einer pro LID-Wert), 100 ms auseinander, sobald sich das Steuergerät im Haupt- oder eingeschränkten Hauptaufwachzustand befindet und die CVN-Berechnung abgeschlossen ist'
  it: 'Inviata come 6 frame (uno per valore di LID), distanziati di 100 ms, non appena la centralina è in risveglio principale o principale degradato e il calcolo del CVN è terminato'
  pl: 'Wysyłane jako 6 ramek (po jednej na wartość LID), w odstępie 100 ms, gdy sterownik jest w głównym lub zdegradowanym głównym trybie wybudzenia, a obliczenie CVN jest zakończone'
  ru: 'Отправляется в виде 6 кадров (по одному на значение LID) с интервалом 100 мс, как только блок управления переходит в основное или ухудшенное основное пробуждение и завершён расчёт CVN'
  zh: '以6帧形式发送(每个LID值一帧),间隔100毫秒,当该ECU处于主唤醒或降级主唤醒状态且CVN计算完成时发送'
  hu: '6 keretként küldve (LID-értékenként egy), 100 ms-os időközzel, amint a vezérlőegység fő vagy csökkentett fő ébresztési állapotban van, és a CVN számítása befejeződött'
  pt: 'Enviada como 6 tramas (uma por valor de LID), com 100 ms de intervalo, quando a unidade de controlo está em ativação principal ou principal degradada e o cálculo do CVN está concluído'
periodicity: ['trigger']
senders: ['VCU']
receivers: ['OBC']

