  hu: 'A hibrid hajtáslánc állapota a jármű vezérlőegységétől (VCU).'
  pt: 'Estado do grupo motopropulsor híbrido da unidade de controlo do veículo.'
periodicity: ['10ms']
senders: ['VCU']
receivers: ['AAS', 'CSS', 'BSI', 'LVNSD', 'MDS']

