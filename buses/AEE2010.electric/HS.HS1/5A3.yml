      pt: 'Tensão máxima de célula da bateria de alta tensão (V)'
    type: 'uint'
    factor: 0.001
    min: 0
    max: 15
    units: 'V'
    invalid: 0x3FFF

  HV_BATTERY_CELL_NUMBER_VOLT_MIN:
