id: 0x5A3
name: 'EV_BATTERY_CELL_VOLTAGES'
type: 'can'
length: 8
comment:
  en: 'High-voltage battery cell voltage extremes and insulation resistance'
  fr: 'Valeurs extrêmes de tension des cellules de la batterie haute tension et résistance d''isolement'
  es: 'Valores extremos de tensión de las celdas de la batería de alta tensión y resistencia de aislamiento'
  de: 'Extremwerte der Zellspannung der Hochvoltbatterie und Isolationswiderstand'
  it: 'Valori estremi di tensione delle celle della batteria ad alta tensione e resistenza di isolamento'
  pl: 'Wartości skrajne napięcia ogniw akumulatora wysokiego napięcia oraz rezystancja izolacji'
  ru: 'Крайние значения напряжения ячеек высоковольтной батареи и сопротивление изоляции'
  zh: '高压电池单体电压极值及绝缘电阻'
  hu: 'A nagyfeszültségű akkumulátor celláinak szélsőséges feszültségértékei és szigetelési ellenállása'
  pt: 'Extremos de tensão das células da bateria de alta tensão e resistência de isolamento.'
periodicity: ['1000ms']
senders: ['E_VCU', 'VCU']
receivers: ['MDS', 'BSI']

signals:
  HV_BATTERY_INSULATION_RESISTANCE:
    bits: '1.7-2.0'
    comment:
      en: 'HV battery insulation resistance (kOhm)'
      fr: 'Résistance d''isolement de la batterie haute tension (kOhm)'
      es: 'Resistencia de aislamiento de la batería de alta tensión (kOhm)'
      de: 'Isolationswiderstand der Hochvoltbatterie (kOhm)'
      it: 'Resistenza di isolamento della batteria ad alta tensione (kOhm)'
      pl: 'Rezystancja izolacji akumulatora wysokiego napięcia (kOhm)'
      ru: 'Сопротивление изоляции высоковольтной батареи (кОм)'
      zh: '高压电池绝缘电阻(kOhm)'
      hu: 'A nagyfeszültségű akkumulátor szigetelési ellenállása (kOhm)'
      pt: 'Resistência de isolamento da bateria de alta tensão (kOhm)'
    type: 'uint'
    factor: 1
    min: 0
    max: 60000
    units: 'kOhm'
    invalid: 0xFFFF

  HV_BATTERY_CELL_NUMBER_VOLT_MAX:
    bits: '3.7-3.0'
    comment:
      en: 'Number of the cell with the maximum voltage'
      fr: 'Numéro de la cellule ayant la tension maximale'
      es: 'Número de la celda con la tensión máxima'
      de: 'Nummer der Zelle mit der maximalen Spannung'
