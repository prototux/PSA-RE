id: 0x5C1
name: 'BML_VERSION'
type: 'can'
length: 8
comment:
  en: 'Electric drive status: EPS mode, high-voltage level and inverter/stator temperatures'
  fr: 'État de la chaîne de traction électrique : mode EPS, tension haute tension et températures onduleur/stator'
  es: 'Estado de la tracción eléctrica: modo EPS, tensión de alta tensión y temperaturas de inversor/estátor'
  de: 'Status des elektrischen Antriebs: EPS-Modus, Hochvoltspannung und Wechselrichter-/Statortemperaturen'
  it: 'Stato della trazione elettrica: modalità EPS, tensione alta tensione e temperature inverter/statore'
  pl: 'Stan napędu elektrycznego: tryb EPS, napięcie wysokiego napięcia oraz temperatury falownika i stojana'
  ru: 'Состояние электропривода: режим EPS, высоковольтное напряжение и температуры инвертора/статора'
  zh: '电驱动状态:EPS模式、高压电压及逆变器/定子温度'
  hu: 'Elektromos hajtás állapota: EPS mód, nagyfeszültségű szint és inverter/állórész hőmérséklet'
  pt: 'Estado da tração elétrica: modo EPS, nível de alta tensão e temperaturas do inversor/estator.'
periodicity: ['1000ms']
senders: ['VCU']
receivers: ['MDS', 'BSI']

signals:
  REM_INVERTER_TEMPERATURE:
    bits: '1.7-1.0'
    comment:
      en: 'Rear electric machine (eRAD) inverter temperature (°C)'
      fr: 'Température de l''onduleur de la machine électrique arrière (eRAD) (°C)'
      es: 'Temperatura del inversor de la máquina eléctrica trasera (eRAD) (°C)'
      de: 'Wechselrichtertemperatur der hinteren elektrischen Maschine (eRAD) (°C)'
      it: 'Temperatura dell''inverter della macchina elettrica posteriore (eRAD) (°C)'
      pl: 'Temperatura falownika tylnej maszyny elektrycznej (eRAD) (°C)'
      ru: 'Температура инвертора задней электрической машины (eRAD) (°C)'
      zh: '后电机(eRAD)逆变器温度(°C)'
      hu: 'A hátsó elektromos gép (eRAD) inverterének hőmérséklete (°C)'
      pt: 'Temperatura do inversor da máquina elétrica traseira (eRAD) (°C)'
    type: 'uint'
    factor: 1
    offset: -40
    min: -40
    max: 214
    units: '°C'
    invalid: 0xFF

  REM_STATOR_TEMPERATURE:
    bits: '2.7-2.0'
    comment:
      en: 'Rear electric machine (eRAD) stator temperature (°C)'
      fr: 'Température du stator de la machine électrique arrière (eRAD) (°C)'
      es: 'Temperatura del estátor de la máquina eléctrica trasera (eRAD) (°C)'
      de: 'Statortemperatur der hinteren elektrischen Maschine (eRAD) (°C)'
      it: 'Temperatura dello statore della macchina elettrica posteriore (eRAD) (°C)'
      pl: 'Temperatura stojana tylnej maszyny elektrycznej (eRAD) (°C)'
      ru: 'Температура статора задней электрической машины (eRAD) (°C)'
      zh: '后电机(eRAD)定子温度(°C)'
      hu: 'A hátsó elektromos gép (eRAD) állórészének hőmérséklete (°C)'
      pt: 'Temperatura do estator da máquina elétrica traseira (eRAD) (°C)'
    type: 'uint'
    factor: 1
    offset: -40
    min: -40
    max: 214
    units: '°C'
    invalid: 0xFF

  PEM_INVERTER_TEMPERATURE:
    bits: '6.7-6.0'
    comment:
      en: 'Front electric machine (PEM) inverter temperature (°C)'
      fr: 'Température de l''onduleur de la machine électrique avant (PEM) (°C)'
      es: 'Temperatura del inversor de la máquina eléctrica delantera (PEM) (°C)'
      de: 'Wechselrichtertemperatur der vorderen elektrischen Maschine (PEM) (°C)'
      it: 'Temperatura dell''inverter della macchina elettrica anteriore (PEM) (°C)'
      pl: 'Temperatura falownika przedniej maszyny elektrycznej (PEM) (°C)'
      ru: 'Температура инвертора передней электрической машины (PEM) (°C)'
      zh: '前电机(PEM)逆变器温度(°C)'
      hu: 'Az első elektromos gép (PEM) inverterének hőmérséklete (°C)'
      pt: 'Temperatura do inversor da máquina elétrica dianteira (PEM) (°C)'
    type: 'uint'
    factor: 1
    offset: -40
    min: -40
    max: 214
    units: '°C'
    invalid: 0xFF

  PEM_STATOR_TEMPERATURE:
    bits: '7.7-7.0'
    comment:
      en: 'Front electric machine (PEM) stator temperature (°C)'
      fr: 'Température du stator de la machine électrique avant (PEM) (°C)'
      es: 'Temperatura del estátor de la máquina eléctrica delantera (PEM) (°C)'
      de: 'Statortemperatur der vorderen elektrischen Maschine (PEM) (°C)'
      it: 'Temperatura dello statore della macchina elettrica anteriore (PEM) (°C)'
      pl: 'Temperatura stojana przedniej maszyny elektrycznej (PEM) (°C)'
      ru: 'Температура статора передней электрической машины (PEM) (°C)'
      zh: '前电机(PEM)定子温度(°C)'
      hu: 'Az első elektromos gép (PEM) állórészének hőmérséklete (°C)'
      pt: 'Temperatura do estator da máquina elétrica dianteira (PEM) (°C)'
    type: 'uint'
    factor: 1
    offset: -40
    min: -40
    max: 214
    units: '°C'
    invalid: 0xFF

  PEM_HV_VOLTAGE:
    bits: '8.7-8.3'
    comment:
      en: 'Front electric machine (PEM) high-voltage supply voltage (V)'
      fr: 'Tension d''alimentation haute tension de la machine électrique avant (PEM) (V)'
      es: 'Tensión de alimentación de alta tensión de la máquina eléctrica delantera (PEM) (V)'
      de: 'Hochvolt-Versorgungsspannung der vorderen elektrischen Maschine (PEM) (V)'
      it: 'Tensione di alimentazione ad alta tensione della macchina elettrica anteriore (PEM) (V)'
      pl: 'Napięcie zasilania wysokiego napięcia przedniej maszyny elektrycznej (PEM) (V)'
      ru: 'Высоковольтное напряжение питания передней электрической машины (PEM) (В)'
      zh: '前电机(PEM)高压供电电压(V)'
      hu: 'Az első elektromos gép (PEM) nagyfeszültségű tápfeszültsége (V)'
      pt: 'Tensão de alimentação de alta tensão da máquina elétrica dianteira (PEM) (V)'
    type: 'uint'
    factor: 20
    min: 0
    max: 500
    units: 'V'
    invalid: 0x1F

  EPS_MODE_REQUEST:
    bits: '8.2-8.0'
    comment:
      en: 'Electric powertrain system (EPS) mode request (off, drive active, discharge, PI charge, PI balance)'
      fr: 'Demande de mode du système de propulsion électrique (EPS) (arrêt, conduite active, décharge, charge PI, équilibrage PI)'
      es: 'Solicitud de modo del sistema de propulsión eléctrica (EPS) (apagado, conducción activa, descarga, carga PI, equilibrado PI)'
      de: 'Modusanforderung des elektrischen Antriebssystems (EPS) (Aus, Fahrbetrieb aktiv, Entladung, PI-Ladung, PI-Balance)'
      it: 'Richiesta di modalità del sistema di propulsione elettrica (EPS) (off, guida attiva, scarica, carica PI, bilanciamento PI)'
      pl: 'Żądanie trybu elektrycznego układu napędowego (EPS) (wyłączony, jazda aktywna, rozładowanie, ładowanie PI, balansowanie PI)'
      ru: 'Запрос режима электрической силовой установки (EPS) (выкл, движение активно, разряд, зарядка PI, балансировка PI)'
      zh: '电力驱动系统(EPS)模式请求(关闭、驱动激活、放电、PI充电、PI均衡)'
      hu: 'Az elektromos hajtásrendszer (EPS) üzemmódkérése (kikapcsolva, aktív vezetés, kisütés, PI töltés, PI kiegyenlítés)'
      pt: 'Pedido de modo do sistema de propulsão elétrica (EPS) (desligado, condução ativa, descarga, carga PI, equilíbrio PI)'
    type: 'enum'
    values:
      0x00:
