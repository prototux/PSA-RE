        fr: 'Charge PI'
        es: 'Carga PI'
        de: 'PI-Ladung'
        it: 'Carica PI'
        pl: 'Ładunek PI'
        ru: 'Заряд PI'
        zh: 'PI充电'
        hu: 'PI töltés'
