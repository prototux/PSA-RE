id: 0x563
name: 'EV_DRIVE_STATUS'
type: 'can'
length: 7
comment:
  en: 'Remaining battery capacity, inverter temperature alerts and brake-assist warning lamp request'
  fr: 'Capacité restante de la batterie, alertes de température onduleur et demande de voyant d''assistance au freinage'
  es: 'Capacidad restante de la batería, alertas de temperatura del inversor y solicitud del testigo de asistencia al frenado'
  de: 'Verbleibende Batteriekapazität, Wechselrichter-Temperaturwarnungen und Anforderung der Bremsassistenz-Warnleuchte'
  it: 'Capacità residua della batteria, allarmi di temperatura dell''inverter e richiesta della spia di assistenza alla frenata'
  pl: 'Pozostała pojemność akumulatora, alarmy temperatury falownika i żądanie zapalenia lampki wspomagania hamowania'
  ru: 'Оставшаяся ёмкость батареи, предупреждения о температуре инвертора и запрос лампы помощи при торможении'
  zh: '剩余电池容量、逆变器温度告警及制动辅助警示灯请求'
  hu: 'Az akkumulátor fennmaradó kapacitása, inverter hőmérséklet-riasztások és a fékrásegítés jelzőlámpa-kérése'
  pt: 'Capacidade restante da bateria, alertas de temperatura do inversor e pedido do indicador luminoso de assistência à travagem.'
periodicity: ['1000ms']
senders: ['VCU', 'E_VCU']
receivers: ['MDS', 'BSI', 'RBG']

