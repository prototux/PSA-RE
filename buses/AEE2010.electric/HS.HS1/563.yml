      de: 'Validierte Position des Wählhebels (Parken, Rückwärts, Neutral, Automatik, Manuell)'
      it: 'Posizione convalidata della leva del cambio (Parcheggio, Retromarcia, Folle, Automatico, Manuale)'
      pl: 'Zatwierdzona pozycja dźwigni zmiany biegów (Parkowanie, Wsteczny, Neutralny, Automatyczny, Ręczny)'
      ru: 'Подтверждённое положение рычага переключения передач (Парковка, Задний ход, Нейтраль, Автоматический, Ручной)'
