      pl: 'Indeks aktualnie przesyłanej grupy sygnałów czujników temperatury akumulatora'
      ru: 'Индекс текущей передаваемой группы сигналов датчиков температуры батареи'
      zh: '当前传输的电池温度探头信号组索引'
