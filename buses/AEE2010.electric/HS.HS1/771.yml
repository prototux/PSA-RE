id: 0x771
name: 'FAULT_LOG_BHI_RAW'
type: 'can'
length: 8
comment:
  en: 'Fault event of the fuel-cell DC/DC converter, logged with mileage and timestamp by the electric vehicle control unit (E-VCU).'
  fr: 'Événement défaut du convertisseur DC/DC de la pile à combustible, enregistré avec kilométrage et horodatage par le calculateur de véhicule électrique (E-VCU).'
  es: 'Evento de fallo del convertidor DC/DC de la pila de combustible, registrado con kilometraje y marca de tiempo por la unidad de control del vehículo eléctrico (E-VCU).'
  de: 'Fehlerereignis des DC/DC-Wandlers der Brennstoffzelle, mit Kilometerstand und Zeitstempel vom E-Fahrzeugsteuergerät (E-VCU) vermerkt.'
  it: 'Evento di guasto del convertitore DC/DC della cella a combustibile, registrato con chilometraggio e timestamp dalla centralina del veicolo elettrico (E-VCU).'
  pl: 'Zdarzenie usterki przetwornicy DC/DC ogniwa paliwowego, zapisywane wraz z przebiegiem i znacznikiem czasu przez sterownik pojazdu elektrycznego (E-VCU).'
  ru: 'Событие неисправности DC/DC преобразователя топливных элементов, регистрируется с пробегом и меткой времени блоком управления электромобилем (E-VCU).'
  zh: '燃料电池DC/DC变换器的故障事件,由电动车控制单元(E-VCU)连同里程和时间戳一并记录。'
  hu: 'Az üzemanyagcella DC/DC-átalakítójának hibaeseménye, amelyet az E-VCU kilométerállással és időbélyeggel rögzít.'
  pt: 'Evento de avaria do conversor DC/DC da célula de combustível, registado com quilometragem e data/hora pela unidade de controlo do veículo elétrico (E-VCU).'
periodicity: ['trigger']
senders: ['E_VCU']
receivers: ['BSI']

