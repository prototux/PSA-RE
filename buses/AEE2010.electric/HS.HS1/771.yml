      hu: 'A jármű által megtett abszolút táv (megegyezik a vezetőnek kijelzett értékkel)'
      pt: 'Distância absoluta percorrida pelo veículo (corresponde ao valor apresentado ao condutor)'
    type: 'uint'
    factor: 1
    min: 0
    max: 16777214
    units: 'km'
    invalid: 0xFFFFFF

