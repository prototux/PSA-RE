      pt: 'Estado da linha de interlock da bateria de tração de alta tensão'
    type: 'enum'
    values:
      0x00:
        en: 'No error (interlock line closed)'
        fr: 'Pas d''erreur (ligne d''interlock fermée)'
        es: 'Sin error (línea de enclavamiento cerrada)'
        de: 'Kein Fehler (Interlock-Leitung geschlossen)'
        it: 'Nessun errore (linea di interblocco chiusa)'
        pl: 'Brak błędu (linia blokady zamknięta)'
        ru: 'Ошибки нет (линия блокировки замкнута)'
        zh: '无错误(联锁线路闭合)'
        hu: 'Nincs hiba (interlock vonal zárva)'
        pt: 'Sem erro (linha de intertravamento fechada)'
      0x01:
        en: 'Error detected (interlock line open)'
        fr: 'Erreur détectée (ligne de verrouillage ouverte)'
        es: 'Error detectado (línea de enclavamiento abierta)'
        de: 'Fehler erkannt (Verriegelungsleitung unterbrochen)'
        it: 'Errore rilevato (linea di interblocco aperta)'
        pl: 'Wykryto błąd (linia blokady otwarta)'
        ru: 'Обнаружена ошибка (линия блокировки разомкнута)'
        zh: '检测到错误(联锁线路断开)'
        hu: 'Hiba észlelve (a reteszelő vonal nyitott)'
        pt: 'Erro detetado (linha de interbloqueio aberta)'
      0x02:
        en: 'Invalid (interlock line undefined)'
        fr: 'Non valide (ligne de verrouillage indéfinie)'
        es: 'No válido (línea de enclavamiento indefinida)'
        de: 'Ungültig (Verriegelungsleitung undefiniert)'
        it: 'Non valido (linea di interblocco indefinita)'
        pl: 'Nieważne (linia blokady niezdefiniowana)'
        ru: 'Недействительно (линия блокировки не определена)'
        zh: '无效(互锁线路未定义)'
        hu: 'Érvénytelen (reteszelő vonal nincs meghatározva)'
        pt: 'Inválido (linha de intertravamento indefinida)'
      0x03:
        unused: true

