id: 0x5C3
name: 'EV_DRIVE_STATUS_2'
type: 'can'
length: 8
comment:
  en: 'High-voltage battery status: voltage, state of charge, insulation and interlock faults'
  fr: 'État de la batterie haute tension : tension, état de charge, défauts d''isolement et d''interverrouillage'
  es: 'Estado de la batería de alta tensión: tensión, estado de carga, fallos de aislamiento e interbloqueo'
  de: 'Hochvoltbatteriestatus: Spannung, Ladezustand, Isolations- und Interlock-Fehler'
  it: 'Stato della batteria ad alta tensione: tensione, stato di carica, guasti di isolamento e interlock'
  pl: 'Stan akumulatora wysokiego napięcia: napięcie, stan naładowania, usterki izolacji i blokady bezpieczeństwa'
  ru: 'Состояние высоковольтной батареи: напряжение, уровень заряда, неисправности изоляции и блокировки'
  zh: '高压电池状态:电压、荷电状态、绝缘及互锁故障'
  hu: 'Nagyfeszültségű akkumulátor állapota: feszültség, töltöttségi szint, szigetelési és reteszelési hibák'
  pt: 'Estado da bateria de alta tensão: tensão, estado de carga, avarias de isolamento e de interlock.'
periodicity: ['1000ms']
senders: ['VCU']
receivers: ['MDS', 'BSI']

signals:
  HV_BATTERY_ACTUAL_VOLTAGE:
    bits: '1.7-2.5'
    comment:
      en: 'HV battery actual voltage (V)'
      fr: 'Tension réelle de la batterie haute tension (V)'
      es: 'Tensión real de la batería de alta tensión (V)'
      de: 'Tatsächliche Spannung der Hochvoltbatterie (V)'
      it: 'Tensione reale della batteria ad alta tensione (V)'
      pl: 'Rzeczywiste napięcie akumulatora wysokiego napięcia (V)'
      ru: 'Фактическое напряжение высоковольтной батареи (В)'
      zh: '高压电池实际电压(V)'
      hu: 'A nagyfeszültségű akkumulátor tényleges feszültsége (V)'
      pt: 'Tensão real da bateria de alta tensão (V)'
    type: 'uint'
    factor: 0.25
    min: 0
    max: 500
    units: 'V'
    invalid: 0x7FF

  HV_BATTERY_SOC_2:
    bits: '3.1-4.0'
    comment:
      en: 'HV battery state of charge (%)'
      fr: 'État de charge (SOC) de la batterie haute tension (%)'
      es: 'Estado de carga (SOC) de la batería de alta tensión (%)'
      de: 'Ladezustand (SOC) der Hochvoltbatterie (%)'
      it: 'Stato di carica (SOC) della batteria ad alta tensione (%)'
      pl: 'Stan naładowania (SOC) akumulatora wysokiego napięcia (%)'
      ru: 'Уровень заряда (SOC) высоковольтной батареи (%)'
      zh: '高压电池荷电状态(SOC)(%)'
      hu: 'A nagyfeszültségű akkumulátor töltöttségi állapota (SOC) (%)'
      pt: 'Estado de carga da bateria de alta tensão (%)'
    type: 'uint'
    factor: 0.1
    min: 0
    max: 100
    units: '%'
    invalid: 0x3FF

  REM_OVERTEMPERATURE_FAULT:
    bits: '8.7'
    comment:
      en: 'Rear electric machine (eRAD) overheating fault'
      fr: 'Défaut de surchauffe de la machine électrique arrière (eRAD)'
      es: 'Fallo de sobrecalentamiento de la máquina eléctrica trasera (eRAD)'
      de: 'Überhitzungsfehler der hinteren elektrischen Maschine (eRAD)'
      it: 'Guasto di surriscaldamento della macchina elettrica posteriore (eRAD)'
      pl: 'Usterka przegrzania tylnej maszyny elektrycznej (eRAD)'
      ru: 'Неисправность перегрева задней электрической машины (eRAD)'
      zh: '后电机(eRAD)过热故障'
      hu: 'A hátsó elektromos gép (eRAD) túlmelegedési hibája'
      pt: 'Falha de sobreaquecimento da máquina elétrica traseira (eRAD)'
    type: 'bool'
    values:
      0x00:
        en: 'No failure'
        fr: 'Aucune défaillance'
        es: 'Sin fallo'
        de: 'Kein Ausfall'
        it: 'Nessun guasto'
        pl: 'Brak awarii'
        ru: 'Нет отказа'
        zh: '无故障'
        hu: 'Nincs meghibásodás'
        pt: 'Sem falha'
      0x01:
        en: 'Overheating'
        fr: 'Surchauffe'
        es: 'Sobrecalentamiento'
        de: 'Überhitzung'
        it: 'Surriscaldamento'
        pl: 'Przegrzanie'
        ru: 'Перегрев'
        zh: '过热'
        hu: 'Túlmelegedés'
        pt: 'Sobreaquecimento'

  HV_BATTERY_INTERLOCK_LINE_STATUS:
    bits: '8.6-8.5'
    comment:
      en: 'HV traction battery interlock line status'
      fr: 'État de la ligne d''interverrouillage de la batterie de traction haute tension'
      es: 'Estado de la línea de enclavamiento de la batería de tracción de alta tensión'
      de: 'Status der Verriegelungsleitung der Hochvolt-Traktionsbatterie'
