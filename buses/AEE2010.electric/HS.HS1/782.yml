id: 0x782
name: 'SCDT_SUPERVISION'
type: 'can'
length: 8
comment:
  en: 'Extended network supervision (v2): electrical state, wake-up state and fault presence of the sending ECU'
  fr: 'Supervision réseau étendue (v2) : état électrique, état de réveil et présence de défaut du calculateur émetteur'
  es: 'Supervisión de red extendida (v2): estado eléctrico, estado de activación y presencia de fallos de la centralita emisora'
  de: 'Erweiterte Netzwerküberwachung (v2): elektrischer Zustand, Weckzustand und Fehlerstatus des sendenden Steuergeräts'
  it: 'Supervisione rete estesa (v2): stato elettrico, stato di risveglio e presenza di guasti della centralina mittente'
  pl: 'Rozszerzony nadzór sieci (v2): stan elektryczny, stan wybudzenia i obecność usterki sterownika nadawcy'
  ru: 'Расширенная супервизия сети (v2): электрическое состояние, состояние пробуждения и наличие неисправности передающего блока'
  zh: '扩展网络监控(v2):电气状态、唤醒状态及发送方ECU的故障状态'
  hu: 'Kibővített hálózatfelügyelet (v2): elektromos állapot, ébresztési állapot és az adó vezérlőegység hibaállapota'
  pt: 'Supervisão de rede alargada (v2): estado elétrico, estado de despertar e presença de avaria da ECU emissora.'
observations:
  en: 'Sent on each change of the ECU''s electronic life-cycle phase'
  fr: 'Émise à chaque changement de phase de vie électronique du calculateur'
  es: 'Enviada en cada cambio de fase de vida electrónica de la ECU'
  de: 'Gesendet bei jeder Änderung der elektronischen Lebensphase des Steuergeräts'
  it: 'Inviata a ogni cambio di fase di vita elettronica della centralina'
  pl: 'Wysyłana przy każdej zmianie elektronicznej fazy życia sterownika'
  ru: 'Отправляется при каждой смене электронной фазы жизни блока управления'
  zh: '该ECU电子生命周期阶段每次变化时发送'
  hu: 'A vezérlőegység elektronikus életciklus-fázisának minden változásakor küldve'
  pt: 'Enviada em cada mudança da fase do ciclo de vida eletrónico da unidade de controlo'
periodicity: ['1000ms', 'trigger']
senders: ['VCU']

signals:
  DIAGNOSTIC_MEMORY_STATE_2:
    bits: '1.7'
    comment:
      en: 'State of the system''s diagnostic memory (fault code(s) present or not).'
      fr: 'État de la mémoire diagnostic du système (présence ou non de code(s) défaut).'
      es: 'Estado de la memoria de diagnóstico del sistema (presencia o no de código(s) de fallo).'
      de: 'Status des Diagnosespeichers des Systems (Fehlercode(s) vorhanden oder nicht).'
      it: 'Stato della memoria diagnostica del sistema (presenza o meno di codici guasto).'
      pl: 'Stan pamięci diagnostycznej systemu (obecność kodów usterek lub ich brak).'
      ru: 'Состояние диагностической памяти системы (наличие или отсутствие кодов неисправностей).'
      zh: '系统诊断存储器状态（是否存在故障码）。'
      hu: 'A rendszer diagnosztikai memóriájának állapota (hibakód(ok) jelenléte vagy hiánya).'
      pt: 'Estado da memória de diagnóstico do sistema (presença ou não de código(s) de falha).'
    type: 'bool'
    default: 0x00
    values:
      0x00:
        en: 'No fault present'
        fr: 'Aucun défaut présent'
        es: 'Ningún fallo presente'
        de: 'Kein Fehler vorhanden'
        it: 'Nessun guasto presente'
        pl: 'Brak aktualnej usterki'
        ru: 'Неисправностей нет'
        zh: '无当前故障'
        hu: 'Nincs jelen lévő hiba'
        pt: 'Sem avaria presente'
      0x01:
        en: 'One or more faults present'
        fr: 'Un ou plusieurs défauts présents'
        es: 'Uno o varios fallos presentes'
        de: 'Ein oder mehrere Fehler vorhanden'
        it: 'Uno o più guasti presenti'
        pl: 'Obecna jedna lub więcej usterek'
        ru: 'Присутствует одна или несколько неисправностей'
        zh: '存在一个或多个故障'
        hu: 'Egy vagy több hiba jelen van'
        pt: 'Uma ou mais falhas presentes'

