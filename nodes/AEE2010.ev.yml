    pl: 'Inteligentny moduł sterujący nadwozia / główna brama sieciowa'
    ru: 'Интеллектуальный блок управления кузовом / главный шлюз'
    zh: '智能车身控制模块/主网关'
    hu: 'Intelligens karosszéria-vezérlőegység / fő átjáró'
    pt: 'Módulo de controlo de carroçaria / gateway principal'
  comment:
    en: 'Central body computer (BSI), also the gateway between all the networks.'
    fr: 'Calculateur central de servitude (BSI), également passerelle entre tous les réseaux.'
    es: 'Calculador central de la carrocería (BSI), también pasarela entre todas las redes.'
    de: 'Zentrales Karosseriesteuergerät (BSI), zugleich Gateway zwischen allen Netzwerken.'
    it: 'Centralina centrale di carrozzeria (BSI), anche gateway tra tutte le reti.'
    pl: 'Centralny sterownik nadwozia (BSI), pełniący również funkcję bramki między wszystkimi sieciami.'
    ru: 'Центральный блок управления кузовом (BSI), также выполняющий функцию шлюза между всеми сетями.'
    zh: '车身中央控制器(BSI),同时作为所有网络之间的网关。'
    hu: 'Központi karosszéria-vezérlőegység (BSI), egyben átjáró az összes hálózat között.'
    pt: 'Unidade central de carroçaria (BSI), também a gateway entre todas as redes.'
  diag:
    request_id: 0x752
    response_id: 0x652

