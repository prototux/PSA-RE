  id:
    HS: 0x12
    LS: 0x12
  alt: ['VSM', 'BCM', 'BCCM', 'BVCU']
  name:
    en: 'Body control module / main gateway'
    fr: 'Boîtier de servitude intelligent'
    es: 'Módulo de carrocería inteligente / pasarela principal'
    de: 'Intelligentes Karosseriesteuergerät / Hauptgateway'
